<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>italkyAI açılıyor...</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#02000f;
      color:#fff;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .box{
      width:min(92vw,520px);
      padding:24px;
      border-radius:20px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.15);
      line-height:1.5;
    }
    .sub{
      margin-top:10px;
      font-size:14px;
      opacity:.82;
    }
  </style>
</head>
<body>
  <div class="box">
    <div>italkyAI açılıyor...</div>
    <div class="sub">Uygulama yüklüyse açılır, değilse Play Store’a yönlendirilirsin.</div>
  </div>

  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      const host = (p.get("host") || "").trim();
      const v = (p.get("v") || "1").trim();

      const playUrl = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";

      if (!host) {
        location.replace(playUrl);
        return;
      }

      const intentUrl =
        "intent://join" +
        "?host=" + encodeURIComponent(host) +
        "&v=" + encodeURIComponent(v) +
        "#Intent;" +
        "scheme=italky;" +
        "package=com.ozyigits.italkyai;" +
        "S.browser_fallback_url=" + encodeURIComponent(playUrl) + ";" +
        "end";

      location.replace(intentUrl);
    })();
  </script>
</body>
</html>
