<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>italkyAI açılıyor...</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#02000f;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}
.box{
width:min(92vw,520px);
padding:24px;
border-radius:20px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
}
</style>

</head>
<body>

<div class="box">
italkyAI açılıyor...
</div>

<script>

const params = new URLSearchParams(location.search)

const host = params.get("host") || ""
const v = params.get("v") || "1"

const appUrl = "italky://join?host="+host+"&v="+v
const storeUrl = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai"

let hidden = false

document.addEventListener("visibilitychange",()=>{
if(document.hidden){
hidden = true
}
})

location.href = appUrl

setTimeout(()=>{
if(!hidden){
location.replace(storeUrl)
}
},1500)

</script>

</body>
</html>
