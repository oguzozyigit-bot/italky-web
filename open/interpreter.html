<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>italkyAI açılıyor...</title>

<script>

const params = new URLSearchParams(location.search)
const host = params.get("host") || ""

const APP_URL = "italky://join?host=" + host
const PLAY = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai"

function openApp(){

  location.href = APP_URL

  setTimeout(()=>{
    location.href = PLAY
  },2000)

}

</script>

<style>
body{
background:#02000f;
color:white;
font-family:Outfit, sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center
}

.box{
background:rgba(255,255,255,.05);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.15)
}

button{
margin-top:15px;
padding:12px 20px;
border-radius:10px;
border:none;
font-weight:700;
cursor:pointer
}
</style>
</head>

<body onload="openApp()">

<div class="box">

<h2>italkyAI açılıyor...</h2>

<p>
Uygulama yüklüyse açılır.<br>
Yüklü değilse Google Play'e yönlendirilirsin.
</p>

<button onclick="location.href='https://play.google.com/store/apps/details?id=com.ozyigits.italkyai'">
Google Play'de Aç
</button>

</div>

</body>
</html>
