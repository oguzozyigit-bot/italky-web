<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>italkyAI • NFC Açılıyor</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#07111f;
      color:#fff;
      font-family:Arial,sans-serif;
      padding:24px;
      text-align:center;
    }
    .box{
      width:min(460px,100%);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:28px;
    }
    h1{margin:0 0 10px;font-size:28px}
    p{margin:0 0 18px;opacity:.82;line-height:1.6}
    .muted{font-size:13px;opacity:.65}
    .btn{
      display:inline-block;
      padding:14px 20px;
      border-radius:14px;
      background:#8aa0b8;
      color:#08111d;
      text-decoration:none;
      font-weight:800;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>italkyAI açılıyor</h1>
    <p id="info">Kart bilgisi kontrol ediliyor...</p>
    <a id="storeBtn" class="btn" href="#">Uygulamayı Yükle / Aç</a>
    <div class="muted" id="debugLine"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const uid = String(params.get("uid") || "").trim().toUpperCase();
    const source = "nfc_qr";

    const info = document.getElementById("info");
    const debugLine = document.getElementById("debugLine");
    const storeBtn = document.getElementById("storeBtn");

    const packageId = "com.ozyigits.italkyai";

    const playWeb =
      `https://play.google.com/store/apps/details?id=${encodeURIComponent(packageId)}&referrer=${encodeURIComponent(`uid=${uid}&source=${source}`)}`;

    const playMarket =
      `market://details?id=${encodeURIComponent(packageId)}&referrer=${encodeURIComponent(`uid=${uid}&source=${source}`)}`;

    storeBtn.href = playWeb;

    debugLine.textContent = uid ? `UID: ${uid}` : "UID bulunamadı";

    if (!uid) {
      info.textContent = "Kart UID bilgisi eksik.";
    } else {
      info.textContent = "Uygulama yüklüyse açılacak, değilse mağazaya yönlendirileceksin.";
    }

    // Android App Link veya deep link denemesi
    const deepLink = `italky://nfc?uid=${encodeURIComponent(uid)}`;

    // Önce deep link dene
    setTimeout(() => {
      location.href = deepLink;
    }, 300);

    // Uygulama açılmazsa Play'e düş
    setTimeout(() => {
      location.href = playMarket;
    }, 1600);

    // Market intent çalışmazsa web Play fallback
    setTimeout(() => {
      location.href = playWeb;
    }, 2600);
  </script>
</body>
</html>
