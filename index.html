<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">

  <script>
    (function(){
      try{
        const isApp = location.href.includes("appassets.androidplatform.net");

        if(isApp){
          location.replace("/assets/pages/login.html");
        }else{
          location.replace("/pages/login.html");
        }
      }catch(e){
        location.replace("/pages/login.html");
      }
    })();
  </script>

</head>
<body></body>
</html>
