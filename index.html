<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>italkyAI İndir | App Store ve Google Play</title>
  <meta name="description" content="italkyAI uygulamasını App Store veya Google Play üzerinden indirin. Gerçek zamanlı çeviri ve dil teknolojileri cebinizde.">
  <meta name="theme-color" content="#05070d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(10, 16, 28, .72);
      --line: rgba(255, 255, 255, .12);
      --text: #f8fafc;
      --muted: #a9b4c7;
      --cyan: #67e8f9;
      --orange: #fb923c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobil uyumluluğu zorlayan temel ayarlar */
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        linear-gradient(115deg, rgba(103, 232, 249, .12) 0%, transparent 30%),
        linear-gradient(180deg, #111a2e 0%, #090d18 46%, #05070d 100%);
    }

    a { text-decoration: none; }
    button, input { font: inherit; }

    .screen {
      width: 100%;
      max-width: 430px; /* Mobilde tam ekran, PC'de telefon boyutunda durur */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .topbar { margin-bottom: 10px; }

    .brand-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
    }

    .brand-title span {
      background: linear-gradient(135deg, var(--cyan), #f472b6);
      -webkit-background-clip: text;
      color: transparent;
    }

    .page {
      flex: 1; /* Sayfayı doldurur, alttaki boşluğu ezer */
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .hero { text-align: center; }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .text-gradient { color: var(--cyan); }

    .features-list {
      display: grid;
      gap: 10px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      text-align: left;
      margin-bottom: 15px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .feature-icon { color: var(--cyan); font-weight: 900; }

    /* Kod Girişi Butonu - Belirgin ve Turuncu */
    .promo-large-btn {
      width: 100%;
      min-height: 65px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(249, 115, 22, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Market Butonları - Tam 150x150 Piksel */
    .custom-store-buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px; /* Butonlar arası boşluk */
      margin-top: 15px;
    }

    .custom-store-btn {
      width: 150px !important;
      height: 150px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.2);
      background: #0f172a;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .store-icon {
      width: 45px;
      height: 45px;
    }

    .store-icon svg { width: 100%; height: 100%; }

    .store-kicker { font-size: 12px; color: #a9b4c7; font-weight: 700; }
    .store-name { font-family: "Space Grotesk", sans-serif; font-size: 18px; font-weight: 900; }

    footer {
      text-align: center;
      padding: 15px 0;
      margin-top: auto; /* En alta yapıştırır */
    }

    /* Göktürkçe Oğuz Yazısı - Belirgin */
    .gokturk-signature {
      display: block;
      margin-top: 5px;
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(103, 232, 249, .6);
    }

    /* Modal (Pop-up) Tasarımı */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(10px);
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #0f172a;
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .modal-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
    }

    .input-group { margin-bottom: 15px; }
    
    .input-group label {
      display: block;
      color: var(--cyan);
      font-weight: 900;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .modal-input {
      width: 100%;
      height: 55px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.05);
      color: #fff;
      padding: 0 15px;
      font-size: 16px !important; /* iOS zoom hatasını engeller */
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btn {
      height: 55px;
      border-radius: 12px;
      border: none;
      background: var(--orange);
      color: #fff;
      font-weight: 900;
      font-size: 18px;
    }

    .modal-close-btn {
      height: 55px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand-title">italky<span>AI</span></div>
    </header>

    <main class="page">
      <section class="hero">
        <h1>Sınırları Kaldır,<br><span class="text-gradient">Özgürlüğü Keşfet.</span></h1>
        
        <div class="features-list">
          <div class="feature-item"><span class="feature-icon">✓</span><span>Yapay zeka destekli anlık ve canlı yüz yüze çeviri</span></div>
          <div class="feature-item"><span class="feature-icon">✓</span><span>İnternet olmadan çalışan çevrimdışı dil paketleri</span></div>
          <div class="feature-item"><span class="feature-icon">✓</span><span>icanyAI entegrasyonu ile gelişmiş yapay zeka radyo</span></div>
        </div>

        <button class="promo-large-btn" id="openCampaignModal">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v5a3 3 0 0 1 0 6v1a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1a3 3 0 0 1 0-6z"></path>
            <path d="M12 5v14"></path>
            <path d="M8 9h8"></path>
          </svg>
          KOD GİRİŞİ
        </button>

        <div class="custom-store-buttons">
          <a href="#" class="custom-store-btn">
            <span class="store-icon">
              <svg viewBox="0 0 64 64"><path fill="#fff" d="M43.88 33.84c-.06-6.28 5.14-9.33 5.38-9.47-2.94-4.3-7.5-4.9-9.1-4.96-3.86-.4-7.58 2.3-9.52 2.3-1.98 0-4.98-2.25-8.2-2.18-4.2.06-8.12 2.45-10.28 6.2-4.44 7.7-1.13 19.02 3.13 25.25 2.13 3.04 4.62 6.43 7.9 6.3 3.2-.13 4.4-2.02 8.27-2.02 3.83 0 4.96 2.02 8.32 1.94 3.45-.05 5.62-3.05 7.67-6.12 2.46-3.48 3.44-6.9 3.48-7.08-.08-.03-6.98-2.68-7.05-10.16Zm-6.25-18.53c1.72-2.15 2.9-5.06 2.57-8.01-2.49.11-5.6 1.72-7.4 3.82-1.6 1.84-3.04 4.86-2.66 7.7 2.8.21 5.69-1.42 7.49-3.51Z"></path></svg>
            </span>
            <span class="store-kicker">İndir</span>
            <span class="store-name">App Store</span>
          </a>

          <a href="#" class="custom-store-btn">
            <span class="store-icon">
              <svg viewBox="0 0 64 64">
                <path fill="#34a853" d="M12.5 7.6c-1.4.78-2.2 2.24-2.2 4.16v40.48c0 1.92.8 3.38 2.2 4.16l.13.07 22.68-24.18v-.58L12.63 7.53l-.13.07Z"></path>
                <path fill="#4285f4" d="m42.78 40.36-7.47-8.07v-.58l7.48-8.07.17.1 8.84 5.04c2.53 1.45 2.53 3.84 0 5.3l-8.84 5.03-.18.25Z"></path>
                <path fill="#fbbc04" d="m42.96 40.11-7.65-8.1L12.5 56.4c1.36.75 3.14.63 5.04-.45l25.42-15.84Z"></path>
                <path fill="#ea4335" d="M42.96 23.89 17.54 8.05c-1.9-1.08-3.68-1.2-5.04-.45l22.81 24.4 7.65-8.11Z"></path>
              </svg>
            </span>
            <span class="store-kicker">İndir</span>
            <span class="store-name">Google Play</span>
          </a>
        </div>
      </section>

      <footer>
        <div style="color: #a9b4c7; font-size: 14px; font-weight: 700;">italkyAI By Ozyigit's 2026</div>
        <span class="gokturk-signature" lang="otk">𐰆𐰍𐰔</span>
      </footer>
    </main>
  </div>

  <div class="modal-overlay" id="campaignModal">
    <div class="modal-box">
      <h2 class="modal-title">Kampanya Kodunu Doğrula</h2>
      <form id="campaignForm">
        <div class="input-group">
          <label>E-POSTA</label>
          <input class="modal-input" type="email" placeholder="ornek@mail.com" required>
        </div>
        <div class="input-group">
          <label>BENZERSİZ KOD</label>
          <input class="modal-input" type="text" placeholder="KOD GİRİNİZ" required>
        </div>
        <div class="modal-actions">
          <button class="modal-btn" type="button">KODU DOĞRULA</button>
          <button class="modal-close-btn" id="closeCampaignModal" type="button">VAZGEÇ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("openCampaignModal").addEventListener("click", () => {
      document.getElementById("campaignModal").classList.add("active");
    });
    document.getElementById("closeCampaignModal").addEventListener("click", () => {
      document.getElementById("campaignModal").classList.remove("active");
    });
  </script>
</body>
</html>
