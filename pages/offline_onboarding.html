<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>italkyAI • Offline Kurulum</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Outfit;
  background:#02000f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.wrap{
  width:100%;
  max-width:420px;
  padding:20px;
  text-align:center;
}

h1{
  font-size:22px;
  margin-bottom:10px;
}

p{
  font-size:13px;
  opacity:.7;
}

select{
  width:100%;
  height:50px;
  margin-top:20px;
  border-radius:14px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
  padding:0 12px;
}

.btn{
  margin-top:20px;
  height:50px;
  width:100%;
  border:none;
  border-radius:14px;
  font-weight:900;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:#fff;
}

.loader{
  margin-top:30px;
  display:none;
}

.done{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

  <div id="step1">
    <h1>Dilini seç</h1>
    <p>Offline çeviri için ilk kurulum yapılacak</p>

    <select id="langSelect"></select>

    <button class="btn" id="btnStart">Başla</button>
  </div>

  <div id="step2" class="loader">
    <h1>Kurulum yapılıyor...</h1>
    <p id="status">Paket indiriliyor</p>
  </div>

  <div id="step3" class="done">
    <h1>Hazırsın 🚀</h1>
    <p>Offline İngilizce çeviri hazır</p>
    <button class="btn" onclick="goNext()">Devam Et</button>
  </div>

</div>

<script type="module" src="/js/offline_onboarding.js"></script>

</body>
</html>
