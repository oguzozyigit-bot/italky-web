<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Teacher AI Terminal</title>

  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --purple: #a855f7;
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    #pageContent {
      height: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #150520 0%, #000 100%);
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    .main-hub {
      flex: 1;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 2;
    }

    .header-zone {
      text-align: center;
      margin-bottom: 20px;
      flex: 0 0 auto;
    }
    .header-zone h1 {
      font-family: 'Space Grotesk';
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin: 0;
      letter-spacing: -1px;
    }
    .header-zone h1 span {
      background: var(--ai-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-zone p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .scanner-hero {
      flex: 1;
      min-height: 0;
      position: relative;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0.7) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scanner-hero:active { transform: scale(0.97); filter: brightness(1.2); }

    .formula-layer { position: absolute; inset: 0; pointer-events: none; }
    .f-node {
      position: absolute;
      font-family: monospace;
      font-size: 12px;
      color: var(--purple);
      opacity: 0;
      bottom: 40%;
      animation: f-float 4s infinite linear;
    }
    @keyframes f-float {
      0% { transform: translateY(0) scale(0.5) rotate(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-250px) scale(1.2) rotate(15deg); opacity: 0; }
    }

    .scan-bar {
      position: absolute; left: 0; width: 100%; height: 3px;
      background: var(--purple);
      box-shadow: 0 0 25px var(--purple);
      animation: scanMove 4s linear infinite;
      z-index: 5;
    }
    @keyframes scanMove { 0% { top: 0; } 100% { top: 100%; } }

    .orb-scanner {
      width: 140px; height: 140px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 25px;
    }
    .ring-outer {
      position: absolute; inset: -10px; border-radius: 50%; padding: 3px;
      background: var(--ai-grad);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      animation: rotateOrb 10s linear infinite;
    }
    .ring-inner {
      position: absolute; inset: 5px; border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.2);
      animation: rotateOrb 6s linear infinite reverse;
    }
    .core-cam {
      width: 90px; height: 90px;
      background: #000; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      animation: breathe 3s infinite ease-in-out;
    }

    .cta-text { text-align: center; z-index: 10; padding: 0 20px; }
    .cta-text h2 { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 700; color: #fff; margin: 0; }
    .cta-text p { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 10px; line-height: 1.5; }

    @keyframes rotateOrb { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* mini durum */
    .toast{
      position:absolute; bottom:16px; left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.9);
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.5px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display:none;
      z-index:50;
    }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <header class="header-zone">
      <h1>Teacher <span class="ai">AI</span></h1>
      <p>BİLİM KOÇU • SCAN & SOLVE</p>
    </header>

    <section class="scanner-hero" id="btnStartTerminal">

      <div class="scan-bar"></div>
      <div class="formula-layer">
        <div class="f-node" style="left: 20%; animation-delay: 0s;">E=mc²</div>
        <div class="f-node" style="left: 70%; animation-delay: 1.5s;">Δ = b² - 4ac</div>
        <div class="f-node" style="left: 45%; animation-delay: 0.8s;">∫ f(x)dx</div>
        <div class="f-node" style="left: 30%; animation-delay: 2.2s;">H₂O + CO₂</div>
        <div class="f-node" style="left: 80%; animation-delay: 3.1s;">πr²</div>
      </div>

      <div class="orb-scanner">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="core-cam">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
      </div>

      <div class="cta-text">
        <h2>FOTOĞRAF ÇEK VE ÇÖZ</h2>
        <p>Takıldığın sorunun fotoğrafını çek, alanı seç ve yapay zeka adım adım anlatarak çözsün.</p>
      </div>

      <div class="toast" id="toast">Foto işleniyor…</div>
    </section>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const btn = document.getElementById("btnStartTerminal");
  const toast = document.getElementById("toast");

  function showToast(t){
    toast.textContent = t;
    toast.style.display = "block";
  }
  function hideToast(){
    toast.style.display = "none";
  }

  // ✅ Foto küçültme + sıkıştırma (sessionStorage taşmasın)
  async function compressToDataURL(file, maxSide=1600, quality=0.85){
    const dataUrl = await new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(String(r.result || ""));
      r.onerror = ()=>reject(new Error("file_read_fail"));
      r.readAsDataURL(file);
    });

    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = ()=>reject(new Error("img_load_fail"));
      im.src = dataUrl;
    });

    const w = img.naturalWidth || 1;
    const h = img.naturalHeight || 1;

    let nw = w, nh = h;
    if(Math.max(w,h) > maxSide){
      const s = maxSide / Math.max(w,h);
      nw = Math.round(w*s);
      nh = Math.round(h*s);
    }

    const canvas = document.createElement("canvas");
    canvas.width = nw; canvas.height = nh;
    const ctx = canvas.getContext("2d");

    // biraz daha net çizim
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, nw, nh);

    // jpeg export
    return canvas.toDataURL("image/jpeg", quality);
  }

  btn.onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.style.display = "none";
    document.body.appendChild(input);

    input.onchange = async () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;

      try{
        showToast("Foto optimize ediliyor…");
        const small = await compressToDataURL(file, 1600, 0.85);

        // sessionStorage'a yaz (artık taşmaz)
        sessionStorage.setItem("exam_photo", small);

        hideToast();
        location.href = "/pages/exam_crop.html";
      }catch(e){
        hideToast();
        // en azından kullanıcıya mesaj
        alert("Foto işlenemedi. Lütfen tekrar dene.");
      }
    };

    input.click();
  };
</script>
</body>
</html>
