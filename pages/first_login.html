<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • System Initializing</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;800&display=swap');

:root { --neon: #67e8f9; --dark: #000; --red: #ff2d55; }

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; cursor: crosshair; }
body, html { 
    width: 100%; height: 100%; background: var(--dark); 
    color: var(--neon); font-family: 'JetBrains Mono', monospace; 
    overflow: hidden; text-transform: uppercase;
}

/* --- SYSTEM SCANNER BACKGROUND --- */
#bg-canvas { position: fixed; inset: 0; opacity: 0.3; z-index: 1; }

.terminal {
    position: relative; z-index: 10;
    height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
}

/* --- THE NEURAL CORE (ANİMASYONUN KRALI) --- */
.core-wrap {
    position: relative; width: 300px; height: 300px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 50px;
}
.core-ring {
    position: absolute; border: 1px solid var(--neon);
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    animation: coreMorph 8s linear infinite;
    box-shadow: 0 0 20px var(--neon), inset 0 0 20px var(--neon);
}
.r1 { width: 100%; height: 100%; opacity: 0.3; }
.r2 { width: 80%; height: 80%; animation-duration: 5s; animation-direction: reverse; opacity: 0.6; }
.r3 { width: 60%; height: 60%; animation-duration: 3s; border-color: #fff; }

@keyframes coreMorph {
    0% { transform: rotate(0deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    50% { transform: rotate(180deg) scale(1.1); border-radius: 60% 40% 30% 70% / 50% 60% 40% 60%; }
    100% { transform: rotate(360deg) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
}

/* --- DATA STREAM --- */
.status-bar { font-size: 10px; position: absolute; top: 20px; left: 20px; color: rgba(103,232,249,0.5); }
.line { width: 1px; height: 100px; background: var(--neon); margin: 20px 0; animation: linePulse 2s infinite; }
@keyframes linePulse { 0%, 100% { opacity: 0.2; height: 50px; } 50% { opacity: 1; height: 150px; } }

/* --- INPUTS (SİSTEME SIZMA) --- */
.system-input {
    background: transparent; border: none;
    color: #fff; font-size: 24px; font-weight: 800;
    text-align: center; width: 100%; max-width: 400px;
    letter-spacing: 5px; margin-top: 20px;
    display: none;
}
.system-input::placeholder { color: rgba(255,255,255,0.1); }

/* --- BUTTONS (TRIGGER) --- */
.trigger {
    padding: 15px 40px; border: 1px solid var(--neon);
    background: transparent; color: var(--neon);
    font-weight: 800; font-size: 14px; letter-spacing: 5px;
    transition: 0.3s; margin-top: 40px;
}
.trigger:hover { background: var(--neon); color: var(--dark); box-shadow: 0 0 50px var(--neon); }

/* Glitch Efekti */
.glitch { font-size: 40px; font-weight: 900; letter-spacing: 10px; margin-bottom: 10px; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="status-bar">
    SYSTEM: italkyAI CORE v3.0<br>
    LOCATION: 40.8422° N, 31.1592° E<br>
    ENCRYPTION: AES-256 QUANTUM<br>
    STATUS: AWAITING GENESIS...
</div>

<div class="terminal">
    <div class="core-wrap">
        <div class="core-ring r1"></div>
        <div class="core-ring r2"></div>
        <div class="core-ring r3"></div>
        <div style="z-index: 20; font-weight: 800; font-size: 20px;">AI</div>
    </div>

    <div id="boot-sector">
        <h1 class="glitch">italkyAI</h1>
        <p style="font-size: 12px; opacity: 0.6;">Sisteme Erişmek İçin Başlatın</p>
        <button class="trigger" onclick="boot()">INITIALIZE</button>
    </div>

    <div id="auth-sector" style="display: none; width: 100%; text-align: center;">
        <input type="text" id="name" class="system-input" style="display: block;" placeholder="KULLANICI ADI">
        <div class="line" style="margin: 30px auto;"></div>
        <input type="email" id="email" class="system-input" style="display: block;" placeholder="E-POSTA">
        <button class="trigger" onclick="access()">SİSTEME SIZ</button>
    </div>
</div>

<script>
// --- Arka Plan Veri Akışı ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function drawGrid() {
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(103, 232, 249, 0.1)';
    ctx.lineWidth = 1;
    for(let i=0; i<w; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
    for(let i=0; i<h; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
    
    // Rastgele Binary Veriler
    ctx.fillStyle = 'rgba(103, 232, 249, 0.2)';
    ctx.font = '10px JetBrains Mono';
    for(let i=0; i<50; i++) {
        ctx.fillText(Math.random() > 0.5 ? "1" : "0", Math.random()*w, Math.random()*h);
    }
}
setInterval(drawGrid, 100);

// --- Sistem Mantığı ---
function boot() {
    document.getElementById('boot-sector').style.display = 'none';
    document.getElementById('auth-sector').style.display = 'block';
}

async function access() {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    if(!name || !email) return alert("ERİŞİM REDDEDİLDİ: VERİ EKSİK");

    document.querySelector('.core-wrap').style.transform = 'scale(5)';
    document.querySelector('.core-wrap').style.opacity = '0';
    document.body.style.background = '#fff';
    
    setTimeout(() => {
        localStorage.setItem("user_id", "italky_root_" + Date.now());
        location.href = "/";
    }, 1000);
}
</script>
</body>
</html>
