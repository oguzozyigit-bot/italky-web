<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Hızlı Erişim</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --neon: #67e8f9;
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --bg: #0c0810;
}
* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
body, html { width: 100%; height: 100%; background: var(--bg); font-family: 'Outfit', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }

/* Arka plan derinliği */
.bg-glow {
  position: fixed; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(103,232,249,0.15) 0%, transparent 40%);
  z-index: -1;
}

.auth-card {
  width: 90%; max-width: 380px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 35px; padding: 40px 30px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}

.logo {
  font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 800;
  background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 30px;
}

input {
  width: 100%; padding: 16px 20px; margin-bottom: 12px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px; color: #fff; font-family: inherit; font-size: 15px;
}

.bypass-btn {
  width: 100%; padding: 18px; margin-top: 10px;
  background: var(--ai-grad); color: #0c0810;
  border: none; border-radius: 18px;
  font-size: 16px; font-weight: 900; cursor: pointer;
  box-shadow: 0 10px 20px rgba(103,232,249,0.2);
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="auth-card">
  <h1 class="logo">italkyAI</h1>
  
  <p style="font-size: 12px; opacity: 0.5; margin-bottom: 20px; letter-spacing: 1px;">GEÇİCİ ERİŞİM PANELİ</p>

  <input type="text" id="name" placeholder="Ad Soyad (Opsiyonel)">
  <input type="email" id="email" placeholder="E-posta (Opsiyonel)">

  <button class="bypass-btn" onclick="forceEntry()">Sisteme Gir ✦</button>
  
  <p style="margin-top: 20px; font-size: 10px; color: var(--neon); opacity: 0.7;">
    * Zorunluluk kaldırıldı. Direkt Home'a yönlendirilirsiniz.
  </p>
</div>

<script>
function forceEntry() {
  // Hiçbir şey yazmasa bile içeri alıyoruz
  const name = document.getElementById('name').value || "Misafir Başkan";
  const email = document.getElementById('email').value || "guest@italkyai.com";
  
  // Sahte bir ID oluşturup LocalStorage'a mühürlüyoruz
  const fakeId = "italky_dev_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("user_id", fakeId);
  
  console.log("Erişim Yetkisi Verildi:", fakeId);
  
  // Home sayfasına uçuş
  location.href = "/";
}

// Eğer yanlışlıkla home.html'den buraya atarsa ve zaten ID varsa direkt geri gönder
if(localStorage.getItem("user_id")) {
    location.href = "/";
}
</script>

</body>
</html>
