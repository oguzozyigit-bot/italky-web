<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Genesis Connect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --neon: #67e8f9;
  --pink: #f472b6;
  --bg: #0a060e;
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
body, html { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Outfit', sans-serif; color: #fff; }

/* --- 3D PARTICLE BACKGROUND --- */
canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

.main-stage {
    position: relative; z-index: 10;
    height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
    transition: background 1.5s ease;
}

/* İlk Karşılama */
.welcome-trigger {
    text-align: center; cursor: pointer;
    transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.welcome-trigger h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(50px, 15vw, 100px); font-weight: 800;
    letter-spacing: -4px; background: linear-gradient(to bottom, #fff, #67e8f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.welcome-trigger p { letter-spacing: 8px; font-size: 12px; opacity: 0.4; margin-top: 10px; }

/* --- HOLOGRAM FORM (GİZLİ BAŞLAR) --- */
.hologram-card {
    width: 100%; max-width: 400px;
    padding: 40px 30px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(103, 232, 249, 0.2);
    border-radius: 40px;
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    box-shadow: 0 0 50px rgba(103, 232, 249, 0.1);
    display: none; /* Başta kapalı */
    flex-direction: column; gap: 20px;
    animation: holoReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes holoReveal {
    from { opacity: 0; transform: scale(0.8) rotateX(20deg); }
    to { opacity: 1; transform: scale(1) rotateX(0); }
}

.input-group { position: relative; width: 100%; }
.input-group label { font-size: 10px; color: var(--neon); letter-spacing: 2px; margin-left: 15px; margin-bottom: 5px; display: block; }

input {
    width: 100%; padding: 18px 25px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; color: #fff;
    font-size: 17px; font-family: inherit;
    transition: 0.4s;
}
input:focus {
    background: rgba(255,255,255,0.08);
    border-color: var(--neon);
    box-shadow: 0 0 20px rgba(103,232,249,0.2);
}

.glow-btn {
    width: 100%; padding: 20px;
    background: var(--neon); color: #000;
    border: none; border-radius: 20px;
    font-size: 18px; font-weight: 900;
    cursor: pointer; transition: 0.3s;
    box-shadow: 0 10px 30px rgba(103,232,249,0.3);
    margin-top: 10px;
}
.glow-btn:active { transform: scale(0.96); }

/* Arka planda süzülen enerji halkaları */
.ring {
    position: absolute; border: 1px solid var(--neon); border-radius: 50%;
    opacity: 0; pointer-events: none;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="main-stage" id="stage" onclick="initGenesis(event)">
    
    <div class="welcome-trigger" id="trigger">
        <h1>italkyAI</h1>
        <p>DOKUN VE BAĞLAN</p>
    </div>

    <div class="hologram-card" id="formCard" onclick="event.stopPropagation()">
        <div style="text-align: center; margin-bottom: 10px;">
            <h2 style="font-size: 24px; font-weight: 800;">Sisteme Kayıt</h2>
            <p style="font-size: 13px; opacity: 0.5;">italkyAI evrenine giriş yapın.</p>
        </div>

        <div class="input-group">
            <label>AD SOYAD</label>
            <input type="text" id="name" placeholder="Adınız ve Soyadınız" autocomplete="off">
        </div>

        <div class="input-group">
            <label>E-POSTA</label>
            <input type="email" id="email" placeholder="isim@mail.com" autocomplete="off">
        </div>

        <button class="glow-btn" id="finishBtn" onclick="saveData()">Sistemi Başlat ✨</button>
    </div>

</div>

<script>
// --- ARKA PLAN MOTORU ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.size = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.015; }
    draw() {
        ctx.fillStyle = `rgba(103, 232, 249, ${this.life})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    }
}

function animate() {
    ctx.fillStyle = 'rgba(10, 6, 14, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

// --- ETKİLEŞİM ---
function initGenesis(e) {
    // Patlama Efekti
    for(let i=0; i<40; i++) particles.push(new Particle(e.clientX, e.clientY));

    // UI Değişimi
    document.getElementById('trigger').style.display = 'none';
    const form = document.getElementById('formCard');
    form.style.display = 'flex';
    
    // Arka planı canlandır
    document.getElementById('stage').style.background = "radial-gradient(circle at center, #1a0f2e 0%, #0a060e 100%)";
}

async function saveData() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('finishBtn');

    if(!name || !email) {
        alert("Başkanım, tüm alanları dolduralım.");
        return;
    }

    btn.innerText = "Bağlantı Kuruluyor...";
    btn.style.opacity = "0.7";

    // Simüle edilmiş kayıt
    setTimeout(() => {
        localStorage.setItem("user_id", "italky_" + Date.now());
        // Patlama animasyonu ile geçiş
        for(let i=0; i<100; i++) particles.push(new Particle(window.innerWidth/2, window.innerHeight/2));
        setTimeout(() => location.href = "/", 1000);
    }, 1500);
}
</script>

</body>
</html>
