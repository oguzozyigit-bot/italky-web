<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • The Origin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Outfit', sans-serif; color: #fff; }

/* --- THE VOID (BOŞLUK) --- */
canvas { position: fixed; inset: 0; z-index: 1; cursor: crosshair; }

.over-ui {
    position: relative; z-index: 10;
    height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 60px 30px;
    pointer-events: none;
}

.over-ui > * { pointer-events: auto; }

/* Dev Tipografi (Nefes Alan) */
.origin-title {
    font-size: clamp(40px, 15vw, 120px);
    font-weight: 900;
    letter-spacing: -10px;
    opacity: 0.1;
    transition: 1s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
}
.origin-title.active { opacity: 1; letter-spacing: -2px; filter: blur(0); }

/* Veri Girişi (Sadece bir çizgi) */
.flow-field {
    width: 100%; max-width: 400px;
    text-align: center;
    opacity: 0;
    transform: translateY(50px);
    transition: 1.5s all ease;
}
.flow-field.show { opacity: 1; transform: translateY(0); }

input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 28px; font-weight: 100;
    text-align: center; padding: 20px 0;
    margin-bottom: 20px; transition: 0.5s;
}
input:focus { border-bottom-color: #fff; transform: scale(1.05); }

.pulse-circle {
    width: 80px; height: 80px;
    border: 1px solid #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 40px auto; cursor: pointer;
    position: relative; transition: 0.5s;
}
.pulse-circle::after {
    content: ''; position: absolute; inset: -10px;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
    animation: pulseOut 2s infinite;
}
@keyframes pulseOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="over-ui">
    
    <h1 class="origin-title" id="mainTitle">italkyAI</h1>

    <div id="setup" class="flow-field">
        <div id="step1">
            <input type="text" id="userName" placeholder="İSİM" autocomplete="off">
            <div class="pulse-circle" onclick="toStep2()"><span>→</span></div>
        </div>
        
        <div id="step2" style="display: none;">
            <input type="email" id="userEmail" placeholder="E-POSTA" autocomplete="off">
            <div class="pulse-circle" onclick="finalGenesis()"><span>✦</span></div>
        </div>
    </div>

    <p id="hint" style="opacity: 0.3; font-size: 10px; letter-spacing: 5px;">EKRANA DOKUN VE DÜNYANI YARAT</p>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: -100, y: -100 };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    spawnParticles(e.clientX, e.clientY);
});

window.addEventListener('touchstart', e => {
    const touch = e.touches[0];
    mouse.x = touch.clientX;
    mouse.y = touch.clientY;
    spawnParticles(touch.clientX, touch.clientY);
    
    // İlk dokunuşta başlığı uyandır
    document.getElementById('mainTitle').classList.add('active');
    document.getElementById('setup').classList.add('show');
    document.getElementById('hint').style.opacity = '0';
});

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 5 + 1;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.color = `hsl(${Math.random() * 60 + 200}, 100%, 70%)`;
        this.life = 1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.01;
    }
    draw() {
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function spawnParticles(x, y) {
    for(let i=0; i<5; i++) particles.push(new Particle(x, y));
}

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    
    // Parçacıkları birbirine bağlayan ışık köprüleri
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for(let i=0; i<particles.length; i++) {
        for(let j=i; j<particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 100) {
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
            }
        }
    }
    ctx.stroke();
    
    requestAnimationFrame(animate);
}
animate();

function toStep2() {
    if(!document.getElementById('userName').value) return;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
}

function finalGenesis() {
    // Büyük patlama
    for(let i=0; i<500; i++) particles.push(new Particle(canvas.width/2, canvas.height/2));
    setTimeout(() => {
        localStorage.setItem("user_id", "gen_" + Date.now());
        location.href = "/";
    }, 1000);
}
</script>
</body>
</html>
