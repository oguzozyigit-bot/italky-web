<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Hayat Bulan Yapay Zeka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050508;
  --primary: #818cf8;
  --accent: #c084fc;
  --glass: rgba(255, 255, 255, 0.02);
  --border: rgba(255, 255, 255, 0.07);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
body, html { 
  margin: 0; padding: 0; width: 100%; height: 100%; 
  background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif;
  overflow: hidden;
}

/* --- CANLI ARKA PLAN (NEFES ALAN DÜNYA) --- */
.aurora-bg {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 50% 50%, #0f0a1a 0%, #050508 100%);
  overflow: hidden;
}

/* Nefes alan ışık huzmeleri */
.light-beam {
  position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(129, 140, 248, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  filter: blur(60px);
  animation: breatheLight 12s infinite ease-in-out alternate;
}
.beam-1 { top: -200px; left: -100px; animation-delay: 0s; }
.beam-2 { bottom: -200px; right: -100px; background: radial-gradient(circle, rgba(192, 132, 252, 0.06) 0%, transparent 70%); animation-delay: -4s; }

@keyframes breatheLight {
  0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
  100% { transform: scale(1.4) translate(50px, 30px); opacity: 0.8; }
}

/* --- ANA KAPSAYICI --- */
.viewport {
  height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 20px; perspective: 1200px;
}

/* Nefes alan ana kart */
.card {
  width: 100%; max-width: 440px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--border);
  border-radius: 48px;
  padding: 50px 35px;
  position: relative;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
  animation: cardPulse 8s infinite ease-in-out;
}

@keyframes cardPulse {
  0%, 100% { transform: translateY(0) rotateX(0); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); }
  50% { transform: translateY(-10px) rotateX(2deg); box-shadow: 0 60px 120px rgba(129, 140, 248, 0.1); }
}

/* Adım Geçişleri */
.step { display: none; }
.step.active { 
  display: block; 
  animation: stepReveal 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards; 
}

@keyframes stepReveal {
  from { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

/* --- TIPOGRAFI & GÖRSEL --- */
.logo-glow {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 42px; font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #818cf8 50%, #c084fc 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 10px; letter-spacing: -1.5px;
}

.sub-text {
  color: rgba(255,255,255,0.5); font-size: 16px; margin-bottom: 40px;
  font-weight: 300; line-height: 1.6;
}

/* --- INPUT & BUTON (YAŞAYAN ELEMENTLER) --- */
.input-wrapper {
  position: relative; margin-bottom: 20px;
}

input {
  width: 100%; padding: 20px 24px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 24px; color: #fff;
  font-family: inherit; font-size: 18px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

input:focus {
  background: rgba(255,255,255,0.07);
  border-color: var(--primary);
  box-shadow: 0 0 30px rgba(129, 140, 248, 0.15);
  transform: scale(1.02);
}

.action-btn {
  width: 100%; padding: 20px;
  border-radius: 24px; border: none;
  background: #fff; color: #000;
  font-size: 18px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
  margin-top: 15px;
  position: relative; overflow: hidden;
}

.action-btn:hover {
  background: var(--primary); color: #fff;
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(129, 140, 248, 0.4);
}

/* Butonun içindeki parıltı akışı */
.action-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: 0.6s;
}
.action-btn:hover::after { transform: translateX(100%); }

/* Progress Dots */
.progress {
  display: flex; justify-content: center; gap: 8px; margin-top: 40px;
}
.dot {
  width: 8px; height: 8px; background: rgba(255,255,255,0.1);
  border-radius: 50%; transition: 0.5s;
}
.dot.active {
  width: 24px; border-radius: 4px;
  background: var(--primary);
  box-shadow: 0 0 15px var(--primary);
}

</style>
</head>
<body>

<div class="aurora-bg">
  <div class="light-beam beam-1"></div>
  <div class="light-beam beam-2"></div>
</div>

<div class="viewport">
  <div class="card">
    
    <div class="step active" id="s1">
      <h1 class="logo-glow">italkyAI</h1>
      <p class="sub-text">Dilin sınırlarını aşan yaşayan bir zeka ile tanışmaya hazır mısın?</p>
      <button class="action-btn" onclick="next(2)">Deneyimi Başlat <span>✦</span></button>
    </div>

    <div class="step" id="s2">
      <h1 class="logo-glow">Adınız?</h1>
      <p class="sub-text">Size özel bir asistan oluşturabilmemiz için isminizi öğrenebilir miyiz?</p>
      <div class="input-wrapper">
        <input type="text" id="name" placeholder="Ad Soyad" autocomplete="off">
      </div>
      <button class="action-btn" onclick="next(3)">Devam Et →</button>
    </div>

    <div class="step" id="s3">
      <h1 class="logo-glow">Son Adım.</h1>
      <p class="sub-text">italkyAI dünyasına giriş yapabilmen için iletişim bilgilerini tamamla.</p>
      <div class="input-wrapper">
        <input type="email" id="email" placeholder="E-posta Adresi" autocomplete="off">
      </div>
      <div class="input-wrapper">
        <input type="tel" id="phone" placeholder="Telefon (Opsiyonel)" autocomplete="off">
      </div>
      <button class="action-btn" id="finalBtn" onclick="save()">Dünyaya Katıl ✨</button>
    </div>

    <div class="progress">
      <div class="dot active" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>

  </div>
</div>

<script>
function next(step) {
  if(step === 3 && !document.getElementById('name').value.trim()) return alert("İsim gerekli.");
  
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('s' + step).classList.add('active');
  
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i < step);
  });
}

async function save() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const btn = document.getElementById("finalBtn");

  if(!email.includes('@')) return alert("E-posta geçerli değil.");

  btn.innerText = "Yükleniyor...";
  
  try {
    const res = await fetch("/api/auth/register", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name, email, phone })
    });
    const data = await res.json();
    if(data.ok) {
      localStorage.setItem("user_id", data.user_id);
      location.href = "/";
    }
  } catch(e) {
    alert("Hata oluştu.");
    btn.innerText = "Dünyaya Katıl ✨";
  }
}
</script>

</body>
</html>
