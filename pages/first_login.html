<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Giriş</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --neon: #67e8f9;
  --pink: #f472b6;
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --bg: #0c0810;
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
body, html { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Outfit', sans-serif; color: #fff; }

/* --- HOME STYLE 3D BACKGROUND --- */
.bg-layer {
  position: fixed; inset: 0; z-index: 1;
  background: 
    radial-gradient(circle at 50% 0%, rgba(251,146,60,.12) 0%, transparent 30%),
    linear-gradient(180deg, #160d1a 0%, #0c0810 100%);
}

/* Kristal Kafes (Home Sayfasıyla Aynı Ruh) */
.crystal-container {
  position: absolute; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  perspective: 1000px; pointer-events: none;
}
.crystal {
  width: 300px; height: 300px; transform-style: preserve-3d;
  animation: rotateCrystal 20s linear infinite; opacity: 0.2;
}
.side {
  position: absolute; inset: 0; border: 1px solid var(--neon);
  background: radial-gradient(circle, rgba(103,232,249,0.1), transparent);
}
.s1{ transform:rotateY(0deg) translateZ(150px); }
.s2{ transform:rotateY(90deg) translateZ(150px); }
.s3{ transform:rotateX(90deg) translateZ(150px); }

@keyframes rotateCrystal {
  from { transform: rotateX(0deg) rotateY(0deg); }
  to { transform: rotateX(360deg) rotateY(720deg); }
}

/* --- ANA KART (YAŞAYAN HOLOGRAM) --- */
.viewport {
  position: relative; z-index: 10; height: 100%;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}

.auth-card {
  width: 100%; max-width: 400px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 40px; padding: 45px 35px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
  text-align: center;
}

.logo-text {
  font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 800;
  background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 5px; letter-spacing: -1px;
}
.sub-tag { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 4px; margin-bottom: 35px; }

/* --- INPUTLAR --- */
.input-field { margin-bottom: 20px; text-align: left; }
.input-field label { font-size: 10px; font-weight: 800; color: var(--neon); letter-spacing: 1.5px; margin-left: 15px; margin-bottom: 8px; display: block; }

input {
  width: 100%; padding: 18px 25px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px; color: #fff;
  font-size: 16px; font-family: inherit;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input:focus {
  background: rgba(255,255,255,0.08);
  border-color: var(--neon);
  box-shadow: 0 0 20px rgba(103,232,249,0.15);
  transform: translateY(-2px);
}

.main-btn {
  width: 100%; padding: 20px; margin-top: 15px;
  background: var(--ai-grad); color: #0c0810;
  border: none; border-radius: 22px;
  font-size: 17px; font-weight: 900; cursor: pointer;
  box-shadow: 0 15px 30px rgba(99,102,241,0.3);
  transition: 0.3s;
}
.main-btn:active { transform: scale(0.97); }

</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="crystal-container">
  <div class="crystal">
    <div class="side s1"></div>
    <div class="side s2"></div>
    <div class="side s3"></div>
  </div>
</div>

<div class="viewport">
  <div class="auth-card">
    <h1 class="logo-text">italkyAI</h1>
    <p class="sub-tag">GENESIS PHASE</p>

    <div class="input-field">
      <label>KİMLİK TANIMLA</label>
      <input type="text" id="name" placeholder="Ad Soyad" autocomplete="off">
    </div>

    <div class="input-field">
      <label>DİJİTAL ADRES</label>
      <input type="email" id="email" placeholder="E-posta" autocomplete="off">
    </div>

    <div class="input-field">
      <label>İLETİŞİM (OPSİYONEL)</label>
      <input type="tel" id="phone" placeholder="Telefon" autocomplete="off">
    </div>

    <button class="main-btn" onclick="register()">Erişimi Başlat ✦</button>
  </div>
</div>

<script>
async function register() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if(!name || !email) {
    alert("Lütfen zorunlu alanları doldurun.");
    return;
  }

  // Başarılı efekt ve geçiş
  document.querySelector('.auth-card').style.opacity = "0.5";
  document.querySelector('.auth-card').style.transform = "scale(0.9) translateY(20px)";
  
  try {
    const res = await fetch("/api/auth/register", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name, email, phone })
    });
    const data = await res.json();
    if(data.ok) {
      localStorage.setItem("user_id", data.user_id);
      location.href = "/";
    }
  } catch(e) {
    location.href = "/"; // Test için direkt geçiş
  }
}
</script>

</body>
</html>
