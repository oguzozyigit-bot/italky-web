<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Genesis Connect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --neon: #67e8f9;
  --pink: #f472b6;
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --bg: #0c0810;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
}

/* --- ARKA PLAN --- */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 0%, rgba(251,146,60,.12) 0%, transparent 35%),
    linear-gradient(180deg, #160d1a 0%, #0c0810 100%);
}

.crystal-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
  pointer-events: none;
  z-index: 2;
}

.crystal-cage {
  width: 320px;
  height: 320px;
  transform-style: preserve-3d;
  animation: rotateCrystal 22s linear infinite;
  opacity: 0.15;
}

.side {
  position: absolute;
  inset: 0;
  border: 1.5px solid var(--neon);
  background: radial-gradient(circle, rgba(103,232,249,0.08), transparent);
  box-shadow: 0 0 20px rgba(103,232,249,0.1);
}
.s1{ transform:rotateY(0deg) translateZ(160px); }
.s2{ transform:rotateY(90deg) translateZ(160px); }
.s3{ transform:rotateX(90deg) translateZ(160px); }

@keyframes rotateCrystal {
  from { transform: rotateX(0deg) rotateY(0deg); }
  to { transform: rotateX(360deg) rotateY(720deg); }
}

/* --- ANA PANEL --- */
.viewport {
  position: relative;
  z-index: 10;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 60px 24px 30px;
}

.header-area {
  text-align: center;
}

.logo-main {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 42px;
  font-weight: 800;
  background: var(--ai-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1.5px;
  margin-bottom: 4px;
}

.logo-sub {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 6px;
  opacity: 0.9;
}

.orbit-anim-area {
  width: 100%;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin: 10px 0;
}

.core-sphere {
  width: 60px;
  height: 60px;
  background:
    radial-gradient(circle at 30% 30%, rgba(103,232,249,0.9), transparent 70%),
    rgba(255,255,255,0.05);
  border-radius: 50%;
  position: absolute;
  z-index: 5;
  box-shadow: 0 0 30px rgba(103,232,249,0.5), inset 0 0 15px rgba(103,232,249,0.3);
  animation: corePulse 4s infinite ease-in-out;
}

@keyframes corePulse {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.05); opacity: 1; }
}

.orbit-ring {
  border: 1px solid rgba(103,232,249,0.15);
  border-radius: 50%;
  position: absolute;
  transform-style: preserve-3d;
  opacity: 0.6;
}
.r1 { width: 120px; height: 120px; animation: orbitRotate1 8s linear infinite; }
.r2 { width: 170px; height: 170px; animation: orbitRotate2 12s linear infinite reverse; }
.r3 { width: 220px; height: 220px; animation: orbitRotate3 16s linear infinite; }

.satellite {
  width: 10px;
  height: 10px;
  background: var(--neon);
  border-radius: 50%;
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 10px var(--neon);
}
.satellite.s2 {
  background: var(--pink);
  box-shadow: 0 0 10px var(--pink);
}

@keyframes orbitRotate1 {
  from { transform: rotateX(75deg) rotateY(10deg) rotateZ(0deg); }
  to { transform: rotateX(75deg) rotateY(10deg) rotateZ(360deg); }
}
@keyframes orbitRotate2 {
  from { transform: rotateX(70deg) rotateY(-15deg) rotateZ(0deg); }
  to { transform: rotateX(70deg) rotateY(-15deg) rotateZ(360deg); }
}
@keyframes orbitRotate3 {
  from { transform: rotateX(80deg) rotateY(5deg) rotateZ(0deg); }
  to { transform: rotateX(80deg) rotateY(5deg) rotateZ(360deg); }
}

.auth-card {
  width: 100%;
  max-width: 380px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 42px;
  padding: 40px 30px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  animation: cardReveal 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

@keyframes cardReveal {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.input-box {
  margin-bottom: 18px;
  text-align: left;
}

.input-box label {
  font-size: 10px;
  font-weight: 900;
  color: var(--neon);
  letter-spacing: 2px;
  margin-left: 15px;
  margin-bottom: 8px;
  display: block;
  opacity: 0.8;
}

input {
  width: 100%;
  padding: 18px 25px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  color: #fff;
  font-size: 16px;
  font-family: inherit;
  transition: all 0.3s ease;
}

input:focus {
  background: rgba(255,255,255,0.07);
  border-color: var(--neon);
  box-shadow: 0 0 25px rgba(103,232,249,0.15);
  transform: translateY(-2px);
}

.submit-btn {
  width: 100%;
  padding: 20px;
  margin-top: 10px;
  background: var(--ai-grad);
  color: #0c0810;
  border: none;
  border-radius: 20px;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 15px 35px rgba(129,140,248,0.3);
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.submit-btn:active { transform: scale(0.96); }

.helper-text {
  margin-top: 10px;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  line-height: 1.45;
}

.footer-brand {
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1.5px;
  font-weight: 500;
  margin-top: 10px;
}
.footer-brand b { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="crystal-wrap">
  <div class="crystal-cage">
    <div class="side s1"></div>
    <div class="side s2"></div>
    <div class="side s3"></div>
  </div>
</div>

<div class="viewport">
  <header class="header-area">
    <h1 class="logo-main">italkyAI</h1>
    <div class="logo-sub">BE FREE</div>
  </header>

  <div class="orbit-anim-area">
    <div class="core-sphere"></div>
    <div class="orbit-ring r1"><div class="satellite"></div></div>
    <div class="orbit-ring r2"><div class="satellite s2"></div></div>
    <div class="orbit-ring r3"><div class="satellite"></div></div>
  </div>

  <main class="auth-card">
    <div style="margin-bottom: 25px;">
      <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">Erişim Tanımla</h2>
      <p style="font-size: 13px; color: rgba(255,255,255,0.5);">
        Sisteme giriş için profilinizi oluşturun.
      </p>
    </div>

    <div class="input-box">
      <label>AD SOYAD</label>
      <input type="text" id="name" placeholder="Örn: Oğuz Özyiğit" autocomplete="off">
    </div>

    <div class="input-box">
      <label>E-POSTA</label>
      <input type="email" id="email" placeholder="isim@mail.com" autocomplete="off">
    </div>

    <div class="input-box">
      <label>TELEFON (OPSİYONEL)</label>
      <input type="tel" id="phone" placeholder="+90 5xx" autocomplete="off">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="saveUser()">Sistemi Başlat ✦</button>

    <div class="helper-text" id="helperText">
      Google ile geldiysen bilgiler otomatik doldurulur. NFC ile geldiysen burada profilin oluşur.
    </div>
  </main>

  <footer class="footer-brand">
    italkyAI By <b>Ozyigit's</b> • 2026
  </footer>
</div>

<script type="module">
import { supabase } from "/js/supabase_client.js";

const API_URL = "https://italky-api.onrender.com/api/auth/register";

const nameEl = document.getElementById("name");
const emailEl = document.getElementById("email");
const phoneEl = document.getElementById("phone");
const submitBtn = document.getElementById("submitBtn");
const helperText = document.getElementById("helperText");

let authUserId = "";
let loginType = "google";
let pendingUid = "";

function getPendingUid() {
  const url = new URL(window.location.href);
  const qUid = String(url.searchParams.get("uid") || "").trim();
  const lsUid = String(localStorage.getItem("pending_nfc_uid") || "").trim();
  return qUid || lsUid || "";
}

function deriveFullName(user) {
  const meta = user?.user_metadata || {};
  const appMeta = user?.app_metadata || {};

  return (
    meta.full_name ||
    meta.name ||
    [meta.given_name, meta.family_name].filter(Boolean).join(" ").trim() ||
    appMeta.full_name ||
    ""
  ).trim();
}

async function bootstrap() {
  try {
    const existingUserId = localStorage.getItem("user_id");
    if (existingUserId) {
      window.location.href = "/pages/home.html";
      return;
    }

    pendingUid = getPendingUid();

    const { data, error } = await supabase.auth.getUser();

    if (!error && data?.user) {
      const user = data.user;
      authUserId = String(user.id || "").trim();
      loginType = "google";

      const autoName = deriveFullName(user);
      const autoEmail = String(user.email || "").trim();

      if (autoName) nameEl.value = autoName;
      if (autoEmail) emailEl.value = autoEmail;

      helperText.textContent = "Google hesabın algılandı. Bilgilerini kontrol edip devam et.";
      return;
    }

    // Google oturumu yoksa NFC / manuel akış
    loginType = pendingUid ? "nfc" : "google";

    let tempId = localStorage.getItem("pending_profile_id");
    if (!tempId) {
      tempId = crypto.randomUUID();
      localStorage.setItem("pending_profile_id", tempId);
    }
    authUserId = tempId;

    if (pendingUid) {
      helperText.textContent = "NFC kart algılandı. Profil bilgilerini tamamlayıp devam et.";
    } else {
      helperText.textContent = "Google oturumu bulunamadı. Bilgilerini girip devam et.";
    }
  } catch (e) {
    console.error("BOOTSTRAP ERROR:", e);
    let tempId = localStorage.getItem("pending_profile_id");
    if (!tempId) {
      tempId = crypto.randomUUID();
      localStorage.setItem("pending_profile_id", tempId);
    }
    authUserId = tempId;
  }
}

window.saveUser = async function saveUser() {
  const full_name = nameEl.value.trim();
  const email = emailEl.value.trim().toLowerCase();
  const phone = phoneEl.value.trim();

  if (!full_name || !email) {
    alert("Ad Soyad ve Email zorunlu");
    return;
  }

  if (!authUserId) {
    authUserId = crypto.randomUUID();
    localStorage.setItem("pending_profile_id", authUserId);
  }

  submitBtn.innerText = "Sisteme Bağlanıyor...";
  submitBtn.style.opacity = "0.7";
  submitBtn.style.pointerEvents = "none";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: authUserId,
        full_name,
        email,
        phone: phone || null,
        uid: pendingUid || null,
        login_type: loginType
      })
    });

    const data = await res.json();
    console.log("REGISTER RESPONSE:", data);

    if (data.ok && data.user_id) {
      localStorage.setItem("user_id", data.user_id);

      if (loginType === "nfc") {
        localStorage.setItem("mode", "pro");
      } else {
        localStorage.setItem("mode", "free");
      }

      if (pendingUid) {
        localStorage.setItem("linked_nfc_uid", pendingUid);
        localStorage.removeItem("pending_nfc_uid");
      }

      localStorage.removeItem("pending_profile_id");

      window.location.href = "/pages/home.html";
      return;
    }

    alert("Kayıt başarısız: " + (data.error || "Bilinmeyen hata"));
  } catch (err) {
    console.error("REGISTER ERROR:", err);
    alert("Sunucu bağlantısı kurulamadı.");
  }

  submitBtn.innerText = "Sistemi Başlat ✦";
  submitBtn.style.opacity = "1";
  submitBtn.style.pointerEvents = "auto";
};

bootstrap();
</script>

</body>
</html>
