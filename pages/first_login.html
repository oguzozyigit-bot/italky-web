<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • The Core</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --core-bg: #030005;
  --ai-cyan: #67e8f9;
  --ai-purple: #a855f7;
  --ai-pink: #f472b6;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
body, html { 
  margin: 0; padding: 0; width: 100%; height: 100%; 
  background: var(--core-bg); color: #fff; font-family: 'Outfit', sans-serif;
  overflow: hidden; touch-action: none;
}

/* --- THE NEURAL CORE (CANLI PARÇACIKLAR) --- */
#canvas {
  position: fixed; inset: 0; z-index: 1;
  filter: blur(2px) contrast(1.2);
}

.interface {
  position: relative; z-index: 10;
  height: 100%; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px; text-align: center;
  pointer-events: none;
}

.interface > * { pointer-events: auto; }

/* Akışkan Tipografi */
.fluid-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(40px, 10vw, 70px); font-weight: 800;
  letter-spacing: -3px; line-height: 0.9;
  background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
  animation: titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.05); opacity: 1; filter: blur(0); }
}

/* --- MINIMALIST DATA INPUTS --- */
.data-gate {
  width: 100%; max-width: 400px;
  opacity: 0; transform: translateY(30px);
  transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
}
.data-gate.active { opacity: 1; transform: translateY(0); }

.quantum-input {
  width: 100%; background: transparent; border: none;
  border-bottom: 2px solid rgba(255,255,255,0.1);
  padding: 20px 0; color: #fff; font-size: 24px;
  font-weight: 200; text-align: center;
  letter-spacing: 1px; transition: 0.5s;
}
.quantum-input:focus {
  border-bottom-color: var(--ai-cyan);
  box-shadow: 0 15px 30px -15px rgba(103,232,249,0.3);
}

.next-trigger {
  margin-top: 50px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 15px 40px; border-radius: 100px;
  font-size: 14px; text-transform: uppercase; letter-spacing: 4px;
  cursor: pointer; transition: 0.4s;
  backdrop-filter: blur(10px);
}
.next-trigger:hover {
  background: #fff; color: #000; border-color: #fff;
  transform: translateY(-5px);
}

/* Enerji Halkası */
.ring-container {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 300px; height: 300px;
  pointer-events: none;
}
.ring {
  position: absolute; inset: 0;
  border: 1px solid var(--ai-cyan);
  border-radius: 50%; opacity: 0.1;
  animation: ringExpand 3s infinite;
}
@keyframes ringExpand {
  0% { transform: scale(0.5); opacity: 0.5; }
  100% { transform: scale(2); opacity: 0; }
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="interface">
  
  <div class="ring-container">
    <div class="ring"></div>
    <div class="ring" style="animation-delay: 1s"></div>
    <div class="ring" style="animation-delay: 2s"></div>
  </div>

  <div class="data-gate active" id="g1">
    <h1 class="fluid-title">italkyAI<br>CORE</h1>
    <p style="color:rgba(255,255,255,0.4); letter-spacing: 2px;">SİSTEM BAŞLATILIYOR</p>
    <button class="next-trigger" onclick="go(2)">BAĞLAN</button>
  </div>

  <div class="data-gate" id="g2">
    <h1 class="fluid-title">KİMLİK?</h1>
    <input type="text" id="name" class="quantum-input" placeholder="İSİM SOYİSİM" autocomplete="off">
    <button class="next-trigger" onclick="go(3)">ONAYLA</button>
  </div>

  <div class="data-gate" id="g3">
    <h1 class="fluid-title">SENKRON.</h1>
    <input type="email" id="email" class="quantum-input" placeholder="E-POSTA" autocomplete="off">
    <br><br>
    <input type="tel" id="phone" class="quantum-input" placeholder="TELEFON" autocomplete="off">
    <button class="next-trigger" id="finBtn" onclick="finalize()">EVRENE KATIL</button>
  </div>

</div>

<script>
/* --- NEURAL BACKGROUND ENGINE --- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 1;
    this.speedX = Math.random() * 1 - 0.5;
    this.speedY = Math.random() * 1 - 0.5;
    this.color = Math.random() > 0.5 ? '#67e8f9' : '#f472b6';
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x > canvas.width) this.x = 0;
    if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0;
    if (this.y < 0) this.y = canvas.height;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  particles = [];
  for (let i = 0; i < 100; i++) {
    particles.push(new Particle());
  }
}

function animate() {
  ctx.fillStyle = 'rgba(3, 0, 5, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  
  // Parçacıkları birbirine bağlayan sinirsel çizgiler
  for(let i=0; i<particles.length; i++){
    for(let j=i; j<particles.length; j++){
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 100){
        ctx.strokeStyle = particles[i].color;
        ctx.globalAlpha = 1 - (dist/100);
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

init();
animate();

/* --- INTERFACE LOGIC --- */
function go(s) {
  if(s === 3 && !document.getElementById('name').value.trim()) return;
  document.querySelectorAll('.data-gate').forEach(g => g.classList.remove('active'));
  setTimeout(() => {
    document.getElementById('g' + s).classList.add('active');
  }, 500);
}

async function finalize() {
  const btn = document.getElementById('finBtn');
  btn.innerText = "SİSTEME İŞLENİYOR...";
  
  // Buraya senin fetch/register logic'in gelecek
  setTimeout(() => {
    localStorage.setItem("user_id", "core_" + Math.random());
    location.href = "/";
  }, 2000);
}
</script>

</body>
</html>
