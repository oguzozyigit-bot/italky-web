<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Yönlendiriliyor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#02000f;
      color:#fff;
      font-family:Outfit,sans-serif;
    }
    .box{
      width:min(520px,92vw);
      padding:18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      text-align:center;
    }
    .t{
      font-weight:1000;
      font-size:16px;
      margin:0 0 8px;
    }
    .s{
      font-weight:800;
      font-size:12px;
      color:rgba(255,255,255,.65);
      margin:0;
    }
    .spin{
      width:40px;
      height:40px;
      margin:14px auto 2px;
      border-radius:999px;
      border:3px solid rgba(255,255,255,.18);
      border-top-color: rgba(99,102,241,.95);
      animation:r 1s linear infinite;
    }
    @keyframes r{to{transform:rotate(360deg)}}
    .e{
      margin-top:10px;
      font-size:11px;
      color:rgba(255,255,255,.55);
      word-break:break-word;
      display:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <p class="t">Yönlendiriliyor…</p>
    <p class="s">Lütfen bekleyin.</p>
    <div class="e" id="errBox"></div>
  </div>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";
    import { ensureAuthAndCacheUser } from "/js/auth.js";

    const HOME = "/pages/home.html";
    const ACCESS = "/pages/access.html";
    const LOGIN = "/pages/login.html";
    const errBox = document.getElementById("errBox");

    function showErr(msg){
      if(!errBox) return;
      errBox.style.display = "block";
      errBox.textContent = String(msg || "");
    }

    async function waitForSession(maxMs = 8000){
      const start = Date.now();
      while(Date.now() - start < maxMs){
        const { data:{ session } } = await supabase.auth.getSession();
        if(session?.user) return session;
        await new Promise(r => setTimeout(r, 250));
      }
      return null;
    }

    async function decideTarget(){
      const { data:{ user }, error:userErr } = await supabase.auth.getUser();
      if(userErr || !user?.id) return LOGIN;

      const { data: profile } = await supabase
        .from("profiles")
        .select(`
          id,
          selected_package_code,
          package_active,
          package_ends_at,
          trial_ends_at
        `)
        .eq("id", user.id)
        .maybeSingle();

      const now = Date.now();

      const hasActivePackage =
        !!profile?.selected_package_code &&
        profile?.package_active === true &&
        (!profile?.package_ends_at || new Date(profile.package_ends_at).getTime() > now);

      const hasActiveTrial =
        !!profile?.trial_ends_at &&
        new Date(profile.trial_ends_at).getTime() > now;

      if (hasActivePackage || hasActiveTrial) {
        return HOME;
      }

      return ACCESS;
    }

    try{
      const s = await waitForSession();
      if(!s){
        showErr("Oturum bulunamadı. Giriş ekranına dönülüyor…");
        setTimeout(() => location.replace(LOGIN), 700);
        throw new Error("session_not_found");
      }

      await ensureAuthAndCacheUser();

      const target = await decideTarget();
      location.replace(target);

    }catch(e){
      console.error("first_login bridge error:", e);
      setTimeout(() => location.replace(LOGIN), 700);
    }
  </script>
</body>
</html>
