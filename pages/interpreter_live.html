<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Interpreter</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#030014 !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    html,body{
      margin:0;
      padding:0;
      scrollbar-width:none;
      font-family:'Outfit',sans-serif;
      background:#030014;
      color:#fff;
    }
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}

    #pageContent{
      height:100%;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:10px 12px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 8px);
      gap:10px;
      max-width:560px;
      margin:0 auto;
      overflow:hidden;
    }

    .topCard{
      flex:0 0 auto;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      backdrop-filter:blur(16px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .topRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .title{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:900;
      margin:0;
      color:rgba(255,255,255,.95);
    }

    .statusPill{
      min-height:34px;
      padding:0 12px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:#c7d2fe;
      white-space:nowrap;
    }

    .langGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .langBox{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .langLabel{
      font-size:11px;
      font-weight:900;
      color:#a5b4fc;
      letter-spacing:.6px;
    }

    .langBtn{
      width:100%;
      min-height:44px;
      border:none;
      border-radius:14px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-weight:900;
      font-family:inherit;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      cursor:pointer;
    }

    .langValue{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .hint{
      font-size:11px;
      line-height:1.45;
      color:rgba(255,255,255,.58);
      font-weight:800;
    }

    .chatWrap{
      flex:1 1 auto;
      min-height:0;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      backdrop-filter:blur(18px);
      position:relative;
      overflow:hidden;
    }

    .chatArea{
      position:absolute;
      inset:0;
      padding:14px 12px 110px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }

    .chatArea::-webkit-scrollbar{display:none;}
    .chatArea::before{content:""; flex:1 0 auto;}

    .bubble{
      max-width:88%;
      border-radius:18px;
      padding:10px 12px;
      font-size:14px;
      line-height:1.45;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 12px 28px rgba(0,0,0,.20);
      word-break:break-word;
      white-space:pre-wrap;
      backdrop-filter:blur(10px);
    }

    .bubble.me{
      align-self:flex-end;
      background:rgba(107,114,128,.16);
      border-right:4px solid rgba(107,114,128,.95);
    }

    .bubble.translated{
      align-self:flex-start;
      background:rgba(79,70,229,.16);
      border-left:4px solid #4f46e5;
    }

    .bubble.meta{
      align-self:center;
      max-width:92%;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.75);
      font-size:12px;
      font-weight:800;
      text-align:center;
    }

    .bubbleRow{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .spkBtn{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
      margin-top:1px;
    }

    .spkBtn svg{
      width:18px;
      height:18px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.92;
    }

    .dock{
      position:absolute;
      left:0; right:0; bottom:0;
      padding:10px 12px 12px;
      background:linear-gradient(180deg, rgba(3,0,20,0), rgba(3,0,20,.98) 35%);
    }

    .dockInner{
      display:flex;
      align-items:flex-end;
      gap:8px;
      border-radius:24px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      padding:8px;
      backdrop-filter:blur(10px);
    }

    #msgInput{
      flex:1 1 auto;
      min-width:0;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-family:inherit;
      font-size:14px;
      line-height:1.4;
      max-height:120px;
      overflow:hidden;
      padding:10px 6px;
    }

    .iconBtn,.sendBtn{
      width:44px;
      height:44px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
    }

    .iconBtn svg,.sendBtn svg{
      width:20px;
      height:20px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.95;
    }

    .iconBtn.listening{
      border-color:rgba(79,70,229,.45);
      background:rgba(79,70,229,.18);
      box-shadow:0 0 18px rgba(79,70,229,.22);
      position:relative;
    }

    .iconBtn.listening::after{
      content:"";
      position:absolute;
      inset:-7px;
      border-radius:18px;
      border:2px solid rgba(165,180,252,.55);
      animation:micPulse 1.15s ease-in-out infinite;
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.75; }
      50%{ transform:scale(1.08); opacity:.28; }
      100%{ transform:scale(.92); opacity:.75; }
    }

    .sendBtn{
      background:linear-gradient(135deg,#a5b4fc 0%,#6366f1 55%,#ec4899 100%);
      border:none;
    }

    .sendBtn svg{ stroke:#050510; }

    .sheetBackdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(6px);
      z-index:99990;
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
    }

    .sheetBackdrop.show{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      position:fixed;
      left:0; right:0; bottom:0;
      max-width:560px;
      margin:0 auto;
      z-index:99991;
      background:linear-gradient(180deg, rgba(21,22,38,.98), rgba(9,10,18,.99));
      border-top-left-radius:28px;
      border-top-right-radius:28px;
      border:1px solid rgba(255,255,255,.10);
      border-bottom:none;
      padding:12px 14px calc(14px + env(safe-area-inset-bottom));
      transform:translateY(110%);
      transition:.24s cubic-bezier(.2,.8,.2,1);
      box-shadow:0 -20px 60px rgba(0,0,0,.45);
    }

    .sheet.show{ transform:translateY(0); }

    .sheetHandle{
      width:48px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      margin:2px auto 12px;
    }

    .sheetTitle{
      font-family:"Space Grotesk",sans-serif;
      font-size:18px;
      font-weight:900;
      color:rgba(255,255,255,.94);
      margin:0 0 12px;
      text-align:center;
    }

    .sheetList{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sheetItem{
      min-height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 14px;
      cursor:pointer;
    }

    .sheetItem.active{
      border-color:rgba(165,180,252,.38);
      background:rgba(99,102,241,.14);
    }

    .sheetItemLabel{
      font-size:16px;
      font-weight:900;
      color:rgba(255,255,255,.95);
    }

    .sheetItemCheck{
      width:24px;
      height:24px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.35);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .sheetItem.active .sheetItemCheck{
      border-color:#9fe7ea;
    }

    .sheetItem.active .sheetItemCheck::after{
      content:"";
      width:10px;
      height:10px;
      border-radius:999px;
      background:#9fe7ea;
      box-shadow:0 0 10px rgba(159,231,234,.55);
    }

    .toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%) translateY(-120px);
      background:rgba(10,10,18,.92);
      border:1px solid rgba(165,180,252,.35);
      padding:10px 14px;
      border-radius:999px;
      color:#fff;
      z-index:999999;
      font-weight:900;
      font-size:12px;
      transition:.25s;
      backdrop-filter:blur(12px);
      pointer-events:none;
      max-width:min(92vw,520px);
      text-align:center;
    }

    .toast.show{ transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="pageContent">

    <div class="topCard">
      <div class="topRow">
        <h1 class="title">Interpreter</h1>
        <div class="statusPill" id="statusPill">Kulaklık önerilir</div>
      </div>

      <div class="langGrid">
        <div class="langBox">
          <div class="langLabel">BENİM DİLİM</div>
          <button class="langBtn" id="sourceLangBtn" type="button">
            <span class="langValue" id="sourceLangTxt">🇹🇷 Türkçe</span>
            <span>⌄</span>
          </button>
        </div>

        <div class="langBox">
          <div class="langLabel">KARŞI TARAF DİLİ</div>
          <button class="langBtn" id="targetLangBtn" type="button">
            <span class="langValue" id="targetLangTxt">🇬🇧 English</span>
            <span>⌄</span>
          </button>
        </div>
      </div>

      <div class="hint">
        Yazabilir veya konuşabilirsin. Çeviri gelen mesajların yanındaki hoparlöre basınca sesli okunur.
      </div>
    </div>

    <div class="chatWrap">
      <div class="chatArea" id="chatArea"></div>

      <div class="dock">
        <div class="dockInner">
          <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş..." spellcheck="false"></textarea>

          <button class="iconBtn" id="micBtn" type="button" aria-label="Mikrofon">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button class="sendBtn" id="sendBtn" type="button" aria-label="Gönder">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="sheetBackdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="optionSheet">
    <div class="sheetHandle"></div>
    <h3 class="sheetTitle" id="sheetTitle">Dil Seç</h3>
    <div class="sheetList" id="sheetList"></div>
  </div>

  <script type="module" src="/js/interpreter_live.js?v=pro1"></script>
</body>
</html>
