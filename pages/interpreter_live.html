<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Live Interpreter</title>

  <meta name="theme-color" content="#050508">
  <style>html,body{background:#050508!important;margin:0;padding:0}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --bg-dark:#050508;
      --panel:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.12);
      --muted:rgba(255,255,255,0.55);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 50% 20%, rgba(99,102,241,.18) 0%, transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(236,72,153,.18) 0%, transparent 35%),
        #050508;
    }

    body{
      min-height:100dvh;
    }

    .app{
      width:100%;
      height:100dvh;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
    }

    .half{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
      padding:12px 14px;
    }

    .half.top{
      padding-top:calc(12px + var(--safe-top));
      background:linear-gradient(180deg, rgba(236,72,153,.12) 0%, rgba(5,5,8,0) 100%);
    }

    .half.bottom{
      padding-bottom:calc(12px + var(--safe-bottom));
      background:linear-gradient(180deg, rgba(99,102,241,.12) 0%, rgba(5,5,8,0) 100%);
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      z-index:30;
    }

    .chip{
      min-height:42px;
      padding:0 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:13px;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    select.chip{
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }

    .speakBtn{
      cursor:pointer;
      user-select:none;
    }

    .speakBtn:active{
      transform:scale(.98);
    }

    .speakBtn.listening{
      box-shadow:0 0 0 3px rgba(99,102,241,.18), 0 0 24px rgba(99,102,241,.22);
      border-color:rgba(165,180,252,.5);
    }

    .transcript{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 4px;
    }

    .bubble{
      width:100%;
      max-width:880px;
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      justify-content:center;
    }

    .label{
      font-size:11px;
      font-weight:900;
      letter-spacing:1.2px;
      color:var(--muted);
      text-transform:uppercase;
    }

    .mainText{
      font-size:clamp(28px, 4.6vw, 54px);
      line-height:1.04;
      font-weight:900;
      letter-spacing:-0.6px;
      color:rgba(255,255,255,.96);
      max-width:92%;
      word-break:break-word;
    }

    .subText{
      font-size:clamp(14px, 2vw, 22px);
      line-height:1.2;
      font-weight:600;
      color:rgba(255,255,255,.62);
      max-width:88%;
      word-break:break-word;
    }

    .speakIcon{
      width:46px;
      height:46px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }

    .speakIcon:active{
      transform:scale(.97);
    }

    .speakIcon svg{
      width:20px;
      height:20px;
      fill:#fff;
      opacity:.95;
    }

    .centerHub{
      position:relative;
      height:112px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50;
      background:rgba(0,0,0,.44);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .hubBtn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      min-height:42px;
      padding:0 16px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      backdrop-filter:blur(10px);
    }

    .hubBtn:active{
      transform:translateY(-50%) scale(.98);
    }

    .hubBtn.home{ left:14px; }
    .hubBtn.clear{ right:14px; }

    .orb{
      width:96px;
      height:96px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      user-select:none;
    }

    .orbit{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:3px solid transparent;
      background:
        linear-gradient(#050508,#050508) padding-box,
        var(--ai-gradient) border-box;
      animation:spin 7s linear infinite;
    }

    .orbCore{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#090910;
      border:1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
      overflow:hidden;
      position:relative;
    }

    .logo{
      font-family:'Space Grotesk',sans-serif;
      font-size:17px;
      font-weight:700;
      color:#fff;
      letter-spacing:.2px;
    }

    .logo .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq{
      display:none;
      align-items:center;
      gap:3px;
      position:absolute;
      z-index:3;
    }

    .eq span{
      width:3px;
      border-radius:10px;
      background:var(--ai-gradient);
      animation:eq .8s infinite ease-in-out;
    }

    .eq span:nth-child(1){ animation-delay:0s; }
    .eq span:nth-child(2){ animation-delay:.15s; }
    .eq span:nth-child(3){ animation-delay:.3s; }

    body.listening-top .top .speakBtn,
    body.listening-bottom .bottom .speakBtn{
      box-shadow:0 0 0 3px rgba(99,102,241,.18), 0 0 24px rgba(99,102,241,.22);
      border-color:rgba(165,180,252,.5);
    }

    body.listening-top .eq,
    body.listening-bottom .eq,
    body.speaking .eq{
      display:flex;
    }

    body.listening-top .logo,
    body.listening-bottom .logo,
    body.speaking .logo{
      opacity:0;
    }

    .toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%) translateY(-120px);
      background:rgba(10,10,18,.94);
      border:1px solid rgba(165,180,252,.35);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      z-index:99999;
      font-size:12px;
      font-weight:900;
      transition:.25s;
      backdrop-filter:blur(12px);
      text-align:center;
      max-width:min(92vw,520px);
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @keyframes spin{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eq{
      0%,100%{ height:6px; opacity:.6; }
      50%{ height:24px; opacity:1; }
    }
  </style>
</head>

<body id="liveRoot">
  <div class="app">

    <!-- ÜST: KARŞI TARAFIN ÇEVİRİSİ -->
    <section class="half top">
      <div class="controls">
        <select class="chip" id="topLang"></select>
        <button class="chip speakBtn" id="topSpeakBtn" type="button">Konuşmayı Başlat</button>
      </div>

      <div class="transcript">
        <div class="bubble">
          <div class="label">Karşı Tarafın Çevirisi</div>
          <div class="mainText" id="topMainText">Çeviri burada görünecek.</div>
          <div class="subText" id="topSubText">Karşı taraf konuştuğunda canlı çeviri üst bölümde akacak.</div>
          <button class="speakIcon" id="topReplayBtn" type="button" aria-label="Tekrar dinlet">
            <svg viewBox="0 0 24 24">
              <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
              <path d="M16 8a4 4 0 0 1 0 8"></path>
              <path d="M19 5a8 8 0 0 1 0 14"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ORTA HUB -->
    <div class="centerHub">
      <button class="hubBtn home" id="goHomeBtn" type="button">ANA SAYFA</button>

      <div class="orb" id="centerOrb">
        <div class="orbit"></div>
        <div class="orbCore">
          <div class="eq" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="logo">italky<span class="ai">AI</span></div>
        </div>
      </div>

      <button class="hubBtn clear" id="clearBtn" type="button">TEMİZLE</button>
    </div>

    <!-- ALT: BENİM TARAFIM -->
    <section class="half bottom">
      <div class="controls">
        <select class="chip" id="bottomLang"></select>
        <button class="chip speakBtn" id="bottomSpeakBtn" type="button">Konuşmayı Başlat</button>
      </div>

      <div class="transcript">
        <div class="bubble">
          <div class="label">Benim Konuşmam</div>
          <div class="mainText" id="bottomMainText">Senin konuşman burada görünecek.</div>
          <div class="subText" id="bottomSubText">Sen konuştuğunda algılanan metin ve çeviri akışı burada gösterilecek.</div>
          <button class="speakIcon" id="bottomReplayBtn" type="button" aria-label="Tekrar dinlet">
            <svg viewBox="0 0 24 24">
              <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
              <path d="M16 8a4 4 0 0 1 0 8"></path>
              <path d="M19 5a8 8 0 0 1 0 14"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/js/live_interpreter_page.js?v=1"></script>
</body>
</html>
