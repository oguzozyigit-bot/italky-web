<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Interpreter Live</title>

  <meta name="theme-color" content="#000000">
  <style>
    html,body{
      background:#000 !important;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
  </style>

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --glass-border: rgba(255,255,255,.12);
      --glass-bg: rgba(255,255,255,.04);
      --ok: #34d399;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    #pageContent{
      min-height:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
      max-width:560px;
      margin:0 auto;
      background:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 36%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.11) 0%, rgba(0,0,0,0) 28%),
        #000;
    }

    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:10px;
      padding:8px 8px 4px;
    }

    .heroTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      color:#fff;
      margin:0;
      letter-spacing:-.8px;
    }

    .heroTitle .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .heroDesc{
      margin:0;
      font-size:12px;
      line-height:1.4;
      color:rgba(255,255,255,.55);
      max-width:420px;
    }

    .panel{
      background:var(--glass-bg);
      border:1px solid var(--glass-border);
      border-radius:28px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .panelTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:800;
      color:#fff;
      margin:0;
      letter-spacing:-.3px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .chip{
      min-height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:10px 12px;
      gap:3px;
    }

    .chipLabel{
      font-size:11px;
      font-weight:900;
      color:#a5b4fc;
      text-transform:uppercase;
      letter-spacing:.35px;
    }

    .chipValue{
      font-size:14px;
      font-weight:900;
      color:#fff;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      padding:11px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      font-size:12px;
      font-weight:800;
      color:#fff;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--bad);
      box-shadow:0 0 10px rgba(239,68,68,.6);
      flex:0 0 auto;
    }

    .dot.ok{
      background:var(--ok);
      box-shadow:0 0 10px rgba(52,211,153,.6);
    }

    .dot.warn{
      background:var(--warn);
      box-shadow:0 0 10px rgba(245,158,11,.6);
    }

    .orbWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:8px 0 6px;
    }

    .neural-orb{
      width:120px;
      height:120px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .ai-ring{
      position:absolute;
      inset:-4px;
      border-radius:50%;
      padding:2px;
      background:var(--ai-grad);
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
              mask-composite:exclude;
      animation:rotateOrb 15s linear infinite;
      opacity:.95;
    }

    .orbit-energy{
      position:absolute;
      inset:-12px;
      border-radius:50%;
      animation:rotateOrb 8s linear infinite;
    }

    .e-ball{
      position:absolute;
      width:11px;
      height:11px;
      border-radius:50%;
      filter:blur(1px);
    }

    .ball-l{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#1e3a8a;
      box-shadow:0 0 15px #1e3a8a;
    }

    .ball-b{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#801336;
      box-shadow:0 0 15px #801336;
    }

    .ai-core{
      width:84px;
      height:84px;
      background:#000;
      border-radius:50%;
      background-image:linear-gradient(#000,#000),var(--ai-grad);
      background-origin:border-box;
      background-clip:content-box,border-box;
      border:2px solid transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      animation:aiBreathe 4s infinite ease-in-out;
      z-index:10;
      position:relative;
      overflow:hidden;
    }

    .logoText{
      color:#fff;
      font-family:'Space Grotesk',sans-serif;
      font-size:15px;
      font-weight:700;
      letter-spacing:.5px;
    }

    .logoText .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #pageContent.is-listening .eq-wrap,
    #pageContent.is-translating .eq-wrap{
      opacity:1;
    }

    #pageContent.is-listening .logoText,
    #pageContent.is-translating .logoText{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-grad);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    .helper{
      text-align:center;
      font-size:12px;
      font-weight:900;
      line-height:1.4;
      min-height:18px;
      color:#fff;
    }

    .helper.ready{ color:var(--ok); }
    .helper.wait{ color:#ef4444; }
    .helper.live{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .micWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:4px 0 0;
    }

    .btnMic{
      width:84px;
      height:84px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-grad);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s ease;
      position:relative;
    }

    .btnMic svg{
      width:30px;
      height:30px;
    }

    .btnMic:active{
      transform:scale(.985);
    }

    .btnMic.listening{
      animation:micBreathe 1.1s infinite ease-in-out;
    }

    .btnMic.listening::after{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(52,211,153,.75);
      box-shadow:0 0 0 6px rgba(52,211,153,.10), 0 0 26px rgba(52,211,153,.32);
      animation:micPulse 1.2s infinite ease-out;
    }

    .conversation{
      display:flex;
      flex-direction:column;
      gap:12px;
      max-height:280px;
      overflow-y:auto;
      padding:4px 2px;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
    }

    .conversation::-webkit-scrollbar{ display:none; }

    .bubble{
      width:100%;
      display:flex;
      justify-content:center;
    }

    .bubbleInner{
      max-width:88%;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:11px 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      text-align:center;
      color:#fff;
      line-height:1.32;
    }

    .bubble.me .bubbleInner{
      background:rgba(99,102,241,.12);
    }

    .bubble.translated .bubbleInner{
      background:rgba(255,255,255,.06);
      font-size:18px;
      font-weight:700;
      opacity:.84;
    }

    .bubble.translated.is-latest .bubbleInner{
      font-size:28px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .spk{
      width:28px;
      height:28px;
      min-width:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .btnRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn{
      min-height:54px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.2px;
      transition:.18s ease;
    }

    .btn:active{
      transform:scale(.985);
    }

    .btnMain{
      background:var(--ai-grad);
      color:#050510;
    }

    .btnGhost{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }

    @keyframes rotateOrb{
      from{transform:rotate(0)}
      to{transform:rotate(360deg)}
    }

    @keyframes aiBreathe{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.05)}
    }

    @keyframes eqAnim{
      0%,100%{height:5px;opacity:.6}
      50%{height:24px;opacity:1}
    }

    @keyframes micBreathe{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.08)}
    }

    @keyframes micPulse{
      0%{transform:scale(.92);opacity:.95}
      70%{transform:scale(1.14);opacity:.15}
      100%{transform:scale(1.18);opacity:0}
    }
  </style>
</head>

<body>
<main id="pageContent">

  <section class="hero">
    <h1 class="heroTitle">Interpreter Live <span class="ai">AI</span></h1>
    <p class="heroDesc">
      Dokun, konuş, tekrar dokun ve çeviriyi kulaklıktan dinle.
      Canlı tercüman akışı burada başlar.
    </p>
  </section>

  <section class="panel">
    <h2 class="panelTitle">Oturum</h2>

    <div class="grid2">
      <div class="chip">
        <div class="chipLabel">Oda Kodu</div>
        <div class="chipValue mono" id="roomCodeView">------</div>
      </div>

      <div class="chip">
        <div class="chipLabel">Mod</div>
        <div class="chipValue" id="modeView">—</div>
      </div>
    </div>

    <div class="grid2">
      <div class="chip">
        <div class="chipLabel">Benim Dilim</div>
        <div class="chipValue" id="myLangView">—</div>
      </div>

      <div class="chip">
        <div class="chipLabel">Karşı Taraf</div>
        <div class="chipValue" id="peerLangView">—</div>
      </div>
    </div>

    <div class="status">
      <span class="dot" id="pairDot"></span>
      <span id="pairText">Canlı oturum hazırlanıyor...</span>
    </div>

    <div class="status">
      <span class="dot" id="headsetDot"></span>
      <span id="headsetText">Kulaklık kontrol ediliyor...</span>
    </div>
  </section>

  <section class="panel">
    <h2 class="panelTitle">Canlı Tercüme</h2>

    <div class="orbWrap">
      <div class="neural-orb">
        <div class="ai-ring"></div>
        <div class="orbit-energy">
          <div class="e-ball ball-l"></div>
          <div class="e-ball ball-b"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logoText">italky<span class="ai">AI</span></span>
        </div>
      </div>
    </div>

    <div class="helper ready" id="liveHelper">Konuşmak için mikrofona dokununuz.</div>

    <div class="micWrap">
      <button class="btnMic" id="liveMic" type="button" aria-label="Canlı mikrofon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
          <path d="M12 19v3"/>
        </svg>
      </button>
    </div>

    <div class="conversation" id="conversation"></div>

    <div class="btnRow">
      <button class="btn btnGhost" id="clearBtn" type="button">Temizle</button>
      <button class="btn btnMain" id="leaveBtn" type="button">Odadan Çık</button>
    </div>
  </section>

</main>

<script type="module" src="/js/interpreter_live.js"></script>
</body>
</html>
