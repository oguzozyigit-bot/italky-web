<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Interpreter Live</title>

  <meta name="theme-color" content="#000000">
  <style>
    html,body{
      background:#000 !important;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
  </style>

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --glass-border: rgba(255,255,255,.12);
      --glass-bg: rgba(255,255,255,.04);
      --ok:#34d399;
      --warn:#f59e0b;
      --bad:#ef4444;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    #pageContent{
      min-height:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
      max-width:560px;
      margin:0 auto;
      background:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 36%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.11) 0%, rgba(0,0,0,0) 28%),
        #000;
    }

    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:10px;
      padding:8px 8px 4px;
    }

    .heroTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      color:#fff;
      margin:0;
      letter-spacing:-.8px;
    }

    .heroTitle .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .heroDesc{
      margin:0;
      font-size:12px;
      line-height:1.4;
      color:rgba(255,255,255,.55);
      max-width:420px;
    }

    .panel{
      background:var(--glass-bg);
      border:1px solid var(--glass-border);
      border-radius:28px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .chip{
      min-height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:10px 12px;
      gap:3px;
    }

    .chipLabel{
      font-size:11px;
      font-weight:900;
      color:#a5b4fc;
      text-transform:uppercase;
      letter-spacing:.35px;
    }

    .chipValue{
      font-size:14px;
      font-weight:900;
      color:#fff;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      padding:11px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      font-size:12px;
      font-weight:800;
      color:#fff;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--bad);
      box-shadow:0 0 10px rgba(239,68,68,.6);
      flex:0 0 auto;
    }

    .dot.ok{
      background:var(--ok);
      box-shadow:0 0 10px rgba(52,211,153,.6);
    }

    .dot.warn{
      background:var(--warn);
      box-shadow:0 0 10px rgba(245,158,11,.6);
    }

    .helper{
      text-align:center;
      font-size:12px;
      font-weight:900;
      line-height:1.4;
      min-height:18px;
      color:#fff;
    }

    .helper.ready{ color:var(--ok); }
    .helper.wait{ color:#ef4444; }
    .helper.live{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .micWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:4px 0 0;
    }

    .btnMic{
      width:84px;
      height:84px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-grad);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s ease;
      position:relative;
    }

    .btnMic svg{
      width:30px;
      height:30px;
    }

    .btnMic:active{ transform:scale(.985); }

    .btnMic.listening{
      animation:micBreathe 1.1s infinite ease-in-out;
    }

    .btnMic.listening::after{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(52,211,153,.75);
      box-shadow:0 0 0 6px rgba(52,211,153,.10), 0 0 26px rgba(52,211,153,.32);
      animation:micPulse 1.2s infinite ease-out;
    }

    .conversation{
      display:flex;
      flex-direction:column;
      gap:12px;
      max-height:290px;
      overflow-y:auto;
      padding:4px 2px;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
    }

    .conversation::-webkit-scrollbar{ display:none; }

    .bubble{
      width:100%;
      display:flex;
      justify-content:center;
    }

    .bubbleInner{
      max-width:92%;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      padding:11px 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      text-align:left;
      color:#fff;
      line-height:1.32;
    }

    .bubble.me .bubbleInner{
      background:rgba(99,102,241,.12);
    }

    .bubble.translated .bubbleInner{
      background:rgba(255,255,255,.06);
      font-size:18px;
      font-weight:700;
      opacity:.84;
    }

    .bubble.translated.is-latest .bubbleInner{
      font-size:28px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .spk{
      width:28px;
      height:28px;
      min-width:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .composer{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:10px;
      align-items:end;
    }

    .input{
      min-height:56px;
      max-height:120px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      padding:15px 16px;
      font-size:14px;
      resize:none;
      font-family:'Outfit',sans-serif;
    }

    .btn{
      min-height:54px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.2px;
      transition:.18s ease;
      padding:0 18px;
    }

    .btn:active{ transform:scale(.985); }

    .btnMain{
      background:var(--ai-grad);
      color:#050510;
    }

    .btnGhost{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }

    .bottomRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    @keyframes micBreathe{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.08)}
    }

    @keyframes micPulse{
      0%{transform:scale(.92);opacity:.95}
      70%{transform:scale(1.14);opacity:.15}
      100%{transform:scale(1.18);opacity:0}
    }
  </style>
</head>

<body>
<main id="pageContent">

  <section class="hero">
    <h1 class="heroTitle">Interpreter Live <span class="ai">AI</span></h1>
    <p class="heroDesc">
      İstersen mikrofonla konuş, istersen yazarak anlaş. Gelen çeviri hem yazı olarak görünür hem sesli dinlenebilir.
    </p>
  </section>

  <section class="panel">
    <div class="grid2">
      <div class="chip">
        <div class="chipLabel">Benim Dilim</div>
        <div class="chipValue" id="myLangView">—</div>
      </div>
      <div class="chip">
        <div class="chipLabel">Karşı Taraf</div>
        <div class="chipValue" id="peerLangView">—</div>
      </div>
    </div>

    <div class="status">
      <span class="dot ok" id="pairDot"></span>
      <span id="pairText">Bağlantı aktif. Canlı tercüman hazır.</span>
    </div>

    <div class="status">
      <span class="dot" id="headsetDot"></span>
      <span id="headsetText">Kulaklık kontrol ediliyor...</span>
    </div>
  </section>

  <section class="panel">
    <div class="helper ready" id="liveHelper">Konuşmak için mikrofona dokununuz.</div>

    <div class="micWrap">
      <button class="btnMic" id="liveMic" type="button" aria-label="Canlı mikrofon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
          <path d="M12 19v3"/>
        </svg>
      </button>
    </div>

    <div class="conversation" id="conversation"></div>

    <div class="composer">
      <textarea id="textInput" class="input" rows="1" placeholder="Mesaj yazın..."></textarea>
      <button class="btn btnGhost" id="clearBtn" type="button">Temizle</button>
      <button class="btn btnMain" id="sendBtn" type="button">Gönder</button>
    </div>

    <div class="bottomRow">
      <button class="btn btnGhost" id="leaveBtn" type="button">Çıkış</button>
      <button class="btn btnMain" id="replayLastBtn" type="button">Son Çeviriyi Dinle</button>
    </div>
  </section>

</main>

<script type="module" src="/js/interpreter_live.js"></script>
</body>
</html>
