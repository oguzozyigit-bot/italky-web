<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Live Interpreter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#c4b5fd,#818cf8,#f9a8d4);
      --bg:#06070c;
      --border:rgba(255,255,255,0.14);
      --panel:rgba(255,255,255,0.06);
      --panel-strong:rgba(255,255,255,0.08);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --muted:rgba(255,255,255,0.56);
      --soft-blue:rgba(129,140,248,0.16);
      --soft-pink:rgba(249,168,212,0.16);
      --soft-green:rgba(74,222,128,0.16);
      --danger:rgba(248,113,113,0.95);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at 20% 20%, rgba(129,140,248,.11), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(249,168,212,.10), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(74,222,128,.07), transparent 28%),
        #06070c;
    }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:calc(12px + var(--safe-top)) 14px calc(12px + var(--safe-bottom));
      overflow:hidden;
    }

    .half-screen.top{
      background:linear-gradient(180deg, rgba(249,168,212,0.12), rgba(6,7,12,0.0) 55%, rgba(6,7,12,0.65));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(129,140,248,0.12), rgba(6,7,12,0.0) 55%, rgba(6,7,12,0.65));
    }

    .top-tools,
    .bottom-tools{
      width:100%;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:10px;
      z-index:40;
    }

    .lang-trigger,
    .voice-trigger,
    .mute-btn,
    .type-btn{
      min-height:44px;
      padding:10px 16px;
      border-radius:999px;
      color:#fff;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      font-size:12px;
      font-weight:900;
      letter-spacing:.15px;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      max-width:92%;
    }

    .mute-btn.active{
      border-color:rgba(248,113,113,.45);
      color:#ffd2d2;
      background:rgba(248,113,113,.10);
    }

    .type-btn{
      background:rgba(129,140,248,0.10);
      border-color:rgba(129,140,248,.25);
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0d0f16;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:5000;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
      pointer-events:auto;
    }

    .popover.show{ display:flex; }

    .half-screen.top .popover{ top:66px; }
    .half-screen.bottom .popover{ bottom:66px; }

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      letter-spacing:.3px;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      user-select:none;
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
      pointer-events:auto;
    }

    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
      user-select:none;
    }

    .pop-item:hover{ background:rgba(255,255,255,.05); }

    .pop-item.active{
      background:rgba(129,140,248,.14);
      border-color:rgba(129,140,248,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{ font-size:18px; }

    .pop-name{
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .pop-code{
      font-weight:900;
      font-size:12px;
      opacity:.7;
    }

    .stream-wrap{
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding:14px 0 8px;
    }

    .stream-box{
      width:100%;
      max-width:920px;
      height:100%;
      background:linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      border:1px solid rgba(255,255,255,.08);
      border-radius:30px;
      padding:18px 14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      overflow:hidden;
    }

    .stream-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .stream-title{
      font-size:11px;
      font-weight:1000;
      letter-spacing:1.3px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .stream-badge{
      font-size:10px;
      font-weight:1000;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.78);
    }

    .chat-body{
      flex:1;
      min-height:0;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      padding:8px 0 6px;
      mask-image:linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      width:100%;
      display:flex;
      justify-content:center;
      text-align:center;
      word-break:break-word;
      transition:.18s;
    }

    .bubble.them .txt{
      max-width:86%;
      font-size:18px;
      font-weight:550;
      line-height:1.18;
      color:rgba(255,255,255,.58);
    }

    .bubble.me .txt{
      max-width:88%;
      font-size:21px;
      font-weight:700;
      line-height:1.14;
      color:rgba(255,255,255,.82);
    }

    .bubble.me.is-latest .txt{
      max-width:92%;
      font-size:34px;
      font-weight:900;
      line-height:1.05;
      letter-spacing:-0.35px;
      color:rgba(255,255,255,.98);
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .spk-icon{
      width:34px;
      height:34px;
      min-width:34px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk-icon svg{
      width:15px;
      height:15px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .write-box{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:4px;
    }

    .write-label{
      font-size:11px;
      font-weight:1000;
      letter-spacing:1px;
      color:rgba(255,255,255,.52);
      text-transform:uppercase;
      text-align:center;
    }

    .write-row{
      display:flex;
      gap:8px;
      align-items:stretch;
      width:100%;
    }

    .write-input{
      flex:1;
      min-height:52px;
      max-height:120px;
      resize:none;
      border:none;
      border-radius:18px;
      padding:14px 14px;
      font-size:15px;
      font-weight:700;
      color:#fff;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-family:Outfit,sans-serif;
    }

    .write-send{
      min-width:92px;
      border:none;
      border-radius:18px;
      font-size:12px;
      font-weight:1000;
      color:#080912;
      background:var(--ai-gradient);
      cursor:pointer;
      padding:0 14px;
    }

    .write-send:active{
      transform:scale(.98);
    }

    .mic-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding-top:8px;
      z-index:30;
    }

    .btn-mic{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-gradient);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
    }

    .btn-mic svg{
      width:28px;
      height:28px;
    }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(74,222,128,.85);
      box-shadow:0 0 0 6px rgba(74,222,128,.10), 0 0 28px rgba(74,222,128,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.3;
      letter-spacing:.12px;
      min-height:18px;
      user-select:none;
      max-width:280px;
      width:100%;
      display:block;
    }

    .helper-ready{
      color:#4ade80;
      text-shadow:0 0 12px rgba(74,222,128,.24);
    }

    .helper-wait{
      color:#f87171;
      text-shadow:0 0 12px rgba(248,113,113,.24);
    }

    .helper-repeat{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
    }

    .center-hub{
      height:116px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter:blur(15px);
      z-index:650;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:100px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:100px;
      height:100px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#818cf8;
      box-shadow:0 0 15px #818cf8;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#f9a8d4;
      box-shadow:0 0 15px #f9a8d4;
    }

    .ai-core{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.5px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #frameRoot.is-listening .eq-wrap,
    #frameRoot.is-translating .eq-wrap{
      opacity:1;
    }

    #frameRoot.is-listening .logo-text,
    #frameRoot.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-gradient);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    #frameRoot.is-idle .ball-1,
    #frameRoot.is-idle .ball-2,
    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background:#f87171;
      box-shadow:0 0 18px rgba(248,113,113,.9);
    }

    #frameRoot.is-listening .ball-1,
    #frameRoot.is-translating .ball-1{
      background:#818cf8;
      box-shadow:0 0 18px rgba(129,140,248,.95);
    }

    #frameRoot.is-listening .ball-2,
    #frameRoot.is-translating .ball-2{
      background:#f9a8d4;
      box-shadow:0 0 18px rgba(249,168,212,.95);
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background:#4ade80;
      box-shadow:0 0 18px rgba(74,222,128,.9);
    }

    .toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%) translateY(-120px);
      background:rgba(10,10,18,.94);
      border:1px solid rgba(196,181,253,.35);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      z-index:99999;
      font-size:12px;
      font-weight:900;
      transition:.25s;
      backdrop-filter:blur(12px);
      text-align:center;
      max-width:min(92vw,520px);
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(129,140,248,.35); }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }
  </style>
</head>

<body id="frameRoot" class="is-ready">
  <div class="container">

    <!-- ÜST ALAN -->
    <div class="half-screen top" id="topSection">
      <div class="top-tools">
        <button class="lang-trigger" id="topLangBtn" type="button">
          <span id="topLangTxt">🇬🇧 English</span> ⌵
        </button>

        <button class="voice-trigger" id="topVoiceBtn" type="button">
          Kadın Ses ⌵
        </button>

        <button class="mute-btn" id="topMuteBtn" type="button">
          Mute
        </button>
      </div>

      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi">
        <div class="pop-head">
          <div>ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="popover" id="voice-pop-top" role="dialog" aria-label="Üst ses seçimi">
        <div class="pop-head">
          <div>ÜST SES</div>
          <div class="pop-close" id="close-voice-top">✕</div>
        </div>
        <div class="pop-list" id="voice-list-top"></div>
      </div>

      <div class="stream-wrap">
        <div class="stream-box">
          <div class="stream-head">
            <div class="stream-title">Karşı Taraftan Gelen Çeviri</div>
            <div class="stream-badge">Canlı Akış</div>
          </div>

          <div class="chat-body" id="topBody"></div>

          <div class="write-box">
            <div class="write-label">Kalabalık ortam için yazıyla çeviri</div>
            <div class="write-row">
              <textarea class="write-input" id="topWriteInput" placeholder="İstersen metin yaz, çeviriye gönder..."></textarea>
              <button class="write-send" id="topWriteSend" type="button">Gönder</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mic-wrap">
        <div class="btn-mic" id="topMic" aria-label="Üst mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </div>
        <div class="helper-text helper-ready" id="topHelper">Karşı taraf için dinlemeye hazır</div>
      </div>
    </div>

    <!-- ORTA HUB -->
    <div class="center-hub">
      <div class="nav-btn btn-home" id="homeLink">ANA SAYFA</div>

      <div class="orb-container" id="homeBtn" title="Ana sayfa">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
    </div>

    <!-- ALT ALAN -->
    <div class="half-screen bottom" id="botSection">
      <div class="bottom-tools">
        <button class="lang-trigger" id="botLangBtn" type="button">
          <span id="botLangTxt">🇹🇷 Türkçe</span> ⌵
        </button>

        <button class="voice-trigger" id="botVoiceBtn" type="button">
          Erkek Ses ⌵
        </button>

        <button class="mute-btn" id="botMuteBtn" type="button">
          Mute
        </button>
      </div>

      <div class="popover" id="pop-bot" role="dialog" aria-label="Alt dil seçimi">
        <div class="pop-head">
          <div>ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="popover" id="voice-pop-bot" role="dialog" aria-label="Alt ses seçimi">
        <div class="pop-head">
          <div>ALT SES</div>
          <div class="pop-close" id="close-voice-bot">✕</div>
        </div>
        <div class="pop-list" id="voice-list-bot"></div>
      </div>

      <div class="stream-wrap">
        <div class="stream-box">
          <div class="stream-head">
            <div class="stream-title">Benim Konuşmam ve Çeviri Akışım</div>
            <div class="stream-badge">Kendi Tarafım</div>
          </div>

          <div class="chat-body" id="botBody"></div>

          <div class="write-box">
            <div class="write-label">Kalabalık ortam için yazıyla çeviri</div>
            <div class="write-row">
              <textarea class="write-input" id="botWriteInput" placeholder="Metin yaz, çeviriye gönder..."></textarea>
              <button class="write-send" id="botWriteSend" type="button">Gönder</button>
            </div>
          </div>
        </div>
      </div>
