<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Interpreter Live</title>

<meta name="theme-color" content="#050510"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --ai-grad:linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --txt:rgba(255,255,255,.95);
  --muted:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.05);
  --glass2:rgba(255,255,255,.03);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Outfit',sans-serif;
  background:
    radial-gradient(circle at 50% 12%, rgba(99,102,241,.16) 0%, rgba(0,0,0,0) 26%),
    radial-gradient(circle at 50% 0%, rgba(236,72,153,.09) 0%, rgba(0,0,0,0) 18%),
    linear-gradient(180deg,#090919 0%, #020207 100%);
  color:var(--txt);
}

.page{
  width:100%;
  height:100%;
  max-width:560px;
  margin:0 auto;
  padding:
    calc(var(--headerH,72px) + env(safe-area-inset-top) + 10px)
    12px
    calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 10px);
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
}

.topTools{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:8px;
  align-items:center;
}

.langSelect{
  min-width:0;
  width:100%;
  min-height:44px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.22);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:900;
  padding:0 12px;
  appearance:none;
}

.miniBtn{
  min-width:44px;
  min-height:44px;
  padding:0 12px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.miniBtn.active{
  background:rgba(236,72,153,.16);
  border-color:rgba(236,72,153,.30);
}

.statusBar{
  flex:0 0 auto;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  background:var(--glass2);
  font-size:12px;
  font-weight:900;
}

.statusLeft{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#f59e0b;
  box-shadow:0 0 10px rgba(245,158,11,.55);
  flex:0 0 auto;
}
.dot.ok{
  background:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,.55);
}

.statusText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:6px 2px 4px;
  scrollbar-width:none;
}
.chat::-webkit-scrollbar{ display:none; }

.bubble{
  max-width:88%;
  padding:12px 14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:var(--glass);
  backdrop-filter:blur(18px);
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 10px 22px rgba(0,0,0,.18);
}

.bubble.me{
  align-self:flex-end;
  background:rgba(236,72,153,.10);
  border-right:4px solid rgba(236,72,153,.55);
}

.bubble.them{
  align-self:flex-start;
  background:rgba(99,102,241,.10);
  border-left:4px solid rgba(99,102,241,.55);
}

.bubble.meta{
  align-self:center;
  max-width:94%;
  background:rgba(255,255,255,.04);
  font-size:12px;
  color:rgba(255,255,255,.72);
  text-align:center;
}

.bubbleRow{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.bubbleTxt{
  flex:1 1 auto;
  min-width:0;
}

.spkBtn{
  width:28px;
  height:28px;
  min-width:28px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.06);
  cursor:pointer;
  flex:0 0 auto;
}

.spkBtn svg{
  width:15px;
  height:15px;
  stroke:rgba(255,255,255,.88);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.inputDock{
  flex:0 0 auto;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  padding:8px;
}

.dockInner{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.msgInput{
  flex:1 1 auto;
  min-width:0;
  max-height:120px;
  resize:none;
  border:none;
  background:transparent;
  color:#fff;
  font-family:inherit;
  font-size:14px;
  line-height:18px;
  padding:10px 6px;
  overflow:auto;
}
.msgInput::placeholder{
  color:rgba(255,255,255,.40);
}
.msgInput::-webkit-scrollbar{ display:none; }

.iconBtn, .sendBtn{
  width:44px;
  height:44px;
  min-width:44px;
  border:none;
  border-radius:16px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.iconBtn svg, .sendBtn svg{
  width:20px;
  height:20px;
  stroke:rgba(255,255,255,.88);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.iconBtn.listening{
  background:rgba(99,102,241,.18);
  border-color:rgba(99,102,241,.34);
  box-shadow:0 0 18px rgba(99,102,241,.18);
}

.sendBtn{
  background:var(--ai-grad);
}
.sendBtn svg{
  stroke:#050510;
}

.toast{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:rgba(12,12,22,.96);
  border:1px solid rgba(165,180,252,.28);
  color:#fff;
  font-size:12px;
  font-weight:900;
  padding:10px 14px;
  border-radius:999px;
  z-index:9999;
  transition:.24s ease;
  pointer-events:none;
  max-width:min(92vw,480px);
  text-align:center;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>
<div class="page">

  <section class="topTools">
    <select class="langSelect" id="myLang"></select>
    <button class="miniBtn" id="muteBtn" type="button" aria-label="Mute">🔇</button>
    <button class="miniBtn" id="clearBtn" type="button" aria-label="Sohbeti Sil">🗑</button>
    <button class="miniBtn" id="leaveBtn" type="button" aria-label="Çık">✕</button>
  </section>

  <section class="statusBar">
    <div class="statusLeft">
      <span class="dot" id="peerDot"></span>
      <span class="statusText" id="statusText">Karşı taraf bekleniyor...</span>
    </div>
    <div id="peerLangText">—</div>
  </section>

  <section class="chat" id="chat"></section>

  <section class="inputDock">
    <div class="dockInner">
      <textarea id="msgInput" class="msgInput" rows="1" placeholder="Mesaj yaz ya da mikrofona bas..." spellcheck="false"></textarea>

      <button class="iconBtn" id="micBtn" type="button" aria-label="Mikrofon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button class="sendBtn" id="sendBtn" type="button" aria-label="Gönder">
        <svg viewBox="0 0 24 24">
          <path d="M22 2L11 13"></path>
          <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
        </svg>
      </button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="/js/interpreter_live.js?v=live_chat_final_2"></script>
</body>
</html>
