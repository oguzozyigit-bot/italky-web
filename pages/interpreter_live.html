<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Interpreter Live Pro</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --frameW: min(480px, calc(100vw - 18px));
      --topH: 92px;
      --footerH: 74px;
      --dockH: 88px;

      --bg:#030014;
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.58);
      --border: rgba(255,255,255,.10);

      --ai1:#A5B4FC;
      --ai2:#4F46E5;
      --ai3:#EC4899;

      --ok:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;

      --card: rgba(0,0,0,.18);
      --glass: rgba(255,255,255,.04);
      --glass2: rgba(255,255,255,.06);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100dvh;
      overflow:hidden;
      position:fixed;
      font-family:'Outfit', sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .cosmos-bg{
      position:absolute;
      inset:-50%;
      width:200%;
      height:200%;
      background:var(--bg);
      z-index:0;
      pointer-events:none;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter: blur(90px);
      opacity:.28;
      animation: floatOrbit 30s infinite alternate ease-in-out;
    }

    .orb-1{
      top:10%;
      left:10%;
      width:60vw;
      height:60vw;
      background: radial-gradient(circle, rgba(79,70,229,.55), transparent 70%);
    }

    .orb-2{
      bottom:10%;
      right:10%;
      width:50vw;
      height:50vw;
      background: radial-gradient(circle, rgba(165,180,252,.45), transparent 70%);
      animation-delay:-5s;
    }

    @keyframes floatOrbit{
      0%{ transform: translate(0,0) scale(1); }
      100%{ transform: translate(10%,-10%) scale(1.1); }
    }

    .noise{
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none;
      mix-blend-mode:overlay;
      z-index:1;
    }

    .mobile-frame{
      width:100%;
      max-width:480px;
      height:100%;
      position:relative;
      z-index:10;
      background: rgba(8, 8, 20, 0.68);
      backdrop-filter: blur(26px);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    @media(min-width:520px){
      .mobile-frame{
        height:92vh;
        border-radius:40px;
        border:1px solid rgba(255,255,255,0.08);
        box-shadow:0 40px 100px -20px rgba(0,0,0,0.9);
      }
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 3000;
      min-height: var(--topH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.34);
      backdrop-filter: blur(12px);
    }

    .leftControls{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .backBtn{
      width:44px;
      height:44px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color:#fff;
      font-size:20px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      flex:0 0 auto;
    }

    .backBtn:active{ transform: scale(.96); }

    .mini-brand{
      display:flex;
      flex-direction:column;
      user-select:none;
      cursor:pointer;
      line-height:1;
      margin-top: 2px;
    }

    .logo-line{
      font-family:'Space Grotesk', sans-serif;
      font-size: 20px;
      letter-spacing: -0.4px;
      display:flex;
      align-items:flex-end;
      gap:2px;
    }

    .logo-main{ font-weight:700; color:#FFFFFF; }

    .logo-ai{
      font-weight:700;
      background: linear-gradient(135deg, var(--ai1) 0%, var(--ai2) 70%, var(--ai3) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .logo-slogan{
      font-family:'Outfit', sans-serif;
      font-size:10px;
      font-weight:700;
      letter-spacing: 4px;
      color: rgba(255,255,255,.32);
      margin-top: 5px;
      padding-left: 2px;
      text-transform: uppercase;
    }

    .rightControls{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .miniStatus{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      max-width: 210px;
    }

    .langRow{
      font-weight:900;
      font-size:12px;
      color:rgba(255,255,255,.94);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .liveState{
      font-weight:800;
      font-size:11px;
      color: rgba(255,255,255,.64);
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .liveDot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--ok);
      box-shadow:0 0 10px rgba(34,197,94,.45);
      flex:0 0 auto;
    }

    .chatHeaderNote{
      text-align:center;
      font-size:12px;
      font-weight:800;
      color: rgba(255,255,255,0.58);
      padding: 8px 16px 6px;
      user-select:none;
    }

    .chat-area{
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--topH) + 22px);
      bottom: calc(var(--dockH) + var(--footerH));
      padding: 14px 12px;
      overflow-y:auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      min-width:0;
    }

    .chat-area::-webkit-scrollbar{ display:none; }
    .chat-area::before{ content:""; flex:1 0 auto; }

    .bubble{
      max-width:90%;
      display:flex;
    }

    .bubble.user{
      align-self:flex-end;
      justify-content:flex-end;
    }

    .bubble.bot{
      align-self:flex-start;
      justify-content:flex-start;
    }

    .bubble.meta{
      align-self:center;
      max-width:94%;
      justify-content:center;
    }

    .bubble-inner{
      padding:11px 14px;
      border-radius:20px;
      font-size:14px;
      line-height:1.46;
      border:1px solid rgba(255,255,255,.10);
      background: var(--card);
      box-shadow: 0 12px 28px rgba(0,0,0,.22);
      backdrop-filter: blur(8px);
      white-space: pre-wrap;
      word-break: break-word;
      display:flex;
      align-items:flex-start;
      gap:8px;
      width:100%;
    }

    .bubble.bot .bubble-inner{
      border-left:4px solid var(--ai2);
      background: rgba(79,70,229,.12);
    }

    .bubble.user .bubble-inner{
      border-right:4px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
    }

    .bubble.meta .bubble-inner{
      opacity:.94;
      background: rgba(255,255,255,.04);
      border-color: rgba(255,255,255,.08);
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,.72);
      text-align:center;
      justify-content:center;
    }

    .bubble.latest-bot .bubble-inner{
      background: linear-gradient(180deg, rgba(79,70,229,.16), rgba(79,70,229,.11));
      border-left-color: #a5b4fc;
    }

    .translated-text{
      font-size:16px;
      font-weight:800;
      line-height:1.38;
    }

    .bubble.latest-bot .translated-text{
      font-size:20px;
      font-weight:900;
      line-height:1.34;
    }

    .original-text{
      display:block;
      margin-bottom:6px;
      font-size:12px;
      color:rgba(255,255,255,.62);
      font-weight:700;
    }

    .user-text{
      font-size:15px;
      font-weight:700;
      line-height:1.42;
    }

    .spk-btn{
      width:28px;
      height:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
      margin-top:1px;
    }

    .spk-btn svg{
      width:14px;
      height:14px;
      stroke: rgba(255,255,255,.92);
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .text-block{
      flex:1;
      min-width:0;
    }

    .input-dock{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--frameW);
      bottom: var(--footerH);
      z-index: 2600;
      padding: 10px 12px;
      background: rgba(0,0,0,.32);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .dock-inner{
      pointer-events:auto;
      width:100%;
      min-height:56px;
      display:flex;
      align-items:flex-end;
      gap:8px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 26px;
      padding: 8px;
    }

    #msgInput{
      flex: 1 1 auto;
      min-width:0;
      background: transparent;
      border:none;
      outline:none;
      color:#fff;
      font-size:14px;
      padding:10px 6px;
      line-height:18px;
      font-family:inherit;
      resize:none;
      white-space:normal;
      overflow:hidden;
      max-height: 120px;
    }

    #msgInput::placeholder{ color: rgba(255,255,255,.42); }

    .icon-btn, .send-btn{
      width:42px;
      height:42px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      flex-shrink:0;
    }

    .icon-btn svg, .send-btn svg{
      width:21px;
      height:21px;
      stroke: rgba(255,255,255,.88);
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.95;
    }

    .icon-btn.listening{
      border-color: rgba(79,70,229,.45);
      background: rgba(79,70,229,.16);
      box-shadow: 0 0 18px rgba(79,70,229,.20);
      position: relative;
    }

    .icon-btn.listening::after{
      content:"";
      position:absolute;
      inset:-7px;
      border-radius: 18px;
      border: 2px solid rgba(165,180,252,.55);
      animation: micPulse 1.15s ease-in-out infinite;
    }

    @keyframes micPulse{
      0%{ transform: scale(0.92); opacity:.75; }
      50%{ transform: scale(1.08); opacity:.28; }
      100%{ transform: scale(0.92); opacity:.75; }
    }

    .send-btn{
      border-color: rgba(165,180,252,.32);
      background: linear-gradient(135deg, rgba(165,180,252,.24), rgba(236,72,153,.20));
      box-shadow: 0 10px 18px rgba(0,0,0,.30);
    }

    .footerbar{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--frameW);
      bottom: 0;
      z-index: 2400;
      height: var(--footerH);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(3, 0, 20, 0.95);
      border-top: 1px solid rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 6px;
    }

    .links{
      display:flex;
      gap: 16px;
      justify-content:center;
      flex-wrap:wrap;
      line-height:1;
    }

    .links a{
      color: rgba(255,255,255,0.55);
      text-decoration:none;
      font-size: 12px;
      font-weight: 800;
      transition:.2s;
    }

    .links a:active{ opacity:.85; }

    .footerBrand{
      text-align:center;
      font-size: 10px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.2px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="cosmos-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="noise"></div>

  <div class="mobile-frame">

    <div class="topbar">
      <div class="leftControls">
        <button class="backBtn" id="backBtn" aria-label="Geri">←</button>

        <div class="mini-brand" id="logoHome" title="Ana sayfa">
          <div class="logo-line">
            <span class="logo-main">italky</span><span class="logo-ai">AI</span>
          </div>
          <div class="logo-slogan">INTERPRETER PRO</div>
        </div>
      </div>

      <div class="rightControls">
        <div class="miniStatus">
          <div class="langRow" id="langPair">—</div>
          <div class="liveState"><span class="liveDot" id="liveDot"></span><span id="liveText">Hazır</span></div>
        </div>
      </div>
    </div>

    <div class="chatHeaderNote" id="helperText">Yaz veya konuş. Çeviri aşağıda canlı akacaktır.</div>

    <div class="chat-area" id="chat"></div>

    <div class="input-dock">
      <div class="dock-inner">
        <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş…" spellcheck="false"></textarea>

        <button class="icon-btn" id="micBtn" aria-label="Mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <button class="send-btn" id="sendBtn" aria-label="Gönder">
          <svg viewBox="0 0 24 24">
            <path d="M22 2L11 13"></path>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="footerbar">
      <div class="links">
        <a href="/pages/about.html">Hakkında</a>
        <a href="/pages/faq.html">SSS</a>
        <a href="/pages/privacy.html">Gizlilik</a>
        <a href="/pages/contact.html">İletişim</a>
      </div>
      <div class="footerBrand">italkyAI By Ozyigit’s 2026</div>
    </div>

  </div>

  <script type="module" src="/js/interpreter_live.js?v=pro_chat_2"></script>
</body>
</html>
