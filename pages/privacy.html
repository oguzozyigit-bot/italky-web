<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Gizlilik</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon: #00f2ff;
      --pink: #ff007a;
      --ai-grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 50%, #ff007a 100%);
      --bg: #060408;
      --glass: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; }

    /* --- CANLI ARKA PLAN (italkyAI DNA) --- */
    .bg-layer {
      position: fixed; inset: 0; z-index: 1;
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.18) 0%, transparent 40%),
        linear-gradient(180deg, #0f0816 0%, #060408 100%);
    }

    .crystal-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      perspective: 1200px; pointer-events: none; z-index: 2;
    }

    .crystal-cage {
      width: 320px; height: 320px; transform-style: preserve-3d;
      animation: rotateCrystal 22s linear infinite; opacity: 0.18;
    }

    .side {
      position: absolute; inset: 0; border: 1.5px solid var(--neon);
      background: radial-gradient(circle, rgba(0, 242, 255, 0.08), transparent);
    }
    .s1{ transform:rotateY(0deg) translateZ(160px); }
    .s2{ transform:rotateY(90deg) translateZ(160px); }
    .s3{ transform:rotateX(90deg) translateZ(160px); }

    @keyframes rotateCrystal {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(720deg); }
    }

    /* --- MOBILE FRAME & CONTENT --- */
    .mobile-frame {
      width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto;
      position: relative; z-index: 10; display: flex; flex-direction: column;
    }

    .top-nav {
      display: flex; align-items: center; gap: 15px; padding: 20px;
      position: sticky; top: 0; z-index: 30; background: transparent;
    }

    .btn-back {
      background: transparent; border: none; color: #fff; font-size: 26px;
      font-weight: 900; cursor: pointer; display: flex; align-items: center;
    }
    .btn-back:hover { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

    .brand {
      font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 800;
      background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .page-content {
      flex: 1; overflow-y: auto; padding: 0 20px 140px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .page-content::-webkit-scrollbar { display: none; }

    /* --- PRIVACY COMPONENTS --- */
    .privacy-card {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 32px; padding: 35px 25px; backdrop-filter: blur(25px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      animation: cardIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 800; margin: 0 0 15px; letter-spacing: -1.5px; }
    h1 span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .intro { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 30px; border-left: 2px solid var(--neon); padding-left: 15px; font-style: italic; }

    .section { margin-bottom: 30px; }
    h3 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 900; color: var(--neon); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    h3::before { content: ""; width: 8px; height: 8px; background: var(--pink); border-radius: 50%; box-shadow: 0 0 10px var(--pink); }

    p { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.7; margin-bottom: 12px; }
    ul { padding: 0; list-style: none; margin-bottom: 15px; }
    li { position: relative; padding-left: 20px; font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 10px; line-height: 1.5; }
    li::before { content: "›"; position: absolute; left: 0; color: var(--neon); font-weight: 900; font-size: 18px; top: -2px; }

    .highlight { color: #fff; font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,0.2); }

    /* --- FOOTER --- */
    .footer-bar { position: absolute; bottom: 0; width: 100%; padding: 25px; background: linear-gradient(to top, var(--bg) 60%, transparent); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 40; }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
    .footer-links a.active { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
    .footer-copy { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 700; }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="crystal-wrap">
    <div class="crystal-cage">
      <div class="side s1"></div>
      <div class="side s2"></div>
      <div class="side s3"></div>
    </div>
  </div>

  <div class="mobile-frame">
    <div class="top-nav">
      <button class="btn-back" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/pages/home.html'">←</button>
      <div class="brand">italkyAI</div>
    </div>

    <div class="page-content" id="contentHost"></div>

    <div class="footer-bar">
      <div class="footer-links">
      </div>
      <div class="footer-copy">italkyAI By <b>Ozyigit's</b> • 2026</div>
    </div>
  </div>

  <template id="privacy_tr">
    <div class="privacy-card">
      <h1>Gizlilik <span>Politikası</span></h1>
      <div class="intro">italkyAI olarak kişisel verilerinize saygı duyar ve verilerinizi global güvenlik standartlarına uygun şekilde koruruz.</div>

      <div class="section">
        <h3>0. VERİ SORUMLUSU</h3>
        <p>Veri sorumlusu: <span class="highlight">Oğuz Özyiğit</span></p>
        <p>Adres: Şerefiye Mah. Uzunzade Sk. B Blok No: 11/1 İç Kapı No: 10 Merkez / Düzce – Türkiye</p>
        <p>İletişim: <span class="highlight">privacy@italky.ai</span></p>
      </div>

      <div class="section">
        <h3>1. TOPLANAN VERİLER</h3>
        <ul>
          <li><strong>Hesap Bilgileri:</strong> Google ile giriş yapıldığında alınan e-posta ve temel profil.</li>
          <li><strong>Kullanım Verileri:</strong> Uygulama içi tercihler ve kullanım akışı.</li>
          <li><strong>Ses Verileri:</strong> Canlı pratik sırasında anlık işlenir; <span class="highlight">asla kalıcı depolanmaz</span>.</li>
        </ul>
      </div>

      <div class="section">
        <h3>2. KAMERA VE MİKROFON</h3>
        <p>Kamera ve mikrofon, yalnızca siz ilgili özelliği açtığınızda kullanılır ve kapattığınız anda erişim kesilir. Görüntüleriniz <span class="highlight">asla kaydedilmez</span>.</p>
      </div>

      <div class="section">
        <h3>3. ÜÇÜNCÜ TARAF SERVİSLER</h3>
        <p>Hizmetin sunulması için Google Auth, OpenAI (dil işleme), Supabase (veri saklama) ve Render altyapıları kullanılmaktadır.</p>
      </div>

      <div class="section">
        <h3>4. KULLANICI HAKLARI</h3>
        <p>Verilerinize erişebilir ve hesabınızı <strong>Profil > Hesabı Sil</strong> adımıyla her an kalıcı olarak silebilirsiniz.</p>
      </div>
    </div>
  </template>

  <script type="module">
    import { getSiteLang } from "/js/i18n.js";

    function render(){
      const lang = (getSiteLang?.() || "tr").toLowerCase();
      const host = document.getElementById("contentHost");
      let tpl = document.getElementById(`privacy_${lang}`);
      if(!tpl) tpl = document.getElementById("privacy_tr");

      host.innerHTML = "";
      host.appendChild(tpl.content.cloneNode(true));
      
      const titles = { tr: "italkyAI • Gizlilik", en: "italkyAI • Privacy" };
      document.title = titles[lang] || "italkyAI";
    }

    render();
    window.addEventListener("storage", (e) => {
      if(e.key === "italky_site_lang_v1") render();
    });
  </script>
</body>
</html>
