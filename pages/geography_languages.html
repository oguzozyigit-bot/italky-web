<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Coğrafyanın Dilleri</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --earth-top: rgba(184,115,51,0.20);
      --earth-bottom: rgba(120,53,15,0.22);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{ min-height:100dvh; }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
      overflow:hidden;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, var(--earth-top), var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, var(--earth-bottom), var(--bg));
    }

    .lang-trigger{
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      padding:10px 18px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      z-index:50;
      backdrop-filter:blur(12px);
      pointer-events:auto;
      min-height:44px;
      max-width:92%;
      text-decoration:none;
      touch-action:manipulation;
    }

    .popover{
      position:absolute;
      left:50%;
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:5000;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
      pointer-events:auto;
    }

    .popover.show{ display:flex; }
    .half-screen.top .popover{
      top:64px;
      transform:translateX(-50%) rotate(180deg);
      transform-origin:center center;
    }
    .half-screen.bottom .popover{
      bottom:64px;
      transform:translateX(-50%);
    }

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      letter-spacing:.3px;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      user-select:none;
      touch-action:manipulation;
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
      pointer-events:auto;
    }

    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
      user-select:none;
      pointer-events:auto;
      touch-action:manipulation;
    }

    .pop-item:hover{ background:rgba(255,255,255,.06); }

    .pop-item.active{
      background:rgba(217,119,6,.14);
      border-color:rgba(217,119,6,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{ font-size:18px; }

    .pop-name{
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .pop-code{
      font-weight:900;
      font-size:12px;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px 0;
      mask-image:linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:84%;
      line-height:1.25;
      word-break:break-word;
    }

    .bubble.them{
      opacity:.55;
      font-size:18px;
      font-weight:500;
    }

    .bubble.me{
      font-size:18px;
      font-weight:650;
      opacity:.82;
    }

    .bubble.me.is-latest{
      font-size:30px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble-row .txt{
      display:inline-block;
    }

    .spk-icon{
      width:28px;
      height:28px;
      min-width:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      touch-action:manipulation;
    }

    .spk-icon svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .mic-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding-bottom:10px;
      z-index:30;
    }

    .half-screen.top .lang-trigger,
    .half-screen.top .chat-body,
    .half-screen.top .bubble{
      transform:rotate(180deg);
    }

    .half-screen.top .mic-wrap{
      min-height:18px;
      padding-bottom:0;
    }

    .btn-mic{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),linear-gradient(135deg,#fbbf24,#d97706,#92400e);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
      touch-action:manipulation;
    }

    .btn-mic svg{
      width:28px;
      height:28px;
    }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(245,158,11,.85);
      box-shadow:0 0 0 6px rgba(245,158,11,.10), 0 0 28px rgba(245,158,11,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .btn-mic.recorded{
      box-shadow:0 0 0 4px rgba(250,204,21,.16), 0 0 22px rgba(250,204,21,.28);
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.3;
      letter-spacing:.12px;
      min-height:18px;
      user-select:none;
      max-width:270px;
      width:100%;
      display:block;
    }

    .helper-ready{
      color:#22c55e;
      text-shadow:0 0 12px rgba(34,197,94,.28);
    }

    .helper-wait{
      color:#ef4444;
      text-shadow:0 0 12px rgba(239,68,68,.28);
    }

    .helper-repeat{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
    }

    .center-hub{
      height:116px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter:blur(15px);
      z-index:650;
      touch-action:manipulation;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:100px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
      position:relative;
      touch-action:manipulation;
    }

    .energy-orbit{
      position:absolute;
      width:100px;
      height:100px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#b87333;
      box-shadow:0 0 15px #b87333;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#60a5fa;
      box-shadow:0 0 15px #60a5fa;
    }

    .ai-core{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.5px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    body.is-listening .eq-wrap,
    body.is-translating .eq-wrap{
      opacity:1;
    }

    body.is-listening .logo-text,
    body.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-gradient);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(217,119,6,.35); }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999999;
      padding:20px;
    }

    .modal.open{ display:flex; }

    .modal-card{
      width:min(100%, 420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:'Space Grotesk',sans-serif;
      font-size:20px;
      font-weight:900;
      color:#fff;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{
      background:var(--ai-gradient);
      color:#05060d;
    }

    .modal-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
  </style>
</head>
<body id="frameRoot" class="to-bot">
  <div class="container">
    <div class="half-screen top">
      <button class="lang-trigger" id="topLangBtn" type="button">
        <span id="topLangTxt">🌐 Hedef Dil</span> ⌵
      </button>

      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi">
        <div class="pop-head">
          <div>HEDEF DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="helper-text helper-ready" id="topHelper">Hedef dili seçin</div>
      </div>
    </div>

    <div class="center-hub">
      <a class="nav-btn btn-home" id="homeLink" href="/pages/home.html">ANA SAYFA</a>

      <div class="orb-container">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
    </div>

    <div class="half-screen bottom">
      <button class="lang-trigger" id="botLangBtn" type="button">
        <span id="botLangTxt">🌍 Coğrafi Diller</span> ⌵
      </button>

      <div class="popover" id="pop-bot" role="dialog" aria-label="Alt dil seçimi">
        <div class="pop-head">
          <div>COĞRAFİ DİLLER</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" aria-label="Mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 19v3"></path>
          </svg>
        </div>
        <div class="helper-text helper-ready" id="botHelper">Konuşmak için mikrofona dokununuz.</div>
      </div>
    </div>
  </div>

  <div class="modal" id="uiModal">
    <div class="modal-card">
      <h3 class="modal-title" id="uiModalTitle">Jeton Gerekli</h3>
      <p class="modal-text" id="uiModalText">Coğrafyanın Dilleri çevirisi için jeton gerekiyor.</p>
      <div class="modal-actions">
        <button class="modal-btn primary" id="uiModalGo">Jeton Al</button>
        <button class="modal-btn secondary" id="uiModalClose">Kapat</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/geography_languages_page.js"></script>
</body>
</html>
