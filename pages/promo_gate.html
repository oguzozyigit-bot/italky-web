<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>italkyAI • Kod ile Devam Et</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(96,165,250,.16),transparent 34%),linear-gradient(180deg,#07111f,#040813);font-family:'Outfit',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:440px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid rgba(148,163,184,.18);border-radius:26px;padding:24px;box-shadow:0 24px 56px rgba(0,0,0,.34);text-align:center}
    h1{margin:0 0 10px;font-size:25px;font-weight:900;letter-spacing:-.4px}p{font-size:14px;color:rgba(255,255,255,.72);line-height:1.55;margin:0 0 18px}label{display:block;margin:12px 0 7px;color:rgba(255,255,255,.74);font-size:12px;font-weight:900;text-align:left}
    input{width:100%;min-height:58px;border-radius:18px;border:1px solid rgba(148,163,184,.18);background:#0f172a;color:#fff;padding:0 14px;font-size:20px;font-weight:900;outline:none;text-align:center;letter-spacing:2px;text-transform:uppercase}
    button{width:100%;min-height:54px;border:none;border-radius:16px;font-size:15px;font-weight:900;cursor:pointer;margin-top:12px;font-family:inherit}button:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:linear-gradient(135deg,#dbeafe,#60a5fa);color:#07111f}.btn-secondary{background:#172033;color:#fff;border:1px solid rgba(148,163,184,.18)}.message{min-height:22px;margin-top:14px;color:#ffb4b4;font-size:13px;line-height:1.45;text-align:center;font-weight:800}.ok{color:#b8f7c7}.hint{margin-top:14px;color:rgba(255,255,255,.54);font-size:11px;line-height:1.45;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h1>Kod ile devam et</h1>
    <p>Kulaklık yanında verilen aktivasyon kodunu girerek erişimi bu cihazda başlatabilirsiniz.</p>
    <label for="promoInput">Kodunuzu girin</label>
    <input id="promoInput" placeholder="KODUNUZU GİRİN" maxlength="32" autocomplete="one-time-code"/>
    <button class="btn-primary" id="activateBtn" type="button">Kodu aktif et</button>
    <button class="btn-secondary" id="backBtn" type="button">Geri dön</button>
    <div id="message" class="message"></div>
    <div class="hint">Aynı kod başka cihazda aktif edilirse bu cihazdaki erişim sona erer.</div>
  </div>

<script>
const API = "https://italky-api.onrender.com/api/promo/corporate";
const ACTIVATION_CODE_KEY = "italky_activation_code";
const ACTIVATION_SESSION_KEY = "italky_activation_session_key";
const ACTIVATION_EXPIRES_KEY = "italky_activation_expires_at";
const ACTIVATION_DEVICE_KEY = "italky_activation_device_id";
const LEGACY_KEYS = ["italky_code_access_code_v1", "italky_code_active_session_key_v1", "italky_access_open_v1"];
const promoInput = document.getElementById("promoInput");
const activateBtn = document.getElementById("activateBtn");
const backBtn = document.getElementById("backBtn");
const message = document.getElementById("message");

function setMessage(text = "", ok = false){message.textContent = String(text || "");message.classList.toggle("ok", !!ok)}
function normalizeCode(value){return String(value || "").toUpperCase().replace(/[\s-]+/g, "").replace(/[^A-Z0-9_]/g, "").slice(0, 64)}
function makeUUID(){return (crypto && crypto.randomUUID) ? crypto.randomUUID() : `device-${Date.now()}-${Math.floor(Math.random()*1e9)}`}
function getDeviceId(){
  try{
    const existing = localStorage.getItem(ACTIVATION_DEVICE_KEY);
    if(existing && existing.length > 8) return existing;
    const deviceId = makeUUID();
    localStorage.setItem(ACTIVATION_DEVICE_KEY, deviceId);
    return deviceId;
  }catch(e){return makeUUID()}
}
function clearActivation(){
  try{
    localStorage.removeItem(ACTIVATION_CODE_KEY);
    localStorage.removeItem(ACTIVATION_SESSION_KEY);
    localStorage.removeItem(ACTIVATION_EXPIRES_KEY);
    LEGACY_KEYS.forEach((key) => localStorage.removeItem(key));
    if(localStorage.getItem("italky_access_mode") === "code") localStorage.removeItem("italky_access_mode");
  }catch(e){}
}
function mapError(){return "Kod geçersiz veya süresi dolmuş."}
async function activateCode(code){
  const device_id = getDeviceId();
  const res = await fetch(`${API}/activate`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    cache: "no-store",
    body: JSON.stringify({ code, device_id, user_agent: navigator.userAgent || "" })
  });
  const json = await res.json().catch(() => ({}));
  if(!res.ok || json?.ok !== true || !json?.active_session_key) throw new Error(mapError());
  return json;
}
async function checkStillActive(){
  try{
    const code = localStorage.getItem(ACTIVATION_CODE_KEY) || "";
    const active_session_key = localStorage.getItem(ACTIVATION_SESSION_KEY) || "";
    const device_id = getDeviceId();
    if(!code || !active_session_key) return;
    const url = `${API}/status?code=${encodeURIComponent(code)}&active_session_key=${encodeURIComponent(active_session_key)}&device_id=${encodeURIComponent(device_id)}`;
    const res = await fetch(url, { cache:"no-store" });
    const json = await res.json().catch(() => ({}));
    if(res.ok && json && json.active === false){
      clearActivation();
      try{ sessionStorage.setItem("italky_code_session_message", "Bu kod başka bir cihazda aktif edildi."); }catch(e){}
      location.replace("/pages/login.html?code_session_replaced=1");
    }
  }catch(e){}
}
promoInput.addEventListener("input", () => { promoInput.value = normalizeCode(promoInput.value); });
activateBtn.addEventListener("click", async () => {
  const code = normalizeCode(promoInput.value);
  if(!code){ setMessage("Kod geçersiz veya süresi dolmuş."); return; }
  try{
    activateBtn.disabled = true;
    setMessage("Kod kontrol ediliyor...");
    const result = await activateCode(code);
    try{
      localStorage.removeItem("italky_guest_mode_v1");
      localStorage.setItem(ACTIVATION_CODE_KEY, result.code || code);
      localStorage.setItem(ACTIVATION_SESSION_KEY, result.active_session_key);
      if(result.expires_at) localStorage.setItem(ACTIVATION_EXPIRES_KEY, result.expires_at);
      localStorage.setItem("italky_access_mode", "code");
      localStorage.setItem("italky_code_access_code_v1", result.code || code);
      localStorage.setItem("italky_code_active_session_key_v1", result.active_session_key);
      localStorage.setItem("italky_access_open_v1", "1");
    }catch(e){}
    setMessage("Kod aktif edildi. Yönlendiriliyorsunuz...", true);
    setTimeout(() => { location.href = "/pages/home.html"; }, 700);
  }catch(e){
    clearActivation();
    setMessage("Kod geçersiz veya süresi dolmuş.");
  }finally{
    activateBtn.disabled = false;
  }
});
backBtn.addEventListener("click", () => { location.href = "/pages/login.html"; });
(function boot(){
  try{const u = new URL(location.href); const code = normalizeCode(u.searchParams.get("code") || ""); if(code) promoInput.value = code;}catch(e){}
  checkStillActive();
  setInterval(checkStillActive, 45000);
})();
</script>
</body>
</html>
