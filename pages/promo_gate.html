<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>italkyAI • Aktivasyon</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#05070f;
      font-family:'Outfit',sans-serif;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .card{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:26px;
      padding:26px;
      text-align:center;
    }

    h1{
      margin:0 0 10px;
      font-size:26px;
      font-weight:900;
    }

    p{
      font-size:14px;
      color:rgba(255,255,255,.7);
      margin-bottom:20px;
    }

    input{
      width:100%;
      height:54px;
      border-radius:16px;
      border:none;
      text-align:center;
      font-size:18px;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:14px;
      background:#111827;
      color:#fff;
      text-transform:uppercase;
    }

    button{
      width:100%;
      height:54px;
      border:none;
      border-radius:16px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      margin-bottom:10px;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn-primary{
      background:linear-gradient(135deg,#8bd3ff,#7c5cff,#ff66c4);
      color:#fff;
    }

    .btn-secondary{
      background:#1f2937;
      color:#fff;
    }

    .error{
      color:#ff8b8b;
      font-size:13px;
      margin-top:10px;
      min-height:20px;
      line-height:1.45;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Promosyon Kodunuz Var mı?</h1>
  <p>
    Kodunuz varsa girin. Yoksa devam ederek üyeliğinizi başlatabilirsiniz.
  </p>

  <input id="promoInput" placeholder="KOD GİR" maxlength="8" autocomplete="one-time-code"/>

  <button class="btn-primary" id="applyBtn">KODU ONAYLA</button>
  <button class="btn-secondary" id="continueBtn">DEVAM ET</button>

  <div id="errorText" class="error"></div>
</div>

<script type="module">
import { supabase } from "/js/supabase_client.js";

const promoInput = document.getElementById("promoInput");
const applyBtn = document.getElementById("applyBtn");
const continueBtn = document.getElementById("continueBtn");
const errorText = document.getElementById("errorText");

function setMessage(msg = ""){
  errorText.innerText = String(msg || "");
}

function normalizePromoCode(value){
  return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
}

function isValidPromoCode(code){
  const letters = code.replace(/[^A-Z]/g, "");
  const digits = code.replace(/[^0-9]/g, "");
  return /^[A-Z0-9]{8}$/.test(code)
    && letters.length === 2
    && digits.length === 6
    && !["AK", "FG", "FB", "GS"].includes(letters);
}

async function getSessionOrLogin(){
  for(let i = 0; i < 10; i += 1){
    const { data:{ session } } = await supabase.auth.getSession();
    if(session) return session;
    await new Promise((resolve) => setTimeout(resolve, 500));
  }

  location.href = "/pages/login.html?next=/pages/promo_gate.html";
  return null;
}

async function redeemPromoCode(code){
  const { data, error } = await supabase.rpc("redeem_promo_code_v1", { p_code: code });
  if(error) throw error;
  return data;
}

promoInput.addEventListener("input", () => {
  promoInput.value = normalizePromoCode(promoInput.value);
});

applyBtn.onclick = async () => {
  const code = normalizePromoCode(promoInput.value);

  if(!isValidPromoCode(code)){
    setMessage("Kod 8 karakter, tam 2 harf ve 6 rakam olmalı.");
    return;
  }

  try{
    applyBtn.disabled = true;
    setMessage("Kod kontrol ediliyor...");

    const session = await getSessionOrLogin();
    if(!session) return;

    const result = await redeemPromoCode(code);

    if(result?.ok){
      try{
        localStorage.removeItem("italky_guest_mode_v1");
        localStorage.setItem("italky_access_open_v1", "1");
      }catch{}
      location.href = "/pages/home.html";
      return;
    }

    setMessage(mapError(result?.reason));
  }catch(e){
    console.error("promo redeem failed:", e);
    setMessage(e?.message || "Kod kullanılamadı");
  }finally{
    applyBtn.disabled = false;
  }
};

continueBtn.onclick = () => {
  location.href = "/pages/membership.html";
};

function mapError(r){
  if(!r) return "Kod geçersiz";

  r = String(r).toUpperCase();

  if(r === "AUTH_REQUIRED") return "Önce Google hesabınızla giriş yapın";
  if(r === "PROMO_NOT_FOUND") return "Kod bulunamadı";
  if(r === "PROMO_ALREADY_USED") return "Kod kullanılmış";
  if(r === "PROMO_NOT_ACTIVE") return "Kod aktif değil";
  if(r === "PROMO_ASSIGNED_TO_ANOTHER_USER") return "Bu kod başka bir kullanıcıya tanımlı";
  if(r === "PROMO_ASSIGNED_TO_ANOTHER_EMAIL") return "Bu kod başka bir e-posta adresine tanımlı";
  if(r === "PROMO_EXPIRED") return "Kod süresi dolmuş";

  return "Kod geçersiz";
}

</script>

</body>
</html>
