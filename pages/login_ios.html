<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI - iOS Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-void:#060408;--neon:#00f2ff;--brand-grad:linear-gradient(135deg,#00f2ff 0%,#6366f1 55%,#ff007a 100%);--signature-grad:linear-gradient(to right,#fff,#00f2ff,#fff);--accent:#00f2ff;--muted:rgba(255,255,255,.65);--safeB:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html,body{height:100%;width:100%}
    body{background:var(--bg-void);color:#fff;font-family:'Outfit',sans-serif;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
    [hidden]{display:none!important}
    .nebula{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 25% 20%,rgba(0,242,255,.12),transparent 45%),radial-gradient(circle at 80% 80%,rgba(255,0,122,.10),transparent 55%),radial-gradient(circle at 50% 50%,rgba(15,8,22,1) 0%,#060408 100%);z-index:0}
    .main{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;z-index:10;margin-top:-10px}
    .brand-section{text-align:center;margin-bottom:5px;pointer-events:none}
    .brand-section h1{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:1000;letter-spacing:-4px;line-height:1;filter:drop-shadow(0 0 15px rgba(0,242,255,.2))}
    .brand-section h1 span.ai{background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .brand-sub{margin-top:8px;font-size:12px;font-weight:900;letter-spacing:8px;text-transform:uppercase;color:#fff;opacity:.9;text-shadow:0 0 10px rgba(255,255,255,.3)}
    .world-container{position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center;margin-top:6px;margin-bottom:8px;perspective:1000px;pointer-events:none}
    .earth-glow{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(0,242,255,.22) 0%,transparent 70%);filter:blur(25px);opacity:.95;z-index:0;animation:glowBreath 4.8s ease-in-out infinite alternate}
    @keyframes glowBreath{from{transform:scale(.95);opacity:.6}to{transform:scale(1.1);opacity:.9}}
    .earth{position:relative;width:185px;height:185px;border-radius:50%;background-image:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74518/world.topo.bathy.200412.3x5400x2700.jpg");background-size:cover;background-position:center;box-shadow:inset -30px -30px 60px rgba(0,0,0,.9),inset 10px 10px 30px rgba(255,255,255,.1),0 0 80px rgba(0,242,255,.25);transform-style:preserve-3d;animation:rotateSphere 34s linear infinite;z-index:2;overflow:hidden}
    @keyframes rotateSphere{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
    .ai-stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:1000;letter-spacing:2px;color:rgba(255,255,255,.95);text-shadow:0 0 20px rgba(0,242,255,.4);mix-blend-mode:screen;opacity:.95;user-select:none;backface-visibility:hidden}
    .ai-front{font-size:38px;transform:translateZ(1px);z-index:4}
    .ai-back{font-size:44px;letter-spacing:1px;transform:rotateY(180deg) translateZ(1px);z-index:3}
    .typewriter-container{height:40px;margin-top:3px;margin-bottom:14px;display:flex;justify-content:center;align-items:center;width:100%;pointer-events:none}
    .typewriter{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);border-right:2px solid var(--accent);white-space:nowrap;overflow:hidden;width:0;animation:typing 5.6s steps(32,end) infinite,blink .85s step-end infinite;text-shadow:0 0 10px rgba(0,242,255,.2)}
    @keyframes typing{0%,10%{width:0}62%,86%{width:100%}100%{width:0}}
    @keyframes blink{from,to{border-color:transparent}50%{border-color:var(--accent)}}
    .login-box{position:relative;width:100%;max-width:330px;z-index:300;display:grid;gap:12px}
    .main-btn{position:relative;z-index:400;touch-action:manipulation;width:100%;min-height:56px;border:none;border-radius:28px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all .18s ease;user-select:none;font-family:inherit;-webkit-appearance:none;appearance:none;text-decoration:none}
    .main-btn:active{transform:scale(.97)}
    .apple-btn{background:#fff;color:#1f1f1f;box-shadow:0 10px 25px rgba(0,0,0,.3)}
    .apple-mark{font-size:23px;line-height:1;display:block;transform:translateY(-1px)}
    footer{width:100%;text-align:center;z-index:500;padding-bottom:calc(20px + var(--safeB));visibility:visible;opacity:1;position:relative}
    .footer-nav{display:flex;justify-content:center;gap:18px;margin-bottom:12px}
    .footer-nav a{text-decoration:none;color:rgba(255,255,255,.4);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;transition:.3s;padding:10px 2px}
    .footer-nav a:hover{color:var(--neon);text-shadow:0 0 8px var(--neon)}
    .brand-seal{font-size:11px;font-weight:900;letter-spacing:1.2px;background:var(--signature-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .gokturk-signature{display:block;margin-top:3px;font-family:"Segoe UI Historic","Noto Sans Old Turkic",serif;font-size:12px;font-weight:900;direction:rtl;unicode-bidi:isolate}
    @media(max-height:760px){.world-container{width:210px;height:210px}.earth{width:155px;height:155px}.brand-section h1{font-size:54px}.main-btn{min-height:52px}.typewriter-container{margin-bottom:10px}}
  </style>
</head>
<body>
  <div class="nebula"></div>
  <main class="main">
    <section class="brand-section" aria-label="italkyAI">
      <h1>italky<span class="ai">AI</span></h1>
      <div class="brand-sub">BE FREE</div>
    </section>
    <section class="world-container" aria-hidden="true">
      <div class="earth-glow"></div>
      <div class="earth">
        <div class="ai-stamp ai-front">ITALKY</div>
        <div class="ai-stamp ai-back">AI</div>
      </div>
    </section>
    <section class="typewriter-container" aria-hidden="true">
      <div class="typewriter">Devam etmek için giriş yapın...</div>
    </section>
    <section class="login-box" aria-label="Giriş seçenekleri">
      <a class="main-btn apple-btn" id="iosLoginButton" href="/pages/home_ios.html?ios=1" aria-label="Apple hesabınla giriş yap">
        <span class="apple-mark" aria-hidden="true">&#63743;</span>
        <span>Apple hesabınla giriş yap</span>
      </a>
    </section>
  </main>
  <footer class="ios-footer">
    <nav class="footer-nav" aria-label="Alt bağlantılar">
      <a href="https://italky.ai/pages/about.html">Hakkımızda</a>
      <a href="https://italky.ai/pages/privacy.html">Gizlilik</a>
      <a href="https://italky.ai/pages/contact.html">İletişim</a>
    </nav>
    <div class="brand-seal">
      italkyAI @ icanyAI By Ozyigit's 2026
      <span class="gokturk-signature" lang="otk" dir="rtl">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span>
    </div>
  </footer>
</body>
</html>
