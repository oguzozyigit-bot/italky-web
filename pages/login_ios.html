<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <title>italkyAI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050814;
      --bg2: #0a1230;
      --text: #f7fbff;
      --muted: #a9bdd2;
      --line: rgba(255,255,255,.14);
      --cyan: #58e7ff;
      --green: #67f6a3;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(88,231,255,.28), transparent 30%),
        radial-gradient(circle at 18% 72%, rgba(103,246,163,.16), transparent 28%),
        linear-gradient(180deg, #060915 0%, #0a1230 58%, #040712 100%);
    }
    .page {
      min-height: 100svh;
      min-height: 100vh;
      width: 100%;
      padding: max(22px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .brand {
      width: min(100%, 390px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .orb-wrap {
      position: relative;
      width: 172px;
      height: 172px;
      display: grid;
      place-items: center;
      margin-bottom: 2px;
      flex: 0 0 auto;
    }
    .orb-ring, .orb-ring::before, .orb-ring::after {
      position: absolute;
      inset: 10px;
      border-radius: 999px;
      border: 1px solid rgba(88,231,255,.42);
      animation: spin 9s linear infinite;
      box-shadow: 0 0 26px rgba(88,231,255,.18);
      content: "";
    }
    .orb-ring::before { inset: 18px -6px; border-color: rgba(103,246,163,.28); animation-duration: 12s; animation-direction: reverse; }
    .orb-ring::after { inset: -4px 24px; border-color: rgba(255,255,255,.20); animation-duration: 15s; }
    .orb-core {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 32% 26%, #ffffff 0 5%, transparent 6%),
        radial-gradient(circle at 44% 38%, #6df5ff 0%, #2b8eff 42%, #14296d 76%, #071026 100%);
      box-shadow: 0 0 34px rgba(88,231,255,.45), inset -12px -18px 28px rgba(0,0,0,.38);
      position: relative;
      overflow: hidden;
    }
    .orb-core::before, .orb-core::after {
      content: "";
      position: absolute;
      inset: 18px 5px;
      border-radius: 50%;
      border-top: 2px solid rgba(255,255,255,.5);
      transform: rotate(-18deg);
    }
    .orb-core::after { inset: 10px 28px; border-top: 0; border-left: 2px solid rgba(255,255,255,.38); transform: rotate(12deg); }
    .satellite {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
      animation: orbit 5.8s linear infinite;
    }
    h1 { margin: 0; font-size: 42px; line-height: 1; letter-spacing: 0; font-weight: 800; }
    .slogan { margin: 0; font-size: 16px; font-weight: 800; color: var(--cyan); letter-spacing: 0; }
    .login-box {
      width: min(100%, 390px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      flex: 0 0 auto;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      min-height: 54px;
      border-radius: 16px;
      border: 1px solid var(--line);
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .apple-btn {
      color: #08111f;
      background: linear-gradient(135deg, #ffffff, #e9f4ff);
      box-shadow: 0 18px 42px rgba(0,0,0,.28);
    }
    .guest-btn {
      color: var(--text);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
    }
    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.35;
    }
    .status.error { color: #ff9ea0; }
    footer {
      width: min(100%, 390px);
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      flex: 0 0 auto;
    }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; }
    .links a { color: #cdeeff; text-decoration: none; font-weight: 700; }
    .version { opacity: .78; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(82px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(82px) rotate(-360deg); }
    }
    @media (max-height: 740px) {
      .page { justify-content: flex-start; gap: 10px; padding-top: max(18px, env(safe-area-inset-top)); }
      .orb-wrap { width: 132px; height: 132px; margin-bottom: 0; }
      .orb-core { width: 76px; height: 76px; }
      .orb-ring, .orb-ring::before, .orb-ring::after { inset: 8px; }
      .orb-ring::before { inset: 14px -4px; }
      .orb-ring::after { inset: -2px 20px; }
      .satellite { animation-name: orbit-small; }
      h1 { font-size: 34px; }
      .slogan { font-size: 14px; }
      .login-box { gap: 10px; margin-top: 4px; }
      button { min-height: 50px; font-size: 15px; border-radius: 14px; }
      footer { margin-top: 2px; gap: 8px; }
      @keyframes orbit-small {
        from { transform: rotate(0deg) translateX(63px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(63px) rotate(-360deg); }
      }
    }
    @media (prefers-reduced-motion: reduce) { .orb-ring, .orb-ring::before, .orb-ring::after, .satellite { animation: none; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand" aria-label="italkyAI">
      <div class="orb-wrap" aria-hidden="true">
        <div class="orb-ring"></div>
        <div class="orb-core"></div>
        <div class="satellite"></div>
      </div>
      <h1>italkyAI</h1>
      <p class="slogan">BE FREE</p>
    </section>

    <section class="login-box" aria-label="Giriş seçenekleri">
      <button id="iosAppleLoginButton" class="apple-btn" type="button" aria-label="Apple hesabınla giriş yap">
        <span aria-hidden="true" style="font-size:20px;line-height:1;">&#63743;</span>
        <span>Apple hesabınla giriş yap</span>
      </button>
      <button id="iosGuestLoginButton" class="guest-btn" type="button" aria-label="Misafir olarak devam et">
        Misafir olarak devam et
      </button>
      <div id="iosLoginStatus" class="status" aria-live="polite"></div>
    </section>

    <footer>
      <nav class="links" aria-label="Alt bağlantılar">
        <a href="https://italky.ai/pages/about.html">Hakkımızda</a>
        <a href="https://italky.ai/pages/faq.html">SSS</a>
        <a href="https://italky.ai/pages/privacy.html">Gizlilik</a>
        <a href="https://italky.ai/pages/contact.html">İletişim</a>
      </nav>
      <div class="version">italkyAI By Ozyigit's 2026 V.83</div>
    </footer>
  </main>

  <script>
    (function(){
      var guestRoute = 'https://italky.ai/pages/login_entry.html?guest=1&ios=1';
      function status(message, isError) {
        var node = document.getElementById('iosLoginStatus');
        if (!node) return;
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }
      document.getElementById('iosAppleLoginButton').addEventListener('click', function(event) {
        event.preventDefault();
        status('Apple ile giriş açılıyor...', false);
        try {
          window.webkit.messageHandlers.appleLogin.postMessage({});
        } catch (error) {
          status('Apple girişi başlatılamadı. Lütfen tekrar deneyin.', true);
        }
      });
      document.getElementById('iosGuestLoginButton').addEventListener('click', function(event) {
        event.preventDefault();
        window.location.href = guestRoute;
      });
    })();
  </script>
</body>
</html>
