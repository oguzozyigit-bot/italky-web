<!-- FILE: /pages/alltoall_room.html -->

<!doctype html>
<html lang="tr">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<title>italkyAI • AllToAll</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

:root{
--participantsH:74px;
--metaH:58px;
--micH:110px;
--accent:#7c5cff;
--cyan:#67e8f9;
--pink:#f472b6;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
outline:none;
}

html,body{
margin:0;
height:100%;
background:#0a0613;
font-family:'Outfit',sans-serif;
color:#fff;
overflow:hidden;
}

#pageContent{
height:100%;
display:flex;
flex-direction:column;
}

/* PARTICIPANTS */

.participants{
height:var(--participantsH);
display:flex;
align-items:center;
overflow-x:auto;
gap:12px;
padding:10px 14px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.pItem{
display:flex;
flex-direction:column;
align-items:center;
min-width:54px;
}

.pAvatar{
width:40px;
height:40px;
border-radius:50%;
overflow:hidden;
background:#222;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
}

.pAvatar img{
width:100%;
height:100%;
object-fit:cover;
}

.pName{
font-size:10px;
margin-top:4px;
font-weight:800;
white-space:nowrap;
}

/* META */

.meta{
height:var(--metaH);
display:flex;
align-items:center;
justify-content:center;
gap:12px;
border-bottom:1px solid rgba(255,255,255,.06);
}

#langSelect{
height:38px;
border-radius:10px;
border:none;
background:#191528;
color:#fff;
padding:0 10px;
font-weight:800;
}

#roomPill{
padding:6px 16px;
border-radius:10px;
background:linear-gradient(135deg,#7c5cff,#f472b6);
font-weight:900;
letter-spacing:1px;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:14px;
background:#2a0815;
display:flex;
flex-direction:column;
gap:16px;
}

.msg{
max-width:85%;
display:flex;
flex-direction:column;
}

.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end}

.msgName{
font-size:11px;
font-weight:900;
opacity:.8;
margin-bottom:4px;
}

.msgBubble{
background:#160612;
padding:10px 14px;
border-radius:12px;
font-size:14px;
line-height:1.4;
}

/* MIC */

.micDock{
height:var(--micH);
display:flex;
align-items:center;
justify-content:center;
border-top:1px solid rgba(255,255,255,.06);
}

#micBtn{
width:72px;
height:72px;
border-radius:50%;
border:none;
font-size:28px;
background:linear-gradient(135deg,var(--cyan),var(--accent),var(--pink));
color:#000;
cursor:pointer;
box-shadow:0 10px 28px rgba(124,92,255,.35);
}

#micBtn.listening{
box-shadow:0 0 0 8px rgba(244,114,182,.2);
}

</style>
</head>

<body>

<div id="pageContent">

<!-- PARTICIPANTS -->

<div class="participants" id="peopleScroll"></div>

<!-- META -->

<div class="meta">

<select id="langSelect"></select>

<div id="roomPill">------</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- MIC -->

<div class="micDock">
<button id="micBtn">🎙️</button>
</div>

</div>

<script type="module" src="/js/alltoall_room.js?v=new_layout"></script>

</body>
</html>
