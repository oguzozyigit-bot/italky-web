<!-- FILE: /pages/alltoall_room.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>

  <meta name="theme-color" content="#030014">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --glass: rgba(255,255,255,.05);
      --glass-border: rgba(255,255,255,.12);
      --muted: rgba(255,255,255,.58);
      --panel: rgba(255,255,255,.04);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:#fff;
      font-family:'Outfit',sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.20), transparent 34%),
        radial-gradient(circle at 80% 18%, rgba(236,72,153,.12), transparent 24%),
        radial-gradient(circle at 20% 75%, rgba(96,165,250,.10), transparent 28%),
        linear-gradient(180deg,#05030d 0%, #090514 48%, #04020a 100%);
    }

    #pageContent{
      height:100%;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .room-shell{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      width:100%;
      max-width:520px;
      margin:0 auto;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      background:rgba(8,8,20,.34);
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
    }

    .topbar{
      height:70px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(0,0,0,.26);
    }

    .nav-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      border:1px solid var(--glass-border);
      background:var(--glass);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
    }

    .nav-btn:active{ transform:scale(.96); }

    .brand{
      text-align:center;
      line-height:1.05;
    }

    .brand-name{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:700;
      color:#fff;
    }

    .brand-name span{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      font-size:8px;
      color:rgba(255,255,255,.34);
      font-weight:900;
      letter-spacing:2px;
      margin-top:4px;
    }

    .roombar{
      height:46px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(255,255,255,.02);
    }

    .room-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:900;
      color:var(--muted);
    }

    .room-pill{
      max-width:160px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      border-radius:12px;
      border:1px solid var(--glass-border);
      background:rgba(0,0,0,.22);
      padding:5px 10px;
      color:#fff;
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:11px;
      letter-spacing:1.2px;
      font-weight:1000;
    }

    .lang-select{
      height:30px;
      max-width:152px;
      border-radius:10px;
      border:1px solid var(--glass-border);
      background:rgba(0,0,0,.26);
      color:#c7d2fe;
      font-size:11px;
      font-weight:900;
      padding:0 8px;
    }

    .peoplebar{
      height:62px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(255,255,255,.015);
    }

    .people-count{
      min-width:20px;
      text-align:center;
      font-size:12px;
      font-weight:1000;
      color:#818cf8;
    }

    .people-scroll{
      flex:1;
      display:flex;
      gap:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .people-scroll::-webkit-scrollbar{ display:none; }

    .pItem{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }

    .pAvatar{
      width:34px;
      height:34px;
      border-radius:50%;
      border:1.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      font-weight:1000;
      color:#fff;
      overflow:hidden;
    }

    .pName{
      max-width:48px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:9px;
      font-weight:800;
      color:rgba(255,255,255,.46);
    }

    .chat-area{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:16px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }

    .chat-area::-webkit-scrollbar{ display:none; }

    .sys-note{
      align-self:center;
      max-width:92%;
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:rgba(255,255,255,.52);
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
    }

    .msg-row{
      display:flex;
      flex-direction:column;
      max-width:86%;
    }

    .msg-row.left{
      align-self:flex-start;
    }

    .msg-row.right{
      align-self:flex-end;
      align-items:flex-end;
    }

    .sender-name{
      font-size:10px;
      font-weight:900;
      color:rgba(255,255,255,.44);
      margin-bottom:4px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .msg-bubble{
      padding:10px 15px;
      border-radius:20px;
      font-size:15px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:break-word;
      border:1px solid var(--glass-border);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      position:relative;
    }

    .msg-row.left .msg-bubble{
      background:rgba(255,255,255,.05);
      border-bottom-left-radius:6px;
      border-left:3px solid rgba(99,102,241,.45);
    }

    .msg-row.right .msg-bubble{
      background:linear-gradient(135deg, rgba(86,17,79,.58) 0%, rgba(45,7,28,.74) 100%);
      border-bottom-right-radius:6px;
      border-right:3px solid rgba(236,72,153,.45);
      color:#ffe4f3;
    }

    .msg-actions{
      margin-top:5px;
      display:flex;
      gap:8px;
    }

    .mini-btn{
      width:28px;
      height:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .mini-btn svg{
      width:14px;
      height:14px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      opacity:.9;
    }

    .dock{
      flex:0 0 auto;
      padding:10px 14px calc(10px + var(--safe-bottom));
      border-top:1px solid var(--glass-border);
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }

    .dock-inner{
      min-height:58px;
      border-radius:28px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,.05);
      display:flex;
      align-items:flex-end;
      gap:10px;
      padding:7px 8px 7px 14px;
    }

    #msgInput{
      flex:1;
      border:none;
      background:transparent;
      color:#fff;
      resize:none;
      font-size:15px;
      line-height:18px;
      max-height:120px;
      min-height:26px;
      padding:9px 0;
      font-family:inherit;
      overflow:auto;
    }

    #msgInput::placeholder{
      color:rgba(255,255,255,.36);
    }

    .dock-btns{
      display:flex;
      gap:8px;
      align-items:center;
      flex:0 0 auto;
    }

    .circle-btn{
      width:44px;
      height:44px;
      border-radius:16px;
      border:1px solid var(--glass-border);
      background:rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      flex:0 0 auto;
    }

    .circle-btn:active{ transform:scale(.96); }

    .circle-btn svg{
      width:22px;
      height:22px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.92;
    }

    #micBtn.listening{
      background:rgba(239,68,68,.20);
      border-color:rgba(239,68,68,.38);
      box-shadow:0 0 18px rgba(239,68,68,.22);
    }

    @media (max-width:390px){
      .msg-bubble{ font-size:14px; }
      .room-pill{ max-width:126px; }
      .lang-select{ max-width:128px; }
    }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="room-shell">

      <header class="topbar">
        <button class="nav-btn" id="backBtn" type="button">←</button>

        <div class="brand">
          <div class="brand-name">All<span>To</span>All</div>
          <div class="brand-sub">LIVE CHANNEL</div>
        </div>

        <button class="nav-btn" id="exitBtn" type="button">✕</button>
      </header>

      <div class="roombar">
        <div class="room-left">
          ODA:
          <div class="room-pill" id="roomPill">------</div>
        </div>

        <select class="lang-select" id="langSelect"></select>
      </div>

      <div class="peoplebar">
        <div class="people-count" id="peopleCount">1</div>
        <div class="people-scroll" id="peopleScroll"></div>
      </div>

      <div class="chat-area" id="chat">
        <div class="sys-note">Kanal hazır. Mesaj yazabilir veya konuşabilirsin.</div>
      </div>

      <footer class="dock">
        <div class="dock-inner">
          <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş…"></textarea>

          <div class="dock-btns">
            <button class="circle-btn" id="micBtn" type="button" aria-label="Mikrofon">
              <svg viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <button class="circle-btn" id="sendBtn" type="button" aria-label="Gönder">
              <svg viewBox="0 0 24 24">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
              </svg>
            </button>
          </div>
        </div>
      </footer>

    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { LANG_POOL } from "/js/lang_pool_full.js";

    try { mountShell({ scroll:"none" }); } catch(e){}

    const API_BASE = "https://italky-api.onrender.com/api";
    const WS_BASE = "wss://italky-api.onrender.com";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    const roomId = String(params.get("room") || "").trim().toUpperCase();
    const role = String(params.get("role") || "guest").trim().toLowerCase();

    const roomPill = $("roomPill");
    const peopleCount = $("peopleCount");
    const peopleScroll = $("peopleScroll");
    const chat = $("chat");
    const langSelect = $("langSelect");
    const msgInput = $("msgInput");
    const sendBtn = $("sendBtn");
    const micBtn = $("micBtn");
    const backBtn = $("backBtn");
    const exitBtn = $("exitBtn");

    let myLang = localStorage.getItem("alltoall_lang") || "tr";
    let ws = null;
    let wsReady = false;
    let recognizer = null;
    let isRecording = false;

    const participants = new Map();

    function canonical(code){
      return String(code || "").toLowerCase().split("-")[0].trim();
    }

    function langObj(code){
      const c = canonical(code);
      const found = (Array.isArray(LANG_POOL) ? LANG_POOL : []).find(x => canonical(x.code) === c);
      return found || { code:c, name:c.toUpperCase(), flag:"🌐" };
    }

    function initials(name){
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "👤";
      return parts.slice(0,2).map(x => x[0]?.toUpperCase() || "").join("");
    }

    function renderLangs(){
      const langs = (Array.isArray(LANG_POOL) ? LANG_POOL : []).map(l => ({
        code: canonical(l.code),
        name: l.name || l.code,
        flag: l.flag || "🌐"
      })).filter(Boolean);

      const uniq = [];
      const seen = new Set();

      langs.forEach(l => {
        if (!l.code || seen.has(l.code)) return;
        seen.add(l.code);
        uniq.push(l);
      });

      langSelect.innerHTML = uniq.map(l =>
        `<option value="${l.code}" ${l.code === canonical(myLang) ? "selected" : ""}>${l.flag} ${l.name}</option>`
      ).join("");
    }

    function renderParticipants(){
      const arr = [...participants.values()];
      peopleCount.textContent = String(Math.max(1, arr.length || 1));

      peopleScroll.innerHTML = arr.length
        ? arr.map(p => `
          <div class="pItem">
            <div class="pAvatar">${p.avatar ? `<img src="${p.avatar}" alt="">` : initials(p.name)}</div>
            <div class="pName">${p.name || "Katılımcı"}</div>
          </div>
        `).join("")
        : `
          <div class="pItem">
            <div class="pAvatar">👤</div>
            <div class="pName">Sen</div>
          </div>
        `;
    }

    function scrollChatBottom(){
      requestAnimationFrame(() => {
        try { chat.scrollTop = chat.scrollHeight; } catch {}
      });
    }

    function addSystemNote(text){
      const div = document.createElement("div");
      div.className = "sys-note";
      div.textContent = String(text || "").trim();
      chat.appendChild(div);
      scrollChatBottom();
    }

    function addMessage({ side="left", name="Katılımcı", text="", withSpeaker=false, speakLang="tr" }){
      const row = document.createElement("div");
      row.className = `msg-row ${side}`;

      const label = document.createElement("div");
      label.className = "sender-name";
      label.textContent = name;

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.textContent = text;

      row.appendChild(label);
      row.appendChild(bubble);

      if (withSpeaker) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const btn = document.createElement("button");
        btn.className = "mini-btn";
        btn.type = "button";
        btn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M3 10v4h4l5 4V6L7 10H3"></path>
            <path d="M16 8a4 4 0 0 1 0 8"></path>
            <path d="M19 5a8 8 0 0 1 0 14"></path>
          </svg>
        `;
        btn.addEventListener("click", () => speakFallback(text, speakLang));
        actions.appendChild(btn);
        row.appendChild(actions);
      }

      chat.appendChild(row);
      scrollChatBottom();
    }

    function speakFallback(text, langCode){
      const value = String(text || "").trim();
      if (!value) return;

      try { window.speechSynthesis?.cancel?.(); } catch {}

      if (!window.speechSynthesis) return;

      const u = new SpeechSynthesisUtterance(value);
      u.lang = canonical(langCode);
      setTimeout(() => {
        try { window.speechSynthesis.speak(u); } catch {}
      }, 50);
    }

    function autoGrowTextarea(){
      msgInput.style.height = "26px";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
    }

    async function sendText(rawText){
      const text = String(rawText || "").trim();
      if (!text || !wsReady || !ws || ws.readyState !== WebSocket.OPEN) return;

      addMessage({
        side: "right",
        name: "Sen",
        text,
        withSpeaker: false,
        speakLang: myLang
      });

      try {
        ws.send(JSON.stringify({
          type: "text_message",
          text,
          from_lang: myLang
        }));
      } catch (e) {
        console.warn("[alltoall send]", e);
        addSystemNote("Mesaj gönderilemedi.");
      }
    }

    function buildRecognizer(langCode){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;

      const rec = new SR();
      rec.lang = canonical(langCode);
      rec.interimResults = false;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      return rec;
    }

    function stopRecognizer(){
      try { recognizer?.stop?.(); } catch {}
      recognizer = null;
      isRecording = false;
      micBtn.classList.remove("listening");
    }

    function startRecording(){
      const rec = buildRecognizer(myLang);
      if (!rec) {
        addSystemNote("Bu cihazda konuşma algılama desteklenmiyor.");
        return;
      }

      recognizer = rec;

      rec.onstart = () => {
        isRecording = true;
        micBtn.classList.add("listening");
      };

      rec.onresult = (e) => {
        const heard = e.results?.[0]?.[0]?.transcript || "";
        if (heard) sendText(heard);
      };

      rec.onerror = () => {
        stopRecognizer();
      };

      rec.onend = () => {
        stopRecognizer();
      };

      try {
        rec.start();
      } catch {
        stopRecognizer();
      }
    }

    function wsUrl(){
      if (!roomId) return null;
      return `${WS_BASE}/api/ws/interpreter/${encodeURIComponent(roomId)}?role=${encodeURIComponent(role)}&lang=${encodeURIComponent(myLang)}`;
    }

    function connectSocket(){
      const url = wsUrl();
      if (!url) {
        addSystemNote("Oda bilgisi bulunamadı.");
        return;
      }

      try {
        ws = new WebSocket(url);
      } catch (e) {
        addSystemNote("Bağlantı kurulamadı.");
        return;
      }

      ws.onopen = async () => {
        wsReady = true;
        addSystemNote("Kanal bağlantısı kuruldu.");

        if (role === "guest") {
          try {
            await fetch(`${API_BASE}/interpreter/join-room`, {
              method: "POST",
              headers: { "Content-Type":"application/json" },
              body: JSON.stringify({
                room_id: roomId,
                my_lang: myLang
              })
            });
          } catch (e) {
            console.warn("[alltoall join-room]", e);
          }
        }
      };

      ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          const type = String(payload?.type || "").trim();

          if (type === "presence") {
            const hostLang = payload?.host_lang || "";
            const guestLang = payload?.guest_lang || "";

            participants.clear();
            participants.set("self", {
              name: role === "host" ? "Host" : "Sen",
              avatar: ""
            });

            if (guestLang) {
              participants.set("guest", {
                name: "Katılımcı",
                avatar: ""
              });
            }

            renderParticipants();
            return;
          }

          if (type === "peer_joined") {
            participants.set("guest", {
              name: "Katılımcı",
              avatar: ""
            });
            renderParticipants();
            addSystemNote("Yeni bir katılımcı bağlandı.");
            return;
          }

          if (type === "translated_message") {
            const sender = String(payload?.sender || "").trim().toLowerCase();
            const translated = String(payload?.translated_text || "").trim();
            const original = String(payload?.original_text || "").trim();
            const text = translated || original;

            if (!text) return;
            if (sender === role) return;

            addMessage({
              side: "left",
              name: "Katılımcı",
              text,
              withSpeaker: true,
              speakLang: myLang
            });

            return;
          }

          if (type === "peer_left") {
            participants.delete("guest");
            renderParticipants();
            addSystemNote("Bir katılımcı odadan ayrıldı.");
            return;
          }

          if (type === "error") {
            addSystemNote(payload?.message || "Sunucu hatası.");
          }
        } catch (e) {
          console.warn("[alltoall ws parse]", e);
        }
      };

      ws.onerror = () => {
        wsReady = false;
        addSystemNote("Bağlantı hatası oluştu.");
      };

      ws.onclose = () => {
        wsReady = false;
        addSystemNote("Bağlantı kapandı.");
      };
    }

    roomPill.textContent = roomId || "------";

    roomPill.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(roomId);
        addSystemNote("Oda kodu kopyalandı.");
      } catch {}
    });

    renderLangs();
    renderParticipants();
    connectSocket();

    langSelect.addEventListener("change", () => {
      myLang = canonical(langSelect.value || "tr");
      localStorage.setItem("alltoall_lang", myLang);
      addSystemNote(`Dil güncellendi: ${langObj(myLang).name}`);

      try { ws?.close?.(); } catch {}
      wsReady = false;
      connectSocket();
    });

    msgInput.addEventListener("input", autoGrowTextarea);

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const text = msgInput.value.trim();
        if (!text) return;
        sendText(text);
        msgInput.value = "";
        autoGrowTextarea();
      }
    });

    sendBtn.addEventListener("click", () => {
      const text = msgInput.value.trim();
      if (!text) return;
      sendText(text);
      msgInput.value = "";
      autoGrowTextarea();
    });

    micBtn.addEventListener("click", () => {
      if (isRecording) {
        stopRecognizer();
        return;
      }
      startRecording();
    });

    backBtn.addEventListener("click", () => {
      history.back();
    });

    exitBtn.addEventListener("click", () => {
      location.href = "/pages/alltoall.html";
    });

    autoGrowTextarea();
  </script>
</body>
</html>
