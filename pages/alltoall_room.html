<!-- FILE: /pages/alltoall_room.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <meta name="theme-color" content="#05030d"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#8bd3ff 0%,#7c5cff 45%,#ff66c4 100%);
      --glass: rgba(255,255,255,.05);
      --glass-border: rgba(255,255,255,.10);
      --muted: rgba(255,255,255,.58);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --frameW: min(480px, calc(100vw - 12px));
      --topH: 74px;
      --metaH: 50px;
      --peopleH: 72px;
      --dockH: 82px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:#fff;
      font-family:'Outfit',sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 12%, rgba(99,102,241,.18), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(236,72,153,.10), transparent 22%),
        radial-gradient(circle at 18% 75%, rgba(96,165,250,.10), transparent 28%),
        linear-gradient(180deg,#05030d 0%, #090514 48%, #04020a 100%);
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .room-frame{
      position:relative;
      width:var(--frameW);
      height:100dvh;
      overflow:hidden;
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
      background:rgba(8,8,20,.28);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .topbar{
      position:absolute;
      top:0; left:0; right:0;
      height:var(--topH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 12px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(5,7,14,.92);
      z-index:20;
    }

    .nav-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,.04);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      flex:0 0 auto;
    }

    .brand{
      flex:1;
      text-align:center;
      min-width:0;
      line-height:1.05;
    }

    .brand-name{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:700;
      color:#fff;
      letter-spacing:-.4px;
    }

    .brand-name span{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      font-size:8px;
      color:rgba(255,255,255,.34);
      font-weight:900;
      letter-spacing:2px;
      margin-top:4px;
    }

    .meta-bar{
      position:absolute;
      top:var(--topH); left:0; right:0;
      height:var(--metaH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 12px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(8,10,20,.88);
      z-index:19;
    }

    .room-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:900;
      color:var(--muted);
    }

    .room-pill{
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      border-radius:14px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,.04);
      padding:7px 12px;
      color:#fff;
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:11px;
      letter-spacing:1.2px;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
    }

    .lang-select{
      height:34px;
      max-width:140px;
      border-radius:12px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,.04);
      color:#d9e3ff;
      font-size:12px;
      font-weight:900;
      padding:0 10px;
      flex:0 0 auto;
    }

    .people-bar{
      position:absolute;
      top:calc(var(--topH) + var(--metaH)); left:0; right:0;
      height:var(--peopleH);
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 12px;
      border-bottom:1px solid var(--glass-border);
      background:rgba(255,255,255,.015);
      z-index:18;
    }

    .people-count{
      min-width:20px;
      text-align:center;
      font-size:12px;
      font-weight:1000;
      color:#818cf8;
      flex:0 0 auto;
    }

    .people-scroll{
      flex:1;
      min-width:0;
      display:flex;
      gap:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .people-scroll::-webkit-scrollbar{ display:none; }

    .pItem{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }

    .pAvatar{
      width:38px;
      height:38px;
      border-radius:50%;
      overflow:hidden;
      border:1.5px solid rgba(255,255,255,.12);
      background:linear-gradient(135deg, rgba(139,211,255,.16), rgba(255,102,196,.10));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:1000;
      color:#fff;
    }

    .pAvatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .pName{
      max-width:56px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:10px;
      font-weight:800;
      color:rgba(255,255,255,.56);
    }

    .chat-area{
      position:absolute;
      top:calc(var(--topH) + var(--metaH) + var(--peopleH));
      left:0; right:0;
      bottom:var(--dockH);
      padding:14px 12px;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      touch-action:pan-y;
      scrollbar-width:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
    }

    .chat-area::-webkit-scrollbar{ display:none; }
    .chat-area::before{ content:""; flex:1 0 auto; }

    .sys-note{
      align-self:center;
      max-width:92%;
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:rgba(255,255,255,.54);
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
    }

    .msg-row{
      display:flex;
      flex-direction:column;
      max-width:86%;
    }

    .msg-row.left{ align-self:flex-start; }
    .msg-row.right{ align-self:flex-end; align-items:flex-end; }

    .sender-name{
      font-size:10px;
      font-weight:900;
      color:rgba(255,255,255,.44);
      margin-bottom:4px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .msg-bubble{
      padding:11px 15px;
      border-radius:18px;
      font-size:14px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:break-word;
      border:1px solid var(--glass-border);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    .msg-row.left .msg-bubble{
      background:rgba(255,255,255,.05);
      border-left:3px solid rgba(99,102,241,.45);
      border-bottom-left-radius:8px;
      color:#ececff;
    }

    .msg-row.right .msg-bubble{
      background:linear-gradient(135deg, rgba(86,17,79,.58) 0%, rgba(45,7,28,.74) 100%);
      border-right:3px solid rgba(236,72,153,.45);
      border-bottom-right-radius:8px;
      color:#ffe4f3;
    }

    .msg-actions{
      margin-top:6px;
      display:flex;
      gap:8px;
    }

    .mini-btn{
      width:28px;
      height:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .mini-btn svg{
      width:14px;
      height:14px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      opacity:.9;
    }

    .input-dock{
      position:absolute;
      left:0; right:0; bottom:0;
      height:var(--dockH);
      padding:8px 10px calc(8px + var(--safe-bottom));
      background:rgba(0,0,0,.34);
      border-top:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:21;
    }

    .dock-inner{
      width:100%;
      min-height:58px;
      display:flex;
      align-items:flex-end;
      gap:8px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      border-radius:26px;
      padding:7px 8px 7px 14px;
    }

    #msgInput{
      flex:1 1 auto;
      min-width:0;
      background:transparent;
      border:none;
      outline:none;
      color:#fff;
      font-size:14px;
      padding:10px 4px;
      line-height:18px;
      font-family:inherit;
      resize:none;
      white-space:normal;
      overflow:hidden;
      max-height:120px;
    }

    #msgInput::placeholder{
      color:rgba(255,255,255,.36);
    }

    .dock-btns{
      display:flex;
      gap:8px;
      align-items:center;
      flex:0 0 auto;
    }

    .circle-btn{
      width:42px;
      height:42px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      flex:0 0 auto;
    }

    .circle-btn svg{
      width:20px;
      height:20px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.92;
    }

    #micBtn.listening{
      background:rgba(190,242,100,.14);
      border-color:rgba(190,242,100,.30);
      box-shadow:0 0 18px rgba(190,242,100,.16);
      position:relative;
    }

    @media (max-width:390px){
      .room-pill{ max-width:118px; }
      .lang-select{ max-width:110px; }
      .brand-name{ font-size:17px; }
      .msg-bubble{ font-size:13px; }
    }
  </style>
</head>
<body>

  <div class="room-frame">
    <header class="topbar">
      <button class="nav-btn" id="backBtn" type="button">←</button>

      <div class="brand">
        <div class="brand-name">All<span>To</span>All</div>
        <div class="brand-sub">LIVE CHANNEL</div>
      </div>

      <button class="nav-btn" id="exitBtn" type="button">✕</button>
    </header>

    <div class="meta-bar">
      <div class="room-left">
        ODA:
        <div class="room-pill" id="roomPill">------</div>
      </div>

      <select class="lang-select" id="langSelect"></select>
    </div>

    <div class="people-bar">
      <div class="people-count" id="peopleCount">1</div>
      <div class="people-scroll" id="peopleScroll"></div>
    </div>

    <div class="chat-area" id="chat">
      <div class="sys-note">Kanal hazır. Mesaj yazabilir veya konuşabilirsin.</div>
    </div>

    <div class="input-dock">
      <div class="dock-inner">
        <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş…"></textarea>

        <div class="dock-btns">
          <button class="circle-btn" id="micBtn" type="button" aria-label="Mikrofon">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button class="circle-btn" id="sendBtn" type="button" aria-label="Gönder">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { supabase } from "/js/supabase_client.js";

const API_BASE = "https://italky-api.onrender.com/api";
const WS_BASE = "wss://italky-api.onrender.com/api";

const $ = (id) => document.getElementById(id);

const chat = $("chat");
const msgInput = $("msgInput");
const sendBtn = $("sendBtn");
const micBtn = $("micBtn");
const peopleScroll = $("peopleScroll");
const peopleCount = $("peopleCount");
const langSelect = $("langSelect");
const roomPill = $("roomPill");
const backBtn = $("backBtn");
const exitBtn = $("exitBtn");

const params = new URLSearchParams(location.search);
const hostCode = String(params.get("host") || "").trim().toUpperCase();
const role = String(params.get("role") || "guest").trim().toLowerCase();

let roomId = "";
let ws = null;
let myLang = localStorage.getItem("alltoall_lang") || "tr";
let recognizer = null;
let recognizing = false;

let myProfile = {
  name: role === "host" ? "Host" : "Guest",
  avatar: ""
};

const participants = new Map();

const LANGS = ["tr","en","de","fr","it","es","ru","el","az","ka"];

function toBCP(code){
  const map = {
    tr:"tr-TR", en:"en-US", de:"de-DE", fr:"fr-FR", it:"it-IT",
    es:"es-ES", ru:"ru-RU", el:"el-GR", az:"az-AZ", ka:"ka-GE"
  };
  return map[String(code || "tr").toLowerCase()] || "tr-TR";
}

function getDisplayNameFromUser(user){
  const meta = user?.user_metadata || {};
  return (
    meta.display_name ||
    meta.full_name ||
    meta.name ||
    user?.email?.split("@")[0] ||
    (role === "host" ? "Host" : "Guest")
  );
}

function getAvatarFromUser(user){
  const meta = user?.user_metadata || {};
  return meta.picture || meta.avatar_url || meta.avatar || "";
}

function getInitials(name){
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0,1).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

async function hydrateMyProfile(){
  try{
    const { data } = await supabase.auth.getUser();
    const user = data?.user || null;
    if (!user) return;
    myProfile.name = getDisplayNameFromUser(user);
    myProfile.avatar = getAvatarFromUser(user);
  }catch(e){
    console.warn("[alltoall hydrateMyProfile]", e);
  }
}

function buildLangSelect(){
  langSelect.innerHTML = "";
  LANGS.forEach(code=>{
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = code.toUpperCase();
    langSelect.appendChild(opt);
  });
  langSelect.value = myLang;
}

function renderParticipants(){
  peopleScroll.innerHTML = "";

  const list = [...participants.values()];
  if (!list.length){
    peopleCount.textContent = "1";
    return;
  }

  list.forEach((p)=>{
    const wrap = document.createElement("div");
    wrap.className = "pItem";

    const avatar = document.createElement("div");
    avatar.className = "pAvatar";

    if (p.avatar){
      avatar.innerHTML = `<img src="${p.avatar}" alt="">`;
    } else {
      avatar.textContent = getInitials(p.name);
    }

    const label = document.createElement("div");
    label.className = "pName";
    label.textContent = p.name || "Katılımcı";

    wrap.appendChild(avatar);
    wrap.appendChild(label);
    peopleScroll.appendChild(wrap);
  });

  peopleCount.textContent = String(list.length);
}

function setSelfParticipant(){
  participants.set(role, {
    role,
    name: myProfile.name,
    avatar: myProfile.avatar,
    lang: myLang
  });
  renderParticipants();
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    try{ chat.scrollTop = chat.scrollHeight; }catch{}
  });
}

function addSystemNote(text){
  const div = document.createElement("div");
  div.className = "sys-note";
  div.textContent = String(text || "").trim();
  chat.appendChild(div);
  scrollBottom();
}

function addMessage({ side="left", sender="", text="", withSpeaker=false, speakLang="tr" }){
  const safeText = String(text || "").trim();
  if (!safeText) return;

  const row = document.createElement("div");
  row.className = `msg-row ${side}`;

  const label = document.createElement("div");
  label.className = "sender-name";
  label.textContent = sender || (side === "right" ? myProfile.name : "Katılımcı");

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = safeText;

  row.appendChild(label);
  row.appendChild(bubble);

  if (withSpeaker){
    const actions = document.createElement("div");
    actions.className = "msg-actions";

    const btn = document.createElement("button");
    btn.className = "mini-btn";
    btn.type = "button";
    btn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M3 10v4h4l5 4V6L7 10H3"></path>
        <path d="M16 8a4 4 0 0 1 0 8"></path>
        <path d="M19 5a8 8 0 0 1 0 14"></path>
      </svg>
    `;
    btn.addEventListener("click", ()=>speakFallback(safeText, speakLang));
    actions.appendChild(btn);
    row.appendChild(actions);
  }

  chat.appendChild(row);
  scrollBottom();
}

function speakFallback(text, langCode){
  const value = String(text || "").trim();
  if (!value) return;

  try{ window.speechSynthesis?.cancel?.(); }catch{}
  if (!window.speechSynthesis) return;

  const u = new SpeechSynthesisUtterance(value);
  u.lang = toBCP(langCode);

  setTimeout(()=>{
    try{ window.speechSynthesis.speak(u); }catch{}
  }, 50);
}

function autoGrowTextarea(){
  msgInput.style.height = "26px";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
}

async function resolveRoom(){
  if (!hostCode){
    alert("Kod bulunamadı");
    return false;
  }

  try{
    const r = await fetch(`${API_BASE}/interpreter/resolve-room`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        host_code: hostCode,
        my_lang: myLang,
        mode: "interpreter"
      })
    });

    const j = await r.json().catch(()=>({}));

    if (!r.ok || !j?.room_id){
      throw new Error(j?.detail || j?.error || "Room resolve başarısız");
    }

    roomId = String(j.room_id || "").trim();
    return true;
  }catch(e){
    console.error("[alltoall resolveRoom]", e);
    alert(e?.message || "Oda bulunamadı");
    return false;
  }
}

async function joinRoomIfNeeded(){
  if (!roomId || role !== "guest") return;

  try{
    const r = await fetch(`${API_BASE}/interpreter/join-room`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        room_id: roomId,
        my_lang: myLang
      })
    });

    const j = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(j?.detail || "join-room başarısız");
  }catch(e){
    console.error("[alltoall joinRoom]", e);
    alert(e?.message || "Odaya katılım başarısız");
  }
}

function sendWs(payload){
  try{
    if (ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify(payload));
    }
  }catch(e){
    console.warn("[alltoall sendWs]", e);
  }
}

function connectSocket(){
  if (!roomId){
    addSystemNote("Oda bilgisi bulunamadı.");
    return;
  }

  const url = `${WS_BASE}/ws/interpreter/${encodeURIComponent(roomId)}?role=${encodeURIComponent(role)}&lang=${encodeURIComponent(myLang)}`;

  try{
    ws = new WebSocket(url);
  }catch(e){
    addSystemNote("Bağlantı kurulamadı.");
    return;
  }

  ws.onopen = async ()=>{
    setSelfParticipant();

    if (role === "guest"){
      await joinRoomIfNeeded();
    }

    addSystemNote("Bağlantı kuruldu");
  };

  ws.onmessage = (event)=>{
    try{
      const data = JSON.parse(event.data);
      const type = String(data?.type || "").trim();

      if (type === "presence"){
        if (!participants.has(role)) setSelfParticipant();

        if (data?.host_lang){
          const old = participants.get("host") || {};
          participants.set("host", {
            role:"host",
            name: old.name || (role === "host" ? myProfile.name : "Host"),
            avatar: old.avatar || "",
            lang: data.host_lang
          });
        }

        if (data?.guest_lang){
          const old = participants.get("guest") || {};
          participants.set("guest", {
            role:"guest",
            name: old.name || (role === "guest" ? myProfile.name : "Guest"),
            avatar: old.avatar || "",
            lang: data.guest_lang
          });
        }

        renderParticipants();
        return;
      }

      if (type === "peer_joined"){
        const old = participants.get("guest") || {};
        participants.set("guest", {
          role:"guest",
          name: old.name || (role === "guest" ? myProfile.name : "Guest"),
          avatar: old.avatar || "",
          lang: data?.guest_lang || "en"
        });
        renderParticipants();
        addSystemNote("Yeni katılımcı bağlandı");
        return;
      }

      if (type === "peer_left"){
        const sender = String(data?.sender || "").trim().toLowerCase();
        if (sender && participants.has(sender)){
          participants.delete(sender);
        } else if (role === "host"){
          participants.delete("guest");
        } else {
          participants.delete("host");
        }
        renderParticipants();
        addSystemNote(data?.message || "Bir katılımcı ayrıldı");
        return;
      }

      if (type === "translated_message"){
        const sender = String(data?.sender || "").trim().toLowerCase();
        const translated = String(data?.translated_text || "").trim();
        const original = String(data?.original_text || "").trim();
        const text = translated || original;

        if (!text) return;
        if (sender === role) return;

        const senderProfile = participants.get(sender) || {};
        addMessage({
          side:"left",
          sender: senderProfile.name || (sender === "host" ? "Host" : "Guest"),
          text,
          withSpeaker:true,
          speakLang: myLang
        });
        return;
      }

      if (type === "error"){
        addSystemNote(data?.message || "Sunucu hatası.");
      }
    }catch(e){
      console.warn("[alltoall ws parse]", e);
    }
  };

  ws.onerror = ()=>{
    addSystemNote("Bağlantı hatası oluştu.");
  };

  ws.onclose = ()=>{
    addSystemNote("Bağlantı kapandı.");
  };
}

function sendMessage(){
  const text = String(msgInput.value || "").trim();
  if (!text) return;

  addMessage({
    side:"right",
    sender: myProfile.name,
    text,
    withSpeaker:false,
    speakLang: myLang
  });

  sendWs({
    type:"text_message",
    text,
    from_lang: myLang
  });

  msgInput.value = "";
  autoGrowTextarea();
}

function initSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    micBtn.style.display = "none";
    return;
  }

  recognizer = new SR();
  recognizer.lang = toBCP(myLang);
  recognizer.interimResults = false;
  recognizer.continuous = false;
  recognizer.maxAlternatives = 1;

  recognizer.onresult = (e)=>{
    const text = e.results?.[0]?.[0]?.transcript || "";
    msgInput.value = text;
    sendMessage();
  };

  recognizer.onend = ()=>{
    recognizing = false;
    micBtn.classList.remove("listening");
  };
}

function toggleMic(){
  if (!recognizer) return;

  if (recognizing){
    recognizer.stop();
    recognizing = false;
    micBtn.classList.remove("listening");
    return;
  }

  recognizing = true;
  micBtn.classList.add("listening");
  recognizer.lang = toBCP(myLang);
  recognizer.start();
}

function bindEvents(){
  sendBtn.addEventListener("click", sendMessage);

  msgInput.addEventListener("keydown", (e)=>{
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  msgInput.addEventListener("input", autoGrowTextarea);
  micBtn.addEventListener("click", toggleMic);

  roomPill.addEventListener("click", async ()=>{
    if (!hostCode) return;
    try{
      await navigator.clipboard.writeText(hostCode);
      addSystemNote(`Oda kodu kopyalandı: ${hostCode}`);
    }catch{}
  });

  langSelect.addEventListener("change", ()=>{
    myLang = langSelect.value;
    localStorage.setItem("alltoall_lang", myLang);
    addSystemNote(`Dil güncellendi: ${myLang.toUpperCase()}`);
  });

  backBtn.addEventListener("click", ()=>history.back());
  exitBtn.addEventListener("click", ()=>location.href = "/pages/alltoall.html");
}

async function init(){
  roomPill.textContent = hostCode || "------";

  await hydrateMyProfile();
  buildLangSelect();
  initSpeech();
  bindEvents();
  setSelfParticipant();

  const ok = await resolveRoom();
  if (!ok) return;

  connectSocket();
  autoGrowTextarea();
  scrollBottom();
}

init();
</script>
</body>
