<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 70px;
      --metaH: 80px;
      --peopleH: 92px;
      --dockH: 100px;
      --accent: #00f2fe;
      --pink: #f472b6;
      --violet: #7c5cff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050208;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      position: fixed; /* Mobilde body kaymasını önler */
    }

    .room {
      position: relative;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #050208;
    }

    /* Üst Bar */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .brand { flex: 1; text-align: center; font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; }
    .brand span { color: var(--accent); }

    /* Meta & Oda */
    .meta { height: var(--metaH); display: flex; flex-direction: column; justify-content: center; padding: 0 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .room-info { font-size: 10px; color: var(--accent); font-weight: 800; margin-top: 4px; }

    /* Katılımcılar */
    .people { height: var(--peopleH); padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .people-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; align-items: center; }
    .pItem { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
    .pAvatar { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.1); overflow: hidden; background: rgba(255,255,255,0.05); }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }
    .pName { font-size: 9px; font-weight: 800; margin-top: 4px; color: rgba(255,255,255,0.8); }

    /* Chat */
    .chat { flex: 1; overflow-y: auto; padding: 15px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
    .msg-row { max-width: 90%; display: flex; flex-direction: column; position: relative; }
    .msg-row.left { align-self: flex-start; padding-left: 12px; }
    .msg-row.right { align-self: flex-end; padding-right: 12px; align-items: flex-end; }
    .msg-line { position: absolute; top: 0; bottom: 0; width: 3.5px; border-radius: 10px; }
    .msg-row.left .msg-line { left: 0; }
    .msg-row.right .msg-line { right: 0; }

    /* DOCK - TAM ORTALI MİC VE GİZLİ YAZI ALANI */
    .input-dock {
      background: #0a0510;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      flex-shrink: 0;
      z-index: 1000;
    }

    .dock-main-row {
      display: flex;
      align-items: center;
      justify-content: center; /* Merkeze Alındı */
      gap: 30px;
    }

    .side-btn {
      width: 48px; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #fff; font-size: 20px; cursor: pointer;
    }

    /* Pro Mikrofon Tasarımı */
    .main-mic {
      width: 76px; height: 76px; border-radius: 50%; border: none;
      background: radial-gradient(circle at 30% 30%, #1e1e2e, #050208);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
    }

    .main-mic::after {
      content: "🎙️"; font-size: 32px; filter: drop-shadow(0 0 10px var(--accent));
    }

    .main-mic.listening {
      background: radial-gradient(circle at 30% 30%, var(--pink), var(--violet));
      animation: micGlow 1.5s infinite alternate;
    }

    @keyframes micGlow {
      from { box-shadow: 0 0 10px var(--pink); transform: scale(1); }
      to { box-shadow: 0 0 25px var(--pink); transform: scale(1.05); }
    }

    /* Yazı Giriş Alanı - Pop-up Gibi Açılacak */
    .text-entry-overlay {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      animation: fadeIn 0.2s ease;
    }
    .text-entry-overlay.show { display: flex; }

    textarea {
      flex: 1; height: 48px; max-height: 120px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; color: #fff; padding: 12px 18px; font-size: 15px; resize: none;
    }

    .send-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--accent); color: #000; font-weight: 900; cursor: pointer;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body>
<div class="room" id="roomContainer">
  
  <div class="topbar">
    <button id="backBtn" class="side-btn" style="border:none; background:none;">←</button>
    <div class="brand">All<span>To</span>All</div>
    <button id="exitBtn" class="side-btn" style="border:none; background:none;">✕</button>
  </div>

  <div class="meta">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div id="roomPill" style="background:var(--violet); padding:6px 14px; border-radius:10px; font-weight:900; font-size:18px;">------</div>
      <div style="background:rgba(255,255,255,0.08); padding:6px 12px; border-radius:10px; font-size:13px; font-weight:700;">🇹🇷 Türkçe ▼</div>
    </div>
    <div class="room-info">Bu Kodu Sohbete Katılmak İsteyenlere Veriniz.</div>
  </div>

  <div class="people">
    <div class="people-scroll" id="peopleScroll"></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-dock" id="inputDock">
    <div class="dock-main-row">
      <button id="textToggleBtn" class="side-btn">⌨️</button>
      <button id="micBtn" class="main-mic"></button>
      <div style="width: 48px;"></div> </div>

    <div class="text-entry-overlay" id="textEntry">
      <textarea id="msgInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
      <button id="sendBtn" class="send-btn">➤</button>
    </div>
  </div>

</div>

<script>
  const room = document.getElementById('roomContainer');
  const chat = document.getElementById('chat');
  const textEntry = document.getElementById('textEntry');
  const msgInput = document.getElementById('msgInput');
  const textToggleBtn = document.getElementById('textToggleBtn');

  // KLAVYE HATASINI KÖKTEN ÇÖZEN SİHİRLİ FONKSİYON
  function syncLayout() {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      room.style.height = `${vh}px`;
      // Chat'i en alta kaydır
      setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
    }
  }

  // Klavye simgesine basınca alanı aç/kapat
  textToggleBtn.addEventListener('click', () => {
    textEntry.classList.toggle('show');
    if(textEntry.classList.contains('show')) {
      setTimeout(() => { 
        msgInput.focus(); 
        syncLayout(); 
      }, 100);
    } else {
      syncLayout();
    }
  });

  // Viewport değişimlerini dinle (Klavye açılma anı)
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncLayout);
    window.visualViewport.addEventListener('scroll', syncLayout);
  }

  msgInput.addEventListener('focus', () => {
    setTimeout(syncLayout, 300); // Klavye animasyonu bitişi
  });

  msgInput.addEventListener('input', function() {
    this.style.height = '48px';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // İlk yüklemede boyutu ayarla
  syncLayout();
</script>

<script type="module" src="/js/alltoall_room.js?v=fix_final_1"></script>
</body>
