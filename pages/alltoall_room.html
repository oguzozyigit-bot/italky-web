<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 70px;
      --metaH: 60px;
      --peopleH: 100px;
      --dockH: 80px;
      --accent: #00f2fe;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #09050f;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      /* Klavyenin sayfayı itmesini engellemek için */
      position: fixed; 
    }

    .room {
      display: flex;
      flex-direction: column;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      background: #09050f;
      position: relative;
    }

    /* Üst Alanlar Sabit */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .meta { height: var(--metaH); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
    .people { height: var(--peopleH); border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }

    /* Sohbet Alanı - Esnek */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* MESAJ BALONLARI (Görsele göre optimize edildi) */
    .msg-row { max-width: 85%; margin-bottom: 4px; }
    .msg-row.right { align-self: flex-end; }
    .msg-bubble { 
      padding: 10px 16px; border-radius: 18px; font-size: 15px; 
      background: linear-gradient(135deg, #7000ff, #ff00c1); 
    }

    /* GİRİŞ ALANI - KLAVYE ÜSTÜNE ÇIKACAK OLAN */
    .input {
      height: var(--dockH);
      background: #120c1d;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px env(safe-area-inset-bottom);
      flex-shrink: 0;
      transition: transform 0.1s ease-out; /* Klavye ile senkron hareket */
    }

    textarea {
      flex: 1;
      height: 48px;
      background: #1d1529;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      color: #fff;
      padding: 13px 18px;
      font-size: 15px;
      resize: none;
      outline: none;
    }

    .dock-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }

    /* KLASİK MİKROFON STİLİ */
    .mic-btn {
      background: #251b36;
      color: #a5b4fc;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 20px;
    }
    
    .mic-btn.listening {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .send-btn { background: #00f2fe; color: #000; font-size: 20px; }

    .hide { display: none !important; }
  </style>
</head>

<body>

<div class="room" id="roomWrapper">
  <div class="topbar">
    <button id="backBtn" style="background:none; border:none; color:white; font-size:20px;">←</button>
    <div style="flex:1; text-align:center; font-weight:900;">All<span style="color:var(--accent)">To</span>All</div>
    <button id="exitBtn" style="background:none; border:none; color:white; font-size:20px;">✕</button>
  </div>

  <div class="meta">
    <div id="roomPill" style="background:#7000ff; padding:6px 14px; border-radius:12px; font-weight:700;">UX7ABV</div>
    <select id="langSelect" style="background:#1d1529; color:white; border:none; padding:6px; border-radius:8px;">
        <option value="tr">🇹🇷 Türkçe</option>
    </select>
  </div>

  <div class="people">
    <div style="padding:8px 16px; font-size:10px; font-weight:900; color:var(--accent);">KATILIMCILAR</div>
    <div class="people-scroll" id="peopleScroll" style="display:flex; gap:12px; padding:0 16px;">
        </div>
  </div>

  <div class="chat" id="chatArea">
    </div>

  <div class="input" id="inputDock">
    <button id="micBtn" class="dock-btn mic-btn" type="button">🎙️</button>
    <textarea id="msgInput" rows="1" placeholder="Nasilsin"></textarea>
    <button id="sendBtn" class="dock-btn send-btn" type="button">➤</button>
  </div>
</div>

<script>
  /**
   * KLAVYE SORUNU İÇİN KESİN ÇÖZÜM
   */
  const inputDock = document.getElementById('inputDock');
  const chatArea = document.getElementById('chatArea');
  const roomWrapper = document.getElementById('roomWrapper');

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const vh = window.visualViewport.height;
      const winH = window.innerHeight;
      const keyboardHeight = winH - vh;

      if (keyboardHeight > 100) {
        // Klavye açıldı: Ana kapsayıcıyı viewport boyuna sabitle
        roomWrapper.style.height = vh + 'px';
        // Mesaj alanını en alta kaydır ki son mesaj görünsün
        setTimeout(() => {
          chatArea.scrollTop = chatArea.scrollHeight;
        }, 100);
      } else {
        // Klavye kapandı: Eski boyuta dön
        roomWrapper.style.height = '100dvh';
      }
    });
    
    // Odaklanınca otomatik kaydır (Bazı Android sürümleri için garanti)
    document.getElementById('msgInput').addEventListener('focus', () => {
        setTimeout(() => {
            window.scrollTo(0, 0);
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 300);
    });
  }
</script>

<script type="module" src="/js/alltoall_room.js?v=fix_host_open_1"></script>

</body>
</html>
