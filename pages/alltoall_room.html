<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --participantsH:88px;
      --metaH:78px;
      --micH:150px;
      --footerSafe:var(--footerH, 0px);

      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);

      --chat-bg:
        radial-gradient(circle at 50% 0%, rgba(165,180,252,.06) 0%, transparent 26%),
        radial-gradient(circle at 15% 20%, rgba(236,72,153,.05) 0%, transparent 24%),
        radial-gradient(circle at 85% 10%, rgba(99,102,241,.08) 0%, transparent 18%),
        linear-gradient(180deg, #0a0b16 0%, #0d1020 48%, #090b14 100%);
      --chat-bubble:#121522;
      --chat-bubble-self:linear-gradient(135deg, rgba(99,102,241,.22), rgba(236,72,153,.16));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at 50% 0%, rgba(165,180,252,.10) 0%, transparent 22%),
        radial-gradient(circle at 18% 16%, rgba(236,72,153,.08) 0%, transparent 20%),
        radial-gradient(circle at 82% 14%, rgba(99,102,241,.12) 0%, transparent 18%),
        linear-gradient(180deg,#050508 0%,#090611 100%);
    }

    #pageContent{
      width:100%;
      height:calc(100dvh - var(--footerSafe));
      min-height:calc(100dvh - var(--footerSafe));
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    .participants{
  height:var(--participantsH);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  padding:8px 14px 6px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.015);
  flex:0 0 auto;
  overflow:hidden;
}

    .participants-head{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  min-height:14px;
}

    .participants-title{
  display:none;
}

    .participants-count{
      font-size:11px;
      font-weight:1000;
      color:rgba(255,255,255,.58);
      white-space:nowrap;
    }

    .participants-scroll{
      display:flex;
      align-items:flex-start;
      overflow-x:auto;
      overflow-y:hidden;
      gap:14px;
      scrollbar-width:none;
      min-height:68px;
      padding-bottom:2px;
    }

    .participants-scroll::-webkit-scrollbar{ display:none; }

    .pItem{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      min-width:58px;
      max-width:64px;
      flex:0 0 auto;
    }

    .pAvatar{
      width:42px;
      height:42px;
      border-radius:50%;
      overflow:hidden;
      background:#222;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      border:2px solid rgba(255,255,255,.10);
      flex:0 0 auto;
    }

    .pAvatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .pName{
      font-size:10px;
      margin-top:6px;
      font-weight:800;
      white-space:nowrap;
      max-width:64px;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.1;
      text-align:center;
    }

    .meta{
      height:var(--metaH);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      flex:0 0 auto;
      background:rgba(255,255,255,.015);
      padding:0 12px;
      position:relative;
      z-index:3;
    }

    #langSelect{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;
      height:1px;
    }

    .langBtn{
      min-width:170px;
      max-width:240px;
      height:40px;
      border:none;
      border-radius:999px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      backdrop-filter:blur(12px);
      padding:0 16px;
      touch-action:manipulation;
    }

    .langBtnText{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .inviteWrap{
      min-width:132px;
      max-width:132px;
      height:40px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      text-align:center;
      background:transparent;
      border:none;
      padding:0;
      margin:0;
    }

    .inviteLabel{
      width:100%;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.35px;
      color:rgba(255,255,255,.62);
      line-height:1;
      text-align:center;
      margin:0;
      padding:0;
    }

    #roomPill{
      width:132px;
      height:28px;
      padding:0;
      border-radius:999px;
      background:transparent;
      border:none;
      color:#fff;
      font-size:13px;
      font-weight:900;
      letter-spacing:1px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      box-shadow:none;
      touch-action:manipulation;
      text-align:center;
    }

    .chat{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px 80px;
  background:var(--chat-bg);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:14px;
  scrollbar-width:none;
  min-height:0;
  max-height:calc(100dvh - var(--participantsH) - var(--metaH) - var(--footerSafe));
  scroll-behavior:smooth;
}

    .chat::-webkit-scrollbar{ display:none; }

    .sys-note{
      align-self:center;
      max-width:88%;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.06);
      color:rgba(255,255,255,.74);
      font-size:11px;
      font-weight:800;
      text-align:center;
    }

    .msg-row{
      width:100%;
      display:flex;
    }

    .msg-row.left{ justify-content:flex-start; }
    .msg-row.right{ justify-content:flex-end; }

    .msg-card{
      position:relative;
      max-width:88%;
      min-width:120px;
    }

    .msg-head{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
      min-width:0;
    }

    .msg-name{
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.84);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:132px;
    }

    .msg-lang{
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.58);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }

    .msg-spk{
      width:22px;
      height:22px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
      padding:0;
      margin-left:auto;
      touch-action:manipulation;
    }

    .msg-spk svg{
      width:12px;
      height:12px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
    }

    .msg-bubble{
      background:var(--chat-bubble);
      padding:10px 14px;
      border-radius:14px;
      font-size:14px;
      line-height:1.45;
      color:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.06);
      word-break:break-word;
      box-shadow:0 8px 24px rgba(0,0,0,.16);
    }

    .msg-row.right .msg-bubble{
      background:var(--chat-bubble-self);
    }

    .micDock{
      height:var(--micH);
      min-height:var(--micH);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      border-top:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg, rgba(10,11,22,.96), rgba(9,11,20,.98));
      padding:0 14px calc(10px + var(--safe-bottom)) 14px;
      flex:0 0 auto;
      position:relative;
      z-index:10;
      overflow:visible;
    }

    .btn-mic{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-gradient);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
      touch-action:manipulation;
      margin-top:-70px;
      box-shadow:0 8px 30px rgba(0,0,0,.22);
    }

    .btn-mic svg{
      width:28px;
      height:28px;
    }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(34,197,94,.85);
      box-shadow:0 0 0 6px rgba(34,197,94,.10), 0 0 28px rgba(34,197,94,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .btn-mic.recorded{
      box-shadow:0 0 0 4px rgba(250,204,21,.16), 0 0 22px rgba(250,204,21,.28);
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.35;
      letter-spacing:.12px;
      min-height:16px;
      user-select:none;
      max-width:280px;
      width:100%;
      display:block;
      padding:0 8px;
      margin-top:2px;
    }

    .helper-ready{
      color:#22c55e;
      text-shadow:0 0 12px rgba(34,197,94,.28);
    }

    .helper-wait{
      color:#ef4444;
      text-shadow:0 0 12px rgba(239,68,68,.28);
    }

    .helper-repeat{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(99,102,241,.35); }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      z-index:9998;
    }

    .sheet-backdrop.show{
      opacity:1;
      pointer-events:auto;
    }

    .lang-sheet{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%) translateY(110%);
      width:min(500px,100vw);
      background:linear-gradient(180deg,rgba(20,18,30,.98),rgba(10,8,18,.98));
      border:1px solid rgba(255,255,255,.10);
      border-bottom:none;
      border-radius:28px 28px 0 0;
      box-shadow:0 -20px 60px rgba(0,0,0,.42);
      transition:.24s ease;
      z-index:9999;
      padding:10px 14px calc(18px + env(safe-area-inset-bottom));
      max-height:72dvh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lang-sheet.show{
      transform:translateX(-50%) translateY(0);
    }

    .sheet-handle{
      width:52px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      margin:2px auto 2px;
    }

    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .sheet-title{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:700;
      letter-spacing:-.4px;
    }

    .sheet-close{
      width:38px;
      height:38px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:18px;
      cursor:pointer;
      touch-action:manipulation;
    }

    .sheet-list{
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      scrollbar-width:none;
    }

    .sheet-list::-webkit-scrollbar{ display:none; }

    .sheet-item{
      min-height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 14px;
      cursor:pointer;
      color:#fff;
      transition:.16s ease;
      touch-action:manipulation;
    }

    .sheet-item.active{
      border-color:rgba(99,102,241,.34);
      background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(236,72,153,.10));
      box-shadow:0 0 0 1px rgba(99,102,241,.08) inset;
    }

    .sheet-item-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .sheet-flag{
      width:32px;
      text-align:center;
      font-size:22px;
      flex:0 0 auto;
    }

    .sheet-text{
      min-width:0;
    }

    .sheet-name{
      font-size:14px;
      font-weight:900;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sheet-code{
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.56);
      margin-top:3px;
      letter-spacing:.5px;
    }

    .sheet-check{
      width:24px;
      height:24px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.26);
      flex:0 0 auto;
    }

    .sheet-item.active .sheet-check{
      border-color:#a5b4fc;
      box-shadow:inset 0 0 0 5px #a5b4fc;
    }
  </style>
</head>

<body>
  <div id="pageContent">

    <div class="participants">
      <div class="participants-head">
        <div class="participants-title">KATILIMCILAR</div>
        <div class="participants-count" id="participantsCount">0 / 50</div>
      </div>
      <div class="participants-scroll" id="peopleScroll"></div>
    </div>

    <div class="meta">
      <select id="langSelect" aria-label="Dil seç"></select>

      <button id="langPickerBtn" class="langBtn" type="button" aria-label="Dil seç">
        <span class="langBtnText" id="langPickerText">🌐 Dil</span>
        <span>⌄</span>
      </button>

      <div class="inviteWrap">
        <div class="inviteLabel">Davet Kodu</div>
        <div id="roomPill">------</div>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="micDock">
      <div class="btn-mic" id="micBtn" aria-label="Mikrofon" role="button" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
          <path d="M12 19v3"/>
        </svg>
      </div>
      <div class="helper-text helper-repeat" id="micHint">Konuşmak için mikrofona dokun.</div>
    </div>

  </div>

  <div class="sheet-backdrop" id="langSheetBackdrop"></div>

  <div class="lang-sheet" id="langSheet" aria-hidden="true">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <div class="sheet-title" id="langSheetTitle">Dil Seç</div>
      <button id="langSheetClose" class="sheet-close" type="button">✕</button>
    </div>

    <div class="sheet-list" id="langSheetList"></div>
  </div>

  <script type="module" src="/js/alltoall_room.js?v=stable_room_restore_1"></script>
</body>
</html>
