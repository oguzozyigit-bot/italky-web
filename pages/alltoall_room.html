<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 70px;
      --metaH: 80px; /* Bilgi metni için biraz genişlettik */
      --peopleH: 90px;
      --dockH: 80px;
      --accent: #00f2fe;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050208;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    .room {
      position: relative;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #050208;
    }

    /* Üst Bar */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .top-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; }

    /* Meta Alanı (Oda Kodu & Bilgi) */
    .meta { 
      height: var(--metaH); 
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 16px; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .meta-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .room-pill { background: #7000ff; padding: 4px 14px; border-radius: 10px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .room-info { font-size: 10px; color: var(--accent); font-weight: 700; opacity: 0.8; }

    /* PRO DİL SEÇİCİ (Custom Dropdown) */
    .lang-container { position: relative; }
    .lang-trigger {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    
    /* Katılımcılar Listesi */
    .people { height: var(--peopleH); padding: 10px 0; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .people-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .pAvatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent); overflow: hidden; }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Chat Alanı */
    .chat { flex: 1; overflow-y: auto; padding: 15px 16px; display: flex; flex-direction: column; gap: 14px; }
    
    .msg-row { max-width: 90%; display: flex; flex-direction: column; position: relative; padding: 2px 0; }
    .msg-row.left { align-self: flex-start; padding-left: 12px; }
    .msg-row.right { align-self: flex-end; padding-right: 12px; align-items: flex-end; }

    .msg-line { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 4px; }
    .msg-row.left .msg-line { left: 0; }
    .msg-row.right .msg-line { right: 0; }

    .sender-name { font-size: 11px; font-weight: 900; margin-bottom: 3px; }
    .msg-bubble { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.9); }

    /* Giriş Alanı - Klavye Sabitli */
    .input { 
      height: var(--dockH); 
      background: #0a0510; 
      border-top: 1px solid rgba(255,255,255,0.1); 
      display: flex; align-items: center; gap: 8px; 
      padding: 0 12px calc(10px + env(safe-area-inset-bottom)); 
      z-index: 1000;
    }
    textarea { 
      flex: 1; height: 44px; 
      background: rgba(255,255,255,0.05); 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 20px; color: #fff; padding: 12px 16px; 
      font-size: 15px; resize: none; overflow: hidden;
    }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    .mic-btn { background: #1a1d33; font-size: 20px; }
    .send-btn { background: var(--accent); color: #000; font-size: 18px; }

    /* Gizli Select (JS uyumu için) */
    #langSelect { position: absolute; opacity: 0; pointer-events: none; }
  </style>
</head>

<body>
<div class="room" id="roomContainer">
  
  <div class="topbar">
    <button id="backBtn" class="top-btn">←</button>
    <div style="flex:1; text-align:center; font-family:'Space Grotesk'; font-weight:700; font-size:22px;">All<span style="color:var(--accent)">To</span>All</div>
    <button id="exitBtn" class="top-btn">✕</button>
  </div>

  <div class="meta">
    <div class="meta-top">
      <div id="roomPill" class="room-pill">------</div>
      
      <div class="lang-container">
        <div class="lang-trigger" onclick="document.getElementById('langSelect').showPicker?.() || document.getElementById('langSelect').focus()">
          <span id="currentLangFlag">🇹🇷</span>
          <span id="currentLangName">Türkçe</span>
          <small>▼</small>
        </div>
        <select id="langSelect">
          <option value="tr" data-flag="🇹🇷">Türkçe</option>
          <option value="en" data-flag="🇬🇧">English</option>
          <option value="de" data-flag="🇩🇪">Deutsch</option>
          <option value="fr" data-flag="🇫🇷">Français</option>
          <option value="es" data-flag="🇪🇸">Español</option>
          <option value="it" data-flag="🇮🇹">Italiano</option>
          <option value="ar" data-flag="🇸🇦">العربية</option>
          <option value="ru" data-flag="🇷🇺">Pусский</option>
        </select>
      </div>
    </div>
    <div class="room-info">Bu Kodu Sohbete Katılmak İsteyenlere Veriniz.</div>
  </div>

  <div class="people">
    <div class="people-scroll" id="peopleScroll"></div>
  </div>

  <div class="chat" id="chat">
    <div style="align-self:center; font-size:11px; opacity:0.4; margin:10px 0;">Oda hazır, çeviri başlıyor...</div>
  </div>

  <div class="input" id="inputDock">
    <button id="micBtn" class="dock-btn mic-btn">🎙️</button>
    <textarea id="msgInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
    <button id="sendBtn" class="dock-btn send-btn">➤</button>
  </div>
</div>

<script>
  // KLAVYE HATASI KESİN ÇÖZÜM
  const room = document.getElementById('roomContainer');
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msgInput');

  const fixLayout = () => {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      room.style.height = `${vh}px`;
      // Mesajlar klavyenin üstünde kalsın
      setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 100);
    }
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fixLayout);
  }

  msgInput.addEventListener('focus', () => {
    setTimeout(fixLayout, 300); // Klavye animasyonu bitişini bekle
  });

  // DİL SEÇİMİ GÖRSEL GÜNCELLEME
  const langSelect = document.getElementById('langSelect');
  const flagSpan = document.getElementById('currentLangFlag');
  const nameSpan = document.getElementById('currentLangName');

  langSelect.addEventListener('change', () => {
    const selected = langSelect.options[langSelect.selectedIndex];
    flagSpan.innerText = selected.getAttribute('data-flag');
    nameSpan.innerText = selected.text;
  });

  // Textarea otomatik uzama
  msgInput.addEventListener("input", function() {
    this.style.height = '44px';
    this.style.height = (this.scrollHeight) + 'px';
  });
</script>

<script type="module" src="/js/alltoall_room.js?v=fix_host_open_1"></script>
</body>
</html>
