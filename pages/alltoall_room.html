<!-- FILE: /pages/alltoall_room.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --actionH:58px;
      --profileH:74px;
      --controlsH:70px;
      --peopleH:84px;
      --dockH:134px;

      --txt:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.58);
      --line:rgba(255,255,255,.07);

      --cyan:#67e8f9;
      --violet:#7c5cff;
      --pink:#f472b6;

      --panel:rgba(255,255,255,.05);
      --accentGrad:linear-gradient(135deg,#67e8f9 0%,#7c5cff 48%,#f472b6 100%);
      --bracketGrad:linear-gradient(180deg,#67e8f9 0%,#7c5cff 55%,#f472b6 100%);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      background:#07040d;
    }

    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(103,232,249,.10) 0%, transparent 24%),
        radial-gradient(circle at 14% 18%, rgba(244,114,182,.10) 0%, transparent 20%),
        radial-gradient(circle at 86% 15%, rgba(124,92,255,.14) 0%, transparent 18%),
        linear-gradient(180deg,#06030b 0%,#0b0712 100%);
    }

    #pageContent{
      width:100%;
      height:calc(100dvh - var(--footerH, 0px));
      overflow:hidden;
    }

    .room{
      width:min(500px,100vw);
      height:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .actionbar{
      height:var(--actionH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }

    .iconBtn{
      width:40px;
      height:40px;
      border:none;
      background:rgba(255,255,255,.06);
      color:#fff;
      border-radius:14px;
      font-size:18px;
      cursor:pointer;
      flex:0 0 auto;
    }

    .profile{
      min-height:var(--profileH);
      padding:10px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }

    .profile-avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      overflow:hidden;
      background:rgba(255,255,255,.08);
      border:2px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:15px;
      flex:0 0 auto;
    }

    .profile-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-kicker{
      font-size:10px;
      font-weight:900;
      letter-spacing:.5px;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .profile-name{
      font-size:18px;
      font-weight:900;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .profile-note{
      margin-top:4px;
      font-size:11px;
      color:rgba(255,255,255,.62);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .controls{
      min-height:var(--controlsH);
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }

    #langSelect{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;
      height:1px;
    }

    #roomPill{
      min-width:98px;
      max-width:118px;
      height:42px;
      padding:0 14px;
      border-radius:14px;
      background:linear-gradient(135deg,#5b21b6,#7c3aed,#a855f7);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 0 18px rgba(124,92,255,.20);
      color:#fff;
      font-size:15px;
      font-weight:900;
      letter-spacing:1px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      flex:0 0 auto;
    }

    .langBtn{
      min-width:170px;
      max-width:240px;
      height:42px;
      border:none;
      border-radius:16px;
      padding:0 14px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:14px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
    }

    .langBtnText{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .peopleBar{
      min-height:var(--peopleH);
      padding:10px 14px 12px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow:hidden;
    }

    .peopleHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .peopleTitle{
      font-size:11px;
      font-weight:900;
      letter-spacing:.5px;
      color:var(--muted);
      text-transform:uppercase;
    }

    .peopleCount{
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.72);
      white-space:nowrap;
    }

    .peopleScroll{
      display:flex;
      gap:14px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      min-height:0;
    }

    .peopleScroll::-webkit-scrollbar{ display:none; }

    .pItem{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:max-content;
      flex:0 0 auto;
      padding:4px 0;
    }

    .pAvatar{
      width:36px;
      height:36px;
      border-radius:50%;
      overflow:hidden;
      background:rgba(255,255,255,.08);
      border:2px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:12px;
      flex:0 0 auto;
    }

    .pAvatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .pName{
      font-size:12px;
      font-weight:800;
      color:rgba(255,255,255,.90);
      white-space:nowrap;
    }

    .chatWrap{
      flex:1;
      min-height:0;
      padding:12px 14px 8px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .chat{
      flex:1;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding-bottom:8px;
      scrollbar-width:none;
      scroll-behavior:smooth;
    }

    .chat::-webkit-scrollbar{ display:none; }

    .sys-note{
      align-self:center;
      max-width:88%;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.06);
      color:rgba(255,255,255,.74);
      font-size:11px;
      font-weight:800;
      text-align:center;
    }

    .msg-row{
      width:100%;
      display:flex;
    }

    .msg-row.left{ justify-content:flex-start; }
    .msg-row.right{ justify-content:flex-end; }

    .msg-card{
      position:relative;
      max-width:92%;
      min-width:120px;
      padding-left:18px;
    }

    .msg-bracket{
      position:absolute;
      left:0;
      top:2px;
      bottom:2px;
      width:8px;
      pointer-events:none;
    }

    .msg-bracket::before,
    .msg-bracket::after,
    .msg-bracket .mid{
      content:"";
      position:absolute;
      left:0;
      width:8px;
      background:var(--bracketGrad);
      border-radius:999px;
      box-shadow:0 0 10px rgba(124,92,255,.22);
    }

    .msg-bracket::before{
      top:0;
      height:12px;
    }

    .msg-bracket .mid{
      top:10px;
      bottom:10px;
      width:3px;
      left:2px;
      border-radius:999px;
    }

    .msg-bracket::after{
      bottom:0;
      height:12px;
    }

    .msg-head{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
      min-width:0;
    }

    .msg-name{
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.84);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:140px;
    }

    .msg-lang{
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.58);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }

    .msg-spk{
      width:24px;
      height:24px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
      padding:0;
      margin-left:auto;
    }

    .msg-spk svg{
      width:13px;
      height:13px;
      stroke:#fff;
      fill:none;
      stroke-width:2;
    }

    .msg-bubble{
      display:inline-block;
      font-size:14.5px;
      line-height:1.5;
      color:rgba(255,255,255,.95);
      background:rgba(255,255,255,.04);
      padding:10px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.06);
      word-break:break-word;
    }

    .msg-row.right .msg-bubble{
      background:linear-gradient(135deg,rgba(103,232,249,.14),rgba(124,92,255,.16));
    }

    .dock{
      min-height:var(--dockH);
      border-top:1px solid rgba(255,255,255,.08);
      background:rgba(10,6,16,.92);
      backdrop-filter:blur(10px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:10px 14px calc(18px + env(safe-area-inset-bottom) + var(--footerH, 0px));
      flex:0 0 auto;
    }

    .main-mic{
      width:78px;
      height:78px;
      border:none;
      border-radius:50%;
      background:var(--accentGrad);
      color:#050208;
      font-size:30px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(103,232,249,.20);
      transition:transform .16s ease, box-shadow .16s ease;
    }

    .main-mic.listening{
      box-shadow:0 0 0 8px rgba(244,114,182,.16), 0 0 28px rgba(244,114,182,.28);
      transform:scale(1.04);
    }

    .micHint{
      text-align:center;
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.72);
      line-height:1.3;
      min-height:28px;
      max-width:280px;
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      z-index:9998;
    }

    .sheet-backdrop.show{
      opacity:1;
      pointer-events:auto;
    }

    .lang-sheet{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%) translateY(110%);
      width:min(500px,100vw);
      background:linear-gradient(180deg,rgba(20,18,30,.98),rgba(10,8,18,.98));
      border:1px solid rgba(255,255,255,.10);
      border-bottom:none;
      border-radius:28px 28px 0 0;
      box-shadow:0 -20px 60px rgba(0,0,0,.42);
      transition:.24s ease;
      z-index:9999;
      padding:10px 14px calc(18px + env(safe-area-inset-bottom));
      max-height:72dvh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .lang-sheet.show{
      transform:translateX(-50%) translateY(0);
    }

    .sheet-handle{
      width:52px;
      height:5px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      margin:2px auto 2px;
    }

    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .sheet-title{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:700;
      letter-spacing:-.4px;
    }

    .sheet-close{
      width:38px;
      height:38px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }

    .sheet-list{
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      scrollbar-width:none;
    }

    .sheet-list::-webkit-scrollbar{ display:none; }

    .sheet-item{
      min-height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 14px;
      cursor:pointer;
      color:#fff;
      transition:.16s ease;
    }

    .sheet-item.active{
      border-color:rgba(0,242,254,.34);
      background:linear-gradient(135deg,rgba(0,242,254,.12),rgba(124,92,255,.12));
      box-shadow:0 0 0 1px rgba(0,242,254,.08) inset;
    }

    .sheet-item-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .sheet-flag{
      width:32px;
      text-align:center;
      font-size:22px;
      flex:0 0 auto;
    }

    .sheet-text{
      min-width:0;
    }

    .sheet-name{
      font-size:14px;
      font-weight:900;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sheet-code{
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.56);
      margin-top:3px;
      letter-spacing:.5px;
    }

    .sheet-check{
      width:24px;
      height:24px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.26);
      flex:0 0 auto;
    }

    .sheet-item.active .sheet-check{
      border-color:var(--cyan);
      box-shadow:inset 0 0 0 5px var(--cyan);
    }
  </style>
</head>

<body>
  <div id="pageContent">
    <div class="room" id="roomContainer">

      <div class="actionbar">
        <button id="backBtn" class="iconBtn" type="button">←</button>
        <button id="exitBtn" class="iconBtn" type="button">✕</button>
      </div>

      <div class="profile">
        <div class="profile-avatar" id="myAvatar">A</div>
        <div class="profile-meta">
          <div class="profile-kicker" id="profileKicker">Aktif Profil</div>
          <div class="profile-name" id="myName">Katılımcı</div>
          <div class="profile-note" id="myNote">Canlı çeviri odasına bağlı</div>
        </div>
      </div>

      <div class="controls">
        <select id="langSelect" aria-label="Dil seç"></select>

        <div id="roomPill">------</div>

        <button id="langPickerBtn" class="langBtn" type="button" aria-label="Dil seç">
          <span class="langBtnText" id="langPickerText">🌐 Dil</span>
          <span>⌄</span>
        </button>
      </div>

      <div class="peopleBar">
        <div class="peopleHead">
          <div class="peopleTitle" id="peopleTitle">Katılımcılar</div>
          <div class="peopleCount"><span id="peopleCount">0</span> <span id="peopleCountText">kişi</span></div>
        </div>
        <div class="peopleScroll" id="peopleScroll"></div>
      </div>

      <div class="chatWrap">
        <div class="chat" id="chat"></div>
      </div>

      <div class="dock">
        <button id="micBtn" class="main-mic" type="button" aria-label="Konuş">🎙️</button>
        <div class="micHint" id="micHint">Konuşmak için mikrofona dokun.</div>
      </div>

    </div>
  </div>

  <div class="sheet-backdrop" id="langSheetBackdrop"></div>

  <div class="lang-sheet" id="langSheet" aria-hidden="true">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <div class="sheet-title" id="langSheetTitle">Dil Seç</div>
      <button id="langSheetClose" class="sheet-close" type="button">✕</button>
    </div>

    <div class="sheet-list" id="langSheetList"></div>
  </div>

  <script type="module" src="/js/alltoall_room.js?v=final_ui_1"></script>
</body>
</html>
