<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 70px;
      --metaH: 80px;
      --peopleH: 110px; /* Avatar ve isim için ideal alan */
      --dockH: 80px;
      --accent: #00f2fe;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050208;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    .room {
      position: relative;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #050208;
    }

    /* Üst Alanlar */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .meta { height: var(--metaH); display: flex; flex-direction: column; justify-content: center; padding: 0 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .room-info { font-size: 10px; color: var(--accent); font-weight: 700; margin-top: 5px; }

    /* KATILIMCILAR - Tam Ortalanmış Avatarlar */
    .people { height: var(--peopleH); padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .people-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .pItem { display: flex; flex-direction: column; align-items: center; min-width: 65px; }
    .pAvatar { 
      width: 48px; height: 48px; border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.1); 
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }
    .pName { font-size: 10px; font-weight: 800; margin-top: 6px; text-align: center; white-space: nowrap; }

    /* CHAT - Kavisli Renkli Çizgi Tasarımı */
    .chat { flex: 1; overflow-y: auto; padding: 15px 16px; display: flex; flex-direction: column; gap: 18px; }
    
    .msg-row { max-width: 90%; display: flex; flex-direction: column; position: relative; }
    .msg-row.left { align-self: flex-start; padding-left: 14px; }
    .msg-row.right { align-self: flex-end; padding-right: 14px; align-items: flex-end; }

    /* Parenteze benzeyen kavisli çizgi */
    .msg-line { 
      position: absolute; top: 2px; bottom: 2px; width: 4px; 
      border-radius: 10px; /* Kavisli uçlar */
    }
    .msg-row.left .msg-line { left: 0; }
    .msg-row.right .msg-line { right: 0; }

    .sender-name { font-size: 12px; font-weight: 900; margin-bottom: 4px; letter-spacing: 0.3px; }
    .msg-bubble { font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,0.95); }

    /* Giriş Alanı - Klavye Sabitli */
    .input { 
      height: var(--dockH); background: #0a0510; border-top: 1px solid rgba(255,255,255,0.1); 
      display: flex; align-items: center; gap: 8px; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); 
      z-index: 1000;
    }
    textarea { flex: 1; height: 44px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; padding: 12px 16px; font-size: 15px; resize: none; }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    .mic-btn { background: #1a1d33; font-size: 20px; }
    .send-btn { background: var(--accent); color: #000; font-size: 18px; }
  </style>
</head>

<body>
<div class="room" id="roomContainer">
  <div class="topbar">
    <button id="backBtn" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
    <div style="flex:1; text-align:center; font-family:'Space Grotesk'; font-weight:700; font-size:22px;">All<span style="color:var(--accent)">To</span>All</div>
    <button id="exitBtn" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
  </div>

  <div class="meta">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div id="roomPill" style="background:#7000ff; padding:4px 14px; border-radius:10px; font-weight:700; font-size:18px;">------</div>
      <div style="background:rgba(255,255,255,0.08); padding:6px 12px; border-radius:10px; font-size:13px; font-weight:700;">🇹🇷 Türkçe ▼</div>
    </div>
    <div class="room-info">Bu Kodu Sohbete Katılmak İsteyenlere Veriniz.</div>
  </div>

  <div class="people">
    <div class="people-scroll" id="peopleScroll">
      </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input" id="inputDock">
    <button id="micBtn" class="dock-btn mic-btn">🎙️</button>
    <textarea id="msgInput" rows="1" placeholder="Yazmaya başla..."></textarea>
    <button id="sendBtn" class="dock-btn send-btn">➤</button>
  </div>
</div>

<script>
  // İSİM FORMATLAMA FONKSİYONU
  function formatName(fullName) {
    if (!fullName) return "";
    const parts = fullName.trim().split(/\s+/);
    if (parts.length === 1) return parts[0];
    
    const first = parts[0];
    const rest = parts.slice(1).map(p => p[0].toUpperCase() + ".").join("");
    return `${first} ${rest}`;
  }

  // KLAVYE HATASI KESİN ÇÖZÜM
  const room = document.getElementById('roomContainer');
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msgInput');

  const fixLayout = () => {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      room.style.height = `${vh}px`;
      setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 100);
    }
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fixLayout);
  }
  msgInput.addEventListener('focus', () => { setTimeout(fixLayout, 400); });

  // Textarea otomatik uzama
  msgInput.addEventListener("input", function() {
    this.style.height = '44px';
    this.style.height = (this.scrollHeight) + 'px';
  });
</script>

<script type="module" src="/js/alltoall_room.js?v=fix_host_open_1"></script>
</body>
</html>
