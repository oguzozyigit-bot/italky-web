<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --topH:70px; /* Tek ve güçlü bir bar */
      --dockH:90px;
      --accentGrad:linear-gradient(135deg,#67e8f9 0%,#7c5cff 48%,#f472b6 100%);
      --cyan:#67e8f9;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    html,body{
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden; background:#06030b; color:#fff; font-family:'Outfit',sans-serif;
    }

    body{
      background: 
        radial-gradient(circle at 50% 0%, rgba(103,232,249,.10) 0%, transparent 30%),
        linear-gradient(180deg,#05030a 0%,#0a0712 100%);
    }

    .room{
      width:min(500px,100vw);
      height:100dvh;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    /* ÜST BAR - TEK VE NET */
    .topbar{
      height:var(--topH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:rgba(255,255,255,0.02);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      z-index:100;
    }

    .brand{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
    .brand span{ color:var(--cyan); }

    .top-action-btn{
      width:42px; height:42px; border:none; border-radius:14px;
      background:rgba(255,255,255,0.06); color:#fff; font-size:18px; cursor:pointer;
    }

    /* KATILIMCILAR VE DİL SEÇİMİ (TEK SATIR) */
    .meta-row{
      padding:12px 16px;
      display:flex;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,0.01);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    #roomPill{
      background:linear-gradient(135deg,#5b21b6,#7c3aed);
      padding:6px 14px; border-radius:12px; font-weight:900; font-size:16px;
      letter-spacing:1px; box-shadow:0 0 15px rgba(112,0,255,0.3);
    }

    .langBtn{
      flex:1; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05); color:#fff; display:flex; 
      align-items:center; justify-content:space-between; padding:0 12px; font-weight:700; cursor:pointer;
    }

    /* CHAT ALANI */
    .chat-stage{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      padding:10px 0;
    }

    .chat{
      flex:1; overflow-y:auto; padding:0 16px;
      display:flex; flex-direction:column; gap:16px;
      scrollbar-width:none;
    }
    .chat::-webkit-scrollbar{ display:none; }

    /* MESAJ TASARIMI (Hafif ve Pro) */
    .msg-row{ display:flex; flex-direction:column; max-width:85%; }
    .msg-row.right{ align-self:flex-end; align-items:flex-end; }
    .msg-bubble{
      padding:12px 16px; border-radius:18px; background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08); font-size:14.5px; line-height:1.5;
    }
    .msg-row.right .msg-bubble{ background:linear-gradient(135deg,rgba(103,232,249,0.1),rgba(124,92,255,0.1)); border-color:rgba(103,232,249,0.2); }

    /* ALT DOCK VE MİC (DOCK ÜSTÜNDE ORTALANMIŞ) */
    .footer-dock{
      position:relative;
      height:calc(var(--dockH) + env(safe-area-inset-bottom));
      background:rgba(10,8,18,0.95);
      backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,0.1);
      display:flex;
      align-items:center;
      justify-content:center;
      padding-bottom:env(safe-area-inset-bottom);
    }

    /* MİC: DOCK'UN ÜSTÜNDE YARI DIŞARIDA */
    .mic-wrap{
      position:absolute;
      top:-40px; /* Dock'un üzerine biniyor */
      left:50%;
      transform:translateX(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    .main-mic{
      width:80px; height:80px; border:none; border-radius:50%;
      background:var(--accentGrad); color:#000; font-size:32px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 30px rgba(0,242,254,0.3);
      cursor:pointer; z-index:10; transition:0.2s;
    }

    .main-mic.listening{
      animation: micPulse 1.5s infinite;
      transform:translateX(-50%) scale(1.05);
    }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(103,232,249,0.5); }
      70% { box-shadow: 0 0 0 20px rgba(103,232,249,0); }
      100% { box-shadow: 0 0 0 0 rgba(103,232,249,0); }
    }

    .mic-hint{ font-size:11px; font-weight:800; color:var(--cyan); text-transform:uppercase; letter-spacing:1px; }

    /* Gizli Öğeler (JS Uyumu İçin) */
    .hide, #langSelect{ display:none; }
    
    /* Sheet Stilleri (Kısaltılmış, Orijinal Mantık) */
    .sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.6); opacity:0; pointer-events:none; z-index:999; transition:0.3s; }
    .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
    .lang-sheet{ 
      position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%);
      width:min(500px,100vw); background:#121018; border-radius:24px 24px 0 0;
      padding:20px; z-index:1000; transition:0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .lang-sheet.show{ transform:translateX(-50%) translateY(0); }
  </style>
</head>

<body>
  <div class="room" id="roomContainer">
    
    <header class="topbar">
      <button id="backBtn" class="top-action-btn">←</button>
      <div class="brand">All<span>To</span>All</div>
      <button id="exitBtn" class="top-action-btn">✕</button>
    </header>

    <div class="meta-row">
      <div id="roomPill">------</div>
      <button id="langPickerBtn" class="langBtn">
        <span id="langPickerText">🌐 Dil Seçin</span>
        <span>⌄</span>
      </button>
      <button id="soundToggleBtn" class="top-action-btn" style="width:40px; height:40px; border-radius:12px;">🔊</button>
    </div>

    <main class="chat-stage">
      <div class="chat" id="chat">
        <div class="sys-note">italkyAI odası hazır. Mikrofonla konuşmaya başlayın.</div>
      </div>
    </main>

    <footer class="footer-dock">
      <div class="mic-wrap">
        <button id="micBtn" class="main-mic">🎙️</button>
        <div class="mic-hint" id="micHint">KONUŞ</div>
      </div>
      
      <div style="font-size:11px; opacity:0.6; position:absolute; right:20px;">
        <span id="peopleCount">0</span> KATILIMCI
      </div>
    </div>

  </div>

  <select id="langSelect"></select>
  <div class="sheet-backdrop" id="langSheetBackdrop"></div>
  <div class="lang-sheet" id="langSheet">
    <div style="width:40px; height:4px; background:rgba(255,255,255,0.2); margin:0 auto 20px; border-radius:2px;"></div>
    <div id="langSheetList" style="max-height:60dvh; overflow-y:auto;"></div>
  </div>

  <script type="module" src="/js/alltoall_room.js?v=split_face_style_1"></script>
</body>
</html>
