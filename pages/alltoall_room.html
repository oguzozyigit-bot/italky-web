<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 70px;
      --metaH: 60px;
      --peopleH: 96px;
      --dockH: 80px;
      --accent: #00f2fe;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050208;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      position: fixed; /* Kaymayı engellemek için */
    }

    .room {
      position: relative;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #050208;
    }

    /* Üst Alanlar */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .meta { height: var(--metaH); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: rgba(255,255,255,0.02); }
    .people { height: var(--peopleH); padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .people-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .pAvatar { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
    .pAvatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    /* Chat Alanı - Yeni Tasarım */
    .chat { flex: 1; overflow-y: auto; padding: 15px 16px; display: flex; flex-direction: column; gap: 16px; }

    .msg-row { max-width: 90%; display: flex; flex-direction: column; position: relative; }
    .msg-row.left { align-self: flex-start; padding-left: 12px; }
    .msg-row.right { align-self: flex-end; padding-right: 12px; align-items: flex-end; }

    /* KATILIMCIYA ÖZEL RENKLİ ÇİZGİ */
    .msg-line {
      position: absolute;
      top: 4px; bottom: 4px;
      width: 4px;
      border-radius: 10px; /* Kavisli uçlar */
    }
    .msg-row.left .msg-line { left: 0; }
    .msg-row.right .msg-line { right: 0; }

    .sender-name { 
      font-size: 11px; 
      font-weight: 900; 
      margin-bottom: 4px; 
      opacity: 0.9;
    }

    .msg-bubble {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.95);
      word-break: break-word;
    }

    /* Giriş Alanı - Klavye Sabitleme */
    .input { 
      height: var(--dockH); 
      background: #0d0915; 
      border-top: 1px solid rgba(255,255,255,0.1); 
      display: flex; align-items: center; gap: 8px; 
      padding: 0 12px calc(10px + env(safe-area-inset-bottom)); 
      z-index: 999;
    }
    textarea { flex: 1; height: 44px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; padding: 12px 16px; font-size: 15px; resize: none; }
    .dock-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    .mic-btn { background: #1a1d33; font-size: 20px; }
    .send-btn { background: #00f2fe; color: #000; font-size: 18px; }
  </style>
</head>

<body>
<div class="room" id="roomContainer">
  <div class="topbar">
    <button id="backBtn" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
    <div style="flex:1; text-align:center; font-family:'Space Grotesk'; font-weight:700;">All<span style="color:var(--accent)">To</span>All</div>
    <button id="exitBtn" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
  </div>

  <div class="meta">
    <div id="roomPill" style="background:#7000ff; padding:6px 16px; border-radius:12px; font-weight:700;">------</div>
    <select id="langSelect" class="lang-select"><option value="tr">🇹🇷 TR</option></select>
  </div>

  <div class="people">
    <div class="people-scroll" id="peopleScroll"></div>
  </div>

  <div class="chat" id="chat">
    </div>

  <div class="input" id="inputDock">
    <button id="micBtn" class="dock-btn mic-btn">🎙️</button>
    <textarea id="msgInput" rows="1" placeholder="Mesaj yaz..."></textarea>
    <button id="sendBtn" class="dock-btn send-btn">➤</button>
  </div>
</div>

<script>
  const room = document.getElementById('roomContainer');
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msgInput');

  // KLAVYE ÇÖZÜMÜ - viewport değişince boyutu zorla ayarla
  const updateLayout = () => {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      room.style.height = `${vh}px`;
      chat.scrollTop = chat.scrollHeight;
    }
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateLayout);
    window.visualViewport.addEventListener('scroll', updateLayout);
  }

  // Fokus olunca ekranı yukarı it
  msgInput.addEventListener('focus', () => {
    setTimeout(updateLayout, 300);
  });

  // Textarea otomatik uzama
  msgInput.addEventListener("input", function() {
    this.style.height = '44px';
    this.style.height = (this.scrollHeight) + 'px';
  });

  /* NOT: 50 katılımcıya kadar renk ayarı alltoall_room.js içinde 
     mesaj oluşturulurken şu şekilde yapılmalı:
     const colors = ['#4ade80', '#fb923c', '#60a5fa', '#f472b6', '#a78bfa', ...];
     const userColor = colors[userId % colors.length];
  */
</script>
<script type="module" src="/js/alltoall_room.js?v=fix_host_open_1"></script>
</body>
</html>
