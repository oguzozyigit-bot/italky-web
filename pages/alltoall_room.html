<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --topH: 64px;
      --metaH: 80px;
      --peopleH: 90px; /* Daraltıldı, yazım alanı arttı */
      --dockH: 110px;
      --accent: #00f2fe;
      --pink: #f472b6;
      --violet: #7c5cff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #050208;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    body {
      background: 
        radial-gradient(circle at 50% 0%, rgba(0,242,254,0.08) 0%, transparent 24%),
        linear-gradient(180deg, #050208 0%, #090411 100%);
    }

    .room {
      position: relative;
      width: min(500px, 100vw);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Üst Bar */
    .topbar { height: var(--topH); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .brand { flex: 1; text-align: center; font-family: 'Space Grotesk'; font-weight: 700; font-size: 20px; }
    .brand .accent { color: var(--accent); }

    /* Meta & Oda Bilgisi */
    .meta { 
      min-height: var(--metaH); 
      display: flex; flex-direction: column; justify-content: center;
      padding: 8px 16px; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
    }
    .metaTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    #roomPill { background: #7000ff; padding: 4px 14px; border-radius: 10px; font-weight: 900; font-size: 18px; letter-spacing: 1px; }
    #langSelect { height: 34px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700; padding: 0 8px; }
    .room-info { font-size: 10px; color: var(--accent); font-weight: 800; opacity: 0.8; }

    /* Katılımcılar - ALT BOŞLUK SIFIRLANDI */
    .people { height: var(--peopleH); padding: 5px 0 0 0; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .people-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .pItem { display: flex; flex-direction: column; align-items: center; min-width: 58px; }
    .pAvatar { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.1); overflow: hidden; background: rgba(255,255,255,0.05); }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }
    .pName { font-size: 9px; font-weight: 800; margin-top: 4px; text-align: center; color: rgba(255,255,255,0.8); max-width: 60px; overflow: hidden; }

    /* Chat Alanı */
    .chat { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
    .msg-row { max-width: 90%; display: flex; flex-direction: column; position: relative; }
    .msg-row.left { align-self: flex-start; padding-left: 12px; }
    .msg-row.right { align-self: flex-end; padding-right: 12px; align-items: flex-end; }
    
    /* Kavisli Çizgi Mantığı */
    .msg-line { position: absolute; top: 2px; bottom: 2px; width: 3px; border-radius: 10px; }
    .msg-row.left .msg-line { left: 0; }
    .msg-row.right .msg-line { right: 0; }
    .sender-name { font-size: 11px; font-weight: 900; margin-bottom: 2px; }
    .msg-bubble { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.9); }

    /* YENİ NESİL MİC-DOCK */
    .input {
      min-height: var(--dockH);
      background: linear-gradient(0deg, #0a0510 0%, #0d0915 100%);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      z-index: 1000; flex-shrink: 0;
    }

    .mic-only-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }

    .mic-side-btn {
      width: 46px; height: 46px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #fff; font-size: 20px; cursor: pointer;
    }

    /* İkonik Pro Mic */
    .main-mic {
      width: 76px; height: 76px; border-radius: 50%; border: none;
      background: #120d16;
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }

    .main-mic::before {
      content: ""; position: absolute; inset: 4px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--violet));
      opacity: 0.9; z-index: 1;
    }

    .main-mic .mic-icon { position: relative; z-index: 2; font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    .main-mic.listening::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid var(--pink);
      animation: micPulse 1.5s infinite;
    }

    @keyframes micPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .mic-hint { text-align: center; font-size: 10px; font-weight: 700; color: var(--accent); margin-top: 8px; opacity: 0.7; }

    /* Text Entry Alanı */
    .text-entry { display: none; margin-top: 10px; animation: slideUp 0.3s ease-out; }
    .text-entry.show { display: flex; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    textarea {
      flex: 1; height: 46px; max-height: 120px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; color: #fff; padding: 12px 16px; font-size: 15px; resize: none;
    }

    .send-btn-dock { background: var(--accent); color: #000; font-weight: 900; border-radius: 50%; width: 46px; height: 46px; border: none; margin-left: 8px; }

    .hide { display: none !important; }
  </style>
</head>

<body>
<div class="room" id="roomContainer">

  <div class="topbar">
    <button id="backBtn" class="topBtn">←</button>
    <div class="brand">All<span class="accent">To</span>All</div>
    <button id="exitBtn" class="topBtn">✕</button>
  </div>

  <div class="meta">
    <div class="metaTop">
      <div id="roomPill">------</div>
      <div style="display: flex; gap: 8px;">
        <select id="langSelect">
          <option value="tr">🇹🇷 TR</option>
          <option value="en">🇬🇧 EN</option>
        </select>
        <button id="soundToggleBtn" style="background:none; border:none; font-size:18px;">🔊</button>
      </div>
    </div>
    <div class="room-info">Bu kodu sohbete katılmak isteyenlere veriniz.</div>
  </div>

  <div class="people">
    <div class="people-scroll" id="peopleScroll"></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input" id="inputDock">
    <div class="mic-only-row">
      <button id="textToggleBtn" class="mic-side-btn">⌨️</button>
      <button id="micBtn" class="main-mic">
        <span class="mic-icon">🎙️</span>
      </button>
      <div id="textSendArea" class="text-entry">
         <textarea id="msgInput" placeholder="Yazmaya başla..."></textarea>
         <button id="sendBtn" class="send-btn-dock">➤</button>
      </div>
    </div>
    <div class="mic-hint" id="micHint">Konuşmak için dokun, yazmak için klavyeye bas.</div>
  </div>
</div>

<script>
  const room = document.getElementById("roomContainer");
  const chat = document.getElementById("chat");
  const msgInput = document.getElementById("msgInput");
  const textToggleBtn = document.getElementById("textToggleBtn");
  const textSendArea = document.getElementById("textSendArea");

  function fixLayout() {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      room.style.height = `${vh}px`;
      setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 100);
    }
  }

  textToggleBtn?.addEventListener("click", () => {
    textSendArea.classList.toggle("show");
    if(textSendArea.classList.contains("show")) {
      setTimeout(() => { msgInput.focus(); fixLayout(); }, 100);
    } else {
      fixLayout();
    }
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fixLayout);
  }

  msgInput?.addEventListener("focus", () => { setTimeout(fixLayout, 300); });
  msgInput?.addEventListener("input", function() {
    this.style.height = "46px";
    this.style.height = (this.scrollHeight) + "px";
  });

  fixLayout();
</script>

<script type="module" src="/js/alltoall_room.js?v=mic_first_1"></script>
</body>
</html>
