<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • AllToAll</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

:root{
--dockH:82px;
--topH:70px;
--metaH:46px;
--peopleH:64px;
--kb-offset:0px;
--frameW:min(480px,100vw);
}

body{
margin:0;
background:#000;
font-family:'Outfit',sans-serif;
color:#fff;
overflow:hidden;
}

.room{
position:relative;
width:var(--frameW);
height:100dvh;
margin:auto;
background:#06070d;
}

.topbar{
position:absolute;
top:0;
left:0;
right:0;
height:var(--topH);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
background:#0a0b12;
border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
text-align:center;
flex:1;
font-family:'Space Grotesk';
font-weight:700;
}

.meta{
position:absolute;
top:var(--topH);
left:0;
right:0;
height:var(--metaH);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
background:#0b0d18;
border-bottom:1px solid rgba(255,255,255,.06);
}

.room-pill{
background:#111326;
padding:6px 12px;
border-radius:12px;
font-family:monospace;
cursor:pointer;
}

.people{
position:absolute;
top:calc(var(--topH) + var(--metaH));
left:0;
right:0;
height:var(--peopleH);
display:flex;
align-items:center;
gap:10px;
padding:0 12px;
overflow-x:auto;
border-bottom:1px solid rgba(255,255,255,.06);
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
overflow:hidden;
background:#222;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.chat{
position:fixed;
left:50%;
transform:translateX(-50%);
width:var(--frameW);
top:calc(var(--topH) + var(--metaH) + var(--peopleH));
bottom:calc(var(--dockH) + var(--kb-offset));
overflow:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:80%;
padding:10px 14px;
border-radius:14px;
font-size:14px;
}

.msg.left{
background:#14162a;
align-self:flex-start;
}

.msg.right{
background:linear-gradient(135deg,#ff4ecb,#7c5cff);
align-self:flex-end;
}

.input{
position:fixed;
left:50%;
transform:translateX(-50%);
width:var(--frameW);
bottom:var(--kb-offset);
height:var(--dockH);
background:#0c0d18;
display:flex;
align-items:center;
gap:8px;
padding:10px;
border-top:1px solid rgba(255,255,255,.06);
}

textarea{
flex:1;
background:#111326;
border:none;
border-radius:14px;
color:#fff;
padding:10px;
font-size:14px;
resize:none;
}

button{
background:#1a1d33;
border:none;
color:#fff;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
}

.lang-sheet{
position:fixed;
left:50%;
transform:translateX(-50%);
top:120px;
width:min(420px,90vw);
max-height:60vh;
overflow:auto;
background:#0c0e18;
border-radius:16px;
display:none;
z-index:100;
}

.lang-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

.lang-item:hover{
background:#14162a;
}

</style>
</head>

<body>

<div class="room">

<div class="topbar">
<button id="backBtn">←</button>
<div class="brand">AllToAll</div>
<button id="exitBtn">✕</button>
</div>

<div class="meta">
<div>ODA <span id="roomCode" class="room-pill">------</span></div>
<button id="langBtn">🌐</button>
</div>

<div class="people" id="people"></div>

<div class="chat" id="chat"></div>

<div class="input">
<textarea id="msgInput" rows="1" placeholder="Yaz..."></textarea>
<button id="micBtn">🎤</button>
<button id="sendBtn">➤</button>
</div>

<div class="lang-sheet" id="langSheet"></div>

</div>

<script type="module" src="/js/alltoall_room.js"></script>

</body>
</html>
