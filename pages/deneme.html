<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Friend AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070a;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent-primary: #6366f1;
      --accent-secondary: #ec4899;
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    /* Dinamik Arka Plan */
    .bg-glow {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.1), transparent 35%);
      z-index: -1;
    }

    #pageContent {
      display: flex; flex-direction: column;
      height: 100vh;
      max-width: 800px; /* Desktop'ta çok yayılmaması için */
      margin: 0 auto;
      position: relative;
    }

    /* Header: Daha ince ve şık */
    .header {
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-orb {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    .brand-name { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; }

    /* Chat Alanı: "Ölü alanı" canlandıran kısım */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column;
      gap: 16px;
      scrollbar-width: none;
    }
    #chat::-webkit-scrollbar { display: none; }

    /* Mesaj Balonları: Daha modern ve geniş */
    .bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 22px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bubble.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text-main);
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2);
    }

    /* Dock / Giriş Alanı: Havada asılı gibi duran kompakt yapı */
    .input-container {
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .input-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex; align-items: flex-end;
      padding: 8px 12px;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-family: inherit;
      font-size: 15px;
      padding: 10px 4px;
      max-height: 150px;
      resize: none;
    }

    .action-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .action-btn svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; }

    .btn-send { background: var(--accent-primary); color: white; }
    .btn-send:hover { transform: scale(1.05); background: var(--accent-secondary); }

    .btn-clear { font-size: 12px; color: var(--text-dim); background: transparent; border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; height: auto; width: auto; font-weight: 600; }

  </style>
</head>

<body>
  <div class="bg-glow"></div>

  <div id="pageContent">
    <header class="header">
      <div class="brand">
        <div class="brand-orb"></div>
        <div class="brand-name">italky<span style="color:var(--accent-primary)">AI</span></div>
      </div>
      <div style="display: flex; gap: 8px;">
         <button class="btn-clear" id="muteBtn">SES</button>
         <button class="btn-clear" id="clearChat">TEMİZLE</button>
      </div>
    </header>

    <main id="chat">
      <div class="bubble bot">Selam! Ben italky. Bugün sana nasıl yardımcı olabilirim? ✨</div>
      <div class="bubble user">Merhaba, bana yeni tasarım hakkında ne düşündüğünü söyle.</div>
    </main>

    <div class="input-container">
      <div class="input-wrapper">
        <button class="action-btn" id="micBtn">
          <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
        </button>
        
        <textarea id="msgInput" rows="1" placeholder="Mesajını buraya yaz..." spellcheck="false"></textarea>

        <button class="action-btn btn-send" id="sendBtn">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/italky_chat_page.js?v=4"></script>
</body>
</html>
