<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;500;800&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #6366f1;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
  --glow: rgba(99, 102, 241, 0.4);
}

body {
  margin: 0; background: #000; color: #fff;
  font-family: 'Outfit', sans-serif; overflow: hidden;
  height: 100vh;
}

/* Kuantum Arka Plan */
.field {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 50% 50%, #0a0a20 0%, #000 100%);
}
.particle {
  position: absolute; width: 2px; height: 2px; background: #fff;
  border-radius: 50%; opacity: 0.3; animation: floatParticle 20s infinite linear;
}

#pageContent {
  width: 100%; height: 100%; max-width: 440px; margin: 0 auto;
  padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  display: flex; flex-direction: column; justify-content: center; gap: 40px;
}

/* THE CORE - Holografik QR */
.core-hub {
  position: relative; display: flex; justify-content: center;
  perspective: 1200px;
}

.hologram-ring {
  position: absolute; width: 280px; height: 280px;
  border: 1px solid var(--border); border-radius: 50%;
  animation: rotate 10s linear infinite;
}
.hologram-ring::after {
  content: ''; position: absolute; top: -5px; left: 50%;
  width: 10px; height: 10px; background: var(--primary);
  border-radius: 50%; box-shadow: 0 0 20px var(--primary);
}

.qr-plate {
  position: relative; width: 200px; height: 200px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 40px;
  padding: 15px; transform: rotateX(10deg);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.qr-plate img { width: 100%; height: 100%; border-radius: 25px; filter: invert(1) brightness(1.5); mix-blend-mode: screen; }

/* DYNAMIC MENU - Katmanlı Kartlar */
.menu-stack { display: flex; flex-direction: column; gap: 16px; }

.glass-card {
  position: relative; height: 80px;
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 24px; padding: 0 20px;
  display: flex; align-items: center; gap: 20px;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  overflow: hidden;
}

.glass-card:active { transform: scale(0.96) translateY(5px); background: rgba(255,255,255,0.08); }

/* Mekanik İkonlar */
.mech-icon {
  width: 44px; height: 44px; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05); border-radius: 14px;
}

.pulse-dot {
  position: absolute; width: 8px; height: 8px; background: var(--primary);
  border-radius: 50%; animation: pulse 2s infinite;
}

.card-txt h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.card-txt p { margin: 2px 0 0; font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

/* Animasyonlar */
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
@keyframes floatParticle { from { transform: translateY(0); } to { transform: translateY(-100vh); } }

</style>
</head>
<body>

<div class="field" id="particles"></div>

<main id="pageContent">

  <section class="core-hub">
    <div class="hologram-ring" style="animation-duration: 15s;"></div>
    <div class="hologram-ring" style="width: 320px; height: 320px; animation-direction: reverse; opacity: 0.4;"></div>
    <div class="qr-plate">
      <img id="smallQrImg" src="" alt="QR">
    </div>
  </section>

  <div style="text-align: center;">
    <h1 style="font-family:'Space Grotesk'; font-size: 28px; font-weight: 300; letter-spacing: 4px; margin: 0;">ITALKY<b style="font-weight: 800;">AI</b></h1>
    <div style="width: 40px; height: 2px; background: var(--primary); margin: 15px auto;"></div>
  </div>

  <nav class="menu-stack">
    <div class="glass-card" onclick="location.href='/facetoface.html'">
      <div class="mech-icon">
        <div class="pulse-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </div>
      <div class="card-txt">
        <h2>FaceToFace</h2>
        <p>Neural Voice Sync</p>
      </div>
    </div>

    <div class="glass-card" onclick="location.href='/pages/text_translate.html'">
      <div class="mech-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h11M4 17h7"/></svg>
      </div>
      <div class="card-txt">
        <h2>TextToText</h2>
        <p>Deep Semantic Engine</p>
      </div>
    </div>

    <div class="glass-card" onclick="location.href='/pages/f2f_connect.html'">
      <div class="mech-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </div>
      <div class="card-txt">
        <h2>Meeting Room</h2>
        <p>Multi-Node Bridge</p>
      </div>
    </div>
  </nav>

</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
try { mountShell({ scroll:"none" }); } catch(e) {}

// Arka plan partikülleri
const container = document.getElementById('particles');
for(let i=0; i<30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.animationDelay = Math.random() * 10 + 's';
  container.appendChild(p);
}

async function boot() {
  const code = localStorage.getItem("italky_interpreter_host_code") || "ITK-PRO";
  const url = `https://italky.ai/open/interpreter?host=${code}&v=1`;
  // Dark mode QR için renk ayarı
  document.getElementById("smallQrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&bgcolor=ffffff&data=${encodeURIComponent(url)}`;
}
boot();
</script>

</body>
</html>
