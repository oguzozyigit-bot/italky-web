<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>italky</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:#0b0f1a;
color:white;
display:flex;
justify-content:center;
}

.app{
width:420px;
max-width:100%;
padding:20px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.logo{
font-size:26px;
font-weight:600;
color:#3fa7ff;
}

.menu{
font-size:26px;
cursor:pointer;
}

/* MIC */

.mic-area{
display:flex;
justify-content:center;
margin-bottom:40px;
}

.mic{
width:130px;
height:130px;
border-radius:50%;
background:linear-gradient(145deg,#1c2b45,#0d1628);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
box-shadow:0 0 40px rgba(0,140,255,0.4);
cursor:pointer;
transition:.2s;
}

.mic:hover{
transform:scale(1.05);
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.card{
padding:22px;
border-radius:18px;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.face{
background:linear-gradient(135deg,#2a6fff,#00bfff);
}

.interpreter{
background:linear-gradient(135deg,#8a2be2,#ff4fd8);
}

.card h2{
margin:0;
font-size:20px;
}

.card p{
margin-top:6px;
opacity:.8;
font-size:14px;
}

</style>
</head>


<body>

<div class="app">

<div class="header">
<div class="logo">italky</div>
<div class="menu">☰</div>
</div>

<div class="mic-area">
<div class="mic">🎤</div>
</div>

<div class="cards">

<div class="card face" onclick="alert('Face to Face açılacak')">
<h2>Tek Telefon</h2>
<p>Face to Face</p>
</div>

<div class="card interpreter" onclick="alert('Interpreter açılacak')">
<h2>İki Telefon</h2>
<p>Interpreter</p>
</div>

</div>

</div>

</body>
</html>
