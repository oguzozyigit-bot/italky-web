<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V7</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');

  :root {
    /* Görseldeki o canlı renk paleti */
    --bg-gradient: linear-gradient(180deg, #FFB382 0%, #F07850 100%);
    --card-dark: #1E1B1E;
    --neon-pink: #E84DFB; /* Total Revenue pembesi */
    --neon-blue: #5C67F2;  /* Net Profit mavisi */
    --neon-lime: #D4FF5B;  /* Grafik ve vurgu yeşili */
    --glass-border: rgba(255,255,255,0.08);
  }

  html, body {
    background: var(--bg-gradient) !important;
    margin: 0; padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    color: #fff;
  }

  #pageContent {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .main-hub {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    justify-content: center;
  }

  /* Ana Kart Yapısı - Görseldeki siyah paneller gibi */
  .os-panel {
    position: relative;
    border-radius: 28px;
    background: var(--card-dark);
    border: 1px solid var(--glass-border);
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }

  .os-panel:active {
    transform: scale(0.95);
  }

  /* Sol İçerik Alanı */
  .content-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .btn-title {
    font-family: 'Space Grotesk';
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    color: #fff;
  }

  /* Görseldeki '274.3 K' yazısı gibi canlı renk vurgusu */
  .btn-title span {
    color: var(--accent-color);
    text-shadow: 0 0 15px var(--accent-color);
  }

  .btn-desc {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
  }

  /* Sağ İkon Alanı */
  .icon-box {
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
    position: relative;
  }

  /* İkon Altındaki Parlama */
  .icon-box::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    background: var(--accent-color);
    filter: blur(25px);
    opacity: 0.4;
    z-index: 0;
  }

  /* Renk Varyasyonları */
  .tr-node { --accent-color: var(--neon-pink); }
  .ac-node { --accent-color: var(--neon-blue); }
  .tc-node { --accent-color: var(--neon-lime); }

  /* Görseldeki o minik grafik çizgilerini anımsatan detay */
  .panel-footer {
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
    opacity: 0.3;
  }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="os-panel tr-node" onclick="location.href='/pages/translate_home.html'">
      <div class="content-wrap">
        <div class="btn-desc">Neural Language Flow</div>
        <h2 class="btn-title">Translate <span>AI</span></h2>
      </div>
      <div class="icon-box">📡</div>
      <div class="panel-footer"></div>
    </div>

    <div class="os-panel ac-node" onclick="location.href='/pages/acedemy_home.html'">
      <div class="content-wrap">
        <div class="btn-desc">Advanced Learning</div>
        <h2 class="btn-title">Academy <span>AI</span></h2>
      </div>
      <div class="icon-box">💎</div>
      <div class="panel-footer"></div>
    </div>

    <div class="os-panel tc-node" onclick="location.href='/pages/helper_home.html'">
      <div class="content-wrap">
        <div class="btn-desc">Logic Solution Engine</div>
        <h2 class="btn-title">Teacher <span>AI</span></h2>
      </div>
      <div class="icon-box">🧬</div>
      <div class="panel-footer"></div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
