<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI</title>
  <meta name="theme-color" content="#07080b"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07080b;
      --text:#f7f7f7;
      --muted:rgba(255,255,255,.58);
      --orange:#f59e0b;
      --orange2:#f97316;
      --green:#a3e635;
      --green2:#84cc16;
      --red:#ef4444;
      --yellow:#facc15;
      --glass:rgba(255,255,255,.045);
      --line:rgba(255,255,255,.08);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --header-h:84px;
      --footer-h:44px;
      --composer-h:86px;
      --keyboard-offset:0px;
      --app-height:100dvh;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0; width:100%; height:100%; overflow:hidden;
      font-family:Outfit, Arial, sans-serif;
      color:var(--text);
      background: #050608;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:var(--app-height);
      margin:0 auto;
      overflow:hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg,#050608 0%, #090b10 100%);
    }

    /* KARŞILAMA EKRANI */
    .welcome-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .welcome-screen.hidden { opacity: 0; pointer-events: none; }
    .welcome-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome-sub {
      font-size: 18px;
      font-weight: 500;
      color: var(--orange);
      letter-spacing: 0.5px;
    }

    .header{
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(12px + var(--safe-top)) 14px 10px;
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:10px;
      z-index:50;
      background:rgba(7,8,11,.9);
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(20px);
    }

    .icon-btn{
      width:44px; height:44px; border:none; border-radius:14px;
      background:rgba(255,255,255,.04); color:#fff;
      display:flex; align-items:center; justify-content:center;
    }

    .brand{ display:flex; flex-direction:column; align-items:center; }
    .brand-title{ margin:0; font-family:"Space Grotesk"; font-size:28px; font-weight:800; }
    .brand-title .ai{ background:linear-gradient(135deg, var(--orange), var(--green)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .brand-sub{ margin:0; font-size:9px; font-weight:900; letter-spacing:3px; color:rgba(255,255,255,.3); }

    .main{
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-scroll{
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 2;
    }
    .chat-scroll::-webkit-scrollbar { display: none; }

    .msg{ display:flex; width:100%; }
    .msg.left{ justify-content:flex-start; }
    .msg.right{ justify-content:flex-end; }
    .bubble{
      max-width:85%;
      padding:16px;
      border-radius:22px;
      font-size:15px;
      font-weight:600;
      line-height:1.4;
    }
    .bubble.left{ background:#16181d; border:1px solid var(--line); border-left:4px solid var(--orange); }
    .bubble.right{ background:var(--orange); color:#000; border-radius: 22px 22px 4px 22px; }

    .composer-wrap{
      padding: 12px;
      background: rgba(7,8,11,0.5);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .composer{
      display:flex; align-items:flex-end; gap:10px;
      padding:10px 12px; border-radius:24px;
      background:rgba(255,255,255,.05); border:1px solid var(--line);
    }
    .composer-input{
      flex:1; border:none; outline:none; background:transparent;
      color:#fff; font-size:16px; font-weight:600; font-family:inherit;
      max-height:120px; padding: 8px 0;
    }

    /* YENİ GÜNEŞ TASARIMLI AI CORE */
    .ai-live-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .sun-ray {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, var(--red) 0%, var(--orange2) 30%, transparent 70%);
        filter: blur(20px);
        opacity: 0.4;
        animation: sunFlare 3s ease-in-out infinite alternate;
    }
    .ai-live-core {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #ff4d4d 0%, #f97316 50%, #facc15 100%);
      box-shadow: 
        0 0 30px #ef4444,
        0 0 60px #f97316,
        0 0 100px rgba(250, 204, 21, 0.4);
      z-index: 2;
      animation: solarBreath 2s ease-in-out infinite;
    }
    .solar-fringe {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent, var(--orange), transparent, var(--red), transparent);
        filter: blur(15px);
        animation: rotateSolar 4s linear infinite;
        opacity: 0.6;
    }

    @keyframes solarBreath {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.15); filter: brightness(1.3); }
    }
    @keyframes sunFlare {
        from { transform: scale(0.8); opacity: 0.3; }
        to { transform: scale(1.2); opacity: 0.6; }
    }
    @keyframes rotateSolar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* MODALLAR VE DİĞERLERİ */
    .save-modal, .listen-modal, .menu { position:fixed; inset:0; z-index:9999; display:none; }
    .save-modal.open, .listen-modal.open, .menu.open { display:flex; }
    .listen-modal { background: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; }
    .save-card { background:#111; padding:24px; border-radius:24px; width:90%; max-width:380px; border:1px solid var(--line); }
    .save-input { width:100%; padding:14px; margin:15px 0; background:#222; border:1px solid #333; color:#fff; border-radius:12px; }
    .save-btn.primary { width:100%; padding:14px; background:var(--orange); border:none; border-radius:12px; font-weight:800; }

    .menu-panel { width:280px; background:#0a0b0e; height:100%; padding:20px; border-right:1px solid var(--line); }
    .menu-item { width:100%; padding:12px; margin-bottom:8px; background:#16181d; border:none; color:#fff; border-radius:10px; text-align:left; font-weight:700; }
    .hidden { display: none !important; }
    .avatar-btn img { width: 100%; height: 100%; border-radius: 50%; }

  </style>
</head>
<body>

<div class="save-modal" id="saveModal">
  <div class="save-card">
    <h3 style="margin:0">Sohbeti Kaydet</h3>
    <input id="saveChatName" class="save-input" type="text" placeholder="Sohbet başlığı...">
    <button class="save-btn primary" id="confirmSaveChat">Kaydet ve Yeni Sohbet Aç</button>
    <button style="background:none; border:none; color:var(--muted); margin-top:10px; width:100%" id="cancelSaveChat">Vazgeç</button>
  </div>
</div>

<div class="listen-modal" id="listenModal">
    <div class="ai-live-container">
        <div class="sun-ray"></div>
        <div class="solar-fringe"></div>
        <div class="ai-live-core"></div>
    </div>
    <p style="margin-top:30px; font-weight:800; color:var(--orange)">Dinliyorum...</p>
    <button id="closeListenModal" style="margin-top:20px; background:rgba(255,255,255,0.1); border:none; color:#fff; width:50px; height:50px; border-radius:50%; font-size:24px;">×</button>
</div>

<div class="menu" id="menu">
  <aside class="menu-panel">
    <div class="brand" style="margin-bottom:30px">
        <h1 class="brand-title">italky<span class="ai">AI</span></h1>
    </div>
    <button class="menu-item" id="newChatBtn">Yeni Sohbet</button>
    <button class="menu-item" id="saveChatMenuBtn">Sohbeti Kaydet</button>
    <button class="menu-item" id="clearChatMenuBtn">Sohbeti Temizle</button>
    <button class="menu-item" style="margin-top:20px; background:var(--red)" id="homeBtn">Çıkış Yap</button>
  </aside>
  <div style="flex:1" onclick="document.getElementById('menu').classList.remove('open')"></div>
</div>

<div class="app">
    <header class="header">
      <button class="icon-btn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <h1 class="brand-title">italky<span class="ai">AI</span></h1>
        <p class="brand-sub">BE FREE</p>
      </div>
      <button class="icon-btn" id="topAvatarBtn" style="padding:0; overflow:hidden">
        <img id="topAvatarImg" src="https://via.placeholder.com/44" alt="">
      </button>
    </header>

    <section class="main">
      <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-title">Merhaba Oğuz</div>
          <div class="welcome-sub">Nereden Başlayalım?</div>
      </div>
      
      <div class="chat-scroll" id="chatMessages"></div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="chatInput" class="composer-input" rows="1" placeholder="Mesajınızı yazın..."></textarea>
          <button id="micBtn" class="icon-btn" style="background:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v4M8 23h8"/></svg></button>
          <button id="sendBtn" class="icon-btn hidden" style="background:var(--orange); color:#000"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </section>
</div>

<script type="module">
  // Not: Supabase client yolunu projenize göre kontrol edin
  import { supabase } from "/js/supabase_client.js";

  const UI = {
    chatMessages: document.getElementById("chatMessages"),
    chatInput: document.getElementById("chatInput"),
    sendBtn: document.getElementById("sendBtn"),
    micBtn: document.getElementById("micBtn"),
    welcomeScreen: document.getElementById("welcomeScreen"),
    saveModal: document.getElementById("saveModal"),
    listenModal: document.getElementById("listenModal"),
    menu: document.getElementById("menu")
  };

  let currentSessionId = crypto.randomUUID();

  // KLAVYE VE VIEWPORT YÖNETİMİ
  function updateViewport() {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      document.documentElement.style.setProperty('--app-height', `${vh}px`);
      
      // Eğer klavye açıldıysa (ekran küçüldüyse) aşağı kaydır
      if (vh < window.innerHeight * 0.8) {
        setTimeout(() => {
            UI.chatInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight;
        }, 100);
      }
    }
  }

  window.visualViewport.addEventListener('resize', updateViewport);
  UI.chatInput.addEventListener('focus', () => setTimeout(updateViewport, 300));

  // MESAJ GÖNDERME
  async function sendMessage(text) {
    if (!text.trim()) return;

    UI.welcomeScreen.classList.add("hidden");
    
    // Sağ mesaj (Kullanıcı)
    const uMsg = document.createElement("div");
    uMsg.className = "msg right";
    uMsg.innerHTML = `<div class="bubble right">${text}</div>`;
    UI.chatMessages.appendChild(uMsg);
    
    UI.chatInput.value = "";
    UI.chatInput.style.height = "auto";
    toggleButtons();
    UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight;

    // AI Cevap Simülasyonu (Burada kendi API call fonksiyonunu kullanabilirsin)
    setTimeout(() => {
        const aiMsg = document.createElement("div");
        aiMsg.className = "msg left";
        aiMsg.innerHTML = `<div class="bubble left">Anladım Oğuz, bu konuda sana yardımcı olabilirim.</div>`;
        UI.chatMessages.appendChild(aiMsg);
        UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight;
    }, 1000);
  }

  function toggleButtons() {
    const hasText = UI.chatInput.value.length > 0;
    UI.sendBtn.classList.toggle("hidden", !hasText);
    UI.micBtn.classList.toggle("hidden", hasText);
  }

  UI.chatInput.addEventListener("input", () => {
    UI.chatInput.style.height = "auto";
    UI.chatInput.style.height = UI.chatInput.scrollHeight + "px";
    toggleButtons();
  });

  UI.sendBtn.onclick = () => sendMessage(UI.chatInput.value);

  // KAYDET VE YENİ SOHBET
  document.getElementById("confirmSaveChat").onclick = () => {
    // Burada Supabase kayıt fonksiyonlarını çağırabilirsin
    alert("Sohbet Kaydedildi!");
    
    // Otomatik Yeni Sohbet
    UI.chatMessages.innerHTML = "";
    UI.welcomeScreen.classList.remove("hidden");
    UI.saveModal.classList.remove("open");
    currentSessionId = crypto.randomUUID();
  };

  // MİKROFON MODU
  UI.micBtn.onclick = () => UI.listenModal.classList.add("open");
  document.getElementById("closeListenModal").onclick = () => UI.listenModal.classList.remove("open");

  // MENÜ
  document.getElementById("menuBtn").onclick = () => UI.menu.classList.add("open");
  document.getElementById("newChatBtn").onclick = () => {
    UI.chatMessages.innerHTML = "";
    UI.welcomeScreen.classList.remove("hidden");
    UI.menu.classList.remove("open");
    currentSessionId = crypto.randomUUID();
  };
  
  document.getElementById("saveChatMenuBtn").onclick = () => UI.saveModal.classList.add("open");
  document.getElementById("cancelSaveChat").onclick = () => UI.saveModal.classList.remove("open");

</script>
</body>
</html>
