<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Offline Translate</title>
  <meta name="theme-color" content="#050814"/>

  <style>
    :root{
      --bg1:#050814;
      --bg2:#090d1c;
      --line:rgba(255,255,255,.10);
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --grad:linear-gradient(135deg,#4de8ff 0%, #7b7dff 46%, #ff54c9 100%);
      --ok:#15d682;
      --warn:#ffb84d;
      --err:#ff5d7a;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shadow:0 18px 38px rgba(0,0,0,.26);
      --orange-grad:linear-gradient(135deg, rgba(255,140,40,.24), rgba(255,84,201,.14));
      --orange-line:rgba(255,140,40,.38);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      color:var(--txt);
      font-family:Inter, Outfit, Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(123,125,255,.18), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255,84,201,.15), transparent 24%),
        radial-gradient(circle at 50% 0%, rgba(77,232,255,.10), transparent 30%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }

    body{
      padding-top:var(--safe-top);
      padding-bottom:var(--safe-bottom);
    }

    #pageContent{
      min-height:100dvh;
    }

    .page{
      width:100%;
      max-width:700px;
      margin:0 auto;
      padding:14px 14px 34px;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
      padding:18px;
      margin-bottom:16px;
      overflow:hidden;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .hero-title{
      margin:0 0 8px;
      font-size:28px;
      font-weight:1000;
      line-height:1.08;
      letter-spacing:-.6px;
    }

    .hero-sub{
      margin:0;
      font-size:16px;
      line-height:1.55;
      color:var(--muted);
      font-weight:800;
    }

    .tools{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:16px;
    }

    .search{
      flex:1;
      height:60px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      padding:0 18px;
      font-size:17px;
      font-weight:800;
    }

    .search::placeholder{
      color:rgba(255,255,255,.42);
    }

    .section-title{
      margin:6px 0 14px;
      font-size:18px;
      font-weight:1000;
    }

    .lang-card{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      border-radius:24px;
      padding:18px;
      margin-bottom:14px;
    }

    .lang-head{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .flag{
      width:56px;
      height:56px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .lang-name{
      font-size:19px;
      font-weight:1000;
      line-height:1.1;
      margin:0;
    }

    .lang-sub{
      margin-top:4px;
      font-size:14px;
      color:var(--muted);
      font-weight:800;
    }

    .lang-btn{
      width:100%;
      height:62px;
      border-radius:18px;
      border:none;
      color:#fff;
      font-size:16px;
      font-weight:1000;
      cursor:pointer;
    }

    .lang-btn.installed{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.12);
    }

    .lang-btn.free{
      background:linear-gradient(135deg, rgba(31,195,136,.22), rgba(123,125,255,.14));
      border:1px solid rgba(31,195,136,.30);
    }

    .lang-btn.paid{
  background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#fff;
}

.lang-btn.installed{
  background:linear-gradient(135deg,#10b981,#22c55e);
  color:#fff;
}

.lang-btn.installing{
  background:linear-gradient(135deg,#64748b,#475569);
  color:#fff;
}

    .lang-btn[disabled]{
      opacity:.72;
      cursor:default;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(22px + var(--safe-bottom));
      transform:translateX(-50%) translateY(120px);
      background:rgba(10,12,24,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      padding:14px 18px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      z-index:9999;
      transition:.25s ease;
      box-shadow:0 18px 36px rgba(0,0,0,.30);
      text-align:center;
      max-width:min(92vw, 560px);
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    .footer{
      text-align:center;
      padding-top:10px;
      color:rgba(255,255,255,.44);
      font-size:12px;
      font-weight:900;
      letter-spacing:.4px;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:18px;
    }

    .modal-backdrop.show{
      display:flex;
    }

    .modal{
      width:min(92vw, 520px);
      border-radius:28px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(20,24,44,.98), rgba(10,12,24,.98));
      box-shadow:0 24px 60px rgba(0,0,0,.45);
      padding:22px;
    }

    .modal-title{
      font-size:22px;
      font-weight:1000;
      margin:0 0 10px;
      line-height:1.15;
    }

    .modal-text{
      font-size:15px;
      line-height:1.6;
      color:rgba(255,255,255,.84);
      font-weight:800;
      white-space:pre-line;
    }

    .modal-actions{
      display:flex;
      gap:12px;
      margin-top:18px;
    }

    .modal-btn{
      flex:1;
      height:56px;
      border-radius:18px;
      border:none;
      font-size:16px;
      font-weight:1000;
      cursor:pointer;
    }

    .modal-btn.cancel{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }

    .modal-btn.ok{
      background:var(--orange-grad);
      border:1px solid var(--orange-line);
      color:#fff;
    }

    @media (max-width:420px){
      .hero-title{ font-size:24px; }
      .hero-sub{ font-size:15px; }
      .tools{ flex-direction:column; }
      .modal-actions{ flex-direction:column; }
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="page">
      <section class="panel">
        <h1 class="hero-title">Offline Translate</h1>
        <p class="hero-sub">İnternet olmadan iletişime devam</p>
      </section>

      <section class="panel">
        <div class="tools">
          <input id="searchInput" class="search" type="text" placeholder="Dil Ara"/>
        </div>

        <div class="section-title">Diller</div>
        <div id="installedList"></div>
      </section>

      <div class="footer">italkyAI • By Ozyigit's • 2026</div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="confirmBackdrop" class="modal-backdrop">
    <div class="modal">
      <h3 id="confirmTitle" class="modal-title">Dil erişimini onaylayın</h3>
      <div id="confirmText" class="modal-text"></div>
      <div class="modal-actions">
        <button id="confirmCancel" class="modal-btn cancel" type="button">Vazgeç</button>
        <button id="confirmOk" class="modal-btn ok" type="button">Devam Et</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/offline_languages_page.js"></script>
</body>
</html>
