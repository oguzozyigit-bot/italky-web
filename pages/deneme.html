<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V7</title>

<style>
  :root {
    --ai-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --blue: #00d2ff; 
    --green: #00ff88; 
    --pink: #ff007f;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  /* Temel Reset ve Font */
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap');
  
  html, body { 
    background: #030305; 
    margin: 0; padding: 0; 
    height: 100vh; overflow: hidden; 
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* Dinamik Aura Arka Plan */
  #pageContent {
    height: 100%;
    display: flex; flex-direction: column;
    position: relative;
    background: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
  }

  /* Header Alanı (Hoşgeldin Mesajı) */
  .header-area {
    padding: 40px 25px 10px;
    text-align: left;
  }
  .header-area h1 {
    color: #fff; font-size: 28px; font-weight: 800; margin: 0;
    letter-spacing: -0.5px;
  }
  .header-area p {
    color: rgba(255,255,255,0.4); font-size: 14px; margin-top: 5px;
  }

  .main-hub {
    flex: 1; display: flex; flex-direction: column;
    gap: 20px; padding: 20px; justify-content: center;
  }

  /* ===== MODERN GLASS PANEL ===== */
  .os-panel {
    position: relative; border-radius: 28px;
    border: 1px solid var(--glass-border);
    height: 120px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 25px;
    background: var(--glass);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  /* Hover & Active Effects */
  .os-panel:active {
    transform: scale(0.97) translateY(2px);
    background: rgba(255,255,255,0.07);
    border-color: var(--neon-color);
  }

  /* Renk Temaları (Neon Soft) */
  .tr-node { --neon-color: var(--blue); }
  .ac-node { --neon-color: var(--green); }
  .tc-node { --neon-color: var(--pink); }

  /* Sol İçerik */
  .content-wrap { display: flex; flex-direction: column; gap: 4px; z-index: 10; }
  .btn-title { font-family: 'Outfit'; font-size: 24px; font-weight: 700; color: #fff; margin: 0; }
  .btn-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: brightness(1.2); }
  .btn-desc { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

  /* Sağ İkon Alanı */
  .icon-container {
    position: relative; width: 65px; height: 65px;
    display: flex; align-items: center; justify-content: center;
  }

  .main-icon {
    font-size: 32px; z-index: 10;
    filter: drop-shadow(0 0 10px var(--neon-color));
  }

  /* İkon Arkası Glow (Parlama) */
  .glow-orb {
    position: absolute; width: 40px; height: 40px;
    background: var(--neon-color);
    filter: blur(30px); opacity: 0.4;
    transition: all 0.4s;
  }
  .os-panel:hover .glow-orb { opacity: 0.8; width: 60px; height: 60px; }

  /* Durum Çizgisi */
  .status-line {
    position: absolute; left: 0; top: 30%; bottom: 30%;
    width: 4px; border-radius: 0 4px 4px 0;
    background: var(--neon-color);
    box-shadow: 0 0 15px var(--neon-color);
  }

</style>
</head>

<body>
<main id="pageContent">
  <div class="header-area">
    <h1>Quantum <span style="color:var(--blue)">OS</span></h1>
    <p>Gelecek şimdi parmaklarının ucunda.</p>
  </div>

  <div class="main-hub">

    <div class="os-panel tr-node" onclick="location.href='/pages/translate_home.html'">
      <div class="status-line"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Translate <span>AI</span></h2>
        <div class="btn-desc">Sınırları Kaldıran Dil</div>
      </div>
      <div class="icon-container">
        <div class="glow-orb"></div>
        <div class="main-icon">🌐</div>
      </div>
    </div>

    <div class="os-panel ac-node" onclick="location.href='/pages/acedemy_home.html'">
      <div class="status-line"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Academy <span>AI</span></h2>
        <div class="btn-desc">Zekanı Yeniden Programla</div>
      </div>
      <div class="icon-container">
        <div class="glow-orb"></div>
        <div class="main-icon">✨</div>
      </div>
    </div>

    <div class="os-panel tc-node" onclick="location.href='/pages/helper_home.html'">
      <div class="status-line"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Teacher <span>AI</span></h2>
        <div class="btn-desc">Kuantum Çözüm Rehberi</div>
      </div>
      <div class="icon-container">
        <div class="glow-orb"></div>
        <div class="main-icon">🧠</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
