<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Turan Dilleri</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#130607;
      --bg2:#20090c;
      --red1:#7f1d1d;
      --red2:#b91c1c;
      --red3:#ef4444;
      --gold:#f59e0b;
      --text:#fff7f7;
      --muted:rgba(255,255,255,.64);
      --line:rgba(255,255,255,.10);
      --glass:rgba(255,255,255,.05);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --hub-h:82px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#0d0405;
      color:var(--text);
      font-family:Outfit,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 12% 10%, rgba(239,68,68,.14), transparent 24%),
        radial-gradient(circle at 88% 18%, rgba(245,158,11,.10), transparent 22%),
        linear-gradient(180deg, #180708 0%, #100405 100%);
    }

    .app{
      width:100%;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topbar{
      flex:0 0 auto;
      padding:calc(8px + var(--safe-top)) 10px 8px;
      background:linear-gradient(180deg, rgba(13,4,5,.98), rgba(13,4,5,.84));
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(14px);
      z-index:700;
    }

    .topbar-inner{
      width:min(95vw,520px);
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:10px;
    }

    .title-box{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .title{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:22px;
      font-weight:900;
      line-height:1;
      letter-spacing:-.6px;
      color:#fff;
    }

    .title .accent{
      background:linear-gradient(135deg,#fca5a5,#ef4444,#f59e0b);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      margin:0;
      font-size:11px;
      font-weight:900;
      letter-spacing:.4px;
      color:rgba(255,255,255,.58);
    }

    .settings-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .settings-btn svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      stroke-width:2.1;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .panel{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    .panel.top{
      background:linear-gradient(180deg, rgba(127,29,29,.24), rgba(19,6,7,.98));
    }

    .panel.bottom{
      background:linear-gradient(180deg, rgba(239,68,68,.10), rgba(19,6,7,.98));
    }

    .mirror{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      min-height:0;
      transform:rotate(180deg);
    }

    .toolbar{
      flex:0 0 auto;
      width:100%;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
      padding:10px 10px 8px;
      align-items:center;
    }

    .lang-pill{
      min-height:42px;
      border:none;
      border-radius:999px;
      padding:8px 14px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      cursor:pointer;
    }

    .lang-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .lang-flag{
      width:22px;
      text-align:center;
      flex:0 0 22px;
      font-size:18px;
    }

    .lang-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lang-caret{
      opacity:.7;
      font-size:13px;
      flex:0 0 auto;
    }

    .swap-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .swap-btn svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .panel-head{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2px 8px 2px;
      min-height:28px;
      flex:0 0 auto;
    }

    .panel-label{
      font-size:11px;
      font-weight:900;
      letter-spacing:.6px;
      color:rgba(255,255,255,.70);
      text-transform:uppercase;
      text-align:center;
    }

    .content-scroll{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:14px 16px 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
    }

    .content-scroll::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:92%;
      line-height:1.28;
      word-break:break-word;
    }

    .bubble.latest{
      font-size:30px;
      font-weight:900;
      line-height:1.08;
    }

    .bubble.normal{
      font-size:18px;
      font-weight:700;
      opacity:.88;
    }

    .bubble-sub{
      margin-top:8px;
      font-size:13px;
      line-height:1.4;
      font-weight:900;
      color:rgba(255,255,255,.62);
      text-align:center;
    }

    .center-hub{
      height:var(--hub-h);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:transparent;
      border:1px solid var(--line);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      z-index:650;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:82px;
      height:82px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:82px;
      height:82px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1,.ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#ef4444;
      box-shadow:0 0 15px #ef4444;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#f59e0b;
      box-shadow:0 0 15px #f59e0b;
    }

    .ai-core{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.4px;
      font-size:13px;
    }

    .logo-ai{
      background:linear-gradient(135deg,#fca5a5,#ef4444,#f59e0b);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #frameRoot.is-translating .eq-wrap{
      opacity:1;
    }

    #frameRoot.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:linear-gradient(135deg,#fca5a5,#ef4444,#f59e0b);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background:#22c55e;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background:#ef4444;
      box-shadow:0 0 18px rgba(239,68,68,.9);
    }

    .composer-wrap{
      flex:0 0 auto;
      padding:8px 8px calc(8px + var(--safe-bottom));
    }

    .composer{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:62px;
      padding:9px 12px;
      border-radius:22px;
      background:rgba(16,9,10,.94);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.03);
      position:relative;
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .composer-input{
      width:100%;
      min-height:24px;
      max-height:140px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:800;
      line-height:1.4;
      font-family:inherit;
      overflow:auto;
      padding:0;
      margin:0;
      scrollbar-width:none;
      text-align:left;
    }

    .composer-input::-webkit-scrollbar{ display:none; }

    .composer-input::placeholder{
      color:rgba(255,255,255,.72);
      font-weight:800;
    }

    .composer-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      color:#fff;
      position:relative;
    }

    .composer-btn.primary{
      background:#fff;
      color:#000;
      box-shadow:0 0 24px rgba(255,255,255,.10);
    }

    .composer-btn.listening::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      border:2px solid rgba(34,197,94,.72);
      box-shadow:0 0 0 8px rgba(34,197,94,.10), 0 0 24px rgba(34,197,94,.18);
      animation:micPulse 1s ease-out infinite;
    }

    .composer-btn svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .hidden{ display:none !important; }

    .popover{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:99999;
      padding:20px;
    }

    .popover.show{
      display:flex;
    }

    .popover-card{
      width:min(100%, 420px);
      max-height:min(80vh, 720px);
      overflow:hidden;
      border-radius:24px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
      display:flex;
      flex-direction:column;
    }

    .popover-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .popover-title{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:900;
      color:#fff;
    }

    .popover-close{
      width:40px;
      height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:#fff;
      cursor:pointer;
      font-size:18px;
    }

    .popover-search{
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .popover-search input{
      width:100%;
      min-height:46px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      padding:12px 14px;
      font-family:'Outfit',sans-serif;
      font-size:14px;
    }

    .popover-search input::placeholder{
      color:rgba(255,255,255,.36);
    }

    .lang-list{
      padding:12px;
      overflow:auto;
      display:grid;
      gap:10px;
      scrollbar-width:none;
    }

    .lang-list::-webkit-scrollbar{ display:none; }

    .lang-option{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .lang-option:active{
      transform:scale(.986);
    }

    .lang-option.active{
      border-color:rgba(239,68,68,.34);
      background:linear-gradient(135deg, rgba(239,68,68,.12), rgba(245,158,11,.08));
      box-shadow:0 0 0 1px rgba(239,68,68,.12);
    }

    .lang-option-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .lang-option-flag{
      width:30px;
      height:30px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.06);
      font-size:18px;
      flex:0 0 30px;
    }

    .lang-option-text{
      min-width:0;
    }

    .lang-option-name{
      font-size:14px;
      font-weight:800;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lang-option-code{
      font-size:11px;
      font-weight:700;
      color:rgba(255,255,255,.50);
      margin-top:3px;
      text-transform:uppercase;
    }

    .lang-option-check{
      color:#fca5a5;
      font-size:18px;
      font-weight:900;
      opacity:0;
    }

    .lang-option.active .lang-option-check{
      opacity:1;
    }

    .toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%) translateY(-120px);
      background:rgba(10,10,18,.94);
      border:1px solid rgba(252,165,165,.34);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      z-index:10000;
      transition:.25s;
      pointer-events:none;
      backdrop-filter:blur(14px);
      max-width:min(92vw,520px);
      text-align:center;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.14; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    @media (max-width:390px){
      .lang-name{ font-size:11px; }
      .bubble.latest{ font-size:26px; }
      .bubble.normal{ font-size:17px; }
    }
  </style>
</head>

<body id="frameRoot" class="is-ready">
  <div class="app">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="title-box">
          <h1 class="title">Turan <span class="accent">Dilleri</span></h1>
          <p class="subtitle">Türk Dünyası için canlı iki yönlü çeviri</p>
        </div>

        <button id="settingsBtn" class="settings-btn" type="button" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a2 2 0 1 1-4 0v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a2 2 0 1 1 0-4h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4a2 2 0 1 1 4 0v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2a2 2 0 1 1 0 4H20a1 1 0 0 0-.6.6z"></path>
          </svg>
        </button>
      </div>
    </div>

    <section class="panel top">
      <div class="mirror">
        <div class="toolbar">
          <button class="lang-pill" id="topFromBtn" type="button">
            <span class="lang-left">
              <span class="lang-flag" id="topFromFlag">🇹🇷</span>
              <span class="lang-name" id="topFromText">Türkçe</span>
            </span>
            <span class="lang-caret">▾</span>
          </button>

          <button class="swap-btn" id="topSwapBtn" type="button" aria-label="Dilleri değiştir">
            <svg viewBox="0 0 24 24">
              <path d="M8 7h11"></path>
              <path d="M15 3l4 4-4 4"></path>
              <path d="M16 17H5"></path>
              <path d="M9 13l-4 4 4 4"></path>
            </svg>
          </button>

          <button class="lang-pill" id="topToBtn" type="button">
            <span class="lang-left">
              <span class="lang-flag" id="topToFlag">🇬🇧</span>
              <span class="lang-name" id="topToText">İngilizce</span>
            </span>
            <span class="lang-caret">▾</span>
          </button>
        </div>

        <div class="panel-head">
          <div class="panel-label">180° TARAF • TÜRKÇE + YABANCI DİLLER</div>
        </div>

        <div class="content-scroll" id="topResultArea">
          <div class="bubble normal" id="topResultBubble">...</div>
          <div class="bubble-sub" id="topResultSub"></div>
        </div>

        <div class="composer-wrap">
          <div class="composer">
            <div class="composer-center">
              <textarea id="topInput" class="composer-input" rows="1" placeholder="Metin yaz veya konuş"></textarea>
            </div>

            <button id="topMicBtn" class="composer-btn" type="button" aria-label="Sesli giriş">
              <svg viewBox="0 0 24 24">
                <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
                <path d="M19 10a7 7 0 0 1-14 0"></path>
                <path d="M12 17v4"></path>
                <path d="M8 21h8"></path>
              </svg>
            </button>

            <button id="topSendBtn" class="composer-btn primary hidden" type="button" aria-label="Çevir">
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="M13 6l6 6-6 6"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="center-hub">
      <a class="nav-btn btn-home" id="homeLink" href="/pages/home.html">ANA SAYFA</a>

      <div class="orb-container" id="homeBtn" title="Ana sayfa">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <button class="nav-btn btn-clear" id="clearBtn" type="button">TEMİZLE</button>
    </div>
