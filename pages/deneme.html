<!-- /pages/facetoface_public.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • FaceToFace Public</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
      user-select:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.08),transparent 24%),
        radial-gradient(circle at bottom,rgba(99,102,241,.08),transparent 24%),
        #050508;
    }

    .container{
      width:100%;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      overflow:hidden;
      padding:10px 8px;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg));
    }

    .half-screen.bottom{
      background:#050508;
      padding-bottom:calc(10px + var(--safe-bottom));
    }

    .lang-row{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:20;
    }

    .lang-trigger{
      height:38px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:#fff;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:82vw;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:100;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
    }

    .pop-list::-webkit-scrollbar{
      display:none;
    }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item.active{
      background:rgba(99,102,241,.16);
      border-color:rgba(99,102,241,.28);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{
      font-size:18px;
    }

    .pop-name{
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pop-code{
      font-size:12px;
      font-weight:900;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:14px;
      padding:14px 0 22px;
      text-align:center;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .chat-body::-webkit-scrollbar{
      display:none;
    }

    .bubble{
      max-width:86%;
      line-height:1.18;
      word-break:break-word;
      font-size:24px;
      font-weight:900;
      opacity:.9;
    }

    .bubble.latest{
      font-size:32px;
      font-weight:1000;
      opacity:1;
    }

    .mic-line{
      width:100%;
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:12px;
      padding:0 8px 4px;
      flex:0 0 auto;
    }

    .mic-placeholder{
      min-height:1px;
      opacity:0;
      pointer-events:none;
    }

    .mic-btn{
      width:70px;
      height:70px;
      border:none;
      border-radius:999px;
      background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:
        0 18px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
    }

    .mic-btn svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .mic-btn.listening{
      background:
        radial-gradient(circle at 50% 35%, rgba(216,180,254,.34), rgba(168,85,247,.18) 44%, rgba(255,255,255,.06));
      box-shadow:
        0 0 0 10px rgba(168,85,247,.12),
        0 0 34px rgba(168,85,247,.50),
        0 0 70px rgba(236,72,153,.28),
        inset 0 1px 0 rgba(255,255,255,.10);
      animation:purpleMicBreath 1.05s ease-in-out infinite;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:2px solid rgba(216,180,254,.78);
      box-shadow:
        0 0 0 12px rgba(168,85,247,.10),
        0 0 38px rgba(216,180,254,.35);
      animation:purpleMicPulse 1s ease-out infinite;
    }

    @keyframes purpleMicBreath{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.045); }
    }

    @keyframes purpleMicPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.18); opacity:.16; }
      100%{ transform:scale(1.24); opacity:0; }
    }

    .center-hub{
      height:82px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:50;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .orb{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      font-weight:900;
      position:relative;
      overflow:visible;
    }

    .orb-main{
      position:relative;
      z-index:3;
    }

    .orb .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sat{
      position:absolute;
      left:50%;
      top:50%;
      width:7px;
      height:7px;
      margin-left:-3.5px;
      margin-top:-3.5px;
      border-radius:50%;
      z-index:1;
    }

    .sat1{
      background:#a5b4fc;
      box-shadow:0 0 12px rgba(165,180,252,.9);
      animation:orbit1 4s linear infinite;
    }

    .sat2{
      background:#ec4899;
      box-shadow:0 0 12px rgba(236,72,153,.9);
      animation:orbit2 5.5s linear infinite;
    }

    .sat3{
      background:#22d3ee;
      box-shadow:0 0 12px rgba(34,211,238,.9);
      animation:orbit3 6.5s linear infinite;
    }

    .sat4{
      background:#34d399;
      box-shadow:0 0 12px rgba(52,211,153,.9);
      animation:orbit4 7.5s linear infinite;
    }

    @keyframes orbit1{
      from{ transform:rotate(0deg) translateX(48px) rotate(0deg); }
      to{ transform:rotate(360deg) translateX(48px) rotate(-360deg); }
    }

    @keyframes orbit2{
      from{ transform:rotate(90deg) translateX(52px) rotate(-90deg); }
      to{ transform:rotate(450deg) translateX(52px) rotate(-450deg); }
    }

    @keyframes orbit3{
      from{ transform:rotate(180deg) translateX(44px) rotate(-180deg); }
      to{ transform:rotate(540deg) translateX(44px) rotate(-540deg); }
    }

    @keyframes orbit4{
      from{ transform:rotate(270deg) translateX(56px) rotate(-270deg); }
      to{ transform:rotate(630deg) translateX(56px) rotate(-630deg); }
    }

    .edge-handle{
      position:fixed;
      right:0;
      top:50%;
      transform:translateY(-50%);
      width:18px;
      height:104px;
      border:none;
      border-radius:18px 0 0 18px;
      background:rgba(255,255,255,.15);
      border-left:1px solid rgba(255,255,255,.22);
      z-index:9997;
      cursor:pointer;
      box-shadow:0 0 22px rgba(255,255,255,.08);
    }

    .edge-handle::before{
      content:"";
      position:absolute;
      left:6px;
      top:20px;
      width:4px;
      height:64px;
      border-radius:999px;
      background:rgba(255,255,255,.58);
    }

    .edge-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.38);
      backdrop-filter:blur(4px);
      z-index:9996;
      display:none;
    }

    .edge-backdrop.show{
      display:block;
    }

    .edge-menu{
      position:fixed;
      right:-238px;
      top:50%;
      transform:translateY(-50%);
      width:218px;
      padding:14px;
      border-radius:30px 0 0 30px;
      background:rgba(16,16,22,.95);
      border:1px solid rgba(255,255,255,.12);
      border-right:none;
      z-index:9998;
      transition:.24s ease;
      box-shadow:-18px 0 40px rgba(0,0,0,.36);
    }

    .edge-menu.open{
      right:0;
    }

    .edge-menu-btn{
      width:100%;
      min-height:48px;
      margin-bottom:10px;
      border:none;
      border-radius:18px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-family:inherit;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:12px;
      padding:0 14px;
      text-align:left;
    }

    .edge-menu-btn:last-child{
      margin-bottom:0;
    }

    .edge-menu-btn.danger{
      color:#ffb4b4;
    }

    .edge-icon{
      width:34px;
      height:34px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.10);
      font-size:17px;
      flex:0 0 auto;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }

    .edge-label{
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);
      min-height:44px;
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:9999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:20px;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(100%,420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{
      background:var(--ai-gradient);
      color:#05060d;
    }

    .modal-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    @media(max-width:390px){
      .mic-line{
        grid-template-columns:1fr 66px 1fr;
      }

      .mic-btn{
        width:66px;
        height:66px;
      }

      .mic-btn svg{
        width:28px;
        height:28px;
      }

      .bubble{
        font-size:22px;
      }

      .bubble.latest{
        font-size:30px;
      }

      .edge-menu{
        width:208px;
        right:-228px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-top">
        <div class="pop-head">
          <div id="topPopTitle">ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>

        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>

        <div class="mic-placeholder"></div>
      </div>
    </section>

    <section class="center-hub">
      <div class="orb">
        <span class="sat sat1"></span>
        <span class="sat sat2"></span>
        <span class="sat sat3"></span>
        <span class="sat sat4"></span>
        <span class="orb-main">italky<span class="ai">AI</span></span>
      </div>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-bot">
        <div class="pop-head">
          <div id="botPopTitle">ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>

        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>

        <div class="mic-placeholder"></div>
      </div>
    </section>

  </main>

  <button id="edgeHandle" class="edge-handle" type="button" aria-label="Menü aç"></button>

  <div id="edgeBackdrop" class="edge-backdrop"></div>

  <aside id="edgeMenu" class="edge-menu">
    <button id="edgeDownloadBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">⬇️</span>
      <span class="edge-label">DİL İNDİR</span>
    </button>

    <button id="edgeLoginBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">＋</span>
      <span class="edge-label">GİRİŞ YAP</span>
    </button>

    <button id="edgeModeBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">🌐</span>
      <span class="edge-label">ONLINE</span>
    </button>

    <button id="edgeClearBtn" class="edge-menu-btn danger" type="button">
      <span class="edge-icon">🧹</span>
      <span class="edge-label">TEMİZLE</span>
    </button>

    <button id="edgeAboutBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">ℹ️</span>
      <span class="edge-label">HAKKIMIZDA</span>
    </button>

    <button id="edgePrivacyBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">🔒</span>
      <span class="edge-label">GİZLİLİK</span>
    </button>

    <button id="edgeContactBtn" class="edge-menu-btn" type="button">
      <span class="edge-icon">✉️</span>
      <span class="edge-label">İLETİŞİM</span>
    </button>
  </aside>

  <div id="adModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title" id="adTitle">Ücretsiz Kullanım</h3>
      <p class="modal-text" id="adText">
        FaceToFace ücretsiz kullanımda reklam içerir. Reklamı izledikten sonra çeviriye devam edebilirsiniz.
      </p>
      <div class="modal-actions">
        <button id="watchAdBtn" class="modal-btn primary" type="button">Reklam İzle</button>
        <button id="closeAdBtn" class="modal-btn secondary" type="button">Şimdilik Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/facetoface_public.js?v=PUBLIC_F2F_EDGE_V1"></script>
</body>
</html>
