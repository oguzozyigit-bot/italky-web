<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Future Home</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#120d16;
  color:#fff;
  font-family:'Outfit',sans-serif;
}

.container{
  padding:16px;
}

.hero{
  text-align:center;
  margin-bottom:20px;
}

.hero h1{
  font-family:'Space Grotesk';
}

.btn{
  padding:14px;
  border-radius:16px;
  border:none;
  margin-top:10px;
  width:100%;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.card{
  padding:18px;
  border-radius:20px;
  text-decoration:none;
  color:#fff;
}

.learn{background:linear-gradient(135deg,#ec4899,#7c3aed);}
.level{background:linear-gradient(135deg,#22c55e,#16a34a);}
.practice{background:linear-gradient(135deg,#0ea5e9,#6366f1);}
.ai{background:linear-gradient(135deg,#f59e0b,#ef4444);}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>SideToSide</h1>
    <p>QR veya kod ile anında bağlan</p>

    <button class="btn" style="background:#6366f1;" onclick="goSide()">
      🔗 Bağlantı Başlat
    </button>

    <div style="display:flex; gap:10px;">
      <button class="btn" style="background:#1f2937;" onclick="openQR()">
        📷 QR Oku
      </button>
      <button class="btn" style="background:#312e81;" onclick="openCode()">
        🔢 Kod Gir
      </button>
    </div>

  </div>

  <!-- ANA MODÜLLER -->
  <div class="grid">

    <a class="card" style="background:#4c1d95;" href="/facetoface.html">
      <h3>FaceToFace</h3>
      <p>Tek cihazla konuş</p>
    </a>

    <a class="card" style="background:#7c2d12;" href="/pages/text_translate.html">
      <h3>TextToText</h3>
      <p>Metin çeviri</p>
    </a>

  </div>

  <!-- OFFLINE -->
  <div class="grid">
    <a class="card" style="background:#991b1b;" href="/pages/offline_languages.html">
      <h3>Offline</h3>
      <p>Dil paketleri indir</p>
    </a>
  </div>

  <!-- ÖĞRENME -->
  <div class="grid">

    <a class="card learn">
      <h3>Eğlenerek Öğren</h3>
    </a>

    <a class="card level">
      <h3>Seviye Tespit</h3>
    </a>

    <a class="card practice">
      <h3>Pratik Yap</h3>
    </a>

    <a class="card ai">
      <h3>AI Öğretmen</h3>
    </a>

  </div>

</div>

<script>
function goSide(){
  location.href="/pages/sidetoside.html";
}

function openQR(){
  location.href="/pages/qr_scan.html";
}

function openCode(){
  const code = prompt("Kodu gir:");
  if(code){
    location.href="/pages/live_interpreter.html?code="+code;
  }
}
</script>

</body>
</html>
