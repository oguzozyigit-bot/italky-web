<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Walkie Talkie</title>

  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --blue: #60a5fa;
      --pink: #ec4899;
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    /* ✅ Kural Seti Uygulandı */
    #pageContent {
      height: 100%;
      display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% -10%, #1a0a25 0%, #000 100%);
    }

    .main-hub { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 12px; min-height: 0; }

    /* ===== SPECTRUM HEADER ===== */
    .spectrum-header { flex: 0 0 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .wave-container { display: flex; align-items: center; gap: 4px; height: 30px; }
    .wave-bar { width: 3px; height: 10px; background: var(--ai-grad); border-radius: 10px; animation: waveGrowth 1.2s infinite ease-in-out; }
    @keyframes waveGrowth { 0%, 100% { height: 10px; opacity: 0.3; } 50% { height: 30px; opacity: 1; } }
    .portal-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 900; color: #fff; margin-top: 10px; }
    .portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ===== CARDS & PANELS ===== */
    .hub-cards { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .cyber-card {
      flex: 1; position: relative; border-radius: 32px; border: 1px solid var(--glass-border);
      overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 24px;
      background: var(--glass); backdrop-filter: blur(30px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cyber-card:active { transform: scale(0.98); }
    
    .host-card { background: linear-gradient(145deg, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0.6) 100%); }
    .join-card { background: linear-gradient(145deg, rgba(236, 72, 153, 0.12) 0%, rgba(0,0,0,0.6) 100%); }

    .card-content { flex: 1; z-index: 10; }
    .card-title { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; color: #fff; margin: 0; }
    .card-desc { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 6px; line-height: 1.4; }

    /* ===== HOST & JOIN PANELS (HIDE/SHOW) ===== */
    .panel-view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .hide { display: none !important; }

    .qr-zone {
      flex: 1; background: rgba(0,0,0,0.3); border-radius: 28px; border: 1px solid var(--glass-border);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .qr-img-box { width: 200px; height: 200px; border-radius: 20px; background: #fff; padding: 10px; display:flex; align-items:center; justify-content:center; }
    .qr-img-box img { width: 100%; height: auto; }
    
    .room-code-display { font-family: 'Space Grotesk'; font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #fff; margin-top: 15px; }

    .input-field {
      width: 100%; height: 60px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
      border-radius: 20px; color: #fff; text-align: center; font-size: 22px; font-weight: 900; letter-spacing: 4px;
    }

    /* ===== BUTTONS ===== */
    .btn-3d {
      height: 56px; border-radius: 20px; border: none; background: var(--ai-grad);
      color: #fff; font-weight: 900; font-size: 15px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(99,102,241,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
    }
    .btn-ghost {
      height: 50px; border-radius: 18px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05); color: #fff; font-weight: 800; font-size: 13px; cursor: pointer;
    }

    /* ===== SCANNER OVERLAY ===== */
    .scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
    .scanner-overlay.show { display: flex; }
    .scanner-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 900; }
    #scanVideo { flex: 1; object-fit: cover; }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <header class="spectrum-header">
      <div class="wave-container">
        <div class="wave-bar" style="animation-delay:0s"></div>
        <div class="wave-bar" style="animation-delay:0.2s"></div>
        <div class="wave-bar" style="animation-delay:0.4s"></div>
        <div class="wave-bar" style="animation-delay:0.2s"></div>
        <div class="wave-bar" style="animation-delay:0s"></div>
      </div>
      <div class="portal-title">Walkie<span>Talkie</span></div>
    </header>

    <div class="hub-cards" id="homeCards">
      <div class="cyber-card host-card" id="goHost">
        <div class="card-content">
          <h2 class="card-title">Kanal Oluştur</h2>
          <p class="card-desc">Sınırsız katılımcı. Kod/QR ile paylaşılır. Herkes kendi dilinde konuşur.</p>
        </div>
        <span style="font-size: 40px;">📡</span>
      </div>

      <div class="cyber-card join-card" id="goGuest">
        <div class="card-content">
          <h2 class="card-title">Kanala Bağlan</h2>
          <p class="card-desc">QR okut veya sana gönderilen 6 haneli frekans kodunu gir.</p>
        </div>
        <span style="font-size: 40px;">🔑</span>
      </div>
    </div>

    <div class="panel-view hide" id="hostPanel">
      <div class="qr-zone">
        <div class="qr-img-box"><img id="qrImg" src="" alt="QR" /></div>
        <div class="room-code-display" id="roomCode">------</div>
        <div id="hostStatus" style="font-size:10px; color:var(--blue); margin-top:10px;">Bağlantı Bekleniyor...</div>
      </div>
      <button class="btn-3d" id="btnGoCall">SİNYALİ BAŞLAT</button>
      <div style="display:flex; gap:10px;">
        <button class="btn-ghost" id="btnCopy" style="flex:1;">KODU KOPYALA</button>
        <button class="btn-ghost" id="btnBackHost" style="flex:1;">GERİ</button>
      </div>
    </div>

    <div class="panel-view hide" id="joinPanel">
      <div class="qr-zone" style="flex: 0 0 auto; gap:15px; padding:30px 20px;">
        <button class="btn-3d" id="btnScan" style="width:100%;">📷 QR KODU OKUT</button>
        <div style="color:rgba(255,255,255,0.3); font-size:12px; font-weight:900;">VEYA KOD GİR</div>
        <input class="input-field" id="roomInput" placeholder="KODU YAZ" maxlength="8" />
      </div>
      <button class="btn-3d" id="btnJoin">BAĞLAN</button>
      <button class="btn-ghost" id="btnBackJoin">ANA MENÜYE DÖN</button>
    </div>

  </div>
</main>

<div class="scanner-overlay" id="scanner">
  <div class="scanner-header">
    <span>QR TARAYICI</span>
    <button id="scanClose" style="background:none; border:none; color:#fff; font-weight:900;">KAPAT</button>
  </div>
  <video id="scanVideo" playsinline></video>
</div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);
  
  // UI Yönlendirme
  const setMode = (m) => {
    $("homeCards").classList.toggle("hide", m !== "home");
    $("hostPanel").classList.toggle("hide", m !== "host");
    $("joinPanel").classList.toggle("hide", m !== "join");
  };

  $("goHost").onclick = () => { setMode("host"); history.replaceState(null,"", "?mode=host"); };
  $("goGuest").onclick = () => { setMode("join"); history.replaceState(null,"", "?mode=join"); };
  $("btnBackHost").onclick = () => setMode("home");
  $("btnBackJoin").onclick = () => setMode("home");

  // Scanner Kontrol
  $("btnScan").onclick = () => $("scanner").classList.add("show");
  $("scanClose").onclick = () => $("scanner").classList.remove("show");

  // Linkten gelen join kodunu yakala
  const urlParams = new URLSearchParams(window.location.search);
  const joinCode = urlParams.get('join');
  if(joinCode) {
    setMode("join");
    $("roomInput").value = joinCode.toUpperCase();
  }
</script>

<script type="module" src="/js/f2f_connect.js?v=WT_CONNECT_V4"></script>
</body>
</html>
