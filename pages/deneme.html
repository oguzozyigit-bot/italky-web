<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V2</title>

<style>
  html,body{ background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif; color:#fff; }
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --neon-blue: #00d2ff;
  --neon-green: #39ff14;
  --neon-pink: #ff007f;
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --glass-border: rgba(255,255,255,0.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 50%, #08081a 0%, #000 100%);
  position: relative;
}

/* ===== 1. ARKA PLAN VE RADAR (SABİT) ===== */
.radar-bg {
  position: absolute; inset: 0;
  background-image: 
    repeating-linear-gradient(rgba(255,255,255,0.01) 0 1px, transparent 1px 30px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0 1px, transparent 1px 30px);
  opacity: 0.5; pointer-events: none;
}
.scan-pulse {
  position: absolute; width: 200vw; height: 200vw;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: conic-gradient(from 0deg, transparent 0deg, rgba(99, 102, 241, 0.05) 90deg, transparent 180deg);
  animation: radarRotate 8s linear infinite;
}
@keyframes radarRotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

/* ===== 2. TERMİNAL HUB (DİKEY DİZİLİM) ===== */
.terminal-hub {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; gap: 20px; padding: 20px; z-index: 10;
}

/* ===== 3. CYBER-BUTON (AĞIR VE BASILABİLİR) ===== */
.cyber-btn {
  position: relative;
  height: 100px; /* Sabit yükseklik, daha tok duruş */
  border-radius: 24px;
  border: 2px solid var(--glass-border);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  display: flex; align-items: center; padding: 0 25px;
  overflow: hidden;
  transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
  /* 3D Hissiyatı için gölge */
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
}

/* Arka plan ışık akışı */
.cyber-btn::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.cyber-btn:hover::before { transform: translateX(100%); }

/* ✅ BASILMA EFEKTİ (3D Çökme) */
.cyber-btn:active {
  transform: translateY(4px) scale(0.98);
  box-shadow: 0 5px 15px -5px rgba(0,0,0,0.7);
  border-color: var(--neon-color);
  filter: brightness(1.2);
}

/* Sol Neon Çizgi (Aktivasyon Hattı) */
.btn-line {
  position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--neon-color);
  box-shadow: 0 0 15px var(--neon-color);
  transition: 0.3s;
}

/* İkon Alanı */
.btn-icon-box {
  width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-right: 20px;
  position: relative;
}
/* İkon arkasındaki holografik hare */
.btn-icon-box::after {
  content: ""; position: absolute; inset: 0;
  background: var(--neon-color);
  border-radius: 50%; filter: blur(15px);
  opacity: 0.2; transition: 0.3s;
}
.cyber-btn:active .btn-icon-box::after { opacity: 0.4; filter: blur(10px); }

/* Metin Alanı */
.btn-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.btn-title {
  font-family: 'Space Grotesk'; font-size: 22px; font-weight: 800;
  color: #fff; margin: 0; letter-spacing: -0.5px;
}
.btn-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-desc {
  font-size: 11px; color: rgba(255,255,255,0.5);
  font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
}

/* Renk Temaları */
.node-tr { --neon-color: var(--neon-blue); }
.node-ac { --neon-color: var(--neon-green); }
.node-tc { --neon-color: var(--neon-pink); }

/* Alt Bar (Status) */
.status-bar {
  height: 34px; padding: 0 20px; display: flex; align-items: center;
  justify-content: space-between; font-size: 9px; font-weight: 900;
  background: rgba(0,0,0,0.7); border-top: 1px solid var(--glass-border);
  color: rgba(255,255,255,0.3); letter-spacing: 1px;
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="radar-bg"></div>
  <div class="scan-pulse"></div>

  <div class="terminal-hub">
    
    <button class="cyber-btn node-tr" onclick="location.href='/pages/translate_home.html'">
      <div class="btn-line"></div>
      <div class="btn-icon-box">📡</div>
      <div class="btn-content">
        <h2 class="btn-title">Translate<span>.OS</span></h2>
        <p class="btn-desc">Quantum Language Decoder</p>
      </div>
    </button>

    <button class="cyber-btn node-ac" onclick="location.href='/pages/academy_home.html'">
      <div class="btn-line"></div>
      <div class="btn-icon-box">🧠</div>
      <div class="btn-content">
        <h2 class="btn-title">Academy<span>.OS</span></h2>
        <p class="btn-desc">Neural Path Optimizer</p>
      </div>
    </button>

    <button class="cyber-btn node-tc" onclick="location.href='/pages/helper_home.html'">
      <div class="btn-line"></div>
      <div class="btn-icon-box">🧬</div>
      <div class="btn-content">
        <h2 class="btn-title">Teacher<span>.OS</span></h2>
        <p class="btn-desc">Logic Core Solver</p>
      </div>
    </button>

  </div>

  <footer class="status-bar">
    <div>italkyAI QUANTUM KERNEL v2.0</div>
    <div>CORE: ACTIVE</div>
    <div>@ozyigit_algo</div>
  </footer>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
