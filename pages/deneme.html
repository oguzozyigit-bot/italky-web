<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V7</title>

<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --blue: #00d2ff; --green: #39ff14; --pink: #ff007f;
  --glass-border: rgba(255,255,255,0.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 50%, #0a0a25 0%, #000 100%);
  position: relative;
}

.main-hub {
  flex: 1; display: flex; flex-direction: column;
  gap: 15px; padding: 15px; min-height: 0;
}

/* ===== CYBER PANEL (BUTON) ===== */
.os-panel {
  flex: 1; position: relative; border-radius: 32px;
  border: 1px solid var(--glass-border);
  overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  padding: 0 25px;
  background: var(--panel-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 15px 35px -15px rgba(0,0,0,0.8);
}

.os-panel:active { transform: scale(0.96) translateY(6px); border-color: var(--neon-color); }

/* Renk Temaları */
.tr-node { --neon-color: var(--blue); --panel-bg: linear-gradient(145deg, rgba(0, 210, 255, 0.12), rgba(0,0,0,0.7)); }
.ac-node { --neon-color: var(--green); --panel-bg: linear-gradient(145deg, rgba(57, 255, 20, 0.08), rgba(0,0,0,0.7)); }
.tc-node { --neon-color: var(--pink); --panel-bg: linear-gradient(145deg, rgba(255, 0, 127, 0.12), rgba(0,0,0,0.7)); }

/* ✅ CANLI VE RENKLİ İKONLAR (OS CORE) */
.icon-container {
  position: relative; width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; z-index: 5;
}

/* İkon Arkasındaki Enerji Halkası */
.energy-ring {
  position: absolute; inset: 0;
  border: 2px solid var(--neon-color);
  border-radius: 50%; opacity: 0.3;
  animation: ringPulse 2s infinite alternate ease-in-out;
}
.energy-ring::after {
  content: ""; position: absolute; inset: -8px;
  border: 1px dashed var(--neon-color);
  border-radius: 50%; animation: spin 10s linear infinite; opacity: 0.4;
}

.main-icon {
  font-size: 38px; z-index: 10;
  filter: drop-shadow(0 0 15px var(--neon-color));
  animation: iconFloat 3s infinite alternate ease-in-out;
}

/* İçerik */
.content-wrap { display: flex; flex-direction: column; gap: 4px; z-index: 10; }
.btn-title { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 800; color: #fff; margin: 0; }
.btn-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-desc { font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

/* Durum Etiketi */
.status-tag {
  position: absolute; top: 12px; right: 20px;
  font-family: monospace; font-size: 8px; color: var(--neon-color);
  background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 8px;
  border: 1px solid var(--neon-color); opacity: 0.7;
}

/* Animasyonlar */
@keyframes ringPulse { from { transform: scale(0.9); opacity: 0.2; } to { transform: scale(1.1); opacity: 0.5; } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes iconFloat { from { transform: translateY(-4px) rotate(-5deg); } to { transform: translateY(4px) rotate(5deg); } }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="os-panel tr-node" onclick="location.href='/pages/translate_home.html'">
      <div class="status-tag">SİNYAL: AKTİF</div>
      <div class="content-wrap">
        <h2 class="btn-title">Translate <span>AI</span></h2>
        <div class="btn-desc">Nöral Dil Akışı</div>
      </div>
      <div class="icon-container">
        <div class="energy-ring"></div>
        <div class="main-icon">📡</div>
      </div>
    </div>

    <div class="os-panel ac-node" onclick="location.href='/pages/academy_home.html'">
      <div class="status-tag">MODÜL: HAZIR</div>
      <div class="content-wrap">
        <h2 class="btn-title">Academy <span>AI</span></h2>
        <div class="btn-desc">Bilgelik ve Eğitim Yolu</div>
      </div>
      <div class="icon-container">
        <div class="energy-ring"></div>
        <div class="main-icon">💎</div> </div>
    </div>

    <div class="os-panel tc-node" onclick="location.href='/pages/helper_home.html'">
      <div class="status-tag">SENKRON: AÇIK</div>
      <div class="content-wrap">
        <h2 class="btn-title">Teacher <span>AI</span></h2>
        <div class="btn-desc">Mantıksal Çözüm Motoru</div>
      </div>
      <div class="icon-container">
        <div class="energy-ring"></div>
        <div class="main-icon">🧬</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
