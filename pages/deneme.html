<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • FaceToFace Public</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at top, rgba(236,72,153,.06), transparent 22%),
        radial-gradient(circle at bottom, rgba(99,102,241,.06), transparent 22%),
        #050508;
    }

    .container{
      width:100%;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      overflow:hidden;
      padding:10px 8px;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
      padding-bottom:calc(10px + var(--safe-bottom));
    }

    .lang-row{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:20;
    }

    .lang-trigger{
      height:38px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:#fff;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:82vw;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:100;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
    }

    .pop-list::-webkit-scrollbar{display:none}

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item.active{
      background:rgba(99,102,241,.14);
      border-color:rgba(99,102,241,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{font-size:18px}

    .pop-name{
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pop-code{
      font-size:12px;
      font-weight:900;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:14px;
      padding:14px 0 22px;
      text-align:center;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .chat-body::-webkit-scrollbar{display:none}

    .bubble{
      max-width:86%;
      line-height:1.18;
      word-break:break-word;
      font-size:24px;
      font-weight:900;
      opacity:.9;
    }

    .bubble.latest{
      font-size:32px;
      font-weight:1000;
      opacity:1;
    }

    .mic-line{
      width:100%;
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:12px;
      padding:0 8px 4px;
      flex:0 0 auto;
    }

    .mic-placeholder{
      min-height:1px;
      opacity:0;
      pointer-events:none;
    }

    .mic-btn{
      width:70px;
      height:70px;
      border:none;
      border-radius:999px;
      background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:
        0 18px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
    }

    .mic-btn svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .mic-btn.listening{
      background:
        radial-gradient(circle at 50% 35%, rgba(216,180,254,.34), rgba(99,102,241,.22) 44%, rgba(236,72,153,.12));
      box-shadow:
        0 0 0 10px rgba(99,102,241,.12),
        0 0 34px rgba(99,102,241,.45),
        0 0 70px rgba(236,72,153,.25),
        inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:2px solid rgba(165,180,252,.78);
      box-shadow:
        0 0 0 12px rgba(99,102,241,.10),
        0 0 38px rgba(236,72,153,.35);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.045)}
    }

    @keyframes micPulse{
      0%{transform:scale(.92);opacity:.95}
      70%{transform:scale(1.18);opacity:.16}
      100%{transform:scale(1.24);opacity:0}
    }

    .center-hub{
      height:82px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:50;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .mode-toggle-inline{
      position:absolute;
      left:14px;
      width:76px;
      min-width:76px;
      height:38px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      padding:4px;
      display:flex;
      align-items:center;
      cursor:pointer;
      overflow:hidden;
      backdrop-filter:blur(10px);
      z-index:60;
    }

    .mode-toggle-inline-track{
      position:absolute;
      inset:0;
      border-radius:999px;
      opacity:.18;
      transition:.2s ease;
    }

    .mode-toggle-inline-thumb{
      position:relative;
      width:28px;
      height:28px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,.24);
      transition:transform .22s ease, background .22s ease;
      z-index:2;
    }

    .mode-toggle-inline-label{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:9px;
      font-weight:1000;
      letter-spacing:.4px;
      color:#fff;
      z-index:1;
      pointer-events:none;
    }

    .mode-toggle-inline.online .mode-toggle-inline-track{background:rgba(34,197,94,.95)}
    .mode-toggle-inline.online .mode-toggle-inline-thumb{transform:translateX(0);background:#ecfff3}
    .mode-toggle-inline.offline .mode-toggle-inline-track{background:rgba(239,68,68,.95)}
    .mode-toggle-inline.offline .mode-toggle-inline-thumb{transform:translateX(36px);background:#fff0f2}

    .orb{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      font-weight:900;
      position:relative;
      overflow:visible;
    }

    .orb-main{
      position:relative;
      z-index:3;
    }

    .orb .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sat{
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      margin-left:-5px;
      margin-top:-5px;
      border-radius:50%;
      z-index:1;
      filter:blur(1.5px);
    }

    .sat1{
      background:#6366f1;
      box-shadow:0 0 15px #6366f1;
      animation:orbit1 4.8s linear infinite;
    }

    .sat2{
      background:#ec4899;
      box-shadow:0 0 15px #ec4899;
      animation:orbit2 6.2s linear infinite;
    }

    @keyframes orbit1{
      from{transform:rotate(0deg) translateX(48px) rotate(0deg)}
      to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}
    }

    @keyframes orbit2{
      from{transform:rotate(180deg) translateX(48px) rotate(-180deg)}
      to{transform:rotate(540deg) translateX(48px) rotate(-540deg)}
    }

    .edge-handle{
      position:fixed;
      right:0;
      top:50%;
      transform:translateY(-50%);
      width:32px;
      height:122px;
      border:none;
      border-radius:24px 0 0 24px;
      background:linear-gradient(180deg,rgba(99,102,241,.36),rgba(236,72,153,.28));
      border-left:1px solid rgba(255,255,255,.28);
      z-index:9997;
      cursor:pointer;
      box-shadow:
        0 0 22px rgba(99,102,241,.25),
        -8px 0 22px rgba(236,72,153,.10);
      animation:edgeHint 2s infinite ease-in-out;
      touch-action:none;
    }

    .edge-handle::before{
      content:"";
      position:absolute;
      left:12px;
      top:17px;
      width:5px;
      height:88px;
      border-radius:999px;
      background:rgba(255,255,255,.76);
      box-shadow:0 0 14px rgba(255,255,255,.38);
    }

    .edge-handle::after{
      content:"⋮";
      position:absolute;
      left:8px;
      top:46px;
      color:rgba(255,255,255,.92);
      font-size:22px;
      line-height:1;
      text-shadow:0 0 10px rgba(255,255,255,.45);
    }

    .edge-handle.dragging{
      animation:none;
      filter:brightness(1.15);
    }

    @keyframes edgeHint{
      0%,100%{transform:translateY(-50%) translateX(0)}
      50%{transform:translateY(-50%) translateX(-5px)}
    }

    .edge-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.38);
      backdrop-filter:blur(4px);
      z-index:9996;
      display:none;
    }

    .edge-backdrop.show{display:block}

    .edge-menu{
      position:fixed;
      right:-246px;
      top:50%;
      transform:translateY(-50%);
      width:226px;
      padding:16px 14px 12px;
      border-radius:30px 0 0 30px;
      background:
        radial-gradient(circle at top left,rgba(99,102,241,.20),transparent 38%),
        linear-gradient(180deg,rgba(16,16,24,.97),rgba(8,8,14,.99));
      border:1px solid rgba(255,255,255,.12);
      border-right:none;
      z-index:9998;
      transition:.24s ease;
      box-shadow:-18px 0 40px rgba(0,0,0,.36), -8px 0 30px rgba(99,102,241,.12);
    }

    .edge-menu.open{right:0}

    .edge-menu-btn{
      width:100%;
      min-height:46px;
      margin-bottom:10px;
      border:none;
      border-radius:18px;
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-family:inherit;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      padding:0 14px;
      text-align:left;
    }

    .edge-menu-btn:last-child{margin-bottom:0}
    .edge-menu-btn.danger{color:#ffb4b4}

    .edge-no{
      width:22px;
      height:22px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.10);
      font-size:11px;
      font-weight:1000;
      flex:0 0 auto;
    }

    .edge-label{
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .edge-footer{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.10);
      font-size:10px;
      font-weight:800;
      color:rgba(255,255,255,.50);
      text-align:center;
      letter-spacing:.2px;
    }

    .hidden-action{display:none!important}

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);
      min-height:44px;
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:9999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      pointer-events:none;
    }

    .toast.show{transform:translateX(-50%) translateY(0)}

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:20px;
    }

    .modal.show{display:flex}

    .modal-card{
      width:min(100%,420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{background:var(--ai-gradient);color:#05060d}
    .modal-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff}

    @media(max-width:390px){
      .mic-line{grid-template-columns:1fr 66px 1fr}
      .mic-btn{width:66px;height:66px}
      .mic-btn svg{width:28px;height:28px}
      .bubble{font-size:22px}
      .bubble.latest{font-size:30px}
      .edge-menu{width:216px;right:-236px}
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-top">
        <div class="pop-head">
          <div id="topPopTitle">ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>
        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
        <div class="mic-placeholder"></div>
      </div>
    </section>

    <section class="center-hub">
      <button id="topModeToggle" class="mode-toggle-inline online" type="button" aria-label="Online offline geçiş">
        <span class="mode-toggle-inline-track"></span>
        <span class="mode-toggle-inline-thumb"></span>
        <span class="mode-toggle-inline-label" id="topModeToggleLabel">ONLINE</span>
      </button>

      <div class="orb">
        <span class="sat sat1"></span>
        <span class="sat sat2"></span>
        <span class="orb-main">italky<span class="ai">AI</span></span>
      </div>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-bot">
        <div class="pop-head">
          <div id="botPopTitle">ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>
        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
        <div class="mic-placeholder"></div>
      </div>
    </section>

  </main>

  <button id="clearBtn" class="hidden-action" type="button">TEMİZLE</button>

  <button id="edgeHandle" class="edge-handle" type="button" aria-label="Menü aç"></button>
  <div id="edgeBackdrop" class="edge-backdrop"></div>

  <aside id="edgeMenu" class="edge-menu">
    <button id="edgeDownloadBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">1</span>
      <span class="edge-label">Dil İndir</span>
    </button>

    <button id="edgeLoginBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">2</span>
      <span class="edge-label">Giriş Yap</span>
    </button>

    <button id="edgeClearBtn" class="edge-menu-btn danger" type="button">
      <span class="edge-no">3</span>
      <span class="edge-label">Sohbeti Temizle</span>
    </button>

    <button id="edgePrivacyBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">4</span>
      <span class="edge-label">Gizlilik</span>
    </button>

    <div class="edge-footer">italkyAI By Ozyigit's 2026</div>
  </aside>

  <div id="adModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title" id="adTitle">Ücretsiz Kullanım</h3>
      <p class="modal-text" id="adText">
        FaceToFace ücretsiz kullanımda reklam içerir. Reklamı izledikten sonra çeviriye devam edebilirsiniz.
      </p>
      <div class="modal-actions">
        <button id="watchAdBtn" class="modal-btn primary" type="button">Reklam İzle</button>
        <button id="closeAdBtn" class="modal-btn secondary" type="button">Şimdilik Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/facetoface_public.js?v=PUBLIC_F2F_EDGE_V4"></script>

  <script>
    (function(){
      const $ = (id) => document.getElementById(id);

      const edgeHandle = $("edgeHandle");
      const edgeBackdrop = $("edgeBackdrop");
      const edgeMenu = $("edgeMenu");

      const edgeDownloadBtn = $("edgeDownloadBtn");
      const edgeLoginBtn = $("edgeLoginBtn");
      const edgeClearBtn = $("edgeClearBtn");
      const edgePrivacyBtn = $("edgePrivacyBtn");

      const clearBtn = $("clearBtn");

      let startX = 0;
      let currentX = 0;
      let dragging = false;
      let moved = false;

      function openEdgeMenu(){
        edgeMenu && edgeMenu.classList.add("open");
        edgeBackdrop && edgeBackdrop.classList.add("show");
      }

      function closeEdgeMenu(){
        edgeMenu && edgeMenu.classList.remove("open");
        edgeBackdrop && edgeBackdrop.classList.remove("show");
      }

      function onPointerDown(e){
        dragging = true;
        moved = false;
        startX = e.clientX || 0;
        currentX = startX;
        edgeHandle && edgeHandle.classList.add("dragging");
      }

      function onPointerMove(e){
        if(!dragging) return;
        currentX = e.clientX || currentX;
        const diff = startX - currentX;
        if(diff > 8) moved = true;
        if(diff > 34) openEdgeMenu();
      }

      function onPointerUp(){
        if(!dragging) return;
        const diff = startX - currentX;
        dragging = false;
        edgeHandle && edgeHandle.classList.remove("dragging");
        if(diff > 24) openEdgeMenu();
        else if(!moved) openEdgeMenu();
      }

      edgeHandle && edgeHandle.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);

      edgeBackdrop && edgeBackdrop.addEventListener("click", closeEdgeMenu);

      edgeDownloadBtn && edgeDownloadBtn.addEventListener("click", function(){
        location.href = "/pages/offline_languages_public.html";
      });

      edgeLoginBtn && edgeLoginBtn.addEventListener("click", function(){
        location.href = "/pages/login.html";
      });

      edgeClearBtn && edgeClearBtn.addEventListener("click", function(){
        closeEdgeMenu();
        if(clearBtn) clearBtn.click();
      });

      edgePrivacyBtn && edgePrivacyBtn.addEventListener("click", function(){
        location.href = "/pages/privacy.html";
      });

      setTimeout(function(){
        if(localStorage.getItem("italkyai_edge_hint_seen_v1")) return;
        localStorage.setItem("italkyai_edge_hint_seen_v1", "1");

        const toast = $("toast");
        if(!toast) return;

        toast.textContent = "Menü için sağdaki çizgiyi çek";
        toast.classList.add("show");

        setTimeout(function(){
          toast.classList.remove("show");
        }, 2200);
      }, 900);
    })();
  </script>
</body>
</html>
