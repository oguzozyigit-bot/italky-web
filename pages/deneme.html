<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<style>
:root{
  --txt:rgba(255,255,255,.96);
  --muted:rgba(255,255,255,.60);
  --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --cardLine:rgba(255,255,255,.12);
  --cyan:#67e8f9;
  --pink:#f472b6;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; width:100%; height:100%; overflow:hidden;
  color:var(--txt); font-family:'Outfit',sans-serif;
  background:#120d16;
}

body{
  background: 
    radial-gradient(circle at 50% 0%, rgba(251,146,60,.15) 0%, transparent 40%),
    linear-gradient(180deg, #1d1016 0%, #120d16 100%);
}

/* ANA KONTEYNER: Header ve Footer arasına hapseder */
#pageContent{
  width:100%; height:100vh;
  max-width:500px; margin:0 auto;
  padding: 
    calc(var(--headerH, 70px) + 10px) 
    16px 
    calc(var(--footerH, 75px) + 10px);
  display:flex; flex-direction:column;
  justify-content: space-between; /* İçeriği yayar */
}

/* BAŞLIK ÜSTE GELİYOR */
.hero-header {
  text-align: center;
  margin-bottom: 10px;
}
.heroTitle{
  font-family:'Space Grotesk',sans-serif;
  font-size: clamp(20px, 6vw, 26px);
  font-weight:700; margin:0;
}
.heroTitle span { background:var(--ai-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* KÜP ALANI */
.holo-zone {
  flex: 0 0 auto;
  height: 180px; /* Sabitlendi taşmaması için */
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.holo-qr {
  width: 100px; height: 100px;
  background: #fff; border-radius: 12px; padding: 6px;
  box-shadow: 0 0 30px rgba(103, 232, 249, 0.6);
  z-index: 5; animation: float 4s ease-in-out infinite;
}
.holo-qr img { width: 100%; height: 100%; object-fit: cover; }

.energy-base {
  position: absolute; bottom: 20px; width: 140px; height: 40px;
  background: radial-gradient(ellipse, var(--cyan), transparent 70%);
  filter: blur(10px); opacity: 0.4; transform: rotateX(70deg);
}

/* KART GRID */
.home-grid{
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.2fr 0.8fr;
  gap: 12px; padding-bottom: 5px;
}

.mod-card{
  position:relative; border-radius:24px; overflow:hidden;
  border:1px solid var(--cardLine);
  background: rgba(255,255,255,.03);
  display: flex; flex-direction: column;
  padding: 16px; text-decoration: none; color: #fff;
}

.face-card{ background: linear-gradient(180deg, #2b1a4a 0%, #150e19 100%); }
.all-card { background: linear-gradient(180deg, #4a1a3a 0%, #150e19 100%); }
.offline-card { 
  grid-column: 1 / 3; flex-direction: row; align-items: center; 
  background: linear-gradient(90deg, #4a271a 0%, #150e19 100%);
}

.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size: clamp(18px, 5vw, 24px);
  line-height: 1; margin: 0 0 6px 0;
}
.card-title b { background:var(--ai-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.card-desc{ font-size: 11px; color: var(--muted); line-height: 1.3; margin: 0; }

/* YENİ İKONLAR: Modern Geometrik */
.icon-box {
  margin-top: auto; height: 60px; position: relative;
  display: flex; align-items: center; justify-content: center;
}

/* FaceToFace İkon: İki iç içe kare/portal */
.icon-face::before, .icon-face::after {
  content: ''; position: absolute; width: 30px; height: 30px;
  border: 2px solid var(--cyan); border-radius: 8px;
}
.icon-face::before { transform: translateX(-10px) rotate(-10deg); opacity: 0.5; }
.icon-face::after { transform: translateX(10px) rotate(10deg); box-shadow: 0 0 15px var(--cyan); }

/* AllToAll İkon: Yayılım efekti */
.icon-all .dot {
  width: 10px; height: 10px; background: var(--pink); border-radius: 50%;
  box-shadow: 0 0 15px var(--pink);
}
.icon-all .ring {
  position: absolute; border: 1px solid var(--pink); border-radius: 50%;
  animation: pulseRing 2s infinite;
}

/* Offline İkon: Dalga/Download */
.icon-off {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px dashed var(--muted); display: flex; align-items: center; justify-content: center;
}

/* ANİMASYONLAR */
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes pulseRing { 0%{width:10px; height:10px; opacity:1} 100%{width:50px; height:50px; opacity:0} }

@media (max-height: 650px) {
  .holo-zone { height: 140px; }
  .card-title { font-size: 18px; }
  .icon-box { height: 40px; }
}
</style>
</head>

<body>
<main id="pageContent">
  
  <header class="hero-header">
    <h1 class="heroTitle">Side<span>To</span>Side <span>QR</span></h1>
  </header>

  <section class="holo-zone">
    <div class="holo-qr">
      <img id="smallQrImg" alt="QR">
    </div>
    <div class="energy-base"></div>
  </section>

  <section class="home-grid">
    <a class="mod-card face-card" href="/facetoface.html">
      <h2 class="card-title">FaceToFace<b>AI</b></h2>
      <p class="card-desc">Bölünmüş ekranda yüz yüze anlık çeviri.</p>
      <div class="icon-box icon-face"></div>
    </a>

    <a class="mod-card all-card" href="/pages/f2f_connect.html">
      <h2 class="card-title">AllToAll<b>AI</b></h2>
      <p class="card-desc">Çoklu cihazlarla ortak toplantı akışı.</p>
      <div class="icon-box icon-all">
        <div class="dot"></div>
        <div class="ring"></div>
      </div>
    </a>

    <a class="mod-card offline-card" href="/pages/offline_languages.html">
      <div class="icon-box" style="margin:0; width:60px;">
        <div class="icon-off">↓</div>
      </div>
      <div style="flex:1">
        <h2 class="card-title">Offline Hub</h2>
        <p class="card-desc">İnternetsiz çeviri için dil paketlerini yönet.</p>
      </div>
    </a>
  </section>

</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

// Shell ayarı: Scroll istemiyoruz, ekran tam otursun.
mountShell({ scroll:"none" });

const smallQrImg = document.getElementById("smallQrImg");
const HOST_CODE_KEY = "italky_interpreter_host_code";

async function boot() {
  let code = localStorage.getItem(HOST_CODE_KEY);
  if(!code) {
    code = "ITK-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    localStorage.setItem(HOST_CODE_KEY, code);
  }
  const url = `https://italky.ai/open/interpreter?host=${code}&v=1`;
  smallQrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
}
boot();
</script>
</body>
</html>
