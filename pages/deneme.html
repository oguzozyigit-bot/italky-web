<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Walkie Talkie</title>

  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --blue: #60a5fa;
      --pink: #ec4899;
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    /* ✅ Kural Seti */
    #pageContent {
      height: 100%;
      display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% -10%, #1a0a25 0%, #000 100%);
    }

    .main-hub {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 12px;
      gap: 12px;
      min-height: 0;
    }

    /* ===== 1. QUANTUM SPECTRUM (TOP - NO ORB) ===== */
    .spectrum-header {
      flex: 0 0 120px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .wave-container {
      display: flex; align-items: center; gap: 4px; height: 40px;
    }

    .wave-bar {
      width: 3px; height: 10px; background: var(--ai-grad);
      border-radius: 10px; animation: waveGrowth 1.2s infinite ease-in-out;
    }

    @keyframes waveGrowth {
      0%, 100% { height: 10px; opacity: 0.3; }
      50% { height: 40px; opacity: 1; }
    }

    .portal-info { text-align: center; margin-top: 15px; }
    .portal-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; color: #fff; margin: 0; letter-spacing: -0.5px; }
    .portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ===== 2. FREQUENCY CARDS (VERTICAL FILL) ===== */
    .hub-cards { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

    .cyber-card {
      flex: 1; position: relative; border-radius: 32px; border: 1px solid var(--glass-border);
      overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 24px;
      background: var(--glass); backdrop-filter: blur(30px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cyber-card:active { transform: scale(0.98); filter: brightness(1.2); }

    /* Host: Signal Lines */
    .host-card { background: linear-gradient(145deg, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0.6) 100%); }
    .signal-line { position: absolute; left: 0; width: 100%; height: 1px; background: var(--blue); opacity: 0.2; animation: signalSlide 3s infinite linear; }

    /* Join: Pulse Scanner */
    .join-card { background: linear-gradient(145deg, rgba(236, 72, 153, 0.12) 0%, rgba(0,0,0,0.6) 100%); }
    .scan-box { position: absolute; right: -20px; top: -20px; width: 120px; height: 120px; border: 1px dashed var(--pink); border-radius: 50%; opacity: 0.3; animation: spin 10s linear infinite; }

    .card-content { flex: 1; z-index: 10; }
    .card-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; color: #fff; margin: 0; }
    .card-desc { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 6px; line-height: 1.4; max-width: 220px; }

    /* 3D Butonlar */
    .btn-3d { 
      height: 56px; border-radius: 20px; border: none; 
      background: var(--ai-grad); color: #fff; font-weight: 900; 
      box-shadow: 0 6px 20px rgba(99,102,241,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
      cursor: pointer; width: 100%; font-size: 15px; letter-spacing: 1px;
    }

    .hide { display: none !important; }

    /* Animations */
    @keyframes signalSlide { 0% { top: 0; } 100% { top: 100%; } }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <header class="spectrum-header">
      <div class="wave-container">
        <div class="wave-bar" style="animation-delay: 0.0s"></div>
        <div class="wave-bar" style="animation-delay: 0.2s"></div>
        <div class="wave-bar" style="animation-delay: 0.4s"></div>
        <div class="wave-bar" style="animation-delay: 0.6s"></div>
        <div class="wave-bar" style="animation-delay: 0.4s"></div>
        <div class="wave-bar" style="animation-delay: 0.2s"></div>
        <div class="wave-bar" style="animation-delay: 0.0s"></div>
      </div>
      <div class="portal-info">
        <h1 class="portal-title">Walkie<span>Talkie</span></h1>
      </div>
    </header>

    <div class="hub-cards" id="homeCards">
      <div class="cyber-card host-card" id="goHost">
        <div class="signal-line"></div>
        <div class="card-content">
          <h2 class="card-title">Kanal Oluştur</h2>
          <p class="card-desc">Kendi frekansını kur, kodunu paylaş ve sınırsız katılımcıyla anlık konuşmaya başla.</p>
        </div>
        <span style="font-size: 40px; opacity: 0.8;">📡</span>
      </div>

      <div class="cyber-card join-card" id="goGuest">
        <div class="scan-box"></div>
        <div class="card-content">
          <h2 class="card-title">Kanala Bağlan</h2>
          <p class="card-desc">Mevcut bir frekans kodunu gir veya QR taratıp odaya anında giriş yap.</p>
        </div>
        <span style="font-size: 40px; opacity: 0.8;">🔑</span>
      </div>
    </div>

    <div class="panel-view hide" id="hostPanel" style="flex:1; display:flex; flex-direction:column; gap:15px; min-height:0;">
       <div style="flex:1; background:rgba(0,0,0,0.4); border-radius:30px; border:1px solid var(--glass-border); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
          <img id="qrImg" style="width:200px; height:200px; border-radius:20px; background:#fff; padding:10px;"/>
          <div style="font-family:'Space Grotesk'; font-size:36px; font-weight:900; letter-spacing:6px; color:#fff; margin-top:20px;">X8K4PZ</div>
       </div>
       <button class="btn-3d" id="btnGoCall">SİNYALİ BAŞLAT</button>
       <button id="btnBackHost" style="background:none; border:none; color:rgba(255,255,255,0.4); font-weight:900; text-decoration:underline; padding:10px; cursor:pointer;">GERİ DÖN</button>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);
  const setMode = (m) => {
    $("hostPanel").classList.toggle("hide", m!=="host");
    $("homeCards").classList.toggle("hide", m!=="home");
  };

  $("goHost").onclick = () => setMode("host");
  $("btnBackHost").onclick = () => setMode("home");
</script>
</body>
</html>
