<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Meeting</title>
  <meta name="theme-color" content="#081a36"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#081a36;
      --bg2:#0c2447;
      --panel:#102a52;
      --panel2:#0e2141;
      --text:#f6fbff;
      --muted:rgba(255,255,255,.64);
      --muted2:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.08);
      --line2:rgba(119,190,255,.20);
      --blue:#56a6ff;
      --blue2:#8fd0ff;
      --cyan:#74e4ff;
      --green:#34d399;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);

      --header-h:68px;
      --footer-h:44px;
      --composer-h:92px;
      --keyboard-offset:0px;
      --app-height:100dvh;

      --u1:#5eb2ff;
      --u2:#7cf0d4;
      --u3:#c38bff;
      --u4:#ffd166;
      --u5:#ff8fab;
      --u6:#9be15d;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(86,166,255,.16), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(116,228,255,.10), transparent 20%),
        linear-gradient(180deg,#061427 0%, #081a36 55%, #09182d 100%);
    }

    #pageContent{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:var(--app-height);
      margin:0 auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 0%, rgba(86,166,255,.12), transparent 24%),
        radial-gradient(circle at 88% 16%, rgba(116,228,255,.08), transparent 18%),
        linear-gradient(180deg,#081a36 0%, #0a1f3f 48%, #081a36 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(2px + var(--safe-top)) 14px 6px;
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:10px;
      z-index:60;
      background:linear-gradient(180deg, rgba(8,26,54,.96), rgba(8,26,54,.80));
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(14px);
    }

    .icon-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.045);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg,
    .copy-btn svg,
    .menu-close svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:1px;
      text-align:center;
      user-select:none;
      cursor:pointer;
    }

    .brand-title{
      margin:0;
      font-family:"Space Grotesk", Outfit, sans-serif;
      font-size:22px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.5px;
      color:#fff;
    }

    .brand-title .ai{
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 45%, #d8f6ff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin:0;
      font-size:8px;
      font-weight:900;
      letter-spacing:2.4px;
      color:rgba(255,255,255,.28);
    }

    .menu{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:120;
    }

    .menu.open{ pointer-events:auto; }

    .menu-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.48);
      backdrop-filter:blur(6px);
      opacity:0;
      transition:opacity .22s ease;
    }

    .menu.open .menu-backdrop{ opacity:1; }

    .menu-panel{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:min(86vw, 348px);
      transform:translateX(-104%);
      transition:transform .24s ease;
      padding:calc(14px + var(--safe-top)) 12px calc(14px + var(--safe-bottom));
      background:linear-gradient(180deg, rgba(10,20,38,.98), rgba(7,15,29,.98));
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:20px 0 40px rgba(0,0,0,.35);
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:auto;
      scrollbar-width:none;
    }

    .menu-panel::-webkit-scrollbar{ display:none; }
    .menu.open .menu-panel{ transform:translateX(0); }

    .menu-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .menu-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
      color:#fff;
      margin:0;
    }

    .menu-close{
      width:40px;
      height:40px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
    }

    .menu-box{
      border-radius:22px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      padding:14px;
    }

    .profile-row{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .profile-avatar{
      width:54px;
      height:54px;
      border-radius:18px;
      overflow:hidden;
      flex:0 0 auto;
      background:linear-gradient(135deg,#17386b,#2d6dc1);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      font-weight:1000;
      color:#fff;
      border:1px solid rgba(255,255,255,.08);
    }

    .profile-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-name{
      font-size:15px;
      font-weight:1000;
      color:#fff;
      line-height:1.15;
      word-break:break-word;
    }

    .profile-no{
      margin-top:4px;
      font-size:12px;
      font-weight:800;
      color:#cdeeff;
      line-height:1.35;
      word-break:break-all;
    }

    .mini-label{
      font-size:10px;
      color:rgba(255,255,255,.50);
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.9px;
      margin-bottom:8px;
    }

    .my-id-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .my-id-pill{
      flex:1;
      min-width:0;
      min-height:44px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      padding:0 12px;
      font-size:13px;
      font-weight:900;
      color:#fff;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .copy-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      flex:0 0 auto;
    }

    .lang-picker{
      width:100%;
      min-height:48px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      padding:0 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
    }

    .lang-picker-text{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .join-input{
      width:100%;
      min-height:48px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      padding:0 14px;
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
    }

    .join-input::placeholder{
      color:rgba(255,255,255,.44);
    }

    .join-btn{
      width:100%;
      min-height:48px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 100%);
      color:#041427;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .meeting-top{
      flex:0 0 auto;
      padding:10px 12px 8px;
      background:linear-gradient(180deg, rgba(8,26,54,.88), rgba(8,26,54,.24));
      backdrop-filter:blur(10px);
    }

    .meeting-summary{
      border:1px solid var(--line2);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius:22px;
      padding:14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .meeting-line{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .meeting-title{
      font-size:18px;
      font-weight:1000;
      color:#fff;
      line-height:1.15;
    }

    .meeting-sub{
      margin-top:5px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      line-height:1.35;
    }

    .meeting-badge{
      min-width:74px;
      height:32px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid rgba(116,228,255,.22);
      background:rgba(116,228,255,.10);
      color:#d8f7ff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:1000;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .avatar-strip{
      display:flex;
      gap:10px;
      overflow-x:auto;
      scrollbar-width:none;
      margin-top:12px;
      padding-bottom:2px;
    }

    .avatar-strip::-webkit-scrollbar{ display:none; }

    .mini-user{
      min-width:50px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
      flex:0 0 auto;
    }

    .mini-avatar{
      width:44px;
      height:44px;
      border-radius:50%;
      background:linear-gradient(135deg,#17386b,#2d6dc1);
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:1000;
      color:#fff;
      position:relative;
      overflow:hidden;
    }

    .mini-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .mini-avatar.speaking{
      box-shadow:0 0 0 2px rgba(116,228,255,.22), 0 0 18px rgba(116,228,255,.34);
    }

    .mini-avatar.active::after{
      content:"";
      position:absolute;
      right:2px;
      bottom:2px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
      border:1px solid #081a36;
    }

    .mini-name{
      max-width:60px;
      font-size:10px;
      color:rgba(255,255,255,.76);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }

    .chat-scroll{
      flex:1;
      min-height:0;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:8px 14px calc(var(--composer-h) + 20px + var(--keyboard-offset));
      display:flex;
      flex-direction:column;
      gap:10px;
      scroll-behavior:smooth;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.left{ justify-content:flex-start; }
    .msg.right{ justify-content:flex-end; }
    .msg.center{ justify-content:center; }

    .bubble-wrap{ max-width:88%; }

    .bubble{
      background:#0c1830;
      border:1px solid rgba(255,255,255,.08);
      padding:16px 16px 14px;
      border-radius:24px;
      font-size:14px;
      line-height:1.45;
      font-weight:800;
      word-break:break-word;
      box-shadow:0 8px 22px rgba(0,0,0,.18);
      white-space:pre-wrap;
    }

    .bubble-wrap.user-c1 .bubble{ border-left:4px solid var(--u1); }
    .bubble-wrap.user-c2 .bubble{ border-left:4px solid var(--u2); }
    .bubble-wrap.user-c3 .bubble{ border-left:4px solid var(--u3); }
    .bubble-wrap.user-c4 .bubble{ border-left:4px solid var(--u4); }
    .bubble-wrap.user-c5 .bubble{ border-left:4px solid var(--u5); }
    .bubble-wrap.user-c6 .bubble{ border-left:4px solid var(--u6); }

    .bubble.right{
      border-right:4px solid var(--cyan);
      background:linear-gradient(180deg,#143255,#102947);
      border-left:none !important;
    }

    .bubble.system{
      text-align:center;
      border:1px solid rgba(116,228,255,.16);
      background:rgba(116,228,255,.08);
      color:#d8f7ff;
      font-size:12px;
      padding:12px 14px;
    }

    .msg-name{
      font-size:10px;
      color:var(--muted2);
      font-weight:900;
      margin-top:6px;
      padding-left:2px;
      letter-spacing:.2px;
    }

    .msg-meta{
      margin-top:3px;
      font-size:11px;
      font-weight:700;
      color:var(--muted);
    }

    .typing{
      display:none;
      position:absolute;
      left:14px;
      right:14px;
      bottom:calc(var(--composer-h) + 12px + var(--keyboard-offset));
      font-size:12px;
      color:rgba(255,255,255,.72);
      font-weight:800;
      z-index:12;
    }

    .typing.show{ display:block; }

    .composer-wrap{
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:20;
      transform:translateY(calc(-1 * var(--keyboard-offset)));
      transition:transform .12s ease;
    }

    .composer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:72px;
      padding:10px 12px;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
      position:relative;
    }

    .composer.listening{
      box-shadow:
        0 0 0 1px rgba(116,228,255,.30),
        0 0 0 8px rgba(116,228,255,.08),
        0 0 30px rgba(116,228,255,.18),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation:composerPulse 1.2s ease-in-out infinite;
    }

    @keyframes composerPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.006); }
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:140px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:16px;
      font-weight:800;
      line-height:1.45;
      font-family:inherit;
      overflow:auto;
    }

    .composer-input::placeholder{
      color:rgba(255,255,255,.70);
      font-weight:800;
    }

    .send-btn,.mic-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .send-btn{
      background:#fff;
      color:#061427;
      box-shadow:0 0 24px rgba(255,255,255,.10);
    }

    .mic-btn{
      background:transparent;
      color:#fff;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      border:2px solid rgba(116,228,255,.72);
      box-shadow:0 0 0 8px rgba(116,228,255,.10), 0 0 24px rgba(116,228,255,.18);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.14; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .hidden{ display:none !important; }

    .footer{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:10px 12px calc(10px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(8,26,54,.88);
      backdrop-filter:blur(12px);
      z-index:30;
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      flex-wrap:wrap;
      font-size:12px;
      font-weight:900;
      text-align:center;
    }

    .seal-main{
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 55%, #d9f5ff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .seal-dot{ color:rgba(255,255,255,.25); }
    .seal-year{ color:#bfe7ff; }

    .lang-modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:160;
      background:rgba(0,0,0,.36);
      backdrop-filter:blur(4px);
      padding:16px;
    }

    .lang-modal.open{ display:flex; }

    .lang-sheet{
      width:min(100%, 430px);
      max-height:76vh;
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(18,26,42,.98), rgba(10,16,28,.98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 24px 60px rgba(0,0,0,.34);
      display:flex;
      flex-direction:column;
    }

    .lang-sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .lang-sheet-title{
      font-size:18px;
      font-weight:1000;
      color:#fff;
    }

    .lang-sheet-close{
      width:40px;
      height:40px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
    }

    .lang-search-wrap{
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .lang-search{
      width:100%;
      min-height:46px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      padding:0 14px;
      font-size:14px;
      font-weight:800;
    }

    .lang-search::placeholder{
      color:rgba(255,255,255,.42);
    }

    .lang-list{
      overflow:auto;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      scrollbar-width:none;
    }

    .lang-list::-webkit-scrollbar{ display:none; }

    .lang-item{
      width:100%;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.07);
      color:#fff;
      text-align:left;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
    }

    .lang-item.active{
      border-color:rgba(116,228,255,.26);
      background:rgba(116,228,255,.10);
    }

    .lang-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .lang-flag{
      width:28px;
      height:28px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.05);
      font-size:18px;
      flex:0 0 auto;
