<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Academy Terminal</title>

<style>
  /* 🛡️ KRİTİK KORUMA: Beyaz ekran ve kırpılmayı engeller */
  html { background: #000 !important; }
  body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  
  #pageContent { 
    opacity: 0; 
    transform: translateY(10px); 
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  }
  #pageContent.shell-ready { 
    opacity: 1; 
    transform: translateY(0); 
  }
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --neon-blue: #00d2ff;
  --neon-green: #39ff14;
  --neon-orange: #f97316;
  --glass-border: rgba(255,255,255,0.1);
}
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

#pageContent {
  height: 100%; display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 40%, #121235 0%, #000 100%);
}

.main-hub { flex: 1; display: flex; flex-direction: column; gap: 15px; padding: 15px; }

/* 💎 SEVİYE PORTALI */
.portal-top {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  padding: 20px 0; cursor: pointer;
}

.neural-scanner {
  width: 130px; height: 130px; position: relative;
  display: flex; align-items: center; justify-content: center;
}

.scanner-ring { position: absolute; inset: 0; border-radius: 50%; }
.scanner-ring.outer { 
  border: 1px dashed rgba(165, 180, 252, 0.3);
  animation: rotateAction 12s linear infinite; 
}
.scanner-ring.inner { 
  inset: 12px; border: 2px solid transparent;
  background: var(--ai-grad) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  animation: rotateAction 8s linear infinite reverse;
}

.level-dot {
  position: absolute; width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900; color: #fff;
  box-shadow: 0 0 15px currentColor; animation: float 3s infinite ease-in-out;
}
.dot-a1 { top: -5px; left: 15%; background: var(--neon-green); color: var(--neon-green); }
.dot-c1 { bottom: -5px; right: 15%; background: var(--neon-blue); color: var(--neon-blue); animation-delay: 1.5s; }

.core-button {
  width: 80px; height: 80px; border-radius: 50%;
  background: #000; border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; z-index: 5; box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.3);
}

.portal-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 800; color: #fff; margin: 15px 0 0; }
.portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* 📚 AKADEMİ KARTLARI */
.hub-cards { flex: 1; display: flex; flex-direction: column; gap: 12px; }

.os-card {
  flex: 1; position: relative; border-radius: 30px;
  border: 1px solid var(--glass-border);
  display: flex; align-items: center; padding: 0 22px;
  background: rgba(255,255,255,0.03); backdrop-filter: blur(25px);
  transition: all 0.4s cubic-bezier(0.15, 1, 0.3, 1);
}
.os-card:active { transform: scale(0.96) translateY(4px); }

.lesson-node { --theme: var(--neon-blue); }
.practice-node { --theme: var(--neon-green); }
.game-node { --theme: var(--neon-orange); }

.os-card::before {
  content: ""; position: absolute; left: 0; top: 25%; bottom: 25%; width: 4px;
  background: var(--theme); border-radius: 0 4px 4px 0; box-shadow: 0 0 15px var(--theme);
}

.icon-box {
  width: 58px; height: 58px; border-radius: 20px;
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-right: 20px; filter: drop-shadow(0 0 8px var(--theme));
}

.card-info h2 { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 800; margin: 0; color: #fff; }
.card-info h2 span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-info p { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; font-weight: 600; letter-spacing: 0.3px; }

/* ANIMASYONLAR */
@keyframes rotateAction { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="portal-top" onclick="location.href='/pages/level_test_hub.html'">
      <div class="neural-scanner">
        <div class="scanner-ring outer"></div>
        <div class="scanner-ring inner"></div>
        <div class="level-dot dot-a1">A1</div>
        <div class="level-dot dot-c1">C1</div>
        <div class="core-button">💎</div>
      </div>
      <h1 class="portal-title">Seviye Tespit <span>Sınavı</span></h1>
      <p style="font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.3); margin-top: 8px; letter-spacing: 2px;">6 DİL • 40 DK • AKILLI ANALİZ</p>
    </div>

    <div class="hub-cards">
      <div class="os-card lesson-node" onclick="location.href='/pages/teacher_select.html'">
        <div class="icon-box">📚</div>
        <div class="card-info">
          <h2>Dil Dersi <span>AI</span></h2>
          <p>Müfredat Odaklı • 15 Dakikalık Oturumlar</p>
        </div>
      </div>

      <div class="os-card practice-node" onclick="location.href='/pages/practice_ai.html'">
        <div class="icon-box">🎙️</div>
        <div class="card-info">
          <h2>AI ile <span>Pratik</span></h2>
          <p>Konuş ve Dinle • Gerçek Zamanlı Analiz</p>
        </div>
      </div>

      <div class="os-card game-node" onclick="location.href='/pages/game_lang_select.html'">
        <div class="icon-box">🎯</div>
        <div class="card-info">
          <h2>Eğlenerek <span>Öğren</span></h2>
          <p>Dil Refleks Oyunları • Kelime Haznesi</p>
        </div>
      </div>
    </div>

  </div>
</main>



<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  
  // Shell'i monte et
  mountShell({ scroll:"none" });
  
  // İçeriği göstermeden önce kısa bir bekleme (Render stabilitesi için)
  window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      document.getElementById("pageContent").classList.add("shell-ready");
    }, 100);
  });
</script>
</body>
</html>
