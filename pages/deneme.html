<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AllToAll Live</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050208;
      --accent: #00f2fe;
      --pink: #ff00c1;
      --purple: #7000ff;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100dvh;
      overflow: hidden; /* Scroll tamamen kapandı */
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: white;
    }

    /* Hareketli Arka Plan Katmanı */
    .nebula {
      position: fixed; inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
      filter: blur(80px);
      z-index: 0;
      animation: nebulaMove 10s infinite alternate ease-in-out;
    }

    @keyframes nebulaMove {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1.2) rotate(5deg); }
    }

    /* Ana Konteyner - Tam Ekran Orta */
    #pageContent {
      position: relative; z-index: 10;
      height: 100%;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      justify-content: center;
      max-width: 500px; margin: 0 auto;
    }

    /* Hero Alanı */
    .hero { text-align: center; margin-bottom: 30px; }
    
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px; margin: 0;
      background: linear-gradient(to right, #fff, var(--accent), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
    }

    /* Canlı Ses Dalgaları */
    .audio-visualizer {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 4px; height: 40px; margin-bottom: 10px;
    }
    .bar {
      width: 4px; background: var(--accent); border-radius: 2px;
      animation: barJump 0.6s infinite alternate ease-in-out;
    }
    .bar:nth-child(even) { background: var(--pink); animation-duration: 0.8s; }
    @keyframes barJump { 
      0% { height: 10px; } 
      100% { height: 35px; filter: brightness(1.5) drop-shadow(0 0 5px var(--accent)); } 
    }

    /* Kartlar ve Animasyonlu Kenarlar */
    .cyber-card {
      position: relative;
      background: rgba(15, 10, 20, 0.6);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: space-between;
      transition: 0.3s;
      overflow: hidden;
    }

    /* Kenar Işığı Animasyonu */
    .cyber-card::after {
      content: ""; position: absolute; inset: -2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--pink), transparent);
      z-index: -1; animation: borderRotate 4s linear infinite;
      opacity: 0.3;
    }
    @keyframes borderRotate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .card-title { font-size: 22px; font-weight: 900; margin: 0; }
    .card-desc { font-size: 12px; opacity: 0.6; margin-top: 5px; }

    /* Input ve Butonlar */
    .panel-view { display: flex; flex-direction: column; gap: 15px; }
    
    .input-field {
      width: 100%; height: 70px;
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--accent);
      border-radius: 20px;
      color: #fff; text-align: center;
      font-size: 32px; font-family: 'Space Grotesk';
      letter-spacing: 10px;
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .btn-3d {
      height: 60px; border-radius: 20px; border: none;
      background: linear-gradient(45deg, var(--purple), var(--pink));
      color: white; font-weight: 900; font-size: 16px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 10px 20px rgba(255, 0, 193, 0.3);
      cursor: pointer;
    }

    .btn-ghost {
      height: 50px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px; color: white; cursor: pointer;
    }

    .room-code-display {
      font-size: 48px; text-align: center; font-family: 'Space Grotesk';
      background: linear-gradient(to bottom, #fff, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin: 20px 0;
    }

    .hide { display: none !important; }
    
  </style>
</head>

<body>
  <div class="nebula"></div>

  <main id="pageContent">
    
    <header class="hero">
      <div class="audio-visualizer">
        <div class="bar" style="animation-delay: 0.1s"></div>
        <div class="bar" style="animation-delay: 0.3s"></div>
        <div class="bar" style="animation-delay: 0.2s"></div>
        <div class="bar" style="animation-delay: 0.5s"></div>
        <div class="bar" style="animation-delay: 0.4s"></div>
        <div class="bar" style="animation-delay: 0.2s"></div>
      </div>
      <h1 class="hero-title">AllToAll</h1>
      <p style="font-size: 12px; opacity: 0.5;">Sınırları Kaldıran Canlı Çeviri</p>
    </header>

    <div id="homeCards">
      <div class="cyber-card" id="goHost" style="cursor: pointer;">
        <div>
          <div class="card-title">KANAL OLUŞTUR</div>
          <div class="card-desc">Lider ol, kısa kodunu paylaş.</div>
        </div>
        <div style="font-size: 30px;">🛰️</div>
      </div>

      <div class="cyber-card" id="goGuest" style="cursor: pointer;">
        <div>
          <div class="card-title">KATIL</div>
          <div class="card-desc">Davet kodunla odaya gir.</div>
        </div>
        <div style="font-size: 30px;">⚡</div>
      </div>
    </div>

    <div class="panel-view hide" id="hostPanel">
      <div class="room-code-display" id="roomCode">------</div>
      <button class="btn-3d" id="btnGoCall">ODAYI BAŞLAT</button>
      <div style="display: flex; gap: 10px;">
        <button class="btn-ghost" style="flex:1" id="btnCopy">KOPYALA</button>
        <button class="btn-ghost" style="flex:1" id="btnBackHost">GERİ</button>
      </div>
      <p id="hostStatus" style="text-align: center; font-size: 11px; color: var(--accent);">Bağlantı Hazırlanıyor...</p>
    </div>

    <div class="panel-view hide" id="joinPanel">
      <input class="input-field" id="roomInput" placeholder="KODU YAZ" maxlength="6" />
      <button class="btn-3d" id="btnJoin">BAĞLAN</button>
      <button class="btn-ghost" id="btnBackJoin">İPTAL</button>
    </div>

  </main>

  <script>
    // Giriş kodunu otomatik tetikleme
    (function(){
      const input = document.getElementById("roomInput");
      const btnJoin = document.getElementById("btnJoin");
      if(!input) return;
      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (input.value.length === 6) {
          setTimeout(() => { btnJoin?.click(); }, 150);
        }
      });
    })();
  </script>

  <script type="module" src="/js/alltoall_lobby.js?v=4"></script>
</body>
</html>
