<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>italkyAI</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell();
</script>

<style>

.home-wrap{
padding:22px;
display:flex;
flex-direction:column;
gap:28px;
}

/* üst bölüm */

.hero{
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
margin-top:10px;
}

.mic-core{

width:130px;
height:130px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:46px;

background:
radial-gradient(circle at 40% 40%,#3a6cff,#1a1f3b);

box-shadow:
0 0 50px rgba(70,120,255,.5),
inset 0 0 20px rgba(255,255,255,.15);

animation: pulse 4s infinite ease-in-out;

}

@keyframes pulse{

0%{ transform:scale(1); box-shadow:0 0 30px #3a6cff; }

50%{ transform:scale(1.08); box-shadow:0 0 60px #8f5cff; }

100%{ transform:scale(1); box-shadow:0 0 30px #3a6cff; }

}

.qr-btn{

background:linear-gradient(135deg,#5c6cff,#ff5cc8);

border:none;

padding:10px 18px;

border-radius:12px;

font-weight:700;

color:white;

font-size:13px;

}

/* kart alanı */

.grid{

display:grid;

grid-template-columns:1fr 1fr;

grid-template-rows:auto auto;

gap:16px;

}

/* kart */

.card{

padding:22px;

border-radius:20px;

position:relative;

cursor:pointer;

overflow:hidden;

transition:.25s;

}

.card:hover{

transform:translateY(-6px);

}

/* FaceToFace */

.face{

grid-column:1 / 3;

background:linear-gradient(135deg,#2a6fff,#00b4ff);

}

/* SideToSide */

.side{

background:linear-gradient(135deg,#8a2be2,#ff4fd8);

}

/* AllToAll */

.all{

background:linear-gradient(135deg,#ff7a18,#ffb347);

}

.card h2{

margin:0;

font-size:20px;

font-weight:800;

}

.card p{

margin-top:6px;

opacity:.85;

font-size:13px;

}

</style>

</head>



<body>


<div id="pageContent">


<div class="home-wrap">


<!-- üst -->

<div class="hero">

<div class="mic-core">
🎤
</div>

<button class="qr-btn">
QR Bağlan
</button>

</div>



<!-- modüller -->

<div class="grid">

<div class="card face" onclick="location.href='/pages/facetoface.html'">

<h2>FaceToFace</h2>

<p>Tek telefonda karşılıklı konuşma</p>

</div>



<div class="card side" onclick="location.href='/pages/interpreter.html'">

<h2>SideToSide</h2>

<p>İki telefonda simultane çeviri</p>

</div>



<div class="card all" onclick="location.href='/pages/meeting.html'">

<h2>AllToAll</h2>

<p>Toplantı odası çeviri</p>

</div>

</div>



</div>



</div>



</body>
</html>
