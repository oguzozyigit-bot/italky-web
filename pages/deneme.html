<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Meeting</title>
  <meta name="theme-color" content="#081225"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#081225;
      --bg2:#0b1a33;
      --panel:#0d1830;
      --panel2:#10203d;
      --text:#f7fbff;
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.08);
      --line2:rgba(120,190,255,.18);
      --blue:#4da3ff;
      --blue2:#78beff;
      --cyan:#68e1ff;
      --navy:#13274d;
      --navy2:#0e2141;
      --green:#34d399;
      --red:#ef4444;
      --glass:rgba(255,255,255,.045);

      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);

      --header-h:68px;
      --footer-h:44px;
      --composer-h:92px;
      --keyboard-offset:0px;
      --app-height:100dvh;
      --participants-w:min(82vw, 330px);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(77,163,255,.14), transparent 26%),
        radial-gradient(circle at 80% 18%, rgba(104,225,255,.10), transparent 22%),
        linear-gradient(180deg,#06101f 0%, #081225 55%, #09111f 100%);
    }

    #pageContent{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:var(--app-height);
      margin:0 auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 16% 0%, rgba(77,163,255,.12), transparent 22%),
        radial-gradient(circle at 88% 14%, rgba(104,225,255,.08), transparent 18%),
        linear-gradient(180deg,#071222 0%, #0a1730 48%, #081225 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(2px + var(--safe-top)) 14px 6px;
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:10px;
      z-index:60;
      background:linear-gradient(180deg, rgba(8,18,37,.96), rgba(8,18,37,.80));
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(14px);
    }

    .icon-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg,
    .edge-tab svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:1px;
      text-align:center;
      cursor:pointer;
      user-select:none;
    }

    .brand-title{
      margin:0;
      font-family:"Space Grotesk", Outfit, sans-serif;
      font-size:22px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.5px;
      color:#fff;
    }

    .brand-title .ai{
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 45%, #c3edff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin:0;
      font-size:8px;
      font-weight:900;
      letter-spacing:2.4px;
      color:rgba(255,255,255,.28);
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
    }

    .meeting-top{
      position:absolute;
      left:0;
      right:0;
      top:0;
      z-index:10;
      padding:10px 12px 8px;
      background:linear-gradient(180deg, rgba(8,18,37,.86), rgba(8,18,37,.24));
      backdrop-filter:blur(10px);
    }

    .meeting-summary{
      border:1px solid var(--line2);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius:20px;
      padding:12px 14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .meeting-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .meeting-title{
      font-size:16px;
      font-weight:1000;
      color:#fff;
      line-height:1.15;
    }

    .meeting-sub{
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      line-height:1.35;
    }

    .meeting-badge{
      min-width:72px;
      height:30px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid rgba(104,225,255,.20);
      background:rgba(104,225,255,.10);
      color:#d8f7ff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:1000;
      white-space:nowrap;
    }

    .avatar-strip{
      display:flex;
      gap:8px;
      overflow-x:auto;
      scrollbar-width:none;
      margin-top:10px;
      padding-bottom:2px;
    }

    .avatar-strip::-webkit-scrollbar{ display:none; }

    .mini-user{
      min-width:44px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      flex:0 0 auto;
    }

    .mini-avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      background:linear-gradient(135deg,#17386b,#2d6dc1);
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:1000;
      color:#fff;
      position:relative;
      overflow:hidden;
    }

    .mini-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .mini-avatar.speaking{
      box-shadow:0 0 0 2px rgba(104,225,255,.22), 0 0 18px rgba(104,225,255,.34);
    }

    .mini-avatar.active::after{
      content:"";
      position:absolute;
      right:2px;
      bottom:2px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
      border:1px solid #081225;
    }

    .mini-name{
      max-width:56px;
      font-size:9px;
      color:rgba(255,255,255,.76);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }

    .chat-scroll{
      position:absolute;
      inset:104px 0 0 0;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:8px 14px calc(var(--composer-h) + 30px + var(--keyboard-offset));
      display:flex;
      flex-direction:column;
      gap:10px;
      scroll-behavior:smooth;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.left{ justify-content:flex-start; }
    .msg.right{ justify-content:flex-end; }
    .msg.center{ justify-content:center; }

    .bubble-wrap{ max-width:86%; }

    .bubble{
      background:#0c1830;
      border:1px solid rgba(255,255,255,.08);
      padding:16px 16px;
      border-radius:24px;
      font-size:14px;
      line-height:1.45;
      font-weight:800;
      word-break:break-word;
      box-shadow:0 8px 22px rgba(0,0,0,.18);
      white-space:pre-wrap;
    }

    .bubble.left{
      border-left:4px solid var(--blue2);
      background:linear-gradient(180deg,#102343,#0d1d39);
    }

    .bubble.right{
      border-right:4px solid var(--cyan);
      background:linear-gradient(180deg,#143255,#102947);
    }

    .bubble.system{
      text-align:center;
      border:1px solid rgba(104,225,255,.16);
      background:rgba(104,225,255,.08);
      color:#d8f7ff;
      font-size:12px;
      padding:12px 14px;
    }

    .msg-meta{
      margin-top:7px;
      font-size:11px;
      font-weight:700;
      color:var(--muted);
    }

    .typing{
      display:none;
      position:absolute;
      left:14px;
      right:14px;
      bottom:calc(var(--composer-h) + 12px + var(--keyboard-offset));
      font-size:12px;
      color:rgba(255,255,255,.72);
      font-weight:800;
      z-index:12;
    }

    .typing.show{ display:block; }

    .composer-wrap{
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:20;
      transform:translateY(calc(-1 * var(--keyboard-offset)));
      transition:transform .12s ease;
    }

    .composer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:72px;
      padding:10px 12px;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
      position:relative;
    }

    .composer.listening{
      box-shadow:
        0 0 0 1px rgba(104,225,255,.30),
        0 0 0 8px rgba(104,225,255,.08),
        0 0 30px rgba(104,225,255,.18),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation:composerPulse 1.2s ease-in-out infinite;
    }

    @keyframes composerPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.006); }
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:140px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:16px;
      font-weight:800;
      line-height:1.45;
      font-family:inherit;
      overflow:auto;
    }

    .composer-input::placeholder{
      color:rgba(255,255,255,.70);
      font-weight:800;
    }

    .send-btn,.mic-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .send-btn{
      background:#fff;
      color:#06101f;
      box-shadow:0 0 24px rgba(255,255,255,.10);
    }

    .mic-btn{
      background:transparent;
      color:#fff;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      border:2px solid rgba(104,225,255,.72);
      box-shadow:0 0 0 8px rgba(104,225,255,.10), 0 0 24px rgba(104,225,255,.18);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.14; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .hidden{ display:none !important; }

    .footer{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:10px 12px calc(10px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(8,18,37,.88);
      backdrop-filter:blur(12px);
      z-index:30;
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      flex-wrap:wrap;
      font-size:12px;
      font-weight:900;
      text-align:center;
    }

    .seal-main{
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 55%, #d9f5ff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .seal-dot{ color:rgba(255,255,255,.25); }
    .seal-year{ color:#bfe7ff; }

    .participants-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:140;
    }

    .participants-layer.open{
      pointer-events:auto;
    }

    .participants-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(4px);
      opacity:0;
      transition:opacity .24s ease;
    }

    .participants-layer.open .participants-backdrop{
      opacity:1;
    }

    .participants-panel{
      position:absolute;
      top:0;
      right:0;
      bottom:0;
      width:var(--participants-w);
      transform:translateX(104%);
      transition:transform .26s ease;
      background:linear-gradient(180deg, rgba(10,20,38,.98), rgba(7,15,29,.98));
      border-left:1px solid rgba(255,255,255,.08);
      box-shadow:-16px 0 34px rgba(0,0,0,.32);
      padding:calc(14px + var(--safe-top)) 12px calc(14px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:hidden;
    }

    .participants-layer.open .participants-panel{
      transform:translateX(0);
    }

    .edge-tab{
      position:absolute;
      top:124px;
      right:8px;
      width:42px;
      height:96px;
      border:none;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(77,163,255,.24), rgba(104,225,255,.16));
      border:1px solid rgba(120,190,255,.24);
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      cursor:pointer;
      z-index:145;
      box-shadow:0 12px 24px rgba(0,0,0,.22);
    }

    .edge-tab-count{
      font-size:10px;
      font-weight:1000;
      color:#d8f7ff;
      line-height:1;
    }

    .participants-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .participants-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
      line-height:1;
      color:#fff;
    }

    .participants-sub{
      margin-top:4px;
      font-size:11px;
      color:rgba(255,255,255,.60);
      font-weight:800;
      line-height:1.35;
    }

    .participants-close{
      width:40px;
      height:40px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .participants-close svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .me-box,
    .join-box{
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      padding:14px;
    }

    .mini-label{
      font-size:10px;
      color:rgba(255,255,255,.50);
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.9px;
      margin-bottom:6px;
    }

    .my-id-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .my-id-pill{
      flex:1;
      min-width:0;
      min-height:42px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      padding:0 12px;
      font-size:13px;
      font-weight:900;
      color:#fff;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .copy-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      flex:0 0 auto;
    }

    .copy-btn svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .join-input{
      width:100%;
      min-height:48px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      padding:0 14px;
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
    }

    .join-input::placeholder{
      color:rgba(255,255,255,.44);
    }

    .join-btn{
      width:100%;
      min-height:48px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 100%);
      color:#04111f;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
    }

    .participants-list{
      flex:1;
      min-height:0;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      scrollbar-width:none;
    }

    .participants-list::-webkit-scrollbar{ display:none; }

    .participant-row{
      display:flex;
      align-items:center;
      gap:10px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.07);
      padding:10px;
    }

    .participant-row.speaking{
      border-color:rgba(104,225,255,.26);
      box-shadow:0 0 0 1px rgba(104,225,255,.08), 0 0 18px rgba(104,225,255,.10);
    }

    .participant-avatar{
      width:46px;
      height:46px;
      border-radius:16px;
      flex:0 0 auto;
      background:linear-gradient(135deg,#17386b,#2d6dc1);
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:1000;
      color:#fff;
      position:relative;
      overflow:hidden;
    }

    .participant-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .participant-avatar::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:3px;
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--green);
      border:1px solid #081225;
    }

    .participant-meta{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .participant-name{
      font-size:14px;
      font-weight:1000;
      color:#fff;
      line-height:1.1;
      word-break:break-word;
    }

    .participant-id{
      font-size:11px;
      color:rgba(255,255,255,.58);
      font-weight:800;
      line-height:1.2;
    }

    .participant-role{
      font-size:10px;
      color:#cbeeff;
      font-weight:900;
      line-height:1.1;
      text-transform:uppercase;
      letter-spacing:.6px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(64px + var(--safe-bottom));
      transform:translateX(-50%) translateY(120px);
      background:rgba(10,14,24,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      padding:12px 16px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      z-index:9999;
      transition:.25s ease;
      box-shadow:0 18px 36px rgba(0,0,0,.30);
      text-align:center;
      max-width:min(92vw, 560px);
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @media (max-width:390px){
      .chat-scroll{ inset:108px 0 0 0; }
      .meeting-title{ font-size:15px; }
      .bubble{ font-size:13.5px; }
      .participants-panel{ width:min(86vw, 312px); }
    }
  </style>
</head>
<body>

<div class="participants-layer" id="participantsLayer">
  <div class="participants-backdrop" id="participantsBackdrop"></div>

  <button class="edge-tab" id="participantsTab" type="button" aria-label="Katılımcılar">
    <svg viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
      <circle cx="9.5" cy="7" r="3"></circle>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a3 3 0 0 1 0 5.75"></path>
    </svg>
    <div class="edge-tab-count" id="participantsCountMini">0</div>
  </button>

  <aside class="participants-panel">
    <div class="participants-head">
      <div>
        <div class="participants-title">Katılımcılar</div>
        <div class="participants-sub" id="participantsSub">Toplantı odası katılımcıları burada görünür.</div>

</div>

<main id="pageContent">

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from "/js/supabase_client.js";

  const $ = (id) => document.getElementById(id);

  const UI = {
    chatMessages: $("chatMessages"),
    chatInput: $("chatInput"),
    sendBtn: $("sendBtn"),
    micBtn: $("micBtn"),
    typingState: $("typingState"),
    chatComposer: $("chatComposer"),

    menuBtn: $("menuBtn"),
    brandHome: $("brandHome"),
    topSettingsBtn: $("topSettingsBtn"),

    participantsLayer: $("participantsLayer"),
    participantsBackdrop: $("participantsBackdrop"),
    participantsTab: $("participantsTab"),
    participantsClose: $("participantsClose"),
    participantsCountMini: $("participantsCountMini"),
    participantsList: $("participantsList"),
    participantsSub: $("participantsSub"),
    avatarStrip: $("avatarStrip"),
    meetingBadge: $("meetingBadge"),
    myUserId: $("myUserId"),
    copyMyIdBtn: $("copyMyIdBtn"),
    joinUserIdInput: $("joinUserIdInput"),
    joinUserBtn: $("joinUserBtn"),

    toast: $("toast")
  };

  const state = {
    currentUser: null,
    currentProfile: null,
    recognition: null,
    isListening: false,
    meetingId: "MEET-001",
    participants: [],
    messages: []
  };

  function toast(message = "") {
    if (!UI.toast) return;
    UI.toast.textContent = String(message || "");
    UI.toast.classList.add("show");
    clearTimeout(window.__meetingToastTimer);
    window.__meetingToastTimer = setTimeout(() => {
      UI.toast.classList.remove("show");
    }, 2200);
  }

  function autoResizeTextarea() {
    UI.chatInput.style.height = "auto";
    UI.chatInput.style.height = `${Math.min(UI.chatInput.scrollHeight, 140)}px`;
  }

  function syncInputActionState() {
    const hasText = String(UI.chatInput.value || "").trim().length > 0;
    UI.micBtn.classList.toggle("hidden", hasText && !state.isListening);
    UI.sendBtn.classList.toggle("hidden", !hasText);
  }

  function setListeningUi(isListening) {
    state.isListening = !!isListening;
    UI.chatComposer?.classList.toggle("listening", !!isListening);
    UI.micBtn?.classList.toggle("listening", !!isListening);
    syncInputActionState();
  }

  function scrollChatToBottom() {
    requestAnimationFrame(() => {
      UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight + 500;
    });
  }

  function updateViewportLayout() {
    const vv = window.visualViewport;
    if (!vv) return;

    document.documentElement.style.setProperty("--app-height", `${vv.height}px`);
    const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--keyboard-offset", `${keyboardHeight}px`);

    requestAnimationFrame(scrollChatToBottom);
  }

  function initialsFromName(name = "") {
    const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    return (parts[0]?.[0] || "U") + (parts[1]?.[0] || "");
  }

  function openParticipantsPanel() {
    UI.participantsLayer.classList.add("open");
  }

  function closeParticipantsPanel() {
    UI.participantsLayer.classList.remove("open");
  }

  function toggleParticipantsPanel() {
    UI.participantsLayer.classList.toggle("open");
  }

  function addMessage(side, text, meta = "") {
    const row = document.createElement("div");
    row.className = `msg ${side}`;

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = `bubble ${side}`;
    bubble.textContent = text;

    const metaEl = document.createElement("div");
    metaEl.className = "msg-meta";
    metaEl.textContent = meta || (side === "right" ? "Sen • şimdi" : "Meeting • şimdi");

    wrap.appendChild(bubble);
    wrap.appendChild(metaEl);
    row.appendChild(wrap);
    UI.chatMessages.appendChild(row);
    scrollChatToBottom();
  }

  function addSystemMessage(text) {
    const row = document.createElement("div");
    row.className = "msg center";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = "bubble system";
    bubble.textContent = text;

    wrap.appendChild(bubble);
    row.appendChild(wrap);
    UI.chatMessages.appendChild(row);
    scrollChatToBottom();
  }

  function renderParticipants() {
    const list = state.participants || [];
    UI.participantsList.innerHTML = "";
    UI.avatarStrip.innerHTML = "";

    UI.participantsCountMini.textContent = String(list.length);
    UI.meetingBadge.textContent = `${list.length} Kişi`;
    UI.participantsSub.textContent = `${list.length} katılımcı bu meeting odasında görünür.`;

    list.forEach((p) => {
      const row = document.createElement("div");
      row.className = `participant-row ${p.speaking ? "speaking" : ""}`;
      row.innerHTML = `
        <div class="participant-avatar">
          ${p.avatar ? `<img src="${p.avatar}" alt="${p.name}">` : `<span>${initialsFromName(p.name)}</span>`}
        </div>
        <div class="participant-meta">
          <div class="participant-name">${p.name}</div>
          <div class="participant-id">ID: ${p.id}</div>
          <div class="participant-role">${p.role || "Katılımcı"}</div>
        </div>
      `;
      UI.participantsList.appendChild(row);

      const mini = document.createElement("div");
      mini.className = "mini-user";
      mini.innerHTML = `
        <div class="mini-avatar ${p.active ? "active" : ""} ${p.speaking ? "speaking" : ""}">
          ${p.avatar ? `<img src="${p.avatar}" alt="${p.name}">` : `<span>${initialsFromName(p.name)}</span>`}
        </div>
        <div class="mini-name">${p.name.split(" ")[0]}</div>
      `;
      UI.avatarStrip.appendChild(mini);
    });
  }

  async function hydrateUser() {
    try {
      const { data } = await supabase.auth.getUser();
      const user = data?.user || null;
      state.currentUser = user;

      if (!user) {
        UI.myUserId.textContent = "Giriş gerekli";
        return;
      }

      const { data: profile } = await supabase
        .from("profiles")
        .select("id,full_name,avatar_url,email")
        .eq("id", user.id)
        .maybeSingle();

      state.currentProfile = profile || null;

      const myName =
        profile?.full_name ||
        user?.user_metadata?.full_name ||
        user?.user_metadata?.name ||
        user?.email?.split("@")[0] ||
        "Katılımcı";

      const myAvatar =
        profile?.avatar_url ||
        user?.user_metadata?.avatar_url ||
        user?.user_metadata?.picture ||
        "";

      const myId = profile?.id || user?.id || "Bilinmiyor";
      UI.myUserId.textContent = myId;

      state.participants = [
        {
          id: myId,
          name: myName,
          avatar: myAvatar,
          role: "Sen",
          active: true,
          speaking: false
        },
        {
          id: "MEET-102",
          name: "Ayşe Demir",
          avatar: "",
          role: "Katılımcı",
          active: true,
          speaking: true
        },
        {
          id: "MEET-103",
          name: "John Carter",
          avatar: "",
          role: "Katılımcı",
          active: true,
          speaking: false
        },
        {
          id: "MEET-104",
          name: "Maria Lopez",
          avatar: "",
          role: "Katılımcı",
          active: true,
          speaking: false
        }
      ];

      renderParticipants();

      if (!UI.chatMessages.querySelector(".msg")) {
        addSystemMessage("Meeting odası hazır. Sağdaki panelden katılımcıları görebilir, ID ile yeni kişi ekleyebilirsin.");
        addMessage("left", "Toplantı sohbet akışı burada görünecek. Katılımcılar sağ panelden açılır.", "Meeting • şimdi");
      }
    } catch (e) {
      console.error("meeting hydrate hata:", e);
      UI.myUserId.textContent = "Yüklenemedi";
    }
  }

  function collectExistingIds() {
    return new Set((state.participants || []).map((p) => String(p.id || "").trim()));
  }

  function addParticipantById(rawId) {
    const id = String(rawId || "").trim();
    if (!id) {
      toast("Önce kullanıcı ID gir.");
      return;
    }

    const ids = collectExistingIds();
    if (ids.has(id)) {
      toast("Bu kullanıcı zaten listede.");
      return;
    }

    const fakeName = `Kullanıcı ${String(state.participants.length + 1).padStart(2, "0")}`;
    state.participants.push({
      id,
      name: fakeName,
      avatar: "",
      role: "Yeni Katılan",
      active: true,
      speaking: false
    });

    renderParticipants();
    addSystemMessage(`${fakeName} meeting odasına eklendi.`);
    UI.joinUserIdInput.value = "";
    toast("Katılımcı eklendi");
  }

  function cleanupTranscript(text = "") {
    return String(text || "")
      .replace(/\s+/g, " ")
      .replace(/\b(\S+)( \1\b)+/gi, "$1")
      .trim();
  }

  function buildStableTranscript(results) {
    const pieces = [];

    for (let i = 0; i < results.length; i++) {
      const chunk = String(results[i]?.[0]?.transcript || "")
        .replace(/\s+/g, " ")
        .trim();

      if (!chunk) continue;

      const prev = pieces[pieces.length - 1] || "";
      if (prev === chunk) continue;
      if (prev && chunk.startsWith(prev)) {
        pieces[pieces.length - 1] = chunk;
        continue;
      }
      if (prev && prev.startsWith(chunk)) continue;

      pieces.push(chunk);
    }

    return cleanupTranscript(pieces.join(" "));
  }

  function stopRecognition() {
    try { state.recognition?.stop(); } catch {}
    state.recognition = null;
    setListeningUi(false);
  }

  function startRecognitionOnce() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      toast("Bu cihazda sesli giriş desteklenmiyor");
      return;
    }

    if (state.isListening) {
      stopRecognition();
      return;
    }

    stopRecognition();

    const recognition = new Recognition();
    recognition.lang = "tr-TR";
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 1;

    state.recognition = recognition;
    let lastTranscript = "";
    setListeningUi(true);

    recognition.onresult = (event) => {
      const transcript = buildStableTranscript(event.results);
      lastTranscript = transcript;

      if (transcript) {
        UI.chatInput.value = transcript;
        autoResizeTextarea();
        syncInputActionState();
        scrollChatToBottom();
      }
    };

    recognition.onerror = () => {
      stopRecognition();
    };

    recognition.onend = async () => {
      const finalText = cleanupTranscript(UI.chatInput.value || lastTranscript || "");
      stopRecognition();

      if (finalText) {
        UI.chatInput.value = "";
        autoResizeTextarea();
        syncInputActionState();
        sendMeetingMessage(finalText, "voice");
      }
    };

    try {
      recognition.start();
    } catch {
      stopRecognition();
    }
  }

  function sendMeetingMessage(text, mode = "text") {
    const value = String(text || "").trim();
    if (!value) return;

    addMessage("right", value, mode === "voice" ? "Sen • sesli" : "Sen • şimdi");
    UI.typingState.classList.add("show");

    setTimeout(() => {
      UI.typingState.classList.remove("show");
      const activeSpeaker = state.participants.find((p) => p.id !== UI.myUserId.textContent);
      const replyName = activeSpeaker?.name || "Katılımcı";
      addMessage("left", `${replyName}: Mesaj alındı. Meeting akışı üzerinden cevap veriyorum.`, `${replyName} • şimdi`);
      scrollChatToBottom();
    }, 800);
  }

  function bindEvents() {
    UI.chatInput.addEventListener("input", () => {
      autoResizeTextarea();
      syncInputActionState();
    });

    UI.chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const value = UI.chatInput.value;
        UI.chatInput.value = "";
        autoResizeTextarea();
        syncInputActionState();
        sendMeetingMessage(value, "text");
      }
    });

    UI.sendBtn.addEventListener("click", () => {
      const value = UI.chatInput.value;
      UI.chatInput.value = "";
      autoResizeTextarea();
      syncInputActionState();
      sendMeetingMessage(value, "text");
    });

    UI.micBtn.addEventListener("click", startRecognitionOnce);

    UI.menuBtn.addEventListener("click", () => {
      location.href = "/pages/home.html";
    });

    UI.brandHome.addEventListener("click", () => {
      location.href = "/pages/home.html";
    });

    UI.topSettingsBtn.addEventListener("click", () => {
      toast("Meeting ayarları daha sonra açılacak");
    });

    UI.participantsTab.addEventListener("click", toggleParticipantsPanel);
    UI.participantsClose.addEventListener("click", closeParticipantsPanel);
    UI.participantsBackdrop.addEventListener("click", closeParticipantsPanel);

    UI.copyMyIdBtn.addEventListener("click", async () => {
      const id = UI.myUserId.textContent || "";
      try {
        await navigator.clipboard.writeText(id);
        toast("Kullanıcı ID kopyalandı");
      } catch {
        toast("ID kopyalanamadı");
      }
    });

    UI.joinUserBtn.addEventListener("click", () => {
      addParticipantById(UI.joinUserIdInput.value);
    });

    UI.joinUserIdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addParticipantById(UI.joinUserIdInput.value);
      }
    });

    window.visualViewport?.addEventListener("resize", updateViewportLayout);
    window.visualViewport?.addEventListener("scroll", updateViewportLayout);
    window.addEventListener("resize", updateViewportLayout);
  }

  async function init() {
    bindEvents();
    autoResizeTextarea();
    syncInputActionState();
    await hydrateUser();
    updateViewportLayout();
    scrollChatToBottom();
  }

 <script type="module" src="/js/meeting_page.js"></script>
</body>
