<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Next-Gen Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
    :root {
        --ai-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        --glass: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --bg: #03030a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { 
        margin: 0; padding: 0; background: var(--bg); 
        font-family: 'Outfit', sans-serif; color: white; overflow: hidden; height: 100%;
    }

    #pageContent {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #03030a 100%);
        padding: 20px;
    }

    /* 🧠 MERKEZİ ORB (FaceToFace) */
    .f2f-section {
        flex: 0 0 40%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .orb-wrapper {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .orb-glow {
        position: absolute;
        inset: -20px;
        background: var(--ai-grad);
        filter: blur(40px);
        opacity: 0.2;
        animation: pulseGlow 4s infinite alternate;
    }

    .outer-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid var(--border);
        border-radius: 50%;
        border-top-color: #6366f1;
        animation: rotate 10s linear infinite;
    }

    .inner-core {
        width: 110px;
        height: 110px;
        background: rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.3);
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .inner-core:active { transform: scale(0.9); }

    .f2f-label {
        margin-top: 20px;
        font-family: 'Space Grotesk';
        font-size: 28px;
        letter-spacing: -1px;
        text-align: center;
    }

    .f2f-label span {
        background: var(--ai-grad);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* 🎴 MODERN KARTLAR (Grid Sistemi) */
    .hub-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
        padding-bottom: 20px;
    }

    .feature-card {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
    }

    .feature-card:active {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.3);
    }

    .card-icon {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 32px;
        height: 32px;
        opacity: 0.8;
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        color: rgba(255,255,255,0.9);
    }

    .card-sub {
        font-size: 10px;
        color: rgba(255,255,255,0.4);
        margin-top: 4px;
    }

    /* ÖZEL KART IŞIKLARI */
    .c-blue { border-bottom: 3px solid #60a5fa; }
    .c-green { border-bottom: 3px solid #34d399; }
    .c-amber { border-bottom: 3px solid #f59e0b; }
    .c-purple { border-bottom: 3px solid #a855f7; }

    /* ANİMASYONLAR */
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0% { opacity: 0.1; transform: scale(0.9); } 100% { opacity: 0.3; transform: scale(1.1); } }

</style>
</head>
<body>

<main id="pageContent">
    <section class="f2f-section" onclick="location.href='/facetoface.html'">
        <div class="orb-wrapper">
            <div class="orb-glow"></div>
            <div class="outer-ring"></div>
            <div class="inner-core">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 11v1a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                </svg>
            </div>
        </div>
        <h1 class="f2f-label">FaceToFace <span>AI</span></h1>
    </section>

    <div class="hub-grid">
        <div class="feature-card c-blue" onclick="location.href='/pages/text_translate.html'">
            <svg class="card-icon" fill="none" stroke="#60a5fa" viewBox="0 0 24 24" stroke-width="2">
                <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 0 1 6.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5c1.382 3.307 3.416 6.315 5.952 8.5"/>
            </svg>
            <h2 class="card-title">Metin Çeviri</h2>
            <span class="card-sub">Kuantum Hızı</span>
        </div>

        <div class="feature-card c-green" onclick="location.href='/pages/f2f_connect.html'">
            <svg class="card-icon" fill="none" stroke="#34d399" viewBox="0 0 24 24" stroke-width="2">
                <path d="M19 11a7 7 0 0 1-7 7m0 0a7 7 0 0 1-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 0 1-3-3V5a3 3 0 1 1 6 0v6a3 3 0 0 1-3 3z"/>
            </svg>
            <h2 class="card-title">Walkie-Talkie</h2>
            <span class="card-sub">Anlık Sesli</span>
        </div>

        <div class="feature-card c-amber" onclick="location.href='/pages/interpreter.html'">
            <svg class="card-icon" fill="none" stroke="#f59e0b" viewBox="0 0 24 24" stroke-width="2">
                <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <h2 class="card-title">Interpreter</h2>
            <span class="card-sub">Kulaklık Modu</span>
        </div>

        <div class="feature-card c-purple" onclick="location.href='/pages/offline_languages.html'">
            <svg class="card-icon" fill="none" stroke="#a855f7" viewBox="0 0 24 24" stroke-width="2">
                <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/>
            </svg>
            <h2 class="card-title">Offline</h2>
            <span class="card-sub">Tam Gizlilik</span>
        </div>
    </div>
</main>

<script type="module">
    import { mountShell } from "/js/ui_shell.js";
    mountShell({ scroll:"none" });
</script>
</body>
</html>
