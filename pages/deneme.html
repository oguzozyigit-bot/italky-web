<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Translate</title>

<style>
  :root {
    --ai-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --blue-glow: rgba(96, 165, 250, 0.15);
    --pink-glow: rgba(236, 72, 153, 0.15);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=Plus+Jakarta+Sans:wght@700&display=swap');

  html, body { 
    background: #020205 !important; margin: 0; padding: 0; 
    height: 100vh; width: 100vw; overflow: hidden; 
    font-family: 'Outfit', sans-serif; color: white;
  }

  #pageContent {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    background: radial-gradient(circle at 50% 50%, #0a0a20 0%, #020205 100%);
    position: relative;
  }

  .main-wrap {
    flex: 1; display: flex; flex-direction: column;
    padding: 15px; gap: 12px;
  }

  /* --- Lang Hub: Floating Glass --- */
  .lang-hub {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 24px; padding: 10px 20px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .select-box {
    background: transparent; border: none; color: #fff;
    font-family: 'Plus Jakarta Sans'; font-size: 14px; font-weight: 700;
    cursor: pointer; appearance: none; text-align: center;
  }

  .swap-trigger {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ai-grad); border: none;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    transition: 0.3s;
  }
  .swap-trigger:active { transform: rotate(180deg) scale(0.9); }

  /* --- Quantum Gates --- */
  .quantum-gate { flex: 1; display: flex; flex-direction: column; gap: 10px; }

  .gate-panel {
    flex: 1; position: relative; border-radius: 32px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.02);
    display: flex; flex-direction: column; padding: 25px;
    transition: all 0.4s ease;
  }

  .panel-in { 
    background: linear-gradient(145deg, var(--blue-glow), transparent);
    box-shadow: inset 0 0 20px rgba(96, 165, 250, 0.05);
  }

  .panel-out { 
    background: linear-gradient(145deg, var(--pink-glow), transparent);
    border-color: rgba(236, 72, 153, 0.2);
    box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.05);
  }

  .panel-action {
    position: absolute; top: 20px; right: 20px;
    width: 44px; height: 44px; border-radius: 15px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 30; font-size: 20px;
  }

  textarea {
    flex: 1; background: transparent; border: none;
    color: #fff; font-size: 19px; font-weight: 300;
    line-height: 1.4; resize: none; width: 100%;
    outline: none; font-family: 'Outfit';
  }
  textarea::placeholder { color: rgba(255,255,255,0.2); }

  .output-area {
    flex: 1; color: #fff; font-size: 19px;
    font-weight: 600; line-height: 1.4; overflow-y: auto;
    white-space: pre-wrap; padding-right: 10px;
  }

  /* --- Floating Command Bar --- */
  .command-bar {
    height: 64px; margin: -32px auto; width: 90%;
    background: rgba(15,15,25,0.8);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border);
    border-radius: 32px; display: flex; align-items: center;
    padding: 0 10px; z-index: 100;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }

  .bar-btn {
    flex: 1; border: none; background: transparent;
    color: rgba(255,255,255,0.5); font-weight: 700; font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }

  .btn-3d {
    width: 60px; height: 60px; border-radius: 50%;
    border: none; background: var(--ai-grad);
    color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    cursor: pointer; transform: translateY(-5px);
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .btn-3d:active { transform: translateY(0px) scale(0.9); }

  .divider { width: 1px; background: rgba(255,255,255,0.1); height: 20px; }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="lang-hub">
      <select class="select-box" id="fromSel"></select>
      <button class="swap-trigger" id="btnSwap" type="button">⇄</button>
      <select class="select-box" id="toSel"></select>
    </section>

    <section class="quantum-gate">
      <div class="gate-panel panel-in">
        <button class="panel-action" id="btnMic" type="button">🎙️</button>
        <textarea id="srcTxt" placeholder="Çevirmek istediğin bir şeyler yaz..."></textarea>
      </div>

      <div class="command-bar">
        <label class="bar-btn">
          <input type="file" id="imgFile" accept="image/*" capture="environment" style="display:none">
          <span style="font-size: 18px;">📷</span>
          <span>TARAT</span>
        </label>

        <button class="btn-3d" id="btnTranslate">⚡</button>

        <button class="bar-btn" onclick="document.getElementById('srcTxt').value=''">
          <span style="font-size: 18px;">🗑️</span>
          <span>TEMİZLE</span>
        </button>
      </div>

      <div class="gate-panel panel-out">
        <button class="panel-action" id="btnSpeak" type="button">🔊</button>
        <div class="output-area" id="dstTxt">...</div>
      </div>
    </section>

  </div>
</main>

<script type="module">
  // [Mevcut API mantığın ve JS kodun burada devam edecek - Hiçbirini bozma]
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
  
  // Önceki kodundaki tüm const, async function ve event listener'ları buraya ekle.
  // Sadece buton ID'leri aynı kalsın (btnTranslate, srcTxt, vb.)
</script>
</body>
</html>
