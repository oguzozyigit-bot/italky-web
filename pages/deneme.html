<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Walkie Talkie</title>

  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --blue: #60a5fa;
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    /* ✅ Kural Seti */
    #pageContent {
      height: 100%;
      display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }

    .main-hub {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 12px;
      gap: 12px;
      min-height: 0;
    }

    /* ===== 1. SIGNAL FINDER (TOP PORTAL) ===== */
    .signal-portal {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 0;
    }

    .neural-orb {
      width: 100px; height: 100px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    .ai-ring {
      position: absolute; inset: -3px; border-radius: 50%; padding: 2px;
      background: var(--ai-grad);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      animation: rotateOrb 15s linear infinite;
    }

    .ai-core {
      width: 75px; height: 75px; background: #000; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      box-shadow: 0 0 30px rgba(99,102,241,0.3);
      animation: breathe 4s infinite ease-in-out;
    }

    .portal-info { text-align: center; margin-top: 10px; }
    .portal-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; color: #fff; margin: 0; letter-spacing: -1px; }
    .portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ===== 2. ACTION CARDS (EKRANI DOLDURAN) ===== */
    .hub-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    .cyber-card {
      flex: 1; position: relative; border-radius: 28px; border: 1px solid var(--glass-border);
      overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 20px;
      background: var(--glass); backdrop-filter: blur(25px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cyber-card:active { transform: scale(0.98); filter: brightness(1.2); }

    .host-card { background: linear-gradient(145deg, rgba(99, 102, 241, 0.1) 0%, rgba(0,0,0,0.6) 100%); }
    .join-card { background: linear-gradient(145deg, rgba(236, 72, 153, 0.1) 0%, rgba(0,0,0,0.6) 100%); }

    /* Icons & Anims */
    .icon-box { width: 60px; height: 60px; position: relative; flex-shrink: 0; margin-right: 18px; display: flex; align-items: center; justify-content: center; }
    .pulse-ring { position: absolute; inset: 0; border: 2px solid var(--blue); border-radius: 50%; animation: ripple 2s infinite; }
    
    .card-content { flex: 1; z-index: 10; }
    .card-title { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; color: #fff; margin: 0; }
    .card-desc { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 5px; line-height: 1.4; }

    /* Panels (Host/Join) */
    .panel-view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .qr-zone { flex: 1; background: rgba(0,0,0,0.3); border-radius: 24px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .qr-img { width: 180px; height: 180px; border-radius: 16px; border: 1px solid #fff; background: #fff; padding: 8px; }
    .room-code { font-family: 'Space Grotesk'; font-size: 32px; font-weight: 900; letter-spacing: 5px; color: #fff; margin: 15px 0; text-shadow: 0 0 15px rgba(99,102,241,0.6); }

    /* Input & Buttons */
    .input-field { width: 100%; height: 54px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 18px; color: #fff; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 4px; }
    .btn-3d { height: 54px; border-radius: 18px; border: none; background: var(--ai-grad); color: #fff; font-weight: 900; box-shadow: 0 4px 15px rgba(99,102,241,0.4); cursor: pointer; width: 100%; }
    .btn-3d:active { transform: translateY(2px); }
    .btn-back { background: transparent; color: var(--muted); font-size: 12px; font-weight: 900; border: none; padding: 10px; cursor: pointer; text-decoration: underline; }

    .hide { display: none !important; }

    /* Animations */
    @keyframes rotateOrb { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes ripple { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="signal-portal">
      <div class="neural-orb">
        <div class="ai-ring"></div>
        <div class="ai-core">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </div>
      </div>
      <div class="portal-info">
        <h1 class="portal-title">Walkie<span>Talkie</span></h1>
      </div>
    </div>

    <div class="hub-cards" id="homeCards">
      <div class="cyber-card host-card" id="goHost">
        <div class="icon-box">
          <div class="pulse-ring"></div>
          <span style="font-size: 30px; z-index: 2;">📡</span>
        </div>
        <div class="card-content">
          <h2 class="card-title">Sohbeti Başlat</h2>
          <p class="card-desc">Kendi odanı kur, kodunu paylaş ve dünyayı dinle.</p>
        </div>
      </div>

      <div class="cyber-card join-card" id="goGuest">
        <div class="icon-box">
          <div class="pulse-ring" style="border-color: #ec4899;"></div>
          <span style="font-size: 30px; z-index: 2;">🔑</span>
        </div>
        <div class="card-content">
          <h2 class="card-title">Sohbete Bağlan</h2>
          <p class="card-desc">Davet kodunla veya QR okutarak anında frekansa gir.</p>
        </div>
      </div>
    </div>

    <div class="panel-view hide" id="hostPanel">
      <div class="qr-zone">
        <img class="qr-img" id="qrImg" alt="QR Code" />
        <div class="room-code" id="roomCode">------</div>
        <p class="card-desc" style="text-align:center">Bu kodu paylaş veya QR okut.</p>
      </div>
      <button class="btn-3d" id="btnGoCall">DEVAM ET</button>
      <button class="btn-back" id="btnBackHost">ANA MENÜYE DÖN</button>
    </div>

    <div class="panel-view hide" id="joinPanel">
      <div class="qr-zone" style="flex: 0 0 auto; padding: 40px 20px;">
        <input class="input-field" id="roomInput" placeholder="KODU YAZ" maxlength="8" />
        <p class="card-desc" style="margin-top:15px">Veya QR kodunu kamerana göster.</p>
      </div>
      <button class="btn-3d" id="btnJoin">BAĞLAN</button>
      <button class="btn-3d" style="background: rgba(255,255,255,0.1); margin-top: -5px;" id="btnScan">QR OKUT</button>
      <button class="btn-back" id="btnBackJoin">ANA MENÜYE DÖN</button>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);
  const setMode = (m) => {
    $("hostPanel").classList.toggle("hide", m!=="host");
    $("joinPanel").classList.toggle("hide", m!=="join");
    $("homeCards").classList.toggle("hide", m!=="home");
  };

  $("goHost").onclick = () => setMode("host");
  $("goGuest").onclick = () => setMode("join");
  $("btnBackHost").onclick = () => setMode("home");
  $("btnBackJoin").onclick = () => setMode("home");
</script>

<script type="module" src="/js/f2f_connect.js?v=WT_CONNECT_V4"></script>
</body>
</html>
