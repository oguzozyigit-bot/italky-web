<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • FaceToFace Public</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.08),transparent 24%),
        radial-gradient(circle at bottom,rgba(99,102,241,.08),transparent 24%),
        #050508;
    }

    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    .half-screen{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      overflow:hidden;
      padding:10px 8px;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg));
      padding-bottom:calc(10px + var(--safe-bottom));
    }

    .lang-row{
      width:100%;
      display:grid;
      grid-template-columns:76px 1fr 44px;
      gap:8px;
      align-items:center;
      z-index:20;
    }

    .mode-toggle{
      height:38px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-size:9px;
      font-weight:1000;
      cursor:pointer;
    }

    .mode-toggle.online{color:#8affb7}
    .mode-toggle.offline{color:#ff9c9c}

    .lang-trigger{
      height:38px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:#fff;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .menu-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.13);
      color:#fff;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:100;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
    }

    .pop-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:none}
    .pop-list::-webkit-scrollbar{display:none}

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item.active{
      background:rgba(99,102,241,.16);
      border-color:rgba(99,102,241,.28);
    }

    .pop-left{display:flex;align-items:center;gap:10px;min-width:0}
    .pop-flag{font-size:18px}
    .pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pop-code{font-size:12px;font-weight:900;opacity:.7}

    .chat-body{
      flex:1;
      width:100%;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:14px 0;
      text-align:center;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .chat-body::-webkit-scrollbar{display:none}

    .bubble{
      max-width:86%;
      line-height:1.18;
      word-break:break-word;
      font-size:22px;
      font-weight:800;
      opacity:.9;
    }

    .bubble.latest{
      font-size:30px;
      font-weight:1000;
      opacity:1;
    }

    .mic-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      flex:0 0 auto;
    }

    .mic-btn{
      width:86px;
      height:86px;
      border:none;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);
      position:relative;
    }

    .mic-btn svg{
      width:36px;
      height:36px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid rgba(34,197,94,.72);
      box-shadow:0 0 0 10px rgba(34,197,94,.10),0 0 28px rgba(34,197,94,.22);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micPulse{
      0%{transform:scale(.92);opacity:.95}
      70%{transform:scale(1.14);opacity:.14}
      100%{transform:scale(1.18);opacity:0}
    }

    .center-hub{
      height:82px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:50;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:absolute;
      padding:10px 16px;
      border-radius:999px;
      background:transparent;
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:1000;
      text-decoration:none;
      cursor:pointer;
    }

    .download-btn{left:12px}
    .clear-btn{right:12px}

    .orb{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      font-weight:900;
    }

    .orb .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .menu-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.50);
      backdrop-filter:blur(5px);
      z-index:900;
      display:none;
    }

    .menu-backdrop.show{display:block}

    .side-menu{
      position:fixed;
      top:0;
      right:-310px;
      width:min(82vw,310px);
      height:100%;
      background:linear-gradient(180deg,rgba(12,12,20,.98),rgba(7,7,13,.98));
      border-left:1px solid rgba(255,255,255,.10);
      z-index:901;
      padding:18px;
      transition:.25s ease;
      box-shadow:-20px 0 44px rgba(0,0,0,.38);
    }

    .side-menu.open{right:0}

    .menu-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:22px;
      font-weight:900;
      margin-bottom:16px;
    }

    .menu-link{
      display:block;
      width:100%;
      min-height:50px;
      padding:15px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);
      color:#fff;
      text-decoration:none;
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);
      min-height:44px;
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:9999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      pointer-events:none;
    }

    .toast.show{transform:translateX(-50%) translateY(0)}

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:20px;
    }

    .modal.show{display:flex}

    .modal-card{
      width:min(100%,420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{background:var(--ai-gradient);color:#05060d}
    .modal-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff}

    @media(max-width:390px){
      .lang-row{grid-template-columns:72px 1fr 42px}
      .mode-toggle{font-size:8px}
      .bubble{font-size:20px}
      .bubble.latest{font-size:28px}
      .mic-btn{width:80px;height:80px}
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topModeToggle" class="mode-toggle online" type="button">ONLINE</button>
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
        <button id="topMenuBtn" class="menu-btn" type="button" aria-label="Menü">☰</button>
      </div>

      <div class="popover" id="pop-top">
        <div class="pop-head">
          <div>ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody">
        <div class="bubble">Karşı taraf konuşsun</div>
      </div>

      <div class="mic-wrap">
        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
      </div>
    </section>

    <section class="center-hub">
      <a id="downloadBtn" class="nav-btn download-btn" href="/pages/offline_languages_public.html">DİL İNDİR</a>

      <div class="orb">italky<span class="ai">AI</span></div>

      <button id="clearBtn" class="nav-btn clear-btn" type="button">TEMİZLE</button>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botModeToggle" class="mode-toggle online" type="button">ONLINE</button>
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
        <button id="botMenuBtn" class="menu-btn" type="button" aria-label="Menü">☰</button>
      </div>

      <div class="popover" id="pop-bot">
        <div class="pop-head">
          <div>ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody">
        <div class="bubble">Konuşmak için mikrofona bas</div>
      </div>

      <div class="mic-wrap">
        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
      </div>
    </section>

  </main>

  <div id="menuBackdrop" class="menu-backdrop"></div>

  <nav id="sideMenu" class="side-menu">
    <div class="menu-title">italky<span class="ai">AI</span></div>
    <a class="menu-link" href="/pages/login.html">Giriş Yap</a>
    <a class="menu-link" href="/pages/about.html">Hakkımızda</a>
    <a class="menu-link" href="/pages/privacy.html">Gizlilik</a>
    <a class="menu-link" href="/pages/contact.html">İletişim</a>
  </nav>

  <div id="adModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title">Ücretsiz Kullanım</h3>
      <p class="modal-text">
        FaceToFace ücretsiz kullanımda reklam içerir. Reklamı izledikten sonra çeviriye devam edebilirsiniz.
      </p>
      <div class="modal-actions">
        <button id="watchAdBtn" class="modal-btn primary" type="button">Reklam İzle</button>
        <button id="closeAdBtn" class="modal-btn secondary" type="button">Şimdilik Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/facetoface_public.js?v=PUBLIC_F2F_V1"></script>
</body>
</html>
