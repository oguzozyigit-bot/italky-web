<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>italkyAI • Meeting</title>
  <meta name="theme-color" content="#07162f"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --bg:#07162f;
      --bg2:#0a2042;
      --panel:rgba(255,255,255,.05);
      --panel2:rgba(255,255,255,.04);
      --line:rgba(255,255,255,.08);
      --line2:rgba(120,190,255,.16);
      --txt:#f7fbff;
      --muted:rgba(255,255,255,.64);
      --muted2:rgba(255,255,255,.40);
      --blue:#74bfff;
      --blue2:#8fd7ff;
      --cyan:#73ebff;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --header-h:88px;
      --footer-h:54px;
      --composer-h:96px;
      --drawer-w:min(88vw, 360px);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      color:var(--txt);
      font-family:Outfit,Arial,sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(77,163,255,.18), transparent 25%),
        radial-gradient(circle at 85% 18%, rgba(104,225,255,.09), transparent 20%),
        linear-gradient(180deg,#061120 0%, #081932 55%, #07162d 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.12;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:100% 3px, 3px 100%;
      mix-blend-mode:soft-light;
    }

    #pageContent{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:100dvh;
      margin:0 auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 16% 0%, rgba(77,163,255,.12), transparent 22%),
        radial-gradient(circle at 88% 14%, rgba(104,225,255,.08), transparent 18%),
        linear-gradient(180deg,#07152a 0%, #0a1b38 52%, #07162f 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 22px 46px rgba(0,0,0,.28);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      z-index:40;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(10px + var(--safe-top)) 16px 10px;
      display:grid;
      grid-template-columns:56px 1fr 84px;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.07);
      background:linear-gradient(180deg, rgba(7,22,47,.96), rgba(7,22,47,.74));
      backdrop-filter:blur(18px);
    }

    .icon-btn{
      width:56px;
      height:56px;
      border:none;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg,
    .speaker-btn svg,
    .copy-btn svg,
    .close-btn svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      line-height:1;
      text-align:center;
      user-select:none;
    }

    .brand-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:26px;
      font-weight:800;
      color:#fff;
      letter-spacing:-.6px;
    }

    .brand-title .ai{
      background:linear-gradient(135deg, #91dfff 0%, #77a8ff 45%, #bf7dff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin-top:4px;
      font-size:10px;
      font-weight:900;
      letter-spacing:3px;
      color:rgba(255,255,255,.26);
    }

    .count-pill{
      height:60px;
      border-radius:22px;
      border:1px solid rgba(143,215,255,.20);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      line-height:1.05;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }

    .count-num{
      font-size:22px;
      font-weight:1000;
      color:#fff;
    }

    .count-label{
      margin-top:4px;
      font-size:11px;
      font-weight:900;
      color:#dff5ff;
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
    }

    .meeting-top{
      position:absolute;
      top:0;
      left:0;
      right:0;
      z-index:10;
      padding:14px 14px 10px;
      background:linear-gradient(180deg, rgba(7,22,47,.85), rgba(7,22,47,.10));
      backdrop-filter:blur(8px);
    }

    .meeting-card{
      border-radius:28px;
      border:1px solid var(--line2);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      padding:16px 16px 14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .meeting-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .meeting-title{
      font-size:18px;
      font-weight:1000;
      color:#fff;
    }

    .participants-strip{
      display:flex;
      gap:12px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      padding-bottom:2px;
    }

    .participants-strip::-webkit-scrollbar{
      display:none;
    }

    .participant-chip{
      min-width:58px;
      max-width:64px;
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .participant-avatar{
      width:50px;
      height:50px;
      border-radius:50%;
      overflow:hidden;
      background:linear-gradient(135deg,#2457a3,#4d8fff);
      border:2px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      font-weight:1000;
      color:#fff;
      position:relative;
      flex:0 0 auto;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
    }

    .participant-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .participant-avatar::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:3px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#31d18b;
      border:2px solid #0c1c38;
    }

    .participant-name{
      width:100%;
      font-size:11px;
      font-weight:900;
      color:#eef8ff;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chat-scroll{
      position:absolute;
      inset:126px 0 0 0;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      padding:12px 14px calc(var(--composer-h) + 22px);
      scroll-behavior:smooth;
    }

    .chat-scroll::-webkit-scrollbar{
      display:none;
    }

    .chat-feed{
      min-height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      gap:10px;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.mine{
      justify-content:flex-start;
    }

    .msg.other{
      justify-content:flex-end;
    }

    .msg.system{
      justify-content:center;
    }

    .msg-block{
      max-width:76%;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .msg-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .msg.mine .msg-row{
      justify-content:flex-start;
    }

    .msg.other .msg-row{
      justify-content:flex-end;
      flex-direction:row-reverse;
    }

    .msg.system .msg-row{
      justify-content:center;
    }

    .bubble{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:14px 14px 14px 16px;
      border-radius:26px;
      background:linear-gradient(180deg, rgba(11,27,55,.96), rgba(9,22,46,.96));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 8px 22px rgba(0,0,0,.16);
      min-height:54px;
      word-break:break-word;
    }

    .bubble::before{
      content:"";
      position:absolute;
      left:0;
      top:10px;
      bottom:10px;
      width:4px;
      border-radius:999px;
      background:var(--line-color, #86d4ff);
    }

    .msg.other .bubble::before{
      left:auto;
      right:0;
    }

    .bubble-text{
      font-size:15px;
      font-weight:900;
      line-height:1.45;
      color:#fff;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .speaker-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .msg-author{
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.72);
      padding:0 4px;
    }

    .system-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(104,225,255,.10);
      border:1px solid rgba(104,225,255,.18);
      color:#dff8ff;
      font-size:12px;
      font-weight:1000;
      text-align:center;
    }

    .composer-wrap{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      z-index:12;
    }

    .composer{
      min-height:76px;
      display:flex;
      align-items:flex-end;
      gap:10px;
      padding:12px 14px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      backdrop-filter:blur(14px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:120px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:900;
      line-height:1.4;
      font-family:inherit;
      overflow:auto;
      scrollbar-width:none;
    }

    .composer-input::-webkit-scrollbar{
      display:none;
    }

    .composer-input::placeholder{
      color:rgba(255,255,255,.70);
      font-weight:900;
    }

    .send-btn,.mic-btn{
      width:46px;
      height:46px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .mic-btn{
      background:transparent;
      color:#fff;
    }

    .send-btn{
      background:#fff;
      color:#06101f;
      box-shadow:0 0 24px rgba(255,255,255,.08);
    }

    .hidden{
      display:none !important;
    }

    .footer{
      position:absolute;
      inset:auto 0 0 0;
      z-index:20;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:12px 14px calc(12px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(7,22,47,.88);
      backdrop-filter:blur(14px);
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:12px;
      font-weight:1000;
      text-align:center;
      flex-wrap:wrap;
    }

    .seal-main{
      background:linear-gradient(135deg, #7fd8ff 0%, #82b8ff 45%, #d29bff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .seal-dot{ color:rgba(255,255,255,.28); }
    .seal-year{ color:#bde9ff; }

    .drawer-layer,
    .lang-layer{
      position:absolute;
      inset:0;
      z-index:120;
      pointer-events:none;
    }

    .drawer-layer.open,
    .lang-layer.open{
      pointer-events:auto;
    }

    .drawer-backdrop,
    .lang-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(4px);
      opacity:0;
      transition:opacity .24s ease;
    }

    .drawer-layer.open .drawer-backdrop,
    .lang-layer.open .lang-backdrop{
      opacity:1;
    }

    .drawer-panel{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:var(--drawer-w);
      transform:translateX(-105%);
      transition:transform .26s ease;
      background:linear-gradient(180deg, rgba(8,20,41,.98), rgba(7,17,34,.98));
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:18px 0 36px rgba(0,0,0,.28);
      padding:calc(16px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .drawer-panel::-webkit-scrollbar{
      display:none;
    }

    .drawer-layer.open .drawer-panel{
      transform:translateX(0);
    }

    .lang-panel{
      position:absolute;
      left:16px;
      right:16px;
      bottom:20px;
      max-height:70vh;
      overflow:hidden;
      transform:translateY(120%);
      transition:transform .26s ease;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(11,24,47,.98), rgba(8,20,40,.98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 18px 40px rgba(0,0,0,.28);
      display:flex;
      flex-direction:column;
    }

    .lang-layer.open .lang-panel{
      transform:translateY(0);
    }

    .drawer-head,
    .lang-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:4px 2px 2px;
    }

    .drawer-title,
    .lang-title{
      font-size:20px;
      font-weight:1000;
      color:#fff;
    }

    .close-btn{
      width:46px;
      height:46px;
      border:none;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
    }

    .card{
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      padding:14px;
    }

    .mini-label{
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.9px;
      color:rgba(255,255,255,.48);
      margin-bottom:10px;
    }

    .profile-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .drawer-avatar{
      width:60px;
      height:60px;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(135deg,#2b68c1,#62a3ff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:1000;
      color:#fff;
      flex:0 0 auto;
    }

    .drawer-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-name{
      font-size:15px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .profile-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:900;
      color:#dff4ff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .value-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .value-pill{
      min-height:48px;
      flex:1;
      border-radius:18px;
      padding:0 14px;
      display:flex;
      align-items:center;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      font-size:16px;
      font-weight:1000;
      color:#fff;
    }

    .copy-btn{
      width:48px;
      height:48px;
      border:none;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 auto;
    }

    .lang-trigger,
    .join-input,
    .primary-btn{
      width:100%;
      min-height:52px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      outline:none;
      font-family:inherit;
      font-size:16px;
      font-weight:900;
    }

    .lang-trigger{
      background:rgba(255,255,255,.04);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      cursor:pointer;
      gap:12px;
    }

    .lang-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .lang-flag{
      font-size:21px;
      line-height:1;
    }

    .lang-name{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .join-input{
      background:rgba(255,255,255,.04);
      color:#fff;
      padding:0 16px;
    }

    .join-input::placeholder{
      color:rgba(255,255,255,.42);
    }

    .primary-btn{
      border:none;
      background:linear-gradient(135deg,#8ad8ff 0%, #74dfff 100%);
      color:#07162f;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(116,223,255,.18);
    }

    .lang-list{
      padding:0 0 10px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .lang-list::-webkit-scrollbar{
      display:none;
    }

    .lang-option{
      width:100%;
      min-height:60px;
      padding:0 18px;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      border-top:1px solid rgba(255,255,255,.05);
      font-family:inherit;
    }

    .lang-option:first-child{
      border-top:none;
    }

    .lang-option-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .lang-option-name{
      font-size:16px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lang-check{
      width:22px;
      height:22px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.34);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .lang-option.active .lang-check{
      border-color:#79e9ff;
    }

    .lang-option.active .lang-check::after{
      content:"";
      width:10px;
      height:10px;
      border-radius:50%;
      background:#79e9ff;
    }

    .toast{
      position:absolute;
      left:50%;
      bottom:calc(var(--footer-h) + var(--safe-bottom) + 14px);
      transform:translateX(-50%) translateY(120px);
      z-index:180;
      min-width:160px;
      max-width:86%;
      padding:12px 16px;
      border-radius:999px;
      text-align:center;
      font-size:13px;
      font-weight:1000;
      color:#fff;
      background:rgba(10,22,42,.94);
      border:1px solid rgba(122,216,255,.24);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      transition:transform .22s ease, opacity .22s ease;
      opacity:0;
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }
  </style>
</head>
<body>

<div id="pageContent">
  <div class="app">

    <header class="header">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menü">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 17h16"></path>
        </svg>
      </button>

      <div class="brand">
        <div class="brand-title">italky<span class="ai">AI</span></div>
        <div class="brand-sub">MEETING</div>
      </div>

      <div class="count-pill" id="topCountPill">
        <div class="count-num" id="participantCount">1</div>
        <div class="count-label">Kişi</div>
      </div>
    </header>

    <main class="main">
      <div class="meeting-top">
        <div class="meeting-card">
          <div class="meeting-head">
            <div class="meeting-title">Meeting</div>
          </div>

          <div class="participants-strip" id="participantsStrip"></div>
        </div>
      </div>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-feed" id="chatFeed"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-center">
            <textarea
              id="messageInput"
              class="composer-input"
              rows="1"
              placeholder="Toplantıya mesaj yaz"
            ></textarea>
          </div>

          <button id="micBtn" class="mic-btn" type="button" aria-label="Sesle yaz">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
              <path d="M19 11a7 7 0 0 1-14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>

          <button id="sendBtn" class="send-btn hidden" type="button" aria-label="Gönder">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22l-4-9-9-4 20-7z"></path>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="seal">
        <span class="seal-main">italkyAI By Ozyiğit's</span>
        <span class="seal-dot">•</span>
        <span class="seal-year">2026</span>
      </div>
    </footer>

    <div class="drawer-layer" id="drawerLayer">
      <div class="drawer-backdrop" id="drawerBackdrop"></div>

      <aside class="drawer-panel">
        <div class="drawer-head">
          <div class="drawer-title">Meeting</div>
          <button id="drawerCloseBtn" class="close-btn" type="button" aria-label="Kapat">
            <svg viewBox="0 0 24 24">
              <path d="M18 6L6 18"></path>
              <path d="M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <div class="card">
          <div class="mini-label">Profil</div>
          <div class="profile-row">
            <div class="drawer-avatar" id="drawerAvatar">U</div>
            <div class="profile-meta">
              <div class="profile-name" id="drawerName">Kullanıcı</div>
              <div class="profile-sub" id="drawerMemberSub">Üyelik No: —</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="mini-label">Benim Üyelik Numaram</div>
          <div class="value-row">
            <div class="value-pill" id="myMembershipNo">Hazırlanıyor...</div>
            <button id="copyMemberBtn" class="copy-btn" type="button" aria-label="Kopyala">
              <svg viewBox="0 0 24 24">
                <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="card">
          <div class="mini-label">Benim Dilim</div>
          <button id="langTrigger" class="lang-trigger" type="button">
            <div class="lang-left">
              <div class="lang-flag" id="selectedLangFlag">🇹🇷</div>
              <div class="lang-name" id="selectedLangName">Türkçe</div>
            </div>
            <div>▾</div>
          </button>
        </div>

        <div class="card">
          <div class="mini-label">Katıl</div>
          <input
            id="joinInput"
            class="join-input"
            type="text"
            placeholder="Üyelik numarası gir"
            autocomplete="off"
          />
          <div style="height:12px"></div>
          <button id="joinBtn" class="primary-btn" type="button">Katılımcı Ekle</button>
        </div>
      </aside>
    </div>

    <div class="lang-layer" id="langLayer">
      <div class="lang-backdrop" id="langBackdrop"></div>

      <section class="lang-panel">
        <div class="lang-head" style="padding:14px 14px 6px;">
          <div class="lang-title">Dil Seç</div>
          <button id="langCloseBtn" class="close-btn" type="button" aria-label="Kapat">
            <svg viewBox="0 0 24 24">
              <path d="M18 6L6 18"></path>
              <path d="M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <div id="langList" class="lang-list"></div>
      </section>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="module" src="/js/meeting_page.js?v=10"></script>
</body>
</html>
