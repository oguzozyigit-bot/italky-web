<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V3</title>

<style>
  html,body{ background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif; color:#fff; }
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --neon-blue: #00d2ff;
  --neon-green: #39ff14;
  --neon-pink: #ff007f;
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --glass-border: rgba(255,255,255,0.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
}

/* ===== 1. YAŞAYAN ARKA PLAN (QUANTUM GRID) ===== */
.quantum-grid {
  position: absolute; inset: 0;
  background-image: 
    linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  perspective: 500px;
  opacity: 0.5;
}
.grid-flow {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, 0.05), transparent);
  animation: gridMove 4s linear infinite;
}
@keyframes gridMove { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

/* ===== 2. ÜÇE BÖLÜNMÜŞ TERMİNAL KATMANLARI ===== */
.terminal-layers {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 8px;
  z-index: 10;
}

/* ✅ YAŞAYAN BUTON PANELİ */
.os-btn {
  flex: 1; /* Ekranı tam üçe böler */
  position: relative;
  border-radius: 24px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.02);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Basılma Hissiyatı (3D Çökme) */
.os-btn:active {
  transform: scale(0.97) translateY(4px);
  background: rgba(255,255,255,0.05);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

/* İçerik Animasyonu: Arka planda gezen ışık hüzmesi */
.os-btn::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.03), transparent);
  transform: translateX(-150%);
  transition: transform 0.6s;
}
.os-btn:hover::after { transform: translateX(150%); }

/* Sol Neon Aktif Hattı */
.status-light {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--btn-color);
  box-shadow: 0 0 15px var(--btn-color);
  animation: flicker 2s infinite;
}

/* Başlık ve AI Vurgusu */
.content-wrap { display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.btn-title {
  font-family: 'Space Grotesk'; font-size: 28px; font-weight: 800;
  color: #fff; margin: 0; letter-spacing: -1px;
}
.btn-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-sub {
  font-size: 10px; color: rgba(255,255,255,0.4);
  font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
}

/* Sağ Taraf: Canlı Veri Akışı (OS Hissiyatı) */
.data-stream {
  text-align: right; font-family: monospace; font-size: 8px;
  color: var(--btn-color); opacity: 0.6; line-height: 1.5;
}

/* Renk Temaları */
.tr-node { --btn-color: var(--neon-blue); }
.ac-node { --btn-color: var(--neon-green); }
.tc-node { --btn-color: var(--neon-pink); }

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="quantum-grid">
    <div class="grid-flow"></div>
  </div>

  <div class="terminal-layers">
    
    <div class="os-btn tr-node" onclick="location.href='/pages/translate_home.html'">
      <div class="status-light"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Translate <span>AI</span></h2>
        <div class="btn-sub">Quantum Neural Decoder</div>
      </div>
      <div class="data-stream">
        STATUS: ACTIVE<br>CORE: 0x88AF<br>LATENCY: 1ms
      </div>
    </div>

    <div class="os-btn ac-node" onclick="location.href='/pages/academy_home.html'">
      <div class="status-light"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Academy <span>AI</span></h2>
        <div class="btn-sub">Logic Path Optimizer</div>
      </div>
      <div class="data-stream">
        DB: ONLINE<br>MODULE: READY<br>SYNC: 100%
      </div>
    </div>

    <div class="os-btn tc-node" onclick="location.href='/pages/helper_home.html'">
      <div class="status-light"></div>
      <div class="content-wrap">
        <h2 class="btn-title">Teacher <span>AI</span></h2>
        <div class="btn-sub">Problem Solver Core</div>
      </div>
      <div class="data-stream">
        SCAN: ENABLED<br>CALC: AUTO<br>MODE: EXPERT
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
