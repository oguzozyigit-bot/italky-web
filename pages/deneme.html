<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Neural Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --neon: #6366f1;
  --neon-glow: rgba(99, 102, 241, 0.4);
  --bg: #020205;
  --card-bg: rgba(255, 255, 255, 0.03);
}

body {
  margin: 0; background: var(--bg); color: #fff;
  font-family: 'Outfit', sans-serif; overflow: hidden;
}

/* Arka Plan Veri Akışı Efekti */
.matrix-bg {
  position: fixed; inset: 0; z-index: -1;
  background: 
    radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 50%),
    radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 40%);
  opacity: 0.6;
}

#pageContent {
  width: 100%; height: 100vh; max-width: 500px; margin: 0 auto;
  padding: calc(60px + env(safe-area-inset-top)) 20px;
  display: flex; flex-direction: column; justify-content: space-between;
}

/* NEURAL QR HUB - Merkeze Oturan Dev Yapı */
.neural-center {
  position: relative; flex: 1;
  display: flex; align-items: center; justify-content: center;
  perspective: 1000px;
}

.qr-shrine {
  position: relative; width: 240px; height: 240px;
  transform-style: preserve-3d;
  animation: float 4s ease-in-out infinite;
}

/* Dönen Enerji Halkaları */
.ring {
  position: absolute; inset: -30px; border: 1px solid var(--neon-glow);
  border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
  animation: morph 8s linear infinite;
}
.ring.r2 { animation-direction: reverse; inset: -45px; opacity: 0.5; border-color: #ec4899; }

.qr-core {
  position: relative; width: 100%; height: 100%;
  background: #fff; border-radius: 32px; padding: 12px;
  box-shadow: 0 0 50px var(--neon-glow), inset 0 0 20px rgba(0,0,0,0.1);
  z-index: 5;
}

.qr-core img { width: 100%; height: 100%; border-radius: 20px; }

/* SCANLINE - Sürekli Hareket Eden Lazer */
.laser {
  position: absolute; inset: 10px; height: 2px;
  background: var(--neon); box-shadow: 0 0 15px var(--neon);
  z-index: 6; animation: scan 3s linear infinite;
}

/* SMART GRID - Fütüristik Kartlar */
.grid-menu {
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
  padding-bottom: env(safe-area-inset-bottom);
}

.cyber-btn {
  position: relative; height: 110px;
  background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: 0.3s;
}

.cyber-btn:active { transform: scale(0.92); border-color: var(--neon); }

/* CSS İle Çizilmiş Animasyonlu İkonlar (İmaj Yok!) */
.icon-engine {
  width: 40px; height: 30px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; gap: 3px;
}

/* Ses Dalgaları (FaceToFace) */
.wave-bar { width: 4px; height: 15px; background: #60a5fa; border-radius: 2px; animation: wave 0.6s infinite alternate; }
.wave-bar:nth-child(2) { animation-delay: 0.2s; height: 25px; }
.wave-bar:nth-child(3) { animation-delay: 0.4s; }

/* Veri Blokları (Text) */
.data-block { width: 25px; height: 2px; background: #a855f7; box-shadow: 0 0 8px #a855f7; animation: blink 1.5s infinite; }

.btn-label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }

/* Animasyon Tanımları */
@keyframes float { 0%, 100% { transform: translateY(0) rotateX(5deg); } 50% { transform: translateY(-20px) rotateX(-5deg); } }
@keyframes morph { 
  0% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: rotate(0deg); }
  100% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: rotate(360deg); }
}
@keyframes scan { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }
@keyframes wave { from { height: 5px; } to { height: 25px; } }
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

</style>
</head>

<body>
<div class="matrix-bg"></div>

<main id="pageContent">

  <div class="neural-center">
    <div class="qr-shrine">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="qr-core">
        <div class="laser"></div>
        <img id="smallQrImg" src="" alt="italky">
      </div>
    </div>
  </div>

  <div style="text-align: center; margin-bottom: 30px;">
    <h1 style="font-family:'Space Grotesk'; font-size: 24px; margin: 0;">italky<span style="color:var(--neon)">AI</span></h1>
    <p style="font-size: 12px; color: rgba(255,255,255,0.4);">Neural Interface Connected</p>
  </div>

  <section class="grid-menu">
    <div class="cyber-btn" onclick="location.href='/facetoface.html'">
      <div class="icon-engine">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <span class="btn-label">FaceToFace</span>
    </div>

    <div class="cyber-btn" onclick="location.href='/pages/text_translate.html'">
      <div class="icon-engine" style="flex-direction: column;">
        <div class="data-block" style="width: 30px;"></div>
        <div class="data-block" style="width: 15px; align-self: flex-start;"></div>
        <div class="data-block" style="width: 25px;"></div>
      </div>
      <span class="btn-label">TextToText</span>
    </div>

    <div class="cyber-btn" onclick="location.href='/pages/f2f_connect.html'">
      <div class="icon-engine">
        <div style="width: 20px; height: 20px; border: 2px dashed var(--neon); border-radius: 50%; animation: morph 4s linear infinite;"></div>
      </div>
      <span class="btn-label">Meeting</span>
    </div>

    <div class="cyber-btn" onclick="location.href='/pages/offline_languages.html'">
      <div class="icon-engine">
        <div style="width: 24px; height: 18px; border: 1px solid #f472b6; position: relative;">
          <div style="position: absolute; top: -5px; left: 0; width: 10px; height: 5px; background: #f472b6;"></div>
        </div>
      </div>
      <span class="btn-label">Offline</span>
    </div>
  </section>

</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

try { mountShell({ scroll:"none" }); } catch(e) {}

const HOST_CODE_KEY = "italky_interpreter_host_code";

async function boot() {
  let code = localStorage.getItem(HOST_CODE_KEY);
  if(!code) {
    const { data } = await supabase.auth.getUser();
    code = "ITK-" + (data?.user?.id?.slice(0,8).toUpperCase() || Math.random().toString(36).slice(2,8).toUpperCase());
    localStorage.setItem(HOST_CODE_KEY, code);
  }
  const url = `https://italky.ai/open/interpreter?host=${code}&v=1`;
  document.getElementById("smallQrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&color=050510&data=${encodeURIComponent(url)}`;
}
boot();
</script>

</body>
</html>
