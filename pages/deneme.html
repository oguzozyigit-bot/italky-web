<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Face to Face</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Yeni Renk Paleti Uyarlaması */
      --ai-gradient: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
      --bg: #02000f; /* Yeni ana siyah tonu */
      --panel-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.10);
      --pink-glow: rgba(244, 114, 182, 0.15);
      --blue-glow: rgba(103, 232, 249, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0; width: 100%; height: 100%;
      background: var(--bg); color: #fff;
      font-family: 'Outfit', sans-serif; overflow: hidden;
    }

    .container {
      display: flex; flex-direction: column;
      width: 100%; height: 100dvh; position: relative;
    }

    .half-screen {
      flex: 1; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(15px + var(--safe-top)) 16px calc(15px + var(--safe-bottom));
      overflow: hidden;
    }

    /* Üst Panel - Yeni Pembe/Mor Glow */
    .half-screen.top {
      transform: rotate(180deg);
      background: radial-gradient(circle at 50% 100%, var(--pink-glow), transparent 70%);
    }

    /* Alt Panel - Yeni Mavi/Cyan Glow */
    .half-screen.bottom {
      background: radial-gradient(circle at 50% 100%, var(--blue-glow), transparent 70%);
    }

    .lang-trigger {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 999px;
      color: #fff; font-size: 13px; font-weight: 800;
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      z-index: 50; cursor: pointer;
    }

    /* Popover (Dil Seçimi) Yeni Tasarım */
    .popover {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: min(92vw, 360px); height: 380px;
      background: rgba(10, 10, 20, 0.98);
      border: 1px solid var(--border); border-radius: 30px;
      display: none; flex-direction: column; z-index: 5000;
      overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
    }
    .popover.show { display: flex; }
    .half-screen.top .popover { top: 70px; }
    .half-screen.bottom .popover { bottom: 70px; }

    .pop-head {
      padding: 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-family: 'Space Grotesk';
    }

    .pop-list { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: none; }
    .pop-list::-webkit-scrollbar { display: none; }

    .pop-item {
      padding: 14px; border-radius: 18px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.03); border: 1px solid transparent;
    }
    .pop-item.active {
      background: rgba(129, 140, 248, 0.15);
      border-color: rgba(129, 140, 248, 0.3);
    }

    /* Chat Kabarcıkları */
    .chat-body {
      flex: 1; width: 100%; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 20px 0; scrollbar-width: none;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    }

    .bubble.me.is-latest {
      font-size: 32px; font-weight: 900; line-height: 1.1;
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* Mikrofon Butonları - Yeni Stil */
    .mic-wrap { z-index: 30; padding-bottom: 10px; text-align: center; }

    .btn-mic {
      width: 82px; height: 82px; border-radius: 50%;
      background: #12121a; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-mic.listening {
      border-color: #f472b6;
      box-shadow: 0 0 30px rgba(244, 114, 182, 0.3);
      transform: scale(1.05);
    }

    /* MERKEZ HUB (Orta Bölüm) */
    .center-hub {
      height: 120px; display: flex; align-items: center; justify-content: center;
      position: relative; background: rgba(2, 0, 15, 0.8);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 600; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      position: absolute; padding: 10px 18px; border-radius: 100px;
      background: var(--panel-bg); border: 1px solid var(--border);
      color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
    }
    .btn-home { left: 16px; }
    .btn-clear { right: 16px; }

    /* ORB (italky AI Küresi) */
    .orb-container {
      width: 100px; height: 100px; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.8s cubic-bezier(.34, 1.56, .64, 1);
    }

    .ai-core {
      width: 82px; height: 82px; border-radius: 50%;
      background: #000; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk'; font-weight: 800;
    }

    .logo-ai {
      background: var(--ai-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Enerji Topları */
    .ball-1, .ball-2 {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      filter: blur(2px);
    }
    .ball-1 { top: -4px; background: #67e8f9; box-shadow: 0 0 15px #67e8f9; }
    .ball-2 { bottom: -4px; background: #f472b6; box-shadow: 0 0 15px #f472b6; }

    .energy-orbit {
      position: absolute; width: 100%; height: 100%;
      animation: rotateOrbit 6s linear infinite;
    }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* EQ (Ses Dalgaları) */
    .eq-bar { background: var(--ai-gradient); width: 4px; border-radius: 10px; }

    .helper-text {
      font-size: 11px; font-weight: 800; color: var(--muted);
      margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;
    }

    #frameRoot.to-top .orb-container { transform: rotate(180deg); }

  </style>
</head>

<body id="frameRoot" class="to-bot">
  <div class="container">

    <div class="half-screen top" id="topSection">
      <button class="lang-trigger" id="topLangBtn" type="button">
        <span id="topLangTxt">🇬🇧 English</span> ⌵
      </button>

      <div class="popover" id="pop-top" role="dialog">
        <div class="pop-head">
          <div>SELECT LANGUAGE</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="topMic" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 11v1a7 7 0 0 1-14 0v-1M12 19v3"/></svg>
        </div>
        <div class="helper-text" id="topHelper">TAP TO SPEAK</div>
      </div>
    </div>

    <div class="center-hub">
      <div class="nav-btn btn-home" id="homeLink" onclick="location.href='/'">HOME</div>

      <div class="orb-container" id="homeBtn">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" style="opacity:0; display:flex; gap:3px; position:absolute;">
            <div class="eq-bar" style="height:10px; animation: eqAnim 0.8s infinite;"></div>
            <div class="eq-bar" style="height:20px; animation: eqAnim 0.5s infinite;"></div>
            <div class="eq-bar" style="height:15px; animation: eqAnim 0.7s infinite;"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">CLEAR</div>
    </div>

    <div class="half-screen bottom" id="botSection">
      <button class="lang-trigger" id="botLangBtn" type="button">
        <span id="botLangTxt">🇹🇷 Türkçe</span> ⌵
      </button>

      <div class="popover" id="pop-bot" role="dialog">
        <div class="pop-head">
          <div>DİL SEÇİN</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 11v1a7 7 0 0 1-14 0v-1M12 19v3"/></svg>
        </div>
        <div class="helper-text" id="botHelper">KONUŞMAK İÇİN DOKUN</div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/facetoface_page.js?v=FACE2FACE_NEO_FINAL"></script>
</body>
</html>
