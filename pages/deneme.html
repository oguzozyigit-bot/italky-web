<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V7</title>

<style>
  :root {
    --bg-dark: #050508;
    --accent-blue: #00f2ff;
    --accent-purple: #bd00ff;
    --accent-green: #00ff88;
    --glass-white: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

  html, body { 
    background: var(--bg-dark); 
    margin: 0; padding: 0; 
    height: 100vh; width: 100vw;
    overflow: hidden; 
    font-family: 'Outfit', sans-serif;
    color: white;
  }

  #pageContent {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    position: relative;
    background: radial-gradient(circle at 50% 10%, rgba(189, 0, 255, 0.08), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(0, 242, 255, 0.08), transparent 40%);
  }

  /* Ana Konteyner: Butonları tam ortalar ve aralıkları dengeler */
  .main-hub {
    flex: 1; 
    display: flex; 
    flex-direction: column;
    padding: 15px 20px; 
    gap: 12px; /* Ne çok uzak, ne çok yakın: İdeal boşluk */
    justify-content: center; /* Sayfa ortasına odakla */
  }

  /* ===== CANLI QUANTUM CARD ===== */
  .os-card {
    position: relative;
    height: 25%; /* Tam sığdırma için ideal oran */
    min-height: 120px;
    background: var(--glass-white);
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    display: flex; align-items: center;
    padding: 0 25px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s cubic-bezier(0.2, 0, 0.2, 1);
  }

  /* Tıklama Hissi */
  .os-card:active { 
    transform: scale(0.96); 
    background: rgba(255,255,255,0.08);
    border-color: var(--theme);
  }

  .card-info { flex: 1; z-index: 5; }
  .card-info h2 { 
    font-size: 24px; font-weight: 800; margin: 0; 
    letter-spacing: -0.5px;
  }
  .card-info p { 
    font-size: 13px; margin: 4px 0 0; color: rgba(255,255,255,0.5); 
    font-weight: 400;
  }

  /* Canlı İkon Sistemi */
  .visual-node {
    position: relative;
    width: 70px; height: 70px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Enerji Çekirdeği Animasyonu */
  .core-glow {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    filter: blur(15px); opacity: 0.2;
    animation: breathing 4s infinite ease-in-out;
  }

  .icon-main {
    font-size: 36px; z-index: 10;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    animation: floatingIcon 3s infinite ease-in-out;
  }

  /* Renk Temaları */
  .blue-node { --theme: var(--accent-blue); }
  .purple-node { --theme: var(--accent-purple); }
  .green-node { --theme: var(--accent-green); }

  .theme-text { color: var(--theme); }
  .core-glow { background: var(--theme); }

  /* --- Animasyonlar --- */
  @keyframes breathing {
    0%, 100% { transform: scale(0.8); opacity: 0.15; }
    50% { transform: scale(1.3); opacity: 0.4; }
  }

  @keyframes floatingIcon {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33% { transform: translateY(-4px) rotate(-3deg); }
    66% { transform: translateY(2px) rotate(3deg); }
  }

</style>
</head>

<body>
<main id="pageContent">

  <div class="main-hub">

    <div class="os-card blue-node" onclick="location.href='/pages/translate_home.html'">
      <div class="card-info">
        <h2>Translate <span class="theme-text">AI</span></h2>
        <p>Anında konuş, anında çevir</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">🌀</div>
      </div>
    </div>

    <div class="os-card purple-node" onclick="location.href='/pages/acedemy_home.html'">
      <div class="card-info">
        <h2>Academy <span class="theme-text">AI</span></h2>
        <p>AI destekli öğrenme merkezi</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">🔮</div>
      </div>
    </div>

    <div class="os-card green-node" onclick="location.href='/pages/helper_home.html'">
      <div class="card-info">
        <h2>Teacher <span class="theme-text">AI</span></h2>
        <p>Soruları çözen akıllı öğretmen</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">⚡</div>
      </div>
    </div>

  </div>

</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
