<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • FaceToFace Public</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at top, rgba(236,72,153,.06), transparent 22%),
        radial-gradient(circle at bottom, rgba(99,102,241,.06), transparent 22%),
        #050508;
    }

    .container{
      width:100%;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      overflow:hidden;
      padding:10px 8px;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
      padding-bottom:calc(10px + var(--safe-bottom));
    }

    .lang-row{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:20;
    }

    .lang-trigger{
      min-height:38px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:#fff;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:82vw;
      padding:8px 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:100;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
    }

    .pop-list::-webkit-scrollbar{display:none}

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item.active{
      background:rgba(99,102,241,.14);
      border-color:rgba(99,102,241,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{font-size:18px}

    .pop-name{
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pop-code{
      font-size:12px;
      font-weight:900;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:14px;
      padding:14px 0 22px;
      text-align:center;
      scrollbar-width:none;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .chat-body::-webkit-scrollbar{display:none}

    .bubble{
      max-width:86%;
      line-height:1.18;
      word-break:break-word;
      font-size:24px;
      font-weight:900;
      opacity:.9;
    }

    .bubble.latest{
      font-size:32px;
      font-weight:1000;
      opacity:1;
    }

    .mic-line{
      width:100%;
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:12px;
      padding:0 8px 4px;
      flex:0 0 auto;
    }

    .mic-placeholder{
      min-height:1px;
      opacity:0;
      pointer-events:none;
    }

    .mic-btn{
      width:70px;
      height:70px;
      border:none;
      border-radius:999px;
      background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:
        0 18px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
    }

    .mic-btn svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .mic-btn.listening{
      background:
        radial-gradient(circle at 50% 35%, rgba(216,180,254,.34), rgba(99,102,241,.22) 44%, rgba(236,72,153,.12));
      box-shadow:
        0 0 0 10px rgba(99,102,241,.12),
        0 0 34px rgba(99,102,241,.45),
        0 0 70px rgba(236,72,153,.25),
        inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:2px solid rgba(165,180,252,.78);
      box-shadow:
        0 0 0 12px rgba(99,102,241,.10),
        0 0 38px rgba(236,72,153,.35);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.045)}
    }

    @keyframes micPulse{
      0%{transform:scale(.92);opacity:.95}
      70%{transform:scale(1.18);opacity:.16}
      100%{transform:scale(1.24);opacity:0}
    }

    .center-hub{
      height:82px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:50;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .center-action{
      position:absolute;
      min-height:42px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.07);
      color:#fff;
      font-family:inherit;
      font-size:11px;
      font-weight:1000;
      cursor:pointer;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      backdrop-filter:blur(10px);
    }

    .center-login{
      left:14px;
    }

    .center-clear{
      right:14px;
    }

    .orb{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      font-weight:900;
      position:relative;
      overflow:visible;
    }

    .orb-main{
      position:relative;
      z-index:3;
    }

    .orb .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sat{
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      margin-left:-5px;
      margin-top:-5px;
      border-radius:50%;
      z-index:1;
      filter:blur(1.5px);
    }

    .sat1{
      background:#6366f1;
      box-shadow:0 0 15px #6366f1;
      animation:orbit1 4.8s linear infinite;
    }

    .sat2{
      background:#ec4899;
      box-shadow:0 0 15px #ec4899;
      animation:orbit2 6.2s linear infinite;
    }

    @keyframes orbit1{
      from{transform:rotate(0deg) translateX(48px) rotate(0deg)}
      to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}
    }

    @keyframes orbit2{
      from{transform:rotate(180deg) translateX(48px) rotate(-180deg)}
      to{transform:rotate(540deg) translateX(48px) rotate(-540deg)}
    }

    .edge-handle{
      position:fixed;
      right:0;
      top:50%;
      transform:translateY(-50%);
      width:32px;
      height:122px;
      border:none;
      border-radius:24px 0 0 24px;
      background:linear-gradient(180deg,rgba(99,102,241,.36),rgba(236,72,153,.28));
      border-left:1px solid rgba(255,255,255,.28);
      z-index:9997;
      cursor:pointer;
      box-shadow:
        0 0 22px rgba(99,102,241,.25),
        -8px 0 22px rgba(236,72,153,.10);
      animation:edgeHint 2s infinite ease-in-out;
      touch-action:none;
    }

    .edge-handle::before{
      content:"";
      position:absolute;
      left:12px;
      top:17px;
      width:5px;
      height:88px;
      border-radius:999px;
      background:rgba(255,255,255,.76);
      box-shadow:0 0 14px rgba(255,255,255,.38);
    }

    .edge-handle::after{
      content:"⋮";
      position:absolute;
      left:8px;
      top:46px;
      color:rgba(255,255,255,.92);
      font-size:22px;
      line-height:1;
      text-shadow:0 0 10px rgba(255,255,255,.45);
    }

    .edge-handle.dragging{
      animation:none;
      filter:brightness(1.15);
    }

    @keyframes edgeHint{
      0%,100%{transform:translateY(-50%) translateX(0)}
      50%{transform:translateY(-50%) translateX(-5px)}
    }

    .edge-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.38);
      backdrop-filter:blur(4px);
      z-index:9996;
      display:none;
    }

    .edge-backdrop.show{display:block}

    .edge-menu{
      position:fixed;
      right:-246px;
      top:50%;
      transform:translateY(-50%);
      width:226px;
      padding:16px 14px 12px;
      border-radius:30px 0 0 30px;
      background:
        radial-gradient(circle at top left,rgba(99,102,241,.20),transparent 38%),
        linear-gradient(180deg,rgba(16,16,24,.97),rgba(8,8,14,.99));
      border:1px solid rgba(255,255,255,.12);
      border-right:none;
      z-index:9998;
      transition:.24s ease;
      box-shadow:-18px 0 40px rgba(0,0,0,.36), -8px 0 30px rgba(99,102,241,.12);
    }

    .edge-menu.open{right:0}

    .edge-menu-btn{
      width:100%;
      min-height:46px;
      margin-bottom:10px;
      border:none;
      border-radius:18px;
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-family:inherit;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      padding:0 14px;
      text-align:left;
    }

    .edge-menu-btn:last-child{margin-bottom:0}
    .edge-menu-btn.danger{color:#ffb4b4}

    .edge-no{
      width:22px;
      height:22px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.10);
      font-size:11px;
      font-weight:1000;
      flex:0 0 auto;
    }

    .edge-label{
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .edge-footer{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.10);
      font-size:10px;
      font-weight:800;
      color:rgba(255,255,255,.50);
      text-align:center;
      letter-spacing:.2px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);
      min-height:44px;
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:9999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      pointer-events:none;
    }

    .toast.show{transform:translateX(-50%) translateY(0)}

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:20px;
    }

    .modal.show{display:flex}

    .modal-card{
      width:min(100%,420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:"Space Grotesk",sans-serif;
      font-size:20px;
      font-weight:900;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{background:var(--ai-gradient);color:#05060d}
    .modal-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff}

    @media(max-width:390px){
      .mic-line{grid-template-columns:1fr 66px 1fr}
      .mic-btn{width:66px;height:66px}
      .mic-btn svg{width:28px;height:28px}
      .bubble{font-size:22px}
      .bubble.latest{font-size:30px}
      .edge-menu{width:216px;right:-236px}
      .center-action{font-size:10px;padding:0 13px}
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-top">
        <div class="pop-head">
          <div id="topPopTitle">ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>
        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
        <div class="mic-placeholder"></div>
      </div>
    </section>

    <section class="center-hub">
      <a id="centerLoginBtn" class="center-action center-login" href="/pages/login.html?provider=google&next=/pages/home.html">Giriş Yap</a>

      <div class="orb">
        <span class="sat sat1"></span>
        <span class="sat sat2"></span>
        <span class="orb-main">italky<span class="ai">AI</span></span>
      </div>

      <button id="centerClearBtn" class="center-action center-clear" type="button">Temizle</button>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-bot">
        <div class="pop-head">
          <div id="botPopTitle">ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-line">
        <div class="mic-placeholder"></div>
        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
        <div class="mic-placeholder"></div>
      </div>
    </section>

  </main>

  <button id="edgeHandle" class="edge-handle" type="button" aria-label="Menü aç"></button>
  <div id="edgeBackdrop" class="edge-backdrop"></div>

  <aside id="edgeMenu" class="edge-menu">
    <button id="edgeDownloadBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">1</span>
      <span class="edge-label" data-i18n="download">Dil İndir</span>
    </button>

    <button id="edgeLoginBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">2</span>
      <span class="edge-label" data-i18n="login">Giriş Yap</span>
    </button>

    <button id="edgeClearBtn" class="edge-menu-btn danger" type="button">
      <span class="edge-no">3</span>
      <span class="edge-label" data-i18n="clearChat">Sohbeti Temizle</span>
    </button>

    <button id="edgePrivacyBtn" class="edge-menu-btn" type="button">
      <span class="edge-no">4</span>
      <span class="edge-label" data-i18n="privacy">Gizlilik</span>
    </button>

    <div class="edge-footer">italkyAI By Ozyigit's 2026</div>
  </aside>

  <div id="adModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title" id="adTitle">Ücretsiz Kullanım</h3>
      <p class="modal-text" id="adText">
        FaceToFace ücretsiz kullanımda reklam içerir. Reklamı izledikten sonra çeviriye devam edebilirsiniz.
      </p>
      <div class="modal-actions">
        <button id="watchAdBtn" class="modal-btn primary" type="button">Reklam İzle</button>
        <button id="closeAdBtn" class="modal-btn secondary" type="button">Şimdilik Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { getLangPoolForSite } from "/js/lang_pool_full.js";

    const API_BASE = "https://italky-api.onrender.com";
    const $ = (id) => document.getElementById(id);

    const BCP = {

    const UI = {

      en:{download:"Download Language",login:"Login",clear:"Clear",clearChat:"Clear Chat",privacy:"Privacy",topLang:"TOP LANGUAGE",botLang:"BOTTOM LANGUAGE",offlineLogin:"Please login to download offline languages.",adTitle:"Free Use",adText:"FaceToFace free use includes ads. Watch the ad to continue translating.",watchAd:"Watch Ad",close:"Close",micError:"Microphone error.",micDenied:"Microphone permission is required.",micUnsupported:"Speech recognition is not supported on this device.",translateError:"Translation failed"},
      de:{download:"Sprache laden",login:"Anmelden",clear:"Löschen",clearChat:"Chat löschen",privacy:"Datenschutz",topLang:"OBERE SPRACHE",botLang:"UNTERE SPRACHE",offlineLogin:"Bitte anmelden, um Offline-Sprachen herunterzuladen.",adTitle:"Kostenlose Nutzung",adText:"FaceToFace enthält in der kostenlosen Nutzung Werbung.",watchAd:"Werbung ansehen",close:"Schließen",micError:"Mikrofonfehler.",micDenied:"Mikrofonberechtigung erforderlich.",micUnsupported:"Spracherkennung wird nicht unterstützt.",translateError:"Übersetzung fehlgeschlagen"},
      fr:{download:"Télécharger langue",login:"Connexion",clear:"Effacer",clearChat:"Effacer le chat",privacy:"Confidentialité",topLang:"LANGUE DU HAUT",botLang:"LANGUE DU BAS",offlineLogin:"Veuillez vous connecter pour télécharger les langues hors ligne.",adTitle:"Utilisation gratuite",adText:"FaceToFace gratuit contient des publicités.",watchAd:"Voir la pub",close:"Fermer",micError:"Erreur microphone.",micDenied:"Autorisation microphone requise.",micUnsupported:"Reconnaissance vocale non prise en charge.",translateError:"Échec de traduction"},
      es:{download:"Descargar idioma",login:"Iniciar sesión",clear:"Limpiar",clearChat:"Limpiar chat",privacy:"Privacidad",topLang:"IDIOMA SUPERIOR",botLang:"IDIOMA INFERIOR",offlineLogin:"Inicia sesión para descargar idiomas sin conexión.",adTitle:"Uso gratuito",adText:"FaceToFace gratuito incluye anuncios.",watchAd:"Ver anuncio",close:"Cerrar",micError:"Error de micrófono.",micDenied:"Se requiere permiso de micrófono.",micUnsupported:"Reconocimiento de voz no compatible.",translateError:"Error de traducción"}
    };

    const COUNTRY_LANG = {
      TR:"tr", CY:"tr",
      US:"en", GB:"en", IE:"en", AU:"en", CA:"en", NZ:"en",
      DE:"de", AT:"de", CH:"de",
      FR:"fr", BE:"fr",
      ES:"es", MX:"es", AR:"es", CO:"es", CL:"es", PE:"es",
      IT:"it",
      RU:"ru",
      BG:"bg",
      PT:"pt", BR:"pt",
      CN:"zh", JP:"ja", KR:"ko",
      SA:"ar", AE:"ar", EG:"ar"
    };

    function canonical(code){
      return String(code || "").toLowerCase().split("-")[0].trim();
    }

    function tx(key){
      const c = UI[botLang] ? botLang : "en";
      return UI[c]?.[key] || UI.en[key] || key;
    }

    function getInitialSiteLang(){
      return canonical(localStorage.getItem("site_lang") || localStorage.getItem("italky_site_lang_v1") || navigator.language || "tr") || "tr";
    }

    const RAW_LANG_POOL = Array.isArray(getLangPoolForSite(getInitialSiteLang())) ? getLangPoolForSite(getInitialSiteLang()) : [];

    const LANGS = RAW_LANG_POOL.map((l)=>{
      const code = canonical(l.code);
      if(!code) return null;
      return {
        code,
        flag:l.flag || "🌐",
        name:l.name || l.tr_name || code.toUpperCase(),
        bcp:BCP[code] || `${code}-${String(code).toUpperCase()}`
      };
    }).filter(Boolean);

    function langExists(code){
      return !!LANGS.find((x)=>x.code === canonical(code));
    }

    function langObj(code){
      const c = canonical(code);
      return LANGS.find((x)=>x.code === c) || {code:c || "en",flag:"🌐",name:(c || "en").toUpperCase(),bcp:BCP[c] || "en-US"};
    }

    function labelChip(code){
      const o = langObj(code);
      return `${o.flag} ${o.name}`;
    }

    function differentLang(base){
      const b = canonical(base);
      const preferred = b === "tr" ? ["en","de","fr","es","it","ar","ru"] : ["tr","en","de","fr","es","it","ar","ru"];
      for(const c of preferred) if(c !== b && langExists(c)) return c;
      return LANGS.find((l)=>l.code !== b)?.code || "en";
    }

    let botLang = langExists("tr") ? "tr" : (LANGS[0]?.code || "tr");
    let topLang = langExists("en") && botLang !== "en" ? "en" : differentLang(botLang);

    const topBody = $("topBody");
    const botBody = $("botBody");
    const topMic = $("topMic");
    const botMic = $("botMic");
    const topLangBtn = $("topLangBtn");
    const botLangBtn = $("botLangBtn");
    const popTop = $("pop-top");
    const popBot = $("pop-bot");
    const listTop = $("list-top");
    const listBot = $("list-bot");
    const closeTop = $("close-top");
    const closeBot = $("close-bot");
    const topPopTitle = $("topPopTitle");
    const botPopTitle = $("botPopTitle");
    const centerLoginBtn = $("centerLoginBtn");
    const centerClearBtn = $("centerClearBtn");
    const edgeHandle = $("edgeHandle");
    const edgeBackdrop = $("edgeBackdrop");
    const edgeMenu = $("edgeMenu");
    const edgeDownloadBtn = $("edgeDownloadBtn");
    const edgeLoginBtn = $("edgeLoginBtn");
    const edgeClearBtn = $("edgeClearBtn");
    const edgePrivacyBtn = $("edgePrivacyBtn");
    const adModal = $("adModal");
    const adTitle = $("adTitle");
    const adText = $("adText");
    const watchAdBtn = $("watchAdBtn");
    const closeAdBtn = $("closeAdBtn");
    const toast = $("toast");

    let recognizer = null;
    let liveText = "";
    const sessionStart = Date.now();
    let lastAdAt = 0;

    function showToast(msg){
      if(!toast) return;
      toast.textContent = String(msg || "");
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(()=>toast.classList.remove("show"),2600);
    }

    function refreshTexts(){
      if(topLangBtn) topLangBtn.textContent = `${labelChip(topLang)} ⌵`;
      if(botLangBtn) botLangBtn.textContent = `${labelChip(botLang)} ⌵`;
      if(topPopTitle) topPopTitle.textContent = tx("topLang");
      if(botPopTitle) botPopTitle.textContent = tx("botLang");
      if(centerLoginBtn) centerLoginBtn.textContent = tx("login");
      if(centerClearBtn) centerClearBtn.textContent = tx("clear");
      document.querySelectorAll("[data-i18n]").forEach((el)=>{
        const key = el.getAttribute("data-i18n");
        el.textContent = tx(key);
      });
      if(adTitle) adTitle.textContent = tx("adTitle");
      if(adText) adText.textContent = tx("adText");
      if(watchAdBtn) watchAdBtn.textContent = tx("watchAd");
      if(closeAdBtn) closeAdBtn.textContent = tx("close");
    }

    function closeAllPop(){
      popTop?.classList.remove("show");
      popBot?.classList.remove("show");
    }

    function renderPop(side){
      const list = side === "top" ? listTop : listBot;
      const selected = side === "top" ? topLang : botLang;
      if(!list) return;

      list.innerHTML = LANGS.map((l)=>{
        const active = l.code === selected ? "active" : "";
        return `
          <div class="pop-item ${active}" data-code="${l.code}">
            <div class="pop-left">
              <div class="pop-flag">${l.flag}</div>
              <div class="pop-name">${l.name}</div>
            </div>
            <div class="pop-code">${l.code.toUpperCase()}</div>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".pop-item").forEach((el)=>{
        el.addEventListener("click",()=>{
          const code = canonical(el.dataset.code);
          if(side === "top"){
            topLang = code;
            if(topLang === botLang) botLang = differentLang(topLang);
          }else{
            botLang = code;
            if(botLang === topLang) topLang = differentLang(botLang);
          }
          closeAllPop();
          refreshTexts();
        });
      });
    }

    topLangBtn?.addEventListener("click",(e)=>{
      e.preventDefault();
      e.stopPropagation();
      closeAllPop();
      renderPop("top");
      popTop?.classList.add("show");
    });

    botLangBtn?.addEventListener("click",(e)=>{
      e.preventDefault();
      e.stopPropagation();
      closeAllPop();
      renderPop("bot");
      popBot?.classList.add("show");
    });

    closeTop?.addEventListener("click",closeAllPop);
    closeBot?.addEventListener("click",closeAllPop);

    document.addEventListener("click",(e)=>{
      const inside = popTop?.contains(e.target) || popBot?.contains(e.target) || e.target?.closest?.("#topLangBtn,#botLangBtn");
      if(!inside) closeAllPop();
    },{capture:true});

    function clearBody(body){
      if(body) body.innerHTML = "";
    }

    function addBubble(side,text,latest=false){
      const body = side === "top" ? topBody : botBody;
      if(!body) return null;

      if(latest){
        body.querySelectorAll(".bubble.latest").forEach((x)=>x.classList.remove("latest"));
      }

      const div = document.createElement("div");
      div.className = `bubble${latest ? " latest" : ""}`;
      div.textContent = String(text || "").trim();
      body.appendChild(div);

      const scroll = ()=>{ try{ body.scrollTop = body.scrollHeight; }catch{} };
      scroll();
      requestAnimationFrame(scroll);
      setTimeout(scroll,60);
      return div;
    }

    function setMicState(side,listening){
      const mic = side === "top" ? topMic : botMic;
      mic?.classList.toggle("listening",!!listening);
    }

    function buildRecognizer(langCode){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR) return null;
      const rec = new SR();
      rec.lang = langObj(langCode).bcp;
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      return rec;
    }

    function stopRecognizer(){
      try{ recognizer?.stop?.(); }catch{}
    }

    function cleanupTranscript(text){
      return String(text || "").replace(/\s+/g," ").replace(/\b(\S+)( \1\b)+/gi,"$1").trim();
    }

    async function maybeShowAd(){
      const now = Date.now();
      if(now - sessionStart < 5 * 60 * 1000) return true;
      if(lastAdAt && now - lastAdAt < 5 * 60 * 1000) return true;

      return new Promise((resolve)=>{
        if(!adModal || !watchAdBtn || !closeAdBtn){
          lastAdAt = Date.now();
          resolve(true);
          return;
        }

        refreshTexts();
        adModal.classList.add("show");

        const clean = ()=>{
          watchAdBtn.onclick = null;
          closeAdBtn.onclick = null;
          adModal.classList.remove("show");
        };

        watchAdBtn.onclick = ()=>{
          try{
            if(window.AndroidAdBridge?.showRewardedAd) window.AndroidAdBridge.showRewardedAd("public_facetoface_5min");
            else if(window.NativeAds?.showRewardedAd) window.NativeAds.showRewardedAd("public_facetoface_5min");
            else if(window.AdMobBridge?.showRewardedAd) window.AdMobBridge.showRewardedAd("public_facetoface_5min");
          }catch{}
          lastAdAt = Date.now();
          clean();
          resolve(true);
        };

        closeAdBtn.onclick = ()=>{
          clean();
          resolve(false);
        };
      });
    }

    async function translateOnline(text,from,to){
      const endpoints = [`${API_BASE}/api/translate_ai`,`${API_BASE}/api/translate-ai`,`${API_BASE}/api/translate`];

      for(const endpoint of endpoints){
        try{
          const r = await fetch(endpoint,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              text:String(text || "").trim(),
              from_lang:canonical(from),
              to_lang:canonical(to),
              source:canonical(from),
              target:canonical(to),
              mode:"normal",
              use_ai:false,
              cultural:false,
              tone:"neutral",
              style:"warm"
            })
          });

          const j = await r.json().catch(()=>null);
          const value = String(j?.translated || j?.translation || j?.text || "").trim();
          if(r.ok && value) return value;
        }catch{}
      }

      return null;
    }

    function speak(text,langCode){
      const value = String(text || "").trim();
      if(!value) return;

      try{
        window.speechSynthesis?.cancel?.();

        if(window.NativeTTS?.speak){
          window.NativeTTS.speak(value,canonical(langCode));
          return;
        }

        const u = new SpeechSynthesisUtterance(value);
        u.lang = langObj(langCode).bcp;
        u.rate = 0.95;
        speechSynthesis.speak(u);
      }catch{}
    }

    async function finalizeSpeech(side,text){
      const clean = cleanupTranscript(text);
      if(!clean) return;

      const adOk = await maybeShowAd();
      if(!adOk) return;

      const src = side === "top" ? topLang : botLang;
      const dst = side === "top" ? botLang : topLang;
      const other = side === "top" ? "bot" : "top";

      addBubble(side,clean,false);

      const targetRow = addBubble(other,"",true);
      const translated = await translateOnline(clean,src,dst);

      if(!translated){
        if(targetRow) targetRow.textContent = tx("translateError");
        return;
      }

      if(targetRow) targetRow.textContent = translated;
      speak(translated,dst);
    }

    function startRecording(side){
      if(recognizer){
        stopRecognizer();
        return;
      }

      const sourceLang = side === "top" ? topLang : botLang;
      const rec = buildRecognizer(sourceLang);

      if(!rec){
        showToast(tx("micUnsupported"));
        return;
      }

      recognizer = rec;
      liveText = "";

      rec.onstart = ()=>setMicState(side,true);

      rec.onresult = (e)=>{
        let finalText = "";
        let interimText = "";

        for(let i=0;i<e.results.length;i++){
          const txt = String(e.results[i]?.[0]?.transcript || "").trim();
          if(!txt) continue;
          if(e.results[i].isFinal) finalText += ` ${txt}`;
          else interimText += ` ${txt}`;
        }

        liveText = cleanupTranscript(finalText || interimText || liveText);
      };

      rec.onerror = (e)=>{
        const err = String(e?.error || "");
        if(err.includes("not-allowed")) showToast(tx("micDenied"));
        else showToast(tx("micError"));

        setMicState(side,false);
        recognizer = null;
        liveText = "";
      };

      rec.onend = ()=>{
        const finalText = cleanupTranscript(liveText);
        setMicState(side,false);
        recognizer = null;
        liveText = "";
        if(finalText) finalizeSpeech(side,finalText);
      };

      try{
        rec.start();
      }catch{
        showToast(tx("micError"));
        setMicState(side,false);
        recognizer = null;
        liveText = "";
      }
    }

    topMic?.addEventListener("click",()=>startRecording("top"));
    botMic?.addEventListener("click",()=>startRecording("bot"));

    function clearChat(){
      stopRecognizer();
      try{ window.speechSynthesis?.cancel?.(); }catch{}
      try{ window.NativeTTS?.stop?.(); }catch{}
      recognizer = null;
      liveText = "";
      topMic?.classList.remove("listening");
      botMic?.classList.remove("listening");
      clearBody(topBody);
      clearBody(botBody);
    }

    centerClearBtn?.addEventListener("click",clearChat);

    function openEdgeMenu(){
      edgeMenu?.classList.add("open");
      edgeBackdrop?.classList.add("show");
    }

    function closeEdgeMenu(){
      edgeMenu?.classList.remove("open");
      edgeBackdrop?.classList.remove("show");
    }

    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let moved = false;

    edgeHandle?.addEventListener("pointerdown",(e)=>{
      dragging = true;
      moved = false;
      startX = e.clientX || 0;
      currentX = startX;
      edgeHandle.classList.add("dragging");
    });

    window.addEventListener("pointermove",(e)=>{
      if(!dragging) return;
      currentX = e.clientX || currentX;
      const diff = startX - currentX;
      if(diff > 8) moved = true;
      if(diff > 34) openEdgeMenu();
    });

    window.addEventListener("pointerup",()=>{
      if(!dragging) return;
      const diff = startX - currentX;
      dragging = false;
      edgeHandle?.classList.remove("dragging");
      if(diff > 24) openEdgeMenu();
      else if(!moved) openEdgeMenu();
    });

    edgeBackdrop?.addEventListener("click",closeEdgeMenu);

    edgeDownloadBtn?.addEventListener("click",()=>{
      showToast(tx("offlineLogin"));
      setTimeout(()=>{
        location.href = "/pages/login.html?provider=google&next=/pages/offline_languages.html";
      },850);
    });

    edgeLoginBtn?.addEventListener("click",()=>{
      location.href = "/pages/login.html?provider=google&next=/pages/home.html";
    });

    edgeClearBtn?.addEventListener("click",()=>{
      closeEdgeMenu();
      clearChat();
    });

    edgePrivacyBtn?.addEventListener("click",()=>{
      location.href = "/pages/privacy.html";
    });

    async function detectCountryLang(){
      try{
        const r = await fetch("https://ipapi.co/json/",{cache:"no-store"});
        const j = await r.json();
        const country = String(j?.country_code || "").toUpperCase();
        const code = COUNTRY_LANG[country];
        if(code && langExists(code)) return code;
      }catch{}

      const nav = canonical(navigator.language || "");
      if(nav && langExists(nav)) return nav;

      return botLang;
    }

    async function boot(){
      const detected = await detectCountryLang();
      if(detected && langExists(detected)){
        botLang = detected;
        if(topLang === botLang) topLang = differentLang(botLang);
      }

      refreshTexts();
      clearBody(topBody);
      clearBody(botBody);

      setTimeout(()=>showToast(tx("offlineLogin")),900);
      setTimeout(()=>{
        if(localStorage.getItem("italkyai_edge_hint_seen_v2")) return;
        localStorage.setItem("italkyai_edge_hint_seen_v2","1");
        showToast(botLang === "tr" ? "Menü için sağdaki çizgiyi çek" : "Swipe the side handle for menu");
      },2600);
    }

    boot();
  </script>
</body>
