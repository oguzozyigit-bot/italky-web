<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Arkadaşın</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #16161a;
      --accent: #6366f1;
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.5);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Üst Bar */
    header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo { font-weight: 600; font-size: 1.2rem; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    /* Mesajlaşma Alanı - Tüm Boşluğu Doldurur */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: radial-gradient(circle at top right, #111, #0a0a0c);
    }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bubble.bot { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); }
    .bubble.user { align-self: flex-end; background: var(--accent); color: white; }

    /* Alt Yazışma Alanı - Görünür ve Net */
    .input-area {
      padding: 15px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
    }

    .input-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 5px 15px;
      gap: 10px;
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-family: inherit;
      font-size: 16px;
      padding: 12px 0;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      resize: none;
    }

    /* Butonlar */
    .btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      width: 40px;
      height: 40px;
    }

    .btn svg { width: 22px; height: 22px; stroke: var(--dim); fill: none; stroke-width: 2; }

    #sendBtn svg { stroke: var(--accent); }
    
    #micBtn.listening { background: rgba(239, 68, 68, 0.2); border-radius: 50%; }
    #micBtn.listening svg { stroke: #ef4444; }

    .top-btn {
      font-size: 12px;
      color: var(--dim);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">italky<span>AI</span></div>
    <div style="display: flex; gap: 10px;">
      <button class="top-btn" id="muteBtn">SES</button>
      <button class="top-btn" id="clearChat">TEMİZLE</button>
    </div>
  </header>

  <main id="chat">
    <div class="bubble bot">Selam! Ben buradayım. İstediğin her şeyi sorabilirsin.</div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <button class="btn" id="micBtn" title="Konuş">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
      </button>

      <textarea id="msgInput" placeholder="Mesajını yaz..." rows="1"></textarea>

      <button class="btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
      </button>
    </div>
  </div>

  <script type="module" src="/js/italky_chat_page.js?v=4"></script>

</body>
</html>
