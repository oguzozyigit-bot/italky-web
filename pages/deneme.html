<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI</title>
  <meta name="theme-color" content="#07080b"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07080b;
      --text:#f7f7f7;
      --muted:rgba(255,255,255,.58);
      --orange:#f59e0b;
      --orange2:#f97316;
      --green:#a3e635;
      --green2:#84cc16;
      --red:#ef4444;
      --yellow:#facc15;
      --glass:rgba(255,255,255,.045);
      --line:rgba(255,255,255,.08);

      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);

      --header-h:84px;
      --footer-h:44px;
      --composer-h:86px;
      --keyboard-offset:0px;
      --app-height: 100dvh;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit, Arial, sans-serif;
      color:var(--text);
      background: #050608;
    }

    #pageContent{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    /* UYGULAMA ANA YAPISI: FLEXBOX */
    .app{
      display: flex;
      flex-direction: column;
      position:relative;
      width:100%;
      max-width:430px;
      height:var(--app-height);
      margin:0 auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 0%, rgba(239,68,68,.05), transparent 20%),
        radial-gradient(circle at 85% 8%, rgba(163,230,53,.04), transparent 18%),
        linear-gradient(180deg,#050608 0%, #090b10 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    .header{
      flex: 0 0 auto;
      position: relative;
      height: calc(var(--header-h) + var(--safe-top));
      padding: calc(12px + var(--safe-top)) 14px 10px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 10px;
      z-index: 50;
      background: linear-gradient(180deg, rgba(7,8,11,0.96), rgba(7,8,11,0.76));
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }

    .icon-btn{
      width:44px; height:44px; border:none; border-radius:14px;
      background:rgba(255,255,255,.04); color:#fff;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }

    .icon-btn svg, .send-btn svg, .mic-btn svg{ width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

    .brand{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; cursor:pointer; user-select:none; }
    .brand-title{ margin:0; font-family:"Space Grotesk", Outfit, sans-serif; font-size:28px; line-height:1; font-weight:800; letter-spacing:-.6px; color:#fff; }
    .brand-title .ai{ background:linear-gradient(135deg, var(--orange) 0%, var(--orange2) 42%, var(--green) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .brand-sub{ margin:0; font-size:9px; font-weight:900; letter-spacing:3px; color:rgba(255,255,255,.32); }

    /* CHAT VE INPUT ALANI YÖNETİMİ */
    .main{
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-scroll{
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .chat-scroll::-webkit-scrollbar{ display:none; }

    .chat-spacer{ flex: 1 0 auto; height: 1px; }

    .msg{ display:flex; width:100%; flex:0 0 auto; }
    .msg.left{ justify-content:flex-start; }
    .msg.right{ justify-content:flex-end; }
    .bubble-wrap{ max-width:84%; }
    .bubble{ background:#0d0f14; border:1px solid rgba(255,255,255,.07); padding:18px; border-radius:24px; font-size:15px; line-height:1.42; font-weight:800; }
    .bubble.left{ border-left:4px solid var(--orange); }
    .bubble.right{ border-right:4px solid var(--green); }
    .msg-meta{ margin-top:7px; font-size:11px; font-weight:700; color:var(--muted); }

    .typing{
      position: absolute; left: 14px; bottom: 90px;
      font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 800; display: none;
    }
    .typing.show{ display: block; }

    /* COMPOSER FIXED-LIKE BUT FLOW-BASED */
    .composer-wrap{
      flex: 0 0 auto;
      padding: 12px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: rgba(7,8,11,0.8);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .composer{
      display: flex; align-items: center; gap: 10px; min-height: 72px;
      padding: 10px 12px; border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.08);
    }

    .composer-center{ flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .composer-input{
      width: 100%; min-height: 28px; max-height: 140px; resize: none; border: none; outline: none;
      background: transparent; color: #fff; font-size: 16px; font-weight: 800; line-height: 1.45; font-family: inherit;
    }

    .send-btn, .mic-btn{ width: 42px; height: 42px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .send-btn{ background: #fff; color: #000; }
    .mic-btn{ background: transparent; color: #fff; }
    .hidden{ display: none !important; }

    /* MENU VE MODALLAR */
    .menu{ position:absolute; inset:0; pointer-events:none; z-index:120; }
    .menu.open{ pointer-events:auto; }
    .menu-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.48); backdrop-filter:blur(6px); opacity:0; transition:opacity .22s ease; }
    .menu.open .menu-backdrop{ opacity:1; }
    .menu-panel{ position:absolute; left:0; top:0; bottom:0; width:min(84vw, 336px); transform:translateX(-104%); transition:transform .24s ease; padding:calc(14px + var(--safe-top)) 12px; background:linear-gradient(180deg, rgba(10,11,14,.98), rgba(6,7,10,.98)); border-right:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:12px; }
    .menu.open .menu-panel{ transform:translateX(0); }
    .menu-item{ width:100%; min-height:46px; border:none; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); color:#fff; text-align:left; padding:0 14px; font-size:13px; font-weight:900; }
    .menu-item.white{ background:#fff; color:#111; }

    .save-modal, .listen-modal{ position:fixed; inset:0; background:rgba(0,0,0,.52); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
    .save-modal.open, .listen-modal.open{ display:flex; }
    .ai-live-core{ width:102px; height:102px; border-radius:50%; background: radial-gradient(circle, var(--yellow), var(--orange), var(--red)); animation:liveBreath 2.1s ease-in-out infinite; }
    @keyframes liveBreath{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.11); } }
  </style>
</head>
<body>

<div class="save-modal" id="saveModal">
  <div class="save-card" style="background:#111; padding:20px; border-radius:24px; width:100%; max-width:380px;">
    <h3 class="save-title" style="color:#fff; margin-bottom:15px;">Sohbete isim ver</h3>
    <input id="saveChatName" class="save-input" type="text" placeholder="Örn: Tatil planı" style="width:100%; padding:12px; border-radius:12px; margin-bottom:15px;">
    <div class="save-actions" style="display:flex; gap:10px;">
      <button class="save-btn secondary" id="cancelSaveChat" style="flex:1; padding:12px; border-radius:12px;">Vazgeç</button>
      <button class="save-btn primary" id="confirmSaveChat" style="flex:1; background:var(--orange); padding:12px; border-radius:12px;">Kaydet</button>
    </div>
  </div>
</div>

<div class="listen-modal" id="listenModal">
  <div class="listen-card">
    <div class="ai-live"><div class="ai-live-core"></div></div>
    <button class="listen-close" id="closeListenModal">×</button>
  </div>
</div>

<div class="menu" id="menu">
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <aside class="menu-panel">
    <div class="menu-user" style="padding:15px; background:var(--glass); border-radius:20px; display:flex; align-items:center; gap:10px;">
      <div class="menu-user-avatar" id="menuUserAvatar" style="width:44px; height:44px; background:#222; border-radius:10px; overflow:hidden;">
        <img id="menuUserAvatarImg" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="menu-user-meta">
        <div class="menu-logo">italky<span class="ai">AI</span></div>
        <div class="menu-name" id="menuUserName" style="font-size:12px;">Kullanıcı</div>
      </div>
    </div>
    <div class="menu-list">
      <button class="menu-item white" id="newChatBtn">Yeni Sohbet</button>
      <button class="menu-item" id="saveChatMenuBtn">Sohbeti Kaydet</button>
      <button class="menu-item" id="clearChatMenuBtn">Sohbeti Temizle</button>
      <button class="menu-item" id="jetonYukleBtn">Jeton Yükle</button>
      <button class="menu-item" id="homeBtn">Ana Sayfaya Dön</button>
    </div>
  </aside>
</div>

<div class="app">
  <header class="header">
    <button class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div class="brand" id="brandHome">
      <h1 class="brand-title">italky<span class="ai">AI</span></h1>
      <p class="brand-sub">BE FREE</p>
    </div>
    <button class="avatar-btn empty" id="topAvatarBtn"><img id="topAvatarImg"></button>
  </header>

  <section class="main">
    <div class="chat-scroll" id="chatMessages">
      <div class="chat-spacer"></div>
    </div>
    <div class="typing" id="typingState">italkyAI yazıyor...</div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-center">
          <textarea id="chatInput" class="composer-input" rows="1" placeholder="Mesajını buraya yaz"></textarea>
        </div>
        <button id="micBtn" class="mic-btn"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3zM19 10a7 7 0 0 1-14 0M12 17v4M8 21h8"></path></svg></button>
        <button id="sendBtn" class="send-btn hidden"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
      </div>
    </div>
  </section>
</div>

<script type="module">
  import { supabase } from "/js/supabase_client.js";

  const $ = (id) => document.getElementById(id);

  const STORAGE = {
    voice: "italkyai_selected_voice",
    localSavedChats: "italkyai_local_saved_chats"
  };

  const UI = {
    chatMessages: $("chatMessages"),
    chatInput: $("chatInput"),
    sendBtn: $("sendBtn"),
    micBtn: $("micBtn"),
    typingState: $("typingState"),
    menu: $("menu"),
    menuBtn: $("menuBtn"),
    saveModal: $("saveModal"),
    listenModal: $("listenModal"),
    saveChatName: $("saveChatName")
  };

  let currentUser = null;
  let currentSessionId = crypto.randomUUID();

  // KLAVYE VE VIEWPORT YÖNETİMİ (SORUNU ÇÖZEN KISIM)
  function updateViewportLayout() {
    const vv = window.visualViewport;
    if (!vv) return;

    // Viewport yüksekliğini css değişkenine ata
    document.documentElement.style.setProperty("--app-height", `${vv.height}px`);

    // Eğer klavye açıldıysa (boyut küçüldüyse)
    if (vv.height < window.innerHeight * 0.8) {
      requestAnimationFrame(() => {
        UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight;
        setTimeout(() => {
            UI.chatInput.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 100);
      });
    }
  }

  window.visualViewport?.addEventListener("resize", updateViewportLayout);
  window.visualViewport?.addEventListener("scroll", updateViewportLayout);

  function autoResizeTextarea() {
    UI.chatInput.style.height = "auto";
    UI.chatInput.style.height = `${Math.min(UI.chatInput.scrollHeight, 140)}px`;
  }

  function syncInputActionState() {
    const hasText = UI.chatInput.value.trim().length > 0;
    UI.micBtn.classList.toggle("hidden", hasText);
    UI.sendBtn.classList.toggle("hidden", !hasText);
  }

  // MESAJ SİSTEMİ
  function addMessage(side, text) {
    const row = document.createElement("div");
    row.className = `msg ${side}`;
    row.innerHTML = `<div class="bubble-wrap"><div class="bubble ${side}">${text}</div></div>`;
    UI.chatMessages.appendChild(row);
    UI.chatMessages.scrollTop = UI.chatMessages.scrollHeight;
  }

  async function sendCurrentMessage() {
    const text = UI.chatInput.value.trim();
    if (!text) return;

    addMessage("right", text);
    UI.chatInput.value = "";
    autoResizeTextarea();
    syncInputActionState();

    // AI simülasyonu (Gerçek API'nize bağlayın)
    UI.typingState.classList.add("show");
    setTimeout(() => {
      UI.typingState.classList.remove("show");
      addMessage("left", "Anladım, yardımcı olmaya çalışacağım.");
    }, 1000);
  }

  // EVENT BINDINGS
  UI.chatInput.addEventListener("input", () => {
    autoResizeTextarea();
    syncInputActionState();
  });

  UI.chatInput.addEventListener("focus", () => {
    setTimeout(updateViewportLayout, 300);
  });

  UI.sendBtn.onclick = sendCurrentMessage;
  UI.menuBtn.onclick = () => UI.menu.classList.add("open");
  $("menuBackdrop").onclick = () => UI.menu.classList.remove("open");
  $("newChatBtn").onclick = () => { UI.chatMessages.innerHTML = '<div class="chat-spacer"></div>'; UI.menu.classList.remove("open"); };
  $("saveChatMenuBtn").onclick = () => UI.saveModal.classList.add("open");
  $("cancelSaveChat").onclick = () => UI.saveModal.classList.remove("open");
  UI.micBtn.onclick = () => UI.listenModal.classList.add("open");
  $("closeListenModal").onclick = () => UI.listenModal.classList.remove("open");

  // INITIALIZE
  updateViewportLayout();
</script>
</body>
</html>
