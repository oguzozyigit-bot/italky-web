<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V5</title>

<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --blue: #60a5fa; --green: #34d399; --pink: #ec4899;
  --glass-border: rgba(255,255,255,0.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 50%, #08081a 0%, #000 100%);
  position: relative;
}

.main-hub {
  flex: 1; display: flex; flex-direction: column;
  gap: 12px; padding: 12px; min-height: 0; /* ✅ Kural Seti */
}

/* ===== BASE CARD ===== */
.cyber-card {
  flex: 1; position: relative; border-radius: 30px;
  border: 1px solid var(--glass-border);
  overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 25px;
  background: rgba(255,255,255,0.01);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
}
.cyber-card:active { transform: scale(0.97) translateY(4px); filter: brightness(1.2); }

/* Kenar Işıması (Neon Flow) */
.cyber-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.03), transparent);
  transform: translateX(-150%); transition: transform 0.6s;
}
.cyber-card:hover::after { transform: translateX(150%); }

/* Sol Aktif Çizgi */
.btn-line {
  position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px;
  background: var(--btn-color); box-shadow: 0 0 15px var(--btn-color);
  border-radius: 0 4px 4px 0;
}

/* ✅ KART GÖRSELLERİ (Ruh Katmanları) */
.card-visual {
  position: absolute; right: -20px; top: 0; bottom: 0; width: 65%;
  opacity: 0.15; /* Sadece bir hayalet gibi arkada süzülür */
  background-size: contain; background-repeat: no-repeat; background-position: right center;
  pointer-events: none; transition: 0.5s; z-index: 1;
}
.cyber-card:active .card-visual { opacity: 0.4; transform: scale(1.05) translateX(-10px); }

/* Renk Temaları */
.tr-node { 
  --btn-color: var(--blue); 
  background: linear-gradient(145deg, rgba(96,165,250,0.06), rgba(0,0,0,0.6));
}
.ac-node { 
  --btn-color: var(--green); 
  background: linear-gradient(145deg, rgba(52,211,153,0.04), rgba(0,0,0,0.6));
}
.tc-node { 
  --btn-color: var(--pink); 
  background: linear-gradient(145deg, rgba(236,72,153,0.06), rgba(0,0,0,0.6));
}

/* CONTENT */
.card-content { position: relative; z-index: 10; pointer-events: none; }
.card-title { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 800; color: #fff; margin: 0; }
.card-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 5px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">
