<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS V7</title>

<style>
  :root {
    --bg-dark: #050508;
    --accent-blue: #00f2ff;
    --accent-purple: #bd00ff;
    --accent-green: #00ff88;
    --glass-white: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

  html, body { 
    background: var(--bg-dark); 
    margin: 0; padding: 0; 
    height: 100vh; width: 100vw;
    overflow: hidden; 
    font-family: 'Outfit', sans-serif;
    color: white;
  }

  /* Arka Plan Hareketli Işıklar */
  #pageContent {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    position: relative;
    background: radial-gradient(circle at 50% -20%, rgba(189, 0, 255, 0.15), transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(0, 242, 255, 0.1), transparent 50%);
  }

  /* Üst Header (Zarif ve Geniş) */
  .top-header {
    padding: 50px 30px 20px;
    z-index: 10;
  }
  .top-header h1 {
    font-size: 34px; font-weight: 900; margin: 0; letter-spacing: -1px;
    background: linear-gradient(to bottom, #fff, #888);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-header span { font-weight: 400; font-size: 16px; opacity: 0.5; display: block; }

  /* Sayfayı Tam Kaplayan Buton Alanı */
  .main-hub {
    flex: 1; 
    display: flex; flex-direction: column;
    padding: 0 20px 40px;
    gap: 15px;
    justify-content: space-evenly; /* Butonları sayfaya tam yayar */
  }

  /* ===== ULTRA-MODERN QUANTUM BUTON ===== */
  .os-card {
    position: relative;
    height: 28%; /* Sayfa boyuna göre dinamik yükseklik */
    min-height: 140px;
    background: var(--glass-white);
    border: 1px solid var(--glass-border);
    border-radius: 35px;
    display: flex; align-items: center;
    padding: 0 30px;
    overflow: hidden;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .os-card:active { transform: scale(0.94); }

  /* Buton İçeriği */
  .card-info { flex: 1; z-index: 5; }
  .card-info h2 { 
    font-size: 26px; font-weight: 800; margin: 0; 
    display: flex; align-items: center; gap: 8px;
  }
  .card-info p { 
    font-size: 12px; margin: 6px 0 0; color: rgba(255,255,255,0.4); 
    font-weight: 400; letter-spacing: 0.5px;
  }

  /* Yaratıcı İkon Alanı */
  .visual-node {
    position: relative;
    width: 90px; height: 90px;
    display: flex; align-items: center; justify-content: center;
  }

  /* İkon Arkası "Enerji Çekirdeği" */
  .core-glow {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    filter: blur(20px); opacity: 0.3;
    animation: pulseGlow 3s infinite alternate;
  }

  .icon-main {
    font-size: 40px; z-index: 10;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
  }

  /* Renk Varyasyonları */
  .blue-node { --theme: var(--accent-blue); }
  .purple-node { --theme: var(--accent-purple); }
  .green-node { --theme: var(--accent-green); }

  .theme-text { color: var(--theme); }
  .core-glow { background: var(--theme); }

  /* Animasyonlar */
  @keyframes pulseGlow {
    0% { transform: scale(0.8); opacity: 0.2; }
    100% { transform: scale(1.2); opacity: 0.5; }
  }

  /* Sayfa Altı Dekorasyon */
  .footer-decor {
    position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 100px; background: var(--accent-blue);
    filter: blur(80px); opacity: 0.2; pointer-events: none;
  }
</style>
</head>

<body>
<main id="pageContent">
  <div class="top-header">
    <span>Sistem Çekirdeği V7</span>
    <h1>italky<b>AI</b></h1>
  </div>

  <div class="main-hub">

    <div class="os-card blue-node" onclick="location.href='/pages/translate_home.html'">
      <div class="card-info">
        <h2>Translate <span class="theme-text">AI</span></h2>
        <p>Evrensel Dil Senkronizasyonu</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">🌀</div> </div>
    </div>

    <div class="os-card purple-node" onclick="location.href='/pages/acedemy_home.html'">
      <div class="card-info">
        <h2>Academy <span class="theme-text">AI</span></h2>
        <p>Kuantum Veri Kütüphanesi</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">🔮</div> </div>
    </div>

    <div class="os-card green-node" onclick="location.href='/pages/helper_home.html'">
      <div class="card-info">
        <h2>Teacher <span class="theme-text">AI</span></h2>
        <p>İleri Düzey Analiz Motoru</p>
      </div>
      <div class="visual-node">
        <div class="core-glow"></div>
        <div class="icon-main">⚡</div> </div>
    </div>

  </div>

  <div class="footer-decor"></div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
