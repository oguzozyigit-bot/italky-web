  /*

   * Home iframe içinde test edilecek şekilde modüler fonksiyonlara ayrıldı.
   */

  const BANNED_CHANNEL_IDS = new Set([

  const ALLOWED_CHANNEL_IDS = new Set([

    "02_rock_radio",

  const FALLBACK_CHANNELS = [
    ["01_global_pop_english", "Global Pop English", "İngilizce", "EN", "🇬🇧", ["Pop","Global","Dance"]],
    ["01_pop_radio", "Pop Radio", "İngilizce", "EN", "🇬🇧", ["Pop"]],

    ["05_kpop_radio", "K-Pop Radio", "Korece", "KO", "🇰🇷", ["K-Pop","Pop","Dance"]],
    ["06_kurdish_modern_folk_pop", "Kurdish Modern Folk Pop", "Kürtçe", "KU", "☀️", ["Folk","Pop","World"]],
    ["06_rnb_radio", "R&B Radio", "İngilizce", "EN", "🇬🇧", ["R&B"]],
    ["06_russian_modern_pop", "Russian Modern Pop", "Rusça", "RU", "🇷🇺", ["Pop","Rock","Dance"]],
    ["07_edm_radio", "EDM Radio", "İngilizce", "EN", "🇬🇧", ["EDM","Dance","Electronic"]],
    ["07_japanese_city_pop", "Japanese City Pop", "Japonca", "JA", "🇯🇵", ["City Pop","Pop","Electronic"]],
    ["08_brazilian_bossa_pop", "Brazilian Bossa Pop", "Portekizce", "BR", "🇧🇷", ["Bossa Nova","Latin","Lounge"]],
    ["08_country_radio", "Country Radio", "İngilizce", "EN", "🇺🇸", ["Country"]],
    ["09_reggae_radio", "Reggae Radio", "İngilizce", "EN", "🇯🇲", ["Reggae"]],
    ["10_hindi_bollywood_pop", "Hindi Bollywood Pop", "Hintçe", "HI", "🇮🇳", ["Bollywood","Pop","Dance"]],
    ["10_latin_radio", "Latin Radio", "İspanyolca", "ES", "🇪🇸", ["Latin","Dance"]],
    ["11_funk_radio", "Funk Radio", "İngilizce", "EN", "🇬🇧", ["Funk"]],
    ["12_world_radio", "World Radio", "Çok Dilli", "WORLD", "🌍", ["World","Global"]]
  ].map(([id,name,language,code,flag,genres]) => ({
    id,
    name,
    language,
    code,
    flag,
    genres,
    tracks:[],
    loaded:false,
    error:false
  }));

  let ICANY_RADIO_CHANNELS = FALLBACK_CHANNELS.slice();
  let tracks = [];
  let currentTrackIndex = 0;
  let shuffleEnabled = false;
  let activeChannel = null;
  let lyricLines = [];
  let timedLyricLines = [];
  let hasTimedLyrics = false;
  let lastSelection = { genres:[], languages:[] };
  let lastSettings = null;
  let supabaseClientPromise = null;
  let currentUserPromise = null;
  let lastPersistSecond = -1;

  function getDoc(){
    try{
      return frame.contentDocument || frame.contentWindow.document;
    }catch(e){
      return null;
    }
  }

  function uniq(list){
    return Array.from(new Set((Array.isArray(list) ? list : []).filter(Boolean)));
  }

  function clean(value){
    return String(value || "").trim();
  }

  function safeJsonParse(value, fallback = null){
    try{
      return JSON.parse(value);
    }catch{
      return fallback;
    }
  }

  function escapeHtml(value){
    return String(value || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function normalizeChannel(raw){
    const id = clean(raw?.id || raw?.channel_id || raw?.slug || raw?.folder || raw?.key);
    if(!id || BANNED_CHANNEL_IDS.has(id) || !ALLOWED_CHANNEL_IDS.has(id)) return null;

    const name = clean(raw?.name || raw?.title || id.replace(/_/g," "));
    const language = clean(raw?.language || raw?.lang_name || raw?.lang || raw?.locale || "İngilizce");
    const code = clean(raw?.code || raw?.lang_code || raw?.language_code || language.slice(0,2).toUpperCase()).toUpperCase();
    const flag = clean(raw?.flag || "🎧");

    const genresRaw = raw?.genres || raw?.genre || raw?.tags || [];
    const genres = uniq(
      Array.isArray(genresRaw)
        ? genresRaw.map((item) => clean(item))
        : String(genresRaw).split(",").map((item) => item.trim())
    );

    return {
      id,
      name,
      language,
      code,
      flag,
      genres: genres.length ? genres : ["Pop"],
      tracks:[],
      loaded:false,
      error:false
    };
  }

  async function loadChannelIndex(){
    try{
      const res = await fetch(`${INDEX_URL}?t=${Date.now()}`, { cache:"no-store" });
      if(!res.ok) throw new Error("index okunamadı");

      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.channels || data.items || data.radios || []);
      const normalized = list.map(normalizeChannel).filter(Boolean);

      if(normalized.length){
        ICANY_RADIO_CHANNELS = normalized;
      }
    }catch(error){
      console.warn("Radyo index okunamadı, fallback kanal listesi kullanılıyor:", error);
      ICANY_RADIO_CHANNELS = FALLBACK_CHANNELS.slice();
    }
  }

  function manifestUrl(channel){
    return `${PUBLIC_BASE}/icanyai/radio/${channel.id}/playlist.json`;
  }

  function safeTitle(track){
    return String(
      track?.title ||
      track?.name ||
      track?.track_title ||
      (track?.url || track?.audio_url || "").split("/").pop() ||
      "iCanyAI Track"
    ).replace(/\.mp3$/i,"");
  }

  function resolveUrl(url, channel){
    const value = String(url || "").trim();
    if(!value) return "";
    if(/^https?:\/\//i.test(value)) return value;
    if(value.startsWith("/")) return `${PUBLIC_BASE}${value}`;
    if(value.startsWith("icanyai/")) return `${PUBLIC_BASE}/${value}`;
    return `${PUBLIC_BASE}/icanyai/radio/${channel.id}/${value}`;
  }

  function normalizeShowcaseTrack(track, channel){
    const rawUrl = track?.url || track?.audio_url || track?.mp3_url || track?.file || track?.src || "";
    const url = resolveUrl(rawUrl, channel);
    if(!url) return null;

    return {
      ...track,
      url,
      audio_url:url,
      channel_id:channel.id,
      channel_name:channel.name,
      channel_code:channel.code,
      channel_flag:channel.flag,
      language:channel.language,
      genres:channel.genres,
      title:safeTitle({...track,url})
    };
  }

  async function loadChannel(channel){
    if(channel.loaded && Array.isArray(channel.tracks)) return channel.tracks;

    try{
      const res = await fetch(`${manifestUrl(channel)}?t=${Date.now()}`, { cache:"no-store" });
      if(!res.ok) throw new Error("manifest yok");

      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.tracks || data.items || data.songs || []);

      channel.tracks = list
        .map((track) => normalizeShowcaseTrack(track, channel))
        .filter(Boolean);

      channel.loaded = true;
      channel.error = false;
    }catch(error){
      channel.tracks = [];
      channel.loaded = true;
      channel.error = true;
      console.warn("Playlist okunamadı:", channel.id, error);
    }

    return channel.tracks;
  }

  function getAllGenres(){
    const fallback = [
      "Pop","Rock","Rap","Hip-Hop","Lounge","Latin","Dance","Electronic","EDM",
      "Tango","City Pop","Bossa Nova","Bollywood","K-Pop","Jazz","R&B",
      "Country","Reggae","Funk","World","Global","Folk"
    ];

    return uniq(ICANY_RADIO_CHANNELS.flatMap((channel) => channel.genres || []).concat(fallback)).sort();
  }

  function getAllLanguages(){
    return uniq(ICANY_RADIO_CHANNELS.map((channel) => channel.language)).filter((language) => {
      const lower = language.toLowerCase();
      return !lower.includes("türk") && !lower.includes("azer");
    });
  }

  function uniqueChannels(list){
    const seen = new Set();

    return list.filter((channel) => {
      if(!channel || BANNED_CHANNEL_IDS.has(channel.id) || !ALLOWED_CHANNEL_IDS.has(channel.id) || seen.has(channel.id)) return false;
      seen.add(channel.id);
      return true;
    });
  }

  function findRadioChannels(genres, languages, options = {}){
    const wantedGenres = uniq(genres);
    const wantedLanguages = uniq(languages);
    const allowed = ICANY_RADIO_CHANNELS.filter((channel) => !BANNED_CHANNEL_IDS.has(channel.id) && ALLOWED_CHANNEL_IDS.has(channel.id));

    const languageScoped = wantedLanguages.length
      ? allowed.filter((channel) => wantedLanguages.includes(channel.language))
      : allowed;

    const exact = languageScoped.filter((channel) => {
      return !wantedGenres.length || wantedGenres.some((genre) => (channel.genres || []).includes(genre));
    });

    if(exact.length) return uniqueChannels(exact);

    if(wantedLanguages.length) return uniqueChannels(languageScoped);

    if(options.genreFallback !== false && wantedGenres.length){
      const byGenre = allowed.filter((channel) => wantedGenres.some((genre) => (channel.genres || []).includes(genre)));
      if(byGenre.length) return uniqueChannels(byGenre);
    }

    return uniqueChannels(allowed);
  }

  function filterTracksBySelection(list, genres, languages, strictGenre = true){
    const wantedGenres = uniq(genres);
    const wantedLanguages = uniq(languages);

    return list.filter((track) => {
      if(wantedLanguages.length && !wantedLanguages.includes(track.language)) return false;
      if(strictGenre && wantedGenres.length && !wantedGenres.some((genre) => (track.genres || []).includes(genre))) return false;
      return true;
    });
  }

  async function loadTracksFromChannels(channels){
    let allTracks = [];
    for(const channel of channels){
      const channelTracks = await loadChannel(channel);
      if(channelTracks.length) allTracks = allTracks.concat(channelTracks);
    }
    return allTracks;
  }

  async function loadRadioTracksBySelection(genres, languages){
    const exactChannels = findRadioChannels(genres, languages);
    const exactTracks = await loadTracksFromChannels(exactChannels);
    let scopedTracks = filterTracksBySelection(exactTracks, genres, languages, true);

    if(!scopedTracks.length && languages?.length){
      const languageChannels = findRadioChannels([], languages, { genreFallback:false });
      const languageTracks = await loadTracksFromChannels(languageChannels);
      scopedTracks = filterTracksBySelection(languageTracks, [], languages, false);
    }

    if(!scopedTracks.length && !languages?.length){
      scopedTracks = exactTracks;
    }

    tracks = scopedTracks;
    currentTrackIndex = 0;
    activeChannel = tracks[0]
      ? ICANY_RADIO_CHANNELS.find((channel) => channel.id === tracks[0].channel_id)
      : null;

    return tracks;
  }

  function radioIcon(){

  function firstTextField(track, keys){
    for(const key of keys){
      const value = track?.[key];
      if(typeof value === "string" && value.trim()) return value;
    }
    return "";
  }

  function parsePlainLyrics(text){
    return String(text || "")
      .split(/\r?\n/)
      .map((line) => line.trim())
      .filter((line) => line && !/^\[.*\]$/.test(line));
  }

  function parseLRC(text){
    const out = [];

    String(text || "").split(/\r?\n/).forEach((line) => {
      const matches = Array.from(line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g));
      if(!matches.length) return;

      const text = line.replace(/\[(\d+):(\d+(?:\.\d+)?)\]/g,"").trim();
      if(!text) return;

      matches.forEach((match) => {
        out.push({
          time: Number(match[1]) * 60 + Number(match[2]),
          text
        });
      });
    });

    return out.sort((a,b) => a.time - b.time);
  }

  function parseTimedArray(value){
    let arr = value;

    if(typeof value === "string"){
      try {
        arr = JSON.parse(value);
      } catch {
        return [];
      }
    }

    if(!Array.isArray(arr)) return [];

    return arr.map((item) => {
      if(typeof item === "string"){
        return { text:item.trim(), time:null };
      }

      const text = String(
        item.latin ||
        item.romanized ||
        item.transliteration ||
        item.text ||
        item.line ||
        item.lyric ||
        item.words ||
        ""
      ).trim();

      const time = Number(
        item.time ??
        item.start ??
        item.start_time ??
        item.startTime ??
        item.t ??
        NaN
      );

      if(!text) return null;

      return {
        text,
        time:Number.isFinite(time) ? time : null
      };
    }).filter(Boolean);
  }

  function buildLyricsForTrack(track){
    const lrcText = firstTextField(track, [
      "lrc_latin",
      "lrc_romanized",
      "lyrics_lrc_latin",
      "lyrics_lrc_romanized",
      "lrc",
      "lrc_text",
      "lyrics_lrc"
    ]);

    const lrc = parseLRC(lrcText);
    if(lrc.length){
      timedLyricLines = lrc;
      lyricLines = lrc.map((item) => item.text);
      hasTimedLyrics = true;
      return;
    }

    const timedArray =
      parseTimedArray(track?.lyrics_latin) ||
      parseTimedArray(track?.lyrics_romanized) ||
      parseTimedArray(track?.transliteration) ||
      parseTimedArray(track?.romanized) ||
      parseTimedArray(track?.lyrics_json) ||
      parseTimedArray(track?.lyrics_lines) ||
      [];

    const exactTimed = timedArray.filter((item) => Number.isFinite(item.time));

    if(exactTimed.length){
      timedLyricLines = exactTimed.sort((a,b) => a.time - b.time);
      lyricLines = timedLyricLines.map((item) => item.text);
      hasTimedLyrics = true;
      return;
    }

    const plainText = firstTextField(track, [
      "lyrics_latin",
      "lyrics_romanized",
      "transliteration",
      "romanized",
      "lyrics",
      "lyrics_text",
      "lyric"
    ]);

    const plainTimedTexts = timedArray.map((item) => item.text).filter(Boolean);

    lyricLines = plainTimedTexts.length
      ? plainTimedTexts
      : parsePlainLyrics(plainText);

    timedLyricLines = [];
    hasTimedLyrics = false;
  }

  function activeLyricIndex(audio){
    if(!hasTimedLyrics || !timedLyricLines.length) return -1;

    const currentTime = audio?.currentTime || 0;
    let index = 0;

    for(let i = 0; i < timedLyricLines.length; i++){
      if(currentTime >= Number(timedLyricLines[i].time || 0)) index = i;
      else break;
    }

    return index;
  }

  function renderKaraoke(doc){
    const wrap = doc.getElementById("icanyKaraokeLines");
    const note = doc.getElementById("icanyKaraokeNote");
    if(!wrap) return;

    wrap.classList.toggle("has-timing", hasTimedLyrics);

    if(note){
      note.textContent = hasTimedLyrics
        ? "Zaman kodlu karaoke akışı hazır."
        : "Karaoke söz akışı hazırlanıyor.";
    }

    if(!lyricLines.length){
      wrap.innerHTML = `<div class="icany-karaoke-empty">Bu parça için sözler henüz hazırlanıyor.</div>`;
      return;
    }

    wrap.innerHTML = lyricLines.map((line, index) => {
      return `<div class="icany-karaoke-line" data-i="${index}">${escapeHtml(line)}</div>`;
    }).join("");
  }

  function updateKaraoke(doc){
    if(!hasTimedLyrics) return;

    const audio = doc.getElementById("icanyRadioAudio");
    const wrap = doc.getElementById("icanyKaraokeLines");
    if(!audio || !wrap || !lyricLines.length) return;

    const activeIndex = activeLyricIndex(audio);

    Array.from(wrap.querySelectorAll(".icany-karaoke-line")).forEach((line, index) => {
      line.classList.toggle("active", index === activeIndex);
      line.classList.toggle("done", index < activeIndex);
    });

    const active = wrap.querySelector(".icany-karaoke-line.active");
    if(active){
      const wrapRect = wrap.getBoundingClientRect();
      const activeRect = active.getBoundingClientRect();
      const target = wrap.scrollTop + (activeRect.top - wrapRect.top) - (wrap.clientHeight / 2) + (active.clientHeight / 2);
      wrap.scrollTo({ top:Math.max(0, target), behavior:"smooth" });
    }
  }

  function bindPlayer(doc){
    const audio = doc.getElementById("icanyRadioAudio");
    const playIcon = doc.getElementById("icanyPlayIcon");
    const playBtn = doc.getElementById("icanyPlayBtn");
    const nextBtn = doc.getElementById("icanyNextBtn");
    const prevBtn = doc.getElementById("icanyPrevBtn");
    const shuffleBtn = doc.getElementById("icanyShuffleBtn");
    const lyricsBtn = doc.getElementById("icanyLyricsBtn");
    const player = doc.getElementById("icanyRadioPlayer");

    function setPlaying(isPlaying){
      if(playIcon){
        playIcon.innerHTML = isPlaying
          ? `<path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>`
          : `<path d="M8 5v14l11-7z"></path>`;
      }
      player?.classList.toggle("is-playing", !!isPlaying);
    }

    function loadTrack(index){
      if(!audio || !tracks.length) return false;

      const track = tracks[index];
      if(!track || !track.audio_url) return false;

      audio.src = track.audio_url;
      audio.load();

      buildLyricsForTrack(track);
      renderKaraoke(doc);
      updateKaraoke(doc);
      updatePlayerLanguageBadge(doc, track);
      persistPlaybackState(doc, track, audio).catch(() => {});
      return true;
    }

    async function ensureTrackLoaded(){
      if(audio?.src) return true;

      if(!tracks.length){
        await loadRadioTracksBySelection(lastSelection.genres, lastSelection.languages);
      }

      if(tracks.length){
        return loadTrack(currentTrackIndex);
      }

      console.warn("Seçili radyo havuzunda çalınacak parça bulunamadı.");
      return false;
    }

    async function playCurrent(){
      if(!audio) return false;

      const ready = await ensureTrackLoaded();
      if(!ready || !audio.src) return false;

      try{
        await audio.play();
        setPlaying(true);
        await persistPlaybackState(doc, tracks[currentTrackIndex], audio);
        return true;
      }catch(error){
        console.warn("Tarayıcı otomatik çalmayı engelledi, Play ile devam edilebilir:", error);
        setPlaying(false);
        return false;
      }
    }

    function chooseNextIndex(direction = 1){
      if(!tracks.length) return 0;

      if(shuffleEnabled && tracks.length > 1){
        let next = currentTrackIndex;
        let guard = 0;
        while(next === currentTrackIndex && guard < 12){
          next = Math.floor(Math.random() * tracks.length);
          guard++;
        }
        return next;
      }

      return (currentTrackIndex + direction + tracks.length) % tracks.length;
    }

    async function nextTrack(direction = 1, autoPlay = true){
      if(!tracks.length){
        await loadRadioTracksBySelection(lastSelection.genres, lastSelection.languages);
      }

      if(!tracks.length){
        console.warn("Seçili radyo havuzunda sıradaki parça bulunamadı.");
        setPlaying(false);
        return;
      }

      let attempts = 0;
      while(attempts < tracks.length){
        currentTrackIndex = chooseNextIndex(direction);
        if(loadTrack(currentTrackIndex)) break;
        attempts++;
      }

      if(autoPlay){
        try{
          await audio.play();
          setPlaying(true);
        }catch(error){
          console.warn("Sıradaki parça otomatik başlayamadı:", error);
          setPlaying(false);
        }
      }
    }

    lyricsBtn?.addEventListener("click", () => openKaraoke(doc));

    playBtn?.addEventListener("click", async () => {
      if(!audio) return;

      if(audio.paused){
        await playCurrent();
      }else{
        audio.pause();
        setPlaying(false);
        persistPlaybackState(doc, tracks[currentTrackIndex], audio).catch(() => {});
      }
    });

    nextBtn?.addEventListener("click", () => nextTrack(1, true));
    prevBtn?.addEventListener("click", () => nextTrack(-1, true));

    shuffleBtn?.addEventListener("click", () => {
      shuffleEnabled = !shuffleEnabled;
      shuffleBtn.classList.toggle("active", shuffleEnabled);
      persistPlaybackState(doc, tracks[currentTrackIndex], audio).catch(() => {});
    });

    audio?.addEventListener("loadedmetadata", () => {
      renderKaraoke(doc);
      updateKaraoke(doc);
    });

    audio?.addEventListener("timeupdate", () => {
      updateKaraoke(doc);

      const second = Math.floor(audio.currentTime || 0);
      if(second > 0 && second % 5 === 0 && second !== lastPersistSecond){
        lastPersistSecond = second;
        persistPlaybackState(doc, tracks[currentTrackIndex], audio).catch(() => {});
      }
    });

    audio?.addEventListener("seeked", () => {
      updateKaraoke(doc);
      persistPlaybackState(doc, tracks[currentTrackIndex], audio).catch(() => {});
    });

    audio?.addEventListener("pause", () => setPlaying(false));
    audio?.addEventListener("play", () => setPlaying(true));
    audio?.addEventListener("ended", async () => nextTrack(1, true));

    doc.__icanyPlayCurrent = playCurrent;
    doc.__icanyLoadTrack = loadTrack;
  }

    if(!doc) return;

    const old = doc.getElementById("icanyRadioModal");
    if(old) old.remove();

    const modal = doc.createElement("div");
    modal.id = "icanyRadioModal";
    modal.className = "icany-radio-modal";

    const genres = getAllGenres();
    const languages = getAllLanguages();

    modal.innerHTML = `
      <div class="icany-radio-modal-card">
        <h2>iCanyAI BUSINESS</h2>
        <p>Aynı anda birden fazla dil ve tür seçebilirsiniz. Dilediğiniz zaman değiştirebilirsiniz.</p>

        <div class="icany-radio-group-title">Müzik Türü</div>
        <div class="icany-radio-chip-grid" data-group="genres">
          ${genres.map((genre) => `<button class="icany-radio-chip" data-value="${escapeHtml(genre)}" type="button">${escapeHtml(genre)}</button>`).join("")}
        </div>

        <div class="icany-radio-group-title">Dil</div>
        <div class="icany-radio-chip-grid" data-group="languages">
          ${languages.map((language) => `<button class="icany-radio-chip" data-value="${escapeHtml(language)}" type="button">${escapeHtml(language)}</button>`).join("")}
        </div>

        <div class="icany-radio-actions">
          <button class="icany-radio-action secondary" id="icanyRadioClose" type="button">Kapat</button>
          <button class="icany-radio-action primary" id="icanyRadioSave" type="button">KAYDET</button>
        </div>
      </div>
    `;

    doc.body.appendChild(modal);

    modal.querySelectorAll(".icany-radio-chip").forEach((button) => {
      button.addEventListener("click", () => button.classList.toggle("active"));
    });

    modal.querySelector("#icanyRadioClose")?.addEventListener("click", () => closeModal(doc));
    modal.querySelector("#icanyRadioSave")?.addEventListener("click", () => saveRadio(doc));

    modal.addEventListener("click", (event) => {
      if(event.target === modal) closeModal(doc);
    });

    applySelectionToModal(doc, lastSelection);
  }

  function applySelectionToModal(doc, selection){
    if(!selection) return;

    doc.querySelectorAll('[data-group="genres"] .icany-radio-chip').forEach((button) => {
      button.classList.toggle("active", (selection.genres || []).includes(button.dataset.value));
    });

    doc.querySelectorAll('[data-group="languages"] .icany-radio-chip').forEach((button) => {
      button.classList.toggle("active", (selection.languages || []).includes(button.dataset.value));
    });
  }

  function openModal(doc){
    createModal(doc);
    doc.getElementById("icanyRadioModal")?.classList.add("show");
  }

  function closeModal(doc){
    doc.getElementById("icanyRadioModal")?.classList.remove("show");
  }

  function selectedValues(doc, groupName){
    return Array.from(doc.querySelectorAll(`[data-group="${groupName}"] .icany-radio-chip.active`))
      .map((item) => item.dataset.value)
      .filter(Boolean);
  }

  async function getSupabase(){
    if(supabaseClientPromise) return supabaseClientPromise;

    supabaseClientPromise = import("/js/supabase_client.js")
      .then((mod) => mod.supabase || null)
      .catch((error) => {
        console.warn("Supabase yüklenemedi:", error);
        return null;
      });

    return supabaseClientPromise;
  }

  async function getCurrentUser(){
    if(currentUserPromise) return currentUserPromise;

    currentUserPromise = (async () => {
      const supabase = await getSupabase();
      if(!supabase) return null;

      try{
        const { data } = await supabase.auth.getUser();
        return data?.user || null;
      }catch(error){
        console.warn("Kullanıcı okunamadı:", error);
        return null;
      }
    })();

    return currentUserPromise;
  }

  function readLocalSettings(){
    return safeJsonParse(localStorage.getItem(SETTINGS_KEY), null);
  }

  function writeLocalSettings(settings){
    try{
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }catch(error){
      console.warn("Radyo ayarı localStorage kaydedilemedi:", error);
    }
  }

  async function loadSavedSettings(){
    const local = readLocalSettings();
    if(local) lastSettings = local;

    const user = await getCurrentUser();
    if(!user) return local;

    const supabase = await getSupabase();
    if(!supabase) return local;

    try{
      const { data, error } = await supabase
        .from(SETTINGS_TABLE)
        .select("*")
        .eq("user_id", user.id)
        .eq("is_active", true)
        .maybeSingle();

      if(error) throw error;

      if(data){
        lastSettings = data;
        writeLocalSettings(data);
        return data;
      }
    }catch(error){
      console.warn("Supabase radyo ayarı okunamadı:", error);
    }

    return local;
  }

  function settingsFromCurrent(track, audio){
    const selectedChannels = findRadioChannels(lastSelection.genres, lastSelection.languages).map((channel) => channel.id);

    return {
      genres:uniq(lastSelection.genres),
      languages:uniq(lastSelection.languages),
      selected_channel_ids:selectedChannels,
      shuffle_enabled:!!shuffleEnabled,
      last_track_url:track?.audio_url || audio?.src || "",
      last_track_title:track?.title || "",
      last_channel_id:track?.channel_id || activeChannel?.id || "",
      last_position_seconds:Math.floor(Number(audio?.currentTime || 0)),
      is_active:true
    };
  }

  async function persistSettings(settings){
    lastSettings = { ...(lastSettings || {}), ...settings };
    writeLocalSettings(lastSettings);

    const user = await getCurrentUser();
    if(!user) return;

    const supabase = await getSupabase();
    if(!supabase) return;

    const payload = {
      ...lastSettings,
      user_id:user.id,
      is_active:true
    };

    try{
      const { error } = await supabase
        .from(SETTINGS_TABLE)
        .upsert(payload, { onConflict:"user_id" });

      if(error) throw error;
      lastSettings = payload;
      writeLocalSettings(payload);
    }catch(error){
      console.warn("Supabase radyo ayarı kaydedilemedi:", error);
    }
  }

  async function persistPlaybackState(doc, track, audio){
    if(!lastSelection.languages.length && !lastSelection.genres.length) return;
    await persistSettings(settingsFromCurrent(track || {}, audio || null));
  }

  function applySettings(settings){
    if(!settings) return false;

    lastSelection = {
      genres:uniq(settings.genres || []),
      languages:uniq(settings.languages || [])
    };

    shuffleEnabled = !!settings.shuffle_enabled;
    lastSettings = settings;

    return !!(lastSelection.genres.length || lastSelection.languages.length);
  }

  async function saveRadio(doc){
    const genres = selectedValues(doc,"genres");
    const languages = selectedValues(doc,"languages");

    if(!genres.length || !languages.length){
      console.warn("Radyo kaydı için en az bir tür ve bir dil seçilmeli.");
      return;
    }

    lastSelection = { genres, languages };
    closeModal(doc);
    showPlayer(doc);

    doc.getElementById("icanyRadioPlayer")?.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

    await loadRadioTracksBySelection(genres,languages);

    const audio = doc.getElementById("icanyRadioAudio");

    if(audio && tracks.length){
      currentTrackIndex = 0;
      const track = tracks[0];
      audio.src = track.audio_url;
      audio.load();
      buildLyricsForTrack(track);
      renderKaraoke(doc);
      updatePlayerLanguageBadge(doc, track);
      await persistSettings(settingsFromCurrent(track, audio));

      if(typeof doc.__icanyPlayCurrent === "function"){
        await doc.__icanyPlayCurrent();
      }
    }else{
      console.warn("Seçili radyo havuzunda çalınacak parça bulunamadı.");
      await persistSettings(settingsFromCurrent({}, audio));
    }
  }

  function showPlayer(doc){
    createPlayer(doc);
    createKaraokeModal(doc);

    const player = doc.getElementById("icanyRadioPlayer");
    player?.classList.add("show");

    const shuffleBtn = doc.getElementById("icanyShuffleBtn");
    shuffleBtn?.classList.toggle("active", !!shuffleEnabled);
  }

  async function restorePlayerFromSettings(doc, settings){
    if(!settings || !applySettings(settings)) return;

    showPlayer(doc);
    await loadRadioTracksBySelection(lastSelection.genres, lastSelection.languages);

    const audio = doc.getElementById("icanyRadioAudio");
    if(!audio || !tracks.length) return;

    let index = tracks.findIndex((track) => track.audio_url === settings.last_track_url);
    if(index < 0) index = tracks.findIndex((track) => track.channel_id === settings.last_channel_id);
    currentTrackIndex = index >= 0 ? index : 0;

    const track = tracks[currentTrackIndex];
    audio.src = track.audio_url;
    audio.load();

    const pos = Number(settings.last_position_seconds || 0);
    if(Number.isFinite(pos) && pos > 0){
      audio.addEventListener("loadedmetadata", () => {
        try { audio.currentTime = Math.min(pos, audio.duration || pos); } catch {}
      }, { once:true });
    }

    buildLyricsForTrack(track);
    renderKaraoke(doc);
    updatePlayerLanguageBadge(doc, track);
  }

  async function patchHome(){
    const doc = getDoc();
    if(!doc || !doc.body) return;

    boot?.remove();

    injectStyle(doc);
    await loadChannelIndex();
    createSetupCard(doc);
    createModal(doc);
    createKaraokeModal(doc);
    reorderCards(doc);

    const saved = await loadSavedSettings();
    if(saved){
      await restorePlayerFromSettings(doc, saved);
    }
  }

  frame.addEventListener("load", () => {
    setTimeout(patchHome,600);
    setTimeout(patchHome,1400);
    setTimeout(patchHome,2600);
  });
})();
</script>
