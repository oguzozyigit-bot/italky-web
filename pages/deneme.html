<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>italkyAI Face to Face</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.section{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

.top{
background:#111;
border-bottom:1px solid #333;
}

.bottom{
background:#000;
}

.lang{
font-size:20px;
opacity:0.7;
margin-bottom:10px;
}

.text{
font-size:26px;
text-align:center;
margin-bottom:20px;
}

button{
background:#2563eb;
border:none;
color:white;
padding:18px 30px;
font-size:20px;
border-radius:40px;
cursor:pointer;
}

.controls{
position:fixed;
bottom:10px;
left:0;
right:0;
display:flex;
justify-content:center;
gap:20px;
}

.ctrl{
background:#222;
padding:10px 15px;
border-radius:20px;
font-size:14px;
}

</style>
</head>

<body>

<div class="section top">

<div class="lang">🇹🇷 Türkçe</div>

<div class="text" id="trText">
Konuşmak için mikrofona bas
</div>

<button onclick="speakTR()">🎤 Konuş</button>

</div>

<div class="section bottom">

<div class="lang">🇬🇧 English</div>

<div class="text" id="enText">
Press microphone to speak
</div>

<button onclick="speakEN()">🎤 Speak</button>

</div>

<div class="controls">

<div class="ctrl">🔄 Dilleri Değiştir</div>
<div class="ctrl">🔊 Ses</div>
<div class="ctrl">❌ Çık</div>

</div>

<script>

function speakTR(){
document.getElementById("trText").innerText="Merhaba nasılsınız?";
document.getElementById("enText").innerText="Hello how are you?";
}

function speakEN(){
document.getElementById("enText").innerText="Where are you from?";
document.getElementById("trText").innerText="Nerelisiniz?";
}

</script>

</body>
</html>
