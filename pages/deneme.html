<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --glass-border: rgba(255,255,255,0.12);
  --blue: #60a5fa;
  --green: #34d399;
  --purple: #c084fc;
  --gold: #fbbf24;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: radial-gradient(circle at 50% 30%, #0d0d2b 0%, #000 100%);
}

.main-hub {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px 14px;
  min-height: 0; /* ✅ Kural Seti */
}

/* ===== CYBER CARD ENHANCED ===== */
.cyber-card {
  flex: 1;
  position: relative;
  border-radius: 30px;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(20px);
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.cyber-card:active { transform: scale(0.97); filter: brightness(1.3); }

/* Kenar Işıması (Neon Border Glow) */
.cyber-card::after {
  content: ""; position: absolute; inset: 0;
  border-radius: 30px; padding: 1.5px;
  background: var(--card-grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  opacity: 0.4;
}

/* ===== CARD THEMES (Daha Canlı) ===== */
.tr-card { --card-grad: linear-gradient(to right, var(--blue), #ec4899); }
.ac-card { --card-grad: linear-gradient(to right, var(--green), var(--gold)); }
.tc-card { --card-grad: linear-gradient(to right, var(--purple), #f43f5e); }

/* ===== MULTICOLOR EQ (RENGARENK) ===== */
.eq-container {
  position: absolute; left: 0; bottom: 0; width: 100%; height: 35px;
  display: flex; align-items: flex-end; justify-content: space-around;
  padding: 0 20px; opacity: 0.5; pointer-events: none;
}
.eq-bar {
  width: 4px; height: 5px; border-radius: 2px 2px 0 0;
  animation: eq-bounce 0.6s infinite alternate ease-in-out;
}
/* Rengarenk Çubuklar */
.eq-bar:nth-child(4n+1) { background: #60a5fa; animation-delay: 0.1s; }
.eq-bar:nth-child(4n+2) { background: #34d399; animation-delay: 0.3s; }
.eq-bar:nth-child(4n+3) { background: #ec4899; animation-delay: 0.2s; }
.eq-bar:nth-child(4n+4) { background: #fbbf24; animation-delay: 0.4s; }

@keyframes eq-bounce {
  from { height: 5px; }
  to { height: 30px; }
}

/* ===== SOLAR SYSTEM (CORE) ===== */
.solar {
  width: 75px; height: 75px; position: relative; flex-shrink: 0; margin-right: 18px;
}
.sun-core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--sun-color);
  box-shadow: 0 0 25px var(--sun-color);
  animation: core-pulse 2s infinite alternate;
}
@keyframes core-pulse {
  from { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
  to { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}
.orbit-path {
  position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.05); border-radius: 50%;
  animation: rotate 5s linear infinite;
}
.orbit-path::after {
  content: ""; position: absolute; top: -3px; left: 50%; width: 6px; height: 6px;
  background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff;
}
@keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }

.tr-card { --sun-color: #60a5fa; }
.ac-card { --sun-color: #34d399; }
.tc-card { --sun-color: #c084fc; }

/* ===== CONTENT ===== */
.card-content { flex: 1; z-index: 5; }
.card-title {
  font-family: 'Space Grotesk'; font-size: 22px; font-weight: 800; color: #fff; margin: 0;
}
.card-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-desc {
  font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 5px; font-weight: 600;
}

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="cyber-card tr-card" id="btnTranslate">
      <div class="solar">
        <div class="sun-core"></div>
        <div class="orbit-path"></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Translate <span>AI</span></h2>
        <p class="card-desc">F2F • Walkie Talkie • OCR Metin Çeviri</p>
      </div>
      <div class="eq-container">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>

    <div class="cyber-card ac-card" id="btnAcademy">
      <div class="solar">
        <div class="sun-core"></div>
        <div class="orbit-path" style="animation-direction: reverse; animation-duration: 7s;"></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Academy <span>AI</span></h2>
        <p class="card-desc">Dil Eğitimi • AI Pratik • Gamification</p>
      </div>
      <div class="eq-container">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>

    <div class="cyber-card tc-card" id="btnTeacher">
      <div class="solar">
        <div class="sun-core"></div>
        <div class="orbit-path" style="animation-duration: 4s;"></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Teacher <span>AI</span></h2>
        <p class="card-desc">Ödev Yardımı • Soru Çözümü • Özel Ders</p>
      </div>
      <div class="eq-container">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);

  $("btnTranslate").onclick = () => location.href = "/pages/translate_home.html";
  $("btnAcademy").onclick   = () => location.href = "/pages/academy_home.html";
  $("btnTeacher").onclick   = () => location.href = "/pages/helper_home.html";
</script>
</body>
</html>
