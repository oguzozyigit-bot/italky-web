<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum OS</title>

<style>
  html,body{ background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif; color:#fff; }
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --neon-blue: #00d2ff;
  --neon-pink: #ff007f;
  --neon-green: #39ff14;
}

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 50%, #050515 0%, #000 100%);
  position: relative;
}

/* ===== 1. ARKA PLAN DATA STREAM (RADAR) ===== */
.radar-bg {
  position: absolute; inset: 0;
  background-image: 
    radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 60%),
    repeating-linear-gradient(rgba(255,255,255,0.02) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px);
  pointer-events: none;
}

.scan-pulse {
  position: absolute; width: 150vw; height: 150vw;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 210, 255, 0.1) 90deg, transparent 180deg);
  animation: radarRotate 6s linear infinite;
}
@keyframes radarRotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

/* ===== 2. KONTROL TERMİNALİ (HOLOGRAFİK MODÜLLER) ===== */
.terminal-hub {
  flex: 1; display: flex; flex-direction: column;
  justify-content: space-around; padding: 30px 20px; z-index: 10;
}

.module-node {
  position: relative; display: flex; align-items: center; gap: 20px;
  cursor: pointer; transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
}

.node-icon {
  width: 60px; height: 60px; border-radius: 50%;
  border: 2px solid var(--neon-color);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px var(--neon-color), inset 0 0 10px var(--neon-color);
  font-size: 24px; position: relative;
}
/* İkon etrafındaki dönen halka */
.node-icon::after {
  content: ""; position: absolute; inset: -10px; border: 1px dashed var(--neon-color);
  border-radius: 50%; animation: spin 10s linear infinite; opacity: 0.5;
}

.node-info { flex: 1; }
.node-info h2 { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -1px; }
.node-info p { font-size: 11px; color: rgba(255,255,255,0.5); margin: 5px 0 0; text-transform: uppercase; letter-spacing: 2px; }

/* Renk Temaları */
.node-tr { --neon-color: var(--neon-blue); }
.node-ac { --neon-color: var(--neon-green); }
.node-tc { --neon-color: var(--neon-pink); }

.module-node:active { transform: scale(0.9) translateX(10px); }

/* Veri Akış Hattı */
.connector {
  position: absolute; left: 30px; top: 60px; height: calc(100% - 30px);
  width: 1px; background: linear-gradient(to bottom, var(--neon-blue), var(--neon-green), var(--neon-pink));
  opacity: 0.3;
}

/* Alt Bar (Status) */
.status-bar {
  height: 40px; padding: 0 20px; display: flex; align-items: center;
  justify-content: space-between; font-size: 10px; font-weight: 900;
  background: rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1);
  color: var(--neon-blue); letter-spacing: 1px;
}

@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
</style>
</head>

<body>
<main id="pageContent">
  <div class="radar-bg"></div>
  <div class="scan-pulse"></div>

  <div class="terminal-hub">
    <div class="connector"></div>

    <div class="module-node node-tr" onclick="location.href='/pages/translate_home.html'">
      <div class="node-icon">📡</div>
      <div class="node-info">
        <h2>Translate<span>.OS</span></h2>
        <p>Quantum Language Decoder</p>
      </div>
    </div>

    <div class="module-node node-ac" onclick="location.href='/pages/academy_home.html'">
      <div class="node-icon">🧠</div>
      <div class="node-info">
        <h2>Academy<span>.OS</span></h2>
        <p>Neural Path Optimizer</p>
      </div>
    </div>

    <div class="module-node node-tc" onclick="location.href='/pages/helper_home.html'">
      <div class="node-icon">🧬</div>
      <div class="node-info">
        <h2>Teacher<span>.OS</span></h2>
        <p>Logic Core Solver</p>
      </div>
    </div>
  </div>

  <footer class="status-bar">
    <div>SYSTEM: ONLINE</div>
    <div>LATENCY: 0.003 MS</div>
    <div>CORE: OZYIGIT_ALGO</div>
  </footer>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
