<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Meeting</title>
  <meta name="theme-color" content="#081a36"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#081a36;
      --bg2:#0b2246;
      --line:rgba(255,255,255,.08);
      --line2:rgba(125,190,255,.18);
      --txt:#f7fbff;
      --muted:rgba(255,255,255,.62);
      --green:#32d399;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --header-h:84px;
      --footer-h:52px;
      --composer-h:92px;
      --keyboard-offset:0px;
      --u1:#84d6ff;
      --u2:#8af09f;
      --u3:#ffb86a;
      --u4:#f78cff;
      --u5:#73ebff;
      --u6:#ffd76f;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit,Arial,sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 12% 0%, rgba(120,190,255,.16), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(118,235,255,.08), transparent 18%),
        linear-gradient(180deg,#061325 0%, #081a36 58%, #07152c 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.08;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:100% 3px, 3px 100%;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:100dvh;
      margin:0 auto;
      overflow:hidden;
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 18px 40px rgba(0,0,0,.24);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      z-index:30;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(10px + var(--safe-top)) 16px 10px;
      display:grid;
      grid-template-columns:56px 1fr 82px;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg, rgba(8,26,54,.96), rgba(8,26,54,.78));
      backdrop-filter:blur(16px);
    }

    .icon-btn,.send-btn,.mic-btn,.speaker-btn,.copy-btn,.close-btn{
      border:none;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .icon-btn{
      width:56px;
      height:56px;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg,
    .speaker-btn svg,
    .copy-btn svg,
    .close-btn svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      text-align:center;
      line-height:1;
      user-select:none;
    }

    .brand-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:26px;
      font-weight:800;
      letter-spacing:-.6px;
      color:#fff;
    }

    .brand-title .ai{
      background:linear-gradient(135deg,#8fddff 0%,#83b5ff 46%,#c18dff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin-top:4px;
      font-size:10px;
      font-weight:900;
      letter-spacing:3px;
      color:rgba(255,255,255,.25);
    }

    .count-pill{
      height:58px;
      border-radius:20px;
      border:1px solid rgba(143,215,255,.20);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .count-num{
      font-size:22px;
      font-weight:1000;
      line-height:1;
    }

    .count-label{
      margin-top:4px;
      font-size:11px;
      font-weight:900;
      color:#def7ff;
      line-height:1;
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .meeting-top{
      flex:0 0 auto;
      padding:14px 14px 10px;
      background:linear-gradient(180deg, rgba(8,26,54,.84), rgba(8,26,54,.14));
      backdrop-filter:blur(8px);
    }

    .meeting-card{
      border-radius:28px;
      border:1px solid var(--line2);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      padding:14px 14px 12px;
    }

    .meeting-title{
      font-size:18px;
      font-weight:1000;
      color:#fff;
      margin-bottom:12px;
    }

    .participants-strip{
      display:flex;
      gap:12px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      padding-bottom:2px;
    }

    .participants-strip::-webkit-scrollbar{ display:none; }

    .participant-chip{
      min-width:60px;
      max-width:64px;
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .participant-avatar{
      width:50px;
      height:50px;
      border-radius:50%;
      overflow:hidden;
      background:linear-gradient(135deg,#2457a3,#4d8fff);
      border:2px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:16px;
      font-weight:1000;
      position:relative;
    }

    .participant-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .participant-avatar::after{
      content:"";
      position:absolute;
      right:2px;
      bottom:2px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--green);
      border:2px solid #0b1f3d;
    }

    .participant-name{
      width:100%;
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:#eef8ff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.1;
    }

    .chat-scroll{
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      padding:10px 14px calc(var(--composer-h) + 24px + var(--keyboard-offset));
      scroll-behavior:smooth;
    }

    .chat-scroll::-webkit-scrollbar{ display:none; }

    .chat-feed{
      min-height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      gap:10px;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.mine{ justify-content:flex-start; }
    .msg.other{ justify-content:flex-end; }
    .msg.system{ justify-content:center; }

    .msg-block{
      max-width:76%;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .msg-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .msg.mine .msg-row{ justify-content:flex-start; }
    .msg.other .msg-row{ justify-content:flex-end; flex-direction:row-reverse; }

    .bubble{
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:52px;
      padding:14px 14px 14px 16px;
      border-radius:26px;
      background:linear-gradient(180deg, rgba(10,24,49,.96), rgba(9,21,43,.96));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 8px 22px rgba(0,0,0,.16);
    }

    .bubble::before{
      content:"";
      position:absolute;
      left:0;
      top:10px;
      bottom:10px;
      width:4px;
      border-radius:999px;
      background:var(--line-color,#8cd7ff);
    }

    .msg.other .bubble::before{
      left:auto;
      right:0;
    }

    .bubble-text{
      flex:1 1 auto;
      min-width:0;
      font-size:15px;
      font-weight:900;
      line-height:1.45;
      color:#fff;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .speaker-btn{
      width:40px;
      height:40px;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .msg-author{
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.72);
      padding:0 4px;
    }

    .msg.mine .msg-author{ text-align:left; }
    .msg.other .msg-author{ text-align:right; }

    .system-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(104,225,255,.10);
      border:1px solid rgba(104,225,255,.18);
      color:#dff8ff;
      font-size:12px;
      font-weight:1000;
      text-align:center;
    }

    .composer-wrap{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      z-index:12;
      transform:translateY(calc(-1 * var(--keyboard-offset)));
      transition:transform .15s ease;
    }

    .composer{
      min-height:76px;
      display:flex;
      align-items:flex-end;
      gap:10px;
      padding:12px 14px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      backdrop-filter:blur(14px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:120px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:900;
      line-height:1.4;
      font-family:inherit;
      overflow:auto;
      scrollbar-width:none;
    }

    .composer-input::-webkit-scrollbar{ display:none; }

    .composer-input::placeholder{
      color:rgba(255,255,255,.70);
      font-weight:900;
    }

    .send-btn,.mic-btn{
      width:46px;
      height:46px;
      border-radius:18px;
      flex:0 0 auto;
    }

    .mic-btn{
      background:transparent;
    }

    .send-btn{
      background:#fff;
      color:#06101f;
      box-shadow:0 0 24px rgba(255,255,255,.08);
    }

    .hidden{ display:none !important; }

    .footer{
      position:absolute;
      inset:auto 0 0 0;
      z-index:20;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:12px 14px calc(12px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(7,22,47,.88);
      backdrop-filter:blur(14px);
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:12px;
      font-weight:1000;
      text-align:center;
      flex-wrap:wrap;
    }

    .seal-main{
      background:linear-gradient(135deg,#7fd8ff 0%,#82b8ff 45%,#d29bff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .seal-dot{ color:rgba(255,255,255,.28); }
    .seal-year{ color:#bde9ff; }

    .drawer-layer,.lang-layer{
      position:absolute;
      inset:0;
      z-index:120;
      pointer-events:none;
    }

    .drawer-layer.open,.lang-layer.open{
      pointer-events:auto;
    }

    .drawer-backdrop,.lang-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(4px);
      opacity:0;
      transition:opacity .24s ease;
    }

    .drawer-layer.open .drawer-backdrop,
    .lang-layer.open .lang-backdrop{
      opacity:1;
    }

    .drawer-panel{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:min(88vw,360px);
      transform:translateX(-105%);
      transition:transform .26s ease;
      background:linear-gradient(180deg, rgba(8,20,41,.98), rgba(7,17,34,.98));
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:18px 0 36px rgba(0,0,0,.28);
      padding:calc(16px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .drawer-panel::-webkit-scrollbar{ display:none; }
    .drawer-layer.open .drawer-panel{ transform:translateX(0); }

    .lang-panel{
      position:absolute;
      left:16px;
      right:16px;
      bottom:20px;
      max-height:70vh;
      overflow:hidden;
      transform:translateY(120%);
      transition:transform .26s ease;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(11,24,47,.98), rgba(8,20,40,.98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 18px 40px rgba(0,0,0,.28);
      display:flex;
      flex-direction:column;
    }

    .lang-layer.open .lang-panel{ transform:translateY(0); }

    .drawer-head,.lang-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:4px 2px 2px;
    }

    .drawer-title,.lang-title{
      font-size:20px;
      font-weight:1000;
      color:#fff;
    }

    .close-btn{
      width:46px;
      height:46px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .card{
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      padding:14px;
    }

    .mini-label{
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.9px;
      color:rgba(255,255,255,.48);
      margin-bottom:10px;
    }

    .profile-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .drawer-avatar{
      width:60px;
      height:60px;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(135deg,#2b68c1,#62a3ff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:1000;
      color:#fff;
      flex:0 0 auto;
    }

    .drawer-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-name{
      font-size:15px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .profile-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:900;
      color:#dff4ff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .value-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .value-pill{
      min-height:48px;
      flex:1;
      border-radius:18px;
      padding:0 14px;
      display:flex;
      align-items:center;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      font-size:16px;
      font-weight:1000;
      color:#fff;
    }

    .copy-btn{
      width:48px;
      height:48px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .lang-trigger,.join-input,.primary-btn{
      width:100%;
      min-height:52px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      outline:none;
      font-family:inherit;
      font-size:16px;
      font-weight:900;
    }

    .lang-trigger{
      background:rgba(255,255,255,.04);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      cursor:pointer;
      gap:12px;
    }

    .lang-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .lang-flag{
      font-size:21px;
      line-height:1;
    }

    .lang-name{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .join-input{
      background:rgba(255,255,255,.04);
      color:#fff;
      padding:0 16px;
    }

    .join-input::placeholder{
      color:rgba(255,255,255,.42);
    }

    .primary-btn{
      border:none;
      background:linear-gradient(135deg,#8ad8ff 0%, #74dfff 100%);
      color:#07162f;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(116,223,255,.18);
    }

    .lang-list{
      padding:0 0 10px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .lang-list::-webkit-scrollbar{ display:none; }

    .lang-option{
      width:100%;
      min-height:60px;
      padding:0 18px;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      border-top:1px solid rgba(255,255,255,.05);
      font-family:inherit;
    }

    .lang-option:first-child{ border-top:none; }

    .lang-option-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .lang-option-name{
      font-size:16px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lang-check{
      width:22px;
      height:22px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.34);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .lang-option.active .lang-check{
      border-color:#79e9ff;
    }

    .lang-option.active .lang-check::after{
      content:"";
      width:10px;
      height:10px;
      border-radius:50%;
      background:#79e9ff;
    }

    .toast{
      position:absolute;
      left:50%;
      bottom:calc(var(--footer-h) + var(--safe-bottom) + 14px);
      transform:translateX(-50%) translateY(120px);
      z-index:180;
      min-width:160px;
      max-width:86%;
      padding:12px 16px;
      border-radius:999px;
      text-align:center;
      font-size:13px;
      font-weight:1000;
      color:#fff;
      background:rgba(10,22,42,.94);
      border:1px solid rgba(122,216,255,.24);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      transition:transform .22s ease, opacity .22s ease;
      opacity:0;
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }
  </style>
</head>
<body>

<div id="pageContent">
  <div class="app">

    <header class="header">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menü">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 17h16"></path>
        </svg>
      </button>

      <div class="brand">
        <div class="brand-title">italky<span class="ai">AI</span></div>
        <div class="brand-sub">MEETING</div>
      </div>

      <div class="count-pill">
        <div class="count-num" id="participantCount">1</div>
        <div class="count-label">Kişi</div>
      </div>
    </header>

    <main class="main">
      <div class="meeting-top">
        <div class="meeting-card">
          <div class="meeting-title">Meeting</div>
          <div class="participants-strip" id="participantsStrip"></div>
        </div>
      </div>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-feed" id="chatFeed"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-center">
            <textarea id="messageInput" class="composer-input" rows="1" placeholder="Toplantıya mesaj yaz"></textarea>
          </div>

          <button id="micBtn" class="mic-btn" type="button" aria-label="Sesle yaz">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
              <path d="M19 11a7 7 0 0 1-14 0"></path>
              <path d="M12 18v3"></path>

    <div class="lang-layer" id="langLayer">

      <section class="lang-panel">
