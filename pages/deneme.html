<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --blue: #60a5fa; --green: #34d399; --purple: #c084fc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: #000;
}

.main-hub {
  flex: 1; display: flex; flex-direction: column;
  gap: 15px; padding: 15px; min-height: 0;
}

/* ===== BASE CARD ===== */
.cyber-card {
  flex: 1; position: relative; border-radius: 32px;
  overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 25px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.02);
  transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.cyber-card:active { transform: scale(0.96); filter: brightness(1.2); }

/* Content Layer */
.card-content { position: relative; z-index: 10; pointer-events: none; }
.card-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 800; color: #fff; margin: 0; }
.card-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

/* 1. TRANSLATE: LASER SCANNER (Dikey Veri Akışı) */
.tr-bg { background: linear-gradient(145deg, rgba(96,165,250,0.1), transparent); }
.scanner-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--blue); box-shadow: 0 0 15px var(--blue);
  animation: scanMove 3s infinite linear; opacity: 0.5;
}
@keyframes scanMove { 0% { left: 0%; } 100% { left: 100%; } }
.data-bits {
  position: absolute; inset: 0; display: flex; justify-content: space-around; opacity: 0.2;
}
.bit { width: 1px; height: 100%; background: linear-gradient(to bottom, transparent, var(--blue), transparent); animation: bitFall 2s infinite linear; }
@keyframes bitFall { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

/* 2. ACADEMY: KINETIC CUBES (Yükselen Bilgi Küpleri) */
.ac-bg { background: linear-gradient(145deg, rgba(52,211,153,0.1), transparent); }
.cube-box { position: absolute; inset: 0; overflow: hidden; }
.cube {
  position: absolute; bottom: -20px; width: 15px; height: 15px;
  border: 1px solid var(--green); border-radius: 4px;
  animation: cubeRise 4s infinite linear; opacity: 0.3;
}
@keyframes cubeRise { 
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  50% { opacity: 0.4; }
  100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
}

/* 3. TEACHER: FORMULA MATRIX (Parlayan Karakterler) */
.tc-bg { background: linear-gradient(145deg, rgba(192,132,252,0.1), transparent); }
.matrix-bg {
  position: absolute; right: 10px; top: 10px; bottom: 10px; width: 40%;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; opacity: 0.2;
}
.char { font-family: monospace; font-size: 10px; color: var(--purple); animation: charBlink 2s infinite; }
@keyframes charBlink { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); color: #fff; } }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="cyber-card tr-bg" onclick="location.href='/pages/translate_home.html'">
      <div class="scanner-line"></div>
      <div class="data-bits">
        <div class="bit" style="animation-delay: 0.1s"></div>
        <div class="bit" style="animation-delay: 0.5s"></div>
        <div class="bit" style="animation-delay: 1.2s"></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Translate <span>AI</span></h2>
        <p class="card-desc">Kuantum Veri Çevirici</p>
      </div>
    </div>

    <div class="cyber-card ac-bg" onclick="location.href='/pages/academy_home.html'">
      <div class="cube-box">
        <div class="cube" style="left: 20%; animation-delay: 0s"></div>
        <div class="cube" style="left: 50%; animation-delay: 1s"></div>
        <div class="cube" style="left: 80%; animation-delay: 2.5s"></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Academy <span>AI</span></h2>
        <p class="card-desc">Nöral Öğrenme Merkezi</p>
      </div>
    </div>

    <div class="cyber-card tc-bg" onclick="location.href='/pages/helper_home.html'">
      <div class="matrix-bg">
        <div class="char">∑</div><div class="char">π</div><div class="char">Ω</div><div class="char">√</div>
        <div class="char">Δ</div><div class="char">∫</div><div class="char">∞</div><div class="char">≈</div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Teacher <span>AI</span></h2>
        <p class="card-desc">Dinamik Çözüm Motoru</p>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
