<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Face to Face</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    html.two-phone-booting body,
    html.guide-booting body{
      background:#020617;
    }
    html.two-phone-booting body::before,
    html.guide-booting body::before{
      position:fixed;
      inset:0;
      z-index:2147483599;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:radial-gradient(circle at 50% 0%,rgba(59,130,246,.24),transparent 42%),linear-gradient(180deg,#020617,#050508);
      color:#dbeafe;
      font-family:Outfit,sans-serif;
      font-size:15px;
      font-weight:1000;
      letter-spacing:.2px;
      text-align:center;
    }
    html.two-phone-booting body::before{
      content:"İki Telefon hazırlanıyor...";
    }
    html.guide-booting body::before{
      content:"Gezi & Konferans hazırlanıyor...";
    }
    html.two-phone-booting .container,
    html.guide-booting .container{
      visibility:hidden;
      opacity:0;
    }
    html.two-phone-ready body::before{
      display:none;
    }

    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --composer-bg:rgba(12,14,20,.94);
      --composer-line:rgba(255,255,255,.09);
      --key-bg:#171a22;
      --key-line:rgba(255,255,255,.08);
      --key-active:rgba(99,102,241,.22);
      --key-text:#f5f7fb;
      --kb-bg:rgba(9,11,17,.97);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
      -webkit-user-select:none;
      user-select:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at top, rgba(236,72,153,.06), transparent 22%),
        radial-gradient(circle at bottom, rgba(99,102,241,.06), transparent 22%),
        #050508;
    }

    body.bt-active{ background:#020617; }
    body.bt-active .half-screen.top{ transform:none; border-bottom:1px solid rgba(255,255,255,.05); }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      overflow:hidden;
      min-height:0;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
      padding:10px 8px 8px;
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
      padding:6px 8px calc(6px + var(--safe-bottom));
    }

    .lang-row{
      width:100%;
      display:flex;
      justify-content:center;
      padding:0 6px;
      flex:0 0 auto;
      position:relative;
      z-index:3000;
      pointer-events:none;
    }

    .lang-row-inner{
      width:min(92vw, 420px);
      display:grid;
      grid-template-columns:1fr;
      align-items:center;
      gap:8px;
      margin:0 auto;
      position:relative;
      z-index:3001;
      pointer-events:auto;
    }

    .mode-toggle-inline{
      display:none !important;
    }

    .mode-toggle-inline-track{
      position:absolute;
      inset:0;
      border-radius:999px;
      opacity:.18;
      transition:.2s ease;
    }

    .mode-toggle-inline-thumb{
      position:relative;
      width:28px;
      height:28px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,.24);
      transition:transform .22s ease, background .22s ease;
      z-index:2;
    }

    .mode-toggle-inline-label{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:9px;
      font-weight:1000;
      letter-spacing:.4px;
      color:#fff;
      z-index:1;
      pointer-events:none;
    }

    .mode-toggle-inline.online .mode-toggle-inline-track{
      background:rgba(34,197,94,.95);
    }

    .mode-toggle-inline.online .mode-toggle-inline-thumb{
      transform:translateX(0);
      background:#ecfff3;
    }

    .mode-toggle-inline.offline .mode-toggle-inline-track{
      background:rgba(239,68,68,.95);
    }

    .mode-toggle-inline.offline .mode-toggle-inline-thumb{
      transform:translateX(36px);
      background:#fff0f2;
    }

    .lang-trigger{
      background:transparent;
      border:none;
      padding:8px 14px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:38px;
      width:min(70vw, 300px);
      text-decoration:none;
      flex:0 1 auto;
      white-space:nowrap;
      justify-self:center;
      pointer-events:auto;
      z-index:3002;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:5000;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{ display:flex; }

    .half-screen.top .popover{
      top:56px;
    }

    .half-screen.bottom .popover{
      bottom:56px;
    }

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      letter-spacing:.3px;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
    }

    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item:hover{ background:rgba(255,255,255,.06); }

    .pop-item.active{
      background:rgba(99,102,241,.14);
      border-color:rgba(99,102,241,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{ font-size:18px; }

    .pop-name{
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .pop-code{
      font-weight:900;
      font-size:12px;
      opacity:.7;
    }

    .chat-body{
      flex:1 1 auto;
      min-height:0;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:12px 0 20px;
      mask-image:linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:84%;
      line-height:1.25;
      word-break:break-word;
    }

    .bubble.them{
      opacity:.55;
      font-size:18px;
      font-weight:500;
    }

    .bubble.me{
      font-size:18px;
      font-weight:650;
      opacity:.82;
    }

    .bubble.me.is-latest{
      font-size:30px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble-row .txt{
      display:inline-block;
    }

    .spk-icon{
      width:30px;
      height:30px;
      min-width:30px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk-icon svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .composer-stack{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      z-index:30;
      padding-bottom:0;
      flex:0 0 auto;
    }

    .composer{
      width:auto;
      min-width:86px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0;
      min-height:86px;
      padding:8px;
      border-radius:999px;
      background:transparent;
      border:none;
      box-shadow:none;
      position:relative;
    }

    .composer.listening{
      box-shadow:none;
      animation:none;
    }

    @keyframes composerPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.006); }
    }

    .composer-center,
    .send-btn,
    .kb-wrap{
      display:none !important;
    }

    .composer-input{
      width:100%;
      min-height:24px;
      max-height:84px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:800;
      line-height:1.4;
      font-family:inherit;
      overflow:auto;
      padding:0;
      margin:0;
      scrollbar-width:none;
      text-align:left;
    }

    .composer-input::-webkit-scrollbar{ display:none; }

    .composer-input::placeholder{
      color:rgba(255,255,255,.72);
      font-weight:800;
    }

    .send-btn,.mic-btn{
      width:70px;
      height:70px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      position:relative;
      z-index:2;
      box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
    }

    .mic-btn.listening{
      background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12));
      box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:2px solid rgba(165,180,252,.78);
      box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}

    .send-btn svg,
    .mic-btn svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .hidden{ display:none !important; }

    .kb{
      width:100%;
      background:var(--kb-bg);
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:6px;
      box-shadow:0 16px 32px rgba(0,0,0,.30);
      position:relative;
    }

    .kb-row{
      display:flex;
      gap:4px;
      margin-bottom:4px;
    }

    .kb-row:last-child{ margin-bottom:0; }

    .kb-key{
      flex:1;
      min-width:0;
      min-height:42px;
      border:none;
      border-radius:12px;
      background:var(--key-bg);
      border:1px solid var(--key-line);
      color:var(--key-text);
      font-family:inherit;
      font-size:19px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 6px;
      position:relative;
      transition:transform .08s ease, background .12s ease, box-shadow .12s ease;
    }

    .kb-key:active,
    .kb-key.pressing{
      background:var(--key-active);
      transform:scale(.98);
      box-shadow:0 0 0 1px rgba(99,102,241,.28), 0 6px 16px rgba(99,102,241,.12);
    }

    .kb-key.wide{ flex:1.3; }
    .kb-key.xwide{ flex:2.2; }
    .kb-key.icon svg{
      width:20px;
      height:20px;
      stroke:#fff;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .alt-pop{
      position:absolute;
      bottom:calc(100% + 8px);
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:6px;
      padding:8px;
      border-radius:16px;
      background:rgba(8,10,16,.98);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 14px 24px rgba(0,0,0,.28);
      z-index:40;
    }

    .alt-key{
      min-width:42px;
      height:42px;
      border:none;
      border-radius:12px;
      background:#0f1420;
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      padding:0 10px;
    }

    .center-hub{
      height:82px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:fixed !important;
      top:50%;
      width:30px;
      height:118px;
      padding:0;
      background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-size:11px;
      font-weight:1000;
      cursor:pointer;
      z-index:1800;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s ease;
      transform:translateY(-50%);
      writing-mode:vertical-rl;
      text-orientation:upright;
      letter-spacing:1px;
      line-height:1.15;
    }

    #homeLink{
      right:0;
      left:auto !important;
      border-radius:18px 0 0 18px;
      border-right:none;
      box-shadow:-10px 0 32px rgba(0,0,0,.30);
    }

    #clearBtn{
      left:0;
      right:auto !important;
      border-radius:0 18px 18px 0;
      border-left:none;
      box-shadow:10px 0 32px rgba(0,0,0,.30);
    }

    .nav-btn:active{
      transform:translateY(-50%) scale(.96);
    }

    .nav-btn .label-rotate{
      display:inline-block;
      transform:none !important;
    }

    .btn-clear{ left:0; }
    #clearBtn{
      pointer-events:auto !important;
      z-index:2147483000 !important;
      isolation:isolate;
    }

    .premium-bt-only{ display:none; }
    body.premium-bt-mode .premium-bt-only{ display:flex; }

    .hub-btn{
      width:50px;
      height:50px;
      border-radius:50%;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.15);
      color:#fff;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:all .2s ease;
      box-shadow:0 14px 30px rgba(0,0,0,.24);
    }

    .hub-btn:active{ transform:scale(.94); }
    .hub-btn.connected{
      color:#93c5fd;
      border-color:rgba(147,197,253,.5);
      background:rgba(37,99,235,.18);
      box-shadow:0 0 18px rgba(37,99,235,.28);
    }

    .hf-btn{
      position:fixed;
      right:42px;
      bottom:calc(18px + var(--safe-bottom));
      min-height:38px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.15);
      color:rgba(255,255,255,.78);
      padding:8px 12px;
      align-items:center;
      gap:7px;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
      z-index:1700;
    }

    .hf-btn.active{
      background:rgba(168,85,247,.16);
      border-color:rgba(168,85,247,.5);
      color:#d8b4fe;
      box-shadow:0 0 18px rgba(168,85,247,.22);
    }

    .hf-btn svg{ width:16px; height:16px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

    .orb-container{
      width:82px;
      height:82px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:82px;
      height:82px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#6366f1;
      box-shadow:0 0 15px #6366f1;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#ec4899;
      box-shadow:0 0 15px #ec4899;
    }

    .ai-core{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.4px;
      font-size:13px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #frameRoot.is-listening .eq-wrap,
    #frameRoot.is-translating .eq-wrap{
      opacity:1;
    }

    #frameRoot.is-listening .logo-text,
    #frameRoot.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-gradient);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    .status-pill{ display:none; }

    #frameRoot.is-idle .ball-1,
    #frameRoot.is-idle .ball-2,
    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background:#ef4444;
      box-shadow:0 0 18px rgba(239,68,68,.9);
    }

    #frameRoot.is-listening .ball-1,
    #frameRoot.is-translating .ball-1{
      background:#6366f1;
      box-shadow:0 0 18px rgba(99,102,241,.95);
    }

    #frameRoot.is-listening .ball-2,
    #frameRoot.is-translating .ball-2{
      background:#ec4899;
      box-shadow:0 0 18px rgba(236,72,153,.95);
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background:#22c55e;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    #frameRoot.to-top .orb-container{ transform:rotate(180deg); }
    #frameRoot.to-bot .orb-container{ transform:rotate(0deg); }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999999;
      padding:20px;
    }

    .modal.open,
    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(100%, 420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
