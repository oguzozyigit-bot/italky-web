<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Kuantum Vizör</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --glass: rgba(255,255,255,.10);
  --muted: rgba(255,255,255,.55);
}

html,body{margin:0;background:#000;font-family:'Outfit',sans-serif;overflow:hidden;}

#pageContent{
  height:100vh;
  background: radial-gradient(circle at 50% 30%, #150520 0%, #000 100%);
  position:relative;
}

.stage{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
}

#wrap{
  position:relative;
  width:min(92vw, 900px);
  height:min(72vh, 760px);
  border-radius:28px;
  border:1px solid rgba(255,255,255,.12);
  overflow:hidden;
  background:rgba(0,0,0,.35);
  box-shadow: 0 20px 60px rgba(0,0,0,.65);
}

#photo{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  background:#000;
}

#overlay{
  position:absolute; inset:0;
  width:100%; height:100%;
  touch-action:none;
}

#hint{
  position:absolute;
  top:14px; left:50%;
  transform:translateX(-50%);
  z-index:20;
  background: var(--ai-grad);
  padding:10px 14px;
  border-radius:999px;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
  box-shadow: 0 12px 30px rgba(236,72,153,.25);
  animation:pulse 1.1s infinite alternate;
}
@keyframes pulse{from{opacity:.65; transform:translateX(-50%) scale(.98)} to{opacity:1; transform:translateX(-50%) scale(1)}}

#topbar{
  position:absolute; left:0; right:0; bottom:0;
  z-index:30;
  display:flex; gap:10px;
  padding:12px;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 40%, rgba(0,0,0,.75) 100%);
}

.btn{
  flex:1;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.35);
  color:#fff;
  padding:12px 12px;
  font-weight:900;
  letter-spacing:.6px;
}
.btn:active{transform:scale(.98)}
.btn.primary{
  background: var(--ai-grad);
  border-color: transparent;
}
.btn.small{flex:0 0 auto; padding:12px 14px}

#result{
  position:absolute;
  top:14px; right:14px;
  z-index:25;
  width:min(44vw, 380px);
  max-height:40vh;
  overflow:auto;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding:12px;
  display:none;
}
#result h3{
  margin:0 0 6px 0;
  font-family:'Space Grotesk';
  font-size:14px;
}
#result .muted{color:var(--muted); font-size:12px; line-height:1.35}
#result .ans{
  margin-top:10px;
  font-weight:900;
  font-size:14px;
  background: rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:10px;
  border-radius:14px;
}
#result .steps{
  margin-top:10px;
  font-size:12px;
  color:rgba(255,255,255,.85);
  line-height:1.45;
}
.badge{
  display:inline-block;
  font-size:10px;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(0,0,0,.25);
  color:rgba(255,255,255,.85);
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="stage">
    <div id="wrap">
      <div id="hint">👇 PARMAĞINLA SORUYU ÇERÇEVELE</div>
      <img id="photo" alt="photo"/>
      <canvas id="overlay"></canvas>

      <div id="result">
        <h3>italkyAI Çözüm</h3>
        <div class="muted" id="topicLine"></div>
        <div class="ans" id="finalAnswer"></div>
        <div class="steps" id="steps"></div>
      </div>

      <div id="topbar">
        <button class="btn small" id="btnBack">⬅︎ Geri</button>
        <button class="btn" id="btnReset">Seçimi Sıfırla</button>
        <button class="btn primary" id="btnSolve">Çözümü Al</button>
      </div>
    </div>
  </div>
</main>

<script type="module">
  // Shell kullanıyorsan kalsın; yoksa zarar vermez.
  try{
    const mod = await import("/js/ui_shell.js");
    if(mod && mod.mountShell) mod.mountShell({ scroll:"none" });
  }catch(e){}

  const photo = document.getElementById("photo");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");

  const btnBack  = document.getElementById("btnBack");
  const btnReset = document.getElementById("btnReset");
  const btnSolve = document.getElementById("btnSolve");

  const resultBox = document.getElementById("result");
  const topicLine = document.getElementById("topicLine");
  const finalAnswer = document.getElementById("finalAnswer");
  const stepsEl = document.getElementById("steps");

  let drag = {active:false, x0:0, y0:0, x1:0, y1:0};

  // 1) Foto: sessionStorage'dan al
  const stored = sessionStorage.getItem("exam_photo");
  if(!stored){
    // Foto yoksa geri dön
    location.replace("/pages/teacher_terminal.html");
  } else {
    photo.src = stored;
  }

  function fitCanvasToImageBox(){
    // canvas, wrap içini kaplıyor; biz rect'i canvas üzerinden alacağız.
    const r = canvas.getBoundingClientRect();
    canvas.width  = Math.max(1, Math.round(r.width));
    canvas.height = Math.max(1, Math.round(r.height));
    drawOverlay(); // ilk çizim
  }

  window.addEventListener("resize", ()=>fitCanvasToImageBox());

  photo.onload = ()=>{
    // img yüklenince canvas ölç
    setTimeout(()=>fitCanvasToImageBox(), 50);
  };

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function getRect(){
    const x = Math.min(drag.x0, drag.x1);
    const y = Math.min(drag.y0, drag.y1);
    const w = Math.abs(drag.x1 - drag.x0);
    const h = Math.abs(drag.y1 - drag.y0);
    return {x,y,w,h};
  }

  function drawOverlay(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // darken whole
    ctx.fillStyle = "rgba(0,0,0,0.60)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const {x,y,w,h} = getRect();

    // if rect too small, don't clear center
    if(w > 6 && h > 6){
      // clear selection window
      ctx.clearRect(x,y,w,h);

      // neon stroke
      const grad = ctx.createLinearGradient(x,y,x+w,y+h);
      grad.addColorStop(0, "#a855f7");
      grad.addColorStop(1, "#ec4899");

      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.shadowColor = "#ec4899";
      ctx.shadowBlur = 18;
      ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
      ctx.shadowBlur = 0;
    }
  }

  function pointerPos(e){
    const r = canvas.getBoundingClientRect();
    return {
      x: clamp(e.clientX - r.left, 0, r.width),
      y: clamp(e.clientY - r.top, 0, r.height),
    };
  }

  canvas.addEventListener("pointerdown", (e)=>{
    const p = pointerPos(e);
    drag.active = true;
    drag.x0 = drag.x1 = p.x;
    drag.y0 = drag.y1 = p.y;
    hint.style.display = "none";
    resultBox.style.display = "none";
    canvas.setPointerCapture(e.pointerId);
    drawOverlay();
  });

  canvas.addEventListener("pointermove", (e)=>{
    if(!drag.active) return;
    const p = pointerPos(e);
    drag.x1 = p.x;
    drag.y1 = p.y;
    drawOverlay();
  });

  canvas.addEventListener("pointerup", (e)=>{
    drag.active = false;
    drawOverlay();
  });

  function resetSelection(){
    drag = {active:false, x0:0, y0:0, x1:0, y1:0};
    hint.style.display = "block";
    resultBox.style.display = "none";
    drawOverlay();
  }

  btnReset.onclick = resetSelection;

  btnBack.onclick = ()=>{
    // foto tekrar çekmek istersen saklamaya devam edebiliriz
    // ama temizlemek daha mantıklı:
    try{ sessionStorage.removeItem("exam_photo"); }catch(e){}
    location.href = "/pages/teacher_terminal.html";
  };

  async function cropToBase64Jpeg(){
    const {x,y,w,h} = getRect();
    if(w < 20 || h < 20) throw new Error("Seçim çok küçük");

    // Biz canvas üstünde çiziyoruz ama foto object-fit: contain.
    // Doğru kırpma için: görüntünün wrap içinde kapladığı gerçek alanı bulmamız lazım.
    const wrap = document.getElementById("wrap");
    const wrapRect = wrap.getBoundingClientRect();

    // image'ın wrap içinde contain ile çizildiği gerçek kutu:
    const imgW = photo.naturalWidth;
    const imgH = photo.naturalHeight;

    const boxW = canvas.width;
    const boxH = canvas.height;

    const imgRatio = imgW / imgH;
    const boxRatio = boxW / boxH;

    let drawW, drawH, offsetX, offsetY;
    if(imgRatio > boxRatio){
      // full width
      drawW = boxW;
      drawH = boxW / imgRatio;
      offsetX = 0;
      offsetY = (boxH - drawH) / 2;
    }else{
      // full height
      drawH = boxH;
      drawW = boxH * imgRatio;
      offsetY = 0;
      offsetX = (boxW - drawW) / 2;
    }

    // seçimin image alanıyla kesişimini al
    const selX = x - offsetX;
    const selY = y - offsetY;

    const sx = clamp(selX, 0, drawW);
    const sy = clamp(selY, 0, drawH);
    const sw = clamp(w, 0, drawW - sx);
    const sh = clamp(h, 0, drawH - sy);

    if(sw < 20 || sh < 20) throw new Error("Seçim görsel alanının dışında");

    // display-space -> natural-space
    const scaleX = imgW / drawW;
    const scaleY = imgH / drawH;

    const cropX = sx * scaleX;
    const cropY = sy * scaleY;
    const cropW = sw * scaleX;
    const cropH = sh * scaleY;

    const t = document.createElement("canvas");
    t.width = Math.max(1, Math.round(cropW));
    t.height = Math.max(1, Math.round(cropH));
    const tctx = t.getContext("2d");

    tctx.drawImage(photo, cropX, cropY, cropW, cropH, 0, 0, t.width, t.height);

    return t.toDataURL("image/jpeg", 0.9);
  }

  function showResult(data){
    resultBox.style.display = "block";
    const topic = data.topic ? String(data.topic) : "";
    topicLine.innerHTML = topic ? `<span class="badge">${topic}</span>` : `<span class="badge">Konu: (tespit ediliyor)</span>`;

    finalAnswer.textContent = data.final_answer ? String(data.final_answer) : "Cevap oluşturulamadı";

    const steps = Array.isArray(data.explanation_steps) ? data.explanation_steps : [];
    stepsEl.innerHTML = steps.length
      ? steps.map(s=>`• ${String(s)}`).join("<br>")
      : `<span class="muted">Adımlar gelmedi. (Engine/endpoint kontrol)</span>`;
  }

  btnSolve.onclick = async ()=>{
    btnSolve.disabled = true;
    btnSolve.textContent = "ÇÖZÜLÜYOR…";

    try{
      const base64 = await cropToBase64Jpeg();

      const res = await fetch("/api/exam/solve_v4", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          image: base64,
          engine_mode: "italky_hybrid",
          locale: "tr"
        })
      });

      const data = await res.json().catch(()=> ({}));

      if(!res.ok || (data.status && data.status === "error")){
        const msg = data.message || `Hata (${res.status})`;
        throw new Error(msg);
      }

      showResult(data);

      // Teacher hook varsa istersen buraya CTA ekleriz (şimdilik sadece log)
      // if(data.teacher_hook) { ... }

    }catch(err){
      resultBox.style.display = "block";
      topicLine.innerHTML = `<span class="badge">Hata</span>`;
      finalAnswer.textContent = (err && err.message) ? err.message : "Bilinmeyen hata";
      stepsEl.innerHTML = `<span class="muted">Seçimi kontrol et veya farklı bir foto ile dene.</span>`;
    }finally{
      btnSolve.disabled = false;
      btnSolve.textContent = "Çözümü Al";
    }
  };

  // ilk overlay
  resetSelection();
</script>
</body>
</html>
