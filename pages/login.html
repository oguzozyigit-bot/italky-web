<!-- FILE: /pages/login.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • FaceToFace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),
        radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),
        #050508;
    }

    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    .edge-handle{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:998;
      width:28px;
      height:118px;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      color:#fff;
      font-size:11px;
      font-weight:1000;
      line-height:1.15;
      text-align:center;
      white-space:pre;
      box-shadow:0 0 32px rgba(0,0,0,.30);
    }

    .edge-handle.open{
      right:0;
      border-radius:18px 0 0 18px;
      background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));
      border:1px solid rgba(255,255,255,.14);
      border-right:none;
    }

    .edge-handle.open::before{ content:"O\A P\A E\A N"; }

    .edge-handle.clear{
      left:0;
      border-radius:0 18px 18px 0;
      background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));
      border:1px solid rgba(255,255,255,.14);
      border-left:none;
    }

    .edge-handle.clear::before{ content:"C\A L\A E\A A\A R"; }

    .drawer-backdrop{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      background:rgba(0,0,0,.48);
      backdrop-filter:blur(6px);
    }

    .drawer-backdrop.show{display:block}

    .side-drawer{
      position:absolute;
      top:0;
      right:0;
      width:min(86vw,360px);
      height:100%;
      padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));
      background: linear-gradient(180deg,rgba(7,15,30,.98),rgba(5,8,18,.98));
      border-left:1px solid rgba(255,255,255,.10);
      transform:translateX(102%);
      transition:transform .24s ease;
    }

    .drawer-backdrop.show .side-drawer{transform:translateX(0)}

    .drawer-logo-main{
      font-family:"Space Grotesk",sans-serif;
      font-size:30px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .drawer-logo-main .ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .drawer-mode-pill{
      display:flex;
      gap:4px;
      padding:4px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.11);
    }

    .drawer-mode-pill button{
      border:none;
      border-radius:999px;
      min-height:30px;
      padding:0 10px;
      background:transparent;
      color:rgba(255,255,255,.62);
      font-weight:1000;
      font-size:10px;
    }

    .drawer-mode-pill button.active{
      background:linear-gradient(135deg,rgba(165,180,252,.26),rgba(236,72,153,.18));
      color:#fff;
    }

    .my-lang-btn, .drawer-link{
      width:100%;
      min-height:54px;
      border-radius:18px;
      background:rgba(255,255,255,.065);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      display:flex;
      align-items:center;
      padding:10px 12px;
      margin-bottom:10px;
      text-decoration:none;
      font-weight:1000;
    }

    .half-screen{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      padding:10px 8px;
    }

    .half-screen.top{ transform:rotate(180deg); background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg)); }
    .half-screen.bottom{ background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg)); }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:1100;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
      overflow:hidden;
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-list{ flex:1; overflow-y:auto; padding:10px; }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      padding:18px 0;
      text-align:center;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .mic-btn{
      width:70px;
      height:70px;
      border:none;
      border-radius:999px;
      background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .center-hub{
      height:82px;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:50;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    #adViewContainer{
      display:none;
      width:100%;
      height:60px;
      justify-content:center;
      align-items:center;
      position:absolute;
      z-index:100;
    }

    .orb{
      width:66px;
      height:66px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      font-weight:900;
      position:relative;
    }

    .orb .ai{ background:var(--ai-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    .sat{ position:absolute; width:10px; height:10px; border-radius:50%; filter:blur(1.5px); }
    .sat1{ background:#6366f1; animation:orbit1 4.8s linear infinite; }
    .sat2{ background:#ec4899; animation:orbit2 6.2s linear infinite; }

    @keyframes orbit1{ from{transform:rotate(0deg) translateX(48px)} to{transform:rotate(360deg) translateX(48px)} }
    @keyframes orbit2{ from{transform:rotate(180deg) translateX(48px)} to{transform:rotate(540deg) translateX(48px)} }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
    }

    .modal.show{display:flex}

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      z-index:9999;
      transition:.22s ease;
    }

    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>

<body>
  <button id="sideClearBtn" class="edge-handle clear" type="button"></button>
  <button id="drawerEdgeBtn" class="edge-handle open" type="button"></button>

  <div id="drawerBackdrop" class="drawer-backdrop">
    <aside class="side-drawer">
      <div class="drawer-logo-main">italky<span class="ai">AI</span></div>
      <div class="drawer-mode-pill">
        <button id="modeOnlineBtn" class="active">Online</button>
        <button id="modeOfflineBtn">Offline</button>
      </div>
      <button id="myLangDrawerBtn" class="my-lang-btn">
        <span id="myLangDrawerFlag">🇹🇷</span> <span id="myLangDrawerTitle">Türkçe</span>
      </button>
      <nav>
        <a class="drawer-link" href="#">Yazıdan Çeviri</a>
        <a class="drawer-link" href="#">Hakkımızda</a>
      </nav>
      <div class="drawer-footer-seal">italky<span class="ai">AI</span> 2026</div>
    </aside>
  </div>

  <main class="container">
    <section class="half-screen top" id="topSection">
      <button id="topLangBtn" class="lang-trigger">🌐 Dil seçiliyor...</button>
      <div class="popover" id="pop-top">
        <div class="pop-list" id="list-top"></div>
      </div>
      <div class="chat-body" id="topBody"></div>
      <button id="topMic" class="mic-btn">🎙️</button>
    </section>

    <section class="center-hub">
      <div id="adViewContainer"></div>
      <div class="orb">
        <span class="sat sat1"></span>
        <span class="sat sat2"></span>
        <span class="orb-main">italky<span class="ai">AI</span></span>
      </div>
    </section>

    <section class="half-screen bottom" id="botSection">
      <button id="botLangBtn" class="lang-trigger">🌐 Dil seçiliyor...</button>
      <div class="popover" id="pop-bot">
        <div class="pop-list" id="list-bot"></div>
      </div>
      <div class="chat-body" id="botBody"></div>
      <button id="botMic" class="mic-btn">🎙️</button>
    </section>
  </main>

  <div id="adModal" class="modal">
    <div style="background:#111; padding:20px; border-radius:20px; text-align:center;">
      <h3>Reklam İzle</h3>
      <button id="watchAdBtn" style="padding:10px; background:var(--ai-gradient); border:none; border-radius:10px;">İzle</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    
    // Popover dokun-kapat mantığı
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.popover') && !e.target.closest('.lang-trigger')) {
            document.querySelectorAll('.popover').forEach(p => p.classList.remove('show'));
        }
    });

    // Menü aç-kapat
    $('drawerEdgeBtn').onclick = () => $('drawerBackdrop').classList.add('show');
    $('drawerBackdrop').onclick = (e) => { if(e.target === $('drawerBackdrop')) $('drawerBackdrop').classList.remove('show'); };
  </script>
  
  <script type="module" src="/js/face_to_face.js"></script>
</body>
</html>
