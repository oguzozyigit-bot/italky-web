<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • FaceToFace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),
        radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),
        #050508;
      transition: background 0.5s ease;
    }

    body.bt-active { background: #020617; }
    body.bt-active .half-screen.top { transform: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
    body.bt-active .half-screen.top .mic-line { display: none !important; }
    body.bt-active #topLangBtn { pointer-events: none; opacity: 0.8; }
    body.bt-active #btToggleBtn { color: #f87171; border-color: rgba(248,113,113,0.5); background: rgba(239,68,68,0.15); box-shadow: 0 0 15px rgba(239,68,68,0.3); }

    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    .edge-handle{ position:fixed; top:50%; transform:translateY(-50%); z-index:998; width:28px; height:118px; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fff; font-family:Outfit,Arial,sans-serif; font-size:11px; font-weight:1000; line-height:1.15; text-align:center; white-space:pre; box-shadow:0 0 32px rgba(0,0,0,.30); }
    .edge-handle.open{ right:0; border-radius:18px 0 0 18px; background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18)); border:1px solid rgba(255,255,255,.14); border-right:none; }
    .edge-handle.open::before { content: "M\A E\A N\A U"; white-space: pre; text-shadow: 0 0 12px rgba(255,255,255,.28); }
    .edge-handle.clear{ left:0; border-radius:0 18px 18px 0; background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18)); border:1px solid rgba(255,255,255,.14); border-left:none; }
    .edge-handle.clear::before { content: "C\A L\A E\A A\A R"; white-space: pre; text-shadow: 0 0 12px rgba(255,255,255,.28); }
    .edge-handle:active{transform:translateY(-50%) scale(.96)}

    .drawer-backdrop{ position:fixed; inset:0; z-index:2147483646; display:none; background:rgba(0,0,0,.48); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
    .drawer-backdrop.show{display:block}
    
    /* YENİ YAN MENÜ TASARIMI */
    .side-drawer{ position:absolute; top:0; right:0; width:min(86vw,360px); height:100%; padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px)); background: radial-gradient(circle at top right,rgba(56,189,248,.16),transparent 34%), radial-gradient(circle at bottom left,rgba(236,72,153,.10),transparent 30%), linear-gradient(180deg,rgba(7,15,30,.98),rgba(5,8,18,.98)); border-left:1px solid rgba(255,255,255,.10); box-shadow:-24px 0 70px rgba(0,0,0,.52); transform:translateX(102%); transition:transform .24s ease; display:flex; flex-direction:column; }
    .drawer-backdrop.show .side-drawer{transform:translateX(0)}
    .drawer-header { flex: 0 0 auto; margin-bottom: 20px; }
    .drawer-scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .drawer-scroll::-webkit-scrollbar { display: none; }
    .drawer-footer { flex: 0 0 auto; margin-top: 10px; }

    .drawer-logo-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .drawer-logo-main{ font-family:"Space Grotesk",sans-serif; font-size:30px; line-height:1; font-weight:900; letter-spacing:-1px; }
    .drawer-logo-main .ai{ background:var(--ai-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .drawer-logo-sub{ margin-top:7px; display:block; color:rgba(255,255,255,.82); font-size:11px; font-weight:1000; letter-spacing:1.8px; }

    /* Profil Bilgisi */
    .drawer-profile-info { display: flex; align-items: center; gap: 10px; }
    .drawer-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; }
    .drawer-user-name { font-size: 13px; font-weight: 800; color: #fff; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .drawer-links{ display:grid; gap:9px; }
    
    /* DİL SEÇİCİ */
    .drawer-lang-select-wrapper { position: relative; margin-bottom: 10px; }
    .drawer-lang-select { width: 100%; min-height: 50px; appearance: none; border-radius: 18px; background: rgba(15,39,66,.44); border: 1px solid rgba(96,165,250,.18); color: #fff; padding: 0 13px; font-size: 14px; font-weight: 1000; cursor: pointer; outline: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.045); }
    .drawer-lang-select-wrapper::after { content: "▼"; position: absolute; right: 15px; top: 16px; font-size: 12px; pointer-events: none; color: rgba(255,255,255,0.7); }

    .drawer-link{ min-height:50px; border-radius:18px; text-decoration:none; color:#fff; border:1px solid rgba(96,165,250,.18); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 13px; font-size:14px; font-weight:1000; cursor:pointer; position:relative; overflow:hidden; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 1px 0 rgba(255,255,255,.045); background:rgba(15,39,66,.44); font-family:inherit; }
    .drawer-link::before{ content:""; position:absolute; inset:0; opacity:.9; pointer-events:none; background: radial-gradient(circle at left,rgba(56,189,248,.12),transparent 55%), linear-gradient(135deg,rgba(255,255,255,.035),rgba(15,39,66,.20)); }
    .drawer-link span, .drawer-link small{ position:relative; z-index:2; }
    .drawer-link:active{transform:scale(.985)}
    .drawer-link small{ color:rgba(255,255,255,.56); font-size:12px; font-weight:1000; }
    
    .drawer-link.locked { opacity: 0.6; }
    .drawer-link.locked small { color: #f87171; }
    .drawer-link.danger { border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.1); }
    .drawer-link.danger span { color: #fca5a5; }

    /* Google Button */
    .google-login-btn{ width:100%; min-height:54px; border:none; border-radius:18px; background:linear-gradient(135deg,#fff 0%,#f8f9fa 100%); color:#3c4043; font-size:14px; font-weight:900; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.2); transition: transform 0.2s ease; margin-bottom: 10px;}
    .google-login-btn:active{transform:scale(.96)}
    .google-icon{ width:22px; height:22px; flex:0 0 22px; }

    .drawer-footer-seal{ padding:11px 10px 2px; text-align:center; color:rgba(255,255,255,.46); font-size:11px; font-weight:1000; letter-spacing:.4px; }
    .drawer-footer-seal .ai{ background:var(--ai-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    .half-screen{ flex:1; min-height:0; position:relative; display:flex; flex-direction:column; justify-content:space-between; align-items:center; overflow:hidden; padding:10px 8px; }
    .half-screen.top{ transform:rotate(180deg); background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg)); }
    .half-screen.bottom{ background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg)); padding-bottom:calc(4px + var(--safe-bottom)); }

    .lang-row{ width:100%; display:flex; align-items:center; justify-content:center; z-index:20; }
    .lang-trigger{ min-height:38px; border:none; border-radius:999px; background:transparent; color:#fff; font-size:13px; font-weight:900; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:82vw; padding:8px 14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }

    .popover{ position:absolute; left:50%; transform:translateX(-50%); width:min(92vw,360px); height:360px; background:#0a0a0f; border:1px solid var(--border); border-radius:24px; display:none; flex-direction:column; z-index:100; overflow:hidden; box-shadow:0 22px 60px rgba(0,0,0,.92); }
    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{ padding:14px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; justify-content:space-between; align-items:center; font-weight:900; }
    .pop-close{ cursor:pointer; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
    .pop-list{ flex:1; overflow-y:auto; padding:10px; scrollbar-width:none; }
    .pop-list::-webkit-scrollbar{display:none}

    .pop-item{ padding:12px; border-radius:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; border:1px solid transparent; }
    .pop-item.active{ background:rgba(99,102,241,.14); border-color:rgba(99,102,241,.25); }
    .pop-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
    .pop-flag{font-size:18px}
    .pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pop-code{font-size:12px;font-weight:900;opacity:.7}

    .chat-body{ flex:1; width:100%; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:14px; padding:18px 0 18px; text-align:center; scrollbar-width:none; mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent); }
    .chat-body::before{ content:""; flex:1 0 auto; min-height:12px; }
    .chat-body::-webkit-scrollbar{ display:none; width:0; height:0; }
    .bubble{ max-width:86%; line-height:1.18; word-break:break-word; font-size:24px; font-weight:900; opacity:.9; text-align:center; }
    .bubble.latest{ font-size:32px; font-weight:1000; opacity:1; }

    .mic-line{ width:100%; display:grid; grid-template-columns:1fr 70px 1fr; align-items:center; gap:12px; padding:0 8px 0; flex:0 0 auto; transform:translateY(-8px); }
    .mic-side{ min-height:60px; display:flex; align-items:center; justify-content:center; }
    
    .mic-btn{ width:70px; height:70px; border:none; border-radius:999px; background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08); position:relative; }
    .mic-btn svg{ width:30px; height:30px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .mic-btn.listening{ background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12)); box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10); animation:micBreath 1.05s ease-in-out infinite; }
    .mic-btn.listening::after{ content:""; position:absolute; inset:-13px; border-radius:50%; border:2px solid rgba(165,180,252,.78); box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35); animation:micPulse 1s ease-out infinite; }

    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}

    .hf-btn{ background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: rgba(255,255,255,0.7); padding: 8px 12px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; cursor: pointer; transition: all 0.3s ease; outline: none; }
    .hf-btn.active{ background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.5); color: #d8b4fe; box-shadow: 0 0 15px rgba(168,85,247,0.25); }
    .hf-btn svg{ width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .center-hub{ height:82px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; position:relative; background:rgba(0,0,0,.58); backdrop-filter:blur(16px); z-index:50; border-top:1px solid rgba(255,255,255,.05); border-bottom:1px solid rgba(255,255,255,.05); padding: 0 45px;}
    .hub-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .orb-wrapper { position: relative; width: 66px; height: 66px; display: flex; align-items: center; justify-content: center; }
    .orb{ width:66px; height:66px; border-radius:50%; background:#000; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:"Space Grotesk",sans-serif; font-size:13px; font-weight:900; z-index: 5;}
    .orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .satellite-orbit { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.03); animation: spin 6s linear infinite; }
    .satellite { position: absolute; width: 8px; height: 8px; border-radius: 50%; top: 0; left: 50%; margin-left: -4px; }
    .sat-blue { background: #6366f1; box-shadow: 0 0 12px #6366f1; }
    .sat-pink { background: #ec4899; box-shadow: 0 0 12px #ec4899; top: auto; bottom: 0; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .toast{ position:fixed; left:50%; top:30px; transform:translateX(-50%) translateY(-120px); max-width:min(92vw,430px); min-height:44px; padding:11px 16px; border-radius:16px; background:rgba(12,16,28,.98); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:12px; font-weight:1000; display:flex; align-items:center; justify-content:center; text-align:center; z-index:2147483647; box-shadow:0 18px 36px rgba(0,0,0,.45); transition:.22s ease; pointer-events:none; }
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:390px){
      .mic-line{grid-template-columns:1fr 66px 1fr;gap:8px;transform:translateY(-7px)}
      .mic-btn{width:66px;height:66px} .mic-btn svg{width:28px;height:28px}
    }
  </style>
</head>

<body>
  <button id="sideClearBtn" class="edge-handle clear" type="button" aria-label="Ekranı temizle"></button>
  <button id="drawerEdgeBtn" class="edge-handle open" type="button" aria-label="Menüyü aç"></button>

  <div id="drawerBackdrop" class="drawer-backdrop">
    <aside class="side-drawer" role="dialog" aria-label="italkyAI menü">
      
      <!-- LOGO VE KULLANICI BİLGİSİ (HEADER) -->
      <div class="drawer-header">
        <div class="drawer-logo-row">
          <div class="drawer-logo">
            <div class="drawer-logo-main">italky<span class="ai">AI</span></div>
            <div class="drawer-logo-sub">BE FREE</div>
          </div>
          
          <!-- Sadece Login Sonrası Gösterilecek Kullanıcı Bilgisi -->
          <div id="drawerProfileInfo" class="drawer-profile-info" style="display: none;">
             <div class="drawer-user-name" id="drawerUserName">Oğuz Özyiğit</div>
             <img src="https://ui-avatars.com/api/?name=Oguz&background=6366f1&color=fff" id="drawerUserAvatar" class="drawer-avatar" alt="Profil">
          </div>
        </div>
      </div>

      <!-- MENÜ LİNKLERİ (SCROLL ALANI) -->
      <div class="drawer-scroll">
        
        <!-- HER DURUMDA GÖRÜNEN DİL SEÇİMİ -->
        <div class="drawer-lang-select-wrapper">
          <select id="siteLangSelect" class="drawer-lang-select">
            <option value="tr">🇹🇷 Site Dili: Türkçe</option>
            <option value="en">🇬🇧 Site Lang: English</option>
          </select>
        </div>

        <!-- 1. LOGİN ÖNCESİ MENÜ -->
        <nav id="preLoginMenu" class="drawer-links">
          <a class="drawer-link locked" href="#" onclick="showToast('Önce giriş yapmalısınız')">
            <span>Offline Diller</span><small>🔒</small>

          <a class="drawer-link" href="#"><span>Yazıdan Çeviri</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Eğlenerek Öğren</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Seviye Tespit</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Hakkımızda</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Gizlilik</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Bizi Puanla</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Kısa Yol Oluştur</span><small>›</small></a>
        </nav>

        <!-- 2. LOGİN SONRASI MENÜ -->
        <nav id="postLoginMenu" class="drawer-links" style="display: none;">
          <a class="drawer-link" href="#"><span>Offline Diller</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Yazıdan Çeviri</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Eğlenerek Öğren</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Seviye Tespit</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Hakkımızda</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Gizlilik</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Bizi Puanla</span><small>›</small></a>
          <a class="drawer-link" href="#"><span>Kısa Yol Oluştur</span><small>›</small></a>
          
          <button class="drawer-link" id="safeLogoutBtn" type="button" style="margin-top: 10px;">
            <span>Güvenli Çıkış</span><small>›</small>
          </button>
          <button class="drawer-link danger" id="deleteAccountBtn" type="button">
            <span>Hesabımı Sil</span><small>🗑️</small>
          </button>
        </nav>
      </div>

      <!-- ALT KISIM (FOOTER - GOOGLE BUTONU BURADA) -->
      <div class="drawer-footer">
        <!-- Sadece Login Öncesi Görünecek Google Butonu -->
        <button id="googleLoginBtn" class="google-login-btn" type="button">
          <svg class="google-icon" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.6l6.2 5.2C36.9 39.3 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
          </svg>
          <span>Google ile Giriş Yap</span>
        </button>

        <div class="drawer-footer-seal">italky<span class="ai">AI</span> By Ozyigit's 2026</div>
      </div>
    </aside>
  </div>

  <main class="container">
    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 İngilizce ⌵</button>
      </div>
      <div class="chat-body" id="topBody"></div>
      <div class="mic-line">
        <div class="mic-side empty"></div>
        <button id="topMic" class="mic-btn" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button>
        <div class="mic-side empty"></div>
      </div>
    </section>

    <section class="center-hub" id="centerHub">
      <button id="btToggleBtn" class="hub-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5-10 10"></path></svg></button>
      <div class="orb-wrapper">
        <div class="satellite-orbit"><div class="satellite sat-blue"></div><div class="satellite sat-pink"></div></div>

  <div id="toast" class="toast"></div>

  <script>
  const $ = (id) => document.getElementById(id);
  
  // YAN MENÜYÜ AÇ/KAPAT
  $("drawerEdgeBtn").onclick = () => $("drawerBackdrop").classList.add("show");
  $("drawerBackdrop").onclick = (e) => { if(e.target === $("drawerBackdrop")) $("drawerBackdrop").classList.remove("show"); };

  // TOAST MESAJI
  function showToast(msg){
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
  }

  // LOGIN DURUMUNU KONTROL ET VE MENÜYÜ GÜNCELLE
  function updateMenuState() {
      // Çerezi (veya localStorage'ı) kontrol et
      const isLogged = localStorage.getItem("user_logged") === "true";

      if(isLogged) {
          // GİRİŞ YAPILMIŞ - Post Login UI
          $("preLoginMenu").style.display = "none";
          $("googleLoginBtn").style.display = "none";
          
          $("postLoginMenu").style.display = "grid";
          $("drawerProfileInfo").style.display = "flex";
          $("drawerUserName").textContent = localStorage.getItem("user_name") || "Kullanıcı";
      } else {
          // GİRİŞ YAPILMAMIŞ - Pre Login UI
          $("postLoginMenu").style.display = "none";
          $("drawerProfileInfo").style.display = "none";
          
          $("preLoginMenu").style.display = "grid";
          $("googleLoginBtn").style.display = "flex";
      }
  }

  // SAHTE LOGOUT BUTONU İŞLEVİ (Sistemi test etmek için)
  $("safeLogoutBtn").onclick = () => { 
      localStorage.removeItem("user_logged"); 
      localStorage.removeItem("user_name");
      updateMenuState(); 
      showToast("Güvenli Çıkış Yapıldı"); 
  };

  // GOOGLE BUTONU YÖNLENDİRMESİ
  $("googleLoginBtn").onclick = () => {
      // Senin istediğin şekilde login sayfasına atar.
      window.location.href = "login_entry.html";
  };

  // Sayfa yüklendiğinde durumu kontrol et
  updateMenuState();
  </script>
</body>
</html>
