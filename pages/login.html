<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iCanyAI Business • Giriş</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-void:#05060b;
      --neon:#00f2ff;
      --gold:#f8c76b;
      --violet:#7c3aed;
      --pink:#ff007a;
      --brand-grad:linear-gradient(135deg,#00f2ff 0%,#7c3aed 52%,#f8c76b 100%);
      --signature-grad:linear-gradient(to right,#fff,#00f2ff,#f8c76b,#fff);
      --accent:#00f2ff;
      --muted:rgba(255,255,255,.68);
      --safeB:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html,body{height:100%;width:100%}
    body{background:var(--bg-void);color:#fff;font-family:'Outfit',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .nebula{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 18%,rgba(0,242,255,.14),transparent 44%),radial-gradient(circle at 82% 78%,rgba(248,199,107,.12),transparent 54%),radial-gradient(circle at 52% 52%,rgba(18,10,32,1) 0%,#05060b 100%);z-index:0}
    .grid-glow{position:fixed;inset:auto 0 0 0;height:44%;pointer-events:none;opacity:.22;background:linear-gradient(rgba(0,242,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,255,.14) 1px,transparent 1px);background-size:42px 42px;transform:perspective(520px) rotateX(64deg);transform-origin:bottom;filter:blur(.2px);z-index:1}
    .main{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px;z-index:10;margin-top:-8px}
    .brand-section{text-align:center;margin-bottom:8px}.brand-section h1{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:1000;letter-spacing:-3.6px;line-height:1;filter:drop-shadow(0 0 18px rgba(0,242,255,.22))}.brand-section h1 span.ai{background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.brand-sub{margin-top:10px;font-size:11px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#fff;opacity:.92;text-shadow:0 0 10px rgba(255,255,255,.28)}
    .world-container{position:relative;width:270px;height:270px;display:flex;align-items:center;justify-content:center;margin-top:12px;margin-bottom:12px;perspective:1000px}.earth-glow{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,rgba(0,242,255,.20) 0%,rgba(248,199,107,.10) 42%,transparent 72%);filter:blur(26px);opacity:.95;z-index:0;animation:glowBreath 4.8s ease-in-out infinite alternate}@keyframes glowBreath{from{transform:scale(.95);opacity:.62}to{transform:scale(1.1);opacity:.94}}.earth{position:relative;width:205px;height:205px;border-radius:50%;background-image:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74518/world.topo.bathy.200412.3x5400x2700.jpg");background-size:cover;background-position:center;box-shadow:inset -30px -30px 60px rgba(0,0,0,.9),inset 10px 10px 30px rgba(255,255,255,.1),0 0 82px rgba(0,242,255,.22);transform-style:preserve-3d;animation:rotateSphere 34s linear infinite;z-index:2;overflow:hidden}@keyframes rotateSphere{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}.ai-stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:1000;letter-spacing:1.4px;color:rgba(255,255,255,.95);text-shadow:0 0 20px rgba(0,242,255,.42);mix-blend-mode:screen;opacity:.96;pointer-events:none;user-select:none;backface-visibility:hidden;text-align:center}.ai-front{font-size:35px;transform:translateZ(1px);z-index:4}.ai-back{font-size:42px;letter-spacing:1px;transform:rotateY(180deg) translateZ(1px);z-index:3}
    .typewriter-container{height:40px;margin-top:4px;margin-bottom:15px;display:flex;justify-content:center;align-items:center;width:100%}.typewriter{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);border-right:2px solid var(--accent);white-space:nowrap;overflow:hidden;width:0;animation:typing 5.6s steps(50,end) infinite,blink .85s step-end infinite;text-shadow:0 0 10px rgba(0,242,255,.2)}@keyframes typing{0%,10%{width:0}62%,86%{width:100%}100%{width:0}}@keyframes blink{from,to{border-color:transparent}50%{border-color:var(--accent)}}
    .login-box{position:relative;width:100%;max-width:345px;z-index:30;display:grid;gap:12px}.main-btn{width:100%;min-height:58px;border:none;border-radius:30px;font-size:15.5px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all .18s ease;user-select:none;font-family:inherit}.main-btn:active{transform:scale(.97)}.google-btn{background:#fff;color:#1f1f1f;box-shadow:0 10px 25px rgba(0,0,0,.32)}.store-btn{background:linear-gradient(135deg,rgba(248,199,107,.20),rgba(255,255,255,.065));color:#fff;border:1px solid rgba(248,199,107,.48);box-shadow:0 0 24px rgba(248,199,107,.10),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px)}.guest-btn{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(0,242,255,.42);box-shadow:0 0 24px rgba(0,242,255,.08),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px)}.g-icon{width:20px;height:20px;display:block}.store-icon{width:24px;height:24px;border-radius:9px;border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:1000;color:#ffe2a0;background:rgba(248,199,107,.08)}
    .hint{margin-top:14px;max-width:335px;text-align:center;color:rgba(255,255,255,.54);font-size:12px;font-weight:700;line-height:1.45}.hint strong{color:#fff}
    footer{width:100%;text-align:center;z-index:20;padding-bottom:calc(20px + var(--safeB))}.footer-nav{display:flex;justify-content:center;gap:18px;margin-bottom:12px}.footer-nav a{text-decoration:none;color:rgba(255,255,255,.42);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;transition:.3s}.footer-nav a:hover{color:var(--neon);text-shadow:0 0 8px var(--neon)}.prestige-signature{font-size:11px;font-weight:900;letter-spacing:1.2px;background:var(--signature-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(6,6,12,.95);border:1px solid var(--accent);padding:12px 24px;border-radius:999px;color:#fff;z-index:9999;font-weight:900;font-size:13px;transition:.3s ease;backdrop-filter:blur(15px);pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,242,255,.2)}#toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-height:760px){.world-container{width:220px;height:220px}.earth{width:165px;height:165px}.brand-section h1{font-size:48px}.main-btn{min-height:52px}.hint{display:none}}
    @media(max-width:380px){.brand-section h1{font-size:48px;letter-spacing:-3px}.brand-sub{letter-spacing:4px}.typewriter{font-size:12px}.login-box{max-width:322px}}
  </style>
</head>
<body>
  <div class="nebula"></div>
  <div class="grid-glow"></div>
  <div class="main">
    <div class="brand-section"><h1>iCany<span class="ai">AI</span></h1><div class="brand-sub">BUSINESS MUSIC SYSTEM</div></div>
    <div class="world-container" aria-hidden="true"><div class="earth-glow"></div><div class="earth"><div class="ai-stamp ai-front">ICANYAI</div><div class="ai-stamp ai-back">B2B</div></div></div>
    <div class="typewriter-container"><div class="typewriter" id="typewriter">Kurumsal müzik, radyo ve anons yönetimi...</div></div>
    <div class="login-box">
      <button class="main-btn google-btn" id="googleCorporateBtn" type="button"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span>Google Hesabınla Giriş Yap</span></button>
      <button class="main-btn store-btn" id="storeLoginBtn" type="button"><span class="store-icon">Ş</span><span>Şube Girişi</span></button>
      <button class="main-btn guest-btn" id="guestBtn" type="button">Misafir Giriş</button>
    </div>
    <div class="hint"><strong>Google</strong> kurumsal paneli açar. <strong>Şube Girişi</strong> yayın ekranı içindir. <strong>Misafir Giriş</strong> demo vitrini gösterir.</div>
  </div>
  <footer><div class="footer-nav"><a href="/pages/about.html">Hakkımızda</a><a href="/pages/privacy.html">Gizlilik</a><a href="/pages/contact.html">İletişim</a></div><div class="prestige-signature">iCanyAI Business By Özyiğit 2026</div></footer>
  <div id="toast"></div>
  <script>
    (function(){
      const GUEST_MODE_KEY = "icanyai_guest_mode_v1";
      const phrases = ["Kurumsal müzik, radyo ve anons yönetimi...","Google hesabınla kurumsal stüdyoya geç...","Şube yayını için şube girişini kullan...","Misafir olarak müzik vitrini deneyebilirsin..."];
      const typeEl = document.getElementById("typewriter");
      const toastEl = document.getElementById("toast");
      let pi = 0;
      setInterval(function(){ pi = (pi + 1) % phrases.length; if(typeEl){ typeEl.style.animation="none"; typeEl.offsetHeight; typeEl.textContent=phrases[pi]; typeEl.style.animation=null; } }, 5600);
      function go(url){ location.href = url; }
      function showToast(text){ if(!toastEl || !text) return; toastEl.textContent = text; toastEl.classList.add("show"); setTimeout(function(){ toastEl.classList.remove("show"); }, 4200); }
      try{
        const params = new URLSearchParams(location.search || "");
        if(params.get("auth_error")){ showToast("Giriş tamamlanamadı. Lütfen tekrar deneyin."); }
        if(params.get("session_expired")){ showToast("Oturum süreniz doldu. Lütfen yeniden giriş yapın."); }
      }catch(e){}
      document.getElementById("googleCorporateBtn")?.addEventListener("click", function(){ try{ localStorage.removeItem(GUEST_MODE_KEY); }catch(e){} go("/dashboard/studio"); });
      document.getElementById("storeLoginBtn")?.addEventListener("click", function(){ try{ localStorage.removeItem(GUEST_MODE_KEY); }catch(e){} go("/dashboard/store-login"); });
      document.getElementById("guestBtn")?.addEventListener("click", function(){ try{ localStorage.setItem(GUEST_MODE_KEY,"1"); }catch(e){} go("/music-showcase"); });
    })();
  </script>
</body>
</html>
