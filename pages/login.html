<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • FaceToFace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),
        radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),
        #050508;
      transition: background 0.5s ease;
    }

    /* --- MASA MODU (DÜZ BAKAN EKRANLAR) --- */
    body.bt-active { background: #020617; }
    
    /* BT aktifken üst ekran ters dönmeyi bırakır, düz bakar. Mic ve Dil barı gizlenir. */
    body.bt-active .half-screen.top { 
      transform: none; 
      padding-top: calc(30px + env(safe-area-inset-top,0px)); 
    }
    body.bt-active .half-screen.top .lang-row,
    body.bt-active .half-screen.top .mic-line { display: none; }
    
    /* Alt ekran padding ayarı */
    body.bt-active .half-screen.bottom { padding-top: 20px; }

    /* Tam Ekran Chat Baloncukları */
    body.bt-active .chat-body { align-items: stretch; padding: 10px 20px 20px; }
    body.bt-active .bubble { font-size: 24px; padding: 14px 20px; text-align: left; max-width: 85%; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    /* Alt ekran balonu (Senin konuştuğun) */
    body.bt-active #botBody .bubble { align-self: flex-end; background: var(--ai-gradient); color: #000; border-radius: 20px 20px 0 20px; }
    /* Üst ekran balonu (Karşıdan gelen, sana çevrilen) */
    body.bt-active #topBody .bubble { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 20px 20px 20px 0; }

    /* Dil Seçim Popover'ı (Ortalandı) */
    body.bt-active .popover { top: 50%; bottom: auto; transform: translate(-50%, -50%); height: 400px; box-shadow: 0 30px 80px rgba(0,0,0,0.9); z-index: 3000; }
    /* -------------------------------- */

    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    /* KENAR TUTAMAKLARI */
    .edge-handle{
      position:fixed; top:50%; transform:translateY(-50%); z-index:2500; width:34px; height:90px;
      border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fff;
      box-shadow:0 0 32px rgba(0,0,0,.30); transition: all 0.3s ease;
    }

    /* SAĞ KOL (QR / AYRIL) */
    .edge-handle.open{
      right:0; border-radius:20px 0 0 20px;
      background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));
      border:1px solid rgba(255,255,255,.14); border-right:none; box-shadow:-10px 0 32px rgba(0,0,0,.30);
    }
    /* Aktif (Bağlı) iken Ayrıl butonuna dönüşür ve kızarır */
    body.bt-active .edge-handle.open {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.2));
      border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;
    }

    /* SOL KOL (BLUETOOTH) */
    .edge-handle.clear{
      left:0; border-radius:0 20px 20px 0;
      background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));
      border:1px solid rgba(255,255,255,.14); border-left:none; box-shadow:10px 0 32px rgba(0,0,0,.30);
    }
    /* Aktif (Bağlı) iken Bluetooth butonu mavi parlar */
    body.bt-active .edge-handle.clear {
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.2));
      border-color: rgba(96, 165, 250, 0.5); color: #93c5fd; box-shadow: 10px 0 40px rgba(59, 130, 246, 0.5);
    }

    .edge-handle:active{transform:translateY(-50%) scale(.92)}

    /* DİĞER ORTAK ELEMANLAR */
    .drawer-backdrop{
      position:fixed; inset:0; z-index:2147483646; display:none; background:rgba(0,0,0,.48);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    }
    .drawer-backdrop.show{display:block}

    .side-drawer{
      position:absolute; top:0; right:0; width:min(86vw,360px); height:100%;
      padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));
      background: radial-gradient(circle at top right,rgba(56,189,248,.16),transparent 34%),
                  radial-gradient(circle at bottom left,rgba(236,72,153,.10),transparent 30%),
                  linear-gradient(180deg,rgba(7,15,30,.98),rgba(5,8,18,.98));
      border-left:1px solid rgba(255,255,255,.10); box-shadow:-24px 0 70px rgba(0,0,0,.52);
      transform:translateX(102%); transition:transform .24s ease; overflow:auto; scrollbar-width:none;
    }
    .drawer-backdrop.show .side-drawer{transform:translateX(0)}
    .side-drawer::-webkit-scrollbar{display:none}

    .drawer-logo-row{ margin:4px 0 18px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .drawer-logo{min-width:0;text-align:left}
    .drawer-logo-main{ font-family:"Space Grotesk",sans-serif; font-size:30px; line-height:1; font-weight:900; letter-spacing:-1px; }
    .drawer-logo-main .ai{ background:var(--ai-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .drawer-logo-sub{ margin-top:7px; display:block; color:rgba(255,255,255,.82); font-size:11px; font-weight:1000; letter-spacing:1.8px; }

    .drawer-links{ display:grid; gap:9px; margin-top: 14px;}
    .drawer-link{
      min-height:50px; border-radius:18px; text-decoration:none; color:#fff; border:1px solid rgba(96,165,250,.18);
      display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 13px; font-size:14px;
      font-weight:1000; cursor:pointer; position:relative; overflow:hidden; backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 1px 0 rgba(255,255,255,.045); background:rgba(15,39,66,.44); font-family:inherit;
    }
    .drawer-link::before{
      content:""; position:absolute; inset:0; opacity:.9; pointer-events:none;
      background: radial-gradient(circle at left,rgba(56,189,248,.12),transparent 55%), linear-gradient(135deg,rgba(255,255,255,.035),rgba(15,39,66,.20));
    }
    .drawer-link span, .drawer-link small{ position:relative; z-index:2; }
    .drawer-link:active{transform:scale(.985)}
    .drawer-link small{ color:rgba(255,255,255,.56); font-size:12px; font-weight:1000; }

    .drawer-footer-seal{ margin-top:14px; padding:11px 10px 2px; text-align:center; color:rgba(255,255,255,.46); font-size:11px; font-weight:1000; letter-spacing:.4px; }
    .drawer-footer-seal .ai{ background:var(--ai-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    /* EKRAN YARILARI */
    .half-screen{
      flex:1; min-height:0; position:relative; display:flex; flex-direction:column;
      justify-content:space-between; align-items:center; overflow:hidden; padding:10px 8px;
    }
    .half-screen.top{ transform:rotate(180deg); background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg)); }
    .half-screen.bottom{ background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg)); padding-bottom:calc(4px + var(--safe-bottom)); }

    /* ORTA HUB (ORB) */
    .center-hub{
      height:82px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; position:relative;
      background:rgba(0,0,0,.58); backdrop-filter:blur(16px); z-index:50; border-top:1px solid rgba(255,255,255,.05); border-bottom:1px solid rgba(255,255,255,.05);
    }
    .orb{
      width:66px; height:66px; border-radius:50%; background:#000; border:1px solid var(--border); display:flex; align-items:center;
      justify-content:center; font-family:"Space Grotesk",sans-serif; font-size:13px; font-weight:900; position:relative; overflow:visible;
    }
    .orb-main{position:relative;z-index:3}
    .orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sat{ position:absolute; left:50%; top:50%; width:10px; height:10px; margin-left:-5px; margin-top:-5px; border-radius:50%; z-index:1; filter:blur(1.5px); }
    .sat1{background:#6366f1;box-shadow:0 0 15px #6366f1;animation:orbit1 4.8s linear infinite}
    .sat2{background:#ec4899;box-shadow:0 0 15px #ec4899;animation:orbit2 6.2s linear infinite}
    @keyframes orbit1{from{transform:rotate(0deg) translateX(48px) rotate(0deg)}to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}}
    @keyframes orbit2{from{transform:rotate(180deg) translateX(48px) rotate(-180deg)}to{transform:rotate(540deg) translateX(48px) rotate(-540deg)}}

    /* DİL VE ARAYÜZ PARÇALARI */
    .lang-row{ width:100%; display:flex; align-items:center; justify-content:center; z-index:20; }
    .lang-trigger{
      min-height:38px; border:none; border-radius:999px; background:transparent; color:#fff; font-size:13px;
      font-weight:900; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:82vw; padding:8px 14px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    }

    .popover{
      position:absolute; left:50%; transform:translateX(-50%); width:min(92vw,360px); height:360px;
      background:#0a0a0f; border:1px solid var(--border); border-radius:24px; display:none; flex-direction:column;
      z-index:3000; overflow:hidden; box-shadow:0 22px 60px rgba(0,0,0,.92);
    }
    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{ padding:14px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; justify-content:space-between; align-items:center; font-weight:900; }
    .pop-close{ cursor:pointer; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
    .pop-list{ flex:1; overflow-y:auto; padding:10px; scrollbar-width:none; }
    .pop-list::-webkit-scrollbar{display:none}
    .pop-item{ padding:12px; border-radius:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; border:1px solid transparent; }
    .pop-item.active{ background:rgba(99,102,241,.14); border-color:rgba(99,102,241,.25); }
    .pop-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
    .pop-flag{font-size:18px}
    .pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pop-code{font-size:12px;font-weight:900;opacity:.7}

    /* CHAT GÖVDESİ VE MİKROFON */
    .chat-body{
      flex:1; width:100%; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start; gap:14px; padding:18px 0 18px; text-align:center;
      scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }
    .chat-body::before{ content:""; flex:1 0 auto; min-height:12px; }
    .chat-body::-webkit-scrollbar{ display:none; width:0; height:0; }

    .bubble{ max-width:86%; line-height:1.2; word-break:break-word; font-size:26px; font-weight:900; opacity:.9; text-align:center; transition: all 0.3s; }
    .bubble.latest{ font-size:36px; font-weight:1000; opacity:1; }

    .mic-line{ width:100%; display:grid; grid-template-columns:1fr 70px 1fr; align-items:center; gap:12px; padding:0 8px 0; flex:0 0 auto; transform:translateY(-8px); }
    .mic-side{ min-height:60px; display:flex; align-items:center; justify-content:center; }
    .mic-side.empty{pointer-events:none}

    .mic-btn{
      width:70px; height:70px; border:none; border-radius:999px; background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
      box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08); position:relative;
    }
    .mic-btn svg{ width:30px; height:30px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .mic-btn.listening{
      background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12));
      box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }
    .mic-btn.listening::after{
      content:""; position:absolute; inset:-13px; border-radius:50%; border:2px solid rgba(165,180,252,.78);
      box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35); animation:micPulse 1s ease-out infinite;
    }
    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}

    /* MODAL VE HOLOGRAFİK QR */
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:2147483647; padding:20px; }
    .modal.show{display:flex}
    .modal-card{ width:min(100%,420px); border-radius:24px; padding:22px; background:linear-gradient(145deg,#0f172a,#1e293b); border:1px solid rgba(59,130,246,.4); box-shadow:0 24px 50px rgba(0,0,0,.50); text-align: center; }
    .modal-title{margin:0 0 10px;font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:900; color:#93c5fd;}
    .modal-text{margin:0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.85);white-space:pre-line}
    .modal-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
    .modal-btn{ min-height:48px; border:none; border-radius:16px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:900; }
    .modal-btn.primary{background:var(--ai-gradient);color:#05060d}
    .modal-btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff}

    .toast{
      position:fixed; left:50%; top:30px; bottom:auto; transform:translateX(-50%) translateY(-120px);
      max-width:min(92vw,430px); min-height:44px; padding:11px 16px; border-radius:16px;
      background:rgba(12,16,28,.98); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:12px;
      font-weight:1000; display:flex; align-items:center; justify-content:center; text-align:center;
      z-index:3000; box-shadow:0 18px 36px rgba(0,0,0,.45); transition:.22s ease; pointer-events:none;
    }
    .toast.show{transform:translateX(-50%) translateY(0)}

    /* HOLOGRAFİK ANİMASYON CSS */
    .holo-container{ width: 140px; height: 140px; position: relative; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; margin: 24px auto 30px; }
    .crystal-cage{ position: absolute; width: 100px; height: 100px; transform-style: preserve-3d; animation: rotateCrystal 18s linear infinite; }
    .crystal-side{ position: absolute; inset: 0; border: 2px solid rgba(103,232,249,.42); background: radial-gradient(circle, rgba(129,140,248,.12), transparent); box-shadow: 0 0 18px rgba(103,232,249,.22); }
    .side1{ transform: rotateY(0deg) translateZ(50px); } .side2{ transform: rotateY(90deg) translateZ(50px); } .side3{ transform: rotateY(180deg) translateZ(50px); }
    .side4{ transform: rotateY(270deg) translateZ(50px); } .side5{ transform: rotateX(90deg) translateZ(50px); } .side6{ transform: rotateX(-90deg) translateZ(50px); }
    .holo-qr{ position: absolute; width: 72px; height: 72px; z-index: 2; overflow: visible; display: flex; align-items: center; justify-content: center; animation: floatQR 4s ease-in-out infinite; }
    .ai-planet{ background: transparent; box-shadow: none; }
    .planet-glow{ position: absolute; inset: -12px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 28%, transparent 62%), radial-gradient(circle, rgba(103,232,249,.26) 0%, transparent 70%); filter: blur(12px); animation: planetGlow 3.2s ease-in-out infinite; z-index: 1; }
    .planet-core{ position: relative; width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 2; background: radial-gradient(circle at 28% 24%, rgba(255,255,255,.18) 0%, transparent 22%), radial-gradient(circle at 68% 76%, rgba(129,140,248,.20) 0%, transparent 28%), radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0%, transparent 48%), linear-gradient(145deg, #111318 0%, #08090d 42%, #030406 100%); box-shadow: inset -10px -12px 20px rgba(0,0,0,.72), inset 10px 12px 22px rgba(255,255,255,.04), inset 0 0 26px rgba(255,255,255,.04), 0 0 18px rgba(255,255,255,.10), 0 0 34px rgba(103,232,249,.20), 0 0 64px rgba(129,140,248,.18); animation: planetBreath 2.8s ease-in-out infinite; }
    .planet-core::before{ content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 0 12px rgba(255,255,255,.05); }
    .planet-core::after{ content: ""; position: absolute; left: 12px; top: 10px; width: 22px; height: 10px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 45%, transparent 80%); filter: blur(2px); transform: rotate(-18deg); opacity: .9; }
    .planet-rays{ position: absolute; inset: -12px; border-radius: 50%; pointer-events: none; z-index: 1; }
    .planet-rays::before, .planet-rays::after{ content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg 18deg, rgba(255,255,255,.28) 24deg, transparent 36deg 62deg, rgba(255,255,255,.16) 70deg, transparent 84deg 116deg, rgba(255,255,255,.22) 124deg, transparent 136deg 180deg, rgba(255,255,255,.18) 192deg, transparent 206deg 250deg, rgba(255,255,255,.24) 258deg, transparent 270deg 310deg, rgba(255,255,255,.15) 318deg, transparent 330deg 360deg); mask: radial-gradient(circle, transparent 46%, #000 66%, transparent 76%); -webkit-mask: radial-gradient(circle, transparent 46%, #000 66%, transparent 76%); filter: blur(1px); opacity: .55; animation: planetRaySpin 12s linear infinite; }
    .planet-rays::after{ opacity: .35; transform: scale(1.14); animation-duration: 18s; animation-direction: reverse; }
    .planet-center{ position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; }
    .planet-ai-badge{ position: relative; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,255,255,.24) 0%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.02) 100%); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 0 16px rgba(255,255,255,.10), 0 0 28px rgba(129,140,248,.20); backdrop-filter: blur(10px); }
    .planet-ai-badge::before{ content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid rgba(255,255,255,.10); }
    .planet-ai-badge::after{ content: ""; position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.10); animation: aiSpin 8s linear infinite; }
    .planet-ai-badge span{ position: relative; z-index: 2; font-family: 'Space Grotesk',sans-serif; font-size: 11px; font-weight: 900; letter-spacing: .5px; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.22); }
    
    @keyframes rotateCrystal{ from{ transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg); } to{ transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg); } }
    @keyframes floatQR{ 0%,100%{ transform:translateY(0) rotateX(0deg); } 50%{ transform:translateY(-8px) rotateX(5deg); } }
    @keyframes planetBreath{ 0%,100%{ transform:scale(1); box-shadow:inset -10px -12px 20px rgba(0,0,0,.72),inset 10px 12px 22px rgba(255,255,255,.04),inset 0 0 26px rgba(255,255,255,.04),0 0 18px rgba(255,255,255,.10),0 0 34px rgba(103,232,249,.20),0 0 64px rgba(129,140,248,.18); } 50%{ transform:scale(1.045); box-shadow:inset -10px -12px 20px rgba(0,0,0,.72),inset 10px 12px 24px rgba(255,255,255,.05),inset 0 0 28px rgba(255,255,255,.06),0 0 22px rgba(255,255,255,.12),0 0 42px rgba(103,232,249,.28),0 0 78px rgba(129,140,248,.24); } }
    @keyframes planetGlow{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:.92; transform:scale(1.16); } }
    @keyframes planetRaySpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
    @keyframes aiSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

    /* MODAL İÇİ BÜYÜTÜLMÜŞ QR TASARIMI */
    #qrModal .holo-container { width: 220px; height: 220px; margin: 40px auto; }
    #qrModal .crystal-cage { width: 160px; height: 160px; }
    #qrModal .holo-qr { width: 120px; height: 120px; }
    #qrModal .planet-core { width: 120px; height: 120px; background: #fff; }
    #qrModal .planet-glow { inset: -20px; }

  </style>
</head>

<body>

  <button id="btHandleBtn" class="edge-handle clear" type="button" title="Masa Moduna Bağlan">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7l10 10-5 5V2l5 5-10 10"></path>
    </svg>
  </button>
  
  <button id="qrHandleBtn" class="edge-handle open" type="button" title="Uygulamayı Paylaş">
    <svg id="qrIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
    </svg>
  </button>

  <div id="drawerBackdrop" class="drawer-backdrop">
    </div>

  <main class="container">
    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>
      <div class="popover" id="pop-top">
        <div class="pop-head"><div id="topPopTitle">ÜST DİL</div><div class="pop-close" id="close-top">✕</div></div>
        <div class="pop-list" id="list-top"></div>
      </div>
      
      <div class="chat-body" id="topBody"></div>
      
      <div class="mic-line">
        <div class="mic-side empty"></div>
        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg>
        </button>
        <div class="mic-side empty"></div>
      </div>
    </section>

    <section class="center-hub" id="centerHub">
      <div class="orb">
        <span class="sat sat1"></span><span class="sat sat2"></span><span class="orb-main">italky<span class="ai">AI</span></span>
      </div>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>
      <div class="popover" id="pop-bot">
        <div class="pop-head"><div id="botPopTitle">BENİM DİLİM</div><div class="pop-close" id="close-bot">✕</div></div>
        <div class="pop-list" id="list-bot"></div>
      </div>
      
      <div class="chat-body" id="botBody"></div>
      
      <div class="mic-line">
        <div class="mic-side empty"></div>
        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg>
        </button>
        <div class="mic-side empty"></div>
      </div>
    </section>
  </main>

  <div id="qrModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title">italkyAI'ı İndir</h3>
      <p class="modal-text" style="margin-bottom: 10px;">Arkadaşının kamerasına bu kodu okutarak uygulamayı hemen indirmesini sağla.</p>
      
      <div class="holo-container">
        <div class="crystal-cage">
          <div class="crystal-side side1"></div><div class="crystal-side side2"></div><div class="crystal-side side3"></div>
          <div class="crystal-side side4"></div><div class="crystal-side side5"></div><div class="crystal-side side6"></div>
        </div>
        <div class="holo-qr ai-planet">
          <div class="planet-glow"></div><div class="planet-rays"></div>
          <div class="planet-core">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://play.google.com/store/apps/details?id=com.ozyigits.italkyai&bgcolor=ffffff&color=000000" style="border-radius:6px; width:120px; height:120px; z-index:10; position:relative; mix-blend-mode: screen;">
          </div>
        </div>
      </div>

      <div class="modal-actions" style="grid-template-columns: 1fr;">
        <button onclick="document.getElementById('qrModal').classList.remove('show')" class="modal-btn secondary" type="button">Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
  import { getLangPoolForSite } from "/js/lang_pool_full.js";
  import { OfflinePackBridge } from "/js/offline_pack_bridge.js?v=8";

  const API_BASE = "https://italky-api.onrender.com";
  const $ = (id) => document.getElementById(id);

  // --- 1. AYARLAR VE DATA ---
  function canonical(code){ return OfflinePackBridge.canonical(code); }
  const SITE_LANG = canonical(localStorage.getItem("site_lang") || navigator.language || "tr") || "tr";
  
  const RAW_POOL = getLangPoolForSite(SITE_LANG);
  const LANGS = (Array.isArray(RAW_POOL) ? RAW_POOL : []).map(l => ({
      code: canonical(l.code),
      flag: l.flag || "🌐",
      name: l.name || l.tr_name || l.code.toUpperCase()
  }));

  let topLang = "en";
  let botLang = SITE_LANG;
  let recordingSide = null;
  let isBtConnected = false;

  // --- 2. ELEMENTLER ---
  const topMic = $("topMic"); const botMic = $("botMic");
  const topBody = $("topBody"); const botBody = $("botBody");
  const topLangBtn = $("topLangBtn"); const botLangBtn = $("botLangBtn");
  const popTop = $("pop-top"); const popBot = $("pop-bot");
  const listTop = $("list-top"); const listBot = $("list-bot");
  const btHandleBtn = $("btHandleBtn"); const qrHandleBtn = $("qrHandleBtn");
  const qrIcon = $("qrIcon");

  // --- 3. DİREKT BLUETOOTH VE QR/AYRIL MANTIĞI ---
  
  // SOL BUTON: Eşleşme (Bağlıysa bir şey yapma)
  btHandleBtn.onclick = () => {
      if (!isBtConnected) {
          if (window.Native && window.Native.startBluetoothConnect) {
              showToast("Eşleşilen cihazlar taranıyor...");
              window.Native.startBluetoothConnect();
          } else {
              showToast("Bağlantı isteği gönderildi... (Test Modu)");
              setTimeout(() => window.onBtConnected(), 1500);
          }
      } else {
          showToast("Zaten bağlısınız.");
      }
  };

  // SAĞ BUTON: Bağlı değilse QR göster, Bağlıysa Ayrıl işlemi yap
  qrHandleBtn.onclick = () => {
      if (!isBtConnected) {
          $("qrModal").classList.add("show");
      } else {
          if (window.Native && window.Native.disconnectBluetooth) {
              window.Native.disconnectBluetooth();
          }
          window.onBtDisconnected();
      }
  };

  // Android'den gelen Bağlantı Kuruldu sinyali
  window.onBtConnected = function() {
      isBtConnected = true;
      document.body.classList.add("bt-active");
      
      // Sağ ikonu Çıkış (Ayrıl) ikonuna çevir
      qrIcon.innerHTML = `<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>`;
      
      // Ekranı temizle
      topBody.innerHTML = "";
      botBody.innerHTML = "";
      showToast("Bağlantı kuruldu! Yüz Yüze sohbete hazırsınız.");
  };

  // Android'den gelen Bağlantı Koptu sinyali
  window.onBtDisconnected = function() {
      isBtConnected = false;
      document.body.classList.remove("bt-active");
      
      // Sağ ikonu tekrar QR ikonuna çevir
      qrIcon.innerHTML = `<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>`;
      
      window.location.href = "login.html"; 
  };

  // Karşı taraftan saf metin alımı (Senin diline çevirip üst ekrana yazar ve okur)
  window.onBtMessageReceived = async function(text) {
      const targetBody = $("topBody"); // Karşıdan gelenler ÜST EKRANDA ve DÜZ
      
      const resBubble = document.createElement("div");
      resBubble.className = "bubble latest";
      resBubble.textContent = "•••";
      
      targetBody.querySelectorAll('.bubble').forEach(b => b.classList.remove('latest'));
      targetBody.appendChild(resBubble);
      targetBody.scrollTop = targetBody.scrollHeight;

      try {
          // Karşıdan gelen ham metni otomatik dilden kendi seçtiğimiz dile (botLang) çeviriyoruz
          const r = await fetch(`${API_BASE}/api/translate`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ text: text, from_lang: "auto", to_lang: botLang })
          });
          const j = await r.json();
          const translated = j.translated || j.translation || "Error";
          
          resBubble.textContent = translated;
          targetBody.scrollTop = targetBody.scrollHeight;
          
          // Anında seslendir
          if (window.NativeTTS && window.NativeTTS.speak) {
              window.NativeTTS.speak(translated, botLang);
          }
      } catch (e) { resBubble.textContent = "Bağlantı Hatası!"; }
  };

  // --- 4. DİL SEÇİM MANTIĞI ---
  function closeAllPops() { popTop.classList.remove("show"); popBot.classList.remove("show"); }

  function renderPop(side) {
      const list = (side === "top" ? listTop : listBot);
      const selected = (side === "top" ? topLang : botLang);
      
      list.innerHTML = LANGS.map(l => `
        <div class="pop-item ${l.code === selected ? "active" : ""}" data-select-code="${l.code}">
          <div class="pop-left">
            <div class="pop-flag">${l.flag}</div>
            <div class="pop-name">${l.name}</div>
          </div>
          <div class="pop-actions"><div class="pop-code">${l.code.toUpperCase()}</div></div>
        </div>
      `).join("");

      list.querySelectorAll(".pop-item").forEach(item => {
          item.onclick = (e) => {
              e.stopPropagation();
              const code = item.getAttribute("data-select-code");
              if(side === "top") topLang = code; else botLang = code;
              if(topLang === botLang) topLang = (code === "tr" ? "en" : "tr");
              closeAllPops(); refreshTexts();
          };
      });
  }

  topLangBtn.onclick = (e) => { e.stopPropagation(); renderPop("top"); popTop.classList.add("show"); popBot.classList.remove("show"); };
  botLangBtn.onclick = (e) => { e.stopPropagation(); renderPop("bot"); popBot.classList.add("show"); popTop.classList.remove("show"); };
  document.onclick = () => closeAllPops();

  // --- 5. MİKROFON VE SES SİSTEMİ ---
  topMic.onclick = () => handleMicClick("top");
  botMic.onclick = () => handleMicClick("bot");

  function handleMicClick(side) {
      if (recordingSide === side) { stopRecognizer(); } 
      else { startRecording(side); }
  }

  function startRecording(side) {
      stopRecognizer(); 
      recordingSide = side;
      $(side + "Mic").classList.add("listening");
      const bcp = (side === "top" ? topLang : botLang);
      if (window.Native && window.Native.startSpeechRecognition) {
          window.Native.startSpeechRecognition(bcp, side);
      }
  }

  function stopRecognizer() {
      if (recordingSide) { $(recordingSide + "Mic").classList.remove("listening"); }
      recordingSide = null;
      if (window.Native && window.Native.stopSpeechRecognition) { window.Native.stopSpeechRecognition(); }
  }

  window.onNativeSpeechResult = function(side, text, isFinal) {
      const body = (side === "top" ? topBody : botBody);
      let bubble = body.querySelector(".bubble.latest");
      
      if (!bubble) {
          bubble = document.createElement("div");
          bubble.className = "bubble latest";
          body.querySelectorAll('.bubble').forEach(b => b.classList.remove('latest'));
          body.appendChild(bubble);
      }
      
      bubble.textContent = text + (isFinal ? "" : "...");
      body.scrollTop = body.scrollHeight;

      if (isFinal) {
          bubble.classList.remove("latest");
          finalizeSpeech(side, text); 
      }
  };

  async function finalizeSpeech(side, text) {
      stopRecognizer();

      // MASA MODU AKTİF İSE (SADECE KENDİ YAZIMIZI GÖNDERİRİZ)
      if (isBtConnected) {
          // Alt ekranda bizim kendi söylediğimiz yazı belirdi.
          // Bu saf metni Bluetooth üzerinden Native kod ile karşıya yolluyoruz.
          if (window.Native && window.Native.sendBtText) {
              window.Native.sendBtText(text);
          }
          return;
      }

      // NORMAL BÖLÜNMÜŞ EKRAN MODU
      const from = (side === "top" ? topLang : botLang);
      const to = (side === "top" ? botLang : topLang);
      const targetBody = (side === "top" ? botBody : topBody);

      const resBubble = document.createElement("div");
      resBubble.className = "bubble latest";
      resBubble.textContent = "•••";
      targetBody.querySelectorAll('.bubble').forEach(b => b.classList.remove('latest'));
      targetBody.appendChild(resBubble);
      targetBody.scrollTop = targetBody.scrollHeight;

      try {
          const r = await fetch(`${API_BASE}/api/translate`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ text: text, from_lang: from, to_lang: to })
          });
          const j = await r.json();
          const translated = j.translated || j.translation || "Error";
          
          resBubble.textContent = translated;
          targetBody.scrollTop = targetBody.scrollHeight;
          
          if (window.NativeTTS && window.NativeTTS.speak) {
              window.NativeTTS.speak(translated, to);
          }
      } catch (e) { resBubble.textContent = "!!!"; }
  }

  // --- 6. UI YARDIMCILARI ---
  function refreshTexts() {
      const tO = LANGS.find(x => x.code === topLang) || {flag:"🌐", name:topLang.toUpperCase()};
      const bO = LANGS.find(x => x.code === botLang) || {flag:"🌐", name:botLang.toUpperCase()};
      $("topLangBtn").textContent = `${tO.flag} ${tO.name} ⌵`;
      $("botLangBtn").textContent = `${bO.flag} ${bO.name} ⌵`;
  }

  function showToast(msg) {
      const t = $("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
  }

  refreshTexts();
  </script>
</body>
</html>
