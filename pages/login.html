<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • FaceToFace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}

    body{
      background:
        radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),
        radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),
        #050508;
    }

    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    .floating-login-btn{
      position:fixed;
      top:12px;
      right:14px;
      z-index:999;
      border:none;
      background:transparent;
      color:#fff;
      font-family:inherit;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:0;
      cursor:pointer;
      padding:0;
      text-shadow:0 0 14px rgba(255,255,255,.22);
    }

    .login-plus{
      font-size:30px;
      line-height:26px;
      font-weight:300;
      color:#fff;
    }

    .login-text{
      margin-top:1px;
      font-size:10px;
      line-height:1;
      font-weight:900;
      color:rgba(255,255,255,.82);
      letter-spacing:.2px;
    }

    .floating-login-btn:active{
      transform:scale(.94);
    }

    .half-screen{
      flex:1;min-height:0;position:relative;display:flex;flex-direction:column;
      justify-content:space-between;align-items:center;overflow:hidden;padding:10px 8px;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg));
      padding-bottom:calc(10px + var(--safe-bottom));
    }

    .lang-row{width:100%;display:flex;align-items:center;justify-content:center;z-index:20}

    .lang-trigger{
      min-height:38px;border:none;border-radius:999px;background:transparent;color:#fff;
      font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;max-width:82vw;padding:8px 14px;display:inline-flex;
      align-items:center;justify-content:center;gap:8px;
    }

    .popover{
      position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,360px);height:360px;
      background:#0a0a0f;border:1px solid var(--border);border-radius:24px;display:none;
      flex-direction:column;z-index:100;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{display:flex}
    .half-screen.top .popover{top:58px}
    .half-screen.bottom .popover{bottom:58px}

    .pop-head{
      padding:14px;border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;justify-content:space-between;align-items:center;font-weight:900;
    }

    .pop-close{
      cursor:pointer;padding:8px 12px;border-radius:12px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    }

    .pop-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:none}
    .pop-list::-webkit-scrollbar{display:none}

    .pop-item{
      padding:12px;border-radius:16px;display:flex;align-items:center;
      justify-content:space-between;gap:12px;cursor:pointer;border:1px solid transparent;
    }

    .pop-item.active{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.25)}
    .pop-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .pop-flag{font-size:18px}
    .pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pop-code{font-size:12px;font-weight:900;opacity:.7}

    .pop-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .pop-download{
      width:32px;
      height:32px;
      border:none;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:15px;
      line-height:1;
    }

    .pop-download:active{
      transform:scale(.94);
    }

    .chat-body{
      flex:1;width:100%;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:14px;padding:14px 0 22px;
      text-align:center;scrollbar-width:none;
      mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
    }

    .chat-body::-webkit-scrollbar{display:none}

    .bubble{
      max-width:86%;line-height:1.18;word-break:break-word;
      font-size:24px;font-weight:900;opacity:.9;
    }

    .bubble.latest{font-size:32px;font-weight:1000;opacity:1}

    .mic-line{
      width:100%;display:grid;grid-template-columns:1fr 70px 1fr;
      align-items:end;gap:12px;padding:0 8px 4px;flex:0 0 auto;
    }

    .mic-side{min-height:70px;display:flex;align-items:flex-end;justify-content:center}

    .privacy-link{
      color:rgba(255,255,255,.74);
      font-size:12px;
      font-weight:900;
      text-decoration:none;
      padding-bottom:8px;
    }

    .mode-pill{
      display:flex;
      align-items:center;
      gap:4px;
      padding:4px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.11);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      margin-bottom:8px;
      max-width:100%;
    }

    .mode-pill button{
      border:none;
      border-radius:999px;
      min-height:30px;
      padding:0 12px;
      background:transparent;
      color:rgba(255,255,255,.62);
      font-family:inherit;
      font-size:11px;
      font-weight:1000;
      cursor:pointer;
      letter-spacing:.1px;
      white-space:nowrap;
    }

    .mode-pill button.active{
      background:linear-gradient(135deg,rgba(165,180,252,.26),rgba(236,72,153,.18));
      color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }

    .mic-btn{
      width:70px;height:70px;border:none;border-radius:999px;
      background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;
      justify-content:center;cursor:pointer;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
    }

    .mic-btn svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

    .mic-btn.listening{
      background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12));
      box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }

    .mic-btn.listening::after{
      content:"";position:absolute;inset:-13px;border-radius:50%;
      border:2px solid rgba(165,180,252,.78);
      box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}

    .center-hub{
      height:82px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      position:relative;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);z-index:50;
      border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);
    }

    .center-action{
      position:absolute;border:none;background:transparent;color:#fff;font-family:inherit;
      font-size:15px;font-weight:1000;cursor:pointer;padding:10px 12px;
      display:flex;align-items:center;justify-content:center;text-decoration:none;
      text-shadow:0 0 16px rgba(255,255,255,.18);
    }

    .center-login{left:12px}
    .center-clear{right:12px}

    .orb{
      width:66px;height:66px;border-radius:50%;background:#000;border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;
      font-size:13px;font-weight:900;position:relative;overflow:visible;
    }

    .orb-main{position:relative;z-index:3}
    .orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

    .sat{
      position:absolute;left:50%;top:50%;width:10px;height:10px;margin-left:-5px;margin-top:-5px;
      border-radius:50%;z-index:1;filter:blur(1.5px);
    }

    .sat1{background:#6366f1;box-shadow:0 0 15px #6366f1;animation:orbit1 4.8s linear infinite}
    .sat2{background:#ec4899;box-shadow:0 0 15px #ec4899;animation:orbit2 6.2s linear infinite}

    @keyframes orbit1{from{transform:rotate(0deg) translateX(48px) rotate(0deg)}to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}}
    @keyframes orbit2{from{transform:rotate(180deg) translateX(48px) rotate(-180deg)}to{transform:rotate(540deg) translateX(48px) rotate(-540deg)}}

    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
      display:none;align-items:center;justify-content:center;z-index:9998;padding:20px;
    }

    .modal.show{display:flex}

    .modal-card{
      width:min(100%,420px);border-radius:24px;padding:18px;
      background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
      border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{margin:0 0 8px;font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:900}
    .modal-text{margin:0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.76);white-space:pre-line}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

    .modal-btn{
      min-height:46px;border:none;border-radius:16px;cursor:pointer;
      font-family:inherit;font-size:13px;font-weight:900;
    }

    .modal-btn.primary{background:var(--ai-gradient);color:#05060d}
    .modal-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff}

    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);min-height:44px;padding:11px 16px;border-radius:16px;
      background:rgba(12,16,28,.96);border:1px solid rgba(255,255,255,.10);color:#fff;
      font-size:12px;font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;
      z-index:9999;box-shadow:0 18px 36px rgba(0,0,0,.35);transition:.22s ease;pointer-events:none;
    }

    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:390px){
      .mic-line{grid-template-columns:1fr 66px 1fr;gap:8px}
      .mic-btn{width:66px;height:66px}
      .mic-btn svg{width:28px;height:28px}
      .bubble{font-size:22px}
      .bubble.latest{font-size:30px}
      .center-action{font-size:13px;padding:10px 7px}
      .mode-pill button{font-size:10px;padding:0 9px}
    }
  </style>
</head>

<body>
  <button id="topProfileLoginBtn" class="floating-login-btn" type="button" aria-label="Google ile giriş yap">
    <span class="login-plus">+</span>
    <span class="login-text">Giriş</span>
  </button>

  <main class="container">
    <section class="half-screen top" id="topSection">
      <div class="lang-row">
        <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-top">
        <div class="pop-head">
          <div id="topPopTitle">ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-line">
        <div class="mic-side"></div>
        <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>
        <div class="mic-side"></div>
      </div>
    </section>

    <section class="center-hub">
      <button id="centerLoginBtn" class="center-action center-login" type="button">Yazıdan Çeviri</button>

      <div class="orb">
        <span class="sat sat1"></span>
        <span class="sat sat2"></span>
        <span class="orb-main">italky<span class="ai">AI</span></span>
      </div>

      <button id="centerClearBtn" class="center-action center-clear" type="button">Temizle</button>
    </section>

    <section class="half-screen bottom" id="botSection">
      <div class="lang-row">
        <button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
      </div>

      <div class="popover" id="pop-bot">
        <div class="pop-head">
          <div id="botPopTitle">ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-line">
        <div class="mic-side">
          <a id="privacyLink" class="privacy-link" href="/pages/privacy.html">Gizlilik</a>
        </div>

        <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
            <path d="M19 10a7 7 0 0 1-14 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
        </button>

        <div class="mic-side">
          <div class="mode-pill" aria-label="Çeviri modu">
            <button id="modeOnlineBtn" class="active" type="button">Online</button>
            <button id="modeOfflineBtn" type="button">Offline</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="adModal" class="modal">
    <div class="modal-card">
      <h3 class="modal-title" id="adTitle">Ücretsiz Kullanım</h3>
      <p class="modal-text" id="adText">
        FaceToFace ücretsiz kullanımda reklam içerir. Reklamı izledikten sonra çeviriye devam edebilirsiniz.
      </p>
      <div class="modal-actions">
        <button id="watchAdBtn" class="modal-btn primary" type="button">Reklam İzle</button>
        <button id="closeAdBtn" class="modal-btn secondary" type="button">Şimdilik Kapat</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { getLangPoolForSite } from "/js/lang_pool_full.js";
    import { supabase } from "/js/supabase_client.js";

    const API_BASE = "https://italky-api.onrender.com";
    const $ = (id) => document.getElementById(id);

    const HOME_URL = "/pages/home.html";
    const TEXT_TRANSLATION_URL = "/pages/text_to_text.html";

    const SITE_LANG_KEY = "site_lang";
    const LEGACY_SITE_LANG_KEY = "italky_site_lang_v1";
    const NATIVE_LANG_KEY = "italky_native_lang_v7";
    const OFFLINE_INSTALLED_KEY = "italky_offline_installed_pairs_v7";
    const OFFLINE_LICENSE_DAYS_KEY = "italky_offline_license_days_v7";
    const HOME_LANG_WIDGET_KEY = "italky_home_lang_pack_widget_v1";

    const AD_INTERVAL_MS = 3 * 60 * 1000;

    const BCP = {
      tr:"tr-TR", en:"en-US", de:"de-DE", fr:"fr-FR", it:"it-IT", es:"es-ES",
      ar:"ar-SA", ru:"ru-RU", bg:"bg-BG", pt:"pt-PT", zh:"zh-CN", ja:"ja-JP", ko:"ko-KR"
    };

    const UI = {
      tr:{
        textTranslate:"Yazıdan Çeviri",
        clear:"Temizle",
        privacy:"Gizlilik",
        login:"Giriş",
        topLang:"ÜST DİL",
        botLang:"ALT DİL",
        adTitle:"Ücretsiz Kullanım",
        adText:"FaceToFace ücretsiz kullanımda reklam içerir. Devam etmek için kısa bir reklam izleyin.",
        downloadAdTitle:"Dil Paketi İndirme",
        downloadAdText:"Bu dili internet olmadan kullanmak için dil paketini indirebilirsiniz.",
        watchAd:"Reklam İzle",
        close:"Şimdilik Kapat",
        adNeeded:"Reklam izlenmeden işlem başlatılmadı.",
        micError:"Mikrofon hatası.",
        micDenied:"Mikrofon izni gerekli.",
        micUnsupported:"Bu cihazda konuşma algılama desteklenmiyor.",
        translateError:"Çeviri yapılamadı",
        adPreparing:"Reklam hazırlanıyor, devam edebilirsiniz.",
        adOpenError:"Reklam açılamadı, devam edebilirsiniz.",
        loginStarting:"Google giriş başlatılıyor…",
        loginFailed:"Giriş başlatılamadı.",
        onlineMode:"Online mod aktif.",
        offlineMode:"Offline mod seçildi. Dil paketi yoksa indirme ikonundan indirebilirsiniz.",
        packReady:"Dil paketi zaten hazır.",
        packDownloading:"Dil paketiniz indiriliyor.",
        packDownloaded:"Dil paketiniz indirildi.",
        nativeChangeTitle:"Offline Ana Dil Değişimi",
        nativeChangeText:"Daha önce seçtiğiniz offline ana dil: {oldLang}\n\nŞu anda alt dili {newLang} seçtiniz.\n\nAna dilinizi {newLang} yapmak isterseniz daha önce indirdiğiniz offline dil paketleri silinir.\n\nDevam etmek istiyor musunuz?",
        nativeChangeOk:"Ana Dili Değiştir",
        nativeChangeCancel:"Vazgeç",
        offerTitle:"Offline Dil Paketi",
        offerText:"{sourceLang} ⇄ {targetLang} paketini indirerek bu dili internet olmadan da kullanabilirsiniz.",
        offerOk:"İndir",
        offerCancel:"Şimdilik Kapat",
        sameLang:"Aynı dil için paket indirilemez.",
        nativeNotReady:"Gerçek indirme için uygulama tarafı hazır değil."
      },
      en:{
        textTranslate:"Text Translation",
        clear:"Clear",
        privacy:"Privacy",
        login:"Login",
        topLang:"TOP LANGUAGE",
        botLang:"BOTTOM LANGUAGE",
        adTitle:"Free Use",
        adText:"FaceToFace free use includes ads. Watch a short ad to continue.",
        downloadAdTitle:"Language Pack Download",
        downloadAdText:"You can download this language pack to use it without internet.",
        watchAd:"Watch Ad",
        close:"Close",
        adNeeded:"The action was not started without watching the ad.",
        micError:"Microphone error.",
        micDenied:"Microphone permission is required.",
        micUnsupported:"Speech recognition is not supported on this device.",
        translateError:"Translation failed",
        adPreparing:"Ad is preparing, you can continue.",
        adOpenError:"Ad could not open, you can continue.",
        loginStarting:"Google sign-in is starting…",
        loginFailed:"Could not start sign-in.",
        onlineMode:"Online mode is active.",
        offlineMode:"Offline mode selected. Download packs from the language icon if needed.",
        packReady:"Language pack is already ready.",
        packDownloading:"Your language pack is downloading.",
        packDownloaded:"Your language pack has been downloaded.",
        nativeChangeTitle:"Offline Native Language Change",
        nativeChangeText:"Your previous offline native language: {oldLang}\n\nYou selected {newLang} as the bottom language now.\n\nIf you make {newLang} your native offline language, your previously downloaded offline packs will be deleted.\n\nDo you want to continue?",
        nativeChangeOk:"Change Native Language",
        nativeChangeCancel:"Cancel",
        offerTitle:"Offline Language Pack",
        offerText:"Download the {sourceLang} ⇄ {targetLang} pack to use this language without internet.",
        offerOk:"Download",
        offerCancel:"Not Now",
        sameLang:"You cannot download a pack for the same language.",
        nativeNotReady:"Native download is not ready on this device."
      }
    };

    function canonical(code){
      return String(code || "").toLowerCase().split("-")[0].trim();
    }

    function readJson(key, fallback){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : fallback;
      }catch{
        return fallback;
      }
    }

    function writeJson(key, value){
      try{
        localStorage.setItem(key, JSON.stringify(value || {}));
      }catch{}
    }

    function getInitialSiteLang(){
      return canonical(
        localStorage.getItem(SITE_LANG_KEY) ||
        localStorage.getItem(LEGACY_SITE_LANG_KEY) ||
        localStorage.getItem(NATIVE_LANG_KEY) ||
        navigator.language ||
        "tr"
      ) || "tr";
    }

    const SITE_LANG = getInitialSiteLang();

    const RAW_LANG_POOL = Array.isArray(getLangPoolForSite(SITE_LANG))
      ? getLangPoolForSite(SITE_LANG)
      : [];

    const LANGS = RAW_LANG_POOL
      .map((l) => {
        const code = canonical(l.code);
        if(!code) return null;

        return {
          code,
          flag:l.flag || "🌐",
          name:l.name || l.tr_name || code.toUpperCase(),
          bcp:BCP[code] || `${code}-${String(code).toUpperCase()}`
        };
      })
      .filter(Boolean)
      .filter((item,index,arr) => {
        return arr.findIndex((x) => x.code === item.code) === index;
      });

    function langExists(code){
      return !!LANGS.find((x) => x.code === canonical(code));
    }

    function langObj(code){
      const c = canonical(code);

      return LANGS.find((x) => x.code === c) || {
        code:c || "en",
        flag:"🌐",
        name:(c || "en").toUpperCase(),
        bcp:BCP[c] || "en-US"
      };
    }

    function labelChip(code){
      const o = langObj(code);
      return `${o.flag} ${o.name}`;
    }

    function differentLang(base){
      const b = canonical(base);

      const preferred = b === "tr"
        ? ["en","de","fr","es","it","ar","ru"]
        : ["tr","en","de","fr","es","it","ar","ru"];

      for(const c of preferred){
        if(c !== b && langExists(c)) return c;
      }

      return LANGS.find((l) => l.code !== b)?.code || "en";
    }

    function getInitialBotLang(){

        localStorage.getItem(SITE_LANG_KEY) ||
        localStorage.getItem(LEGACY_SITE_LANG_KEY) ||
        navigator.language ||
        "tr"
      );

      if(raw && langExists(raw)) return raw;
      if(langExists("tr")) return "tr";

      return LANGS[0]?.code || "tr";
    }

    function pairKey(from, to){

    function hasAnyInstalledPair(){

    }

    function hasInstalledPair(a, b){
      const from = canonical(a);
      const to = canonical(b);
      const installed = getInstalledPairs();

      return !!installed[pairKey(from,to)] && !!installed[pairKey(to,from)];
    }

    function getOfflineNativeLang(){

    function saveHomeLangPackWidget(sourceCode, targetCode, status = "downloading"){
      const source = canonical(sourceCode);
      const target = canonical(targetCode);

      if(!source || !target || source === target) return;

      const sourceInfo = langObj(source);
      const targetInfo = langObj(target);

      const item = {
        source,
        target,
        sourceName: sourceInfo.name,
        targetName: targetInfo.name,
        sourceFlag: sourceInfo.flag,
        targetFlag: targetInfo.flag,
        title: `${sourceInfo.name} ⇄ ${targetInfo.name}`,
        status,
        statusText: status === "ready" ? "Dil paketi hazır" : "Dil paketi indiriliyor",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      try{
        localStorage.setItem(HOME_LANG_WIDGET_KEY, JSON.stringify(item));
      }catch(e){
        console.warn("Ana sayfa dil paketi widget kaydı yazılamadı:", e);
      }
    }

    function markInstalledBiDirectional(sourceCode, targetCode){
      const source = canonical(sourceCode);
      const target = canonical(targetCode);

      if(!source || !target || source === target) return;

      const installed = getInstalledPairs();
      const expiresAt = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString();

      installed[pairKey(source,target)] = {
        from:source,
        to:target,
        installedAt:new Date().toISOString(),
        expiresAt
      };

      installed[pairKey(target,source)] = {
        from:target,
        to:source,
        installedAt:new Date().toISOString(),
        expiresAt
      };

      saveInstalledPairs(installed);
    }

    async function resolveOfflineNativeForDownload(){
      const currentBottom = canonical(botLang);
      const savedNative = getOfflineNativeLang();

      if(!currentBottom) return null;

      if(!savedNative){
        setOfflineNativeLang(currentBottom);
        return currentBottom;
      }

      if(savedNative === currentBottom){
        return savedNative;
      }

      if(!hasAnyInstalledPair()){
        setOfflineNativeLang(currentBottom);
        return currentBottom;
      }

      const oldInfo = langObj(savedNative);
      const newInfo = langObj(currentBottom);

      const ok = await showModalChoice({
        title:tx("nativeChangeTitle"),
        text:tFormat("nativeChangeText", {
          oldLang:`${oldInfo.flag} ${oldInfo.name}`,
          newLang:`${newInfo.flag} ${newInfo.name}`
        }),
        okText:tx("nativeChangeOk"),
        cancelText:tx("nativeChangeCancel")
      });

      if(!ok){
        return null;
      }

      clearInstalledPairs();
      setOfflineNativeLang(currentBottom);
      return currentBottom;
    }

    async function startOfflinePackDownload(targetCode, reason = "manual"){
      const target = canonical(targetCode);
      if(!target) return false;

      const targetInfo = langObj(target);

      const nativeLang = await resolveOfflineNativeForDownload();
      if(!nativeLang) return false;

      if(nativeLang === target){
        showToast(tx("sameLang"));
        return false;
      }

      if(hasInstalledPair(nativeLang,target)){
        saveHomeLangPackWidget(nativeLang,target,"ready");
        showToast(tx("packReady"));
        return true;
      }

      const nativeInfo = langObj(nativeLang);

      const offerOk = await showModalChoice({
        title:tx("offerTitle"),
        text:tFormat("offerText", {
          sourceLang:`${nativeInfo.flag} ${nativeInfo.name}`,
          targetLang:`${targetInfo.flag} ${targetInfo.name}`
        }),
        okText:tx("offerOk"),
        cancelText:tx("offerCancel")
      });

      if(!offerOk) return false;

      const adOk = await showAdModal({
        title:tx("downloadAdTitle"),
        text:`${targetInfo.flag} ${targetInfo.name}\n\n${tx("downloadAdText")}`,
        adUnit:`offline_download_${target}`
      });

      if(!adOk){
        showToast(tx("adNeeded"));
        return false;
      }

      ensurePublicOfflineLicenseOnce();

      if(!canUseNativeOfflineInstaller()){
        showToast(tx("nativeNotReady"));
        return false;
      }

      const payload = JSON.stringify({
        source:nativeLang,
        target
      });

      try{
        pendingDownloadSource = nativeLang;
        pendingDownloadTarget = target;

        window.OfflineTranslate.downloadBiDirectionalPair(payload);

        saveHomeLangPackWidget(nativeLang,target,"downloading");
        showToast(tx("packDownloading"));

        return true;
      }catch(e){
        console.error("FaceToFace offline download error:", e);
        pendingDownloadSource = "";
        pendingDownloadTarget = "";
        showToast(`${targetInfo.name} indirilemedi.`);
        return false;
      }
    }

      const key = `italky_offer_offline_pack_${canonical(nativeLang)}_${canonical(target)}_v1`;
      if(sessionStorage.getItem(key) === "1") return;

      sessionStorage.setItem(key,"1");

    function addBubble(side,text,latest=false){
      const body = side === "top" ? topBody : botBody;

    function buildRecognizer(langCode){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR) return null;

      const rec = new SR();
      rec.lang = langObj(langCode).bcp;
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      return rec;
    }

    function stopRecognizer(){
      try{ recognizer?.stop?.(); }catch{}
    }

    function cleanupTranscript(text){
      return String(text || "")
        .replace(/\s+/g," ")
        .replace(/\b(\S+)( \1\b)+/gi,"$1")
        .trim();
    }

    async function translateOnline(text,from,to){
      const endpoints = [
        `${API_BASE}/api/translate_ai`,
        `${API_BASE}/api/translate-ai`,
        `${API_BASE}/api/translate`
      ];

      for(const endpoint of endpoints){
        try{
          const r = await fetch(endpoint,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              text:String(text || "").trim(),
              from_lang:canonical(from),
              to_lang:canonical(to),
              source:canonical(from),
              target:canonical(to),
              mode:"normal",
              use_ai:false,
              cultural:false,
              tone:"neutral",
              style:"warm"
            })
          });

          const j = await r.json().catch(() => null);
          const value = String(j?.translated || j?.translation || j?.text || "").trim();

          if(r.ok && value) return value;
        }catch{}
      }

      return null;
    }

    function translateOffline(text,from,to){
      return new Promise((resolve) => {
        if(!canUseNativeOfflineTranslator()){
          resolve(null);
          return;
        }

        const handler = (e) => {
          window.removeEventListener("offlineTranslateResult",handler);
          const value = String(e.detail?.translatedText || e.detail?.translation || "").trim();
          resolve(value || null);
        };

        window.addEventListener("offlineTranslateResult",handler);

        try{
          window.OfflineTranslate.translate(
            JSON.stringify({
              text:String(text || "").trim(),
              from:canonical(from),
              to:canonical(to)
            })
          );
        }catch{
          window.removeEventListener("offlineTranslateResult",handler);
          resolve(null);
        }
      });
    }

    async function translateText(text,from,to){
      if(currentMode === "offline"){
        if(!hasInstalledPair(from,to)){
          showToast(tx("offlineMode"));
          await startOfflinePackDownload(topLang,"offline_mode");
          return null;
        }

        const offline = await translateOffline(text,from,to);
        if(offline) return offline;

        showToast(tx("translateError"));
        return null;
      }

      return await translateOnline(text,from,to);
    }

    function speak(text,langCode){
      const value = String(text || "").trim();
      if(!value) return;

      try{
        window.speechSynthesis?.cancel?.();

        if(window.NativeTTS?.speak){
          window.NativeTTS.speak(value,canonical(langCode));
          return;
        }

        const u = new SpeechSynthesisUtterance(value);
        u.lang = langObj(langCode).bcp;
        u.rate = .95;

        speechSynthesis.speak(u);
      }catch{}
    }

    async function finalizeSpeech(side,text){
      const clean = cleanupTranscript(text);
      if(!clean) return;

      const adOk = await maybeShowAd();
      if(!adOk) return;

      const src = side === "top" ? topLang : botLang;
      const dst = side === "top" ? botLang : topLang;
      const other = side === "top" ? "bot" : "top";

      addBubble(side,clean,false);

      const targetRow = addBubble(other,"",true);
      const translated = await translateText(clean,src,dst);

      if(!translated){
        if(targetRow) targetRow.textContent = tx("translateError");
        return;
      }

      targetRow.textContent = translated;

      if(currentMode === "online"){
        speak(translated,dst);
        maybeOfferOfflinePackAfterTranslate();
      }
    }

    function startRecording(side){
      if(recognizer){
        stopRecognizer();
        return;
      }

      const sourceLang = side === "top" ? topLang : botLang;
      const rec = buildRecognizer(sourceLang);

      if(!rec){
        showToast(tx("micUnsupported"));
        return;
      }

      recognizer = rec;
      liveText = "";

      rec.onstart = () => setMicState(side,true);

      rec.onresult = (e) => {
        let finalText = "";
        let interimText = "";

        for(let i=0;i<e.results.length;i++){
          const txt = String(e.results[i]?.[0]?.transcript || "").trim();
          if(!txt) continue;

          if(e.results[i].isFinal) finalText += ` ${txt}`;
          else interimText += ` ${txt}`;
        }

        liveText = cleanupTranscript(finalText || interimText || liveText);
      };

      rec.onerror = (e) => {
        const err = String(e?.error || "");

        showToast(err.includes("not-allowed") ? tx("micDenied") : tx("micError"));

        setMicState(side,false);
        recognizer = null;
        liveText = "";
      };

      rec.onend = () => {
        const finalText = cleanupTranscript(liveText);

        setMicState(side,false);
        recognizer = null;
        liveText = "";

        if(finalText) finalizeSpeech(side,finalText);
      };

      try{
        rec.start();
      }catch{
        showToast(tx("micError"));
        setMicState(side,false);
        recognizer = null;
        liveText = "";
      }
    }

    topMic.addEventListener("click",() => startRecording("top"));

    window.onNativeLoginSuccess = async function(payload){
      try{
        const data = typeof payload === "string" ? JSON.parse(payload) : payload;
        const idToken = String(data?.id_token || data?.idToken || "").trim();

        if(!idToken){
          showToast(tx("loginFailed"));
          return;
        }

        const { error } = await supabase.auth.signInWithIdToken({
          provider:"google",
          token:idToken
        });

        if(error){
          console.error("signInWithIdToken error:",error);
          showToast(tx("loginFailed"));
          return;
        }

        location.replace(HOME_URL);
      }catch(e){
        console.error("onNativeLoginSuccess error:",e);
        showToast(tx("loginFailed"));
      }
    };

    topProfileLoginBtn?.addEventListener("click",(e) => {
      e.preventDefault();
      startGoogleLogin();
    });

    window.addEventListener("offlinePairDownloadStarted",(e) => {
      const d = e.detail || {};
      const source = canonical(d.source || pendingDownloadSource || getOfflineNativeLang() || botLang);
      const target = canonical(d.target || pendingDownloadTarget);

      if(!source || !target) return;

      saveHomeLangPackWidget(source,target,"downloading");
      showToast(tx("packDownloading"));
    });

    window.addEventListener("offlinePairDownloadCompleted",(e) => {
      const d = e.detail || {};
      const source = canonical(d.source || pendingDownloadSource || getOfflineNativeLang() || botLang);
      const target = canonical(d.target || pendingDownloadTarget);

      if(!source || !target) return;

      markInstalledBiDirectional(source,target);
      saveHomeLangPackWidget(source,target,"ready");

      pendingDownloadSource = "";
      pendingDownloadTarget = "";

      showToast(tx("packDownloaded"));
    });

    window.addEventListener("offlinePairDownloadFailed",(e) => {
      const d = e.detail || {};
      pendingDownloadSource = "";
      pendingDownloadTarget = "";

      showToast(d.error || tx("translateError"));
    });

    function applyRouteParams(){
      const params = new URLSearchParams(location.search);

      const source = canonical(params.get("source") || "");
      const target = canonical(params.get("target") || "");
      const mode = canonical(params.get("mode") || "");

      if(source && langExists(source)){
        botLang = source;
      }

      if(target && langExists(target)){
        topLang = target;
      }

      if(topLang === botLang){
        topLang = differentLang(botLang);
      }

      if(mode === "offline"){
        currentMode = "offline";
      }
    }

    async function detectCountryLang(){
      try{
        const r = await fetch("https://ipapi.co/json/",{cache:"no-store"});
        const j = await r.json();
        const country = String(j?.country_code || "").toUpperCase();

        const map = {
          TR:"tr", CY:"tr",
          US:"en", GB:"en", IE:"en", AU:"en", CA:"en", NZ:"en",
          DE:"de", AT:"de", CH:"de",
          FR:"fr", BE:"fr",
          ES:"es", MX:"es", AR:"es", CO:"es", CL:"es", PE:"es",
          IT:"it", RU:"ru", BG:"bg", PT:"pt", BR:"pt",
          CN:"zh", JP:"ja", KR:"ko", SA:"ar", AE:"ar", EG:"ar"
        };

        const code = map[country];

        if(code && langExists(code)) return code;
      }catch{}

      const nav = canonical(navigator.language || "");

      if(nav && langExists(nav)) return nav;

      return botLang;
    }

    async function boot(){
      const params = new URLSearchParams(location.search);
      const hasRouteLang = params.get("source") || params.get("target");

      if(!hasRouteLang){
        const detected = await detectCountryLang();

        if(detected && langExists(detected)){
          botLang = detected;
          if(topLang === botLang) topLang = differentLang(botLang);
        }
      }

      applyRouteParams();

      if(!getOfflineNativeLang()){
        setOfflineNativeLang(botLang);
      }

      refreshTexts();
      refreshModeButtons();
      clearBody(topBody);
      clearBody(botBody);
    }

    boot();
  </script>
</body>
</html>
