  <script>
    (function(){
      const GUEST_MODE_KEY = "italky_guest_mode_v1";
      let guestBusy = false;
      let googleBusy = false;

      function bindPress(el, handler){
        if(!el) return;
        let lastRun = 0;
        const wrapped = function(event){
          try{ event.preventDefault(); }catch(e){}
          if(window.__italkyUpdateRequired) return;
          const now = Date.now();
          if(now - lastRun < 550) return;
          lastRun = now;
          handler(event);
        };

        el.addEventListener("click", wrapped);
        el.addEventListener("pointerup", wrapped);
        el.addEventListener("touchend", wrapped, { passive:false });
      }

      function continueAsGuestFallback(){
        if(guestBusy) return;
        guestBusy = true;
        try{ localStorage.setItem(GUEST_MODE_KEY, "1"); }catch(e){}
        location.assign("/pages/login_entry.html");
      }

      function googleFallback(){
        if(googleBusy) return;
        googleBusy = true;

        if(typeof window.__italkyLoginGooglePress === "function"){
          window.__italkyLoginGooglePress();
          return;
        }

        try{
          if(window.Native && typeof window.Native.startGoogleLogin === "function"){
            window.Native.startGoogleLogin();
            return;
          }
        }catch(e){}

        googleBusy = false;
        document.dispatchEvent(new CustomEvent("italkyLoginGooglePress"));
      }

      document.addEventListener("DOMContentLoaded", function(){
        bindPress(document.getElementById("guestBtn"), continueAsGuestFallback);
        bindPress(document.getElementById("googleBtn"), googleFallback);
      });
    })();
  </script>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";
    import { ensureAuthAndCacheUser, loginWithGoogle } from "/js/auth.js";

    const toastEl = document.getElementById("toast");
    const googleBtn = document.getElementById("googleBtn");
    const guestBtn = document.getElementById("guestBtn");
    const typeEl = document.getElementById("typewriter");
    const updateModal = document.getElementById("updateModal");
    const updatePlayBtn = document.getElementById("updatePlayBtn");

    const MIN_REQUIRED_VERSION = 82;
    const PLAY_STORE_PACKAGE = "com.ozyigits.italkyai";
    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";
    const MARKET_URL = "market://details?id=com.ozyigits.italkyai";
    const MARKET_INTENT_URL = "intent://details?id=com.ozyigits.italkyai#Intent;scheme=market;package=com.android.vending;end";
    const HOME = "/pages/home.html";
    const MEMBERSHIP = "/pages/membership.html";
    const CALLBACK = "/pages/auth_callback.html";
    const ACCESS_API = "https://italky-api.onrender.com/api/session/access-state";
    const GUEST_MODE_KEY = "italky_guest_mode_v1";
    const DEFAULT_AFTER_LOGIN = MEMBERSHIP;

    let googlePressBusy = false;
    let guestPressBusy = false;
    window.__italkyUpdateRequired = false;

    function unlockLoginUi(){ document.body.classList.remove("auth-checking"); }

    function toast(msg){
      if(!toastEl) return;
      toastEl.textContent = String(msg || "");
      toastEl.classList.add("show");
      clearTimeout(window.__to);
      window.__to = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function authDebug(reason, detail = {}){
      try{ console.warn("[SUPABASE_AUTH]", reason, detail); }catch{}
    }

    function nativeTokenHash(token){
      const raw = String(token || "");
      return `${raw.length}:${raw.slice(0, 18)}:${raw.slice(-18)}`;
    }

    function isRateLimitError(error){
      const msg = String(error?.message || error || "").toLowerCase();
      return msg.includes("rate limit") || msg.includes("too many") || msg.includes("429");
    }

    function isActiveAccess(access){
      return Boolean(
        access?.access_open ||
        access?.ads_disabled ||
        access?.no_ads ||
        access?.is_no_ads_member ||
        access?.subscription_active ||
        access?.has_active_membership ||
        access?.is_member ||
        access?.package_active ||
        access?.plan === "premium" ||
        access?.app_access_mode === "premium" ||
        access?.promo_active ||
        access?.nfc_active
      );
    }

    async function fetchAccessStateSafe(session){
      try{
        if(!session?.access_token) return null;
        const resp = await fetch(ACCESS_API, {
          method: "GET",
          headers: { Authorization: `Bearer ${session.access_token}` },
          cache: "no-store"
        });
        const json = await resp.json().catch(() => ({}));
        authDebug("login access-state", { status: resp.status, ok: resp.ok, accessOpen: !!json?.access_open });
        if(!resp.ok) return null;
        return json || null;
      }catch(e){
        authDebug("login access-state failed", { message: e?.message || String(e || "") });
        return null;
      }
    }

    function shouldProcessNativeToken(idToken){
      const now = Date.now();
      const hash = nativeTokenHash(idToken);
      const lastHash = String(window.__italkyLastNativeIdTokenHash || "");
      const lastAt = Number(window.__italkyLastNativeLoginAt || 0);

      if(window.__italkyNativeLoginDone){
        authDebug("native login ignored", { reason: "already_done" });
        return false;
      }

      if(window.__italkyNativeLoginInFlight){
        authDebug("native login ignored", { reason: "in_flight" });
        return false;
      }

      if(lastHash === hash && now - lastAt < 30000){
        authDebug("native login ignored", { reason: "duplicate_token_30s", ageMs: now - lastAt });
        return false;
      }

      window.__italkyLastNativeIdTokenHash = hash;
      window.__italkyLastNativeLoginAt = now;
      window.__italkyNativeLoginInFlight = true;
      return true;
    }

    function decodeJwtPayload(token){
      try{
        const part = String(token || "").split(".")[1] || "";
        if(!part) return null;
        const normalized = part.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        return JSON.parse(atob(padded));
      }catch(e){
        return null;
      }
    }

    async function waitForNativeSession(attempts = 8, delayMs = 350){
      for(let i = 0; i < attempts; i++){
        const { data:{ session }, error } = await supabase.auth.getSession();
        authDebug("native getSession", { attempt: i + 1, hasSession: !!session, error: error?.message || "" });
        if(session) return session;
        await new Promise((resolve) => setTimeout(resolve, delayMs));
      }
      return null;
    }

    async function fallbackToWebOAuth(reason){
      try{
        const next = getNextTarget();
        authDebug("native fallback to web oauth", { reason, next: next || DEFAULT_AFTER_LOGIN });
        toast("Google oturumu web üzerinden tekrar açılıyor...");
        await loginWithGoogle(next);
      }catch(e){
        authDebug("web oauth fallback failed", { reason, message: e?.message || String(e || "") });
        toast(e?.message || "Giriş başlatılamadı.");
        resetLoginButtons();
      }
    }

    function resetLoginButtons(){
      googlePressBusy = false;
      if(window.__italkyUpdateRequired) return;
      if(googleBtn) googleBtn.disabled = false;
      if(guestBtn) guestBtn.disabled = false;
    }

    function bindSafePress(el, handler){
      if(!el) return;
      let lastRun = 0;
      const wrapped = (event) => {
        try{ event?.preventDefault?.(); }catch{}
        if(window.__italkyUpdateRequired) return;
        const now = Date.now();
        if(now - lastRun < 550) return;
        lastRun = now;
        handler(event);
      };
      el.addEventListener("click", wrapped);
      el.addEventListener("pointerup", wrapped);
      el.addEventListener("touchend", wrapped, { passive:false });
    }

    function isNative(){
      return !!(window.Native && typeof window.Native.startGoogleLogin === "function");
    }

    function safePath(value){
      const raw = String(value || "").trim();
      if(!raw) return "";
      if(raw.startsWith("http://")) return "";
      if(raw.startsWith("https://")) return "";
      if(raw.startsWith("//")) return "";
      if(!raw.startsWith("/")) return "";
      return raw;
    }

    function getNextTarget(){
      try{
        const u = new URL(location.href);
        return safePath(u.searchParams.get("next") || "");
      }catch{
        return "";
      }
    }

    function clearGuestMode(){
      try{ localStorage.removeItem(GUEST_MODE_KEY); }catch{}
    }

    function continueAsGuest(){
      if(window.__italkyUpdateRequired) return;
      try{ localStorage.setItem(GUEST_MODE_KEY, "1"); }catch{}
      location.assign("/pages/login_entry.html");
    }

    function generateItalkyPromoCode(){
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const digits = "0123456789";
      const blockedPairs = new Set(["AK", "FG", "FB", "GS"]);
      for(let attempt = 0; attempt < 200; attempt++){
        const chars = Array.from({ length: 8 }, () => digits[Math.floor(Math.random() * digits.length)]);
        const positions = [];
        while(positions.length < 2){
          const pos = Math.floor(Math.random() * chars.length);
          if(!positions.includes(pos)) positions.push(pos);
        }
        positions.sort((a, b) => a - b);
        chars[positions[0]] = letters[Math.floor(Math.random() * letters.length)];
        chars[positions[1]] = letters[Math.floor(Math.random() * letters.length)];
        const pair = chars.filter((ch) => /[A-Z]/.test(ch)).join("");
        if(blockedPairs.has(pair)) continue;
        return chars.join("");
      }
      return "B1C23456";
    }

    window.generateItalkyPromoCode = generateItalkyPromoCode;

    function normalizeVersionCode(value){
      const n = Number(String(value ?? "").trim());
      return Number.isFinite(n) && n > 0 ? n : null;
    }

    function readBridgeVersionCode(bridge){
      try{
        if(!bridge || typeof bridge.getVersionCode !== "function") return null;
        return normalizeVersionCode(bridge.getVersionCode());
      }catch{
        return null;
      }
    }

    function getNativeVersionCode(){
      return readBridgeVersionCode(window.AndroidBridge) || readBridgeVersionCode(window.Native);
    }

    function callNativePlayStore(){
      const bridges = [window.AndroidBilling, window.AndroidBridge, window.Native, window.OpenExternal];
      for(const bridge of bridges){
        try{
          if(bridge && typeof bridge.openPlayStore === "function"){
            bridge.openPlayStore(PLAY_STORE_PACKAGE);
            return true;
          }
        }catch{
          try{
            bridge.openPlayStore();
            return true;
          }catch{}
        }
      }
      return false;
    }

    function callNativeExternal(url){
      const bridges = [window.AndroidBilling, window.AndroidBridge, window.Native, window.OpenExternal, window.DeviceBridge];
      const methods = ["openExternal", "openExternalUrl", "openUrl", "openBrowser", "openLink"];
      for(const bridge of bridges){
        if(!bridge) continue;
        for(const method of methods){
          try{
            if(typeof bridge[method] === "function"){
              bridge[method](url);
              return true;
            }
          }catch{}
        }
      }
      return false;
    }

    function openExternalStoreUrl(url){
      if(callNativeExternal(url)) return true;
      try{
        const opened = window.open(url, "_system");
        if(opened) return true;
      }catch{}
      try{
        const opened = window.open(url, "_blank", "noopener,noreferrer");
        if(opened) return true;
      }catch{}
      return false;
    }

    function openPlayStore(){
      if(callNativePlayStore()) return;
      if(openExternalStoreUrl(MARKET_URL)) return;
      setTimeout(() => {
        try{ location.href = MARKET_INTENT_URL; }catch{}
      }, 120);
      setTimeout(() => {
        openExternalStoreUrl(PLAY_STORE_URL);
      }, 850);
    }

    function showUpdateRequired(){
      window.__italkyUpdateRequired = true;
      if(googleBtn) googleBtn.disabled = true;
      if(guestBtn) guestBtn.disabled = true;
      if(updateModal) updateModal.classList.add("show");
    }

    function checkAppUpdate(){
      const versionCode = getNativeVersionCode();
      if(versionCode === null) return;
      if(versionCode < MIN_REQUIRED_VERSION) showUpdateRequired();
    }

    updatePlayBtn?.addEventListener("click", (event) => {
      try{ event.preventDefault(); }catch{}
      openPlayStore();
    });

    async function grantSignupBonusOnce(){
      try{
        const { data, error } = await supabase.rpc("grant_signup_bonus_once", { p_bonus: 5 });
        if(error) return { ok:false, bonus_granted:false };
        if(Array.isArray(data) && data.length) return data[0] || { ok:true, bonus_granted:false };
        return data || { ok:true, bonus_granted:false };
      }catch(e){
        return { ok:false, bonus_granted:false };
      }
    }

    async function resolvePostLoginTarget(){
      const next = getNextTarget();
      try{
        const { data:{ session } } = await supabase.auth.getSession();
        const access = await fetchAccessStateSafe(session);
        if(isActiveAccess(access)) return HOME;
      }catch(e){
        authDebug("resolve post-login target failed", { message: e?.message || String(e || "") });
      }
      return next || DEFAULT_AFTER_LOGIN;
    }

    async function routeAfterLogin(){
      try{
        await ensureAuthAndCacheUser();
        clearGuestMode();
        const bonus = await grantSignupBonusOnce();
        const target = await resolvePostLoginTarget();
        const silent = document.body.classList.contains("auth-checking");
        if(silent){
          location.replace(target);
          return;
        }
        if(bonus?.bonus_granted){
          toast("5 jeton hediyeniz tanımlandı.");
          setTimeout(() => location.replace(target), 500);
          return;
        }
        toast("Giriş başarılı.");
        setTimeout(() => location.replace(target), 250);
      }catch(e){
        authDebug("routeAfterLogin fallback", { message: e?.message || String(e || "") });
        clearGuestMode();
        const next = getNextTarget();
        location.replace(next || DEFAULT_AFTER_LOGIN);
      }
    }

    (function bounceToCallbackIfNeeded(){
      const hasCode = new URLSearchParams(location.search).has("code");
      const hasToken = location.hash.includes("access_token=");
      if((hasCode || hasToken) && !location.pathname.endsWith("/pages/auth_callback.html")){
        location.replace(CALLBACK + location.search + location.hash);
      }
    })();

    window.onNativeLoginSuccess = async function(payload){
      if(window.__italkyUpdateRequired) return;
      let idToken = "";
      try{
        const data = (typeof payload === "string") ? JSON.parse(payload) : payload;
        idToken = String(data?.id_token || data?.idToken || "").trim();
        const tokenPayload = decodeJwtPayload(idToken);

        authDebug("native login payload received", {
          payloadType: typeof payload,
          keys: data && typeof data === "object" ? Object.keys(data) : [],
          hasIdToken: !!idToken,
          tokenLength: idToken.length,
          aud: tokenPayload?.aud || "",
          iss: tokenPayload?.iss || "",
          email: tokenPayload?.email || data?.email || ""
        });

        if(!idToken){
          toast("Google token alınamadı. Lütfen tekrar deneyin.");
          resetLoginButtons();
          return;
        }

        if(!shouldProcessNativeToken(idToken)) return;

        googleBtn.disabled = true;
        guestBtn.disabled = true;
        toast("Oturum açılıyor...");

        const { error } = await supabase.auth.signInWithIdToken({ provider: "google", token: idToken });
        if(error){
          const message = String(error.message || "Supabase token reddetti");
          authDebug("signInWithIdToken failed", {
            message,
            status: error.status || "",
            name: error.name || "",
            aud: tokenPayload?.aud || ""
          });
          window.__italkyNativeLoginInFlight = false;
          if(isRateLimitError(error)){
            toast("Çok fazla giriş denemesi oldu. Lütfen biraz bekleyip tekrar deneyin.");
            return;
          }
          toast(`Oturum açılamadı: ${message}`);
          await fallbackToWebOAuth("signInWithIdToken_failed");
          return;
        }

        const session = await waitForNativeSession();
        if(!session){
          authDebug("native sign-in completed but session missing", { aud: tokenPayload?.aud || "" });
          window.__italkyNativeLoginInFlight = false;
          toast("Oturum hazırlanamadı, Google yönlendirmesi deneniyor...");
          await fallbackToWebOAuth("session_missing_after_native_signin");
          return;
        }

        window.__italkyNativeLoginDone = true;
        window.__italkyNativeLoginInFlight = false;
        authDebug("native sign-in success", { userId: session.user?.id || "", email: session.user?.email || "" });
        await routeAfterLogin();
      }catch(e){
        authDebug("native login handler failed", { message: e?.message || String(e || "") });
        window.__italkyNativeLoginInFlight = false;
        if(idToken){
          window.__italkyLastNativeIdTokenHash = nativeTokenHash(idToken);
          window.__italkyLastNativeLoginAt = Date.now();
        }
        toast("Giriş hatası. Google yönlendirmesi deneniyor...");
        await fallbackToWebOAuth("native_handler_exception");
      }
    };

    window.onNativeLoginError = function(reason){
      authDebug("native login error", { reason: String(reason || "unknown") });
      window.__italkyNativeLoginInFlight = false;
      toast(reason ? `Google giriş tamamlanamadı: ${reason}` : "Google giriş tamamlanamadı.");
      resetLoginButtons();
    };

    async function handleGooglePress(){
      if(window.__italkyUpdateRequired) return;
      const now = Date.now();
      if(googlePressBusy || (window.__italkyNativeLoginStartAt && now - Number(window.__italkyNativeLoginStartAt) < 8000)){
        authDebug("google login start ignored", { reason: "start_debounce" });
        return;
      }
      googlePressBusy = true;
      try{
        const next = getNextTarget();
        if(isNative()){
          window.__italkyNativeLoginStartAt = now;
          googleBtn.disabled = true;
          guestBtn.disabled = true;
          authDebug("native google login start", { next: next || DEFAULT_AFTER_LOGIN });
          toast("Google girişi başlatılıyor...");
          window.Native.startGoogleLogin();
          return;
        }
        googleBtn.disabled = true;
        guestBtn.disabled = true;
        authDebug("web oauth login start", { next: next || DEFAULT_AFTER_LOGIN });
        toast("Google yönlendiriliyor...");
        await loginWithGoogle(next);
      }catch(e){
        authDebug("google login start failed", { message: e?.message || String(e || "") });
        toast(e?.message || "Giriş başlatılamadı.");
        resetLoginButtons();
      }
    }

    function handleGuestPress(){
      if(window.__italkyUpdateRequired) return;
      if(guestPressBusy) return;
      guestPressBusy = true;
      continueAsGuest();
    }

    window.__italkyLoginGooglePress = handleGooglePress;
    document.addEventListener("italkyLoginGooglePress", handleGooglePress);
    bindSafePress(googleBtn, handleGooglePress);
    bindSafePress(guestBtn, handleGuestPress);

    const phrases = [
      "Google hesabınızla güvenli giriş yapın...",
      "Üyeliğiniz hesabınıza tanımlanır...",
      "Kod ile abonelik de aynı hesaba bağlanır...",
      "Dünyayı küçülttük, cebinize sığdırdık..."
    ];

    let pi = 0;
    setInterval(() => {
      pi = (pi + 1) % phrases.length;
      if(typeEl){
        typeEl.style.animation = "none";
        typeEl.offsetHeight;
        typeEl.textContent = phrases[pi];
        typeEl.style.animation = null;
      }
    }, 5600);

    checkAppUpdate();

    (async function boot(){
      try{
        if(window.__italkyUpdateRequired) return;
        const { data:{ session } } = await supabase.auth.getSession();
        if(!session){
          unlockLoginUi();
          return;
        }
        await routeAfterLogin();
      }catch(e){
        authDebug("login boot failed", { message: e?.message || String(e || "") });
        unlockLoginUi();
        resetLoginButtons();
      }
    })();
  </script>
</body>
</html>
