<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>italkyAI • Giriş</title><meta name="theme-color" content="#06182b"><link rel="stylesheet" href="/css/onboarding_world.css?v=1"></head><body><div class="ob-page"><header class="ob-head"><img class="ob-logo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI"></header><main class="ob-main"><div class="world-wrap" aria-label="Dünya dilleri"><div class="world-glow"><div class="orbit-line"></div><div class="orbit-line b"></div><div class="flag-sphere" data-flag-sphere></div></div></div><h1 class="slogan">Dünyayı Küçülttük<span>Cebinize Sığdırdık</span></h1><section class="ob-card"><button id="googleBtn" class="google-btn" type="button"><span class="google-g">G</span><span>Google ile giriş yap</span></button><div id="status" class="status" aria-live="polite"></div></section></main><footer class="ob-footer"><nav class="footer-links"><a href="/pages/about.html">Hakkımızda</a><a href="/pages/privacy.html">Gizlilik</a><a href="/pages/contact.html">İletişim</a></nav><div class="seal">italkyAI By Ozyigit's 2026<span class="seal-rune" lang="otk">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span></div></footer></div><script src="/js/onboarding_world.js?v=1"></script><script type="module">import{ supabase,persistSupabaseSessionBackup,waitForSupabaseSession }from'/js/supabase_client.js';import{ ensureAuthAndCacheUser }from'/js/auth.js';const NEXT_DEFAULT='/pages/phone_verify_gate.html';const btn=document.getElementById('googleBtn'),statusEl=document.getElementById('status');let busy=false;function safeNext(){try{const raw=String(new URLSearchParams(location.search||'').get('next')||NEXT_DEFAULT).trim();return raw.startsWith('/')&&!raw.startsWith('//')?raw:NEXT_DEFAULT}catch{return NEXT_DEFAULT}}function setStatus(t){statusEl.textContent=t||''}function nativeBridge(){try{for(const b of[window.Native,window.AndroidBridge,window.CorporateNative])if(b&&typeof b.startGoogleLogin==='function')return b}catch{}return null}function readIdToken(p){try{if(typeof p==='string'){const r=p.trim();if(!r)return'';try{const o=JSON.parse(r);return String(o?.id_token||o?.idToken||o?.token||o?.credential||'').trim()}catch{return r}}return String(p?.id_token||p?.idToken||p?.token||p?.credential||'').trim()}catch{return''}}function bindNativeUser(id){if(!id)return;try{for(const b of[window.Native,window.AndroidBridge,window.CorporateNative])if(b&&typeof b.setUserId==='function'){b.setUserId(id);break}}catch{}}async function finishNativeLogin(payload){if(busy)return;busy=true;btn.disabled=true;try{const idToken=readIdToken(payload);if(!idToken)throw new Error('Google giriş bilgisi alınamadı.');const{data,error}=await supabase.auth.signInWithIdToken({provider:'google',token:idToken});if(error)throw error;const session=data?.session||null,userId=String(data?.user?.id||session?.user?.id||'').trim();if(!session?.access_token||!session?.refresh_token||!userId)throw new Error('Oturum oluşturulamadı.');persistSupabaseSessionBackup(session);try{await ensureAuthAndCacheUser()}catch{}bindNativeUser(userId);location.replace(safeNext())}catch(error){busy=false;btn.disabled=false;setStatus(error?.message||'Giriş tamamlanamadı.')}}window.onNativeLoginSuccess=p=>void finishNativeLogin(p);window.onNativeLoginError=p=>{busy=false;btn.disabled=false;setStatus(typeof p==='string'?p:String(p?.message||''))};async function startLogin(){if(busy)return;busy=true;btn.disabled=true;setStatus('');try{const bridge=nativeBridge();if(bridge){busy=false;btn.disabled=false;bridge.startGoogleLogin();return}const callback=new URL('/pages/auth_callback.html',location.origin);callback.searchParams.set('next',safeNext());const{data,error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:callback.toString(),skipBrowserRedirect:true,queryParams:{access_type:'offline',prompt:'select_account'}}});if(error)throw error;if(!data?.url)throw new Error('Google giriş adresi alınamadı.');location.assign(data.url)}catch(error){busy=false;btn.disabled=false;setStatus(error?.message||'Giriş başlatılamadı.')}}btn.addEventListener('click',()=>void startLogin());(async()=>{const p=new URLSearchParams(location.search||'');if(p.get('logout')==='1'||p.get('force_logout')==='1'||p.get('logged_out')==='1')return;const session=await waitForSupabaseSession({timeoutMs:1800,intervalMs:160,restoreFromBackup:true});if(session?.user?.id){persistSupabaseSessionBackup(session);location.replace(safeNext())}})();</script></body></html>
