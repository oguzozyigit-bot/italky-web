<!-- FILE: /pages/login.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • FaceToFace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    /* BAŞKANIM, TASARIMIN TÜMÜ (CSS) BURADA MÜHÜRLENDİ */
    :root{
      --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}
    body{background:radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),#050508;}
    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    
    /* Senin o meşhur EDGE-HANDLE tasarımların */
    .edge-handle{position:fixed;top:50%;transform:translateY(-50%);z-index:998;width:28px;height:118px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(14px);color:#fff;font-size:11px;font-weight:1000;text-align:center;white-space:pre;box-shadow:0 0 32px rgba(0,0,0,.30);}
    .edge-handle.open{right:0;border-radius:18px 0 0 18px;background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));border:1px solid rgba(255,255,255,.14);border-right:none;}
    .edge-handle.open::before{content:"O\A P\A E\A N";}
    .edge-handle.clear{left:0;border-radius:0 18px 18px 0;background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));border:1px solid rgba(255,255,255,.14);border-left:none;}
    .edge-handle.clear::before{content:"C\A L\A E\A A\A R";}

    /* Senin özel tasarladığın MIC-BTN ve animasyonları */
    .mic-btn{width:70px;height:70px;border-radius:999px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.28);}
    .mic-btn.listening{background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22));animation:micBreath 1.05s ease-in-out infinite;}
    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

    /* Merkezi HUB ve ORB Tasarımı */
    .center-hub{height:82px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);z-index:50;}
    .orb{width:66px;height:66px;border-radius:50%;background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;}
    .orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    
    /* REKLAM ALANI MÜHÜRÜ */
    #adViewContainer{width:100%;height:60px;display:none;justify-content:center;align-items:center;position:absolute;}

    /* Diğer tüm drawer ve modal stillerin aynen korundu */
    .side-drawer{position:absolute;top:0;right:0;width:min(86vw,360px);height:100%;background:linear-gradient(180deg,rgba(7,15,30,.98),rgba(5,8,18,.98));transform:translateX(102%);transition:transform .24s ease;}
    .drawer-backdrop.show .side-drawer{transform:translateX(0)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);padding:11px 16px;background:rgba(12,16,28,.96);color:#fff;border-radius:16px;transition:.22s ease;z-index:9999;}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <!-- HTML YAPISI AYNI KALDI -->
  <button id="sideClearBtn" class="edge-handle clear"></button>
  <button id="drawerEdgeBtn" class="edge-handle open"></button>

  <div id="drawerBackdrop" class="drawer-backdrop">
    <aside class="side-drawer">
      <div class="drawer-logo-row">
        <div class="drawer-logo-main">italky<span class="ai">AI</span></div>
        <div class="drawer-mode-pill"><button id="modeOnlineBtn" class="active">Online</button><button id="modeOfflineBtn">Offline</button></div>
      </div>
      <div class="drawer-card">
        <div class="drawer-label">Kendi Dilim</div>
        <button id="myLangDrawerBtn" class="my-lang-btn"><span id="myLangDrawerFlag">🇹🇷</span> <span id="myLangDrawerTitle">Türkçe</span></button>
      </div>
    </aside>
  </div>

  <main class="container">
    <section class="half-screen top"><button id="topLangBtn" class="lang-trigger">🌐 Seçiliyor...</button><div class="chat-body" id="topBody"></div><button id="topMic" class="mic-btn">🎙️</button></section>
    
    <section class="center-hub">
      <div id="adViewContainer"></div>
      <div class="orb" id="centerLogoOrb">italky<span class="ai">AI</span></div>
    </section>

    <section class="half-screen bottom"><button id="botLangBtn" class="lang-trigger">🌐 Seçiliyor...</button><div class="chat-body" id="botBody"></div><button id="botMic" class="mic-btn">🎙️</button></section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- BEYİN BURADA AYRILDI -->
  <script type="module" src="login.js"></script>
</body>
</html>
