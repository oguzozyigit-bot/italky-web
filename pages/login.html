<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-void:#060408;--neon:#00f2ff;--pink:#ff007a;--brand-grad:linear-gradient(135deg,#00f2ff 0%,#6366f1 55%,#ff007a 100%);--signature-grad:linear-gradient(to right,#fff,#00f2ff,#fff);--accent:#00f2ff;--muted:rgba(255,255,255,.65);--safeB:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{height:100%;width:100%}body{background:var(--bg-void);color:#fff;font-family:'Outfit',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}.nebula{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 25% 20%,rgba(0,242,255,.12),transparent 45%),radial-gradient(circle at 80% 80%,rgba(255,0,122,.10),transparent 55%),radial-gradient(circle at 50% 50%,rgba(15,8,22,1) 0%,#060408 100%);z-index:0}.main{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px;z-index:10;margin-top:-4px}.brand-section{text-align:center;margin-bottom:8px}.brand-section h1{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:1000;letter-spacing:-4px;line-height:1;filter:drop-shadow(0 0 15px rgba(0,242,255,.2))}.brand-section h1 span.ai{background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.brand-sub{margin-top:8px;font-size:12px;font-weight:900;letter-spacing:8px;text-transform:uppercase;color:#fff;opacity:.9;text-shadow:0 0 10px rgba(255,255,255,.3)}
    .world-container{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;margin:8px 0 10px;perspective:1000px}.earth-glow{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(0,242,255,.22) 0%,transparent 70%);filter:blur(25px);opacity:.95;z-index:0;animation:glowBreath 4.8s ease-in-out infinite alternate}@keyframes glowBreath{from{transform:scale(.95);opacity:.6}to{transform:scale(1.1);opacity:.9}}.earth{position:relative;width:196px;height:196px;border-radius:50%;background-image:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74518/world.topo.bathy.200412.3x5400x2700.jpg");background-size:cover;background-position:center;box-shadow:inset -30px -30px 60px rgba(0,0,0,.9),inset 10px 10px 30px rgba(255,255,255,.1),0 0 80px rgba(0,242,255,.25);transform-style:preserve-3d;animation:rotateSphere 34s linear infinite;z-index:2;overflow:hidden}@keyframes rotateSphere{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}.ai-stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:1000;letter-spacing:2px;color:rgba(255,255,255,.95);text-shadow:0 0 20px rgba(0,242,255,.4);mix-blend-mode:screen;opacity:.95;pointer-events:none;user-select:none}.ai-front{font-size:42px;z-index:4}
    .typewriter-container{min-height:40px;margin:4px 0 15px;display:flex;justify-content:center;align-items:center;width:100%;text-align:center}.typewriter{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);line-height:1.45}.login-box{position:relative;width:100%;max-width:330px;z-index:30;display:grid;gap:12px}.main-btn{width:100%;min-height:56px;border:none;border-radius:28px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all .18s ease;user-select:none;font-family:inherit}.main-btn:active{transform:scale(.97)}.google-btn{background:#fff;color:#1f1f1f;box-shadow:0 10px 25px rgba(0,0,0,.3)}.g-icon{width:20px;height:20px;display:block}footer{width:100%;text-align:center;z-index:20;padding-bottom:calc(20px + var(--safeB))}.footer-nav{display:flex;justify-content:center;gap:18px;margin-bottom:12px}.footer-nav a{text-decoration:none;color:rgba(255,255,255,.4);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.brand-seal{font-size:11px;font-weight:900;letter-spacing:1.2px;background:var(--signature-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.gokturk-signature{display:block;margin-top:3px;font-family:"Segoe UI Historic","Noto Sans Old Turkic",serif;font-size:12px;font-weight:900;direction:rtl;unicode-bidi:isolate}#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(6,6,12,.95);border:1px solid var(--accent);padding:12px 20px;border-radius:999px;color:#fff;z-index:9999;font-weight:900;font-size:13px;transition:.3s ease;backdrop-filter:blur(15px);pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,242,255,.2)}#toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:740px){.world-container{width:210px;height:210px}.earth{width:160px;height:160px}.brand-section h1{font-size:54px}.main-btn{min-height:52px}}
  </style>
</head>
<body>
  <div class="nebula"></div>
  <div class="main">
    <div class="brand-section"><h1>italky<span class="ai">AI</span></h1><div class="brand-sub">BE FREE</div></div>
    <div class="world-container" aria-hidden="true"><div class="earth-glow"></div><div class="earth"><div class="ai-stamp ai-front">ITALKY</div></div></div>
    <div class="typewriter-container"><div class="typewriter" id="typewriter">Devam etmek için Google hesabınızla giriş yapın.</div></div>
    <div class="login-box">
      <button class="main-btn google-btn" id="googleBtn" type="button"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span>Google ile Giriş Yap</span></button>
    </div>
  </div>
  <footer><div class="footer-nav"><a href="/pages/about.html">Hakkımızda</a><a href="/pages/privacy.html">Gizlilik</a><a href="/pages/contact.html">İletişim</a></div><div class="brand-seal">
  italkyAI @ icanyAI By Ozyigit's 2026
  <span class="gokturk-signature" lang="otk" dir="rtl">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span>
</div></footer>
  <div id="toast"></div>
  <script type="module">
    import { supabase } from "/js/supabase_client.js";
    import { loginWithGoogle } from "/js/auth.js";
    const toastEl=document.getElementById("toast");
    function showToast(text){if(!toastEl||!text)return;toastEl.textContent=text;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),3600)}
    function nextTarget(){try{return new URLSearchParams(location.search||"").get("next")||"/pages/home.html"}catch{return "/pages/home.html"}}
    async function startLogin(next){try{const {data}=await supabase.auth.getSession();if(data?.session){location.href=next;return}await loginWithGoogle(next)}catch(e){showToast(e?.message||"Google girişi başlatılamadı. Lütfen tekrar deneyin.")}}
    document.getElementById("googleBtn")?.addEventListener("click",()=>startLogin(nextTarget()));
    const originalGoogleBtn=document.getElementById("googleBtn");
    const guardedGoogleBtn=originalGoogleBtn?.cloneNode(true);
    let googleLoginBusy=false;
    if(originalGoogleBtn&&guardedGoogleBtn){
      originalGoogleBtn.replaceWith(guardedGoogleBtn);
      guardedGoogleBtn.addEventListener("click",async()=>{if(googleLoginBusy)return;googleLoginBusy=true;const next=nextTarget();try{console.warn("[ITALKY AUTH] google button clicked",{next});const {data}=await supabase.auth.getSession();if(data?.session){location.href=next;return}const result=await loginWithGoogle(next);if(result?.native){setTimeout(()=>{googleLoginBusy=false},8000)}else{googleLoginBusy=false}}catch(e){googleLoginBusy=false;showToast(e?.message||"Google girisi baslatilamadi. Lutfen tekrar deneyin.")}});
    }
    window.addEventListener("italky-native-login-error",(event)=>{googleLoginBusy=false;showToast(event?.detail?.message||"Google girisi tamamlanamadi. Lutfen tekrar deneyin.")});
    window.addEventListener("italky-native-login-success",()=>{googleLoginBusy=false});
  </script>
</body>
</html>
