  <style>
    :root{
      --bg-void:#060408;
      --neon:#00f2ff;
      --pink:#ff007a;
      --brand-grad:linear-gradient(135deg,#00f2ff 0%,#6366f1 55%,#ff007a 100%);
      --signature-grad:linear-gradient(to right,#fff,#00f2ff,#fff);
      --accent:#00f2ff;
      --muted:rgba(255,255,255,.65);
      --safeB:env(safe-area-inset-bottom, 0px);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
    html,body{ height:100%; width:100%; }

    body{
      background:var(--bg-void);
      color:#fff;
      font-family:'Outfit',sans-serif;
      height:100dvh;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    body:not(.login-ready) .main,
    body:not(.login-ready) footer{
      visibility:hidden;
      opacity:0;
    }

    body.login-ready .main,
    body.login-ready footer{
      visibility:visible;
      opacity:1;
      transition:opacity .18s ease;
    }

    .nebula{
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 25% 20%, rgba(0,242,255,.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255,0,122,.10), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(15, 8, 22, 1) 0%, #060408 100%);
      z-index:0;
    }

    .main{
      flex:1; width:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:0 26px; z-index:10;
      margin-top:-10px;
    }

    .brand-section{ text-align:center; margin-bottom:5px; }
    .brand-section h1{
      font-family:'Space Grotesk', sans-serif;
      font-size:64px; font-weight:1000;
      letter-spacing:-4px; line-height:1;
      filter:drop-shadow(0 0 15px rgba(0, 242, 255, 0.2));
    }
    .brand-section h1 span.ai{
      background:var(--brand-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .brand-sub{
      margin-top:8px; font-size:12px; font-weight:900;
      letter-spacing:8px; text-transform:uppercase; color:#fff;
      opacity:.9; text-shadow:0 0 10px rgba(255,255,255,0.3);
    }

    .world-container{
      position:relative; width:280px; height:280px;
      display:flex; align-items:center; justify-content:center;
      margin-top:10px; margin-bottom:10px; perspective:1000px;
    }
    .earth-glow{
      position:absolute; inset:10px; border-radius:50%;
      background:radial-gradient(circle, rgba(0, 242, 255, 0.22) 0%, transparent 70%);
      filter:blur(25px); opacity:.95; z-index:0;
      animation:glowBreath 4.8s ease-in-out infinite alternate;
    }
    @keyframes glowBreath{ from{ transform:scale(.95); opacity:.6; } to{ transform:scale(1.1); opacity:.9; } }

    .earth{
      position:relative; width:210px; height:210px; border-radius:50%;
      background-image:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74518/world.topo.bathy.200412.3x5400x2700.jpg");
      background-size:cover; background-position:center;
      box-shadow:inset -30px -30px 60px rgba(0,0,0,0.9), inset 10px 10px 30px rgba(255,255,255,0.1), 0 0 80px rgba(0,242,255,0.25);
      transform-style:preserve-3d; animation:rotateSphere 34s linear infinite; z-index:2; overflow:hidden;
    }
    @keyframes rotateSphere{ from{ transform:rotateY(0deg); } to{ transform:rotateY(360deg); } }

    .ai-stamp{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:1000; letter-spacing:2px; color:rgba(255,255,255,0.95);
      text-shadow:0 0 20px rgba(0,242,255,0.4); mix-blend-mode:screen; opacity:.95;
      pointer-events:none; user-select:none; backface-visibility:hidden;
    }
    .ai-front{ font-size:44px; transform:translateZ(1px); z-index:4; }
    .ai-back{ font-size:50px; letter-spacing:1px; transform:rotateY(180deg) translateZ(1px); z-index:3; }

    .typewriter-container{ height:40px; margin-top:5px; margin-bottom:15px; display:flex; justify-content:center; align-items:center; width:100%; }
    .typewriter{
      font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--muted);
      border-right:2px solid var(--accent); white-space:nowrap; overflow:hidden; width:0;
      animation:typing 5.6s steps(46, end) infinite, blink .85s step-end infinite;
      text-shadow:0 0 10px rgba(0, 242, 255, 0.2);
    }
    @keyframes typing { 0%,10%{ width:0 } 62%,86%{ width:100% } 100%{ width:0 } }
    @keyframes blink { from,to{ border-color:transparent } 50%{ border-color:var(--accent) } }

    .login-box{ width:100%; max-width:300px; z-index:20; }
    .google-btn{
      width:100%; height:54px; border:none; border-radius:27px;
      background:#ffffff; color:#1f1f1f; font-family:'Outfit', sans-serif;
      font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center;
      gap:12px; cursor:pointer; box-shadow:0 10px 25px rgba(0,0,0,0.3);
      transition:all .2s ease; user-select:none;
    }
    .google-btn:active{ transform:scale(.97); }
    .google-btn:hover { box-shadow:0 12px 30px rgba(0,0,0,0.4); background:#fcfcfc; }
    .google-btn:disabled{ opacity:.7; cursor:default; }
    .g-icon{ width:20px; height:20px; display:block; }

    footer{
      width:100%; text-align:center; z-index:20;
      padding-bottom:calc(20px + var(--safeB));
    }
    .footer-nav{ display:flex; justify-content:center; gap:18px; margin-bottom:12px; flex-wrap:wrap; }
    .footer-nav a{
      text-decoration:none; color:rgba(255,255,255,0.4); font-size:11px;
      font-weight:800; text-transform:uppercase; letter-spacing:1px; transition:0.3s;
    }
    .footer-nav a:hover { color:var(--neon); text-shadow:0 0 8px var(--neon); }
    .technology-title{ font-size:20px; font-weight:1000; letter-spacing:6px; margin-bottom:6px; line-height:1; }
    .technology-title b{ font-weight:1000; text-transform:lowercase; color:#fff; }
    .technology-title span{ background:var(--brand-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; }
    .prestige-signature{ font-size:11px; font-weight:900; letter-spacing:1.2px; background:var(--signature-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    #toast{
      position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-120px);
      background:rgba(6,6,12,0.95); border:1px solid var(--accent); padding:12px 24px;
      border-radius:999px; color:#fff; z-index:9999; font-weight:900; font-size:13px;
      transition:.3s ease; backdrop-filter:blur(15px); pointer-events:none;
      max-width:90vw; text-align:center; box-shadow:0 10px 30px rgba(0, 242, 255, 0.2);
    }
    #toast.show{ transform:translateX(-50%) translateY(0); }
  </style>
</head>

    function getSiteLangCode() {
      const raw = String(
        localStorage.getItem(SITE_LANG_KEY) ||
        localStorage.getItem(LEGACY_SITE_LANG_KEY) ||
        "tr"
      ).trim().toLowerCase();

      return I18N[raw] ? raw : "tr";
    }

    function currentDict() {
      return I18N[getSiteLangCode()] || I18N.tr;
    }

    function applyLoginTranslations() {
      const dict = currentDict();

      document.documentElement.lang = getSiteLangCode();
      document.title = dict.pageTitle;

      const googleBtnText = document.getElementById("googleBtnText");
      const footerAbout = document.getElementById("footerAbout");
      const footerFaq = document.getElementById("footerFaq");
      const footerPrivacy = document.getElementById("footerPrivacy");
      const footerContact = document.getElementById("footerContact");
      const typeEl = document.getElementById("typewriter");

      if (googleBtnText) googleBtnText.textContent = dict.googleBtn;
      if (footerAbout) footerAbout.textContent = dict.footerAbout;
      if (footerFaq) footerFaq.textContent = dict.footerFaq;
      if (footerPrivacy) footerPrivacy.textContent = dict.footerPrivacy;
      if (footerContact) footerContact.textContent = dict.footerContact;
      if (typeEl) typeEl.textContent = dict.phrases[0] || "";

      return dict;
    }

    function toast(msg){
      if(!toastEl) return;
      toastEl.textContent = String(msg || "");
      toastEl.classList.add("show");
      clearTimeout(window.__to);
      window.__to = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function getNextTarget(){
      try{
        const u = new URL(location.href);
        return String(u.searchParams.get("next") || "").trim();
      }catch{
        return "";
      }
    }

    async function resolveTarget(access){
  const next = getNextTarget();
  return next || HOME;
}

    async function getAccessState() {
      const { data:{ session } } = await supabase.auth.getSession();

      if (!session?.access_token) {
        throw new Error("Oturum bulunamadı");
      }

      const resp = await fetch("https://italky-api.onrender.com/api/session/access-state", {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${session.access_token}`
        }
      });

      const json = await resp.json().catch(() => ({}));

      if (!resp.ok) {
        throw new Error(json?.detail || "Erişim kontrolü yapılamadı");
      }

      return json;
    }

    async function routeAfterLogin(){
  try{
    await ensureAuthAndCacheUser();
    const access = await getAccessState();
    const target = await resolveTarget(access);
    location.replace(target);
  }catch(e){
    console.error("routeAfterLogin error:", e);
    location.replace(HOME);
  }
}

    function hasNativeGoogleLogin() {
      return !!(
        window.Native &&
        typeof window.Native.startGoogleLogin === "function"
      );
    }

    async function startWebGoogleLogin() {
      const next = getNextTarget();
      const redirectTo = next
        ? `${location.origin}/pages/login.html?next=${encodeURIComponent(next)}`
        : `${location.origin}/pages/login.html`;

      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo
        }
      });

      if (error) {
        throw error;
      }
    }

    window.onNativeLoginSuccess = async function(payload){
      const dict = currentDict();

      try{
        const data = (typeof payload === "string") ? JSON.parse(payload) : payload;
        const idToken = String(data?.id_token || data?.idToken || "").trim();

        if(!idToken){
          googleBtn.disabled = false;
          toast(dict.toastNoToken);
          return;
        }

        googleBtn.disabled = true;
        toast(dict.toastSigningIn);

        const { error } = await supabase.auth.signInWithIdToken({
          provider: "google",
          token: idToken
        });

        if (error) {
          googleBtn.disabled = false;
          toast(dict.toastLoginFailed);
          console.error("signInWithIdToken error:", error);
          return;
        }

        const { data:{ session } } = await supabase.auth.getSession();
        if(!session){
          googleBtn.disabled = false;
          toast(dict.toastNoSession);
          return;
        }

        setTimeout(() => routeAfterLogin(), 300);
      }catch(e){
        console.error("onNativeLoginSuccess error:", e);
        googleBtn.disabled = false;
        toast(dict.toastLoginError);
      }
    };

    googleBtn?.addEventListener("click", async () => {
      const dict = currentDict();

      try{
        googleBtn.disabled = true;
        toast(dict.toastStarting);

        if (hasNativeGoogleLogin()) {
          window.Native.startGoogleLogin();
          return;
        }

        await startWebGoogleLogin();
      }catch(e){
        console.error("googleBtn click error:", e);
        googleBtn.disabled = false;
        toast(dict.toastStartFailed);
      }
    });

    let phrases = applyLoginTranslations().phrases.slice();
    let pi = 0;
    const typeEl = document.getElementById("typewriter");

    setInterval(() => {
      phrases = currentDict().phrases.slice();
      pi = (pi + 1) % phrases.length;
      if(typeEl){
        typeEl.style.animation = "none";
        typeEl.offsetHeight;
        typeEl.textContent = phrases[pi];
        typeEl.style.animation = null;
      }
    }, 5600);

    window.addEventListener("storage", (e) => {
      if (e.key === SITE_LANG_KEY || e.key === LEGACY_SITE_LANG_KEY) {
        const dict = applyLoginTranslations();
        phrases = dict.phrases.slice();
        pi = 0;
      }
    });

    (async function boot(){
      try{
        applyLoginTranslations();

        const { data:{ session } } = await supabase.auth.getSession();
        if(!session){
          document.body.classList.add("login-ready");
          return;
        }
        await routeAfterLogin();
      }catch(e){
        console.error("boot error:", e);
        document.body.classList.add("login-ready");
      }
    })();
  </script>
</body>
</html>
