<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>italkyAI • Yönlendiriliyor</title>
<meta name="theme-color" content="#06111d">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06111d;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px}.card{max-width:420px;padding:28px;border:1px solid rgba(53,213,208,.28);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:0 22px 70px rgba(0,0,0,.32)}.logo{width:150px;height:auto;margin-bottom:18px}.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(53,213,208,.20);border-top-color:#35d5d0;margin:18px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}a{color:#72fff7;font-weight:800;text-decoration:none}
</style>
<script>
(function(){
  var target = "https://italky.ai/hosgeldiniz";
  try{
    var url = new URL(location.href);
    var next = url.searchParams.get("next") || "";
    if(next && next.indexOf("/pages/code_load.html") === 0){
      target = next;
    }
  }catch(e){}
  window.__target = target;
  setTimeout(function(){ location.replace(target); }, 120);
})();
</script>
</head>
<body>
<div class="card">
  <img class="logo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI">
  <h1>Yönlendiriliyor</h1>
  <p>italkyAI ana giriş sayfası açılıyor.</p>
  <div class="spin" aria-hidden="true"></div>
  <p><a id="manual" href="https://italky.ai/hosgeldiniz">Devam et</a></p>
</div>
<script>try{document.getElementById('manual').href=window.__target||'https://italky.ai/hosgeldiniz'}catch(e){}</script>
</body>
</html>
