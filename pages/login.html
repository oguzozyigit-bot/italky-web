<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>italkyAI • Giriş</title>
  <meta name="theme-color" content="#06111d">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;background:#06111d;color:#fff;font-family:Arial,sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 32%,#0b2633 0,#071724 36%,#06111d 72%)}
    .login{width:min(92vw,430px);display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center}
    .logo{display:flex;flex-direction:column;align-items:center;gap:12px}
    .wave{height:70px;display:flex;align-items:center;gap:7px}
    .wave i{display:block;width:7px;border-radius:999px;background:#53e7e1;box-shadow:0 0 18px rgba(83,231,225,.28)}
    .wave i:nth-child(1),.wave i:nth-child(7){height:14px}.wave i:nth-child(2),.wave i:nth-child(6){height:34px}.wave i:nth-child(3),.wave i:nth-child(5){height:52px}.wave i:nth-child(4){height:70px}
    .brand{font-size:43px;font-weight:900;letter-spacing:-.055em;line-height:1}.brand b{color:#53e7e1}
    .login-btn{width:100%;min-height:64px;border:0;border-radius:34px;background:#fff;color:#111827;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 22px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
    .login-btn:active{transform:scale(.985)}.login-btn[disabled]{opacity:.65;cursor:default}
    .g{font-size:21px;font-weight:900;color:#4285f4;line-height:1}
    #status{display:none}
  </style>
</head>
<body>
  <main class="login">
    <div class="logo" aria-label="italkyAI">
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="brand">italky<b>AI</b></div>
    </div>
    <button id="googleBtn" class="login-btn" type="button"><span class="g">G</span><span>Google Hesabınızla Ücretsiz Giriş Yapın</span></button>
    <p id="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { supabase, persistSupabaseSessionBackup, waitForSupabaseSession } from '/js/supabase_client.js';
    import { ensureAuthAndCacheUser } from '/js/auth.js';

    const HOME='/hosgeldiniz';
    const btn=document.getElementById('googleBtn');
    const statusEl=document.getElementById('status');
    let busy=false;

    function safeNext(){
      try{
        const raw=String(new URLSearchParams(location.search||'').get('next')||HOME).trim();
        return raw.startsWith('/')&&!raw.startsWith('//')?raw:HOME;
      }catch{return HOME;}
    }

    function setStatus(text){ statusEl.textContent=text||''; }

    function nativeBridge(){
      try{
        const candidates=[window.Native,window.AndroidBridge,window.CorporateNative];
        for(const bridge of candidates){ if(bridge&&typeof bridge.startGoogleLogin==='function')return bridge; }
      }catch{}
      return null;
    }

    function readIdToken(payload){
      try{
        if(typeof payload==='string'){
          const raw=payload.trim();
          if(!raw)return '';
          try{const obj=JSON.parse(raw);return String(obj?.id_token||obj?.idToken||obj?.token||obj?.credential||'').trim();}catch{return raw;}
        }
        return String(payload?.id_token||payload?.idToken||payload?.token||payload?.credential||'').trim();
      }catch{return '';}
    }

    function bindNativeUser(userId){
      if(!userId)return;
      try{
        const candidates=[window.Native,window.AndroidBridge,window.CorporateNative];
        for(const bridge of candidates){if(bridge&&typeof bridge.setUserId==='function'){bridge.setUserId(userId);break;}}
      }catch{}
    }

    async function finishNativeLogin(payload){
      if(busy)return;
      busy=true;btn.disabled=true;
      try{
        const idToken=readIdToken(payload);
        if(!idToken)throw new Error('Google giriş bilgisi alınamadı.');
        const {data,error}=await supabase.auth.signInWithIdToken({provider:'google',token:idToken});
        if(error)throw error;
        const session=data?.session||null;
        const userId=String(data?.user?.id||session?.user?.id||'').trim();
        if(!session?.access_token||!session?.refresh_token||!userId)throw new Error('Oturum oluşturulamadı.');
        persistSupabaseSessionBackup(session);
        try{await ensureAuthAndCacheUser();}catch(error){console.warn('[login] profile cache',error);}
        bindNativeUser(userId);
        location.replace(safeNext());
      }catch(error){
        console.error('[login] native sign-in failed',error);
        busy=false;btn.disabled=false;setStatus(error?.message||'Giriş tamamlanamadı.');
      }
    }

    window.onNativeLoginSuccess=(payload)=>{void finishNativeLogin(payload);};
    window.onNativeLoginError=(payload)=>{busy=false;btn.disabled=false;setStatus(typeof payload==='string'?payload:String(payload?.message||''));};

    async function startLogin(){
      if(busy)return;
      busy=true;btn.disabled=true;
      try{
        const bridge=nativeBridge();
        if(bridge){busy=false;btn.disabled=false;bridge.startGoogleLogin();return;}
        const callback=new URL('/pages/auth_callback.html',location.origin);
        callback.searchParams.set('next',safeNext());
        const {data,error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:callback.toString(),skipBrowserRedirect:true,queryParams:{access_type:'offline',prompt:'select_account'}}});
        if(error)throw error;
        if(!data?.url)throw new Error('Google giriş adresi alınamadı.');
        location.assign(data.url);
      }catch(error){console.error('[login] sign-in start failed',error);busy=false;btn.disabled=false;setStatus(error?.message||'');}
    }

    btn.addEventListener('click',()=>void startLogin());

    (async()=>{
      const params=new URLSearchParams(location.search||'');
      const forcedLogout=params.get('logout')==='1'||params.get('force_logout')==='1'||params.get('logged_out')==='1';
      if(forcedLogout)return;
      const session=await waitForSupabaseSession({timeoutMs:2200,intervalMs:180,restoreFromBackup:true});
      if(session?.user?.id){persistSupabaseSessionBackup(session);location.replace(safeNext());}
    })();
  </script>
</body>
</html>
