<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>italkyAI • Promosyon Kodları</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#07111f,#050914);color:#fff;font-family:Outfit,Arial,sans-serif;padding:22px}
    .page{max-width:860px;margin:0 auto}
    .card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:24px;padding:18px;box-shadow:0 22px 54px rgba(0,0,0,.26)}
    h1{margin:0 0 8px;font-size:28px;font-weight:1000;letter-spacing:-.7px}
    p{margin:0 0 16px;color:rgba(255,255,255,.68);line-height:1.5;font-weight:700}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    label{display:grid;gap:7px;color:rgba(255,255,255,.78);font-size:12px;font-weight:1000;letter-spacing:.4px;text-transform:uppercase}
    input,select,textarea,button{width:100%;border:0;border-radius:16px;font-family:Outfit,Arial,sans-serif}
    input,select,textarea{min-height:50px;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);padding:12px 13px;font-size:15px;font-weight:800}
    textarea{min-height:92px;resize:vertical;text-transform:none}
    button{min-height:54px;cursor:pointer;font-size:15px;font-weight:1000;color:#06111f;background:linear-gradient(135deg,#67e8f9,#93c5fd,#c4b5fd)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:12px;min-height:22px;color:#bef264;font-size:13px;font-weight:900;line-height:1.5}
    .error{color:#fca5a5}
    .table{margin-top:16px;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(0,0,0,.18)}
    table{width:100%;border-collapse:collapse;min-width:720px}
    th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;text-align:left}
    th{color:rgba(255,255,255,.58);font-weight:1000}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
    .link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:13px;font-weight:1000}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <div>
        <h1>Promosyon Kodları</h1>
        <p>Yeni `promo_codes` tablosuna doğrudan kod üretir.</p>
      </div>
      <a class="link" href="/pages/admin.html">Ana Admin</a>
    </div>

    <section class="card">
      <div class="grid">
        <label>Kod Sayısı
          <input id="countInput" type="number" min="1" max="500" value="10" />
        </label>
        <label>Süre
          <select id="durationSelect">
            <option value="30">30 gün</option>
            <option value="90">90 gün</option>
            <option value="180">180 gün</option>
            <option value="365" selected>365 gün</option>
          </select>
        </label>
        <label class="wide">Not
          <textarea id="noteInput" placeholder="Kampanya / satış / bayi notu"></textarea>
        </label>
        <div class="wide">
          <button id="generateBtn" type="button">Kodları Oluştur</button>
          <div id="status" class="status"></div>
        </div>
      </div>

      <div class="table">
        <table>
          <thead><tr><th>Kod</th><th>Süre</th><th>Durum</th><th>Not</th></tr></thead>
          <tbody id="resultBody"><tr><td colspan="4">Henüz kod oluşturulmadı.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";

    const countInput = document.getElementById("countInput");
    const durationSelect = document.getElementById("durationSelect");
    const noteInput = document.getElementById("noteInput");
    const generateBtn = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");
    const resultBody = document.getElementById("resultBody");

    const LETTERS = "ABCDEFGHJKLMNPRSTUVYZ";
    const DIGITS = "0123456789";
    const BANNED_PAIRS = new Set(["AK", "FG", "FB", "GS"]);

    function setStatus(message, isError = false){
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", !!isError);
    }

    function pick(source){
      return source[Math.floor(Math.random() * source.length)];
    }

    function shuffle(items){
      const out = items.slice();
      for(let i = out.length - 1; i > 0; i -= 1){
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    function generatePromoCode(){
      for(let attempt = 0; attempt < 100; attempt += 1){
        const letters = [pick(LETTERS), pick(LETTERS)];
        if(BANNED_PAIRS.has(letters.join(""))) continue;
        const digits = Array.from({ length: 6 }, () => pick(DIGITS));
        return shuffle([...letters, ...digits]).join("");
      }
      throw new Error("Kod üretilemedi");
    }

    async function requireAdmin(){
      const { data:{ user } } = await supabase.auth.getUser();
      if(!user?.id) throw new Error("Önce giriş yapın");

      const { data: profile, error } = await supabase
        .from("profiles")
        .select("role, is_admin")
        .eq("id", user.id)
        .maybeSingle();

      if(error) throw error;
      const role = String(profile?.role || "").toLowerCase();
      if(!(profile?.is_admin || role === "admin" || role === "superadmin")){
        throw new Error("Bu sayfa sadece admin içindir");
      }

      return user;
    }

    function renderRows(rows){
      if(!rows.length){
        resultBody.innerHTML = '<tr><td colspan="4">Henüz kod oluşturulmadı.</td></tr>';
        return;
      }
      resultBody.innerHTML = rows.map((row) => `
        <tr>
          <td><b>${row.code}</b></td>
          <td>${row.duration_days} gün</td>
          <td>${row.status}</td>
          <td>${row.note || "-"}</td>
        </tr>
      `).join("");
    }

    generateBtn.addEventListener("click", async () => {
      try{
        generateBtn.disabled = true;
        setStatus("Kodlar oluşturuluyor...");

        const user = await requireAdmin();
        const count = Math.max(1, Math.min(500, Number(countInput.value || 1)));
        const durationDays = Number(durationSelect.value || 365);
        const note = String(noteInput.value || "").trim() || null;
        const unique = new Set();

        while(unique.size < count){
          unique.add(generatePromoCode());
        }

        const rows = Array.from(unique).map((code) => ({
          code,
          duration_days: durationDays,
          status: "active",
          created_by: user.id,
          note
        }));

        const { data, error } = await supabase
          .from("promo_codes")
          .insert(rows)
          .select("code,duration_days,status,note");

        if(error) throw error;
        renderRows(data || rows);
        setStatus(`${rows.length} adet promosyon kodu oluşturuldu.`);
      }catch(e){
        console.error("promo code generation failed:", e);
        setStatus(e?.message || "Kod oluşturulamadı", true);
      }finally{
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
