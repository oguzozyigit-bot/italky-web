<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyACADEMY • Future of Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050510;
    --academy-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    --pink: #ec4899;
    --blue: #3b82f6;
    --orange: #f59e0b;
    --green: #10b981;
    --glass: rgba(255, 255, 255, 0.05);
}

body {
    margin: 0; background: var(--bg); color: #fff;
    font-family: 'Outfit', sans-serif; overflow: hidden;
    height: 100vh; display: flex; align-items: center; justify-content: center;
}

/* Dinamik Arka Plan */
.bg-glow {
    position: absolute; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
    z-index: -1;
}

/* ANA KONTEYNER */
.academy-hub {
    position: relative;
    width: 360px; height: 360px;
    display: flex; align-items: center; justify-content: center;
}

/* MERKEZİ DAİRE: Seviye Tespiti */
.center-orbit {
    width: 130px; height: 130px;
    background: var(--academy-grad);
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px;
    box-shadow: 0 0 40px rgba(99, 102, 241, 0.5), inset 0 0 20px rgba(255,255,255,0.3);
    z-index: 10; cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 4px solid rgba(255,255,255,0.1);
}

.center-orbit:active { transform: scale(0.9); }

.center-orbit h2 {
    font-size: 14px; font-family: 'Space Grotesk'; margin: 0;
    line-height: 1.2; text-transform: uppercase;
}

/* 4 ANA BUTON (İç Bükey Kenarlı) */
.btn-orbit {
    position: absolute;
    width: 150px; height: 120px;
    background: var(--glass);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; cursor: pointer;
    transition: all 0.3s ease;
    z-index: 5;
}

/* İç bükey kesim simülasyonu ve yerleşim */
/* Üst Sol */
.btn-1 {
    top: -10px; left: -10px;
    border-radius: 40px 10px 80px 10px; /* İç bükey görünüm için asimetrik radius */
    border-left: 4px solid var(--blue);
}
/* Üst Sağ */
.btn-2 {
    top: -10px; right: -10px;
    border-radius: 10px 40px 10px 80px;
    border-right: 4px solid var(--orange);
}
/* Alt Sol */
.btn-3 {
    bottom: -10px; left: -10px;
    border-radius: 80px 10px 10px 40px;
    border-left: 4px solid var(--pink);
}
/* Alt Sağ */
.btn-4 {
    bottom: -10px; right: -10px;
    border-radius: 10px 80px 40px 10px;
    border-right: 4px solid var(--green);
}

.btn-orbit:active { background: rgba(255,255,255,0.15); transform: translateY(3px); }

.btn-orbit i { font-size: 24px; margin-bottom: 8px; }
.btn-orbit span { font-size: 13px; font-weight: 700; font-family: 'Space Grotesk'; text-align: center;}
.btn-orbit small { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: center;}

/* Renkli İkon Parlamaları */
.icon-glow {
    filter: drop-shadow(0 0 8px currentColor);
}

/* Başlık */
.header-title {
    position: absolute; top: 40px; text-align: center; width: 100%;
}
.header-title h1 { font-family: 'Space Grotesk'; font-size: 28px; margin: 0; letter-spacing: -1px; }
.header-title h1 span { color: var(--pink); }

</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="header-title">
    <h1>italky<span>ACADEMY</span></h1>
    <p style="font-size: 12px; opacity: 0.5;">Master any language with AI power</p>
</div>

<main class="academy-hub">
    
    <div class="center-orbit">
        <div style="font-size: 20px; margin-bottom: 5px;">🎯</div>
        <h2>Seviyeni<br>Tespit Et</h2>
    </div>

    <div class="btn-orbit btn-1">
        <span class="icon-glow" style="color: var(--blue); font-size: 22px;">🧠</span>
        <span>AI Mentor</span>
        <small>Kişisel Dil Koçun</small>
    </div>

    <div class="btn-orbit btn-2">
        <span class="icon-glow" style="color: var(--orange); font-size: 22px;">🗣️</span>
        <span>Voice Flow</span>
        <small>Sınırsız Konuşma</small>
    </div>

    <div class="btn-orbit btn-3">
        <span class="icon-glow" style="color: var(--pink); font-size: 22px;">🎮</span>
        <span>Game Zone</span>
        <small>Yarış ve Öğren</small>
    </div>

    <div class="btn-orbit btn-4">
        <span class="icon-glow" style="color: var(--green); font-size: 22px;">📸</span>
        <span>Scan Brain</span>
        <small>Görsel Çözümler</small>
    </div>

</main>

</body>
</html>
