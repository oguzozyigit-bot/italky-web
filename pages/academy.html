<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyACADEMY</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#090914;
color:#fff;
font-family:'Outfit',sans-serif;
}

#pageContent{
height:100vh;
display:flex;
flex-direction:column;
}

/* HERO */

.hero{
height:34vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
gap:10px;
}

/* HOLOGRAM */

.holo{
width:180px;
height:180px;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

/* DÖNEN HALO */

.halo{
position:absolute;
width:150px;
height:150px;
border-radius:50%;
border:1px solid rgba(103,232,249,.4);
animation:spin 16s linear infinite;
box-shadow:0 0 25px rgba(103,232,249,.35);
}

/* LEVEL CORE */

.level-core{
width:90px;
height:90px;
border-radius:24px;
background:linear-gradient(135deg,#ffffff,#eef2ff);
display:flex;
align-items:center;
justify-content:center;
box-shadow:
0 0 25px rgba(103,232,249,.6),
inset 0 0 10px rgba(0,0,0,.2);
cursor:pointer;
}

/* AI TARGET ICON */

.target{
position:relative;
width:38px;
height:38px;
}

.target span{
position:absolute;
border-radius:50%;
border:2px solid #111;
}

.target .c1{inset:0}
.target .c2{inset:7px}
.target .c3{inset:14px}

.target .dot{
position:absolute;
width:6px;
height:6px;
background:#111;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* GRID */

.grid{
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
position:relative;
border-radius:26px;
padding:18px;
display:flex;
flex-direction:column;
justify-content:center;
text-decoration:none;
color:#fff;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.card h2{
margin:0;
font-family:'Space Grotesk';
font-size:22px;
}

/* CARD COLORS */

.lesson{background:linear-gradient(180deg,#2a1975,#1c3ea3)}
.practice{background:linear-gradient(180deg,#8e2de2,#4a00e0)}
.games{background:linear-gradient(180deg,#166534,#0f766e)}
.scan{background:linear-gradient(180deg,#c2410c,#e11d48)}

/* CARD ICONS */

.icon{
position:absolute;
bottom:16px;
right:16px;
width:60px;
height:60px;
opacity:.25;
}

/* LESSON ICON */

.lesson .icon{
border:3px solid #fff;
border-radius:14px;
}

/* PRACTICE ICON */

.practice .icon{
border-radius:50%;
border:3px dashed #fff;
}

/* GAMES ICON */

.games .icon{
background:
radial-gradient(circle,#fff 2px,transparent 3px);
background-size:12px 12px;
}

/* SCAN ICON */

.scan .icon{
border:3px solid #fff;
clip-path:polygon(0 0,100% 0,100% 40%,40% 40%,40% 100%,0 100%);
}

/* ANIM */

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

</style>
</head>

<body>

<main id="pageContent">

<div class="hero">

<div class="holo">

<div class="halo"></div>

<div class="level-core">

<div class="target">
<span class="c1"></span>
<span class="c2"></span>
<span class="c3"></span>
<div class="dot"></div>
</div>

</div>

</div>

<h1 style="font-family:'Space Grotesk';margin:0;font-size:22px;">
italky<span style="
background:linear-gradient(135deg,#67e8f9,#818cf8,#f472b6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;">ACADEMY</span>
</h1>

<div style="font-size:11px;opacity:.7">
Dil öğrenmenin yeni yolu
</div>

</div>

<div class="grid">

<a class="card lesson" href="#">
<h2>Dil Dersi</h2>
<div class="icon"></div>
</a>

<a class="card practice" href="#">
<h2>Pratik Yap</h2>
<div class="icon"></div>
</a>

<a class="card games" href="#">
<h2>Eğlenerek Öğren</h2>
<div class="icon"></div>
</a>

<a class="card scan" href="#">
<h2>Sorunu Tarat</h2>
<div class="icon"></div>
</a>

</div>

</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
try{
mountShell({scroll:"none"});
}catch(e){
console.warn(e);
}
</script>

</body>
</html>
