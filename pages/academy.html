<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyACADEMY • Neural Core</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --txt: #ffffff;
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --panel-border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #0a0a0f; color: var(--txt);
  font-family: 'Outfit', sans-serif; overflow: hidden;
}

/* ACADEMY GRID - EKRANI TAM KAPLAR */
.academy-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100vw;
  height: 100vh;
  gap: 0;
  position: relative;
}

/* BUTONLAR - DİKDÖRTGEN VE KESKİN */
.aca-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  border: 0.5px solid var(--panel-border);
  overflow: hidden;
}

/* Hover/Active Efektleri */
.aca-panel:active { filter: brightness(1.5); transform: scale(0.98); z-index: 2; }

/* Panel Renkleri (Home.html'den) */
.p-1 { background: linear-gradient(180deg, #301661 0%, #150e19 100%); } /* Dil Dersi */
.p-2 { background: linear-gradient(180deg, #61220e 0%, #120d16 100%); } /* Pratik */
.p-3 { background: linear-gradient(180deg, #d43685 0%, #1d1016 100%); } /* Oyunlar */
.p-4 { background: linear-gradient(180deg, #1e36a3 0%, #0a0a0f 100%); } /* Tarat */

/* MERKEZİ REAKTÖR (Seviye Tespit) */
.neural-core {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 160px; height: 160px;
  z-index: 10;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; /* Tıklamayı alt butona geçirmemesi için ayarlanabilir */
}

.core-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px dashed var(--ai-grad);
  animation: rotateCore 10s linear infinite;
  opacity: 0.6;
}

.core-button {
  width: 110px; height: 110px;
  background: #000;
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
  pointer-events: auto;
  border: 2px solid #fff;
  box-shadow: 0 0 30px var(--ai-grad);
  animation: pulseCore 2s ease-in-out infinite;
  transition: 0.3s;
}

.core-button:hover { transform: scale(1.1); box-shadow: 0 0 50px var(--ai-grad); }

.core-button h2 {
  font-family: 'Space Grotesk'; font-size: 13px; margin: 0;
  color: #fff; line-height: 1.1;
}

/* İÇERİK STİLLERİ */
.panel-content { text-align: center; pointer-events: none; }
.panel-icon { font-size: 40px; margin-bottom: 10px; display: block; }
.panel-title { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.panel-desc { font-size: 10px; opacity: 0.6; margin-top: 5px; text-transform: uppercase; }

/* Tarama Efekti (Overlay) */
.scan-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
              linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 4px, 3px 100%;
  pointer-events: none;
}

/* ANIMASYONLAR */
@keyframes rotateCore { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes pulseCore { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(103,232,249,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(244,114,182,0.6); } }

</style>
</head>
<body>

<div class="scan-overlay"></div>

<main class="academy-grid">
  
  <a href="#" class="aca-panel p-1">
    <div class="panel-content">
      <span class="panel-icon">🧪</span>
      <div class="panel-title">AI LECTURE</div>
      <div class="panel-desc">Akıllı Müfredat</div>
    </div>
  </a>

  <a href="#" class="aca-panel p-2">
    <div class="panel-content">
      <span class="panel-icon">🎙️</span>
      <div class="panel-title">VOICE LAB</div>
      <div class="panel-desc">Sonsuz Pratik</div>
    </div>
  </a>

  <a href="#" class="aca-panel p-3">
    <div class="panel-content">
      <span class="panel-icon">⚡</span>
      <div class="panel-title">NEURAL GAME</div>
      <div class="panel-desc">Eğlence & Skor</div>
    </div>
  </a>

  <a href="#" class="aca-panel p-4">
    <div class="panel-content">
      <span class="panel-icon">👁️</span>
      <div class="panel-title">SCAN SOLVE</div>
      <div class="panel-desc">Görsel Çözüm</div>
    </div>
  </a>

  <div class="neural-core">
    <div class="core-ring"></div>
    <div class="core-button" onclick="alert('Seviye tespiti başlatılıyor...')">
      <span style="font-size: 20px; margin-bottom: 5px;">🎯</span>
      <h2>LEVEL<br>SCAN</h2>
    </div>
  </div>

</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
try {
  mountShell({ scroll: "none" }); // Kaydırmayı kapat, tam ekran OS hissi ver
} catch (e) {
  console.warn("Shell hatası:", e);
}
</script>

</body>
</html>
