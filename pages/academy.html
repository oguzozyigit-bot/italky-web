<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyACADEMY • Neural Core</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --txt: rgba(255,255,255,.96);
  --muted: rgba(255,255,255,.64);
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --panel-line: rgba(255,255,255,.12);
  /* Home.html Renk Paleti */
  --p1-grad: linear-gradient(180deg, #301661 0%, #1e36a3 100%);
  --p2-grad: linear-gradient(180deg, #61220e 0%, #ea580c 100%);
  --p3-grad: linear-gradient(180deg, #d43685 0%, #632bbd 100%);
  --p4-grad: linear-gradient(180deg, #1e36a3 0%, #0a0a0f 100%);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

body, html {
  margin: 0; width: 100%; height: 100%;
  background: #120d16; color: var(--txt);
  font-family: 'Outfit', sans-serif; overflow: hidden;
}

/* UI_SHELL İÇİN ANA KONTEYNER */
#pageContent {
  width: 100%;
  height: 100%;
  /* Header ve Footer paylarını CSS değişkeni olarak varsayıyoruz */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
}

/* 4 ANA PANEL (DİKDÖRTGEN GRID) */
.academy-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 0;
  position: relative;
  overflow: hidden;
}

.aca-panel {
  position: relative;
  border: 0.5px solid var(--panel-line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: all 0.3s ease;
  overflow: hidden;
}

/* Panel Arka Planları */
.p-lesson { background: var(--p1-grad); }
.p-voice { background: var(--p2-grad); }
.p-games { background: var(--p3-grad); }
.p-scan { background: var(--p4-grad); }

/* Cam Parlaması (Glass Overlay) */
.aca-panel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
  pointer-events: none;
}

.aca-panel:active { filter: brightness(1.2); transform: scale(0.99); }

/* MERKEZİ ÜNİTE (Vay Bee Dedirten Kısım) */
.neural-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 180px; height: 180px;
  z-index: 20;
  display: flex; align-items: center; justify-content: center;
}

/* Kristal Kafes (Home.html'deki gibi) */
.crystal-aura {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(103,232,249,0.2) 0%, transparent 70%);
  animation: auraPulse 3s ease-in-out infinite;
}

.core-unit {
  width: 120px; height: 120px;
  background: #000;
  border-radius: 30px; /* Modern kare-daire hibrit */
  border: 2px solid #fff;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  box-shadow: 0 0 30px rgba(103,232,249,0.5), inset 0 0 15px rgba(255,255,255,0.2);
  cursor: pointer;
  z-index: 21;
  animation: coreRotate 15s linear infinite;
}

.core-content {
  animation: coreCounterRotate 15s linear infinite; /* Yazıların dönmemesi için */
  text-align: center;
}

.core-content h2 {
  font-family: 'Space Grotesk'; font-size: 14px; margin: 0;
  background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1.1;
}

/* PANEL İÇERİKLERİ */
.panel-icon {
  font-size: 36px; margin-bottom: 8px;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
}
.panel-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; color: #fff; }
.panel-sub { font-size: 10px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }

/* ANIMASYONLAR */
@keyframes auraPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 0.8; } }
@keyframes coreRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes coreCounterRotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

</style>
</head>

<body>

<main id="pageContent">
  <div class="academy-grid">
    
    <a href="#" class="aca-panel p-lesson">
      <span class="panel-icon">🧪</span>
      <span class="panel-title">AI LECTURE</span>
      <span class="panel-sub">Kişisel Müfredat</span>
    </a>

    <a href="#" class="aca-panel p-voice">
      <span class="panel-icon">🎙️</span>
      <span class="panel-title">VOICE LAB</span>
      <span class="panel-sub">Konuşma Odaklı</span>
    </a>

    <a href="#" class="aca-panel p-games">
      <span class="panel-icon">⚡</span>
      <span class="panel-title">MIND ZONE</span>
      <span class="panel-sub">Eğlence & Skor</span>
    </a>

    <a href="#" class="aca-panel p-scan">
      <span class="panel-icon">👁️</span>
      <span class="panel-title">SCAN BRAIN</span>
      <span class="panel-sub">Görsel Çözüm</span>
    </a>

    <div class="neural-center">
      <div class="crystal-aura"></div>
      <div class="core-unit" onclick="alert('Neural Scan Başlatılıyor...')">
        <div class="core-content">
          <div style="font-size: 24px; margin-bottom: 5px;">🎯</div>
          <h2>LEVEL<br>SCAN</h2>
        </div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
try {
  // ui_shell burada header ve footer'ı otomatik basacak
  mountShell({ scroll: "none" }); 
} catch (e) {
  console.warn("Shell hatası:", e);
}
</script>

</body>
</html>
