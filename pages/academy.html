<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyACADEMY • Future Learning</title>
  <meta name="theme-color" content="#120d16"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.64);
      --cardLine:rgba(255,255,255,.12);
      --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
      --pink:#f472b6;
      --cyan:#67e8f9;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    html,body{ margin:0; width:100%; height:100%; color:var(--txt); font-family:'Outfit',sans-serif; background:#120d16; overflow:hidden; scrollbar-width:none; }
    
    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(251,146,60,.16) 0%, transparent 26%),
        radial-gradient(circle at 16% 16%, rgba(244,114,182,.12) 0%, transparent 24%),
        radial-gradient(circle at 84% 18%, rgba(96,165,250,.12) 0%, transparent 22%),
        linear-gradient(180deg, #1d1016 0%, #150e19 34%, #120d16 100%);
    }

    #pageContent{ width:100%; height:100dvh; padding:8px 12px 2px; display:block; overflow:hidden; }
    .page-shell-fit{ height:100%; display:flex; flex-direction:column; gap:8px; overflow:hidden; }

    /* --- ÜST HAREKETLI KARE TASARIMI --- */
    .academy-hero{ flex:0 0 auto; perspective:1000px; }
    .heroTop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }

    .holo-container{
      width:180px;
      height:180px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 8px;
      transform-style: preserve-3d;
    }

    /* Kare Yörünge Sistemi */
    .square-orbit {
      position: absolute;
      width: 140px;
      height: 140px;
      transform-style: preserve-3d;
      animation: masterRotate 20s linear infinite;
    }

    @keyframes masterRotate {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(360deg); }
    }

    .box-frame {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(103, 232, 249, 0.3);
      box-shadow: 0 0 15px rgba(103, 232, 249, 0.1);
    }

    .f1 { transform: rotateX(45deg) rotateY(45deg); border-color: var(--cyan); animation: boxPulse 4s ease-in-out infinite; }
    .f2 { transform: rotateX(-45deg) rotateZ(45deg); border-color: var(--pink); animation: boxPulse 4s ease-in-out infinite 1s; }
    .f3 { transform: rotateY(90deg) rotateX(45deg); border-color: #fff; animation: boxPulse 4s ease-in-out infinite 2s; }

    @keyframes boxPulse {
      0%, 100% { opacity: 0.3; transform: scale(1) inherit; }
      50% { opacity: 0.8; transform: scale(1.1) inherit; }
    }

    /* Core Buton */
    .academy-core{
      position:relative;
      width:92px;
      height:92px;
      border-radius:24px;
      background: #fff;
      box-shadow: 0 0 40px rgba(103, 232, 249, 0.5);
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      animation: floatCore 4s ease-in-out infinite;
    }

    .core-inner-box {
      width: 30px;
      height: 30px;
      border: 2px solid #151827;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .core-inner-box::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--pink);
      animation: coreBlink 2s infinite;
    }

    @keyframes coreBlink {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.5); opacity: 0.5; }
    }

    .academy-core-title{
      margin-top: 4px;
      font-family:'Space Grotesk',sans-serif;
      font-size:10.5px;
      font-weight:800;
      color:#111827;
      text-align:center;
      line-height:1.1;
    }

    /* --- DEĞİŞMEYEN DİĞER KISIMLAR --- */
    .heroTitle{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:#fff; text-align:center; }
    .heroTitle .to{ background:var(--ai-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .heroSub{ margin:0; font-size:10px; color:var(--muted); text-align:center; max-width:300px; margin: 0 auto;}
    .academy-grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1fr) minmax(0,auto) minmax(0,auto); gap:10px; margin-top:10px;}
    .academy-card{ position:relative; border-radius:24px; border:1px solid var(--cardLine); padding:14px; text-decoration:none; color:#fff; overflow:hidden; }
    .lesson-card{ background: linear-gradient(180deg, #301661 0%, #1e36a3 100%); padding-bottom: 80px;}
    .practice-card{ background: linear-gradient(180deg, #d43685 0%, #3c35b5 100%); padding-bottom: 80px;}
    .games-card{ grid-column:1 / 3; min-height:100px; display:flex; align-items:center; gap:12px; background: linear-gradient(90deg, #10311e 0%, #0f766e 100%); }
    .vision-card{ grid-column:1 / 3; min-height:100px; display:flex; align-items:center; gap:12px; background: linear-gradient(90deg, #5b2208 0%, #db2777 100%); }
    .card-title{ font-family:'Space Grotesk',sans-serif; font-size:20px; margin:0; }
    .card-desc{ font-size:9.5px; color:rgba(255,255,255,0.8); margin-top:4px; }
    .arrow-chip{ margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
    .arrow-chip::after { content: "→"; font-size: 18px; }

    @keyframes floatCore{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="page-shell-fit">

      <section class="academy-hero">
        <div class="heroTop">
          <div class="holo-container">
            <div class="square-orbit">
              <div class="box-frame f1"></div>
              <div class="box-frame f2"></div>
              <div class="box-frame f3"></div>
            </div>

            <a href="/pages/academy_level.html" class="academy-core">
              <div class="academy-core-inner">
                <div class="core-inner-box"></div>
                <div class="academy-core-title">SEVİYENİ<br>TESPİT ET</div>
              </div>
            </a>
          </div>

          <h1 class="heroTitle">italky<span class="to">ACADEMY</span></h1>
          <p class="heroSub">Ders al, pratik yap, oyunla öğren, sorunu tarat.</p>
        </div>
      </section>

      <section class="academy-grid">
        <a class="academy-card lesson-card" href="/pages/academy_lessons.html">
          <h2 class="card-title">Dil Dersi</h2>
          <p class="card-desc">Seviyene uygun yapılandırılmış eğitim.</p>
        </a>

        <a class="academy-card practice-card" href="/pages/academy_practice.html">
          <h2 class="card-title">Pratik Yap</h2>
          <p class="card-desc">Gerçek diyaloğa yakın senaryolar.</p>
        </a>

        <a class="academy-card games-card" href="/pages/academy_games.html">
          <div class="card-body">
            <h2 class="card-title">Mind Games</h2>
            <p class="card-desc">Kelime ve refleks oyunlarıyla öğren.</p>
          </div>
          <div class="arrow-chip"></div>
        </a>

        <a class="academy-card vision-card" href="/pages/academy_scan.html">
          <div class="card-body">
            <h2 class="card-title">Vision Solver</h2>
            <p class="card-desc">Soru veya görseli okut, çözüm al.</p>
          </div>
          <div class="arrow-chip"></div>
        </a>
      </section>

    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    try { mountShell({ scroll: "none" }); } catch (e) {}
  </script>
</body>
</html>
