<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyACADEMY • Neural Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #120d16;
  --txt: rgba(255,255,255,.96);
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --pink: #f472b6;
  --cyan: #67e8f9;
  --purple: #818cf8;
  --orange: #fb923c;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

body, html {
  margin: 0; width: 100%; height: 100%;
  background: #120d16;
  color: var(--txt);
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
}

/* Arka Plan (Home.html ile aynı derinlik) */
body {
  background:
    radial-gradient(circle at 50% 0%, rgba(251,146,60,.12) 0%, transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(103,232,249,.10) 0%, transparent 30%),
    linear-gradient(180deg, #1d1016 0%, #120d16 100%);
}

#pageContent {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}

/* ACADEMY GRID YAPISI (Boşluksuz) */
.academy-container {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1/1;
  gap: 0; /* Boşluk yok */
  border-radius: 40px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* MERKEZİ DAİRE (Hologram Efekti) */
.center-core {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 140px; height: 140px;
  background: #120d16;
  border-radius: 50%;
  z-index: 10;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 30px rgba(103,232,249,0.3);
}

.core-trigger {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: var(--ai-grad);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: inset 0 0 20px rgba(255,255,255,0.4);
}

.core-trigger:active { transform: scale(0.92); }
.core-trigger h2 { 
  font-family: 'Space Grotesk'; font-size: 14px; margin: 0; 
  color: #fff; line-height: 1.1; text-transform: uppercase;
}

/* BUTONLAR (İç Bükey Kesimli) */
.aca-btn {
  position: relative;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
  text-decoration: none;
  transition: filter 0.3s;
  overflow: hidden;
}

.aca-btn:active { filter: brightness(1.3); }

/* Renkler ve İç Bükey Radius Ayarları */
/* 1. Dil Dersi (Üst Sol) */
.btn-lesson {
  background: linear-gradient(135deg, #301661 0%, #2b2185 100%);
  border-radius: 0 0 100px 0; /* Merkeze bakan köşe iç bükey efekti için */
  border-right: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* 2. Pratik Yap (Üst Sağ) */
.btn-practice {
  background: linear-gradient(225deg, #61220e 0%, #ea580c 100%);
  border-radius: 0 0 0 100px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* 3. Oyunlar (Alt Sol) */
.btn-games {
  background: linear-gradient(45deg, #d43685 0%, #632bbd 100%);
  border-radius: 0 100px 0 0;
  border-right: 1px solid rgba(255,255,255,0.05);
}

/* 4. Soru Tarat (Alt Sağ) */
.btn-scan {
  background: linear-gradient(315deg, #1e36a3 0%, #67e8f9 100%);
  border-radius: 100px 0 0 0;
}

/* İkon ve Metin Stilleri */
.aca-btn i { font-size: 32px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
.aca-btn span { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; text-align: center; line-height: 1; }
.aca-btn small { font-size: 10px; opacity: 0.7; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

/* Üst Başlık */
.academy-header {
  margin-bottom: 30px; text-align: center;
}
.academy-header h1 { 
  font-family: 'Space Grotesk'; font-size: 28px; margin: 0; 
  background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

</style>
</head>

<body>

<main id="pageContent">
  <header class="academy-header">
    <h1>italkyACADEMY</h1>
    <p style="font-size: 11px; color: var(--muted); margin-top: 5px;">AI-Powered Language Evolution</p>
  </header>

  <div class="academy-container">
    
    <div class="center-core">
      <div class="core-trigger">
        <span style="font-size: 24px; margin-bottom: 4px;">🎯</span>
        <h2>SEVİYENİ<br>TESPİT ET</h2>
      </div>
    </div>

    <a href="#" class="aca-btn btn-lesson">
      <i>🧠</i>
      <span>AI LECTURE</span>
      <small>Kişisel Dersler</small>
    </a>

    <a href="#" class="aca-btn btn-practice">
      <i>🗣️</i>
      <span>VOICE LAB</span>
      <small>Akıcı Konuşma</small>
    </a>

    <a href="#" class="aca-btn btn-games">
      <i>🎮</i>
      <span>MIND GAMES</span>
      <small>Eğlenceli Görevler</small>
    </a>

    <a href="#" class="aca-btn btn-scan">
      <i>📸</i>
      <span>NEURO SCAN</span>
      <small>Görsel Analiz</small>
    </a>

  </div>

  <p style="margin-top: 30px; font-size: 10px; color: var(--muted); text-align: center; max-width: 250px;">
    Yapay zeka asistanın öğrenme hızına göre müfredatı anlık olarak günceller.
  </p>
</main>

</body>
</html>
