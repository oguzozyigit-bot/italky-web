<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Şifre Yenile</title>
  <meta name="theme-color" content="#090b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#090b14;
      --txt:#f8fbff;
      --muted:rgba(255,255,255,.68);
      --line:rgba(255,255,255,.12);
      --card:rgba(255,255,255,.06);
      --grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
      --ok:#22c55e;
      --err:#ef4444;
      --warn:#f59e0b;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#090b14;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      overflow:hidden;
      background:
        radial-gradient(circle at top, rgba(129,140,248,.18), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(103,232,249,.10), transparent 24%),
        radial-gradient(circle at 82% 24%, rgba(244,114,182,.12), transparent 22%),
        linear-gradient(180deg,#0b0e18 0%, #090b14 100%);
    }

    .glow{
      position:fixed;
      border-radius:50%;
      filter:blur(80px);
      opacity:.22;
      pointer-events:none;
    }

    .glow.g1{
      width:260px;
      height:260px;
      left:-60px;
      top:40px;
      background:#818cf8;
    }

    .glow.g2{
      width:220px;
      height:220px;
      right:-50px;
      bottom:60px;
      background:#f472b6;
    }

    .wrap{
      width:min(100%, 460px);
      position:relative;
      z-index:1;
    }

    .card{
      border-radius:28px;
      padding:28px 24px 22px;
      background:var(--card);
      border:1px solid var(--line);
      backdrop-filter:blur(18px);
      box-shadow:0 24px 60px rgba(0,0,0,.34);
      text-align:center;
    }

    .logo-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin-bottom:18px;
    }

    .logo-orb{
      width:92px;
      height:92px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,.18) 0%, transparent 22%),
        linear-gradient(145deg, #111318 0%, #08090d 46%, #030406 100%);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.04),
        0 0 22px rgba(103,232,249,.16),
        0 0 48px rgba(129,140,248,.12);
      margin-bottom:12px;
    }

    .logo-text{
      font-family:'Space Grotesk',sans-serif;
      font-size:26px;
      font-weight:700;
      color:#fff;
      line-height:1;
    }

    .logo-text span{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .logo-sub{
      font-size:11px;
      letter-spacing:2px;
      font-weight:900;
      color:rgba(255,255,255,.58);
      text-transform:uppercase;
      margin-top:2px;
    }

    h1{
      margin:6px 0 8px;
      font-size:34px;
      line-height:1.05;
      letter-spacing:-.8px;
    }

    .desc{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .field{
      margin-top:10px;
      text-align:left;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:700;
      color:rgba(255,255,255,.8);
    }

    .field input{
      width:100%;
      min-height:56px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.92);
      color:#111827;
      font-size:15px;
      padding:0 16px;
      outline:none;
    }

    .field input:focus{
      box-shadow:0 0 0 4px rgba(129,140,248,.18);
    }

    .btn{
      width:100%;
      min-height:54px;
      border:none;
      border-radius:18px;
      margin-top:16px;
      background:var(--grad);
      color:#fff;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 16px 34px rgba(129,140,248,.18);
      transition:transform .16s ease, opacity .16s ease;
    }

    .btn:active{
      transform:scale(.985);
    }

    .btn[disabled]{
      opacity:.65;
      cursor:not-allowed;
    }

    .status{
      min-height:24px;
      margin-top:12px;
      font-size:14px;
      font-weight:800;
    }

    .status.ok{ color:var(--ok); }
    .status.err{ color:var(--err); }
    .status.warn{ color:var(--warn); }

    .footer-mark{
      margin-top:16px;
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.56);
      letter-spacing:.3px;
    }

    .footer-mark b{
      color:#fff;
      font-weight:800;
    }

    .brand-seal{
      text-align:center;
      line-height:1.2;
    }

    .gokturk-signature{
      display:block;
      margin-top:3px;
      font-family:"Segoe UI Historic","Noto Sans Old Turkic",serif;
      font-size:12px;
      font-weight:900;
      direction:rtl;
      unicode-bidi:isolate;
    }
  </style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="wrap">
    <section class="card">
      <div class="logo-wrap">
        <div class="logo-orb">
          <div class="logo-text">italky<span>AI</span></div>
        </div>
        <div class="logo-sub">BE FREE</div>
      </div>

      <h1>Şifre Yenile</h1>
      <p class="desc">
        Hesabın için yeni bir şifre belirle. Doğrulama bağlantın kontrol edilecek, sonra yeni şifren kaydedilecek.
      </p>

      <div class="field">
        <label for="password">Yeni Şifre</label>
        <input id="password" type="password" placeholder="Yeni şifreni gir" />
      </div>

      <div class="field">
        <label for="password2">Yeni Şifre Tekrar</label>
        <input id="password2" type="password" placeholder="Şifreyi tekrar gir" />
      </div>

      <button id="saveBtn" class="btn" type="button">Kaydet</button>
      <div id="status" class="status warn">Bağlantı doğrulanıyor...</div>
    </section>

    <div class="footer-mark"><div class="brand-seal">
  italkyAI @ icanyAI By Ozyigit's 2026
  <span class="gokturk-signature" lang="otk" dir="rtl">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span>
</div></div>
  </main>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const saveBtn = $("saveBtn");

    let verifiedRecovery = false;

    function setStatus(text, type = "warn"){
      statusEl.className = `status ${type}`;
      statusEl.textContent = text || "";
    }

    function getParams(){
      const url = new URL(window.location.href);
      const query = url.searchParams;

      const hash = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));

      return {
        token_hash: query.get("token_hash") || "",
        type: query.get("type") || hash.get("type") || "",
        access_token: hash.get("access_token") || "",
        refresh_token: hash.get("refresh_token") || ""
      };
    }

    async function prepareRecoverySession(){
      const params = getParams();

      try{
        if (params.access_token && params.refresh_token) {
          const { error } = await supabase.auth.setSession({
            access_token: params.access_token,
            refresh_token: params.refresh_token
          });

          if (error) throw error;

          verifiedRecovery = true;
          setStatus("Doğrulama tamamlandı. Yeni şifreni kaydedebilirsin.", "ok");
          return;
        }

        if (params.token_hash && params.type === "recovery") {
          const { error } = await supabase.auth.verifyOtp({
            type: "recovery",
            token_hash: params.token_hash
          });

          if (error) throw error;

          verifiedRecovery = true;
          setStatus("Doğrulama tamamlandı. Yeni şifreni kaydedebilirsin.", "ok");
          return;
        }

        verifiedRecovery = false;
        setStatus("Geçersiz veya eksik şifre yenileme bağlantısı.", "err");
        saveBtn.disabled = true;
      } catch (e) {
        console.error("[reset_password prepareRecoverySession]", e);
        verifiedRecovery = false;
        setStatus(e?.message || "Doğrulama bağlantısı işlenemedi.", "err");
        saveBtn.disabled = true;
      }
    }

    async function resetPassword(){
      const p1 = $("password").value;
      const p2 = $("password2").value;

      if(!verifiedRecovery){
        setStatus("Doğrulama tamamlanmadan şifre değiştirilemez.", "err");
        return;
      }

      if(!p1 || !p2){
        setStatus("Şifre alanları boş olamaz.", "err");
        return;
      }

      if(p1 !== p2){
        setStatus("Şifreler aynı değil.", "err");
        return;
      }

      if(p1.length < 6){
        setStatus("Şifre en az 6 karakter olmalı.", "err");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Kaydediliyor...";

      try{
        const { error } = await supabase.auth.updateUser({
          password: p1
        });

        if(error) throw error;

        setStatus("Şifre başarıyla güncellendi. Admin giriş sayfasına yönlendiriliyorsun...", "ok");

        setTimeout(() => {
          window.location.href = "/pages/admin.html";
        }, 1400);
      } catch (e) {
        console.error("[reset_password updateUser]", e);
        setStatus(e?.message || "Şifre güncellenemedi.", "err");
        saveBtn.disabled = false;
        saveBtn.textContent = "Kaydet";
      }
    }

    saveBtn.addEventListener("click", resetPassword);
    prepareRecoverySession();
  </script>
</body>
</html>
