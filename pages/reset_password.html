<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>italkyAI • Şifre Yenile</title>

<style>
body{
  margin:0;
  background:#0b0b12;
  color:#fff;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  width:320px;
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  text-align:center;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  border:none;
}

button{
  background:#6366f1;
  color:#fff;
  font-weight:bold;
}

.status{
  margin-top:10px;
  font-size:14px;
}
</style>

</head>
<body>

<div class="card">
  <h2>Şifre Yenile</h2>

  <input id="password" type="password" placeholder="Yeni şifre"/>
  <input id="password2" type="password" placeholder="Tekrar şifre"/>

  <button onclick="resetPassword()">Kaydet</button>

  <div id="status" class="status"></div>
</div>

<script type="module">
import { supabase } from "/js/supabase_client.js";

const statusEl = document.getElementById("status");

function setStatus(text, ok=false){
  statusEl.textContent = text;
  statusEl.style.color = ok ? "#22c55e" : "#ef4444";
}

window.resetPassword = async () => {
  const p1 = document.getElementById("password").value;
  const p2 = document.getElementById("password2").value;

  if(!p1 || !p2){
    setStatus("Şifre boş olamaz");
    return;
  }

  if(p1 !== p2){
    setStatus("Şifreler aynı değil");
    return;
  }

  if(p1.length < 6){
    setStatus("Şifre en az 6 karakter olmalı");
    return;
  }

  try{
    const { error } = await supabase.auth.updateUser({
      password: p1
    });

    if(error){
      setStatus(error.message);
      return;
    }

    setStatus("Şifre güncellendi ✓", true);

    setTimeout(()=>{
      location.href = "/pages/admin.html";
    }, 1500);

  }catch(e){
    setStatus("Hata oluştu");
  }
};
</script>

</body>
</html>
