<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:#fff;
      --muted:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.12);
      --blue1:#10355e;
      --blue2:#2e66d7;
      --red1:#7a1313;
      --red2:#c61c1c;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shadow:0 18px 42px rgba(0,0,0,.30);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,.05), transparent 16%),
        radial-gradient(circle at 82% 8%, rgba(255,255,255,.05), transparent 16%),
        linear-gradient(180deg,#050814,#0a1020 45%,#060b18);
      overflow:hidden;
    }

    #pageContent{
      width:100%;
      min-height:100dvh;
      padding:10px 12px calc(10px + var(--safe-bottom));
      opacity:0;
      transition:opacity .18s ease;
    }

    #pageContent.ready{ opacity:1; }

    .page{
      width:100%;
      max-width:760px;
      min-height:calc(100dvh - 20px - var(--safe-bottom));
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .frame{
      position:relative;
      flex:1;
      min-height:0;
      display:grid;
      grid-template-rows:1fr 1fr;
      gap:10px;
    }

    .panel{
      position:relative;
      overflow:hidden;
      border-radius:30px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      padding:16px;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.14;
      filter:blur(8px);
    }

    .top-panel{
      background:
        radial-gradient(circle at 85% 18%, rgba(255,255,255,.07), transparent 18%),
        linear-gradient(180deg,var(--blue1),var(--blue2));
    }

    .bottom-panel{
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.08), transparent 18%),
        linear-gradient(180deg,var(--red1),var(--red2));
    }

    .panel-top{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:12px;
      flex:0 0 auto;
    }

    .bubble{
      position:relative;
      z-index:2;
      flex:1;
      min-height:0;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:auto;
    }

    .out-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      width:100%;
      gap:14px;
    }

    #gokturkOutput{
      font-size:34px;
      line-height:1.6;
      font-weight:1000;
      letter-spacing:2px;
      word-break:break-word;
    }

    .latin-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
    }

    #latinOutput{
      font-size:16px;
      line-height:1.6;
      font-weight:800;
      color:rgba(255,255,255,.88);
      word-break:break-word;
    }

    .mini-speak{
      width:36px;
      height:36px;
      border:none;
      border-radius:10px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .input-wrap{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .input-preview{
      flex:1;
      min-height:92px;
      display:flex;
      align-items:center;
      font-size:24px;
      font-weight:900;
      word-break:break-word;
    }

    .send-mini{
      width:56px;
      height:56px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg, rgba(103,232,249,.24), rgba(255,255,255,.10));
      border:1px solid rgba(103,232,249,.30);
      color:#fff;
      font-size:22px;
      cursor:pointer;
    }

    .toolbar{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
      flex:0 0 auto;
    }

    .btn{
      min-height:56px;
      border:none;
      border-radius:20px;
      color:#fff;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
    }

    .btn.primary{
      background:linear-gradient(135deg, rgba(103,232,249,.22), rgba(255,255,255,.08));
      border:1px solid rgba(103,232,249,.28);
    }

    .orb-wrap{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:94px;
      height:94px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9;
    }

    .orb{
      width:74px;
      height:74px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.30), transparent 24%), radial-gradient(circle at 50% 50%, rgba(103,232,249,.35), rgba(99,102,241,.30) 55%, rgba(0,0,0,.18) 100%);
      box-shadow:0 0 18px rgba(103,232,249,.28), 0 0 40px rgba(99,102,241,.22);
      border:1px solid rgba(255,255,255,.18);
      animation:orbFloat 3s ease-in-out infinite;
    }

    @keyframes orbFloat{
      0%,100%{ transform:translateY(0) scale(1); }
      50%{ transform:translateY(-5px) scale(1.03); }
    }

    @media (max-width:640px){
      .toolbar{ grid-template-columns:1fr; }
      #gokturkOutput{ font-size:26px; }
      .input-preview{ font-size:21px; }
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="page">
      <section class="frame">
        <div class="panel top-panel">
          <div class="bubble">
            <div class="out-wrap">
              <div id="gokturkOutput"></div>
              <div class="latin-row">
                <div id="latinOutput"></div>
                <button id="speakBtn" class="mini-speak" type="button">🔊</button>
              </div>
            </div>
          </div>
          <div class="toolbar">
            <button id="copyBtn" class="btn secondary" type="button">Kopyala</button>
            <button id="replayBtn" class="btn secondary" type="button">🔊 Dinle</button>
          </div>
        </div>

        <div class="orb-wrap"><div class="orb"></div></div>

        <div class="panel bottom-panel">
          <div class="bubble">
            <div class="input-wrap">
              <div id="inputPreview" class="input-preview"></div>
              <button id="sendBtn" class="send-mini" type="button">➜</button>
            </div>
          </div>
          <div class="toolbar">
            <button id="micBtn" class="btn primary" type="button">🎙️ Konuş</button>
            <button id="clearBtn" class="btn secondary" type="button">Temizle</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
