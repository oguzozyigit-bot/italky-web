<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Ataların Dili</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --red-glow:#ef4444;
      --blue-glow:#60a5fa;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
    }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
      overflow:hidden;
    }

    .half-screen.top{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
    }

    .lang-trigger{
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      padding:10px 18px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      z-index:50;
      backdrop-filter:blur(12px);
      min-height:44px;
      max-width:92%;
      text-decoration:none;
    }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px 0;
      mask-image:linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:88%;
      line-height:1.25;
      word-break:break-word;
    }

    .bubble.them{
      opacity:.72;
      font-size:16px;
      font-weight:700;
    }

    .bubble.me{
      font-size:22px;
      font-weight:800;
      opacity:.92;
    }

    .bubble.me.is-latest{
      font-size:34px;
      font-weight:900;
      opacity:1;
      line-height:1.18;
      letter-spacing:2px;
      text-shadow:0 0 14px rgba(255,255,255,.12);
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble-row .txt{
      display:inline-block;
    }

    .spk-icon{
      width:30px;
      height:30px;
      min-width:30px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk-icon svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .mic-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding-bottom:10px;
      z-index:30;
    }

    .btn-mic{
      width:86px;
      height:86px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),linear-gradient(135deg,#fca5a5,#ef4444,#7f1d1d);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
      touch-action:manipulation;
    }

    .btn-mic svg{
      width:30px;
      height:30px;
    }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(239,68,68,.85);
      box-shadow:0 0 0 6px rgba(239,68,68,.10), 0 0 28px rgba(239,68,68,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.3;
      letter-spacing:.12px;
      min-height:18px;
      user-select:none;
      max-width:270px;
      width:100%;
      display:block;
      color:#22c55e;
      text-shadow:0 0 12px rgba(34,197,94,.28);
    }

    .helper-wait{
      color:#ef4444;
      text-shadow:0 0 12px rgba(239,68,68,.28);
    }

    .center-hub{
      height:116px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter:blur(15px);
      z-index:650;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:100px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:100px;
      height:100px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:var(--red-glow);
      box-shadow:0 0 15px var(--red-glow);
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:var(--blue-glow);
      box-shadow:0 0 15px var(--blue-glow);
    }

    .ai-core{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.5px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(239,68,68,.35); }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999999;
      padding:20px;
    }

    .modal.open{ display:flex; }

    .modal-card{
      width:min(100%, 420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:'Space Grotesk',sans-serif;
      font-size:20px;
      font-weight:900;
      color:#fff;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{
      background:var(--ai-gradient);
      color:#05060d;
    }

    .modal-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    @media (max-width:390px){
      .btn-clear{
        padding:10px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="half-screen top" id="topSection">
      <div class="lang-trigger">
        <span>🇹🇷 Türkçe</span>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="helper-text" id="topHelper"></div>
      </div>
    </div>

    <div class="center-hub">
      <a class="nav-btn btn-home" id="homeLink" href="/pages/home.html">ANA SAYFA</a>

      <div class="orb-container">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
    </div>

    <div class="half-screen bottom" id="botSection">
      <div class="lang-trigger">
        <span>Eski Türkçe</span>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" aria-label="Mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 19v3"></path>
          </svg>
        </div>
        <div class="helper-text" id="botHelper"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="uiModal">
    <div class="modal-card">
      <h3 class="modal-title" id="uiModalTitle">Jeton Gerekli</h3>
      <p class="modal-text" id="uiModalText">Ataların Dili dönüşümü için jeton gerekiyor.</p>
      <div class="modal-actions">
        <button class="modal-btn primary" id="uiModalGo">Jeton Al</button>
        <button class="modal-btn secondary" id="uiModalClose">Kapat</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/ancestors_language_page.js"></script>
</body>
</html>
