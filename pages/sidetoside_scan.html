<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<title>italkyAI • New Premium Icon</title>
<style>
:root {
  /* Renkleri daha tok ve derin hale getirdim */
  --neon-core: #00e5ff; 
  --pink-aura: #ff007a;
  --bg-deep: #020205; /* Tam siyah değil, çok derin lacivert-siyah */
}

body {
  margin: 0; display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; background: #1a1a1a;
}

/* 512x512 Play Store Standartı */
.icon-container {
  width: 192px; height: 192px;
  background: var(--bg-deep);
  border-radius: 42px; /* Squircle */
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.1);
}

/* Arka plandaki o "kötü" duran patlamayı zarif bir degradeye çevirdim */
.aura-glow {
  position: absolute; inset: 0;
  background: 
    radial-gradient(circle at 100% 0%, rgba(255,0,122,0.15) 0%, transparent 50%),
    radial-gradient(circle at 0% 100%, rgba(0,229,255,0.15) 0%, transparent 50%);
}

/* Merkezi Küre - Cam Efekti (Glassmorphism) */
.glass-sphere {
  width: 120px; height: 120px;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  backdrop-filter: blur(5px);
  box-shadow: 
    inset 0 0 20px rgba(255,255,255,0.05),
    0 15px 35px rgba(0,0,0,0.5);
}

/* İkonun kalbi: iAI Sembolü */
.symbol {
  display: flex; align-items: baseline;
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  color: #fff;
  letter-spacing: -2px;
}

.i-letter {
  font-size: 70px;
  background: linear-gradient(to bottom, #fff, #b2f9ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 15px rgba(0,229,255,0.4));
}

.ai-letter {
  font-size: 32px;
  color: var(--pink-aura);
  margin-left: 2px;
  text-shadow: 0 0 10px rgba(255,0,122,0.5);
}

/* Alt kısımdaki o parlayan enerji çizgisi (Modern dokunuş) */
.energy-bar {
  position: absolute;
  bottom: 35px;
  width: 40px;
  height: 4px;
  background: var(--neon-core);
  border-radius: 10px;
  box-shadow: 0 0 15px var(--neon-core);
}
</style>
</head>
<body>

<div class="icon-container">
  <div class="aura-glow"></div>
  <div class="glass-sphere">
    <div class="symbol">
      <span class="i-letter">i</span>
      <span class="ai-letter">AI</span>
    </div>
    <div class="energy-bar"></div>
  </div>
</div>

</body>
</html>
