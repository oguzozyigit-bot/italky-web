<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>italkyAI</title>

<style>
body{
background:#000;
color:#fff;
font-family:Outfit;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
flex-direction:column;
gap:20px;
text-align:center;
}
.btn{
padding:14px 22px;
border-radius:16px;
background:linear-gradient(135deg,#6366f1,#ec4899);
color:#000;
font-weight:900;
text-decoration:none;
}
</style>

<script>

const params = new URLSearchParams(location.search)
const host = params.get("host")

function openApp(){

const appUrl = `italky://join?host=${host}`

location.href = appUrl

setTimeout(()=>{
location.href="https://play.google.com/store/apps/details?id=ai.italky.app"
},2000)

}

</script>

</head>

<body onload="openApp()">

<h2>italkyAI sohbet açılıyor</h2>

<a class="btn"
href="https://play.google.com/store/apps/details?id=ai.italky.app">
Uygulamayı indir
</a>

</body>
</html>
