<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>italkyAI Shorts</title>
  <meta name="theme-color" content="#06111d">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#fff;font-family:Arial,sans-serif}
    #shortsFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06111d;z-index:1}
    #splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#0b2633 0,#071724 33%,#06111d 70%);transition:opacity .25s ease,visibility .25s ease}
    #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splash-card{text-align:center;padding:24px}.brand{font-size:25px;font-weight:900;letter-spacing:-.03em}.brand b{color:#53e7e1}.spin{width:38px;height:38px;margin:20px auto;border-radius:50%;border:3px solid rgba(83,231,225,.18);border-top-color:#53e7e1;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.splash-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.66)}
    #authCover{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:2147483600;width:72px;height:72px;border-radius:28px;background:radial-gradient(circle,rgba(7,17,28,.98) 0,rgba(7,17,28,.92) 58%,rgba(7,17,28,0) 78%);display:grid;place-items:center;pointer-events:none}
    #authButton{pointer-events:auto;width:52px;height:52px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(8,16,23,.86);color:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer}
    #authButton:active{transform:scale(.96)}#authButton[disabled]{opacity:.55;cursor:default}
    #authButton svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    #toast{position:fixed;left:50%;top:calc(max(16px,env(safe-area-inset-top)) + 66px);z-index:2147483601;transform:translate(-50%,-10px);opacity:0;pointer-events:none;max-width:min(88vw,420px);padding:10px 15px;border-radius:999px;background:rgba(4,10,18,.92);border:1px solid rgba(83,231,225,.25);font-size:12px;font-weight:800;transition:.2s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <iframe id="shortsFrame" title="iCanyAI Shorts" allow="autoplay; microphone; camera; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div id="splash" aria-live="polite"><div class="splash-card"><div class="brand">italky<b>AI</b> Shorts</div><div class="spin"></div><div class="splash-text" id="splashText">Shorts hazırlanıyor…</div></div></div>

  <div id="authCover">
    <button id="authButton" type="button" disabled aria-label="Giriş durumu hazırlanıyor" title="Giriş durumu hazırlanıyor"></button>
  </div>
  <div id="toast"></div>

  <script type="module">
    import { supabase } from '/js/supabase_client.js';
    import { buildFromItalkyUrl } from '/js/icany_bridge.js';

    const frame=document.getElementById('shortsFrame');
    const splash=document.getElementById('splash');
    const splashText=document.getElementById('splashText');
    const authButton=document.getElementById('authButton');
    const toast=document.getElementById('toast');

    const loginSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>';
    const logoutSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/></svg>';
    let signedIn=false;
    let toastTimer=0;

    function showToast(text){
      if(!toast)return;
      toast.textContent=String(text||'');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
    }

    function publicShortsUrl(){
      return `https://icany.ai/hosgeldiniz?from=italky&embedded=1&t=${Date.now()}`;
    }

    function setAuthState(hasSession){
      signedIn=Boolean(hasSession);
      authButton.disabled=false;
      authButton.innerHTML=signedIn?logoutSvg:loginSvg;
      authButton.setAttribute('aria-label',signedIn?'Güvenli Çıkış':'Google ile giriş yap');
      authButton.title=signedIn?'Güvenli Çıkış':'Google ile giriş yap';
    }

    async function loadShorts(){
      try{
        const result=await Promise.race([
          supabase.auth.getSession(),
          new Promise(resolve=>setTimeout(()=>resolve({data:{session:null},timeout:true}),1600))
        ]);
        const session=result?.data?.session||null;
        const token=String(session?.access_token||'').trim();
        setAuthState(Boolean(token));
        if(splashText)splashText.textContent=token?'Oturum bağlanıyor…':'Shorts açılıyor…';
        frame.src=token?buildFromItalkyUrl('/hosgeldiniz',token):publicShortsUrl();
      }catch(error){
        console.warn('[hosgeldiniz_shell] session read failed',error);
        setAuthState(false);
        frame.src=publicShortsUrl();
      }
    }

    frame.addEventListener('load',()=>{
      window.setTimeout(()=>splash?.classList.add('hide'),180);
    });

    authButton.addEventListener('click',()=>{
      if(authButton.disabled)return;
      authButton.disabled=true;
      if(signedIn){
        showToast('Güvenli çıkış yapılıyor…');
        location.assign('/pages/native_logout.html');
      }else{
        showToast('Google hesapları açılıyor…');
        location.assign('/pages/native_login.html?next=%2Fhosgeldiniz');
      }
    });

    void loadShorts();
  </script>
</body>
</html>
