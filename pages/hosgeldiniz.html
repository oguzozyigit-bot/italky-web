<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>italkyAI</title>
<meta name="theme-color" content="#06111d">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#06111d;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
.wrap{display:grid;place-items:center;gap:14px;text-align:center;padding:24px}.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.18);border-top-color:#42d7d0;border-radius:999px;animation:spin .8s linear infinite}.text{font-size:14px;font-weight:700;color:rgba(255,255,255,.72)}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" aria-live="polite"><div class="spinner" aria-hidden="true"></div><div class="text">iCanyAI Shorts açılıyor…</div></div>
<script type="module">
import { supabase } from '/js/supabase_client.js';
import { buildFromItalkyUrl } from '/js/icany_bridge.js';

function removeCorporateEntry(){
  document.querySelectorAll('a,button,[role="button"]').forEach((el)=>{
    const text=String(el.textContent||'').replace(/\s+/g,' ').trim().toLocaleLowerCase('tr-TR');
    if(text==='kurumsal giriş'||text==='kurumsal giris') el.remove();
  });
}
removeCorporateEntry();
const observer=new MutationObserver(removeCorporateEntry);
observer.observe(document.documentElement,{subtree:true,childList:true});

(async()=>{
  const publicTarget='https://icany.ai/hosgeldiniz';
  try{
    const {data}=await supabase.auth.getSession();
    const token=String(data?.session?.access_token||'').trim();
    if(!token){
      location.replace(publicTarget);
      return;
    }
    location.replace(buildFromItalkyUrl('/shorts-home',token));
  }catch(e){
    console.warn('[hosgeldiniz] bridge session unavailable',e);
    location.replace(publicTarget);
  }
})();
</script>
</body>
</html>
