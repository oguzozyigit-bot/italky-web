<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>italkyAI</title>
  <meta name="theme-color" content="#06111d">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#fff;font-family:Arial,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06111d}
    #gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#06111d;text-align:center;padding:24px}
    #gate.hide{display:none}.brand{font-size:28px;font-weight:900}.brand b{color:#36c8ff}.status{margin-top:14px;color:rgba(255,255,255,.65);font-size:13px;font-weight:700}
  </style>
</head>
<body>
  <iframe id="app" title="italkyAI Shorts" allow="autoplay; microphone; camera; clipboard-read; clipboard-write; fullscreen"></iframe>
  <div id="gate"><div><div class="brand">italky<b>AI</b></div><div class="status" id="status">Hesabınız kontrol ediliyor…</div></div></div>
  <script type="module">
    import {waitForSupabaseSession} from '/js/supabase_client.js';
    import {buildFromItalkyUrl} from '/js/icany_bridge.js';
    import {safeLogout} from '/js/auth.js';
    import {ensurePageRewardAd} from '/js/page_reward_ads.js';

    const HOME='/hosgeldiniz';
    const LOGIN='/pages/login.html';
    const TRANSLATE_URL='https://italky.ai/facetoface.html';
    const frame=document.getElementById('app');
    const gate=document.getElementById('gate');
    const status=document.getElementById('status');
    let logoutRunning=false;
    let pendingTargetOpen=false;

    const PAGE_LABELS={
      music:'Müzik',
      shorts:'Shorts',
      news:'Haber',
      test:'Test',
      translate:'Çeviri',
    };

    async function runPageReward(pageKey,label){
      const key=String(pageKey||'').trim().toLowerCase();
      if(!PAGE_LABELS[key])return;
      try{
        await ensurePageRewardAd({
          pageKey:key,
          placement:`page_${key}`,
          label:String(label||PAGE_LABELS[key]),
        });
      }catch(error){
        console.warn('[page reward] flow failed',key,error);
      }
    }

    async function openTranslateWithReward(){
      if(pendingTargetOpen)return;
      pendingTargetOpen=true;
      try{
        await runPageReward('translate','Çeviri');
      }finally{
        pendingTargetOpen=false;
        frame.src=TRANSLATE_URL;
      }
    }

    window.addEventListener('message',(event)=>{
      if(event.origin!=='https://icany.ai'&&event.origin!=='https://www.icany.ai')return;
      const data=event.data||{};
      if(data.type==='italky:secure-logout'||data.action==='italky:secure-logout'){
        if(logoutRunning)return;
        logoutRunning=true;
        gate.classList.remove('hide');
        status.textContent='Güvenli çıkış yapılıyor…';
        void safeLogout();
        return;
      }
      if(data.type==='italky:reward-section-enter'){
        void runPageReward(data.pageKey,data.label);
        return;
      }
      if(data.type==='italky:reward-open-translate'){
        void openTranslateWithReward();
      }
    });

    try{
      const session=await waitForSupabaseSession({timeoutMs:4500,intervalMs:180,restoreFromBackup:true});
      const token=String(session?.access_token||'').trim();
      if(!session?.user?.id||!token){
        status.textContent='Giriş ekranı açılıyor…';
        location.replace(`${LOGIN}?next=${encodeURIComponent(HOME)}`);
      }else{
        status.textContent='Oturum bağlanıyor…';
        frame.src=buildFromItalkyUrl('/hosgeldiniz',token);
        frame.addEventListener('load',()=>gate.classList.add('hide'),{once:true});
      }
    }catch(error){
      console.warn('[hosgeldiniz] session gate failed',error);
      location.replace(`${LOGIN}?next=${encodeURIComponent(HOME)}`);
    }
  </script>
</body>
</html>
