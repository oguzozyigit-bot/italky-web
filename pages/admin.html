<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>italky Admin</title>

<style>
body{
  margin:0;
  background:#0b0b12;
  color:#fff;
  font-family:Arial;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

input,select,button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:14px;
}

button{
  background:#6366f1;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.table{
  width:100%;
  font-size:12px;
  margin-top:10px;
}

.table div{
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
</style>
</head>

<body>

<div class="wrap">

<h2>🔐 Admin Panel</h2>

<div class="card">
  <h3>Giriş</h3>
  <input id="pass" placeholder="Şifre"/>
  <button onclick="login()">Giriş Yap</button>
</div>

<div id="panel" style="display:none;">

  <div class="card">
    <h3>NFC Kart Tanımla</h3>

    <input id="uid" placeholder="UID (örn: 04E6D462FD1690)"/>

    <select id="package">
      <option value="PKG_10DIL_100J_30G">10 Dil / 100 Jeton</option>
      <option value="PKG_20DIL_200J_395G">20 Dil / 200 Jeton</option>
      <option value="PREMIUM_1YIL">Premium 1 Yıl</option>
    </select>

    <button onclick="saveCard()">Kart Kaydet</button>
  </div>

  <div class="card">
    <h3>Kullanıcılar</h3>
    <button onclick="loadUsers()">Listele</button>
    <div id="users" class="table"></div>
  </div>

</div>

</div>

<script type="module">
import { supabase } from "/js/supabase_client.js";

const ADMIN_PASS = "123456"; // değiştir

function login(){
  const val = document.getElementById("pass").value;
  if(val === ADMIN_PASS){
    document.getElementById("panel").style.display = "block";
    alert("Giriş başarılı");
  }else{
    alert("Hatalı şifre");
  }
}

window.login = login;

async function saveCard(){

  const uid = document.getElementById("uid").value
    .toUpperCase()
    .replace(/:/g,"")
    .trim();

  const pkg = document.getElementById("package").value;

  if(!uid){
    alert("UID boş");
    return;
  }

  const { error } = await supabase
    .from("nfc_cards")
    .insert({
      uid: uid,
      package_code: pkg,
      is_active: true,
      status: "new"
    });

  if(error){
    alert("Hata: " + error.message);
    return;
  }

  alert("Kart eklendi");
}

window.saveCard = saveCard;

async function loadUsers(){

  const { data, error } = await supabase
    .from("profiles")
    .select("id, email, app_access_mode, jeton_balance")
    .limit(20);

  if(error){
    alert(error.message);
    return;
  }

  const box = document.getElementById("users");
  box.innerHTML = "";

  data.forEach(u=>{
    const div = document.createElement("div");
    div.innerHTML = `
      ${u.email} | ${u.app_access_mode} | ${u.jeton_balance} jeton
    `;
    box.appendChild(div);
  });
}

window.loadUsers = loadUsers;
</script>

</body>
</html>
