<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>italkyAI Messenger Test</title><style>*{box-sizing:border-box}body{margin:0;background:#07110f;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{min-height:100vh;max-width:480px;margin:auto;background:#0b1714;position:relative;overflow:hidden}.hidden{display:none!important}button,input,select{font:inherit}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 16px 11px;background:#0e211c;border-bottom:1px solid #18342c}.brand{font-size:22px;font-weight:900}.brand b{color:#2fd286}.status{font-size:11px;padding:6px 9px;background:#163129;border-radius:999px;color:#a8cabf;max-width:270px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verify{padding:30px}.card{background:#10231e;border:1px solid #1c3b32;border-radius:24px;padding:28px 22px}.muted{color:#89a69d;line-height:1.5}.phoneRow{display:grid;grid-template-columns:145px 1fr;gap:8px;margin:18px 0}.field,.select{width:100%;background:#0a1714;color:#fff;border:1px solid #285143;border-radius:13px;padding:13px}.otp{font-size:26px;letter-spacing:7px;text-align:center}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;margin-top:10px}.primary{background:#25d366;color:#062a19}.secondary{background:#163028;color:#fff;border:1px solid #285143}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#0e211c}.tab{border:0;background:transparent;color:#8eaaa1;padding:14px 5px;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:#2fd286;border-bottom-color:#2fd286}.panel{height:calc(100vh - 115px);overflow:auto}.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid #17312a}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#1d4639;font-weight:900}.rowTitle{font-weight:800}.rowSub{font-size:13px;color:#91aaa2;margin-top:3px}.rowMeta{font-size:11px;color:#75938a}.fab{position:absolute;right:18px;bottom:20px;width:58px;height:58px;border-radius:18px;border:0;background:#25d366;color:#06351e;font-size:28px}.sheet,.chat,.call{position:absolute;inset:0;z-index:20;background:#081511}.sheet{padding:18px}.sheetHead,.chatHead{display:flex;align-items:center;gap:10px}.icon{border:0;background:transparent;color:#fff;font-size:25px}.chat{display:flex;flex-direction:column}.chatHead{height:64px;background:#0e211c;padding:8px 10px}.chatPerson{flex:1}.chatName{font-weight:800}.chatLang{font-size:11px;color:#82a198}.messages{flex:1;overflow:auto;padding:14px 10px 90px;background:#081511}.bubble{max-width:82%;padding:9px 11px;margin:6px 0;border-radius:13px}.mine{margin-left:auto;background:#145c3d}.theirs{background:#162721}.small{font-size:11px;color:#a8c2b9;margin-top:4px}.composer{position:absolute;left:0;right:0;bottom:0;padding:8px;background:#0b1714;display:grid;grid-template-columns:1fr 48px 48px;gap:7px}.composer input{border:0;border-radius:22px;background:#142822;color:#fff;padding:12px 15px}.round{width:48px;height:48px;border:0;border-radius:50%;background:#25d366}.call{z-index:30;background:#07110f}.stage{position:relative;height:calc(100vh - 75px);background:#101815}.stage video{width:100%;height:100%;object-fit:cover}.self{position:absolute;right:12px;top:12px;width:105px;height:150px;border-radius:16px;overflow:hidden;background:#18342c}.self video{width:100%;height:100%;object-fit:cover}.peer{position:absolute;left:14px;top:14px;background:#0009;padding:8px 12px;border-radius:16px}.subs{position:absolute;left:12px;right:12px;bottom:95px}.subline{background:#000c;border-radius:14px;padding:10px;margin-top:7px}.controls{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:14px}.ctl{width:54px;height:54px;border:0;border-radius:50%;background:#22342e;color:#fff;font-size:20px}.hang{background:#d93025}.incoming{position:fixed;inset:0;z-index:50;background:#07100ff2;display:grid;place-items:center;padding:25px}.incard{background:#10231e;border-radius:28px;padding:30px 22px;width:min(100%,380px);text-align:center}.inBtns{display:flex;justify-content:center;gap:40px;margin-top:24px}.accept,.decline{width:70px;height:70px;border:0;border-radius:50%;font-size:28px;color:white}.accept{background:#25d366}.decline{background:#d93025}.hint{font-size:12px;color:#84a198;margin-top:8px}</style></head><body><main class="app"><header class="top"><div class="brand">italky<b>AI</b></div><div id="status" class="status">Test modu</div></header><section id="verify" class="verify"><div class="card"><div class="muted">Telefon doğrulama · TEST</div><h1>Kendi numaranla başla</h1><div class="muted">Şimdilik gerçek SMS gönderilmiyor. Kod her zaman <b>123456</b>.</div><div class="phoneRow"><select id="country" class="select"><option value="90">🇹🇷 Türkiye +90</option><option value="1">🇺🇸 ABD/Kanada +1</option><option value="44">🇬🇧 İngiltere +44</option><option value="49">🇩🇪 Almanya +49</option><option value="389">🇲🇰 Makedonya +389</option></select><input id="phone" class="field" inputmode="tel" placeholder="532 123 45 67"></div><div id="otpBox" class="hidden"><div class="muted">SMS kodunu gir.</div><input id="otp" class="field otp" maxlength="6" inputmode="numeric" placeholder="000000"><button id="verifyBtn" class="primary">Numarayı Doğrula</button><button id="editBtn" class="secondary">Numarayı Düzelt</button></div><button id="sendBtn" class="primary">SMS Kodu Gönder</button></div></section><section id="home" class="hidden"><div class="tabs"><button class="tab active" data-tab="chats">Sohbetler</button><button class="tab" data-tab="contacts">Kişiler</button><button class="tab" data-tab="calls">Aramalar</button></div><div id="chats" class="panel"></div><div id="contacts" class="panel hidden"></div><div id="calls" class="panel hidden"></div><button id="add" class="fab">＋</button></section><section id="addSheet" class="sheet hidden"><div class="sheetHead"><button id="closeAdd" class="icon">‹</button><h2>Yeni kişi</h2></div><input id="cname" class="field" placeholder="Adı"><div class="phoneRow"><select id="ccountry" class="select"><option value="90">🇹🇷 +90</option><option value="1">🇺🇸 +1</option><option value="44">🇬🇧 +44</option><option value="49">🇩🇪 +49</option><option value="389">🇲🇰 +389</option></select><input id="cphone" class="field" inputmode="tel" placeholder="Telefon"></div><select id="clang" class="select"><option value="en">English</option><option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option></select><div class="hint">Mesajların bu kişiye seçtiğin dilde çevrilir.</div><button id="saveContact" class="primary">Kişiyi Ekle</button></section><section id="chat" class="chat hidden"><div class="chatHead"><button id="backChat" class="icon">‹</button><div class="avatar" id="chatAv">IT</div><div class="chatPerson"><div id="chatName" class="chatName"></div><div id="chatLang" class="chatLang"></div></div><button id="audio" class="icon">☎</button><button id="video" class="icon">◉</button></div><div id="messages" class="messages"></div><div class="composer"><input id="msg" placeholder="Mesaj"><button id="send" class="round">➤</button><button id="voice" class="round">🎙</button></div></section><section id="call" class="call hidden"><div class="stage"><video id="remote" autoplay playsinline></video><div class="self"><video id="local" autoplay muted playsinline></video></div><div id="peer" class="peer"></div><div id="subs" class="subs"></div><div class="controls"><button id="mic" class="ctl">🎙</button><button id="cam" class="ctl">📹</button><button id="hang" class="ctl hang">☎</button></div></div><div style="height:75px;display:flex;align-items:center;justify-content:center;color:#8fb1a6">Canlı altyazılı italkyAI Call · TEST</div></section><section id="incoming" class="incoming hidden"><div class="incard"><div class="muted">Gelen italkyAI araması</div><h2 id="incomingNo"></h2><div id="incomingMode" class="muted"></div><div class="inBtns"><button id="decline" class="decline">✕</button><button id="accept" class="accept">✓</button></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{BASE_DOMAIN}from'/js/config.js';const sb=createClient('https://wtzsnywujksshcwvemgz.supabase.co','sb_publishable_85JlITD5FKjDvdf4JHU0Dg_eByJrKVo',{auth:{persistSession:false}}),$=id=>document.getElementById(id),digits=s=>String(s||'').replace(/\D/g,''),norm=s=>{let d=digits(s);return d?'+'+d:''},key=s=>digits(s),fmt=s=>norm(s).replace(/^\+90(\d{3})(\d{3})(\d{2})(\d{2})$/,'+90 $1 $2 $3 $4');let myNo=localStorage.getItem('italky_test_phone')||'',pending='',contacts=JSON.parse(localStorage.getItem('italky_test_contacts')||'[]'),active=null,inbox=null,msgChan=null,callChan=null,pc=null,stream=null,callState=null,incoming=null,rec=null;const langNames={tr:'Türkçe',en:'English',de:'Deutsch',fr:'Français',es:'Español'};function stat(t){$('status').textContent=t}function initials(s){return String(s||'IT').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function phone(c,p){let d=digits(p);if(c==='90'&&d.startsWith('0'))d=d.slice(1);return '+'+c+d}async function subscribeInbox(){if(!myNo)return;if(inbox)await sb.removeChannel(inbox);inbox=sb.channel('test-phone:'+key(myNo));inbox.on('broadcast',{event:'ring'},({payload})=>{if(payload?.to===myNo&&!callState){incoming=payload;$('incomingNo').textContent=fmt(payload.from);$('incomingMode').textContent=payload.mode==='video'?'Görüntülü arama':'Sesli arama';$('incoming').classList.remove('hidden')}});inbox.on('broadcast',{event:'accept'},async({payload})=>{if(callState&&payload.id===callState.id){await joinCall();await offer()}});inbox.on('broadcast',{event:'decline'},({payload})=>{if(callState&&payload.id===callState.id){stat('Arama reddedildi');endCall(false)}});await inbox.subscribe();stat('Hazır · '+fmt(myNo))}function showHome(){$('verify').classList.add('hidden');$('home').classList.remove('hidden');render();subscribeInbox()}if(myNo)showHome();$('sendBtn').onclick=()=>{const n=phone($('country').value,$('phone').value);if(!/^\+[1-9]\d{7,14}$/.test(n)){stat('Geçerli numara gir');return}pending=n;$('sendBtn').classList.add('hidden');$('otpBox').classList.remove('hidden');$('country').disabled=true;$('phone').disabled=true;stat('SMS gönderildi (TEST) · Kod: 123456');$('otp').focus()};$('verifyBtn').onclick=()=>{if(digits($('otp').value)!=='123456'){stat('Kod hatalı · Test kodu 123456');return}myNo=pending;localStorage.setItem('italky_test_phone',myNo);stat('Numara doğrulandı');showHome()};$('editBtn').onclick=()=>{$('otpBox').classList.add('hidden');$('sendBtn').classList.remove('hidden');$('country').disabled=false;$('phone').disabled=false;$('otp').value='';pending='';stat('Numaranı düzelt')};document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));['chats','contacts','calls'].forEach(x=>$(x).classList.toggle('hidden',x!==t.dataset.tab))}const r=e.target.closest('[data-c]');if(r){active=contacts.find(x=>x.phone===r.dataset.c);if(active)openChat()}});$('add').onclick=()=>$('addSheet').classList.remove('hidden');$('closeAdd').onclick=()=>$('addSheet').classList.add('hidden');$('saveContact').onclick=()=>{const p=phone($('ccountry').value,$('cphone').value);if(!/^\+[1-9]\d{7,14}$/.test(p)){stat('Geçerli kişi numarası gir');return}const c={name:$('cname').value.trim()||fmt(p),phone:p,lang:$('clang').value};contacts=contacts.filter(x=>x.phone!==p);contacts.push(c);localStorage.setItem('italky_test_contacts',JSON.stringify(contacts));$('addSheet').classList.add('hidden');render()};function render(){const html=contacts.length?contacts.map(c=>`<div class="row" data-c="${c.phone}"><div class="avatar">${initials(c.name)}</div><div><div class="rowTitle">${c.name}</div><div class="rowSub">${fmt(c.phone)} · ${langNames[c.lang]||c.lang}</div></div><div class="rowMeta">›</div></div>`).join(''):'<div class="row"><div class="avatar">＋</div><div><div class="rowTitle">Henüz kişi yok</div><div class="rowSub">+ ile kişi ekle</div></div></div>';$('contacts').innerHTML=html;$('chats').innerHTML=html;$('calls').innerHTML='<div class="row"><div class="avatar">☎</div><div><div class="rowTitle">Arama geçmişi</div><div class="rowSub">Test sürümünde yerel tutuluyor</div></div></div>'}function openChat(){$('chat').classList.remove('hidden');$('chatName').textContent=active.name;$('chatLang').textContent='Çeviri: '+(langNames[active.lang]||active.lang);$('chatAv').textContent=initials(active.name);loadLocalMessages();subscribeMessages()}$('backChat').onclick=()=>{$('chat').classList.add('hidden');active=null;if(msgChan)sb.removeChannel(msgChan)};function msgKey(a,b){return [key(a),key(b)].sort().join('-')}function localMsgKey(){return'italky_msgs_'+msgKey(myNo,active.phone)}function loadLocalMessages(){const arr=JSON.parse(localStorage.getItem(localMsgKey())||'[]');$('messages').innerHTML=arr.map(m=>`<div class="bubble ${m.from===myNo?'mine':'theirs'}"><div>${m.text}</div>${m.original&&m.original!==m.text?`<div class="small">Orijinal: ${m.original}</div>`:''}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}async function tr(text,to){if(!text||to==='tr')return text;try{const base=String(BASE_DOMAIN||'').replace(/\/+$/,'');const r=await fetch(base+'/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:'tr',target:to,from_lang:'tr',to_lang:to})});const j=await r.json();return j.text||j.translation||j.translatedText||text}catch{return text}}async function sendText(text,kind='text'){if(!active||!text.trim())return;const translated=await tr(text.trim(),active.lang),m={id:crypto.randomUUID(),from:myNo,to:active.phone,text:text.trim(),translated,lang:active.lang,kind,ts:Date.now()};let arr=JSON.parse(localStorage.getItem(localMsgKey())||'[]');arr.push({from:myNo,text:text.trim(),original:translated,ts:m.ts});localStorage.setItem(localMsgKey(),JSON.stringify(arr));loadLocalMessages();await sb.channel('test-msg:'+msgKey(myNo,active.phone)).send({type:'broadcast',event:'msg',payload:m})}$('send').onclick=()=>{const v=$('msg').value;$('msg').value='';sendText(v)};$('msg').onkeydown=e=>{if(e.key==='Enter'){$('send').click()}};$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){stat('Bu tarayıcı ses kaydını yazıya çeviremiyor');return}const r=new SR();r.lang='tr-TR';r.interimResults=false;r.onresult=e=>sendText(e.results[0][0].transcript,'voice');r.start();stat('Sesli mesaj dinleniyor…')};async function subscribeMessages(){if(msgChan)await sb.removeChannel(msgChan);msgChan=sb.channel('test-msg:'+msgKey(myNo,active.phone));msgChan.on('broadcast',{event:'msg'},({payload:m})=>{if(m.to!==myNo)return;let arr=JSON.parse(localStorage.getItem(localMsgKey())||'[]');arr.push({from:m.from,text:m.translated,original:m.text,ts:m.ts});localStorage.setItem(localMsgKey(),JSON.stringify(arr));loadLocalMessages()});await msgChan.subscribe()}$('audio').onclick=()=>startCall('audio');$('video').onclick=()=>startCall('video');async function startCall(mode){if(!active)return;callState={id:crypto.randomUUID(),peer:active.phone,mode,role:'caller'};showCall();stat('Çalıyor…');await sb.channel('test-phone:'+key(active.phone)).send({type:'broadcast',event:'ring',payload:{id:callState.id,from:myNo,to:active.phone,mode}})}function showCall(){$('chat').classList.add('hidden');$('home').classList.add('hidden');$('call').classList.remove('hidden');$('peer').textContent=fmt(callState.peer)}$('decline').onclick=async()=>{await sb.channel('test-phone:'+key(incoming.from)).send({type:'broadcast',event:'decline',payload:{id:incoming.id}});$('incoming').classList.add('hidden');incoming=null};$('accept').onclick=async()=>{const p=incoming;$('incoming').classList.add('hidden');callState={id:p.id,peer:p.from,mode:p.mode,role:'callee'};showCall();await prepare();await joinCall();await sb.channel('test-phone:'+key(p.from)).send({type:'broadcast',event:'accept',payload:{id:p.id}});incoming=null};async function prepare(){if(stream)return;stream=await navigator.mediaDevices.getUserMedia({audio:true,video:callState.mode==='video'?{facingMode:'user'}:false});$('local').srcObject=stream}async function makePeer(){await prepare();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)callChan?.send({type:'broadcast',event:'ice',payload:{id:callState.id,from:myNo,c:e.candidate.toJSON()}})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){stat('Görüşme bağlı');startCaption()}else if(pc.connectionState==='failed')stat('Bağlantı kurulamadı')}}async function joinCall(){if(callChan)return;callChan=sb.channel('test-call:'+callState.id);callChan.on('broadcast',{event:'offer'},async({payload})=>{if(callState.role!=='callee'||payload.id!==callState.id)return;await makePeer();await pc.setRemoteDescription(payload.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);await callChan.send({type:'broadcast',event:'answer',payload:{id:callState.id,sdp:pc.localDescription.toJSON()}})});callChan.on('broadcast',{event:'answer'},async({payload})=>{if(callState.role==='caller'&&payload.id===callState.id)await pc.setRemoteDescription(payload.sdp)});callChan.on('broadcast',{event:'ice'},async({payload})=>{if(payload.id===callState.id&&payload.from!==myNo&&pc)try{await pc.addIceCandidate(payload.c)}catch{}});callChan.on('broadcast',{event:'hang'},()=>endCall(false));callChan.on('broadcast',{event:'caption'},({payload})=>{if(payload.from!==myNo)addSub(payload.text)});await callChan.subscribe()}async function offer(){await joinCall();await makePeer();const o=await pc.createOffer();await pc.setLocalDescription(o);await callChan.send({type:'broadcast',event:'offer',payload:{id:callState.id,sdp:pc.localDescription.toJSON()}})}function addSub(text){const d=document.createElement('div');d.className='subline';d.textContent=text;$('subs').appendChild(d);while($('subs').children.length>3)$('subs').firstChild.remove()}function startCaption(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang='tr-TR';rec.continuous=true;rec.onresult=async e=>{const text=e.results[e.results.length-1][0].transcript;const out=active?await tr(text,active.lang):text;addSub('Sen: '+text);callChan?.send({type:'broadcast',event:'caption',payload:{from:myNo,text:out}})};rec.onend=()=>{if(callState)try{rec.start()}catch{}};try{rec.start()}catch{}}$('mic').onclick=()=>stream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled);$('cam').onclick=()=>stream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled);$('hang').onclick=async()=>{await callChan?.send({type:'broadcast',event:'hang',payload:{id:callState?.id}});endCall(true)};function endCall(home=true){try{rec?.stop()}catch{}rec=null;try{pc?.close()}catch{}pc=null;stream?.getTracks().forEach(t=>t.stop());stream=null;$('local').srcObject=null;$('remote').srcObject=null;if(callChan)sb.removeChannel(callChan);callChan=null;callState=null;$('call').classList.add('hidden');$('home').classList.remove('hidden');stat('Hazır · '+fmt(myNo))}render();</script></body></html>
