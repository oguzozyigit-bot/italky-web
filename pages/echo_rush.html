<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import { supabase } from "/js/supabase_client.js";

mountShell({ scroll: "none" });

const $ = (id)=>document.getElementById(id);
const GAME_LANG_KEY = "italky_echo_rush_lang";

const LANGS = {
  en:{ name:"İngilizce", flag:"🇬🇧", bcp:"en-US" },
  de:{ name:"Almanca",   flag:"🇩🇪", bcp:"de-DE" },
  fr:{ name:"Fransızca", flag:"🇫🇷", bcp:"fr-FR" },
  es:{ name:"İspanyolca",flag:"🇪🇸", bcp:"es-ES" },
  it:{ name:"İtalyanca", flag:"🇮🇹", bcp:"it-IT" }
};

const state = {
  lang: localStorage.getItem(GAME_LANG_KEY) || "",
  pool: [],
  used: new Set(),
  current: null,
  score: 0,
  best: 0,
  lives: 3,
  maxLives: 9,
  round: 0,
  limit: 20,
  listening: false,
  recog: null,
  selectedLang: localStorage.getItem(GAME_LANG_KEY) || "en"
};

let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }catch{ return null; }
}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + .01);
  g.gain.exponentialRampToValueAtTime(.0001, now + duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + duration + .02);
}
function playHitFx(){
  beep({freq:720,duration:.07,type:"triangle",gain:.05});
  beep({freq:920,duration:.08,type:"triangle",gain:.04,when:.05});
}
function playMissFx(){
  beep({freq:220,duration:.10,type:"sawtooth",gain:.05});
  beep({freq:170,duration:.12,type:"sawtooth",gain:.04,when:.04});
}
function playWinFx(){
  beep({freq:523,duration:.09,type:"triangle",gain:.05});
  beep({freq:659,duration:.09,type:"triangle",gain:.05,when:.08});
  beep({freq:784,duration:.11,type:"triangle",gain:.05,when:.16});
  beep({freq:1046,duration:.15,type:"triangle",gain:.05,when:.26});
}
function playLoseFx(){
  beep({freq:250,duration:.12,type:"square",gain:.05});
  beep({freq:180,duration:.15,type:"square",gain:.04,when:.10});
}

function toastLike(title, sub="", good=true){
  $("ovTitle").textContent = title;
  $("ovTitle").style.color = good ? "var(--green)" : "var(--red)";
  $("ovSub").textContent = sub;
  $("ovBadge").style.display = "none";
  $("overlay").classList.add("show");
}
function hideToastLike(){
  $("overlay").classList.remove("show");
}

function normalize(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"")
    .trim();
}

function editDistance(a,b){
  const s1=String(a), s2=String(b);
  const costs = new Array(s2.length+1);
  for(let j=0;j<=s2.length;j++) costs[j]=j;
  for(let i=1;i<=s1.length;i++){
    let prev=i-1;
    costs[0]=i;
    for(let j=1;j<=s2.length;j++){
      const tmp=costs[j];
      const val=Math.min(costs[j]+1, costs[j-1]+1, prev+(s1[i-1]===s2[j-1]?0:1));
      costs[j]=val; prev=tmp;
    }
  }
  return costs[s2.length];
}

function similarityScore(a,b){
  const s1=normalize(a), s2=normalize(b);
  if(!s1 && !s2) return 100;
  if(!s1 || !s2) return 0;
  if(s2.includes(s1)) return 100;
  const longer = s1.length >= s2.length ? s1 : s2;
  const shorter = s1.length >= s2.length ? s2 : s1;
  const dist = editDistance(longer, shorter);
  return Math.max(0, Math.min(100, Math.floor(((longer.length - dist)/longer.length)*100)));
}

function renderLangPicker() {
  const grid = $("langGrid");
  grid.innerHTML = Object.entries(LANGS).map(([code, meta]) => `
    <button class="langCard ${state.selectedLang===code ? "active" : ""}" data-lang="${code}" type="button">
      <div class="langFlag">${meta.flag}</div>
      <div class="langName">${meta.name}</div>
    </button>
  `).join("");

  grid.querySelectorAll(".langCard").forEach(btn => {
    btn.onclick = () => {
      state.selectedLang = btn.dataset.lang;
      renderLangPicker();
    };
  });
}

async function fileExists(url) {
  try {
    const res = await fetch(url, { method:"HEAD", cache:"no-store" });
    return res.ok;
  } catch {
    return false;
  }
}

function getPublicLangUrl(langCode) {
  return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;
}

function extractItems(payload) {
  if (Array.isArray(payload)) return payload;
  if (payload && typeof payload === "object") {
    const keys = ["items", "words", "data", "list", "entries", "pool"];
    for (const key of keys) {
      if (Array.isArray(payload[key])) return payload[key];
    }
  }
  return [];
}

function normalizePoolItems(items) {
  return items.map((item) => {
    const rawWord =
      item?.word ??
      item?.w ??
      item?.text ??
      item?.term ??
      item?.answer ??
      item?.source ??
      "";

    const rawMeaning =
      item?.meaning ??
      item?.tr ??
      item?.translation ??
      item?.mean ??
      item?.hint ??
      item?.target ??
      "";

    return {
      word: String(rawWord || "").trim(),
      meaning: String(rawMeaning || "").trim()
    };
  }).filter(x => x.word);
}

async function loadPool(lang) {
  const url = getPublicLangUrl(lang);
  const ok = await fileExists(url);
  if(!ok) return [];

  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) return [];

  const json = await res.json();
  return normalizePoolItems(extractItems(json));
}

function renderHearts() {
  $("hearts").innerHTML = Array.from({length: state.lives}).map(() => `<span class="heart">❤️</span>`).join("");
}

function renderHud() {
  $("langTag").textContent = `${LANGS[state.lang]?.flag || "🌐"} ${LANGS[state.lang]?.name || state.lang}`;
  $("scoreVal").textContent = String(state.score);
  $("bestVal").textContent = String(state.best);
  $("chipRound").textContent = `${state.round}/${state.limit}`;
}

function speak(text, lang) {
  if(!("speechSynthesis" in window)) return;
  try { window.speechSynthesis.cancel(); } catch {}
  const u = new SpeechSynthesisUtterance(String(text || "").trim());
  u.lang = LANGS[lang]?.bcp || "en-US";
  u.rate = .9;
  u.pitch = 1;
  u.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  if (voices?.length) {
    const base = lang;
    const found = voices.find(v => String(v.lang || "").toLowerCase().startsWith(base));
    if (found) u.voice = found;
  }

  setTimeout(() => {
    try { window.speechSynthesis.speak(u); } catch {}
  }, 100);
}

function nextItem() {
  if (!state.pool.length) return null;

  if (state.used.size >= state.pool.length) {
    state.used.clear();
  }

  let item = null;
  let guard = 0;
  while (guard < 100) {
    const pick = state.pool[Math.floor(Math.random() * state.pool.length)];
    const key = normalize(pick.word);
    if (!state.used.has(key)) {
      state.used.add(key);
      item = pick;
      break;
    }
    guard++;
  }

  return item || state.pool[0];
}

function renderCurrent() {
  if (!state.current) return;
  $("wMain").textContent = state.current.word;
  $("wSub").textContent = state.current.meaning || "—";
  $("helperText").textContent = "Kelimeyi dinle, doğru söyle ve puanı topla";
  renderHud();
  renderHearts();
}

function readCurrentWord() {
  if (!state.current?.word) return;
  speak(state.current.word, state.lang);
}

async function loadBest() {
  try {
    const { data } = await supabase.auth.getUser();
    const uid = data?.user?.id;
    if (!uid) return;

    const { data: prof } = await supabase
      .from("profiles")
      .select("echo_rush_best")
      .eq("id", uid)
      .maybeSingle();

    const map = prof?.echo_rush_best || {};
    state.best = Number(map[state.lang] || 0);
  } catch {}
}

async function saveBest() {
  try {
    const { data } = await supabase.auth.getUser();
    const uid = data?.user?.id;
    if (!uid) return;
    if (state.score <= state.best) return;

    state.best = state.score;

    const { data: prof } = await supabase
      .from("profiles")
      .select("echo_rush_best")
      .eq("id", uid)
      .maybeSingle();

    const map = prof?.echo_rush_best || {};
    map[state.lang] = state.best;

    await supabase
      .from("profiles")
      .update({ echo_rush_best: map })
      .eq("id", uid);
  } catch {}
}

function startRound() {
  hideToastLike();

  if (state.round >= state.limit) {
    state.round = 0;
    state.score = 0;
    state.lives = 3;
    state.used.clear();
  }

  state.current = nextItem();
  if (!state.current) return;

  state.round += 1;
  renderCurrent();

  setTimeout(() => {
    readCurrentWord();
  }, 280);
}

function finishRound(success) {
  if (success) {
    state.score += 5;
    playWinFx();
    toastLike("HARİKA!", "+5 PUAN", true);
    saveBest();
  } else {
    state.lives -= 1;
    playLoseFx();
    toastLike("OLMADI", "Can hakkın azaldı", false);
  }

  renderHud();
  renderHearts();

  setTimeout(() => {
    if (state.lives <= 0) {
      state.score = 0;
      state.lives = 3;
      state.round = 0;
      state.used.clear();
    }
    startRound();
  }, 3000);
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast("Bu cihazda konuşma algılama yok");
    return;
  }

  state.listening = true;
  $("btnMic").classList.add("listening");
  $("btnMic").textContent = "👂 DİNLİYOR";
  $("btnPass").disabled = true;

  const rec = new SR();
  state.recog = rec;
  rec.lang = LANGS[state.lang]?.bcp || "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  const watchdog = setTimeout(() => {
    try { rec.stop(); } catch {}
  }, 7000);

  rec.onresult = async (e) => {
    clearTimeout(watchdog);
    const spoken = e.results?.[0]?.[0]?.transcript || "";
    const score = similarityScore(state.current.word, spoken);

    state.listening = false;
    $("btnMic").classList.remove("listening");
    $("btnMic").textContent = "🎙️ CEVAPLA";
    $("btnPass").disabled = false;

    if (score >= 95) {
      playHitFx();
      finishRound(true);
    } else {
      playMissFx();
      finishRound(false);
    }
  };

  rec.onerror = () => {
    clearTimeout(watchdog);
    state.listening = false;
    $("btnMic").classList.remove("listening");
    $("btnMic").textContent = "🎙️ CEVAPLA";
    $("btnPass").disabled = false;
    toast("Dinleme başarısız");
  };

  rec.onend = () => {
    clearTimeout(watchdog);
    if (state.listening) {
      state.listening = false;
      $("btnMic").classList.remove("listening");
      $("btnMic").textContent = "🎙️ CEVAPLA";
      $("btnPass").disabled = false;
    }
  };

  rec.start();
}

function passWord() {
  if (state.listening) return;
  finishRound(false);
}

async function launchGame() {
  const ok = await ensureAuthAndCacheUser();
  if (!ok) {
    location.href = "/pages/login.html";
    return;
  }

  state.lang = state.selectedLang;
  localStorage.setItem(GAME_LANG_KEY, state.lang);

  $("launchGate").style.display = "none";

  state.pool = await loadPool(state.lang);
  await loadBest();

  if (!state.pool.length) {
    $("launchGate").style.display = "flex";
    toast("Bu dilin havuzu bulunamadı");
    return;
  }

  renderHud();
  renderHearts();
  startRound();
}

$("launchBtn").addEventListener("click", launchGame);
$("btnMic").addEventListener("click", startListening);
$("btnPass").addEventListener("click", passWord);

(function init(){
  renderLangPicker();
  renderHud();
  renderHearts();
})();
</script>
</body>
</html>
