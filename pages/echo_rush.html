<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Oyun kullanılamıyor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;800;900&family=Space+Grotesk:wght@800&display=swap');
:root{--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:Outfit,system-ui,sans-serif;background:#07101f;color:#f8fafc;overflow:hidden}body{background:radial-gradient(circle at 20% 0%,rgba(96,165,250,.18),transparent 36%),linear-gradient(180deg,#08111f,#030712)}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom))}.panel{width:min(100%,420px);border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(15,23,42,.82);box-shadow:0 24px 60px rgba(0,0,0,.38);padding:22px;text-align:center}.brand{font-size:11px;font-weight:1000;letter-spacing:.8px;color:#67e8f9;text-transform:uppercase}.title{margin:8px 0 10px;font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:900}.copy{margin:0 0 18px;color:rgba(226,232,240,.72);font-size:14px;line-height:1.5;font-weight:800}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:16px;background:linear-gradient(135deg,#dbeafe,#60a5fa);color:#061227;text-decoration:none;font-size:14px;font-weight:1000}
</style>
</head>
<body>
<main>
  <section class="panel" aria-label="Oyun kullanılamıyor">
    <div class="brand">italkyAI Premium</div>
    <h1 class="title">Bu oyun şu anda kullanılamıyor.</h1>
    <p class="copy">Oyun menüsünden aktif oyunlarla devam edebilirsiniz.</p>
    <a class="btn" href="/pages/game_menu.html">Oyun Menüsüne Dön</a>
  </section>
</main>
</body>
</html>
