<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Echo Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030712;--panel:rgba(15,23,42,.82);--line:rgba(255,255,255,.12);--txt:#f8fafc;--muted:rgba(226,232,240,.70);--cyan:#67e8f9;--pink:#f472b6;--green:#34d399;--red:#fb7185;--gold:#facc15;--safeB:env(safe-area-inset-bottom,0px);--shellLift:0px;--grad:linear-gradient(135deg,#67e8f9,#60a5fa 52%,#f472b6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;outline:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,system-ui,sans-serif;color:var(--txt)}body{background:radial-gradient(circle at 18% 0%,rgba(103,232,249,.16),transparent 34%),radial-gradient(circle at 86% 10%,rgba(244,114,182,.14),transparent 32%),linear-gradient(180deg,#07101f,#030712 58%,#01030a)}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;opacity:.22;pointer-events:none}
#pageContent{position:relative;z-index:2;height:100%;padding:8px 10px calc(12px + var(--safeB) + var(--shellLift));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#pageContent::-webkit-scrollbar{display:none}.app{width:100%;max-width:500px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(15,23,42,.82);backdrop-filter:blur(14px);box-shadow:0 18px 42px rgba(0,0,0,.32)}.backBtn{min-width:98px;height:36px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:11px;font-weight:1000;cursor:pointer}.title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;letter-spacing:-.25px;color:#fff}.langChip{min-width:60px;height:36px;border-radius:13px;background:var(--grad);color:#04111f;font-size:11px;font-weight:1000;display:flex;align-items:center;justify-content:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{min-height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}.statVal{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:900;line-height:1}.statLab{margin-top:3px;font-size:8px;font-weight:1000;letter-spacing:.65px;color:var(--muted)}.recordRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.recordPill{min-height:34px;border-radius:13px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;font-size:10px;font-weight:1000;overflow:hidden}.recordPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:20px;text-align:center;color:var(--cyan);font-size:12px;font-weight:900}.stage{flex:1;min-height:430px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.84));box-shadow:0 24px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.prompt{flex:1;min-height:230px;border-radius:23px;border:1px solid rgba(103,232,249,.18);background:radial-gradient(circle at 50% 0%,rgba(103,232,249,.12),transparent 42%),rgba(255,255,255,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.roundTag{font-size:11px;font-weight:1000;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}.word{margin:12px 0 8px;font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:900;line-height:1.05;letter-spacing:-1px;filter:drop-shadow(0 18px 45px rgba(0,0,0,.35))}.meaning{min-height:25px;font-size:16px;font-weight:800;color:rgba(226,232,240,.72)}.hint{margin-top:16px;min-height:20px;font-size:12px;font-weight:900;color:rgba(226,232,240,.62)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actionBtn{min-height:54px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:13px;font-weight:1000;cursor:pointer}.actionBtn.primary{background:var(--grad);color:#061227;border:0;box-shadow:0 14px 30px rgba(96,165,250,.22)}.actionBtn.listening{background:#fff;color:#020617;animation:pulse 1s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}.actionBtn:disabled{opacity:.42;cursor:default;animation:none}.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,23,.76);backdrop-filter:blur(14px)}.overlay.show{display:flex}.modal{width:min(100%,390px);border-radius:26px;border:1px solid rgba(147,197,253,.20);background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.98));box-shadow:0 28px 70px rgba(0,0,0,.55);padding:22px;text-align:center}.modalTitle{margin:0;font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:900}.modalText{margin:12px 0 16px;white-space:pre-line;line-height:1.55;color:rgba(226,232,240,.78);font-size:14px;font-weight:800}.modalActions{display:grid;gap:9px}.modalBtn{min-height:50px;border-radius:16px;border:0;font:inherit;font-size:14px;font-weight:1000;cursor:pointer}.modalBtn.primary{background:var(--grad);color:#061227}.modalBtn.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
@media(max-width:390px){.topbar{padding:9px 10px}.backBtn{min-width:86px;font-size:10px}.title{font-size:16px}.langChip{min-width:52px}.statVal{font-size:13px}.statLab{font-size:7.4px}.recordPill{font-size:9px}.stage{min-height:398px;padding:12px}.word{font-size:35px}.actions{gap:8px}.actionBtn{font-size:12px;min-height:50px}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<main class="app" id="pageContent">
  <header class="topbar">
    <button id="backBtn" class="backBtn" type="button">← Oyun Menüsü</button>
    <div class="title">ECHO RUSH</div>
    <div id="langChip" class="langChip">EN</div>
  </header>
  <section class="stats" aria-label="Skor bilgileri">
    <div class="stat"><div id="scoreVal" class="statVal">0</div><div class="statLab">SKOR</div></div>
    <div class="stat"><div id="roundVal" class="statVal">0/20</div><div class="statLab">TUR</div></div>
    <div class="stat"><div id="lifeVal" class="statVal">3</div><div class="statLab">CAN</div></div>
    <div class="stat"><div id="hitVal" class="statVal">0</div><div class="statLab">DOĞRU</div></div>
  </section>
  <section class="recordRow" aria-label="Rekor bilgileri">
    <div class="recordPill"><span id="personalBestLabel">SENİN REKORUN: —</span></div>
    <div class="recordPill"><span id="globalBestLabel">GENEL REKOR: —</span></div>
  </section>
  <div id="status" class="status">Hazırlanıyor</div>
  <section class="stage">
    <div class="prompt">
      <div id="roundTag" class="roundTag">Duy ve tekrar et</div>
      <div id="wordText" class="word">...</div>
      <div id="meaningText" class="meaning">...</div>
      <div id="hintText" class="hint">Kelimeyi dinle, sonra mikrofonla tekrar et.</div>
    </div>
    <div class="actions">
      <button id="listenBtn" class="actionBtn" type="button">Dinle</button>
      <button id="micBtn" class="actionBtn primary" type="button">🎙️ Tekrar Et</button>
    </div>
  </section>
</main>
<div id="resultOverlay" class="overlay" aria-hidden="true">
  <div class="modal">
    <h2 id="resultTitle" class="modalTitle">Oyun Bitti</h2>
    <div id="resultText" class="modalText"></div>
    <div class="modalActions">
      <button id="replayBtn" class="modalBtn primary" type="button">Yeniden Oyna</button>
      <button id="menuBtn" class="modalBtn secondary" type="button">Oyun Menüsü</button>
    </div>
  </div>
</div>
<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import { loadGameWords, GAME_CONTENT_SOURCE } from "/js/game_content_helper.js";
import { GAME_LANG_META, formatGlobalBest, getGameLangFromUrl, getGlobalBest, getLocalHighScore, refreshGameScoreLabels, saveGameScore, setLocalHighScore, speakGameText } from "/js/game_score_helper.js";

mountShell({ scroll:"none" });

const $ = id => document.getElementById(id);
const GAME_SLUG = "echo_rush";
const TOTAL_ROUNDS = 20;
const CONTENT_ERROR_TEXT = "İçerik şu anda yüklenemedi. Lütfen tekrar deneyin.";
let lang = getGameLangFromUrl("en");
let pool = [], runList = [], runIndex = 0, current = null;
let score = 0, lives = 3, correctCount = 0, wrongCount = 0, scoreSaved = false, startedAt = Date.now(), listening = false;
let audioCtx = null;

function getAudioCtx(){try{if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}return audioCtx;}catch{return null;}}
async function unlockAudio(){try{const ctx=getAudioCtx();if(ctx&&ctx.state==="suspended")await ctx.resume();}catch{}}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume().catch(()=>{});const now=ctx.currentTime+when;const osc=ctx.createOscillator();const g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
function playGood(){beep({freq:660,duration:.08,type:"triangle",gain:.05});beep({freq:900,duration:.10,type:"triangle",gain:.05,when:.08});}
function playBad(){beep({freq:210,duration:.12,type:"sawtooth",gain:.05});beep({freq:150,duration:.14,type:"sawtooth",gain:.04,when:.08});}
function playFinish(){beep({freq:520,duration:.10,type:"triangle",gain:.05});beep({freq:740,duration:.10,type:"triangle",gain:.05,when:.10});beep({freq:980,duration:.14,type:"triangle",gain:.05,when:.20});}
["click","touchstart","pointerdown"].forEach(evt=>window.addEventListener(evt,()=>unlockAudio(),{passive:true,once:true}));

function normalize(s){return String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();}
function editDistance(a,b){const s1=String(a),s2=String(b),costs=new Array(s2.length+1);for(let j=0;j<=s2.length;j++)costs[j]=j;for(let i=1;i<=s1.length;i++){let prev=i-1;costs[0]=i;for(let j=1;j<=s2.length;j++){const tmp=costs[j];costs[j]=Math.min(costs[j]+1,costs[j-1]+1,prev+(s1[i-1]===s2[j-1]?0:1));prev=tmp;}}return costs[s2.length];}
function similarityScore(a,b){const s1=normalize(a),s2=normalize(b);if(!s1&&!s2)return 100;if(!s1||!s2)return 0;if(s1===s2||s2.includes(s1))return 100;const longer=s1.length>=s2.length?s1:s2;const shorter=s1.length>=s2.length?s2:s1;const dist=editDistance(longer,shorter);return Math.max(0,Math.min(100,Math.round(((longer.length-dist)/longer.length)*100)));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickRunList(items){const seen=new Set();const fresh=shuffle(items).filter(item=>{const key=normalize(item.word);if(seen.has(key))return false;seen.add(key);return true;});return fresh.slice(0,TOTAL_ROUNDS);}
function setStatus(msg,color="var(--cyan)"){$("status").textContent=msg;$("status").style.color=color;}
function setBusy(busy){$("listenBtn").disabled=busy||!current;$("micBtn").disabled=busy||!current;}
function updateHud(){const meta=GAME_LANG_META[lang]||GAME_LANG_META.en;$("langChip").textContent=lang.toUpperCase();$("scoreVal").textContent=score;$("roundVal").textContent=`${Math.min(runIndex+1,TOTAL_ROUNDS)}/${TOTAL_ROUNDS}`;$("lifeVal").textContent=lives;$("hitVal").textContent=correctCount;$("roundTag").textContent=`${meta.flag} ${meta.name} • Duy ve tekrar et`;}
async function refreshScores(){const localBest=getLocalHighScore(GAME_SLUG,lang);$("personalBestLabel").textContent=`SENİN REKORUN: ${localBest||"—"}`;$("globalBestLabel").textContent="GENEL REKOR: —";try{return await refreshGameScoreLabels({gameSlug:GAME_SLUG,lang,personalEl:$("personalBestLabel"),globalEl:$("globalBestLabel")});}catch(error){console.warn("[ECHO_RUSH] score refresh failed",error);return null;}}
function updateLocalBest(){const best=getLocalHighScore(GAME_SLUG,lang);if(score>best){setLocalHighScore(GAME_SLUG,lang,score);$("personalBestLabel").textContent=`SENİN REKORUN: ${score}`;return true;}return false;}
async function saveScoreOnce(){if(scoreSaved)return;scoreSaved=true;updateLocalBest();const durationSeconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));try{await saveGameScore({gameSlug:GAME_SLUG,lang,score,correctCount,wrongCount,durationSeconds});}catch(error){console.warn("[ECHO_RUSH] score save failed",error);}try{const best=await getGlobalBest(GAME_SLUG,lang);$("globalBestLabel").textContent=formatGlobalBest(best);}catch{}}
function renderCurrent(){if(!current)return;$("wordText").textContent="••••";$("meaningText").textContent=current.meaning||"—";$("hintText").textContent="Kelimeyi dinle, sonra mikrofonla tekrar et.";updateHud();}
async function speakCurrent(){if(!current)return;setStatus("Dinletiliyor...");await unlockAudio();speakGameText(current.word,lang);setTimeout(()=>setStatus("Mikrofona basıp tekrar et"),650);}
function nextRound(){if(lives<=0||runIndex>=runList.length){finishGame();return;}current=runList[runIndex];renderCurrent();setBusy(false);setStatus("Kelimeyi dinle");setTimeout(()=>speakCurrent(),350);}
function showResult(title,text){$("resultTitle").textContent=title;$("resultText").textContent=text;$("resultOverlay").classList.add("show");$("resultOverlay").setAttribute("aria-hidden","false");}
function hideResult(){$("resultOverlay").classList.remove("show");$("resultOverlay").setAttribute("aria-hidden","true");}
async function finishGame(){setBusy(true);playFinish();const newBest=updateLocalBest();await saveScoreOnce();await refreshScores();const globalText=$("globalBestLabel").textContent||"GENEL REKOR: —";showResult(newBest?"Yeni Rekor!":"Oyun Bitti",`Skor: ${score}\nDoğru: ${correctCount}\nYanlış: ${wrongCount}\n${$("personalBestLabel").textContent}\n${globalText}`);}
function applySpeechResult(spoken){const similarity=similarityScore(current?.word||"",spoken);const success=similarity>=82;setBusy(true);if(success){correctCount++;const points=similarity>=96?120:90;score+=points;playGood();setStatus(`Doğru • %${similarity}`,"var(--green)");}else{wrongCount++;lives=Math.max(0,lives-1);playBad();setStatus(`Tekrar dene • %${similarity}`,"var(--red)");}runIndex++;updateHud();setTimeout(()=>nextRound(),1150);}
function startListening(){if(!current||listening)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus("Bu cihazda konuşma algılama hazır değil.","var(--gold)");return;}try{window.speechSynthesis?.cancel?.();}catch{}listening=true;setBusy(true);$("micBtn").classList.add("listening");$("micBtn").textContent="👂 Dinliyor";setStatus("Dinliyor...");const rec=new SR();rec.lang=(GAME_LANG_META[lang]||GAME_LANG_META.en).bcp||"en-US";rec.interimResults=false;rec.maxAlternatives=1;const cleanup=()=>{listening=false;$("micBtn").classList.remove("listening");$("micBtn").textContent="🎙️ Tekrar Et";setBusy(false);};const watchdog=setTimeout(()=>{try{rec.stop();}catch{}},7500);rec.onresult=e=>{clearTimeout(watchdog);cleanup();const spoken=e.results?.[0]?.[0]?.transcript||"";console.warn("[ECHO_RUSH] speech result",{target:current?.word,spoken,lang});applySpeechResult(spoken);};rec.onerror=()=>{clearTimeout(watchdog);cleanup();wrongCount++;lives=Math.max(0,lives-1);playBad();setStatus("Dinleme tamamlanamadı. Lütfen tekrar deneyin.","var(--gold)");runIndex++;updateHud();setTimeout(()=>nextRound(),1200);};rec.onend=()=>{clearTimeout(watchdog);if(listening)cleanup();};rec.start();}catch(error){listening=false;setBusy(false);console.warn("[ECHO_RUSH] speech start failed",error);setStatus("Mikrofonu kullanmak için izin vermeniz gerekiyor.","var(--gold)");}}
async function initGame(){setStatus("Hazırlanıyor");hideResult();$("wordText").textContent="...";$("meaningText").textContent="...";setBusy(true);const ok=await ensureAuthAndCacheUser();if(!ok){location.href="/pages/login.html";return;}score=0;lives=3;correctCount=0;wrongCount=0;runIndex=0;scoreSaved=false;startedAt=Date.now();current=null;updateHud();refreshScores();console.warn("[ECHO_RUSH] using shared content helper",{selectedLang:lang,source:GAME_CONTENT_SOURCE});pool=await loadGameWords(lang,{caller:"echo_rush"});if(!pool.length){setStatus(CONTENT_ERROR_TEXT,"var(--gold)");console.warn("[ECHO_RUSH] no usable content",{lang,source:GAME_CONTENT_SOURCE});return;}runList=pickRunList(pool);if(!runList.length){setStatus(CONTENT_ERROR_TEXT,"var(--gold)");console.warn("[ECHO_RUSH] empty run list",{lang,poolCount:pool.length});return;}console.warn("[ECHO_RUSH] game started",{lang,poolCount:pool.length,rounds:runList.length,ads:false});nextRound();}

$("backBtn").onclick=()=>{location.href="/pages/game_menu.html";};
$("listenBtn").onclick=()=>speakCurrent();
$("micBtn").onclick=()=>startListening();
$("replayBtn").onclick=()=>initGame();
$("menuBtn").onclick=()=>{location.href="/pages/game_menu.html";};
window.addEventListener("load",()=>{initGame().catch(error=>{console.warn("[ECHO_RUSH] init failed",error);setStatus(CONTENT_ERROR_TEXT,"var(--gold)");});console.warn("[ECHO_RUSH] ready",{lang,ads:false,content:"shared-game-content-helper"});});
</script>
</body>
</html>
