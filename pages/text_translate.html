<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Translate</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue: #60a5fa;
  --bordo: #2d0a0a;
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

/* ✅ Kural Seti Uygulandı */
#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 20%, #0a0a20 0%, #000 100%);
}

.main-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 10px;
  gap: 0; /* Bar araya gireceği için gap'i sıfırladım */
  min-height: 0;
}

/* ===== DİL SEÇİCİ ===== */
.lang-hub {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 8px 16px;
  backdrop-filter: blur(20px);
  margin-bottom: 8px;
}

.select-box {
  background: transparent; border: none; color: #fff;
  font-family: 'Space Grotesk'; font-size: 13px; font-weight: 700;
  cursor: pointer; appearance: none; max-width: 120px;
}

.swap-trigger {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px;
}

/* ===== QUANTUM GATE ===== */
.quantum-gate {
  flex: 1;
  display: flex; flex-direction: column;
  min-height: 0;
}

.gate-panel {
  flex: 1;
  position: relative;
  border-radius: 24px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.02);
  display: flex; flex-direction: column;
  padding: 16px;
  min-height: 0;
}

/* Giriş Paneli Alt Köşeleri Düz (Barla birleşsin) */
.panel-in { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }

/* Çıkış Paneli Üst Köşeleri Düz ve Bordo */
.panel-out { 
  border-top-left-radius: 0; border-top-right-radius: 0; border-top: none;
  background: linear-gradient(180deg, var(--bordo) 0%, #000 100%);
  border-color: rgba(236, 72, 153, 0.2);
}

textarea {
  flex: 1; background: transparent; border: none;
  color: #fff; font-size: 17px; font-weight: 300;
  line-height: 1.5; resize: none; width: 100%;
}

.output-area {
  flex: 1; color: #fbcfe8; font-size: 17px;
  font-weight: 600; line-height: 1.5; overflow-y: auto;
  white-space: pre-wrap;
}

/* ===== MERKEZİ İŞLEM BARI (BOYDAN BOYA) ===== */
.command-bar {
  height: 54px;
  background: rgba(255,255,255,0.05);
  border-left: 1px solid var(--glass-border);
  border-right: 1px solid var(--glass-border);
  display: flex; align-items: stretch;
  position: relative;
  z-index: 20;
}
/* Barın ortasından geçen neon çizgi */
.command-bar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%;
  height: 1px; background: var(--ai-grad); opacity: 0.3;
}

.bar-btn {
  flex: 1; border: none; background: transparent;
  color: #fff; font-weight: 900; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; cursor: pointer; transition: 0.2s;
  position: relative; z-index: 2;
}

.bar-btn:active { background: rgba(255,255,255,0.1); }

.divider { width: 1px; background: var(--glass-border); margin: 10px 0; }

.btn-translate-active {
  background: var(--ai-grad);
  color: #fff;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
}

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="lang-hub">
      <select class="select-box" id="fromSel"></select>
      <button class="swap-trigger" id="btnSwap">⇄</button>
      <select class="select-box" id="toSel"></select>
    </section>

    <section class="quantum-gate">
      <div class="gate-panel panel-in">
        <textarea id="srcTxt" placeholder="Metin yazın veya yapıştırın..."></textarea>
      </div>
      
      <div class="command-bar">
        <label class="bar-btn">
          <input type="file" id="imgFile" accept="image/*" capture="environment" style="display:none">
          <span>📷 FOTOĞRAF TARAT</span>
        </label>
        
        <div class="divider"></div>
        
        <button class="bar-btn btn-translate-active" id="btnTranslate">
          ⚡ ÇEVİR
        </button>
      </div>

      <div class="gate-panel panel-out">
        <div class="output-area" id="dstTxt">Çeviri sonucu burada belirecek...</div>
      </div>
    </section>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const API_BASE = "https://italky-api.onrender.com";
  const $ = (id)=>document.getElementById(id);

  // ✅ Çok daha fazla dil (60+)
  const LANG_POOL = [
    {code:"auto", name:"OTOMATİK"}, {code:"tr", name:"TÜRKÇE"}, {code:"en", name:"İNGİLİZCE"},
    {code:"de", name:"ALMANCA"}, {code:"fr", name:"FRANSIZCA"}, {code:"it", name:"İTALYANCA"},
    {code:"es", name:"İSPANYOLCA"}, {code:"ru", name:"RUSÇA"}, {code:"ar", name:"ARAPÇA"},
    {code:"zh", name:"ÇİNCE"}, {code:"ja", name:"JAPONCA"}, {code:"ko", name:"KORECE"},
    {code:"pt", name:"PORTEKİZCE"}, {code:"nl", name:"HOLLANDACA"}, {code:"pl", name:"LEHÇE"},
    {code:"sv", name:"İSVEÇÇE"}, {code:"da", name:"DANİMARKACA"}, {code:"fi", name:"FİNCE"},
    {code:"no", name:"NORVEÇÇE"}, {code:"cs", name:"ÇEKÇE"}, {code:"el", name:"YUNANCA"},
    {code:"he", name:"İBRANİCE"}, {code:"hi", name:"HİNTÇE"}, {code:"id", name:"ENDONEZYACA"},
    {code:"uk", name:"UKRAYNACA"}, {code:"fa", name:"FARSÇA"}, {code:"az", name:"AZERBAYCANCA"}
  ];

  const fromSel = $("fromSel");
  const toSel = $("toSel");
  
  const fill = (sel, list) => sel.innerHTML = list.map(l=>`<option value="${l.code}">${l.name}</option>`).join("");
  fill(fromSel, LANG_POOL);
  fill(toSel, LANG_POOL.filter(x=>x.code!=="auto"));
  
  fromSel.value = "auto";
  toSel.value = "tr";

  $("btnTranslate").onclick = async () => {
    const text = $("srcTxt").value.trim();
    if(!text) return;
    $("dstTxt").style.opacity = "0.4";
    $("dstTxt").textContent = "Kuantum çeviri yapılıyor...";
    try {
      const r = await fetch(`${API_BASE}/api/translate_ai`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, from_lang: fromSel.value, to_lang: toSel.value })
      });
      const j = await r.json();
      $("dstTxt").textContent = j.translated || "Bir hata oluştu.";
    } catch(e) {
      $("dstTxt").textContent = "API Bağlantı hatası.";
    } finally {
      $("dstTxt").style.opacity = "1";
    }
  };

  $("imgFile").onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    $("srcTxt").value = "Görüntü analiz ediliyor...";
    const fd = new FormData();
    fd.append("image", file);
    fd.append("from_lang", fromSel.value);
    fd.append("to_lang", toSel.value);
    try {
      const r = await fetch(`${API_BASE}/api/translate/ocr_translate`, { method: "POST", body: fd });
      const j = await r.json();
      if(j.ok) {
        $("srcTxt").value = j.extracted_text;
        $("dstTxt").textContent = j.translated_text;
      }
    } catch(e) {
      $("srcTxt").value = "OCR başarısız.";
    }
  };

  $("btnSwap").onclick = () => {
    const a = fromSel.value;
    const b = toSel.value;
    if(a !== "auto") { fromSel.value = b; toSel.value = a; }
  };
</script>
</body>
</html>
