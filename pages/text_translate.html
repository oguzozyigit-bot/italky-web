<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Translate</title>

<meta name="theme-color" content="#0a0a12">
<style>
  html,body{
    background:#000 !important;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Outfit', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap');
</style>

<style>
:root{
  --bg:#070711;
  --bg-2:#0b0b18;
  --card:rgba(255,255,255,0.04);
  --card-2:rgba(255,255,255,0.06);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --soft:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.12);

  --ai-grad:linear-gradient(135deg,#a5b4fc 0%,#818cf8 35%,#f9a8d4 100%);
  --out-grad:linear-gradient(180deg,rgba(65,15,40,.92) 0%, rgba(10,8,18,.98) 100%);

  --pastel-btn:linear-gradient(135deg,#c4b5fd 0%, #a5b4fc 45%, #fbcfe8 100%);
  --pastel-shadow:0 12px 28px rgba(165,180,252,.26);

  --retro-pink:#ff7abf;
  --retro-cyan:#7dd3fc;
  --retro-violet:#a78bfa;
  --retro-line:rgba(255,255,255,0.14);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

html,body{
  width:100%;
  height:100%;
  color:var(--text);
}

body{
  background:
    radial-gradient(circle at 15% 10%, rgba(125,211,252,.10) 0%, transparent 20%),
    radial-gradient(circle at 85% 16%, rgba(255,122,191,.11) 0%, transparent 22%),
    radial-gradient(circle at 50% 0%, rgba(167,139,250,.16) 0%, transparent 34%),
    linear-gradient(180deg,#090912 0%, #000 100%);
}

button, input, textarea{
  font-family:inherit;
}

#pageContent{
  height:100%;
  display:flex;
  flex-direction:column;
  background:transparent;
}

.main-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
  min-height:0;
}

.lang-hub{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--glass-border);
  border-radius:18px;
  padding:8px;
  backdrop-filter:blur(20px);
  margin-bottom:8px;
  box-shadow:0 14px 28px rgba(0,0,0,.18);
}

.lang-pill{
  flex:1;
  min-width:0;
  border:none;
  background:rgba(255,255,255,0.04);
  color:#fff;
  border-radius:14px;
  min-height:48px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.06);
  transition:.2s ease;
}
.lang-pill:active{
  transform:scale(.985);
}
.lang-pill-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.lang-flag{
  font-size:18px;
  width:24px;
  text-align:center;
  flex:0 0 24px;
}
.lang-name{
  font-family:'Space Grotesk', sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.lang-caret{
  color:rgba(255,255,255,.62);
  font-size:14px;
  flex:0 0 auto;
}

.swap-trigger{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--glass-border);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  flex:0 0 auto;
  transition:.2s ease;
}
.swap-trigger:active{
  transform:rotate(180deg) scale(.95);
}

.quantum-gate{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.gate-panel{
  flex:1;
  position:relative;
  border-radius:28px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.025);
  display:flex;
  flex-direction:column;
  padding:18px;
  min-height:0;
  box-shadow:0 18px 36px rgba(0,0,0,.18);
  backdrop-filter:blur(18px);
}

.panel-in{
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
  border-bottom:none;
}

.panel-out{
  border-top-left-radius:0;
  border-top-right-radius:0;
  border-top:none;
  background:var(--out-grad);
  border-color:rgba(251,207,232,.16);
}

.panel-action{
  position:absolute;
  top:12px;
  right:12px;
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--glass-border);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:30;
  font-size:18px;
  transition:all .2s;
}
.panel-action:active{
  transform:scale(.92);
  background:rgba(255,255,255,0.10);
}

textarea{
  flex:1;
  background:transparent;
  border:none;
  color:#fff;
  font-size:17px;
  font-weight:400;
  line-height:1.55;
  resize:none;
  width:100%;
  padding-right:46px;
  caret-color:#c4b5fd;
}
textarea::placeholder{
  color:rgba(255,255,255,.34);
}

.output-area{
  flex:1;
  color:#fce7f3;
  font-size:17px;
  font-weight:600;
  line-height:1.55;
  overflow-y:auto;
  white-space:pre-wrap;
  padding-right:46px;
}

.command-bar{
  min-height:64px;
  background:rgba(18,18,30,.48);
  border-left:1px solid var(--glass-border);
  border-right:1px solid var(--glass-border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:10px;
  position:relative;
  z-index:20;
}

.btn-translate{
  width:100%;
  min-height:46px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.24);
  background:var(--pastel-btn);
  color:#241630;
  font-weight:900;
  font-size:14px;
  letter-spacing:.3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:var(--pastel-shadow), inset 0 1px 0 rgba(255,255,255,.50);
  cursor:pointer;
  transition:all .2s ease;
}
.btn-translate:active{
  transform:translateY(2px) scale(.985);
}
.btn-translate:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none;
}

.btn-offline{
  width:100%;
  min-height:44px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-weight:800;
  font-size:13px;
  letter-spacing:.2px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:all .2s ease;
}
.btn-offline:active{
  transform:translateY(2px) scale(.985);
}
.btn-offline:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.68);
  padding:14px;
}
.modal.show{
  display:flex;
}

.modal-card{
  width:min(100%,700px);
  max-height:min(88vh,900px);
  overflow:hidden;
  border-radius:28px;
  border:1px solid var(--retro-line);
  background:
    radial-gradient(circle at 15% 0%, rgba(125,211,252,.10) 0%, transparent 30%),
    radial-gradient(circle at 85% 10%, rgba(255,122,191,.12) 0%, transparent 30%),
    linear-gradient(180deg,#151323 0%, #090913 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03),
    0 30px 70px rgba(0,0,0,.55),
    0 0 30px rgba(167,139,250,.10);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  position:relative;
}

.modal-gridline{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:24px 24px;
  mask-image:linear-gradient(180deg, rgba(255,255,255,.55), transparent 70%);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 16px 12px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(9,9,19,.86);
  backdrop-filter:blur(14px);
}

.modal-title-wrap{
  min-width:0;
}
.modal-kicker{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.8px;
  color:var(--retro-cyan);
  margin-bottom:6px;
}
.modal-title{
  margin:0;
  font-family:'Space Grotesk', sans-serif;
  font-size:22px;
  letter-spacing:-.6px;
}
.modal-title .accent{
  background:linear-gradient(135deg,#7dd3fc,#a78bfa,#ff7abf);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.modal-sub{
  margin:6px 0 0;
  font-size:12px;
  line-height:1.45;
  color:var(--muted);
}

.modal-close{
  flex:0 0 auto;
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.modal-search{
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.search-shell{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:48px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  padding:0 14px;
}
.search-shell span{
  color:rgba(255,255,255,.56);
  font-size:16px;
}
.search-shell input{
  flex:1;
  min-width:0;
  background:transparent;
  border:none;
  color:#fff;
  font-size:14px;
}
.search-shell input::placeholder{
  color:rgba(255,255,255,.34);
}

.lang-list{
  overflow:auto;
  padding:12px 12px 16px;
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.lang-option{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  border-radius:18px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  transition:all .18s ease;
}
.lang-option:active{
  transform:scale(.986);
}
.lang-option.active{
  border-color:rgba(167,139,250,.40);
  background:linear-gradient(135deg, rgba(125,211,252,.10), rgba(255,122,191,.08));
  box-shadow:0 0 0 1px rgba(167,139,250,.12);
}
.lang-option-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.lang-option-flag{
  width:30px;
  height:30px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.06);
  font-size:18px;
  flex:0 0 30px;
}
.lang-option-text{
  min-width:0;
}
.lang-option-name{
  font-size:14px;
  font-weight:800;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.lang-option-code{
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.50);
  margin-top:3px;
  text-transform:uppercase;
}
.lang-option-check{
  color:#c4b5fd;
  font-size:18px;
  font-weight:900;
  opacity:0;
}
.lang-option.active .lang-option-check{
  opacity:1;
}

.empty-state{
  padding:22px 14px;
  text-align:center;
  color:rgba(255,255,255,.52);
  font-size:13px;
}

.toast{
  position:fixed;
  left:50%;
  top:18px;
  transform:translateX(-50%) translateY(-120px);
  background:rgba(10,10,18,.94);
  border:1px solid rgba(196,181,253,.34);
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  z-index:10000;
  transition:.25s;
  pointer-events:none;
  backdrop-filter:blur(14px);
  max-width:min(92vw,520px);
  text-align:center;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
}

@media (min-width:720px){
  .main-wrap{
    padding:14px;
  }
  .lang-list{
    grid-template-columns:1fr 1fr;
  }
  .modal{
    align-items:center;
  }
}

@media (max-width:390px){
  .lang-name{ font-size:11px; }
  textarea, .output-area{ font-size:16px; }
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="lang-hub">
      <button class="lang-pill" id="fromBtn" type="button" aria-label="Kaynak dili seç">
        <div class="lang-pill-left">
          <span class="lang-flag" id="fromFlag">🇹🇷</span>
          <span class="lang-name" id="fromName">Türkçe</span>
        </div>
        <span class="lang-caret">▾</span>
      </button>

      <button class="swap-trigger" id="btnSwap" type="button" aria-label="Dilleri değiştir">⇄</button>

      <button class="lang-pill" id="toBtn" type="button" aria-label="Hedef dili seç">
        <div class="lang-pill-left">
          <span class="lang-flag" id="toFlag">🇬🇧</span>
          <span class="lang-name" id="toName">İngilizce</span>
        </div>
        <span class="lang-caret">▾</span>
      </button>
    </section>

    <section class="quantum-gate">
      <div class="gate-panel panel-in">
        <textarea id="srcTxt" placeholder="Metin girin..."></textarea>
      </div>

      <div class="command-bar">
        <button class="btn-translate" id="btnTranslate" type="button">
          ✨ ÇEVİR
        </button>

        <button class="btn-offline" id="btnOfflineModel" type="button">
          📦 Offline Model İndir
        </button>
      </div>

      <div class="gate-panel panel-out">
        <button class="panel-action" id="btnSpeak" type="button" title="Dinle">🔊</button>
        <div class="output-area" id="dstTxt">...</div>
      </div>
    </section>

  </div>
</main>

<div class="modal" id="langModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-gridline"></div>

    <div class="modal-head">
      <div class="modal-title-wrap">
        <div class="modal-kicker">RETRO MODERN • 90s POPUP</div>
        <h2 class="modal-title"><span class="accent" id="modalModeTitle">Dil</span> Seç</h2>
        <p class="modal-sub">Bayraklı tam dil listesi burada. Arayıp dokun, seç ve devam et.</p>
      </div>
      <button class="modal-close" id="modalClose" type="button" aria-label="Kapat">✕</button>
    </div>

    <div class="modal-search">
      <div class="search-shell">
        <span>⌕</span>
        <input id="langSearch" type="text" placeholder="Dil ara..." autocomplete="off" />
      </div>
    </div>

    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/js/test_loader.js"></script>
</script>
</body>
</html>
