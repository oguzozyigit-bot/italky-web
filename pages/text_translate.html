<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Translate</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue: #60a5fa;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 40px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 85px);
  background: radial-gradient(circle at 50% 20%, #0a0a20 0%, #000 100%);
}

.main-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 14px;
  gap: 12px;
}

/* ===== 1. DİL SEÇİCİ (FLOAT PANEL) ===== */
.lang-hub {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 8px 16px;
  backdrop-filter: blur(20px);
}

.select-box {
  background: transparent; border: none; color: #fff;
  font-family: 'Space Grotesk'; font-size: 14px; font-weight: 700;
  cursor: pointer; appearance: none; text-align: center;
}

.swap-trigger {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  color: #fff; display: flex; align-items: center; justify-content: center;
  transition: 0.3s;
}
.swap-trigger:active { transform: rotate(180deg) scale(0.9); }

/* ===== 2. QUANTUM GATE (GİRİŞ & ÇIKIŞ) ===== */
.quantum-gate {
  flex: 1;
  display: flex; flex-direction: column;
  gap: 4px;
}

.gate-panel {
  flex: 1;
  position: relative;
  border-radius: 30px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.02);
  display: flex; flex-direction: column;
  padding: 20px;
  overflow: hidden;
}

textarea {
  flex: 1; background: transparent; border: none;
  color: #fff; font-size: 18px; font-weight: 300;
  line-height: 1.5; resize: none; width: 100%;
}

.output-area {
  flex: 1; color: #a5b4fc; font-size: 18px;
  font-weight: 600; line-height: 1.5; overflow-y: auto;
  white-space: pre-wrap;
}

/* Veri Akışı Çizgisi */
.gate-divider {
  height: 2px; width: 100%;
  background: var(--ai-grad);
  position: relative;
  box-shadow: 0 0 15px #6366f1;
}
.gate-divider::after {
  content: "⚡"; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); font-size: 10px;
}

/* ===== 3. ACTION BAR (FOTO & ÇEVİR) ===== */
.action-bar {
  display: flex; gap: 10px; align-items: center;
}

.btn-scan {
  flex: 1; height: 60px; border-radius: 20px;
  border: 1px dashed var(--blue);
  background: rgba(96, 165, 250, 0.05);
  color: var(--blue); display: flex; align-items: center;
  justify-content: center; gap: 10px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
}

.btn-main {
  width: 80px; height: 60px; border-radius: 20px;
  background: #fff; color: #000; border: none;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; cursor: pointer;
}

/* Scan Line Animation */
.scan-line {
  position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: var(--blue); box-shadow: 0 0 15px var(--blue);
  animation: scanning 3s linear infinite; opacity: 0.5;
}
@keyframes scanning { 0% { top: 0; } 100% { top: 100%; } }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="lang-hub">
      <select class="select-box" id="fromSel"></select>
      <button class="swap-trigger" id="btnSwap">⇄</button>
      <select class="select-box" id="toSel"></select>
    </section>

    <section class="quantum-gate">
      <div class="gate-panel">
        <textarea id="srcTxt" placeholder="Buraya yazın veya taratın..."></textarea>
      </div>
      
      <div class="gate-divider"></div>

      <div class="gate-panel" style="background: rgba(99, 102, 241, 0.03);">
        <div class="output-area" id="dstTxt">Çeviri burada görünecek...</div>
      </div>
    </section>

    <section class="action-bar">
      <label class="btn-scan">
        <div class="scan-line"></div>
        <input type="file" id="imgFile" accept="image/*" capture="environment" style="display:none">
        <span>📷 FOTOĞRAF TARAT</span>
      </label>
      
      <button class="btn-main" id="btnTranslate">
        GO
      </button>
    </section>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const API_BASE = "https://italky-api.onrender.com";
  const $ = (id)=>document.getElementById(id);

  const LANGS = [
    { code:"auto", name:"OTOMATİK" },
    { code:"tr", name:"TÜRKÇE" }, { code:"en", name:"ENGLISH" },
    { code:"de", name:"DEUTSCH" }, { code:"fr", name:"FRANÇAIS" },
    { code:"it", name:"ITALIANO" }, { code:"es", name:"ESPAÑOL" }
  ];

  const fromSel = $("fromSel");
  const toSel = $("toSel");
  
  fromSel.innerHTML = LANGS.map(l=>`<option value="${l.code}">${l.name}</option>`).join("");
  toSel.innerHTML = LANGS.filter(l=>l.code!=="auto").map(l=>`<option value="${l.code}">${l.name}</option>`).join("");
  
  fromSel.value = "auto";
  toSel.value = "tr";

  // Çeviri İşlemi
  $("btnTranslate").onclick = async () => {
    const text = $("srcTxt").value.trim();
    if(!text) return;

    $("dstTxt").style.opacity = "0.5";
    $("dstTxt").textContent = "İşleniyor...";

    try {
      const r = await fetch(`${API_BASE}/api/translate_ai`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: text,
          from_lang: fromSel.value,
          to_lang: toSel.value
        })
      });
      const j = await r.json();
      $("dstTxt").textContent = j.translated || "Hata oluştu.";
    } catch(e) {
      $("dstTxt").textContent = "Bağlantı hatası.";
    } finally {
      $("dstTxt").style.opacity = "1";
    }
  };

  // Fotoğraf Tarama
  $("imgFile").onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;

    $("srcTxt").value = "Fotoğraf işleniyor...";
    
    const fd = new FormData();
    fd.append("image", file);
    fd.append("from_lang", fromSel.value);
    fd.append("to_lang", toSel.value);

    try {
      const r = await fetch(`${API_BASE}/api/translate/ocr_translate`, {
        method: "POST",
        body: fd
      });
      const j = await r.json();
      if(j.ok) {
        $("srcTxt").value = j.extracted_text;
        $("dstTxt").textContent = j.translated_text;
      }
    } catch(e) {
      $("srcTxt").value = "Tarama hatası.";
    }
  };

  $("btnSwap").onclick = () => {
    const a = fromSel.value;
    const b = toSel.value;
    if(a !== "auto") {
      fromSel.value = b;
      toSel.value = a;
    }
  };
</script>
</body>
</html>
