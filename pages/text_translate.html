<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Yazıdan Çeviri</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#67e8f9,#3b82f6,#60a5fa);
      --gold-gradient: linear-gradient(135deg,#dbeafe,#93c5fd,#fde68a);
      --bg:#04101b;
      --border:rgba(255,255,255,0.14);
      --panel-bg:rgba(8,14,24,.96);
      --panel-line:rgba(255,255,255,.08);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --safe-top:env(safe-area-inset-top, 0px);
      --text:#f8fafc;
      --muted:rgba(255,255,255,.64);
      --ok:#22c55e;
      --danger:#ef4444;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;overflow:hidden;}
    body{min-height:100dvh;background:radial-gradient(circle at top, rgba(103,232,249,.08), transparent 24%),radial-gradient(circle at bottom, rgba(250,204,21,.05), transparent 20%),#04101b;}
    [data-italky-footer],
    .italky-global-footer,
    .prestige-signature,
    .drawer-footer-seal,
    .signature,
    .menu-sign,
    #italkyFooter,
    .premium-footer,
    .footer-seal,
    .seal{
      display:none!important;
      visibility:hidden!important;
      pointer-events:none!important;
    }

    .container{display:flex;flex-direction:column;width:100%;height:100dvh;overflow:hidden;}
    .topbar{flex:0 0 auto;padding:calc(8px + var(--safe-top)) 10px 8px;background:linear-gradient(180deg, rgba(4,16,27,.98), rgba(4,16,27,.82));border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px);z-index:700;}
    .topbar-inner{width:min(96vw,560px);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;}
    .lang-pill{min-height:44px;border:none;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:12px;font-weight:900;letter-spacing:.2px;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;min-width:0;}
    .lang-left{display:flex;align-items:center;gap:8px;min-width:0;}.lang-flag{font-size:18px;width:22px;text-align:center;flex:0 0 22px;}.lang-text{min-width:0;overflow:hidden;text-overflow:ellipsis;}.lang-caret{opacity:.7;font-size:13px;flex:0 0 auto;}
    .swap-btn{width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;justify-self:center;align-self:center;flex:0 0 auto;}.swap-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .tool-toggle{min-height:38px;padding:0 12px;border:none;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;}.tool-toggle .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.26);transition:.2s ease;flex:0 0 10px;}.tool-toggle.active .dot{background:var(--ok);box-shadow:0 0 12px rgba(34,197,94,.65);}.tool-toggle.inactive .dot{background:var(--danger);box-shadow:0 0 12px rgba(239,68,68,.45);}
    .text-trash-btn{justify-self:end;width:42px;height:42px;border:none;background:transparent;color:#dbeafe;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;filter:drop-shadow(0 0 8px rgba(96,165,250,.20));}
    .text-trash-btn svg{width:26px;height:26px;stroke:url(#trashStrokeGradient);stroke-width:2.15;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .text-trash-btn:active{transform:scale(.94);}

    .screen{flex:1;width:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;}.half-screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}.half-screen.top{background:linear-gradient(180deg, rgba(14,116,144,.22), rgba(4,16,27,.98));border-bottom:1px solid rgba(255,255,255,.05);}.half-screen.bottom{background:linear-gradient(180deg, rgba(30,64,175,.16), rgba(4,16,27,.98));}
    .panel-head{width:100%;padding:10px 10px 4px;min-height:46px;flex:0 0 auto;}.panel-head-grid{width:min(96vw,560px);margin:0 auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;}.panel-head-grid.text-tools{grid-template-columns:1fr 1fr;justify-items:stretch;}.panel-head-grid.simple{display:none;}.panel-label{display:none!important;}.panel-sound{justify-self:start;}
    .content-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;scrollbar-width:none;mask-image:linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);}.content-scroll::-webkit-scrollbar{display:none;}
    .bubble{text-align:center;max-width:92%;line-height:1.28;word-break:break-word;}.bubble.latest{font-size:30px;font-weight:900;line-height:1.08;}.bubble.normal{font-size:18px;font-weight:700;opacity:.88;}.bubble-sub{margin-top:8px;font-size:13px;line-height:1.4;font-weight:900;color:rgba(255,255,255,.62);text-align:center;}
    .center-hub{height:72px;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);z-index:600;flex:0 0 auto;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);padding:0 10px;}
    .nav-btn{position:fixed!important;top:50%;width:30px;height:118px;padding:0;background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(59,130,246,.18),rgba(96,165,250,.18));border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:1000;cursor:pointer;z-index:1800;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:transform .2s ease;transform:translateY(-50%);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;line-height:1.15;}
    #homeLink{right:0;left:auto!important;border-radius:18px 0 0 18px;border-right:none;box-shadow:-10px 0 32px rgba(0,0,0,.30);}
    #backLink{left:0;right:auto!important;border-radius:0 18px 18px 0;border-left:none;box-shadow:10px 0 32px rgba(0,0,0,.30);}
    .nav-btn:active{transform:translateY(-50%) scale(.96);}
    .nav-btn .label-rotate{display:inline-block;transform:none!important;}
    .orb-container{width:58px;height:58px;display:flex;align-items:center;justify-content:center;position:relative;}.energy-orbit{position:absolute;width:58px;height:58px;border-radius:50%;animation:rotateOrbit 5s linear infinite;}.ball-1,.ball-2{position:absolute;width:7px;height:7px;border-radius:50%;filter:blur(1.2px);transition:background .25s ease, box-shadow .25s ease;}.ball-1{top:-4px;left:50%;transform:translateX(-50%);background:#3b82f6;box-shadow:0 0 15px #3b82f6;}.ball-2{bottom:-4px;left:50%;transform:translateX(-50%);background:#facc15;box-shadow:0 0 15px #facc15;}.ai-core{width:48px;height:48px;border-radius:50%;background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;position:relative;overflow:hidden;}.logo-text{color:#fff;letter-spacing:.4px;font-size:10px;}.logo-ai{background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .eq-wrap{display:flex;align-items:center;gap:3px;height:20px;position:absolute;opacity:0;transition:.25s;z-index:20;}#frameRoot.is-translating .eq-wrap{opacity:1;}#frameRoot.is-translating .logo-text{opacity:0;}.eq-bar{width:3px;background:var(--gold-gradient);border-radius:10px;animation:eqAnim .7s infinite ease-in-out;}
    #frameRoot.is-idle .ball-1,#frameRoot.is-idle .ball-2,#frameRoot.is-error .ball-1,#frameRoot.is-error .ball-2{background:#ef4444;box-shadow:0 0 18px rgba(239,68,68,.9);}#frameRoot.is-translating .ball-1{background:#3b82f6;box-shadow:0 0 18px rgba(59,130,246,.95);}#frameRoot.is-translating .ball-2{background:#facc15;box-shadow:0 0 18px rgba(250,204,21,.95);}#frameRoot.is-ready .ball-1,#frameRoot.is-ready .ball-2{background:#22c55e;box-shadow:0 0 18px rgba(34,197,94,.9);}
    .composer-wrap{flex:0 0 auto;padding:8px 8px calc(16px + var(--safe-bottom));}.composer{width:100%;display:flex;align-items:center;gap:10px;min-height:62px;padding:9px 12px;border-radius:22px;background:var(--panel-bg);border:1px solid var(--panel-line);box-shadow:0 10px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.03);position:relative;}.composer-center{flex:1;min-width:0;display:flex;flex-direction:column;}.composer-input{width:100%;min-height:24px;max-height:140px;resize:none;border:none;outline:none;background:transparent;color:#fff;font-size:17px;font-weight:800;line-height:1.4;font-family:inherit;overflow:auto;padding:0;margin:0;scrollbar-width:none;text-align:left;pointer-events:auto;}.composer-input::-webkit-scrollbar{display:none;}.composer-input::placeholder{color:rgba(255,255,255,.72);font-weight:800;}.composer-btn{width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;pointer-events:auto;position:relative;}.composer-btn.primary{background:#fff;color:#000;box-shadow:0 0 24px rgba(255,255,255,.10);}.composer-btn.listening::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(34,197,94,.72);box-shadow:0 0 0 8px rgba(34,197,94,.10), 0 0 24px rgba(34,197,94,.18);animation:micPulse 1s ease-out infinite;}.composer-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}.hidden{display:none !important;}
    .popover{position:fixed;inset:0;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px;}.popover.show{display:flex;}.popover-card{width:min(100%, 420px);max-height:min(80vh, 720px);overflow:hidden;border-radius:24px;background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 50px rgba(0,0,0,.30);display:flex;flex-direction:column;}.popover-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid rgba(255,255,255,.08);}.popover-title{margin:0;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;color:#fff;}.popover-close{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:18px;}.popover-search{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);}.popover-search input{width:100%;min-height:46px;border:none;outline:none;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;}.popover-search input::placeholder{color:rgba(255,255,255,.36);}.lang-list{padding:12px;overflow:auto;display:grid;gap:10px;scrollbar-width:none;}.lang-list::-webkit-scrollbar{display:none;}.lang-option{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:all .18s ease;}.lang-option:active{transform:scale(.986);}.lang-option.active{border-color:rgba(103,232,249,.34);background:linear-gradient(135deg, rgba(103,232,249,.10), rgba(59,130,246,.08));box-shadow:0 0 0 1px rgba(103,232,249,.12);}.lang-option-left{display:flex;align-items:center;gap:12px;min-width:0;}.lang-option-flag{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);font-size:18px;flex:0 0 30px;}.lang-option-text{min-width:0;}.lang-option-name{font-size:14px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.lang-option-code{font-size:11px;font-weight:700;color:rgba(255,255,255,.50);margin-top:3px;text-transform:uppercase;}.lang-option-check{color:#c4b5fd;font-size:18px;font-weight:900;opacity:0;}.lang-option.active .lang-option-check{opacity:1;}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:rgba(10,10,18,.94);border:1px solid rgba(196,181,253,.34);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;z-index:10000;transition:.25s;pointer-events:none;backdrop-filter:blur(14px);max-width:min(92vw,520px);text-align:center;}.toast.show{transform:translateX(-50%) translateY(0);}
    @keyframes rotateOrbit{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}@keyframes eqAnim{0%,100%{height:5px;opacity:.6;}50%{height:25px;opacity:1;}}@keyframes micPulse{0%{transform:scale(.92);opacity:.95;}70%{transform:scale(1.14);opacity:.14;}100%{transform:scale(1.18);opacity:0;}}
    @media (max-width:390px){.lang-text{font-size:11px;}.bubble.latest{font-size:26px;}.bubble.normal{font-size:17px;}.panel-head-grid{width:min(96vw,560px);}.center-hub{height:68px;}.nav-btn{font-size:10px;width:30px;height:112px;}.orb-container,.energy-orbit{width:52px;height:52px;}.ai-core{width:44px;height:44px;}.logo-text{font-size:9px;}.text-trash-btn{width:40px;height:40px}.text-trash-btn svg{width:24px;height:24px;}}
  </style>
</head>

<body id="frameRoot" class="is-ready">
  <div class="container">
    <div class="topbar"><div class="topbar-inner"><button class="lang-pill" id="fromBtn" type="button" aria-label="Kaynak dili seç"><span class="lang-left"><span class="lang-flag" id="fromFlag">🇹🇷</span><span class="lang-text" id="fromText">Türkçe</span></span><span class="lang-caret">▾</span></button><button class="swap-btn" id="swapBtn" type="button" aria-label="Dilleri değiştir"><svg viewBox="0 0 24 24"><path d="M8 7h11"></path><path d="M15 3l4 4-4 4"></path><path d="M16 17H5"></path><path d="M9 13l-4 4 4 4"></path></svg></button><button class="lang-pill" id="toBtn" type="button" aria-label="Hedef dili seç"><span class="lang-left"><span class="lang-flag" id="toFlag">🇬🇧</span><span class="lang-text" id="toText">İngilizce</span></span><span class="lang-caret">▾</span></button></div></div>
    <div class="screen"><div class="half-screen top"><div class="panel-head"><div class="panel-head-grid text-tools"><button class="tool-toggle panel-sound active" id="soundToggle" type="button" aria-label="Sesi aç kapat"><span class="dot"></span><span>SES</span></button><button class="text-trash-btn" id="trashClearBtn" type="button" aria-label="Temizle"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="trashStrokeGradient" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.48" stop-color="#93c5fd"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><path d="M9 5h6"></path><path d="M10 5l.7-1.4h2.6L14 5"></path><path d="M5.8 7h12.4"></path><path d="M8 9l.7 10.2c.05.75.67 1.3 1.42 1.3h3.76c.75 0 1.37-.55 1.42-1.3L16 9"></path><path d="M10.4 11v6.6"></path><path d="M13.6 11v6.6"></path></svg></button></div></div><div class="content-scroll" id="resultArea"><div class="bubble normal" id="resultBubble">...</div><div class="bubble-sub" id="resultSub"></div></div></div>
      <div class="center-hub"><a class="nav-btn" id="backLink" href="/pages/facetoface.html"><span class="label-rotate">BACK</span></a><a class="nav-btn" id="homeLink" href="/pages/home.html"><span class="label-rotate">HOME</span></a><div class="orb-container" id="homeBtn" title="Ana sayfa"><div class="energy-orbit"><div class="ball-1"></div><div class="ball-2"></div></div><div class="ai-core"><div class="eq-wrap" aria-hidden="true"><div class="eq-bar" style="animation-delay:0s"></div><div class="eq-bar" style="animation-delay:.2s"></div><div class="eq-bar" style="animation-delay:.4s"></div></div><span class="logo-text">italky<span class="logo-ai">AI</span></span></div></div></div>
      <div class="half-screen bottom"><div class="panel-head"><div class="panel-head-grid simple"></div></div><div class="content-scroll" id="inputViewArea"><div class="bubble normal" id="inputPreviewBubble"></div></div><div class="composer-wrap"><div class="composer"><div class="composer-center"><textarea id="inputBox" class="composer-input" rows="1" placeholder="Metin yaz"></textarea></div><button id="micBtn" class="composer-btn" type="button" aria-label="Sesli giriş"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button><button id="translateBtn" class="composer-btn primary hidden" type="button" aria-label="Çevir"><svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button></div></div></div></div>
  </div>
  <div class="popover" id="langPopover"><div class="popover-card"><div class="popover-head"><h3 class="popover-title" id="popoverTitle">Dil Seç</h3><button class="popover-close" id="popoverClose" type="button">✕</button></div><div class="popover-search"><input id="langSearch" type="text" placeholder="Dil ara..." /></div><div class="lang-list" id="langList"></div></div></div>
  <div class="toast" id="toast"></div>
  <script type="module">
  import { initGlobalAccess } from "/js/global_access.js";
  import { ensureModuleAdAccess } from "/js/ad_gate.js";
  await initGlobalAccess({ allowPublicPageBypass: false });
  let adOk = true;
  try { adOk = await ensureModuleAdAccess({ moduleKey: "text_translate", placement: "text_translate_access", title: "Bu modül için kısa bir reklam gösterilecek", text: "Yazıdan çeviri modülünü kullanabilmeniz için 1 kısa reklam gösterilecektir.\nReklamı tamamladıktan sonra bu modüle 24 saat boyunca tekrar reklam görmeden giriş yapabilirsiniz." }); } catch (e) { console.warn("text_translate ad gate error:", e); adOk = true; }
  if (adOk !== false) { await import("/js/text_translate_page.js?v=TEXT_TRANSLATE_SINGLE_V8"); }
</script>
</body>
</html>
