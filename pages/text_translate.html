<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Translate</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue: #60a5fa;
  --bordo: #2d0a0a; /* İstediğin bordo zemin */
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

/* ✅ Kural Seti: height: 100% ve padding yok */
#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 20%, #0a0a20 0%, #000 100%);
}

.main-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 12px;
  gap: 8px;
  min-height: 0; /* ✅ Kural Seti: flex children için zorunlu */
}

/* ===== DİL SEÇİCİ ===== */
.lang-hub {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 6px 14px;
  backdrop-filter: blur(20px);
}

.select-box {
  background: transparent; border: none; color: #fff;
  font-family: 'Space Grotesk'; font-size: 13px; font-weight: 700;
  cursor: pointer; appearance: none;
}

.swap-trigger {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  color: #fff; display: flex; align-items: center; justify-content: center;
}

/* ===== QUANTUM GATE ===== */
.quantum-gate {
  flex: 1;
  display: flex; flex-direction: column;
  position: relative;
  min-height: 0;
}

.gate-panel {
  flex: 1;
  position: relative;
  border-radius: 24px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.02);
  display: flex; flex-direction: column;
  padding: 18px;
  overflow: hidden;
  min-height: 0;
}

/* Çeviri tarafı bordo zemin */
.panel-out {
  background: linear-gradient(180deg, var(--bordo) 0%, #000 100%);
  border-color: rgba(236, 72, 153, 0.2);
}

textarea {
  flex: 1; background: transparent; border: none;
  color: #fff; font-size: 17px; font-weight: 300;
  line-height: 1.5; resize: none; width: 100%;
}

.output-area {
  flex: 1; color: #fbcfe8; font-size: 17px;
  font-weight: 600; line-height: 1.5; overflow-y: auto;
  white-space: pre-wrap;
}

/* ===== ORTADAKİ AKSİYON HATTI ===== */
.gate-divider {
  height: 60px; /* Butonların sığacağı yükseklik */
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  gap: 12px;
  position: relative;
  z-index: 10;
  margin: -30px 0; /* Panellerin tam ortasına bindir */
}

.btn-scan {
  height: 50px; padding: 0 15px; border-radius: 25px;
  border: 1px solid var(--blue);
  background: #000;
  color: var(--blue); display: flex; align-items: center;
  gap: 8px; font-size: 11px; font-weight: 900;
  cursor: pointer; box-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
}

.btn-main {
  width: 50px; height: 50px; border-radius: 25px;
  background: var(--ai-grad); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; cursor: pointer;
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
}

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="lang-hub">
      <select class="select-box" id="fromSel"></select>
      <button class="swap-trigger" id="btnSwap">⇄</button>
      <select class="select-box" id="toSel"></select>
    </section>

    <section class="quantum-gate">
      <div class="gate-panel">
        <textarea id="srcTxt" placeholder="Metin yazın..."></textarea>
      </div>
      
      <div class="gate-divider">
        <label class="btn-scan">
          <input type="file" id="imgFile" accept="image/*" capture="environment" style="display:none">
          <span>📷 TARAT</span>
        </label>
        
        <button class="btn-main" id="btnTranslate">GO</button>
      </div>

      <div class="gate-panel panel-out">
        <div class="output-area" id="dstTxt">Çeviri burada görünecek...</div>
      </div>
    </section>

  </div>
</main>

<script type="module">
  // ✅ Kural Seti: mountShell en üstte
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const API_BASE = "https://italky-api.onrender.com";
  const $ = (id)=>document.getElementById(id);

  // Dil listesini API'den çekme hedefi için UI hazırlığı
  const LANGS = [
    { code:"auto", name:"OTOMATİK" },
    { code:"tr", name:"TÜRKÇE" }, { code:"en", name:"ENGLISH" },
    { code:"de", name:"DEUTSCH" }, { code:"fr", name:"FRANÇAIS" },
    { code:"it", name:"ITALIANO" }, { code:"es", name:"ESPAÑOL" },
    { code:"ru", name:"RUSÇA" }, { code:"ar", name:"ARAPÇA" }
  ];

  const fromSel = $("fromSel");
  const toSel = $("toSel");
  
  fromSel.innerHTML = LANGS.map(l=>`<option value="${l.code}">${l.name}</option>`).join("");
  toSel.innerHTML = LANGS.filter(l=>l.code!=="auto").map(l=>`<option value="${l.code}">${l.name}</option>`).join("");
  
  fromSel.value = "auto";
  toSel.value = "tr";

  // Çeviri İşlemi
  $("btnTranslate").onclick = async () => {
    const text = $("srcTxt").value.trim();
    if(!text) return;

    $("dstTxt").style.opacity = "0.5";
    $("dstTxt").textContent = "Kuantum motoru işliyor...";

    try {
      const r = await fetch(`${API_BASE}/api/translate_ai`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: text,
          from_lang: fromSel.value,
          to_lang: toSel.value
        })
      });
      const j = await r.json();
      $("dstTxt").textContent = j.translated || "Hata oluştu.";
    } catch(e) {
      $("dstTxt").textContent = "Bağlantı kesildi.";
    } finally {
      $("dstTxt").style.opacity = "1";
    }
  };

  // Fotoğraf Tarama
  $("imgFile").onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;

    $("srcTxt").value = "Fotoğraf analiz ediliyor...";
    
    const fd = new FormData();
    fd.append("image", file);
    fd.append("from_lang", fromSel.value);
    fd.append("to_lang", toSel.value);

    try {
      const r = await fetch(`${API_BASE}/api/translate/ocr_translate`, {
        method: "POST",
        body: fd
      });
      const j = await r.json();
      if(j.ok) {
        $("srcTxt").value = j.extracted_text;
        $("dstTxt").textContent = j.translated_text;
      }
    } catch(e) {
      $("srcTxt").value = "Tarama başarısız.";
    }
  };

  $("btnSwap").onclick = () => {
    const a = fromSel.value;
    const b = toSel.value;
    if(a !== "auto") {
      fromSel.value = b;
      toSel.value = a;
    }
  };
</script>
</body>
</html>
