<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>italkyAI • Memory Pulse Public</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0613;
  --panel:#140a22;
  --pink:#ff4fd8;
  --cyan:#3be7ff;
  --green:#00e676;
  --red:#ff1744;
  --gold:#ffd700;
  --border:rgba(255,255,255,.10);
  --safeB: env(safe-area-inset-bottom, 0px);
  --safeT: env(safe-area-inset-top, 0px);
  --grad: linear-gradient(135deg,#8ab4ff 0%, #58d9ff 55%, #62f0b1 100%);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  outline:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Outfit,sans-serif;
  color:#fff;
  background:var(--bg);
}
body{
  background: radial-gradient(circle at center,#1f1034 0%,#06030b 100%);
}

.bg-grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:30px 30px;
  opacity:.20;
  pointer-events:none;
}

#pageContent{
  height:100dvh;
  padding:calc(10px + var(--safeT)) 10px calc(12px + var(--safeB)) 10px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  opacity:0;
  transform:scale(1.03);
  transition:.45s ease;
}
#pageContent.ui-ready{
  opacity:1;
  transform:scale(1);
}
#pageContent::-webkit-scrollbar{ display:none; }

.app{
  width:100%;
  max-width:480px;
  min-height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  z-index:5;
}

.header{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border-radius:18px;
  border:1px solid var(--border);
  background:rgba(20,10,34,.88);
  backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}

.back-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

.title{
  font-family:"Space Grotesk",sans-serif;
  font-size:17px;
  font-weight:900;
  color:var(--pink);
  letter-spacing:.5px;
  text-shadow:0 0 10px rgba(255,79,216,.18);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pill{
  min-width:58px;
  height:34px;
  padding:0 10px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:#fff;
}

.momentum-chip{
  min-width:68px;
  height:34px;
  padding:0 10px;
  border-radius:12px;
  background:var(--grad);
  color:#052638;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 18px rgba(59,231,255,.14);
  font-size:11px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  min-height:50px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  text-align:center;
  padding:4px;
}

.statVal{
  font-family:"Space Grotesk",sans-serif;
  font-size:16px;
  font-weight:900;
  color:#fff;
  line-height:1;
}

.statLab{
  font-size:9px;
  opacity:.62;
  letter-spacing:1px;
  font-weight:900;
}

.resInfo{
  text-align:center;
  min-height:16px;
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  opacity:0;
  transition:.25s;
}

.board{
  flex:1;
  border-radius:22px;
  border:1px solid var(--border);
  background:rgba(20,10,34,.82);
  backdrop-filter:blur(14px);
  box-shadow:0 22px 50px rgba(0,0,0,.45);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  overflow:hidden;
}

.boardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.langBadge{
  font-size:11px;
  font-weight:900;
  color:var(--cyan);
  letter-spacing:1px;
}

.pbBadge{
  font-size:10px;
  font-weight:800;
  color:var(--gold);
}

.grid-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  flex:1;
}

.card{
  perspective:1000px;
  cursor:pointer;
  min-height:84px;
  position:relative;
}

.inner{
  width:100%;
  height:100%;
  transition:transform .36s;
  transform-style:preserve-3d;
  border-radius:18px;
  position:relative;
}

.card.flipped .inner,
.card.matched .inner{
  transform:rotateY(180deg);
}

.card.matched .inner{
  box-shadow:0 0 18px rgba(0,230,118,.20);
  animation:pulseMatch .35s ease-out;
}

@keyframes pulseMatch{
  0%{ transform:rotateY(180deg) scale(1); }
  50%{ transform:rotateY(180deg) scale(1.05); }
  100%{ transform:rotateY(180deg) scale(1); }
}

.face{
  position:absolute;
  inset:0;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  backface-visibility:hidden;
  overflow:hidden;
}

.front{
  position:relative;
  font-size:34px;
  font-weight:900;
}

.trFront{
  background:linear-gradient(180deg,#ffffff,#f3f4f6);
  border:1px solid rgba(0,0,0,.08);
}
.trFront::before{
  content:"";
  position:absolute;
  inset:6px;
  border:2px solid #ef4444;
  border-radius:12px;
}

.fxFront{
  background:linear-gradient(180deg,#edf6ff,#dbeafe);
  border:1px solid rgba(0,0,0,.06);
}

.frontFlagMark{
  position:relative;
  z-index:2;
  font-size:30px;
  line-height:1;
  filter: drop-shadow(0 0 6px rgba(0,0,0,.08));
}

.back{
  transform:rotateY(180deg);
  font-weight:900;
  font-size:16px;
  text-align:center;
  padding:10px;
  word-break:break-word;
  line-height:1.2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back.tr{
  background:#ffffff;
  color:#111;
  border:1px solid rgba(0,0,0,.08);
}

.back.fx{
  background:linear-gradient(180deg,#edf6ff,#dbeafe);
  color:#1e3a8a;
}

.fxBurst{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}

.card.matched .fxBurst{
  opacity:1;
}

.spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:radial-gradient(circle, #fff 0%, var(--green) 45%, transparent 72%);
  box-shadow:0 0 12px rgba(0,230,118,.45);
  animation:sparkle .9s ease-out forwards;
}
.s1{ left:16%; top:22%; }
.s2{ right:14%; top:18%; animation-delay:.05s; }
.s3{ left:22%; bottom:18%; animation-delay:.09s; }
.s4{ right:20%; bottom:20%; animation-delay:.13s; }
.s5{ left:48%; top:10%; animation-delay:.02s; }
.s6{ left:50%; bottom:10%; animation-delay:.11s; }

@keyframes sparkle{
  0%{ transform:scale(.4); opacity:0; }
  30%{ opacity:1; }
  100%{ transform:scale(1.6); opacity:0; }
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(14px);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{ display:flex; }

.modal-card{
  width:100%;
  max-width:380px;
  background:#10051a;
  border:1px solid rgba(255,255,255,.10);
  border-radius:28px;
  padding:24px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.7);
  max-height:88vh;
  overflow:auto;
  scrollbar-width:none;
}
.modal-card::-webkit-scrollbar{ display:none; }

.modalTitle{
  font-family:"Space Grotesk",sans-serif;
  font-weight:900;
  font-size:26px;
  margin:0 0 12px;
}

.lang-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:16px 0;
}

.lang-btn{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  border-radius:16px;
  padding:14px 10px;
  cursor:pointer;
  transition:.16s ease;
  min-height:84px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:800;
  font-family:inherit;
}

.lang-btn .flag{ font-size:28px; }

.lang-btn.active{
  border-color:rgba(0,255,157,.30);
  box-shadow:0 0 0 1px rgba(0,255,157,.24), 0 0 18px rgba(0,255,157,.12);
  background:rgba(0,255,157,.08);
}

.resultStat{
  margin:14px 0;
  line-height:1.9;
  text-align:left;
  white-space:pre-line;
  font-size:15px;
}

.resultBtns{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.btn{
  width:100%;
  min-height:52px;
  border-radius:16px;
  border:none;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
}

.btn.primary{
  background:var(--grad);
  color:#052638;
}

.btn.secondary{
  background:rgba(255,255,255,.06);
  color:#fff;
  border:1px solid rgba(255,255,255,.14);
}
</style>
</head>

<body>
<div class="bg-grid"></div>

<main id="pageContent">
  <div class="app">
    <div class="header">
      <button id="backBtn" class="back-btn" type="button">‹</button>
      <div class="title">MEMORY PULSE</div>
      <div id="pbBadge" class="pill">PB: 0</div>
      <div id="momChip" class="momentum-chip">x1.00</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="statVal" id="moveVal">0</div>
        <div class="statLab">HAMLE</div>
      </div>
      <div class="stat">
        <div class="statVal" id="scoreVal">0</div>
        <div class="statLab">SKOR</div>
      </div>
      <div class="stat">
        <div class="statVal" id="matchVal">0/10</div>
        <div class="statLab">EŞLEŞME</div>
      </div>
      <div class="stat">
        <div class="statVal" id="langVal">EN</div>
        <div class="statLab">DİL</div>
      </div>
    </div>

    <div id="resInfo" class="resInfo">BAŞARI</div>

    <div class="board">
      <div class="boardTop">
        <div class="langBadge" id="langLabel">🇬🇧 İngilizce</div>
        <div class="pbBadge" id="pbMini">PB: 0</div>
      </div>

      <div class="grid-cards" id="grid"></div>
    </div>
  </div>
</main>

<div class="modal show" id="startModal">
  <div class="modal-card">
    <div class="modalTitle">MEMORY PULSE</div>
    <p style="opacity:.78; line-height:1.6; font-size:14px;">
      Bayrağa dokun, dili seç. Kapalı kartta sadece bayrak görünür. Açılınca yalnızca kelime görünür.
    </p>

    <div class="lang-grid" id="langGrid"></div>
    <button class="btn primary" id="startBtn">BAŞLA</button>
  </div>
</div>

<div class="modal" id="endModal">
  <div class="modal-card">
    <div class="modalTitle" id="endTitle">SET TAMAMLANDI</div>
    <div class="resultStat" id="endStats"></div>
    <div class="resultBtns">
      <button class="btn primary" id="btnReplay">YENİ OYUN</button>
      <button class="btn secondary" id="btnFinish">ANA MENÜ</button>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);

const BACK_URL = "/pages/game_menu_public.html";
const GAME_LANG_KEY = "italky_memory_pulse_lang_public";

const LANGS = {
  en:{ name:"İngilizce", flag:"🇬🇧" },
  de:{ name:"Almanca", flag:"🇩🇪" },
  fr:{ name:"Fransızca", flag:"🇫🇷" },
  es:{ name:"İspanyolca", flag:"🇪🇸" },
  it:{ name:"İtalyanca", flag:"🇮🇹" }
};

const LOCAL_FALLBACK = {
  en:[
    {w:"apple", tr:"Elma"}, {w:"house", tr:"Ev"}, {w:"water", tr:"Su"},
    {w:"light", tr:"Işık"}, {w:"world", tr:"Dünya"}, {w:"friend", tr:"Arkadaş"},
    {w:"school", tr:"Okul"}, {w:"family", tr:"Aile"}, {w:"music", tr:"Müzik"},
    {w:"travel", tr:"Seyahat"}
  ],
  de:[
    {w:"haus", tr:"Ev"}, {w:"wasser", tr:"Su"}, {w:"licht", tr:"Işık"},
    {w:"freund", tr:"Arkadaş"}, {w:"schule", tr:"Okul"}, {w:"familie", tr:"Aile"},
    {w:"musik", tr:"Müzik"}, {w:"reise", tr:"Seyahat"}, {w:"tag", tr:"Gün"},
    {w:"nacht", tr:"Gece"}
  ],
  fr:[
    {w:"maison", tr:"Ev"}, {w:"eau", tr:"Su"}, {w:"ami", tr:"Arkadaş"},
    {w:"ecole", tr:"Okul"}, {w:"famille", tr:"Aile"}, {w:"musique", tr:"Müzik"},
    {w:"jour", tr:"Gün"}, {w:"nuit", tr:"Gece"}, {w:"livre", tr:"Kitap"},
    {w:"ville", tr:"Şehir"}
  ],
  es:[
    {w:"casa", tr:"Ev"}, {w:"agua", tr:"Su"}, {w:"amigo", tr:"Arkadaş"},
    {w:"escuela", tr:"Okul"}, {w:"familia", tr:"Aile"}, {w:"musica", tr:"Müzik"},
    {w:"dia", tr:"Gün"}, {w:"noche", tr:"Gece"}, {w:"libro", tr:"Kitap"},
    {w:"ciudad", tr:"Şehir"}
  ],
  it:[
    {w:"casa", tr:"Ev"}, {w:"acqua", tr:"Su"}, {w:"amico", tr:"Arkadaş"},
    {w:"scuola", tr:"Okul"}, {w:"famiglia", tr:"Aile"}, {w:"musica", tr:"Müzik"},
    {w:"giorno", tr:"Gün"}, {w:"notte", tr:"Gece"}, {w:"libro", tr:"Kitap"},
    {w:"citta", tr:"Şehir"}
  ]
};

let cards = [];
let flipped = [];
let matched = 0;
let moves = 0;
let wrongMoves = 0;
let locked = false;
let totalScore = 0;
let momentum = 1.0;
let lang = localStorage.getItem(GAME_LANG_KEY) || "en";
let selectedLang = localStorage.getItem(GAME_LANG_KEY) || "en";
let used = new Set();
let lastKeys = [];

let audioCtx = null;

function getAudioCtx(){
  try{
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }catch{
    return null;
  }
}

async function unlockAudio(){
  try{
    const ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended"){
      await ctx.resume();
    }
  }catch{}
}

function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === "suspended"){
    ctx.resume().catch(() => {});
  }
  const now = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + .01);
  g.gain.exponentialRampToValueAtTime(.0001, now + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + .02);
}

function playMatchFx(){
  beep({freq:640,duration:.08,type:"triangle",gain:.05});
  beep({freq:860,duration:.10,type:"triangle",gain:.05,when:.08});
}

function playErrorFx(){
  beep({freq:180,duration:.10,type:"sawtooth",gain:.05});
  beep({freq:140,duration:.12,type:"sawtooth",gain:.04,when:.06});
}

function playWinFx(){
  beep({freq:700,duration:.12,type:"triangle",gain:.05});
  beep({freq:900,duration:.12,type:"triangle",gain:.05,when:.12});
  beep({freq:1100,duration:.15,type:"triangle",gain:.05,when:.24});
}

["click","touchstart","pointerdown"].forEach(evt => {
  window.addEventListener(evt, () => unlockAudio(), { passive:true, once:true });
});

function normalize(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"")
    .trim();
}

function toastRes(msg, color = '#58d9ff'){
  $("resInfo").textContent = msg;
  $("resInfo").style.color = color;
  $("resInfo").style.opacity = "1";
  clearTimeout(window.__resTo);
  window.__resTo = setTimeout(() => $("resInfo").style.opacity = "0", 1600);
}

function renderLangs() {
  $("langGrid").innerHTML = Object.entries(LANGS).map(([code, meta]) => `
    <button class="lang-btn ${selectedLang===code ? "active" : ""}" data-lang="${code}">
      <div class="flag">${meta.flag}</div>
      <div>${meta.name}</div>
    </button>
  `).join("");

  $("langGrid").querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = () => {
      selectedLang = btn.dataset.lang;
      renderLangs();
      updatePBDisplay();
    };
  });
}

function getPublicLangUrl(langCode) {
  return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;
}

function extractItems(payload) {
  if(Array.isArray(payload)) return payload;

  if(payload && typeof payload === "object"){
    const keys = ["items","words","data","list","entries","pool","vocabulary","kelimeler"];
    for(const key of keys){
      if(Array.isArray(payload[key])) return payload[key];
    }

    for(const value of Object.values(payload)){
      if(Array.isArray(value)) return value;
    }
  }

  return [];
}

function normalizePoolItems(items) {
  return items.map((item) => {
    if(typeof item === "string") return null;

    const rawWord =
      item?.word ??
      item?.w ??
      item?.text ??
      item?.term ??
      item?.answer ??
      item?.source ??
      item?.value ??
      "";

    const rawMeaning =
      item?.meaning ??
      item?.tr ??
      item?.translation ??
      item?.mean ??
      item?.hint ??
      item?.target ??
      item?.turkish ??
      item?.turkce ??
      item?.ceviri ??
      "";

    return {
      w: String(rawWord || "").trim(),
      tr: String(rawMeaning || "").trim()
    };
  }).filter(x => x.w && x.tr && !x.w.includes(" "));
}

async function loadLangPool(langCode) {
  try{
    const url = getPublicLangUrl(langCode);
    const res = await fetch(url, { cache:"no-store" });

    if(!res.ok){
      console.warn("[memory_public] pool fetch failed:", url, res.status);
      return { items: LOCAL_FALLBACK[langCode] || LOCAL_FALLBACK.en };
    }

    const json = await res.json();
    const items = normalizePoolItems(extractItems(json));

    if(!items.length){
      console.warn("[memory_public] pool empty, fallback:", langCode);
      return { items: LOCAL_FALLBACK[langCode] || LOCAL_FALLBACK.en };
    }

    return { items };
  }catch(e){
    console.warn("[memory_public] pool error, fallback:", e);
    return { items: LOCAL_FALLBACK[langCode] || LOCAL_FALLBACK.en };
  }
}

function shuffle(arr) {
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickUniquePairs(items, count = 10){
  if(!items.length) return [];

  if(used.size >= items.length){
    used.clear();
  }

  const chosen = [];
  let guard = 0;

  while(chosen.length < count && guard < items.length * 20){
    const pick = items[Math.floor(Math.random() * items.length)];
    const key = normalize(pick.w);

    if(!used.has(key) && !lastKeys.includes(key)){
      used.add(key);
      chosen.push(pick);
    }
    guard++;
  }

  if(chosen.length < count){
    const fallbackPool = items.filter(x => !chosen.some(y => normalize(y.w) === normalize(x.w)));
    while(chosen.length < count && fallbackPool.length){
      const item = fallbackPool.shift();
      chosen.push(item);
    }
  }

  lastKeys = chosen.map(x => normalize(x.w)).slice(-5);
  return chosen;
}

function updatePBDisplay() {
  const pb = localStorage.getItem(`memory_pulse_pb_public_${selectedLang}`) || 0;
  $("pbBadge").textContent = `PB: ${pb}`;
  $("pbMini").textContent = `PB: ${pb}`;
}

function updateStats() {
  $("moveVal").textContent = moves;
  $("matchVal").textContent = `${matched}/10`;
  $("scoreVal").textContent = totalScore;
  $("momChip").textContent = `x${momentum.toFixed(2)}`;
  $("langVal").textContent = selectedLang.toUpperCase();
  $("langLabel").textContent = `${LANGS[lang]?.flag || "🌐"} ${LANGS[lang]?.name || lang}`;
}

function render() {
  const g = $("grid");
  g.innerHTML = "";

  cards.forEach((c, i) => {
    const isTr = c.lang === "tr";
    const frontFlag = isTr ? "🇹🇷" : (LANGS[lang]?.flag || "🌐");
    const frontClass = isTr ? "front trFront" : "front fxFront";

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="inner">
        <div class="face ${frontClass}">
          <div class="frontFlagMark">${frontFlag}</div>
        </div>

        <div class="face back ${isTr ? "tr" : "fx"}">
          <div>${c.text}</div>
        </div>
      </div>

      <div class="fxBurst">
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
        <div class="spark s5"></div>
        <div class="spark s6"></div>
      </div>
    `;
    el.onclick = () => clickCard(i, el);
    g.appendChild(el);
  });
}

function clickCard(i, el) {
  if(locked || el.classList.contains("flipped") || el.classList.contains("matched")) return;

  el.classList.add("flipped");
  flipped.push({ i, data: cards[i], el });

  if(flipped.length === 2){
    moves++;
    updateStats();
    checkMatch();
  }
}

function checkMatch() {
  locked = true;
  const [a, b] = flipped;

  if(a.data.pair === b.data.pair){
    playMatchFx();
    toastRes("EŞLEŞME!", "#00e676");

    setTimeout(() => {
      a.el.classList.add("matched");
      b.el.classList.add("matched");
      matched++;

      const roundPoints = Math.round(Math.max(10, 60 - (wrongMoves * 6)) * momentum);
      totalScore += roundPoints;
      momentum = Math.min(1.7, momentum + 0.05);

      flipped = [];
      locked = false;
      updateStats();

      if(matched === 10) finish();
    }, 420);
  }else{
    playErrorFx();
    wrongMoves++;
    momentum = Math.max(1.0, momentum - 0.10);
    toastRes("UYUŞMADI", "#ef4444");
    updateStats();

    setTimeout(() => {
      a.el.classList.remove("flipped");
      b.el.classList.remove("flipped");
      flipped = [];
      locked = false;
    }, 750);
  }
}

function saveRecord() {
  const key = `memory_pulse_pb_public_${lang}`;
  const currentPB = parseInt(localStorage.getItem(key) || 0, 10);

  if(totalScore > currentPB){
    localStorage.setItem(key, String(totalScore));
    return true;
  }

  return false;
}

function finish() {
  playWinFx();
  const isPB = saveRecord();

  $("endTitle").textContent = isPB ? "YENİ REKOR! 👑" : "SET TAMAMLANDI";
  $("endStats").textContent =
`Toplam Skor: ${totalScore}
Hatalı Hamle: ${wrongMoves}
Momentum: x${momentum.toFixed(2)}
Dil: ${LANGS[lang]?.name || lang}`;

  $("endModal").classList.add("show");
  updatePBDisplay();
}

async function initGame(isNewRun = true) {
  const pool = await loadLangPool(lang);
  const items = Array.isArray(pool.items) ? pool.items : [];

  if(!items.length){
    alert("Havuz yüklenemedi.");
    return;
  }

  if(isNewRun){
    totalScore = 0;
    momentum = 1.0;
    used.clear();
    lastKeys = [];
  }

  matched = 0;
  moves = 0;
  wrongMoves = 0;
  flipped = [];
  locked = false;

  const picked = pickUniquePairs(shuffle(items), 10);

  if(picked.length < 10){
    used.clear();
    return initGame(isNewRun);
  }

  cards = [];

  picked.forEach((it, i) => {
    cards.push({ pair:i, text:it.w, lang:lang });
    cards.push({ pair:i, text:it.tr, lang:"tr" });
  });

  cards = shuffle(cards);

  $("endModal").classList.remove("show");
  render();
  updateStats();
}

$("startBtn").onclick = async () => {
  lang = selectedLang;
  localStorage.setItem(GAME_LANG_KEY, lang);

  $("startModal").classList.remove("show");
  await initGame(true);
};

$("btnReplay").onclick = () => initGame(true);
$("btnFinish").onclick = () => location.href = BACK_URL;
$("backBtn").onclick = () => location.href = BACK_URL;

window.addEventListener("load", () => {
  renderLangs();
  updatePBDisplay();
  updateStats();

  setTimeout(() => {
    $("pageContent")?.classList.add("ui-ready");
  }, 120);
});
</script>
</body>
</html>
