<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Sentence Forge Public</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020205;
      --c-neon-pink:#ff00ff;
      --c-neon-blue:#00f3ff;
      --c-neon-green:#00e676;
      --c-error:#ff1744;
      --c-gold:#ffd700;
      --border: rgba(255,255,255,.12);
      --safeB: env(safe-area-inset-bottom, 0px);
      --safeT: env(safe-area-inset-top, 0px);
      --grad: linear-gradient(135deg,#a5b4fc 0%, #6366f1 55%, #ec4899 100%);
    }

    *{
      box-sizing:border-box;
      outline:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:'Outfit', sans-serif;
      background:var(--bg);
      color:#fff;
    }

    body{
      background:
        radial-gradient(circle at 50% 20%, rgba(99,102,241,.18), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(0,243,255,.08), transparent 25%),
        radial-gradient(circle at 100% 0%, rgba(255,0,255,.08), transparent 25%),
        var(--bg);
    }

    #pageContent{
      height:100dvh;
      padding:calc(10px + var(--safeT)) 12px calc(18px + var(--safeB)) 12px;
      opacity:0;
      transform:scale(1.03);
      transition:.45s ease;
    }

    #pageContent.ui-ready{
      opacity:1;
      transform:scale(1);
    }

    .wrap{
      width:100%;
      max-width:480px;
      height:100%;
      margin:0 auto;
      position:relative;
      z-index:10;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .nav-top{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }

    .back-btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:22px;
      font-weight:900;
      cursor:pointer;
    }

    .status-chip{
      background: rgba(255,255,255,.05);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--border);
      letter-spacing: 1px;
      text-align:center;
      min-width:96px;
    }

    .pb-chip{
      font-size: 10px;
      color: var(--c-neon-pink);
      font-weight: 800;
      text-align: center;
      margin-top: 4px;
    }

    .top-right{
      display:flex;
      gap:8px;
    }

    .mini-badge{
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:54px;
      height: 38px;
      padding: 0 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      font-weight: 800;
      font-size: 11px;
    }

    .streak-wrap{
      text-align:center;
      opacity:0;
      transition:.25s;
      font-weight:900;
      min-height:22px;
      color:var(--c-gold);
    }

    .streak-active{ opacity:1; }

    .game-card{
      flex:1;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(15px);
      padding: 20px 16px;
      position:relative;
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow:hidden;
    }

    .resInfo{
      font-size: 12px;
      color: var(--c-neon-blue);
      text-align: center;
      min-height: 18px;
      margin-bottom: 4px;
      font-weight: 700;
      opacity: 0;
      transition: 0.3s;
    }

    .sentencePanel{
      padding:14px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
    }

    .sentence-text{
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      min-height: 60px;
    }

    .translation-text{
      font-size: 14px;
      color: var(--c-neon-green);
      font-style: italic;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 10px;
      min-height: 24px;
    }

    .word-box{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap: 6px;
      margin: 2px 0 0;
      min-height:52px;
    }

    .letter-slot{
      width: 28px;
      height: 40px;
      border-bottom: 2px solid var(--c-neon-blue);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 22px;
      font-weight: 900;
      color: var(--c-neon-blue);
      text-transform:uppercase;
    }

    .letter-slot.filled{
      border-bottom: none;
      color: #fff;
      text-shadow: 0 0 10px var(--c-neon-blue);
    }

    .keyboard{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .key-btn{
      aspect-ratio:1;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-weight: 800;
      cursor:pointer;
      font-size: 14px;
      transition: 0.2s;
      font-family:inherit;
    }

    .key-btn:active{ transform:scale(.96); }

    .key-btn.correct{
      background: var(--c-neon-green) !important;
      color:#000;
      border:none;
      box-shadow:0 0 18px rgba(0,230,118,.22);
    }

    .key-btn.wrong{
      background: var(--c-error) !important;
      color:#fff;
      border:none;
      opacity: 0.38;
      text-decoration: line-through;
      pointer-events: none;
    }

    .bottomActions{
      display:flex;
      gap:10px;
      margin-top:auto;
    }

    .btn-main{
      flex:1;
      min-height:54px;
      border-radius:18px;
      border:none;
      font-weight:900;
      font-size:15px;
      cursor:pointer;
      transition:.15s;
      font-family:inherit;
    }

    .btn-main:active{ transform:scale(.98); }

    .btn-joker{
      background: linear-gradient(135deg,#6366f1,#a5b4fc);
      color:#fff;
    }

    .btn-skip{
      background: rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
    }

    .modal-wrap{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(14px);
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px;
    }

    .modal-card{
      width:100%;
      max-width:380px;
      background:#101016;
      border:1px solid var(--border);
      border-radius:30px;
      padding:24px;
      text-align:center;
      max-height:90vh;
      overflow:auto;
      box-shadow:0 25px 70px rgba(0,0,0,.7);
    }

    .sectionTitle{
      font-family:'Space Grotesk',sans-serif;
      font-weight:900;
      font-size:24px;
      margin:0 0 14px;
    }

    .lang-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:16px;
    }

    .lang-btn{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      border-radius:16px;
      padding:14px 10px;
      cursor:pointer;
      transition:.16s ease;
      min-height:86px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:800;
      font-size:15px;
      font-family:inherit;
    }

    .lang-btn .flag{ font-size:28px; }

    .lang-btn.active{
      border-color: rgba(0,255,157,.30);
      box-shadow:0 0 0 1px rgba(0,255,157,.24), 0 0 18px rgba(0,255,157,.12);
      background: rgba(0,255,157,.08);
    }

    .record-box{
      margin-top:14px;
      padding:12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      font-size:13px;
      line-height:1.7;
      text-align:left;
    }

    .endCard{
      width:100%;
      max-width:380px;
      background:#101016;
      border:1px solid var(--border);
      border-radius:30px;
      padding:24px;
      text-align:center;
      box-shadow:0 25px 70px rgba(0,0,0,.7);
    }

    .resultTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      margin:0 0 14px;
    }

    .resultStat{
      font-size:15px;
      line-height:1.9;
      margin:16px 0;
      text-align:left;
      white-space:pre-line;
    }

    .resultBtns{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .resultBtn{
      width:100%;
      min-height:52px;
      border-radius:16px;
      border:none;
      font-weight:900;
      cursor:pointer;
      font-family:inherit;
    }

    .resultBtn.primary{
      background:var(--c-neon-green);
      color:#000;
    }

    .resultBtn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:#fff;
    }
  </style>
</head>

<body>

    <div class="wrap">
      <div class="nav-top">
        <button id="backBtn" class="back-btn" type="button">‹</button>

        <div style="text-align:center">
          <div id="statusChip" class="status-chip">EN</div>
          <div id="pbDisplay" class="pb-chip">PB: 0</div>
        </div>

        <div class="top-right">
          <div class="mini-badge" id="lifeDisplay" style="color:var(--c-neon-pink);">❤️❤️❤️</div>
          <div class="mini-badge" id="scoreBadge">🏆 <span id="scoreDisplay">0</span></div>
        </div>

<script type="module">
const $ = (id) => document.getElementById(id);

const BACK_URL = "/pages/game_menu_public.html";
const GAME_LANG_KEY = "italky_sentence_forge_lang_public";

const LANG_META = {
  en: { name:"İngilizce", flag:"🇬🇧", bcp:"en-US" },
  de: { name:"Almanca", flag:"🇩🇪", bcp:"de-DE" },
  fr: { name:"Fransızca", flag:"🇫🇷", bcp:"fr-FR" },
  es: { name:"İspanyolca", flag:"🇪🇸", bcp:"es-ES" },
  it: { name:"İtalyanca", flag:"🇮🇹", bcp:"it-IT" }
};

const LOCAL_FALLBACK = {
  en:[
    {w:"APPLE", tr:"Elma", sentence:"I eat an apple every day."},
    {w:"HOUSE", tr:"Ev", sentence:"This house is very big."},
    {w:"WATER", tr:"Su", sentence:"I drink water in the morning."},
    {w:"FRIEND", tr:"Arkadaş", sentence:"My friend is at school."},
    {w:"MUSIC", tr:"Müzik", sentence:"I like music."}
  ],
  de:[
    {w:"HAUS", tr:"Ev", sentence:"Das haus ist groß."},
    {w:"WASSER", tr:"Su", sentence:"Ich trinke wasser."},
    {w:"FREUND", tr:"Arkadaş", sentence:"Mein freund ist hier."}
  ],
  fr:[
    {w:"MAISON", tr:"Ev", sentence:"La maison est grande."},
    {w:"EAU", tr:"Su", sentence:"Je bois de l'eau."},
    {w:"AMI", tr:"Arkadaş", sentence:"Mon ami est ici."}
  ],
  es:[
    {w:"CASA", tr:"Ev", sentence:"La casa es grande."},
    {w:"AGUA", tr:"Su", sentence:"Bebo agua."},
    {w:"AMIGO", tr:"Arkadaş", sentence:"Mi amigo está aquí."}
  ],
  it:[
    {w:"CASA", tr:"Ev", sentence:"La casa è grande."},
    {w:"ACQUA", tr:"Su", sentence:"Bevo acqua."},
    {w:"AMICO", tr:"Arkadaş", sentence:"Il mio amico è qui."}
  ]
};

const state = {
  lang: localStorage.getItem(GAME_LANG_KEY) || "en",
  selectedLang: localStorage.getItem(GAME_LANG_KEY) || "en",
  wordList: [],
  used: new Set(),
  currentWord: "",
  currentMeaning: "",
  currentSentence: "",
  discovered: [],
  mistakes: 0,
  maxMistakes: 8,
  lives: 3,
  maxLives: 9,
  jokers: 2,
  totalScore: 0,
  streak: 0,
  maxStreak: 0,
  perfectCount: 0,
  roundStartTime: 0,
  usedJokerInRound: false,
  lastWordKey: "",
  best: Number(localStorage.getItem("sentence_forge_best_public") || 0)
};

let audioCtx = null;

function getAudioCtx() {
  try {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  } catch {
    return null;
  }
}

async function unlockAudio() {
  try {
    const ctx = getAudioCtx();
    if (ctx && ctx.state === "suspended") {
      await ctx.resume();
    }
  } catch {}
}

function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume().catch(() => {});
  const now = ctx.currentTime + when;

  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + .01);
  g.gain.exponentialRampToValueAtTime(.0001, now + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + .02);
}

function playCorrectFx() {
  beep({freq:720,duration:.08,type:"triangle",gain:.05});
  beep({freq:920,duration:.09,type:"triangle",gain:.04,when:.07});
}

function playWrongFx() {
  beep({freq:220,duration:.10,type:"sawtooth",gain:.05});
  beep({freq:170,duration:.12,type:"sawtooth",gain:.04,when:.05});
}

function nativeSpeak(text, lang) {
  try {
    if (window.NativeTTS && typeof window.NativeTTS.speak === "function") {
      window.NativeTTS.speak(String(text || "").trim(), String(lang || "en").trim());
      return true;
    }
  } catch {}
  return false;
}

async function speakText(text, lang) {
  const t = String(text || "").trim();
  if (!t) return;

  await unlockAudio();

  if (nativeSpeak(t, lang)) return;
  if (!("speechSynthesis" in window)) return;

  try { window.speechSynthesis.cancel(); } catch {}

  const meta = LANG_META[lang] || LANG_META.en;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = meta.bcp || "en-US";
  u.rate = .92;
  u.pitch = 1;
  u.volume = 1;

  const voices = window.speechSynthesis.getVoices?.() || [];
  if (voices?.length) {
    const found = voices.find(v => String(v.lang || "").toLowerCase().startsWith(lang));
    if (found) u.voice = found;
  }

  setTimeout(() => {
    try { window.speechSynthesis.speak(u); } catch {}
  }, 80);
}

["click","touchstart","pointerdown"].forEach(evt => {
  window.addEventListener(evt, () => unlockAudio(), { passive:true, once:true });
});

function escapeRegExp(s) {
  return String(s ?? "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getPublicLangUrl(langCode) {
  return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;
}

function extractItems(payload) {
  if (Array.isArray(payload)) return payload;

  if (payload && typeof payload === "object") {
    const keys = ["items","words","data","list","entries","pool","vocabulary","kelimeler"];
    for (const key of keys) {
      if (Array.isArray(payload[key])) return payload[key];
    }

    for (const value of Object.values(payload)) {
      if (Array.isArray(value)) return value;
    }
  }

  return [];
}

function makeFallbackSentence(word, lang) {
  const w = String(word || "").trim();
  if (!w) return "";

  if (lang === "de") return `Ich wähle ${w}.`;
  if (lang === "fr") return `Je choisis ${w}.`;
  if (lang === "es") return `Elijo ${w}.`;
  if (lang === "it") return `Scelgo ${w}.`;
  return `I choose ${w}.`;
}

function normalizeLangItems(items, lang) {
  return items.map((item) => {
    if (typeof item === "string") {
      const w = String(item || "").trim();
      return { w, tr:"—", sentence:makeFallbackSentence(w, lang) };
    }

    const rawWord =
      item?.word ??
      item?.w ??
      item?.text ??
      item?.term ??
      item?.answer ??
      item?.source ??
      item?.value ??
      "";

    const rawMeaning =
      item?.meaning ??
      item?.tr ??
      item?.translation ??
      item?.mean ??
      item?.hint ??
      item?.target ??
      item?.turkish ??
      item?.turkce ??
      item?.ceviri ??
      "";

    const rawSentence =
      item?.sentence ??
      item?.s ??
      item?.sample ??
      item?.example ??
      item?.example_sentence ??
      "";

    const w = String(rawWord || "").trim();

    return {
      w,
      tr: String(rawMeaning || "—").trim(),
      sentence: String(rawSentence || "").trim() || makeFallbackSentence(w, lang)
    };
  }).filter(x => x.w && x.tr && x.sentence && !String(x.w).trim().includes(" "));
}

async function loadLangPool(lang) {
  try {
    const url = getPublicLangUrl(lang);
    const res = await fetch(url, { cache:"no-store" });

    if (!res.ok) {
      console.warn("[sentence_public] pool fetch failed:", url, res.status);
      return { items: LOCAL_FALLBACK[lang] || LOCAL_FALLBACK.en };
    }

    const json = await res.json();
    const items = normalizeLangItems(extractItems(json), lang);

    if (!items.length) {
      console.warn("[sentence_public] pool empty, fallback:", lang);
      return { items: LOCAL_FALLBACK[lang] || LOCAL_FALLBACK.en };
    }

    return { items };
  } catch (e) {
    console.warn("[sentence_public] pool error, fallback:", e);
    return { items: LOCAL_FALLBACK[lang] || LOCAL_FALLBACK.en };
  }
}

function normalizeKey(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"")
    .trim();
}

function nextUniqueWord(items) {
  if (!items.length) return null;

  if (state.used.size >= items.length) {
    state.used.clear();
  }

  let candidate = null;
  let guard = 0;

  while (guard < 100) {
    const pick = items[Math.floor(Math.random() * items.length)];
    const key = normalizeKey(pick.w);

    if (!state.used.has(key) && key !== state.lastWordKey) {
      state.used.add(key);
      state.lastWordKey = key;
      candidate = pick;
      break;
    }

    guard++;
  }

  if (!candidate) {
    const fallback = items.find(x => normalizeKey(x.w) !== state.lastWordKey) || items[0];
    state.lastWordKey = normalizeKey(fallback.w);
    state.used.add(state.lastWordKey);
    candidate = fallback;
  }

  return candidate;
}

function renderLangs() {
  $("langGrid").innerHTML = Object.entries(LANG_META).map(([code, meta]) => `
    <button class="lang-btn ${state.selectedLang === code ? "active" : ""}" data-lang="${code}">
      <div class="flag">${meta.flag}</div>
      <div>${meta.name}</div>
    </button>
  `).join("");

  $("langGrid").querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = () => {
      state.selectedLang = btn.dataset.lang;
      renderLangs();
      updateLeaderboardUI();
    };
  });
}

function updateLeaderboardUI() {
  const records = JSON.parse(localStorage.getItem('italky_sentence_forge_hof_public') || '[]');
  const current = records.filter(r => r.lang === state.selectedLang.toUpperCase());
  const top = current.length ? Math.max(...current.map(r => r.score)) : 0;

  $("pbDisplay").textContent = `PB: ${top}`;
  state.best = top;

  $("leaderboardBox").innerHTML = current.slice(0,5).map((r, i) => `
    <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;">
      <span>${i+1}. ${r.score}</span>
      <span>🔥${r.streak}</span>
    </div>
  `).join("") || `<div style="font-size:12px;opacity:.5">Henüz kayıt yok.</div>`;
}

function updateUI() {
  $("statusChip").textContent = `${LANG_META[state.lang]?.flag || "🌐"} ${state.lang.toUpperCase()}`;
  $("lifeDisplay").textContent = "❤️".repeat(Math.max(0, state.lives)) + "🖤".repeat(Math.max(0, state.maxLives - Math.max(0, state.lives)));
  $("scoreDisplay").textContent = String(state.totalScore);
  $("jokerCount").textContent = String(state.jokers);
  $("streakCount").textContent = String(state.streak);
  $("pbDisplay").textContent = `PB: ${state.best}`;

  if (state.streak >= 2) $("streakWrap").classList.add("streak-active");
  else $("streakWrap").classList.remove("streak-active");
}

function buildMaskedSentence() {
  const escaped = escapeRegExp(state.currentWord);
  const regex = new RegExp(`(^|[^\\p{L}'-])(${escaped})(?=[^\\p{L}'-]|$)`, "giu");
  const out = state.currentSentence.replace(regex, `$1____`);
  return (out === state.currentSentence ? `${state.currentSentence} ____` : out).toUpperCase();
}

function renderWord() {
  const box = $("wordBox");
  box.innerHTML = "";

  state.currentWord.split("").forEach((ch, i) => {
    const d = document.createElement("div");
    d.className = `letter-slot ${state.discovered[i] ? "filled" : ""}`;
    d.textContent = state.discovered[i] ? ch : "";
    box.appendChild(d);
  });
}

function renderDynamicKeyboard() {
  const kb = $("keyboard");
  kb.innerHTML = "";

  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZÀÈÉÌÍÒÓÙÚ";
  const wordChars = [...new Set(state.currentWord.split("").filter(Boolean))];
  const wrongChars = alphabet
    .split("")
    .filter(c => !wordChars.includes(c))
    .sort(() => Math.random() - 0.5)
    .slice(0, 12);

  const finalKeys = [...wordChars, ...wrongChars].sort((a,b)=>a.localeCompare(b, state.lang));

  finalKeys.forEach(char => {
    const b = document.createElement("button");
    b.className = "key-btn";
    b.textContent = char;
    b.onclick = () => handleGuess(char, b);
    kb.appendChild(b);
  });
}

function startRound() {
  const data = nextUniqueWord(state.wordList);

  if (!data) {
    finishGame();
    return;
  }

  state.currentWord = String(data.w || "").trim().toUpperCase();
  state.currentMeaning = String(data.tr || "").trim();
  state.currentSentence = String(data.sentence || "").trim();
  state.mistakes = 0;
  state.usedJokerInRound = false;
  state.discovered = new Array(state.currentWord.length).fill(false);
  state.roundStartTime = Date.now();

  $("sentenceDisplay").textContent = buildMaskedSentence();
  $("translationDisplay").textContent = state.currentMeaning || "";
  $("resInfo").style.opacity = "0";
  $("resInfo").textContent = "";

  renderWord();
  renderDynamicKeyboard();
  updateUI();
}

function calculatePuan() {
  state.streak++;
  state.maxStreak = Math.max(state.maxStreak, state.streak);

  const multiplier = Math.min(state.streak <= 3 ? state.streak : (3 + (state.streak - 3) * 0.25), 6);
  const base = (state.maxMistakes - state.mistakes) * 10;
  const timeUsed = (Date.now() - state.roundStartTime) / 1000;
  const speedBonus = !state.usedJokerInRound ? (timeUsed < 6 ? 10 : (timeUsed < 10 ? 5 : 0)) : 0;
  const perfectBonus = (!state.usedJokerInRound && state.mistakes === 0) ? 15 : 0;

  if (state.mistakes === 0 && !state.usedJokerInRound) {
    state.perfectCount++;
    if (state.lives < state.maxLives) {
      state.lives++;
    }
  }

  const roundTotal = Math.round((base * multiplier) + speedBonus + perfectBonus);
  state.totalScore += roundTotal;

  if (state.totalScore > state.best) {
    state.best = state.totalScore;
  }

  updateUI();
}

function revealAndSpeakCorrectAnswer() {
  $("resInfo").textContent = `✅ DOĞRU: ${state.currentWord}`;
  $("resInfo").style.opacity = "1";
  speakText(state.currentWord, state.lang);
}

function handleGuess(char, btn) {
  if (!btn || btn.disabled) return;
  btn.disabled = true;

  if (state.currentWord.includes(char)) {
    btn.classList.add("correct");
    playCorrectFx();

    state.currentWord.split("").forEach((c, i) => {
      if (c === char) state.discovered[i] = true;
    });

    renderWord();

    if (state.discovered.every(v => v)) {
      calculatePuan();
      revealAndSpeakCorrectAnswer();
      setTimeout(() => startRound(), 1600);
    }
  } else {
    btn.classList.add("wrong");
    playWrongFx();
    state.mistakes++;
    state.streak = 0;
    updateUI();

    if (state.mistakes >= state.maxMistakes) {
      state.lives--;
      state.totalScore = Math.max(0, state.totalScore - 5);
      revealAndSpeakCorrectAnswer();

      if (state.lives <= 0) {
        setTimeout(() => finishGame(), 1600);
      } else {
        setTimeout(() => startRound(), 1600);
      }
    } else {
      $("resInfo").textContent = `HATA: ${state.mistakes}/${state.maxMistakes}`;
      $("resInfo").style.opacity = "1";
    }
  }
}

function saveRecord() {
  if (state.totalScore <= 0) return false;

  const records = JSON.parse(localStorage.getItem('italky_sentence_forge_hof_public') || '[]');
  const now = new Date();

  const newRecord = {
    id: now.getTime() + "-" + Math.random().toString(16).slice(2),
    score: state.totalScore,
    lang: state.lang.toUpperCase(),
    streak: state.maxStreak,
    time: now.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' })
  };

  records.push(newRecord);
  records.sort((a,b) => b.score - a.score);

  const top10 = records.slice(0,10);
  localStorage.setItem('italky_sentence_forge_hof_public', JSON.stringify(top10));
  localStorage.setItem('sentence_forge_best_public', String(state.best));

  updateLeaderboardUI();
  return top10.some(r => r.id === newRecord.id);
}

function finishGame() {
  const isNew = saveRecord();

  $("endTitle").textContent = isNew ? "YENİ REKOR! 👑" : "OYUN BİTTİ";
  $("endStats").textContent =
`Toplam Skor: ${state.totalScore}
Max Seri: 🔥 ${state.maxStreak}
Mükemmel Tur: ${state.perfectCount}
Dil: ${LANG_META[state.lang]?.name || state.lang}`;

  $("endModal").style.display = "flex";
}

async function initGame() {
  state.lang = state.selectedLang;
  localStorage.setItem(GAME_LANG_KEY, state.lang);

  const pool = await loadLangPool(state.lang);

  if (!pool || !Array.isArray(pool.items) || pool.items.length === 0) {
    alert("Havuz yüklenemedi.");
    return;
  }

  const randomizedItems = shuffle([...pool.items]);
  state.wordList = randomizedItems.filter(it =>
    it.sentence && it.w && String(it.w).trim() && !String(it.w).trim().includes(" ")
  );

  if (!state.wordList.length) {
    alert("Bu dilde uygun havuz bulunamadı.");
    return;
  }

  state.used.clear();
  state.currentWord = "";
  state.currentMeaning = "";
  state.currentSentence = "";
  state.discovered = [];
  state.mistakes = 0;
  state.maxMistakes = 8;
  state.lives = 3;
  state.maxLives = 9;
  state.jokers = 2;
  state.totalScore = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perfectCount = 0;
  state.lastWordKey = "";
  state.best = Number(localStorage.getItem('sentence_forge_best_public') || state.best || 0);

  $("startModal").style.display = "none";
  $("endModal").style.display = "none";

  startRound();
}

$("btnStartSingle").onclick = initGame;

$("btnReplay").onclick = () => {
  $("endModal").style.display = "none";
  initGame();
};

$("btnFinish").onclick = () => {
  location.href = BACK_URL;
};

$("backBtn").onclick = () => {
  location.href = BACK_URL;
};

$("jokerBtn").onclick = () => {
  if (state.jokers <= 0 || state.usedJokerInRound) return;

  const hiddenIdx = state.discovered
    .map((v, i) => v ? -1 : i)
    .filter(i => i !== -1);

  if (!hiddenIdx.length) return;

  const char = state.currentWord[hiddenIdx[Math.floor(Math.random() * hiddenIdx.length)]];
  state.jokers--;
  state.usedJokerInRound = true;

  document.querySelectorAll(".key-btn").forEach(b => {
    if (b.textContent === char) handleGuess(char, b);
  });

  updateUI();
};

$("skipBtn").onclick = () => {
  state.streak = 0;
  state.totalScore = Math.max(0, state.totalScore - 3);
  revealAndSpeakCorrectAnswer();
  setTimeout(() => startRound(), 1400);
};

window.addEventListener("load", () => {
  renderLangs();
  updateLeaderboardUI();
  updateUI();

  setTimeout(() => {
    $("pageContent")?.classList.add("ui-ready");
  }, 120);
});
</script>
</body>
</html>
