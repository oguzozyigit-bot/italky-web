<!-- /pages/contact.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • İletişim</title>

  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07111f;
      --bg2:#0b1d33;
      --navy:#0f2742;
      --blue:#2f80ed;
      --blue2:#38bdf8;
      --ice:#eaf6ff;
      --text:#f8fbff;
      --muted:rgba(248,251,255,.66);
      --soft:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --line2:rgba(56,189,248,.20);
      --card:rgba(10,28,48,.72);
      --grad:linear-gradient(135deg,#dbeafe 0%,#60a5fa 34%,#2563eb 72%,#0f2742 100%);
      --btn:linear-gradient(135deg,#dbeafe 0%,#93c5fd 18%,#38bdf8 48%,#2563eb 100%);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:'Outfit',sans-serif;
      overflow-x:hidden;
    }

    body{
      background:
        radial-gradient(circle at 16% 0%, rgba(56,189,248,.18), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(37,99,235,.16), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(14,165,233,.10), transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg));
    }

    .bg-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size:42px 42px;
      opacity:.28;
      mask-image:linear-gradient(to bottom, black, transparent 80%);
      -webkit-mask-image:linear-gradient(to bottom, black, transparent 80%);
    }

    .orb{
      position:fixed;
      width:280px;
      height:280px;
      border-radius:50%;
      right:-120px;
      top:80px;
      background:radial-gradient(circle, rgba(56,189,248,.16), transparent 68%);
      filter:blur(8px);
      pointer-events:none;
      z-index:1;
    }

    #pageContent{
      position:relative;
      z-index:10;
      width:100%;
      max-width:520px;
      min-height:100dvh;
      margin:0 auto;
      padding:calc(18px + var(--safe-top)) 16px calc(22px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      min-width:0;
    }

    .brand-main{
      font-family:'Space Grotesk',sans-serif;
      font-size:30px;
      font-weight:900;
      line-height:1;
      letter-spacing:-1px;
    }

    .brand-main .ai{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin-top:7px;
      display:inline-flex;
      padding:6px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(248,251,255,.72);
      font-size:10px;
      font-weight:1000;
      letter-spacing:1.7px;
    }

    .back-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 14px 28px rgba(0,0,0,.18);
    }

    .hero{
      border-radius:30px;
      padding:18px;
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.17), transparent 36%),
        linear-gradient(145deg, rgba(15,39,66,.88), rgba(7,17,31,.82));
      border:1px solid var(--line2);
      box-shadow:0 22px 48px rgba(0,0,0,.26);
      overflow:hidden;
      position:relative;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,.05), transparent);
      pointer-events:none;
    }

    .hero-badge{
      position:relative;
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.11);
      color:#bfdbfe;
      font-size:11px;
      font-weight:1000;
      letter-spacing:.5px;
      margin-bottom:12px;
    }

    h1{
      position:relative;
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:30px;
      line-height:1.08;
      font-weight:900;
      letter-spacing:-1px;
    }

    h1 span{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      position:relative;
      margin:11px 0 0;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
      font-weight:700;
    }

    .contact-card{
      border-radius:30px;
      padding:18px;
      background:var(--card);
      border:1px solid var(--line);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:0 24px 54px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.04);
      animation:cardIn .45s ease forwards;
    }

    @keyframes cardIn{
      from{opacity:0; transform:translateY(14px)}
      to{opacity:1; transform:translateY(0)}
    }

    .input-group{
      margin-bottom:12px;
    }

    .input-field{
      width:100%;
      min-height:56px;
      border-radius:18px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.11);
      padding:0 16px;
      color:#fff;
      font-family:inherit;
      font-size:15px;
      font-weight:700;
      transition:.22s ease;
      user-select:text;
    }

    textarea.input-field{
      min-height:126px;
      padding:16px;
      resize:none;
      line-height:1.45;
    }

    .input-field:focus{
      border-color:rgba(56,189,248,.52);
      background:rgba(255,255,255,.08);
      box-shadow:0 0 0 4px rgba(56,189,248,.10), 0 0 22px rgba(56,189,248,.14);
    }

    .input-field::placeholder{
      color:rgba(248,251,255,.38);
      font-weight:700;
    }

    .send-btn{
      width:100%;
      min-height:58px;
      border-radius:19px;
      border:none;
      background:var(--btn);
      color:#07111f;
      font-weight:1000;
      font-size:16px;
      font-family:inherit;
      cursor:pointer;
      margin-top:4px;
      box-shadow:0 18px 34px rgba(37,99,235,.25);
      transition:.18s ease;
    }

    .send-btn:active{
      transform:scale(.985);
    }

    .info-row{
      display:flex;
      align-items:center;
      gap:13px;
      margin-top:20px;
      padding:14px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.045);
    }

    .icon-circle{
      width:46px;
      height:46px;
      border-radius:16px;
      background:rgba(56,189,248,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(56,189,248,.22);
      flex:0 0 auto;
    }

    .icon-circle svg{
      width:22px;
      height:22px;
      stroke:#7dd3fc;
    }

    .info-text{
      min-width:0;
    }

    .info-text div{
      font-size:10px;
      color:#7dd3fc;
      text-transform:uppercase;
      font-weight:1000;
      letter-spacing:1.4px;
      margin-bottom:4px;
    }

    .info-text span{
      font-size:15px;
      color:#fff;
      font-weight:800;
      word-break:break-word;
    }

    .notice{
      border-radius:22px;
      padding:14px;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(248,251,255,.64);
      font-size:12px;
      line-height:1.5;
      font-weight:700;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(24px + var(--safe-bottom));
      transform:translateX(-50%) translateY(120px);
      max-width:min(92vw,430px);
      min-height:44px;
      padding:11px 16px;
      border-radius:16px;
      background:rgba(12,25,44,.96);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:9999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      pointer-events:none;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:520px){
      #pageContent{
        padding:calc(16px + var(--safe-top)) 14px calc(20px + var(--safe-bottom));
      }

      .brand-main{
        font-size:28px;
      }

      h1{
        font-size:27px;
      }

      .contact-card{
        padding:16px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
  <div class="orb"></div>

  <main id="pageContent">
    <div class="topbar">
      <div class="brand">
        <div class="brand-main">italky<span class="ai">AI</span></div>
        <div class="brand-sub">BE FREE</div>
      </div>

      <button id="backBtn" class="back-btn" type="button">‹</button>
    </div>

    <section class="hero" id="heroHost"></section>

    <section class="contact-card" id="contentHost"></section>

    <div class="notice" id="noticeHost"></div>
  </main>

  <div id="toast" class="toast"></div>

  <template id="hero_tr">
    <div class="hero-badge">İletişim</div>
    <h1>Bize <span>Ulaşın</span></h1>
    <p>Sorularınız, önerileriniz, destek talepleriniz veya iş birliği için bizimle iletişime geçebilirsiniz.</p>
  </template>

  <template id="hero_en">
    <div class="hero-badge">Contact</div>
    <h1>Contact <span>Us</span></h1>
    <p>You can reach us for support, suggestions, questions, or collaboration requests.</p>
  </template>

  <template id="contact_tr">
    <div class="input-group">
      <input id="nameInput" type="text" class="input-field" placeholder="Adınız Soyadınız">
    </div>

    <div class="input-group">
      <input id="emailInput" type="email" class="input-field" placeholder="E-posta Adresiniz">
    </div>

    <div class="input-group">
      <textarea id="messageInput" class="input-field" placeholder="Mesajınız..."></textarea>
    </div>

    <button id="sendBtn" class="send-btn" type="button">Mesajı Gönder</button>

    <div class="info-row">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="info-text">
        <div>E-Posta</div>
        <span>support@italky.ai</span>
      </div>
    </div>
  </template>

  <template id="contact_en">
    <div class="input-group">
      <input id="nameInput" type="text" class="input-field" placeholder="Your Full Name">
    </div>

    <div class="input-group">
      <input id="emailInput" type="email" class="input-field" placeholder="Your Email Address">
    </div>

    <div class="input-group">
      <textarea id="messageInput" class="input-field" placeholder="Your Message..."></textarea>
    </div>

    <button id="sendBtn" class="send-btn" type="button">Send Message</button>

    <div class="info-row">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="info-text">
        <div>E-Mail</div>
        <span>support@italky.ai</span>
      </div>
    </div>
  </template>

  <script type="module">
    const heroHost = document.getElementById("heroHost");
    const contentHost = document.getElementById("contentHost");
    const noticeHost = document.getElementById("noticeHost");
    const backBtn = document.getElementById("backBtn");
    const toastEl = document.getElementById("toast");

    function getLang(){
      const raw =
        localStorage.getItem("site_lang") ||
        localStorage.getItem("italky_site_lang_v1") ||
        navigator.language ||
        "tr";

      const code = String(raw).toLowerCase().slice(0,2);
      return ["tr","en"].includes(code) ? code : "tr";
    }

    function toast(msg){
      if(!toastEl) return;

      toastEl.textContent = String(msg || "");
      toastEl.classList.add("show");

      clearTimeout(window.__contactToastTimer);
      window.__contactToastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2600);
    }

    function templateId(prefix){
      const lang = getLang();
      return `${prefix}_${lang}`;
    }

    function render(){
      const lang = getLang();

      heroHost.innerHTML = "";
      contentHost.innerHTML = "";
      noticeHost.innerHTML = "";

      const heroTpl = document.getElementById(templateId("hero")) || document.getElementById("hero_tr");
      const contactTpl = document.getElementById(templateId("contact")) || document.getElementById("contact_tr");

      heroHost.appendChild(heroTpl.content.cloneNode(true));
      contentHost.appendChild(contactTpl.content.cloneNode(true));

      noticeHost.textContent = lang === "en"
        ? "This form opens your email app and prepares your message. Your message is not sent automatically inside the browser."
        : "Bu form e-posta uygulamanızı açar ve mesajınızı hazırlar. Mesaj tarayıcı içinde otomatik gönderilmez.";

      document.title = lang === "en" ? "italkyAI • Contact" : "italkyAI • İletişim";

      bindSend();
    }

    function bindSend(){
      const lang = getLang();
      const sendBtn = document.getElementById("sendBtn");

      sendBtn?.addEventListener("click", () => {
        const name = document.getElementById("nameInput")?.value?.trim() || "";
        const email = document.getElementById("emailInput")?.value?.trim() || "";
        const message = document.getElementById("messageInput")?.value?.trim() || "";

        if(!name || !email || !message){
          toast(lang === "en" ? "Please fill in all fields." : "Lütfen tüm alanları doldurun.");
          return;
        }

        const subject = encodeURIComponent("italkyAI Contact");
        const body = encodeURIComponent(
`Ad / Name: ${name}
E-posta / Email: ${email}

Mesaj / Message:
${message}`
        );

        window.location.href = `mailto:support@italky.ai?subject=${subject}&body=${body}`;
      });
    }

    backBtn?.addEventListener("click", () => {
      if(history.length > 1){
        history.back();
        return;
      }

      location.href = "/pages/login.html";
    });

    window.addEventListener("storage", (e) => {
      if(e.key === "italky_site_lang_v1" || e.key === "site_lang"){
        render();
      }
    });

    render();
  </script>
</body>
</html>
