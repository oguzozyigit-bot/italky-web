<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Academy Terminal</title>

<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --neon-blue: #00d2ff;
  --neon-green: #39ff14;
  --neon-orange: #f97316;
  --glass-border: rgba(255,255,255,0.12);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 50%, #0d0d2b 0%, #000 100%);
  position: relative;
}

.main-hub {
  flex: 1; display: flex; flex-direction: column;
  gap: 15px; padding: 15px; min-height: 0;
}

/* =========================
   1) SEVİYE TESPİT PORTALI (ZİRVEYE)
========================= */
.portal-top {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0; cursor: pointer; position: relative;
}

.neural-scanner {
  width: 120px; height: 120px;
  position: relative; display: flex; align-items: center; justify-content: center;
}

/* Dönen Kuantum Halkaları */
.scanner-ring {
  position: absolute; inset: 0;
  border: 2px solid rgba(165, 180, 252, 0.2);
  border-radius: 50%;
}
.scanner-ring.outer { animation: rotate 10s linear infinite; border-style: dashed; }
.scanner-ring.inner { inset: 15px; border: 2px solid var(--ai-grad); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; animation: rotate 6s linear infinite reverse; }

/* Seviye Topları */
.level-dot {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 900; color: #fff; box-shadow: 0 0 15px currentColor;
}
.dot-a1 { top: -5px; background: var(--neon-green); color: var(--neon-green); }
.dot-c1 { bottom: -5px; background: var(--neon-blue); color: var(--neon-blue); }

.core-button {
  width: 70px; height: 70px; border-radius: 50%;
  background: #000; border: 2px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; z-index: 5; transition: 0.3s;
  box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.4);
}
.portal-top:active .core-button { transform: scale(0.9); box-shadow: 0 0 30px var(--neon-blue); }

.portal-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 800; color: #fff; margin: 12px 0 0; }
.portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* =========================
   2) AKADEMİ KARTLARI (PASTEL & DERİN)
========================= */
.hub-cards { flex: 1; display: flex; flex-direction: column; gap: 12px; }

.os-card {
  flex: 1; position: relative; border-radius: 28px;
  border: 1px solid var(--glass-border);
  overflow: hidden; cursor: pointer; display: flex; align-items: center;
  padding: 0 20px; background: var(--card-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.os-card:active { transform: scale(0.97) translateY(4px); border-color: var(--card-color); }

/* Renk Temaları */
.lesson-node { --card-color: var(--neon-blue); --card-bg: linear-gradient(145deg, rgba(0, 210, 255, 0.08), rgba(0,0,0,0.6)); }
.practice-node { --card-color: var(--neon-green); --card-bg: linear-gradient(145deg, rgba(57, 255, 20, 0.06), rgba(0,0,0,0.6)); }
.game-node { --card-color: var(--neon-orange); --card-bg: linear-gradient(145deg, rgba(249, 115, 22, 0.08), rgba(0,0,0,0.6)); }

/* Sol Neon Bar */
.os-card::before {
  content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px;
  background: var(--card-color); border-radius: 0 4px 4px 0; box-shadow: 0 0 15px var(--card-color);
}

.icon-box {
  width: 54px; height: 54px; border-radius: 18px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin-right: 18px; flex-shrink: 0;
  filter: drop-shadow(0 0 10px var(--card-color));
}

.card-info { flex: 1; }
.card-info h2 { font-family: 'Space Grotesk'; font-size: 19px; font-weight: 800; color: #fff; margin: 0; }
.card-info h2 span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-info p { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 5px; font-weight: 700; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.5px; }

@keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="portal-top" onclick="location.href='/pages/level_test_hub.html'">
      <div class="neural-scanner">
        <div class="scanner-ring outer"></div>
        <div class="scanner-ring inner"></div>
        <div class="level-dot dot-a1">A1</div>
        <div class="level-dot dot-c1">C1</div>
        <div class="core-button">💎</div>
      </div>
      <h1 class="portal-title">Seviye Tespit <span>Sınavı</span></h1>
      <p style="font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.3); margin-top: 5px; letter-spacing: 2px;">6 DİL • 40 DK • AKILLI ANALİZ</p>
    </div>

    <div class="hub-cards">

      <div class="os-card lesson-node" onclick="location.href='/pages/teacher_select.html'">
        <div class="icon-box">📚</div>
        <div class="card-info">
          <h2>Dil Dersi <span>AI</span></h2>
          <p>Seviye Odaklı Müfredat • 15 Dakikalık Akıllı Oturumlar</p>
        </div>
      </div>

      <div class="os-card practice-node" onclick="location.href='/pages/practice_ai.html'">
        <div class="icon-box">🎙️</div>
        <div class="card-info">
          <h2>AI ile <span>Pratik</span></h2>
          <p>Konuş ve Dinle • Gerçek Zamanlı Telaffuz Analizi</p>
        </div>
      </div>

      <div class="os-card game-node" onclick="location.href='/pages/game_lang_select.html'">
        <div class="icon-box">🎯</div>
        <div class="card-info">
          <h2>Eğlenerek <span>Öğren</span></h2>
          <p>Dil Refleks Oyunları • Kelime Haznesi Geliştirme</p>
        </div>
      </div>

    </div>
  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
