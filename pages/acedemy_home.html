<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Academy Ultra</title>

<style>
  /* 🛡️ SIFIR KIRPILMA + SİNEMATİK GİRİŞ */
  html { background: #000 !important; }
  body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Outfit', sans-serif; color: #fff; }
  
  #pageContent { 
    opacity: 0; transform: scale(0.9) translateY(30px); filter: brightness(0.5);
    transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #pageContent.shell-ready { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }

  :root {
    --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
    --blue: #00f2ff; --green: #00ff88; --pink: #ff007f;
    --glass: rgba(255, 255, 255, 0.03);
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&family=Space+Grotesk:wght@700&display=swap');

  #pageContent {
    height: 100%; display: flex; flex-direction: column;
    background: radial-gradient(circle at 50% 50%, #101035 0%, #000 100%);
  }

  .main-hub { flex: 1; display: flex; flex-direction: column; padding: 25px; gap: 20px; }

  /* 💎 1. SEVİYE TESPİT: CANLI VERİ ÇEKİRDEĞİ */
  .portal-top {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    padding: 15px 0; cursor: pointer;
  }
  .neural-core {
    width: 140px; height: 140px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  /* Dönen Enerji Halkaları */
  .core-ring {
    position: absolute; inset: 0; border: 1.5px solid var(--blue);
    border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
    animation: morphCore 10s linear infinite; opacity: 0.4;
  }
  .core-ring.inner {
    inset: 15px; border-color: var(--pink); animation-duration: 7s; animation-direction: reverse;
  }
  .core-data {
    width: 70px; height: 70px; background: var(--ai-grad); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
    box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);
    animation: corePulse 2s infinite alternate ease-in-out;
  }
  .portal-title { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 900; margin-top: 15px; }
  .portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* 🚀 2. ÖZEL İKONLU KARTLAR (ARALIKLI & GÖRKEMLİ) */
  .hub-cards { flex: 1; display: flex; flex-direction: column; gap: 18px; /* Butonlar arası nefes alan boşluk */ }

  .os-card {
    flex: 1; position: relative; border-radius: 32px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; padding: 0 25px;
    background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
  }
  .os-card:active { transform: scale(0.96) translateY(5px); background: rgba(255,255,255,0.06); }

  /* Özel CSS İkonlar (Hazır Değil!) */
  .custom-icon {
    width: 70px; height: 70px; margin-right: 20px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  
  /* Ders İkonu: Geometrik Prism */
  .icon-prism {
    width: 35px; height: 35px; background: var(--blue);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: rotate3d 4s infinite linear; box-shadow: 0 0 20px var(--blue);
  }
  /* Pratik İkonu: Nöral Sinyal */
  .icon-signal {
    width: 40px; height: 40px; border: 2px solid var(--green); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-signal::after {
    content: ""; width: 10px; height: 10px; background: var(--green); border-radius: 50%;
    box-shadow: 0 0 20px var(--green); animation: signalRadar 1.5s infinite;
  }
  /* Oyun İkonu: Pulsar */
  .icon-pulsar {
    width: 30px; height: 30px; background: var(--pink); transform: rotate(45deg);
    animation: pulsarAnim 1s infinite alternate; box-shadow: 0 0 20px var(--pink);
  }

  /* Bilgi Alanı */
  .card-info h2 { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; margin: 0; }
  .card-info p { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; font-weight: 700; letter-spacing: 1px; }

  /* --- ANİMASYONLAR --- */
  @keyframes morphCore {
    0% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: rotate(0deg); }
    100% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: rotate(360deg); }
  }
  @keyframes corePulse { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.1); filter: brightness(1.3); } }
  @keyframes rotate3d { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  @keyframes signalRadar { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
  @keyframes pulsarAnim { from { transform: rotate(45deg) scale(0.8); } to { transform: rotate(45deg) scale(1.2); } }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="portal-top" onclick="location.href='/pages/level_test_hub.html'">
      <div class="neural-core">
        <div class="core-ring"></div>
        <div class="core-ring inner"></div>
        <div class="core-data">💎</div>
      </div>
      <h1 class="portal-title">Seviye Tespit <span>Sınavı</span></h1>
      <p style="font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.3); letter-spacing: 3px; margin-top: 8px;">QUANTUM ANALYZER • 2026</p>
    </div>

    <div class="hub-cards">

      <div class="os-card" onclick="location.href='/pages/teacher_select.html'">
        <div class="custom-icon">
          <div class="icon-prism"></div>
        </div>
        <div class="card-info">
          <h2>Dil Dersi <span style="color:var(--blue)">AI</span></h2>
          <p>MODÜLER MÜFREDAT • 15 DK SEANS</p>
        </div>
      </div>

      <div class="os-card" onclick="location.href='/pages/practice_ai.html'">
        <div class="custom-icon">
          <div class="icon-signal"></div>
        </div>
        <div class="card-info">
          <h2>AI ile <span style="color:var(--green)">Pratik</span></h2>
          <p>NÖRAL ANALİZ • GERÇEK ZAMANLI</p>
        </div>
      </div>

      <div class="os-card" onclick="location.href='/pages/game_lang.html'">
        <div class="custom-icon">
          <div class="icon-pulsar"></div>
        </div>
        <div class="card-info">
          <h2>Eğlenerek <span style="color:var(--pink)">Öğren</span></h2>
          <p>REFLEKS OYUNLARI • KELİME HAZNESİ</p>
        </div>
      </div>

    </div>
  </div>
</main>



<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
  
  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("pageContent").classList.add("shell-ready");
    }, 150);
  });
</script>
</body>
</html>
