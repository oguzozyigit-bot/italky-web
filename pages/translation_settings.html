<!-- FILE: /pages/translation_settings.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Site Dili</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --txt:rgba(255,255,255,.96);
  --muted:rgba(255,255,255,.56);
  --panel-bg:rgba(255,255,255,.04);
  --panel-border:rgba(255,255,255,.10);
  --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --accent:#a5b4fc;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#070710;
  color:var(--txt);
  font-family:'Outfit',sans-serif;
}

body{
  background:
    radial-gradient(circle at 80% 10%, rgba(244,114,182,.10), transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(99,102,241,.10), transparent 40%),
    linear-gradient(180deg,#080812 0%,#0e0e18 100%);
}

#pageContent{
  max-width:560px;
  margin:0 auto;
  padding:16px 14px 20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.topRow{
  display:flex;
  align-items:center;
  gap:12px;
}

.backBtn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid var(--panel-border);
  background:rgba(255,255,255,.05);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
}

.backBtn:active{ transform:scale(.96); }

.backBtn svg{
  width:20px;
  height:20px;
  stroke:#fff;
  fill:none;
  stroke-width:2.5;
}

.pageHead{
  min-width:0;
}

.pageKicker{
  display:inline-flex;
  width:max-content;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--panel-border);
  font-size:11px;
  font-weight:800;
  letter-spacing:.5px;
  color:rgba(255,255,255,.82);
  margin-bottom:8px;
}

.pageTitle{
  margin:0;
  font-family:'Space Grotesk',sans-serif;
  font-size:27px;
  line-height:1;
  letter-spacing:-1px;
  font-weight:700;
}

.pageTitle .ai{
  background:var(--ai-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.pageSub{
  margin:8px 0 0;
  font-size:12px;
  line-height:1.45;
  color:var(--muted);
}

.panel{
  background:linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid var(--panel-border);
  border-radius:28px;
  padding:14px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.panelTitle{
  margin:0 0 12px;
  font-family:'Space Grotesk',sans-serif;
  font-size:18px;
  font-weight:900;
  color:#fff;
}

.settingCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;
}

.settingLeft{
  min-width:0;
}

.settingLabel{
  font-size:13px;
  font-weight:900;
  color:#fff;
  margin-bottom:4px;
}

.settingDesc{
  font-size:11px;
  line-height:1.4;
  color:rgba(255,255,255,.56);
}

.settingValue{
  max-width:45%;
  text-align:right;
  font-size:13px;
  font-weight:900;
  color:var(--accent);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chev{
  color:#fff;
  opacity:.7;
  font-size:18px;
  flex:0 0 auto;
}

.note{
  font-size:11px;
  font-weight:800;
  color:rgba(255,255,255,.55);
  line-height:1.5;
}

.sheetBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:none;
  z-index:1000;
}

.sheetBackdrop.show{ display:block; }

.sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-width:560px;
  margin:0 auto;
  background:linear-gradient(180deg,rgba(24,24,36,.98),rgba(10,10,18,.99));
  border-radius:28px 28px 0 0;
  border:1px solid rgba(255,255,255,.10);
  border-bottom:none;
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  display:none;
  z-index:1001;
  box-shadow:0 -20px 60px rgba(0,0,0,.45);
}

.sheet.show{ display:block; }

.sheetHandle{
  width:48px;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  margin:2px auto 12px;
}

.sheetTitle{
  margin:0 0 12px;
  font-family:'Space Grotesk',sans-serif;
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.sheetList{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:56vh;
  overflow:auto;
  scrollbar-width:none;
}
.sheetList::-webkit-scrollbar{ display:none; }

.sheetItem{
  min-height:56px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 14px;
  cursor:pointer;
  color:#fff;
  font-weight:900;
}

.sheetItem.active{
  border-color:rgba(165,180,252,.35);
  background:rgba(99,102,241,.14);
}

.sheetItemMeta{
  min-width:0;
}

.sheetItemTitle{
  font-size:14px;
  font-weight:900;
  color:#fff;
}

.sheetItemSub{
  margin-top:3px;
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.58);
}

.sheetItemCheck{
  width:24px;
  height:24px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,.30);
  flex:0 0 auto;
}

.sheetItem.active .sheetItemCheck{
  border-color:#9fe7ea;
  box-shadow:inset 0 0 0 5px #9fe7ea;
}

.toast{
  position:fixed;
  left:50%;
  top:18px;
  transform:translateX(-50%) translateY(-120px);
  background:rgba(10,10,18,.94);
  border:1px solid rgba(165,180,252,.32);
  padding:10px 14px;
  border-radius:999px;
  color:#fff;
  z-index:9999;
  font-weight:900;
  font-size:12px;
  transition:.25s;
  backdrop-filter:blur(12px);
  pointer-events:none;
  max-width:min(92vw,520px);
  text-align:center;
}
.toast.show{ transform:translateX(-50%) translateY(0); }

@media (max-width:390px){
  #pageContent{ padding:12px 12px 18px; }
  .pageTitle{ font-size:24px; }
}
</style>
</head>
<body>

<div id="pageContent">

  <div class="topRow">
    <button class="backBtn" id="backBtn" type="button" aria-label="Geri dön">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="pageHead">
      <div class="pageKicker">Language</div>
      <h1 class="pageTitle">Site <span class="ai">Dili</span></h1>
      <p class="pageSub">Uygulama arayüzünün hangi dilde gösterileceğini seç.</p>
    </div>
  </div>

  <div class="panel">
    <h2 class="panelTitle">Arayüz Dili</h2>

    <div class="settingCard" id="langSettingBtn" role="button" tabindex="0">
      <div class="settingLeft">
        <div class="settingLabel">Site Dili</div>
        <div class="settingDesc">Menüler, sistem metinleri ve uygulama içi arayüz dili.</div>
      </div>
      <div class="settingValue" id="langValue">Türkçe</div>
      <div class="chev">⌄</div>
    </div>
  </div>

  <div class="panel">
    <div class="note">
      Buradaki seçim uygulamanın arayüz dilini belirler. Ses seçimi artık ayrı olarak “Sesini Oluştur” sayfasından yönetilir.
    </div>
  </div>

</div>

<div class="sheetBackdrop" id="sheetBackdrop"></div>

<div class="sheet" id="optionSheet" aria-hidden="true">
  <div class="sheetHandle"></div>
  <div class="sheetTitle" id="sheetTitle">Site Dili</div>
  <div class="sheetList" id="sheetList"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

try{
  mountShell({ scroll:"auto" });
}catch(e){
  console.warn("[site language shell]", e);
}

const $ = (id) => document.getElementById(id);

const backBtn = $("backBtn");
const langSettingBtn = $("langSettingBtn");
const langValue = $("langValue");

const sheetBackdrop = $("sheetBackdrop");
const optionSheet = $("optionSheet");
const sheetTitle = $("sheetTitle");
const sheetList = $("sheetList");
const toastEl = $("toast");

const STORAGE_KEY = "system_lang";

const LANGUAGE_OPTIONS = [
  { value: "tr", label: "Türkçe", sub: "Türkçe arayüz" },
  { value: "en", label: "English", sub: "English interface" },
  { value: "de", label: "Deutsch", sub: "Deutsche Oberfläche" },
  { value: "fr", label: "Français", sub: "Interface française" },
  { value: "it", label: "Italiano", sub: "Interfaccia italiana" },
  { value: "es", label: "Español", sub: "Interfaz en español" }
];

function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = String(msg || "");
  toastEl.classList.add("show");
  clearTimeout(window.__langToast);
  window.__langToast = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 1800);
}

function getStoredValue(key, fallback){
  try{
    return localStorage.getItem(key) || fallback;
  }catch{
    return fallback;
  }
}

function setStoredValue(key, value){
  try{
    localStorage.setItem(key, value);
  }catch{}
}

function langLabelOf(value){
  return LANGUAGE_OPTIONS.find(x => x.value === value)?.label || "Türkçe";
}

function syncUI(){
  const langPref = getStoredValue(STORAGE_KEY, "tr");
  if(langValue) langValue.textContent = langLabelOf(langPref);
}

function openSheet(){
  const currentVal = getStoredValue(STORAGE_KEY, "tr");

  if(sheetTitle){
    sheetTitle.textContent = "Site Dili";
  }

  if(!sheetList || !optionSheet || !sheetBackdrop) return;

  sheetList.innerHTML = LANGUAGE_OPTIONS.map(opt => `
    <div class="sheetItem ${String(opt.value) === String(currentVal) ? "active" : ""}" data-value="${opt.value}">
      <div class="sheetItemMeta">
        <div class="sheetItemTitle">${opt.label}</div>
        <div class="sheetItemSub">${opt.sub}</div>
      </div>
      <div class="sheetItemCheck"></div>
    </div>
  `).join("");

  optionSheet.classList.add("show");
  sheetBackdrop.classList.add("show");
  optionSheet.setAttribute("aria-hidden", "false");

  sheetList.querySelectorAll(".sheetItem").forEach(item => {
    item.addEventListener("click", () => {
      const value = item.dataset.value;
      saveSetting(value);
      closeSheet();
    });
  });
}

function closeSheet(){
  optionSheet?.classList.remove("show");
  sheetBackdrop?.classList.remove("show");
  optionSheet?.setAttribute("aria-hidden", "true");
}

async function saveSetting(value){
  const finalValue = String(value || "tr").trim().toLowerCase();

  setStoredValue(STORAGE_KEY, finalValue);

  try{
    const { data: { user } } = await supabase.auth.getUser();

    if(user?.id){
      const { error } = await supabase
        .from("profiles")
        .update({
          system_lang: finalValue,
          updated_at: new Date().toISOString()
        })
        .eq("id", user.id);

      if(error){
        console.warn("[site language save]", error);
      }
    }
  }catch(e){
    console.warn("[site language user save]", e);
  }

  syncUI();
  toast("Site dili güncellendi");
}

async function hydrateFromProfile(){
  try{
    const { data: { user } } = await supabase.auth.getUser();
    if(!user?.id){
      syncUI();
      return;
    }

    const { data, error } = await supabase
      .from("profiles")
      .select("system_lang")
      .eq("id", user.id)
      .maybeSingle();

    if(error){
      console.warn("[site language profile read]", error);
      syncUI();
      return;
    }

    if(data?.system_lang){
      setStoredValue(STORAGE_KEY, data.system_lang);
    }

    syncUI();
  }catch(e){
    console.warn("[site language hydrate]", e);
    syncUI();
  }
}

backBtn?.addEventListener("click", () => history.back());
langSettingBtn?.addEventListener("click", openSheet);
sheetBackdrop?.addEventListener("click", closeSheet);

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeSheet();
});

hydrateFromProfile();
</script>

</body>
</html>
