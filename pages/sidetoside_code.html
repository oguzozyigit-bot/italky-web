<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Bağlantı Kodu Gir</title>
<meta name="theme-color" content="#120d16"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
/* aynen bırakıldı */
</style>
</head>
<body>

<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <h1 class="title">Bağlantı Kodu Gir</h1>
      <p class="sub">
        Karşı taraftaki 6 karakterli bağlantı kodunu gir. Oda bulunduğunda doğrudan bağlanırsın.
      </p>
    </section>

    <section class="entry-card">
      <div class="code-label">Bağlantı Kodu</div>

      <input id="codeInput" class="code-input"
        type="text" maxlength="6"
        placeholder="ABC123"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      />

      <div id="statusText" class="status">Kod bekleniyor...</div>

      <div class="btn-row">
        <button id="joinBtn" class="btn btn-primary">Odaya Katıl</button>
        <button id="backBtn" class="btn btn-dark">Geri Dön</button>
      </div>
    </section>

  </div>
</main>

<div class="toast" id="pageToast"></div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"auto" });
</script>

<script type="module">

const API_BASE = "https://italky-api.onrender.com/api";

const codeInput = document.getElementById("codeInput");
const joinBtn = document.getElementById("joinBtn");
const backBtn = document.getElementById("backBtn");
const statusText = document.getElementById("statusText");
const toastEl = document.getElementById("pageToast");

const ROOM_KEY = "italky_active_interpreter_room_id";
const ROOM_CODE_KEY = "italky_active_interpreter_code";

/* =========================
   UI HELPERS
========================= */
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1500);
}

function setStatus(text, type=""){
  statusText.className = "status";
  if(type) statusText.classList.add(type);
  statusText.textContent = text;
}

function normalize(code){
  return String(code||"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"")
    .slice(0,6);
}

function setBusy(v){
  joinBtn.disabled = v;
  joinBtn.textContent = v ? "Oda aranıyor..." : "Odaya Katıl";
}

/* =========================
   REDIRECT
========================= */
function goLive(roomId, code){
  if(!roomId) return;

  localStorage.setItem(ROOM_KEY, roomId);
  localStorage.setItem(ROOM_CODE_KEY, code);

  location.href =
    `/pages/live_interpreter.html?room=${encodeURIComponent(roomId)}&role=guest&my=tr&auto=1`;
}

/* =========================
   API
========================= */
async function resolveRoom(code){
  const r = await fetch(`${API_BASE}/interpreter/resolve-room`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      host_code: code,
      my_lang: "tr",
      mode: "interpreter"
    })
  });

  const j = await r.json().catch(()=>({}));

  if(!r.ok || !j?.room_id){
    throw new Error("Kod eşleşmedi");
  }

  return j.room_id;
}

/* =========================
   JOIN FLOW
========================= */
async function join(){
  const code = normalize(codeInput.value);
  codeInput.value = code;

  if(code.length !== 6){
    setStatus("Kod 6 karakter olmalı","bad");
    toast("Eksik kod");
    return;
  }

  setBusy(true);
  setStatus("Oda aranıyor...","warn");

  try{
    const roomId = await resolveRoom(code);

    setStatus("Bağlanılıyor...","good");
    toast("Bağlandı");

    goLive(roomId, code);

  }catch(e){
    setStatus("Kod bulunamadı","bad");
    toast("Geçersiz kod");
  }

  setBusy(false);
}

/* =========================
   INPUT EVENTS
========================= */
codeInput.addEventListener("input",()=>{
  const c = normalize(codeInput.value);
  codeInput.value = c;

  if(c.length === 6){
    setStatus("Hazır","good");
  }else{
    setStatus("Kod giriliyor...","warn");
  }
});

codeInput.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){
    e.preventDefault();
    join();
  }
});

joinBtn.addEventListener("click", join);

backBtn.addEventListener("click",()=>{
  location.href="/pages/sidetoside_entry.html";
});

/* =========================
   QR / AUTO FLOW 🔥
========================= */
(function init(){

  const params = new URLSearchParams(location.search);

  const code = normalize(params.get("code"));
  const room = params.get("room");
  const auto = params.get("auto")==="1";
  const appRequired = params.get("app")==="required";
  const source = params.get("source");

  // 👉 QR'dan gelmiş ama app yoksa
  if(source==="qr" && appRequired){
    // Webview değilse (browser)
    if(!window.Native){
      alert("Bu özelliği kullanabilmek için italkyAI uygulaması gereklidir.");
      return;
    }
  }

  if(code){
    codeInput.value = code;
    setStatus("Kod hazır","good");
  }

  // 🔥 otomatik giriş
  if(auto && room){
    goLive(room, code);
  }

})();

</script>

</body>
</html>
