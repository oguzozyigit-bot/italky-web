<!-- FILE: /pages/interpreter.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>

<title>italkyAI • Interpreter Mode</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
height:100%;
background:#000;
font-family:'Outfit',sans-serif;
overflow:hidden;
}

:root{
--ai-grad:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
}

#pageContent{
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:24px;
padding:20px;
text-align:center;
background:radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
}

/* Title */

.title{
font-family:"Space Grotesk";
font-size:30px;
font-weight:900;
color:#fff;
}

.title .ai{
background:var(--ai-grad);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Card */

.card{
width:100%;
max-width:420px;
border-radius:28px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.05);
backdrop-filter:blur(25px);
padding:28px;
display:flex;
flex-direction:column;
gap:20px;
}

/* Buttons */

.btn{
height:56px;
border-radius:16px;
border:none;
cursor:pointer;
font-weight:800;
font-size:15px;
}

.btn-main{
background:var(--ai-grad);
color:#000;
}

.btn-secondary{
background:rgba(255,255,255,.08);
color:#fff;
border:1px solid rgba(255,255,255,.15);
}

/* Lang */

.lang{
height:52px;
border-radius:14px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
color:#fff;
font-size:14px;
padding:0 14px;
}

/* Description */

.desc{
font-size:12px;
color:rgba(255,255,255,.5);
line-height:1.4;
}

/* Icon */

.icon{
font-size:40px;
}
</style>
</head>

<body>

<main id="pageContent">

<div class="title">
Interpreter <span class="ai">AI</span>
</div>

<div class="card">

<div class="icon">🎧</div>

<select id="myLang" class="lang">
<option value="tr">🇹🇷 Türkçe</option>
<option value="en">🇬🇧 English</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="fr">🇫🇷 Français</option>
<option value="it">🇮🇹 Italiano</option>
<option value="es">🇪🇸 Español</option>
</select>

<button class="btn btn-main" id="createRoom">
Yeni Tercüman Oturumu Başlat
</button>

<button class="btn btn-secondary" id="joinRoom">
QR ile Katıl
</button>

<div class="desc">
Kulaklık kullanmanız önerilir.  
Konuşmalar anında çevrilerek karşı tarafın kulaklığına iletilir.
</div>

</div>

</main>

<script type="module" src="/js/interpreter_page.js"></script>

</body>
</html>
