<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Interpreter AI</title>
  <meta name="theme-color" content="#000000">
  <style>
    html,body{background:#000 !important;margin:0;padding:0;overflow:hidden;font-family:'Outfit',sans-serif;}
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --glass-border: rgba(255,255,255,.12);
      --glass-bg: rgba(255,255,255,.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
    #pageContent{
      min-height:100%;
      display:flex;
      flex-direction:column;
      padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
      background:
        radial-gradient(circle at 50% 18%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 38%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.12) 0%, rgba(0,0,0,0) 28%),
        #000;
      gap:14px;
      max-width:560px;
      margin:0 auto;
    }
    .hero{text-align:center;padding-top:10px}
    .title{font-family:'Space Grotesk';font-size:30px;font-weight:900;color:#fff}
    .title .ai{background:var(--ai-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .desc{font-size:12px;line-height:1.45;color:rgba(255,255,255,.55);max-width:420px;margin:8px auto 0}
    .panel{
      background:var(--glass-bg);
      border:1px solid var(--glass-border);
      border-radius:28px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .label{font-size:11px;font-weight:900;color:#a5b4fc;letter-spacing:.4px;text-transform:uppercase}
    .select{
      width:100%;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);color:#fff;padding:0 14px;font-size:14px;font-weight:800;appearance:none;
    }
    .select option{color:#111}
    .miniInfo{
      min-height:48px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:10px 12px;
      gap:3px;
    }
    .miniInfo .k{font-size:10px;color:rgba(255,255,255,.46);font-weight:900;letter-spacing:.3px;text-transform:uppercase}
    .miniInfo .v{font-size:13px;color:#fff;font-weight:900;word-break:break-all}
    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{
      min-height:54px;border:none;border-radius:18px;cursor:pointer;font-size:14px;font-weight:1000;letter-spacing:.2px;
    }
    .btnMain{background:var(--ai-grad);color:#050510}
    .btnGhost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff}
  </style>
</head>
<body>
<main id="pageContent">
  <section class="hero">
    <div class="title">Interpreter <span class="ai">AI</span></div>
    <p class="desc">Kendi sabit Interpreter QR kodunu kullan. Karşı taraf okutunca aynı odaya gelir. Dil seçimi bu ekranda kalır.</p>
  </section>

  <section class="panel">
    <div class="label">Benim Dilim</div>
    <select id="myLang" class="select"></select>

    <div class="miniInfo">
      <div class="k">Sabit Interpreter Kodun</div>
      <div class="v" id="hostCodeText">Hazırlanıyor...</div>
    </div>

    <div class="btnRow">
      <button class="btn btnMain" id="createQrBtn" type="button">Benim QR Kodum</button>
      <button class="btn btnGhost" id="scanQrBtn" type="button">QR Oku</button>
    </div>
  </section>
</main>

<script type="module" src="/js/interpreter_page.js?v=stable_qr_1"></script>
</body>
</html>
