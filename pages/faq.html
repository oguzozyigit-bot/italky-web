<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • SSS</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon: #00f2ff;
      --pink: #ff007a;
      --ai-grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 50%, #ff007a 100%);
      --bg: #060408;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; }

    /* --- CANLI ARKA PLAN (italkyAI DNA) --- */
    .bg-layer {
      position: fixed; inset: 0; z-index: 1;
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
        linear-gradient(180deg, #0f0816 0%, #060408 100%);
    }

    .crystal-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      perspective: 1200px; pointer-events: none; z-index: 2;
    }

    .crystal-cage {
      width: 300px; height: 300px; transform-style: preserve-3d;
      animation: rotateCrystal 22s linear infinite; opacity: 0.15;
    }

    .side {
      position: absolute; inset: 0; border: 1.5px solid var(--neon);
      background: radial-gradient(circle, rgba(0, 242, 255, 0.05), transparent);
    }
    .s1{ transform:rotateY(0deg) translateZ(150px); }
    .s2{ transform:rotateY(90deg) translateZ(150px); }
    .s3{ transform:rotateX(90deg) translateZ(150px); }

    @keyframes rotateCrystal {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(720deg); }
    }

    /* --- MOBILE FRAME & CONTENT --- */
    .mobile-frame {
      width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto;
      position: relative; z-index: 10; display: flex; flex-direction: column;
      overflow: hidden;
    }

    .top-nav {
      display: flex; align-items: center; gap: 15px; padding: 20px;
      position: sticky; top: 0; z-index: 30;
    }

    .btn-back {
      background: transparent; border: none; color: #fff; font-size: 24px;
      font-weight: 900; cursor: pointer; display: flex; align-items: center;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 800;
      background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .page-content {
      flex: 1; overflow-y: auto; padding: 0 20px 140px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .page-content::-webkit-scrollbar { display: none; }

    /* --- FAQ COMPONENTS --- */
    .hero { margin-bottom: 25px; text-align: center; }
    .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }
    .hero h1 span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }

    .search-wrap { margin: 20px 0; position: relative; }
    .search-input {
      width: 100%; height: 54px; border-radius: 20px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.05);
      color: #fff; font-family: inherit; font-size: 15px; padding: 0 50px 0 20px;
      transition: 0.3s; backdrop-filter: blur(10px);
    }
    .search-input:focus { border-color: var(--neon); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

    .faq-card {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 32px; padding: 25px 20px; backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .faq-section-title {
      display: flex; align-items: center; gap: 10px; margin: 30px 0 15px;
      color: var(--neon); font-size: 12px; font-weight: 900; letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .faq-item { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 18px 0; transition: 0.3s; }
    .faq-item.hidden { display: none; }

    .faq-q { font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; line-height: 1.4; }
    .faq-q::after { content: "＋"; font-size: 18px; color: var(--neon); transition: 0.3s; }

    .faq-a { max-height: 0; overflow: hidden; opacity: 0; font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.6; transition: 0.4s var(--ease-soft); }
    
    .faq-item.active .faq-a { max-height: 1000px; opacity: 1; padding-top: 15px; }
    .faq-item.active .faq-q::after { content: "－"; transform: rotate(180deg); }

    .example-box { background: rgba(255,255,255,0.04); border-radius: 16px; padding: 15px; margin-top: 12px; border-left: 3px solid var(--pink); }
    .ex-label { font-size: 10px; font-weight: 900; color: var(--pink); text-transform: uppercase; margin-bottom: 5px; display: block; }
    .ex-good { color: var(--neon); font-weight: 700; }

    .tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
    .tag.ai { background: rgba(0, 242, 255, 0.1); color: var(--neon); }
    .tag.pro { background: rgba(255, 0, 122, 0.1); color: var(--pink); }

    /* --- FOOTER --- */
    .footer-bar { position: absolute; bottom: 0; width: 100%; padding: 25px; background: linear-gradient(to top, var(--bg) 60%, transparent); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 40; }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
    .footer-links a.active { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
    .footer-copy { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 700; }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="crystal-wrap">
    <div class="crystal-cage">
      <div class="side s1"></div>
      <div class="side s2"></div>
      <div class="side s3"></div>
    </div>
  </div>

  <div class="mobile-frame">
    <div class="top-nav">
      <button class="btn-back" id="backBtn">←</button>
      <div class="brand">italkyAI</div>
    </div>

    <div class="page-content" id="contentHost"></div>

    <div class="footer-bar">
      <div class="footer-links">
        <a href="/pages/about.html">About</a>
        <a href="/pages/faq.html" class="active">FAQ</a>
        <a href="/pages/privacy.html">Privacy</a>
      </div>
      <div class="footer-copy">italkyAI By <b>Ozyigit's</b> • 2026</div>
    </div>
  </div>

  <template id="faq_tr">
    <div class="hero">
      <h1>Sıkça Sorulan <span>Sorular</span></h1>
      <p>Modüllerimiz, offline kullanım ve jeton sistemi hakkında merak edilen her şey.</p>
      
      <div class="search-wrap">
        <input id="faqSearch" class="search-input" type="text" placeholder="Soru veya kelime ara..." autocomplete="off">
      </div>
    </div>

    <div class="faq-card">
      <div class="faq-section-title">Kültürel Zeka</div>
      <div class="faq-item active" data-search="kültürel çeviri atasözü deyim">
        <span class="tag ai">KÜLTÜREL</span>
        <div class="faq-q">italkyAI "Kültürel Çeviri"yi nasıl yapar?</div>
        <div class="faq-a">
          italkyAI sadece kelimeleri değil, <strong>anlamı ve kültürü</strong> çevirir. Atasözlerini hedef dildeki en doğal karşılığıyla eşleştirir.
          <div class="example-box">
            <span class="ex-label">Örnek</span>
            <div><strong>TR:</strong> "Sakla samanı gelir zamanı."</div>
            <div class="ex-good">italkyAI: "Save it for a rainy day."</div>
          </div>
        </div>
      </div>

      <div class="faq-section-title">Offline & Jeton</div>
      <div class="faq-item" data-search="offline internet paket indir">
        <span class="tag pro">OFFLINE</span>
        <div class="faq-q">Offline diller nasıl çalışır?</div>
        <div class="faq-a">Cihazınıza indirebileceğiniz <strong>67 farklı dil paketi</strong> sayesinde internetin olmadığı yerlerde (uçak, yurt dışı vb.) çeviri yapabilirsiniz.</div>
      </div>

      <div class="faq-item" data-search="jeton token ücret bakiye">
        <span class="tag pro">JETON SİSTEMİ</span>
        <div class="faq-q">Jetonlar ne için kullanılır?</div>
        <div class="faq-a">italkyAI içindeki tüm modüller (çeviri, canlı toplantı, sesli işlemler) <strong>jeton mantığıyla</strong> çalışır. Kullanımınıza göre bakiye tüketilir.</div>
      </div>
    </div>
  </template>

  <script type="module">
    function render() {
      const host = document.getElementById("contentHost");
      const tpl = document.getElementById("faq_tr");
      host.innerHTML = "";
      host.appendChild(tpl.content.cloneNode(true));

      // Arama ve Akordeon Mantığı
      const items = host.querySelectorAll(".faq-item");
      const searchInput = host.querySelector("#faqSearch");

      items.forEach(item => {
        item.querySelector(".faq-q").onclick = () => {
          const isActive = item.classList.contains("active");
          items.forEach(i => i.classList.remove("active"));
          if (!isActive) item.classList.add("active");
        };
      });

      searchInput.oninput = (e) => {
        const q = e.target.value.toLowerCase();
        items.forEach(item => {
          const matched = item.innerText.toLowerCase().includes(q) || item.dataset.search.includes(q);
          item.classList.toggle("hidden", !matched);
        });
      };
    }

    render();

    document.getElementById("backBtn").onclick = () => {
      if(history.length > 1) history.back();
      else location.href = "/pages/home.html";
    };
  </script>
</body>
</html>
