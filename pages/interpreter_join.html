<!-- FILE: /pages/interpreter_join.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>italkyAI • Odaya Katıl</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --txt: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.10);
      --glass: rgba(255,255,255,.05);
      --bg:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 32%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.10) 0%, rgba(0,0,0,0) 22%),
        linear-gradient(180deg,#090919 0%, #020207 100%);
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#000;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      overflow:hidden;
    }

    body{
      background:var(--bg);
    }

    .page{
      width:100%;
      min-height:100dvh;
      max-width:560px;
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 20px)
        18px
        calc(env(safe-area-inset-bottom) + 24px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:100%;
      border-radius:32px;
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:0 24px 60px rgba(0,0,0,.30);
      padding:30px 22px;
      text-align:center;
    }

    .brand{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:700;
      margin:0 0 8px;
      letter-spacing:-.4px;
    }

    .brand .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .title{
      margin:0;
      font-size:24px;
      font-weight:900;
      letter-spacing:-.4px;
    }

    .desc{
      margin:10px auto 0;
      max-width:330px;
      font-size:13px;
      line-height:1.55;
      color:var(--muted);
    }

    .loaderWrap{
      margin:28px auto 18px;
      width:114px;
      height:114px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      padding:2px;
      background:var(--ai-grad);
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      animation:spin 2.2s linear infinite;
      opacity:.95;
    }

    .core{
      width:76px;
      height:76px;
      border-radius:50%;
      background:#050510;
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 26px rgba(99,102,241,.12);
      position:relative;
    }

    .dots{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#a5b4fc;
      animation:bounce 1s infinite ease-in-out;
    }

    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.30s; }

    .statusCard{
      margin-top:10px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      padding:14px;
      display:flex;
      align-items:center;
      gap:10px;
      text-align:left;
    }

    .statusDot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:var(--warn);
      box-shadow:0 0 14px rgba(245,158,11,.55);
      flex:0 0 auto;
    }

    .statusDot.ok{
      background:var(--ok);
      box-shadow:0 0 14px rgba(34,197,94,.55);
    }

    .statusDot.err{
      background:var(--danger);
      box-shadow:0 0 14px rgba(239,68,68,.55);
    }

    .statusText{
      font-size:13px;
      font-weight:800;
      line-height:1.45;
      color:#fff;
    }

    .helper{
      margin-top:14px;
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:18px;
    }

    .btn{
      min-height:50px;
      border:none;
      border-radius:18px;
      font-family:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .18s ease, opacity .18s ease;
    }

    .btn:active{
      transform:scale(.985);
    }

    .btnGhost{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .hidden{
      display:none !important;
    }

    @keyframes spin{
      from{ transform:rotate(0); }
      to{ transform:rotate(360deg); }
    }

    @keyframes bounce{
      0%,100%{ transform:translateY(0); opacity:.55; }
      50%{ transform:translateY(-5px); opacity:1; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="brand">italky<span class="ai">AI</span></div>
      <h1 class="title">Odaya Katıl</h1>
      <p class="desc">
        Güvenli interpreter oturumuna bağlanılıyor. Birkaç saniye içinde canlı tercüman ekranına geçeceksin.
      </p>

      <div class="loaderWrap" id="loader-wrap">
        <div class="ring"></div>
        <div class="core">
          <div class="dots" id="loader">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <div class="statusCard">
        <span class="statusDot" id="status-dot"></span>
        <div class="statusText" id="status-msg">Odaya bağlanılıyor...</div>
      </div>

      <p class="helper">
        Room bilgisi doğrulanıyor, ardından dil eşleşmesi yapılıp bağlantı tamamlanacak.
      </p>

      <div class="actions">
        <a href="/index.html" id="back-btn" class="btn btnGhost hidden">Ana Sayfaya Dön</a>
      </div>
    </div>
  </div>

  <script src="/js/interpreter_join.js"></script>
</body>
</html>
