<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Premium Activation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #03050a;
      --accent: #00d2ff;
      --premium-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      --ai-magic: linear-gradient(90deg, #8bd3ff, #7c5cff, #ff66c4);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --txt: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
    }

    body {
      margin: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(58, 123, 213, 0.15) 0%, transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(124, 92, 255, 0.1) 0%, transparent 35%);
      color: var(--txt);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #pageContent {
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- Hero Section --- */
    .hero {
      text-align: center;
      padding: 20px 0;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 100px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      letter-spacing: -2px;
    }

    .hero-title span {
      background: var(--ai-magic);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- Scanner Card --- */
    .premium-card {
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      margin-bottom: 24px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    #qrVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      background: 
        linear-gradient(var(--bg), var(--bg)) padding-box,
        var(--ai-magic) border-box;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.5;
    }

    /* --- Input & Buttons --- */
    .input-group {
      margin-bottom: 20px;
    }

    .field-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    .field {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 4px;
      transition: all 0.3s ease;
    }

    .field:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0, 210, 255, 0.05);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
    }

    .btn {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: 12px;
    }

    .btn-primary {
      background: var(--premium-grad);
      color: white;
      box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 210, 255, 0.4);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--glass-border);
    }

    .status-text {
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      color: var(--accent);
      font-weight: 500;
    }

    /* --- Animations --- */
    @keyframes scan-line {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .scanner-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      animation: scan-line 3s linear infinite;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="pageContent">
  <div class="wrap">
    
    <header class="hero">
      <div class="hero-badge">Aktivasyon Gerekli</div>
      <h1 class="hero-title">italky<span>AI</span></h1>
    </header>

    <main class="premium-card">
      <div class="camera-container">
        <div class="scanner-line"></div>
        <video id="qrVideo" autoplay muted playsinline></video>
        <div class="scan-overlay"></div>
      </div>

      <div class="input-group">
        <label class="field-label">Lisans Anahtarı</label>
        <input id="licenseCodeInput" class="field" maxlength="8" placeholder="••••••••" autocomplete="off" />
      </div>

      <button id="activateBtn" class="btn btn-primary">Lisansı Aktif Et</button>
      <button id="trialBtn" class="btn btn-ghost">7 Gün Ücretsiz Deneyin</button>
      
      <div id="statusLine" class="status-text">Kamera taranıyor...</div>
    </main>

  </div>
</div>

</body>
</html>
