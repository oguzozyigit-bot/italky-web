<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
    <title>italkyAI • Offline FaceToFace</title>
    <style>
        :root{
          --ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
          --bg:#050508;
          --border:rgba(255,255,255,.14);
          --safe-bottom:env(safe-area-inset-bottom,0px);
        }
        *{
          box-sizing:border-box;
          -webkit-tap-highlight-color:transparent;
          outline:none;
          user-select:none;
        }
        html,body{
          margin:0;
          width:100%;
          height:100%;
          overflow:hidden;
          background:var(--bg);
          color:#fff;
          font-family:Outfit,Arial,sans-serif;
        }
        body{
          background:
            radial-gradient(circle at top,rgba(236,72,153,.06),transparent 22%),
            radial-gradient(circle at bottom,rgba(99,102,241,.06),transparent 22%),
            #050508;
        }
        .container{
          width:100%;
          height:100dvh;
          display:flex;
          flex-direction:column;
          overflow:hidden;
        }
        .half-screen{
          flex:1;
          min-height:0;
          position:relative;
          display:flex;
          flex-direction:column;
          justify-content:space-between;
          align-items:center;
          overflow:hidden;
          padding:10px 8px;
        }
        .half-screen.top{
          transform:rotate(180deg);
          background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg));
        }
        .half-screen.bottom{
          background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg));
          padding-bottom:calc(4px + var(--safe-bottom));
        }
        .lang-row{
          width:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          z-index:20;
        }
        .lang-trigger{
          min-height:38px;
          border:none;
          border-radius:999px;
          background:transparent;
          color:#fff;
          font-size:13px;
          font-weight:900;
          cursor:pointer;
          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;
          max-width:82vw;
          padding:8px 14px;
          display:inline-flex;
          align-items:center;
          justify-content:center;
          gap:8px;
        }
        .lang-trigger.static{
          cursor:default;
          opacity:.95;
        }
        .popover{
          position:absolute;
          left:50%;
          transform:translateX(-50%);
          width:min(92vw,360px);
          height:360px;
          background:#0a0a0f;
          border:1px solid var(--border);
          border-radius:24px;
          display:none;
          flex-direction:column;
          z-index:100;
          overflow:hidden;
          box-shadow:0 22px 60px rgba(0,0,0,.92);
        }
        .popover.show{display:flex}
        .half-screen.top .popover{top:58px}
        .pop-head{
          padding:14px;
          border-bottom:1px solid rgba(255,255,255,.10);
          display:flex;
          justify-content:space-between;
          align-items:center;
          font-weight:900;
        }
        .pop-close{
          cursor:pointer;
          padding:8px 12px;
          border-radius:12px;
          background:rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.12);
        }
        .pop-list{
          flex:1;
          overflow-y:auto;
          padding:10px;
          scrollbar-width:none;
        }
        .pop-list::-webkit-scrollbar{
          display:none;
        }
        .pop-item{
          padding:12px;
          border-radius:16px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:12px;
          cursor:pointer;
          border:1px solid transparent;
        }
        .pop-item.active{
          background:rgba(99,102,241,.14);
          border-color:rgba(99,102,241,.25);
        }
        .pop-left{
          display:flex;
          align-items:center;
          gap:10px;
          min-width:0;
          flex:1;
        }
        .pop-flag{font-size:18px}
        .pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pop-code{font-size:12px;font-weight:900;opacity:.7}
        .pop-empty{
          padding:20px 14px;
          text-align:center;
          color:rgba(255,255,255,.68);
          font-size:13px;
          line-height:1.5;
          font-weight:800;
        }
        .chat-body{
          flex:1;
          width:100%;
          min-height:0;
          overflow-y:auto;
          overflow-x:hidden;
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:flex-start;
          gap:14px;
          padding:18px 0 18px;
          text-align:center;
          scrollbar-width:none;
          -ms-overflow-style:none;
          -webkit-overflow-scrolling:touch;
          overscroll-behavior:contain;
          touch-action:pan-y;
          mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);
        }
        .chat-body::before{
          content:"";
          flex:1 0 auto;
          min-height:12px;
        }
        .chat-body::-webkit-scrollbar{
          display:none;
          width:0;
          height:0;
        }
        .bubble{
          max-width:86%;
          line-height:1.18;
          word-break:break-word;
          font-size:24px;
          font-weight:900;
          opacity:.9;
          text-align:center;
        }
        .bubble.latest{
          font-size:32px;
          font-weight:1000;
          opacity:1;
        }
        .bubble.subtle{
          font-size:18px;
          opacity:.62;
          font-weight:800;
        }
        .mic-line{
          width:100%;
          display:grid;
          grid-template-columns:1fr 70px 1fr;
          align-items:center;
          gap:12px;
          padding:0 8px;
          flex:0 0 auto;
          transform:translateY(-8px);
        }
        .mic-side{
          min-height:60px;
          display:flex;
          align-items:center;
          justify-content:center;
        }
        .mic-btn{
          width:70px;
          height:70px;
          border:none;
          border-radius:999px;
          background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));
          border:1px solid rgba(255,255,255,.18);
          color:#fff;
          display:flex;
          align-items:center;
          justify-content:center;
          cursor:pointer;
          box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
          position:relative;
        }
        .mic-btn svg{
          width:30px;
          height:30px;
          stroke:currentColor;
          stroke-width:2.2;
          fill:none;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .mic-btn.listening{
          background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12));
          box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10);
          animation:micBreath 1.05s ease-in-out infinite;
        }
        .mic-btn.listening::after{
          content:"";
          position:absolute;
          inset:-13px;
          border-radius:50%;
          border:2px solid rgba(165,180,252,.78);
          box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35);
          animation:micPulse 1s ease-out infinite;
        }
        @keyframes micBreath{
          0%,100%{transform:scale(1)}
          50%{transform:scale(1.045)}
        }
        @keyframes micPulse{
          0%{transform:scale(.92);opacity:.95}
          70%{transform:scale(1.18);opacity:.16}
          100%{transform:scale(1.24);opacity:0}
        }
        .center-hub{
          height:82px;
          flex:0 0 auto;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          background:rgba(0,0,0,.58);
          backdrop-filter:blur(16px);
          z-index:50;
          border-top:1px solid rgba(255,255,255,.05);
          border-bottom:1px solid rgba(255,255,255,.05);
        }
        .center-action{
          position:absolute;
          border:none;
          background:transparent;
          color:#fff;
          font-family:inherit;
          font-size:15px;
          font-weight:1000;
          cursor:pointer;
          padding:10px 12px;
          display:flex;
          align-items:center;
          justify-content:center;
          text-decoration:none;
          text-shadow:0 0 16px rgba(255,255,255,.18);
        }
        .center-clear{right:34px}
        .orb{
          width:66px;
          height:66px;
          border-radius:50%;
          background:#000;
          border:1px solid var(--border);
          display:flex;
          align-items:center;
          justify-content:center;
          font-family:"Space Grotesk",Arial,sans-serif;
          font-size:13px;
          font-weight:900;
          position:relative;
          overflow:visible;
        }
        .orb-main{position:relative;z-index:3}
        .orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sat{
          position:absolute;
          left:50%;
          top:50%;
          width:10px;
          height:10px;
          margin-left:-5px;
          margin-top:-5px;
          border-radius:50%;
          z-index:1;
          filter:blur(1.5px);
        }
        .sat1{
          background:#6366f1;
          box-shadow:0 0 15px #6366f1;
          animation:orbit1 4.8s linear infinite;
        }
        .sat2{
          background:#ec4899;
          box-shadow:0 0 15px #ec4899;
          animation:orbit2 6.2s linear infinite;
        }
        @keyframes orbit1{
          from{transform:rotate(0deg) translateX(48px) rotate(0deg)}
          to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}
        }
        @keyframes orbit2{
          from{transform:rotate(180deg) translateX(48px) rotate(-180deg)}
          to{transform:rotate(540deg) translateX(48px) rotate(-540deg)}
        }
        .modal{
          position:fixed;
          inset:0;
          background:rgba(0,0,0,.55);
          backdrop-filter:blur(6px);
          display:none;
          align-items:center;
          justify-content:center;
          z-index:9998;
          padding:20px;
        }
        .modal.show{display:flex}
        .modal-card{
          width:min(100%,420px);
          border-radius:24px;
          padding:18px;
          background:linear-gradient(145deg,rgba(16,16,24,.97),rgba(10,10,18,.97));
          border:1px solid rgba(255,255,255,.10);
          box-shadow:0 24px 50px rgba(0,0,0,.30);
        }
        .modal-title{
          margin:0 0 8px;
          font-family:"Space Grotesk",Arial,sans-serif;
          font-size:20px;
          font-weight:900;
        }
        .modal-text{
          margin:0;
          font-size:13px;
          line-height:1.6;
          color:rgba(255,255,255,.76);
          white-space:pre-line;
        }
        .modal-actions{
          display:grid;
          grid-template-columns:1fr;
          gap:10px;
          margin-top:16px;
        }
        .modal-btn{
          min-height:46px;
          border:none;
          border-radius:16px;
          cursor:pointer;
          font-family:inherit;
          font-size:13px;
          font-weight:900;
          background:rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.10);
          color:#fff;
        }
        .toast{
          position:fixed;
          left:50%;
          bottom:24px;
          transform:translateX(-50%) translateY(120px);
          max-width:min(92vw,430px);
          min-height:44px;
          padding:11px 16px;
          border-radius:16px;
          background:rgba(12,16,28,.96);
          border:1px solid rgba(255,255,255,.10);
          color:#fff;
          font-size:12px;
          font-weight:1000;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          z-index:9999;
          box-shadow:0 18px 36px rgba(0,0,0,.35);
          transition:.22s ease;
          pointer-events:none;
        }
        .toast.show{
          transform:translateX(-50%) translateY(0);
        }
        @media(max-width:390px){
          .mic-line{grid-template-columns:1fr 66px 1fr;gap:8px;transform:translateY(-7px)}
          .mic-btn{width:66px;height:66px}
          .mic-btn svg{width:28px;height:28px}
          .bubble{font-size:22px}
          .bubble.latest{font-size:30px}
          .center-action{font-size:13px;padding:10px 7px}
          .center-clear{right:28px}
        }
    </style>
</head>
<body>
<main class="container">
    <section class="half-screen top" id="topSection">
        <div class="lang-row">
            <button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button>
        </div>
        <div class="popover" id="pop-top">
            <div class="pop-head">
                <div>ÜST DİL</div>
                <div class="pop-close" id="close-top">✕</div>
            </div>
            <div class="pop-list" id="list-top"></div>
        </div>
        <div class="chat-body" id="topBody"></div>
        <div class="mic-line">
            <div class="mic-side"></div>
            <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
                    <path d="M19 10a7 7 0 0 1-14 0"></path>
                    <path d="M12 17v4"></path>
                    <path d="M8 21h8"></path>
                </svg>
            </button>
            <div class="mic-side"></div>
        </div>
    </section>
    <section class="center-hub">
        <div class="orb">
            <span class="sat sat1"></span>
            <span class="sat sat2"></span>
            <span class="orb-main">italky<span class="ai">AI</span></span>
        </div>
        <button id="clearBtn" class="center-action center-clear" type="button">Temizle</button>
    </section>
    <section class="half-screen bottom" id="botSection">
        <div class="lang-row">
            <button id="botLangBtn" class="lang-trigger static" type="button">🌐 Dil seçiliyor...</button>
        </div>
        <div class="chat-body" id="botBody"></div>
        <div class="mic-line">
            <div class="mic-side"></div>
            <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
                    <path d="M19 10a7 7 0 0 1-14 0"></path>
                    <path d="M12 17v4"></path>
                    <path d="M8 21h8"></path>
                </svg>
            </button>
            <div class="mic-side"></div>
        </div>
    </section>
</main>
<div id="offlineRequiredBackdrop" class="modal">
    <div class="modal-card">
        <h3 class="modal-title">Kurulu dil gerekli</h3>
        <p class="modal-text" id="offlineRequiredText">Kurulu karşı dil paketi bulunamadı.</p>
        <div class="modal-actions">
            <button class="modal-btn" id="offlineRequiredCloseBtn" type="button">Kapat</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>
<script>
    const $ = (id) => document.getElementById(id);
    const offlineLanguagePackNotReadyMessage = "Bu dil paketi henüz cihazınızda hazır değil. Lütfen internet bağlantısıyla önce dil paketini kurun. Kurulumdan sonra internet olmadan kullanabilirsiniz.";
    const offlineSpeechNotReadyMessage = "Bu cihazda offline konuşma tanıma hazır değil. Lütfen internet bağlantısıyla tekrar deneyin veya cihaz dil paketlerini kontrol edin.";
    const BCP = {
      tr:"tr-TR", en:"en-US", de:"de-DE", fr:"fr-FR", it:"it-IT", es:"es-ES",
      ar:"ar-SA", ru:"ru-RU", pt:"pt-PT", nl:"nl-NL", zh:"zh-CN", ja:"ja-JP",
      ko:"ko-KR", hi:"hi-IN", az:"az-AZ", kk:"kk-KZ", uz:"uz-UZ", uk:"uk-UA",
      pl:"pl-PL", cs:"cs-CZ", ro:"ro-RO", bg:"bg-BG", el:"el-GR", fa:"fa-IR",
      he:"he-IL", ur:"ur-PK", bn:"bn-BD", id:"id-ID", ms:"ms-MY", vi:"vi-VN",

    const LANG_META = {

    const topBody = $("topBody");
    const botBody = $("botBody");

    const topLangBtn = $("topLangBtn");

    const offlineRequiredBackdrop = $("offlineRequiredBackdrop");
    const offlineRequiredText = $("offlineRequiredText");
    const offlineRequiredCloseBtn = $("offlineRequiredCloseBtn");
    let topLang = "en";
    let botLang = "tr";
    let nativeLang = "tr";
    let allowedTargets = [];
    let recordingSide = null;

    let lastMicStartAt = 0;

    let manualStopPending = false;
    let activeSpeechEngine = "";
    let nativeFallbackLang = "";
    let nativeFallbackSide = "";
    let nativeErrorGraceTimer = null;
    function canonical(code){
      return String(code || "").toLowerCase().replace("_","-").split("-")[0].trim();
    }
    function langObj(code){
      const c = canonical(code);
      return LANG_META[c] || {name:(c || "en").toUpperCase(),flag:"🌐"};
    }
    function labelChip(code){
      const o = langObj(code);
      return `${o.flag} ${o.name}`;
    }
    function showToast(msg){
      if(!toast) return;
      const text = String(msg || "").trim();
      if(!text) return;
      function hideToast(){
        try{
          toast.classList.remove("show");
          toast.textContent = "";
          clearTimeout(window.__toastTimer);
        }catch(e){}
      }
      const silentMessages = [
        "Offline FaceToFace hazır",
        "Offline ses motoru hazırlanıyor...",
        "Offline ses motoru bu sürümde hazır değil.",

        "Mikrofon hatası",
        "Offline ses algılama başlatılamadı.",
        "Cihaz STT ve offline ses modeli başlatılamadı.",
        "Mikrofon sonucu alınamadı",
        "Dinleme tamamlanıyor..."
      ];
      if(silentMessages.includes(text)){
        hideToast();
        return;
      }
      const silentStarts = [
        "Türkçe için offline ses modeli",
        "İngilizce için offline ses modeli",
        "Almanca için offline ses modeli",

    function pushPair(out, from, to, suffix){
      const f = canonical(from);
      const t = canonical(to);
      if(!f || !t || f === t) return;
      const key = suffix !== undefined ? `${f}-${t}-${suffix}` : `${f}-${t}`;
      out[key] = {from:f,to:t};

    function getInstalledPairs(){
      try{
        if(window.OfflineTranslate && typeof window.OfflineTranslate.getInstalledOfflinePairs === "function"){
          const raw = window.OfflineTranslate.getInstalledOfflinePairs() || "{}";
          const parsed = JSON.parse(raw);
          if(parsed && typeof parsed === "object" && Object.keys(parsed).length > 0){
            return parsed;
          }
        }
      }catch(e){
        console.warn("getInstalledPairs native error", e);
      }
      const keys = [
        "italky_offline_installed_pairs_v7",
        "italky_offline_installed_pairs_v6",
        "italky_offline_installed_pairs",
        "offline_installed_pairs"
      ];
      const out = {};
      for(const key of keys){
        try{
          const raw = localStorage.getItem(key);
          if(!raw) continue;
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed)){
            parsed.forEach((item,index) => {
              if(typeof item === "string"){
                const clean = item.toLowerCase().replace(/_/g,"-");
                const parts = clean.split("-");
                pushPair(out, parts[0], parts[1], index);
                return;
              }
              if(item && typeof item === "object"){
                pushPair(
                  out,
                  item.from || item.source || item.sourceLang || item.src,
                  item.to || item.target || item.targetLang || item.dst,
                  index
                );
              }
            });
          } else if(parsed && typeof parsed === "object"){
            Object.keys(parsed).forEach((pairKey,index) => {
              const item = parsed[pairKey];
              if(item === false || item === null || item === undefined) return;
              if(item && typeof item === "object"){
                pushPair(
                  out,
                  item.from || item.source || item.sourceLang || item.src,
                  item.to || item.target || item.targetLang || item.dst,
                  index
                );
                return;
              }
              const clean = String(pairKey || "").toLowerCase().replace(/_/g,"-");
              const parts = clean.split("-");
              pushPair(out, parts[0], parts[1], index);
            });
          }
        }catch(e){
          console.warn("getInstalledPairs localStorage error", key, e);
        }
      }

    function getInstalledTargetLangsForNative(native){

        const to = canonical(item && item.to);
        if(from === n && to && to !== n && !result.includes(to)){
          result.push(to);
        }
        if(to === n && from && from !== n && !result.includes(from)){
          result.push(from);
        }

    function requestOfflineTranslate(payload){

        const timer = setTimeout(() => {
          if(done) return;
          done = true;
          window.removeEventListener("offlineTranslateResult", handler);
          console.warn("[offline_f2f] translate timeout for payload:", payload);
          resolve(null);
        }, 30000);
        const handler = (e) => {
          if(done) return;
          done = true;
          clearTimeout(timer);
          window.removeEventListener("offlineTranslateResult", handler);
          resolve(e.detail || null);
        };
        window.addEventListener("offlineTranslateResult", handler);
        try{
          window.OfflineTranslate.translate(JSON.stringify(payload));
        }catch(e){
          console.warn("OfflineTranslate.translate error", e);

            resolve(null);

    if(offlineRequiredCloseBtn){
      offlineRequiredCloseBtn.addEventListener("click",closeOfflineRequiredPopup);
    }
    if(offlineRequiredBackdrop){
      offlineRequiredBackdrop.addEventListener("click",(e) => {
        if(e.target === offlineRequiredBackdrop) closeOfflineRequiredPopup();
      });
    }
    function init(){
      getTargets();
      if(!allowedTargets.length){
        openOfflineRequiredPopup(offlineLanguagePackNotReadyMessage);
        addBubble("top",offlineLanguagePackNotReadyMessage,false);
      }
      try{
        if(window.Native && typeof window.Native.requestF2FPermissions === "function"){
          window.Native.requestF2FPermissions();
        }
      }catch(e){
        console.warn("requestF2FPermissions error", e);
      }
      setTimeout(() => {
        getTargets();
        refreshLangLabels();
      }, 700);
      setTimeout(() => {
        getTargets();
        refreshLangLabels();
      }, 1800);
      showToast("Offline FaceToFace hazır");
    }
    init();
</script>
</body>
</html>
