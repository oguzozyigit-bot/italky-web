<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI - Eme Destek</title>
  <meta name="theme-color" content="#05070f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05070f;
      --line:rgba(255,255,255,.11);
      --text:rgba(255,255,255,.96);
      --muted:rgba(226,232,240,.70);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Outfit,Arial,sans-serif}
    body{
      min-height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 0%,rgba(103,232,249,.16),transparent 30%),
        radial-gradient(circle at 86% 12%,rgba(56,189,248,.10),transparent 32%),
        radial-gradient(circle at 50% 100%,rgba(11,79,108,.22),transparent 34%),
        linear-gradient(180deg,#07111f 0%,#05070f 56%,#020617 100%);
    }

    .page{
      width:100%;
      height:100dvh;
      padding:calc(14px + var(--safe-top)) 12px calc(14px + var(--safe-bottom));
      display:flex;
      justify-content:center;
      overflow:hidden;
    }
    .shell{
      width:min(100%,680px);
      height:100%;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:12px;
      min-height:0;
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{min-width:0;text-decoration:none;color:#fff}
    .brand-main{font-family:"Space Grotesk",Outfit,sans-serif;font-size:28px;font-weight:900;line-height:1;letter-spacing:-.6px}
    .brand-main span{background:linear-gradient(135deg,#67e8f9,#38bdf8,#1495b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tagline{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:900}
    .back-btn{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:22px;font-weight:1000}

    .chat-card{
      min-height:0;
      border-radius:28px;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 12% 0%,rgba(103,232,249,.12),transparent 32%),
        radial-gradient(circle at 96% 8%,rgba(20,149,182,.13),transparent 32%),
        linear-gradient(180deg,rgba(6,21,36,.82),rgba(2,6,23,.74));
      box-shadow:0 20px 44px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.035);
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr;
    }
    .chat-head{padding:15px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
    .eme-avatar{width:48px;height:48px;flex:0 0 48px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9 0%,#1495b6 48%,#061524 100%);color:#dbeafe;box-shadow:0 16px 30px rgba(56,189,248,.16),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden}
    .eme-avatar::before{content:"";position:absolute;inset:6px;border-radius:15px;background:linear-gradient(180deg,rgba(219,234,254,.20),rgba(2,6,23,.22));border:1px solid rgba(219,234,254,.18)}
    .eme-avatar::after{content:"";position:absolute;width:21px;height:8px;left:50%;bottom:9px;transform:translateX(-50%);border-bottom:2px solid rgba(219,234,254,.86);border-radius:0 0 999px 999px}
    .eme-eyes{position:relative;z-index:2;display:flex;gap:8px;margin-top:-2px}
    .eme-eyes span{width:5px;height:5px;border-radius:50%;background:#dbeafe;box-shadow:0 0 10px rgba(103,232,249,.75)}
    .eme-ear{position:absolute;top:19px;width:5px;height:12px;border-radius:8px;background:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.38)}
    .eme-ear.left{left:3px}
    .eme-ear.right{right:3px}
    .chat-title{min-width:0}
    .chat-title h1{margin:0;font-family:"Space Grotesk",Outfit,sans-serif;font-size:22px;font-weight:900;line-height:1.1}
    .chat-title p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:850}
    .messages{min-height:0;overflow-y:auto;padding:16px 14px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
    .messages::-webkit-scrollbar{display:none}
    .message{max-width:88%;padding:12px 13px;border-radius:20px;font-size:14px;line-height:1.48;font-weight:800;white-space:pre-wrap}
    .message.eme{align-self:flex-start;color:rgba(219,234,254,.94);background:linear-gradient(145deg,rgba(6,21,36,.82),rgba(2,6,23,.70));border:1px solid rgba(103,232,249,.12);border-top-left-radius:8px}
    .message.user{align-self:flex-end;color:#020617;background:linear-gradient(135deg,#67e8f9,#38bdf8 56%,#1495b6);border-top-right-radius:8px}

    .composer-card{
      border-radius:24px;
      border:1px solid rgba(103,232,249,.12);
      background:rgba(2,6,23,.78);
      box-shadow:0 18px 34px rgba(0,0,0,.24);
      padding:10px;
      display:grid;
      gap:10px;
    }
    .composer{display:grid;grid-template-columns:42px 1fr 48px;gap:8px;align-items:end}
    .chat-input{width:100%;min-height:46px;max-height:112px;border:none;border-radius:17px;background:#06111f;color:#fff;font:inherit;font-size:14px;font-weight:850;line-height:1.45;padding:12px 13px;resize:none}
    .icon-btn,.send-btn{height:46px;border:none;border-radius:16px;display:grid;place-items:center;cursor:pointer;font:inherit;font-weight:1000}
    .icon-btn{background:rgba(6,21,36,.92);color:#dbeafe;border:1px solid rgba(103,232,249,.14)}
    .icon-btn:disabled{opacity:.45;cursor:default}
    .icon-btn.listening{background:rgba(103,232,249,.16);border-color:rgba(103,232,249,.32);color:#cffafe}
    .send-btn{background:linear-gradient(135deg,#67e8f9,#38bdf8,#1495b6);color:#020617}
    .composer-status{min-height:18px;color:rgba(226,232,240,.68);font-size:12px;line-height:1.45;font-weight:850}
    .composer-status.err{color:#fecaca}
    .composer-status.ok{color:#bbf7d0}

    .support-form{
      display:none;
      gap:10px;
      max-height:42dvh;
      overflow-y:auto;
      padding-top:2px;
      scrollbar-width:none;
    }
    .support-form::-webkit-scrollbar{display:none}
    .support-form.show{display:grid}
    .form-title{margin:2px 0 0;color:#fff;font-size:15px;font-weight:1000}
    .form-copy{margin:0;color:rgba(226,232,240,.70);font-size:12px;line-height:1.5;font-weight:800}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .field{display:grid;gap:6px}
    .field.full{grid-column:1 / -1}
    .field label{color:rgba(219,234,254,.74);font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.45px}
    .field input,.field textarea,.field select{width:100%;min-height:46px;border-radius:16px;border:1px solid rgba(103,232,249,.14);background:#06111f;color:#fff;font:inherit;font-size:13px;font-weight:850;padding:10px 12px}
    .field textarea{min-height:92px;resize:none;line-height:1.45}
    .form-actions{display:grid;gap:8px}
    .action-btn{width:100%;min-height:48px;border:none;border-radius:16px;cursor:pointer;font:inherit;font-size:13px;font-weight:1000;text-align:center;background:linear-gradient(135deg,#67e8f9,#38bdf8,#1495b6);color:#020617}
    .action-btn:disabled{opacity:.64;cursor:default}
    .status{min-height:21px;color:rgba(255,255,255,.78);font-size:12px;line-height:1.45;font-weight:850}
    .status.ok{color:#bbf7d0}
    .status.err{color:#fecaca}
    .hidden{display:none!important}

    @media(max-width:520px){
      .page{padding:calc(12px + var(--safe-top)) 10px calc(10px + var(--safe-bottom))}
      .brand-main{font-size:25px}
      .message{max-width:94%}
      .form-grid{grid-template-columns:1fr}
      .support-form{max-height:45dvh}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/pages/home.html" aria-label="italkyAI ana sayfa">
          <div class="brand-main">Eme <span>Destek</span></div>
          <p class="tagline">Emene sor, birlikte çözelim.</p>
        </a>
        <a class="back-btn" href="/pages/home.html" aria-label="Geri">‹</a>
      </header>

      <section class="chat-card" aria-label="Eme destek sohbeti">
        <div class="chat-head">
          <div class="eme-avatar" aria-hidden="true">
            <span class="eme-ear left"></span>
            <span class="eme-ear right"></span>
            <span class="eme-eyes"><span></span><span></span></span>
          </div>
          <div class="chat-title">
            <h1>Eme Destek</h1>
            <p>italkyAI destek asistanı</p>
          </div>
        </div>
        <div class="messages" id="messageList" aria-live="polite"></div>
      </section>

      <section class="composer-card" aria-label="Eme mesaj alanı">
        <div class="composer">
          <button id="micBtn" class="icon-btn" type="button" aria-label="Mikrofonla söyle" title="Mikrofonla söyle">🎙</button>
          <textarea id="chatInput" class="chat-input" rows="1" placeholder="Sorununuzu yazın..."></textarea>
          <button id="sendBtn" class="send-btn" type="button" aria-label="Gönder" title="Gönder">➤</button>
        </div>
        <div id="composerStatus" class="composer-status"></div>

        <form id="ticketForm" class="support-form" novalidate>
          <h2 class="form-title">Destek formu</h2>
          <p id="ticketIntro" class="form-copy"></p>
          <div class="form-grid">
            <div class="field">
              <label for="ticketFirstName">Ad</label>
              <input id="ticketFirstName" type="text" maxlength="80" autocomplete="given-name" placeholder="Adınız" />
            </div>
            <div class="field">
              <label for="ticketLastName">Soyad</label>
              <input id="ticketLastName" type="text" maxlength="80" autocomplete="family-name" placeholder="Soyadınız" />
            </div>
            <div class="field">
              <label for="ticketEmail">E-posta</label>
              <input id="ticketEmail" type="email" maxlength="160" autocomplete="email" placeholder="mail@example.com" />
            </div>
            <div class="field">
              <label for="ticketPhone">Telefon</label>
              <input id="ticketPhone" type="tel" maxlength="32" autocomplete="tel" placeholder="05xxxxxxxxx" />
            </div>
            <div class="field full">
              <label for="ticketTopic">Destek konusu</label>
              <select id="ticketTopic">
                <option value="activation_code">Aktivasyon kodu</option>
                <option value="membership">Üyelik</option>
                <option value="technical">Teknik destek</option>
                <option value="module_usage">Modül kullanımı</option>
                <option value="other">Diğer</option>
              </select>
            </div>
            <div class="field">
              <label for="ticketCode">Aktivasyon kodu</label>
              <input id="ticketCode" type="text" maxlength="64" placeholder="Varsa kodunuzu yazın" />
            </div>
            <div class="field">
              <label for="ticketOrder">Sipariş / referans numarası</label>
              <input id="ticketOrder" type="text" maxlength="80" placeholder="Varsa numarayı yazın" />
            </div>
            <div class="field full">
              <label for="ticketMessage">Sorun açıklaması</label>
              <textarea id="ticketMessage" placeholder="Sorunu kısa ve net anlatın"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button id="createTicketBtn" class="action-btn" type="submit">Destek Talebi Oluştur</button>
            <div id="ticketStatus" class="status"></div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="/js/eme_support.js?v=EME_CHAT_V1"></script>
</body>
</html>
