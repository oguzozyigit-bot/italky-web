<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Dil Seçimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07050b;
      --card:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.64);
      --grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:
      radial-gradient(circle at top, rgba(99,102,241,.20), transparent 28%),
      radial-gradient(circle at 20% 18%, rgba(244,114,182,.12), transparent 24%),
      var(--bg);
      color:var(--text);font-family:Outfit,sans-serif}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{
      width:min(100%,420px);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      padding:22px;
      backdrop-filter:blur(14px);
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .logo{font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:800;margin-bottom:8px}
    .logo .ai{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    h1{font-size:22px;line-height:1.2;margin:0 0 8px}
    p{margin:0 0 18px;color:var(--muted);line-height:1.5}
    .lang-list{display:grid;gap:10px}
    .lang-btn{
      width:100%;min-height:54px;border-radius:18px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      color:#fff;font:inherit;font-weight:800;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 16px;cursor:pointer
    }
    .lang-btn.active{
      border-color:rgba(129,140,248,.6);
      box-shadow:0 0 0 2px rgba(129,140,248,.14) inset;
    }
    .flag{font-size:22px;margin-right:10px}
    .left{display:flex;align-items:center}
    .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
    .save{
      min-height:54px;border:none;border-radius:18px;
      background:var(--grad);color:#07050b;
      font:inherit;font-weight:900;cursor:pointer
    }
    .hint{margin-top:12px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">italky<span class="ai">AI</span></div>
      <h1>Kendi dilinizi seçin</h1>
      <p>Seçiminize göre offline paketiniz otomatik olarak yüklenecektir. Siz beklemeden uygulamaya devam edeceksiniz.</p>

      <div class="lang-list" id="langList"></div>

      <div class="actions">
        <button class="save" id="saveBtn">Devam Et</button>
      </div>

      <div class="hint">İlk aşamada seçilen dil ve İngilizce  offline paket hazırlanır.</div>
    </div>
  </div>

  <script type="module" src="/js/native_lang_setup.js"></script>
</body>
</html>
