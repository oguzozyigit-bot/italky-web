<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Yönlendiriliyor</title>
  <meta name="theme-color" content="#05070f" />
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#05070f;
      color:#fff;
      font-family:Outfit, Arial, sans-serif;
    }
    .box{
      text-align:center;
      padding:24px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:24px;
      background:rgba(255,255,255,.04);
      width:min(88vw,420px);
    }
    .title{
      font-size:18px;
      font-weight:900;
      margin:0 0 8px;
    }
    .sub{
      font-size:13px;
      color:rgba(255,255,255,.68);
      margin:0;
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="title">Çeviri ayarlarına yönlendiriliyor...</p>
    <p class="sub">Lütfen bekleyin.</p>
  </div>

  <script>
    const url = new URL(window.location.href);
    const edit = String(url.searchParams.get("edit") || "").trim();
    const target = new URL("/pages/translation_settings.html", window.location.origin);

    target.searchParams.set("from", "facetoface");
    if (edit === "1") target.searchParams.set("edit", "1");

    window.location.replace(target.toString());
  </script>
</body>
</html>
