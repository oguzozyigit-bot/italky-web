<!-- FILE: /pages/setup_offline.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Kurulumu Tamamla</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --card: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.70);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 55%,#ec4899 100%);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
    #pageContent{height:100%}

    .wrap{
      max-width:520px;
      margin:0 auto;
      height:100%;
      padding: 12px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      justify-content:center;
    }

    .card{
      border-radius: 26px;
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
    }

    .h{
      font-family:"Space Grotesk",system-ui,sans-serif;
      font-weight:1000;
      font-size:18px;
      margin:0;
      color:#fff;
      letter-spacing:-.3px;
    }
    .p{
      margin:8px 0 0;
      font-size:12px;
      font-weight:900;
      color: var(--muted);
      line-height:1.55;
    }

    .packRow{
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
    }
    .left{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .flag{
      width:44px; height:44px; border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      font-size:22px;
      flex:0 0 auto;
    }
    .meta{ min-width:0; }
    .name{
      font-size:14px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin-top:2px;
      font-size:11px;
      font-weight:900;
      color: rgba(255,255,255,0.62);
    }

    .btn{
      width:100%;
      height:56px;
      border-radius: 20px;
      border:none;
      background: var(--aiGrad);
      color:#050510;
      font-weight:1000;
      font-size:14px;
      cursor:pointer;
      user-select:none;
      margin-top: 10px;
    }
    .btn:active{ transform: scale(.99); }
    .btn[disabled]{ opacity:.45; cursor:not-allowed; }

    .status{
      margin-top:10px;
      font-size:12px;
      font-weight:900;
      color: rgba(255,255,255,0.75);
      white-space:pre-wrap;
      line-height:1.5;
      min-height: 40px;
    }

    .toast{
      position: fixed;
      left:50%;
      top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,0.95);
      border: 1px solid rgba(165,180,252,0.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index: 999999;
      font-weight: 1000;
      font-size: 12px;
      transition: .25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width: min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">
    <div class="card">
      <div class="h">Kurulumu Tamamla</div>
      <div class="p">
        İlk kurulumda sana <b>30 gün ücretsiz</b> Offline İngilizce paketi tanımlıyoruz.<br/>
        Bu paketle internet olmadan <b>TR ↔ EN</b> çeviri yapabilirsin.
      </div>

      <div class="packRow">
        <div class="left">
          <div class="flag">🇹🇷⇄🇬🇧</div>
          <div class="meta">
            <div class="name">Offline İngilizce Paketi</div>
            <div class="sub">Deneme: 30 Gün • Paketler: tr-en + en-tr</div>
          </div>
        </div>
      </div>

      <button class="btn" id="btnInstall" type="button">Kurulumu Tamamla (İndir)</button>
      <div class="status" id="status">Hazır.</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";
  import { initOfflineBootstrap } from "/js/offline_manager.js";

  mountShell({ scroll:"none" });

  const $ = (id)=>document.getElementById(id);
  const toastEl = $("toast");
  const statusEl = $("status");
  const btn = $("btnInstall");

  const FIRST_BOOT_KEY = "italky_first_boot_done_v1";

  function toast(msg){
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>toastEl.classList.remove("show"), 1600);
  }

  // session şart
  const { data:{ session } } = await supabase.auth.getSession();
  if(!session?.user){
    location.replace("/pages/login.html");
    throw new Error("no session");
  }

  // zaten yapıldıysa direkt home
  if(localStorage.getItem(FIRST_BOOT_KEY) === "1"){
    location.replace("/pages/home.html");
  }

  btn.onclick = async ()=>{
    btn.disabled = true;
    statusEl.textContent = "İndiriliyor…\nLütfen uygulamadan çıkma.";
    toast("Offline paket indiriliyor…");

    try{
      await initOfflineBootstrap(); // 30 gün trial indir (tr-en + en-tr)
      statusEl.textContent = "Hazır ✅\nOffline İngilizce paketi aktif.";
      toast("Kurulum tamamlandı ✅");
      setTimeout(()=>location.replace("/pages/home.html"), 650);
    }catch(e){
      statusEl.textContent = "İndirme başarısız.\nİnterneti kontrol edip tekrar dene.";
      btn.disabled = false;
      toast("İndirilemedi");
    }
  };
</script>
</body>
</html>
