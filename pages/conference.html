<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Gezi & Konferans</title>
  <meta name="theme-color" content="#061524" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050814;
      --panel:rgba(8,18,32,.78);
      --line:rgba(78,210,217,.24);
      --text:rgba(255,255,255,.96);
      --muted:rgba(219,234,254,.70);
      --cyan:#35d5d0;
      --mint:#84fff7;
      --sky:#38bdf8;
      --blue:#2563eb;
      --head:78px;
      --foot:66px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Outfit,Arial,sans-serif;overflow:hidden}
    body{background:radial-gradient(circle at 18% 0%,rgba(53,213,208,.22),transparent 34%),radial-gradient(circle at 88% 12%,rgba(37,99,235,.18),transparent 36%),linear-gradient(180deg,#061524,#050814 48%,#020617)}
    button,select,input{font:inherit}
    select,input{appearance:none;-webkit-appearance:none;color-scheme:dark;background-color:#06111f!important;color:#fff!important}
    select option{background:#06111f;color:#fff}

    .page{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(var(--foot) + var(--safe-bottom))}
    .topbar{position:fixed;left:0;right:0;top:0;z-index:40;height:calc(var(--head) + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line);background:rgba(6,17,29,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .brand{display:inline-flex;align-items:center;min-width:0;text-decoration:none}.brand-logo{display:block;width:128px;max-width:42vw;max-height:58px;height:auto;object-fit:contain;background:transparent;border:0;box-shadow:none;filter:none}
    .home-btn{min-height:42px;border-radius:15px;padding:0 16px;background:rgba(255,255,255,.055);border:1px solid rgba(53,213,208,.34);color:#fff;font-size:12px;font-weight:1000;cursor:pointer}
    .content{position:fixed;top:calc(var(--head) + env(safe-area-inset-top,0px));bottom:calc(var(--foot) + var(--safe-bottom));left:0;right:0;overflow-y:auto;padding:14px 14px 18px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.shell{width:min(100%,760px);min-height:100%;margin:0 auto;display:grid;gap:12px;align-content:start}

    .card{border-radius:26px;background:linear-gradient(145deg,rgba(8,18,32,.86),rgba(2,6,23,.76));border:1px solid var(--line);box-shadow:0 18px 46px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);padding:16px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 0%,rgba(53,213,208,.14),transparent 36%),linear-gradient(135deg,rgba(255,255,255,.05),transparent 45%);pointer-events:none}.card>*{position:relative;z-index:2}
    .hero{min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}.hero-title{margin:0 auto;max-width:560px;font-family:"Space Grotesk",sans-serif;font-size:29px;line-height:1.06;font-weight:900;letter-spacing:-.9px}.hero-text{margin:0 auto;max-width:520px;color:var(--muted);font-size:14.5px;line-height:1.45;font-weight:800}

    .role-grid{display:grid;grid-template-columns:1fr;gap:12px}.role-btn{min-height:118px;border:none;border-radius:26px;padding:16px 18px 16px 84px;text-align:left;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.13);box-shadow:0 16px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;justify-content:center;gap:7px;position:relative;overflow:hidden}.role-btn::before{content:"";position:absolute;left:18px;top:50%;width:50px;height:50px;transform:translateY(-50%);border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 18px rgba(255,255,255,.05)}.role-btn::after{position:absolute;left:31px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1}.speaker-btn::after{content:"🎙️"}.listener-btn::after{content:"🎧"}.role-btn strong{font-family:"Space Grotesk",sans-serif;font-size:24px;line-height:1.03;font-weight:900;letter-spacing:-.5px}.role-btn span{display:block;color:rgba(255,255,255,.82);font-size:13.5px;line-height:1.38;font-weight:800;max-width:96%}.speaker-btn{background:radial-gradient(circle at 10% 16%,rgba(53,213,208,.25),transparent 30%),radial-gradient(circle at 90% 72%,rgba(96,165,250,.24),transparent 34%),linear-gradient(135deg,#0b4f6c,#0f6f8f 48%,#1e3a8a)}.listener-btn{background:radial-gradient(circle at 10% 16%,rgba(45,212,191,.25),transparent 30%),radial-gradient(circle at 90% 72%,rgba(96,165,250,.24),transparent 34%),linear-gradient(135deg,#064e3b,#0f766e 48%,#1d4ed8)}

    .view{display:none;gap:12px}.view.active{display:grid}.live-view.active{display:flex;flex-direction:column;min-height:calc(100dvh - var(--head) - var(--foot) - env(safe-area-inset-top,0px) - var(--safe-bottom));gap:12px}.form-grid{display:grid;gap:12px}.field{display:grid;gap:7px;text-align:left}.field label{font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.5px;color:rgba(191,219,254,.72)}.field select,.field input{width:100%;min-height:54px;border-radius:18px;border:1px solid rgba(53,213,208,.24);background:#06111f;color:#fff;padding:0 14px;font-size:15px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}.primary,.secondary{min-height:52px;border:none;border-radius:18px;font-size:15px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(135deg,#83fff8,#35d5d0 55%,#0ea5a4);color:#03211f;box-shadow:0 14px 30px rgba(53,213,208,.24)}.secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#fff}.danger{color:#fecaca;border-color:rgba(248,113,113,.25)}
    .session-card{flex:0 0 auto;padding:13px 14px}.session-row{display:grid;gap:8px;text-align:center}.session-code-label{margin:8px 0 2px;color:rgba(191,219,254,.66);font-size:10px;font-weight:1000;letter-spacing:.7px;text-transform:uppercase}.session-code{font-family:"Space Grotesk",sans-serif;font-size:38px;font-weight:900;letter-spacing:6px;color:#bfdbfe;line-height:1}.session-link{margin:6px 0 0;color:rgba(219,234,254,.74);font-size:12px;font-weight:900;word-break:break-all}.badge-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.badge{display:inline-flex;align-items:center;min-height:30px;border-radius:999px;padding:0 10px;background:rgba(53,213,208,.12);border:1px solid rgba(53,213,208,.22);color:#dffffd;font-size:11px;font-weight:1000}.badge.live{background:rgba(34,197,94,.13);border-color:rgba(74,222,128,.24);color:#bbf7d0}
    .transcript{flex:1 1 auto;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;padding:18px 14px}.message{max-width:94%;margin:0 auto;text-align:center;line-height:1.18;word-break:break-word;font-size:18px;font-weight:850;color:rgba(255,255,255,.50)}.message.latest{font-size:32px;font-weight:1000;color:#fff}.speaker-live .message.latest{color:#e0f2fe}.listener-live .message.latest{color:#dcfce7}.bottom-controls{flex:0 0 auto;display:grid;gap:10px;margin-top:auto}.mic-row{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:12px;margin-top:4px}.mic-btn{width:78px;height:78px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.18),rgba(53,213,208,.16) 48%,rgba(15,23,42,.82));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 18px 44px rgba(0,0,0,.34),0 0 32px rgba(53,213,208,.18)}.mic-btn.listening{animation:micPulse 1.08s ease-in-out infinite;background:radial-gradient(circle at 50% 34%,rgba(53,213,208,.34),rgba(96,165,250,.24) 48%,rgba(99,102,241,.16))}.mic-btn svg{width:33px;height:33px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.handsfree{justify-self:start;min-height:42px;border-radius:14px;padding:0 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:1000;cursor:pointer}.handsfree.active{background:rgba(34,197,94,.14);border-color:rgba(74,222,128,.28);color:#bbf7d0}@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    #listenerLiveLangWrap{margin-top:10px;display:grid;gap:7px;text-align:left}#listenerLiveLangWrap label{font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.5px;color:rgba(191,219,254,.72)}#listenerLiveLang{width:100%;min-height:48px;border-radius:16px;border:1px solid rgba(53,213,208,.24);background:#06111f;color:#fff;padding:0 12px;font-size:14px;font-weight:900}
    .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-120px);z-index:2147483647;min-height:44px;max-width:min(92vw,430px);padding:11px 16px;border-radius:16px;background:rgba(12,16,28,.98);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:1000;text-align:center;box-shadow:0 18px 36px rgba(0,0,0,.45);transition:.22s ease;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
    .site-footer{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--foot) + var(--safe-bottom));padding:6px 12px calc(6px + var(--safe-bottom));border-top:1px solid var(--line);background:#06111d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}.site-footer-links{display:flex;align-items:center;justify-content:center;gap:16px;min-height:18px;white-space:nowrap}.site-footer-links a{font-size:10px;color:#aebdcc;font-weight:800;text-decoration:none}.site-footer-signature{font-size:9.5px;line-height:1.2;color:#91a4b8;font-weight:900;white-space:nowrap;text-align:center}.gokturk{color:#36d4ce;margin-left:5px}
    @media(max-width:520px){:root{--head:72px;--foot:64px}.topbar{padding-left:14px;padding-right:14px}.brand-logo{width:104px;max-height:50px}.home-btn{min-height:38px;padding:0 13px;font-size:11px}.hero{min-height:150px}.hero-title{font-size:24px}.role-btn{min-height:112px}.message.latest{font-size:29px}.transcript{min-height:245px}.session-code{font-size:34px}.content{padding-left:12px;padding-right:12px}.site-footer-links{gap:10px}.site-footer-links a{font-size:9px}.site-footer-signature{font-size:8px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="https://italky.ai/hosgeldiniz" aria-label="italkyAI Ana Sayfa" data-no-translate="1"><img class="brand-logo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI"></a>
      <button id="homeBtn" class="home-btn" type="button">Ana Sayfa</button>
    </header>
    <section class="content">
      <div class="shell">
        <section id="roleView" class="view active">
          <div class="card hero">
            <h2 class="hero-title">Tek konuşmacı, herkes kendi dilinde dinler.</h2>
            <p class="hero-text">Konuşmacı yayını başlatır. Katılımcılar kodla katılır, kendi dilinde çeviriyi görür ve duyar.</p>
          </div>
          <div class="role-grid">
            <button id="speakerRoleBtn" class="role-btn speaker-btn" type="button"><strong>Konuşmacı Olarak Başlat</strong><span>Konuşma dilini seç, oturum kodunu oluştur ve yayını başlat.</span></button>
            <button id="listenerRoleBtn" class="role-btn listener-btn" type="button"><strong>Dinleyici Olarak Katıl</strong><span>Oturum kodunu gir, dinleme dilini seç ve çeviriyi dinle.</span></button>
          </div>
        </section>
        <section id="speakerSetupView" class="view">
          <div class="card form-grid">
            <div class="field"><label>Konuşma dili</label><select id="speakerLang"></select></div>
            <button id="createSessionBtn" class="primary" type="button">Yayını Başlat</button>
            <button class="secondary back-role" type="button">Geri</button>
          </div>
        </section>
        <section id="speakerLiveView" class="view live-view">
          <div class="card session-card"><div class="session-row"><div class="badge-row"><span class="badge live">Konuşmacı</span><span id="speakerLangBadge" class="badge"></span><span id="speakerTransportBadge" class="badge"></span></div><div class="session-code-label">Oturum Kodu</div><div id="sessionCode" class="session-code">000000</div><div id="sessionLink" class="session-link"></div></div></div>
          <div class="card transcript speaker-live" id="speakerTranscript"></div>
          <div class="bottom-controls"><div class="mic-row"><span></span><button id="speakerMicBtn" class="mic-btn" type="button" aria-label="Mikrofon"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button><button id="handsFreeBtn" class="handsfree" type="button">Eller Serbest</button></div><button id="endSessionBtn" class="secondary danger" type="button">Yayını Kapat</button></div>
        </section>
        <section id="listenerSetupView" class="view">
          <div class="card form-grid">
            <div class="field"><label>Oturum kodu</label><input id="joinCode" inputmode="numeric" maxlength="6" placeholder="123456" /></div>
            <div class="field"><label>Dinleme dili</label><select id="listenerLang"></select></div>
            <button id="joinSessionBtn" class="primary" type="button">Katıl</button>
            <button class="secondary back-role" type="button">Geri</button>
          </div>
        </section>
        <section id="listenerLiveView" class="view live-view">
          <div class="card session-card"><div class="badge-row"><span class="badge live">Dinleyici</span><span id="listenerLangBadge" class="badge"></span><span id="listenerTransportBadge" class="badge"></span></div></div>
          <div class="card transcript listener-live" id="listenerTranscript"></div>
          <div class="bottom-controls"><button id="leaveSessionBtn" class="secondary" type="button">Ayrıl</button></div>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer" data-no-translate="1">
    <nav class="site-footer-links" aria-label="Alt menü"><a href="/pages/about.html">Hakkımızda</a><a href="/pages/features.html">Özellikler</a><a href="/pages/privacy.html">Gizlilik</a><a href="/pages/contact.html">İletişim</a></nav>
    <div class="site-footer-signature">by Ozyigit's 2026 <span class="gokturk" lang="otk" dir="rtl">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span></div>
  </footer>
  <div id="toast" class="toast"></div>
  <script type="module" src="/js/conference_mode.js?v=CONF_MODERN_20260605_1"></script>
</body>
</html>
