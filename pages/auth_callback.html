<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>italkyAI • Giriş Tamamlanıyor</title>
  <meta name="theme-color" content="#06111d">
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#06111d;color:#fff;font-family:Arial,sans-serif}
    .box{width:min(88vw,420px);padding:28px 22px;border-radius:24px;border:1px solid rgba(83,231,225,.22);background:rgba(255,255,255,.04);text-align:center}
    .spin{width:40px;height:40px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(83,231,225,.18);border-top-color:#53e7e1;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    .t{font-size:17px;font-weight:900;margin:0 0 8px}.s{font-size:12px;font-weight:700;color:rgba(255,255,255,.62);margin:0;line-height:1.5}
  </style>
</head>
<body>
  <main class="box">
    <div class="spin"></div>
    <p class="t">Giriş tamamlanıyor…</p>
    <p class="s" id="status">italkyAI hesabınız hazırlanıyor.</p>
  </main>
  <script type="module">
    import {supabase,persistSupabaseSessionBackup,waitForSupabaseSession} from '/js/supabase_client.js';
    import {ensureAuthAndCacheUser} from '/js/auth.js';
    const HOME='/hosgeldiniz';
    const LOGIN='/pages/login.html';
    const statusEl=document.getElementById('status');
    function nextPath(){
      try{
        const value=String(new URLSearchParams(location.search||'').get('next')||HOME).trim();
        return value.startsWith('/')&&!value.startsWith('//')?value:HOME;
      }catch{return HOME;}
    }
    function backToLogin(message){
      statusEl.textContent=message;
      setTimeout(()=>location.replace(`${LOGIN}?next=${encodeURIComponent(nextPath())}`),500);
    }
    try{
      const code=new URL(location.href).searchParams.get('code');
      if(code){
        const {data,error}=await supabase.auth.exchangeCodeForSession(code);
        if(error)throw error;
        if(data?.session)persistSupabaseSessionBackup(data.session);
      }
      const session=await waitForSupabaseSession({timeoutMs:9000,intervalMs:250,restoreFromBackup:true});
      if(!session?.user?.id){
        backToLogin('Oturum bulunamadı. Giriş ekranına dönülüyor…');
      }else{
        persistSupabaseSessionBackup(session);
        try{await ensureAuthAndCacheUser();}catch(error){console.warn('[auth_callback] profile cache',error);}
        statusEl.textContent='Giriş tamamlandı.';
        location.replace(nextPath());
      }
    }catch(error){
      console.error('[auth_callback] failed',error);
      backToLogin('Giriş tamamlanamadı. Tekrar deneyin.');
    }
  </script>
</body>
</html>
