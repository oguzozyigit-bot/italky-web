<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Giriş Tamamlanıyor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#02000f;
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }
    .box{
      width:min(520px,92vw);
      padding:18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      text-align:center;
    }
    .t{
      font-weight:1000;
      font-size:16px;
      margin:0 0 8px;
    }
    .s{
      font-weight:800;
      font-size:12px;
      color:rgba(255,255,255,.65);
      margin:0;
    }
    .spin{
      width:40px;
      height:40px;
      margin:14px auto 2px;
      border-radius:999px;
      border:3px solid rgba(255,255,255,.18);
      border-top-color:rgba(99,102,241,.95);
      animation:r 1s linear infinite;
    }
    @keyframes r{
      to{ transform:rotate(360deg); }
    }
    .e{
      margin-top:10px;
      font-size:11px;
      color:rgba(255,255,255,.55);
      word-break:break-word;
      display:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <p class="t">Giriş tamamlanıyor…</p>
    <p class="s">Lütfen bekleyin.</p>
    <div class="e" id="errBox"></div>
  </div>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";
    import { ensureAuthAndCacheUser } from "/js/auth.js";

    const LOGIN = "/pages/login.html";
    const MEMBERSHIP = "/pages/membership.html";
    const ACCESS_API = "https://italky-api.onrender.com/api/session/access-state";
    const errBox = document.getElementById("errBox");

    function authLog(reason, detail = {}){
      try{
        console.warn("[membership auth]", reason, detail);
      }catch{}
    }

    function showErr(msg){
      if(!errBox) return;
      errBox.style.display = "block";
      errBox.textContent = String(msg || "");
    }

    function safePath(value){
      const raw = String(value || "").trim();
      if(!raw) return "";
      if(raw.startsWith("http://")) return "";
      if(raw.startsWith("https://")) return "";
      if(raw.startsWith("//")) return "";
      if(!raw.startsWith("/")) return "";
      return raw;
    }

    function getNextTarget(){
      try{
        const url = new URL(location.href);
        return safePath(url.searchParams.get("next") || "");
      }catch{
        return "";
      }
    }

    function goLogin(next = MEMBERSHIP){
      const safeNext = safePath(next) || MEMBERSHIP;
      authLog("callback redirect login", { next: safeNext });
      location.replace(`${LOGIN}?next=${encodeURIComponent(safeNext)}`);
    }

    async function waitForSession(maxMs = 9000){
      const start = Date.now();
      while (Date.now() - start < maxMs){
        const { data:{ session }, error } = await supabase.auth.getSession();
        authLog("callback getSession", { hasSession: !!session, error: error?.message || "" });
        if (session) return session;
        await new Promise(r => setTimeout(r, 250));
      }
      return null;
    }

    async function fetchAccessStateSafe(session){
      try{
        if (!session?.access_token) return null;

        const resp = await fetch(ACCESS_API, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${session.access_token}`
          }
        });

        const json = await resp.json().catch(() => ({}));
        authLog("callback access-state status", { status: resp.status, ok: resp.ok });

        if (!resp.ok) {
          console.warn("auth_callback access-state not ok:", resp.status, json);
          return null;
        }

        return json;
      }catch(e){
        console.warn("auth_callback access-state failed:", e);
        return null;
      }
    }

    function resolvePostLoginTarget(){
      return MEMBERSHIP;
    }

    try{
      const url = new URL(location.href);
      const code = url.searchParams.get("code");
      const next = getNextTarget();

      if (code){
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error){
          console.error("exchangeCodeForSession error:", error);
          showErr("OAuth exchange hatası: " + (error.message || "unknown"));
          setTimeout(() => goLogin(next || MEMBERSHIP), 900);
          throw error;
        }
      }

      const session = await waitForSession();
      if (!session){
        authLog("callback redirect reason", { reason: "session_not_found", target: `${LOGIN}?next=${MEMBERSHIP}` });
        showErr("Oturum bulunamadı. Tekrar giriş sayfasına yönlendiriliyor…");
        setTimeout(() => goLogin(MEMBERSHIP), 900);
        throw new Error("session_not_found");
      }

      try{
        await ensureAuthAndCacheUser();
      }catch(e){
        console.warn("auth_callback ensureAuthAndCacheUser failed:", e);
      }

      await fetchAccessStateSafe(session);

      const target = resolvePostLoginTarget();
      authLog("callback redirect target", { target });
      location.replace(target);

    }catch(e){
      console.error("auth_callback fatal:", e);

      try{
        const { data:{ session } } = await supabase.auth.getSession();
        if (session) {
          location.replace(resolvePostLoginTarget());
        }
      }catch{}
    }
  </script>
</body>
</html>
