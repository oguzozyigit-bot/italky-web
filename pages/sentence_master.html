<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Sentence Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07101f;--panel:rgba(15,23,42,.84);--line:rgba(255,255,255,.12);--txt:#f8fafc;--muted:rgba(226,232,240,.68);--cyan:#67e8f9;--green:#34d399;--red:#fb7185;--gold:#facc15;--violet:#a78bfa;--safeB:env(safe-area-inset-bottom,0px);--shellLift:0px;--grad:linear-gradient(135deg,#a5b4fc,#67e8f9 54%,#34d399)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;outline:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,system-ui,sans-serif;color:var(--txt)}body{background:radial-gradient(circle at 14% 0%,rgba(167,139,250,.16),transparent 35%),radial-gradient(circle at 86% 10%,rgba(103,232,249,.12),transparent 32%),linear-gradient(180deg,#08111f,#030712 58%,#01030a)}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.034) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.034) 1px,transparent 1px);background-size:32px 32px;opacity:.18;pointer-events:none}
#pageContent{position:relative;z-index:2;height:100%;padding:8px 10px calc(12px + var(--safeB) + var(--shellLift));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#pageContent::-webkit-scrollbar{display:none}.app{width:100%;max-width:500px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 18px 42px rgba(0,0,0,.30)}.backBtn{min-width:98px;height:36px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:11px;font-weight:1000;cursor:pointer}.title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:900;letter-spacing:-.25px}.langChip{min-width:56px;height:36px;border-radius:13px;background:var(--grad);color:#04111f;font-size:11px;font-weight:1000;display:flex;align-items:center;justify-content:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{min-height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}.statVal{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:900;line-height:1}.statLab{margin-top:3px;font-size:8px;font-weight:1000;letter-spacing:.65px;color:var(--muted)}.recordRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.recordPill{min-height:34px;border-radius:13px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;font-size:10px;font-weight:1000;overflow:hidden}.recordPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:20px;text-align:center;color:var(--cyan);font-size:12px;font-weight:900}.stage{flex:1;min-height:438px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.84));box-shadow:0 24px 60px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.05);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.promptCard{flex:1;min-height:180px;border-radius:23px;border:1px solid rgba(167,139,250,.22);background:radial-gradient(circle at 50% 0%,rgba(167,139,250,.13),transparent 42%),rgba(255,255,255,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.label{font-size:11px;font-weight:1000;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}.meaning{margin-top:8px;font-size:21px;font-weight:900;line-height:1.25;color:#fff}.hint{margin-top:14px;min-height:20px;font-size:12px;font-weight:900;color:rgba(226,232,240,.64)}.answerBox{min-height:70px;border-radius:20px;border:1px dashed rgba(103,232,249,.45);background:rgba(103,232,249,.07);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;padding:12px}.slot{min-width:28px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:900;color:#fff}.slot.empty{color:rgba(255,255,255,.28)}.tileGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tile{min-height:46px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:16px;font-weight:1000;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.16)}.tile:disabled{opacity:.32;cursor:default}.tile.good{background:linear-gradient(135deg,#bbf7d0,#34d399);color:#04111f;border:0}.tile.bad{background:linear-gradient(135deg,#fecdd3,#fb7185);color:#21040a;border:0}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.actionBtn{min-height:48px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:12px;font-weight:1000;cursor:pointer}.actionBtn.primary{background:var(--grad);color:#061227;border:0}.actionBtn:disabled{opacity:.55;cursor:default}.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,23,.76);backdrop-filter:blur(14px)}.overlay.show{display:flex}.modal{width:min(100%,390px);border-radius:26px;border:1px solid rgba(147,197,253,.20);background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.98));box-shadow:0 28px 70px rgba(0,0,0,.55);padding:22px;text-align:center}.modalTitle{margin:0;font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:900}.modalText{margin:12px 0 16px;white-space:pre-line;line-height:1.55;color:rgba(226,232,240,.78);font-size:14px;font-weight:800}.modalActions{display:grid;gap:9px}.modalBtn{min-height:50px;border-radius:16px;border:0;font:inherit;font-size:14px;font-weight:1000;cursor:pointer}.modalBtn.primary{background:var(--grad);color:#061227}.modalBtn.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
@media(max-width:390px){.topbar{padding:9px 10px}.backBtn{min-width:86px;font-size:10px}.title{font-size:15px}.langChip{min-width:52px}.statVal{font-size:13px}.statLab{font-size:7.4px}.recordPill{font-size:9px}.stage{min-height:410px;padding:12px}.meaning{font-size:19px}.tileGrid{grid-template-columns:repeat(5,1fr);gap:7px}.tile{min-height:43px;font-size:14px}.actions{gap:7px}.actionBtn{font-size:11px}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<main class="app" id="pageContent">
  <header class="topbar"><button id="backBtn" class="backBtn" type="button">← Oyun Menüsü</button><div class="title">SENTENCE BUILDER</div><div id="langChip" class="langChip">EN</div></header>
  <section class="stats" aria-label="Skor bilgileri"><div class="stat"><div id="scoreVal" class="statVal">0</div><div class="statLab">SKOR</div></div><div class="stat"><div id="roundVal" class="statVal">0/15</div><div class="statLab">TUR</div></div><div class="stat"><div id="lifeVal" class="statVal">3</div><div class="statLab">CAN</div></div><div class="stat"><div id="hitVal" class="statVal">0</div><div class="statLab">DOĞRU</div></div></section>
  <section class="recordRow" aria-label="Rekor bilgileri"><div class="recordPill"><span id="personalBestLabel">SENİN REKORUN: —</span></div><div class="recordPill"><span id="globalBestLabel">GENEL REKOR: —</span></div></section>
  <div id="status" class="status">Hazırlanıyor</div>
  <section class="stage"><div class="promptCard"><div class="label">Türkçe anlam</div><div id="meaningText" class="meaning">...</div><div id="hintText" class="hint">Hedef dildeki kelimeyi sırayla kur.</div></div><div id="answerBox" class="answerBox"></div><div id="tileGrid" class="tileGrid"></div><div class="actions"><button id="listenBtn" class="actionBtn" type="button">Dinle</button><button id="jokerBtn" class="actionBtn primary" type="button">Joker <span id="jokerCount">2</span></button><button id="skipBtn" class="actionBtn" type="button">Sonraki</button></div></section>
</main>
<div id="resultOverlay" class="overlay" aria-hidden="true"><div class="modal"><h2 id="resultTitle" class="modalTitle">Oyun Bitti</h2><div id="resultText" class="modalText"></div><div class="modalActions"><button id="replayBtn" class="modalBtn primary" type="button">Yeniden Oyna</button><button id="menuBtn" class="modalBtn secondary" type="button">Oyun Menüsü</button></div></div></div>
<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import { GAME_LANG_META, formatGlobalBest, getGameLangFromUrl, getGlobalBest, getLocalHighScore, refreshGameScoreLabels, saveGameScore, setLocalHighScore, speakGameText } from "/js/game_score_helper.js";

function sbSafe(data){
  if(data instanceof Error)return{message:data.message||String(data),stack:data.stack||"",name:data.name||"Error",code:data.code||""};
  if(data&&typeof data==="object")return data;
  return{value:data};
}
function sbLog(label,data={}){try{console.warn(`[SentenceBuilder] ${label} ${JSON.stringify(sbSafe(data))}`);}catch{console.warn(`[SentenceBuilder] ${label}`);}}
try{mountShell({scroll:"none"});}catch(error){sbLog("shell mount failed",error);}
const $=id=>document.getElementById(id);
const GAME_SLUG="sentence_master",TOTAL_ROUNDS=15,CONTENT_ERROR_TEXT="İçerik şu anda yüklenemedi. Lütfen tekrar deneyin.";
let lang=getGameLangFromUrl("en"),pool=[],runList=[],current=null,runIndex=0,lastLoadDebug={};
let score=0,lives=3,jokers=2,correctCount=0,wrongCount=0,startedAt=Date.now(),scoreSaved=false,busy=false,answerChars=[],pickedChars=[],tileButtons=[];
let audioCtx=null;
function getAudioCtx(){try{if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}return audioCtx;}catch{return null;}}
async function unlockAudio(){try{const ctx=getAudioCtx();if(ctx&&ctx.state==="suspended")await ctx.resume();}catch{}}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume().catch(()=>{});const now=ctx.currentTime+when,osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
function playGood(){beep({freq:640,duration:.08,type:"triangle",gain:.05});beep({freq:900,duration:.10,type:"triangle",gain:.05,when:.08});}
function playBad(){beep({freq:180,duration:.13,type:"sawtooth",gain:.05});}
function playFinish(){beep({freq:520,duration:.10,type:"triangle",gain:.05});beep({freq:760,duration:.12,type:"triangle",gain:.05,when:.12});beep({freq:980,duration:.14,type:"triangle",gain:.05,when:.25});}
["click","touchstart","pointerdown"].forEach(evt=>window.addEventListener(evt,()=>unlockAudio(),{passive:true,once:true}));
function getPublicLangUrl(langCode){return`https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;}
function extractItems(payload){if(Array.isArray(payload))return payload;if(payload&&typeof payload==="object"){for(const key of["items","words","data","list","entries","pool"]){if(Array.isArray(payload[key]))return payload[key];}const entries=Object.entries(payload);if(entries.length&&entries.every(([,value])=>typeof value==="string"))return entries.map(([word,meaning])=>({word,meaning}));}return[];}
function normalizeWordForGame(text){return String(text||"").trim().replace(/\s+/g," ");}
function normalizeKey(text){return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ğüşıöç]+/gi,"").trim();}
function normalizePoolItems(items){return items.map(item=>{const rawWord=item?.word??item?.w??item?.text??item?.term??item?.answer??"";const rawMeaning=item?.meaning??item?.tr??item?.translation??item?.hint??"";return{word:normalizeWordForGame(rawWord),meaning:String(rawMeaning||"").trim()};}).filter(x=>x.word&&x.meaning&&!x.word.includes(" ")&&normalizeKey(x.word).length>=2&&normalizeKey(x.word).length<=14);}
async function loadSentencePool(langCode){
  const url=getPublicLangUrl(langCode);
  lastLoadDebug={selectedLang:langCode,url};
  sbLog("fetch start",{selectedLang:langCode,url});
  try{
    const res=await fetch(url,{method:"GET",cache:"no-store"});
    const contentType=res.headers?.get?.("content-type")||"";
    lastLoadDebug={...lastLoadDebug,status:res.status,ok:res.ok,contentType};
    sbLog("fetch result",{status:res.status,ok:res.ok,contentType});
    if(!res.ok){lastLoadDebug.reason="http_not_ok";return[];}
    const rawText=await res.text();
    const rawPreview=rawText.slice(0,300).replace(/\s+/g," ").trim();
    lastLoadDebug={...lastLoadDebug,rawPreview};
    sbLog("raw preview",{preview:rawPreview});
    let json=null;
    try{json=JSON.parse(rawText);sbLog("json parse",{ok:true,rawType:Array.isArray(json)?"array":typeof json});}
    catch(error){lastLoadDebug={...lastLoadDebug,reason:"json_parse_failed",message:error?.message||String(error)};sbLog("json parse failed",{message:error?.message||String(error),rawPreview});return[];}
    const extracted=extractItems(json);
    const rows=normalizePoolItems(extracted);
    lastLoadDebug={...lastLoadDebug,rawCount:extracted.length,parsedRows:rows.length,firstRow:rows[0]||null,reason:rows.length?"ready":"normalized_empty"};
    sbLog("parsed rows",{count:rows.length,rawCount:extracted.length});
    sbLog("first row",rows[0]||{});
    return rows;
  }catch(error){lastLoadDebug={...lastLoadDebug,reason:"fetch_failed",message:error?.message||String(error),stack:error?.stack||""};sbLog("fetch failed",error);return[];}
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setStatus(msg,color="var(--cyan)"){$("status").textContent=msg;$("status").style.color=color;}
function setBusy(next){busy=next;document.querySelectorAll(".tile").forEach(btn=>btn.disabled=next||btn.dataset.used==="1");$("listenBtn").disabled=next||!current;$("jokerBtn").disabled=next||!current||jokers<=0;$("skipBtn").disabled=next||!current;}
function updateHud(){const meta=GAME_LANG_META[lang]||GAME_LANG_META.en;$("langChip").textContent=lang.toUpperCase();$("scoreVal").textContent=score;$("roundVal").textContent=`${Math.min(runIndex+1,TOTAL_ROUNDS)}/${TOTAL_ROUNDS}`;$("lifeVal").textContent=lives;$("hitVal").textContent=correctCount;$("jokerCount").textContent=jokers;$("hintText").textContent=`${meta.flag} ${meta.name} kelimeyi sırayla kur.`;}
async function refreshScores(){const localBest=getLocalHighScore(GAME_SLUG,lang);$("personalBestLabel").textContent=`SENİN REKORUN: ${localBest||"—"}`;$("globalBestLabel").textContent="GENEL REKOR: —";try{return await refreshGameScoreLabels({gameSlug:GAME_SLUG,lang,personalEl:$("personalBestLabel"),globalEl:$("globalBestLabel")});}catch(error){sbLog("score refresh failed",error);return null;}}
function updateLocalBest(){const best=getLocalHighScore(GAME_SLUG,lang);if(score>best){setLocalHighScore(GAME_SLUG,lang,score);$("personalBestLabel").textContent=`SENİN REKORUN: ${score}`;return true;}return false;}
async function saveScoreOnce(){if(scoreSaved)return;scoreSaved=true;updateLocalBest();const durationSeconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));try{await saveGameScore({gameSlug:GAME_SLUG,lang,score,correctCount,wrongCount,durationSeconds});}catch(error){sbLog("score save failed",error);}try{const best=await getGlobalBest(GAME_SLUG,lang);$("globalBestLabel").textContent=formatGlobalBest(best);}catch(error){sbLog("global best refresh failed",error);}}
function isLockDevicePermissionError(error){const code=String(error?.code||"");const message=String(error?.message||error||"").toLowerCase();return code==="42501"||message.includes("lock_device")||message.includes("permission denied for function lock_device");}
async function ensureGameAccessForPlay(){try{const ok=await ensureAuthAndCacheUser();if(!ok)return false;return true;}catch(error){const payload={code:error?.code||"",message:error?.message||String(error)};if(isLockDevicePermissionError(error)){sbLog("device lock skipped",payload);}else{sbLog("auth init skipped",{...payload,stack:error?.stack||""});}return true;}}
function buildItems(words){const seen=new Set();return words.filter(item=>{const key=normalizeKey(item.word)+":"+normalizeKey(item.meaning);if(!item.word||!item.meaning||seen.has(key))return false;seen.add(key);return true;});}
function pickRun(items){return shuffle(items).slice(0,TOTAL_ROUNDS);}
function wordChars(word){return Array.from(String(word||"").toLocaleUpperCase(lang));}
function renderAnswer(){const box=$("answerBox");box.innerHTML="";answerChars.forEach((_,i)=>{const d=document.createElement("div");d.className=`slot ${pickedChars[i]?"":"empty"}`;d.textContent=pickedChars[i]||"•";box.appendChild(d);});}
function renderTiles(){const grid=$("tileGrid");grid.innerHTML="";tileButtons=[];shuffle(answerChars).forEach((char,index)=>{const btn=document.createElement("button");btn.type="button";btn.className="tile";btn.textContent=char;btn.dataset.char=char;btn.dataset.index=String(index);btn.onclick=()=>handleTile(btn);grid.appendChild(btn);tileButtons.push(btn);});}
function renderCurrent(){try{if(!current){setContentUnavailable("render_failed",{message:"missing_current"});return;}$("meaningText").textContent=current.meaning;answerChars=wordChars(current.word);pickedChars=[];renderAnswer();renderTiles();sbLog("render question",{meaning:current.meaning,answer:current.word,letterCount:answerChars.length});updateHud();setBusy(false);setStatus("Kelimeyi doğru sırayla kur");}catch(error){setContentUnavailable("render_failed",{message:error?.message||String(error),stack:error?.stack||""});}}
function nextRound(){if(lives<=0||runIndex>=runList.length){finishGame();return;}current=runList[runIndex];renderCurrent();}
function completeRound(){correctCount++;score+=100+Math.max(0,12-runIndex)*3+jokers*2;playGood();setStatus("Doğru","var(--green)");runIndex++;updateHud();setBusy(true);setTimeout(()=>nextRound(),950);}
function handleTile(btn){if(busy||!current||!btn||btn.disabled)return;const expected=answerChars[pickedChars.length];const actual=btn.dataset.char||btn.textContent;if(actual===expected){btn.dataset.used="1";btn.disabled=true;btn.classList.add("good");pickedChars.push(actual);renderAnswer();playGood();if(pickedChars.length===answerChars.length)completeRound();else updateHud();return;}btn.classList.add("bad");playBad();wrongCount++;lives=Math.max(0,lives-1);setStatus("Sıra yanlış","var(--red)");updateHud();if(lives<=0){setBusy(true);setTimeout(()=>finishGame(),900);}else{setTimeout(()=>btn.classList.remove("bad"),420);}}
function useJoker(){if(busy||!current||jokers<=0)return;const expected=answerChars[pickedChars.length];const btn=tileButtons.find(item=>!item.disabled&&(item.dataset.char||item.textContent)===expected);if(!btn)return;jokers--;btn.dataset.used="1";btn.disabled=true;btn.classList.add("good");pickedChars.push(expected);renderAnswer();beep({freq:520,duration:.09,type:"triangle",gain:.04});updateHud();if(pickedChars.length===answerChars.length)completeRound();}
function skipRound(){if(busy||!current)return;wrongCount++;lives=Math.max(0,lives-1);setStatus(`Doğru cevap: ${current.word}`,"var(--red)");runIndex++;updateHud();setBusy(true);setTimeout(()=>nextRound(),1050);}
function setContentUnavailable(reason="no_content",details={}){current=null;runList=[];$("meaningText").textContent=CONTENT_ERROR_TEXT;$("answerBox").innerHTML="";$("tileGrid").innerHTML="";setStatus(CONTENT_ERROR_TEXT,"var(--gold)");setBusy(true);sbLog("content unavailable",{reason,lang,...lastLoadDebug,...details});}
async function finishGame(){setBusy(true);playFinish();const newBest=updateLocalBest();await saveScoreOnce();await refreshScores();$("resultTitle").textContent=newBest?"Yeni Rekor!":"Oyun Bitti";$("resultText").textContent=`Skor: ${score}\nDoğru: ${correctCount}\nYanlış: ${wrongCount}\n${$("personalBestLabel").textContent}\n${$("globalBestLabel").textContent}`;$("resultOverlay").classList.add("show");$("resultOverlay").setAttribute("aria-hidden","false");}
function hideResult(){$("resultOverlay").classList.remove("show");$("resultOverlay").setAttribute("aria-hidden","true");}
async function initGame(){try{hideResult();setStatus("Hazırlanıyor");setBusy(true);$("meaningText").textContent="...";$("answerBox").innerHTML="";$("tileGrid").innerHTML="";const ok=await ensureGameAccessForPlay();if(!ok){location.href="/pages/login.html";return;}score=0;lives=3;jokers=2;correctCount=0;wrongCount=0;runIndex=0;scoreSaved=false;startedAt=Date.now();current=null;answerChars=[];pickedChars=[];updateHud();refreshScores();const rows=await loadSentencePool(lang);pool=buildItems(rows);sbLog("usable rows",{count:pool.length,sourceCount:rows.length});if(pool.length<4){setContentUnavailable(lastLoadDebug.reason||"normalized_empty",{usableCount:pool.length});return;}runList=pickRun(pool);sbLog("run list",{count:runList.length,first:runList[0]||null});nextRound();}catch(error){sbLog("init failed",error);setContentUnavailable("init_failed",{message:error?.message||String(error),stack:error?.stack||""});}}
$("backBtn").onclick=()=>{location.href="/pages/game_menu.html"};$("menuBtn").onclick=()=>{location.href="/pages/game_menu.html"};$("replayBtn").onclick=()=>initGame();$("listenBtn").onclick=()=>{if(current)speakGameText(current.meaning,"tr");};$("jokerBtn").onclick=useJoker;$("skipBtn").onclick=skipRound;
window.addEventListener("load",()=>{sbLog("ready",{lang,href:location.href,ads:false,flow:"game-menu-direct",content:"direct-storage-loader"});initGame();});
</script>
</body>
</html>
