<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>italkyAI Aktivasyon</title>
    <meta name="theme-color" content="#05070f">
    <style>
        body { margin: 0; padding: 0; background-color: #05070f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #05070f, #0b1020); }
        .container { text-align: center; padding: 30px; background: #0b1020; border-radius: 16px; border: 1px solid #1a2235; width: 90%; max-width: 400px; }
        .brand { font-size: 32px; font-weight: 800; margin-bottom: 20px; }
        .brand .italky { color: #ffffff; }
        .brand .ai { color: #5e5ce6; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-google { background: #ffffff; color: #000000; }
        .btn-apple { background: #000000; color: #ffffff; border: 1px solid #333; }
        .btn-confirm { background: #ccff00; color: #000000; font-weight: 800; margin-top: 20px; }
        .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
        #login-section, #confirm-section, #loading-section, #error-section { display: none; }
        .active-section { display: block !important; }
        .user-info { font-size: 14px; color: #a0aabf; margin-bottom: 20px; }
        .error-box { margin-top: 18px; padding: 14px; border: 1px solid rgba(255, 178, 178, .25); border-radius: 14px; background: rgba(255, 178, 178, .08); color: #ffd9d9; font-size: 14px; line-height: 1.5; }
        .change-account { color: #a0aabf; font-size: 13px; text-decoration: underline; display: block; margin-bottom: 20px; }
        .error-action { display: none; margin-top: 16px; }
        .error-action.active-section { display: flex !important; }
        svg { width: 20px; height: 20px; margin-right: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">
        <span class="italky">italky</span><span class="ai">AI</span>
    </div>

    <div id="login-section">
        <p style="margin-bottom: 20px; color: #a0aabf; font-size: 14px;">Aktivasyon seçtiğiniz hesaba kalıcı olarak tanımlanacaktır.</p>

        <button class="btn btn-apple" onclick="loginApple()">
            <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
            Apple ile Hesap Seç
        </button>

        <button class="btn btn-google" onclick="loginGoogle()">
            <svg viewBox="0 0 488 512" fill="currentColor" aria-hidden="true"><path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/></svg>
            Google ile Hesap Seç
        </button>
    </div>

    <div id="confirm-section">
        <p class="user-info">Hesap: <strong id="user-email" style="color: #fff;"></strong></p>
        <a href="#" onclick="changeAccount()" class="change-account">Farklı bir hesap seç</a>
        <p style="color: #ffb2b2; font-size: 13px; margin-bottom: 20px;">Bu işlem geri alınamaz.</p>
        <button id="confirm-btn" class="btn btn-confirm" onclick="triggerRedeem()">Aktivasyonu Onayla</button>
    </div>

    <div id="loading-section">
        <h3 style="color: #ccff00;">İşlem Başarılı!</h3>
        <p style="color: #a0aabf; font-size: 14px;">Uygulamaya yönlendiriliyorsunuz...</p>
    </div>

    <div id="error-section">
        <div id="error-text" class="error-box"></div>
        <button id="open-app-btn" class="btn btn-confirm error-action" onclick="redirectToApp()">Uygulamayı Aç</button>
    </div>
</div>

<script type="module">
    import { supabase } from "/js/supabase_client.js";

    const API_BASE = "https://italky-api.onrender.com";
    const IOS_STORE = "https://apps.apple.com/app/italkyai/id6768123713";
    const ANDROID_STORE = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";

    const loginSection = document.getElementById("login-section");
    const confirmSection = document.getElementById("confirm-section");
    const loadingSection = document.getElementById("loading-section");
    const errorSection = document.getElementById("error-section");
    const errorText = document.getElementById("error-text");
    const openAppBtn = document.getElementById("open-app-btn");
    const userEmail = document.getElementById("user-email");
    const confirmBtn = document.getElementById("confirm-btn");

    let activeSession = null;

    function show(section) {
        [loginSection, confirmSection, loadingSection, errorSection].forEach((el) => el.classList.remove("active-section"));
        section.classList.add("active-section");
    }

    function codeFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return String(params.get("kod") || params.get("code") || "")
            .trim()
            .toUpperCase()
            .replace(/[^A-Z0-9_-]/g, "")
            .slice(0, 64);
    }

    function returnUrl() {
        const code = codeFromUrl();
        return code ? `/pages/code_load.html?kod=${encodeURIComponent(code)}` : "/pages/code_load.html";
    }

    function showError(message, { showOpenApp = false } = {}) {
        errorText.textContent = message || "Aktivasyon sırasında bir hata oluştu.";
        openAppBtn.classList.toggle("active-section", showOpenApp);
        show(errorSection);
    }

    function isAlreadyUsedError(errorValue) {
        return String(errorValue || "").toUpperCase().includes("ALREADY_USED");
    }

    window.redirectToApp = function redirectToApp() {
        window.location.href = "italkyai://";

        setTimeout(() => {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                window.location.href = IOS_STORE;
            } else {
                window.location.href = ANDROID_STORE;
            }
        }, 2500);
    };

    async function refreshSession() {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        activeSession = data?.session || null;
        return activeSession;
    }

    async function boot() {
        try {
            const code = codeFromUrl();
            if (!code || code.length < 4) {
                showError("Geçerli bir aktivasyon kodu bulunamadı.");
                return;
            }

            const session = await refreshSession();
            if (!session?.user?.id) {
                show(loginSection);
                return;
            }

            userEmail.textContent = session.user.email || session.user.id;
            show(confirmSection);
        } catch (error) {
            showError(error?.message || "Oturum kontrolü yapılamadı.");
        }
    }

    window.loginGoogle = async function loginGoogle() {
        try {
            await supabase.auth.signOut();
            const callbackUrl = new URL("/pages/auth_callback.html", window.location.origin);
            callbackUrl.searchParams.set("next", returnUrl());
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: callbackUrl.toString(),
                    queryParams: {
                        access_type: "offline",
                        prompt: "select_account"
                    }
                }
            });
            if (error) throw error;
        } catch (error) {
            showError(error?.message || "Google girişi başlatılamadı.");
        }
    };

    window.changeAccount = async function changeAccount() {
        try {
            await supabase.auth.signOut();
        } finally {
            window.location.href = `/pages/login.html?next=${encodeURIComponent(returnUrl())}`;
        }
    };

    window.loginApple = async function loginApple() {
        try {
            await supabase.auth.signOut();
            const callbackUrl = new URL("/pages/auth_callback.html", window.location.origin);
            callbackUrl.searchParams.set("next", returnUrl());
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "apple",
                options: {
                    redirectTo: callbackUrl.toString()
                }
            });
            if (error) throw error;
        } catch (error) {
            showError(error?.message || "Apple girişi başlatılamadı.");
        }
    };

    window.triggerRedeem = async function triggerRedeem() {
        const code = codeFromUrl();
        if (!code || code.length < 4) {
            showError("Geçerli bir aktivasyon kodu bulunamadı.");
            return;
        }

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Onaylanıyor...";

        try {
            const session = await refreshSession();
            if (!session?.access_token || !session?.user?.id) {
                showError("Oturum doğrulanamadı. Lütfen yeniden giriş yapın.");
                return;
            }

            const response = await fetch(`${API_BASE}/api/promo/redeem`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${session.access_token}`
                },
                body: JSON.stringify({
                    source: "manual",
                    code,
                    user_id: session.user.id
                })
            });

            const rawBody = await response.text();
            let json = null;
            try { json = JSON.parse(rawBody); } catch {}

            if (!response.ok || !json?.ok) {
                const reason = json?.reason || json?.detail || rawBody || `API hata kodu: ${response.status}`;
                if (isAlreadyUsedError(reason)) {
                    showError("Bu kod daha önce kullanılmıştır.", { showOpenApp: true });
                    return;
                }
                throw new Error(reason);
            }

            show(loadingSection);
            redirectToApp();
        } catch (error) {
            confirmBtn.disabled = false;
            confirmBtn.textContent = "Aktivasyonu Onayla";
            showError(error?.message || "Aktivasyon tamamlanamadı.");
        }
    };

    boot();
</script>
</body>
</html>
