<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Kod İle Yükle</title>
  <meta name="theme-color" content="#05070f"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:#fff;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --ai-grad:linear-gradient(135deg,#8bd3ff 0%,#7c5cff 45%,#ff66c4 100%);
      --ok:#9df0b9;
      --err:#ffb2b2;
      --warn:#ffd59a;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#05070f;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 18% 14%, rgba(124,92,255,.16), transparent 28%),
        radial-gradient(circle at 82% 20%, rgba(139,211,255,.13), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255,102,196,.08), transparent 25%),
        linear-gradient(180deg,#05070f 0%, #090d19 100%);
    }

    #pageContent{
      height:100%;
      max-width:560px;
      margin:auto;
      padding:14px;
      overflow:auto;
      display:flex;
      align-items:center;
    }

    .hero{
      width:100%;
      border-radius:28px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      padding:22px 18px;
      text-align:center;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
    }

    .title{
      margin:0 0 12px;
      font-size:28px;
      font-weight:1000;
      line-height:1.12;
    }

    .desc{
      margin:0 0 24px;
      color:var(--muted);
      font-size:15px;
      font-weight:800;
      line-height:1.7;
    }

    .code-box{
      width:100%;
      min-height:76px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      text-align:center;
      font-size:34px;
      font-weight:1000;
      letter-spacing:10px;
      margin-bottom:16px;
      padding:0 12px;
      font-family:'Outfit',sans-serif;
    }

    .submit-btn{
      width:100%;
      min-height:58px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:18px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
      box-shadow:0 14px 28px rgba(124,92,255,.18);
    }

    .submit-btn:disabled{
      opacity:.72;
      cursor:default;
    }

    .result{
      margin-top:18px;
      border-radius:22px;
      padding:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      display:none;
      text-align:left;
    }

    .result.show{ display:block; }

    .result.ok{
      border-color:rgba(157,240,185,.28);
      background:linear-gradient(135deg, rgba(157,240,185,.10), rgba(255,255,255,.03));
    }

    .result.err{
      border-color:rgba(255,178,178,.28);
      background:linear-gradient(135deg, rgba(255,178,178,.10), rgba(255,255,255,.03));
    }

    .result-title{
      font-size:18px;
      font-weight:1000;
      margin:0 0 8px;
    }

    .result-text{
      font-size:14px;
      line-height:1.65;
      font-weight:800;
      color:rgba(255,255,255,.88);
    }

    .debug-box{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color:var(--warn);
      font-size:12px;
      line-height:1.55;
      font-weight:800;
      word-break:break-word;
      display:none;
    }

    .debug-box.show{
      display:block;
    }

    .result-actions{
      display:flex;
      gap:12px;
      margin-top:14px;
    }

    .result-btn{
      flex:1;
      min-height:52px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
    }

    .result-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <section class="hero">
      <h1 class="title">Kod İle Yükle</h1>
      <p class="desc">
        Satın aldığınız kart üzerindeki 6 haneli kodu yazarak,
        jeton yükleme işlemini tamamlayınız.
      </p>

      <input id="manualCode" class="code-box" type="text" maxlength="6" inputmode="numeric" placeholder="000000"/>
      <button id="loadBtn" class="submit-btn" type="button">YÜKLE</button>

      <div id="resultBox" class="result">
        <div id="resultTitle" class="result-title"></div>
        <div id="resultText" class="result-text"></div>
        <div id="debugBox" class="debug-box"></div>

        <div class="result-actions">
          <button class="result-btn secondary" type="button" id="goHomeBtn">Anasayfaya Dön</button>
          <button class="result-btn" type="button" id="retryBtn">Tekrar Dene</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });

    const API_BASE = "https://italky-api.onrender.com";
    const manualCode = document.getElementById("manualCode");
    const loadBtn = document.getElementById("loadBtn");
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const debugBox = document.getElementById("debugBox");
    const goHomeBtn = document.getElementById("goHomeBtn");
    const retryBtn = document.getElementById("retryBtn");

    function showResult(ok, title, text, debugText = "") {
      resultBox.className = "result show " + (ok ? "ok" : "err");
      resultTitle.textContent = title;
      resultText.innerHTML = text;

      if (debugText) {
        debugBox.textContent = debugText;
        debugBox.classList.add("show");
      } else {
        debugBox.textContent = "";
        debugBox.classList.remove("show");
      }
    }

    function mapCodeLoadError(reasonRaw, detailRaw = "") {
      const reason = String(reasonRaw || "").trim().toUpperCase();
      const detail = String(detailRaw || "").trim();

      if (reason === "CODE_NOT_FOUND") {
        return "Bu kod sistemde kayıtlı değil.";
      }
      if (reason === "CARD_ALREADY_USED") {
        return "Bu kod daha önce kullanılmış.";
      }
      if (reason === "CARD_BLOCKED") {
        return "Bu kart kullanıma kapatılmış.";
      }
      if (reason === "CARD_EXPIRED") {
        return "Bu kartın kullanım süresi dolmuş.";
      }
      if (reason === "INVALID_TOKEN_AMOUNT") {
        return "Bu kartta yüklenebilir jeton bulunamadı.";
      }
      if (reason === "CARD_NOT_FOUND") {
        return "Bu karta ait kayıt bulunamadı.";
      }

      if (detail) {
        return "İşlem sırasında sistem hatası oluştu.";
      }

      return "İşlem sırasında bağlantı veya sistem hatası oluştu.";
    }

    async function getAuthHeaders() {
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token || "";
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function getUserId() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || "";
    }

    async function redeemCode() {
      const code = String(manualCode.value || "").trim();

      if (code.length !== 6) {
        showResult(false, "İşlem Başarısız", "Lütfen 6 haneli kodu eksiksiz giriniz.");
        return;
      }

      const userId = await getUserId();
      if (!userId) {
        location.href = "/pages/login.html";
        return;
      }

      loadBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/nfc/redeem-manual-code`, {
          method: "POST",
          headers: await getAuthHeaders(),
          body: JSON.stringify({
            manual_code: code,
            user_id: userId
          })
        });

        const json = await res.json().catch(() => null);

        if (!json) {
          showResult(
            false,
            "İşlem Başarısız",
            "Kod ile yükleme işlemi gerçekleştirilemedi.",
            `HTTP: ${res.status} • JSON parse edilemedi`
          );
          loadBtn.disabled = false;
          return;
        }

        if (json.ok) {
          if (typeof json.tokens_after === "number") {
            try { setHeaderTokens(json.tokens_after); } catch {}
          }

          showResult(
            true,
            "Kod ile Yükleme İşlemi Gerçekleşmiştir",
            `Yüklenen: <b>${json.loaded_tokens}</b><br>Toplam Bakiye: <b>${json.tokens_after}</b>`
          );
          loadBtn.disabled = false;
          return;
        }

        const reasonText = mapCodeLoadError(json.reason, json.detail);

        showResult(
          false,
          "İşlem Başarısız",
          `Kod ile yükleme işlemi gerçekleştirilemedi.<br>Sebep: <b>${reasonText}</b>`,
          `reason=${json.reason || "-"} • detail=${json.detail || "-"} • http=${res.status}`
        );

        loadBtn.disabled = false;
      } catch (e) {
        showResult(
          false,
          "İşlem Başarısız",
          "Kod ile yükleme işlemi gerçekleştirilemedi.",
          `fetch_error=${e?.message || e}`
        );
        loadBtn.disabled = false;
      }
    }

    loadBtn?.addEventListener("click", redeemCode);

    manualCode?.addEventListener("input", () => {
      manualCode.value = manualCode.value.replace(/\D/g, "").slice(0, 6);
    });

    goHomeBtn?.addEventListener("click", () => {
      location.href = "/pages/home.html";
    });

    retryBtn?.addEventListener("click", () => {
      resultBox.className = "result";
      debugBox.classList.remove("show");
      debugBox.textContent = "";
      loadBtn.disabled = false;
      manualCode.focus();
    });
  </script>
</body>
</html>
