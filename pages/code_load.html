<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Promosyon Kodu Gir</title>
  <meta name="theme-color" content="#05070f"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:#fff;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --ai-grad:linear-gradient(135deg,#8bd3ff 0%,#7c5cff 45%,#ff66c4 100%);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#05070f;color:#fff;
      font-family:'Outfit',sans-serif;
    }
    body{
      background:
        radial-gradient(circle at 18% 14%, rgba(124,92,255,.16), transparent 28%),
        radial-gradient(circle at 82% 20%, rgba(139,211,255,.13), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255,102,196,.08), transparent 25%),
        linear-gradient(180deg,#05070f 0%, #090d19 100%);
    }
    #pageContent{
      height:100%;
      max-width:560px;
      margin:auto;
      padding:14px;
      overflow:auto;
      display:flex;
      align-items:center;
    }
    .hero{
      width:100%;
      border-radius:28px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      padding:22px 18px;
      text-align:center;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
    }
    .title{
      margin:0 0 12px;
      font-size:28px;
      font-weight:1000;
      line-height:1.12;
    }
    .desc{
      margin:0 0 24px;
      color:var(--muted);
      font-size:15px;
      font-weight:800;
      line-height:1.7;
    }
    .code-box{
      width:100%;
      min-height:76px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      text-align:center;
      font-size:24px;
      font-weight:1000;
      letter-spacing:2px;
      margin-bottom:16px;
      padding:0 12px;
      font-family:'Outfit',sans-serif;
      text-transform:uppercase;
    }
    .submit-btn{
      width:100%;
      min-height:58px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:18px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
      box-shadow:0 14px 28px rgba(124,92,255,.18);
    }
    .submit-btn:disabled{opacity:.72;cursor:default}
    .result{
      margin-top:18px;
      border-radius:22px;
      padding:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      display:none;
      text-align:left;
    }
    .result.show{display:block}
    .result.ok{
      border-color:rgba(157,240,185,.28);
      background:linear-gradient(135deg, rgba(157,240,185,.10), rgba(255,255,255,.03));
    }
    .result.err{
      border-color:rgba(255,178,178,.28);
      background:linear-gradient(135deg, rgba(255,178,178,.10), rgba(255,255,255,.03));
    }
    .result-title{
      font-size:18px;
      font-weight:1000;
      margin:0 0 8px;
    }
    .result-text{
      font-size:14px;
      line-height:1.65;
      font-weight:800;
      color:rgba(255,255,255,.88);
    }
    .result-actions{
      display:flex;
      gap:12px;
      margin-top:14px;
    }
    .result-btn{
      flex:1;
      min-height:52px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
    }
    .result-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <section class="hero">
      <h1 class="title">Promosyon Kodu Gir</h1>
      <p class="desc">
        Size verilen promosyon kodunu girerek üyelik, kampanya veya hediye hakkınızı hesabınıza tanımlayabilirsiniz.
      </p>

      <input id="manualCode" class="code-box" type="text" maxlength="32" placeholder="KODUNUZU GİRİN"/>
      <button id="loadBtn" class="submit-btn" type="button">KODU UYGULA</button>

      <div id="resultBox" class="result">
        <div id="resultTitle" class="result-title"></div>
        <div id="resultText" class="result-text"></div>

        <div class="result-actions">
          <button class="result-btn secondary" type="button" id="goHomeBtn">Anasayfaya Dön</button>
          <button class="result-btn" type="button" id="retryBtn">Tekrar Dene</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });

    const API_BASE = "https://italky-api.onrender.com";
    const manualCode = document.getElementById("manualCode");
    const loadBtn = document.getElementById("loadBtn");
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const goHomeBtn = document.getElementById("goHomeBtn");
    const retryBtn = document.getElementById("retryBtn");

    function showResult(ok, title, html) {
      resultBox.className = "result show " + (ok ? "ok" : "err");
      resultTitle.textContent = title;
      resultText.innerHTML = html;
    }

    function mapPromoError(reasonRaw) {
      const reason = String(reasonRaw || "").trim().toUpperCase();

      if (reason === "CODE_REQUIRED") return "Lütfen promosyon kodunu giriniz.";
      if (reason === "PROMO_NOT_FOUND") return "Bu promosyon kodu sistemde kayıtlı değil.";
      if (reason === "PROMO_ALREADY_USED") return "Bu promosyon kodu daha önce kullanılmıştır.";
      if (reason === "PROMO_ALREADY_USED_BY_USER") return "Bu hesapta daha önce promosyon kodu kullanılmış veya aktif üyelik bulunmaktadır.";
      if (reason === "PROMO_INACTIVE" || reason === "PROMO_NOT_ACTIVE") return "Bu promosyon kullanıma kapalı.";
      if (reason === "PROMO_EXPIRED") return "Bu promosyonun süresi dolmuş.";
      if (reason === "PROMO_NOT_STARTED") return "Bu promosyon henüz aktif değil.";
      if (reason === "PROMO_NOT_ELIGIBLE_FOR_PAID_MEMBER") return "Bu hesapta daha önce promosyon kodu kullanılmış veya aktif üyelik bulunmaktadır.";
      if (reason === "PROMO_NOT_ALLOWED_WHILE_MEMBERSHIP_ACTIVE") return "Bu hesapta daha önce promosyon kodu kullanılmış veya aktif üyelik bulunmaktadır.";
      if (reason === "PROMO_USER_LIMIT_REACHED") return "Bu kampanya için kullanım hakkınız dolmuş.";
      if (reason === "PROMO_GLOBAL_LIMIT_REACHED") return "Bu kampanyanın toplam kullanım limiti dolmuş.";
      if (reason === "PROMO_ACCOUNT_MISMATCH") return "Bu promosyon başka bir hesapla eşleşmiş.";
      if (reason === "PROMO_SKIPPED_ACTIVE_MEMBERSHIP") return "Aktif üyelik nedeniyle bu promosyon uygulanmadı.";
      if (reason === "CAMPAIGN_NOT_FOUND") return "Bu promosyon kampanyası bulunamadı.";
      if (reason === "PROFILE_NOT_FOUND") return "Kullanıcı profili bulunamadı.";

      return "İşlem sırasında sistem hatası oluştu.";
    }

    function renderSuccessMessage(json) {
      const parts = [];

      if ((json.membership_months || 0) > 0) {
        parts.push(`<b>${json.membership_months} aylık üyelik</b> hesabınıza tanımlandı.`);
      }

      if ((json.tokens_loaded || 0) > 0) {
        parts.push(`<b>${json.tokens_loaded} jeton</b> hesabınıza yüklendi.`);
      }

      if (json.membership_ends_at) {
        const d = new Date(json.membership_ends_at);
        parts.push(`Yeni üyelik bitişi: <b>${d.toLocaleDateString("tr-TR")}</b>`);
      }

      if (typeof json.tokens_after === "number") {
        try { setHeaderTokens(json.tokens_after); } catch {}
        parts.push(`Toplam jeton: <b>${json.tokens_after}</b>`);
      }

      if (!parts.length && json.message) {
        parts.push(json.message);
      }

      return parts.join("<br>");
    }

    async function getAuthHeaders() {
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token || "";
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function getUserId() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || "";
    }

    async function redeemCode() {
      const code = String(manualCode.value || "").trim().toUpperCase();

      if (code.length < 4) {
        showResult(false, "İşlem Başarısız", "Lütfen promosyon kodunu eksiksiz giriniz.");
        return;
      }

      const userId = await getUserId();
      if (!userId) {
        location.href = "/pages/login.html";
        return;
      }

      loadBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/promo/redeem`, {
          method: "POST",
          headers: await getAuthHeaders(),
          body: JSON.stringify({
            source: "manual",
            code: code,
            user_id: userId
          })
        });

        const json = await res.json().catch(() => null);

        if (!json) {
          showResult(false, "İşlem Başarısız", "Promosyon kodu uygulanamadı.");
          loadBtn.disabled = false;
          return;
        }

        if (json.ok) {
          showResult(true, "Promosyon Başarıyla Tanımlandı", renderSuccessMessage(json));
          loadBtn.disabled = false;
          return;
        }

        showResult(false, "İşlem Başarısız", mapPromoError(json.reason || json.detail));
        loadBtn.disabled = false;
      } catch (e) {
        showResult(false, "İşlem Başarısız", "Promosyon kodu uygulanamadı.");
        loadBtn.disabled = false;
      }
    }

    loadBtn?.addEventListener("click", redeemCode);

    manualCode?.addEventListener("input", () => {
      manualCode.value = manualCode.value
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, "")
        .slice(0, 32);
    });

    goHomeBtn?.addEventListener("click", () => {
      location.href = "/pages/home.html";
    });

    retryBtn?.addEventListener("click", () => {
      resultBox.className = "result";
      loadBtn.disabled = false;
      manualCode.focus();
    });
  </script>
</body>
</html>
