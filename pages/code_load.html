<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Aktivasyon</title>
  <meta name="theme-color" content="#0A192F"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none}
    html,body{width:100%;height:100%;overflow:hidden;background:#0A192F;color:#fff;font-family:'Inter',sans-serif}

    /* Shell splash */
    body:not(.shell-ready)::before{content:"italkyAI";position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:#0A192F;color:rgba(255,255,255,.8);font-family:'Inter',sans-serif;font-size:26px;font-weight:700;letter-spacing:.5px;transition:opacity .18s ease}
    body:not(.shell-ready)::after{content:"";position:fixed;left:50%;top:calc(50% + 44px);z-index:1000000;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid rgba(0,123,255,.2);border-top-color:#007BFF;animation:spin .8s linear infinite}
    body:not(.shell-ready) #pageContent{opacity:0;pointer-events:none}
    body.shell-ready::before,body.shell-ready::after{opacity:0;pointer-events:none}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

    #pageContent{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:40px 32px;
      text-align:center;
      animation:fadeIn .35s ease both;
    }

    /* Logo / wordmark */
    .brand{
      font-size:18px;
      font-weight:700;
      color:rgba(255,255,255,.45);
      letter-spacing:.8px;
      text-transform:uppercase;
      margin-bottom:32px;
    }
    .brand span{color:#007BFF}

    /* Spinner */
    .spinner{
      width:52px;
      height:52px;
      border-radius:50%;
      border:3px solid rgba(0,123,255,.18);
      border-top-color:#007BFF;
      animation:spin .8s linear infinite;
      margin:0 auto 24px;
    }

    .state-icon{
      width:56px;
      height:56px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 24px;
      font-size:24px;
    }
    .state-icon.ok{background:rgba(0,200,120,.12);border:2px solid rgba(0,200,120,.3);color:#00C878}
    .state-icon.err{background:rgba(255,80,80,.10);border:2px solid rgba(255,80,80,.28);color:#FF5050}

    .state-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:10px;
      color:#fff;
    }

    .state-body{
      font-size:14px;
      font-weight:500;
      color:rgba(255,255,255,.58);
      line-height:1.7;
    }
    .state-body b{color:rgba(255,255,255,.9)}

    .loading-label{
      font-size:15px;
      font-weight:600;
      color:rgba(255,255,255,.80);
      animation:pulse 1.8s ease infinite;
      line-height:1.6;
    }
    .loading-sub{
      margin-top:8px;
      font-size:12px;
      font-weight:500;
      color:rgba(255,255,255,.35);
      letter-spacing:.3px;
    }

    .home-btn{
      display:inline-block;
      margin-top:28px;
      padding:13px 32px;
      background:#007BFF;
      color:#fff;
      font-size:14px;
      font-weight:700;
      border:none;
      border-radius:12px;
      cursor:pointer;
      text-decoration:none;
      transition:background .18s;
      letter-spacing:.2px;
    }
    .home-btn:hover{background:#0068d6}

    .code-pill{
      display:inline-block;
      margin-top:16px;
      padding:5px 14px;
      background:rgba(0,123,255,.12);
      border:1px solid rgba(0,123,255,.22);
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      color:#5baeff;
      letter-spacing:1px;
      word-break:break-all;
    }

    .hidden{display:none!important}
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="card">
      <div class="brand">italk<span>y</span>AI</div>

      <!-- Loading state (auth check + activation) -->
      <div id="stateLoading">
        <div class="spinner"></div>
        <div id="loadingLabel" class="loading-label">Oturumunuz doğrulanıyor…</div>
        <div id="loadingSub" class="loading-sub">Lütfen bekleyiniz</div>
      </div>

      <!-- Success state -->
      <div id="stateSuccess" class="hidden">
        <div class="state-icon ok">✓</div>
        <div class="state-title">Aktivasyon Tamamlandı</div>
        <div id="successBody" class="state-body"></div>
      </div>

      <!-- Error state -->
      <div id="stateError" class="hidden">
        <div class="state-icon err">✕</div>
        <div id="errorTitle" class="state-title">Aktivasyon Başarısız</div>
        <div id="errorBody" class="state-body"></div>
        <a id="errorActionBtn" href="#" class="home-btn" target="_blank" rel="noopener">Uygulamayı İndir</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { initGlobalAccess } from "/js/global_access.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });
    initGlobalAccess({ allowPublicPageBypass:false }).catch(()=>{});

    const API_BASE = "https://italky-api.onrender.com";
    const ACCESS_API = `${API_BASE}/api/session/access-state`;

    const SHELL_SIGNATURE_HTML = `<div class="brand-seal">italkyAI @ icanyAI By Ozyigit's 2026<span class="gokturk-signature" lang="otk" dir="rtl">𐰆𐰍𐰔 𐰇𐰔𐰘𐰃𐰏𐱅</span></div>`;

    // ── DOM ──────────────────────────────────────────────────────────────────
    const stateLoading   = document.getElementById("stateLoading");
    const stateSuccess   = document.getElementById("stateSuccess");
    const stateError     = document.getElementById("stateError");
    const successBody    = document.getElementById("successBody");
    const errorBody      = document.getElementById("errorBody");
    const errorTitle     = document.getElementById("errorTitle");
    const errorActionBtn = document.getElementById("errorActionBtn");
    const loadingLabel   = document.getElementById("loadingLabel");
    const loadingSub     = document.getElementById("loadingSub");

    // ── Shell ready ──────────────────────────────────────────────────────────
    function standardizeShellSignature(){
      try{
        document.querySelectorAll(".signature-main,.menu-sign-main").forEach((el)=>{el.innerHTML=SHELL_SIGNATURE_HTML});
        document.querySelectorAll(".signature-dot,.signature-year,.menu-sign-dot,.menu-sign-year").forEach((el)=>{el.textContent="";el.style.display="none"});
      }catch{}
    }
    function markShellReady(){standardizeShellSignature();document.body.classList.add("shell-ready")}
    function waitForShellReady(){
      const done=()=>setTimeout(markShellReady,80);
      if(document.getElementById("italkyAppShell")){done();return}
      try{
        const obs=new MutationObserver(()=>{if(document.getElementById("italkyAppShell")){obs.disconnect();done()}});
        obs.observe(document.body,{childList:true,subtree:true});
      }catch{}
      setTimeout(markShellReady,1500);
    }
    waitForShellReady();

    // ── State helpers ────────────────────────────────────────────────────────
    function showAuth(){
      stateLoading.classList.remove("hidden");
      stateSuccess.classList.add("hidden");
      stateError.classList.add("hidden");
      if(loadingLabel) loadingLabel.textContent = "Oturumunuz doğrulanıyor…";
      if(loadingSub)   loadingSub.textContent   = "Lütfen bekleyiniz";
    }
    function showLoading(){
      stateLoading.classList.remove("hidden");
      stateSuccess.classList.add("hidden");
      stateError.classList.add("hidden");
      if(loadingLabel) loadingLabel.textContent = "Lütfen bekleyiniz,\naktivasyonunuz devam ediyor…";
      if(loadingSub)   loadingSub.textContent   = "Bu işlem birkaç saniye sürebilir";
    }
    function showSuccess(html){
      stateLoading.classList.add("hidden");
      stateError.classList.add("hidden");
      successBody.innerHTML = html;
      stateSuccess.classList.remove("hidden");
    }
    function showError(html, title = "Aktivasyon Başarısız"){
      stateLoading.classList.add("hidden");
      stateSuccess.classList.add("hidden");
      if(errorTitle)     errorTitle.textContent = title;
      errorBody.innerHTML = html;
      if(errorActionBtn) errorActionBtn.href = storeUrlForDevice();
      stateError.classList.remove("hidden");
    }

    // ── Utilities ────────────────────────────────────────────────────────────
    function codeFromUrl(){
      try{
        const u = new URL(location.href);
        return String(u.searchParams.get("kod")||u.searchParams.get("code")||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,32);
      }catch{return ""}
    }

    function bridgeReturnPath(code="", afterLogin=false){
      const c = String(code||codeFromUrl()||"").trim().toUpperCase();
      const base = c ? `/pages/code_load.html?kod=${encodeURIComponent(c)}` : "/pages/code_load.html";
      return afterLogin ? `${base}&fl=1` : base;
    }
    function loginUrlForCode(code=""){
      // fl=1 tells code_load that user is returning after login → skip signOut, go straight to redeem
      return `/pages/login.html?next=${encodeURIComponent(bridgeReturnPath(code, true))}&prompt=select_account`;
    }

    const IOS_STORE     = "https://apps.apple.com/app/italkyai/id6768123713";
    const ANDROID_STORE = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";
    const ANDROID_PKG   = "com.ozyigits.italkyai";

    function storeUrlForDevice(){
      return /Android/.test(navigator.userAgent) ? ANDROID_STORE : IOS_STORE;
    }

    async function getSession(){
      const {data:{session}} = await supabase.auth.getSession();
      return session||null;
    }
    async function getAuthHeaders(session){
      return {"Content-Type":"application/json",...(session?.access_token?{Authorization:`Bearer ${session.access_token}`}:{})};
    }

    async function refreshAccessState(session){
      try{
        if(!session?.access_token)return null;
        const resp = await fetch(ACCESS_API,{headers:{Authorization:`Bearer ${session.access_token}`},cache:"no-store"});
        const json = await resp.json().catch(()=>null);
        if(resp.ok&&json){
          window.__ITALKY_ACCESS__=json;
          localStorage.setItem("italky_access_state",JSON.stringify(json));
          window.dispatchEvent(new CustomEvent("italkyAccessReady",{detail:json}));
        }
        return json;
      }catch{return null}
    }

    function mapPromoTitle(reasonRaw){
      const r = String(reasonRaw||"").trim().toUpperCase();
      if(r.includes("ALREADY_USED"))  return "Kod Zaten Kullanılmış";
      if(r.includes("NOT_FOUND"))     return "Kod Bulunamadı";
      if(r.includes("EXPIRED"))       return "Kodun Süresi Dolmuş";
      if(r.includes("INACTIVE")||r.includes("NOT_ACTIVE")) return "Kod Aktif Değil";
      if(r.includes("LIMIT"))         return "Kullanım Limiti Dolmuş";
      if(r.includes("MISMATCH"))      return "Hesap Uyuşmazlığı";
      if(r.includes("ELIGIBLE"))      return "Uygun Değil";
      return "Aktivasyon Başarısız";
    }

    function mapPromoError(reasonRaw){
      const reason=String(reasonRaw||"").trim().toUpperCase();
      const m={
        CODE_REQUIRED:"Lütfen geçerli bir aktivasyon kodu ile tekrar deneyin.",
        PROMO_NOT_FOUND:"Bu kod sistemde kayıtlı değil.",
        PROMO_ALREADY_USED:"Bu kod daha önce kullanılmıştır.",
        PROMO_ALREADY_USED_BY_USER:"Bu kod bu hesapta daha önce kullanılmıştır.",
        PROMO_INACTIVE:"Bu kod kullanıma kapalı.",
        PROMO_NOT_ACTIVE:"Bu kod kullanıma kapalı.",
        PROMO_NOT_ELIGIBLE_FOR_PAID_MEMBER:"Bu kod mevcut üyelik tipiniz için uygun değil.",
        PROMO_NOT_ALLOWED_WHILE_MEMBERSHIP_ACTIVE:"Bu kod aktif üyelik sırasında kullanılamaz.",
        PROMO_EXPIRED:"Bu kodun süresi dolmuş.",
        PROMO_NOT_STARTED:"Bu kampanya henüz aktif değil.",
        PROMO_USER_LIMIT_REACHED:"Bu kampanya için kullanım hakkınız dolmuş.",
        PROMO_GLOBAL_LIMIT_REACHED:"Bu kampanyanın toplam kullanım limiti dolmuş.",
        PROMO_ACCOUNT_MISMATCH:"Bu kod başka bir hesapla eşleşmiş.",
        CAMPAIGN_NOT_FOUND:"Bu kodun kampanyası bulunamadı.",
        PROFILE_NOT_FOUND:"Kullanıcı profili bulunamadı."
      };
      return m[reason]||"Kod uygulanamadı. Lütfen kodu kontrol edip tekrar deneyin.";
    }

    function renderSuccessHtml(json){
      const lines = ["Kodunuz başarıyla uygulandı. Kullanım süreniz hesabınıza eklendi."];
      if(json.membership_ends_at){
        const d = new Date(json.membership_ends_at);
        lines.push(`Yeni kullanım bitişi: <b>${d.toLocaleDateString("tr-TR")}</b>`);
      }
      return lines.join("<br>");
    }

    function openAppAfterRedeemSuccess(){
      const ua = navigator.userAgent;
      const isAndroid = /Android/.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      if(isAndroid){
        // intent:// tries to open app; S.browser_fallback_url handles "not installed" case
        const fallback = encodeURIComponent(ANDROID_STORE);
        window.location.href =
          `intent://open#Intent;scheme=italky;package=${ANDROID_PKG};S.browser_fallback_url=${fallback};end`;
        // Safety fallback: if browser doesn't support intent:, go to store
        setTimeout(()=>{ window.location.href = ANDROID_STORE; }, 2500);
      } else if(isIOS){
        // Custom scheme: opens app if installed; browser silently fails if not
        window.location.href = "italky://open";
        // After 2s if page is still visible, app wasn't installed → go to App Store
        setTimeout(()=>{ window.location.href = IOS_STORE; }, 2000);
      } else {
        // Desktop / unknown
        window.location.href = "https://italky.ai";
      }
    }

    // ── Core redeem ──────────────────────────────────────────────────────────
    // preVerifiedUser must come from supabase.auth.getUser() (server-side check).
    // This function will NOT run until boot confirms a verified user exists.
    async function redeemCode(code, preVerifiedUser){
      if(!code||code.length < 4){
        showError("Geçerli bir aktivasyon kodu bulunamadı.", "Geçersiz Kod");
        return;
      }

      // 1. Confirm user identity via getUser() (server-validated JWT)
      let user = preVerifiedUser || null;
      if(!user?.id){
        try{
          const {data} = await supabase.auth.getUser();
          user = data?.user || null;
        }catch{}
      }

      if(!user?.id){
        showError("Kullanıcı kimliği doğrulanamadı. Lütfen tekrar giriş yapın.", "Kimlik Hatası");
        return;
      }

      // 2. Get session for Bearer token (access_token needed for API call)
      const session = await getSession().catch(()=>null);
      if(!session?.access_token){
        location.href = loginUrlForCode(code);
        return;
      }

      // 3. Call API — only now that user.id is verified server-side
      try{
        const res = await fetch(`${API_BASE}/api/promo/redeem`,{
          method:"POST",
          headers: await getAuthHeaders(session),
          body: JSON.stringify({source:"manual", code, user_id: user.id})
        });
        const json = await res.json().catch(()=>null);
        console.log("[code_load] redeem response",{status:res.status, json, user_id:user.id});

        if(json?.ok){
          // Wait for server-side confirmation before any redirect
          await refreshAccessState(session);
          showSuccess(renderSuccessHtml(json));
          setTimeout(()=>openAppAfterRedeemSuccess(), 2000);
        }else{
          const rawReason = json?.reason||json?.detail||"";
          showError(mapPromoError(rawReason), mapPromoTitle(rawReason));
        }
      }catch(e){
        console.error("[code_load] redeem error",e);
        showError("Bağlantı hatası oluştu. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.", "Bağlantı Hatası");
      }
    }

    // ── Boot: strict 5-step auth → redeem ───────────────────────────────────
    (async()=>{
      const code = codeFromUrl();

      if(!code){
        showError("Aktivasyon kodu bulunamadı.<br>Lütfen size gönderilen linki tam olarak kullanın.");
        return;
      }

      showAuth();

      const params = new URL(location.href).searchParams;
      const isPostLogin = params.get("fl") === "1";

      if(!isPostLogin){
        // ── FIRST VISIT: force sign-out, then redirect to login ──────────────

        // Step 1: Sign out — clear any cached/remembered session tokens
        try{ await supabase.auth.signOut(); }catch{}

        // Step 2: Confirm session is truly gone
        let lingering = null;
        try{ lingering = await getSession(); }catch{}
        if(lingering?.user?.id){
          // SSO or persistent token survived signOut — hard reload to flush it
          location.reload();
          return;
        }

        // Step 3: Redirect to login with forced account selection
        // fl=1 in the next URL tells us on return that the user just authenticated
        location.href = loginUrlForCode(code);
        return;
      }

      // ── POST-LOGIN RETURN (fl=1): verify user, then redeem ────────────────

      // Clean fl param from URL so back/refresh doesn't retrigger this path
      try{
        const clean = new URL(location.href);
        clean.searchParams.delete("fl");
        history.replaceState({}, "", clean.toString());
      }catch{}

      // Step 4: Server-side user verification via getUser() (validates JWT with Supabase)
      let verifiedUser = null;
      try{
        const {data, error} = await supabase.auth.getUser();
        if(!error) verifiedUser = data?.user || null;
      }catch{}

      if(!verifiedUser?.id){
        showError("Giriş doğrulanamadı. Lütfen tekrar deneyin.", "Kimlik Hatası");
        return;
      }

      // Step 5: Session confirmed & user verified — run activation
      showLoading();
      await redeemCode(code, verifiedUser);
    })();
  </script>
</body>
</html>
