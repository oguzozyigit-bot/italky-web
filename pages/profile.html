<!doctype html>
<html lang="tr">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>

<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
background:#02000f;
font-family:Outfit;
overflow:hidden;
scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
display:none;
}

#pageContent{
padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 12px);
max-width:560px;
margin:0 auto;
display:flex;
flex-direction:column;
gap:14px;
overflow-y:auto;
scrollbar-width:none;
}

#pageContent::-webkit-scrollbar{
display:none;
}

.panel{
background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.12);
border-radius:26px;
padding:16px;
backdrop-filter:blur(18px);
}

.title{
font-family:"Space Grotesk";
font-size:20px;
font-weight:900;
color:#fff;
margin-bottom:10px;
}

.line{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px;
border-radius:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
}

.k{
font-size:12px;
font-weight:900;
color:#a5b4fc;
letter-spacing:1px;
}

.v{
font-size:13px;
font-weight:900;
color:#fff;
text-align:right;
}

.wallet{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px;
border-radius:18px;
background:rgba(99,102,241,.12);
border:1px solid rgba(99,102,241,.35);
}

.wallet .amt{
font-size:20px;
font-weight:1000;
}

.btn{
min-height:46px;
border-radius:16px;
border:none;
cursor:pointer;
font-weight:900;
padding:0 14px;
}

.btn-primary{
background:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
color:#050510;
}

.btn-safe{
background:rgba(0,200,120,.2);
border:1px solid rgba(0,200,120,.35);
color:#fff;
}

.btn-danger{
background:transparent;
border:1px solid rgba(255,70,100,.35);
color:#ff6b8b;
}

.list{
display:flex;
flex-direction:column;
gap:10px;
}

.note{
font-size:11px;
color:rgba(255,255,255,.55);
}

.setting{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-radius:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#0f0f18;
border:1px solid rgba(255,255,255,.2);
padding:10px 16px;
border-radius:999px;
font-size:12px;
font-weight:900;
color:#fff;
opacity:0;
transition:.25s;
}

.toast.show{
opacity:1;
}

</style>
</head>

<body>

<div id="pageContent">

<div class="panel">

<div class="title">Profil</div>

<div class="line">
<div class="k">Ad Soyad</div>
<div class="v" id="pName">—</div>
</div>

<div class="line">
<div class="k">Mail</div>
<div class="v" id="pEmail">—</div>
</div>

<div class="line">
<div class="k">Üyelik No</div>
<div class="v" id="memberNo">—</div>
</div>

<div class="line">
<div class="k">Üyelik Tarihi</div>
<div class="v" id="createdAt">—</div>
</div>

<div class="wallet">
<div>
<div class="k">Jeton</div>
<div class="amt"><span id="tokenVal">0</span></div>
</div>

<button class="btn btn-primary">Jeton Yükle</button>
</div>

</div>


<div class="panel">

<div class="title">Ses Profili</div>

<div class="line">
<div class="k">Durum</div>
<div class="v" id="voiceStatus">Hazır değil</div>
</div>

<button class="btn btn-primary" id="voiceBtn">
Ses Profilini Güncelle
</button>

</div>


<div class="panel">

<div class="title">Çeviri Ayarları</div>

<div class="setting" id="ttsVoiceSetting">
<div>Çeviri Sesi</div>
<div id="ttsVoiceValue">Otomatik</div>
</div>

<div class="note">
FaceToFace ve Interpreter modüllerinde kullanılacak ses.
</div>

</div>


<div class="panel">

<div class="title">Interpreter QR</div>

<div class="line">
<div>Bağlantı QR</div>
<button class="btn btn-primary">QR Kod Yenile</button>
</div>

</div>


<div class="panel">

<div class="list">

<button class="btn btn-safe" id="logoutBtn">
Güvenli Çıkış
</button>

<button class="btn btn-danger" id="deleteBtn">
Hesabımı Kalıcı Sil
</button>

</div>

</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

mountShell({scroll:"auto"});

const $ = id => document.getElementById(id);

const toast = (msg)=>{
const t=$("toast");
t.textContent=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
};

async function loadProfile(){

const {data:{user}} = await supabase.auth.getUser();

if(!user) return;

$("pEmail").textContent=user.email;

const {data}=await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data) return;

$("pName").textContent=data.name || "—";
$("memberNo").textContent=data.member_no || "—";
$("tokenVal").textContent=data.tokens || 0;

if(data.created_at){
$("createdAt").textContent=
new Date(data.created_at).toLocaleString("tr-TR");
}

if(data.voice_ready){
$("voiceStatus").textContent="Ses profili hazır";
}else{
$("voiceStatus").textContent="Hazır değil";
}

}

$("ttsVoiceSetting").onclick=async ()=>{

const {data:{user}} = await supabase.auth.getUser();

const {data}=await supabase
.from("profiles")
.select("voice_ready")
.eq("id",user.id)
.single();

if(!data?.voice_ready){

toast("Önce Ses Profilini Oluştur");

return;

}

localStorage.setItem("tts_voice","my");

$("ttsVoiceValue").textContent="Benim Sesim";

};

$("logoutBtn").onclick=async ()=>{
await supabase.auth.signOut();
location.href="/login.html";
};

loadProfile();

</script>

</body>
</html>
