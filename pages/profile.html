<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --txt: rgba(255,255,255,.96);
  --muted: rgba(255,255,255,.60);
  --ai-grad: linear-gradient(135deg, #67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --panel-bg: rgba(255, 255, 255, 0.03);
  --panel-border: rgba(255, 255, 255, 0.08);
  --accent: #818cf8;
}

html, body {
  margin: 0; padding: 0;
  background: #0a0a0f;
  color: var(--txt);
  font-family: 'Outfit', sans-serif;
  height: 100%;
  overflow: hidden;
}

/* Arka Plan Efektleri */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 80% 10%, rgba(244, 114, 182, 0.1) 0%, transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
  z-index: -1;
}

#pageContent {
  height: 100vh;
  overflow-y: auto;
  padding: calc(var(--headerH, 70px) + 20px) 16px calc(var(--footerH, 80px) + 20px);
  scrollbar-width: none;
  max-width: 500px;
  margin: 0 auto;
}

#pageContent::-webkit-scrollbar { display: none; }

/* Geri Dön Tuşu */
.back-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}

.back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

.back-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.5; }

.page-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 700;
  margin: 0;
}

/* Profil Avatar / Kart */
.profile-hero {
  text-align: center;
  margin-bottom: 30px;
}

.avatar-wrapper {
  width: 90px;
  height: 90px;
  margin: 0 auto 15px;
  position: relative;
  padding: 3px;
  background: var(--ai-grad);
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(129, 140, 248, 0.3);
}

.avatar-inner {
  width: 100%;
  height: 100%;
  background: #12121a;
  border-radius: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 800;
  color: #fff;
}

/* Bilgi Paneli */
.info-panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 28px;
  padding: 8px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.info-row:last-child { border-bottom: none; }

.info-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.info-value {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  text-align: right;
}

.info-value.token {
  background: var(--ai-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 20px;
  font-weight: 900;
}

.mono { font-family: 'Space Grotesk', monospace; letter-spacing: 1px; }

/* Alt Butonlar */
.action-area {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn {
  height: 56px;
  border-radius: 18px;
  font-family: inherit;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
}

.btn-logout {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--panel-border);
  color: #fff;
}

.btn-delete {
  background: transparent;
  color: #ff5a8c;
  font-size: 13px;
  opacity: 0.6;
}

.btn:active { transform: scale(0.98); }

/* Animasyon */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate { animation: slideUp 0.5s ease forwards; }

</style>
</head>
<body>

<div id="pageContent">

  <div class="back-header animate">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="page-title">Profil</h1>
  </div>

  <div class="profile-hero animate" style="animation-delay: 0.1s;">
    <div class="avatar-wrapper">
      <div class="avatar-inner" id="avatarInitial">A</div>
    </div>
    <div id="pNameTop" style="font-weight: 800; font-size: 20px;">Ad Soyad</div>
    <div id="pEmailTop" style="color: var(--muted); font-size: 14px; margin-top: 4px;">mail@example.com</div>
  </div>

  <div class="info-panel animate" style="animation-delay: 0.2s;">
    
    <div class="info-row">
      <div class="info-label">Jeton Sayısı</div>
      <div class="info-value token" id="tokenVal">0</div>
    </div>

    <div class="info-row">
      <div class="info-label">Üyelik No</div>
      <div class="info-value mono" id="memberNo">—</div>
    </div>

    <div class="info-row">
      <div class="info-label">Üyelik Tarihi</div>
      <div class="info-value" id="createdAt">—</div>
    </div>

    <div class="info-row">
      <div class="info-label">Son Giriş</div>
      <div class="info-value" id="lastLogin">—</div>
    </div>

  </div>

  <div class="action-area animate" style="animation-delay: 0.3s;">
    <button class="btn btn-logout" id="logoutBtn">Güvenli Çıkış Yap</button>
    <button class="btn btn-delete" id="deleteBtn">Hesabı Kalıcı Olarak Sil</button>
  </div>

</div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";

  // UI Shell Montajı
  mountShell({ scroll: "none" });

  // Verileri Doldurma Fonksiyonu
  async function loadProfile() {
    try {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const meta = user.user_metadata;
      const name = meta.full_name || meta.display_name || "italky Kullanıcısı";
      
      // DOM Güncelleme
      document.getElementById("pNameTop").textContent = name;
      document.getElementById("pEmailTop").textContent = user.email;
      document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
      document.getElementById("memberNo").textContent = meta.membership_no || user.id.slice(0,8).toUpperCase();
      
      // Tarih Formatlama
      const formatDate = (dateStr) => {
        if(!dateStr) return "—";
        return new Date(dateStr).toLocaleDateString('tr-TR', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
      };

      document.getElementById("createdAt").textContent = formatDate(user.created_at);
      document.getElementById("lastLogin").textContent = formatDate(user.last_sign_in_at);

      // Jeton verisi için (Varsayalım user_metadata içinde tutuyorsun)
      document.getElementById("tokenVal").textContent = meta.tokens || 0;

    } catch (e) {
      console.error("Profil yüklenemedi:", e);
    }
  }

  // Çıkış İşlemi
  document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    location.href = "/login.html";
  };

  loadProfile();
</script>

</body>
</html>
