<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>

<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
background:#02000f;
font-family:Outfit;
height:100%;
overflow:hidden;
}

#pageContent{
height:100%;
overflow-y:auto;
padding:16px 14px 110px;
scrollbar-width:none;
}

#pageContent::-webkit-scrollbar{
display:none;
}

.panel{
background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.12);
border-radius:26px;
padding:14px;
margin-bottom:12px;
}

.title{
font-family:"Space Grotesk";
font-size:18px;
font-weight:900;
color:#fff;
margin-bottom:10px;
}

.line{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:12px;
margin-bottom:8px;
}

.k{
font-size:12px;
font-weight:900;
color:#a5b4fc;
}

.v{
font-size:13px;
font-weight:900;
color:#fff;
}

.wallet{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(99,102,241,.12);
border:1px solid rgba(99,102,241,.35);
border-radius:20px;
padding:12px;
}

.btn{
border:none;
border-radius:16px;
padding:10px 14px;
font-weight:900;
cursor:pointer;
}

.btn-primary{
background:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
color:#000;
}

.btn-safe{
background:rgba(0,200,120,.18);
border:1px solid rgba(0,200,120,.35);
color:#fff;
margin-bottom:10px;
}

.btn-danger{
background:transparent;
border:1px solid rgba(255,0,90,.35);
color:#ff5a8c;
}

.settingTrigger{
display:flex;
justify-content:space-between;
align-items:center;
width:160px;
background:rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
padding:8px 10px;
cursor:pointer;
color:#fff;
font-weight:900;
}

.sheetBackdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:100;
}

.sheet{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-radius:28px 28px 0 0;
padding:16px;
display:none;
z-index:101;
}

.sheetItem{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.08);
cursor:pointer;
font-weight:900;
color:#fff;
}

</style>
</head>

<body>

<div id="pageContent">

<div class="panel">
<div class="title">Profil</div>

<div class="line">
<div class="k">Ad Soyad</div>
<div class="v" id="pName">—</div>
</div>

<div class="line">
<div class="k">Mail</div>
<div class="v" id="pEmail">—</div>
</div>

<div class="line">
<div class="k">Üyelik No</div>
<div class="v" id="memberNo">—</div>
</div>

<div class="wallet">
<div>
<div class="k">Jeton</div>
<div class="v" id="tokenVal">0</div>
</div>

<button class="btn btn-primary">Jeton Yükle</button>
</div>

</div>

<div class="panel">
<div class="title">Ses Profili</div>

<div class="line">
<div class="k">Durum</div>
<div class="v" id="voiceProfileStatus">Hazır değil</div>
</div>

<button class="btn btn-primary" id="voiceProfileBtn">Ses Profilini Güncelle</button>

</div>

<div class="panel">
<div class="title">Çeviri Ayarları</div>

<div class="line">
<div class="k">Çeviri Sesi</div>

<div class="settingTrigger" id="ttsVoiceTrigger">
<span id="ttsVoiceValue">Otomatik</span>
<span>⌄</span>
</div>

</div>

</div>

<div class="panel">

<div class="title">Interpreter QR</div>

<div class="line">
<div class="k">Bağlantı QR</div>

<button class="btn btn-primary" id="renewQrBtn">QR Kod Yenile</button>
</div>

</div>

<div class="panel">

<button class="btn btn-safe" id="logoutBtn">Güvenli Çıkış</button>
<button class="btn btn-danger" id="deleteBtn">Hesabımı Kalıcı Sil</button>

</div>

</div>


<div class="sheetBackdrop" id="sheetBackdrop"></div>

<div class="sheet" id="optionSheet">

<div class="sheetItem" data-v="auto">Otomatik</div>
<div class="sheetItem" data-v="female">Kadın</div>
<div class="sheetItem" data-v="male">Erkek</div>
<div class="sheetItem" data-v="clone">Benim Sesim</div>

</div>

<script type="module" src="/js/profile_boot.js"></script>

</body>
</html>
