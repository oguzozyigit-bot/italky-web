<!-- FILE: /pages/profile.html -->
<!doctype html>
<html lang="tr">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

html,body{
background:#02000f;
margin:0;
font-family:Outfit;
overflow:hidden;
scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
display:none;
}

#pageContent{
padding:16px;
padding-bottom:calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
display:flex;
flex-direction:column;
gap:14px;
max-width:560px;
margin:auto;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

#pageContent::-webkit-scrollbar{display:none;}

.panel{
background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.12);
border-radius:26px;
padding:14px;
backdrop-filter:blur(18px);
}

.title{
font-family:"Space Grotesk";
font-size:18px;
font-weight:900;
color:#fff;
margin:0;
margin-bottom:10px;
}

.line{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
margin-bottom:10px;
}

.k{
font-size:12px;
font-weight:900;
color:#a5b4fc;
}

.v{
font-size:13px;
font-weight:900;
color:#fff;
}

.wallet{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(99,102,241,.15);
padding:14px;
border-radius:20px;
border:1px solid rgba(99,102,241,.4);
margin-top:10px;
}

.amt{
font-size:20px;
font-weight:900;
color:#fff;
}

.btn{
height:44px;
padding:0 14px;
border-radius:16px;
border:none;
cursor:pointer;
font-weight:900;
}

.btn-primary{
background:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
color:#050510;
}

.btn-safe{
background:rgba(0,200,120,.18);
border:1px solid rgba(0,200,120,.35);
color:#fff;
}

.btn-danger{
background:transparent;
border:1px solid rgba(255,0,90,.4);
color:#ff6b8a;
}

.settingBtn{
min-width:140px;
height:40px;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(0,0,0,.2);
color:#fff;
font-weight:900;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
cursor:pointer;
}

.optionSheet{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:9999;
background:rgba(15,15,30,.95);
backdrop-filter:blur(25px);
border-top-left-radius:28px;
border-top-right-radius:28px;
padding:18px;
transform:translateY(110%);
transition:.3s;
}

.optionSheet.show{
transform:translateY(0);
}

.optionItem{
height:56px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
border-radius:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
margin-bottom:10px;
cursor:pointer;
font-weight:800;
}

.optionItem.active{
border-color:#a5b4fc;
background:rgba(99,102,241,.25);
}

.optionRadio{
width:20px;
height:20px;
border-radius:50%;
border:2px solid rgba(255,255,255,.4);
}

.optionItem.active .optionRadio{
background:#9fe7ea;
border-color:#9fe7ea;
}

</style>
</head>

<body>

<div id="pageContent">

<div class="panel">

<h2 class="title">Profil</h2>

<div class="line">
<div class="k">Ad Soyad</div>
<div class="v" id="pName">—</div>
</div>

<div class="line">
<div class="k">Mail</div>
<div class="v" id="pEmail">—</div>
</div>

<div class="line">
<div class="k">Üyelik No</div>
<div class="v" id="memberNo">—</div>
</div>

<div class="wallet">
<div>
<div class="k">Jeton</div>
<div class="amt"><span id="tokenVal">0</span></div>
</div>
<button class="btn btn-primary">Jeton Yükle</button>
</div>

</div>


<div class="panel">

<h2 class="title">Ses Profili</h2>

<div class="line">
<div class="k">Durum</div>
<div class="v" id="voiceStatus">Hazır değil</div>
</div>

<button class="btn btn-primary" onclick="location.href='/pages/voice_profile.html'">
Ses Profilini Güncelle
</button>

</div>


<div class="panel">

<h2 class="title">Çeviri Ayarları</h2>

<div class="line">
<div class="k">Çeviri Sesi</div>

<button class="settingBtn" id="voiceTrigger">
<span id="voiceValue">Otomatik</span>
<span>⌄</span>
</button>

</div>

</div>


<div class="panel">

<h2 class="title">Interpreter QR</h2>

<div class="line">
<div class="k">Bağlantı QR</div>
<button class="btn btn-primary" id="qrRenew">QR Kod Yenile</button>
</div>

</div>


<div class="panel">

<button class="btn btn-safe" id="logoutBtn">Güvenli Çıkış</button>

<button class="btn btn-danger" id="deleteBtn">Hesabımı Kalıcı Sil</button>

</div>

</div>


<div class="optionSheet" id="voiceSheet">

<div class="optionItem active" data-val="auto">
Otomatik
<div class="optionRadio"></div>
</div>

<div class="optionItem" data-val="female">
Kadın
<div class="optionRadio"></div>
</div>

<div class="optionItem" data-val="male">
Erkek
<div class="optionRadio"></div>
</div>

<div class="optionItem" data-val="my">
Benim Sesim
<div class="optionRadio"></div>
</div>

</div>


<script type="module">

import { mountShell } from "/js/ui_shell.js";
mountShell();

const voiceSheet = document.getElementById("voiceSheet");
const voiceTrigger = document.getElementById("voiceTrigger");
const voiceValue = document.getElementById("voiceValue");

voiceTrigger.onclick=()=>{
voiceSheet.classList.add("show");
};

document.querySelectorAll(".optionItem").forEach(el=>{

el.onclick=()=>{

document.querySelectorAll(".optionItem").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

const val = el.dataset.val;

localStorage.setItem("tts_voice",val);

voiceValue.textContent =
val==="auto" ? "Otomatik"
: val==="female" ? "Kadın"
: val==="male" ? "Erkek"
: "Benim Sesim";

voiceSheet.classList.remove("show");

};

});

</script>

</body>
</html>
