<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

:root{
--txt:rgba(255,255,255,.96);
--muted:rgba(255,255,255,.55);
--panel-bg:rgba(255,255,255,.04);
--panel-border:rgba(255,255,255,.10);
--ai-grad:linear-gradient(135deg,#67e8f9,#818cf8,#f472b6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#070710;
color:var(--txt);
font-family:Outfit,sans-serif;
}

body{
background:
radial-gradient(circle at 80% 10%, rgba(244,114,182,.10), transparent 40%),
radial-gradient(circle at 20% 80%, rgba(99,102,241,.10), transparent 40%),
linear-gradient(180deg,#080812 0%,#0e0e18 100%);
}

#pageContent{
max-width:520px;
margin:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:18px;
}

/* geri */

.back-row{
display:flex;
align-items:center;
gap:12px;
}

.back-btn{
width:42px;
height:42px;
border-radius:14px;
background:var(--panel-bg);
border:1px solid var(--panel-border);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.back-btn:active{
transform:scale(.95);
}

.back-btn svg{
width:20px;
height:20px;
stroke:#fff;
fill:none;
stroke-width:2.5;
}

.page-title{
font-family:"Space Grotesk";
font-size:26px;
font-weight:700;
}

/* avatar */

.profile-card{
background:var(--panel-bg);
border:1px solid var(--panel-border);
border-radius:30px;
padding:22px;
text-align:center;
backdrop-filter:blur(20px);
position:relative;
overflow:hidden;
}

.avatar{
width:92px;
height:92px;
border-radius:28px;
margin:auto;
padding:3px;
background:var(--ai-grad);
animation:aura 5s linear infinite;
}

@keyframes aura{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(360deg)}
}

.avatar-inner{
width:100%;
height:100%;
background:#12121a;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:900;
}

.name{
font-size:20px;
font-weight:800;
margin-top:14px;
}

.email{
font-size:14px;
color:var(--muted);
margin-top:4px;
}

/* info panel */

.info-panel{
background:var(--panel-bg);
border:1px solid var(--panel-border);
border-radius:28px;
padding:8px;
backdrop-filter:blur(20px);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 14px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.row:last-child{
border-bottom:none;
}

.label{
font-size:13px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
}

.value{
font-size:15px;
font-weight:700;
}

.token{
font-size:22px;
font-weight:900;
background:var(--ai-grad);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.coin{
margin-left:6px;
animation:coin 2s ease-in-out infinite;
}

@keyframes coin{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

.mono{
font-family:"Space Grotesk", monospace;
letter-spacing:1px;
cursor:pointer;
}

/* toast */

.toast{
position:fixed;
left:50%;
top:20px;
transform:translateX(-50%) translateY(-120px);
background:#11111b;
border:1px solid rgba(165,180,252,.35);
padding:10px 14px;
border-radius:999px;
font-size:12px;
font-weight:900;
transition:.25s;
}

.toast.show{
transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div id="pageContent">

<div class="back-row">
<button class="back-btn" onclick="history.back()">
<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div class="page-title">Profil</div>
</div>

<div class="profile-card">

<div class="avatar">
<div class="avatar-inner" id="avatarInitial">A</div>
</div>

<div class="name" id="pName">Ad Soyad</div>
<div class="email" id="pEmail">mail@example.com</div>

</div>

<div class="info-panel">

<div class="row">
<div class="label">Jeton Sayısı</div>
<div class="value token">
<span id="tokenVal">0</span>
<span class="coin">💎</span>
</div>
</div>

<div class="row">
<div class="label">Üyelik No</div>
<div class="value mono" id="memberNo">—</div>
</div>

<div class="row">
<div class="label">Üyelik Tarihi</div>
<div class="value" id="createdAt">—</div>
</div>

<div class="row">
<div class="label">Son Giriş</div>
<div class="value" id="lastLogin">—</div>
</div>

</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

mountShell({scroll:"auto"});

const toast=document.getElementById("toast")

function showToast(msg){
toast.textContent=msg
toast.classList.add("show")
setTimeout(()=>toast.classList.remove("show"),2000)
}

async function loadProfile(){

const {data:{user}}=await supabase.auth.getUser()
if(!user) return

const meta=user.user_metadata||{}
const name=meta.full_name||meta.display_name||"italky Kullanıcısı"

document.getElementById("pName").textContent=name
document.getElementById("pEmail").textContent=user.email

document.getElementById("avatarInitial").textContent=name.charAt(0).toUpperCase()

document.getElementById("memberNo").textContent=
meta.membership_no||user.id.slice(0,8).toUpperCase()

document.getElementById("tokenVal").textContent=meta.tokens||0

function formatDate(d){
if(!d) return "—"
return new Date(d).toLocaleDateString("tr-TR",{year:"numeric",month:"long",day:"numeric"})
}

document.getElementById("createdAt").textContent=formatDate(user.created_at)
document.getElementById("lastLogin").textContent=formatDate(user.last_sign_in_at)

}

document.getElementById("memberNo").onclick=()=>{
navigator.clipboard.writeText(document.getElementById("memberNo").textContent)
showToast("Üyelik numarası kopyalandı")
}

loadProfile()

</script>

</body>
</html>
