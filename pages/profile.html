<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{--txt:rgba(255,255,255,.96);--muted:rgba(255,255,255,.55);--panel-bg:rgba(255,255,255,.04);--panel-border:rgba(255,255,255,.10);--ai-grad:linear-gradient(135deg,#67e8f9,#818cf8,#f472b6);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#070710;color:var(--txt);font-family:Outfit,sans-serif;}
body{background:radial-gradient(circle at 80% 10%, rgba(244,114,182,.10), transparent 40%),radial-gradient(circle at 20% 80%, rgba(99,102,241,.10), transparent 40%),linear-gradient(180deg,#080812 0%,#0e0e18 100%);}
#pageContent{max-width:520px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:18px;}
.back-row{display:flex;align-items:center;gap:12px;}.back-btn{width:42px;height:42px;border-radius:14px;background:var(--panel-bg);border:1px solid var(--panel-border);display:flex;align-items:center;justify-content:center;cursor:pointer;}.back-btn:active{transform:scale(.95)}.back-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5;}.page-title{font-family:"Space Grotesk";font-size:26px;font-weight:700;}
.profile-card{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:30px;padding:22px;text-align:center;backdrop-filter:blur(20px);position:relative;overflow:hidden;}.avatar{width:92px;height:92px;border-radius:28px;margin:auto;padding:3px;background:var(--ai-grad);animation:aura 5s linear infinite;}@keyframes aura{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}.avatar-inner{width:100%;height:100%;background:#12121a;border-radius:25px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}.avatar-img{width:100%;height:100%;object-fit:cover;display:none;}.avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;}.name{font-size:20px;font-weight:800;margin-top:14px;}.email{font-size:14px;color:var(--muted);margin-top:4px;word-break:break-word;}
.info-panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:28px;padding:8px;backdrop-filter:blur(20px);}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.05);}.row:last-child{border-bottom:none;}.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;}.value{font-size:15px;font-weight:700;text-align:right;word-break:break-word;}.mono{font-family:"Space Grotesk", monospace;letter-spacing:.7px;white-space:nowrap;}.copy-wrap{display:flex;align-items:center;justify-content:flex-end;gap:8px;max-width:none;min-width:0;flex:1;}.copy-btn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}.copy-btn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.1;}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-120px);background:#11111b;border:1px solid rgba(165,180,252,.35);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:900;transition:.25s;z-index:9999;}.toast.show{transform:translateX(-50%) translateY(0);}
.levels-list{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}.level-chip{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;padding:6px 9px;border-radius:999px;border:1px solid rgba(165,180,252,.18);background:rgba(165,180,252,.08);font-size:13px;font-weight:900;white-space:nowrap;}.level-chip b{color:#c7d2fe;font-weight:1000;}
@media(max-width:390px){#pageContent{padding:14px}.row{align-items:flex-start}.levels-list{align-items:flex-start}.level-chip{white-space:normal}.value{text-align:left}}
</style>
</head>
<body>

<div id="pageContent">
  <div class="back-row"><button class="back-btn" onclick="history.back()" type="button" aria-label="Geri dön"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="page-title">Profil</div></div>
  <div class="profile-card"><div class="avatar"><div class="avatar-inner"><img id="avatarImg" class="avatar-img" src="" alt="Avatar"><div id="avatarFallback" class="avatar-fallback">A</div></div></div><div class="name" id="pName">Ad Soyad</div><div class="email" id="pEmail">mail@example.com</div></div>
  <div class="info-panel">
    <div class="row"><div class="label">Üyelik başlangıcı</div><div class="value" id="membershipStart">Bilgi yok</div></div>
    <div class="row"><div class="label">Üyelik bitişi</div><div class="value" id="membershipEnd">Bilgi yok</div></div>
    <div class="row"><div class="label">Dil Seviyeleri</div><div class="value levels-list" id="levelsList">—</div></div>
    <div class="row"><div class="label">italkyAI No</div><div class="copy-wrap"><div class="value mono" id="memberNo">—</div><button class="copy-btn" id="copyMemberBtn" type="button" aria-label="italkyAI No kopyala"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"></rect><path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"></path></svg></button></div></div>
    <div class="row"><div class="label">Kayıt Tarihi</div><div class="value" id="createdAt">—</div></div>
    <div class="row"><div class="label">Son Giriş</div><div class="value" id="lastLogin">—</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";
import { STORAGE_KEY } from "/js/config.js";

try{ mountShell({ scroll:"auto" }); }catch(e){ console.warn("[profile shell]", e); }

const API_BASE = "https://italky-api.onrender.com";
const $ = (id) => document.getElementById(id);
const toastEl = $("toast");
const LEVEL_LABELS = { en:"İngilizce", de:"Almanca", fr:"Fransızca", es:"İspanyolca", it:"İtalyanca" };

function showToast(msg){ toastEl.textContent = String(msg || ""); toastEl.classList.add("show"); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000); }
function getCachedUser(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch{ return {}; } }
function pickFirst(...values){ return values.find((value) => String(value || "").trim()) || ""; }
function formatDate(d, emptyText = "-"){ try{ if(!d) return emptyText; const date = new Date(d); if(isNaN(date.getTime())) return emptyText; return new Intl.DateTimeFormat("tr-TR", { year:"numeric", month:"long", day:"numeric" }).format(date); }catch{ return emptyText; } }
function escapeHtml(value){ return String(value ?? "").replace(/[&<>'"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", "\"":"&quot;" }[c])); }


function formatItalkyNo(value){
  const digits = String(value || "").replace(/\D/g, "");
  if(/^0601[2-9]\d{6}$/.test(digits)){
    return digits.replace(/^(\d{4})(\d{3})(\d{2})(\d{2})$/, "$1 $2 $3 $4");
  }
  if(/^0601\d{8}$/.test(digits)){
    return digits.replace(/^(\d{4})(\d{3})(\d{2})(\d{3})$/, "$1 $2 $3 $4");
  }
  return String(value || "").trim();
}

function renderLevels(levels){
  const box = $("levelsList");
  const source = levels && typeof levels === "object" && !Array.isArray(levels) ? levels : {};
  const rows = Object.keys(LEVEL_LABELS).map((code) => {
    const entry = source[code];
    if (!entry) return null;
    const level = typeof entry === "string" ? entry : entry.level;
    if (!String(level || "").trim()) return null;
    return { code, label: LEVEL_LABELS[code], level: String(level).trim() };
  }).filter(Boolean);
  if (!rows.length) {
    box.textContent = "—";
    return;
  }
  box.innerHTML = rows.map((row) => `<span class="level-chip">${escapeHtml(row.label)} <b>${escapeHtml(row.level)}</b></span>`).join("");
}

function setAvatar(name, avatarUrl){
  const img = $("avatarImg"); const fallback = $("avatarFallback"); const initial = String(name || "A").trim().charAt(0).toUpperCase() || "A";
  fallback.textContent = initial;
  if(avatarUrl){ img.onload = () => { img.style.display = "block"; fallback.style.display = "none"; }; img.onerror = () => { img.style.display = "none"; fallback.style.display = "flex"; }; img.referrerPolicy = "no-referrer"; img.src = avatarUrl; }
  else{ img.style.display = "none"; fallback.style.display = "flex"; }
}

function buildMemberNo(user, cached){ const meta = user?.user_metadata || {}; return meta.membership_no || meta.member_no || cached?.membership_no || cached?.uyelik_no || (user?.id ? user.id.replace(/-/g, "").slice(0, 8).toUpperCase() : "—"); }

async function getAccessState(session){
  try{
    const token = session?.access_token || "";
    if(!token) return {};
    const response = await fetch(`${API_BASE}/api/session/access-state`, {
      headers: { Authorization: `Bearer ${token}` },
      cache: "no-store"
    });
    const data = await response.json().catch(() => ({}));
    return data || {};
  }catch(e){
    console.warn("[profile access-state]", e);
    return {};
  }
}

async function loadProfile(){
  try{
    const cached = getCachedUser();
    const { data: { session } } = await supabase.auth.getSession();
    const { data: { user } } = await supabase.auth.getUser();
    if(!user) return;

    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", String(user.id))
      .maybeSingle();

    if(profileError) console.warn("[profile data]", profileError);

    const accessState = await getAccessState(session);
    const meta = user.user_metadata || {};
    const name = profile?.full_name || meta.full_name || meta.name || meta.display_name || cached?.display_name || cached?.name || user.email || "italky Kullanıcısı";
    const email = user.email || profile?.email || cached?.email || "—";
    const avatarUrl = meta.avatar_url || meta.picture || meta.avatar || profile?.avatar_url || cached?.picture || cached?.avatar || cached?.avatar_url || "";
    const memberNo = formatItalkyNo(profile?.italky_no) || "Henüz oluşturulmadı";
    const membershipStart = pickFirst(profile?.package_started_at, profile?.membership_starts_at, profile?.subscription_started_at, profile?.trial_started_at, profile?.activated_at, profile?.created_at, accessState?.package_started_at, accessState?.membership_starts_at, accessState?.subscription_started_at, accessState?.trial_started_at, accessState?.activated_at, cached?.package_started_at, cached?.membership_starts_at, cached?.subscription_started_at, cached?.trial_started_at, cached?.activated_at, cached?.created_at);
    const membershipEnd = pickFirst(profile?.package_ends_at, profile?.membership_ends_at, profile?.subscription_ends_at, profile?.trial_ends_at, profile?.expires_at, profile?.nfc_expires_at, accessState?.package_ends_at, accessState?.membership_ends_at, accessState?.subscription_ends_at, accessState?.trial_ends_at, accessState?.expires_at, accessState?.nfc_expires_at, cached?.package_ends_at, cached?.membership_ends_at, cached?.subscription_ends_at, cached?.trial_ends_at, cached?.expires_at, cached?.nfc_expires_at);

    $("pName").textContent = name;
    $("pEmail").textContent = email;
    $("memberNo").textContent = memberNo;
    $("membershipStart").textContent = formatDate(membershipStart, "Bilgi yok");
    $("membershipEnd").textContent = formatDate(membershipEnd, "Bilgi yok");
    $("createdAt").textContent = formatDate(profile?.created_at || user.created_at);
    $("lastLogin").textContent = formatDate(user.last_sign_in_at);
    renderLevels(profile?.levels || {});
    setAvatar(name, avatarUrl);
  }catch(e){ console.error("Profil yüklenemedi:", e); }
}

$("copyMemberBtn").addEventListener("click", async () => {
  try{ const text = $("memberNo").textContent.trim(); if(!text || text === "—" || text === "Henüz oluşturulmadı") return; await navigator.clipboard.writeText(text); showToast("italkyAI No kopyalandı"); }
  catch{ showToast("Kopyalama yapılamadı"); }
});

loadProfile();
</script>
</body>
</html>
