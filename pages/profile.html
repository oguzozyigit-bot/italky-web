<!-- FILE: /pages/profile.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
background:#02000f;
font-family:Outfit;
overflow:hidden;
}

#pageContent{
max-width:560px;
margin:auto;
padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom));
display:flex;
flex-direction:column;
gap:12px;
overflow-y:auto;
height:100vh;
}

.panel{
background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.12);
border-radius:26px;
padding:14px;
backdrop-filter:blur(18px);
}

.title{
font-family:"Space Grotesk";
font-size:18px;
font-weight:900;
color:#fff;
margin:0 0 10px;
}

.line{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
gap:10px;
}

.k{
font-size:12px;
font-weight:900;
color:#a5b4fc;
letter-spacing:1px;
}

.v{
font-size:13px;
font-weight:900;
color:#fff;
text-align:right;
max-width:65%;
word-break:break-word;
}

.btn{
min-height:44px;
padding:0 14px;
border-radius:16px;
border:none;
font-weight:1000;
cursor:pointer;
}

.btn-primary{
background:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
color:#050510;
}

.btn-safe{
background:rgba(0,200,120,.18);
border:1px solid rgba(0,200,120,.35);
color:#fff;
}

.btn-danger{
background:transparent;
border:1px solid rgba(255,0,90,.3);
color:#ff5a8c;
}

.setting{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
}

.select{
background:rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.12);
color:#fff;
border-radius:14px;
padding:8px 10px;
font-weight:800;
}

.note{
font-size:11px;
color:rgba(255,255,255,.55);
margin-top:6px;
}

.qrBtn{
margin-top:8px;
}

</style>
</head>

<body>

<div id="pageContent">

<!-- PROFİL -->
<div class="panel">
<h2 class="title">Profil</h2>

<div class="line">
<div class="k">Ad Soyad</div>
<div class="v" id="pName">—</div>
</div>

<div class="line">
<div class="k">Mail</div>
<div class="v" id="pEmail">—</div>
</div>

<div class="line">
<div class="k">Üyelik No</div>
<div class="v" id="memberNo">—</div>
</div>

<div class="line">
<div class="k">Üyelik Tarihi</div>
<div class="v" id="createdAt">—</div>
</div>

<div class="line">
<div class="k">Son Giriş</div>
<div class="v" id="lastLogin">—</div>
</div>

<div class="line">
<div class="k">Jeton</div>
<div class="v"><span id="tokenVal">0</span></div>
</div>

</div>


<!-- SES PROFİL -->
<div class="panel">

<h2 class="title">Ses Profili</h2>

<div class="line">
<div class="k">Ses Durumu</div>
<div class="v" id="voiceProfileStatus">Hazır değil</div>
</div>

<button class="btn btn-primary" id="voiceProfileBtn">Sesini Tanıt</button>

</div>


<!-- ÇEVİRİ SESİ -->
<div class="panel">

<h2 class="title">Çeviri Ayarları</h2>

<div class="setting">
<div class="k">Çeviri Sesi</div>

<select class="select" id="ttsVoiceSelect">
<option value="auto">Otomatik</option>
<option value="female">Kadın</option>
<option value="male">Erkek</option>
<option value="clone">Benim Sesim</option>
</select>

</div>

<div class="note">
FaceToFace ve TextToText çevirilerinde kullanılacak ses.
</div>

</div>


<!-- QR KOD -->
<div class="panel">

<h2 class="title">Interpreter QR</h2>

<div class="note">
Bu QR kodu okutulduğunda direkt tercüman sohbetine bağlanılır.
</div>

<button class="btn btn-primary qrBtn" id="refreshQrBtn">
QR Kod Yenile
</button>

</div>


<!-- ÇIKIŞ -->
<div class="panel">

<button class="btn btn-safe" id="logoutBtn">
Güvenli Çıkış
</button>

<button class="btn btn-danger" id="deleteBtn">
Hesabımı Kalıcı Sil
</button>

</div>

</div>


<script type="module" src="/js/profile_boot.js?v=clean2"></script>

</body>
</html>
