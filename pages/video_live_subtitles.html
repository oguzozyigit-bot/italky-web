<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>italkyAI Görüntülü Canlı Altyazı</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{min-height:100vh;max-width:460px;margin:auto;background:#111;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}.title{font-weight:700;font-size:18px}.pill{font-size:12px;padding:7px 10px;border:1px solid #333;border-radius:16px;color:#cfcfcf}.stage{position:relative;flex:1;min-height:520px;background:linear-gradient(180deg,#20242a,#121417);overflow:hidden}.remote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#343b45 0,#20242a 35%,#111 80%)}.avatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:#3a414a;font-size:42px;font-weight:700}.self{position:absolute;right:14px;top:14px;width:104px;height:150px;border-radius:18px;background:#2d3238;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 8px 30px #0008}.badge{position:absolute;left:14px;top:16px;background:#0009;border:1px solid #ffffff22;padding:8px 11px;border-radius:18px;font-size:12px}.subs{position:absolute;left:12px;right:12px;bottom:88px;display:flex;flex-direction:column;gap:8px}.line{background:#000c;backdrop-filter:blur(10px);border:1px solid #ffffff1a;border-radius:16px;padding:10px 11px;display:grid;grid-template-columns:1fr 42px;gap:8px}.speaker{border:0;border-radius:50%;width:38px;height:38px;background:#ffffff18;color:#fff;font-size:18px}.who{font-size:11px;color:#aaa;margin-bottom:3px}.original{font-size:13px;color:#bdbdbd;margin-bottom:3px}.translated{font-size:16px;line-height:1.28;font-weight:600}.controls{position:absolute;left:0;right:0;bottom:15px;display:flex;justify-content:center;gap:14px}.ctl{width:54px;height:54px;border-radius:50%;border:0;background:#2b2e33;color:#fff;font-size:20px}.ctl.active{background:#146c43}.hang{background:#d93025}.bottom{padding:12px 14px 18px;background:#111}.langs{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}.lang{border:1px solid #333;background:#181a1d;color:#fff;border-radius:18px;padding:8px 12px}.modeRow{display:flex;gap:8px}.modeBtn{flex:1;border:1px solid #333;background:#17191c;color:#ddd;border-radius:14px;padding:10px 8px;font-size:12px}.modeBtn.active{border-color:#32d583;color:#fff}.hint{text-align:center;color:#777;font-size:11px;margin-top:8px}.hidden{display:none}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="title">Görüntülü Görüşme</div><div class="pill" id="status">Prototip</div></header>
<section class="stage">
  <div class="remote"><div class="avatar">EN</div></div>
  <div class="self">TR</div>
  <div class="badge" id="liveBadge">Canlı altyazı açık</div>
  <div class="subs" id="subs">
    <div class="line" data-tts="Let's start the meeting at ten tomorrow."><div><div class="who">Sen · Türkçe</div><div class="original">Yarın saat 10'da toplantıya başlayalım.</div><div class="translated">Let's start the meeting at ten tomorrow.</div></div><button class="speaker" aria-label="Çeviriyi seslendir">🔊</button></div>
    <div class="line" data-tts="Kaç adet gönderebilirsiniz?"><div><div class="who">Karşı taraf · English</div><div class="original">How many units can you send?</div><div class="translated">Kaç adet gönderebilirsiniz?</div></div><button class="speaker" aria-label="Çeviriyi seslendir">🔊</button></div>
  </div>
  <div class="controls">
    <button class="ctl" id="mic">🎙</button>
    <button class="ctl" id="cam">📹</button>
    <button class="ctl active" id="sub">CC</button>
    <button class="ctl hang" id="hang">✕</button>
  </div>
</section>
<section class="bottom">
  <div class="langs"><button class="lang">Ben: Türkçe</button><span>⇄</span><button class="lang">Karşı: English</button></div>
  <div class="modeRow"><button class="modeBtn active" id="modeSub">Altyazı</button><button class="modeBtn" id="modeSpeak">Altyazı + dokununca ses</button><button class="modeBtn" id="modeOriginal">Sadece orijinal ses</button></div>
  <div class="hint">Gerçek görüşmede ses değişmeden gider; çeviri yazı olarak görünür.</div>
</section>
</main>
<script>
let muted=false,camOff=false,subsOn=true,voiceOn=false;
const status=document.getElementById('status'), subs=document.getElementById('subs'), liveBadge=document.getElementById('liveBadge');
function say(text){if(!voiceOn){status.textContent='Sesli çeviri modu kapalı';return;} if(!('speechSynthesis' in window)){status.textContent='Bu cihaz seslendirmeyi desteklemiyor';return;} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=1; speechSynthesis.speak(u); status.textContent='Çeviri seslendiriliyor';}
document.addEventListener('click',e=>{const s=e.target.closest('.speaker'); if(s) say(s.closest('.line').dataset.tts||'');});
document.getElementById('mic').onclick=e=>{muted=!muted;e.currentTarget.classList.toggle('active',muted);status.textContent=muted?'Mikrofon kapalı':'Mikrofon açık';};
document.getElementById('cam').onclick=e=>{camOff=!camOff;e.currentTarget.classList.toggle('active',camOff);status.textContent=camOff?'Kamera kapalı':'Kamera açık';};
document.getElementById('sub').onclick=e=>{subsOn=!subsOn;e.currentTarget.classList.toggle('active',subsOn);subs.classList.toggle('hidden',!subsOn);liveBadge.textContent=subsOn?'Canlı altyazı açık':'Canlı altyazı kapalı';};
document.getElementById('hang').onclick=()=>{status.textContent='Görüşme sonlandırıldı';};
function mode(btn){document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');}
document.getElementById('modeSub').onclick=e=>{mode(e.currentTarget);voiceOn=false;subsOn=true;subs.classList.remove('hidden');liveBadge.textContent='Canlı altyazı açık';status.textContent='Altyazı modu';};
document.getElementById('modeSpeak').onclick=e=>{mode(e.currentTarget);voiceOn=true;subsOn=true;subs.classList.remove('hidden');liveBadge.textContent='Altyazı + dokununca ses';status.textContent='Hoparlöre dokununca çeviri okunur';};
document.getElementById('modeOriginal').onclick=e=>{mode(e.currentTarget);voiceOn=false;subsOn=false;subs.classList.add('hidden');liveBadge.textContent='Sadece orijinal ses';status.textContent='Çeviri kapalı';};
</script>
</body>
</html>
