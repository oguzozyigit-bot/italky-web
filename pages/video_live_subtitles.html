<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>italkyAI Call</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{min-height:100vh;max-width:460px;margin:auto;background:#111;display:flex;flex-direction:column}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}.title{font-weight:800;font-size:20px}.pill{font-size:12px;padding:7px 10px;border:1px solid #333;border-radius:16px;color:#cfcfcf}.home{padding:18px;display:flex;flex-direction:column;gap:14px}.card{background:#17191c;border:1px solid #2c2f34;border-radius:20px;padding:18px}.label{font-size:12px;color:#999}.myNo{font-size:30px;font-weight:800;letter-spacing:2px;margin:7px 0}.muted{color:#999;font-size:13px;line-height:1.45}.number{margin:18px 0 8px;text-align:center;font-size:29px;min-height:42px;letter-spacing:.6px}.subtxt{text-align:center;color:#777;font-size:12px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 26px;max-width:310px;width:100%;margin:18px auto}.key{aspect-ratio:1;border:0;border-radius:50%;background:#24272c;color:white;font-size:30px}.letters{display:block;font-size:9px;letter-spacing:1.2px;color:#999}.dialActions{display:flex;justify-content:center;align-items:center;gap:24px}.callBtn,.videoBtn,.erase{border:0;border-radius:50%;color:#fff}.callBtn{width:72px;height:72px;background:#22c55e;font-size:28px}.videoBtn{width:58px;height:58px;background:#2563eb;font-size:24px}.erase{width:52px;height:52px;background:#2b2e33;font-size:20px}.stage{position:relative;flex:1;min-height:560px;background:linear-gradient(180deg,#20242a,#121417);overflow:hidden}.remote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#343b45 0,#20242a 35%,#111 80%)}.avatar{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:#3a414a;font-size:40px;font-weight:800}.self{position:absolute;right:14px;top:14px;width:104px;height:150px;border-radius:18px;background:#2d3238;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-weight:700}.audioOnly .self{display:none}.audioLabel{display:none;position:absolute;top:210px;left:0;right:0;text-align:center;color:#bbb;font-size:14px}.audioOnly .audioLabel{display:block}.badge{position:absolute;left:14px;top:16px;background:#0009;border:1px solid #ffffff22;padding:8px 11px;border-radius:18px;font-size:12px}.subs{position:absolute;left:12px;right:12px;bottom:92px;display:flex;flex-direction:column;gap:8px}.line{background:#000c;border:1px solid #ffffff1a;border-radius:16px;padding:10px 11px;display:grid;grid-template-columns:1fr 42px;gap:8px}.speaker{border:0;border-radius:50%;width:38px;height:38px;background:#ffffff18;color:#fff;font-size:18px}.who{font-size:11px;color:#aaa}.original{font-size:13px;color:#bbb;margin-top:3px}.translated{font-size:16px;font-weight:650;margin-top:3px}.controls{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:14px}.ctl{width:54px;height:54px;border-radius:50%;border:0;background:#2b2e33;color:#fff;font-size:20px}.ctl.active{background:#146c43}.hang{background:#d93025}.bottom{padding:12px 14px 18px}.langs{display:flex;justify-content:center;align-items:center;gap:8px}.lang{border:1px solid #333;background:#181a1d;color:#fff;border-radius:18px;padding:8px 12px}.incoming{position:fixed;inset:0;background:#0b0b0df2;display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}.incomingCard{width:min(100%,380px);background:#17191c;border:1px solid #333;border-radius:28px;padding:30px 20px;text-align:center}.incomingName{font-size:25px;font-weight:800}.incomingNo{color:#aaa;margin-top:6px}.incomingBtns{display:flex;justify-content:center;gap:38px;margin-top:28px}.accept,.decline{width:70px;height:70px;border:0;border-radius:50%;color:white;font-size:27px}.accept{background:#22c55e}.decline{background:#d93025}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="title">italkyAI Call</div><div class="pill" id="status">Hazır</div></header>
<section id="home" class="home">
  <div class="card"><div class="label">Senin italkyAI numaran</div><div class="myNo" id="myNumber"></div><div class="muted">Bu numara hesabına ait kalıcı uygulama içi arama numarasıdır.</div></div>
  <div class="card">
    <div id="number" class="number">Numara gir</div><div class="subtxt">italkyAI numarasını ara</div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2<span class="letters">ABC</span></button><button class="key" data-k="3">3<span class="letters">DEF</span></button>
      <button class="key" data-k="4">4<span class="letters">GHI</span></button><button class="key" data-k="5">5<span class="letters">JKL</span></button><button class="key" data-k="6">6<span class="letters">MNO</span></button>
      <button class="key" data-k="7">7<span class="letters">PQRS</span></button><button class="key" data-k="8">8<span class="letters">TUV</span></button><button class="key" data-k="9">9<span class="letters">WXYZ</span></button>
      <button class="key" data-k="*">*</button><button class="key" data-k="0">0<span class="letters">+</span></button><button class="key" data-k="#">#</button>
    </div>
    <div class="dialActions"><button id="erase" class="erase">⌫</button><button id="audioCall" class="callBtn">☎</button><button id="videoCall" class="videoBtn">📹</button></div>
  </div>
</section>
<section id="callUi" class="hidden">
  <section class="stage" id="stage">
    <div class="remote"><div class="avatar" id="remoteAvatar">IT</div></div><div class="self">BEN</div><div class="audioLabel">Kamera kapalı · Sesli görüşme devam ediyor</div>
    <div class="badge" id="liveBadge">Canlı altyazı açık</div>
    <div class="subs" id="subs"><div class="line" data-tts="Hello, how are you?"><div><div class="who">Karşı taraf</div><div class="original">Hello, how are you?</div><div class="translated">Merhaba, nasılsın?</div></div><button class="speaker">🔊</button></div></div>
    <div class="controls"><button class="ctl" id="mic">🎙</button><button class="ctl" id="cam">📹</button><button class="ctl active" id="sub">CC</button><button class="ctl hang" id="hang">✕</button></div>
  </section>
  <section class="bottom"><div class="langs"><button class="lang">Ben: Türkçe</button><span>⇄</span><button class="lang">Karşı: English</button></div></section>
</section>
<div id="incoming" class="incoming hidden"><div class="incomingCard"><div class="label">Gelen italkyAI araması</div><div class="incomingName">Oğuz arıyor</div><div class="incomingNo" id="incomingNo"></div><div class="incomingBtns"><button class="decline" id="decline">✕</button><button class="accept" id="accept">☎</button></div></div></div>
</main>
<script>
let dial='',camOff=false,muted=false,subsOn=true,currentPeer='';
const home=document.getElementById('home'),callUi=document.getElementById('callUi'),stage=document.getElementById('stage'),status=document.getElementById('status'),subs=document.getElementById('subs'),liveBadge=document.getElementById('liveBadge');
function makeItalkyNo(){return '0601 '+String(Math.floor(100+Math.random()*900))+' '+String(Math.floor(100+Math.random()*900));}
let myNo=localStorage.getItem('italky_internal_number');if(!myNo){myNo=makeItalkyNo();localStorage.setItem('italky_internal_number',myNo)}document.getElementById('myNumber').textContent=myNo;
function paint(){document.getElementById('number').textContent=dial||'Numara gir'}
document.getElementById('keypad').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;dial+=b.dataset.k;paint()};document.getElementById('erase').onclick=()=>{dial=dial.slice(0,-1);paint()};
function startCall(video){if(dial.replace(/\D/g,'').length<6){status.textContent='Geçerli italkyAI numarası gir';return}currentPeer=dial;home.classList.add('hidden');callUi.classList.remove('hidden');camOff=!video;stage.classList.toggle('audioOnly',camOff);status.textContent=video?'Görüntülü arama':'Sesli arama';document.getElementById('remoteAvatar').textContent='IT';}
document.getElementById('audioCall').onclick=()=>startCall(false);document.getElementById('videoCall').onclick=()=>startCall(true);
document.getElementById('mic').onclick=e=>{muted=!muted;e.currentTarget.classList.toggle('active',muted);status.textContent=muted?'Mikrofon kapalı':'Mikrofon açık'};
document.getElementById('cam').onclick=e=>{camOff=!camOff;e.currentTarget.classList.toggle('active',camOff);stage.classList.toggle('audioOnly',camOff);status.textContent=camOff?'Sadece ses':'Görüntülü'};
document.getElementById('sub').onclick=e=>{subsOn=!subsOn;e.currentTarget.classList.toggle('active',subsOn);subs.classList.toggle('hidden',!subsOn);liveBadge.textContent=subsOn?'Canlı altyazı açık':'Canlı altyazı kapalı'};
document.getElementById('hang').onclick=()=>{callUi.classList.add('hidden');home.classList.remove('hidden');status.textContent='Görüşme bitti'};
document.addEventListener('click',e=>{const s=e.target.closest('.speaker');if(!s)return;if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(s.closest('.line').dataset.tts||'');speechSynthesis.cancel();speechSynthesis.speak(u)});
// Test amaçlı gelen çağrı simülasyonu: ?incoming=0601123456 ile açılır.
const incomingParam=(new URLSearchParams(location.search).get('incoming')||'').replace(/\D/g,'');if(incomingParam){document.getElementById('incomingNo').textContent=incomingParam;document.getElementById('incoming').classList.remove('hidden')}
document.getElementById('decline').onclick=()=>{document.getElementById('incoming').classList.add('hidden');status.textContent='Arama reddedildi'};document.getElementById('accept').onclick=()=>{document.getElementById('incoming').classList.add('hidden');dial=incomingParam;startCall(false)};
</script>
</body>
</html>
