<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>italkyAI • iOS Home</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{--txt:rgba(255,255,255,.96);--muted:rgba(255,255,255,.66);--line:rgba(255,255,255,.14);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#070b16}body{min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 18% 0%,rgba(56,189,248,.16),transparent 30%),radial-gradient(circle at 86% 12%,rgba(168,85,247,.16),transparent 32%),radial-gradient(circle at 50% 100%,rgba(249,115,22,.10),transparent 34%),linear-gradient(180deg,#0b1020 0%,#090b16 48%,#05070d 100%)}body:not(.home-ready){visibility:hidden}.page{width:100%;height:100dvh;overflow-y:auto;padding:calc(14px + var(--safe-top)) 14px calc(22px + var(--safe-bottom));-webkit-overflow-scrolling:touch}.shell{width:min(100%,760px);min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}.hero{padding:4px 0 2px;text-align:center}.holo{width:138px;height:138px;margin:0 auto 7px;position:relative;display:grid;place-items:center}.glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(103,232,249,.25),transparent 65%);filter:blur(12px)}.planet{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.20),transparent 24%),linear-gradient(145deg,#111827 0%,#070a12 50%,#030406 100%);box-shadow:inset -10px -12px 20px rgba(0,0,0,.72),0 0 36px rgba(103,232,249,.22)}.planet span{font-weight:1000;font-size:18px}.brand{font-size:34px;font-weight:1000;letter-spacing:-1px;line-height:1}.brand span{background:linear-gradient(135deg,#22d3ee,#818cf8 58%,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tag{margin-top:4px;font-size:11px;letter-spacing:2px;font-weight:900;color:rgba(255,255,255,.65)}.profile{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.035));box-shadow:0 18px 42px rgba(0,0,0,.28)}.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#818cf8 58%,#ec4899);font-size:20px;font-weight:1000}.profile h1{margin:0;font-size:18px;line-height:1.15}.profile p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:104px;padding:14px;border-radius:22px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));color:#fff;text-decoration:none;box-shadow:0 14px 32px rgba(0,0,0,.24);display:flex;flex-direction:column;justify-content:space-between}.tile strong{font-size:16px;line-height:1.15}.tile span{font-size:12px;line-height:1.35;color:var(--muted);font-weight:750}.icon{width:34px;height:34px;border-radius:13px;display:grid;place-items:center;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.14);font-weight:1000}.wide{grid-column:1 / -1;min-height:94px}.footer{margin:auto 0 0;text-align:center;color:rgba(255,255,255,.38);font-size:11px;font-weight:850;letter-spacing:1.1px;padding-top:10px}@media(max-width:430px){.grid{gap:9px}.tile{min-height:100px;padding:13px;border-radius:20px}.tile strong{font-size:15px}.wide{min-height:88px}.brand{font-size:32px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="hero" aria-label="italkyAI"><div class="holo"><div class="glow"></div><div class="planet"><span>AI</span></div></div><div class="brand">italky<span>AI</span></div><div class="tag">BE FREE</div></section>
      <section class="profile" aria-label="iOS premium hesabı"><div class="avatar"></div><div><h1>Apple Premium Üye</h1><p>App Store premium erişimi aktif</p></div></section>
      <nav class="grid" aria-label="iOS premium menü">
        <a class="tile wide" href="/facetoface.html?ios=1&premium=1"><div class="icon">↔</div><strong>FaceToFace</strong><span>Karşılıklı konuşma ve canlı çeviri</span></a>
        <a class="tile" href="/pages/offline_languages.html?ios=1&premium=1"><div class="icon">↓</div><strong>Offline languages</strong><span>Dil paketlerini indir</span></a>
        <a class="tile" href="/pages/text_translate.html?ios=1&premium=1"><div class="icon">T</div><strong>Text translate</strong><span>Yazı çevirisi</span></a>
        <a class="tile" href="/pages/game_menu.html?ios=1&premium=1"><div class="icon">★</div><strong>Game menu</strong><span>Premium oyunlar</span></a>
        <a class="tile" href="/pages/level_test_hub.html?ios=1&premium=1"><div class="icon">A</div><strong>Level test</strong><span>Seviye sınavları</span></a>
      </nav>
      <div class="footer">Italky Teknoloji A.Ş</div>
    </div>
  </main>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const queryPremium = params.get("premium") === "1" || params.get("ios_iap") === "1" || params.get("purchase") === "success" || params.get("restore") === "success";
      let storedPremium = false;
      try{ storedPremium = localStorage.getItem("italky_ios_premium_active") === "1"; }catch(e){}
      if(!queryPremium && !storedPremium){ window.location.replace("/pages/membership_ios.html?ios=1"); return; }
      [localStorage, sessionStorage].forEach(function(storage){
        try{
          storage.setItem("italky_membership_active", "1");
          storage.setItem("italky_membership_status", "active");
          storage.setItem("italky_premium_active", "1");
          storage.setItem("italky_ios_premium_active", "1");
          storage.setItem("italky_premium_source", "ios_iap");
        }catch(e){}
      });
      document.body.classList.add("home-ready");
    })();
  </script>
</body>
</html>
