rgin:0;text-align:center;color:#fff;font-size:26px;letter-spacing:-.55px}p{margin:8px 0 18px;text-align:center;color:#b7d1e7;font-size:14px;line-height:1.45}.label{font-size:13px;color:#bcd5e9;font-weight:750;margin:0 0 8px 4px}.pickerBtn{width:100%;height:58px;border:1px solid rgba(126,206,255,.42);border-radius:18px;background:rgba(4,20,42,.72);padding:0 17px;color:#fff;display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750;text-align:left}.pickerBtn .chev{margin-left:auto;color:#7fd5ff;font-size:21px}.ok{width:100%;height:54px;border:0;border-radius:27px;margin-top:17px;background:linear-gradient(135deg,#087ef2,#25bcff);color:#fff;font-size:17px;font-weight:850;box-shadow:0 12px 30px rgba(0,145,255,.33)}button:active{transform:scale(.986)}.note{text-align:center;margin-top:11px;color:#87a9c2;font-size:11px}.langSheet{position:fixed;inset:0;z-index:10;background:rgba(1,9,24,.68);display:none;align-items:flex-end;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.langSheet.show{display:flex}.sheetCard{width:100%;max-height:90vh;background:linear-gradient(180deg,#0a2a52,#06182b);border-radius:28px 28px 0 0;border-top:1px solid rgba(105,199,255,.32);box-shadow:0 -20px 60px rgba(0,0,0,.45);overflow:hidden}.sheetHead{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.10)}.sheetHead strong{font-size:20px;color:#fff}.sheetHead button{border:0;background:#123f72;color:#bfe7ff;border-radius:18px;padding:8px 14px;font-weight:800}.langList{max-height:calc(90vh - 68px);overflow:auto;padding:7px 10px calc(14px + env(safe-area-inset-bottom))}.langItem{width:100%;min-height:56px;border:0;border-bottom:1px solid rgba(255,255,255,.075);background:transparent;color:#f5fbff;display:flex;align-items:center;gap:13px;padding:9px 13px;font-size:16px;text-align:left}.langItem .flag{font-size:24px;width:34px}.langItem .name{flex:1}.langItem .radio{width:22px;height:22px;border:2px solid #7b9bb7;border-radius:50%;position:relative}.langItem.active{background:linear-gradient(90deg,rgba(18,135,255,.24),rgba(18,135,255,.04))}.langItem.active .radio{border-color:#25b9ff}.langItem.active .radio:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#25b9ff}@media(max-width:370px){.modal{left:14px;right:14px;padding:19px 17px 18px}.brandLogo{height:50px}h1{font-size:23px}}</style><script>(()=>{const verified=localStorage.getItem('italky_phone_verified')==='1',phone=String(localStorage.getItem('italky_phone_number')||'').trim();if(!verified||!phone){location.replace('/pages/login.html');return}localStorage.setItem('italky_test_phone_v4',phone);let p=null;try{p=JSON.parse(localStorage.getItem('italky_test_profile_v4')||'null')}catch{}if(!p||!p.phone){p={name:phone,photo:'',phone,lang:localStorage.getItem('italky_test_lang_v4')||'tr'};localStorage.setItem('italky_test_profile_v4',JSON.stringify(p))}})();</script></head><body><div class="preview" aria-hidden="true"><div class="fakeHead"><img src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt=""></div><div class="fakeSearch"></div><div class="fakeChips"><i></i><i></i><i></i></div><div class="fakeRows"><div class="fakeRow"><span class="fakeAvatar"></span><span class="fakeLine"></span></div><div class="fakeRow"><span class="fakeAvatar"></span><span class="fakeLine"></span></div></div><div class="fakeNav"></div></div><div class="veil"></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><img class="brandLogo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI"><h1 id="title">Kendi dilinizi seçin</h1><p>Mesajlar ve çeviriler size bu dilde gösterilecek. Daha sonra Ayarlar'dan değiştirebilirsiniz.</p><div class="label">Diliniz</div><button id="picker" class="pickerBtn" type="button"><span id="pickedFlag">🇹🇷</span><span id="pickedName">Türkçe</span><span class="chev">⌄</span></button><button id="ok" class="ok" type="button">Tamam</button><div class="note">iTalky dil tercihinizi bu cihazda saklar.</div></section><div id="sheet" class="langSheet"><div class="sheetCard"><div class="sheetHead"><strong>Dilinizi seçin</strong><button id="closeSheet" type="button">Kapat</button></div><div id="langList" class="langList"></div></div></div><script type="module">import{LANGUAGE_REGISTRY_129}from'/js/language_registry_129.js';const popularity=['tr','en','en-us','en-gb','zh','hi','es','ar','fr','bn','pt','ru','ur','id','de','ja','vi','ko','it','fa','sw','nl','pl','uk','ro','el','az','kk','uz','th','ms'];const score=x=>{let i=popularity.indexOf(x.code);if(i<0)i=popularity.indexOf(x.parent);return i<0?999:i};let list=LANGUAGE_REGISTRY_129.filter(x=>x.online!==false).sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name,'tr')),sheet=document.getElementById('sheet'),box=document.getElementById('langList'),flagEl=document.getElementById('pickedFlag'),nameEl=document.getElementById('pickedName');let selected=localStorage.getItem('italky_test_lang_v4')||localStorage.getItem('site_lang')||'tr';if(!list.some(x=>x.code===selected))selected='tr';function paint(){const cur=list.find(x=>x.code===selected)||list[0];flagEl.textContent=cur?.flag||'🌐';nameEl.textContent=cur?.name||'Dil';const ordered=[cur,...list.filter(x=>x.code!==cur.code)];box.innerHTML=ordered.map(x=>`<button type="button" class="langItem ${x.code===selected?'active':''}" data-code="${String(x.code).replace(/"/g,'')}"><span class="flag">${x.flag||'🌐'}</span><span class="name">${x.name}</span><span class="radio"></span></button>`).join('')}paint();document.getElementById('picker').onclick=()=>sheet.classList.add('show');document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('show');sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('show');const b=e.target.closest('.langItem');if(!b)return;selected=b.dataset.code;paint();sheet.classList.remove('show')});document.getElementById('ok').onclick=()=>{const code=selected||'tr';localStorage.setItem('italky_test_lang_v4',code);localStorage.setItem('site_lang',code);localStorage.setItem('italky_language_selected_v1','1');const phone=String(localStorage.getItem('italky_phone_number')||'').trim();let p={};try{p=JSON.parse(localStorage.getItem('italky_test_profile_v4')||'{}')||{}}catch{}p={...p,name:p.name||phone,photo:p.photo||'',phone:p.phone||phone,lang:code};localStorage.setItem('italky_test_profile_v4',JSON.stringify(p));location.replace('/pages/italky_messenger.html?languageChosen=1')};</script></body></html>
