<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>iTalky • Dilini Seç</title><meta name="theme-color" content="#06182b"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#06182b}.preview{position:fixed;inset:0;width:100%;height:100%;border:0;filter:blur(5px) saturate(.86);transform:scale(1.035);transform-origin:center;pointer-events:none}.veil{position:fixed;inset:0;background:rgba(3,16,35,.32);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}.modal{position:fixed;left:20px;right:20px;top:50%;transform:translateY(-50%);max-width:430px;margin:auto;background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 26px 80px rgba(2,18,44,.35);z-index:3}.mark{width:58px;height:58px;border-radius:19px;margin:0 auto 16px;background:linear-gradient(145deg,#092654,#1687ff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;box-shadow:0 10px 28px rgba(22,135,255,.24)}h1{margin:0;text-align:center;color:#071b3a;font-size:27px;letter-spacing:-.6px}p{margin:8px 0 20px;text-align:center;color:#667281;font-size:14px;line-height:1.45}.label{font-size:13px;color:#5e6d7d;font-weight:700;margin:0 0 7px 4px}.selectWrap{position:relative}.selectWrap:after{content:'⌄';position:absolute;right:17px;top:50%;transform:translateY(-54%);font-size:20px;color:#486078;pointer-events:none}select{width:100%;height:58px;border:1.5px solid #dbe6f1;border-radius:18px;background:#f8fbff;padding:0 46px 0 16px;color:#13233a;font-size:16px;font-weight:650;outline:none;appearance:none;-webkit-appearance:none}select:focus{border-color:#1687ff;box-shadow:0 0 0 4px rgba(22,135,255,.10)}button{width:100%;height:56px;border:0;border-radius:28px;margin-top:18px;background:linear-gradient(135deg,#0a7df0,#28b8ff);color:#fff;font-size:17px;font-weight:850;box-shadow:0 12px 28px rgba(15,137,245,.25)}button:active{transform:scale(.985)}.note{text-align:center;margin-top:12px;color:#8a96a4;font-size:11px}@media(max-width:370px){.modal{left:14px;right:14px;padding:22px 17px 19px}h1{font-size:24px}}</style><script>(()=>{const verified=localStorage.getItem('italky_phone_verified')==='1';const phone=String(localStorage.getItem('italky_phone_number')||'').trim();if(!verified||!phone){location.replace('/pages/login.html');return}localStorage.setItem('italky_test_phone_v4',phone);let p=null;try{p=JSON.parse(localStorage.getItem('italky_test_profile_v4')||'null')}catch{}if(!p||!p.phone){p={name:phone,photo:'',phone,lang:localStorage.getItem('italky_test_lang_v4')||'tr'};localStorage.setItem('italky_test_profile_v4',JSON.stringify(p))}})();</script></head><body><iframe class="preview" src="/pages/italky_messenger.html?skipLanguageGate=1" aria-hidden="true"></iframe><div class="veil"></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><div class="mark">iT</div><h1 id="title">Kendi dilinizi seçin</h1><p>Mesajlar ve çeviriler size bu dilde gösterilecek. Daha sonra Ayarlar'dan değiştirebilirsiniz.</p><div class="label">Diliniz</div><div class="selectWrap"><select id="lang" aria-label="Diliniz"></select></div><button id="ok" type="button">Tamam</button><div class="note">iTalky dil tercihinizi bu cihazda saklar.</div></section><script type="module">import{LANGUAGE_REGISTRY_129}from'/js/language_registry_129.js';const sel=document.getElementById('lang');const list=LANGUAGE_REGISTRY_129.filter(x=>x.online!==false);sel.innerHTML=list.map(x=>`<option value="${String(x.code).replace(/"/g,'')}">${x.flag||'🌐'} ${x.name}</option>`).join('');const saved=localStorage.getItem('italky_test_lang_v4')||localStorage.getItem('site_lang')||'tr';if([...sel.options].some(o=>o.value===saved))sel.value=saved;document.getElementById('ok').onclick=()=>{const code=sel.value||'tr';localStorage.setItem('italky_test_lang_v4',code);localStorage.setItem('site_lang',code);localStorage.setItem('italky_language_selected_v1','1');const phone=String(localStorage.getItem('italky_phone_number')||'').trim();let p={};try{p=JSON.parse(localStorage.getItem('italky_test_profile_v4')||'{}')||{}}catch{}p={...p,name:p.name||phone,photo:p.photo||'',phone:p.phone||phone,lang:code};localStorage.setItem('italky_test_profile_v4',JSON.stringify(p));location.replace('/pages/italky_messenger.html')};</script></body></html>
