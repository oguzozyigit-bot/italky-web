<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>italkyAI • Signal Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Share+Tech+Mono&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#02000f;
    --radar:#00ffd5;
    --danger:#ff2456;
    --ok:#00ff9d;
    --gold:#ffcc33;
    --grad: linear-gradient(135deg,#a5b4fc 0%, #6366f1 55%, #ec4899 100%);
    --bd: rgba(255,255,255,0.10);
    --safeB: env(safe-area-inset-bottom, 0px);
    --shellLift: 0px;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    outline:none;
  }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:#fff;
    font-family:Outfit,sans-serif;
    overflow:hidden;
  }
  body{
    background:
      radial-gradient(circle at 50% 10%, rgba(99,102,241,.14), transparent 28%),
      radial-gradient(circle at 0% 100%, rgba(0,255,213,.10), transparent 24%),
      radial-gradient(circle at 100% 0%, rgba(236,72,153,.10), transparent 22%),
      var(--bg);
  }

  #pageContent{
    height:100%;
    padding:74px 12px calc(18px + var(--safeB) + var(--shellLift)) 12px;
  }

  .wrap{
    height:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-radius:20px;
    border:1px solid var(--bd);
    background: rgba(0,0,0,0.22);
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }

  .score{
    font-family:"Share Tech Mono", monospace;
    font-size:24px;
    color: var(--radar);
    line-height:1;
  }

  .labelMini{
    font-size:10px;
    font-weight:900;
    letter-spacing:1.4px;
    opacity:.65;
    margin-top:4px;
  }

  .centerHud{
    text-align:center;
  }

  .gameTitle{
    font-family:"Space Grotesk", sans-serif;
    font-size:16px;
    font-weight:900;
    letter-spacing:.6px;
  }

  .langDisp{
    font-size:12px;
    opacity:.78;
    margin-top:4px;
    font-weight:800;
  }

  .lives{
    font-size:22px;
    letter-spacing:2px;
    filter: drop-shadow(0 0 10px rgba(255,36,86,.35));
  }

  .main{
    flex:1;
    border-radius:24px;
    border:1px solid var(--bd);
    background: rgba(255,255,255,0.03);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
    overflow:hidden;
    backdrop-filter: blur(14px);
  }

  .radarBox{
    width: 190px;
    height: 190px;
    margin: 0 auto;
    border-radius: 50%;
    border: 1px solid rgba(0,255,213,.32);
    position: relative;
    overflow:hidden;
    background:
      radial-gradient(circle at center, rgba(0,255,213,.08), transparent 55%),
      rgba(255,255,255,.02);
    box-shadow: inset 0 0 40px rgba(0,255,213,.10), 0 0 24px rgba(0,255,213,.08);
  }

  .radarRing{
    position:absolute;
    inset:18px;
    border:1px solid rgba(0,255,213,.14);
    border-radius:50%;
  }
  .radarRing.r2{ inset:40px; }
  .radarRing.r3{ inset:62px; }

  .crossV,.crossH{
    position:absolute;
    background:rgba(0,255,213,.10);
  }
  .crossV{ width:1px; top:0; bottom:0; left:50%; transform:translateX(-50%); }
  .crossH{ height:1px; left:0; right:0; top:50%; transform:translateY(-50%); }

  .scan{
    position:absolute;
    inset:-28%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(0,255,213,.24) 70deg, transparent 120deg);
    animation: spin 3.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg);} }

  .pulseDot{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--radar);
    box-shadow:0 0 22px var(--radar);
    left:62%;
    top:34%;
    animation:pulseDot 1.4s infinite ease-in-out;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(.8); opacity:.75; }
    50%{ transform:scale(1.22); opacity:1; }
  }

  .listenBtn{
    height:58px;
    border-radius:18px;
    border:1px solid var(--radar);
    background: rgba(0,0,0,0.25);
    color: var(--radar);
    font-weight: 900;
    font-size:15px;
    cursor:pointer;
    transition:.16s ease;
  }
  .listenBtn:active{ transform:scale(.98); }
  .listenBtn.playing{
    background: rgba(0,255,213,.12);
    box-shadow: 0 0 26px rgba(0,255,213,.18);
  }

  .questionBox{
    padding:12px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);
    text-align:center;
  }

  .questionMain{
    font-size:15px;
    font-weight:900;
    color:#fff;
    line-height:1.45;
  }

  .questionSub{
    font-size:12px;
    color:rgba(255,255,255,.58);
    margin-top:6px;
    font-weight:700;
  }

  .optionsArea{
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .opt{
    padding:15px 14px;
    border-radius:16px;
    border:1px solid var(--bd);
    background: rgba(0,0,0,0.22);
    text-align:center;
    cursor:pointer;
    font-weight:700;
    transition:.16s ease;
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .opt:active{ transform:scale(.985); }

  .opt.correct{
    border-color: var(--ok);
    color: var(--ok);
    box-shadow:0 0 0 1px rgba(0,255,157,.22), 0 0 18px rgba(0,255,157,.12);
  }

  .opt.wrong{
    border-color: var(--danger);
    color: var(--danger);
    box-shadow:0 0 0 1px rgba(255,36,86,.18), 0 0 18px rgba(255,36,86,.10);
  }

  .momDisp{
    text-align:center;
    color:var(--ok);
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    min-height:18px;
  }

  .modal{
    position: fixed;
    inset: 0;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(0,0,0,0.84);
    backdrop-filter: blur(10px);
    z-index: 100;
    padding:20px;
  }
  .modal.show{ display:flex; }

  .cardModal{
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, rgba(16,16,24,.96), rgba(8,8,12,.96));
    padding: 22px;
    border-radius: 24px;
    border: 1px solid rgba(0,255,213,.18);
    text-align:center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.65);
  }

  .mainBtn{
    width:100%;
    height:54px;
    border-radius:16px;
    border:none;
    background: var(--grad);
    color:#000;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    margin-top:12px;
  }

  .langGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:16px 0;
  }

  .langBtn{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    border-radius:16px;
    padding:14px 10px;
    cursor:pointer;
    transition:.16s ease;
    min-height:84px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-weight:800;
  }
  .langBtn:active{ transform:scale(.98); }
  .langBtn.active{
    border-color: rgba(0,255,157,.30);
    box-shadow:0 0 0 1px rgba(0,255,157,.24), 0 0 18px rgba(0,255,157,.12);
    background: rgba(0,255,157,.08);
  }
  .langBtn .flag{ font-size:26px; }

  .resultStat{
    margin-top:12px;
    font-size:14px;
    font-weight:800;
    color:rgba(255,255,255,.82);
    white-space:pre-line;
  }

  .topActions{
    display:flex;
    gap:10px;
    margin-top:12px;
  }

  .secondaryBtn{
    flex:1;
    height:50px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-weight:900;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="bg-fx"></div>
<div class="nebula a"></div>
<div class="nebula b"></div>

<main id="pageContent">
  <div class="wrap">
    <div class="hud">
      <div>
        <div class="score" id="scoreDisp">0</div>
        <div class="labelMini">SKOR</div>
      </div>

      <div class="centerHud">
        <div class="gameTitle">SIGNAL HUNT</div>
        <div class="langDisp" id="langDisp">EN • TR</div>
      </div>

      <div>
        <div class="lives" id="livesDisp">❤️❤️❤️</div>
        <div class="labelMini" style="text-align:right;">CAN</div>
      </div>
    </div>

    <div class="main">
      <div class="radarBox" id="radar">
        <div class="radarRing"></div>
        <div class="radarRing r2"></div>
        <div class="radarRing r3"></div>
        <div class="crossV"></div>
        <div class="crossH"></div>
        <div class="scan"></div>
        <div class="pulseDot"></div>
      </div>

      <button class="listenBtn" id="listenBtn">▶ SİNYALİ DİNLE</button>

      <div class="questionBox">
        <div class="questionMain" id="questionMain">Doğru karşılığı bul</div>
        <div class="questionSub" id="questionSub">Dinlediğin cümlenin doğru Türkçe karşılığını seç</div>
      </div>

      <div class="optionsArea" id="optionsArea"></div>
      <div class="momDisp" id="momDisp">x1.00 MOMENTUM</div>
    </div>
  </div>
</main>

<div class="modal show" id="startModal">
  <div class="cardModal">
    <h2 style="color:var(--radar); margin:0;">SİSTEM HAZIR</h2>
    <p style="opacity:.78; line-height:1.6; font-weight:700; margin:12px 0 0;">
      Bayrağa dokun, oyun dilini seç. Sonra sinyali dinle ve doğru Türkçe karşılığı bul.
    </p>

    <div class="langGrid" id="langGrid"></div>
    <button class="mainBtn" id="startBtn">BAŞLA</button>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="cardModal">
    <h2 id="resultTitle" style="margin:0;">OYUN BİTTİ</h2>
    <div class="resultStat" id="resultStats">Skor: 0</div>
    <div class="topActions">
      <button class="secondaryBtn" id="retryBtn">TEKRAR OYNA</button>
      <button class="secondaryBtn" id="backBtn">ANA MENÜ</button>
    </div>
  </div>
</div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";

mountShell({ scroll:"none" });

const $ = (id) => document.getElementById(id);
const GAME_LANG_KEY = "italky_signal_hunt_lang";

const LANGS = {
  en:{ name:"İngilizce", flag:"🇬🇧", bcp:"en-US" },
  de:{ name:"Almanca", flag:"🇩🇪", bcp:"de-DE" },
  fr:{ name:"Fransızca", flag:"🇫🇷", bcp:"fr-FR" },
  es:{ name:"İspanyolca", flag:"🇪🇸", bcp:"es-ES" },
  it:{ name:"İtalyanca", flag:"🇮🇹", bcp:"it-IT" }
};

const state = {
  lang: localStorage.getItem(GAME_LANG_KEY) || "en",
  selectedLang: localStorage.getItem(GAME_LANG_KEY) || "en",
  pool: [],
  used: new Set(),
  lastKey: "",
  current: null,
  score: 0,
  best: Number(localStorage.getItem("signal_hunt_best") || 0),
  lives: 3,
  momentum: 1.0,
  playingAudio: false
};

let audioCtx = null;

function getAudioCtx(){
  try{
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }catch{
    return null;
  }
}

async function unlockAudio(){
  try{
    const ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended"){
      await ctx.resume();
    }
  }catch{}
}

function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === "suspended"){
    ctx.resume().catch(() => {});
  }
  const now = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + .01);
  g.gain.exponentialRampToValueAtTime(.0001, now + duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + duration + .02);
}

function playSignalFx() {
  beep({ freq: 760, duration: .08, type: "triangle", gain: .04 });
  beep({ freq: 920, duration: .08, type: "triangle", gain: .04, when: .12 });
  beep({ freq: 760, duration: .08, type: "triangle", gain: .04, when: .24 });
}

function playCorrectFx() {
  beep({ freq: 520, duration: .08, type: "triangle", gain: .05 });
  beep({ freq: 660, duration: .08, type: "triangle", gain: .05, when: .08 });
  beep({ freq: 880, duration: .12, type: "triangle", gain: .05, when: .16 });
}

function playWrongFx() {
  beep({ freq: 220, duration: .10, type: "sawtooth", gain: .05 });
  beep({ freq: 180, duration: .12, type: "sawtooth", gain: .04, when: .06 });
}

function nativeSpeak(text, lang){
  try{
    if(window.NativeTTS && typeof window.NativeTTS.speak === "function"){
      window.NativeTTS.speak(String(text || "").trim(), String(lang || "en").trim());
      return true;
    }
  }catch{}
  return false;
}

async function speak(text, lang) {
  const t = String(text || "").trim();
  if(!t) return;
  await unlockAudio();

  if (nativeSpeak(t, lang)) return;

  if(!("speechSynthesis" in window)) return;
  try { window.speechSynthesis.cancel(); } catch {}

  const u = new SpeechSynthesisUtterance(t);
  u.lang = LANGS[lang]?.bcp || "en-US";
  u.rate = .88;
  u.pitch = 1;
  u.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  if (voices?.length) {
    const found = voices.find(v => String(v.lang || "").toLowerCase().startsWith(lang));
    if (found) u.voice = found;
  }

  setTimeout(() => {
    try { window.speechSynthesis.speak(u); } catch {}
  }, 80);
}

["click","touchstart","pointerdown"].forEach(evt => {
  window.addEventListener(evt, () => unlockAudio(), { passive:true, once:true });
});

function normalize(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"")
    .trim();
}

function renderStartLangs() {
  $("langGrid").innerHTML = Object.entries(LANGS).map(([code, meta]) => `
    <button class="langBtn ${state.selectedLang===code ? "active" : ""}" data-lang="${code}" type="button">
      <div class="flag">${meta.flag}</div>
      <div>${meta.name}</div>
    </button>
  `).join("");

  $("langGrid").querySelectorAll(".langBtn").forEach(btn => {
    btn.onclick = () => {
      state.selectedLang = btn.dataset.lang;
      renderStartLangs();
    };
  });
}

async function fileExists(url) {
  try {
    const res = await fetch(url, { method: "HEAD", cache:"no-store" });
    return res.ok;
  } catch {
    return false;
  }
}

function getPublicLangUrl(langCode) {
  return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;
}

function extractItems(payload) {
  if (Array.isArray(payload)) return payload;
  if (payload && typeof payload === "object") {
    const keys = ["items","words","data","list","entries","pool"];
    for (const key of keys) {
      if (Array.isArray(payload[key])) return payload[key];
    }
  }
  return [];
}

function normalizePoolItems(items) {
  return items.map((item) => {
    const rawWord =
      item?.word ??
      item?.w ??
      item?.text ??
      item?.term ??
      item?.answer ??
      item?.source ??
      "";

    const rawMeaning =
      item?.meaning ??
      item?.tr ??
      item?.translation ??
      item?.mean ??
      item?.hint ??
      item?.target ??
      "";

    const rawSentence =
      item?.sentence ??
      item?.s ??
      item?.sample ??
      item?.example ??
      item?.voice ??
      rawWord;

    return {
      word: String(rawWord || "").trim(),
      meaning: String(rawMeaning || "").trim(),
      sentence: String(rawSentence || "").trim()
    };
  }).filter(x => x.word && x.meaning);
}

async function loadPool(lang) {
  const url = getPublicLangUrl(lang);
  const ok = await fileExists(url);
  if (!ok) return [];

  const res = await fetch(url, { cache:"no-store" });
  if (!res.ok) return [];

  const json = await res.json();
  return normalizePoolItems(extractItems(json));
}

function nextItem() {
  if (!state.pool.length) return null;

  if (state.used.size >= state.pool.length) {
    state.used.clear();
  }

  let pick = null;
  let guard = 0;

  while (guard < 100) {
    const item = state.pool[Math.floor(Math.random() * state.pool.length)];
    const key = normalize(item.word);

    if (!state.used.has(key) && key !== state.lastKey) {
      state.used.add(key);
      state.lastKey = key;
      pick = item;
      break;
    }
    guard++;
  }

  if (!pick) {
    const fallback = state.pool.find(x => normalize(x.word) !== state.lastKey) || state.pool[0];
    state.lastKey = normalize(fallback.word);
    state.used.add(state.lastKey);
    pick = fallback;
  }

  return pick;
}

function renderQuestion() {
  if (!state.current) return;

  $("questionMain").textContent = state.current.word;
  $("questionSub").textContent = "Dinlediğin cümlenin doğru Türkçe karşılığını seç";
  $("langDisp").textContent = `${LANGS[state.lang]?.flag || ""} ${LANGS[state.lang]?.name || state.lang}`;
  $("scoreDisp").textContent = state.score;
  $("livesDisp").textContent = "❤️".repeat(state.lives);
  $("momDisp").textContent = `x${state.momentum.toFixed(2)} MOMENTUM`;

  const options = buildOptions();
  $("optionsArea").innerHTML = "";

  options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "opt";
    div.textContent = opt;
    div.onclick = () => checkAnswer(div, opt);
    $("optionsArea").appendChild(div);
  });
}

function buildOptions() {
  if (!state.current) return [];
  const options = [state.current.meaning];

  const poolMeanings = state.pool
    .map(x => x.meaning)
    .filter(x => x && x !== state.current.meaning);

  while (options.length < 4 && poolMeanings.length) {
    const pick = poolMeanings[Math.floor(Math.random() * poolMeanings.length)];
    if (!options.includes(pick)) options.push(pick);
  }

  return [...options].sort(() => Math.random() - 0.5);
}

async function playSignal() {
  if (!state.current || state.playingAudio) return;
  state.playingAudio = true;
  $("listenBtn").classList.add("playing");
  playSignalFx();
  await speak(state.current.sentence || state.current.word, state.lang);
  setTimeout(() => {
    state.playingAudio = false;
    $("listenBtn").classList.remove("playing");
  }, 1000);
}

function updateBest() {
  if (state.score > state.best) {
    state.best = state.score;
    localStorage.setItem("signal_hunt_best", String(state.best));
  }
}

function nextQuestion() {
  if (state.lives <= 0) {
    finishGame();
    return;
  }

  state.current = nextItem();
  if (!state.current) {
    finishGame();
    return;
  }

  renderQuestion();
}

function checkAnswer(el, val) {
  if (!state.current) return;

  Array.from($("optionsArea").children).forEach(x => x.style.pointerEvents = "none");

  if (val === state.current.meaning) {
    el.classList.add("correct");
    state.score += Math.round(100 * state.momentum);
    state.momentum += 0.1;
    playCorrectFx();
    updateBest();
  } else {
    el.classList.add("wrong");
    state.lives--;
    state.momentum = 1.0;

    Array.from($("optionsArea").children).forEach(x => {
      if (x.textContent === state.current.meaning) {
        x.classList.add("correct");
      }
    });

    playWrongFx();
  }

  $("scoreDisp").textContent = state.score;
  $("livesDisp").textContent = "❤️".repeat(state.lives);
  $("momDisp").textContent = `x${state.momentum.toFixed(2)} MOMENTUM`;

  setTimeout(nextQuestion, 1200);
}

function finishGame() {
  $("resultTitle").textContent = "OYUN BİTTİ";
  $("resultStats").textContent =
    `Skor: ${state.score}\nEn yüksek skor: ${state.best}\nDil: ${LANGS[state.lang]?.name || state.lang}`;
  $("resultModal").classList.add("show");
}

async function startGame() {
  const ok = await ensureAuthAndCacheUser();
  if (!ok) {
    location.href = "/pages/login.html";
    return;
  }

  state.lang = state.selectedLang;
  localStorage.setItem(GAME_LANG_KEY, state.lang);

  state.pool = await loadPool(state.lang);
  if (!state.pool.length) {
    alert("Bu dil için havuz bulunamadı.");
    return;
  }

  state.used.clear();
  state.lastKey = "";
  state.score = 0;
  state.lives = 3;
  state.momentum = 1.0;
  state.best = Number(localStorage.getItem("signal_hunt_best") || 0);

  $("startModal").classList.remove("show");
  $("resultModal").classList.remove("show");

  nextQuestion();
}

$("listenBtn").onclick = playSignal;
$("startBtn").onclick = startGame;
$("retryBtn").onclick = () => {
  $("resultModal").classList.remove("show");
  state.used.clear();
  state.lastKey = "";
  state.score = 0;
  state.lives = 3;
  state.momentum = 1.0;
  nextQuestion();
};
$("backBtn").onclick = () => {
  location.href = "/pages/game_menu.html";
};

(function init() {
  renderStartLangs();
})();
</script>
</body>
</html>
