<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • SideToSide</title>
  <meta name="theme-color" content="#120d16"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.64);
      --cardLine:rgba(255,255,255,.12);
      --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      background:#120d16;
      overflow:hidden;
      scrollbar-width:none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar{ display:none; }

    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(251,146,60,.18) 0%, transparent 28%),
        radial-gradient(circle at 20% 18%, rgba(244,114,182,.12) 0%, transparent 25%),
        radial-gradient(circle at 82% 18%, rgba(96,165,250,.10) 0%, transparent 20%),
        linear-gradient(180deg, #1d1016 0%, #150e19 34%, #120d16 100%);
    }

    #pageContent{
      width:100%;
      min-height:100%;
      padding:12px 14px 18px;
      overflow-y:auto;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    #pageContent::-webkit-scrollbar{ display:none; }

    .page{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .hero{
      border-radius:28px;
      border:1px solid var(--cardLine);
      background:
        radial-gradient(circle at 50% 10%, rgba(103,232,249,.12) 0%, transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 18px 32px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.04);
      padding:18px 16px;
      text-align:center;
    }

    .title{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      line-height:1;
      letter-spacing:-.8px;
    }

    .title span{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sub{
      margin:10px auto 0;
      max-width:300px;
      font-size:11px;
      line-height:1.4;
      color:var(--muted);
    }

    .card{
      border-radius:28px;
      border:1px solid var(--cardLine);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
      box-shadow:0 16px 30px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.05);
      padding:16px;
    }

    .qr-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .qr-box{
      width:210px;
      height:210px;
      border-radius:24px;
      background:#fff;
      padding:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 0 24px rgba(255,255,255,.1);
    }

    .qr-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .code{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      letter-spacing:4px;
      text-align:center;
    }

    .mini{
      font-size:11px;
      color:var(--muted);
      text-align:center;
    }

    .input{
      width:100%;
      height:58px;
      background:rgba(0,0,0,.32);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      color:#fff;
      text-align:center;
      font-size:20px;
      font-weight:900;
      letter-spacing:3px;
      text-transform:uppercase;
      padding:0 14px;
    }

    .btn{
      width:100%;
      height:56px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-weight:900;
      font-family:'Outfit',sans-serif;
      font-size:15px;
      transition:transform .16s ease, filter .16s ease;
    }
    .btn:active{ transform:scale(.985); }

    .btn-main{
      background:var(--ai-grad);
      color:#fff;
      box-shadow:0 10px 26px rgba(99,102,241,.28), inset 0 2px 4px rgba(255,255,255,.24);
    }

    .btn-ghost{
      background:rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .row{
      display:flex;
      gap:10px;
    }

    .row > *{ flex:1; }

    .status{
      text-align:center;
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.78);
      min-height:18px;
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="page">

      <section class="hero">
        <h1 class="title">Side<span>To</span>Side</h1>
        <p class="sub">İki kişi kendi telefonundan bağlanır. QR okut, kod gir veya destekleyen cihazlarda NFC ile eşleş.</p>
      </section>

      <section class="card">
        <div class="qr-wrap">
          <div class="qr-box">
            <img id="qrImg" alt="QR Kod">
          </div>

          <div class="code" id="roomCode">------</div>
          <div class="mini">Bu kodu paylaşabilir veya diğer telefondan QR okutabilirsin.</div>
          <div class="status" id="statusText">Oda hazırlanıyor...</div>
        </div>
      </section>

      <section class="card stack">
        <button class="btn btn-main" id="hostEnterBtn">Odayı Aç</button>
        <button class="btn btn-ghost" id="scanQrBtn">QR Okut</button>

        <input class="input" id="codeInput" placeholder="KOD GİR" maxlength="12"/>

        <div class="row">
          <button class="btn btn-ghost" id="joinCodeBtn">Kod ile Gir</button>
          <button class="btn btn-ghost" id="copyBtn">Kodu Kopyala</button>
        </div>

        <button class="btn btn-ghost" id="nfcBtn">NFC ile Bağlan</button>
      </section>

    </div>
  </main>

  <script type="module">
    const API_BASE = "https://italky-api.onrender.com/api";
    const ROOM_KEY = "italky_active_interpreter_room_id";
    const ROOM_LANG_KEY = "italky_active_interpreter_lang";

    const qrImg = document.getElementById("qrImg");
    const roomCode = document.getElementById("roomCode");
    const statusText = document.getElementById("statusText");
    const codeInput = document.getElementById("codeInput");

    const hostEnterBtn = document.getElementById("hostEnterBtn");
    const scanQrBtn = document.getElementById("scanQrBtn");
    const joinCodeBtn = document.getElementById("joinCodeBtn");
    const copyBtn = document.getElementById("copyBtn");
    const nfcBtn = document.getElementById("nfcBtn");

    let activeRoomId = localStorage.getItem(ROOM_KEY) || "";
    let activeLang = localStorage.getItem(ROOM_LANG_KEY) || "tr";

    function setStatus(text){
      statusText.textContent = text || "";
    }

    function buildJoinUrl(roomId){
      const url = new URL("https://italky.ai/open/interpreter");
      url.searchParams.set("room", roomId);
      url.searchParams.set("v", "1");
      return url.toString();
    }

    function qrUrlPrimary(targetUrl){
      return "https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=6&data=" + encodeURIComponent(targetUrl);
    }

    async function createRoom(myLang = "tr"){
      const r = await fetch(`${API_BASE}/interpreter/create-room`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          host_code: "HOME-HOST",
          my_lang: myLang,
          mode: "interpreter"
        })
      });

      const j = await r.json().catch(() => ({}));

      if(!r.ok || !j?.room_id){
        throw new Error(j?.detail || j?.error || "Oda oluşturulamadı");
      }

      return j;
    }

    async function ensureRoom(){
      if(activeRoomId){
        roomCode.textContent = activeRoomId;
        codeInput.value = activeRoomId;
        qrImg.src = qrUrlPrimary(buildJoinUrl(activeRoomId));
        setStatus("Hazır");
        return;
      }

      setStatus("Oda hazırlanıyor...");

      try{
        const created = await createRoom(activeLang);
        activeRoomId = String(created.room_id || "").trim();

        localStorage.setItem(ROOM_KEY, activeRoomId);
        localStorage.setItem(ROOM_LANG_KEY, activeLang);

        roomCode.textContent = activeRoomId;
        codeInput.value = activeRoomId;
        qrImg.src = qrUrlPrimary(buildJoinUrl(activeRoomId));
        setStatus("Hazır");
      }catch(e){
        console.error(e);
        setStatus("Oda hazırlanamadı");
      }
    }

    hostEnterBtn.addEventListener("click", () => {
      if(!activeRoomId) return;
      location.href = `/pages/live_interpreter.html?room=${encodeURIComponent(activeRoomId)}&role=host&my=tr`;
    });

    scanQrBtn.addEventListener("click", () => {
      location.href = "/pages/f2f_join.html";
    });

    joinCodeBtn.addEventListener("click", () => {
      const code = String(codeInput.value || "").trim().toUpperCase();
      if(!code) return;
      location.href = `/pages/live_interpreter.html?room=${encodeURIComponent(code)}&role=guest&my=tr`;
    });

    copyBtn.addEventListener("click", async () => {
      if(!activeRoomId) return;
      try{
        await navigator.clipboard.writeText(activeRoomId);
        setStatus("Kod kopyalandı");
      }catch{}
    });

    nfcBtn.addEventListener("click", async () => {
      if(!("NDEFReader" in window)){
        setStatus("Bu cihazda NFC desteği yok");
        return;
      }

      try{
        const ndef = new NDEFReader();
        await ndef.write(`ITALKY:S2S:${activeRoomId}`);
        setStatus("NFC etiketi hazır. Diğer telefonu yaklaştır.");
      }catch(e){
        console.error(e);
        setStatus("NFC başlatılamadı");
      }
    });

    ensureRoom();
  </script>
</body>
</html>
