<!-- FILE: /pages/sidetoside.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • SideToSide</title>
  <meta name="theme-color" content="#120d16"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.64);
      --cardLine:rgba(255,255,255,.12);
      --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
      --cyan:#67e8f9;
      --pink:#f472b6;
      --footerSafe:var(--footerH, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      background:#120d16;
      overflow:hidden;
      scrollbar-width:none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar{
      display:none;
    }

    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(251,146,60,.18) 0%, transparent 28%),
        radial-gradient(circle at 20% 18%, rgba(244,114,182,.12) 0%, transparent 25%),
        radial-gradient(circle at 82% 18%, rgba(96,165,250,.10) 0%, transparent 20%),
        linear-gradient(180deg, #1d1016 0%, #150e19 34%, #120d16 100%);
    }

    #pageContent{
      width:100%;
      height:calc(100dvh - var(--footerSafe));
      overflow-y:auto;
      padding:12px 14px 20px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }

    #pageContent::-webkit-scrollbar{
      display:none;
    }

    .page{
      min-height:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .hero{
      border-radius:30px;
      border:1px solid var(--cardLine);
      background:
        radial-gradient(circle at 50% 10%, rgba(103,232,249,.12) 0%, transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:
        0 18px 32px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.04);
      padding:18px 16px 16px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .hero::after{
      content:"";
      position:absolute;
      left:-20%;
      top:-30%;
      width:140%;
      height:120%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
      transform:rotate(-8deg);
      pointer-events:none;
    }

    .wave-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:4px;
      margin-bottom:10px;
      height:24px;
    }

    .wave-bar{
      width:4px;
      height:10px;
      border-radius:999px;
      background:var(--ai-grad);
      animation:waveGlow 1.2s infinite ease-in-out;
      box-shadow:0 0 10px rgba(129,140,248,.22);
    }

    .wave-bar:nth-child(2){ animation-delay:.12s; }
    .wave-bar:nth-child(3){ animation-delay:.24s; }
    .wave-bar:nth-child(4){ animation-delay:.36s; }
    .wave-bar:nth-child(5){ animation-delay:.48s; }

    .title{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      line-height:1;
      letter-spacing:-.8px;
      color:#fff;
      text-shadow:0 0 12px rgba(255,255,255,.08);
    }

    .title span{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sub{
      margin:10px auto 0;
      max-width:300px;
      font-size:11px;
      line-height:1.4;
      color:var(--muted);
    }

    .qr-card{
      flex:1;
      min-height:0;
      border-radius:30px;
      border:1px solid var(--cardLine);
      background:
        radial-gradient(circle at 18% 16%, rgba(103,232,249,.16) 0%, transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
      box-shadow:
        0 18px 30px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.05);
      padding:18px 16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      text-align:center;
    }

    .qr-wrap{
      width:220px;
      height:220px;
      border-radius:24px;
      background:#fff;
      padding:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:
        0 0 24px rgba(255,255,255,.10),
        0 0 30px rgba(103,232,249,.10);
      flex:0 0 auto;
    }

    .qr-wrap img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .code{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      letter-spacing:4px;
      color:#fff;
      word-break:break-word;
    }

    .mini{
      margin:0;
      font-size:11px;
      line-height:1.35;
      color:rgba(255,255,255,.84);
      max-width:290px;
    }

    .status{
      min-height:18px;
      margin:0;
      font-size:11px;
      font-weight:800;
      color:rgba(255,255,255,.78);
    }

    @keyframes waveGlow{
      0%,100%{ height:10px; opacity:.34; }
      50%{ height:24px; opacity:1; }
    }

    @media (max-width:390px){
      .title{ font-size:24px; }
      .sub{ font-size:10px; }
      .qr-wrap{
        width:196px;
        height:196px;
      }
      .code{
        font-size:24px;
        letter-spacing:3px;
      }
    }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="page">

      <section class="hero">
        <div class="wave-row">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <h1 class="title">Side<span>To</span>Side</h1>
        <p class="sub">Diğer telefondan QR kodu okut. Bağlantı kurulunca oda otomatik açılacak.</p>
      </section>

      <section class="qr-card">
        <div class="qr-wrap">
          <img id="qrImg" alt="SideToSide QR Kod">
        </div>

        <p class="code" id="roomCode">------</p>
        <p class="mini">QR çalışmazsa bu oda kodunu diğer cihazda kullanabilirsin.</p>
        <p class="status" id="statusText">Oda hazırlanıyor...</p>
      </section>

    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";

    try {
      mountShell({ scroll: "auto" });
    } catch (e) {
      console.warn("[sidetoside shell]", e);
    }
  </script>

  <script type="module">
    const API_BASE = "https://italky-api.onrender.com/api";
    const WS_BASE = "wss://italky-api.onrender.com/api";

    const ROOM_KEY = "italky_active_interpreter_room_id";
    const ROOM_LANG_KEY = "italky_active_interpreter_lang";

    const qrImg = document.getElementById("qrImg");
    const roomCode = document.getElementById("roomCode");
    const statusText = document.getElementById("statusText");

    let activeRoomId = "";
    let previewSocket = null;
    let redirected = false;

    function setStatus(text){
      if(statusText) statusText.textContent = text || "";
    }

    function buildJoinUrl(roomId){
      const url = new URL("https://italky.ai/open/interpreter");
      url.searchParams.set("room", roomId);
      url.searchParams.set("v", "1");
      return url.toString();
    }

    function qrUrlPrimary(targetUrl){
      return `https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=6&data=${encodeURIComponent(targetUrl)}`;
    }

    async function createRoom(myLang = "tr"){
      const r = await fetch(`${API_BASE}/interpreter/create-room`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          host_code: "HOME-HOST",
          my_lang: myLang,
          mode: "interpreter"
        })
      });

      const j = await r.json().catch(() => ({}));

      if(!r.ok || !j?.room_id){
        throw new Error(j?.detail || j?.error || "Oda oluşturulamadı");
      }

      return j;
    }

    function stopPreviewSocket(){
      try{ previewSocket?.close?.(); }catch{}
      previewSocket = null;
    }

    function launchHostRoom(roomId){
      if(!roomId || redirected) return;
      redirected = true;
      location.href = `/pages/live_interpreter.html?room=${encodeURIComponent(roomId)}&role=host&my=tr`;
    }

    function startPreviewSocket(roomId, myLang = "tr"){
      if(!roomId) return;

      stopPreviewSocket();

      const url = `${WS_BASE}/ws/interpreter/${encodeURIComponent(roomId)}?role=host-preview&lang=${encodeURIComponent(myLang)}`;

      try{
        previewSocket = new WebSocket(url);
      }catch(e){
        console.warn("[sidetoside preview ws create]", e);
        return;
      }

      previewSocket.onopen = () => {
        setStatus("QR hazır. Karşı taraf bekleniyor...");
      };

      previewSocket.onmessage = (event) => {
        try{
          const payload = JSON.parse(event.data);
          const type = String(payload?.type || "").trim();

          if(type === "presence"){
            return;
          }

          if(type === "peer_joined"){
            setStatus("Karşı taraf bağlandı. Oda açılıyor...");
            launchHostRoom(roomId);
            return;
          }

          if(type === "error"){
            console.warn("[sidetoside preview ws payload]", payload);
          }
        }catch(e){
          console.warn("[sidetoside preview ws parse]", e);
        }
      };

      previewSocket.onerror = () => {
        setStatus("Bağlantı önizleme hatası");
      };

      previewSocket.onclose = () => {
        if(!redirected){
          setStatus("QR hazır. Karşı taraf bekleniyor...");
        }
      };
    }

    async function ensureRoom(){
      redirected = false;
      setStatus("Oda hazırlanıyor...");

      const cachedRoom = localStorage.getItem(ROOM_KEY) || "";
      const cachedLang = localStorage.getItem(ROOM_LANG_KEY) || "tr";

      try{
        if(cachedRoom){
          activeRoomId = String(cachedRoom).trim();
        }else{
          const created = await createRoom(cachedLang);
          activeRoomId = String(created.room_id || "").trim();
          localStorage.setItem(ROOM_KEY, activeRoomId);
          localStorage.setItem(ROOM_LANG_KEY, cachedLang);
        }

        if(!activeRoomId){
          throw new Error("room_id boş geldi");
        }

        roomCode.textContent = activeRoomId;
        qrImg.src = qrUrlPrimary(buildJoinUrl(activeRoomId));
        startPreviewSocket(activeRoomId, cachedLang);
      }catch(e){
        console.error("[sidetoside room]", e);
        roomCode.textContent = "ROOM-ERR";
        setStatus(e?.message || "Oda hazırlanamadı");
      }
    }

    ensureRoom();

    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible" && !redirected){
        ensureRoom();
      }
    });

    window.addEventListener("focus", () => {
      if(!redirected){
        ensureRoom();
      }
    });

    window.addEventListener("beforeunload", stopPreviewSocket);
  </script>
</body>
</html>
