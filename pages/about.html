<!-- /pages/about.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Hakkımızda</title>

  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07111f;
      --bg2:#0b1d33;
      --navy:#0f2742;
      --blue:#2f80ed;
      --blue2:#38bdf8;
      --ice:#eaf6ff;
      --text:#f8fbff;
      --muted:rgba(248,251,255,.68);
      --soft:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --line2:rgba(56,189,248,.20);
      --card:rgba(10,28,48,.72);
      --grad:linear-gradient(135deg,#dbeafe 0%,#60a5fa 34%,#2563eb 72%,#0f2742 100%);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:'Outfit',sans-serif;
      overflow-x:hidden;
    }

    body{
      background:
        radial-gradient(circle at 16% 0%, rgba(56,189,248,.18), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(37,99,235,.16), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(14,165,233,.10), transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg));
    }

    .bg-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size:42px 42px;
      opacity:.28;
      mask-image:linear-gradient(to bottom, black, transparent 80%);
      -webkit-mask-image:linear-gradient(to bottom, black, transparent 80%);
    }

    .orb{
      position:fixed;
      width:300px;
      height:300px;
      border-radius:50%;
      right:-130px;
      top:70px;
      background:radial-gradient(circle, rgba(56,189,248,.16), transparent 68%);
      filter:blur(8px);
      pointer-events:none;
      z-index:1;
    }

    #pageContent{
      position:relative;
      z-index:10;
      width:100%;
      max-width:520px;
      min-height:100dvh;
      margin:0 auto;
      padding:calc(18px + var(--safe-top)) 16px calc(22px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      min-width:0;
    }

    .brand-main{
      font-family:'Space Grotesk',sans-serif;
      font-size:30px;
      font-weight:900;
      line-height:1;
      letter-spacing:-1px;
    }

    .brand-main .ai{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin-top:7px;
      display:inline-flex;
      padding:6px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(248,251,255,.72);
      font-size:10px;
      font-weight:1000;
      letter-spacing:1.7px;
    }

    .back-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 14px 28px rgba(0,0,0,.18);
    }

    .hero{
      border-radius:30px;
      padding:18px;
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.17), transparent 36%),
        linear-gradient(145deg, rgba(15,39,66,.88), rgba(7,17,31,.82));
      border:1px solid var(--line2);
      box-shadow:0 22px 48px rgba(0,0,0,.26);
      overflow:hidden;
      position:relative;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,.05), transparent);
      pointer-events:none;
    }

    .hero-badge{
      position:relative;
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.11);
      color:#bfdbfe;
      font-size:11px;
      font-weight:1000;
      letter-spacing:.5px;
      margin-bottom:12px;
    }

    h1{
      position:relative;
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:30px;
      line-height:1.08;
      font-weight:900;
      letter-spacing:-1px;
    }

    h1 span{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      position:relative;
      margin:11px 0 0;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
      font-weight:700;
    }

    .content-card{
      border-radius:30px;
      padding:18px;
      background:var(--card);
      border:1px solid var(--line);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:0 24px 54px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.04);
      animation:cardIn .45s ease forwards;
    }

    @keyframes cardIn{
      from{opacity:0; transform:translateY(14px)}
      to{opacity:1; transform:translateY(0)}
    }

    .content-card p{
      margin:0 0 16px;
      color:rgba(248,251,255,.82);
      line-height:1.7;
      font-size:14px;
      font-weight:600;
    }

    .content-card p:last-child{
      margin-bottom:0;
    }

    .feature-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin:0;
    }

    .feature{
      border-radius:22px;
      padding:14px;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.10);
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .feature-icon{
      width:42px;
      height:42px;
      min-width:42px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(56,189,248,.10);
      border:1px solid rgba(56,189,248,.20);
      font-size:21px;
    }

    .feature-title{
      font-size:14px;
      font-weight:1000;
      color:#fff;
      margin-bottom:4px;
    }

    .feature-text{
      font-size:12px;
      line-height:1.5;
      color:rgba(248,251,255,.64);
      font-weight:700;
    }

    .notice{
      border-radius:22px;
      padding:14px;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(248,251,255,.64);
      font-size:12px;
      line-height:1.5;
      font-weight:700;
    }

    @media(max-width:520px){
      #pageContent{
        padding:calc(16px + var(--safe-top)) 14px calc(20px + var(--safe-bottom));
      }

      .brand-main{
        font-size:28px;
      }

      h1{
        font-size:27px;
      }

      .content-card{
        padding:16px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
  <div class="orb"></div>

  <main id="pageContent">
    <div class="topbar">
      <div class="brand">
        <div class="brand-main">italky<span class="ai">AI</span></div>
        <div class="brand-sub">BE FREE</div>
      </div>

      <button id="backBtn" class="back-btn" type="button">‹</button>
    </div>

    <section class="hero" id="heroHost"></section>

    <section class="content-card" id="contentHost"></section>

    <section class="feature-grid" id="featureHost"></section>

    <div class="notice" id="noticeHost"></div>
  </main>

  <template id="hero_tr">
    <div class="hero-badge">Hakkımızda</div>
    <h1>Dil Bariyerini <span>Yeni Nesil</span> Bir Deneyime Dönüştürüyoruz</h1>
    <p>italkyAI; çeviri, konuşma, öğrenme, kültür ve oyunlaştırmayı tek bir yapıda buluşturan yapay zekâ destekli iletişim platformudur.</p>
  </template>

  <template id="hero_en">
    <div class="hero-badge">About Us</div>
    <h1>Turning Language Barriers Into a <span>Next-Generation</span> Experience</h1>
    <p>italkyAI is an AI-powered communication platform that brings translation, speaking, learning, culture, and gamified practice together.</p>
  </template>

  <template id="about_tr">
    <p>italkyAI, yalnızca kelime çeviren klasik bir araç olarak değil, insanın gerçek hayatta iletişim kurma biçimine uyum sağlayan yeni nesil bir platform olarak tasarlandı. Amacımız, kullanıcının konuşurken, yazarken, öğrenirken veya farklı kültürlerle temas ederken dil engeline takılmadan ilerlemesini sağlamak.</p>

    <p>Yeni mimarimizde uygulama herkes için erişilebilir olacak şekilde kurgulanır. Login öncesi bazı alanlar reklam destekli kullanılabilir; giriş yapan ve reklamsız kullanım hakkı bulunan kullanıcılar ise uygulama içinde daha temiz, kesintisiz bir deneyim yaşar. Böylece hem ücretsiz erişim korunur hem de reklamsız kullanım isteyenler için ayrı bir yol açılır.</p>

    <p>Platformun merkezinde anlık çeviri, yüz yüze iletişim, yazıdan çeviri, offline dil paketleri, oyunlarla öğrenme, seviye tespit ve sohbet tabanlı yapay zekâ deneyimi yer alır. Kullanıcı yalnızca çeviri yapmaz; dilini geliştirir, seviyesini ölçer, pratik yapar ve öğrendiklerini günlük kullanımda pekiştirir.</p>

    <p>italkyAI’nin en ayırt edici taraflarından biri kültürel dil yaklaşımıdır. Ataların Dili, Turan Dilleri, Kafkasların Dili, Mezopotamya Dili ve Balkan Dilleri gibi modüllerle sadece kelime karşılıklarını değil; kökleri, coğrafyayı, hafızayı ve aidiyet duygusunu da önemseyen bir yapı kurulmaktadır.</p>

    <p>Bizim için teknoloji, kullanıcıyı yormayan bir yardımcı olmalıdır. italkyAI bu yüzden sade, hızlı ve anlaşılır bir akış üzerine inşa ediliyor. Hedefimiz büyük; hissi ise çok net: İnsan konuşsun, italkyAI aradaki duvarı sessizce kaldırsın.</p>
  </template>

  <template id="about_en">
    <p>italkyAI was designed not as a traditional word-by-word translation tool, but as a next-generation platform that adapts to how people communicate in real life. Our goal is to help users speak, write, learn, and connect with different cultures without being blocked by language barriers.</p>

    <p>With the new architecture, the app is designed to remain accessible to everyone. Some pre-login areas can be used with ad-supported access, while signed-in users with an ad-free plan can enjoy a cleaner and uninterrupted experience inside the app. This keeps free access available while also offering a dedicated path for users who prefer an ad-free experience.</p>

    <p>At the center of the platform are instant translation, face-to-face communication, text translation, offline language packs, learning through games, level detection, and chat-based AI experiences. Users do not only translate; they improve their language, measure their level, practice, and reinforce what they learn in daily use.</p>

    <p>One of the most distinctive sides of italkyAI is its cultural language approach. With modules such as Ancestors’ Language, Turan Languages, Language of the Caucasus, Language of Mesopotamia, and Balkan Languages, the platform aims to value not only words, but also roots, geography, memory, and identity.</p>

    <p>For us, technology should be a helpful companion that does not overwhelm the user. That is why italkyAI is being built around a simple, fast, and understandable flow. The ambition is big, but the feeling is clear: let people speak, and let italkyAI quietly remove the wall in between.</p>
  </template>

  <script>
    const heroHost = document.getElementById("heroHost");
    const contentHost = document.getElementById("contentHost");
    const featureHost = document.getElementById("featureHost");
    const noticeHost = document.getElementById("noticeHost");
    const backBtn = document.getElementById("backBtn");

    const FEATURES = {
      tr:[
        {
          icon:"🌍",
          title:"80+ dilde iletişim",
          text:"Günlük konuşma, yazıdan çeviri ve canlı iletişim akışlarında geniş dil desteği hedeflenir."
        },
        {
          icon:"📶",
          title:"Offline kullanım mantığı",
          text:"İndirilen dil paketleriyle internet olmayan anlarda da temel çeviri deneyimi sunulması amaçlanır."
        },
        {
          icon:"🎮",
          title:"Oyunlarla öğrenme",
          text:"Kelime, cümle, dinleme, hafıza ve refleks temelli oyunlarla öğrenme daha eğlenceli hale gelir."
        },
        {
          icon:"🧭",
          title:"Seviye tespit",
          text:"Kullanıcı seviyesini görerek öğrenmeye daha doğru noktadan başlayabilir."
        },
        {
          icon:"🏛️",
          title:"Kültürel dil modülleri",
          text:"Turan, Kafkas, Mezopotamya, Balkan ve Ataların Dili gibi alanlarla dilin kültürel yönü de korunur."
        },
        {
          icon:"🚫",
          title:"Reklamsız seçenek",
          text:"Reklam destekli erişimin yanında, reklamsız yıllık kullanım için ayrı bir model sunulur."
        }
      ],
      en:[
        {
          icon:"🌍",
          title:"Communication in 80+ languages",
          text:"Broad language support is aimed across daily speech, text translation, and live communication flows."
        },
        {
          icon:"📶",
          title:"Offline usage logic",
          text:"Downloaded language packs are designed to provide essential translation support even without internet."
        },
        {
          icon:"🎮",
          title:"Learning through games",
          text:"Word, sentence, listening, memory, and reflex-based games make learning more engaging."
        },
        {
          icon:"🧭",
          title:"Level detection",
          text:"Users can understand their level and start learning from a more accurate point."
        },
        {
          icon:"🏛️",
          title:"Cultural language modules",
          text:"Turan, Caucasus, Mesopotamia, Balkan, and Ancestors’ Language modules preserve the cultural side of language."
        },
        {
          icon:"🚫",
          title:"Ad-free option",
          text:"Alongside ad-supported access, a separate annual ad-free model is offered."
        }
      ]
    };

    function getLang(){
      const raw =
        localStorage.getItem("site_lang") ||
        localStorage.getItem("italky_site_lang_v1") ||
        navigator.language ||
        "tr";

      const code = String(raw).toLowerCase().slice(0,2);
      return ["tr","en"].includes(code) ? code : "tr";
    }

    function templateId(prefix){
      const lang = getLang();
      return `${prefix}_${lang}`;
    }

    function renderFeatures(lang){
      const items = FEATURES[lang] || FEATURES.tr;

      featureHost.innerHTML = items.map((item) => `
        <article class="feature">
          <div class="feature-icon">${item.icon}</div>
          <div>
            <div class="feature-title">${item.title}</div>
            <div class="feature-text">${item.text}</div>
          </div>
        </article>
      `).join("");
    }

    function render(){
      const lang = getLang();

      heroHost.innerHTML = "";
      contentHost.innerHTML = "";
      noticeHost.innerHTML = "";

      const heroTpl = document.getElementById(templateId("hero")) || document.getElementById("hero_tr");
      const aboutTpl = document.getElementById(templateId("about")) || document.getElementById("about_tr");

      heroHost.appendChild(heroTpl.content.cloneNode(true));
      contentHost.appendChild(aboutTpl.content.cloneNode(true));
      renderFeatures(lang);

      noticeHost.textContent = lang === "en"
        ? "italkyAI is being developed as a practical communication and learning platform. Features, access rules, and module availability may evolve over time."
        : "italkyAI pratik bir iletişim ve öğrenme platformu olarak geliştirilmektedir. Özellikler, erişim kuralları ve modül kapsamları zamanla geliştirilebilir.";

      document.title = lang === "en" ? "italkyAI • About Us" : "italkyAI • Hakkımızda";
    }

    backBtn?.addEventListener("click", () => {
      if(history.length > 1){
        history.back();
        return;
      }

      location.href = "/pages/login.html";
    });

    window.addEventListener("storage", (e) => {
      if(e.key === "italky_site_lang_v1" || e.key === "site_lang"){
        render();
      }
    });

    render();
  </script>
</body>
</html>
