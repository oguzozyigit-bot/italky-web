<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Hakkımızda</title>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon: #00f2ff;
      --pink: #ff007a;
      --ai-grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 50%, #ff007a 100%);
      --bg: #060408;
    }

    /* ✅ GLOBAL AYARLAR */
    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    /* --- CANLI ARKA PLAN (SİZİN STİLİNİZ) --- */
    .bg-layer {
      position: fixed; inset: 0; z-index: 1;
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
        linear-gradient(180deg, #0f0816 0%, #060408 100%);
    }

    .crystal-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      perspective: 1200px; pointer-events: none; z-index: 2;
    }

    .crystal-cage {
      width: 300px; height: 300px;
      transform-style: preserve-3d;
      animation: rotateCrystal 22s linear infinite;
      opacity: 0.15;
    }

    .side {
      position: absolute; inset: 0;
      border: 1px solid var(--neon);
      background: radial-gradient(circle, rgba(0, 242, 255, 0.05), transparent);
    }
    .s1{ transform:rotateY(0deg) translateZ(150px); }
    .s2{ transform:rotateY(90deg) translateZ(150px); }
    .s3{ transform:rotateX(90deg) translateZ(150px); }

    @keyframes rotateCrystal {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(720deg); }
    }

    /* ✅ WRAPPER & SCROLL */
    .wrap {
      position: relative; z-index: 10;
      max-width: 480px; margin: 0 auto;
      height: 100dvh;
      overflow-y: auto; overflow-x: hidden;
      padding: 20px; /* Üst padding'i azalttım */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wrap::-webkit-scrollbar { display: none; }

    /* ✅ TOP NAV (Şeffaf ve Zeminin Üzerinde) */
    .top {
      display: flex; gap: 15px; align-items: center;
      position: sticky; top: 0;
      background: transparent; /* Siyah zemini kaldırdım */
      z-index: 20; padding: 15px 0; margin-bottom: 25px;
    }

    .btn-back {
      background: transparent; border: none; /* Çerçeveyi kaldırdım */
      color: #fff; font-size: 24px; /* Oku büyüttüm */
      font-weight: 900; /* Oku kalınlaştırdım */
      cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px; /* Tıklama alanını korudum */
    }
    .btn-back:hover { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
    .btn-back:active { transform: scale(0.9); }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px; font-weight: 800;
      background: var(--ai-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    /* ✅ İÇERİK KARTI */
    .content-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 30px 24px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: cardIn 0.6s ease-out forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px; font-weight: 800;
      color: var(--neon);
      text-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
      letter-spacing: -0.5px;
    }

    p {
      margin: 0 0 18px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      font-size: 15px; font-weight: 300;
    }

    .foot {
      margin: 40px 0 20px;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 700; font-size: 11px;
      text-align: center; letter-spacing: 1px;
    }
    .foot b { color: #fff; }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
  
  <div class="crystal-wrap">
    <div class="crystal-cage">
      <div class="side s1"></div>
      <div class="side s2"></div>
      <div class="side s3"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="top">
      <button class="btn-back" id="backBtn">←</button>
      <div class="brand">italkyAI</div>
    </div>

    <div id="content" class="content-card">
      </div>

    <div class="foot">italkyAI By <b>Ozyigit's</b> • 2026</div>
  </div>

  <template id="about_tr">
    <h1>Hakkımızda</h1>
    <p>italkyAI, çeviri ve dil öğrenimini tek ekranda birleştiren yapay zekâ destekli bir dil platformudur. Amacımız, dili ezberletmek değil; gerçek hayatta kullanılabilir hâle getirmektir.</p>
    <p>Oyunlar, yüz yüze çeviri ve konuşma desteği sayesinde öğrenme süreci pratik ilerler. Sistem, hızınıza ve seviyenize göre kendini uyarlar.</p>
    <p>Hedef net: Daha hızlı anla, daha rahat konuş. Dil öğrenmek italkyAI ile artık sıkıcı değil.</p>
  </template>

  <template id="about_en">
    <h1>About Us</h1>
    <p>italkyAI is an AI-powered language platform that combines translation and learning in one place. Our goal is real-life language usage, not just memorization.</p>
    <p>With games, face-to-face translation, and voice support, the process is practical. The system adapts to your individual pace.</p>
    <p>Goal: Understand faster, speak comfortably. Learning a language is no longer boring with italkyAI.</p>
  </template>

  <script type="module">
    import { getSiteLang } from "/js/i18n.js";

    function render(){
      const lang = (getSiteLang?.() || "en").toLowerCase();
      const host = document.getElementById("content");
      
      // Template seçimi
      let template = document.getElementById(`about_${lang}`);
      if(!template) template = document.getElementById("about_tr"); // Fallback

      host.innerHTML = "";
      if(template){
        host.appendChild(template.content.cloneNode(true));
      }

      const h1 = host.querySelector("h1");
      document.title = h1 ? `italkyAI • ${h1.textContent}` : "italkyAI";
    }

    render();

    document.getElementById("backBtn").onclick = () => {
      if(history.length > 1) history.back();
      else location.href = "/pages/home.html";
    };

    window.addEventListener("storage", (e) => {
      if(e.key === "italky_site_lang_v1") render();
    });
  </script>
</body>
</html>
