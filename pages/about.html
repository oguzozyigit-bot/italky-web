<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Hakkımızda</title>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon: #00f2ff;
      --pink: #ff007a;
      --ai-grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 50%, #ff007a 100%);
      --bg: #060408;
      --card-bg: rgba(255,255,255,.03);
      --card-br: rgba(255,255,255,.08);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
        linear-gradient(180deg, #0f0816 0%, #060408 100%);
    }

    .crystal-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      pointer-events: none;
      z-index: 2;
    }

    .crystal-cage {
      width: 300px;
      height: 300px;
      transform-style: preserve-3d;
      animation: rotateCrystal 22s linear infinite;
      opacity: 0.15;
    }

    .side {
      position: absolute;
      inset: 0;
      border: 1px solid var(--neon);
      background: radial-gradient(circle, rgba(0, 242, 255, 0.05), transparent);
    }

    .s1{ transform:rotateY(0deg) translateZ(150px); }
    .s2{ transform:rotateY(90deg) translateZ(150px); }
    .s3{ transform:rotateX(90deg) translateZ(150px); }

    @keyframes rotateCrystal {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(720deg); }
    }

    #pageContent{
      position: relative;
      z-index: 10;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 0 6px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--card-br);
      border-radius: 32px;
      padding: 26px 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: cardIn 0.6s ease-out forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 800;
      color: var(--neon);
      text-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
      letter-spacing: -0.5px;
    }

    p {
      margin: 0 0 18px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.65;
      font-size: 15px;
      font-weight: 300;
    }

    p:last-child{
      margin-bottom:0;
    }

    @media (max-width: 520px){
      #pageContent{
        padding: 18px 0 6px;
      }

      .content-card{
        border-radius:28px;
        padding:22px 18px;
      }

      h1{
        font-size:24px;
      }

      p{
        font-size:14px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>

  <div class="crystal-wrap">
    <div class="crystal-cage">
      <div class="side s1"></div>
      <div class="side s2"></div>
      <div class="side s3"></div>
    </div>
  </div>

  <div id="pageContent">
    <div id="content" class="content-card"></div>
  </div>

  <template id="about_tr">
    <h1>Hakkımızda</h1>
    <p>italkyAI, dili sadece çevirmek için değil, gerçekten yaşatmak için geliştirilen yapay zekâ destekli bir iletişim platformudur. Amacımız insanları kalıplarla boğmak değil; konuşurken, yazarken ve öğrenirken dili doğal akışında kolaylaştırmaktır.</p>
    <p>Bu yüzden sistemin içinde sadece klasik çeviri yok. Yüz yüze konuşmaları anlık akıtan modüller, yazıdan çeviri, çevrimdışı kullanım, Sohbet AI, oyunlar ve seviye tespit gibi günlük hayatta işe yarayan alanlar bir araya getirildi. Dil, burada menü menü ezberlenen bir konu değil; yaşayan bir deneyimdir.</p>
    <p>italkyAI’nin en güçlü taraflarından biri de kültürel yaklaşımıdır. Turan Dilleri, Ataların Dili, Kafkasların Dili, Mezopotamya Dili ve Balkanların Dili gibi özel modüllerle yalnızca kelime çevirmeyi değil, kökleri, coğrafyayı ve aidiyet duygusunu da korumayı hedefliyoruz.</p>
    <p>Biz bu yapıyı soğuk bir yazılım gibi değil, kendini sürekli geliştiren bir yapay zekâ modeli gibi düşünüyoruz. Dinleyen, öğrenen, sadeleşen ve zamanla daha doğru yardımcı olan bir sistem kuruyoruz. Hedefimiz büyük ama hissi basit: İnsan konuşsun, italkyAI aradaki duvarı sessizce kaldırsın.</p>
  </template>

  <template id="about_en">
    <h1>About Us</h1>
    <p>italkyAI is an AI-powered communication platform built not only to translate language, but to make it truly usable in real life. Our goal is not to trap people inside rigid patterns, but to make speaking, writing, and learning feel natural and easier.</p>
    <p>That is why the system goes beyond ordinary translation. Live face-to-face flow, text translation, offline use, Chat AI, games, and level detection all come together in one place. Language here is not a dry subject to memorize; it is a living experience.</p>
    <p>One of the strongest sides of italkyAI is its cultural approach. With dedicated modules such as Turan Languages, Ancestors’ Language, Language of the Caucasus, Language of Mesopotamia, and Language of the Balkans, we aim to preserve not only words, but also roots, geography, and identity.</p>
    <p>We see italkyAI not as a cold piece of software, but as an AI model that keeps improving. A system that listens, learns, becomes simpler, and grows into a more useful guide over time. The goal is ambitious, but the feeling is simple: let people speak, and let italkyAI quietly remove the barrier in between.</p>
  </template>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";
    import { getSiteLang } from "/js/i18n.js";

    const { data: { session } } = await supabase.auth.getSession();

    mountShell({
      scroll: "auto",
      publicPage: !session?.user
    });

    function render(){
      const lang = (getSiteLang?.() || localStorage.getItem("site_lang") || "tr").toLowerCase();
      const host = document.getElementById("content");

      let template = document.getElementById(`about_${lang}`);
      if(!template) template = document.getElementById("about_tr");

      host.innerHTML = "";
      if(template){
        host.appendChild(template.content.cloneNode(true));
      }

      const h1 = host.querySelector("h1");
      document.title = h1 ? `italkyAI • ${h1.textContent}` : "italkyAI";
    }

    render();

    window.addEventListener("storage", (e) => {
      if(e.key === "italky_site_lang_v1" || e.key === "site_lang"){
        render();
      }
    });
  </script>
</body>
</html>
