<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>italkyAI</title>
  <meta name="theme-color" content="#02000f"/>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#02000f;
      color:#fff;
      font-family:Arial, sans-serif;
      overflow:hidden;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .wrap{
      text-align:center;
      padding:24px;
    }
    .logo{
      font-size:38px;
      font-weight:900;
      letter-spacing:-1px;
      margin-bottom:12px;
    }
    .logo .ai{
      background:linear-gradient(135deg,#a5b4fc 0%,#6366f1 55%,#ec4899 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .sub{
      font-size:14px;
      color:rgba(255,255,255,.7);
      margin-bottom:18px;
    }
    .dots{
      display:flex;
      justify-content:center;
      gap:8px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#6366f1;
      animation:bounce 1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes bounce{
      0%,100%{ transform:translateY(0); opacity:.5; }
      50%{ transform:translateY(-6px); opacity:1; }
    }
  </style>

  <script>
    (function(){
      function go(){
        try{
          location.replace("/pages/login.html");
        }catch(e){
          location.href = "/pages/login.html";
        }
      }

      window.addEventListener("load", function(){
        setTimeout(go, 300);
      });
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="logo">italky<span class="ai">AI</span></div>
    <div class="sub">Açılıyor...</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
