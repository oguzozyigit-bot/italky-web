<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Friend AI</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#030014;
      --text:rgba(255,255,255,.94);
      --muted:rgba(255,255,255,.58);
      --border:rgba(255,255,255,.10);
      --glass:rgba(255,255,255,.04);
      --ai1:#A5B4FC;
      --ai2:#4F46E5;
      --ai3:#EC4899;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:'Outfit',sans-serif;
      scrollbar-width:none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar{
      display:none;
    }

    body{
      background:
        radial-gradient(circle at 18% 12%, rgba(79,70,229,.18), transparent 26%),
        radial-gradient(circle at 84% 80%, rgba(236,72,153,.12), transparent 22%),
        linear-gradient(180deg, #050217 0%, #030014 100%);
    }

    #pageContent{
      height:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
      padding:
        calc(var(--headerH, 72px) + env(safe-area-inset-top) + 10px)
        12px
        calc(var(--footerH, 88px) + env(safe-area-inset-bottom) + 10px);
    }

    .topMini{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:62px;
      border-radius:22px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(145deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.02) 100%);
      backdrop-filter:blur(16px);
      box-shadow:0 18px 36px rgba(0,0,0,.14);
    }

    .miniLeft{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .miniOrb{
      width:38px;
      height:38px;
      border-radius:50%;
      position:relative;
      background:#000;
      border:2px solid transparent;
      background-image:linear-gradient(#000,#000), linear-gradient(135deg, var(--ai1) 0%, var(--ai2) 55%, var(--ai3) 100%);
      background-origin:border-box;
      background-clip:content-box,border-box;
      flex:0 0 auto;
      box-shadow:0 0 20px rgba(99,102,241,.18);
    }

    .miniTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      line-height:1;
      letter-spacing:-.4px;
      color:#fff;
    }

    .miniTitle .ai{
      background:linear-gradient(135deg, var(--ai1) 0%, var(--ai2) 55%, var(--ai3) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .miniSub{
      margin-top:4px;
      font-size:11px;
      color:rgba(255,255,255,.58);
      font-weight:800;
    }

    .miniRight{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .toolBtn{
      width:40px;
      height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      flex:0 0 auto;
    }

    .toolBtn.textBtn{
      width:auto;
      min-width:74px;
      padding:0 14px;
      font-size:12px;
      font-weight:900;
    }

    .toolBtn svg{
      width:18px;
      height:18px;
      stroke:rgba(255,255,255,.88);
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .toolBtn.muted{
      border-color:rgba(236,72,153,.25);
      background:rgba(236,72,153,.10);
    }

    .chatCard{
      flex:1 1 auto;
      min-height:0;
      border-radius:26px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.02) 100%);
      backdrop-filter:blur(16px);
      overflow:hidden;
      box-shadow:0 22px 40px rgba(0,0,0,.14);
    }

    #chat{
      height:100%;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      touch-action:pan-y;
      scrollbar-width:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:14px 12px;
    }

    #chat::-webkit-scrollbar{ display:none; }
    #chat::before{ content:""; flex:1 0 auto; }

    .bubble{
      max-width:86%;
      padding:11px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(8px);
      box-shadow:0 10px 22px rgba(0,0,0,.16);
      white-space:pre-wrap;
      word-break:break-word;
      font-size:14px;
      line-height:1.5;
    }

    .bubble.bot{
      align-self:flex-start;
      background:rgba(79,70,229,.12);
      border-left:4px solid var(--ai2);
    }

    .bubble.user{
      align-self:flex-end;
      background:rgba(236,72,153,.12);
      border-right:4px solid var(--ai3);
      text-align:right;
    }

    .bubble.meta{
      align-self:center;
      max-width:92%;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.70);
      font-size:12px;
      font-weight:800;
      text-align:center;
    }

    .bubbleRow{
      display:flex;
      align-items:flex-end;
      gap:8px;
    }

    .bubbleText{
      flex:1 1 auto;
      min-width:0;
    }

    .spkIcon{
      width:29px;
      height:29px;
      min-width:29px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      cursor:pointer;
      flex:0 0 auto;
    }

    .spkIcon svg{
      width:15px;
      height:15px;
      stroke:rgba(255,255,255,.88);
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .dock{
      flex:0 0 auto;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.24);
      padding:8px;
      backdrop-filter:blur(16px);
      box-shadow:0 16px 34px rgba(0,0,0,.14);
    }

    .dockInner{
      display:flex;
      align-items:flex-end;
      gap:8px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      padding:8px;
    }

    #msgInput{
      flex:1 1 auto;
      min-width:0;
      background:transparent;
      border:none;
      color:#fff;
      font-size:14px;
      padding:10px 6px;
      line-height:18px;
      font-family:inherit;
      resize:none;
      white-space:normal;
      overflow:hidden;
      max-height:120px;
    }

    #msgInput::placeholder{
      color:rgba(255,255,255,.42);
    }

    .iconBtn,.sendBtn{
      width:44px;
      height:44px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.24);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      flex-shrink:0;
    }

    .iconBtn svg,.sendBtn svg{
      width:21px;
      height:21px;
      stroke:rgba(255,255,255,.88);
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .iconBtn.listening{
      border-color:rgba(79,70,229,.45);
      background:rgba(79,70,229,.16);
      box-shadow:0 0 18px rgba(79,70,229,.20);
      position:relative;
    }

    .iconBtn.listening::after{
      content:"";
      position:absolute;
      inset:-7px;
      border-radius:18px;
      border:2px solid rgba(165,180,252,.55);
      animation:micPulse 1.15s ease-in-out infinite;
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.75; }
      50%{ transform:scale(1.08); opacity:.28; }
      100%{ transform:scale(.92); opacity:.75; }
    }

    .sendBtn{
      border-color:rgba(107,114,128,.28);
      background:rgba(107,114,128,.16);
      box-shadow:0 10px 18px rgba(0,0,0,.26);
    }

    .sendBtn svg{
      stroke:rgba(165,180,252,.95);
    }
  </style>
</head>

<body>
  <div id="pageContent">

    <div class="topMini">
      <div class="miniLeft">
        <div class="miniOrb"></div>
        <div>
          <div class="miniTitle">Friend <span class="ai">AI</span></div>
          <div class="miniSub">Yaz, konuş, dinle.</div>
        </div>
      </div>

      <div class="miniRight">
        <button class="toolBtn" id="muteBtn" type="button" aria-label="Sesi Aç/Kapat" title="Sesi Aç/Kapat">
          <svg id="muteIcon" viewBox="0 0 24 24">
            <path d="M3 10v4h4l5 4V6L7 10H3"></path>
            <path d="M16 8a4 4 0 0 1 0 8"></path>
            <path d="M19 5a8 8 0 0 1 0 14"></path>
          </svg>
        </button>

        <button class="toolBtn textBtn" id="clearChat" type="button">Temizle</button>
      </div>
    </div>

    <div class="chatCard">
      <div id="chat"></div>
    </div>

    <div class="dock">
      <div class="dockInner">
        <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş..." spellcheck="false"></textarea>

        <button class="iconBtn" id="micBtn" aria-label="Mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <button class="sendBtn" id="sendBtn" aria-label="Gönder">
          <svg viewBox="0 0 24 24">
            <path d="M22 2L11 13"></path>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="/js/italky_chat_page.js?v=5"></script>
</body>
</html>
