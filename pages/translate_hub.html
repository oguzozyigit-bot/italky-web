<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>italkyAI Translate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{position:fixed;inset:0}
.stage{position:fixed;inset:0;overflow:hidden;background:#06111d;isolation:isolate}
.panel{position:absolute;inset:0;overflow:hidden;user-select:none;cursor:pointer;outline:none;touch-action:manipulation;background:#07131f}
.panel video{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;pointer-events:none}
.face{z-index:2;clip-path:polygon(0 0,100% 0,0 100%)}
.talk{z-index:1;clip-path:polygon(100% 0,100% 100%,0 100%)}
.face video{filter:brightness(.66) saturate(1.14) contrast(1.05);object-position:42% center}
.talk video{filter:brightness(.64) saturate(1.12) contrast(1.06);object-position:58% center}
.shade{position:absolute;inset:0;pointer-events:none}
.face .shade{background:linear-gradient(135deg,rgba(3,18,28,.22) 0%,rgba(3,12,20,.34) 52%,rgba(3,9,16,.58) 100%)}
.talk .shade{background:linear-gradient(315deg,rgba(17,9,31,.18) 0%,rgba(7,12,24,.30) 52%,rgba(3,9,16,.56) 100%)}
.copy{position:absolute;z-index:4;text-shadow:0 3px 22px rgba(0,0,0,.84);pointer-events:none}
.face .copy{left:clamp(22px,7vw,76px);top:11%;max-width:72vw;text-align:left}
.talk .copy{right:clamp(22px,7vw,76px);bottom:10%;max-width:72vw;text-align:right}
.kicker{font-size:10px;font-weight:900;letter-spacing:.20em;opacity:.88;margin-bottom:10px}
h1{margin:0;font-size:clamp(42px,9vw,88px);line-height:.9;letter-spacing:-.06em;font-weight:950}
p{margin:10px 0 0;font-size:clamp(14px,2.4vw,20px);font-weight:800;color:rgba(255,255,255,.94)}
.hint{margin-top:14px;font-size:11px;font-weight:850;letter-spacing:.02em;color:rgba(255,255,255,.72)}
.panel.tap-one .copy{animation:tapPulse .28s ease}
@keyframes tapPulse{50%{transform:scale(1.025);opacity:.82}}
@media(max-width:600px){.face .copy{left:22px;top:10.5%;max-width:78vw}.talk .copy{right:22px;bottom:9.5%;max-width:78vw}h1{font-size:46px}p{font-size:14px}.hint{font-size:10px}}
</style>
</head>
<body>
<main class="stage">
  <section class="panel face" id="face" role="button" tabindex="0" aria-label="FaceToFace, açmak için iki kez dokun">
    <video muted autoplay loop playsinline preload="auto">
      <source src="https://www.icany.ai/brand/strips/night-move.mp4" type="video/mp4">
    </video>
    <span class="shade"></span>
    <div class="copy">
      <div class="kicker">YÜZ YÜZE · TEK TELEFON</div>
      <h1>FaceToFace</h1>
      <p>Yüz Yüze Çeviri</p>
      <div class="hint">Açmak için çift dokun</div>
    </div>
  </section>

  <section class="panel talk" id="talk" role="button" tabindex="0" aria-label="iTalky, açmak için iki kez dokun">
    <video muted autoplay loop playsinline preload="auto">
      <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" type="video/mp4">
    </video>
    <span class="shade"></span>
    <div class="copy">
      <div class="kicker">UZAKTAN · İKİ TELEFON</div>
      <h1>iTalky</h1>
      <p>Kendi dilinde konuş</p>
      <div class="hint">Açmak için çift dokun</div>
    </div>
  </section>
</main>
<script>
(()=>{
  const face=document.getElementById('face');
  const talk=document.getElementById('talk');
  function open(url){ location.href=url; }
  function bind(panel,url){
    let lastTap=0;
    let flashTimer=null;
    panel.addEventListener('pointerup',(event)=>{
      if(event.pointerType==='mouse') return;
      const now=Date.now();
      if(now-lastTap<=360){
        lastTap=0;
        clearTimeout(flashTimer);
        open(url);
        return;
      }
      lastTap=now;
      panel.classList.remove('tap-one');
      void panel.offsetWidth;
      panel.classList.add('tap-one');
      clearTimeout(flashTimer);
      flashTimer=setTimeout(()=>panel.classList.remove('tap-one'),380);
    });
    panel.addEventListener('dblclick',(event)=>{
      event.preventDefault();
      open(url);
    });
    panel.addEventListener('keydown',(event)=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();open(url);}
    });
  }
  bind(face,'/yeni_yuzyuze.html');
  bind(talk,'/pages/italky_messenger.html');
})();
</script>
</body>
</html>
