<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>italkyAI Translate</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070f;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}.stage{position:fixed;inset:0;overflow:hidden;background:#05070f}.panel{position:absolute;inset:0;border:0;padding:0;color:#fff;text-align:left;overflow:hidden;background:#05070f;transition:clip-path .62s cubic-bezier(.2,.85,.2,1),transform .62s cubic-bezier(.2,.85,.2,1),opacity .42s ease}.panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(1.08);pointer-events:none}.face{z-index:2;clip-path:polygon(0 0,100% 0,0 100%)}.talk{z-index:1;clip-path:polygon(100% 0,100% 100%,0 100%)}.shade{position:absolute;inset:0}.face .shade{background:linear-gradient(135deg,rgba(2,13,20,.35),rgba(6,12,22,.62) 52%,rgba(6,9,18,.86))}.talk .shade{background:linear-gradient(315deg,rgba(20,6,28,.35),rgba(10,8,24,.62) 52%,rgba(4,8,17,.86))}.copy{position:absolute;z-index:4;text-shadow:0 3px 20px #000}.face .copy{left:7vw;top:13%;max-width:68vw}.talk .copy{right:7vw;bottom:12%;max-width:68vw;text-align:right}.kicker{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.82;margin-bottom:9px}h1{margin:0;font-size:clamp(42px,9vw,88px);line-height:.88;letter-spacing:-.06em;font-weight:950}p{margin:10px 0 0;font-size:clamp(14px,2.4vw,20px);font-weight:750;color:rgba(255,255,255,.88)}.hint{margin-top:15px;font-size:12px;font-weight:850;opacity:.8}.divider{position:absolute;z-index:9;left:0;top:0;width:141.5%;height:1.5px;transform:rotate(45deg);transform-origin:0 0;background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(130,220,255,.5),rgba(255,255,255,.15));box-shadow:0 0 18px rgba(130,220,255,.35);pointer-events:none;transition:opacity .25s}.stage.select-face .face,.stage.select-talk .talk{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);z-index:5}.stage.select-face .talk{transform:translate(30%,30%);opacity:0}.stage.select-talk .face{transform:translate(-30%,-30%);opacity:0}.stage.select-face .divider,.stage.select-talk .divider{opacity:0}.stage.selected .copy{transition:transform .45s ease,opacity .45s ease}.stage.selected .copy{transform:scale(1.03)}.stage.removed .panel:not(.winner),.stage.removed .divider{display:none}.winner{clip-path:none!important;transform:none!important;opacity:1!important;z-index:6!important}.winner video{filter:brightness(.62) saturate(1.1)}@media(max-width:600px){.face .copy{left:20px;top:12%;max-width:76vw}.talk .copy{right:20px;bottom:11%;max-width:76vw}h1{font-size:46px}p{font-size:14px}}</style></head><body><main class="stage" id="stage"><section class="panel face" id="face"><video muted autoplay playsinline preload="metadata"><source src="https://www.icany.ai/brand/strips/night-move.mp4" type="video/mp4"></video><span class="shade"></span><div class="copy"><div class="kicker">YÜZ YÜZE · TEK TELEFON</div><h1>FaceToFace</h1><p>Yüz Yüze Çeviri</p><div class="hint">Kaydırarak aç</div></div></section><section class="panel talk" id="talk"><video muted autoplay playsinline preload="metadata"><source src="https://www.icany.ai/brand/strips/night-move.mp4" type="video/mp4"></video><span class="shade"></span><div class="copy"><div class="kicker">UZAKTAN · İKİ TELEFON</div><h1>iTalky</h1><p>Kendi dilinde konuş</p><div class="hint">Kaydırarak aç</div></div></section><div class="divider"></div></main><script>(()=>{const stage=document.getElementById('stage'),face=document.getElementById('face'),talk=document.getElementById('talk');let sx=0,sy=0,active=null,done=false;function side(x,y){return y>=x?'talk':'face'}function select(which){if(done)return;done=true;const winner=which==='face'?face:talk,loser=which==='face'?talk:face;stage.classList.add('selected','select-'+which);winner.classList.add('winner');setTimeout(()=>{loser.remove();stage.classList.add('removed');const v=winner.querySelector('video');v.loop=true;v.currentTime=0;v.play().catch(()=>{});},650)}stage.addEventListener('pointerdown',e=>{if(done)return;sx=e.clientX;sy=e.clientY;active=side(sx,sy);stage.setPointerCapture?.(e.pointerId)});stage.addEventListener('pointerup',e=>{if(done||!active)return;const dx=e.clientX-sx,dy=e.clientY-sy,dist=Math.hypot(dx,dy);if(dist>=45)select(active);active=null});stage.addEventListener('pointercancel',()=>active=null);face.addEventListener('dblclick',()=>select('face'));talk.addEventListener('dblclick',()=>select('talk'));})();</script></body></html>
