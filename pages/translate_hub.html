<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Translate | italkyAI</title>
<meta name="theme-color" content="#05070f">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0;color:#fff}
.stage{position:fixed;inset:0;overflow:hidden;background:#05070f}
.panel{position:absolute;inset:0;border:0;padding:0;margin:0;overflow:hidden;cursor:pointer;color:white;text-align:left;background:#05070f}
.panel video{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .45s ease;will-change:transform}
.panel:active video,.panel:hover video{transform:scale(1.035)}
.face{clip-path:polygon(0 0,100% 0,100% 43%,0 61%);z-index:2}
.call{clip-path:polygon(0 61%,100% 43%,100% 100%,0 100%);z-index:1}
.face video{object-position:center 42%;filter:saturate(1.12) contrast(1.05) brightness(.72) hue-rotate(-5deg)}
.call video{object-position:center 58%;filter:saturate(1.05) contrast(1.08) brightness(.54) hue-rotate(18deg)}
.tint{position:absolute;inset:0;pointer-events:none}
.face .tint{background:linear-gradient(90deg,rgba(3,12,20,.82) 0%,rgba(3,12,20,.34) 52%,rgba(5,8,16,.16) 100%),radial-gradient(circle at 82% 20%,rgba(58,218,255,.26),transparent 32%)}
.call .tint{background:linear-gradient(90deg,rgba(7,6,20,.88) 0%,rgba(10,7,24,.48) 58%,rgba(4,8,14,.18) 100%),radial-gradient(circle at 76% 78%,rgba(145,94,255,.30),transparent 34%)}
.copy{position:absolute;z-index:5;left:clamp(22px,6vw,76px);max-width:min(70vw,700px);text-shadow:0 3px 20px rgba(0,0,0,.65)}
.face .copy{top:12vh}
.call .copy{bottom:10vh}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#b9f6ff;margin-bottom:10px}
.call .kicker{color:#e0c7ff}
.dot{width:7px;height:7px;border-radius:50%;background:#6cecff;box-shadow:0 0 18px #6cecff}
.call .dot{background:#b491ff;box-shadow:0 0 18px #b491ff}
h1{margin:0;font-size:clamp(38px,8.5vw,88px);line-height:.88;letter-spacing:-.065em;font-weight:950}
p{margin:10px 0 0;font-size:clamp(14px,2.2vw,20px);font-weight:750;color:rgba(255,255,255,.88)}
.action{display:inline-flex;align-items:center;gap:10px;margin-top:15px;font-size:12px;font-weight:900;color:#fff}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.11);backdrop-filter:blur(10px);transition:transform .2s ease,background .2s ease}
.panel:hover .arrow{transform:translateX(5px);background:rgba(255,255,255,.18)}
.divider{position:absolute;left:-8%;top:50%;width:116%;height:2px;z-index:10;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78) 18%,rgba(255,255,255,.34) 70%,transparent);transform:rotate(-10.2deg);transform-origin:center;box-shadow:0 0 20px rgba(120,220,255,.28);pointer-events:none}
.brand{position:absolute;z-index:12;right:18px;top:calc(16px + env(safe-area-inset-top));font-size:15px;font-weight:900;letter-spacing:-.4px;color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.brand b{background:linear-gradient(135deg,#8bd3ff,#7c5cff 48%,#ff66c4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@media(max-width:600px){
  .face{clip-path:polygon(0 0,100% 0,100% 45%,0 59%)}
  .call{clip-path:polygon(0 59%,100% 45%,100% 100%,0 100%)}
  .divider{transform:rotate(-8deg)}
  .copy{left:20px;max-width:78vw}
  .face .copy{top:13vh}
  .call .copy{bottom:11vh}
  h1{font-size:43px}
  p{font-size:14px}
}
</style>
</head>
<body>
<div class="stage">
  <button class="panel face" id="faceToFace" type="button" aria-label="FaceToFace Yüzyüze Çeviri Tek Telefon">
    <video muted autoplay loop playsinline preload="metadata" poster="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1800&q=80">
      <source src="https://www.icany.ai/brand/strips/night-move.mp4" type="video/mp4">
    </video>
    <span class="tint"></span>
    <div class="copy">
      <div class="kicker"><span class="dot"></span>TEK TELEFON · YAN YANA</div>
      <h1>FaceToFace</h1>
      <p>Yüzyüze Çeviri · Tek Telefon</p>
      <div class="action">Başla <span class="arrow">→</span></div>
    </div>
  </button>

  <button class="panel call" id="callTranslate" type="button" aria-label="Call Translate Uzak Çeviri İki Telefon">
    <video muted autoplay loop playsinline preload="metadata" poster="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=80">
      <source src="https://www.icany.ai/brand/strips/night-move.mp4" type="video/mp4">
    </video>
    <span class="tint"></span>
    <div class="copy">
      <div class="kicker"><span class="dot"></span>İKİ TELEFON · UZAKTAN</div>
      <h1>Call Translate</h1>
      <p>Uzak Çeviri · 2 Telefon</p>
      <div class="action">Bağlan <span class="arrow">→</span></div>
    </div>
  </button>

  <div class="divider"></div>
  <div class="brand">italky<b>AI</b></div>
</div>
<script>
document.getElementById('faceToFace').addEventListener('click',()=>location.href='/yeni_yuzyuze.html');
document.getElementById('callTranslate').addEventListener('click',()=>location.href='/pages/italky_messenger.html');
</script>
</body>
</html>
