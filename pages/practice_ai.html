<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • AI ile Pratik</title>

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass-border: rgba(255, 255, 255, 0.1);
      --bg-dark: #02000f;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700&display=swap');

    html, body { 
      background: var(--bg-dark) !important; margin: 0; padding: 0; 
      height: 100vh; width: 100vw; overflow: hidden; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #pageContent {
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      padding: 10px 15px; /* Alt/Üst bar arası tam sığdırma */
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 0%, rgba(57, 255, 20, 0.08), transparent 50%);
      opacity: 0; transition: opacity 0.4s ease;
    }
    #pageContent.ui-ready { opacity: 1; }

    .wrap { height: 100%; display: flex; flex-direction: column; gap: 12px; }

    /* 🎙️ Hero Alanı: Ses Odaklı & Kompakt */
    .hero {
      flex: 0 0 auto;
      padding: 15px; border-radius: 22px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .hero h1 { font-size: 18px; font-weight: 800; color: #fff; margin: 0; display: flex; gap: 8px; }
    .hero h1 .ai { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin: 6px 0 0; line-height: 1.4; }

    /* 🚀 Dil Listesi: Tam Sığdırma */
    .list { 
      flex: 1; 
      display: flex; flex-direction: column; 
      gap: 8px; 
      justify-content: space-evenly; /* Butonları dikeyde eşit yayar */
      min-height: 0;
    }

    .langCard {
      flex: 1; 
      max-height: 75px; 
      width: 100%; border-radius: 20px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02); 
      padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
      position: relative; overflow: hidden;
    }

    .langCard:active { transform: scale(0.97) translateY(2px); background: rgba(255,255,255,0.06); }

    /* Ses Dalgası Efekti (Arka Plan) */
    .langCard::after {
      content: ""; position: absolute; right: -20px; top: 0; width: 100px; height: 100%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08), transparent 70%);
      filter: blur(20px);
    }

    .left { display: flex; align-items: center; gap: 12px; z-index: 5; }

    /* Nöral Çekirdek: Yeşil Enerji (Pratik Modu) */
    .flagRing {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg, #00d2ff, #39ff14); /* Pratik teması: Mavi-Yeşil */
      padding: 2px;
      animation: rotateRing 12s linear infinite;
    }
    .flagBox {
      width: 100%; height: 100%; border-radius: 12px;
      background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .txt .name { font-size: 16px; font-weight: 800; color: #fff; display: block; }
    .txt .sub { font-size: 10px; color: rgba(255, 255, 255, 0.4); font-weight: 600; text-transform: uppercase; }
    .txt .sub.ok { color: #39ff14; filter: drop-shadow(0 0 5px rgba(57, 255, 20, 0.3)); }
    .txt .sub.warn { color: #f97316; }

    .right { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 10px; font-weight: 900; color: #fff;
      padding: 4px 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
    }
    .chev { color: rgba(255, 255, 255, 0.2); font-size: 18px; }

    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="wrap">
      <section class="hero">
        <div class="heroTop">
          <h1 class="hTitle">AI ile <span class="ai">Pratik</span></h1>
          <div class="pill">Canlı Seans</div>
        </div>
        <p>Dil reflekslerini geliştirmek için bir konuşma odası seç.</p>
      </section>

      <section class="list" id="list"></section>
    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"none" });
    document.getElementById("pageContent").classList.add("ui-ready");

    const list = document.getElementById("list");

    const LANGS = [
      { code:"en", name:"English",  flag:"🇬🇧", teacher:"dora"   },
      { code:"de", name:"German",   flag:"🇩🇪", teacher:"ayda"   },
      { code:"fr", name:"French",   flag:"🇫🇷", teacher:"jale"   },
      { code:"it", name:"Italian",  flag:"🇮🇹", teacher:"sencer" },
      { code:"ru", name:"Russian",  flag:"🇷🇺", teacher:"sungur" },
      { code:"es", name:"Spanish",  flag:"🇪🇸", teacher:"ozan"   },
    ];

    async function init() {
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session) return;
      
      const { data: prof } = await supabase.from("profiles").select("levels").eq("id", session.user.id).maybeSingle();
      const levels = prof?.levels || {};

      list.innerHTML = LANGS.map(l => {
        const lv = levels[l.code] || "";
        const subTxt = lv ? `Seviye: ${lv} • Bağlan` : "Sınav Gerekli";
        return `
          <button class="langCard" onclick="window.goNext('${l.code}', '${l.teacher}', '${lv}')">
            <div class="left">
              <div class="flagRing"><div class="flagBox">${l.flag}</div></div>
              <div class="txt">
                <span class="name">${l.name}</span>
                <span class="sub ${lv ? 'ok' : 'warn'}">${subTxt}</span>
              </div>
            </div>
            <div class="right">
              <div class="badge">${l.code.toUpperCase()}</div>
              <div class="chev">›</div>
            </div>
          </button>
        `;
      }).join("");
    }

    window.goNext = (code, teacher, lv) => {
      if(!lv) {
        location.href = `/pages/level_required.html?lang=${code}&t=${teacher}&next=practice_ai`;
      } else {
        location.href = `/pages/practice_ai_session.html?lang=${code}&t=${teacher}&level=${lv}`;
      }
    };

    init();
  </script>
</body>
</html>
