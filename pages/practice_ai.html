<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Practice AI</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05070d;
      --bg2:#09101b;
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --soft:rgba(255,255,255,.48);
      --line:rgba(255,255,255,.12);
      --c1:#67e8f9;
      --c2:#60a5fa;
      --c3:#34d399;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shellLift:0px;
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit,system-ui,sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 12% 10%, rgba(103,232,249,.10), transparent 20%),
        radial-gradient(circle at 88% 8%, rgba(96,165,250,.11), transparent 20%),
        radial-gradient(circle at 50% 100%, rgba(52,211,153,.09), transparent 22%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }

    #pageContent{
      height:100%;
      overflow:hidden;
      padding:10px 10px calc(10px + var(--safe-bottom) + var(--shellLift)) 10px;
    }

    .page{
      width:100%;
      max-width:480px;
      height:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    .hero{
      flex:1;
      border:1px solid var(--line);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      padding:18px 14px 18px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
    }

    .hero::before{
      content:"";
      position:absolute;
      right:-70px;
      top:-70px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(103,232,249,.16), transparent 70%);
      filter:blur(10px);
      pointer-events:none;
    }

    .top{
      width:100%;
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:8px;
      z-index:2;
    }

    .title{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:26px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    .status{
      min-height:18px;
      font-size:12px;
      font-weight:800;
      color:var(--soft);
      text-align:center;
    }

    .center{
      flex:1;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      z-index:2;
    }

    .orb-wrap{
      position:relative;
      width:230px;
      height:230px;
      display:grid;
      place-items:center;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 30% 30%, rgba(103,232,249,.18), transparent 30%),
        radial-gradient(circle at 70% 65%, rgba(96,165,250,.16), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(52,211,153,.10), transparent 45%);
      animation:spin 16s linear infinite;
    }

    .ring.r2{
      inset:16px;
      animation-direction:reverse;
      animation-duration:11s;
      opacity:.92;
    }

    .ring.r3{
      inset:34px;
      animation-duration:20s;
      opacity:.76;
    }

    .orb{
      position:relative;
      width:124px;
      height:124px;
      border-radius:50%;
      background:
        radial-gradient(circle at 28% 28%, rgba(255,255,255,.95), rgba(255,255,255,.14) 18%, rgba(103,232,249,.38) 42%, rgba(96,165,250,.26) 62%, rgba(52,211,153,.14) 82%, rgba(255,255,255,.04) 100%);
      box-shadow:
        0 0 34px rgba(103,232,249,.26),
        0 0 84px rgba(96,165,250,.18),
        inset 0 0 24px rgba(255,255,255,.18);
      animation:idleBreath 3.8s ease-in-out infinite;
    }

    .orb.speaking{
      animation:talkBreath 1.15s ease-in-out infinite;
    }

    .orb.listening{
      animation:listenBreath 1s ease-in-out infinite;
    }

    .caption{
      min-height:18px;
      font-size:13px;
      font-weight:900;
      color:var(--soft);
      text-align:center;
    }

    .subtitle-wrap{
      width:100%;
      min-height:110px;
      max-height:140px;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 10px;
      mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 78%, transparent 100%);
      -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 78%, transparent 100%);
    }

    .subtitle-stream{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      transform:translateY(0);
      transition:transform .55s ease;
    }

    .ai-sub-line{
      width:100%;
      text-align:center;
      font-size:15px;
      line-height:1.55;
      color:#fff;
      font-weight:700;
      opacity:.92;
      padding:0 4px;
    }

    .bottom{
      width:100%;
      display:flex;
      justify-content:center;
      z-index:2;
    }

    .mic-btn{
      width:92px;
      height:92px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(135deg, rgba(103,232,249,.18), rgba(96,165,250,.16));
      color:#fff;
      font-size:30px;
      font-weight:900;
      cursor:pointer;
      box-shadow:
        0 16px 30px rgba(0,0,0,.22),
        0 0 24px rgba(103,232,249,.14);
      transition:transform .14s ease, box-shadow .14s ease;
    }

    .mic-btn:active{ transform:scale(.985); }

    .mic-btn.listening{
      background:linear-gradient(135deg, rgba(52,211,153,.28), rgba(103,232,249,.18));
      box-shadow:
        0 16px 30px rgba(0,0,0,.22),
        0 0 34px rgba(52,211,153,.24);
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    @keyframes idleBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }

    @keyframes talkBreath{
      0%,100%{transform:scale(1)}
      25%{transform:scale(1.04)}
      50%{transform:scale(1.09)}
      75%{transform:scale(1.04)}
    }

    @keyframes listenBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.07)}
    }
  </style>
</head>
<body>
  <div id="pageContent">
    <div class="page">
      <section class="hero">
        <div class="top">
          <h1 class="title">Practice AI</h1>
          <div class="status" id="statusLine">Seçili dilde konuşmaya başla.</div>
        </div>

        <div class="center">
          <div class="orb-wrap">
            <div class="ring"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="orb" id="aiOrb"></div>
          </div>

          <div class="caption" id="aiCaption">Hazır</div>

          <div class="subtitle-wrap">
            <div class="subtitle-stream" id="subtitleStream">
              <div class="ai-sub-line">Türkçe açıklama burada yukarı doğru akar.</div>
            </div>
          </div>
        </div>

        <div class="bottom">
          <button class="mic-btn" id="micBtn">🎙️</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="/js/practice_ai_page.js"></script>
</body>
</html>
