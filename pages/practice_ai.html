<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Practice AI</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05070d;
      --bg2:#09101b;
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --soft:rgba(255,255,255,.48);
      --line:rgba(255,255,255,.12);
      --c1:#67e8f9;
      --c2:#60a5fa;
      --c3:#34d399;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shellLift:0px;
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit,system-ui,sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 12% 10%, rgba(103,232,249,.08), transparent 20%),
        radial-gradient(circle at 88% 8%, rgba(96,165,250,.09), transparent 20%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }

    #pageContent{
      height:100%;
      overflow:hidden;
      opacity:0;
      transition:opacity .2s ease;
      padding:10px 10px calc(10px + var(--safe-bottom) + var(--shellLift)) 10px;
    }

    #pageContent.ready{
      opacity:1;
    }

    .page{
      width:100%;
      max-width:480px;
      height:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    .hero{
      flex:1;
      border:1px solid var(--line);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      padding:18px 14px 18px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      min-height:0;
    }

    .hero::before{
      content:"";
      position:absolute;
      right:-70px;
      top:-70px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(103,232,249,.16), transparent 70%);
      filter:blur(10px);
      pointer-events:none;
    }

    .top{
      width:100%;
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:6px;
      z-index:2;
    }

    .title-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .title{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:24px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    .lang-badge{
      min-width:34px;
      height:34px;
      padding:0 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:#fff;
      font-size:18px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
      line-height:1;
    }

    .status{
      min-height:16px;
      font-size:11px;
      font-weight:700;
      color:var(--soft);
      text-align:center;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .center{
      flex:1;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:15px;
      z-index:2;
      position:relative;
      min-height:0;
    }

    .world-wrap{
      position:relative;
      width:220px;
      height:220px;
      display:grid;
      place-items:center;
      perspective:1000px;
      flex:0 0 auto;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 30% 30%, rgba(103,232,249,.18), transparent 30%),
        radial-gradient(circle at 70% 65%, rgba(96,165,250,.16), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(52,211,153,.10), transparent 45%);
      animation:spin 16s linear infinite;
    }

    .ring.r2{
      inset:16px;
      animation-direction:reverse;
      animation-duration:11s;
      opacity:.92;
    }

    .world{
      position:relative;
      width:130px;
      height:130px;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 30%, #fff, transparent 15%),
        radial-gradient(circle at 50% 50%, var(--c1) 10%, var(--c2) 40%, #0a1525 80%),
        radial-gradient(circle at 60% 40%, var(--c3) 15%, transparent 25%),
        radial-gradient(circle at 20% 70%, var(--c3) 10%, transparent 20%);
      box-shadow:
        0 0 30px rgba(103,232,249,.20),
        0 0 60px rgba(96,165,250,.15),
        inset 0 0 20px rgba(0,0,0,.5);
      animation:worldBreath 3.5s ease-in-out infinite;
      transition:transform 0.3s ease, box-shadow 0.3s ease;
    }

    .world.speaking{
      animation:worldTalk 1s ease-in-out infinite;
      box-shadow:
        0 0 40px rgba(103,232,249,.35),
        0 0 80px rgba(96,165,250,.25),
        inset 0 0 25px rgba(0,0,0,.6);
    }

    .world.listening{
      animation:worldListen 1.2s ease-in-out infinite;
    }

    .caption{
      min-height:16px;
      font-size:12px;
      font-weight:900;
      color:var(--soft);
      text-align:center;
      text-transform:uppercase;
      flex:0 0 auto;
    }

    .translation-box{
      width:92%;
      min-height:74px;
      max-height:74px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 10px;
      margin-top:2px;
      background:radial-gradient(circle, rgba(255,255,255,.03) 0%, transparent 70%);
      border-radius:12px;
      overflow:hidden;
      flex:0 0 auto;
    }

    #turkishTranslation{
      font-size:14px;
      line-height:1.5;
      color:#fff;
      font-weight:600;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .repeat-card{
      width:92%;
      display:none;
      flex-direction:column;
      gap:8px;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      flex:0 0 auto;
    }

    .repeat-label{
      font-size:11px;
      font-weight:900;
      color:rgba(103,232,249,.95);
      text-transform:uppercase;
      letter-spacing:1px;
      text-align:center;
    }

    .repeat-hint{
      font-size:12px;
      line-height:1.45;
      font-weight:700;
      color:rgba(255,255,255,.72);
      text-align:center;
    }

    .repeat-phrase{
      font-size:16px;
      line-height:1.5;
      font-weight:900;
      color:#fff;
      text-align:center;
      word-break:break-word;
    }

    .bottom{
      width:100%;
      display:flex;
      justify-content:center;
      z-index:2;
      margin-top:10px;
      flex:0 0 auto;
    }

    .mic-btn{
      width:88px;
      height:88px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(135deg, rgba(103,232,249,.15), rgba(96,165,250,.12));
      color:#fff;
      font-size:32px;
      font-weight:900;
      cursor:pointer;
      box-shadow:
        0 14px 28px rgba(0,0,0,.20),
        0 0 20px rgba(103,232,249,.10);
      transition:transform .12s ease, box-shadow .12s ease;
    }

    .mic-btn:active{ transform:scale(.98); }

    .mic-btn.listening{
      background:linear-gradient(135deg, rgba(52,211,153,.25), rgba(103,232,249,.15));
      box-shadow:
        0 14px 28px rgba(0,0,0,.20),
        0 0 30px rgba(52,211,153,.20);
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    @keyframes worldBreath{
      0%,100%{transform:scale(1) rotate(0deg)}
      50%{transform:scale(1.04) rotate(2deg)}
    }

    @keyframes worldTalk{
      0%,100%{transform:scale(1)}
      25%{transform:scale(1.05)}
      50%{transform:scale(1.11)}
      75%{transform:scale(1.05)}
    }

    @keyframes worldListen{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.06)}
    }
  </style>
</head>
<body>
  <div id="pageContent">
    <div class="page">
      <section class="hero">
        <div class="top">
          <div class="title-row">
            <h1 class="title">Practice AI</h1>
            <div class="lang-badge" id="langBadge">🇬🇧</div>
          </div>
          <div class="status" id="statusLine">Seçili dilde konuşmaya başla.</div>
        </div>

        <div class="center">
          <div class="world-wrap">
            <div class="ring"></div>
            <div class="ring r2"></div>
            <div class="world" id="aiWorld"></div>
          </div>

          <div class="caption" id="aiCaption">Hazır</div>

          <div class="translation-box">
            <div id="turkishTranslation">Öğretmeninin Türkçe açıklaması burada görünecek.</div>
          </div>

          <div class="repeat-card" id="repeatWrap">
            <div class="repeat-label">Tekrar Et</div>
            <div class="repeat-hint" id="repeatHint"></div>
            <div class="repeat-phrase" id="repeatPhrase"></div>
          </div>
        </div>

        <div class="bottom">
          <button class="mic-btn" id="micBtn">🎙️</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";

    mountShell({ scroll: "none" });

    try {
      const root = getComputedStyle(document.documentElement);
      const footerH = parseFloat(root.getPropertyValue("--footerH")) || 0;
      document.documentElement.style.setProperty(
        "--shellLift",
        footerH ? `${footerH + 10}px` : "0px"
      );
    } catch {}

    setTimeout(() => {
      document.getElementById("pageContent")?.classList.add("ready");
    }, 120);
  </script>

  <script type="module" src="/js/practice_ai_page.js"></script>
</body>
</html>
