<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Practice AI</title>

  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05070d;
      --bg2:#09101b;
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --soft:rgba(255,255,255,.48);
      --line:rgba(255,255,255,.12);
      --glass:rgba(255,255,255,.05);
      --c1:#67e8f9;
      --c2:#60a5fa;
      --c3:#34d399;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shellLift:0px;
      --grad:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit,system-ui,sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 12% 10%, rgba(103,232,249,.10), transparent 20%),
        radial-gradient(circle at 88% 8%, rgba(96,165,250,.11), transparent 20%),
        radial-gradient(circle at 50% 100%, rgba(52,211,153,.09), transparent 22%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }

    #pageContent{
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      padding:10px 10px calc(10px + var(--safe-bottom) + var(--shellLift)) 10px;
    }
    #pageContent::-webkit-scrollbar{display:none}

    .page{
      width:100%;
      max-width:480px;
      min-height:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hero{
      flex:1;
      border:1px solid var(--line);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      padding:16px 14px 18px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .hero::before{
      content:"";
      position:absolute;
      right:-70px;
      top:-70px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(103,232,249,.16), transparent 70%);
      filter:blur(10px);
      pointer-events:none;
    }

    .hero-top{
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:8px;
    }

    .title{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:25px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    .desc{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
      font-weight:600;
      text-align:center;
    }

    .center-zone{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      padding:8px 0 0;
    }

    .orb-wrap{
      position:relative;
      width:220px;
      height:220px;
      display:grid;
      place-items:center;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 30% 30%, rgba(103,232,249,.18), transparent 30%),
        radial-gradient(circle at 70% 65%, rgba(96,165,250,.16), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(52,211,153,.10), transparent 45%);
      animation:spin 16s linear infinite;
    }

    .ring.r2{
      inset:16px;
      animation-direction:reverse;
      animation-duration:11s;
      opacity:.92;
    }

    .ring.r3{
      inset:34px;
      animation-duration:20s;
      opacity:.76;
    }

    .orb{
      position:relative;
      width:122px;
      height:122px;
      border-radius:50%;
      background:
        radial-gradient(circle at 28% 28%, rgba(255,255,255,.95), rgba(255,255,255,.14) 18%, rgba(103,232,249,.38) 42%, rgba(96,165,250,.26) 62%, rgba(52,211,153,.14) 82%, rgba(255,255,255,.04) 100%);
      box-shadow:
        0 0 34px rgba(103,232,249,.26),
        0 0 84px rgba(96,165,250,.18),
        inset 0 0 24px rgba(255,255,255,.18);
      animation:idleBreath 3.8s ease-in-out infinite;
    }

    .orb.speaking{
      animation:talkBreath 1.15s ease-in-out infinite;
      box-shadow:
        0 0 42px rgba(103,232,249,.34),
        0 0 92px rgba(96,165,250,.22),
        inset 0 0 26px rgba(255,255,255,.22);
    }

    .orb.listening{
      animation:listenBreath 1s ease-in-out infinite;
      box-shadow:
        0 0 44px rgba(52,211,153,.36),
        0 0 90px rgba(52,211,153,.18),
        inset 0 0 24px rgba(255,255,255,.22);
    }

    .caption{
      font-size:13px;
      font-weight:900;
      color:var(--soft);
      text-align:center;
      min-height:18px;
    }

    .subtitle-wrap{
      width:100%;
      min-height:120px;
      max-height:140px;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 10px;
      mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 78%, transparent 100%);
      -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 78%, transparent 100%);
    }

    .subtitle-stream{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      transform:translateY(0);
      transition:transform .55s ease;
    }

    .ai-sub-line{
      width:100%;
      text-align:center;
      font-size:15px;
      line-height:1.55;
      color:#fff;
      font-weight:700;
      opacity:.92;
      padding:0 4px;
    }

    .mic-zone{
      display:flex;
      justify-content:center;
      margin-top:6px;
    }

    .mic-btn{
      width:88px;
      height:88px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(135deg, rgba(103,232,249,.18), rgba(96,165,250,.16));
      color:#fff;
      font-size:30px;
      font-weight:900;
      cursor:pointer;
      box-shadow:
        0 16px 30px rgba(0,0,0,.22),
        0 0 24px rgba(103,232,249,.14);
      transition:transform .14s ease, box-shadow .14s ease;
    }
    .mic-btn:active{transform:scale(.985)}
    .mic-btn.listening{
      background:linear-gradient(135deg, rgba(52,211,153,.28), rgba(103,232,249,.18));
      box-shadow:
        0 16px 30px rgba(0,0,0,.22),
        0 0 34px rgba(52,211,153,.24);
    }

    .panel{
      border:1px solid var(--line);
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      padding:14px;
    }

    .section-title{
      margin:0 0 10px;
      font-size:15px;
      font-weight:900;
      color:#fff;
      letter-spacing:.2px;
    }

    .voice-row{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .select{
      width:100%;
      min-height:52px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:#fff;
      padding:0 14px;
      font-size:14px;
      font-weight:800;
    }
    .select option{color:#111}

    .conv{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:160px;
      max-height:240px;
      overflow:auto;
      scrollbar-width:none;
      padding-right:2px;
    }
    .conv::-webkit-scrollbar{display:none}

    .bubble{
      max-width:88%;
      padding:12px 14px;
      border-radius:18px;
      font-size:14px;
      line-height:1.45;
      font-weight:700;
      border:1px solid rgba(255,255,255,.08);
      word-break:break-word;
      align-self:flex-start;
      background:rgba(255,255,255,.05);
    }

    .ai-box{
      min-height:86px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      padding:12px 14px;
    }

    .mini-label{
      font-size:11px;
      font-weight:900;
      color:var(--soft);
      letter-spacing:.7px;
      margin-bottom:8px;
    }

    .ai-tr-text{
      font-size:14px;
      line-height:1.5;
      color:#fff;
      font-weight:700;
      min-height:24px;
    }

    .status-line{
      margin-top:8px;
      min-height:18px;
      font-size:12px;
      font-weight:800;
      color:var(--soft);
      text-align:center;
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
    @keyframes idleBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }
    @keyframes talkBreath{
      0%,100%{transform:scale(1)}
      25%{transform:scale(1.04)}
      50%{transform:scale(1.09)}
      75%{transform:scale(1.04)}
    }
    @keyframes listenBreath{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.07)}
    }
  </style>
</head>
<body>
  <div id="pageContent">
    <div class="page">
      <section class="hero">
        <div class="hero-top">
          <h1 class="title">Practice AI</h1>
        </div>

        <p class="desc">
          Seçili dilde öğretmen gibi konuşur. Kısa cümlelerle ilerler. Yanlış telaffuzda aynı ifadeyi %95 üstüne kadar tekrar ettirir.
        </p>

        <div class="center-zone">
          <div class="orb-wrap">
            <div class="ring"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="orb" id="aiOrb"></div>
          </div>

          <div class="caption" id="aiCaption">Hazır</div>

          <div class="subtitle-wrap">
            <div class="subtitle-stream" id="subtitleStream">
              <div class="ai-sub-line">Türkçe açıklama burada yukarı doğru akar.</div>
            </div>
          </div>
        </div>

        <div class="mic-zone">
          <button class="mic-btn" id="micBtn">🎙️</button>
        </div>

        <div class="status-line" id="statusLine">Seçili dilde konuşmaya başla.</div>
      </section>

      <section class="panel">
        <h2 class="section-title">AI Cevabı</h2>
        <div class="conv" id="conversation"></div>
      </section>

      <section class="panel">
        <h2 class="section-title">Türkçe Açıklama</h2>
        <div class="ai-box">
          <div class="mini-label">AI ALT AÇIKLAMA</div>
          <div class="ai-tr-text" id="aiTrText">Henüz AI cevabı yok.</div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
