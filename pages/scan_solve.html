<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Kuantum Çözücü</title>

  <style>
    html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
    
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass-border: rgba(255, 255, 255, 0.15);
    }
    
    /* ✅ GEÇİŞLERDEKİ KIPRAMAYI ENGELLEYEN KOD */
    #pageContent { 
      opacity: 0; visibility: hidden; 
      height: 100%; display: flex; flex-direction: column; background: #000; 
      transition: opacity 0.4s ease-in; 
    }
    #pageContent.shell-ready { opacity: 1 !important; visibility: visible !important; }

    .hero-scanner { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    /* ✅ KIRPMA TALİMATI ÇERÇEVESİ */
    .scan-viewfinder { 
      width: 100%; max-width: 360px; aspect-ratio: 3/4; 
      border-radius: 32px; border: 2px solid var(--glass-border); 
      background: rgba(255,255,255,0.03); position: relative; overflow: hidden; 
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* Kırpma İpucu (Resim Gelince Çıkar) */
    .crop-hint-overlay {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(99, 102, 241, 0.9); color: #fff; padding: 6px 14px;
      border-radius: 99px; font-size: 11px; font-weight: 900; z-index: 20;
      display: none; animation: slideDown 0.5s ease-out; white-space: nowrap;
    }
    @keyframes slideDown { from { top: -40px; } to { top: 15px; } }

    canvas#cv { width: 100%; height: 100%; object-fit: contain; border-radius: 30px; display: none; z-index: 5; touch-action: none; }

    .init-state { text-align: center; }
    .pulse-core { 
      width: 90px; height: 90px; border-radius: 50%; background: var(--ai-grad); 
      margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; 
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); animation: corePulse 2s infinite; font-size: 36px; 
    }
    @keyframes corePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    .action-dock { padding: 20px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: none; }
    .btn-solve { width: 100%; height: 62px; border-radius: 31px; border: none; background: var(--ai-grad); color: #fff; font-weight: 900; font-size: 18px; cursor: pointer; }

    /* SOLUTION SHEET */
    .solution-sheet { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; padding: 25px; overflow-y: auto; }
    .step-box { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
    
    input#file { display: none; }
    #croppedPreview { width: 100%; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--glass-border); display: none; }

    /* Engine Status */
    .engine-badge { font-size: 9px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-left: 10px; font-weight: 900; }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="hero-scanner">
    <div class="scan-viewfinder" id="viewfinder">
      <div class="crop-hint-overlay" id="cropHint">👇 PARMAĞINLA SORUYU ÇERÇEVELE</div>
      <div class="init-state" id="initState">
        <div class="pulse-core">📸</div>
        <span style="font-weight:900; color:#fff; letter-spacing:1px;">KAMERAYI BAŞLAT</span>
      </div>
      <canvas id="cv"></canvas>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment">
    <p style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 20px; font-weight: 800; text-align: center;">
      Çözmek istediğin sorunun etrafını çiz.<br>AI sadece o bölgeye odaklanacak.
    </p>
  </div>

  <div class="action-dock" id="dock">
    <button class="btn-solve" id="btnSolve">SORUYU ADIM ADIM ÇÖZ</button>
  </div>

  <div class="solution-sheet" id="solutionSheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0; font-family:'Space Grotesk';">Kuantum Çözücü</h2>
      <button onclick="closeSheet()" style="background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:50%; width:32px; height:32px;">✕</button>
    </div>
    <img id="croppedPreview">
    <div id="loading" style="text-align:center; padding:40px;">
       <div style="font-weight:900; color:#a5b4fc;" id="engineText">GOOGLE ENGINE ANALİZ EDİYOR...</div>
    </div>
    <div id="content" style="display:none;"></div>
  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  const fileInput = $("file");

  let img = new Image();
  let sel = null;
  let start = null;
  let finalCroppedData = null;

  $("viewfinder").onclick = () => fileInput.click();

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      $("initState").style.display = "none";
      $("cropHint").style.display = "block"; // ✅ Kırpma uyarısını göster
      cv.style.display = "block";
      const scale = Math.min($("viewfinder").clientWidth / img.width, $("viewfinder").clientHeight / img.height);
      cv.width = img.width * scale;
      cv.height = img.height * scale;
      draw();
      $("dock").style.display = "block";
    };
  };

  // ✅ KIRPMA MANTIĞI
  cv.onpointerdown = e => {
    const r = cv.getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top };
    sel = { x: start.x, y: start.y, w: 0, h: 0 };
    $("cropHint").style.display = "none"; // Çizim başlayınca ipucunu kaldır
  };
  cv.onpointermove = e => {
    if(!start) return;
    const r = cv.getBoundingClientRect();
    const curr = { x: e.clientX - r.left, y: e.clientY - r.top };
    sel = { x: Math.min(start.x, curr.x), y: Math.min(start.y, curr.y), w: Math.max(1, Math.abs(curr.x - start.x)), h: Math.max(1, Math.abs(curr.y - start.y)) };
    draw();
  };
  cv.onpointerup = () => {
    start = null;
    if (sel && sel.w > 10) {
      const tempCv = document.createElement("canvas");
      const tempCtx = tempCv.getContext("2d");
      tempCv.width = sel.w; tempCv.height = sel.h;
      tempCtx.drawImage(cv, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
      finalCroppedData = tempCv.toDataURL();
    }
  };

  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0,0, cv.width, cv.height);
    if(sel) {
      ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 3; ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0,0,cv.width, sel.y); ctx.fillRect(0, sel.y+sel.h, cv.width, cv.height);
      ctx.fillRect(0, sel.y, sel.x, sel.h); ctx.fillRect(sel.x+sel.w, sel.y, cv.width, sel.h);
    }
  }

  // ✅ GOOGLE + OPENAI HİBRİT ÇÖZÜM
  $("btnSolve").onclick = async () => {
    if(!finalCroppedData) { alert("Lütfen soruyu çerçeve içine alın."); return; }
    $("solutionSheet").style.display = "flex";
    $("croppedPreview").src = finalCroppedData;
    $("croppedPreview").style.display = "block";
    
    // 1. Aşama: Google Analizi
    $("engineText").innerText = "GOOGLE ANALİZ EDİYOR...";
    
    setTimeout(() => {
      // 2. Aşama: OpenAI Desteği (Simüle)
      $("engineText").innerText = "OPENAI İLE DOĞRULANIYOR...";
      
      setTimeout(() => {
        $("loading").style.display = "none";
        $("content").style.display = "block";
        $("content").innerHTML = `
          <div class="step-box">
            <div style="display:flex; justify-content:space-between;">
                <span style="color:#a5b4fc; font-weight:900; font-size:10px;">KONU ANALİZİ</span>
                <span class="engine-badge">HYBRID ENGINE ACTIVE</span>
            </div>
            <div style="margin-top:10px;">Sorun başarıyla tanımlandı. Konu: <b>Geometri • Benzerlik</b></div>
          </div>
          <div class="step-box" style="border-color:#10b981; background:rgba(16,185,129,0.1);">
            <div style="color:#10b981; font-weight:900; font-size:10px;">SONUÇ</div>
            <div style="font-size:22px; font-weight:900; margin-top:5px;">Cevap: 24 cm</div>
          </div>
        `;
      }, 1200);
    }, 1200);
  };

  window.closeSheet = () => $("solutionSheet").style.display = "none";

  // Titreme Engelleyici
  window.addEventListener("load", () => {
    setTimeout(() => { document.getElementById("pageContent").classList.add("shell-ready"); }, 150);
  });
</script>
</body>
</html>
