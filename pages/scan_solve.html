<!-- FILE: /pages/scan_solve.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Foto Çek Çöz</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --card: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.72);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --ok: rgba(34,197,94,0.95);
      --bad: rgba(255,90,140,0.95);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none;}
    #pageContent{height:100%}

    .wrap{max-width:520px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
    .card{border:1px solid var(--border);background:var(--card);border-radius:22px;padding:12px;backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);}
    .title{font-family:'Space Grotesk';font-weight:1000;font-size:16px;color:#fff}
    .hint{font-size:12px;font-weight:900;color:var(--muted);line-height:1.5}

    .row{display:flex; gap:10px; flex-wrap:wrap}
    .btn{height:52px;border-radius:18px;border:none;font-weight:1000;cursor:pointer; flex:1; min-width:140px}
    .btnMain{background:#fff;color:#000}
    .btnGhost{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff}
    .btn:active{transform:scale(.99)}
    .btn:disabled{opacity:.45; cursor:not-allowed}

    .stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.10);background:rgba(0,0,0,0.25)}
    canvas{width:100%;height:auto;display:block}

    .pillRow{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
    .pill{
      padding:10px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);color:#fff;font-weight:1000;font-size:12px;cursor:pointer;
      user-select:none;
    }
    .pill.sel{background:rgba(99,102,241,0.35);border-color:rgba(99,102,241,0.55)}

    input[type="file"]{
      width:100%;
      padding:10px;
      border-radius:18px;
      border:1px dashed rgba(255,255,255,0.16);
      background:rgba(0,0,0,0.18);
      color:#fff;
      font-weight:900;
    }

    textarea{
      width:100%;
      min-height:110px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.20);
      color:#fff;
      padding:12px;
      font-weight:900;
      line-height:1.45;
      resize:vertical;
    }

    .outTitle{
      font-weight:1000;color:#fff;margin:0 0 8px 0;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .badge{
      padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);font-weight:1000;font-size:12px;color:rgba(165,180,252,0.95);
      white-space:nowrap;
    }

    .outBox{
      border-radius:18px;border:1px solid rgba(255,255,255,0.10);
      background:rgba(0,0,0,0.18);
      padding:12px;
      color:rgba(255,255,255,0.88);
      font-weight:900;
      line-height:1.55;
      white-space:pre-wrap;
    }

    .qBlock{
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.03);
      padding:12px;
      margin-top:10px;
    }
    .qHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }
    .qNo{
      font-family:"Space Grotesk";
      font-weight:1000;
      font-size:14px;
      color:#fff;
    }
    .metaMini{
      font-size:11px;
      font-weight:900;
      color: rgba(255,255,255,0.68);
      white-space:nowrap;
    }
    .steps{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.88);
    }
    .final{
      margin-top:10px;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(34,197,94,0.22);
      background: rgba(34,197,94,0.08);
      color:#fff;
      font-weight:1000;
    }
    .ctaRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .btnCTA{
      height:46px;
      border-radius:16px;
      border:none;
      font-weight:1000;
      cursor:pointer;
      padding:0 14px;
      background: var(--aiGrad);
      color:#050510;
      flex:1;
      min-width: 180px;
    }
    .btnCTA:active{transform:scale(.99)}
    .btnCTAGhost{
      height:46px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      padding:0 14px;
      flex:1;
      min-width: 180px;
    }

    .toast{
      position: fixed;
      left:50%;
      top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,0.95);
      border: 1px solid rgba(165,180,252,0.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index: 999999;
      font-weight: 1000;
      font-size: 12px;
      transition: .25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width: min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <div class="card">
      <div class="title">Foto Çek • Kırp • Çöz</div>
      <div class="hint" style="margin-top:6px;">
        1) Foto seç (kamera/galeri)<br>
        2) Soruyu parmağınla çerçevele (kırp)<br>
        3) Metin çıkar (şimdilik manuel) → Çöz
      </div>

      <div class="pillRow" id="gradeRow" aria-label="Kademe seç">
        <div class="pill sel" data-grade="ortaokul">Ortaokul</div>
        <div class="pill" data-grade="lise">Lise</div>
      </div>

      <div class="pillRow" id="modeRow" aria-label="Mod seç">
        <div class="pill sel" data-mode="auto">Auto</div>
        <div class="pill" data-mode="single">Tek Soru</div>
        <div class="pill" data-mode="multi">Çok Soru</div>
      </div>
    </div>

    <div class="card">
      <input id="file" type="file" accept="image/*" capture="environment" />
      <div style="height:10px;"></div>
      <div class="stage">
        <canvas id="cv"></canvas>
      </div>
      <div class="hint" style="margin-top:8px;">Kırpma: resim üstünde sürükleyerek dikdörtgen seç.</div>

      <div class="row" style="margin-top:10px;">
        <button class="btn btnGhost" id="btnCrop" type="button">Kırp</button>
        <button class="btn btnMain" id="btnExtract" type="button">Metin Çıkar</button>
      </div>
    </div>

    <div class="card">
      <div class="outTitle">
        <span>Soru Metni</span>
        <span class="badge" id="metaBadge">Ortaokul • Auto</span>
      </div>

      <textarea id="txt" placeholder="Metin burada… (istersen düzelt)"></textarea>

      <div class="row" style="margin-top:10px;">
        <button class="btn btnGhost" id="btnClear" type="button">Temizle</button>
        <button class="btn btnMain" id="btnSolve" type="button">Çöz</button>
      </div>
    </div>

    <div class="card" id="outCard">
      <div class="outTitle">
        <span>Çözüm</span>
        <span class="badge" id="outBadge">Hazır</span>
      </div>

      <div class="outBox" id="out">Çözüm burada görünecek…</div>
      <div id="outList"></div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"auto" });

  const API_BASE = "https://italky-api.onrender.com";

  const $ = (id)=>document.getElementById(id);
  const toastEl = $("toast");
  function toast(msg){
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>toastEl.classList.remove("show"), 1700);
  }

  const file = $("file");
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  const txt = $("txt");
  const out = $("out");
  const outList = $("outList");
  const outBadge = $("outBadge");
  const metaBadge = $("metaBadge");

  // selected meta (backend uyumlu)
  let grade = "ortaokul";   // backend: "ortaokul" | "lise"
  let mode = "auto";        // auto | single | multi

  function refreshMeta(){
    metaBadge.textContent = `${grade === "lise" ? "Lise" : "Ortaokul"} • ${mode.toUpperCase()}`;
  }
  refreshMeta();

  function bindPills(rowId, onPick){
    const row = $(rowId);
    row.querySelectorAll(".pill").forEach(p=>{
      p.addEventListener("click", ()=>{
        row.querySelectorAll(".pill").forEach(x=>x.classList.remove("sel"));
        p.classList.add("sel");
        onPick(p);
        refreshMeta();
      });
    });
  }

  bindPills("gradeRow", (p)=>{
    grade = (p.getAttribute("data-grade") || "ortaokul").trim();
  });

  bindPills("modeRow", (p)=>{
    mode = (p.getAttribute("data-mode") || "auto").trim();
  });

  // image state
  let img = new Image();
  let imgLoaded = false;

  // crop rect
  let dragging=false;
  let sel=null; // {x,y,w,h}
  let start=null;

  function fitCanvasToImage(image){
    const maxW = 900;
    const scale = Math.min(1, maxW / image.width);
    cv.width = Math.floor(image.width * scale);
    cv.height = Math.floor(image.height * scale);
    ctx.drawImage(image, 0,0, cv.width, cv.height);
  }

  function draw(){
    if(!imgLoaded) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0,0, cv.width, cv.height);

    if(sel){
      ctx.save();
      ctx.strokeStyle = "rgba(165,180,252,0.95)";
      ctx.lineWidth = 3;
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.restore();
    }
  }

  file.onchange = ()=>{
    const f = file.files?.[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    img = new Image();
    img.onload = ()=>{
      imgLoaded = true;
      fitCanvasToImage(img);
      sel=null;
      draw();
      toast("Foto yüklendi");
    };
    img.src = url;
  };

  function pos(ev){
    const r = cv.getBoundingClientRect();
    const x = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    const y = (ev.touches?ev.touches[0].clientY:ev.clientY) - r.top;
    return {x,y};
  }

  cv.addEventListener("pointerdown",(e)=>{
    if(!imgLoaded) return;
    dragging=true;
    const p = pos(e);
    start=p;
    sel={x:p.x,y:p.y,w:0,h:0};
    draw();
  });

  cv.addEventListener("pointermove",(e)=>{
    if(!dragging || !sel || !start) return;
    const p = pos(e);
    sel.w = p.x - start.x;
    sel.h = p.y - start.y;
    if(sel.w < 0){ sel.x = p.x; sel.w = Math.abs(sel.w); } else sel.x = start.x;
    if(sel.h < 0){ sel.y = p.y; sel.h = Math.abs(sel.h); } else sel.y = start.y;
    draw();
  });

  cv.addEventListener("pointerup",()=>{ dragging=false; start=null; });

  $("btnCrop").onclick = ()=>{
    if(!imgLoaded || !sel) { toast("Önce alan seç"); return; }
    const tmp = document.createElement("canvas");
    tmp.width = Math.max(1, Math.floor(sel.w));
    tmp.height = Math.max(1, Math.floor(sel.h));
    tmp.getContext("2d").drawImage(cv, sel.x, sel.y, sel.w, sel.h, 0,0, tmp.width, tmp.height);

    cv.width = tmp.width;
    cv.height = tmp.height;
    ctx.drawImage(tmp,0,0);
    sel=null;
    toast("Kırpıldı");
  };

  $("btnExtract").onclick = async ()=>{
    toast("OCR şu an kapalı. Metni yapıştırıp ‘Çöz’ de. (Sonraki adım: otomatik OCR)");
    txt.focus();
  };

  $("btnClear").onclick = ()=>{
    txt.value = "";
    outBadge.textContent = "Hazır";
    out.textContent = "Çözüm burada görünecek…";
    outList.innerHTML = "";
  };

  async function solveQuestion(extractedText){
    const res = await fetch(`${API_BASE}/api/exam/solve_text`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: extractedText,
        grade: grade,           // ✅ backend uyumlu: "ortaokul" | "lise"
        locale: "tr",
        student_answer: "",
        mode: mode              // auto | single | multi
      })
    });

    const data = await res.json().catch(()=>null);
    if(!res.ok){
      const msg = data?.detail || JSON.stringify(data) || "Bilinmeyen hata";
      throw new Error(`HTTP ${res.status} • ${msg}`);
    }
    return data;
  }

  function renderSolvedList(data){
    outList.innerHTML = "";

    const arr = Array.isArray(data?.questions) ? data.questions : [];
    if(!arr.length){
      out.textContent = "Soru bulunamadı / çözüm üretilemedi.";
      return;
    }

    // üst özet
    out.textContent = `Bulunan soru sayısı: ${arr.length}\n`;

    arr.forEach((q)=>{
      const steps = Array.isArray(q.steps) ? q.steps : [];
      const choices = Array.isArray(q.choices) ? q.choices : null;

      const box = document.createElement("div");
      box.className = "qBlock";

      const meta = `${q.topic || "Konu"} • ${q.difficulty || "Orta"}`;
      box.innerHTML = `
        <div class="qHead">
          <div class="qNo">Soru ${q.q_no || 1}</div>
          <div class="metaMini">${meta}</div>
        </div>

        <div class="outBox" style="background:rgba(0,0,0,0.14)">
${(q.question || "").trim()}
        </div>

        ${choices ? `
        <div class="steps">
          <div style="font-weight:1000;margin-bottom:6px;">Şıklar</div>
          <div class="outBox" style="background:rgba(0,0,0,0.12)">${choices.join("\n")}</div>
        </div>` : ""}

        <div class="steps">
          <div style="font-weight:1000;margin-bottom:6px;">Adım adım çözüm</div>
          <div class="outBox" style="background:rgba(0,0,0,0.12)">${steps.map((s,i)=>`${i+1}) ${s}`).join("\n")}</div>
        </div>

        <div class="final">Cevap: ${q.final_answer || "—"}</div>

        <div class="outBox" style="margin-top:10px;background:rgba(0,0,0,0.12)">
${(q.explanation_short || "").trim()}
        </div>

        <div class="ctaRow">
          <button class="btnCTA" type="button" data-topic="${encodeURIComponent(q.topic||"Konu")}" data-grade="${encodeURIComponent(grade)}">
            15 Dakikada Bu Konuyu Öğren
          </button>
          <button class="btnCTAGhost" type="button" data-copy="1">
            Çözümü Kopyala
          </button>
        </div>
      `;

      // CTA: şimdilik yönlendirme placeholder (sonra plan_select / academy flow’a bağlarız)
      box.querySelector(".btnCTA")?.addEventListener("click", ()=>{
        const topic = q.topic || "Konu";
        toast("Özel ders akışı bir sonraki adım. (Hazır olunca bu buton Plan’a bağlanacak)");
        // ileride örnek:
        // location.href = `/pages/plan_select.html?mode=exam&grade=${grade}&topic=${encodeURIComponent(topic)}`;
      });

      // copy
      box.querySelector(".btnCTAGhost")?.addEventListener("click", async ()=>{
        const textToCopy =
`Soru ${q.q_no}
Konu: ${q.topic}
Zorluk: ${q.difficulty}

${q.question}

Adımlar:
${steps.map((s,i)=>`${i+1}) ${s}`).join("\n")}

Cevap: ${q.final_answer}

Kısa açıklama:
${q.explanation_short}
`;
        try{
          await navigator.clipboard.writeText(textToCopy);
          toast("Kopyalandı ✅");
        }catch{
          toast("Kopyalanamadı (izin?)");
        }
      });

      outList.appendChild(box);
    });
  }

  $("btnSolve").onclick = async ()=>{
    const q = (txt.value || "").trim();
    if(!q){
      outBadge.textContent = "Uyarı";
      out.textContent = "Soru metni boş.";
      outList.innerHTML = "";
      return;
    }

    outBadge.textContent = "Çözülüyor…";
    out.textContent = "Çözüm hazırlanıyor…";
    outList.innerHTML = "";

    try{
      const data = await solveQuestion(q);
      outBadge.textContent = "Bitti ✅";
      renderSolvedList(data);
    }catch(e){
      outBadge.textContent = "Hata";
      out.textContent = `Çözülemedi:\n${e?.message || e}`;
    }
  };
</script>
</body>
</html>
