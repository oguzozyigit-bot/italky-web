<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Kuantum Çözücü</title>

  <style>
    html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
    
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    
    #pageContent { height: 100%; display: flex; flex-direction: column; background: #000; position: relative; }

    /* STEP 1: KAMERA / YÜKLEME ALANI */
    .hero-scanner {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; position: relative; overflow: hidden;
    }
    
    .scan-frame {
      width: 100%; max-width: 340px; aspect-ratio: 3/4;
      border-radius: 32px; border: 2px dashed var(--glass-border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--glass); position: relative; transition: 0.3s;
    }
    
    .scan-frame.has-img { border: 2px solid var(--glass-border); background: #000; }
    
    canvas#cv { width: 100%; height: 100%; object-fit: contain; border-radius: 30px; display: none; }
    .upload-ui { text-align: center; }
    .upload-ui .icon { font-size: 48px; margin-bottom: 10px; display: block; }
    .upload-ui .txt { font-weight: 800; font-size: 16px; color: rgba(255,255,255,0.6); }

    /* STEP 2: KIRPMA VE KONTROL */
    .action-dock {
      padding: 15px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border); display: none;
    }
    .btn-solve {
      width: 100%; height: 56px; border-radius: 28px; border: none;
      background: var(--ai-grad); color: #fff; font-weight: 900; font-size: 18px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); cursor: pointer;
    }

    /* STEP 3: ÇÖZÜM PANELİ (BOTTOM SHEET TARZI) */
    .solution-panel {
      position: fixed; inset: 0; background: #000; z-index: 1000;
      display: none; flex-direction: column; padding: 20px; overflow-y: auto;
    }
    .solution-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .solution-content { flex: 1; }
    
    .step-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 16px; margin-bottom: 12px;
    }
    .step-num { color: #a5b4fc; font-weight: 900; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
    .step-txt { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.9); }

    /* ✅ YARDIMCI ÖĞRETMEN KANCASI (En Önemli Yer) */
    .teacher-cta {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(165, 180, 252, 0.3); border-radius: 24px;
      padding: 20px; text-align: center; margin-top: 20px;
    }
    .teacher-cta h3 { margin: 0 0 10px; font-size: 18px; font-weight: 900; }
    .teacher-cta p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 15px; }
    .btn-teacher {
      display: inline-block; padding: 12px 24px; border-radius: 99px;
      background: #fff; color: #000; font-weight: 900; text-decoration: none;
    }

    input#file { display: none; }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="hero-scanner" id="dropZone">
    <div class="scan-frame" id="frame">
      <div class="upload-ui" id="uploadUI">
        <span class="icon">📸</span>
        <span class="txt">Soruyu Çek veya Yükle</span>
      </div>
      <canvas id="cv"></canvas>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment">
    <p style="font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 15px; font-weight: 800;">
      * Birden fazla soru varsa çözmek istediğini çerçevele.
    </p>
  </div>

  <div class="action-dock" id="dock">
    <button class="btn-solve" id="btnSolve">Soruyu Analiz Et & Çöz</button>
  </div>

  <div class="solution-panel" id="solutionPanel">
    <div class="solution-header">
      <h2 style="font-family:'Space Grotesk'; font-size: 20px; margin:0;">italky<span>AI</span> Çözümü</h2>
      <button onclick="closeSolution()" style="background:none; border:none; color:#fff; font-size:24px;">✕</button>
    </div>
    
    <div id="solutionLoading" style="text-align:center; padding: 40px 0;">
       <div class="spinner"></div>
       <p style="margin-top:15px; font-weight:800; color:#a5b4fc;">AI Soruyu Çözüyor...</p>
    </div>

    <div class="solution-content" id="solutionContent" style="display:none;">
      </div>

    <div class="teacher-cta">
      <h3>Bu konuda eksik mi hissettin?</h3>
      <p>Bu sorunun mantığını anlamadıysan, Yardımcı Öğretmen ile 15 dakikalık hızlı bir özel ders yapabilirsin.</p>
      <a href="#" class="btn-teacher" id="btnGoTeacher">Öğretmenle Anla 🎓</a>
    </div>
  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const ctx = cv.getContext("2d");
  const frame = $("frame");
  const uploadUI = $("uploadUI");
  const fileInput = $("file");

  let img = new Image();
  let sel = null;
  let start = null;

  // Foto Seçme
  frame.onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      frame.classList.add("has-img");
      uploadUI.style.display = "none";
      cv.style.display = "block";
      fitCanvas();
      draw();
      $("dock").style.display = "block";
    };
  };

  function fitCanvas() {
    const scale = Math.min(frame.clientWidth / img.width, frame.clientHeight / img.height);
    cv.width = img.width * scale;
    cv.height = img.height * scale;
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
  }

  // Kırpma İşlemi (Touch & Mouse)
  cv.addEventListener("pointerdown", e => {
    const rect = cv.getBoundingClientRect();
    start = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    sel = { x: start.x, y: start.y, w: 0, h: 0 };
  });

  cv.addEventListener("pointermove", e => {
    if(!start) return;
    const rect = cv.getBoundingClientRect();
    const curr = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    sel = {
      x: Math.min(start.x, curr.x),
      y: Math.min(start.y, curr.y),
      w: Math.abs(curr.x - start.x),
      h: Math.abs(curr.y - start.y)
    };
    draw();
  });

  cv.addEventListener("pointerup", () => start = null);

  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0,0, cv.width, cv.height);
    if(sel) {
      ctx.strokeStyle = "#6366f1";
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 5]);
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      // Karartma efekti
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0,0,cv.width, sel.y);
      ctx.fillRect(0, sel.y+sel.h, cv.width, cv.height);
      ctx.fillRect(0, sel.y, sel.x, sel.h);
      ctx.fillRect(sel.x+sel.w, sel.y, cv.width, sel.h);
    }
  }

  // Çözüm Akışı
  $("btnSolve").onclick = async () => {
    $("solutionPanel").style.display = "flex";
    $("solutionLoading").style.display = "block";
    $("solutionContent").style.display = "none";
    
    // Simüle edilmiş AI Çözüm (Backend'e sel canvas'ı veya koordinatları gönderilir)
    setTimeout(() => {
      $("solutionLoading").style.display = "none";
      $("solutionContent").style.display = "block";
      $("solutionContent").innerHTML = `
        <div class="step-card">
          <div class="step-num">Analiz Edilen Konu</div>
          <div class="step-txt" style="font-weight:900;">Üslü Sayılar • Ortaokul Seviyesi</div>
        </div>
        <div class="step-card">
          <div class="step-num">Adım 1</div>
          <div class="step-txt">Soruda verilen 2^x = 8 ifadesini tabanları eşitleyecek şekilde düzenleyelim.</div>
        </div>
        <div class="step-card" style="border-color: #10b981; background: rgba(16,185,129,0.1);">
          <div class="step-num" style="color:#10b981;">Final Cevap</div>
          <div class="step-txt" style="font-size:20px; font-weight:900;">x = 3</div>
        </div>
      `;
    }, 1500);
  };

  window.closeSolution = () => $("solutionPanel").style.display = "none";
</script>
</body>
</html>
