<!-- FILE: /open/interpreter/index.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>italkyAI • Açılıyor</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#02000f;
      color:#fff;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .box{
      width:min(92vw,520px);
      padding:24px;
      border-radius:22px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      line-height:1.5;
    }
    .btn{
      display:inline-block;
      margin-top:16px;
      padding:12px 18px;
      border-radius:12px;
      background:#fff;
      color:#000;
      text-decoration:none;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div>italkyAI açılıyor…</div>
    <div style="margin-top:10px;font-size:14px;opacity:.8;">
      Uygulama yüklüyse açılır. Yüklü değilse Google Play’e yönlendirilirsin.
    </div>
    <a class="btn" id="storeBtn" href="#">Google Play’de Aç</a>
  </div>

  <script>
(function () {

  const p = new URLSearchParams(location.search);
  const host = (p.get("host") || "").trim();
  const v = (p.get("v") || "1").trim();

  const playUrl = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";
  const appUrl = `italky://join?host=${encodeURIComponent(host)}&v=${encodeURIComponent(v)}`;

  const storeBtn = document.getElementById("storeBtn");
  if (storeBtn) storeBtn.href = playUrl;

  if (!host) {
    location.replace(playUrl);
    return;
  }

  let appOpened = false;

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) appOpened = true;
  });

  console.log("Interpreter OPEN host:", host);
  console.log("Interpreter OPEN appUrl:", appUrl);

  try{
    window.location.href = appUrl;
  }catch(e){
    console.warn("Deep link error", e);
  }

  setTimeout(() => {
    if (!appOpened) {
      location.replace(playUrl);
    }
  }, 1800);

})();
</script>
</body>
</html>
