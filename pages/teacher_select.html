<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Ders Seçimi</title>

  <style>
    :root {
      --ai: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass-border: rgba(255, 255, 255, 0.1);
      --bg-dark: #02000f;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700&display=swap');

    html, body { 
      background: var(--bg-dark) !important; margin: 0; padding: 0; 
      height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #pageContent {
      height: 100%; display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15), transparent 40%);
      opacity: 0; transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
    }
    #pageContent.ui-ready { opacity: 1; transform: translateY(0); }

    .wrap { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; }

    /* 💎 Hero Alanı */
    .hero {
      padding: 20px; border-radius: 28px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
      position: relative; overflow: hidden;
    }
    .hero h1 { font-size: 24px; font-weight: 800; color: #fff; margin: 0; letter-spacing: -0.5px; }
    .hero h1 span { background: var(--ai); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin: 10px 0 0; line-height: 1.6; font-weight: 500; }

    /* 🚀 Dil Kartları */
    .list { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; }

    .langCard {
      width: 100%; border-radius: 24px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02); padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative; overflow: hidden;
    }

    .langCard:active { transform: scale(0.96) translateY(4px); }

    /* Kartın arkasındaki renk sızıntısı (Aura) */
    .langCard::after {
      content: ""; position: absolute; left: 0; top: 0; width: 60px; height: 100%;
      background: var(--ai); opacity: 0.05; filter: blur(30px);
    }

    .left { display: flex; align-items: center; gap: 15px; z-index: 5; }

    /* Nöral Bayrak Çekirdeği */
    .flagRing {
      width: 50px; height: 50px; border-radius: 18px;
      background: var(--ai); padding: 2px;
      animation: rotateRing 8s linear infinite;
    }
    .flagBox {
      width: 100%; height: 100%; border-radius: 16px;
      background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }

    .txt .name { font-size: 18px; font-weight: 800; color: #fff; display: block; }
    .txt .sub { font-size: 11px; color: rgba(255, 255, 255, 0.45); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .txt .sub.ok { color: #a5b4fc; }

    .right { display: flex; align-items: center; gap: 10px; z-index: 5; }
    .badge {
      font-size: 11px; font-weight: 900; color: #fff;
      padding: 5px 10px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border);
    }
    .chev { color: rgba(255, 255, 255, 0.3); font-size: 20px; font-weight: 300; }

    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="wrap">
      <section class="hero">
        <h1>italky <span>Academy</span></h1>
        <p>Eğitim yolculuğun burada başlıyor. Seviyene göre özel ders planın saniyeler içinde hazırlanacak.</p>
      </section>

      <section class="list" id="list"></section>
    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"none" });
    // Sayfa hazır olduğunda animasyonu tetikle
    document.getElementById("pageContent").classList.add("ui-ready");

    const $ = (id)=>document.getElementById(id);
    const list = $("list");

    const LANGS = [
      { code:"en", name:"English",  flag:"🇬🇧", teacher:"dora"   },
      { code:"de", name:"German",   flag:"🇩🇪", teacher:"ayda"   },
      { code:"fr", name:"French",   flag:"🇫🇷", teacher:"jale"   },
      { code:"it", name:"Italian",  flag:"🇮🇹", teacher:"sencer" },
      { code:"ru", name:"Russian",  flag:"🇷🇺", teacher:"sungur" },
      { code:"es", name:"Spanish",  flag:"🇪🇸", teacher:"ozan"   },
    ];

    async function init() {
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session) { location.replace("/pages/login.html"); return; }
      
      const { data: prof } = await supabase.from("profiles").select("levels").eq("id", session.user.id).maybeSingle();
      const levels = prof?.levels || {};

      list.innerHTML = LANGS.map(l => {
        const lv = levels[l.code] || "";
        const subTxt = lv ? `Seviye: ${lv} • Plana Geç` : "Sınava Yönlendir";
        return `
          <button class="langCard" onclick="window.goNext('${l.code}', '${l.teacher}', '${lv}')">
            <div class="left">
              <div class="flagRing"><div class="flagBox">${l.flag}</div></div>
              <div class="txt">
                <span class="name">${l.name}</span>
                <span class="sub ${lv ? 'ok' : ''}">${subTxt}</span>
              </div>
            </div>
            <div class="right">
              <div class="badge">${l.code.toUpperCase()}</div>
              <div class="chev">›</div>
            </div>
          </button>
        `;
      }).join("");
    }

    window.goNext = (code, teacher, lv) => {
      localStorage.setItem("italky_teacher_pref", teacher);
      if(lv) {
        location.href = `/pages/plan_select.html?t=${teacher}&lang=${code}&level=${lv}`;
      } else {
        location.href = `/pages/level_required.html?lang=${code}&t=${teacher}&next=plan_select`;
      }
    };

    init();
  </script>
</body>
</html>
