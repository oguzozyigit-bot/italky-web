<!-- FILE: /pages/exam_take.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Deneme</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<main id="pageContent">
  <div style="max-width:520px; margin:0 auto; height:100%; padding:12px 14px; display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; gap:10px; justify-content:space-between; align-items:center;">
      <div id="chipMeta" style="padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.22); font-weight:1000; font-size:12px; color:rgba(255,255,255,0.9);">LGS</div>
      <div id="chipTimer" style="padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.22); font-weight:1000; font-size:12px; color:#fff;">--:--</div>
    </div>

    <div id="card" style="flex:1; min-height:0; border-radius:22px; border:1px solid rgba(255,255,255,0.10); background:rgba(255,255,255,0.04); padding:14px; overflow:auto;">
      Yükleniyor…
    </div>

    <div style="display:flex; gap:10px;">
      <button id="btnPrev" style="flex:1; height:52px; border-radius:18px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); color:#fff; font-weight:1000;">Geri</button>
      <button id="btnFinish" style="flex:1; height:52px; border-radius:18px; border:none; background:#fff; color:#000; font-weight:1000;">Bitir</button>
    </div>

    <div id="toast" style="position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-120px); background:rgba(10,10,18,0.95); border:1px solid rgba(165,180,252,0.35); padding:10px 14px; border-radius:999px; color:#fff; z-index:999999; font-weight:1000; font-size:12px; transition:.25s; backdrop-filter: blur(12px); pointer-events:none; max-width:min(92vw,520px); text-align:center;"></div>
  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";
  mountShell({ scroll:"none" });

  const toast = (msg)=>{
    const t = document.getElementById("toast");
    t.textContent = String(msg||"");
    t.style.transform = "translateX(-50%) translateY(0)";
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>{ t.style.transform="translateX(-50%) translateY(-120px)"; }, 1600);
  };

  const qs = (k)=>new URLSearchParams(location.search).get(k);
  const attemptId = String(qs("id")||"").trim();
  if(!attemptId){ location.href="/pages/exam_hub.html"; }

  const { data:{ session } } = await supabase.auth.getSession();
  if(!session?.user) location.replace("/pages/login.html");

  const card = document.getElementById("card");

  let attempt = null;
  let questions = [];
  let answers = [];
  let idx = 0;
  let durationMin = 90;
  let endAt = 0;
  let tick = null;

  async function loadAttempt(){
    const { data, error } = await supabase
      .from("exam_attempts")
      .select("id, exam, grade, started_at, duration_minutes, questions, answers, status")
      .eq("id", attemptId)
      .single();
    if(error) throw error;
    return data;
  }

  function fmt(sec){
    const m = String(Math.floor(sec/60)).padStart(2,"0");
    const s = String(sec%60).padStart(2,"0");
    return `${m}:${s}`;
  }

  function render(){
    const q = questions[idx];
    if(!q){ card.textContent="Soru yok"; return; }

    const picked = (answers[idx] ?? null);

    const opts = Array.isArray(q.options) ? q.options : [];
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;">
        <div style="font-weight:1000; font-size:12px; color:rgba(255,255,255,0.7)">${q.lesson} • ${q.topic}</div>
        <div style="font-weight:1000; font-size:12px; color:rgba(255,255,255,0.7)">Soru ${idx+1}/${questions.length}</div>
      </div>
      <div style="font-weight:1000; font-size:16px; line-height:1.35; margin-bottom:12px; white-space:pre-wrap;">${q.question}</div>
      ${opts.map((o,i)=>`
        <button data-i="${i}" style="
          width:100%;
          text-align:left;
          padding:14px;
          border-radius:18px;
          border:1px solid rgba(255,255,255,0.12);
          background:${picked===i ? "rgba(99,102,241,0.55)" : "rgba(0,0,0,0.22)"};
          color:#fff;
          font-weight:900;
          margin-bottom:10px;
          cursor:pointer;
        ">${o}</button>
      `).join("")}
    `;

    card.querySelectorAll("button[data-i]").forEach(b=>{
      b.onclick = ()=>{
        const i = Number(b.getAttribute("data-i"));
        answers[idx] = i;
        render();
      };
    });

    document.getElementById("btnPrev").disabled = (idx===0);
    document.getElementById("btnPrev").onclick = ()=>{ if(idx>0){ idx--; render(); } };
  }

  async function finish(){
    toast("Sonuç hesaplanıyor…");
    const { data, error } = await supabase.rpc("finish_exam_attempt", { p_attempt_id: attemptId, p_answers: answers });
    if(error){
      toast(error.message || "Bitirilemedi");
      return;
    }
    const row = Array.isArray(data) ? data[0] : data;
    const correct = Number(row?.correct ?? 0);
    const total = Number(row?.total ?? questions.length);
    const pct = Math.round((Number(row?.percent ?? 0))*100);

    // sonuç + yanlışlar için çözüm ekranı (basit)
    const wrongs = [];
    for(let i=0;i<questions.length;i++){
      if(answers[i] == null) continue;
      if(answers[i] !== questions[i].correct_index){
        wrongs.push({ i, q: questions[i] });
      }
    }

    let txt = `✅ Bitti!\nDoğru: ${correct}/${total}  (%${pct})\n\n`;
    if(wrongs.length){
      txt += `❌ Yanlışlar: ${wrongs.length}\n\nİlk yanlışın çözümünü göstereyim:\n`;
      const w = wrongs[0].q;
      txt += `\n${w.question}\n\nÇözüm:\n- ${(w.solution_steps||[]).join("\n- ")}\n\n${w.full_solution_text||""}\n\n`;
      txt += `Bu konu (${w.topic}) için mini ders ister misin?`;
    } else {
      txt += "Harika! Yanlışın yok. İstersen bir üst zorluk denemesine geçelim.";
    }

    alert(txt);
    location.href="/pages/exam_hub.html";
  }

  document.getElementById("btnFinish").onclick = finish;

  try{
    attempt = await loadAttempt();
    durationMin = Number(attempt.duration_minutes || 90);
    questions = Array.isArray(attempt.questions) ? attempt.questions : [];
    answers = Array.isArray(attempt.answers) ? attempt.answers : new Array(questions.length).fill(null);

    document.getElementById("chipMeta").textContent = `${attempt.exam} • ${attempt.grade}. Sınıf`;

    const startedAt = new Date(attempt.started_at).getTime();
    endAt = startedAt + durationMin*60*1000;

    const tickFn = ()=>{
      const left = Math.max(0, Math.floor((endAt - Date.now())/1000));
      document.getElementById("chipTimer").textContent = fmt(left);
      if(left<=0){
        clearInterval(tick);
        finish();
      }
    };
    tickFn();
    tick = setInterval(tickFn, 1000);

    render();
  }catch(e){
    console.error(e);
    toast("Sınav yüklenemedi");
    card.textContent = String(e?.message || e);
  }
</script>
</body>
</html>
