<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • Global Galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --txt: #f8fbff;
      --italky-cyan: #67e8f9;
      --italky-pink: #f472b6;
      --italky-indigo: #818cf8;
      --gold: linear-gradient(135deg, #f59e0b, #f97316);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--txt); font-family: 'Outfit', sans-serif; overflow: hidden; }

    #page { 
      padding: 100px 20px 120px 20px; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
    }

    /* --- GALAXY SYSTEM --- */
    .galaxy-viewport {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* Merkezdeki Dünya */
    .earth-core {
      width: 100px;
      height: 100px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') center/cover;
      border-radius: 50%;
      z-index: 50;
      box-shadow: 0 0 50px rgba(103, 232, 249, 0.4), inset -10px -10px 20px rgba(0,0,0,0.8);
      animation: earthRotate 12s linear infinite;
    }

    /* Yörüngeler */
    .orbit {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-1 { width: 200px; height: 200px; animation: rotateCW 20s linear infinite; }
    .orbit-2 { width: 320px; height: 320px; animation: rotateCCW 35s linear infinite; }
    .orbit-3 { width: 450px; height: 450px; animation: rotateCW 50s linear infinite; }

    /* Bayraklar */
    .flag {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      object-fit: cover;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* --- INFO & CTA --- */
    .footer-content { text-align: center; z-index: 100; }
    
    .motto-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(103, 232, 249, 0.1);
      border: 1px solid var(--italky-cyan);
      color: var(--italky-cyan);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 { font-size: 32px; font-weight: 900; line-height: 1; margin: 0; letter-spacing: -1px; }
    h1 span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .price-display { font-size: 42px; font-weight: 950; margin: 15px 0; color: #fff; }

    .cta-main {
      width: 100%;
      padding: 20px;
      background: var(--gold);
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 15px 30px rgba(249, 115, 22, 0.4);
      cursor: pointer;
    }

    /* Animasyonlar */
    @keyframes earthRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

  </style>
</head>
<body>

  <main id="page">
    
    <div class="galaxy-viewport">
      <div class="earth-core"></div>
      
      <div class="orbit orbit-1">
        <img src="https://flagcdn.com/w80/tr.png" class="flag" style="top:0;">
        <img src="https://flagcdn.com/w80/us.png" class="flag" style="bottom:0;">
        <img src="https://flagcdn.com/w80/gb.png" class="flag" style="left:0;">
        <img src="https://flagcdn.com/w80/de.png" class="flag" style="right:0;">
      </div>

      <div class="orbit orbit-2">
        <img src="https://flagcdn.com/w80/fr.png" class="flag" style="top:15%; left:15%;">
        <img src="https://flagcdn.com/w80/es.png" class="flag" style="top:15%; right:15%;">
        <img src="https://flagcdn.com/w80/it.png" class="flag" style="bottom:15%; left:15%;">
        <img src="https://flagcdn.com/w80/ru.png" class="flag" style="bottom:15%; right:15%;">
        <img src="https://flagcdn.com/w80/jp.png" class="flag" style="top:50%; right:-12px;">
      </div>

      <div class="orbit orbit-3">
        <img src="https://flagcdn.com/w80/cn.png" class="flag" style="top:0;">
        <img src="https://flagcdn.com/w80/kr.png" class="flag" style="bottom:0;">
        <img src="https://flagcdn.com/w80/sa.png" class="flag" style="left:0;">
        <img src="https://flagcdn.com/w80/br.png" class="flag" style="right:0;">
        <img src="https://flagcdn.com/w80/in.png" class="flag" style="top:25%; left:5%;">
      </div>
    </div>

    <div class="footer-content">
      <div class="motto-tag">italkyAI • EĞLENEREK ÖĞREN!</div>
      <h1>Dünyayı <span>Cebine Sığdır,</span><br>Özgürce Konuş.</h1>
      
      <div class="price-display">499 TL</div>
      
      <button id="buyBtn" class="cta-main">PREMIUM'U AKTİF ET</button>
      
      <p style="font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.4;">
        67 Dil Offline Paketler • 100 Jeton Hediye<br>Tek Seferlik Ödeme, Süresiz Erişim
      </p>
    </div>

  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    
    try {
      mountShell({
        scroll: "no",
        title: "italkyAI Global Premium",
        activeTab: "premium"
      });
    } catch(e) { console.warn("Shell hazır."); }

    document.getElementById("buyBtn").addEventListener("click", () => {
      alert("italkyAI Evrenine Hoş Geldiniz! Satın alma işlemi başlıyor...");
    });
  </script>

</body>
</html>
