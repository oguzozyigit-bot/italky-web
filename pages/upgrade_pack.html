<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • Premium Revolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b14;
      --txt: #f8fbff;
      --italky-cyan: #67e8f9;
      --italky-pink: #f472b6;
      --italky-indigo: #818cf8;
      --gold: linear-gradient(135deg, #f59e0b, #f97316);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); color: var(--txt); font-family: 'Outfit', sans-serif; overflow: hidden; }

    /* UI Shell Alanları */
    #page { 
      padding: 90px 20px 110px 20px; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- ULTRA ANIMATED CORE --- */
    .visual-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-orb {
      width: 140px;
      height: 140px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--italky-cyan), var(--italky-indigo));
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 80px rgba(103, 232, 249, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 4s ease-in-out infinite;
    }

    .main-orb img { width: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

    /* Dönen Dil Halkaları */
    .ring-orbit {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: rotate 15s linear infinite;
    }
    .r1 { width: 220px; height: 220px; border-color: rgba(103, 232, 249, 0.2); }
    .r2 { width: 300px; height: 300px; border-color: rgba(244, 114, 182, 0.15); animation-duration: 25s; animation-direction: reverse; }

    .lang-tag {
      position: absolute;
      background: rgba(255,255,255,0.05);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(5px);
    }

    /* --- CONTENT CARD --- */
    .info-section { text-align: center; z-index: 20; }
    
    .premium-badge {
      display: inline-block;
      padding: 5px 15px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--italky-cyan);
      color: var(--italky-cyan);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    h1 { font-size: 36px; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -1px; }
    h1 span { color: var(--italky-pink); }

    .price-box {
      margin: 20px 0;
      font-size: 48px;
      font-weight: 950;
    }

    .cta-button {
      width: 100%;
      padding: 22px;
      background: var(--gold);
      border: none;
      border-radius: 24px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 20px 40px rgba(249, 115, 22, 0.4);
      cursor: pointer;
    }

    /* Animasyonlar */
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <main id="page">
    
    <div class="visual-container">
      <div class="ring-orbit r1">
        <div class="lang-tag" style="top:0; left:50%;">EN</div>
        <div class="lang-tag" style="bottom:10%; right:10%;">FR</div>
      </div>
      <div class="ring-orbit r2">
        <div class="lang-tag" style="top:20%; left:5%;">ES</div>
        <div class="lang-tag" style="bottom:20%; right:5%;">DE</div>
      </div>
      
      <div class="main-orb">
        <strong style="font-family:'Space Grotesk'; font-size:22px; color:#000;">italky</strong>
      </div>
    </div>

    <div class="info-section">
      <div class="premium-badge">EĞLENEREK ÖĞREN!</div>
      <h1>Sınırları <span>Kaldır,</span><br>Dünyayı Cebine Sığdır.</h1>
      
      <div class="price-box">499 TL</div>
      
      <button id="buyBtn" class="cta-button">PREMIUM'U AKTİF ET</button>
      
      <p style="font-size: 12px; color: var(--muted); margin-top: 15px;">
        Tek seferlik ödeme • 67 Dil Offline • 100 Jeton Hediye
      </p>
    </div>

  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    
    try {
      mountShell({
        scroll: "no", // Sayfa taşmasın, tam ekran kalsın
        title: "italkyAI Premium",
        activeTab: "premium"
      });
    } catch(e) { console.warn("Shell yüklendi."); }

    document.getElementById("buyBtn").addEventListener("click", () => {
      alert("italkyAI Premium Dünyasına Hoş Geldiniz! Ödeme ekranı açılıyor...");
    });
  </script>

</body>
</html>
