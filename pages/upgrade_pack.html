<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • Global Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b14;
      --txt: #f8fbff;
      --muted: rgba(255, 255, 255, 0.60);
      --italky-cyan: #67e8f9;
      --italky-pink: #f472b6;
      --italky-indigo: #818cf8;
      --grad: linear-gradient(135deg, var(--italky-cyan) 0%, var(--italky-indigo) 46%, var(--italky-pink) 100%);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); color: var(--txt); font-family: 'Outfit', sans-serif; }

    /* UI Shell için Güvenli Alanlar */
    #page { 
      padding: 80px 16px 100px 16px; /* Üst bar (80px) ve Alt bar (100px) için yer bırakıldı */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wrap { max-width: 480px; width: 100%; display: grid; gap: 24px; }

    /* --- ULTRA VISUAL: ANIMATED CORE --- */
    .ultra-visual {
      position: relative;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .core-orb {
      width: 120px;
      height: 120px;
      background: var(--grad);
      border-radius: 50%;
      position: relative;
      z-index: 5;
      box-shadow: 0 0 60px rgba(103, 232, 249, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      animation: orbitPulse 3s infinite ease-in-out;
    }

    /* NFC ve Radyal Dalgalar */
    .wave {
      position: absolute;
      border: 2px solid var(--italky-cyan);
      border-radius: 50%;
      opacity: 0;
      animation: waveOut 4s infinite linear;
    }
    .wave:nth-child(2) { animation-delay: 1s; border-color: var(--italky-indigo); }
    .wave:nth-child(3) { animation-delay: 2s; border-color: var(--italky-pink); }

    /* --- PREMIUM CARD --- */
    .premium-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 30px 24px;
      text-align: center;
    }

    .badge {
      background: rgba(103, 232, 249, 0.15);
      color: var(--italky-cyan);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 { font-size: 32px; font-weight: 900; margin: 20px 0 10px; line-height: 1.1; }

    .price-tag {
      font-size: 44px; font-weight: 900; margin: 20px 0;
      background: linear-gradient(to bottom, #fff, #999);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .cta-btn {
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 15px 35px rgba(249, 115, 22, 0.3);
      cursor: pointer;
    }

    /* Animasyon Kodları */
    @keyframes orbitPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.3); }
    }

    @keyframes waveOut {
      0% { width: 120px; height: 120px; opacity: 0.8; }
      100% { width: 350px; height: 350px; opacity: 0; border-width: 1px; }
    }

  </style>
</head>
<body>

  <main id="page">
    <div class="wrap">
      
      <section class="ultra-visual">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="core-orb">itAI</div>
      </section>

      <section class="premium-card">
        <span class="badge">Eğlenerek Öğren</span>
        <h1>Dünya Cebinde,<br>Sınırlar Geride.</h1>
        <p style="color: var(--muted); font-size: 14px;">
          Premium ile Text sınırlarını kaldır, 67 offline dili cebine indir ve her an her yerde konuşmaya başla!
        </p>

        <div class="price-tag">499 TL <span style="font-size: 16px; vertical-align: middle;">/ Sınırsız</span></div>

        <button id="buyBtn" class="cta-btn">HEMEN PREMIUM OL</button>
        
        <p style="font-size: 11px; margin-top: 15px; color: rgba(255,255,255,0.4);">
          * Play Store üzerinden tek seferlik ödeme. 100 Jeton hediyen seni bekliyor.
        </p>
      </section>

    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    
    // UI Shell'i başlat (Barlar otomatik gelir)
    try {
      mountShell({
        scroll: "auto",
        activeTab: "premium",
        title: "italkyAI Premium"
      });
    } catch(e) { console.error("Shell error", e); }

    document.getElementById("buyBtn").addEventListener("click", () => {
      alert("italkyAI Premium Ödeme Sayfasına Yönlendiriliyorsunuz...");
    });
  </script>

</body>
</html>
