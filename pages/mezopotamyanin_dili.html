<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Mezopotamya’nın Dili</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#f59e0b,#f97316,#b45309);
      --bg:#120904;
      --border:rgba(255,255,255,0.15);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none;}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Outfit,sans-serif;overflow:hidden;}
    body{min-height:100dvh;background:radial-gradient(circle at top,rgba(245,158,11,.08),transparent 22%),radial-gradient(circle at bottom,rgba(180,83,9,.08),transparent 22%),#120904;}

    /* Bu sayfada alt mühür mic üzerine binmesin */
    [data-italky-footer],
    .italky-global-footer,
    .prestige-signature,
    .drawer-footer-seal,
    .signature,
    .menu-sign{
      display:none!important;
      visibility:hidden!important;
      pointer-events:none!important;
    }

    .container{display:flex;flex-direction:column;width:100%;height:100dvh;position:relative;overflow:hidden;}
    .half-screen{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;min-height:0;}
    .half-screen.top{transform:rotate(180deg);background:linear-gradient(180deg,rgba(180,83,9,.22),var(--bg));padding:10px 8px 8px;}
    .half-screen.bottom{background:linear-gradient(180deg,rgba(146,64,14,.18),var(--bg));padding:6px 8px calc(6px + var(--safe-bottom));}

    .lang-row{width:100%;display:flex;justify-content:center;padding:0 6px;flex:0 0 auto;position:relative;z-index:3000;pointer-events:none;}
    .lang-row-inner{width:min(92vw,420px);display:grid;grid-template-columns:1fr;align-items:center;gap:8px;margin:0 auto;position:relative;z-index:3001;pointer-events:auto;}
    .lang-trigger{background:transparent;border:none;padding:8px 14px;border-radius:999px;color:#fff;font-size:12px;font-weight:900;letter-spacing:.2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:38px;width:min(70vw,300px);text-decoration:none;flex:0 1 auto;white-space:nowrap;justify-self:center;pointer-events:auto;z-index:3002;}


    .family-row{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      margin-top:-2px;
      padding:0 6px;
      position:relative;
      z-index:3003;
      pointer-events:auto;
      flex:0 0 auto;
    }

    .family-trigger{
      background:transparent;
      border:none;
      padding:5px 12px;
      border-radius:999px;
      color:rgba(255,255,255,.92);
      font-family:Outfit,sans-serif;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:30px;
      width:min(70vw,300px);
      text-decoration:none;
      white-space:nowrap;
      line-height:1;
    }

    .family-trigger .chev{
      font-size:12px;
      opacity:.88;
      transform:translateY(-1px);
    }

    .family-menu{
      display:none;
      flex-direction:column;
      align-items:center;
      gap:4px;
      width:min(70vw,300px);
      margin-top:0;
      padding:0;
      background:transparent;
      border:none;
      box-shadow:none;
    }

    .family-menu.show{display:flex;}

    .family-option{
      width:100%;
      min-height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:5px 12px;
      border-radius:999px;
      color:rgba(255,255,255,.78);
      font-family:Outfit,sans-serif;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      text-decoration:none;
      background:transparent;
      border:none;
      white-space:nowrap;
    }

    .family-option.active{
      color:#fff;
      background:rgba(245,158,11,.12);
      border:1px solid rgba(251,191,36,.26);
      box-shadow:0 6px 18px rgba(146,64,14,.14), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .family-option:active{
      transform:scale(.98);
    }

    .popover{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,360px);height:360px;background:#1a0d07;border:1px solid var(--border);border-radius:24px;display:none;flex-direction:column;z-index:5000;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.92);}
    .popover.show{display:flex;}
    .half-screen.top .popover{top:56px;}
    .half-screen.bottom .popover{bottom:56px;}
    .pop-head{padding:14px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.3px;}
    .pop-close{cursor:pointer;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);}
    .pop-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:none;}
    .pop-list::-webkit-scrollbar{display:none;}
    .pop-item{padding:12px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;border:1px solid transparent;}
    .pop-item:hover{background:rgba(255,255,255,.06);}
    .pop-item.active{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.25);}
    .pop-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .pop-flag{font-size:18px;}
    .pop-name{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
    .pop-code{font-weight:900;font-size:12px;opacity:.7;}

    .chat-body{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 20px;mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent);scrollbar-width:none;}
    .chat-body::-webkit-scrollbar{display:none;}
    .bubble{text-align:center;max-width:84%;line-height:1.25;word-break:break-word;}
    .bubble.them{opacity:.55;font-size:18px;font-weight:500;}
    .bubble.me{font-size:18px;font-weight:650;opacity:.82;}
    .bubble.me.is-latest{font-size:30px;font-weight:900;opacity:1;line-height:1.08;}
    .bubble-row{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
    .bubble-row .txt{display:inline-block;}
    .spk-icon{width:30px;height:30px;min-width:30px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
    .spk-icon svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.1;opacity:.95;}

    .composer-stack{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:30;padding-bottom:0;flex:0 0 auto;}
    .composer{width:auto;min-width:86px;display:flex;align-items:center;justify-content:center;gap:0;min-height:86px;padding:8px;border-radius:999px;background:transparent;border:none;box-shadow:none;position:relative;}
    .composer.listening{box-shadow:none;animation:none;}
    .composer-center,.composer-input,.send-btn,.kb-wrap,.kb{display:none!important;}

    .mic-btn{width:70px;height:70px;border:none;border-radius:50%;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff;position:relative;z-index:2;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);}
    .mic-btn.listening{background:radial-gradient(circle at 50% 35%,rgba(251,191,36,.34),rgba(245,158,11,.22) 44%,rgba(180,83,9,.12));box-shadow:0 0 0 10px rgba(245,158,11,.12),0 0 34px rgba(245,158,11,.45),0 0 70px rgba(180,83,9,.25),inset 0 1px 0 rgba(255,255,255,.10);animation:micBreath 1.05s ease-in-out infinite;}
    .mic-btn.listening::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:2px solid rgba(251,191,36,.78);box-shadow:0 0 0 12px rgba(245,158,11,.10),0 0 38px rgba(180,83,9,.35);animation:micPulse 1s ease-out infinite;}


    .hf-btn{
      width:clamp(96px,28vw,108px);
      min-height:38px;
      border:none;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:3px;
      padding:6px 6px;
      background:linear-gradient(135deg,rgba(120,53,15,.70),rgba(67,20,7,.58)),radial-gradient(circle at 20% 0%,rgba(251,191,36,.18),transparent 42%);
      border:1px solid rgba(251,191,36,.30);
      color:rgba(254,243,199,.88);
      font-family:Outfit,sans-serif;
      font-size:8.6px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.06px;
      cursor:pointer;
      flex:0 0 auto;
      position:absolute;
      left:calc(50% + 58px);
      top:50%;
      transform:translateY(-50%);
      z-index:3;
      overflow:hidden;
      white-space:nowrap;
      -webkit-backdrop-filter:blur(13px) saturate(1.35);
      backdrop-filter:blur(13px) saturate(1.35);
      box-shadow:0 10px 24px rgba(35,12,4,.28),0 0 14px rgba(245,158,11,.12),inset 0 1px 0 rgba(255,255,255,.10);
      transition:transform .18s ease,color .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
    }

    .hf-btn::before{
      content:"";
      position:absolute;
      inset:1px 6px auto 6px;
      height:45%;
      border-radius:999px;
      background:linear-gradient(180deg,rgba(255,255,255,.24),transparent);
      opacity:.78;
      pointer-events:none;
    }

    .hf-btn:active{transform:translateY(-50%) scale(.95);}

    .hf-btn.active,.hf-btn.on{
      color:#fff;
      border-color:rgba(251,191,36,.76);
      background:linear-gradient(135deg,#78350f,#b45309);
      box-shadow:0 0 18px rgba(245,158,11,.30),0 14px 30px rgba(35,12,4,.34),inset 0 1px 0 rgba(255,255,255,.14);
    }

    .hf-btn.listening{
      animation:hfListenBreath 1.15s ease-in-out infinite;
      box-shadow:0 0 0 5px rgba(245,158,11,.10),0 0 22px rgba(245,158,11,.32),0 14px 30px rgba(35,12,4,.34),inset 0 1px 0 rgba(255,255,255,.16);
    }

    .hf-hand{
      width:13px;
      height:13px;
      min-width:13px;
      fill:none;
      stroke:#facc15;
      stroke-width:2.1;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 5px rgba(250,204,21,.22));
    }

    body.handsfree-mode #topMic,
    body.handsfree-mode #botMic{
      background:radial-gradient(circle at 50% 35%,rgba(251,191,36,.34),rgba(245,158,11,.22) 44%,rgba(180,83,9,.12));
      box-shadow:0 0 0 10px rgba(245,158,11,.12),0 0 34px rgba(245,158,11,.45),0 0 70px rgba(180,83,9,.25),inset 0 1px 0 rgba(255,255,255,.10);
      animation:micBreath 1.05s ease-in-out infinite;
    }

    body.handsfree-mode #topMic::after,
    body.handsfree-mode #botMic::after{
      content:"";
      position:absolute;
      inset:-13px;
      border-radius:50%;
      border:2px solid rgba(251,191,36,.78);
      box-shadow:0 0 0 12px rgba(245,158,11,.10),0 0 38px rgba(180,83,9,.35);
      animation:micPulse 1s ease-out infinite;
      pointer-events:none;
    }

    @keyframes hfListenBreath{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.045)}}
    @keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}
    .mic-btn svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .hidden{display:none!important;}

    .center-hub{height:82px;display:flex;align-items:center;justify-content:center;gap:18px;position:relative;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);z-index:600;flex:0 0 auto;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);}
    .nav-btn{position:fixed!important;top:50%;width:30px;height:118px;padding:0;background:linear-gradient(180deg,rgba(245,158,11,.26),rgba(249,115,22,.20),rgba(180,83,9,.20));border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:1000;cursor:pointer;z-index:1800;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:transform .2s ease;transform:translateY(-50%);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;line-height:1.15;}
    #homeLink{right:0;left:auto!important;border-radius:18px 0 0 18px;border-right:none;box-shadow:-10px 0 32px rgba(0,0,0,.30);}
    #clearBtn{display:none!important;left:0;right:auto!important;border-radius:0 18px 18px 0;border-left:none;box-shadow:10px 0 32px rgba(0,0,0,.30);pointer-events:auto!important;z-index:2147483000!important;isolation:isolate;}
    .nav-btn:active{transform:translateY(-50%) scale(.96);}
    .nav-btn .label-rotate{display:inline-block;transform:none!important;}

    .orb-container{width:82px;height:82px;display:flex;align-items:center;justify-content:center;transition:transform .8s cubic-bezier(.34,1.56,.64,1);position:relative;}
    .energy-orbit{position:absolute;width:82px;height:82px;border-radius:50%;animation:rotateOrbit 5s linear infinite;}
    .ball-1,.ball-2{position:absolute;width:10px;height:10px;border-radius:50%;filter:blur(1.5px);transition:background .25s ease,box-shadow .25s ease,transform .25s ease;}
    .ball-1{top:-5px;left:50%;transform:translateX(-50%);background:#f59e0b;box-shadow:0 0 15px #f59e0b;}
    .ball-2{bottom:-5px;left:50%;transform:translateX(-50%);background:#b45309;box-shadow:0 0 15px #b45309;}
    .ai-core{width:66px;height:66px;border-radius:50%;background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;position:relative;overflow:hidden;}
    .logo-text{color:#fff;letter-spacing:.4px;font-size:13px;}
    .logo-ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .eq-wrap{display:flex;align-items:center;gap:3px;height:20px;position:absolute;opacity:0;transition:.25s;z-index:20;}
    #frameRoot.is-listening .eq-wrap,#frameRoot.is-translating .eq-wrap{opacity:1;}
    #frameRoot.is-listening .logo-text,#frameRoot.is-translating .logo-text{opacity:0;}
    .eq-bar{width:3px;background:var(--ai-gradient);border-radius:10px;animation:eqAnim .7s infinite ease-in-out;}
    #frameRoot.is-idle .ball-1,#frameRoot.is-idle .ball-2,#frameRoot.is-error .ball-1,#frameRoot.is-error .ball-2{background:#ef4444;box-shadow:0 0 18px rgba(239,68,68,.9);}
    #frameRoot.is-listening .ball-1,#frameRoot.is-translating .ball-1{background:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.95);}
    #frameRoot.is-listening .ball-2,#frameRoot.is-translating .ball-2{background:#b45309;box-shadow:0 0 18px rgba(180,83,9,.95);}
    #frameRoot.is-ready .ball-1,#frameRoot.is-ready .ball-2{background:#22c55e;box-shadow:0 0 18px rgba(34,197,94,.9);}
    #frameRoot.to-top .orb-container{transform:rotate(180deg);} #frameRoot.to-bot .orb-container{transform:rotate(0deg);}
    @keyframes rotateOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes eqAnim{0%,100%{height:5px;opacity:.6}50%{height:25px;opacity:1}}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.52);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999999;padding:20px;}
    .modal.open,.modal.show{display:flex;}
    .modal-card{width:min(100%,420px);border-radius:24px;padding:18px;background:linear-gradient(145deg,rgba(16,16,24,.96),rgba(10,10,18,.96));border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 50px rgba(0,0,0,.30);}
    .modal-title{margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:900;color:#fff;}
    .modal-text{margin:0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.76);}
    .modal-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
    .modal-btn{min-height:46px;border:none;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:900;}
    .modal-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff;}
    .mini-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);min-height:44px;padding:10px 16px;border-radius:16px;background:rgba(12,16,28,.96);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:12px;font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;max-width:min(92vw,420px);z-index:99999;box-shadow:0 18px 36px rgba(0,0,0,.35);transition:.22s ease;backdrop-filter:blur(14px);pointer-events:none;}
    .mini-toast.show{transform:translateX(-50%) translateY(0);}
    @media (max-width:390px){.lang-row-inner{width:min(94vw,410px)}.lang-trigger,.family-trigger,.family-menu{width:min(76vw,280px)}.mic-btn{width:66px;height:66px}.mic-btn svg{width:28px;height:28px}.hf-btn{left:calc(50% + 54px);width:clamp(92px,28vw,104px);font-size:8.2px}}
  </style>
</head>

<body id="frameRoot" class="to-bot">
  <div class="container">
    <div class="half-screen top" id="topSection">
      <div class="lang-row"><div class="lang-row-inner"><button class="lang-trigger" id="topLangBtn" type="button"><span id="topLangTxt">🌐 Dil seçiliyor...</span> ⌵</button></div></div>
      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi"><div class="pop-head"><div>ÜST DİL</div><div class="pop-close" id="close-top">✕</div></div><div class="pop-list" id="list-top"></div></div>
      <div class="chat-body" id="topBody"></div>
      <div class="composer-stack"><div class="composer" id="topComposer"><textarea id="topInput" class="composer-input" rows="1" tabindex="-1" aria-hidden="true"></textarea><button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button><button id="topSend" class="send-btn hidden" type="button" aria-label="Üst mesaj gönder"></button></div><div class="kb-wrap" id="topKeyboardWrap" aria-hidden="true"><div class="kb" id="topKeyboard"></div></div></div>
    </div>

    <div class="center-hub" id="centerHub">
      <a class="nav-btn" id="homeLink" href="/pages/home.html"><span id="homeText" class="label-rotate">HOME</span></a>
      <div class="orb-container" id="homeBtn" title="Ana sayfa"><div class="energy-orbit"><div class="ball-1"></div><div class="ball-2"></div></div><div class="ai-core"><div class="eq-wrap" aria-hidden="true"><div class="eq-bar" style="animation-delay:0s"></div><div class="eq-bar" style="animation-delay:.2s"></div><div class="eq-bar" style="animation-delay:.4s"></div></div><span class="logo-text">italky<span class="logo-ai">AI</span></span></div></div>
      <button class="nav-btn btn-clear" id="clearBtn" type="button"><span id="clearText" class="label-rotate">CLEAR</span></button>
    </div>

    <div class="half-screen bottom" id="botSection">
      <div class="lang-row"><div class="lang-row-inner"><button class="lang-trigger" id="botLangBtn" type="button"><span id="botLangTxt">🌐 Dil seçiliyor...</span> ⌵</button></div></div>
      <div class="family-row" id="familyNavRow">
        <button class="family-trigger" id="familyNavBtn" type="button" aria-expanded="false">
          <span id="familyNavTxt">Mezopotamya Dilleri</span><span class="chev">⌵</span>
        </button>
        <div class="family-menu" id="familyNavMenu" aria-label="Dil aileleri">
          <a class="family-option" href="/pages/facetoface.html" data-family-general="1">Genel Diller</a>
          <a class="family-option active" href="/pages/mezopotamyanin_dili.html" aria-current="page">Mezopotamya Dilleri</a>
          <a class="family-option" href="/pages/turan_dilleri.html">Turan Dilleri</a>
          <a class="family-option" href="/pages/kafkas_dilleri.html">Kafkas Dilleri</a>
          <a class="family-option" href="/pages/balkan_dilleri.html">Balkan Dilleri</a>
        </div>
      </div>
