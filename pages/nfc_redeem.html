<!-- FILE: /pages/nfc_redeem.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • Jeton Yükleme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1319;
      --panel:#1b222c;
      --line:#2f3947;
      --txt:#f3f5f8;
      --muted:#aab4c1;
      --grad:linear-gradient(135deg,#8fa5bc 0%, #aab8c8 50%, #c7ae7b 100%);
      --shadow:0 18px 46px rgba(0,0,0,.22);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      min-height:100%;
      background:linear-gradient(180deg,#0d1117 0%, #121820 100%);
      color:var(--txt);
      font-family:'Outfit',sans-serif;
    }

    .page{
      width:100%;
      max-width:560px;
      margin:0 auto;
      padding:24px 16px 40px;
      min-height:100dvh;
      display:flex;
      align-items:center;
    }

    .card{
      width:100%;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }

    .brand{
      font-family:"Space Grotesk",sans-serif;
      font-size:24px;
      font-weight:900;
      margin:0 0 8px;
      letter-spacing:-.6px;
    }

    .brand span{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .title{
      margin:0 0 10px;
      font-size:22px;
      font-weight:900;
    }

    .desc{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      font-weight:700;
    }

    .field{
      width:100%;
      min-height:56px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#18202a;
      color:#fff;
      padding:0 16px;
      font-size:18px;
      font-weight:900;
      letter-spacing:3px;
      text-align:center;
      outline:none;
    }

    .field::placeholder{
      color:#7f8b99;
      letter-spacing:1px;
    }

    .btn{
      width:100%;
      min-height:56px;
      margin-top:14px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#8fa5bc 0%, #aab8c8 100%);
      color:#0f1319;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
    }

    .btn:active{transform:scale(.985)}

    .hint{
      margin-top:14px;
      padding:14px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      font-weight:800;
    }

    .status{
      min-height:22px;
      margin-top:14px;
      font-size:14px;
      font-weight:900;
      line-height:1.5;
    }

    .ok{color:#9fc6b1}
    .err{color:#e2a0a0}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1 class="brand">italky<span>AI</span></h1>
      <h2 class="title">Jeton Kartı Yükleme</h2>
      <p class="desc">
        NFC okunmazsa kartın altındaki 6 haneli kodu girin.
        Sistem kartı bulur ve jetonları açık olan hesaba yükler.
      </p>

      <input
        id="manualCode"
        class="field"
        type="text"
        maxlength="6"
        inputmode="numeric"
        placeholder="6 HANELİ KOD"
      />

      <button id="redeemBtn" class="btn" type="button">Kodu Doğrula</button>

      <div class="hint">
        Kart okutulamadığında burada görünen 6 haneli kod yeterlidir.
        Kod doğrulanınca jetonlar doğrudan hesabınıza eklenir.
      </div>

      <div id="statusBox" class="status"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "/js/supabase_client.js";
    import { setHeaderTokens } from "/js/ui_shell.js";

    const API_BASE = "https://italky-api.onrender.com";

    const manualCodeInput = document.getElementById("manualCode");
    const redeemBtn = document.getElementById("redeemBtn");
    const statusBox = document.getElementById("statusBox");

    function setStatus(text, ok = false) {
      statusBox.textContent = text || "";
      statusBox.className = "status " + (ok ? "ok" : "err");
    }

    async function getAuthHeaders() {
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token || "";
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function getUserId() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || "";
    }

    async function redeemManualCode() {
      const code = String(manualCodeInput.value || "").trim();

      if (code.length !== 6) {
        setStatus("Lütfen 6 haneli kodu eksiksiz girin.");
        return;
      }

      const userId = await getUserId();
      if (!userId) {
        location.href = "/pages/login.html";
        return;
      }

      redeemBtn.disabled = true;
      setStatus("Kod doğrulanıyor...");

      try {
        const res = await fetch(`${API_BASE}/api/nfc/redeem-manual-code`, {
          method: "POST",
          headers: await getAuthHeaders(),
          body: JSON.stringify({
            manual_code: code,
            user_id: userId
          })
        });

        const json = await res.json().catch(() => null);

        if (!json) {
          setStatus("Kod doğrulanamadı.");
          redeemBtn.disabled = false;
          return;
        }

        if (json.ok) {
          if (typeof json.tokens_after === "number") {
            try { setHeaderTokens(json.tokens_after); } catch {}
          }
          setStatus(`${json.loaded_tokens} jeton hesabınıza yüklendi.`, true);
          redeemBtn.disabled = false;
          return;
        }

        const reason = String(json.reason || "");
        if (reason === "CODE_NOT_FOUND") {
          setStatus("Kod bulunamadı.");
        } else if (reason === "CARD_ALREADY_USED") {
          setStatus("Bu kart daha önce kullanılmış.");
        } else if (reason === "CARD_BLOCKED") {
          setStatus("Bu kart engellenmiş.");
        } else if (reason === "CARD_EXPIRED") {
          setStatus("Bu kartın süresi dolmuş.");
        } else {
          setStatus("İşlem başarısız: " + reason);
        }

        redeemBtn.disabled = false;
      } catch (e) {
        setStatus("Bağlantı hatası oluştu.");
        redeemBtn.disabled = false;
      }
    }

    redeemBtn?.addEventListener("click", redeemManualCode);

    manualCodeInput?.addEventListener("input", () => {
      manualCodeInput.value = manualCodeInput.value.replace(/\D/g, "").slice(0, 6);
    });
  </script>
</body>
</html>
