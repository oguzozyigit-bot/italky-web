<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI</title>
  <meta name="theme-color" content="#07080b"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07080b;
      --text:#f7f7f7;
      --muted:rgba(255,255,255,.58);
      --orange:#f59e0b;
      --orange2:#f97316;
      --green:#a3e635;
      --green2:#84cc16;
      --red:#ef4444;
      --yellow:#facc15;
      --glass:rgba(255,255,255,.045);
      --line:rgba(255,255,255,.08);

      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);

      --header-h:66px;
      --footer-h:44px;
      --composer-h:86px;
      --keyboard-offset:0px;
      --app-height:100dvh;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(249,115,22,.08), transparent 24%),
        radial-gradient(circle at bottom, rgba(163,230,53,.06), transparent 18%),
        linear-gradient(180deg,#050608 0%, #090b10 100%);
    }

    #pageContent{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:var(--app-height);
      margin:0 auto;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 0%, rgba(239,68,68,.05), transparent 20%),
        radial-gradient(circle at 85% 8%, rgba(163,230,53,.04), transparent 18%),
        linear-gradient(180deg,#050608 0%, #090b10 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(2px + var(--safe-top)) 14px 4px;
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:10px;
      z-index:50;
      background:linear-gradient(180deg, rgba(7,8,11,.96), rgba(7,8,11,.76));
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(14px);
    }

    .icon-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:1px;
      text-align:center;
      cursor:pointer;
      user-select:none;
    }

    .brand-title{
      margin:0;
      font-family:"Space Grotesk", Outfit, sans-serif;
      font-size:23px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.5px;
      color:#fff;
    }

    .brand-title .ai{
      background:linear-gradient(135deg, var(--orange) 0%, var(--orange2) 42%, var(--green) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin:0;
      font-size:8px;
      font-weight:900;
      letter-spacing:2.4px;
      color:rgba(255,255,255,.30);
    }

    .menu{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:120;
    }

    .menu.open{ pointer-events:auto; }

    .menu-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.48);
      backdrop-filter:blur(6px);
      opacity:0;
      transition:opacity .22s ease;
    }

    .menu.open .menu-backdrop{ opacity:1; }

    .menu-panel{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:min(84vw, 336px);
      transform:translateX(-104%);
      transition:transform .24s ease;
      padding:calc(14px + var(--safe-top)) 12px calc(14px + var(--safe-bottom));
      background:linear-gradient(180deg, rgba(10,11,14,.98), rgba(6,7,10,.98));
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:20px 0 40px rgba(0,0,0,.35);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menu.open .menu-panel{ transform:translateX(0); }

    .menu-user{
      display:flex;
      gap:12px;
      align-items:center;
      padding:14px;
      border-radius:20px;
      background:var(--glass);
      border:1px solid rgba(255,255,255,.07);
    }

    .menu-user-avatar{
      width:58px;
      height:58px;
      border-radius:18px;
      overflow:hidden;
      flex:0 0 auto;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }

    .menu-user-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .menu-user-meta{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .menu-logo{
      font-family:"Space Grotesk", Outfit, sans-serif;
      font-size:20px;
      font-weight:900;
      line-height:1;
      color:#fff;
    }

    .menu-logo .ai{
      background:linear-gradient(135deg, var(--orange) 0%, var(--orange2) 42%, var(--green) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .menu-name{
      font-size:14px;
      font-weight:900;
      color:#fff;
      line-height:1.2;
      word-break:break-word;
    }

    .menu-jeton{
      font-size:12px;
      font-weight:800;
      color:#dcfce7;
    }

    .menu-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow:auto;
      scrollbar-width:none;
    }

    .menu-list::-webkit-scrollbar{ display:none; }

    .menu-item{
      width:100%;
      min-height:46px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.07);
      color:#fff;
      text-align:left;
      padding:0 14px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
    }

    .menu-item.white{
      background:#fff;
      color:#111;
    }

    .menu-item.orange{
      color:#fed7aa;
      background:rgba(249,115,22,.10);
      border-color:rgba(249,115,22,.20);
    }

    .menu-item.red{
      color:#fecaca;
      background:rgba(239,68,68,.10);
      border-color:rgba(239,68,68,.22);
    }

    .saved-list{
      display:none;
      flex-direction:column;
      gap:8px;
      padding-left:16px;
    }

    .saved-list.open{ display:flex; }

    .saved-chat-btn{
      width:100%;
      min-height:42px;
      border:none;
      border-radius:14px;
      background:rgba(163,230,53,.06);
      border:1px solid rgba(132,204,22,.18);
      color:#f0fdf4;
      text-align:left;
      padding:10px 12px;
      cursor:pointer;
      font-size:12px;
      font-weight:800;
    }

    .saved-chat-meta{
      display:block;
      margin-top:4px;
      font-size:10px;
      color:rgba(240,253,244,.62);
      font-weight:700;
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
    }

    .chat-scroll{
      position:absolute;
      inset:0;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:2px 14px calc(var(--composer-h) + 26px + var(--keyboard-offset));
      display:flex;
      flex-direction:column;
      gap:10px;
      scroll-behavior:smooth;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.left{ justify-content:flex-start; }
    .msg.right{ justify-content:flex-end; }

    .bubble-wrap{ max-width:84%; }

    .bubble{
      background:#0d0f14;
      border:1px solid rgba(255,255,255,.07);
      padding:18px 18px;
      border-radius:24px;
      font-size:15px;
      line-height:1.42;
      font-weight:800;
      word-break:break-word;
      box-shadow:0 8px 22px rgba(0,0,0,.18);
      white-space:pre-wrap;
    }

    .bubble.left{ border-left:4px solid var(--orange); }
    .bubble.right{ border-right:4px solid var(--green); }

    .msg-meta{
      margin-top:7px;
      font-size:11px;
      font-weight:700;
      color:var(--muted);
    }

    .typing{
      display:none;
      position:absolute;
      left:14px;
      right:14px;
      bottom:calc(var(--composer-h) + 10px + var(--keyboard-offset));
      font-size:12px;
      color:rgba(255,255,255,.7);
      font-weight:800;
      z-index:5;
    }

    .typing.show{ display:block; }

    .audio-wait{
      display:none;
      position:absolute;
      left:14px;
      right:14px;
      bottom:calc(var(--composer-h) + 34px + var(--keyboard-offset));
      font-size:12px;
      color:rgba(255,255,255,.62);
      font-weight:800;
      z-index:5;
    }

    .audio-wait.show{ display:block; }

    .composer-wrap{
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:10;
      transform:translateY(calc(-1 * var(--keyboard-offset)));
      transition:transform .12s ease;
    }

    .composer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:72px;
      padding:10px 12px;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
      position:relative;
    }

    .composer.listening{
      box-shadow:
        0 0 0 1px rgba(249,115,22,.30),
        0 0 0 8px rgba(249,115,22,.08),
        0 0 30px rgba(249,115,22,.18),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation:composerPulse 1.2s ease-in-out infinite;
    }

    @keyframes composerPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.006); }
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:140px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:16px;
      font-weight:800;
      line-height:1.45;
      font-family:inherit;
      overflow:auto;
    }

    .composer-input::placeholder{
      color:rgba(255,255,255,.72);
      font-weight:800;
    }

    .send-btn,.mic-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .send-btn{
      background:#fff;
      color:#000;
      box-shadow:0 0 24px rgba(255,255,255,.10);
    }

    .mic-btn{
      background:transparent;
      color:#fff;
    }

    .mic-btn.listening::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      border:2px solid rgba(34,197,94,.72);
      box-shadow:0 0 0 8px rgba(34,197,94,.10), 0 0 24px rgba(34,197,94,.18);
      animation:micPulse 1s ease-out infinite;
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.14; }
      100%{ transform:scale(1.18); opacity:0; }
    }

    .hidden{ display:none !important; }

    .footer{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:10px 12px calc(10px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(7,8,11,.88);
      backdrop-filter:blur(12px);
      z-index:30;
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      flex-wrap:wrap;
      font-size:12px;
      font-weight:900;
      text-align:center;
    }

    .seal-main{
      background:linear-gradient(135deg, var(--orange) 0%, var(--orange2) 40%, var(--green) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .seal-dot{ color:rgba(255,255,255,.25); }
    .seal-year{ color:#bef264; }

    .save-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }

    .save-modal.open{ display:flex; }

    .save-card{
      width:min(100%,420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .save-title{
      margin:0;
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;
      font-weight:900;
      color:#fff;
    }

    .save-input{
      width:100%;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:#fff;
      border-radius:16px;
      padding:14px;
      font-size:14px;
      font-weight:800;
      font-family:inherit;
      outline:none;
    }

    .save-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .save-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .save-btn.primary{
      background:linear-gradient(135deg, var(--orange) 0%, var(--orange2) 100%);
      color:#1a0d02;
    }

    .save-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
  </style>
</head>
<body>

<div class="save-modal" id="saveModal">
  <div class="save-card">
    <h3 class="save-title">Sohbete isim ver</h3>
    <input id="saveChatName" class="save-input" type="text" placeholder="Örn: Akşam notları">
    <div class="save-actions">
      <button class="save-btn secondary" id="cancelSaveChat" type="button">Vazgeç</button>
      <button class="save-btn primary" id="confirmSaveChat" type="button">Kaydet</button>
    </div>
  </div>
</div>

<div class="menu" id="menu">
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <aside class="menu-panel">
    <div class="menu-user">
      <div class="menu-user-avatar" id="menuUserAvatar">
        <img id="menuUserAvatarImg" alt="Avatar">
      </div>
      <div class="menu-user-meta">
        <div class="menu-logo">italky<span class="ai">AI</span></div>
        <div class="menu-name" id="menuUserName">Kullanıcı</div>
        <div class="menu-jeton" id="menuJeton">Jeton: 0</div>
      </div>
    </div>

    <div class="menu-list">
      <button class="menu-item white" id="newChatBtn" type="button">Yeni Sohbet</button>
      <button class="menu-item" id="saveChatMenuBtn" type="button">Sohbeti Kaydet</button>
      <button class="menu-item" id="savedChatsToggleBtn" type="button">Kayıtlı Sohbetler</button>
      <div class="saved-list" id="savedChatsList"></div>
      <button class="menu-item" id="clearChatMenuBtn" type="button">Sohbeti Temizle</button>
      <button class="menu-item orange" id="jetonYukleBtn" type="button">Jeton Yükle</button>
      <button class="menu-item red" id="homeBtn" type="button">Ana Sayfaya Dön</button>
    </div>
  </aside>
</div>

<main id="pageContent">
  <div class="app">
    <header class="header">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menü">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
      </button>

      <div class="brand" id="brandHome">
        <h1 class="brand-title">italky<span class="ai">AI</span></h1>
        <p class="brand-sub">BE FREE</p>
      </div>

      <button class="icon-btn" id="topSettingsBtn" type="button" aria-label="SohbetAI Ses Ayarları">
        <svg viewBox="0 0 24 24">
          <path d="M12 3l1.2 2.4 2.6.4-1.9 1.9.5 2.7L12 9.3 9.6 10.4l.5-2.7-1.9-1.9 2.6-.4L12 3z"></path>
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a2 2 0 1 1-4 0v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a2 2 0 1 1 0-4h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4a2 2 0 1 1 4 0v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2a2 2 0 1 1 0 4H20a1 1 0 0 0-.6.6z"></path>
        </svg>
      </button>
    </header>

    <section class="main">
      <div class="chat-scroll" id="chatMessages"></div>
      <div class="typing" id="typingState">italkyAI yazıyor...</div>
      <div class="audio-wait" id="audioWaitState">Ses hazırlanıyor...</div>

      <div class="composer-wrap">
        <div class="composer" id="chatComposer">
          <div class="composer-center">
            <textarea id="chatInput" class="composer-input" rows="1" placeholder="Mesajını buraya yaz"></textarea>
          </div>

          <button id="micBtn" class="mic-btn" type="button" aria-label="Mikrofon">
            <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg>
          </button>

          <button id="sendBtn" class="send-btn hidden" type="button" aria-label="Gönder">
            <svg viewBox="0 0 24 24"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>
          </button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="seal">
        <div class="brand-seal">
  italkyAI @ icanyAI By Ozyigit's 2026
  <span class="gokturk-signature" lang="otk" dir="rtl">?????? ????????????</span>
</div>
      </div>
    </footer>
  </div>
</main>

<script type="module">
  import { supabase } from "/js/supabase_client.js";

  const API_BASE = "https://italky-api.onrender.com";
  const $ = (id) => document.getElementById(id);

  const STORAGE = {
    savedChats: "italkyai_local_saved_chats",
    autoRead: "italkyai_chat_auto_read",
    sharedVoiceMode: "italkyai_shared_voice_mode",
    sharedVoiceName: "italkyai_shared_voice_name",
    sharedVoiceId: "italkyai_shared_voice_id"
  };

  const API = {
    chat: `${API_BASE}/api/italkyai/chat`,
    tts: `${API_BASE}/api/tts`
  };

  const UI = {
    chatMessages: $("chatMessages"),
    chatInput: $("chatInput"),
    sendBtn: $("sendBtn"),
    micBtn: $("micBtn"),
    typingState: $("typingState"),
    audioWaitState: $("audioWaitState"),
    chatComposer: $("chatComposer"),

    menu: $("menu"),
    menuBtn: $("menuBtn"),
    menuBackdrop: $("menuBackdrop"),
    homeBtn: $("homeBtn"),
    brandHome: $("brandHome"),
    jetonYukleBtn: $("jetonYukleBtn"),

    newChatBtn: $("newChatBtn"),
    saveChatMenuBtn: $("saveChatMenuBtn"),
    savedChatsToggleBtn: $("savedChatsToggleBtn"),
    savedChatsList: $("savedChatsList"),
    clearChatMenuBtn: $("clearChatMenuBtn"),

    topSettingsBtn: $("topSettingsBtn"),

    menuUserAvatar: $("menuUserAvatar"),
    menuUserAvatarImg: $("menuUserAvatarImg"),
    menuUserName: $("menuUserName"),
    menuJeton: $("menuJeton"),

  function getSelectedVoicePayload() {

    const voiceId = String(localStorage.getItem(STORAGE.sharedVoiceId) || "").trim();

    const mode = ["tts", "mine", "second", "memory"].includes(String(modeRaw || "").trim().toLowerCase())
      ? String(modeRaw || "").trim().toLowerCase()

    return {

  function isAutoReadEnabled() {

  function cleanupTranscript(text = "") {
    return String(text || "")
      .replace(/\s+/g, " ")
      .replace(/\b(\S+)( \1\b)+/gi, "$1")
      .trim();
  }

  function buildStableTranscript(results) {
    const pieces = [];

    for (let i = 0; i < results.length; i++) {
      const chunk = String(results[i]?.[0]?.transcript || "")
        .replace(/\s+/g, " ")
        .trim();

      if (!chunk) continue;

      const prev = pieces[pieces.length - 1] || "";
      if (prev === chunk) continue;
      if (prev && chunk.startsWith(prev)) {
        pieces[pieces.length - 1] = chunk;
        continue;
      }
      if (prev && prev.startsWith(chunk)) continue;

      pieces.push(chunk);
    }

    return cleanupTranscript(pieces.join(" "));
  }

  function setTyping(show) {
    UI.typingState.classList.toggle("show", !!show);

  function setAudioWait(show, text = "Ses hazırlanıyor...") {
    if (!UI.audioWaitState) return;

  function stopTypewriter() {

    window.__chatTypewriterId += 1;
  }

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function getTypingDelay(ch) {
    if (ch === " ") return 0;
    if (/[.!?]/.test(ch)) return 32;
    if (/[,;:]/.test(ch)) return 18;
    if (/\n/.test(ch)) return 14;
    return 8;
  }

  async function typeReplyIntoBubble(bubbleEl, text) {
    if (!bubbleEl) return;

    stopTypewriter();
    const runId = window.__chatTypewriterId;
    const full = String(text || "").trim();

    bubbleEl.textContent = "";
    if (!full) return;

    for (let i = 0; i < full.length; i++) {
      if (runId !== window.__chatTypewriterId) return;
      bubbleEl.textContent += full[i];
      scrollChatToBottom();
      await wait(getTypingDelay(full[i]));
    }
  }

  function speakWithBrowser(text) {

        window.NativeTTS.speak(value, "tr");
        return;

    } catch {}

    try {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(value);
        utter.lang = "tr-TR";
        utter.rate = 0.96;
        utter.pitch = 1;
        window.speechSynthesis.speak(utter);

    } catch {}
  }

  async function speakReplyText(text) {
    const value = String(text || "").trim();
    if (!value || !isAutoReadEnabled()) {
      setAudioWait(false);
      return;
    }

    stopReplyAudio();

    try {
      const userId = await getCurrentUserId();
      const accessToken = await getAccessToken();
      const selected = getSelectedVoicePayload();

      if (selected.mode === "tts") {
        setAudioWait(false);
        speakWithBrowser(value);
        return;
      }

      setAudioWait(true, "Özel ses hazırlanıyor...");

      const resp = await fetch(API.tts, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(accessToken ? { "Authorization": `Bearer ${accessToken}` } : {})
        },
        body: JSON.stringify({
          text: value,
          lang: "tr",
          user_id: userId,
          module: "sohbetai",
          tone: "neutral",
          voice: selected.mode,
          voice_mode: selected.mode,
          selected_voice: selected.mode,
          selected_voice_id: selected.voiceId,
          voice_id: selected.voiceId
        })
      });

      const json = await resp.json().catch(() => ({}));

      const audioBase64 =
        json?.audio_base64 ||
        json?.audio ||
        json?.data?.audio_base64 ||
        json?.result?.audio_base64 ||
        "";

      if (!resp.ok || !json?.ok || !audioBase64) {
        setAudioWait(false);
        speakWithBrowser(value);
        return;
      }

      const blob = new Blob([Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0))], { type: "audio/mpeg" });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.preload = "auto";
      audio.playsInline = true;
      state.currentAudio = audio;

      audio.onended = () => {
        URL.revokeObjectURL(url);
        if (state.currentAudio === audio) state.currentAudio = null;
        setAudioWait(false);
      };

      audio.onerror = () => {
        URL.revokeObjectURL(url);
        if (state.currentAudio === audio) state.currentAudio = null;
        setAudioWait(false);
      };

      setAudioWait(false);
      await audio.play();
    } catch {
      setAudioWait(false);
      speakWithBrowser(value);
    }
  }

  function addMessage(side, text, meta) {

  function collectRecentHistory(limit = 20) {
    const rows = [...UI.chatMessages.querySelectorAll(".msg")];
    const items = rows.map((msg) => {
      const role = msg.classList.contains("right") ? "user" : "assistant";
      const content = msg.querySelector(".bubble")?.textContent?.trim() || "";
      return { role, content };
    }).filter(x => x.content);

    return items.slice(-limit);
  }

  async function getAuthContext() {
    try {
      const { data: { user } } = await supabase.auth.getUser();
      state.currentUser = user || null;

      if (!state.currentUser) {
        return { user: null, profile: null, walletTokens: 0 };
      }

      const { data: profile } = await supabase
        .from("profiles")
        .select("id,full_name,email,tokens,avatar_url")
        .eq("id", state.currentUser.id)
        .maybeSingle();

      let walletTokens = 0;

      try {
        const { data: wallet } = await supabase
          .from("wallets")
          .select("*")
          .eq("user_id", state.currentUser.id)
          .maybeSingle();

        if (wallet) {
          walletTokens =
            Number(wallet.tokens ?? wallet.balance ?? wallet.amount ?? wallet.jeton ?? wallet.credit ?? 0) || 0;
        }
      } catch {
        walletTokens = Number(profile?.tokens || 0) || 0;
      }

      state.currentProfile = profile || null;
      return { user: state.currentUser, profile: state.currentProfile, walletTokens };
    } catch (e) {
      console.error("Auth context hata:", e);
      return { user: null, profile: null, walletTokens: 0 };
    }
  }

  async function hydrateProfileUI() {
    const ctx = await getAuthContext();

    const avatarUrl =

      ctx?.user?.user_metadata?.full_name ||

      UI.menuUserAvatar.appendChild(UI.menuUserAvatarImg);
    }

    if (!UI.chatMessages.querySelector(".msg")) {
      addMessage("left", `Merhaba ${firstName}. Ben buradayım, rahat rahat yazabilirsin.`);
    }

  }

  async function persistCurrentChatSnapshot(autoTitle = "") {
    const messageRows = [...UI.chatMessages.querySelectorAll(".msg")].map((msg) => {
      const side = msg.classList.contains("right") ? "right" : "left";
      const text = msg.querySelector(".bubble")?.textContent || "";
      return { side, text };
    }).filter(x => x.text.trim());

    if (!messageRows.length) return;

    const allSaved = getLocalSavedChats();
    const existing = allSaved.find(x => x.id === state.currentSavedChatId);

    const title =
      existing?.title ||
      autoTitle ||
      messageRows.find(x => x.side === "right")?.text?.slice(0, 60) ||
      "Yeni Sohbet";

    const item = {
      id: state.currentSavedChatId || crypto.randomUUID(),
      session_id: state.currentSessionId,
      title,
      created_at: existing?.created_at || new Date().toISOString(),
      updated_at: new Date().toISOString(),
      messages: messageRows
    };

    const next = [item, ...allSaved.filter(x => x.id !== item.id)].slice(0, 10);
    localStorage.setItem(STORAGE.savedChats, JSON.stringify(next));
    state.currentSavedChatId = item.id;
    renderSavedChats();
  }

  function isBrandIdentityQuestion(text) {
    const q = String(text || "").toLowerCase();
    return [
      "sen kimsin",
      "seni kim yaptı",
      "seni kim geliştirdi",
      "seni kim oluşturdu",
      "hangi firmasın",
      "hangi şirket",
      "sen gemini misin",
      "sen openai misin",
      "sen chatgpt misin",
      "kimin yapay zekasısın",
      "who made you",
      "who created you",
      "who developed you",
      "are you gemini",
      "are you openai",
      "are you chatgpt"
    ].some((x) => q.includes(x));
  }

  function normalizeFriendReply(text) {
    let out = String(text || "").trim();
    const lower = out.toLowerCase();

    const identityTriggers = [
      "openai",
      "gemini",
      "google tarafından",
      "google tarafından geliştirildim",
      "created by google",
      "created by openai",
      "i am gemini",
      "i'm gemini",
      "i am chatgpt",
      "i'm chatgpt",
      "large language model",
      "language model"
    ];

    if (identityTriggers.some((x) => lower.includes(x))) {
      return "Ben italky Teknoloji tarafından geliştirildim. Ben Friend AI, italkyAI ekosisteminin samimi sohbet asistanıyım.";
    }

    return out;
  }

  async function sendCurrentMessage(forcedText = "", inputMode = "text") {
    const text = String(forcedText || UI.chatInput.value || "").trim();
    if (!text || state.isSending) return;

    state.isSending = true;
    stopReplyAudio();
    stopTypewriter();

    addMessage("right", text);

    UI.chatInput.value = "";
    autoResizeTextarea();
    syncInputActionState();
    setTyping(true);
    setAudioWait(false);

    try {
      const auth = await getAuthContext();

      if (!auth.user) {
        addMessage("left", "Oturum bilgisine ulaşılamadı. Lütfen tekrar giriş yap.");
        setTyping(false);
        setAudioWait(false);
        state.isSending = false;
        return;
      }

      if (isBrandIdentityQuestion(text)) {
        const finalReply = "Ben italky Teknoloji tarafından geliştirildim. Ben Friend AI, italkyAI ekosisteminin samimi sohbet asistanıyım.";
        const shell = createAssistantMessageShell("italkyAI • şimdi");
        setTyping(false);
        await typeReplyIntoBubble(shell.bubble, finalReply);
        await speakReplyText(finalReply);
        state.isSending = false;
        return;
      }

      const history = collectRecentHistory(20);
      const selected = getSelectedVoicePayload();

      const resp = await fetch(API.chat, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: auth.user.id,
          session_id: state.currentSessionId,
          text,
          history,
          voice_mode: selected.mode,
          input_mode: inputMode
        })
      });

      const json = await resp.json().catch(() => ({}));
      const reply = cleanupTranscript(
        json?.reply ||
        json?.answer ||
        json?.message ||
        ""
      );

      if (!resp.ok) {
        addMessage("left", reply || "Bağlantıda bir aksaklık oldu. Lütfen tekrar yaz.");
        setTyping(false);
        setAudioWait(false);
        state.isSending = false;
        await hydrateProfileUI();
        return;
      }

      if (json?.requires_topup) {
        addMessage("left", reply || "Lütfen sohbete devam etmek için jeton yüklemesi yapınız.");
        setTyping(false);
        setAudioWait(false);
        state.isSending = false;
        await hydrateProfileUI();
        return;
      }

      const finalReply = normalizeFriendReply(reply || "Şu an cevap üretirken bir sorun oluştu. Bir daha dener misin.");
      const shell = createAssistantMessageShell("italkyAI • şimdi");

      setTyping(false);
      await typeReplyIntoBubble(shell.bubble, finalReply);
      await speakReplyText(finalReply);

      await hydrateProfileUI();
      await persistCurrentChatSnapshot(text.slice(0, 50));
      state.isSending = false;
    } catch (e) {
      console.error("Chat hata:", e);
      addMessage("left", "Bağlantıda bir aksaklık oldu. Lütfen tekrar yaz.");
      setTyping(false);
      setAudioWait(false);
      state.isSending = false;
    }
  }

  function renderSavedChats() {
    UI.savedChatsList.innerHTML = "";
    const list = getLocalSavedChats();

    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "saved-chat-btn";
      empty.textContent = "Henüz kayıtlı sohbet yok";
      UI.savedChatsList.appendChild(empty);
      return;
    }

    list.forEach(chat => {
      const btn = document.createElement("button");
      btn.className = "saved-chat-btn";
      btn.innerHTML = `
        <span>${chat.title}</span>
        <span class="saved-chat-meta">${new Date(chat.updated_at || chat.created_at).toLocaleString("tr-TR")}</span>
      `;
      btn.addEventListener("click", () => loadSavedChat(chat.id));
      UI.savedChatsList.appendChild(btn);
    });
  }

  function loadSavedChat(savedChatId) {
    const local = getLocalSavedChats().find(x => x.id === savedChatId);
    if (!local) return;

    stopReplyAudio();
    stopTypewriter();
    clearChatDom();
    state.currentSavedChatId = local.id;
    state.currentSessionId = local.session_id || crypto.randomUUID();

    (local.messages || []).forEach(msg => {
      addMessage(msg.side, msg.text);
    });

    closeMenu();
  }

  function deleteCurrentSavedChat() {
    stopReplyAudio();
    stopTypewriter();

    if (!state.currentSavedChatId) {
      clearChatDom();
      state.currentSavedChatId = null;
      state.currentSessionId = crypto.randomUUID();
      addMessage("left", "Yeni sohbet hazır. İçini dökebilirsin.");
      closeMenu();
      return;
    }

    const list = getLocalSavedChats().filter(x => x.id !== state.currentSavedChatId);
    localStorage.setItem(STORAGE.savedChats, JSON.stringify(list));

    state.currentSavedChatId = null;
    state.currentSessionId = crypto.randomUUID();
    clearChatDom();
    addMessage("left", "Yeni sohbet hazır. İçini dökebilirsin.");
    renderSavedChats();
    closeMenu();
  }

  function saveChatNow() {
    const title = String(UI.saveChatName.value || "").trim();
    if (!title) return;

    state.currentSavedChatId = state.currentSavedChatId || crypto.randomUUID();
    persistCurrentChatSnapshot(title);

    UI.saveModal.classList.remove("open");
    UI.saveChatName.value = "";
    closeMenu();
  }

  function stopRecognition() {
    try { state.recognition?.stop(); } catch {}
    state.recognition = null;
    setListeningUi(false);
  }

  function startRecognitionOnce() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      addMessage("left", "Bu cihazda sesli giriş desteklenmiyor.");
      return;
    }

    if (state.isListening) {
      stopRecognition();
      return;
    }

    stopRecognition();

    const recognition = new Recognition();
    recognition.lang = "tr-TR";
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 1;

    state.recognition = recognition;
    state.lastTranscript = "";
    setListeningUi(true);

    recognition.onresult = (event) => {
      const transcript = buildStableTranscript(event.results);
      state.lastTranscript = transcript;

      if (transcript) {
        UI.chatInput.value = transcript;
        autoResizeTextarea();
        syncInputActionState();
        scrollChatToBottom();
      }
    };

    recognition.onerror = () => {
      stopRecognition();
    };

    recognition.onend = async () => {
      const finalText = cleanupTranscript(UI.chatInput.value || state.lastTranscript || "");
      stopRecognition();

      if (finalText) {
        await sendCurrentMessage(finalText, "voice");
      }
    };

    try {
      recognition.start();
    } catch {
      stopRecognition();
    }
  }

      clearChatDom();
      state.currentSavedChatId = null;
      state.currentSessionId = crypto.randomUUID();
      await hydrateProfileUI();
      closeMenu();
    });

    UI.saveChatMenuBtn.addEventListener("click", () => {
      UI.saveModal.classList.add("open");
    });

    UI.cancelSaveChat.addEventListener("click", () => {
      UI.saveModal.classList.remove("open");
    });

    UI.confirmSaveChat.addEventListener("click", saveChatNow);

    UI.savedChatsToggleBtn.addEventListener("click", () => {
      toggleSavedChats();
      if (UI.savedChatsList.classList.contains("open")) {
        renderSavedChats();
      }
    });

    UI.clearChatMenuBtn.addEventListener("click", deleteCurrentSavedChat);

    UI.topSettingsBtn.addEventListener("click", () => {
      location.href = "/pages/sohbetai_settings.html";
    });

    window.visualViewport?.addEventListener("resize", updateViewportLayout);
    window.visualViewport?.addEventListener("scroll", updateViewportLayout);
    window.addEventListener("resize", updateViewportLayout);
  }

  async function init() {
    bindEvents();
    autoResizeTextarea();
    syncInputActionState();
    renderSavedChats();
    const firstName = await hydrateProfileUI();
    updateViewportLayout();
    scrollChatToBottom();
  }

  init();
</script>

<script type="module">
  import { initGlobalAccess } from "/js/global_access.js";
  await initGlobalAccess({ allowPublicPageBypass: false });
</script>
</body>
</html>
