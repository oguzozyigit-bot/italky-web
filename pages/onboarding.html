<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>italkyAI • Be Free</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root { --ai: linear-gradient(135deg, #a5b4fc, #6366f1, #ec4899); --bg: #050508; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:#fff; font-family:'Outfit',sans-serif; overflow:hidden; }

    /* Arka Plan Efektleri */
    .glow { position:fixed; inset:0; background: radial-gradient(circle at 50% -10%, rgba(99,102,241,0.18), transparent 40%), radial-gradient(circle at 50% 110%, rgba(236,72,153,0.12), transparent 40%); z-index:-1; }

    /* Slider Yapısı */
    .slider { display:flex; width:600%; height:100%; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1); }
    .slide { width:16.66%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center; }

    /* Cihaz Mockup Efekti */
    .mockup {
      width: min(75vw, 280px); height: min(55vh, 520px);
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 36px; padding: 10px; margin-bottom: 30px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
    }
    .mockup img { width: 100%; height: 100%; object-fit: cover; border-radius: 28px; }

    /* Yazılar */
    h2 { font-family:'Space Grotesk',sans-serif; font-size: 28px; font-weight: 800; margin: 0 0 14px; line-height: 1.1; }
    h2 span { background: var(--ai); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 16px; color: rgba(255,255,255,0.65); line-height: 1.5; margin: 0; max-width: 280px; }

    /* Navigasyon */
    .footer { position: fixed; bottom: calc(40px + env(safe-area-inset-bottom)); left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .dots { display: flex; gap: 8px; }
    .dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); transition: 0.4s; }
    .dot.active { width: 22px; background: #6366f1; box-shadow: 0 0 10px rgba(99,102,241,0.5); }
    .btn { 
      width: 280px; height: 56px; border: none; border-radius: 20px; 
      background: var(--ai); color: #fff; font-size: 16px; font-weight: 900; 
      cursor: pointer; box-shadow: 0 15px 30px rgba(99,102,241,0.2); transition: 0.3s;
    }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="slider" id="slider">
    <section class="slide">
      <div class="mockup"><img src="23254.jpg" /></div>
      <h2 id="s1_t"></h2><p id="s1_p"></p>
    </section>
    <section class="slide">
      <div class="mockup"><img src="23262.jpg" /></div>
      <h2 id="s2_t"></h2><p id="s2_p"></p>
    </section>
    <section class="slide">
      <div class="mockup"><img src="23260.jpg" /></div>
      <h2 id="s3_t"></h2><p id="s3_p"></p>
    </section>
    <section class="slide">
      <div class="mockup"><img src="23256.jpg" /></div>
      <h2 id="s4_t"></h2><p id="s4_p"></p>
    </section>
    <section class="slide">
      <div class="mockup"><img src="23258.jpg" /></div>
      <h2 id="s5_t"></h2><p id="s5_p"></p>
    </section>
    <section class="slide">
      <div class="mockup" style="border-color: #6366f1;"><img src="23254.jpg" /></div>
      <h2 id="s6_t"></h2><p id="s6_p"></p>
    </section>
  </div>

  <div class="footer">
    <div class="dots" id="dots">
      <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <button class="btn" id="nextBtn"></button>
  </div>

  <script type="module">
    import { ONBOARDING_TEXTS } from './js/onboarding_lang.js';

    let current = 0;
    const total = 6;
    const slider = document.getElementById('slider');
    const dots = document.querySelectorAll('.dot');
    const btn = document.getElementById('nextBtn');

    // Dil Algılama
    const lang = (navigator.language || 'en').split('-')[0];
    const dict = ONBOARDING_TEXTS[lang] || ONBOARDING_TEXTS.en;

    // Metinleri Doldur
    function init() {
      Object.keys(dict).forEach(key => {
        const el = document.getElementById(key);
        if(el) el.innerHTML = dict[key];
      });
      btn.textContent = dict.btn_n;
    }

    btn.addEventListener('click', () => {
      if(current < total - 1) {
        current++;
        update();
      } else {
        localStorage.setItem('italky_onboarding_done', 'true');
        window.location.href = 'login.html';
      }
    });

    function update() {
      slider.style.transform = `translateX(-${current * (100/total)}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      
      if(current === total - 1) {
        btn.textContent = dict.btn_s;
        btn.style.background = "#fff";
        btn.style.color = "#000";
      } else {
        btn.textContent = dict.btn_n;
        btn.style.background = "var(--ai)";
        btn.style.color = "#fff";
      }
    }

    init();
  </script>
</body>
</html>
