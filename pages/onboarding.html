<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>Welcome • italkyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
  
  <style>
    /* ... (login.html ile aynı glassmorphism stili, Quantum OS teması) ... */
    :root { --ai-gradient: linear-gradient(135deg, #a5b4fc, #6366f1, #ec4899); --bg: #050508; }
    body, html { margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:#fff; font-family: 'Outfit', sans-serif; overflow:hidden; }

    .bg-glow { position: fixed; inset:0; background: radial-gradient(circle at 50% -20%, rgba(99,102,241,0.15), transparent 50%), radial-gradient(circle at 50% 120%, rgba(236,72,153,0.12), transparent 50%); z-index: -1; }
    .slider { display: flex; width: 600%; height: 100%; transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
    .slide { width: 16.66%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }

    /* Yaratıcı Mockup Alanı (Glassmorphism) */
    .mockup-container {
      width: min(80vw, 320px); height: min(60vh, 560px);
      border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.01); backdrop-filter: blur(10px);
      margin-bottom: 30px; overflow: hidden; position: relative;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .mockup-img { width: 100%; height: 100%; object-fit: cover; }

    h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 800; margin: 0 0 12px; letter-spacing: -1px; }
    p { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.7); margin: 0; max-width: 300px; }
    h2 span { background: var(--ai-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Çoklu Özellik Sayfası Stilleri (Slide 4) */
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: min(90vw, 360px); margin-bottom: 30px; }
    .feature-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 15px; text-align: left;
    }
    .feature-item i { font-size: 20px; color: #6366f1; margin-bottom: 10px; }
    .feature-item h3 { font-size: 15px; margin: 0 0 5px; color: #fff; }
    .feature-item p { font-size: 12px; color: rgba(255,255,255,0.6); }

    /* Footer ve Buton */
    .footer { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .dots { display: flex; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); transition: 0.3s; }
    .dot.active { width: 18px; background: #6366f1; }
    .btn { width: min(80vw, 320px); height: 54px; border-radius: 18px; border: none; background: var(--ai-gradient); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="slider" id="slider">
    <section class="slide">
      <div class="mockup-container"><img src="mockup1.webp" class="mockup-img"/></div>
      <h2 id="s1_title"></h2>
      <p id="s1_text"></p>
    </section>

    <section class="slide">
      <div class="mockup-container"><img src="mockup2.webp" class="mockup-img"/></div>
      <h2 id="s2_title"></h2>
      <p id="s2_text"></p>
    </section>

    <section class="slide">
      <div class="mockup-container"><img src="mockup3.webp" class="mockup-img"/></div>
      <h2 id="s3_title"></h2>
      <p id="s3_text"></p>
    </section>

    <section class="slide">
      <h2 id="s4_title" style="margin-bottom:30px;"></h2>
      <div class="feature-grid">
        <div class="feature-item">
          <i>Placement Test</i>
          <h3 id="s4_t1"></h3>
          <p id="s4_d1"></p>
        </div>
        <div class="feature-item">
          <i>Hangman</i>
          <h3 id="s4_t2"></h3>
          <p id="s4_d2"></p>
        </div>
        </div>
    </section>

    <section class="slide">
      <div class="mockup-container"><img src="mockup5.webp" class="mockup-img"/></div>
      <h2 id="s5_title"></h2>
      <p id="s5_text"></p>
    </section>

    <section class="slide">
      <div class="mockup-container"><img src="mockup6.webp" class="mockup-img"/></div>
      <h2 id="s6_title"></h2>
      <p id="s6_text"></p>
    </section>
  </div>

  <div class="footer">
    <div class="dots"> <div class="dot active"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> </div>
    <button class="btn" id="nextBtn"></button>
  </div>

  <script type="module">
    import { ONBOARDING_TEXTS } from '/js/onboarding_lang.js';

    let currentSlide = 0;
    const totalSlides = 6;
    const slider = document.getElementById('slider');
    const dots = document.querySelectorAll('.dot');
    const nextBtn = document.getElementById('nextBtn');

    // 1. Kullanıcının dilini tespit et (IP veya Sistem Dili)
    function detectLanguage() {
        // En basit yöntem: Tarayıcı sistem dili
        const sysLang = canonical(navigator.language || navigator.userLanguage || "en");
        return ONBOARDING_TEXTS[sysLang] ? sysLang : "en"; // Sözlükte yoksa İngilizce'ye dön
    }

    // Dil kodunu temizle (Örn: tr-TR -> tr)
    function canonical(code){ return String(code || "").split("-")[0].toLowerCase().trim(); }

    const userLang = detectLanguage();
    const texts = ONBOARDING_TEXTS[userLang];

    // 2. Metinleri Canlı Olarak Yükle
    function initTexts() {
        document.documentElement.lang = userLang; // HTML lang attributunu güncelle
        
        // Tüm ID'li metinleri sözlükten doldur
        Object.keys(texts).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = texts[id];
        });
        nextBtn.textContent = texts.btn_next; // Buton metni
    }

    nextBtn.addEventListener('click', () => {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlider();
      } else {
        localStorage.setItem('italky_onboarding_done', 'true');
        window.location.href = 'login.html';
      }
    });

    function updateSlider() {
      slider.style.transform = `translateX(-${currentSlide * (100/totalSlides)}%)`;
      dots.forEach((dot, index) => dot.classList.toggle('active', index === currentSlide));
      
      // Son sayfada buton değişimi
      if (currentSlide === totalSlides - 1) {
        nextBtn.textContent = texts.btn_start;
        nextBtn.style.background = "#fff";
        nextBtn.style.color = "#000";
      } else {
        nextBtn.textContent = texts.btn_next;
        nextBtn.style.background = "var(--ai-gradient)";
        nextBtn.style.color = "#fff";
      }
    }

    initTexts();
  </script>
</body>
</html>
