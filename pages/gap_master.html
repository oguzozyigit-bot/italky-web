<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Gap Master</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07101f;--panel:rgba(15,23,42,.82);--line:rgba(255,255,255,.12);--txt:#f8fafc;--muted:rgba(226,232,240,.68);--cyan:#67e8f9;--green:#34d399;--red:#fb7185;--gold:#facc15;--safeB:env(safe-area-inset-bottom,0px);--shellLift:0px;--grad:linear-gradient(135deg,#67e8f9,#60a5fa 52%,#34d399)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;outline:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,system-ui,sans-serif;color:var(--txt)}body{background:radial-gradient(circle at 16% 0%,rgba(103,232,249,.14),transparent 34%),radial-gradient(circle at 84% 8%,rgba(52,211,153,.13),transparent 30%),linear-gradient(180deg,#08111f,#030712 58%,#01030a)}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;opacity:.20;pointer-events:none}
#pageContent{position:relative;z-index:2;height:100%;padding:8px 10px calc(12px + var(--safeB) + var(--shellLift));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#pageContent::-webkit-scrollbar{display:none}.app{width:100%;max-width:500px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 18px 42px rgba(0,0,0,.30)}.backBtn{min-width:98px;height:36px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:11px;font-weight:1000;cursor:pointer}.title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;letter-spacing:-.25px}.langChip{min-width:56px;height:36px;border-radius:13px;background:var(--grad);color:#04111f;font-size:11px;font-weight:1000;display:flex;align-items:center;justify-content:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{min-height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}.statVal{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:900;line-height:1}.statLab{margin-top:3px;font-size:8px;font-weight:1000;letter-spacing:.65px;color:var(--muted)}.recordRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.recordPill{min-height:34px;border-radius:13px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;font-size:10px;font-weight:1000;overflow:hidden}.recordPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:20px;text-align:center;color:var(--cyan);font-size:12px;font-weight:900}.stage{flex:1;min-height:430px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.84));box-shadow:0 24px 60px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.05);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.sentenceCard{flex:1;min-height:220px;border-radius:23px;border:1px solid rgba(103,232,249,.18);background:radial-gradient(circle at 50% 0%,rgba(103,232,249,.12),transparent 42%),rgba(255,255,255,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.label{font-size:11px;font-weight:1000;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}.meaning{margin-top:8px;font-size:20px;font-weight:900;line-height:1.25;color:#fff}.sentence{margin-top:20px;font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.3px}.gap{display:inline-flex;min-width:92px;height:38px;align-items:center;justify-content:center;border-radius:14px;border:1px dashed rgba(103,232,249,.55);background:rgba(103,232,249,.09);color:var(--cyan);padding:0 12px}.hint{margin-top:16px;min-height:20px;font-size:12px;font-weight:900;color:rgba(226,232,240,.62)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.optionBtn{min-height:58px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:15px;font-weight:1000;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.18)}.optionBtn.correct{background:linear-gradient(135deg,#bbf7d0,#34d399);color:#04111f;border:0}.optionBtn.wrong{background:linear-gradient(135deg,#fecdd3,#fb7185);color:#21040a;border:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actionBtn{min-height:48px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:13px;font-weight:1000;cursor:pointer}.actionBtn.primary{background:var(--grad);color:#061227;border:0}.actionBtn:disabled,.optionBtn:disabled{opacity:.55;cursor:default}.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,23,.76);backdrop-filter:blur(14px)}.overlay.show{display:flex}.modal{width:min(100%,390px);border-radius:26px;border:1px solid rgba(147,197,253,.20);background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.98));box-shadow:0 28px 70px rgba(0,0,0,.55);padding:22px;text-align:center}.modalTitle{margin:0;font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:900}.modalText{margin:12px 0 16px;white-space:pre-line;line-height:1.55;color:rgba(226,232,240,.78);font-size:14px;font-weight:800}.modalActions{display:grid;gap:9px}.modalBtn{min-height:50px;border-radius:16px;border:0;font:inherit;font-size:14px;font-weight:1000;cursor:pointer}.modalBtn.primary{background:var(--grad);color:#061227}.modalBtn.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
@media(max-width:390px){.topbar{padding:9px 10px}.backBtn{min-width:86px;font-size:10px}.title{font-size:16px}.langChip{min-width:52px}.statVal{font-size:13px}.statLab{font-size:7.4px}.recordPill{font-size:9px}.stage{min-height:398px;padding:12px}.sentence{font-size:23px}.options,.actions{gap:8px}.optionBtn{min-height:54px;font-size:13px}.actionBtn{font-size:12px}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<main class="app" id="pageContent">
  <header class="topbar"><button id="backBtn" class="backBtn" type="button">← Oyun Menüsü</button><div class="title">GAP MASTER</div><div id="langChip" class="langChip">EN</div></header>
  <section class="stats" aria-label="Skor bilgileri"><div class="stat"><div id="scoreVal" class="statVal">0</div><div class="statLab">SKOR</div></div><div class="stat"><div id="roundVal" class="statVal">0/15</div><div class="statLab">TUR</div></div><div class="stat"><div id="lifeVal" class="statVal">3</div><div class="statLab">CAN</div></div><div class="stat"><div id="hitVal" class="statVal">0</div><div class="statLab">DOĞRU</div></div></section>
  <section class="recordRow" aria-label="Rekor bilgileri"><div class="recordPill"><span id="personalBestLabel">SENİN REKORUN: —</span></div><div class="recordPill"><span id="globalBestLabel">GENEL REKOR: —</span></div></section>
  <div id="status" class="status">Hazırlanıyor</div>
  <section class="stage">
    <div class="sentenceCard"><div class="label">Türkçe anlam</div><div id="meaningText" class="meaning">...</div><div id="sentenceText" class="sentence"><span class="gap">____</span></div><div id="hintText" class="hint">Doğru kelimeyi seç.</div></div>
    <div id="optionsGrid" class="options"></div>
    <div class="actions"><button id="listenBtn" class="actionBtn" type="button">Dinle</button><button id="skipBtn" class="actionBtn primary" type="button">Sonraki</button></div>
  </section>
</main>
<div id="resultOverlay" class="overlay" aria-hidden="true"><div class="modal"><h2 id="resultTitle" class="modalTitle">Oyun Bitti</h2><div id="resultText" class="modalText"></div><div class="modalActions"><button id="replayBtn" class="modalBtn primary" type="button">Yeniden Oyna</button><button id="menuBtn" class="modalBtn secondary" type="button">Oyun Menüsü</button></div></div></div>
<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import { loadGameWords } from "/js/game_content_helper.js";
import { GAME_LANG_META, formatGlobalBest, getGameLangFromUrl, getGlobalBest, getLocalHighScore, refreshGameScoreLabels, saveGameScore, setLocalHighScore, speakGameText } from "/js/game_score_helper.js";

mountShell({ scroll:"none" });
const $=id=>document.getElementById(id);
const GAME_SLUG="gap_master";
const TOTAL_ROUNDS=15;
const CONTENT_ERROR_TEXT="İçerik şu anda yüklenemedi. Lütfen tekrar deneyin.";
let lang=getGameLangFromUrl("en"), pool=[], runList=[], current=null, runIndex=0;
let score=0,lives=3,correctCount=0,wrongCount=0,startedAt=Date.now(),scoreSaved=false,busy=false;
let audioCtx=null;
function getAudioCtx(){try{if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}return audioCtx;}catch{return null;}}
async function unlockAudio(){try{const ctx=getAudioCtx();if(ctx&&ctx.state==="suspended")await ctx.resume();}catch{}}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume().catch(()=>{});const now=ctx.currentTime+when,osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
function playGood(){beep({freq:620,duration:.08,type:"triangle",gain:.05});beep({freq:840,duration:.10,type:"triangle",gain:.05,when:.08});}
function playBad(){beep({freq:190,duration:.13,type:"sawtooth",gain:.05});}
function playFinish(){beep({freq:520,duration:.10,type:"triangle",gain:.05});beep({freq:760,duration:.12,type:"triangle",gain:.05,when:.12});beep({freq:980,duration:.14,type:"triangle",gain:.05,when:.25});}
["click","touchstart","pointerdown"].forEach(evt=>window.addEventListener(evt,()=>unlockAudio(),{passive:true,once:true}));
function normalizeKey(text){return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ğüşıöç]+/gi,"").trim();}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setStatus(msg,color="var(--cyan)"){$("status").textContent=msg;$("status").style.color=color;}
function setBusy(next){busy=next;document.querySelectorAll(".optionBtn").forEach(btn=>btn.disabled=next);$("listenBtn").disabled=next||!current;$("skipBtn").disabled=next||!current;}
function updateHud(){const meta=GAME_LANG_META[lang]||GAME_LANG_META.en;$("langChip").textContent=lang.toUpperCase();$("scoreVal").textContent=score;$("roundVal").textContent=`${Math.min(runIndex+1,TOTAL_ROUNDS)}/${TOTAL_ROUNDS}`;$("lifeVal").textContent=lives;$("hitVal").textContent=correctCount;$("hintText").textContent=`${meta.flag} ${meta.name} kelimeyi seç.`;}
async function refreshScores(){const localBest=getLocalHighScore(GAME_SLUG,lang);$("personalBestLabel").textContent=`SENİN REKORUN: ${localBest||"—"}`;$("globalBestLabel").textContent="GENEL REKOR: —";try{return await refreshGameScoreLabels({gameSlug:GAME_SLUG,lang,personalEl:$("personalBestLabel"),globalEl:$("globalBestLabel")});}catch(error){console.warn("[GAP_MASTER] score refresh failed",error);return null;}}
function updateLocalBest(){const best=getLocalHighScore(GAME_SLUG,lang);if(score>best){setLocalHighScore(GAME_SLUG,lang,score);$("personalBestLabel").textContent=`SENİN REKORUN: ${score}`;return true;}return false;}
async function saveScoreOnce(){if(scoreSaved)return;scoreSaved=true;updateLocalBest();const durationSeconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));try{await saveGameScore({gameSlug:GAME_SLUG,lang,score,correctCount,wrongCount,durationSeconds});}catch(error){console.warn("[GAP_MASTER] score save failed",error);}try{const best=await getGlobalBest(GAME_SLUG,lang);$("globalBestLabel").textContent=formatGlobalBest(best);}catch{}}
function sanitizeWord(word){return String(word||"").trim();}
function buildItems(words){const seen=new Set();return words.map(item=>({word:sanitizeWord(item.word),meaning:String(item.meaning||"").trim()})).filter(item=>{const key=normalizeKey(item.word)+":"+normalizeKey(item.meaning);if(!item.word||!item.meaning||seen.has(key))return false;seen.add(key);return true;});}
function pickRun(items){return shuffle(items).slice(0,TOTAL_ROUNDS);}
function buildOptions(answer){const opts=[answer];const wrongs=shuffle(pool.map(item=>item.word).filter(word=>normalizeKey(word)!==normalizeKey(answer)));for(const word of wrongs){if(opts.length>=4)break;if(!opts.some(item=>normalizeKey(item)===normalizeKey(word)))opts.push(word);}return shuffle(opts);}
function renderCurrent(){if(!current)return;$("meaningText").textContent=current.meaning;$("sentenceText").innerHTML='<span class="gap">____</span>';$("optionsGrid").innerHTML="";const options=buildOptions(current.word);if(options.length<2){setContentUnavailable("not_enough_options");return;}options.forEach(option=>{const btn=document.createElement("button");btn.type="button";btn.className="optionBtn";btn.textContent=option;btn.onclick=()=>handleChoice(option,btn);$("optionsGrid").appendChild(btn);});updateHud();setBusy(false);setStatus("Doğru kelimeyi seç");}
function nextRound(){if(lives<=0||runIndex>=runList.length){finishGame();return;}current=runList[runIndex];renderCurrent();}
function handleChoice(value,button){if(busy||!current)return;setBusy(true);const correct=normalizeKey(value)===normalizeKey(current.word);document.querySelectorAll(".optionBtn").forEach(btn=>{if(normalizeKey(btn.textContent)===normalizeKey(current.word))btn.classList.add("correct");});if(correct){button.classList.add("correct");correctCount++;score+=100+Math.max(0,10-runIndex)*2;playGood();setStatus("Doğru", "var(--green)");}else{button.classList.add("wrong");wrongCount++;lives=Math.max(0,lives-1);playBad();setStatus(`Doğru cevap: ${current.word}`, "var(--red)");}runIndex++;updateHud();setTimeout(()=>nextRound(),1150);}
function setContentUnavailable(reason="no_content"){current=null;runList=[];$("meaningText").textContent=CONTENT_ERROR_TEXT;$("sentenceText").innerHTML='<span class="gap">—</span>';$("optionsGrid").innerHTML="";setStatus(CONTENT_ERROR_TEXT,"var(--gold)");setBusy(true);console.warn("[GAP_MASTER] content unavailable",{lang,reason});}
async function finishGame(){setBusy(true);playFinish();const newBest=updateLocalBest();await saveScoreOnce();await refreshScores();$("resultTitle").textContent=newBest?"Yeni Rekor!":"Oyun Bitti";$("resultText").textContent=`Skor: ${score}\nDoğru: ${correctCount}\nYanlış: ${wrongCount}\n${$("personalBestLabel").textContent}\n${$("globalBestLabel").textContent}`;$("resultOverlay").classList.add("show");$("resultOverlay").setAttribute("aria-hidden","false");}
function hideResult(){$("resultOverlay").classList.remove("show");$("resultOverlay").setAttribute("aria-hidden","true");}
async function initGame(){hideResult();setStatus("Hazırlanıyor");setBusy(true);$("meaningText").textContent="...";$("sentenceText").innerHTML='<span class="gap">____</span>';$("optionsGrid").innerHTML="";const ok=await ensureAuthAndCacheUser();if(!ok){location.href="/pages/login.html";return;}score=0;lives=3;correctCount=0;wrongCount=0;runIndex=0;scoreSaved=false;startedAt=Date.now();current=null;updateHud();refreshScores();try{const words=await loadGameWords(lang,{caller:"gap_master",timeoutMs:9000});pool=buildItems(Array.isArray(words)?words:[]);console.warn("[GAP_MASTER] content loaded",{lang,rawCount:Array.isArray(words)?words.length:0,usableCount:pool.length});}catch(error){console.warn("[GAP_MASTER] content load failed",error);pool=[];}if(pool.length<4){setContentUnavailable("empty_or_small_pool");return;}runList=pickRun(pool);nextRound();}
$("backBtn").onclick=()=>{location.href="/pages/game_menu.html"};$("menuBtn").onclick=()=>{location.href="/pages/game_menu.html"};$("replayBtn").onclick=()=>initGame();$("listenBtn").onclick=()=>{if(current)speakGameText(current.word,lang);};$("skipBtn").onclick=()=>{if(busy||!current)return;wrongCount++;lives=Math.max(0,lives-1);runIndex++;updateHud();nextRound();};
window.addEventListener("load",()=>{initGame().catch(error=>{console.warn("[GAP_MASTER] init failed",error);setContentUnavailable("init_failed");});console.warn("[GAP_MASTER] ready",{lang,ads:false,flow:"game-menu-direct",content:"shared-game-content-helper"});});
</script>
</body>
</html>
