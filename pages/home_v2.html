<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Home</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #000;
  gap: 2px; /* Keskin ayrım çizgisi */
}

/* ===== 22. YY MODÜL TEMELLERİ ===== */
.mod {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Dokunulduğunda o alanın genişlemesi */
.mod:active {
  flex: 1.4;
}

.modInner {
  position: relative;
  z-index: 10;
  text-align: center;
  pointer-events: none;
  mix-blend-mode: difference; /* Arka plana göre renk değiştirir */
}

.modTitle {
  font-family: "Space Grotesk";
  font-size: clamp(26px, 7vw, 36px);
  font-weight: 300;
  color: #fff;
  letter-spacing: 6px;
  text-transform: uppercase;
  margin: 0;
}

.modSub {
  font-family: "Outfit";
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  letter-spacing: 2px;
  margin-top: 14px;
  text-transform: uppercase;
}

/* ===== DİNAMİK PLAZMA EFEKTLERİ ===== */
.canvas-bg {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.glass-grain {
  position: absolute;
  inset: 0;
  background: url('https://grainy-gradients.vercel.app/noise.svg');
  opacity: 0.2;
  z-index: 5;
  pointer-events: none;
}

.shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: translateX(-100%) skewX(-15deg);
  animation: shimmer 4s infinite;
  z-index: 6;
}

@keyframes shimmer {
  0% { transform: translateX(-150%) skewX(-15deg); }
  100% { transform: translateX(150%) skewX(-15deg); }
}

/* 1. TRANSLATE: Kuantum Mavisi & Pulse */
.translate { background: #050510; }
.translate .blob {
  position: absolute;
  width: 350px; height: 350px;
  background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
  filter: blur(40px);
  animation: float 8s infinite alternate ease-in-out;
}

/* 2. AKADEMİ: Biyolüminesans & Dalga */
.academy { background: #051005; }
.academy .blob {
  position: absolute;
  width: 450px; height: 300px;
  background: radial-gradient(circle, #10b981 0%, transparent 70%);
  filter: blur(50px);
  animation: float 12s infinite alternate-reverse ease-in-out;
}

/* 3. YARDIMCI: Enerji Moru & Patlama */
.helper { background: #100510; }
.helper .blob {
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, #a855f7 0%, transparent 70%);
  filter: blur(45px);
  animation: float 10s infinite alternate ease-in-out;
}

@keyframes float {
  0% { transform: translate(-30%, -30%) scale(1); }
  100% { transform: translate(30%, 30%) scale(1.3); }
}

/* Tarama Çizgileri */
.scanlines {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.2) 50%);
  background-size: 100% 4px;
  z-index: 7;
  pointer-events: none;
  opacity: 0.3;
}

</style>
</head>

<body>
<main id="pageContent">
  <div class="main">

    <div class="mod translate" onclick="goTranslate()">
      <div class="blob"></div>
      <div class="glass-grain"></div>
      <div class="scanlines"></div>
      <div class="shimmer"></div>
      <div class="modInner">
        <h2 class="modTitle">Translate</h2>
        <div class="modSub">Quantum • FaceToFace • Walkie</div>
      </div>
    </div>

    <div class="mod academy" onclick="goAcademy()">
      <div class="blob"></div>
      <div class="glass-grain"></div>
      <div class="scanlines"></div>
      <div class="shimmer" style="animation-delay: 1s;"></div>
      <div class="modInner">
        <h2 class="modTitle">Akademi</h2>
        <div class="modSub">DeepLearn • AI Practice • Gamify</div>
      </div>
    </div>

    <div class="mod helper" onclick="goHelper()">
      <div class="blob"></div>
      <div class="glass-grain"></div>
      <div class="scanlines"></div>
      <div class="shimmer" style="animation-delay: 2s;"></div>
      <div class="modInner">
        <h2 class="modTitle">Co-Pilot</h2>
        <div class="modSub">Sci-Core • Math • Scan & Solve</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

window.goTranslate = () => location.href="/pages/translate_home.html";
window.goAcademy  = () => location.href="/pages/academy_home.html";
window.goHelper   = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
