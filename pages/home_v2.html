<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<meta name="theme-color" content="#000000">
<style>
html,body{
  background:#000 !important;
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:'Outfit', sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.12);
  --blue:#6366f1;
  --green:#10b981;
  --purple:#a855f7;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

#pageContent{
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-top: 0; /* ✅ boşluk tamamen kaldırıldı */
  padding-bottom: 0;
  background: radial-gradient(circle at 50% 40%, #09091a 0%, #000 100%);
}

.main-hub{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding: 8px 12px 6px 12px; /* ✅ üst boşluk minimize */
}

/* ===== PREMIUM CARD ===== */
.cyber-card{
  flex:1;
  position:relative;
  border-radius:26px;
  border:1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  display:flex;
  align-items:center;
  padding: 0 18px;
  overflow:hidden;
  cursor:pointer;
  transition: all .35s ease;
}

/* İç ışık akışı */
.cyber-card::before{
  content:"";
  position:absolute;
  inset:-40%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, transparent 40%);
  opacity:0;
  transition:.5s;
}
.cyber-card:active::before{
  opacity:1;
}

/* Hover glow (masaüstü için) */
@media (hover:hover){
  .cyber-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 0 30px rgba(99,102,241,.25);
  }
}

/* Renk varyasyonları */
.tr-card{ border-color: rgba(99,102,241,.35); }
.ac-card{ border-color: rgba(16,185,129,.35); }
.tc-card{ border-color: rgba(168,85,247,.35); }

/* SOLAR */
.solar{
  width:64px;
  height:64px;
  position:relative;
  flex-shrink:0;
  margin-right:16px;
}
.sun{
  width:18px;height:18px;
  background: var(--sun);
  border-radius:50%;
  filter: blur(4px);
  box-shadow: 0 0 18px var(--sun);
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
}
.orbit{
  position:absolute;
  border:1px solid rgba(255,255,255,.07);
  border-radius:50%;
  animation: spin linear infinite;
}
.orbit1{width:40px;height:40px;top:12px;left:12px;animation-duration:4s;}
.orbit2{width:64px;height:64px;animation-duration:7s;animation-direction:reverse;}
.planet{
  width:4px;height:4px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:-2px;left:50%;
  transform:translateX(-50%);
}
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* TEXT */
.card-content{flex:1;}
.card-title{
  font-family:'Space Grotesk';
  font-size:20px;
  font-weight:700;
  margin:0;
  color:#fff;
}
.card-title .ai{
  background:var(--ai-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.card-desc{
  font-size:11px;
  margin-top:4px;
  color:rgba(255,255,255,.45);
}

/* Sun colors */
.tr-card{ --sun: var(--blue); }
.ac-card{ --sun: var(--green); }
.tc-card{ --sun: var(--purple); }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <!-- TRANSLATE -->
    <div class="cyber-card tr-card" onclick="goTranslate()">
      <div class="solar">
        <div class="sun"></div>
        <div class="orbit orbit1"><div class="planet"></div></div>
        <div class="orbit orbit2"><div class="planet"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Translate <span class="ai">AI</span></h2>
        <p class="card-desc">FaceToFace • Walkie Talkie • Metinden Çeviri</p>
      </div>
    </div>

    <!-- ACADEMY -->
    <div class="cyber-card ac-card" onclick="goAcademy()">
      <div class="solar">
        <div class="sun"></div>
        <div class="orbit orbit1"><div class="planet"></div></div>
        <div class="orbit orbit2"><div class="planet"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Academy <span class="ai">AI</span></h2>
        <p class="card-desc">Seviye Tespit • Dil Dersi • AI Pratik • Oyun</p>
      </div>
    </div>

    <!-- TEACHER -->
    <div class="cyber-card tc-card" onclick="goTeacher()">
      <div class="solar">
        <div class="sun"></div>
        <div class="orbit orbit1"><div class="planet"></div></div>
        <div class="orbit orbit2"><div class="planet"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Teacher <span class="ai">AI</span></h2>
        <p class="card-desc">Foto Çek • Soru Çöz • Mini Ders</p>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

window.goTranslate = () => location.href="/pages/translate_home.html";
window.goAcademy  = () => location.href="/pages/academy_home.html";
window.goTeacher  = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
