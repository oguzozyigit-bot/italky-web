<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Neural Hub</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@300;700&display=swap');
</style>

<style>
:root {
  --ai-gradient: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue-glow: rgba(79, 70, 229, 0.4);
  --green-glow: rgba(16, 185, 129, 0.3);
  --purple-glow: rgba(168, 85, 247, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex;
  flex-direction: column;
  /* Üst bar boşluğu minimize edildi: 60px yerine 45px + safe area */
  padding-top: calc(env(safe-area-inset-top) + 45px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
  background: #000;
  position: relative;
}

/* Derinlik katan arka plan katmanları */
.space-bg {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #000 100%);
  z-index: 0;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  gap: 8px;
  padding: 10px;
}

/* ===== NEURAL MODÜL ===== */
.mod {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 0 25px;
  cursor: pointer;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.modInner {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 20px;
}

.modTitle {
  font-family: "Space Grotesk";
  font-size: 22px;
  font-weight: 300;
  color: #fff;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0;
}

.modSub {
  font-family: "Outfit";
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1.2px;
  margin-top: 4px;
  text-transform: uppercase;
}

/* ===== NEURAL ORB ANIMASYONLARI ===== */
.orb-container {
  width: 64px; height: 64px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}

.ai-ring {
  position: absolute; inset: -2px; border-radius: 50%; padding: 2px;
  background: var(--ring-color);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  animation: rotateOrb 8s linear infinite;
}

.ai-core {
  width: 44px; height: 44px; border-radius: 50%;
  background: #000; border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
  box-shadow: 0 0 15px var(--glow-color);
}

.orbit-energy {
  position: absolute; inset: -6px; border-radius: 50%;
  animation: rotateOrb var(--speed) linear infinite;
}

.e-ball {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  left: 50%; transform: translateX(-50%);
  background: #fff; box-shadow: 0 0 10px #fff;
}

@keyframes rotateOrb { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== RENK UYUMU VE AMBİYANS ===== */
.translate { --glow-color: var(--blue-glow); --ring-color: linear-gradient(135deg, #4f46e5, #818cf8); --speed: 4s; }
.academy { --glow-color: var(--green-glow); --ring-color: linear-gradient(135deg, #10b981, #34d399); --speed: 7s; }
.helper { --glow-color: var(--purple-glow); --ring-color: linear-gradient(135deg, #a855f7, #c084fc); --speed: 3s; }

/* Modül Arkası Işık Sızıntısı */
.mod-glow {
  position: absolute;
  top: 50%; left: 0;
  width: 100px; height: 100px;
  background: var(--glow-color);
  filter: blur(50px);
  opacity: 0.5;
  z-index: 1;
}

.mod:active {
  transform: scale(0.98);
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.15);
}

</style>
</head>

<body>
<div class="space-bg"></div>
<main id="pageContent">
  <div class="main">

    <div class="mod translate" onclick="goTranslate()">
      <div class="mod-glow"></div>
      <div class="modInner">
        <div class="orb-container">
          <div class="ai-ring"></div>
          <div class="orbit-energy"><div class="e-ball"></div></div>
          <div class="ai-core">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <path d="M5 8l6 6 6-6M2 12h20"/>
            </svg>
          </div>
        </div>
        <div class="text-group">
          <h2 class="modTitle">Translate</h2>
          <div class="modSub">Quantum • FaceToFace • Voice</div>
        </div>
      </div>
    </div>

    <div class="mod academy" onclick="goAcademy()">
      <div class="mod-glow"></div>
      <div class="modInner">
        <div class="orb-container">
          <div class="ai-ring"></div>
          <div class="orbit-energy"><div class="e-ball"></div></div>
          <div class="ai-core">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
        </div>
        <div class="text-group">
          <h2 class="modTitle">Akademi</h2>
          <div class="modSub">DeepLearn • AI Practice • Pro</div>
        </div>
      </div>
    </div>

    <div class="mod helper" onclick="goHelper()">
      <div class="mod-glow"></div>
      <div class="modInner">
        <div class="orb-container">
          <div class="ai-ring"></div>
          <div class="orbit-energy"><div class="e-ball"></div></div>
          <div class="ai-core">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.72-12.72l-1.41 1.41"/>
            </svg>
          </div>
        </div>
        <div class="text-group">
          <h2 class="modTitle">Co-Pilot</h2>
          <div class="modSub">Sci-Core • Math • Scan & Solve</div>
        </div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

window.goTranslate = () => location.href="/pages/translate_home.html";
window.goAcademy  = () => location.href="/pages/academy_home.html";
window.goHelper   = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
