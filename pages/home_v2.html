<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Neural Matrix 2126</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Space+Grotesk:wght@300;700&display=swap');
</style>

<style>
:root {
  --blue: #4f46e5;
  --green: #10b981;
  --purple: #a855f7;
  --panel-glass: rgba(255, 255, 255, 0.03);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 40px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
  background: radial-gradient(circle at 50% 50%, #0d0d1a 0%, #000 100%);
  position: relative;
}

/* Arka Plan Veri Akışı / Grid */
.matrix-grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 30px 30px;
  mask-image: radial-gradient(circle, #fff, transparent);
  z-index: 0;
  opacity: 0.5;
}

.main-matrix {
  flex: 1;
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-areas: 
    "tr tr"
    "ac hp";
  grid-template-rows: 1.2fr 1fr;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

/* ===== GRİFT MODÜL YAPISI ===== */
.node {
  position: relative;
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.08);
  background: var(--panel-glass);
  backdrop-filter: blur(20px);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.node:active { transform: scale(0.97); filter: brightness(1.2); }

/* Veri Damarları (Circuit Lines) */
.circuit {
  position: absolute; inset: 0;
  background: 
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 10% 100%,
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 100% 10%;
  z-index: 1;
  opacity: 0.3;
}

.node-content {
  position: relative; z-index: 10;
  padding: 20px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Enerji Merkezleri (Grift Animasyonlar) */
.energy-orb {
  width: 50px; height: 50px;
  position: relative;
}
.orb-ring {
  position: absolute; inset: -10px;
  border: 1px solid var(--orb-color);
  border-radius: 50%;
  border-top-color: transparent;
  animation: spin var(--spd) linear infinite;
}
.orb-core {
  width: 100%; height: 100%;
  background: var(--orb-color);
  border-radius: 50%;
  filter: blur(15px);
  opacity: 0.4;
  animation: pulse 2s infinite ease-in-out;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.7; } }

/* Bölüm Yazıları */
.node-title {
  font-family: 'Space Grotesk';
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0;
}
.node-sub {
  font-size: 9px;
  font-weight: 900;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 4px;
}

/* Grift Detaylar (Sayılar ve Parametreler) */
.param {
  position: absolute;
  top: 15px; right: 15px;
  font-family: monospace;
  font-size: 8px;
  color: var(--orb-color);
  opacity: 0.6;
}

/* Alanlara Özel Stiller */
.node-translate { grid-area: tr; --orb-color: var(--blue); --spd: 3s; }
.node-academy { grid-area: ac; --orb-color: var(--green); --spd: 5s; }
.node-helper { grid-area: hp; --orb-color: var(--purple); --spd: 2s; }

/* Arka plandaki devasa ışık sızıntıları */
.bg-light {
  position: absolute;
  width: 300px; height: 300px;
  filter: blur(120px);
  opacity: 0.15;
  z-index: 0;
}
</style>
</head>

<body>
<div class="matrix-grid"></div>
<div class="bg-light" style="top: 10%; left: 50%; background: var(--blue);"></div>

<main id="pageContent">
  <div class="main-matrix">

    <div class="node node-translate" onclick="goTranslate()">
      <div class="circuit"></div>
      <div class="param">MODE: QUANTUM_VOICE<br>LATENCY: 0.002ms</div>
      <div class="node-content">
        <div class="energy-orb">
          <div class="orb-ring"></div>
          <div class="orb-ring" style="animation-duration: 5s; inset: -15px; opacity: 0.5;"></div>
          <div class="orb-core"></div>
        </div>
        <div>
          <h2 class="node-title">Translate</h2>
          <div class="node-sub">FaceToFace • Neural Walkie • Multi-Sync</div>
        </div>
      </div>
    </div>

    <div class="node node-academy" onclick="goAcademy()">
      <div class="circuit"></div>
      <div class="param">LVL: ADVANCED<br>SYNC: ACTIVE</div>
      <div class="node-content">
        <div class="energy-orb">
          <div class="orb-ring"></div>
          <div class="orb-core"></div>
        </div>
        <div>
          <h2 class="node-title">Akademi</h2>
          <div class="node-sub">AI Practice • Gamify</div>
        </div>
      </div>
    </div>

    <div class="node node-helper" onclick="goHelper()">
      <div class="circuit"></div>
      <div class="param">CORE: SCI_LOGIC<br>SCAN: 8K_READY</div>
      <div class="node-content">
        <div class="energy-orb">
          <div class="orb-ring"></div>
          <div class="orb-core"></div>
        </div>
        <div>
          <h2 class="node-title">Co-Pilot</h2>
          <div class="node-sub">Math • Sci • Solve</div>
        </div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

window.goTranslate = () => location.href="/pages/translate_home.html";
window.goAcademy  = () => location.href="/pages/academy_home.html";
window.goHelper   = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
