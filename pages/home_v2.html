<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Quantum Hub</title>

<meta name="theme-color" content="#000000">
<style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue-sun:#6366f1;
  --green-sun:#10b981;
  --purple-sun:#a855f7;
  --glass-border: rgba(255,255,255,0.12);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

#pageContent{
  height: 100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  /* UI Shell barları arasına sığdır ve boşluğu daralt */
  padding-top: calc(env(safe-area-inset-top) + 38px); 
  padding-bottom: calc(env(safe-area-inset-bottom) + 82px);
  background: radial-gradient(circle at 50% 50%, #08081a 0%, #000 100%);
}

/* Renk uyumu için arka plan parıltısı */
.hub-aura{
  position:absolute; inset:0; pointer-events:none;
  background: 
    radial-gradient(circle at 50% 20%, rgba(99,102,241,0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(168,85,247,0.08) 0%, transparent 50%);
  filter: blur(40px); z-index:0;
}

.main-hub{
  position:relative; z-index:2; flex:1;
  display:flex; flex-direction:column;
  gap: 10px; padding: 12px;
}

/* ===== PREMIUM CYBER CARD ===== */
.cyber-card{
  flex:1; position:relative;
  border-radius: 30px;
  border: 1px solid var(--glass-border);
  overflow:hidden; cursor:pointer;
  display:flex; align-items:center;
  padding: 0 20px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Renk Atmosferleri - Kapkara değil, asil bir parıltı */
.tr-card{ background: linear-gradient(145deg, rgba(99, 102, 241, 0.08) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(99, 102, 241, 0.22); }
.ac-card{ background: linear-gradient(145deg, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(16, 185, 129, 0.22); }
.tc-card{ background: linear-gradient(145deg, rgba(168, 85, 247, 0.08) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(168, 85, 247, 0.22); }

.cyber-card:active{ transform: scale(0.98); filter: brightness(1.2); }

/* Solar System Animasyonu */
.solar-system{
  width: 76px; height: 76px; position:relative;
  display:flex; align-items:center; justify-content:center;
  flex: 0 0 auto; margin-right: 18px;
}
.sun{
  width: 24px; height: 24px; background: var(--sun-color);
  border-radius: 50%; filter: blur(6px);
  box-shadow: 0 0 20px var(--sun-color); z-index: 5;
  animation: sun-pulse 3s infinite ease-in-out;
}
.orbit{
  position:absolute; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 50%; animation: rotate linear infinite;
}
.orbit-1{ width: 50px; height: 50px; animation-duration: 4s; }
.orbit-2{ width: 76px; height: 76px; animation-duration: 7s; animation-direction: reverse; }

.planet{
  position:absolute; width: 5px; height: 5px; background: #fff;
  border-radius: 50%; top: 0; left: 50%; transform: translateX(-50%);
  box-shadow: 0 0 8px #fff;
}

@keyframes rotate{ from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }
@keyframes sun-pulse{ 0%,100%{ transform: scale(1); opacity: 0.5;} 50%{ transform: scale(1.15); opacity: 0.8;} }

/* İçerik */
.card-content{ flex:1; position:relative; z-index:10; min-width:0; }
.card-title{
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 700; color:#fff;
  margin:0; letter-spacing:-0.5px;
}
.card-title .ai{
  background: var(--ai-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight: 900;
}
.card-desc{
  font-family: 'Outfit', sans-serif;
  font-size: 11px; color: rgba(255,255,255,0.45);
  line-height: 1.4; margin-top: 4px;
}

/* Data Stream */
.data-stream{
  position:absolute; right: 16px; top: 14px;
  font-family: monospace; font-size: 7px;
  color: var(--sun-color); opacity: .5;
  text-align:right; pointer-events:none;
}

.tr-card{ --sun-color: var(--blue-sun); }
.ac-card{ --sun-color: var(--green-sun); }
.tc-card{ --sun-color: var(--purple-sun); }

</style>
</head>

<body>
<main id="pageContent">
  <div class="hub-aura"></div>

  <div class="main-hub">

    <div class="cyber-card tr-card" onclick="goTranslate()">
      <div class="data-stream">QUANTUM_ENGINE: ON<br>SYNC_STABLE: 99.9%</div>
      <div class="solar-system">
        <div class="sun"></div>
        <div class="orbit orbit-1"><div class="planet"></div></div>
        <div class="orbit orbit-2"><div class="planet" style="background:var(--blue-sun);"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Translate <span class="ai">AI</span></h2>
        <p class="card-desc">FaceToFace • WalkieTalkie • Instant Voice</p>
      </div>
    </div>

    <div class="cyber-card ac-card" onclick="goAcademy()">
      <div class="data-stream">NEURAL_PATH: ACTIVE<br>NODES: 4096+</div>
      <div class="solar-system">
        <div class="sun"></div>
        <div class="orbit orbit-1"><div class="planet" style="box-shadow: 0 0 10px var(--green-sun);"></div></div>
        <div class="orbit orbit-2"><div class="planet"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Academy <span class="ai">AI</span></h2>
        <p class="card-desc">Seviye • Ders • AI Pratik • Oyun</p>
      </div>
    </div>

    <div class="cyber-card tc-card" onclick="goTeacher()">
      <div class="data-stream">CORE_LOGIC: HIGH<br>SCANNER: READY</div>
      <div class="solar-system">
        <div class="sun"></div>
        <div class="orbit orbit-1"><div class="planet"></div></div>
        <div class="orbit orbit-2"><div class="planet" style="background:var(--purple-sun);"></div></div>
      </div>
      <div class="card-content">
        <h2 class="card-title">Teacher <span class="ai">AI</span></h2>
        <p class="card-desc">Matematik • Fizik • Kimya • Soru Tara</p>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  window.goTranslate = () => location.href="/pages/translate_home.html";
  window.goAcademy  = () => location.href="/pages/academy_home.html";
  window.goTeacher  = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
