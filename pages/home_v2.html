<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<meta name="theme-color" content="#02000f">
<style>
html,body{background:#02000f !important;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
#pageContent{
  height:100%;
  padding:0;
  display:flex;
  flex-direction:column;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== GENEL MODÜL ===== */
.mod{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  cursor:pointer;
  transition:.45s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;
}

.mod:active{transform:scale(.98)}

.modTitle{
  font-family:"Space Grotesk";
  font-size:22px;
  font-weight:900;
  z-index:2;
}

.modSub{
  font-size:13px;
  font-weight:900;
  opacity:.9;
  margin-top:8px;
  z-index:2;
}

.modInner{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  z-index:2;
}

/* ===== TRANSLATE ===== */
.translate{
  background:linear-gradient(135deg,#4f46e5,#7c3aed,#ec4899);
}

.translate .circle{
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.25);
  animation:spin 10s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

/* ===== AKADEMİ ===== */
.academy{
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#6366f1);
}

.academy .wave{
  position:absolute;
  bottom:0;
  width:200%;
  height:120px;
  background:rgba(255,255,255,.15);
  border-radius:50%;
  animation:waveMove 6s infinite linear;
}

@keyframes waveMove{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ===== YARDIMCI ===== */
.helper{
  background:linear-gradient(135deg,#f97316,#ef4444,#a855f7);
}

.helper .pulse{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%{transform:scale(.8);opacity:.7}
  70%{transform:scale(1.3);opacity:0}
  100%{opacity:0}
}

.mod:hover{
  filter:brightness(1.08);
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="main">

    <!-- 1 TRANSLATE -->
    <div class="mod translate" onclick="goTranslate()">
      <div class="circle"></div>
      <div class="modInner">
        <div class="modTitle">Translate</div>
        <div class="modSub">Facetoface • Walkie Talkie • Metin Çeviri</div>
      </div>
    </div>

    <!-- 2 AKADEMİ -->
    <div class="mod academy" onclick="goAcademy()">
      <div class="wave"></div>
      <div class="modInner">
        <div class="modTitle">Dil Akademisi</div>
        <div class="modSub">Seviye • Ders • AI Pratik • Oyun</div>
      </div>
    </div>

    <!-- 3 YARDIMCI -->
    <div class="mod helper" onclick="goHelper()">
      <div class="pulse"></div>
      <div class="modInner">
        <div class="modTitle">Yardımcı Öğretmen</div>
        <div class="modSub">Matematik • Fizik • Kimya • Soru Tara</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

window.goTranslate = () => location.href="/pages/translate_home.html";
window.goAcademy  = () => location.href="/pages/academy_home.html";
window.goHelper   = () => location.href="/pages/helper_home.html";
</script>
</body>
</html>
