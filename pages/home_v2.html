<!-- FILE: /pages/home_pro.html -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Home</title>

<meta name="theme-color" content="#02000f">
<style>
html,body{background:#02000f !important;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --glass: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.12);
  --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
}

#pageContent{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:14px;
}

.mainWrap{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:14px;
  max-width:520px;
  margin:0 auto;
}

.module{
  flex:1;
  border-radius:28px;
  border:1px solid var(--border);
  background:var(--glass);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  overflow:hidden;
  transition: all .45s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}

.module:hover{
  transform: translateY(-4px);
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
}

.moduleTitle{
  font-family:"Space Grotesk";
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.moduleDesc{
  font-size:12px;
  font-weight:900;
  color:rgba(255,255,255,.65);
}

.subMenu{
  margin-top:14px;
  display:none;
  flex-direction:column;
  gap:10px;
  animation: fadeIn .4s ease forwards;
}

.subItem{
  padding:10px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.25);
  font-weight:900;
  font-size:13px;
  transition:.25s;
}

.subItem:hover{
  background:rgba(99,102,241,.25);
  border-color:rgba(99,102,241,.45);
}

.module.active{
  flex:2.3;
}

.module.active .subMenu{
  display:flex;
}

.module.blur{
  filter:blur(3px);
  opacity:.45;
  transform:scale(.95);
}

.glow{
  position:absolute;
  width:260px;
  height:260px;
  background:var(--aiGrad);
  filter:blur(120px);
  opacity:.2;
  right:-80px;
  bottom:-80px;
  pointer-events:none;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>
<main id="pageContent">
  <div class="mainWrap">

    <!-- 1️⃣ TRANSLATE -->
    <div class="module" id="modTranslate">
      <div class="glow"></div>
      <div class="moduleTitle">Translate</div>
      <div class="moduleDesc">Anlık konuşma ve metin çeviri modülleri</div>
      <div class="subMenu">
        <div class="subItem">Facetoface</div>
        <div class="subItem">Walkie Talkie</div>
        <div class="subItem">Metinden Çeviri</div>
      </div>
    </div>

    <!-- 2️⃣ DİL AKADEMİSİ -->
    <div class="module" id="modAcademy">
      <div class="glow"></div>
      <div class="moduleTitle">Dil Akademisi</div>
      <div class="moduleDesc">Seviye belirle, ders al, AI ile pratik yap</div>
      <div class="subMenu">
        <div class="subItem">Seviye Tespit</div>
        <div class="subItem">Dil Dersi</div>
        <div class="subItem">AI ile Pratik</div>
        <div class="subItem">Eğlenerek Öğren</div>
      </div>
    </div>

    <!-- 3️⃣ YARDIMCI ÖĞRETMEN -->
    <div class="module" id="modHelper">
      <div class="glow"></div>
      <div class="moduleTitle">Yardımcı Öğretmen</div>
      <div class="moduleDesc">Soru tara, çözüm al, özel ders planla</div>
      <div class="subMenu">
        <div class="subItem">Matematik</div>
        <div class="subItem">Fizik</div>
        <div class="subItem">Kimya</div>
        <div class="subItem">Türkçe</div>
        <div class="subItem">Yabancı Dil</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"none" });

const modules = document.querySelectorAll(".module");

modules.forEach(mod=>{
  mod.addEventListener("click", ()=>{
    modules.forEach(m=>{
      if(m === mod){
        m.classList.toggle("active");
      }else{
        m.classList.remove("active");
      }
    });

    // blur logic
    const anyActive = document.querySelector(".module.active");
    modules.forEach(m=>{
      if(anyActive && m !== anyActive){
        m.classList.add("blur");
      }else{
        m.classList.remove("blur");
      }
    });
  });
});
</script>
</body>
</html>
