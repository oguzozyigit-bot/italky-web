<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • NFC Kart İle Yükle</title>
  <meta name="theme-color" content="#05070f"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:#fff;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --ai-grad:linear-gradient(135deg,#8bd3ff 0%,#7c5cff 45%,#ff66c4 100%);
      --ok:#8ef0b1;
      --err:#ff9e9e;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#05070f;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 18% 14%, rgba(124,92,255,.16), transparent 28%),
        radial-gradient(circle at 82% 20%, rgba(139,211,255,.13), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255,102,196,.08), transparent 25%),
        linear-gradient(180deg,#05070f 0%, #090d19 100%);
    }

    #pageContent{
      height:100%;
      max-width:560px;
      margin:auto;
      padding:14px;
      overflow:auto;
    }

    .hero{
      border-radius:28px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      padding:18px;
    }

    .title{
      font-size:28px;
      font-weight:1000;
      line-height:1.12;
      margin:0 0 10px;
    }

    .desc{
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      line-height:1.65;
      margin:0 0 18px;
    }

    .stage{
      position:relative;
      height:290px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at center, rgba(255,255,255,.03), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:18px;
    }

    .rings{
      position:absolute;
      width:240px;
      height:240px;
      border-radius:50%;
      border:1px solid rgba(32,212,255,.12);
      animation:ringPulse 2.8s ease-in-out infinite;
    }

    .rings::before,
    .rings::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(32,212,255,.10);
    }

    .rings::before{ inset:22px; }
    .rings::after{ inset:44px; }

    @keyframes ringPulse{
      0%,100%{ opacity:.35; transform:scale(.96); }
      50%{ opacity:.95; transform:scale(1.03); }
    }

    .phone{
      position:relative;
      width:154px;
      height:246px;
      border-radius:36px;
      background:linear-gradient(180deg,#171d28,#0b1019);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      z-index:2;
    }

    .phone::before{
      content:"";
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      width:54px;
      height:8px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
    }

    .phone-screen{
      position:absolute;
      inset:18px;
      border-radius:24px;
      background:
        radial-gradient(circle at center, rgba(139,211,255,.15), transparent 65%),
        linear-gradient(180deg,#0f1522,#070b14);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ed7ff;
      font-size:32px;
      font-weight:1000;
      letter-spacing:2px;
      box-shadow:inset 0 0 28px rgba(0,0,0,.45);
      text-shadow:0 0 14px rgba(139,211,255,.35);
    }

    .nfc-card{
      position:absolute;
      width:122px;
      height:78px;
      border-radius:20px;
      background:linear-gradient(135deg,#20d4ff 0%, #8b5cf6 55%, #ff5fc0 100%);
      box-shadow:0 16px 36px rgba(0,0,0,.25);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:22px;
      font-weight:1000;
      letter-spacing:1px;
      z-index:3;
      animation:nfcMove 2.8s ease-in-out infinite;
    }

    .nfc-card::before,
    .nfc-card::after{
      content:"";
      position:absolute;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.28);
    }

    .nfc-card::before{
      inset:10px auto auto 12px;
      width:22px;
      height:16px;
    }

    .nfc-card::after{
      inset:auto 12px 12px auto;
      width:18px;
      height:18px;
      border-radius:8px;
    }

    @keyframes nfcMove{
      0%,100%{ transform:translateX(96px) rotate(-10deg); }
      50%{ transform:translateX(22px) rotate(-4deg); }
    }

    .helper{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      line-height:1.6;
      text-align:center;
    }

    .helper a{
      color:#ffd7ff;
      text-decoration:none;
      font-weight:900;
    }

    .result{
      margin-top:18px;
      border-radius:22px;
      padding:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      display:none;
    }

    .result.show{ display:block; }

    .result.ok{
      border-color:rgba(142,240,177,.28);
      background:linear-gradient(135deg, rgba(142,240,177,.10), rgba(255,255,255,.03));
    }

    .result.err{
      border-color:rgba(255,158,158,.28);
      background:linear-gradient(135deg, rgba(255,158,158,.10), rgba(255,255,255,.03));
    }

    .result-title{
      font-size:18px;
      font-weight:1000;
      margin:0 0 8px;
    }

    .result-text{
      font-size:14px;
      line-height:1.65;
      font-weight:800;
      color:rgba(255,255,255,.86);
    }

    .result-actions{
      display:flex;
      gap:12px;
      margin-top:14px;
    }

    .result-btn{
      flex:1;
      min-height:52px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
    }

    .result-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <section class="hero">
      <h1 class="title">Satın Aldığınız NFC Kartını Telefona Okut</h1>
      <p class="desc">
        Satın aldığınız NFC kartını telefonunuza yaklaştırın. Kart başarıyla okunduğunda jeton yükleme işlemi otomatik olarak tamamlanacaktır.
      </p>

      <div class="stage">
        <div class="rings"></div>
        <div class="phone">
          <div class="phone-screen">NFC</div>
        </div>
        <div class="nfc-card">NFC</div>
      </div>

      <div class="helper">
        Telefonunuzda NFC kart özelliği yoksa yükleme işlemini
        <a href="/pages/code_load.html">Kod İle Yüklemek için tıklayınız...</a>
      </div>

      <div id="resultBox" class="result">
        <div id="resultTitle" class="result-title"></div>
        <div id="resultText" class="result-text"></div>
        <div class="result-actions">
          <button class="result-btn secondary" type="button" onclick="location.href='/pages/code_load.html'">Kod İle Yükle</button>
          <button class="result-btn" type="button" onclick="location.href='/pages/home.html'">Anasayfaya Dön</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });

    const API_BASE = "https://italky-api.onrender.com";
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");

    function showResult(ok, title, text){
      resultBox.className = "result show " + (ok ? "ok" : "err");
      resultTitle.textContent = title;
      resultText.innerHTML = text;
    }

    async function getAuthHeaders() {
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token || "";
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function getUserId() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || "";
    }

    async function redeemByUid(uid) {
      const userId = await getUserId();
      if (!userId) {
        location.href = "/pages/login.html";
        return;
      }

      const res = await fetch(`${API_BASE}/api/nfc/redeem-token-card`, {
        method: "POST",
        headers: await getAuthHeaders(),
        body: JSON.stringify({
          uid: String(uid || "").trim(),
          user_id: userId
        })
      });

      const json = await res.json().catch(() => null);

      if (!json) {
        showResult(false, "İşlem Başarısız", "Jeton yükleme işlemi gerçekleştirilemedi.");
        return;
      }

      if (json.ok) {
        if (typeof json.tokens_after === "number") {
          try { setHeaderTokens(json.tokens_after); } catch {}
        }

        showResult(
          true,
          "Jeton Yükleme İşleminiz Başarı ile Gerçekleşmiştir",
          `Yüklenen: <b>${json.loaded_tokens}</b><br>Toplam Bakiye: <b>${json.tokens_after}</b>`
        );
        return;
      }

      showResult(
        false,
        "İşlem Başarısız",
        `NFC ile yükleme işlemi gerçekleştirilemedi.<br>Sebep: <b>${json.reason || "Bilinmeyen hata"}</b>`
      );
    }

    window.onNativeNfcRead = function(payload){
      try{
        const uid = String(payload || "").trim();
        if (!uid) {
          showResult(false, "İşlem Başarısız", "NFC kart UID bilgisi alınamadı.");
          return;
        }
        redeemByUid(uid);
      }catch(e){
        showResult(false, "İşlem Başarısız", "NFC kart okunurken hata oluştu.");
      }
    };

    (async function startNfcFlow(){
      try{
        if (window.NativeNFC && typeof window.NativeNFC.readText === "function") {
          window.NativeNFC.readText();
          return;
        }
        showResult(false, "NFC Özelliği Kullanılamadı", "Bu cihazda NFC okuma köprüsü bulunamadı.");
      }catch(e){
        showResult(false, "İşlem Başarısız", "NFC okuma başlatılamadı.");
      }
    })();
  </script>
</body>
</html>
