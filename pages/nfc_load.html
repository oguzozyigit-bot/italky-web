<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • NFC Kart İle Yükle</title>
  <meta name="theme-color" content="#05070f"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --txt:#fff;
      --muted:rgba(255,255,255,.66);
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.07);
      --ai-grad:linear-gradient(135deg,#8bd3ff 0%,#7c5cff 45%,#ff66c4 100%);
      --ok:#9df0b9;
      --err:#ff9ca8;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#05070f;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 18% 14%, rgba(124,92,255,.16), transparent 28%),
        radial-gradient(circle at 82% 20%, rgba(139,211,255,.13), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255,102,196,.08), transparent 25%),
        linear-gradient(180deg,#05070f 0%, #090d19 100%);
    }

    #pageContent{
      height:100%;
      max-width:560px;
      margin:auto;
      padding:14px;
      overflow:auto;
    }

    .hero{
      border-radius:30px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      padding:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
      min-height:720px;
    }

    .title{
      margin:0 0 10px;
      font-size:34px;
      line-height:1.02;
      letter-spacing:-1px;
      font-weight:1000;
      text-align:center;
    }

    .desc{
      margin:0 0 18px;
      color:var(--muted);
      font-size:15px;
      font-weight:800;
      line-height:1.65;
      text-align:center;
    }

    .stage{
      position:relative;
      height:360px;
      border-radius:28px;
      border:1px solid var(--line2);
      background:
        radial-gradient(circle at center, rgba(255,255,255,.03), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.015), rgba(255,255,255,.01));
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:18px;
      isolation:isolate;
      transition:opacity .28s ease, transform .28s ease;
    }

    .energy-ring{
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(56,189,248,.14);
      box-shadow:0 0 20px rgba(56,189,248,.08);
      animation:ringFloat 3.2s ease-in-out infinite;
      pointer-events:none;
    }

    .energy-ring.r1{ width:290px; height:290px; animation-delay:0s; }
    .energy-ring.r2{ width:230px; height:230px; animation-delay:.35s; border-color:rgba(168,85,247,.15); }
    .energy-ring.r3{ width:170px; height:170px; animation-delay:.7s; border-color:rgba(34,211,238,.12); }

    @keyframes ringFloat{
      0%,100%{ transform:scale(.96); opacity:.34; }
      50%{ transform:scale(1.03); opacity:.95; }
    }

    .phone-wrap{
      position:relative;
      width:190px;
      height:300px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
    }

    .phone-glow{
      position:absolute;
      width:210px;
      height:210px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(56,189,248,.16), transparent 68%);
      filter:blur(18px);
      animation:phoneGlow 2.8s ease-in-out infinite;
    }

    @keyframes phoneGlow{
      0%,100%{ opacity:.45; transform:scale(.96); }
      50%{ opacity:.95; transform:scale(1.06); }
    }

    .phone{
      position:relative;
      width:176px;
      height:294px;
      border-radius:38px;
      background:linear-gradient(180deg,#1b2230 0%, #0c1119 100%);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:
        0 24px 48px rgba(0,0,0,.36),
        inset 0 1px 0 rgba(255,255,255,.06);
      overflow:hidden;
    }

    .phone::before{
      content:"";
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      width:56px;
      height:8px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      z-index:3;
    }

    .phone-screen{
      position:absolute;
      inset:16px;
      border-radius:28px;
      background:
        radial-gradient(circle at center, rgba(56,189,248,.14), transparent 55%),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.00) 0px,
          rgba(255,255,255,.00) 16px,
          rgba(255,255,255,.02) 17px
        ),
        linear-gradient(180deg,#07111d 0%, #04070d 100%);
      border:1px solid rgba(255,255,255,.05);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 30px rgba(0,0,0,.48);
    }

    .phone-screen::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg, transparent 0%, rgba(56,189,248,.08) 50%, transparent 100%);
      animation:scanLine 2.2s linear infinite;
      pointer-events:none;
    }

    @keyframes scanLine{
      0%{ transform:translateY(-100%); opacity:0; }
      10%{ opacity:1; }
      50%{ opacity:.55; }
      100%{ transform:translateY(100%); opacity:0; }
    }

    .screen-text{
      position:relative;
      z-index:2;
      font-size:34px;
      letter-spacing:2px;
      font-weight:1000;
      color:#9fdcff;
      text-shadow:0 0 16px rgba(56,189,248,.32);
    }

    .nfc-card{
      position:absolute;
      width:148px;
      height:92px;
      border-radius:22px;
      background:linear-gradient(180deg,#141414 0%, #050505 100%);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:
        0 18px 38px rgba(0,0,0,.36),
        inset 0 1px 0 rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:4;
      animation:nfcMove 2.9s ease-in-out infinite;
      overflow:hidden;
    }

    .nfc-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(56,189,248,.18), transparent 30%, transparent 70%, rgba(168,85,247,.16));
      mix-blend-mode:screen;
      opacity:.85;
    }

    .nfc-card::after{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.05);
    }

    .nfc-chip{
      position:absolute;
      left:14px;
      top:14px;
      width:22px;
      height:16px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.04);
    }

    .nfc-mark{
      position:relative;
      z-index:2;
      font-size:20px;
      font-weight:1000;
      letter-spacing:.8px;
      color:#f6f8ff;
      text-shadow:0 0 10px rgba(255,255,255,.08);
    }

    .nfc-logo{
      position:absolute;
      bottom:12px;
      right:14px;
      z-index:2;
      font-size:10px;
      font-weight:900;
      color:rgba(255,255,255,.78);
      letter-spacing:.3px;
    }

    @keyframes nfcMove{
      0%,100%{ transform:translateX(110px) rotate(-9deg); }
      50%{ transform:translateX(28px) rotate(-3deg); }
    }

    .helper{
      margin-top:4px;
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      line-height:1.65;
      text-align:center;
      transition:opacity .28s ease, transform .28s ease;
    }

    .helper button{
      border:none;
      background:none;
      color:#f4d8ff;
      font-weight:1000;
      font-size:14px;
      cursor:pointer;
      padding:0;
      font-family:'Outfit',sans-serif;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(5,7,15,.50);
      backdrop-filter:blur(4px);
      z-index:20;
    }

    .overlay.show{
      display:flex;
      animation:fadeIn .24s ease;
    }

    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }

    .result{
      width:min(100%, 430px);
      border-radius:24px;
      padding:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      box-shadow:0 18px 36px rgba(0,0,0,.28);
      transform:translateY(0);
    }

    .result.ok{
      border-color:rgba(157,240,185,.32);
      background:linear-gradient(135deg, rgba(157,240,185,.12), rgba(255,255,255,.03));
    }

    .result.err{
      border-color:rgba(255,156,168,.36);
      background:linear-gradient(135deg, rgba(255,156,168,.12), rgba(255,255,255,.03));
    }

    .result-title{
      font-size:20px;
      font-weight:1000;
      margin:0 0 10px;
      line-height:1.35;
      text-align:left;
    }

    .result.ok .result-title{
      color:#ffffff;
    }

    .result.err .result-title{
      color:#ffacb6;
    }

    .result-text{
      font-size:15px;
      line-height:1.7;
      font-weight:800;
      color:rgba(255,255,255,.92);
      text-align:left;
    }

    .result-actions{
      display:flex;
      gap:12px;
      margin-top:16px;
    }

    .result-btn{
      flex:1;
      min-height:52px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      font-weight:1000;
      color:#fff;
      background:var(--ai-grad);
    }

    .result-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }

    .success-mode .stage,
    .success-mode .helper,
    .success-mode .desc{
      opacity:.18;
      transform:scale(.985);
      pointer-events:none;
    }

    .confetti-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:9999;
    }

    .confetti{
      position:absolute;
      top:-20px;
      width:10px;
      height:16px;
      opacity:.95;
      animation:fall linear forwards;
      border-radius:3px;
    }

    @keyframes fall{
      0%{ transform:translateY(-20px) rotate(0deg); opacity:0; }
      10%{ opacity:1; }
      100%{ transform:translateY(110vh) rotate(720deg); opacity:.95; }
    }
  </style>
</head>
<body>
  <div id="confettiLayer" class="confetti-layer"></div>

  <main id="pageContent">
    <section id="heroCard" class="hero">
      <h1 class="title">NFC Kartını Okut</h1>
      <p class="desc">
        NFC kartı telefonun arka kısmına yaklaştırın. Okuma tamamlandığında jetonlar hesabınıza aktarılır.
      </p>

      <div class="stage">
        <div class="energy-ring r1"></div>
        <div class="energy-ring r2"></div>
        <div class="energy-ring r3"></div>

        <div class="phone-wrap">
          <div class="phone-glow"></div>
          <div class="phone">
            <div class="phone-screen">
              <div class="screen-text">NFC</div>
            </div>
          </div>
        </div>

        <div class="nfc-card">
          <div class="nfc-chip"></div>
          <div class="nfc-mark">NFC</div>
          <div class="nfc-logo">italkyAI</div>
        </div>
      </div>

      <div class="helper">
        Telefonunuzda NFC kart özelliği yoksa yükleme işlemini
        <button type="button" id="goCodeBtn">Kod ile Yüklemek için tıklayınız...</button>
      </div>

      <div id="overlay" class="overlay">
        <div id="resultCard" class="result">
          <div id="resultTitle" class="result-title"></div>
          <div id="resultText" class="result-text"></div>
          <div class="result-actions">
            <button class="result-btn secondary" type="button" id="goHistoryBtn">Jeton Hareketlerini Gör</button>
            <button class="result-btn" type="button" id="goHomeBtn">Anasayfaya Dön</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });

    const API_BASE = "https://italky-api.onrender.com";
    const heroCard = document.getElementById("heroCard");
    const overlay = document.getElementById("overlay");
    const resultCard = document.getElementById("resultCard");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const goCodeBtn = document.getElementById("goCodeBtn");
    const goHistoryBtn = document.getElementById("goHistoryBtn");
    const goHomeBtn = document.getElementById("goHomeBtn");
    const confettiLayer = document.getElementById("confettiLayer");

    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function beep({ freq = 880, duration = 0.12, type = "sine", gain = 0.05, delay = 0 }) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      amp.gain.value = 0.0001;
      osc.connect(amp);
      amp.connect(audioCtx.destination);

      const now = audioCtx.currentTime + delay;
      amp.gain.setValueAtTime(0.0001, now);
      amp.gain.exponentialRampToValueAtTime(gain, now + 0.01);
      amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playSuccessSound() {
      ensureAudio();
      beep({ freq: 740, duration: 0.10, gain: 0.05, type: "sine", delay: 0.00 });
      beep({ freq: 988, duration: 0.12, gain: 0.05, type: "sine", delay: 0.11 });
      beep({ freq: 1318, duration: 0.16, gain: 0.06, type: "triangle", delay: 0.24 });
    }

    function playErrorSound() {
      ensureAudio();
      beep({ freq: 330, duration: 0.14, gain: 0.05, type: "sawtooth", delay: 0.00 });
      beep({ freq: 220, duration: 0.18, gain: 0.05, type: "square", delay: 0.14 });
    }

    function launchConfetti() {
      confettiLayer.innerHTML = "";
      const colors = ["#8bd3ff", "#7c5cff", "#ff66c4", "#34d399", "#fbbf24", "#ffffff"];
      const count = 80;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = `${2.6 + Math.random() * 1.8}s`;
        piece.style.animationDelay = `${Math.random() * 0.45}s`;
        piece.style.width = `${8 + Math.random() * 6}px`;
        piece.style.height = `${10 + Math.random() * 10}px`;
        confettiLayer.appendChild(piece);
      }

      setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 5000);
    }

    function extractUidFromValue(raw) {
      const value = String(raw || "").trim();
      if (!value) return "";

      if (value.startsWith("italky://") || value.startsWith("http://") || value.startsWith("https://")) {
        try {
          const normalized = value.startsWith("italky://")
            ? value.replace("italky://", "https://")
            : value;
          const u = new URL(normalized);
          return String(u.searchParams.get("uid") || "").trim();
        } catch {
          return "";
        }
      }

      return value;
    }

    function getUidFromUrl() {
      try {
        const u = new URL(location.href);
        return String(u.searchParams.get("uid") || "").trim();
      } catch {
        return "";
      }
    }

    function showResult(ok, title, text) {
      resultCard.className = "result " + (ok ? "ok" : "err");
      resultTitle.textContent = title;
      resultText.innerHTML = text;
      overlay.classList.add("show");

      if (ok) {
        heroCard.classList.add("success-mode");
        launchConfetti();
        playSuccessSound();
      } else {
        heroCard.classList.remove("success-mode");
        playErrorSound();
      }
    }

    function mapNfcError(reasonRaw) {
      const reason = String(reasonRaw || "").trim().toUpperCase();

      if (reason === "CARD_NOT_FOUND") return "Okutulan kart sistemde kayıtlı değil.";
      if (reason === "CARD_ALREADY_USED") return "Bu kart daha önce kullanılmış.";
      if (reason === "CARD_BLOCKED") return "Bu kart kullanıma kapatılmış.";
      if (reason === "CARD_EXPIRED") return "Bu kartın kullanım süresi dolmuş.";
      if (reason === "INVALID_TOKEN_AMOUNT") return "Bu kartta yüklenebilir jeton bulunamadı.";

      return "İşlem sırasında sistem hatası oluştu.";
    }

    async function getAuthHeaders() {
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token || "";
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function getUserId() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || "";
    }

    async function redeemByUid(uid) {
      const userId = await getUserId();
      if (!userId) {
        location.href = "/pages/login.html";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/nfc/redeem-token-card`, {
          method: "POST",
          headers: await getAuthHeaders(),
          body: JSON.stringify({
            uid: String(uid || "").trim(),
            user_id: userId
          })
        });

        const json = await res.json().catch(() => null);

        if (!json) {
          showResult(false, "İşlem Başarısız", "Jeton yükleme işleminiz gerçekleştirilemedi.");
          return;
        }

        if (json.ok) {
          if (typeof json.tokens_after === "number") {
            try { setHeaderTokens(json.tokens_after); } catch {}
          }

          showResult(
            true,
            "Jeton Yükleme İşleminiz Başarı ile Gerçekleşmiştir",
            `Yüklenen: <b>${json.loaded_tokens}</b><br>Toplam Bakiye: <b>${json.tokens_after}</b>`
          );
          return;
        }

        showResult(
          false,
          "İşlem Başarısız",
          `NFC den yükleme işlemi gerçekleştirilemedi.<br>Sebep: <b>${mapNfcError(json.reason)}</b>`
        );
      } catch (e) {
        showResult(false, "İşlem Başarısız", "Jeton yükleme işlemi gerçekleştirilemedi.");
      }
    }

    window.onNativeNfcRead = function(payload){
      try{
        const uid = extractUidFromValue(payload);
        if (!uid) {
          showResult(false, "İşlem Başarısız", "NFC kart UID bilgisi alınamadı.");
          return;
        }
        redeemByUid(uid);
      }catch(e){
        showResult(false, "İşlem Başarısız", "NFC kart okunurken hata oluştu.");
      }
    };

    window.onNativeNfcReadError = function(message){
      const msg = String(message || "").trim();
      if (!msg) return;
      showResult(false, "İşlem Başarısız", msg);
    };

    goCodeBtn?.addEventListener("click", () => location.href = "/pages/code_load.html");
    goHistoryBtn?.addEventListener("click", () => location.href = "/pages/wallet_history.html");
    goHomeBtn?.addEventListener("click", () => location.href = "/pages/home.html");

    window.addEventListener("pointerdown", ensureAudio, { passive: true });
    window.addEventListener("touchstart", ensureAudio, { passive: true });

    (function startNfcFlow(){
      const uidFromUrl = getUidFromUrl();
      if (uidFromUrl) {
        redeemByUid(uidFromUrl);
        return;
      }

      try{
        if (window.NativeAdmin && typeof window.NativeAdmin.readNfcText === "function") {
          window.NativeAdmin.readNfcText();
        }
      } catch {}
    })();
  </script>
</body>
</html>
