<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Academy Hub</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --green: #10b981;
  --blue: #60a5fa;
  --orange: #f97316;
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 40px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 85px);
  background: radial-gradient(circle at 50% 20%, #051510 0%, #000 100%);
}

.main-hub { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; }

/* ===== 1. SEVİYE TESPİT PORTAL (TOP) ===== */
.portal-top {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; padding: 10px 0;
}
.neural-orb { width: 110px; height: 110px; position: relative; display: flex; align-items: center; justify-content: center; }
.ai-ring { position: absolute; inset: -4px; border-radius: 50%; padding: 2.5px; background: var(--ai-grad); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; animation: rotateOrb 15s linear infinite; }
.orbit-energy { position: absolute; inset: -12px; border-radius: 50%; animation: rotateOrb 8s linear infinite; }
/* Seviye Check Enerjisi */
.e-ball { position: absolute; width: 12px; height: 12px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:900; color:#fff; }
.ball-l { top:-5px; left:50%; transform:translateX(-50%); background:var(--green); box-shadow:0 0 15px var(--green); }
.ball-b { bottom:-5px; left:50%; transform:translateX(-50%); background:var(--blue); box-shadow:0 0 15px var(--blue); }

.ai-core { 
    width: 82px; height: 82px; background: #000; border-radius: 50%; 
    border: 2px solid transparent; background-image: linear-gradient(#000, #000), var(--ai-grad);
    background-origin: border-box; background-clip: content-box, border-box;
    display: flex; align-items: center; justify-content: center; 
    animation: aiBreathe 4s infinite ease-in-out; z-index: 10;
}
.portal-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; color: #fff; margin-top: 10px; letter-spacing: -1px; }
.portal-title span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* ===== 2. KARTLAR (EŞİT DAĞILIM) ===== */
.hub-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; }

.academy-card {
  flex: 1; position: relative; border-radius: 28px; border: 1px solid var(--glass-border);
  overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 20px;
  background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); transition: all 0.3s ease;
}
.academy-card:active { transform: scale(0.98); filter: brightness(1.2); }

/* Renkler */
.lesson-card { background: linear-gradient(145deg, rgba(96, 165, 250, 0.08) 0%, rgba(0,0,0,0.6) 100%); }
.practice-card { background: linear-gradient(145deg, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0.6) 100%); }
.game-card { background: linear-gradient(145deg, rgba(249, 115, 22, 0.08) 0%, rgba(0,0,0,0.6) 100%); }

/* ===== ÖZEL ANİMASYONLAR ===== */

/* Lesson: Book Flip/Pulse */
.icon-wrap { width: 50px; height: 50px; position: relative; margin-right: 18px; display: flex; align-items: center; justify-content: center; }
.book-glow { position: absolute; inset: 0; background: var(--blue); filter: blur(15px); opacity: 0.3; animation: pulse 2s infinite; }

/* Practice: Wave Ripple */
.ripple-wrap { width: 50px; height: 50px; position: relative; margin-right: 18px; }
.ripple { position: absolute; inset: 0; border: 2px solid var(--green); border-radius: 50%; animation: rippleOut 2s infinite; }

/* Game: Floating Target */
.target-wrap { width: 50px; height: 50px; position: relative; margin-right: 18px; display: flex; align-items: center; justify-content: center; }
.target-dot { position: absolute; width: 10px; height: 10px; background: var(--orange); border-radius: 50%; animation: float 1.5s infinite alternate; }

@keyframes rotateOrb { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes aiBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes pulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.5; } }
@keyframes rippleOut { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
@keyframes float { from { transform: translateY(-8px); } to { transform: translateY(8px); } }

/* Content */
.card-content { flex: 1; z-index: 10; }
.card-title { font-family: 'Space Grotesk'; font-size: 19px; font-weight: 700; color: #fff; margin: 0; }
.card-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; line-height: 1.3; }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="portal-top" onclick="location.href='/pages/level_test_hub.html'">
      <div class="neural-orb">
        <div class="ai-ring"></div>
        <div class="orbit-energy"><div class="e-ball ball-l">A1</div><div class="e-ball ball-b">C2</div></div>
        <div class="ai-core">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
      </div>
      <h1 class="portal-title">Seviye Tespit <span>Sınavı</span></h1>
    </div>

    <div class="hub-cards">

      <div class="academy-card lesson-card" onclick="location.href='/pages/teacher_select.html'">
        <div class="icon-wrap">
          <div class="book-glow"></div>
          <span style="font-size: 24px; z-index: 2;">📚</span>
        </div>
        <div class="card-content">
          <h2 class="card-title">Language Lesson <span>AI</span></h2>
          <p class="card-desc">Birebir yapay zeka öğretmenleri ile kişiselleştirilmiş dil dersleri.</p>
        </div>
      </div>

      <div class="academy-card practice-card" onclick="location.href='/pages/practice_ai.html'">
        <div class="ripple-wrap">
          <div class="ripple" style="animation-delay: 0s"></div>
          <div class="ripple" style="animation-delay: 1s"></div>
          <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px;">🎙️</span>
        </div>
        <div class="card-content">
          <h2 class="card-title">AI ile Pratik <span>Yap</span></h2>
          <p class="card-desc">Konuşma odaklı senaryolarla dilini özgürce geliştir.</p>
        </div>
      </div>

      <div class="academy-card game-card" onclick="location.href='/pages/game_lang_select.html'">
        <div class="target-wrap">
          <div class="target-dot"></div>
          <span style="font-size: 24px; z-index: 2;">🎯</span>
        </div>
        <div class="card-content">
          <h2 class="card-title">Eğlenerek <span>Öğren</span></h2>
          <p class="card-desc">Oyunlarla kelime dağarcığını ve gramerini test et.</p>
        </div>
      </div>

    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
