<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Translate Hub</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue-sun: #60a5fa;
  --green-sun: #34d399;
  --purple-sun: #c084fc;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

#pageContent {
  height: 100vh;
  display: flex;
  flex-direction: column;
  /* UI Shell barlarının arasına sığdır */
  padding-top: calc(env(safe-area-inset-top) + 38px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 82px);
  background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
  position: relative;
}

/* Sayfa aurası */
.hub-aura {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 10%, rgba(99,102,241,0.15) 0%, transparent 60%);
  filter: blur(40px); z-index: 0;
}

.main-hub {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 14px;
  z-index: 2;
}

/* ===== 1. FACETOFACE PORTAL (TEPEDE SABİT) ===== */
.f2f-portal {
  flex: 0 0 160px; /* Sabit yükseklik */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  margin-bottom: 10px;
}

.neural-orb {
  width: 100px; height: 100px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}

.ai-ring {
  position: absolute; inset: -3px; border-radius: 50%; padding: 2.5px;
  background: var(--ai-grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  animation: rotateOrb 15s linear infinite;
  opacity: 0.8;
}

.ai-core {
  width: 78px; height: 78px;
  background: #000;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  box-shadow: 0 0 30px rgba(99,102,241,0.3);
  animation: breathe 4s infinite ease-in-out;
}

.f2f-info { text-align: center; margin-top: 10px; }
.f2f-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 700; color: #fff; margin: 0; letter-spacing: -1px; }
.f2f-title .ai { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
.f2f-desc { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

/* ===== 2. KARTLAR (AŞAĞIDA SIRALI) ===== */
.cards-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto; /* Kartlar sığmazsa kendi içinde kayar (Fold koruması) */
  scrollbar-width: none;
}
.cards-zone::-webkit-scrollbar { display: none; }

.trans-card {
  flex: 0 0 65px; /* Kompakt kartlar */
  position: relative;
  border-radius: 20px;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 0 16px;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.trans-card:active { transform: scale(0.98); filter: brightness(1.15); }

/* Renk Atmosferleri */
.text-card { background: linear-gradient(145deg, rgba(96,165,250,0.06) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(96,165,250,0.2); }
.walkie-card { background: linear-gradient(145deg, rgba(52,211,153,0.06) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(52,211,153,0.2); }
.offline-card { background: linear-gradient(145deg, rgba(192,132,252,0.06) 0%, rgba(0,0,0,0.4) 100%); border-color: rgba(192,132,252,0.2); }

/* Küçük Solar System (Kartlar için) */
.solar { width: 45px; height: 45px; position: relative; flex-shrink: 0; margin-right: 14px; }
.sun {
  width: 14px; height: 14px;
  background: var(--sun-color);
  border-radius: 50%;
  filter: blur(4px);
  box-shadow: 0 0 12px var(--sun-color);
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%);
  animation: sunPulse 3s infinite;
}
.orbit { position: absolute; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; animation: rotate linear infinite; }
.orbit1 { width: 30px; height: 30px; top: 7.5px; left: 7.5px; animation-duration: 4s; }
.orbit2 { width: 45px; height: 45px; animation-duration: 7s; animation-direction: reverse; }
.planet { width: 3px; height: 3px; background: #fff; border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }

/* İçerik */
.card-content { flex: 1; z-index: 10; }
.card-title { font-family: 'Outfit'; font-size: 16px; font-weight: 700; color: #fff; margin: 0; }
.card-desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; line-height: 1.3; }

/* ===== ÖZEL KART ANİMASYONLARI ===== */

/* Text: Scan Down */
.scan-line { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, rgba(96,165,250,0.05), transparent); height: 25%; width: 100%; animation: scanDown 3s linear infinite; opacity: 0.5; }
@keyframes scanDown { 0% { top: -25%; } 100% { top: 125%; } }

/* Walkie: Pulse Dot */
.pulse-dot { position: absolute; right: 15px; top: 15px; width: 6px; height: 6px; background: var(--green-sun); border-radius: 50%; box-shadow: 0 0 10px var(--green-sun); animation: dotPulse 1.5s infinite; }
@keyframes dotPulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.4); opacity: 1; } }

/* Offline: Conic Spin */
.offline-card::after {
  content: ""; position: absolute; inset: -100px;
  background: conic-gradient(from 0deg, rgba(192,132,252,0), rgba(192,132,252,0.1), rgba(192,132,252,0));
  animation: spin 3s linear infinite; opacity: 0.3; pointer-events: none;
}

/* Global Animations */
@keyframes rotate { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes sunPulse { 0%,100%{transform:translate(-50%,-50%) scale(1); opacity:0.6;} 50%{transform:translate(-50%,-50%) scale(1.1); opacity:0.9;} }
@keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

.text-card { --sun-color: var(--blue-sun); }
.walkie-card { --sun-color: var(--green-sun); }
.offline-card { --sun-color: var(--purple-sun); }

</style>
</head>

<body>
<main id="pageContent">
  <div class="hub-aura"></div>

  <div class="main-hub">

    <div class="f2f-portal" onclick="go('/facetoface.html')">
      <div class="neural-orb">
        <div class="ai-ring"></div>
        <div class="ai-core">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </div>
      </div>
      <div class="f2f-info">
        <h1 class="f2f-title">FaceToFace <span class="ai">AI</span></h1>
        <p class="f2f-desc">Anlık Sesli Çeviri Portalı</p>
      </div>
    </div>

    <div class="cards-zone">

      <div class="trans-card text-card" onclick="go('/pages/text_translate.html')">
        <div class="scan-line"></div>
        <div class="solar">
          <div class="sun"></div>
          <div class="orbit orbit1"><div class="planet"></div></div>
          <div class="orbit orbit2"></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Metin Çeviri</h2>
          <p class="card-desc">Karmaşık belgeleri kuantum hızıyla yerelleştirir.</p>
        </div>
      </div>

      <div class="trans-card walkie-card" onclick="go('/pages/f2f_connect.html')">
        <div class="pulse-dot"></div>
        <div class="solar">
          <div class="sun"></div>
          <div class="orbit orbit1"></div>
          <div class="orbit orbit2"><div class="planet" style="border-radius:2px;"></div></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Walkie-Talkie</h2>
          <p class="card-desc">Bas-konuş mantığıyla uzak mesafeli sesli odalar.</p>
        </div>
      </div>

      <div class="trans-card offline-card" onclick="go('/facetoface_offline.html')">
        <div class="solar">
          <div class="sun" style="transform:translate(-50%,-50%) scale(0.8); opacity:0.5;"></div>
          <div class="orbit orbit1" style="border-style: dashed; opacity: 0.3;"></div>
          <div class="orbit orbit2" style="border-style: dashed; opacity: 0.3;"></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Offline Çeviri</h2>
          <p class="card-desc">İnternet bağlantısı olmadan, indirilen paketlerle tam gizlilik.</p>
        </div>
      </div>

    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  window.go = (url) => location.href = url;
</script>
</body>
</html>
