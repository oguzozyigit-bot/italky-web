<!-- FILE: /pages/helper_home.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Teacher AI</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.68);
      --purple: #a855f7;
      --blue: #60a5fa;
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 45%,#ec4899 100%);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    #pageContent{ height:100%; overflow:hidden; }

    .wrap{
      height:100%;
      max-width:520px;
      margin:0 auto;
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .hero{
      border: 1px solid var(--border);
      background: var(--glass);
      border-radius: 22px;
      padding: 12px 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .hero h1{
      margin:0;
      font-family:"Space Grotesk";
      font-size:16px;
      font-weight:1000;
      color:#fff;
      letter-spacing:-.2px;
      display:flex;
      gap:8px;
      align-items:baseline;
    }
    .hero h1 .ai{
      background: var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      font-weight:1000;
    }
    .hero p{
      margin:6px 0 0;
      font-size:12px;
      font-weight:900;
      color: var(--muted);
      line-height:1.55;
    }

    .stage{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:10px;
    }

    .bigCard{
      flex:1;
      min-height: 320px;
      border-radius: 28px;
      border:1px solid rgba(168,85,247,0.28);
      background:
        linear-gradient(145deg, rgba(168,85,247,0.14) 0%, rgba(0,0,0,0.55) 100%);
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding: 18px;
      cursor:pointer;
      user-select:none;
      transition: transform .18s ease, filter .18s ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .bigCard:active{ transform: scale(.985); filter: brightness(1.06); }

    /* FX */
    .fx{ position:absolute; inset:0; pointer-events:none; }
    .fx:before{
      content:"";
      position:absolute; inset:-30%;
      background:
        radial-gradient(circle at 20% 30%, rgba(168,85,247,.38) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(96,165,250,.20) 0%, transparent 45%);
      filter: blur(34px);
      animation: drift 10s ease-in-out infinite alternate;
      opacity:.95;
    }
    @keyframes drift{
      from{ transform: translate3d(-10px,-8px,0) scale(1); }
      to{ transform: translate3d(10px,8px,0) scale(1.08); }
    }

    .formula{
      position:absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      color: rgba(168,85,247,0.85);
      opacity:0;
      animation: formulaUp 3.4s linear infinite;
    }
    .formula.f1{ left: 16%; bottom: -10px; animation-delay: .2s; }
    .formula.f2{ left: 58%; bottom: -10px; animation-delay: 1.0s; color: rgba(96,165,250,0.85); }
    .formula.f3{ left: 78%; bottom: -10px; animation-delay: 1.8s; }
    @keyframes formulaUp{
      0%{ transform: translateY(20px); opacity:0; }
      20%{ opacity:.55; }
      80%{ opacity:.35; }
      100%{ transform: translateY(-240px); opacity:0; }
    }

    .orb{
      width: 120px;
      height: 120px;
      border-radius: 999px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 10px;
    }
    .ring{
      position:absolute; inset:-5px;
      border-radius:999px;
      background: var(--ai-grad);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      padding: 3px;
      animation: spin 10s linear infinite;
      opacity:.95;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }

    .core{
      width: 92px;
      height: 92px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 0 34px rgba(168,85,247,0.22);
      animation: breathe 3.6s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.06); }
    }

    .camIcon{
      font-size: 38px;
      line-height: 1;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
    }

    .bigTitle{
      margin:0;
      font-family:"Space Grotesk";
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: -0.6px;
      color:#fff;
    }
    .bigSub{
      margin:6px 0 0;
      font-size: 12px;
      font-weight: 900;
      color: rgba(255,255,255,0.68);
      line-height: 1.45;
      max-width: 340px;
    }

    .ctaRow{
      width: 100%;
      max-width: 420px;
      margin-top: 14px;
      display:flex;
      gap:10px;
    }
    .btn{
      flex:1;
      height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
    }
    .btn:active{ transform: scale(.99); }
    .btnMain{
      background: #fff;
      color:#000;
      border:none;
    }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <h1>Teacher <span class="ai">AI</span></h1>
      <p>
        Matematik • Fizik • Kimya • Türkçe • Yabancı Dil<br/>
        Fotoğrafını çek → soruyu seç → adım adım anlatarak çözelim.
      </p>
    </section>

    <section class="stage">
      <div class="bigCard" id="goScan">
        <div class="fx">
          <div class="formula f1">x² + y²</div>
          <div class="formula f2">E = mc²</div>
          <div class="formula f3">Δ = b² − 4ac</div>
        </div>

        <div class="orb" aria-hidden="true">
          <div class="ring"></div>
          <div class="core">
            <div class="camIcon">📷</div>
          </div>
        </div>

        <h2 class="bigTitle">Foto Çek • Kırp • Çöz</h2>
        <div class="bigSub">
          Bir sayfada birden fazla soru olabilir. Dikdörtgenle seç, kırp ve çözümü al.
        </div>

        <div class="ctaRow">
          <button class="btn btnMain" id="btnStart" type="button">Şimdi Başla</button>
          <button class="btn" id="btnHow" type="button">Nasıl Çalışır?</button>
        </div>
      </div>
    </section>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const go = ()=>location.href="/pages/scan_solve.html";
  document.getElementById("goScan").onclick = go;
  document.getElementById("btnStart").onclick = (e)=>{ e.stopPropagation(); go(); };

  document.getElementById("btnHow").onclick = (e)=>{
    e.stopPropagation();
    alert("1) Foto çek / galeriden seç\n2) Soruyu parmağınla çerçevele (kırp)\n3) Metni çıkar → Çöz\n\nNot: Çok soru varsa tek tek seçip çözebilirsin.");
  };
</script>
</body>
</html>
