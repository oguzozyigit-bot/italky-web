<!-- FILE: /pages/jetonbuy.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Jeton Yükle</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    #pageContent{
      padding: 20px 16px calc(var(--footerH, 92px) + env(safe-area-inset-bottom) + 18px);
      display:flex;
      flex-direction:column;
      gap:12px;
      max-width: 560px;
      margin: 0 auto;
    }

    .header{ text-align:center; margin-bottom: 6px; }
    .header h1{
      font-family:'Space Grotesk', sans-serif;
      font-size:24px;
      font-weight:900;
      margin:0;
      color:#a5b4fc;
    }
    .header p{ font-size:13px; color: rgba(255,255,255,0.6); margin: 8px 0 0; font-weight: 800; }

    .pkg{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding:16px;
      border-radius:22px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      transition: .2s;
      cursor:pointer;
      user-select:none;
    }
    .pkg:active{ transform: scale(0.985); background: rgba(99,102,241,0.18); }
    .pkg-info{ display:flex; flex-direction:column; gap:4px; }
    .pkg-amt{ font-size:18px; font-weight:1000; }
    .pkg-price{ font-size:14px; color:#a5b4fc; font-weight:900; letter-spacing:.2px; }
    .pkg-icon{ font-size:18px; opacity:.9; }

    .pkg-best{
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      padding:4px 10px;
      border-radius:10px;
      font-size:10px;
      font-weight:1000;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .note{
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: rgba(255,255,255,0.55);
      line-height: 1.45;
      text-align:center;
    }

    .toast{
      position: fixed; left:50%; top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,.92);
      border:1px solid rgba(165,180,252,.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index:999999;
      font-weight:900;
      font-size:12px;
      transition:.25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width:min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
  <div id="pageContent">
    <div class="header">
      <h1>Jeton Market</h1>
      <p>Konuşmaya devam etmek için paket seçin</p>
    </div>

    <div class="pkg" data-id="jeton_10">
      <div class="pkg-info"><span class="pkg-amt">10 Jeton</span><span class="pkg-price">29 TL</span></div>
      <div class="pkg-icon">⚡</div>
    </div>

    <div class="pkg" data-id="jeton_20">
      <div class="pkg-info"><span class="pkg-amt">20 Jeton</span><span class="pkg-price">54 TL</span></div>
      <div class="pkg-icon">✨</div>
    </div>

    <div class="pkg" data-id="jeton_50">
      <div class="pkg-info"><span class="pkg-amt">50 Jeton</span><span class="pkg-price">119 TL</span></div>
      <div class="pkg-icon">🔥</div>
    </div>

    <div class="pkg" data-id="jeton_100" style="border:2px solid #6366f1; background: rgba(99,102,241,0.10);">
      <div class="pkg-info"><span class="pkg-amt">100 Jeton</span><span class="pkg-price">199 TL</span></div>
      <span class="pkg-best">Popüler</span>
    </div>

    <div class="pkg" data-id="jeton_250">
      <div class="pkg-info"><span class="pkg-amt">250 Jeton</span><span class="pkg-price">449 TL</span></div>
      <div class="pkg-icon">💎</div>
    </div>

    <div class="pkg" data-id="jeton_500" style="background: rgba(236,72,153,0.10); border: 1px solid rgba(236,72,153,0.40);">
      <div class="pkg-info"><span class="pkg-amt">500 Jeton</span><span class="pkg-price">849 TL</span></div>
      <span class="pkg-best" style="background:#ec4899;">VIP</span>
    </div>

    <div class="note">
      Ödeme Android tarafında aktif edilecek. Şimdilik paket seçimi test amaçlıdır.
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    mountShell();

    const toast = (msg)=>{
      const t = document.getElementById("toast");
      if(!t) return;
      t.textContent = String(msg||"");
      t.classList.add("show");
      clearTimeout(window.__to);
      window.__to = setTimeout(()=>t.classList.remove("show"), 1400);
    };

    // ✅ satın alma stub
    window.buy = (id)=>{
      console.log("Satın alma tetiklendi:", id);
      toast("Paket seçildi: " + id);

      // Android bridge örneği (sonra):
      // if(window.AndroidBilling?.buy) AndroidBilling.buy(id);
    };

    document.querySelectorAll(".pkg[data-id]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = el.getAttribute("data-id");
        window.buy(id);
      });
    });
  </script>
</body>
</html>
