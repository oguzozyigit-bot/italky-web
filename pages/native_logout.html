<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>italkyAI • Çıkış</title>
  <meta name="theme-color" content="#06111d">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06111d;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    .spin{width:38px;height:38px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(83,231,225,.18);border-top-color:#53e7e1;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    p{margin:0;color:rgba(255,255,255,.72);font-weight:700}
  </style>
</head>
<body>
  <main><div class="spin"></div><p>Güvenli çıkış yapılıyor…</p></main>
  <script type="module">
    import { safeLogout } from '/js/auth.js';
    try{
      await safeLogout();
    }catch(error){
      console.error('[native_logout]',error);
      location.replace('/hosgeldiniz');
    }
  </script>
</body>
</html>
