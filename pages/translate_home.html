<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Translate AI Hub</title>

<meta name="theme-color" content="#000000">
<style>
  html,body{background:#000 !important; margin:0; padding:0; overflow:hidden; font-family:'Outfit', sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root {
  --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
  --blue: #60a5fa;
  --green: #34d399;
  --purple: #a855f7;
  --glass-border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

/* ✅ ui_shell ile uyum: 100vh + padding kaldır */
#pageContent {
  height: 100%;
  display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
}

.main-hub { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 10px 14px; }

/* ===== 1. FACETOFACE PORTAL (BOZULMAYAN EFSANE) ===== */
.f2f-portal {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; padding: 10px 0; margin-bottom: 5px;
}
.neural-orb { width: 110px; height: 110px; position: relative; display: flex; align-items: center; justify-content: center; }
.ai-ring { position: absolute; inset: -4px; border-radius: 50%; padding: 2.5px; background: var(--ai-grad); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; animation: rotateOrb 15s linear infinite; }
.orbit-energy { position: absolute; inset: -12px; border-radius: 50%; animation: rotateOrb 8s linear infinite; }
.e-ball { position: absolute; width: 11px; height: 11px; border-radius: 50%; filter: blur(1px); }
.ball-l { top:-5px; left:50%; transform:translateX(-50%); background:#1e3a8a; box-shadow:0 0 15px #1e3a8a; }
.ball-b { bottom:-5px; left:50%; transform:translateX(-50%); background:#801336; box-shadow:0 0 15px #801336; }
.ai-core { width: 82px; height: 82px; background: #000; border-radius: 50%; background-image: linear-gradient(#000, #000), var(--ai-grad); background-origin: border-box; background-clip: content-box, border-box; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; animation: aiBreathe 4s infinite ease-in-out; z-index: 10; }
.f2f-title { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; color: #fff; margin-top: 10px; letter-spacing: -1px; }
.f2f-title .ai { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* ===== 2. DİĞER MODÜLLER (EKRANI DOLDURAN) ===== */
.hub-cards { flex: 1; display: flex; flex-direction: column; gap: 12px; }

.trans-card {
  flex: 1; position: relative; border-radius: 30px; border: 1px solid var(--glass-border);
  overflow: hidden; cursor: pointer; display: flex; align-items: center; padding: 0 24px;
  background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.trans-card:active { transform: scale(0.98); filter: brightness(1.2); }

/* Renkler */
.text-card { background: linear-gradient(145deg, rgba(96, 165, 250, 0.1) 0%, rgba(0,0,0,0.5) 100%); }
.walkie-card { background: linear-gradient(145deg, rgba(52, 211, 153, 0.1) 0%, rgba(0,0,0,0.5) 100%); }
.offline-card { background: linear-gradient(145deg, rgba(192, 132, 252, 0.1) 0%, rgba(0,0,0,0.5) 100%); }

/* ===== FARKLI ANİMASYONLAR (YUVARLAK DEĞİL) ===== */

/* 1. Metin Çeviri: Matrix/Scan Line */
.matrix-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--blue); box-shadow: 0 0 15px var(--blue); animation: scanLine 3s linear infinite; opacity: 0.5; }
.text-blocks { width: 60px; height: 40px; border: 1px solid var(--blue); display: flex; flex-direction: column; gap: 4px; padding: 4px; margin-right: 20px; position: relative; }
.line { height: 3px; background: rgba(255,255,255,0.2); width: 100%; border-radius: 1px; animation: textTyping 2s infinite alternate; }

/* 2. Walkie Talkie: EQ Bars */
.eq-container { width: 60px; height: 40px; display: flex; align-items: flex-end; gap: 4px; margin-right: 20px; }
.eq-bar { flex: 1; background: var(--green); border-radius: 2px 2px 0 0; animation: eqPulse 0.5s infinite alternate; }

/* 3. Offline: Digital Flow */
.flow-container { width: 60px; height: 40px; position: relative; margin-right: 20px; overflow: hidden; border: 1px dashed var(--purple); border-radius: 8px; }
.flow-dot { position: absolute; width: 4px; height: 4px; background: var(--purple); border-radius: 50%; left: 50%; transform: translateX(-50%); animation: flowDown 1.5s infinite linear; }

/* Keyframes */
@keyframes rotateOrb { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes aiBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }
@keyframes textTyping { 0% { width: 20%; } 100% { width: 100%; } }
@keyframes eqPulse { from { height: 10%; } to { height: 100%; } }
@keyframes flowDown { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }

/* Content */
.card-content { flex: 1; z-index: 10; }
.card-title { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; color: #fff; margin: 0; }
.card-title .ai { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; line-height: 1.3; }

</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <div class="f2f-portal" onclick="location.href='/offline_languages.html'">
      <div class="neural-orb">
        <div class="ai-ring"></div>
        <div class="orbit-energy"><div class="e-ball ball-l"></div><div class="e-ball ball-b"></div></div>
        <div class="ai-core">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </div>
      </div>
      <h1 class="f2f-title">FaceToFace <span class="ai">AI</span></h1>
    </div>

    <div class="hub-cards">

      <div class="trans-card text-card" onclick="location.href='/pages/text_translate.html'">
        <div class="matrix-line"></div>
        <div class="text-blocks">
          <div class="line" style="animation-delay: 0s"></div>
          <div class="line" style="animation-delay: 0.2s"></div>
          <div class="line" style="animation-delay: 0.4s"></div>
          <div class="line" style="animation-delay: 0.6s"></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Metin Çeviri <span class="ai">AI</span></h2>
          <p class="card-desc">Karmaşık metinleri ve dökümanları kuantum hızıyla yerelleştir.</p>
        </div>
      </div>

      <div class="trans-card walkie-card" onclick="location.href='/pages/f2f_connect.html'">
        <div class="eq-container">
          <div class="eq-bar" style="animation-delay: 0.1s"></div>
          <div class="eq-bar" style="animation-delay: 0.3s"></div>
          <div class="eq-bar" style="animation-delay: 0.2s"></div>
          <div class="eq-bar" style="animation-delay: 0.4s"></div>
          <div class="eq-bar" style="animation-delay: 0.5s"></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Walkie-Talkie <span class="ai">AI</span></h2>
          <p class="card-desc">Uzak mesafeli anlık sesli iletişim odaları.</p>
        </div>
      </div>

      <div class="trans-card offline-card" onclick="location.href='/facetoface_offline.html'">
        <div class="flow-container">
          <div class="flow-dot" style="animation-delay: 0s"></div>
          <div class="flow-dot" style="animation-delay: 0.5s"></div>
          <div class="flow-dot" style="animation-delay: 1s"></div>
        </div>
        <div class="card-content">
          <h2 class="card-title">Offline Çeviri <span class="ai">AI</span></h2>
          <p class="card-desc">İnternet olmadan, indirilen paketlerle tam gizlilik.</p>
        </div>
      </div>

    </div>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });
</script>
</body>
</html>
