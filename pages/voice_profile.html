<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Sesini Tanıt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    html,body{
      margin:0;
      padding:0;
      background:#000;
      color:#fff;
      font-family:'Outfit',sans-serif;
      overflow:hidden;
    }

    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    #pageContent{
      min-height:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
      max-width:560px;
      margin:0 auto;
      background:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 36%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.11) 0%, rgba(0,0,0,0) 28%),
        #000;
    }

    .panel{
      background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 26px;
      padding: 16px 14px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .title{
      font-family:"Space Grotesk", system-ui, sans-serif;
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      letter-spacing: -0.4px;
      color: rgba(255,255,255,0.95);
      text-align:center;
    }

    .desc{
      font-size:13px;
      line-height:1.5;
      color:rgba(255,255,255,.68);
      text-align:center;
      margin:0;
    }

    .step{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;
      font-weight:700;
      color:rgba(255,255,255,.88);
      line-height:1.5;
    }

    .micWrap{
      display:flex;
      justify-content:center;
      padding:6px 0 2px;
    }

    .micBtn{
      width:92px;
      height:92px;
      border-radius:50%;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000), var(--ai-grad);
      background-origin:border-box;
      background-clip:content-box,border-box;
      background-color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;
    }

    .micBtn svg{
      width:34px;
      height:34px;
    }

    .micBtn.listening::after{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(165,180,252,.55);
      animation: pulse 1.15s infinite ease-in-out;
    }

    @keyframes pulse{
      0%{ transform:scale(.92); opacity:.8; }
      50%{ transform:scale(1.08); opacity:.25; }
      100%{ transform:scale(.92); opacity:.8; }
    }

    .status{
      text-align:center;
      font-size:13px;
      font-weight:800;
      color:#a5b4fc;
      min-height:20px;
    }

    .btn{
      min-height:52px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.2px;
    }

    .btn-primary{
      background:var(--ai-grad);
      color:#050510;
    }

    .btn-ghost{
      background:rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
    }

    .note{
      font-size:11px;
      line-height:1.45;
      color:rgba(255,255,255,.5);
      text-align:center;
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="panel">
      <h1 class="title">Sesini Tanıt</h1>
      <p class="desc">
        Çeviri sesinin sana daha yakın olması için kısa bir ses örneği kaydet.
      </p>

      <div class="step">
        Örnek cümle: <br>
        <b>“Merhaba, ben italkyAI kullanıyorum ve sesimi tanıtıyorum.”</b>
      </div>

      <div class="micWrap">
        <button class="micBtn" id="recordBtn" type="button" aria-label="Kayıt Başlat">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </button>
      </div>

      <div class="status" id="statusText">Kayda hazır</div>

      <button class="btn btn-primary" id="saveBtn" type="button">Ses Profilini Kaydet</button>
      <button class="btn btn-ghost" id="retryBtn" type="button">Tekrar Kaydet</button>

      <div class="note">
        Şimdilik bu ekran kayıt altyapısının başlangıcıdır. Sonraki adımda ses dosyası backend’e gönderilip profile bağlanacaktır.
      </div>
    </div>
  </main>

  <script type="module" src="/js/voice_profile_page.js"></script>
</body>
</html>
