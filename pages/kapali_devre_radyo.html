<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Kapalı Devre Radyo | italkyAI</title>
  <meta name="theme-color" content="#07111d">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#07111d;color:#f7fbff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,rgba(45,212,191,.16),transparent 34%),linear-gradient(145deg,#050b13,#091827 58%,#120c19)}
    .card{width:min(440px,100%);padding:28px;border:1px solid rgba(126,231,226,.22);border-radius:24px;background:rgba(10,24,39,.92);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
    .logo{width:126px;height:auto;margin-bottom:18px}
    h1{margin:0 0 10px;font-size:28px;line-height:1.05}
    p{margin:0 0 20px;color:#aebfd0;font-size:14px;line-height:1.55}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border:1px solid rgba(126,231,226,.35);border-radius:14px;background:linear-gradient(135deg,#1e807d,#1b5b73);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:wait}
    .back{display:block;margin-top:15px;color:#9fb3c6;font-size:12px;text-decoration:none}
    .status{min-height:20px;margin-top:14px;color:#9ff8f2;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI">
    <h1>Kapalı Devre Radyo</h1>
    <p>Radyo kanalınız tek oturumla doğrudan kurulum ve yönetim alanında açılır.</p>
    <button class="btn" id="continueBtn" type="button">Radyo Kanalını Oluştur</button>
    <div class="status" id="status">Bireysel oturum kontrol ediliyor…</div>
    <a class="back" href="/hosgeldiniz">Geri dön</a>
  </main>
  <script type="module">
    import { supabase } from '/js/supabase_client.js';
    import { loginWithGoogle } from '/js/auth.js';
    import { buildFromItalkyUrl } from '/js/icany_bridge.js';

    const button = document.getElementById('continueBtn');
    const status = document.getElementById('status');
    let session = null;

    async function readSession() {
      const { data } = await supabase.auth.getSession();
      session = data?.session || null;
      return session;
    }

    function openRadio(currentSession) {
      const token = String(currentSession?.access_token || '').trim();
      if (!token) return false;
      status.textContent = 'Radyo kurulum alanı açılıyor…';
      button.disabled = true;
      location.replace(buildFromItalkyUrl('/hosgeldiniz#radyo', token));
      return true;
    }

    async function continueFlow() {
      button.disabled = true;
      status.textContent = 'Bireysel oturum kontrol ediliyor…';
      try {
        const current = session || await readSession();
        if (openRadio(current)) return;
        status.textContent = 'Devam etmek için bireysel Google girişi gerekli.';
        button.disabled = false;
        button.textContent = 'Google ile giriş yap';
        await loginWithGoogle('/pages/kapali_devre_radyo.html');
      } catch (error) {
        console.warn('[closed-radio-bridge]', error);
        status.textContent = 'Giriş başlatılamadı. Lütfen tekrar deneyin.';
        button.disabled = false;
      }
    }

    button.addEventListener('click', continueFlow);

    try {
      const current = await readSession();
      if (!openRadio(current)) {
        status.textContent = 'Devam etmek için bireysel Google girişi gerekli.';
        button.textContent = 'Google ile giriş yap';
      }
    } catch {
      status.textContent = 'Oturum kontrolü yapılamadı. Lütfen düğmeye dokunun.';
    }
  </script>
</body>
</html>
