<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Interpreter QR</title>

  <meta name="theme-color" content="#000000">
  <style>
    html,body{
      background:#000 !important;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
  </style>

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --glass-border: rgba(255,255,255,.12);
      --glass-bg: rgba(255,255,255,.04);
      --ok:#34d399;
      --warn:#f59e0b;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    #pageContent{
      min-height:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:16px 14px calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 16px);
      max-width:560px;
      margin:0 auto;
      background:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 36%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.11) 0%, rgba(0,0,0,0) 28%),
        #000;
    }

    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:10px;
      padding:8px 8px 4px;
    }

    .heroTitle{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:900;
      color:#fff;
      margin:0;
      letter-spacing:-.8px;
    }

    .heroTitle .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .heroDesc{
      margin:0;
      font-size:12px;
      line-height:1.4;
      color:rgba(255,255,255,.55);
      max-width:420px;
    }

    .panel{
      background:var(--glass-bg);
      border:1px solid var(--glass-border);
      border-radius:28px;
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .qrWrap{
      min-height:280px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px;
      text-align:center;
      padding:18px;
    }

    .qrBox{
      width:220px;
      height:220px;
      border-radius:20px;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:900;
      text-align:center;
      padding:18px;
      line-height:1.35;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      padding:11px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      font-size:12px;
      font-weight:800;
      color:#fff;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--warn);
      box-shadow:0 0 10px rgba(245,158,11,.6);
      flex:0 0 auto;
    }

    .dot.ok{
      background:var(--ok);
      box-shadow:0 0 10px rgba(52,211,153,.6);
    }

    .muted{
      margin:0;
      font-size:11px;
      line-height:1.45;
      color:rgba(255,255,255,.5);
    }

    .btnRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn{
      min-height:54px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.2px;
      transition:.18s ease;
    }

    .btn:active{ transform:scale(.985); }

    .btnMain{
      background:var(--ai-grad);
      color:#050510;
    }

    .btnGhost{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }
  </style>
</head>

<body>
<main id="pageContent">

  <section class="hero">
    <h1 class="heroTitle">Interpreter QR <span class="ai">AI</span></h1>
    <p class="heroDesc">
      Karşı taraf QR’ı okutunca iki taraf da otomatik olarak canlı tercüman odasına geçer.
    </p>
  </section>

  <section class="panel">
    <div class="qrWrap">
      <div class="qrBox" id="qrBox">QR burada üretilecek</div>
      <div class="status">
        <span class="dot" id="pairDot"></span>
        <span id="pairText">Karşı taraf bekleniyor...</span>
      </div>
      <p class="muted">
        Oda bilgisi arka planda tutulur. Ekranda oda adı veya kod göstermiyoruz.
      </p>
    </div>

    <div class="btnRow">
      <button class="btn btnGhost" id="cancelBtn" type="button">İptal</button>
      <button class="btn btnMain" id="mockJoinBtn" type="button">Test İçin Katılımcı Geldi</button>
    </div>
  </section>

</main>

<script type="module" src="/js/interpreter_qr_host.js"></script>
</body>
</html>
