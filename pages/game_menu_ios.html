<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Eğlenerek Öğren</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Grotesk:wght@700;800&display=swap');
:root{--line:rgba(255,255,255,.12);--muted:rgba(226,232,240,.68);--txt:#f8fafc;--cyan:#67e8f9;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}html,body{margin:0;width:100%;height:100%;color:var(--txt);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
#pageContent{height:100%;display:flex;flex-direction:column;opacity:0;transform:translateY(8px);transition:opacity .28s ease,transform .28s ease;padding:12px 14px 10px}#pageContent.ui-ready{opacity:1;transform:translateY(0)}
.menu-shell{width:100%;max-width:680px;height:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}.game-orbit-hero{flex:0 0 auto;min-height:116px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.game-orbit-wrap{position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center}.game-orbit-core{position:absolute;inset:50%;width:58px;height:58px;margin-left:-29px;margin-top:-29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.10),transparent 26%),linear-gradient(180deg,#030406 0%,#0a0d18 100%);border:1px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;color:#f5f7ff;font-size:11px;font-weight:1000;box-shadow:inset 0 0 18px rgba(255,255,255,.04),0 0 30px rgba(124,92,255,.18)}.game-orbit-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(139,211,255,.15);animation:orbitSpin 18s linear infinite}.game-orbit-ring.ring-2{inset:14px;animation-duration:14s;animation-direction:reverse;border-color:rgba(255,102,196,.14)}.game-orbit-ring.ring-3{inset:28px;animation-duration:11s;border-color:rgba(52,211,153,.14)}.orbit-dot{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-shadow:0 0 14px currentColor}.dot-red{background:#ff4d6d;color:#ff4d6d}.dot-blue{background:#38bdf8;color:#38bdf8}.dot-green{background:#34d399;color:#34d399}@keyframes orbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.game-hub{flex:1;min-height:0;overflow-y:auto;display:grid;gap:11px;padding:1px 1px calc(10px + var(--safe-bottom));scrollbar-width:none}.game-hub::-webkit-scrollbar{display:none}.game-card{position:relative;min-height:104px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(15,23,42,.62));box-shadow:0 14px 30px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.045);display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;padding:14px;overflow:hidden;cursor:pointer;color:#fff;text-align:left;font:inherit}.game-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 45%,var(--accent),transparent 40%);opacity:.14;pointer-events:none}.game-card:active{transform:scale(.987);filter:brightness(1.06)}.g-cyan{--accent:#67e8f9}.g-gold{--accent:#facc15}.g-pink{--accent:#f472b6}.g-green{--accent:#34d399}.g-violet{--accent:#a78bfa}.game-icon{position:relative;z-index:2;width:58px;height:58px;border-radius:19px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:30px}.game-info{position:relative;z-index:2;min-width:0}.game-head{display:flex;align-items:center;gap:8px;min-width:0}.game-info h2{margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;line-height:1;font-weight:900;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.22);color:#dbeafe;font-size:9px;font-weight:1000;letter-spacing:.2px}.tag.featured{background:rgba(250,204,21,.16);border-color:rgba(250,204,21,.30);color:#fef3c7}.game-info p{margin:7px 0 0;color:rgba(226,232,240,.72);font-size:12px;line-height:1.32;font-weight:800}.start-chip{position:relative;z-index:2;align-self:center;min-width:58px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:1000;text-align:center}.modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,23,.72);backdrop-filter:blur(12px)}.modal.show{display:flex}.modal-card{width:min(100%,420px);border-radius:24px;border:1px solid rgba(147,197,253,.22);background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.98));box-shadow:0 26px 70px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.06);padding:18px;color:#fff}.modal-title{margin:0;font-family:'Space Grotesk',sans-serif;font-size:22px;line-height:1.05;font-weight:900}.modal-desc{margin:9px 0 15px;color:rgba(226,232,240,.74);font-size:13px;line-height:1.45;font-weight:800}.language-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:14px}.lang-choice{min-height:48px;border:1px solid rgba(255,255,255,.11);border-radius:16px;background:rgba(255,255,255,.055);color:#fff;font:inherit;font-size:14px;font-weight:1000;display:flex;align-items:center;justify-content:space-between;padding:0 13px;cursor:pointer}.lang-choice.active{border-color:rgba(103,232,249,.46);background:linear-gradient(135deg,rgba(103,232,249,.15),rgba(96,165,250,.10))}.rule-box{margin:12px 0 14px;padding:13px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10)}.rule-meta{color:#bfdbfe;font-size:12px;font-weight:1000;margin-bottom:8px}.rule-box p{margin:0 0 9px;color:rgba(226,232,240,.78);font-size:13px;line-height:1.45;font-weight:800}.rule-box ul{margin:0;padding-left:18px;color:rgba(226,232,240,.80);font-size:13px;line-height:1.5;font-weight:800}.modal-actions{display:grid;gap:9px}.primary-btn,.secondary-btn{min-height:50px;border:0;border-radius:16px;font:inherit;font-size:14px;font-weight:1000;cursor:pointer}.primary-btn{color:#061227;background:linear-gradient(135deg,#dbeafe,#60a5fa);box-shadow:0 14px 28px rgba(37,99,235,.22)}.secondary-btn{color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-bottom));transform:translateX(-50%) translateY(120px);max-width:min(92vw,430px);min-height:44px;padding:11px 16px;border-radius:16px;background:rgba(12,16,28,.96);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:12px;font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;z-index:9999;box-shadow:0 18px 36px rgba(0,0,0,.35);transition:.22s ease;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:390px){#pageContent{padding-left:10px;padding-right:10px}.game-orbit-hero{min-height:104px}.game-orbit-wrap{width:96px;height:96px}.game-card{grid-template-columns:50px 1fr auto;gap:10px;min-height:100px;padding:12px}.game-icon{width:50px;height:50px;font-size:26px;border-radius:17px}.game-info h2{font-size:17px}.game-info p{font-size:11.5px}.start-chip{min-width:52px;padding:8px 8px;font-size:10px}}
</style>
</head>
<body>
<main id="pageContent">
  <div class="menu-shell">
    <section class="game-orbit-hero" aria-label="italkyAI oyun animasyonu"><div class="game-orbit-wrap" aria-hidden="true"><div class="game-orbit-core" data-no-translate="1">italkyAI</div><div class="game-orbit-ring ring-1"><span class="orbit-dot dot-red"></span></div><div class="game-orbit-ring ring-2"><span class="orbit-dot dot-blue"></span></div><div class="game-orbit-ring ring-3"><span class="orbit-dot dot-green"></span></div></div></section>
    <section id="gameHub" class="game-hub" aria-label="Oyunlar">
      <button class="game-card g-gold" type="button" data-game-id="hangman" data-url="/pages/hangman_ios.html" data-featured="1" data-popularity="84" data-desc="Kelimeyi tahmin et, harfleri doğru seç." data-goal="Sınırlı denemeyle gizli kelimeyi bulmaya çalışın."><div class="game-icon">🪂</div><div class="game-info"><div class="game-head"><h2>Hangman</h2><span class="tag featured">Öne çıkan</span></div><p>Kelimeyi tahmin et, harfleri doğru seç.</p></div><div class="start-chip">Başla</div></button>
      <button class="game-card g-pink" type="button" data-game-id="word_cracker" data-url="/pages/word_cracker_ios.html" data-popularity="96" data-desc="Şifreleri kır, kelime bağlantılarını çöz." data-goal="Verilen ipuçlarından doğru kelimeyi bulmaya çalışın."><div class="game-icon">🔐</div><div class="game-info"><div class="game-head"><h2>Code Cracker</h2><span class="tag">Popüler</span></div><p>Şifreleri kır, kelime bağlantılarını çöz.</p></div><div class="start-chip">Başla</div></button>
      <button class="game-card g-violet" type="button" data-game-id="gap_master" data-url="/pages/gap_master_ios.html" data-popularity="89" data-desc="Boşlukları doğru kelimeyle tamamla." data-goal="Türkçe anlamı inceleyin ve boşluğu tamamlayan doğru hedef dil kelimesini seçin."><div class="game-icon">📝</div><div class="game-info"><div class="game-head"><h2>Gap Master</h2></div><p>Boşlukları doğru kelimeyle tamamla.</p></div><div class="start-chip">Başla</div></button>
      <button class="game-card g-pink" type="button" data-game-id="glitch" data-url="/pages/glitch_ios.html" data-popularity="68" data-desc="Hatalı ifadeyi bul ve düzelt." data-goal="Türkçe anlamı inceleyin ve doğru hedef dil kelimesini yanlış seçeneklerin arasından bulun."><div class="game-icon">👾</div><div class="game-info"><div class="game-head"><h2>Glitch Hunt</h2></div><p>Hatalı ifadeyi bul ve düzelt.</p></div><div class="start-chip">Başla</div></button>
      <button class="game-card g-violet" type="button" data-game-id="signal_hunt" data-url="/pages/signal_hunt_ios.html" data-popularity="48" data-desc="Sinyali dinle, doğru kelimeyi bul." data-goal="Türkçe anlamı inceleyin, sinyali dinleyin ve doğru hedef dil kelimesini yanlış sinyallerin arasından bulun."><div class="game-icon">🕵️</div><div class="game-info"><div class="game-head"><h2>Spy Master</h2></div><p>Sinyali dinle, doğru kelimeyi bul.</p></div><div class="start-chip">Başla</div></button>
    </section>
  </div>
</main>
<div id="languageModal" class="modal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="languageTitle"><h2 id="languageTitle" class="modal-title">Dil seçin</h2><p class="modal-desc">Bu oyunu hangi dilde oynamak istiyorsunuz?</p><div id="languageGrid" class="language-grid"></div><div class="modal-actions"><button id="languageContinue" class="primary-btn" type="button">Devam et</button><button id="languageCancel" class="secondary-btn" type="button">Vazgeç</button></div></div></div>
<div id="rulesModal" class="modal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><h2 id="rulesTitle" class="modal-title">Oyun Kuralları</h2><p id="rulesGameName" class="modal-desc"></p><div class="rule-box"><div id="rulesLang" class="rule-meta"></div><p id="rulesGoal"></p><ul><li>Verilen kelime veya cümleleri dikkatlice inceleyin.</li><li>Doğru seçeneği bulun ve hızlı cevap verin.</li><li>Ne kadar hızlı ve doğru cevap verirseniz puanınız o kadar artar.</li></ul></div><div class="modal-actions"><button id="rulesStart" class="primary-btn" type="button">Anladım, başla</button><button id="rulesBack" class="secondary-btn" type="button">Dile geri dön</button></div></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { initGlobalAccess } from "/js/global_access_ios.js";
try{mountShell({scroll:"auto"});}catch(error){console.warn("[GAME_MENU] shell mount failed",JSON.stringify({message:error?.message||String(error)}));}
initGlobalAccess({ allowPublicPageBypass: false }).catch((error)=>console.warn("[GAME_MENU] access init failed", JSON.stringify({ message:error?.message||String(error) })));
const pageContent=document.getElementById("pageContent"),gameHub=document.getElementById("gameHub"),languageModal=document.getElementById("languageModal"),languageGrid=document.getElementById("languageGrid"),languageContinue=document.getElementById("languageContinue"),languageCancel=document.getElementById("languageCancel"),rulesModal=document.getElementById("rulesModal"),rulesGameName=document.getElementById("rulesGameName"),rulesLang=document.getElementById("rulesLang"),rulesGoal=document.getElementById("rulesGoal"),rulesStart=document.getElementById("rulesStart"),rulesBack=document.getElementById("rulesBack");
const LANGS=[{code:"en",name:"İngilizce",flag:"🇬🇧"},{code:"de",name:"Almanca",flag:"🇩🇪"},{code:"fr",name:"Fransızca",flag:"🇫🇷"},{code:"es",name:"İspanyolca",flag:"🇪🇸"},{code:"it",name:"İtalyanca",flag:"🇮🇹"}];
let selectedCard=null,selectedLang=localStorage.getItem("italky_game_lang_v1")||"en";
function setModal(modal,open){modal?.classList.toggle("show",!!open);modal?.setAttribute("aria-hidden",open?"false":"true")}
function renderLanguages(){languageGrid.innerHTML=LANGS.map(lang=>`<button class="lang-choice ${lang.code===selectedLang?"active":""}" type="button" data-lang="${lang.code}"><span>${lang.flag} ${lang.name}</span><strong>${lang.code.toUpperCase()}</strong></button>`).join("");languageGrid.querySelectorAll(".lang-choice").forEach(button=>{button.addEventListener("click",()=>{selectedLang=button.dataset.lang||"en";localStorage.setItem("italky_game_lang_v1",selectedLang);renderLanguages()})})}
function openLanguageStep(card){selectedCard=card;renderLanguages();setModal(languageModal,true)}
function openRulesStep(){if(!selectedCard)return;const title=selectedCard.querySelector("h2")?.textContent?.trim()||"Oyun";const goal=selectedCard.dataset.goal||"Bu oyunda verilen kelime veya cümleleri dikkatlice inceleyin ve doğru seçeneği bulun.";const lang=LANGS.find(item=>item.code===selectedLang)||LANGS[0];rulesGameName.textContent=title;rulesLang.textContent=`Seçilen dil: ${lang.flag} ${lang.name}`;rulesGoal.textContent=goal;setModal(languageModal,false);setModal(rulesModal,true)}
function startSelectedGame(){if(!selectedCard)return;const targetUrl=selectedCard.dataset.url||"",gameId=selectedCard.dataset.gameId||"game";if(!targetUrl)return;const url=new URL(targetUrl,location.origin);url.searchParams.set("lang",selectedLang);url.searchParams.set("ios","1");sessionStorage.setItem("italky_game_selected_lang_v1",selectedLang);sessionStorage.setItem(`italky_game_lang_${gameId}`,selectedLang);location.href=`${url.pathname}${url.search}`}
gameHub.querySelectorAll(".game-card[data-url]").forEach(card=>card.addEventListener("click",()=>openLanguageStep(card)));
languageContinue?.addEventListener("click",openRulesStep);languageCancel?.addEventListener("click",()=>setModal(languageModal,false));rulesStart?.addEventListener("click",startSelectedGame);rulesBack?.addEventListener("click",()=>{setModal(rulesModal,false);setModal(languageModal,true)});[languageModal,rulesModal].forEach(modal=>modal?.addEventListener("click",event=>{if(event.target===modal)setModal(modal,false)}));
const cards=Array.from(gameHub.querySelectorAll(".game-card[data-url]"));cards.sort((a,b)=>{const bf=b.dataset.featured==="1"?1:0,af=a.dataset.featured==="1"?1:0;if(bf!==af)return bf-af;return Number(b.dataset.playCount||b.dataset.totalPlays||b.dataset.popularity||0)-Number(a.dataset.playCount||a.dataset.totalPlays||a.dataset.popularity||0)}).forEach(card=>gameHub.appendChild(card));
window.addEventListener("load",()=>setTimeout(()=>pageContent?.classList.add("ui-ready"),90));setTimeout(()=>pageContent?.classList.add("ui-ready"),180);
console.warn("[GAME_MENU] ready",JSON.stringify({games:gameHub.querySelectorAll(".game-card").length,hero:"orbit",introRemoved:true,shell:"ui_shell"}));
</script>

<script src="/js/ai_data_consent.js"></script>

<script type="module" src="/js/site_language_boot.js"></script>
</body>
</html>
