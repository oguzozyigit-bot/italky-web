<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Meeting</title>
  <meta name="theme-color" content="#081a36"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#081a36;
      --line:rgba(255,255,255,.08);
      --txt:#f7fbff;
      --muted:rgba(255,255,255,.62);
      --green:#32d399;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --header-h:84px;
      --footer-h:52px;
      --composer-h:92px;
      --keyboard-offset:0px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Outfit,Arial,sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 12% 0%, rgba(120,190,255,.16), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(118,235,255,.08), transparent 18%),
        linear-gradient(180deg,#061325 0%, #081a36 58%, #07152c 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.08;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:100% 3px, 3px 100%;
    }

    .app{
      position:relative;
      width:100%;
      max-width:430px;
      height:100dvh;
      margin:0 auto;
      overflow:hidden;
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
      box-shadow:0 18px 40px rgba(0,0,0,.24);
    }

    .header{
      position:absolute;
      inset:0 0 auto 0;
      z-index:30;
      height:calc(var(--header-h) + var(--safe-top));
      padding:calc(10px + var(--safe-top)) 16px 10px;
      display:grid;
      grid-template-columns:56px 1fr 82px;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg, rgba(8,26,54,.96), rgba(8,26,54,.78));
      backdrop-filter:blur(16px);
    }

    .icon-btn,.send-btn,.mic-btn,.speaker-btn,.copy-btn,.action-btn{
      border:none;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-family:inherit;
    }

    .icon-btn{
      width:56px;
      height:56px;
      border-radius:20px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }

    .icon-btn svg,
    .send-btn svg,
    .mic-btn svg,
    .speaker-btn svg,
    .copy-btn svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .brand{
      text-align:center;
      line-height:1;
      user-select:none;
      cursor:pointer;
    }

    .brand-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:26px;
      font-weight:800;
      letter-spacing:-.6px;
      color:#fff;
    }

    .brand-title .ai{
      background:linear-gradient(135deg,#8fddff 0%,#83b5ff 46%,#c18dff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-sub{
      margin-top:4px;
      font-size:10px;
      font-weight:900;
      letter-spacing:3px;
      color:rgba(255,255,255,.25);
    }

    .count-pill{
      height:58px;
      border-radius:20px;
      border:1px solid rgba(143,215,255,.20);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .count-num{
      font-size:22px;
      font-weight:1000;
      line-height:1;
    }

    .count-label{
      margin-top:4px;
      font-size:11px;
      font-weight:900;
      color:#def7ff;
      line-height:1;
    }

    .main{
      position:absolute;
      inset:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--footer-h) + var(--safe-bottom)) 0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .meeting-top{
      flex:0 0 auto;
      padding:10px 14px 6px;
      background:linear-gradient(180deg, rgba(8,26,54,.72), rgba(8,26,54,.04));
      backdrop-filter:blur(6px);
    }

    .participants-strip{
      display:flex;
      gap:10px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      padding:2px 2px 2px;
      align-items:flex-start;
    }

    .participants-strip::-webkit-scrollbar{
      display:none;
    }

    .participant-chip{
      min-width:62px;
      max-width:68px;
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }

    .participant-avatar{
      width:52px;
      height:52px;
      border-radius:50%;
      overflow:hidden;
      background:linear-gradient(135deg,#2457a3,#4d8fff);
      border:2px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:16px;
      font-weight:1000;
      position:relative;
    }

    .participant-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .participant-avatar::after{
      content:"";
      position:absolute;
      right:2px;
      bottom:2px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--green);
      border:2px solid #0b1f3d;
    }

    .participant-host::before{
      content:"★";
      position:absolute;
      left:-2px;
      top:-2px;
      font-size:13px;
      width:18px;
      height:18px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f6c453;
      color:#1d2330;
      font-weight:1000;
      box-shadow:0 4px 10px rgba(0,0,0,.2);
    }

    .participant-name{
      width:100%;
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:#eef8ff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.05;
    }

    .chat-scroll{
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      padding:2px 14px calc(var(--composer-h) + 24px + var(--keyboard-offset));
      scroll-behavior:smooth;
    }

    .chat-scroll::-webkit-scrollbar{
      display:none;
    }

    .chat-feed{
      min-height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      gap:10px;
    }

    .msg{
      display:flex;
      width:100%;
      flex:0 0 auto;
    }

    .msg.mine{ justify-content:flex-start; }
    .msg.other{ justify-content:flex-end; }
    .msg.system{ justify-content:center; }

    .msg-block{
      max-width:76%;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .msg-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .msg.mine .msg-row{ justify-content:flex-start; }
    .msg.other .msg-row{ justify-content:flex-end; flex-direction:row-reverse; }

    .bubble{
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:52px;
      padding:14px 14px 14px 16px;
      border-radius:26px;
      background:linear-gradient(180deg, rgba(10,24,49,.96), rgba(9,21,43,.96));
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 8px 22px rgba(0,0,0,.16);
    }

    .bubble::before{
      content:"";
      position:absolute;
      left:6px;
      top:8px;
      bottom:8px;
      width:4px;
      border-radius:999px;
      background:var(--line-color,#8cd7ff);
    }

    .msg.other .bubble::before{
      left:auto;
      right:6px;
    }

    .bubble-text{
      flex:1 1 auto;
      min-width:0;
      font-size:15px;
      font-weight:900;
      line-height:1.45;
      color:#fff;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .speaker-btn{
      width:40px;
      height:40px;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .msg-author{
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.72);
      padding:0 4px;
    }

    .msg.mine .msg-author{ text-align:left; }
    .msg.other .msg-author{ text-align:right; }

    .system-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(104,225,255,.10);
      border:1px solid rgba(104,225,255,.18);
      color:#dff8ff;
      font-size:12px;
      font-weight:1000;
      text-align:center;
    }

    .composer-wrap{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      z-index:12;
      transform:translateY(calc(-1 * var(--keyboard-offset)));
      transition:transform .15s ease;
    }

    .composer{
      min-height:76px;
      display:flex;
      align-items:flex-end;
      gap:10px;
      padding:12px 14px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      backdrop-filter:blur(14px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(0,0,0,.20);
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
    }

    .composer-input{
      width:100%;
      min-height:28px;
      max-height:120px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:900;
      line-height:1.4;
      font-family:inherit;
      overflow:auto;
      scrollbar-width:none;
    }

    .composer-input::-webkit-scrollbar{
      display:none;
    }

    .composer-input::placeholder{
      color:rgba(255,255,255,.70);
      font-weight:900;
    }

    .send-btn,.mic-btn{
      width:46px;
      height:46px;
      border-radius:18px;
      flex:0 0 auto;
    }

    .mic-btn{ background:transparent; }

    .send-btn{
      background:#fff;
      color:#06101f;
      box-shadow:0 0 24px rgba(255,255,255,.08);
    }

    .hidden{ display:none !important; }

    .footer{
      position:absolute;
      inset:auto 0 0 0;
      z-index:20;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding:12px 14px calc(12px + var(--safe-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(7,22,47,.88);
      backdrop-filter:blur(14px);
    }

    .seal{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:12px;
      font-weight:1000;
      text-align:center;
      flex-wrap:wrap;
    }

    .seal-main{
      background:linear-gradient(135deg,#7fd8ff 0%,#82b8ff 45%,#d29bff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .brand-seal{
      background:linear-gradient(135deg,#7fd8ff 0%,#82b8ff 45%,#d29bff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      line-height:1.2;
    }

    .gokturk-signature{
      display:block;
      margin-top:3px;
      font-family:"Segoe UI Historic","Noto Sans Old Turkic",serif;
      font-size:12px;
      font-weight:900;
      direction:rtl;
      unicode-bidi:isolate;
    }

    .drawer-layer,.lang-layer,.confirm-layer{
      position:absolute;
      inset:0;
      z-index:120;
      pointer-events:none;
    }

    .drawer-layer.open,.lang-layer.open,.confirm-layer.open{
      pointer-events:auto;
    }

    .drawer-backdrop,.lang-backdrop,.confirm-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(4px);
      opacity:0;
      transition:opacity .24s ease;
    }

    .drawer-layer.open .drawer-backdrop,
    .lang-layer.open .lang-backdrop,
    .confirm-layer.open .confirm-backdrop{
      opacity:1;
    }

    .drawer-panel{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:min(88vw,360px);
      transform:translateX(-105%);
      transition:transform .26s ease;
      background:linear-gradient(180deg, rgba(8,20,41,.98), rgba(7,17,34,.98));
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:18px 0 36px rgba(0,0,0,.28);
      padding:calc(16px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .drawer-panel::-webkit-scrollbar{ display:none; }

    .drawer-layer.open .drawer-panel{
      transform:translateX(0);
    }

    .lang-panel{
      position:absolute;
      left:16px;
      right:16px;
      bottom:20px;
      max-height:70vh;
      overflow:hidden;
      transform:translateY(120%);
      transition:transform .26s ease;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(11,24,47,.98), rgba(8,20,40,.98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 18px 40px rgba(0,0,0,.28);
      display:flex;
      flex-direction:column;
    }

    .lang-layer.open .lang-panel{
      transform:translateY(0);
    }

    .confirm-card{
      position:absolute;
      left:16px;
      right:16px;
      top:50%;
      transform:translateY(-50%) scale(.96);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(11,24,47,.98), rgba(8,20,40,.98));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 18px 40px rgba(0,0,0,.28);
      padding:18px;
      opacity:0;
      transition:.22s ease;
    }

    .confirm-layer.open .confirm-card{
      opacity:1;
      transform:translateY(-50%) scale(1);
    }

    .confirm-title{
      font-size:22px;
      font-weight:1000;
      color:#fff;
      margin:0 0 8px;
    }

    .confirm-text{
      font-size:14px;
      line-height:1.55;
      color:#dff4ff;
      font-weight:800;
      margin:0 0 16px;
    }

    .confirm-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .drawer-brand{
      border-radius:26px;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 15% 0%, rgba(121,221,255,.12), transparent 28%),
        rgba(255,255,255,.03);
      padding:18px 16px;
      text-align:center;
    }

    .drawer-brand-title{
      font-family:"Space Grotesk",sans-serif;
      font-size:28px;
      font-weight:800;
      line-height:1;
      color:#fff;
      letter-spacing:-.6px;
    }

    .drawer-brand-title .ai{
      background:linear-gradient(135deg,#8fddff 0%,#83b5ff 46%,#c18dff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .drawer-brand-sub{
      margin-top:6px;
      font-size:12px;
      font-weight:1000;
      letter-spacing:3px;
      color:#9fe8ff;
    }

    .card{
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      padding:14px;
    }

    .mini-label{
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.9px;
      color:rgba(255,255,255,.48);
      margin-bottom:10px;
    }

    .profile-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .drawer-avatar{
      width:64px;
      height:64px;
      border-radius:22px;
      overflow:hidden;
      background:linear-gradient(135deg,#2b68c1,#62a3ff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:1000;
      color:#fff;
      flex:0 0 auto;
    }

    .drawer-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-name{
      font-size:18px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .profile-status{
      margin-top:6px;
      font-size:14px;
      font-weight:900;
      color:#dff4ff;
    }

    .lang-trigger,.primary-btn,.danger-btn,.ghost-btn,.action-btn{
      width:100%;
      min-height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      outline:none;
      font-family:inherit;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }

    .lang-trigger{
      background:rgba(255,255,255,.04);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      gap:12px;
    }

    .lang-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .lang-flag{
      font-size:21px;
      line-height:1;
    }

    .lang-name{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .room-code-card{
      border-radius:24px;
      border:1px solid rgba(121,221,255,.16);
      background:
        radial-gradient(circle at 12% 0%, rgba(121,221,255,.10), transparent 26%),
        rgba(255,255,255,.04);
      padding:14px;
    }

    .room-code-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .room-code-value{
      flex:1;
      min-height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      padding:0 16px;
      font-size:28px;
      font-weight:1000;
      color:#fff;
      letter-spacing:.8px;
    }

    .copy-btn{
      width:58px;
      height:58px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .room-help{
      margin-top:12px;
      font-size:13px;
      line-height:1.45;
      color:#d8f4ff;
      font-weight:800;
    }

    .meeting-date-card{
      display:none;
    }

    .meeting-date-value{
      min-height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      padding:0 16px;
      font-size:18px;
      font-weight:1000;
      color:#fff;
    }

    .primary-btn{
      background:linear-gradient(135deg,#8ad8ff 0%, #74dfff 100%);
      color:#07162f;
    }

    .danger-btn{
      background:rgba(255,94,94,.14);
      border:1px solid rgba(255,94,94,.22);
      color:#ffd1d1;
    }

    .ghost-btn{
      background:rgba(255,255,255,.05);
      color:#fff;
    }

    .action-btn.secondary{
      background:rgba(255,255,255,.05);
      color:#fff;
    }

    .action-btn.primary{
      background:linear-gradient(135deg,#8ad8ff 0%, #74dfff 100%);
      color:#07162f;
    }

    .lang-list{
      padding:0 0 10px;
      overflow-y:auto;
      scrollbar-width:none;
    }

    .lang-list::-webkit-scrollbar{ display:none; }

    .lang-option{
      width:100%;
      min-height:60px;
      padding:0 18px;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      border-top:1px solid rgba(255,255,255,.05);
      font-family:inherit;
    }

    .lang-option:first-child{ border-top:none; }

    .lang-option-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .lang-option-name{
      font-size:16px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lang-check{
      width:22px;
      height:22px;
      border-radius:50%;
