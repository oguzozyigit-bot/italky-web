<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>italkyAI</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f7fbff;overflow:hidden}
#mount{width:100%;height:100%;opacity:0;transition:opacity .08s linear}
#mount.ui-ready{opacity:1}
#verify{display:none!important;pointer-events:none!important}
#home{display:block!important}
.modernSearch,.filterRow{display:none!important}
.homeQuickComposer{display:none!important}
vercel-live-feedback,#vercel-toolbar,[data-vercel-toolbar],[data-testid="vercel-toolbar"]{display:none!important}
[data-italky-footer],.italky-global-footer,.brand-seal,.prestige-signature,.signature,.drawer-footer-seal,.menu-sign,.it-mode-dock{display:none!important}
.chat.hidden{display:none!important}
.chat:not(.hidden){display:flex!important;flex-direction:column!important;position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important;z-index:200!important;background:#eaf1f8!important}
.chat:not(.hidden) .chatHead{position:relative!important;z-index:12000!important;pointer-events:auto!important}
.chat:not(.hidden) .chatHead #audio,.chat:not(.hidden) .chatHead #video,.chat:not(.hidden) .chatHead #backChat,.chat:not(.hidden) .chatHead .moreChat{position:relative!important;z-index:12001!important;pointer-events:auto!important;touch-action:manipulation!important}
.chat:not(.hidden) .messages{flex:1!important;min-height:0!important;overflow:auto!important;padding-bottom:82px!important}
.chat:not(.hidden) .composer{display:flex!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;min-height:64px!important;z-index:260!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;background:#dfe8f1!important;padding:7px 8px calc(7px + env(safe-area-inset-bottom))!important;align-items:center!important;gap:7px!important}
.chat:not(.hidden) .waInputShell{display:flex!important;flex:1!important;min-width:0!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}
.chat:not(.hidden) #msg{display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;min-width:0!important;flex:1!important}
.chat:not(.hidden) #send,.chat:not(.hidden) #voice{visibility:visible!important;opacity:1!important;pointer-events:auto!important}
</style>
<script>
(()=>{const q=new URLSearchParams(location.search);if(q.get('skipLanguageGate')==='1'||q.get('languageChosen')==='1')return;const verified=localStorage.getItem('italky_phone_verified')==='1',phone=String(localStorage.getItem('italky_phone_number')||'').trim();if(verified&&phone)location.replace('/pages/language_gate.html')})();
</script>
</head>
<body>
<div id="mount"></div>
<script>
(async()=>{
  const mount=document.getElementById('mount');
  const reveal=()=>mount.classList.add('ui-ready');
  const fallback=setTimeout(reveal,2200);
  try{
    const html=await fetch('/pages/italky_messenger_v4.html?v=24',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Ana ekran yüklenemedi');return r.text()});
    const parsed=new DOMParser().parseFromString(html,'text/html');
    parsed.head.querySelectorAll('style').forEach(src=>{const s=document.createElement('style');s.textContent=src.textContent;document.head.appendChild(s)});
    const skin=document.createElement('link');skin.rel='stylesheet';skin.href='/css/italky_whatsapp_skin.css?v=19';document.head.appendChild(skin);
    const bubbles=document.createElement('link');bubbles.rel='stylesheet';bubbles.href='/css/italky_chat_bubbles_v1.css?v=1';document.head.appendChild(bubbles);
    mount.innerHTML=parsed.body.innerHTML;
    document.querySelector('#verify')?.classList.add('hidden');
    document.querySelector('#home')?.classList.remove('hidden');

    const loadClassic=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    const loadModule=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.type='module';s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});

    await loadClassic('https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.6/build/js/intlTelInput.min.js').catch(()=>{});
    await loadModule('/js/italky_messenger_v4.js?v=24');
    for(const src of[
      '/js/language_priority.js?v=3',
      '/js/italky_whatsapp_skin.js?v=14',
      '/js/italky_brand_theme.js?v=4',
      '/js/italky_messenger_controls_v5.js?v=12',
      '/js/italky_guest_qr.js?v=3',
      '/js/italky_main_menu.js?v=3',
      '/js/italky_optimistic_message.js?v=3',
      '/js/italky_home_polish_v1.js?v=9',
      '/js/italky_message_select_v2.js?v=1',
      '/js/italky_call_live_translate_v1.js?v=4'
    ]){await loadClassic(src).catch(err=>console.warn('script',src,err))}

    document.querySelectorAll('.homeQuickComposer').forEach(x=>x.remove());

    const lockLogo=()=>{
      document.title='italkyAI';
      const title=document.querySelector('.waTitle');
      if(title && !title.querySelector('img')) title.innerHTML='<img class="waBrandLogo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI">';
    };
    const ensureChatComposer=()=>{
      const chat=document.getElementById('chat');
      const composer=chat?.querySelector('.composer');
      if(!chat||!composer||chat.classList.contains('hidden'))return;
      chat.appendChild(composer);
      composer.style.display='flex';
      composer.style.position='fixed';
      composer.style.left='0';
      composer.style.right='0';
      composer.style.bottom='0';
      composer.style.visibility='visible';
      composer.style.opacity='1';
      composer.style.pointerEvents='auto';
      document.getElementById('msg')?.setAttribute('placeholder','Mesaj');
    };
    lockLogo();
    ensureChatComposer();
    const chat=document.getElementById('chat');
    if(chat)new MutationObserver(ensureChatComposer).observe(chat,{attributes:true,attributeFilter:['class']});
    setTimeout(lockLogo,600);
    setTimeout(ensureChatComposer,700);
    document.querySelector('#verify')?.classList.add('hidden');
    document.querySelector('#home')?.classList.remove('hidden');
    clearTimeout(fallback);
    reveal();
  }catch(err){
    console.error(err);
    clearTimeout(fallback);
    mount.innerHTML='<div style="min-height:100%;display:grid;place-items:center;padding:24px;background:#06182b;color:white;font-family:system-ui;text-align:center"><div><img src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI" style="width:150px;max-width:45vw"><p style="opacity:.8">Ana ekran yüklenemedi. Sayfayı yenileyin.</p></div></div>';
    reveal();
  }
})();
</script>
</body>
</html>
