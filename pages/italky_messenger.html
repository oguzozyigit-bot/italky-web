<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>italkyAI</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f7fbff;overflow:hidden}
#mount{width:100%;height:100%}
#verify{display:none!important;pointer-events:none!important}
#home{display:block!important}
.modernSearch,.filterRow{display:none!important}
vercel-live-feedback,#vercel-toolbar,[data-vercel-toolbar],[data-testid="vercel-toolbar"]{display:none!important}
[data-italky-footer],.italky-global-footer,.brand-seal,.prestige-signature,.signature,.drawer-footer-seal,.menu-sign,.it-mode-dock{display:none!important}
</style>
<script>
(()=>{const q=new URLSearchParams(location.search);if(q.get('skipLanguageGate')==='1'||q.get('languageChosen')==='1')return;const verified=localStorage.getItem('italky_phone_verified')==='1',phone=String(localStorage.getItem('italky_phone_number')||'').trim();if(verified&&phone)location.replace('/pages/language_gate.html')})();
</script>
</head>
<body>
<div id="mount"></div>
<script>
(async()=>{
  const mount=document.getElementById('mount');
  try{
    const html=await fetch('/pages/italky_messenger_v4.html?v=22',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Ana ekran yüklenemedi');return r.text()});
    const parsed=new DOMParser().parseFromString(html,'text/html');
    parsed.head.querySelectorAll('style').forEach(src=>{const s=document.createElement('style');s.textContent=src.textContent;document.head.appendChild(s)});
    const skin=document.createElement('link');skin.rel='stylesheet';skin.href='/css/italky_whatsapp_skin.css?v=18';document.head.appendChild(skin);
    mount.innerHTML=parsed.body.innerHTML;
    document.querySelector('#verify')?.classList.add('hidden');
    document.querySelector('#home')?.classList.remove('hidden');

    const loadClassic=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    const loadModule=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.type='module';s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});

    await loadClassic('https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.6/build/js/intlTelInput.min.js').catch(()=>{});
    await loadModule('/js/italky_messenger_v4.js?v=22');
    for(const src of[
      '/js/language_priority.js?v=3',
      '/js/italky_whatsapp_skin.js?v=14',
      '/js/italky_brand_theme.js?v=4',
      '/js/italky_messenger_controls_v5.js?v=12',
      '/js/italky_guest_qr.js?v=3',
      '/js/italky_main_menu.js?v=3',
      '/js/italky_optimistic_message.js?v=3',
      '/js/italky_home_polish_v1.js?v=9'
    ]){await loadClassic(src).catch(err=>console.warn('script',src,err))}

    const lockLogo=()=>{
      document.title='italkyAI';
      const title=document.querySelector('.waTitle');
      if(title && !title.querySelector('img')) title.innerHTML='<img class="waBrandLogo" src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI">';
    };
    lockLogo();
    setTimeout(lockLogo,800);
    setTimeout(lockLogo,1800);
    document.querySelector('#verify')?.classList.add('hidden');
    document.querySelector('#home')?.classList.remove('hidden');
  }catch(err){
    console.error(err);
    mount.innerHTML='<div style="min-height:100%;display:grid;place-items:center;padding:24px;background:#06182b;color:white;font-family:system-ui;text-align:center"><div><img src="/assets/italkyai-logo-clear.png?v=20260727-vector" alt="italkyAI" style="width:150px;max-width:45vw"><p style="opacity:.8">Ana ekran yüklenemedi. Sayfayı yenileyin.</p></div></div>';
  }
})();
</script>
</body>
</html>
