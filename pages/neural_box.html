<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>italkyAI • Neural Box</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050508;
  --cyan:#00f3ff;
  --gold:#ffb800;
  --red:#ff0055;
  --blue:#4f46e5;
  --green:#00e676;
  --border: rgba(255,255,255,0.10);
  --safeB: env(safe-area-inset-bottom, 0px);
  --shellLift: 0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;}
html,body{margin:0;width:100%;height:100dvh;background:var(--bg);font-family:'Outfit',sans-serif;color:#fff;overflow:hidden;}
body{background:radial-gradient(circle at 50% 0%, rgba(79,70,229,.18), transparent 28%),radial-gradient(circle at 0% 100%, rgba(0,243,255,.08), transparent 24%),radial-gradient(circle at 100% 0%, rgba(255,0,85,.08), transparent 22%),var(--bg);}
#pageContent{height:100%;padding:10px 12px calc(14px + var(--safeB) + var(--shellLift)) 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#pageContent::-webkit-scrollbar{display:none;}
.app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.backBtn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:9px 12px;font-weight:900;font-size:12px;cursor:pointer;}
.gameTitle{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:17px;letter-spacing:.7px;color:rgba(255,255,255,.92);}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,0.045);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,0.28);align-items:center;}
.hudCard{min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:4px;min-width:0;}
.hudBig{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:900;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.hudSmall{font-size:9px;font-weight:900;opacity:.6;letter-spacing:.8px;}
.scoreBar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.scoreItem{min-height:38px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:10px;font-weight:1000;color:rgba(255,255,255,.86);overflow:hidden;}
.scoreItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.main{flex:1;border-radius:24px;border:1px solid var(--border);background:rgba(255,255,255,0.035);padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:visible;backdrop-filter:blur(14px);box-shadow:0 28px 60px rgba(0,0,0,.35);}
.statusTxt{text-align:center;color:var(--cyan);font-weight:900;text-transform:uppercase;letter-spacing:1px;min-height:18px;font-size:12px;}
.valueBoard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.valTag{min-height:27px;padding:6px 4px;border-radius:10px;font-size:9px;font-weight:900;text-align:center;border:1.5px solid rgba(255,255,255,0.10);transition:0.25s ease;color:rgba(255,255,255,0.35);background:rgba(255,255,255,.03);line-height:1.1;}
.valTag.active{border-color:var(--gold);color:var(--gold);text-shadow:0 0 10px rgba(255,184,0,0.22);background:rgba(255,184,0,0.05);}
.valTag.removed{text-decoration:line-through;opacity:0.10;transform:scale(0.94);color:#555;}
.box-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;}
.box{height:54px;background:linear-gradient(145deg, rgba(40,44,70,.82), rgba(8,10,18,.94));border:1.5px solid rgba(99,102,241,.72);border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:21px;font-family:'Space Grotesk',sans-serif;font-weight:900;color:var(--cyan);cursor:pointer;transition:0.22s ease;box-shadow:0 8px 18px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,.08);}
.box:active{transform:scale(0.94);}
.box.selected{border-color:var(--gold);color:var(--gold);box-shadow:0 0 22px rgba(255,184,0,0.35);}
.box.opened{opacity:0;pointer-events:none;transform:scale(0.5) rotate(18deg);}
.my-box-area{margin-top:2px;text-align:center;padding:10px;border:1.5px dashed rgba(255,255,255,0.12);border-radius:20px;width:100%;background:rgba(255,255,255,0.025);}
.myBoxSlot{min-height:58px;display:flex;align-items:center;justify-content:center;}
.boxHint{font-size:10px;font-weight:900;opacity:0.42;margin-top:7px;letter-spacing:2px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;}
.card{width:100%;max-width:400px;background:linear-gradient(155deg, rgba(17,24,39,.98), rgba(3,7,18,.98));padding:22px;border-radius:24px;border:1px solid rgba(255,255,255,.12);text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.7);max-height:88vh;overflow:auto;scrollbar-width:none;}
.card::-webkit-scrollbar{display:none;}
.qWord{font-size:34px;font-weight:900;color:var(--gold);margin:14px 0 10px;font-family:'Space Grotesk',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.qSub{font-size:13px;line-height:1.6;opacity:.76;margin-bottom:10px;}
.listenBtn{min-height:36px;padding:0 14px;margin:0 0 12px;border-radius:999px;border:1px solid rgba(0,243,255,.28);background:rgba(0,243,255,.08);color:#fff;font-weight:900;font-size:12px;cursor:pointer;}
.optBtn{width:100%;padding:15px;margin-bottom:10px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.055);color:#fff;font-weight:800;font-size:15px;cursor:pointer;transition:0.2s;}
.optBtn:active{background:var(--blue);transform:scale(0.98);}
.bankerCard{border-color:rgba(255,184,0,.45);box-shadow:0 0 40px rgba(255,184,0,0.12);}
.offerAmt{font-size:42px;font-weight:900;color:#fff;margin:20px 0;text-shadow:0 0 20px rgba(255,255,255,0.2);font-family:'Space Grotesk',sans-serif;}
.btnMain{width:100%;padding:17px;border-radius:18px;border:none;background:var(--cyan);color:#000;font-weight:1000;font-size:15px;cursor:pointer;margin-top:10px;}
.btnNo{background:rgba(255,255,255,0.08);color:#fff;border:1.5px solid rgba(255,255,255,0.18);}
.finalChoice{display:flex;gap:10px;margin-top:12px;}.finalChoice .btnMain{margin-top:0;flex:1;}
.hidden{display:none!important;}
@media(max-width:380px){.hud,.scoreBar{gap:5px}.hudBig{font-size:13px}.hudSmall{font-size:8px}.scoreItem{font-size:9px}.box{height:48px;font-size:18px}.valueBoard{gap:5px}.valTag{font-size:8px}.qWord{font-size:28px}.btnMain{font-size:13px;padding:14px 8px}}
</style>
</head>
<body>
<div class="app" id="pageContent">
  <div class="topbar">
    <button class="backBtn" id="backBtn" type="button">← Oyun Menüsü</button>
    <div class="gameTitle">NEURAL BOX</div>
  </div>

  <div class="hud">
    <div class="hudCard"><div class="hudBig" id="langDisp">🇬🇧 EN</div><div class="hudSmall">DİL</div></div>
    <div class="hudCard"><div class="hudBig" id="offerMini">—</div><div class="hudSmall">SON TEKLİF</div></div>
    <div class="hudCard"><div class="hudBig" id="roundDisp">0/30</div><div class="hudSmall">AÇILAN</div></div>
  </div>

  <div class="scoreBar">
    <div class="scoreItem"><span id="scoreLabel">SKOR: 0</span></div>
    <div class="scoreItem"><span id="personalBestLabel">SENİN REKORUN: —</span></div>
    <div class="scoreItem"><span id="globalBestLabel">GENEL REKOR: —</span></div>
  </div>

  <div class="main">
    <div class="statusTxt" id="statusTxt">HAZIRLANIYOR</div>
    <div class="valueBoard" id="valueBoard"></div>
    <div class="box-grid" id="boxGrid"></div>
    <div class="my-box-area" id="myBoxArea">
      <div class="myBoxSlot" id="myBoxSlot"></div>
      <div class="boxHint">SENİN KUTUN</div>
    </div>
  </div>
</div>

<div class="modal" id="qModal">
  <div class="card">
    <p style="font-size:12px; font-weight:900; color:var(--cyan); letter-spacing:1px;">KUTUYU AÇMAK İÇİN BİL</p>
    <div class="qWord" id="qWord">WORD</div>
    <div class="qSub" id="qSub">Doğru Türkçe anlamı seç</div>
    <button class="listenBtn" id="listenBtn" type="button">Dinle</button>
    <div id="qOpts"></div>
  </div>
</div>

<div class="modal" id="bankerModal">
  <div class="card bankerCard">
    <h2 style="color:var(--gold); margin:0; letter-spacing:2px;">BANKER TEKLİFİ</h2>
    <p style="font-size:14px; opacity:0.7; margin:15px 0;">Banker masaya bunu koydu:</p>
    <div class="offerAmt" id="offerAmt">500 P</div>
    <button class="btnMain" id="btnDeal">VARIM</button>
    <button class="btnMain btnNo" id="btnNoDeal">YOKUM</button>
  </div>
</div>

<div class="modal" id="finalModal">
  <div class="card bankerCard">
    <h2 style="color:var(--gold); margin:0;">FİNAL</h2>
    <p style="font-size:14px; opacity:.78; margin:14px 0;">Elindeki kutuyla son kutuyu değiştirmek ister misin?</p>
    <div class="finalChoice"><button class="btnMain" id="btnSwap">VARIM</button><button class="btnMain btnNo" id="btnKeep">YOKUM</button></div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="card bankerCard">
    <h2 style="margin:0; color:var(--gold);">SONUÇ</h2>
    <div class="offerAmt" id="resultAmt">0 P</div>
    <p id="resultText" style="opacity:.78; line-height:1.6;"></p>
    <button class="btnMain" id="btnReplay">TEKRAR OYNA</button>
    <button class="btnMain btnNo" id="btnBack">OYUN MENÜSÜ</button>
  </div>
</div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import {
  GAME_LANG_META,
  formatGlobalBest,
  getGameLangFromUrl,
  getLocalHighScore,
  getGlobalBest,
  refreshGameScoreLabels,
  saveGameScore,
  setLocalHighScore,
  speakGameText,
} from "/js/game_score_helper.js";

mountShell({ scroll:"none" });

const $ = id => document.getElementById(id);
const GAME_SLUG = "neural_box";
const VALUES = [1,2,5,10,20,30,50,75,100,150,200,300,500,750,1000,1500,2000,3000,4000,5000,7500,10000,15000,20000,30000,40000,50000,75000,100000,150000,250000,500000];
const OFFER_PLAN = [6,5,4,4,3,3,2,2,1];

const game = {
  lang: getGameLangFromUrl("en"),
  poolItems: [],
  usedWords: new Set(),
  lastWordKey: "",
  boardValues: [...VALUES],
  boxes: [],
  myBox: null,
  stage: "PICK_MY_BOX",
  roundStep: 0,
  boxesToOpenThisRound: OFFER_PLAN[0],
  boxesOpenedInRound: 0,
  totalOpened: 0,
  lastOffer: 0,
  score: 0,
  correctCount: 0,
  wrongCount: 0,
  startedAt: Date.now(),
  scoreSaved: false,
  currentQuestion: null,
};

let audioCtx = null;
function getAudioCtx(){try{if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}return audioCtx;}catch{return null;}}
async function unlockAudio(){try{const ctx=getAudioCtx();if(ctx&&ctx.state==="suspended")await ctx.resume();}catch{}}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume().catch(()=>{});const now=ctx.currentTime+when;const osc=ctx.createOscillator();const g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
function playTapFx(){beep({freq:620,duration:.05,type:"triangle",gain:.035});}
function playBoxPickFx(){beep({freq:420,duration:.08,type:"triangle",gain:.05});beep({freq:680,duration:.10,type:"triangle",gain:.04,when:.06});}
function playBoxOpenFx(){beep({freq:860,duration:.09,type:"square",gain:.045});beep({freq:520,duration:.12,type:"triangle",gain:.04,when:.08});}
function playCorrectFx(){beep({freq:520,duration:.08,type:"triangle",gain:.05});beep({freq:760,duration:.10,type:"triangle",gain:.05,when:.08});}
function playWrongFx(){beep({freq:220,duration:.10,type:"sawtooth",gain:.05});beep({freq:170,duration:.12,type:"sawtooth",gain:.04,when:.06});}
function playBankerFx(){beep({freq:330,duration:.10,type:"square",gain:.04});beep({freq:440,duration:.10,type:"square",gain:.04,when:.12});beep({freq:550,duration:.12,type:"triangle",gain:.04,when:.24});}
["click","touchstart","pointerdown"].forEach(evt => window.addEventListener(evt, () => unlockAudio(), { passive:true, once:true }));

function normalize(s){return String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();}
function shuffle(arr){return [...arr].sort(() => Math.random() - 0.5);}
function getPublicLangUrl(langCode){return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;}
function extractItems(payload){if(Array.isArray(payload))return payload;if(payload&&typeof payload==="object"){for(const key of ["items","words","data","list","entries","pool"]){if(Array.isArray(payload[key]))return payload[key];}}return [];}
function normalizePoolItems(items){return items.map(item=>{const rawWord=item?.word??item?.w??item?.text??item?.term??item?.answer??"";const rawMeaning=item?.meaning??item?.tr??item?.translation??item?.hint??"";return{w:String(rawWord||"").trim(),tr:String(rawMeaning||"").trim()};}).filter(x=>x.w&&x.tr&&!x.w.includes(" ")&&normalize(x.w).length>=2);}
async function loadLangPool(langCode){try{const res=await fetch(getPublicLangUrl(langCode),{cache:"no-store"});if(!res.ok){console.warn("[NEURAL_BOX] pool fetch failed",{source:"storage:lang",langCode,status:res.status});return [];}const json=await res.json();const items=normalizePoolItems(extractItems(json));console.warn("[NEURAL_BOX] pool loaded",{source:"storage:lang",langCode,count:items.length});return items;}catch(error){console.warn("[NEURAL_BOX] pool load failed",{source:"storage:lang",langCode,error});return [];}}
function showContentUnavailable(){setStatus("İÇERİK YÜKLENEMEDİ");$("boxGrid").innerHTML="";$("myBoxSlot").innerHTML="";$("qModal").classList.remove("show");}
function nextUniqueItem(){if(!game.poolItems.length)return null;if(game.usedWords.size>=game.poolItems.length)game.usedWords.clear();let candidate=null;let guard=0;while(guard<120){const pick=game.poolItems[Math.floor(Math.random()*game.poolItems.length)];const key=normalize(pick.w);if(!game.usedWords.has(key)&&key!==game.lastWordKey){game.usedWords.add(key);game.lastWordKey=key;candidate=pick;break;}guard++;}if(!candidate){const fallback=game.poolItems.find(x=>normalize(x.w)!==game.lastWordKey)||game.poolItems[0];game.lastWordKey=normalize(fallback.w);game.usedWords.add(game.lastWordKey);candidate=fallback;}return candidate;}

function formatShortGlobal(text){return String(text||"GENEL REKOR: —").replace("GENEL REKOR:","GENEL REKOR:");}
async function refreshScores(){const localBest=getLocalHighScore(GAME_SLUG,game.lang);$("scoreLabel").textContent=`SKOR: ${game.score}`;$("personalBestLabel").textContent=`SENİN REKORUN: ${localBest||"—"}`;$("globalBestLabel").textContent="GENEL REKOR: —";try{const best=await refreshGameScoreLabels({gameSlug:GAME_SLUG,lang:game.lang,personalEl:$("personalBestLabel"),globalEl:$("globalBestLabel")});return best?.globalBest||null;}catch(error){console.warn("[NEURAL_BOX] score refresh failed",error);return null;}}
function updateScore(delta=0){game.score=Math.max(0,game.score+delta);$("scoreLabel").textContent=`SKOR: ${game.score}`;const best=getLocalHighScore(GAME_SLUG,game.lang);if(game.score>best){setLocalHighScore(GAME_SLUG,game.lang,game.score);$("personalBestLabel").textContent=`SENİN REKORUN: ${game.score}`;}}
async function saveScoreOnce(finalAmount=0){if(game.scoreSaved)return;game.scoreSaved=true;const finalScore=Math.max(game.score,Number(finalAmount||0));game.score=finalScore;setLocalHighScore(GAME_SLUG,game.lang,finalScore);$("scoreLabel").textContent=`SKOR: ${finalScore}`;const durationSeconds=Math.max(1,Math.round((Date.now()-game.startedAt)/1000));try{await saveGameScore({gameSlug:GAME_SLUG,lang:game.lang,score:finalScore,correctCount:game.correctCount,wrongCount:game.wrongCount,durationSeconds});}catch(error){console.warn("[NEURAL_BOX] score save failed",error);}try{const best=await getGlobalBest(GAME_SLUG,game.lang);$("globalBestLabel").textContent=formatGlobalBest(best);}catch{}}

function renderBoard(){ $("valueBoard").innerHTML=VALUES.map(v=>`<div class="valTag ${game.boardValues.includes(v)?'active':'removed'}" id="val-${v}">${v.toLocaleString()} P</div>`).join(""); }
function updateHud(){const meta=GAME_LANG_META[game.lang]||GAME_LANG_META.en;$("langDisp").textContent=`${meta.flag} ${game.lang.toUpperCase()}`;$("offerMini").textContent=game.lastOffer?`${game.lastOffer.toLocaleString()} P`:"—";$("roundDisp").textContent=`${game.totalOpened}/30`;$("scoreLabel").textContent=`SKOR: ${game.score}`;}
function setStatus(text){$("statusTxt").textContent=text;}
function createBoxes(){const shuffledValues=shuffle([...VALUES]);const grid=$("boxGrid");grid.innerHTML="";game.boxes=[];for(let i=0;i<32;i++){const b={id:i+1,val:shuffledValues[i],opened:false};game.boxes.push(b);const el=document.createElement("div");el.className="box";el.textContent=b.id;el.onclick=()=>handleBoxClick(b,el);grid.appendChild(el);}}
function handleBoxClick(box,el){if(game.stage==="PICK_MY_BOX"){playBoxPickFx();game.myBox=box;el.classList.add("selected");$("myBoxSlot").innerHTML="";$("myBoxSlot").appendChild(el);game.stage="OPEN_BOXES";setStatus("BİR KUTU SEÇ VE ELE");return;}if(game.stage==="OPEN_BOXES"&&!box.opened&&box!==game.myBox){playTapFx();askQuestion(box,el);}}
function askQuestion(box,el){const item=nextUniqueItem();if(!item){showContentUnavailable();return;}game.currentQuestion=item;$("qWord").textContent=item.w.toUpperCase();$("qSub").textContent="Doğru Türkçe anlamı seç";$("qModal").classList.add("show");let opts=[item.tr];let guard=0;while(opts.length<4&&guard<120){const r=game.poolItems[Math.floor(Math.random()*game.poolItems.length)]?.tr;if(r&&!opts.includes(r))opts.push(r);guard++;}if(opts.length<2){showContentUnavailable();return;}opts=shuffle(opts);$("qOpts").innerHTML=opts.map(o=>`<button class="optBtn">${o}</button>`).join("");$("qOpts").querySelectorAll(".optBtn").forEach(btn=>{btn.onclick=()=>{playTapFx();if(btn.textContent===item.tr){playCorrectFx();game.correctCount++;updateScore(100);box.opened=true;el.classList.add("opened");removeValue(box.val);game.totalOpened++;setTimeout(()=>{playBoxOpenFx();checkRoundFlow();},180);}else{playWrongFx();game.wrongCount++;box.opened=true;el.classList.add("opened");const sortedActive=[...game.boardValues].sort((a,b)=>b-a);removeValue(sortedActive[0]);game.totalOpened++;setTimeout(()=>{playBoxOpenFx();checkRoundFlow();},180);}$("qModal").classList.remove("show");};});}
function removeValue(val){game.boardValues=game.boardValues.filter(v=>v!==val);const el=$(`val-${val}`);if(el)el.className="valTag removed";}
function checkRoundFlow(){updateHud();if(game.totalOpened===30){game.stage="FINAL_CHOICE";showFinalSwap();return;}game.boxesOpenedInRound++;if(game.boxesOpenedInRound>=game.boxesToOpenThisRound){showBankerOffer();}else{setStatus("DEVAM ET VE BİR KUTU DAHA AÇ");}}
function showBankerOffer(){const avg=game.boardValues.reduce((a,b)=>a+b,0)/game.boardValues.length;const riskMultiplier=game.boardValues.length<=4?.92:game.boardValues.length<=8?.84:game.boardValues.length<=16?.78:.70;const offer=Math.floor(avg*riskMultiplier);game.lastOffer=offer;updateHud();playBankerFx();$("offerAmt").textContent=offer.toLocaleString()+" P";$("bankerModal").classList.add("show");}
function continueAfterBanker(){ $("bankerModal").classList.remove("show");game.boxesOpenedInRound=0;game.roundStep=Math.min(game.roundStep+1,OFFER_PLAN.length-1);game.boxesToOpenThisRound=OFFER_PLAN[game.roundStep];setStatus("DEVAM ET VE KUTU AÇ");}
async function finishWithAmount(amount,text){await saveScoreOnce(amount);$("resultAmt").textContent=`${Number(amount||0).toLocaleString()} P`;$("resultText").textContent=text;$("resultModal").classList.add("show");}
function showFinalSwap(){ $("finalModal").classList.add("show"); }
async function beginGame(){const ok=await ensureAuthAndCacheUser();if(!ok){location.href="/pages/login.html";return;}game.poolItems=await loadLangPool(game.lang);if(!game.poolItems.length){showContentUnavailable();return;}game.usedWords.clear();game.lastWordKey="";game.boardValues=[...VALUES];game.boxes=[];game.myBox=null;game.stage="PICK_MY_BOX";game.roundStep=0;game.boxesToOpenThisRound=OFFER_PLAN[0];game.boxesOpenedInRound=0;game.totalOpened=0;game.lastOffer=0;game.score=0;game.correctCount=0;game.wrongCount=0;game.startedAt=Date.now();game.scoreSaved=false;$("myBoxSlot").innerHTML="";["bankerModal","finalModal","resultModal","qModal"].forEach(id=>$(id).classList.remove("show"));renderBoard();createBoxes();updateHud();refreshScores();setStatus("KUTUNU SEÇ");}

$("backBtn").onclick=()=>{location.href="/pages/game_menu.html";};
$("listenBtn").onclick=()=>{if(game.currentQuestion?.w)speakGameText(game.currentQuestion.w,game.lang);};
$("btnNoDeal").onclick=continueAfterBanker;
$("btnDeal").onclick=()=>{$("bankerModal").classList.remove("show");finishWithAmount(game.lastOffer,"Banker teklifini kabul ettin. Oyun bu ödülle bitti.");};
$("btnSwap").onclick=()=>{$("finalModal").classList.remove("show");const otherBox=game.boxes.find(b=>!b.opened&&b!==game.myBox);if(otherBox)game.myBox=otherBox;finishWithAmount(game.myBox.val,"Kutunu değiştirdin. Açılan ödül bu.");};
$("btnKeep").onclick=()=>{$("finalModal").classList.remove("show");finishWithAmount(game.myBox.val,"Kendi kutunu tuttun. Açılan ödül bu.");};
$("btnReplay").onclick=()=>{$("resultModal").classList.remove("show");beginGame();};
$("btnBack").onclick=()=>{location.href="/pages/game_menu.html";};

window.addEventListener("load",async()=>{renderBoard();updateHud();await refreshScores();beginGame();console.warn("[NEURAL_BOX] ready",{lang:game.lang,ads:false,content:"storage:lang/<lang>.json"});});
</script>
</body>
</html>
