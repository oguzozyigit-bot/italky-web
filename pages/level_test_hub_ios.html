<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Seviye Tespit</title>
  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f!important;}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{--ai:linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);--glass-border:rgba(255,255,255,.10);--bg-dark:#02000f;--text:#fff;--card:rgba(255,255,255,.035);--ok:#a5b4fc;--safe-bottom:env(safe-area-inset-bottom,0px);--shellLift:0px;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
    html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg-dark);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);}
    #pageContent{height:100%;width:100%;display:flex;flex-direction:column;padding:10px 14px calc(10px + var(--safe-bottom) + var(--shellLift));background:radial-gradient(circle at 50% 0%,rgba(165,180,252,.10),transparent 42%),radial-gradient(circle at 85% 24%,rgba(236,72,153,.08),transparent 24%),radial-gradient(circle at 18% 84%,rgba(99,102,241,.07),transparent 26%);opacity:0;transition:opacity .28s ease;}
    #pageContent.ui-ready{opacity:1;}
    .wrap{height:100%;display:flex;flex-direction:column;gap:9px;min-height:0;}
    .titleBar{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 4px;}
    .titleText{min-width:0;display:flex;flex-direction:column;gap:2px;}
    .titleText h1{margin:0;font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:900;color:#fff;line-height:1.02;letter-spacing:0;}
    .titleText p{margin:0;font-size:11px;font-weight:800;color:rgba(255,255,255,.50);line-height:1.25;}
    .titleBadge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);font-size:10px;font-weight:1000;color:rgba(255,255,255,.82);}
    .list{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;justify-content:center;overflow:auto;padding:1px 1px 2px;scrollbar-width:none;}
    .list::-webkit-scrollbar{display:none;}
    .langCard{width:100%;border-radius:16px;border:1px solid var(--glass-border);background:var(--card);padding:0 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .22s cubic-bezier(.2,1,.3,1);position:relative;overflow:hidden;min-height:64px;text-align:left;}
    .langCard:active{transform:scale(.988) translateY(1px);background:rgba(255,255,255,.06);}
    .langCard:disabled{opacity:.55;cursor:not-allowed;}
    .langCard.activeLang{border-color:rgba(165,180,252,.32);background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(236,72,153,.07));box-shadow:0 10px 24px rgba(0,0,0,.16);}
    .left{display:flex;align-items:center;gap:10px;z-index:2;min-width:0;}
    .flagRing{width:38px;height:38px;border-radius:13px;background:var(--ai);padding:2px;flex:0 0 auto;box-shadow:0 0 18px rgba(99,102,241,.15);}
    .flagBox{width:100%;height:100%;border-radius:11px;background:#000;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid rgba(255,255,255,.08);}
    .txt{min-width:0;display:flex;flex-direction:column;gap:1px;}
    .txt .name{font-size:15px;font-weight:900;color:#fff;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .txt .sub{font-size:9px;color:rgba(255,255,255,.42);font-weight:900;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .txt .sub.ok{color:var(--ok);filter:brightness(1.15);}
    .right{display:flex;align-items:center;gap:7px;z-index:2;flex:0 0 auto;}
    .badge{font-size:10px;font-weight:1000;color:#fff;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);min-width:38px;text-align:center;}
    .chev{color:rgba(255,255,255,.26);font-size:18px;line-height:1;font-weight:900;}
    .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:rgba(10,10,18,.95);border:1px solid rgba(165,180,252,.35);padding:10px 14px;border-radius:999px;color:#fff;z-index:999999;font-weight:900;font-size:12px;transition:.25s;backdrop-filter:blur(12px);pointer-events:none;max-width:min(92vw,520px);text-align:center;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    @media(max-height:720px){.list{justify-content:flex-start}.titleText h1{font-size:20px}.titleText p{font-size:10px}.langCard{min-height:59px}.flagRing{width:34px;height:34px}.flagBox{font-size:16px}.txt .name{font-size:14px}.txt .sub{font-size:8.5px}}
    @media(max-width:390px){#pageContent{padding:9px 11px calc(9px + var(--safe-bottom) + var(--shellLift));}.langCard{min-height:60px;padding:0 12px}.titleBadge{display:none}.txt .name{font-size:14px}.right{gap:6px}.badge{min-width:35px;padding:5px 7px}}
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="wrap">
      <header class="titleBar">
        <div class="titleText">
          <h1>Seviye Tespit</h1>
          <p>Dil seçerek sınava başla.</p>
        </div>
        <div class="titleBadge">5 Dil</div>
      </header>
      <section class="list" id="list"></section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"auto" });
    try{const root=getComputedStyle(document.documentElement);const footerH=parseFloat(root.getPropertyValue("--footerH"))||0;document.documentElement.style.setProperty("--shellLift",footerH?`${footerH+10}px`:"0px");}catch{}

    const $=(id)=>document.getElementById(id);
    const list=$("list");
    const SUPPORTED_LANGS=["en","de","fr","es","it"];
    const TEST_SOURCE_BASE="https://auth.italky.ai/storage/v1/object/public/tests/level_tests";
    const LANGS=[
      {code:"en",name:"İngilizce",flag:"🇬🇧"},
      {code:"de",name:"Almanca",flag:"🇩🇪"},
      {code:"fr",name:"Fransızca",flag:"🇫🇷"},
      {code:"es",name:"İspanyolca",flag:"🇪🇸"},
      {code:"it",name:"İtalyanca",flag:"🇮🇹"}
    ];
    const params=new URLSearchParams(location.search);
    const redirect=String(params.get("redirect")||"").trim();
    const next=String(params.get("next")||"").trim();
    const selectedLang=normalizeSupportedLang(params.get("lang")||"en");

    function ltLog(label,data={}){try{console.warn(`[LevelTest] ${label} ${JSON.stringify(data||{})}`);}catch{console.warn(`[LevelTest] ${label}`);}}
    function normalizeSupportedLang(input){const raw=String(input||"en").trim().toLowerCase().split(/[-_]/)[0];return SUPPORTED_LANGS.includes(raw)?raw:"en";}
    function compactError(error){return{code:error?.code||"",message:error?.message||String(error||""),details:error?.details||"",hint:error?.hint||"",stack:error?.stack||""};}
    function toast(msg){const t=$("toast");if(!t)return;t.textContent=String(msg||"");t.classList.add("show");clearTimeout(window.__levelHubToast);window.__levelHubToast=setTimeout(()=>t.classList.remove("show"),1700);}
    function readLevelEntry(levels,code){const entry=levels&&levels[code];if(!entry)return"";if(typeof entry==="string")return entry.trim();if(typeof entry==="object")return String(entry.level||"").trim();return"";}
    function testUrl(code, testId="", mode="rpc"){let url=`/pages/level_test_ios.html?lang=${encodeURIComponent(code)}&ios=1`;if(testId)url+=`&test_id=${encodeURIComponent(testId)}`;if(mode)url+=`&start_mode=${encodeURIComponent(mode)}`;if(redirect)url+=`&redirect=${encodeURIComponent(redirect)}`;if(next)url+=`&next=${encodeURIComponent(next)}`;return url;}

    async function init(){
      const {data:{session}}=await supabase.auth.getSession();
      if(!session?.user){location.replace("/pages/login_ios.html");return;}
      ltLog("auth user",{id:String(session.user.id),email:session.user.email||""});
      const {data:prof,error}=await supabase.from("profiles").select("levels").eq("id",String(session.user.id)).maybeSingle();
      ltLog("profile lookup",{ok:!error,userId:String(session.user.id),error:error?compactError(error):null});
      const levels=prof?.levels&&typeof prof.levels==="object"?prof.levels:{};
      ltLog("hub ready",{selectedLang,languages:SUPPORTED_LANGS,levels:Object.keys(levels||{}),href:location.href});
      list.innerHTML=LANGS.map((l)=>{const lv=readLevelEntry(levels,l.code);const isSelected=selectedLang===l.code;return `<button class="langCard ${isSelected?"activeLang":""}" data-code="${l.code}" type="button"><div class="left"><div class="flagRing"><div class="flagBox">${l.flag}</div></div><div class="txt"><span class="name">${l.name}</span><span class="sub ${lv?"ok":""}">${lv?`Mevcut Seviye: ${lv}`:"Sınava Henüz Girilmedi"}</span></div></div><div class="right"><div class="badge">${l.code.toUpperCase()}</div><div class="chev">›</div></div></button>`;}).join("");
      bindEvents();
      $("pageContent")?.classList.add("ui-ready");
    }

    function bindEvents(){list.querySelectorAll(".langCard").forEach((btn)=>{btn.onclick=async()=>{const code=normalizeSupportedLang(btn.getAttribute("data-code"));await startTest(code,btn);};});}
    let busy=false;

    async function probeQuestionSource(code){
      const url=`${TEST_SOURCE_BASE}/${encodeURIComponent(code)}_v1.json`;
      ltLog("question source",{lang:code,url});
      try{
        const response=await fetch(url,{method:"GET",cache:"no-store"});
        const text=await response.text().catch(()=>"");
        let count=0;
        try{const json=JSON.parse(text);const arr=Array.isArray(json)?json:Array.isArray(json?.questions)?json.questions:Array.isArray(json?.items)?json.items:[];count=arr.length;}catch{}
        ltLog("question fetch result",{lang:code,url,status:response.status,ok:response.ok,contentType:response.headers.get("content-type")||"",count,preview:text.slice(0,160)});
        return {ok:response.ok,count,status:response.status,url};
      }catch(e){
        ltLog("question fetch result",{lang:code,url,ok:false,error:compactError(e)});
        return {ok:false,count:0,status:0,url,error:e};
      }
    }

    function navigateToTest(code,testId="",mode="local_fallback"){
      const url=testUrl(code,testId,mode);
      ltLog("navigate test",{lang:code,testId:testId||"",mode,url});
      location.href=url;
    }

    async function startTest(code,btn){
      if(busy)return;
      busy=true;
      btn.disabled=true;
      toast("Sınav başlatılıyor...");
      ltLog("selected language",{lang:code});
      ltLog("start requested",{lang:code,href:location.href});
      try{
        const {data:{session}}=await supabase.auth.getSession();
        ltLog("auth user",{id:String(session?.user?.id||""),hasSession:!!session});
        if(!session?.user)throw new Error("Oturum bulunamadı.");
        const source=await probeQuestionSource(code);
        if(!source.ok){
          toast("Soru içeriği şu anda yüklenemedi. Lütfen tekrar deneyin.");
          throw new Error(`question_source_unavailable_${source.status}`);
        }
        ltLog("start_level_test rpc start",{lang:code,userId:String(session.user.id)});
        const {data,error}=await supabase.rpc("start_level_test",{p_language_code:code});
        ltLog("start_level_test rpc result",{ok:!error,error:error?compactError(error):null,data});
        if(error)throw error;
        const row=Array.isArray(data)?(data[0]||null):data;
        const testId=row?.test_id||row?.id||null;
        if(!testId)throw new Error("test_id alınamadı.");
        navigateToTest(code,testId,"rpc");
      }catch(e){
        ltLog("start failed",{lang:code,userId:"",route:location.href,error:compactError(e)});
        const message=String(e?.message||"");
        if(message.startsWith("question_source_unavailable")){
          btn.disabled=false;
          busy=false;
          return;
        }
        ltLog("start fallback",{lang:code,reason:message||"unknown"});
        navigateToTest(code,"","local_fallback");
      }
    }
    init();
  </script>
  <script type="module">
    import { initGlobalAccess } from "/js/global_access_ios.js";
    await initGlobalAccess({ allowPublicPageBypass: false });
  </script>
</body>
</html>
