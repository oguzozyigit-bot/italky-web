<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Offline FaceToFace</title>
  <meta name="theme-color" content="#050814"/>

  <style>
    :root{
      --bg:#050814;
      --bg2:#090d1c;
      --line:rgba(255,255,255,.10);
      --txt:#fff;
      --muted:rgba(255,255,255,.66);
      --grad:linear-gradient(135deg,#4de8ff 0%, #7b7dff 46%, #ff54c9 100%);
      --ok:#15d682;
      --err:#ff5d7a;
      --warn:#ffb84d;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 16% 10%, rgba(123,125,255,.18), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255,84,201,.15), transparent 24%),
        radial-gradient(circle at 50% 0%, rgba(77,232,255,.10), transparent 30%),
        linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--txt);
      font-family:Inter, Outfit, Arial, sans-serif;
    }

    body{ padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); }
    #pageContent{ min-height:100dvh; }

    .page{
      max-width:720px;
      margin:0 auto;
      padding:14px 14px 34px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:6px 2px 16px;
      border-bottom:1px solid rgba(255,255,255,.06);
      margin-bottom:14px;
    }

    .brand-title{
      font-size:26px;
      font-weight:1000;
      letter-spacing:-1px;
      line-height:1;
    }
    .brand-title .ai{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .brand-sub{
      font-size:11px;
      font-weight:900;
      letter-spacing:4px;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    .home-btn{
      min-width:64px;
      height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      padding:0 18px;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      padding:18px;
      margin-bottom:16px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .title{
      margin:0 0 10px;
      font-size:24px;
      font-weight:1000;
      line-height:1.1;
      letter-spacing:-.5px;
    }

    .desc{
      margin:0;
      font-size:15px;
      line-height:1.55;
      color:var(--muted);
      font-weight:700;
    }

    .pill-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .pill{
      min-height:46px;
      padding:0 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:900;
      color:#fff;
    }

    .select-wrap{ position:relative; margin-top:14px; }
    .select{
      width:100%;
      height:68px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      padding:0 56px 0 18px;
      font-size:18px;
      font-weight:900;
      appearance:none;
      cursor:pointer;
    }
    .select option{ color:#000; }
    .select-arrow{
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
      font-size:18px;
      opacity:.8;
      pointer-events:none;
    }

    .action{
      width:100%;
      height:64px;
      border:none;
      border-radius:20px;
      margin-top:14px;
      background:linear-gradient(135deg, rgba(31,195,136,.22), rgba(123,125,255,.16));
      border:1px solid rgba(31,195,136,.35);
      color:#fff;
      font-size:17px;
      font-weight:1000;
      cursor:pointer;
    }

    .action.secondary{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.12);
    }

    .notice{
      margin-top:14px;
      padding:16px 18px;
      border-radius:20px;
      font-size:15px;
      font-weight:900;
      line-height:1.55;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
    }

    .notice.ok{
      border-color:rgba(31,195,136,.28);
      background:linear-gradient(135deg, rgba(31,195,136,.10), rgba(123,125,255,.08));
    }

    .notice.err{
      border-color:rgba(255,93,122,.28);
      background:linear-gradient(135deg, rgba(255,93,122,.10), rgba(123,125,255,.08));
    }

    .hidden{ display:none !important; }

    .footer{
      text-align:center;
      padding-top:10px;
      color:rgba(255,255,255,.44);
      font-size:12px;
      font-weight:900;
      letter-spacing:.4px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(22px + var(--safe-bottom));
      transform:translateX(-50%) translateY(120px);
      background:rgba(10,12,24,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      padding:14px 18px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      z-index:9999;
      transition:.25s ease;
      text-align:center;
      max-width:min(92vw, 560px);
    }

    .toast.show{ transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="page">
      <header class="topbar">
        <div>
          <div class="brand-title">italky<span class="ai">AI</span></div>
          <div class="brand-sub">BE FREE</div>
        </div>
        <button id="btnHome" class="home-btn" type="button">Ana Menü</button>
      </header>

      <section class="panel">
        <h1 class="title">Offline FaceToFace</h1>
        <p class="desc">
          İnternet bağlantısı yok. Önceden kurduğun offline dil paketleri ile çeviriye devam edebilirsin.
        </p>

        <div class="pill-row">
          <div class="pill">Ağ <b id="networkTag" style="margin-left:6px;">OFFLINE</b></div>
          <div class="pill">Yetki <b id="accessTag" style="margin-left:6px;">Kontrol</b></div>
        </div>
      </section>

      <section class="panel">
        <p class="desc">Kaynak Dil</p>
        <div class="select-wrap">
          <select id="fromSelect" class="select">
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="de">🇩🇪 Almanca</option>
            <option value="fr">🇫🇷 Fransızca</option>
            <option value="es">🇪🇸 İspanyolca</option>
            <option value="it">🇮🇹 İtalyanca</option>
            <option value="pt">🇵🇹 Portekizce</option>
            <option value="ar">🇸🇦 Arapça</option>
            <option value="ru">🇷🇺 Rusça</option>
            <option value="ja">🇯🇵 Japonca</option>
            <option value="ko">🇰🇷 Korece</option>
            <option value="zh">🇨🇳 Çince</option>
          </select>
          <div class="select-arrow">⌄</div>
        </div>

        <p class="desc" style="margin-top:14px;">Hedef Dil</p>
        <div class="select-wrap">
          <select id="toSelect" class="select">
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="de">🇩🇪 Almanca</option>
            <option value="fr">🇫🇷 Fransızca</option>
            <option value="es">🇪🇸 İspanyolca</option>
            <option value="it">🇮🇹 İtalyanca</option>
            <option value="pt">🇵🇹 Portekizce</option>
            <option value="ar">🇸🇦 Arapça</option>
            <option value="ru">🇷🇺 Rusça</option>
            <option value="ja">🇯🇵 Japonca</option>
            <option value="ko">🇰🇷 Korece</option>
            <option value="zh">🇨🇳 Çince</option>
          </select>
          <div class="select-arrow">⌄</div>
        </div>

        <button id="btnStartOffline" class="action" type="button">Offline Çeviriyi Başlat</button>
        <button id="btnManage" class="action secondary" type="button">Offline Dilleri Yönet</button>

        <div id="noticeBox" class="notice hidden"></div>
      </section>

      <div class="footer">italkyAI By Ozyigit's • 2026</div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { resolveOfflineRuntime, explainOfflineFailure } from "/js/offline_runtime_guard.js";

    mountShell({ scroll:"auto" });

    const $ = (id) => document.getElementById(id);
    const noticeBox = $("noticeBox");
    const accessTag = $("accessTag");
    const fromSelect = $("fromSelect");
    const toSelect = $("toSelect");

    function toast(msg){
      const t = $("toast");
      if(!t) return;
      t.textContent = String(msg || "");
      t.classList.add("show");
      clearTimeout(window.__to);
      window.__to = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function showNotice(msg, kind = "err"){
      noticeBox.textContent = String(msg || "");
      noticeBox.className = `notice ${kind}`;
      noticeBox.classList.remove("hidden");
    }

    function hideNotice(){
      noticeBox.className = "notice hidden";
      noticeBox.textContent = "";
    }

    function norm(v){
      return String(v || "").trim().toLowerCase();
    }

    function syncDifferentTargets(){
      if (norm(fromSelect.value) === norm(toSelect.value)) {
        const fallback = ["tr","de","fr","es","it","pt","ar","ru","ja","ko","zh"].find(x => x !== norm(fromSelect.value)) || "en";
        toSelect.value = fallback;
      }
    }

    function getPageUrl(file){
      const isApp = location.href.includes("appassets.androidplatform.net");
      return isApp
        ? `https://appassets.androidplatform.net/assets/pages/${file}`
        : `/pages/${file}`;
    }

    $("btnHome")?.addEventListener("click", () => {
      location.href = getPageUrl("home.html");
    });

    $("btnManage")?.addEventListener("click", () => {
      location.href = getPageUrl("offline_languages.html");
    });

    fromSelect?.addEventListener("change", () => {
      syncDifferentTargets();
      hideNotice();
    });

    toSelect?.addEventListener("change", () => {
      syncDifferentTargets();
      hideNotice();
    });

    $("btnStartOffline")?.addEventListener("click", async () => {
      const from = norm(fromSelect.value);
      const to = norm(toSelect.value);

      if (!from || !to || from === to) {
        showNotice("Kaynak ve hedef diller farklı olmalıdır.", "err");
        return;
      }

      const gate = await resolveOfflineRuntime(from, to);

      if (!gate.ok) {
        accessTag.textContent = "Kapalı";
        showNotice(explainOfflineFailure(gate.reason), "err");
        return;
      }

      accessTag.textContent = "Açık";
      showNotice("Offline çeviri açılıyor…", "ok");

      const url = `/pages/offline_facetoface_runtime.html?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
      location.href = url;
    });

    (function init(){
      if (navigator.onLine) {
        accessTag.textContent = "Online";
        showNotice("İnternet geri geldi. İstersen normal FaceToFace moduna dönebilirsin.", "ok");
      } else {
        accessTag.textContent = "Kontrol";
      }

      syncDifferentTargets();
    })();
  </script>

  <script type="module">
    import { initGlobalAccess } from "/js/global_access.js";
    initGlobalAccess();
  </script>
</body>
</html>
