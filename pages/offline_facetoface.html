<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Offline FaceToFace</title>
  <meta name="theme-color" content="#050814"/>

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#4de8ff 0%, #7b7dff 46%, #ff54c9 100%);
      --bg:#050814;
      --bg2:#090d1c;
      --border:rgba(255,255,255,.13);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --muted:rgba(255,255,255,.68);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:
        radial-gradient(circle at 16% 10%, rgba(123,125,255,.18), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255,84,201,.15), transparent 24%),
        radial-gradient(circle at 50% 0%, rgba(77,232,255,.10), transparent 30%),
        linear-gradient(180deg,var(--bg),var(--bg2));
      color:#fff;
      font-family:Inter, Outfit, Arial, sans-serif;
      overflow:hidden;
    }

    body{ min-height:100dvh; }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
      overflow:hidden;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.16), transparent 70%);
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.16), transparent 70%);
    }

    .lang-trigger{
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      padding:10px 18px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:inline-flex;
      align-items:center;
      gap:10px;
      z-index:50;
      backdrop-filter:blur(12px);
      min-height:44px;
      max-width:92%;
      text-decoration:none;
    }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px 0;
      mask-image:linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:84%;
      line-height:1.25;
      word-break:break-word;
      position:relative;
    }

    .bubble.them{
      opacity:.55;
      font-size:18px;
      font-weight:500;
    }

    .bubble.me{
      font-size:18px;
      font-weight:650;
      opacity:.82;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble.me.is-latest{
      font-size:30px;
      font-weight:1000;
      opacity:1;
      line-height:1.08;
    }

    .txt{ display:inline-block; }

    .spk{
      width:30px;
      height:30px;
      min-width:30px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      color:#fff;
    }

    .spk svg{ width:14px; height:14px; }

    .mic-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding-bottom:10px;
      z-index:30;
    }

    .btn-mic{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-gradient);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
    }

    .btn-mic svg{ width:28px; height:28px; }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(21,214,130,.88);
      box-shadow:0 0 0 6px rgba(21,214,130,.10), 0 0 28px rgba(21,214,130,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.35;
      min-height:18px;
      user-select:none;
      max-width:280px;
      width:100%;
      display:block;
      color:var(--muted);
    }

    .center-hub{
      height:116px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:1000;
      cursor:pointer;
      backdrop-filter:blur(15px);
      z-index:650;
      min-height:42px;
    }

    .btn-back{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:100px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
    }

    .energy-orbit{
      position:absolute;
      width:100px;
      height:100px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1,.ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:.25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#4de8ff;
      box-shadow:0 0 15px #4de8ff;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#ff54c9;
      box-shadow:0 0 15px #ff54c9;
    }

    .ai-core{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.5px;
      font-weight:1000;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .pill{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:calc(14px + var(--safe-top));
      min-height:36px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:11px;
      font-weight:1000;
      z-index:100;
    }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }
    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(123,125,255,.35); }
    }
    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }
  </style>
</head>
<body id="frameRoot">
  <div class="container">
    <div class="pill" id="offlinePill">Offline Çeviri</div>

    <div class="half-screen top">
      <button class="lang-trigger" id="topLangBtn" type="button">
        <span id="topLangTxt">🌐 Hedef Dil</span>
      </button>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="topMic" aria-label="Üst mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 19v3"></path>
          </svg>
        </div>
        <div class="helper-text" id="topHelper"></div>
      </div>
    </div>

    <div class="center-hub">
      <button class="nav-btn btn-back" id="topBack" type="button">ANA MENÜ</button>

      <div class="orb-container" id="homeBtn">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <button class="nav-btn btn-clear" id="clearChat" type="button">TEMİZLE</button>
    </div>

    <div class="half-screen bottom">
      <button class="lang-trigger" id="botLangBtn" type="button">
        <span id="botLangTxt">🌐 Kendi Dilim</span>
      </button>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" aria-label="Alt mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 19v3"></path>
          </svg>
        </div>
        <div class="helper-text" id="botHelper"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/facetoface_offline.js"></script>
  <script type="module">
    import { initGlobalAccess } from "/js/global_access.js";
    initGlobalAccess();
  </script>
</body>
</html>
