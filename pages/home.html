<title>italkyAI • Future Home</title>

:root{
  --txt:rgba(255,255,255,.96);
  --muted:rgba(255,255,255,.64);
  --cardLine:rgba(255,255,255,.12);
  --ai-grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
  --pink:#f472b6;
  --cyan:#67e8f9;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  color:var(--txt);
  font-family:'Outfit',sans-serif;
  background:#120d16;
  scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
#pageContent::-webkit-scrollbar{
  display:none;
}

body{
  background:
    radial-gradient(circle at 50% 0%, rgba(251,146,60,.18) 0%, transparent 28%),
    radial-gradient(circle at 20% 18%, rgba(244,114,182,.12) 0%, transparent 25%),
    radial-gradient(circle at 82% 18%, rgba(96,165,250,.10) 0%, transparent 20%),
    linear-gradient(180deg, #1d1016 0%, #150e19 34%, #120d16 100%);
  overflow:hidden;
}

body:not(.home-ready) #pageContent{
  visibility:hidden;
  opacity:0;
}

body.home-ready #pageContent{
  visibility:visible;
  opacity:1;
  transition:opacity .18s ease;
}

#pageContent{
  width:100%;
  height:100%;
  min-height:100%;
  padding:10px 14px 18px;
  display:block;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.page-shell-fit{
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hero{
  flex:0 0 auto;
  perspective:1000px;
}

.heroTop{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.holo-container{
  width:210px;
  height:210px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  margin:2px auto 4px;
}

.crystal-cage{
  position:absolute;
  width:150px;
  height:150px;
  transform-style:preserve-3d;
  animation:rotateCrystal 18s linear infinite;
}

.crystal-side{
  position:absolute;
  inset:0;

  background:radial-gradient(circle, rgba(129,140,248,.12), transparent);
  box-shadow:0 0 18px rgba(103,232,249,.22);
}
