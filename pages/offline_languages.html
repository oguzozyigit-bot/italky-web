<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Offline Diller</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.70);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);

      --btnGrad: linear-gradient(135deg, rgba(236,72,153,0.16) 0%, rgba(99,102,241,0.24) 55%, rgba(165,180,252,0.14) 100%);
      --btnBorder: rgba(255,255,255,0.14);

      --doneGrad: linear-gradient(135deg, rgba(34,197,94,0.10) 0%, rgba(16,185,129,0.10) 60%, rgba(165,180,252,0.06) 100%);
      --doneBorder: rgba(34,197,94,0.20);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    #pageContent{ height:100%; }

    .wrap{
      max-width:520px;
      margin:0 auto;
      height:100%;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hero{
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 12px;
    }
    .h1{
      font-family:"Space Grotesk",system-ui,sans-serif;
      font-weight:1000;
      font-size:16px;
      margin:0;
      color:#fff;
      letter-spacing:-.2px;
    }
    .p{
      margin:6px 0 0;
      font-size:12px;
      font-weight:900;
      line-height:1.55;
      color: rgba(255,255,255,0.72);
    }
    .pillRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 8px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-weight:1000;
      font-size:12px;
      color:#fff;
      white-space:nowrap;
    }
    .pill b{
      background: var(--aiGrad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .list{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      justify-content:flex-start;
    }

    .card{
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .flag{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      flex:0 0 auto;
    }
    .meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
    .name{
      font-size: 15px;
      font-weight: 1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,0.62);
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .btn{
      height: 46px;
      min-width: 150px;
      padding: 0 14px;
      border-radius: 18px;
      border: 1px solid var(--btnBorder);
      background: var(--btnGrad);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      white-space:nowrap;
    }
    .btn:active{ transform: scale(.99); }
    .btn.disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
      pointer-events:none;
    }
    .btn.done{
      background: var(--doneGrad);
      border-color: var(--doneBorder);
      color: rgba(255,255,255,0.88);
    }
    .btn.danger{
      background: transparent;
      border-color: rgba(255,0,90,0.30);
      color: rgba(255,90,140,0.95);
      min-width: 120px;
    }

    .toast{
      position: fixed;
      left:50%;
      top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,0.95);
      border: 1px solid rgba(165,180,252,0.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index: 999999;
      font-weight: 1000;
      font-size: 12px;
      transition: .25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width: min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <div class="h1">Offline Çeviri Paketleri</div>
      <div class="p">
        İnternet varken indir. İnternet yokken <b>offline</b> kullan.
        Seçtiğin hedef dil için <b>iki yön</b> paket (A→B + B→A) birlikte iner.
      </div>
      <div class="pillRow">
        <div class="pill">Ücret: <b>Ücretsiz</b></div>
        <div class="pill" id="netPill">Ağ: <b>—</b></div>
        <div class="pill" id="basePill">Base: <b>TR</b></div>
      </div>
    </section>

    <section class="list" id="list"></section>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";

  mountShell({ scroll:"auto" });

  const API_BASE = "https://italky-api.onrender.com";
  const BUCKET = "offline";
  const CACHE_NAME = "italky-offline-v1";

  const $ = (id)=>document.getElementById(id);
  const list = $("list");
  const toastEl = $("toast");

  function toast(msg){
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>toastEl.classList.remove("show"), 1800);
  }

  const LANGS = [
    { code:"tr", name:"Türkçe",    flag:"🇹🇷" },
    { code:"en", name:"English",   flag:"🇬🇧" },
    { code:"de", name:"Deutsch",   flag:"🇩🇪" },
    { code:"fr", name:"Français",  flag:"🇫🇷" },
    { code:"it", name:"Italiano",  flag:"🇮🇹" },
    { code:"es", name:"Español",   flag:"🇪🇸" },
    { code:"ru", name:"Русский",   flag:"🇷🇺" },
    { code:"el", name:"Ελληνικά",  flag:"🇬🇷" },
    { code:"az", name:"Azərbaycanca", flag:"🇦🇿" },
    { code:"ka", name:"ქართული",   flag:"🇬🇪" },
  ];

  // ✅ base dil TR sabit (offline cihaz mantığı)
  const base = "tr";
  $("basePill").innerHTML = `Base: <b>${base.toUpperCase()}</b>`;

  function pairPath(pair){ return `langpacks/${pair}/model.zip`; }

  function publicUrl(path){
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
    return data?.publicUrl || "";
  }

  async function cacheOpen(){ return await caches.open(CACHE_NAME); }
  async function isCached(url){
    const c = await cacheOpen();
    const m = await c.match(url);
    return !!m;
  }
  async function cacheDelete(url){
    const c = await cacheOpen();
    await c.delete(url);
  }

  async function cachePutStream(url, res, onProgress){
    const cache = await cacheOpen();
    const total = Number(res.headers.get("content-length") || "0") || 0;
    const body = res.body;

    if(!body){
      await cache.put(url, res);
      onProgress?.(100, "Kaydedildi ✅");
      return;
    }

    const [s1, s2] = body.tee();
    const reader = s1.getReader();
    let loaded = 0;

    const pump = async ()=>{
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        loaded += (value?.byteLength || 0);

        if(total){
          const pct = Math.round((loaded/total)*100);
          onProgress?.(pct, `İndiriliyor… ${pct}%`);
        }else{
          onProgress?.(0, `İndiriliyor… ${(loaded/1024/1024).toFixed(1)} MB`);
        }
      }
    };

    const p1 = pump();
    const newRes = new Response(s2, { headers: res.headers });
    await cache.put(url, newRes);
    await p1;
    onProgress?.(100, "Kaydedildi ✅");
  }

  async function downloadOne(pair, onProgress){
    const url = publicUrl(pairPath(pair));
    if(!url) throw new Error("URL yok: " + pair);

    if(await isCached(url)){
      onProgress?.(100, "Zaten var");
      return;
    }

    const r = await fetch(url, { method:"GET" });
    if(!r.ok) throw new Error(`İndirme hatası ${pair}: ${r.status}`);

    await cachePutStream(url, r, onProgress);
  }

  async function downloadTwoWay(a, b, onProgress){
    await downloadOne(a, (p,t)=>onProgress?.(Math.round(p*0.5), `1/2 ${a}: ${t}`));
    await downloadOne(b, (p,t)=>onProgress?.(50 + Math.round(p*0.5), `2/2 ${b}: ${t}`));
    onProgress?.(100, "Tamam ✅");
  }

  function netPaint(){
    $("netPill").innerHTML = navigator.onLine ? `Ağ: <b>ONLINE</b>` : `Ağ: <b>OFFLINE</b>`;
  }
  window.addEventListener("online", netPaint);
  window.addEventListener("offline", netPaint);
  netPaint();

  async function render(){
    const targets = LANGS.filter(l=>l.code !== base);

    list.innerHTML = "";

    for(const l of targets){
      const target = l.code;
      const p1 = `${base}-${target}`;
      const p2 = `${target}-${base}`;

      const u1 = publicUrl(pairPath(p1));
      const u2 = publicUrl(pairPath(p2));

      const installed = u1 && u2 && (await isCached(u1)) && (await isCached(u2));

      const card = document.createElement("div");
      card.className = "card";

      const left = document.createElement("div");
      left.className = "left";
      left.innerHTML = `
        <div class="flag">${l.flag}</div>
        <div class="meta">
          <div class="name">${l.name}</div>
          <div class="sub">
            ${installed ? "İndirildi • Offline hazır" : "İndirince iki yön birlikte iner (TR↔" + target.toUpperCase() + ")"}
          </div>
        </div>
      `;

      const btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";

      const del = document.createElement("button");
      del.className = "btn danger";
      del.type="button";
      del.textContent = "Sil";
      del.style.display = installed ? "flex" : "none";

      let busy = false;

      async function setBusy(on, txt){
        busy = !!on;
        if(on){
          btn.classList.add("disabled");
          btn.textContent = txt || "İndiriliyor…";
        }else{
          btn.classList.remove("disabled");
          btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
        }
      }

      if(installed){
        btn.classList.add("done");
        btn.textContent = "İndirildi";
        btn.disabled = true;
      }else{
        btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
      }

      btn.onclick = async ()=>{
        if(busy || installed) return;

        if(!navigator.onLine){
          toast("İndirmek için internet gerekir.");
          return;
        }

        try{
          await setBusy(true, "Hazırlanıyor…");
          await downloadTwoWay(p1, p2, (pct, txt)=>setBusy(true, `${txt}`));
          toast("Offline hazır ✅");
          await render();
        }catch(e){
          console.warn(e);
          toast("İndirme başarısız");
          await setBusy(false);
        }
      };

      del.onclick = async ()=>{
        if(busy) return;
        if(!confirm("Bu dili offline’dan silmek istiyor musun?")) return;
        try{
          await setBusy(true, "Siliniyor…");
          if(u1) await cacheDelete(u1);
          if(u2) await cacheDelete(u2);
          toast("Silindi ✅");
          await render();
        }catch(e){
          console.warn(e);
          toast("Silinemedi");
          await setBusy(false);
        }
      };

      card.appendChild(left);

      const right = document.createElement("div");
      right.style.display="flex";
      right.style.gap="8px";
      right.appendChild(btn);
      right.appendChild(del);

      card.appendChild(right);
      list.appendChild(card);
    }
  }

  render();
  <script>
setTimeout(()=>{
  alert(window.Offline ? "Offline bridge OK ✅" : "Offline bridge YOK ❌");
}, 700);
</script>
</body>
</html>
