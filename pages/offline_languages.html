<!-- FILE: /pages/offline_languages.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Offline Paketler</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --btnGrad: linear-gradient(135deg, rgba(236,72,153,0.16) 0%, rgba(99,102,241,0.24) 55%, rgba(165,180,252,0.14) 100%);
      --btnBorder: rgba(255,255,255,0.14);
      --doneGrad: linear-gradient(135deg, rgba(34,197,94,0.10) 0%, rgba(16,185,129,0.10) 60%, rgba(165,180,252,0.06) 100%);
      --doneBorder: rgba(34,197,94,0.20);
      --dangerBorder: rgba(255,0,90,0.30);
      --dangerText: rgba(255,90,140,0.95);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    html,body{ margin:0; min-height:100%; color:#fff; font-family:Outfit,sans-serif; }
    #pageContent{ min-height:100%; }

    .wrap{
      max-width:560px;
      margin:0 auto;
      min-height:100%;
      padding:10px 12px 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hero, .panel{
      border-radius:22px;
      border:1px solid var(--border);
      background:var(--glass);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      padding:12px;
    }

    .h1{
      font-family:"Space Grotesk",system-ui,sans-serif;
      font-weight:1000;
      font-size:16px;
      margin:0;
      color:#fff;
    }

    .p{
      margin:6px 0 0;
      font-size:12px;
      font-weight:900;
      line-height:1.55;
      color:rgba(255,255,255,0.72);
    }

    .pillRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      font-weight:1000;
      font-size:12px;
      color:#fff;
      white-space:nowrap;
    }

    .pill b{
      background:var(--aiGrad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .label{
      font-size:12px;
      font-weight:1000;
      color:rgba(255,255,255,0.82);
    }

    .select, .search{
      width:100%;
      height:46px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      color:#fff;
      padding:0 14px;
      font-size:13px;
      font-weight:900;
    }

    .select option{
      color:#000;
    }

    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .searchWrap{
      flex:1;
      min-width:180px;
    }

    .countPill{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      font-size:12px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
    }

    .packs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .packChip{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.16);
      font-size:12px;
      font-weight:1000;
      color:#fff;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .btn{
      height:46px;
      min-width:160px;
      padding:0 16px;
      border-radius:18px;
      border:1px solid var(--btnBorder);
      background:var(--btnGrad);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
      box-shadow:0 10px 22px rgba(0,0,0,0.25);
    }

    .btn:active{ transform:scale(.99); }

    .btn.disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
      pointer-events:none;
    }

    .btn.done{
      background:var(--doneGrad);
      border-color:var(--doneBorder);
      color:rgba(255,255,255,0.88);
    }

    .btn.danger{
      background:transparent;
      border-color:var(--dangerBorder);
      color:var(--dangerText);
      min-width:120px;
    }

    .sectionTitle{
      font-size:13px;
      font-weight:1000;
      color:#fff;
      margin:0 0 10px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card{
      border-radius:20px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.03);
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .flag{
      width:42px;
      height:42px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      flex:0 0 auto;
    }

    .meta{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .name{
      font-size:15px;
      font-weight:1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sub{
      font-size:11px;
      font-weight:900;
      color:rgba(255,255,255,0.62);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .empty{
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.03);
      padding:18px;
      text-align:center;
      color:rgba(255,255,255,0.72);
      font-size:13px;
      font-weight:900;
    }

    .toast{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%) translateY(-120px);
      background:rgba(10,10,18,0.95);
      border:1px solid rgba(165,180,252,0.35);
      padding:10px 14px;
      border-radius:999px;
      color:#fff;
      z-index:999999;
      font-weight:1000;
      font-size:12px;
      transition:.25s;
      backdrop-filter:blur(12px);
      pointer-events:none;
      max-width:min(92vw, 540px);
      text-align:center;
    }

    .toast.show{ transform:translateX(-50%) translateY(0); }

    @media (max-width: 520px){
      .grid{ grid-template-columns:1fr; }
      .actions .btn{ width:100%; }
    }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <div class="h1">Offline Konuşma Paketi</div>
      <div class="p">
        Dünya geneli kullanım için tasarlandı. Kaynak dil ve hedef dil seçilir.
        Sistem arkada <b>İngilizce pivot</b> kullanır ve sadece gerekli paketleri indirir.
      </div>
      <div class="pillRow">
        <div class="pill">Ücret: <b>Ücretsiz</b></div>
        <div class="pill" id="netPill">Ağ: <b>—</b></div>
        <div class="pill">Pivot: <b>EN</b></div>
      </div>
    </section>

    <section class="panel">
      <div class="grid">
        <div class="field">
          <label class="label" for="sourceSelect">Benim Dilim</label>
          <select id="sourceSelect" class="select"></select>
        </div>
        <div class="field">
          <label class="label" for="targetSelect">Hedef Dil</label>
          <select id="targetSelect" class="select"></select>
        </div>
      </div>

      <div class="packs" id="packsPreview"></div>

      <div class="actions">
        <button id="installBtn" class="btn" type="button">
          <span>⬇️</span><span>Bu Paketi İndir</span>
        </button>

        <button id="removeBtn" class="btn danger" type="button">
          Seçili Paketi Sil
        </button>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="searchWrap">
          <input id="searchInput" class="search" type="text" placeholder="Aşağıda kurulu dil ara...">
        </div>
        <div class="countPill" id="countPill">Kurulu: 0</div>
      </div>

      <h3 class="sectionTitle">Kurulu Konuşma Paketleri</h3>
      <div class="list" id="installedList"></div>
    </section>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="/js/offline_languages_page.js"></script>
</body>
</html>
