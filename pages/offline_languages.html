<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Offline Diller</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.70);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);

      --btnGrad: linear-gradient(135deg, rgba(236,72,153,0.16) 0%, rgba(99,102,241,0.24) 55%, rgba(165,180,252,0.14) 100%);
      --btnBorder: rgba(255,255,255,0.14);

      --doneGrad: linear-gradient(135deg, rgba(34,197,94,0.10) 0%, rgba(16,185,129,0.10) 60%, rgba(165,180,252,0.06) 100%);
      --doneBorder: rgba(34,197,94,0.20);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    #pageContent{ height:100%; }

    .wrap{
      max-width:520px;
      margin:0 auto;
      height:100%;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hero{
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 12px;
    }
    .h1{
      font-family:"Space Grotesk",system-ui,sans-serif;
      font-weight:1000;
      font-size:16px;
      margin:0;
      color:#fff;
      letter-spacing:-.2px;
    }
    .p{
      margin:6px 0 0;
      font-size:12px;
      font-weight:900;
      line-height:1.55;
      color: rgba(255,255,255,0.72);
    }
    .pillRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 8px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-weight:1000;
      font-size:12px;
      color:#fff;
      white-space:nowrap;
    }
    .pill b{
      background: var(--aiGrad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .list{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      justify-content:flex-start;
    }

    .card{
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .flag{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      flex:0 0 auto;
    }
    .meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
    .name{
      font-size: 15px;
      font-weight: 1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,0.62);
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .btn{
      height: 46px;
      min-width: 150px;
      padding: 0 14px;
      border-radius: 18px;
      border: 1px solid var(--btnBorder);
      background: var(--btnGrad);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      white-space:nowrap;
    }
    .btn:active{ transform: scale(.99); }
    .btn.disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
    }
    .btn.done{
      background: var(--doneGrad);
      border-color: var(--doneBorder);
      color: rgba(255,255,255,0.88);
    }

    .toast{
      position: fixed;
      left:50%;
      top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,0.95);
      border: 1px solid rgba(165,180,252,0.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index: 999999;
      font-weight: 1000;
      font-size: 12px;
      transition: .25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width: min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <div class="h1">Offline Çeviri Paketleri</div>
      <div class="p">
        Bu sayfa hedef dili seçip <b>iki yön</b> paketi (A→B ve B→A) indirmen içindir.
      </div>
      <div class="pillRow">
        <div class="pill">Süre: <b>365 gün</b></div>
        <div class="pill">Ücret: <b>50 jeton</b></div>
        <div class="pill" id="basePill">Base: <b>—</b></div>
      </div>
    </section>

    <section class="list" id="list"></section>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";

  mountShell({ scroll:"auto" });

  const API_BASE = "https://italky-api.onrender.com";

  const $ = (id)=>document.getElementById(id);
  const list = $("list");
  const toastEl = $("toast");

  function toast(msg){
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>toastEl.classList.remove("show"), 1800);
  }

  const LANGS = [
    { code:"tr", name:"Türkçe",    flag:"🇹🇷" },
    { code:"en", name:"English",   flag:"🇬🇧" },
    { code:"de", name:"Deutsch",   flag:"🇩🇪" },
    { code:"fr", name:"Français",  flag:"🇫🇷" },
    { code:"it", name:"Italiano",  flag:"🇮🇹" },
    { code:"es", name:"Español",   flag:"🇪🇸" },
  ];

  const FEE = 50;
  const DAYS = 365;

  // local flag (downloaded)
  const DL_KEY = "italky_offline_downloaded_v1"; // {"tr-en":true,"en-tr":true}

  function loadDL(){
    try{ return JSON.parse(localStorage.getItem(DL_KEY)||"{}") || {}; }catch{ return {}; }
  }
  function saveDL(obj){
    try{ localStorage.setItem(DL_KEY, JSON.stringify(obj||{})); }catch{}
  }

  const norm = (x)=>String(x||"").trim().toLowerCase();

  function forceDownload(url){
    // Android WebView/Chrome: window.open genelde daha garanti
    try{
      window.open(url, "_blank", "noopener,noreferrer");
      return;
    }catch{}
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.download = "";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function purchasePair(base, target){
    const p1 = `${base}-${target}`;
    const p2 = `${target}-${base}`;

    // 1) ücretli
    const r1 = await supabase.rpc("purchase_offline_pack", { p_lang_code: p1, p_days: DAYS, p_fee: FEE });
    if(r1.error) return { error: r1.error };

    // 2) ikinci yön ücretsiz (tek ücret mantığı)
    const r2 = await supabase.rpc("purchase_offline_pack", { p_lang_code: p2, p_days: DAYS, p_fee: 0 });
    if(r2.error) return { error: r2.error };

    return { ok:true };
  }

  async function getSignedLink(accessToken, base, target){
    const res = await fetch(`${API_BASE}/api/offline/get_link`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + accessToken
      },
      body: JSON.stringify({ base_lang: base, target_lang: target })
    });
    const j = await res.json().catch(()=>null);
    if(!res.ok || !j?.ok) throw new Error(j?.detail || `HTTP ${res.status}`);
    return String(j.url || "").trim();
  }

  function isPackActive(packs, code){
    const it = packs?.find(x=>norm(x.lang_code) === norm(code));
    if(!it?.expires_at) return false;
    const exp = new Date(it.expires_at).getTime();
    return Number.isFinite(exp) && exp > Date.now();
  }

  async function render(){
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session?.user){
      location.replace("/pages/login.html");
      return;
    }

    const [{ data: prof }, { data: packs }] = await Promise.all([
      supabase.from("profiles").select("tokens, base_lang").eq("id", session.user.id).maybeSingle(),
      supabase.from("offline_packs").select("lang_code, expires_at").eq("user_id", session.user.id)
    ]);

    const tokens = Number(prof?.tokens ?? 0);
    try{ setHeaderTokens(tokens); }catch{}

    const base = norm(prof?.base_lang || "");
    if(!base){
      location.replace("/pages/setup_offline.html");
      return;
    }
    $("basePill").innerHTML = `Base: <b>${base.toUpperCase()}</b>`;

    const dl = loadDL();
    const targets = LANGS.filter(l=>norm(l.code) !== base);

    list.innerHTML = "";

    for(const l of targets){
      const target = norm(l.code);
      const p1 = `${base}-${target}`;
      const p2 = `${target}-${base}`;

      const active1 = isPackActive(packs, p1);
      const active2 = isPackActive(packs, p2);
      const entitled = active1 && active2;

      const downloaded = !!dl[p1] && !!dl[p2];

      const card = document.createElement("div");
      card.className = "card";

      const left = document.createElement("div");
      left.className = "left";
      left.innerHTML = `
        <div class="flag">${l.flag}</div>
        <div class="meta">
          <div class="name">${l.name}</div>
          <div class="sub">
            ${downloaded ? "İndirildi • Offline hazır" : (entitled ? "Paket aktif • İndirmek için tıkla" : "Paket gerekli • 50 jeton / 365 gün")}
          </div>
        </div>
      `;

      const btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";

      if(downloaded){
        btn.classList.add("done");
        btn.textContent = "İndirildi";
        btn.disabled = true;
      }else{
        btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
      }

      let busy = false;

      btn.onclick = async ()=>{
        if(busy || downloaded) return;
        busy = true;

        const { data:{ session } } = await supabase.auth.getSession();
        if(!session?.access_token){
          toast("Oturum yok. Tekrar giriş yap.");
          location.href="/pages/login.html";
          return;
        }

        try{
          // 1) paket yoksa satın al
          if(!entitled){
            if(tokens < FEE){
              toast("Jeton yetersiz. Profil’e yönlendiriyorum.");
              setTimeout(()=>location.href="/pages/profile.html", 650);
              return;
            }

            btn.disabled = true;
            btn.classList.add("disabled");
            btn.textContent = "Aktif ediliyor…";

            const r = await purchasePair(base, target);
            if(r.error){
              toast("Hata: " + (r.error.message || "İşlem başarısız"));
              await render();
              return;
            }
            toast("Paket aktif ✅");
          }

          // 2) iki link al ve indir
          btn.disabled = true;
          btn.classList.remove("disabled");
          btn.textContent = "Link alınıyor…";

          const url1 = await getSignedLink(session.access_token, base, target);   // base-target
          const url2 = await getSignedLink(session.access_token, target, base);  // target-base

          btn.textContent = "İndiriliyor…";

          forceDownload(url1);
          setTimeout(()=>forceDownload(url2), 500);

          // 3) local flag (indir tetiklendi)
          const cur = loadDL();
          cur[`${base}-${target}`] = true;
          cur[`${target}-${base}`] = true;
          saveDL(cur);

          toast("İndirme başladı ✅");

          setTimeout(()=>render(), 900);

        }catch(e){
          toast("İndirme linki alınamadı: " + (e?.message || e));
          btn.disabled = false;
          btn.classList.remove("disabled");
          btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
        } finally {
          busy = false;
        }
      };

      card.appendChild(left);
      card.appendChild(btn);
      list.appendChild(card);
    }
  }

  render();
</script>
</body>
</html>
