<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>italkyAI • Offline Terminal</title>

<meta name="theme-color" content="#000000">
<style>
html,body{
  background:#000 !important;
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family:'Outfit', sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
</style>

<style>
:root{
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.10);
  --green:#34d399;

  /* ✅ Milenyum buton rengi */
  --dl-grad: linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#ec4899 100%);
  --dl-glow: rgba(139,92,246,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

/* ui_shell uyumlu */
#pageContent{
  height:100%;
  display:flex;
  flex-direction:column;
  background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
}

.main-wrap{
  flex:1;
  max-width:520px;
  margin:0 auto;

  /* ✅ alt bar boşluğu */
  padding:
    10px
    14px
    calc(var(--footerH,92px) + env(safe-area-inset-bottom) + 10px);

  display:flex;
  flex-direction:column;
  gap:8px; /* önce 12 idi → daraltıldı */
}

/* Top info */
.stats-hub{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:8px 12px;
  backdrop-filter:blur(16px);
}
.stat-item{
  font-size:11px;
  font-weight:900;
  color:rgba(255,255,255,.45);
}
.stat-item span{
  color:#fff;
  margin-left:6px;
}

/* Header */
.hero{
  text-align:center;
  padding:4px 0;
}
.hero h1{
  font-family:'Space Grotesk';
  font-size:20px;
  font-weight:1000;
  margin:0;
}
.hero p{
  font-size:11px;
  color:rgba(255,255,255,.55);
  margin-top:4px;
  font-weight:800;
  line-height:1.4;
}

/* Native language */
.nativeBox{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  border-radius:16px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(14px);
}
.nativeBox .lbl{
  font-size:11px;
  font-weight:1000;
  color:rgba(255,255,255,.65);
}
.nativeSel{
  height:38px;
  border-radius:12px;
  border:1px solid var(--glass-border);
  background:rgba(0,0,0,.25);
  color:#fff;
  font-weight:1000;
  padding:0 8px;
  max-width:200px;
}

/* List */
#langList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* Cards */
.lang-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-radius:18px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(14px);
  min-height:60px;
}

.lang-info{
  display:flex;
  align-items:center;
  gap:10px;
}
.lang-flag{
  font-size:22px;
}
.lang-title{
  font-size:14px;
  font-weight:1000;
}
.lang-status{
  font-size:10px;
  font-weight:800;
  color:rgba(255,255,255,.55);
}

/* ✅ Milenyum buton */
.btn-dl{
  width:120px;
  height:40px;
  border-radius:14px;
  border:none;
  background:var(--dl-grad);
  color:#fff;
  font-weight:1000;
  font-size:12px;
  cursor:pointer;

  box-shadow:
    0 8px 22px var(--dl-glow),
    inset 0 2px 4px rgba(255,255,255,.25),
    inset 0 -2px 6px rgba(0,0,0,.25);

  transition:.2s ease;
}
.btn-dl:active{
  transform:translateY(1px) scale(.98);
  filter:brightness(1.05);
}

/* İndirildi */
.btn-owned{
  background:rgba(255,255,255,.06);
  border:1px solid var(--glass-border);
  box-shadow:none;
  color:rgba(255,255,255,.65);
  cursor:default;
}

.toast{
  position:fixed;
  left:50%;
  top:20px;
  transform:translateX(-50%) translateY(-100px);
  background:rgba(10,10,20,.92);
  border:1px solid var(--glass-border);
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:1000;
  opacity:0;
  transition:.25s;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
</style>
</head>

<body>
<main id="pageContent">
<div class="main-wrap">

<section class="stats-hub">
  <div class="stat-item">SÜRE<span>365 Gün</span></div>
  <div class="stat-item">ÜCRET<span>50 Jeton</span></div>
</section>

<header class="hero">
  <h1>Offline Terminal</h1>
  <p>Online indir. Offline çevir. İki yönlü paket otomatik yüklenir.</p>
</header>

<section class="nativeBox">
  <div class="lbl">Senin Dilin</div>
  <select class="nativeSel" id="nativeSel">
    <option value="tr">🇹🇷 Türkçe</option>
    <option value="en">🇬🇧 İngilizce</option>
    <option value="de">🇩🇪 Almanca</option>
    <option value="fr">🇫🇷 Fransızca</option>
    <option value="it">🇮🇹 İtalyanca</option>
    <option value="es">🇪🇸 İspanyolca</option>
  </select>
</section>

<div id="langList"></div>

</div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";
mountShell({ scroll:"auto" });

const $=id=>document.getElementById(id);
const toastEl=$("toast");
function toast(m){
  toastEl.textContent=m;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1800);
}

const LANGS=[
 {code:"en",name:"İngilizce",flag:"🇬🇧"},
 {code:"de",name:"Almanca",flag:"🇩🇪"},
 {code:"tr",name:"Türkçe",flag:"🇹🇷"},
 {code:"fr",name:"Fransızca",flag:"🇫🇷"},
 {code:"it",name:"İtalyanca",flag:"🇮🇹"},
 {code:"es",name:"İspanyolca",flag:"🇪🇸"}
];

let native=$("nativeSel").value;

$("nativeSel").addEventListener("change",e=>{
  native=e.target.value;
  render();
});

function render(){
  const list=$("langList");
  list.innerHTML="";
  LANGS.filter(l=>l.code!==native).forEach(lang=>{
    const card=document.createElement("div");
    card.className="lang-card";

    card.innerHTML=`
      <div class="lang-info">
        <div class="lang-flag">${lang.flag}</div>
        <div>
          <div class="lang-title">${lang.name}</div>
          <div class="lang-status">Hazır</div>
        </div>
      </div>
    `;

    const btn=document.createElement("button");
    btn.className="btn-dl";
    btn.textContent="⬇ İndir";

    btn.onclick=()=>{
      const url1=`/offline/langpacks/${native}-${lang.code}/model.zip`;
      const url2=`/offline/langpacks/${lang.code}-${native}/model.zip`;
      window.open(url1,"_blank");
      setTimeout(()=>window.open(url2,"_blank"),300);
      toast(`${lang.name} indiriliyor`);
    };

    card.appendChild(btn);
    list.appendChild(card);
  });
}
render();
</script>
</body>
</html>
