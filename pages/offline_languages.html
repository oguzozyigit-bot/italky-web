<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Offline Terminal</title>

  <meta name="theme-color" content="#000000">
  <style>
    html,body{background:#000 !important; margin:0; padding:0; overflow-x:hidden; font-family:'Outfit', sans-serif;}
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@700&display=swap');
  </style>

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --green: #34d399;
      --warn: #f59e0b;
      --muted: rgba(255,255,255,0.55);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    #pageContent {
      height: 100%;
      display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }

    /* ✅ ui_shell footer ile çakışmasın */
    .main-wrap {
      flex: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: calc(var(--footerH, 92px) + env(safe-area-inset-bottom) + 14px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .stats-hub {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px 18px; backdrop-filter: blur(20px);
    }
    .stat-item { font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.42); }
    .stat-item span { color: #fff; font-weight: 900; margin-left: 6px; }

    .hero { text-align: center; padding: 6px 0 2px; }
    .hero h1 { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; color: #fff; margin: 0; letter-spacing: -0.5px; }
    .hero p { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 8px; line-height: 1.5; font-weight: 700; }

    .selector {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 12px 12px;
      backdrop-filter: blur(18px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .selector .lbl{
      font-size:12px;
      font-weight:1000;
      color: rgba(255,255,255,0.72);
      white-space:nowrap;
    }
    .selector select{
      flex:1;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.20);
      color:#fff;
      font-weight:1000;
      padding: 0 10px;
      appearance:none;
    }

    #langList { display: flex; flex-direction: column; gap: 10px; }

    .lang-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-radius: 24px; border: 1px solid var(--glass-border);
      background: var(--glass); backdrop-filter: blur(20px);
      gap: 12px;
    }

    .lang-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .lang-flag { font-size: 28px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    .lang-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .lang-title { font-size: 16px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lang-sub { font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.55); }

    .lang-status { font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ✅ Buton: İndir / İndirildi */
    .btn-3d {
      min-width: 132px; height: 44px; border-radius: 22px; border: none;
      background: var(--ai-grad); color: #fff; font-weight: 900; font-size: 13px;
      cursor: pointer; position: relative;
      box-shadow:
        0 4px 15px rgba(99, 102, 241, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
      user-select:none;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-3d:active { transform: translateY(2px) scale(0.98); box-shadow: 0 2px 5px rgba(99, 102, 241, 0.4); }

    .btn-owned {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      box-shadow: none;
      color: rgba(255,255,255,0.35);
      cursor: default;
    }

    .btn-ico{
      width:18px; height:18px;
      display:inline-flex; align-items:center; justify-content:center;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    }

    .toast {
      position: fixed; left: 50%; top: 20px; transform: translateX(-50%) translateY(-100px);
      background: rgba(10, 10, 20, 0.9); border: 1px solid var(--glass-border);
      padding: 10px 20px; border-radius: 30px; color: #fff; font-weight: 1000;
      font-size: 13px; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      backdrop-filter: blur(10px); z-index: 9999; opacity: 0;
      max-width: min(92vw, 520px);
      text-align:center;
      white-space:pre-wrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="main-wrap">

    <section class="stats-hub">
      <div class="stat-item">PAKET SÜRESİ<span>365 GÜN</span></div>
      <div class="stat-item">ÜCRET<span>50 JETON</span></div>
    </section>

    <header class="hero">
      <h1>Offline Terminal</h1>
      <p>
        “Senin Dilin” + hedef dil seç.<br/>
        Sistem otomatik <b>iki yönü</b> indirir: <b>sen ↔ hedef</b>
      </p>
    </header>

    <div class="selector">
      <div class="lbl">Senin Dilin</div>
      <select id="nativeSel"></select>
    </div>

    <div id="langList"></div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";
  mountShell({ scroll:"auto" });

  const $ = (id) => document.getElementById(id);
  const toastEl = $("toast");

  function showToast(msg) {
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(() => toastEl.classList.remove("show"), 2000);
  }

  const LANGUAGES = [
    {code:"tr", name:"Türkçe",    flag:"🇹🇷"},
    {code:"en", name:"İngilizce", flag:"🇬🇧"},
    {code:"de", name:"Almanca",   flag:"🇩🇪"},
    {code:"fr", name:"Fransızca", flag:"🇫🇷"},
    {code:"it", name:"İtalyanca", flag:"🇮🇹"},
    {code:"es", name:"İspanyolca",flag:"🇪🇸"}
  ];

  const FEE = 50;
  const DAYS = 365;

  const { data: { session } } = await supabase.auth.getSession();
  if(!session?.user) location.replace("/pages/login.html");
  const userId = session.user.id;

  const nativeSel = $("nativeSel");
  nativeSel.innerHTML = LANGUAGES.map(l=>`<option value="${l.code}">${l.flag} ${l.name}</option>`).join("");
  nativeSel.value = localStorage.getItem("italky_native_lang") || "tr";
  nativeSel.addEventListener("change", ()=>{
    localStorage.setItem("italky_native_lang", nativeSel.value);
    render();
  });

  function pair(a,b){ return `${a}-${b}`; }
  function daysLeft(expiresAt){
    const ms = new Date(expiresAt).getTime() - Date.now();
    return Math.ceil(ms / (1000*60*60*24));
  }

  async function render() {
    const [{ data: prof }, { data: packs }] = await Promise.all([
      supabase.from("profiles").select("tokens").eq("id", userId).maybeSingle(),
      supabase.from("offline_packs").select("lang_code, expires_at").eq("user_id", userId)
    ]);

    const tokens = Number(prof?.tokens ?? 0);
    try { setHeaderTokens(tokens); } catch {}

    const native = String(nativeSel.value || "tr").trim().toLowerCase();

    const list = $("langList");
    list.innerHTML = "";

    const targets = LANGUAGES.filter(l=>l.code !== native);

    targets.forEach(target => {
      const a = pair(native, target.code);
      const b = pair(target.code, native);

      const pa = packs?.find(p => p.lang_code === a);
      const pb = packs?.find(p => p.lang_code === b);

      const aLeft = pa?.expires_at ? daysLeft(pa.expires_at) : 0;
      const bLeft = pb?.expires_at ? daysLeft(pb.expires_at) : 0;

      const aActive = aLeft > 0;
      const bActive = bLeft > 0;

      const isActive = aActive && bActive;
      const anyOwned = !!pa || !!pb;
      const minLeft = isActive ? Math.min(aLeft, bLeft) : Math.max(aLeft, bLeft);

      const card = document.createElement("div");
      card.className = "lang-card";

      let statusColor = isActive ? "var(--green)" : (anyOwned ? "var(--warn)" : "rgba(255,255,255,0.22)");
      let statusText = isActive
        ? `Aktif • ${minLeft} Gün`
        : (anyOwned ? "Eksik / Süresi Doldu (çift yön gerekir)" : "İndirmek için tıklayınız");

      card.innerHTML = `
        <div class="lang-info">
          <div class="lang-flag">${target.flag}</div>
          <div class="lang-meta">
            <div class="lang-title">${target.name}</div>
            <div class="lang-sub">${native.toUpperCase()} ↔ ${target.code.toUpperCase()}</div>
            <div class="lang-status" style="color:${statusColor}">
              <div class="status-dot" style="background:${statusColor}"></div>
              ${statusText}
            </div>
          </div>
        </div>
      `;

      const btn = document.createElement("button");
      btn.className = "btn-3d";

      if(isActive) {
        btn.innerHTML = `<span class="btn-ico">✅</span> İndirildi`;
        btn.classList.add("btn-owned");
        btn.disabled = true;
      } else {
        btn.innerHTML = `<span class="btn-ico">⬇️</span> İndir`;

        btn.onclick = async () => {
          if(tokens < FEE){
            showToast("Jeton yetersiz. Jeton yükleyin.");
            setTimeout(()=>location.href="/pages/profile.html", 650);
            return;
          }

          btn.disabled = true;
          btn.textContent = "İndiriliyor...";

          const { error } = await supabase.rpc("purchase_offline_bundle", {
            p_native_lang: native,
            p_target_lang: target.code,
            p_days: DAYS,
            p_fee: FEE
          });

          if(error) {
            showToast("Hata: " + (error.message || error));
            render();
            return;
          }

          showToast(`${native.toUpperCase()} ↔ ${target.code.toUpperCase()} aktif ✅`);
          render();
        };
      }

      card.appendChild(btn);
      list.appendChild(card);
    });
  }

  render();
</script>
</body>
</html>
