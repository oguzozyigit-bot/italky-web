<!-- FILE: /pages/offline_languages.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Offline Diller</title>

  <meta name="theme-color" content="#02000f">
  <style>html,body{background:#02000f !important;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.70);
      --aiGrad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);

      --btnGrad: linear-gradient(135deg, rgba(236,72,153,0.16) 0%, rgba(99,102,241,0.24) 55%, rgba(165,180,252,0.14) 100%);
      --btnBorder: rgba(255,255,255,0.14);

      --doneGrad: linear-gradient(135deg, rgba(34,197,94,0.10) 0%, rgba(16,185,129,0.10) 60%, rgba(165,180,252,0.06) 100%);
      --doneBorder: rgba(34,197,94,0.20);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    #pageContent{ height:100%; }

    .wrap{
      max-width:520px;
      margin:0 auto;
      height:100%;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .hero{
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 12px;
    }
    .h1{
      font-family:"Space Grotesk",system-ui,sans-serif;
      font-weight:1000;
      font-size:16px;
      margin:0;
      color:#fff;
      letter-spacing:-.2px;
    }
    .p{
      margin:6px 0 0;
      font-size:12px;
      font-weight:900;
      line-height:1.55;
      color: rgba(255,255,255,0.72);
    }
    .pillRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 8px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-weight:1000;
      font-size:12px;
      color:#fff;
      white-space:nowrap;
    }
    .pill b{
      background: var(--aiGrad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .list{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      justify-content:flex-start;
    }

    .card{
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .flag{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      flex:0 0 auto;
    }
    .meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
    .name{
      font-size: 15px;
      font-weight: 1000;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,0.62);
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .btn{
      height: 46px;
      min-width: 150px;
      padding: 0 14px;
      border-radius: 18px;
      border: 1px solid var(--btnBorder);
      background: var(--btnGrad);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      white-space:nowrap;
    }
    .btn:active{ transform: scale(.99); }
    .btn.disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
      pointer-events:none;
    }
    .btn.done{
      background: var(--doneGrad);
      border-color: var(--doneBorder);
      color: rgba(255,255,255,0.88);
    }
    .btn.danger{
      background: transparent;
      border-color: rgba(255,0,90,0.30);
      color: rgba(255,90,140,0.95);
      min-width: 120px;
    }

    .toast{
      position: fixed;
      left:50%;
      top:18px;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(10,10,18,0.95);
      border: 1px solid rgba(165,180,252,0.35);
      padding: 10px 14px;
      border-radius: 999px;
      color:#fff;
      z-index: 999999;
      font-weight: 1000;
      font-size: 12px;
      transition: .25s;
      backdrop-filter: blur(12px);
      pointer-events:none;
      max-width: min(92vw, 520px);
      text-align:center;
    }
    .toast.show{ transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<main id="pageContent">
  <div class="wrap">

    <section class="hero">
      <div class="h1">Offline Çeviri Paketleri</div>
      <div class="p">
        İnternet varken indir. İnternet yokken <b>offline</b> kullan.
        Seçtiğin hedef dil için <b>iki yön</b> paket (A→B + B→A) birlikte iner.
      </div>
      <div class="pillRow">
        <div class="pill">Ücret: <b>Ücretsiz</b></div>
        <div class="pill" id="netPill">Ağ: <b>—</b></div>
        <div class="pill" id="basePill">Base: <b>TR</b></div>
      </div>
    </section>

    <section class="list" id="list"></section>

  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";

  mountShell({ scroll:"auto" });

  const BUCKET = "offline";

  const $ = (id)=>document.getElementById(id);
  const list = $("list");
  const toastEl = $("toast");

  function toast(msg){
    toastEl.textContent = String(msg||"");
    toastEl.classList.add("show");
    clearTimeout(window.__to);
    window.__to = setTimeout(()=>toastEl.classList.remove("show"), 1800);
  }

  const LANGS = [
    { code:"tr", name:"Türkçe",    flag:"🇹🇷" },
    { code:"en", name:"English",   flag:"🇬🇧" },
    { code:"de", name:"Deutsch",   flag:"🇩🇪" },
    { code:"fr", name:"Français",  flag:"🇫🇷" },
    { code:"it", name:"Italiano",  flag:"🇮🇹" },
    { code:"es", name:"Español",   flag:"🇪🇸" },
    { code:"ru", name:"Русский",   flag:"🇷🇺" },
    { code:"el", name:"Ελληνικά",  flag:"🇬🇷" },
    { code:"az", name:"Azərbaycanca", flag:"🇦🇿" },
    { code:"ka", name:"ქართული",   flag:"🇬🇪" },
  ];

  // ✅ base dil TR sabit
  const base = "tr";
  $("basePill").innerHTML = `Base: <b>${base.toUpperCase()}</b>`;

  const norm = (s)=>String(s||"").trim().toLowerCase().replace("_","-");
  function pairPath(pair){ return `langpacks/${pair}/model.zip`; }

  function publicUrl(path){
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
    return data?.publicUrl || "";
  }

  function netPaint(){
    $("netPill").innerHTML = navigator.onLine ? `Ağ: <b>ONLINE</b>` : `Ağ: <b>OFFLINE</b>`;
  }
  window.addEventListener("online", netPaint);
  window.addEventListener("offline", netPaint);
  netPaint();

  // ✅ Native bridge helpers
  function nativeReady(){
    return !!(window.Offline && typeof window.Offline.installFromUrl === "function" && typeof window.Offline.isInstalled === "function");
  }
  function isInstalledNative(pair){
    try{ return !!window.Offline.isInstalled(norm(pair)); }catch{ return false; }
  }
  function installNative(pair, url){
    window.Offline.installFromUrl(norm(pair), String(url||"").trim());
  }

  async function render(){
    const targets = LANGS.filter(l=>norm(l.code) !== base);
    list.innerHTML = "";

    const hasNative = nativeReady();
    if(!hasNative){
      toast("Offline bridge yok. APK içinde 'window.Offline' hazır olmalı.");
    }

    for(const l of targets){
      const target = norm(l.code);
      const p1 = `${base}-${target}`;
      const p2 = `${target}-${base}`;

      const installed = hasNative ? (isInstalledNative(p1) && isInstalledNative(p2)) : false;

      const card = document.createElement("div");
      card.className = "card";

      const left = document.createElement("div");
      left.className = "left";
      left.innerHTML = `
        <div class="flag">${l.flag}</div>
        <div class="meta">
          <div class="name">${l.name}</div>
          <div class="sub">
            ${installed ? "Kuruldu • Offline hazır" : "İndirince iki yön birlikte kurulur (TR↔" + target.toUpperCase() + ")"}
          </div>
        </div>
      `;

      const btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";

      const del = document.createElement("button");
      del.className = "btn danger";
      del.type="button";
      del.textContent = "Sil";
      del.style.display = installed ? "flex" : "none";

      let busy = false;

      function setBusy(on, txt){
        busy = !!on;
        if(on){
          btn.classList.add("disabled");
          btn.textContent = txt || "Kuruluyor…";
        }else{
          btn.classList.remove("disabled");
          btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
        }
      }

      if(installed){
        btn.classList.add("done");
        btn.textContent = "Kuruldu";
        btn.disabled = true;
      }else{
        btn.innerHTML = `<span>⬇️</span><span>İndir</span>`;
      }

      btn.onclick = async ()=>{
        if(busy || installed) return;

        if(!navigator.onLine){
          toast("İndirmek için internet gerekir.");
          return;
        }
        if(!nativeReady()){
          toast("Offline bridge hazır değil (window.Offline yok).");
          return;
        }

        const url1 = publicUrl(pairPath(p1));
        const url2 = publicUrl(pairPath(p2));
        if(!url1 || !url2){
          toast("Dosya linki yok (Supabase path).");
          return;
        }

        try{
          setBusy(true, "Kurulum başlıyor…");
          installNative(p1, url1);
          setTimeout(()=>installNative(p2, url2), 700);

          toast("İndirme + kurulum başladı ✅");

          // ✅ Kurulum bitene kadar kısa polling (max ~60sn)
          const started = Date.now();
          const poll = setInterval(async ()=>{
            const ok = isInstalledNative(p1) && isInstalledNative(p2);
            if(ok){
              clearInterval(poll);
              toast("Offline kuruldu ✅");
              await render();
              return;
            }
            const elapsed = Date.now() - started;
            if(elapsed > 60000){
              clearInterval(poll);
              toast("Kurulum sürüyor… (dosya büyük)");
              await render();
              return;
            }
            setBusy(true, "İndiriliyor… (büyük dosya)");
          }, 2200);

        }catch(e){
          console.warn(e);
          toast("Kurulum başlatılamadı");
          setBusy(false);
        }
      };

      // ✅ Silme: Native tarafına henüz uninstall eklemedik (kırılmasın diye uyar)
      del.onclick = async ()=>{
        toast("Silme özelliğini bir sonraki adımda ekliyoruz.");
      };

      card.appendChild(left);

      const right = document.createElement("div");
      right.style.display="flex";
      right.style.gap="8px";
      right.appendChild(btn);
      right.appendChild(del);

      card.appendChild(right);
      list.appendChild(card);
    }
  }

  render();
</script>
</body>
</html>
