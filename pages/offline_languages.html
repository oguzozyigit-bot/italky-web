<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Offline Diller</title>
  <meta name="theme-color" content="#050814"/>

  <style>
    :root{
      --bg1:#050814;
      --bg2:#090d1c;
      --line:rgba(255,255,255,.10);
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --safe-top:0px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --shellLift:0px;
      --shadow:0 18px 38px rgba(0,0,0,.26);

      --free-grad:linear-gradient(135deg, rgba(21,214,130,.24), rgba(77,232,255,.16));
      --free-line:rgba(21,214,130,.34);
      --installed-grad:linear-gradient(135deg,#10b981,#22c55e);
      --installing-grad:linear-gradient(135deg,#64748b,#475569);
      --soft-grad:linear-gradient(135deg, rgba(123,125,255,.20), rgba(255,84,201,.12));
      --soft-line:rgba(123,125,255,.30);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      color:var(--txt);
      font-family:Inter, Outfit, Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(123,125,255,.18), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255,84,201,.15), transparent 24%),
        radial-gradient(circle at 50% 0%, rgba(77,232,255,.10), transparent 30%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    body{
      padding-top:0;
      padding-bottom:0;
    }

    #pageContent{
      min-height:100%;
      height:auto;
      overflow-y:visible;
      overflow-x:hidden;
      padding-top:calc(12px + var(--safe-top));
      padding-bottom:18px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }

    #pageContent::-webkit-scrollbar{
      display:none;
    }

    .page{
      width:100%;
      max-width:760px;
      margin:0 auto;
      padding:0 14px 10px;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
      padding:18px;
      margin-bottom:14px;
      overflow:hidden;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .hero-title{
      margin:0 0 8px;
      font-size:28px;
      font-weight:1000;
      line-height:1.08;
      letter-spacing:-.6px;
    }

    .hero-sub{
      margin:0;
      font-size:16px;
      line-height:1.55;
      color:var(--muted);
      font-weight:800;
    }

    .tool-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-bottom:16px;
    }

    .control-label{
      display:block;
      margin:0 0 8px;
      font-size:13px;
      color:rgba(255,255,255,.72);
      font-weight:900;
      letter-spacing:.2px;
    }

    .search{
      width:100%;
      height:60px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      padding:0 18px;
      font-size:16px;
      font-weight:800;
    }

    .search::placeholder{
      color:rgba(255,255,255,.42);
    }

    .fake-select{
      width:100%;
      min-height:60px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:#fff;
      padding:0 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
    }

    .fake-select:active{
      transform:scale(.992);
    }

    .fake-select-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .fake-select-flag{
      font-size:24px;
      width:28px;
      text-align:center;
      flex:0 0 28px;
    }

    .fake-select-text{
      min-width:0;
    }

    .fake-select-title{
      font-size:16px;
      font-weight:900;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .fake-select-sub{
      margin-top:3px;
      font-size:12px;
      color:rgba(255,255,255,.58);
      font-weight:800;
    }

    .fake-select-caret{
      color:rgba(255,255,255,.62);
      font-size:18px;
      flex:0 0 auto;
    }

    .hint{
      margin-top:8px;
      font-size:12px;
      color:rgba(255,255,255,.56);
      font-weight:800;
      line-height:1.45;
    }

    .status-strip{
      margin-top:12px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;
      font-weight:900;
      color:rgba(255,255,255,.88);
      line-height:1.5;
    }

    .section-title{
      margin:6px 0 14px;
      font-size:18px;
      font-weight:1000;
    }

    .lang-card{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      border-radius:24px;
      padding:18px;
      margin-bottom:14px;
    }

    .lang-head{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .flag{
      width:56px;
      height:56px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

    .lang-name{
      font-size:19px;
      font-weight:1000;
      line-height:1.1;
      margin:0;
    }

    .lang-sub{
      margin-top:4px;
      font-size:14px;
      color:var(--muted);
      font-weight:800;
    }

    .lang-btn{
      width:100%;
      height:64px;
      border-radius:20px;
      border:none;
      color:#fff;
      font-size:17px;
      font-weight:1000;
      cursor:pointer;
      letter-spacing:.2px;
    }

    .lang-btn.free{
      background:var(--free-grad);
      border:1px solid var(--free-line);
      color:#fff;
    }

    .lang-btn.installed{
      background:var(--installed-grad);
      color:#fff;
    }

    .lang-btn.installing{
      background:var(--installing-grad);
      color:#fff;
    }

    .lang-btn[disabled]{
      opacity:.82;
      cursor:default;
    }

    .download-status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }

    .download-status-line{
      font-size:15px;
      font-weight:1000;
      color:#fff;
      line-height:1.4;
    }

    .loading-dots::after{
      content:"";
      animation:loadingDots 1.35s steps(4, end) infinite;
    }

    @keyframes loadingDots{
      0%, 20%{ content:""; }
      40%{ content:"."; }
      60%{ content:".."; }
      80%, 100%{ content:"..."; }
    }

    .download-status-hint{
      margin-top:10px;
      font-size:13px;
      color:rgba(255,255,255,.72);
      font-weight:800;
      line-height:1.55;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(22px + var(--safe-bottom) + var(--shellLift));
      transform:translateX(-50%) translateY(120px);
      background:rgba(10,12,24,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      padding:14px 18px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      z-index:9999;
      transition:.25s ease;
      box-shadow:0 18px 36px rgba(0,0,0,.30);
      text-align:center;
      max-width:min(92vw, 560px);
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9998;
      padding:18px;
    }

    .modal-backdrop.show{
      display:flex;
    }

    .modal{
      width:min(92vw, 540px);
      border-radius:30px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg, rgba(20,24,44,.98), rgba(10,12,24,.98));
      box-shadow:0 24px 60px rgba(0,0,0,.45);
      padding:24px;
    }

    .modal-title{
      font-size:24px;
      font-weight:1000;
      margin:0 0 12px;
      line-height:1.15;
    }

    .modal-text{
      font-size:16px;
      line-height:1.7;
      color:rgba(255,255,255,.88);
      font-weight:800;
      white-space:pre-line;
    }

    .modal-actions{
      display:flex;
      gap:12px;
      margin-top:20px;
    }

    .modal-btn{
      flex:1;
      height:64px;
      border-radius:22px;
      border:none;
      font-size:18px;
      font-weight:1000;
      cursor:pointer;
    }

    .modal-btn.cancel{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }

    .modal-btn.ok{
      background:var(--free-grad);
      border:1px solid var(--free-line);
      color:#fff;
    }

    #confirmBackdrop.offline-first-setup{
      align-items:flex-end;
      justify-content:center;
      padding:18px 14px calc(18px + var(--safe-bottom) + var(--shellLift));
      background:
        radial-gradient(circle at 50% 100%, rgba(56,189,248,.24), transparent 46%),
        rgba(1,6,18,.72);
      backdrop-filter:blur(18px) saturate(1.2);
      -webkit-backdrop-filter:blur(18px) saturate(1.2);
    }

    #confirmBackdrop.offline-first-setup .modal{
      position:relative;
      width:min(94vw, 560px);
      max-height:min(82vh, 640px);
      overflow:auto;
      border-radius:30px;
      padding:24px 22px 22px;
      border:1px solid rgba(125,211,252,.28);
      background:
        radial-gradient(circle at 20% 0%, rgba(56,189,248,.24), transparent 34%),
        radial-gradient(circle at 85% 15%, rgba(99,102,241,.20), transparent 30%),
        linear-gradient(155deg, rgba(8,31,61,.98), rgba(4,10,26,.98) 54%, rgba(2,6,23,.98));
      box-shadow:0 -18px 70px rgba(14,165,233,.24), 0 26px 80px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.10);
      scrollbar-width:none;
    }

    #confirmBackdrop.offline-first-setup .modal::-webkit-scrollbar{
      display:none;
    }

    #confirmBackdrop.offline-first-setup .modal::before{
      content:"";
      display:block;
      width:54px;
      height:5px;
      margin:0 auto 18px;
      border-radius:999px;
      background:rgba(186,230,253,.55);
      box-shadow:0 0 18px rgba(56,189,248,.32);
    }

    #confirmBackdrop.offline-first-setup .modal-title{
      position:relative;
      margin:0 0 14px;
      padding-left:46px;
      font-size:25px;
      letter-spacing:-.35px;
      color:#f8fbff;
    }

    #confirmBackdrop.offline-first-setup .modal-title::before{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:34px;
      height:34px;
      margin-top:-17px;
      border-radius:14px;
      background:linear-gradient(135deg,#38bdf8,#2563eb);
      box-shadow:0 0 24px rgba(56,189,248,.38), inset 0 1px 0 rgba(255,255,255,.30);
    }

    #confirmBackdrop.offline-first-setup .modal-title::after{
      content:"";
      position:absolute;
      left:11px;
      top:50%;
      width:12px;
      height:12px;
      margin-top:-6px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.92);
      border-top-color:rgba(255,255,255,.28);
      animation:offlineSpin 1s linear infinite;
    }

    #confirmBackdrop.offline-first-setup .modal-text{
      padding:16px;
      border-radius:22px;
      border:1px solid rgba(186,230,253,.16);
      background:rgba(15,23,42,.38);
      color:rgba(239,246,255,.90);
      font-size:14px;
      line-height:1.62;
      font-weight:750;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }

    #confirmBackdrop.offline-first-setup .modal-text::after{
      content:"Hazırlanıyor...";
      display:inline-flex;
      margin-top:14px;
      padding:8px 12px;
      border-radius:999px;
      color:#dff7ff;
      background:rgba(14,165,233,.16);
      border:1px solid rgba(125,211,252,.20);
      font-size:12px;
      font-weight:1000;
      letter-spacing:.2px;
    }

    #confirmBackdrop.offline-first-setup .modal-actions{
      margin-top:16px;
      display:block;
    }

    #confirmBackdrop.offline-first-setup #confirmCancel{
      display:none;
    }

    #confirmBackdrop.offline-first-setup #confirmOk{
      width:100%;
      min-height:58px;
      height:auto;
      border-radius:20px;
      color:#02111f;
      background:linear-gradient(135deg,#7dd3fc,#22d3ee 48%,#e0f7ff);
      border:1px solid rgba(224,247,255,.75);
      box-shadow:0 16px 38px rgba(34,211,238,.24), inset 0 1px 0 rgba(255,255,255,.60);
      font-size:14px;
      letter-spacing:.9px;
    }

    @keyframes offlineSpin{
      to{ transform:rotate(360deg); }
    }

    .picker-list{
      margin-top:16px;
      max-height:58vh;
      overflow:auto;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
    }

    .picker-option{
      width:100%;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:16px 18px;
      font-size:17px;
      font-weight:900;
      border-bottom:1px solid rgba(255,255,255,.08);
      cursor:pointer;
      text-align:left;
    }

    .picker-option:last-child{
      border-bottom:none;
    }

    .picker-option-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .picker-option-flag{
      font-size:28px;
      width:32px;
      flex:0 0 32px;
      text-align:center;
    }

    .picker-option-name{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .picker-option-check{
      font-size:20px;
      color:#8cf0ff;
      opacity:0;
    }

    .picker-option.active .picker-option-check{
      opacity:1;
    }

    @media (min-width:640px){
      .tool-grid{
        grid-template-columns:1fr 1fr;
      }
      .tool-grid .span-2{
        grid-column:1 / -1;
      }
    }

    @media (max-width:420px){
      .hero-title{ font-size:24px; }
      .hero-sub{ font-size:15px; }
      .modal-actions{ flex-direction:column; }
      #confirmBackdrop.offline-first-setup .modal-title{font-size:22px;}
      #confirmBackdrop.offline-first-setup .modal-text{font-size:13px;line-height:1.56;}
    }
  </style>
</head>
<body>
  <main id="pageContent">
    <div class="page">
      <section class="panel">
        <h1 class="hero-title">Offline Diller</h1>
        <p class="hero-sub">İnternet yokken de çeviriye devam et. Kendi dilini seç, gerekli dilleri indir ve kullan.</p>
      </section>

      <section class="panel">
        <div class="tool-grid">
          <div>
            <label class="control-label">Benim Dilim</label>
            <button id="myLangPickerBtn" class="fake-select" type="button">
              <div class="fake-select-left">
                <div id="myLangFlag" class="fake-select-flag">🇹🇷</div>
                <div class="fake-select-text">
                  <div id="myLangTitle" class="fake-select-title">Türkçe</div>
                  <div class="fake-select-sub">Ana konuşma diliniz</div>
                </div>
              </div>
              <div class="fake-select-caret">▾</div>
            </button>
            <div class="hint">Seçtiğin diller ana dilinle birlikte indirilecektir.</div>
          </div>

          <div>
            <label class="control-label" for="searchInput">Dil Ara</label>
            <input id="searchInput" class="search" type="text" placeholder="Dil ara"/>
            <div class="hint">Örnek: Almanca, Fransızca, Rusça</div>
          </div>

          <div class="span-2 status-strip" id="licenseInfo">
            Offline lisans kontrol ediliyor...
          </div>
        </div>

        <div class="section-title" id="sectionLangTitle">Diller</div>
        <div id="installedList"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="confirmBackdrop" class="modal-backdrop">
    <div class="modal">
      <h3 id="confirmTitle" class="modal-title">Dil indirilsin mi?</h3>
      <div id="confirmText" class="modal-text"></div>
      <div class="modal-actions">
        <button id="confirmCancel" class="modal-btn cancel" type="button">Vazgeç</button>
        <button id="confirmOk" class="modal-btn ok" type="button">İndir</button>
      </div>
    </div>
  </div>

  <div id="langPickerBackdrop" class="modal-backdrop">
    <div class="modal">
      <h3 class="modal-title">Benim Dilim</h3>
      <div class="modal-text">Kullandığınız ana dili seçin.</div>
      <div id="langPickerList" class="picker-list"></div>
      <div class="modal-actions">
        <button id="langPickerClose" class="modal-btn cancel" type="button">Kapat</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const SEEN_KEY = "italky_offline_first_setup_notice_seen_v1";
      const PAIRS_KEY = "italky_offline_installed_pairs_v7";
      const backdrop = document.getElementById("confirmBackdrop");
      const title = document.getElementById("confirmTitle");
      const text = document.getElementById("confirmText");
      const ok = document.getElementById("confirmOk");

      const setupText = "Bu dil ilk kez hazırlanıyor. Dil paketi ve gerekli çeviri bileşenleri cihazınıza indiriliyor.\n\nİndirme devam edecektir. Bu sayfada beklemenize gerek yoktur. Uygulama içinde diğer sayfalara geçebilirsiniz.";

      function hasInstalledPairs() {
        try {
          const pairs = JSON.parse(localStorage.getItem(PAIRS_KEY) || "{}");
          return !!pairs && typeof pairs === "object" && Object.keys(pairs).length > 0;
        } catch {
          return false;
        }
      }

      function shouldUpgradeConfirm() {
        return !!backdrop?.classList.contains("show") &&
          !localStorage.getItem(SEEN_KEY) &&
          !hasInstalledPairs() &&
          /indirilsin mi/i.test(String(title?.textContent || ""));
      }

      function applyFirstSetupSheet() {
        if (!shouldUpgradeConfirm()) return;
        backdrop.classList.add("offline-first-setup");
        if (title) title.textContent = "Dil paketi hazırlanıyor";
        if (text) text.textContent = setupText;
        if (ok) ok.textContent = "Arka planda devam et";
      }

      const observer = new MutationObserver(applyFirstSetupSheet);
      if (backdrop) observer.observe(backdrop, { attributes: true, attributeFilter: ["class"] });

      ok?.addEventListener("click", () => {
        if (backdrop?.classList.contains("offline-first-setup")) {
          localStorage.setItem(SEEN_KEY, "1");
          setTimeout(() => backdrop.classList.remove("offline-first-setup"), 120);
        }
      }, true);

      backdrop?.addEventListener("click", (event) => {
        if (backdrop.classList.contains("offline-first-setup") && event.target === backdrop) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    })();
  </script>

  <script type="module">
    import { initGlobalAccess } from "/js/global_access.js";
    await initGlobalAccess({ allowPublicPageBypass: false });
  </script>

  <script type="module" src="/js/language_registry_129.js?v=2"></script>
  <script type="module" src="/js/offline_languages_page.js?v=11"></script>
</body>
</html>
