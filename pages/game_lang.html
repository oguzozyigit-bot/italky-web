<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Oyun Dili</title>

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #f97316 0%, #ed64a6 50%, #6366f1 100%);
      --neon-orange: #f97316;
      --glass-border: rgba(255, 255, 255, 0.1);
      --bg-dark: #02000f;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700&display=swap');

    html, body { 
      background: var(--bg-dark) !important; margin: 0; padding: 0; 
      height: 100vh; width: 100vw; overflow: hidden; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 🛡️ Shell içi tam sığdırma */
    #pageContent {
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      padding: 10px 15px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.1), transparent 50%);
      opacity: 0; transition: opacity 0.4s ease;
    }
    #pageContent.ui-ready { opacity: 1; }

    .wrap { height: 100%; display: flex; flex-direction: column; gap: 12px; }

    /* 🎯 Hero Alanı: Oyun Temalı */
    .hero {
      flex: 0 0 auto;
      padding: 15px; border-radius: 22px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .hero h1 { font-size: 18px; font-weight: 800; color: #fff; margin: 0; }
    .hero h1 span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin: 6px 0 0; line-height: 1.4; }

    /* 🚀 Dil Kartları: Tam Sığdırma */
    .list { 
      flex: 1; 
      display: flex; flex-direction: column; 
      gap: 8px; 
      justify-content: space-evenly; 
      min-height: 0;
    }

    .langCard {
      flex: 1; 
      max-height: 75px; 
      width: 100%; border-radius: 20px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02); 
      padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
      position: relative; overflow: hidden;
    }

    .langCard:active { transform: scale(0.97) translateY(2px); background: rgba(255,255,255,0.06); }

    /* Oyun "Glow" Efekti */
    .langCard::after {
      content: ""; position: absolute; left: 0; top: 0; width: 5px; height: 100%;
      background: var(--ai-grad); box-shadow: 0 0 15px var(--neon-orange);
      opacity: 0.6;
    }

    .left { display: flex; align-items: center; gap: 12px; z-index: 5; }

    /* Nöral Çekirdek: Oyun Modu (Turuncu Enerji) */
    .flagRing {
      width: 42px; height: 42px; border-radius: 14px;
      background: var(--ai-grad); padding: 2px;
      animation: rotateRing 15s linear infinite;
    }
    .flagBox {
      width: 100%; height: 100%; border-radius: 12px;
      background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .txt .name { font-size: 16px; font-weight: 800; color: #fff; display: block; }
    .txt .sub { font-size: 10px; color: rgba(255, 255, 255, 0.4); font-weight: 600; text-transform: uppercase; }
    .txt .sub.ok { color: var(--neon-orange); filter: brightness(1.2); }
    .txt .sub.bad { color: #ff004c; }

    .right { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 10px; font-weight: 900; color: #fff;
      padding: 4px 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
    }
    .chev { color: rgba(255, 255, 255, 0.2); font-size: 18px; }

    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="wrap">
      <section class="hero">
        <h1>Oyun <span>Modu</span></h1>
        <p>Reflekslerini test etmek için uzmanlaştığın dili seç.</p>
      </section>

      <section class="list" id="list"></section>
    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"none" });
    document.getElementById("pageContent").classList.add("ui-ready");

    const list = document.getElementById("list");

    const LANGS = [
      { code:"en", name:"English",  flag:"🇬🇧" },
      { code:"de", name:"German",   flag:"🇩🇪" },
      { code:"fr", name:"French",   flag:"🇫🇷" },
      { code:"it", name:"Italian",  flag:"🇮🇹" },
      { code:"ru", name:"Russian",  flag:"🇷🇺" },
      { code:"es", name:"Spanish",  flag:"🇪🇸" },
    ];

    async function init() {
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session) return;
      
      const { data: prof } = await supabase.from("profiles").select("levels").eq("id", session.user.id).maybeSingle();
      const levels = prof?.levels || {};

      list.innerHTML = LANGS.map(l => {
        const lv = levels[l.code] || "";
        const subTxt = lv ? `Seviye: ${lv} • Oyna` : "Sınav Gerekli";
        return `
          <button class="langCard" onclick="window.handleSelect('${l.code}', '${lv}')">
            <div class="left">
              <div class="flagRing"><div class="flagBox">${l.flag}</div></div>
              <div class="txt">
                <span class="name">${l.name}</span>
                <span class="sub ${lv ? 'ok' : 'bad'}">${subTxt}</span>
              </div>
            </div>
            <div class="right">
              <div class="badge">${l.code.toUpperCase()}</div>
              <div class="chev">›</div>
            </div>
          </button>
        `;
      }).join("");
    }

    window.handleSelect = (code, lv) => {
      if(!lv) {
        location.href = `/pages/level_test_hub.html?lang=${code}`;
      } else {
        localStorage.setItem("italky_game_lang", code);
        localStorage.setItem("italky_game_level", lv);
        location.href = "/pages/game_menu.html";
      }
    };

    init();
  </script>
</body>
</html>
