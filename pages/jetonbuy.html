<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Jeton Yükle</title>
<meta name="theme-color" content="#06111d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06111d;
  --surface:#0b1a2a;
  --surface2:#102538;
  --line:rgba(53,213,208,.24);
  --line2:rgba(255,255,255,.075);
  --cyan:#35d5d0;
  --cyan2:#72fff7;
  --text:#f6fbff;
  --muted:#9eb2c8;
  --gold:#f4bd50;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shellLift:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)!important;color:var(--text);font-family:Manrope,Arial,sans-serif}
body{background:linear-gradient(180deg,#07131f 0%,#06111d 52%,#040b13 100%)!important}
#pageContent{position:relative;z-index:2;width:100%;height:100%;overflow:auto;scrollbar-width:none;padding:92px clamp(18px,3.2vw,38px) calc(104px + var(--safe-bottom) + var(--shellLift));color:var(--text)}
#pageContent::-webkit-scrollbar{display:none}
.tokens-page{width:100%;max-width:1920px;margin:0 auto;min-height:100%;position:relative}
.tokens-hero{position:relative;min-height:168px;padding:22px 0 18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;overflow:hidden}
.tokens-hero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(6,17,29,.98) 0%,rgba(6,17,29,.78) 38%,rgba(6,17,29,.34) 72%,rgba(6,17,29,.96) 100%),url('https://www.icany.ai/brand/hero/crowd-lights.mp4');opacity:.35}
.tokens-hero:after{content:"";position:absolute;right:17%;top:-96px;width:430px;height:260px;border-radius:54px;background:linear-gradient(135deg,rgba(53,213,208,.12),rgba(255,42,142,.12));filter:blur(18px);transform:rotate(-10deg);z-index:-1}
.market-kicker{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:6px 13px;border-radius:999px;border:1px solid rgba(53,213,208,.42);background:rgba(53,213,208,.14);color:#66fff6;font-size:12px;font-weight:1000;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.tokens-hero h1{margin:0;font-size:clamp(38px,4vw,56px);line-height:.94;font-weight:1000;letter-spacing:-.06em;color:#fff}
.market-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.market-pill{display:inline-flex;align-items:center;min-height:32px;padding:7px 13px;border-radius:999px;border:1px solid rgba(53,213,208,.22);background:rgba(8,24,38,.72);color:#b8c9db;font-size:12px;font-weight:900;white-space:nowrap}.market-pill strong{color:#fff}.market-pill.play{color:#fff}.market-pill.rate{color:#aafffa}
.products-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.token-card{position:relative;min-height:342px;border:1px solid rgba(53,213,208,.22);border-radius:22px;background:linear-gradient(180deg,rgba(15,34,53,.92),rgba(8,20,34,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.04);padding:20px 18px;display:flex;flex-direction:column;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;overflow:hidden}.token-card:hover{transform:translateY(-2px);border-color:rgba(53,213,208,.50);box-shadow:0 18px 50px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.04)}.token-card.recommended{border-color:rgba(53,213,208,.55);background:radial-gradient(circle at 80% 0%,rgba(53,213,208,.16),transparent 34%),linear-gradient(180deg,rgba(13,49,68,.96),rgba(8,20,34,.98))}.token-card.best{background:radial-gradient(circle at 82% 0%,rgba(244,189,80,.13),transparent 33%),linear-gradient(180deg,rgba(15,35,55,.95),rgba(8,20,34,.98))}
.card-no{color:#3bfff5;font-size:13px;font-weight:1000;letter-spacing:.12em;margin-bottom:24px}.card-badge{position:absolute;right:18px;top:18px;min-height:28px;padding:7px 12px;border:1px solid rgba(53,213,208,.32);border-radius:999px;background:rgba(53,213,208,.12);color:#c7fffb;font-size:11px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase}.best .card-badge{border-color:rgba(244,189,80,.30);background:rgba(244,189,80,.13);color:#ffe3a5}
.card-title{font-size:22px;line-height:1.1;font-weight:1000;color:#fff;margin-bottom:10px}.card-amount{display:flex;align-items:flex-end;gap:7px;margin-bottom:22px}.card-amount strong{font-size:46px;line-height:.9;font-weight:1000;letter-spacing:-.06em;color:#fff}.card-amount span{font-size:13px;font-weight:900;color:#a9c1d9;margin-bottom:4px}
.price-box{border:1px solid rgba(53,213,208,.18);background:rgba(5,16,28,.74);border-radius:16px;padding:17px 14px;margin-bottom:18px;min-height:106px}.price-main{display:flex;align-items:baseline;gap:5px;font-size:27px;line-height:1;font-weight:1000;color:#fff;letter-spacing:-.04em}.price-main small{font-size:11px;color:#66fff6;font-weight:1000;letter-spacing:0}.unit-price{margin-top:10px;font-size:12px;font-weight:900;color:#99aec4}.advantage{margin-top:7px;font-size:12px;font-weight:1000;color:#6ffff7}.card-spacer{flex:1 1 auto}.buy-btn{width:100%;min-height:54px;border:0;border-radius:15px;background:#fff;color:#06111d;font-size:14px;font-weight:1000;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.20);transition:transform .14s ease,opacity .14s ease}.buy-btn:active{transform:scale(.985)}.play-triangle{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid #22c55e;filter:drop-shadow(4px 0 0 #facc15) drop-shadow(8px 0 0 #38bdf8)}
.product-id{margin-top:10px;text-align:center;color:#6d839b;font-size:10px;font-weight:900;letter-spacing:.04em}.history-link{display:flex;justify-content:center;margin:28px 0 4px}.history-link a{color:#3ffff6;font-size:14px;font-weight:1000;text-decoration:none}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9999;transform:translateX(-50%) translateY(20px);max-width:min(92vw,520px);padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(6,17,29,.96);box-shadow:0 20px 50px rgba(0,0,0,.34);color:#fff;text-align:center;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1180px){.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.token-card{min-height:310px}}
@media(max-width:720px){#pageContent{padding:86px 14px calc(104px + var(--safe-bottom) + var(--shellLift))}.tokens-hero{min-height:148px}.products-grid{grid-template-columns:1fr;gap:12px}.token-card{min-height:278px;padding:17px}.card-no{margin-bottom:16px}.card-amount strong{font-size:40px}.market-kicker{font-size:10px}.tokens-hero h1{font-size:38px}.price-box{min-height:96px}}
</style>
</head>
<body>
<div id="pageContent">
  <main class="tokens-page">
    <section class="tokens-hero">
      <div class="market-kicker">ITALKYAI · JETON MARKET</div>
      <h1>Jeton yükle</h1>
      <div class="market-pills">
        <span class="market-pill play">Google Play</span>
        <span class="market-pill">USD + KDV</span>
        <span class="market-pill rate" id="priceState">Google Play fiyatları yükleniyor</span>
        <span class="market-pill">Mevcut bakiye: <strong id="currentTokens">0</strong></span>
      </div>
    </section>

    <section class="products-grid" id="products" aria-label="Jeton paketleri"></section>

    <div class="history-link">
      <a href="/pages/wallet_history.html">Jeton hareketlerini görüntüle</a>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { mountShell, setHeaderTokens } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";
import { STORAGE_KEY } from "/js/config.js";

const PRODUCTS = [
  { no:"01", id:"jeton_20", tokens:25, badge:"PAKET", fallbackPrice:"0,99", note:"Başlangıç paketi", unit:"≈ 0,0396 USD / jeton", advantage:"Play fiyatı ödeme ekranında doğrulanır" },
  { no:"02", id:"jeton_50", tokens:50, badge:"", fallbackPrice:"1,49", note:"Günlük kullanım", unit:"≈ 0,0298 USD / jeton", advantage:"Daha avantajlı" },
  { no:"03", id:"jeton_100", tokens:100, badge:"ÖNERİLEN", fallbackPrice:"2,29", note:"Popüler paket", unit:"≈ 0,0229 USD / jeton", advantage:"En çok tercih edilen", recommended:true },
  { no:"04", id:"jeton_500", tokens:500, badge:"%60 BİRİM FİYAT AVANTAJI", fallbackPrice:"9,99", note:"Büyük paket", unit:"≈ 0,0200 USD / jeton", advantage:"En avantajlı paket", best:true }
];

try{ mountShell({ scroll:"none" }); }catch(e){ console.warn("[jetonbuy shell]", e); }
try{
  const root = getComputedStyle(document.documentElement);
  const footerH = parseFloat(root.getPropertyValue("--footerH")) || 0;
  document.documentElement.style.setProperty("--shellLift", footerH ? `${footerH + 10}px` : "0px");
}catch(e){ console.warn("[jetonbuy shellLift]", e); }

let __billingUserId = "";
let lastPriceMap = {};
const currentTokensEl = document.getElementById("currentTokens");
const toastEl = document.getElementById("toast");
const productsEl = document.getElementById("products");
const priceStateEl = document.getElementById("priceState");

function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = String(msg || "");
  toastEl.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2300);
}

function formatTokens(value){
  try{return Number(value||0).toLocaleString("tr-TR");}catch{return String(value||0);}
}

function readPrice(product){
  const info = lastPriceMap[product.id] || {};
  const raw = info.price || info.formattedPrice || info.localizedPrice || info.priceText || product.fallbackPrice;
  return String(raw).replace(/\s*USD\s*$/i, "").trim();
}

function renderProducts(){
  if(!productsEl) return;
  productsEl.innerHTML = PRODUCTS.map((p) => {
    const price = readPrice(p);
    return `
      <article class="token-card${p.recommended ? " recommended" : ""}${p.best ? " best" : ""}" data-product-id="${p.id}">
        <div class="card-no">${p.no}</div>
        ${p.badge ? `<div class="card-badge">${p.badge}</div>` : ""}
        <div class="card-title">${formatTokens(p.tokens)} Jeton</div>
        <div class="card-amount"><strong>${formatTokens(p.tokens)}</strong><span>jeton</span></div>
        <div class="price-box">
          <div class="price-main"><span>${price}</span><small>USD + KDV</small></div>
          <div class="unit-price">${p.unit}</div>
          <div class="advantage">${p.advantage}</div>
        </div>
        <div class="card-spacer"></div>
        <button class="buy-btn" type="button" data-buy="${p.id}"><span class="play-triangle"></span><span>Google Play ile satın al</span></button>
        <div class="product-id">${p.id}</div>
      </article>`;
  }).join("");
}

function normalizePricePayload(payload){
  if(!payload) return {};
  let data = payload;
  if(typeof data === "string"){
    try{ data = JSON.parse(data); }catch{ return {}; }
  }
  const rows = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : Array.isArray(data.productDetails) ? data.productDetails : []);
  const map = {};
  rows.forEach((item) => {
    const id = item?.productId || item?.product_id || item?.id || item?.sku;
    if(!id) return;
    map[id] = {
      price: item.price || item.formattedPrice || item.localizedPrice || item.priceText || item.oneTimePurchaseOfferDetails?.formattedPrice,
      source:"google"
    };
  });
  return map;
}

function applyPlayPrices(payload){
  const map = normalizePricePayload(payload);
  if(Object.keys(map).length){
    lastPriceMap = { ...lastPriceMap, ...map };
    if(priceStateEl) priceStateEl.textContent = "Google Play fiyatları alındı";
    renderProducts();
  }
}

window.onGooglePlayProducts = applyPlayPrices;
window.onProductDetailsResult = applyPlayPrices;
window.updateProductPrices = applyPlayPrices;

function requestPlayPrices(){
  const ids = PRODUCTS.map(p => p.id);
  const bridge = window.AndroidBilling;
  try{
    if(bridge?.getProductPrices){ bridge.getProductPrices(JSON.stringify(ids)); return; }
    if(bridge?.requestProductDetails){ bridge.requestProductDetails(JSON.stringify(ids)); return; }
    if(bridge?.queryProducts){ bridge.queryProducts(JSON.stringify(ids)); return; }
    if(bridge?.getProducts){ bridge.getProducts(JSON.stringify(ids)); return; }
    if(priceStateEl) priceStateEl.textContent = "Google Play fiyatı ödeme ekranında doğrulanır";
  }catch(e){
    console.warn("[jetonbuy] Play fiyat isteği hata:", e);
    if(priceStateEl) priceStateEl.textContent = "Google Play fiyatı ödeme ekranında doğrulanır";
  }
}

function getCachedUser(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("italky_user") || localStorage.getItem("user") || localStorage.getItem("auth_user") || localStorage.getItem("italky_auth_user");
    return raw ? JSON.parse(raw) : {};
  }catch{return {};}
}

function resolveTokenValue(user, cached, profileRow){
  return Number(profileRow?.tokens ?? user?.user_metadata?.tokens ?? user?.user_metadata?.jetons ?? cached?.tokens ?? cached?.jetons ?? cached?.user_metadata?.tokens ?? cached?.user_metadata?.jetons ?? 0);
}

async function fetchProfile(userId){
  try{
    const { data, error } = await supabase.from("profiles").select("tokens").eq("id", userId).single();
    if(error){ console.warn("[jetonbuy] profiles okunamadı:", error.message || error); return null; }
    return data || null;
  }catch(e){ console.warn("[jetonbuy] profiles sorgu hata:", e); return null; }
}

async function syncBillingUserId(){
  try{
    const cached = getCachedUser();
    const { data, error } = await supabase.auth.getUser();
    if(error) throw error;
    const user = data?.user || null;
    const userId = user?.id || "";
    __billingUserId = userId;
    const profileRow = userId ? await fetchProfile(userId) : null;
    const tokenVal = resolveTokenValue(user, cached, profileRow);
    if(currentTokensEl) currentTokensEl.textContent = formatTokens(tokenVal);
    try{ setHeaderTokens(tokenVal); }catch{}
    if(userId && window.AndroidBilling?.setUserId){
      window.AndroidBilling.setUserId(userId);
    }
  }catch(e){
    console.warn("[jetonbuy] syncBillingUserId hata:", e);
    if(currentTokensEl) currentTokensEl.textContent = "0";
  }
}

window.buy = async function(productId){
  try{
    if(!__billingUserId){ await syncBillingUserId(); }
    if(!__billingUserId){
      toast("Önce giriş yapmanız gerekiyor.");
      setTimeout(() => { location.href = "/pages/login.html"; }, 700);
      return;
    }
    if(window.AndroidBilling?.buy){
      window.AndroidBilling.buy(productId);
      return;
    }
    toast("Google Play satın alma sistemi uygulama içinde açılır.");
  }catch(e){
    console.warn("[jetonbuy] buy hata:", e);
    toast("Satın alma başlatılamadı.");
  }
};

document.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-buy]");
  if(!btn) return;
  event.preventDefault();
  window.buy(btn.getAttribute("data-buy"));
});

renderProducts();
requestPlayPrices();
syncBillingUserId();
setTimeout(syncBillingUserId, 600);
setTimeout(syncBillingUserId, 1400);
setTimeout(requestPlayPrices, 900);
</script>
</body>
</html>
