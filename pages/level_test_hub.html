<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { supabase } from "/js/supabase_client.js";

mountShell({ scroll:"none" });

const $ = (id)=>document.getElementById(id);
const list = $("list");

const params = new URLSearchParams(location.search);
const selectedLang = (params.get("lang") || "").toLowerCase().trim();
const redirect = (params.get("redirect") || "").trim();

const LANGS = [
  { code:"en", name:"English", flag:"🇬🇧" },
  { code:"de", name:"German",  flag:"🇩🇪" },
  { code:"fr", name:"French",  flag:"🇫🇷" },
  { code:"it", name:"Italian", flag:"🇮🇹" },
  { code:"ru", name:"Russian", flag:"🇷🇺" },
  { code:"es", name:"Spanish", flag:"🇪🇸" }
];

async function init() {
  const { data:{ session } } = await supabase.auth.getSession();
  if(!session){
    location.replace("/pages/login.html");
    return;
  }

  const { data: prof } = await supabase
    .from("profiles")
    .select("levels")
    .eq("id", session.user.id)
    .maybeSingle();

  const levels = prof?.levels || {};

  list.innerHTML = LANGS.map(l => {
    const lv = levels[l.code] || "";
    const isSelected = selectedLang === l.code;

    return `
      <button class="langCard ${isSelected ? "activeLang" : ""}" data-code="${l.code}">
        <div class="left">
          <div class="flagRing"><div class="flagBox">${l.flag}</div></div>
          <div class="txt">
            <span class="name">${l.name}</span>
            <span class="sub ${lv ? 'ok' : ''}">
              ${lv ? `Seviye: ${lv}` : "Seviye yok"}
            </span>
          </div>
        </div>
        <div class="right">
          <div class="badge">${l.code.toUpperCase()}</div>
        </div>
      </button>
    `;
  }).join("");

  bindEvents();
}

function bindEvents(){
  list.querySelectorAll(".langCard").forEach(btn=>{
    btn.onclick = ()=> startTest(btn.dataset.code, btn);
  });
}

let busy = false;

async function startTest(code, btn){
  if(busy) return;
  busy = true;
  btn.disabled = true;

  try{
    const { data, error } = await supabase.rpc("start_level_test", {
      p_language_code: code
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    const testId = row?.test_id || row?.id;

    if(!testId) throw new Error("test_id alınamadı");

    let url = `/pages/level_test.html?test_id=${testId}&lang=${code}`;

    if(redirect){
      url += `&redirect=${encodeURIComponent(redirect)}`;
    }

    location.href = url;

  }catch(e){
    alert("Sınav başlatılamadı: " + (e.message || e));
    btn.disabled = false;
    busy = false;
  }
}

init();
</script>
