<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Seviye Tespit</title>

  <style>
    :root {
      --ai: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --glass-border: rgba(255, 255, 255, 0.1);
      --bg-dark: #02000f;
    }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700&display=swap');

    html, body { 
      background: var(--bg-dark) !important; margin: 0; padding: 0; 
      height: 100vh; width: 100vw; overflow: hidden; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 🛡️ Shell içi tam sığdırma ve yumuşak açılış */
    #pageContent {
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      padding: 10px 15px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 0%, rgba(165, 180, 252, 0.12), transparent 50%);
      opacity: 0; transition: opacity 0.4s ease;
    }
    #pageContent.ui-ready { opacity: 1; }

    .wrap { height: 100%; display: flex; flex-direction: column; gap: 10px; }

    /* 💎 Hero Alanı: Disiplinli ve Dar */
    .hero {
      flex: 0 0 auto;
      padding: 15px; border-radius: 22px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .hero h1 { font-size: 18px; font-weight: 800; color: #fff; margin: 0; }
    .hero h1 span { background: var(--ai); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin: 6px 0 0; line-height: 1.4; }

    /* 🚀 Sınav Kartları: Tam Sığdırma */
    .list { 
      flex: 1; 
      display: flex; flex-direction: column; 
      gap: 8px; 
      justify-content: space-evenly; 
      min-height: 0;
    }

    button.langCard {
      flex: 1; 
      max-height: 75px; 
      width: 100%; border-radius: 20px; 
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02); 
      padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
      position: relative; overflow: hidden;
    }

    button.langCard:active { transform: scale(0.97) translateY(2px); background: rgba(255,255,255,0.06); }
    button.langCard:disabled { opacity: 0.5; filter: grayscale(1); }

    .left { display: flex; align-items: center; gap: 12px; z-index: 5; }

    /* Nöral Çekirdek: Sürekli Dönen Enerji Halkası */
    .flagRing {
      width: 42px; height: 42px; border-radius: 14px;
      background: var(--ai); padding: 2px;
      animation: rotateRing 12s linear infinite;
    }
    .flagBox {
      width: 100%; height: 100%; border-radius: 12px;
      background: #000; display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .txt .name { font-size: 16px; font-weight: 800; color: #fff; display: block; }
    .txt .sub { font-size: 10px; color: rgba(255, 255, 255, 0.4); font-weight: 600; text-transform: uppercase; }
    .txt .sub.ok { color: #a5b4fc; filter: brightness(1.2); }

    .right { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 10px; font-weight: 900; color: #fff;
      padding: 4px 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
    }
    .chev { color: rgba(255, 255, 255, 0.2); font-size: 18px; }

    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <main id="pageContent">
    <div class="wrap">
      <section class="hero">
        <h1>Seviye <span>Tespit</span> Hub</h1>
        <p>Doğru müfredat için seviye analizi gerekir. Sessiz bir ortama geç ve dile dokun.</p>
      </section>

      <section class="list" id="list"></section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    mountShell({ scroll:"none" });
    document.getElementById("pageContent").classList.add("ui-ready");

    const $ = (id)=>document.getElementById(id);
    const list = $("list");

    const LANGS = [
      { code:"en", name:"English", flag:"🇬🇧" },
      { code:"de", name:"German",  flag:"🇩🇪" },
      { code:"fr", name:"French",  flag:"🇫🇷" },
      { code:"it", name:"Italian", flag:"🇮🇹" },
      { code:"ru", name:"Russian", flag:"🇷🇺" },
      { code:"es", name:"Spanish", flag:"🇪🇸" },
    ];

    async function init() {
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session) { location.replace("/pages/login.html"); return; }
      
      const { data: prof } = await supabase.from("profiles").select("levels").eq("id", session.user.id).maybeSingle();
      const levels = prof?.levels || {};

      list.innerHTML = LANGS.map(l => {
        const lv = levels[l.code] || "";
        const subTxt = lv ? `Mevcut Seviye: ${lv}` : "Sınava Henüz Girilmedi";
        return `
          <button class="langCard" data-code="${l.code}">
            <div class="left">
              <div class="flagRing"><div class="flagBox">${l.flag}</div></div>
              <div class="txt">
                <span class="name">${l.name}</span>
                <span class="sub ${lv ? 'ok' : ''}">${subTxt}</span>
              </div>
            </div>
            <div class="right">
              <div class="badge">${l.code.toUpperCase()}</div>
              <div class="chev">›</div>
            </div>
          </button>
        `;
      }).join("");

      bindEvents();
    }

    function bindEvents() {
      list.querySelectorAll(".langCard").forEach(btn => {
        btn.onclick = () => {
          const code = btn.getAttribute("data-code");
          startTest(code, btn);
        };
      });
    }

    let busy = false;
    async function startTest(code, btn) {
      if(busy) return;
      busy = true;
      btn.disabled = true;

      try {
        const { data, error } = await supabase.rpc("start_level_test", { p_language_code: code });
        if(error) throw error;

        let testId = null;
        if(typeof data === "string") testId = data;
        else if(Array.isArray(data)) testId = data[0]?.test_id || data[0]?.id;
        else testId = data?.test_id || data?.id;

        if(!testId) throw new Error("ID alınamadı.");
        location.href = `/pages/level_test.html?test_id=${testId}&lang=${code}`;
      } catch(e) {
        alert("Sınav başlatılamadı: " + (e.message || e));
        btn.disabled = false;
        busy = false;
      }
    }

    init();
  </script>
</body>
</html>
