<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Deep Space Activation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f2ff;
      --violet: #7000ff;
      --pink: #ff00c8;
      --space-bg: #03050a;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(0, 242, 255, 0.2);
    }

    body, html {
      margin: 0; padding: 0; width: 100%; min-height: 100vh;
      background: var(--space-bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
    }

    /* Uzay Arka Planı Animasyonu */
    .space-canvas {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at center, #0a1025 0%, #03050a 100%);
    }

    .stars {
      position: absolute; width: 2px; height: 2px; background: white;
      border-radius: 50%; opacity: 0.5; animation: twinkle 3s infinite;
    }

    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    #pageContent { padding: 40px 20px; display: flex; justify-content: center; }

    .container { width: 100%; max-width: 400px; position: relative; }

    /* Holografik Panel */
    .hologram-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 30px 20px;
      box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .hologram-card::before {
      content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--cyan), transparent 30%);
      animation: rotate 10s linear infinite; opacity: 0.1;
    }

    @keyframes rotate { 100% { transform: rotate(360deg); } }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 38px; text-align: center; margin: 0;
      letter-spacing: -2px; font-weight: 300;
    }

    .hero-title span {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    /* NFC Uzay Animasyonu */
    .nfc-stage {
      height: 240px; position: relative; display: flex; 
      justify-content: center; align-items: center; margin: 20px 0;
    }

    .portal {
      width: 140px; height: 140px; border-radius: 50%;
      border: 2px dashed var(--cyan);
      position: absolute; animation: pulsePortal 4s infinite;
    }

    @keyframes pulsePortal {
      0% { transform: scale(0.8); opacity: 0.2; box-shadow: 0 0 0px var(--cyan); }
      50% { transform: scale(1.1); opacity: 0.6; box-shadow: 0 0 40px var(--cyan); }
      100% { transform: scale(0.8); opacity: 0.2; }
    }

    .scanner-line {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      top: 50%; animation: scan 3s ease-in-out infinite;
    }

    @keyframes scan { 0%, 100% { top: 20%; } 50% { top: 80%; } }

    .space-card {
      width: 110px; height: 70px;
      background: linear-gradient(135deg, rgba(0, 242, 255, 0.4), rgba(112, 0, 255, 0.4));
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px; z-index: 5;
      backdrop-filter: blur(5px);
      position: absolute;
      animation: orbitCard 6s infinite ease-in-out;
    }

    @keyframes orbitCard {
      0% { transform: translateY(120px) rotateX(45deg) scale(0.5); opacity: 0; }
      30% { transform: translateY(0px) rotateX(0deg) scale(1); opacity: 1; }
      70% { transform: translateY(0px) rotateX(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) rotateZ(20deg) scale(0); opacity: 0; }
    }

    /* Input & Buttons */
    .input-wrap { margin-top: 20px; }
    
    .field {
      width: 100%; background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 20px;
      color: var(--cyan); font-size: 24px; text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      transition: 0.3s;
    }

    .field:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 20px rgba(255,0,200,0.2); }

    .btn {
      width: 100%; padding: 18px; border-radius: 20px; border: none;
      margin-top: 15px; cursor: pointer; font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
    }

    .btn-main {
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      color: #000;
    }

    .btn-main:hover { transform: scale(1.02); filter: brightness(1.2); }

    .status { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>

  <div class="space-canvas" id="space"></div>

  <div id="pageContent">
    <div class="container">
      <div class="hologram-card">
        <h1 class="hero-title">italky<span>AI</span></h1>
        <p style="text-align:center; opacity: 0.6; font-size: 13px;">Terminal Bağlantısı Kuruluyor...</p>

        <div class="nfc-stage">
          <div class="portal"></div>
          <div class="scanner-line"></div>
          <div class="space-card">
            <div style="padding: 10px; font-size: 8px; font-weight: 900;">DATA ENCRYPTION KEY</div>
          </div>
        </div>

        <div class="input-wrap">
          <input id="licenseCodeInput" class="field" maxlength="8" placeholder="KODU GİRİN" />
          <button id="activateBtn" class="btn btn-main">Sistemi Başlat</button>
          <button id="trialBtn" class="btn" style="background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.1);">Deneme Modu</button>
        </div>

        <div id="statusLine" class="status"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    // Arka plan yıldızlarını oluştur
    const space = document.getElementById('space');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'stars';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      space.appendChild(star);
    }

    try { mountShell({ scroll: "auto" }); } catch (e) {}

    const API_BASE = "https://italky-api.onrender.com/api";
    const codeInput = document.getElementById("licenseCodeInput");
    const activateBtn = document.getElementById("activateBtn");
    const trialBtn = document.getElementById("trialBtn");
    const statusLine = document.getElementById("statusLine");

    function setStatus(text, type) {
      statusLine.textContent = text;
      statusLine.style.color = type === 'err' ? '#ffaaaa' : '#9ad5b0';
    }

    async function api(path, payload) {
      const { data: { session } } = await supabase.auth.getSession();
      const r = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session?.access_token || ""}`
        },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error("Bağlantı Hatası");
      return r.json();
    }

    activateBtn.onclick = async () => {
      const code = codeInput.value.toUpperCase();
      if(code.length < 8) return setStatus("Geçersiz Protokol", "err");
      
      setStatus("Veri paketleri gönderiliyor...", "warn");
      try {
        await api("/license/activate-code", { code });
        setStatus("Sistem Aktif. Hoş geldiniz.", "ok");
        setTimeout(() => location.href = "/pages/home.html", 1000);
      } catch (e) {
        setStatus("Yetkisiz Erişim", "err");
      }
    };

    trialBtn.onclick = async () => {
      setStatus("Geçici tünel açılıyor...", "warn");
      try {
        await api("/license/start-trial", { days: 7 });
        location.href = "/pages/home.html";
      } catch (e) { setStatus("Hata", "err"); }
    };
  </script>
</body>
</html>
