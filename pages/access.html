<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Global Gateway</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f2ff;
      --violet: #7c5cff;
      --pink: #ff66c4;
      --bg: #0b0e14;
      --grad: linear-gradient(135deg, #00f2ff 0%, #7c5cff 50%, #ff66c4 100%);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    #pageContent {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 20px;
      background: radial-gradient(circle at 50% 50%, #1a1421 0%, #0b0e14 100%);
    }

    /* --- ÜST PANEL: NFC & HOME ANIMASYONU --- */
    .visual-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1200px;
    }

    /* Telefon Mockup */
    .phone-frame {
      width: 140px;
      height: 250px;
      background: #000;
      border: 4px solid #222;
      border-radius: 25px;
      position: relative;
      z-index: 5;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Telefonun içindeki Home.html Dünyası */
    .phone-screen {
      position: absolute;
      inset: 4px;
      background: #120d16;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: scale(0.6); /* İçeriyi küçültüp sığdırıyoruz */
    }

    /* Crystal Cage (Home.html'den) */
    .crystal-cage {
      position: absolute;
      width: 120px; height: 120px;
      transform-style: preserve-3d;
      animation: rotateCrystal 15s linear infinite;
    }
    .crystal-side {
      position: absolute; inset: 0;
      border: 1px solid rgba(0, 242, 255, 0.3);
      background: radial-gradient(circle, rgba(124, 92, 255, 0.1), transparent);
    }
    .side1{ transform:rotateY(0deg) translateZ(60px); }
    .side2{ transform:rotateY(90deg) translateZ(60px); }
    .side3{ transform:rotateY(180deg) translateZ(60px); }
    .side4{ transform:rotateY(270deg) translateZ(60px); }
    .side5{ transform:rotateX(90deg) translateZ(60px); }
    .side6{ transform:rotateX(-90deg) translateZ(60px); }

    /* Siyah Premium Kart */
    .black-premium-card {
      position: absolute;
      width: 130px;
      height: 80px;
      background: linear-gradient(135deg, #111 0%, #000 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      animation: cardNFCAction 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Kart Üzerindeki QR Kod */
    .card-qr {
      width: 35px;
      height: 35px;
      background: #fff;
      padding: 3px;
      border-radius: 4px;
      position: relative;
    }
    .card-qr::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, #000, #000 2px, #fff 2px, #fff 4px);
      opacity: 0.8;
    }

    @keyframes cardNFCAction {
      0% { transform: translate3d(140px, 100px, -150px) rotateY(-45deg); opacity: 0; }
      30% { transform: translate3d(0, 40px, 50px) rotateY(0deg); opacity: 1; }
      50% { transform: translate3d(0, 0px, 80px) scale(1.1); filter: brightness(1.5); }
      70% { transform: translate3d(0, 40px, 50px) rotateY(0deg); opacity: 1; }
      100% { transform: translate3d(-140px, 100px, -150px) rotateY(45deg); opacity: 0; }
    }

    @keyframes rotateCrystal { 100% { transform: rotateX(360deg) rotateY(360deg); } }

    /* --- ALT PANEL: KONTROLLER --- */
    .control-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 35px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .connect-label { font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--muted); opacity: 0.6; }
    .connect-value { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: #fff; margin: 5px 0; }
    
    .status-msg { font-size: 12px; color: var(--cyan); margin-bottom: 15px; min-height: 18px; }

    .btn {
      width: 100%; height: 56px; border-radius: 18px; border: none;
      font-weight: 900; font-family: 'Outfit'; cursor: pointer; transition: 0.3s;
      margin-bottom: 10px;
    }
    .btn-primary { background: #fff; color: #000; font-size: 15px; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 13px; }

    .hero-title { font-family: 'Space Grotesk'; font-size: 24px; margin-bottom: 5px; }
    .hero-title span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  </style>
</head>
<body>

<main id="pageContent">
  <div class="visual-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="crystal-cage">
          <div class="crystal-side side1"></div>
          <div class="crystal-side side2"></div>
          <div class="crystal-side side3"></div>
          <div class="crystal-side side4"></div>
          <div class="crystal-side side5"></div>
          <div class="crystal-side side6"></div>
        </div>
        <div style="z-index:10; font-family:'Space Grotesk'; font-weight:700; color:var(--cyan); margin-top:80px;">italkyAI</div>
      </div>
    </div>
    
    <div class="black-premium-card">
      <div class="card-qr"></div>
      <div style="position:absolute; bottom:8px; right:10px; font-size:6px; color:rgba(255,255,255,0.5);">PREMIUM NFC</div>
    </div>
  </div>

  <div class="control-panel">
    <div class="hero-title">Ear<span>TO</span>Ear</div>
    <div class="connect-label">BAĞLANTI KODUNUZ</div>
    <div id="connectionCodeText" class="connect-value">------</div>
    <div id="heroStatus" class="status-msg">Sistem Hazırlanıyor...</div>

    <div class="actions">
      <button id="activateBtn" class="btn btn-primary" onclick="openCodePrompt()">KOD İLE BAĞLAN</button>
      <button id="trialBtn" class="btn btn-ghost" onclick="copyCode()">KODU KOPYALA</button>
    </div>
  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  import { supabase } from "/js/supabase_client.js";

  // Shell ve Access Ayarları
  try { mountShell({ scroll: "auto" }); } catch (e) {}

  const API_BASE = "https://italky-api.onrender.com/api";
  const codeText = document.getElementById("connectionCodeText");
  const heroStatus = document.getElementById("heroStatus");
  let activeCode = "";

  // 1. Kodu Kopyalama Fonksiyonu
  window.copyCode = async () => {
    if(!activeCode || activeCode === "------") return;
    await navigator.clipboard.writeText(activeCode);
    heroStatus.textContent = "Kod Panoya Kopyalandı!";
    setTimeout(() => heroStatus.textContent = "Bağlantı Bekleniyor...", 2000);
  };

  // 2. Sayfa Yönlendirme (Home.html mantığıyla aynı)
  window.openCodePrompt = () => {
    location.href = "/pages/sidetoside_code.html";
  };

  // 3. Oda Oluşturma ve Polling (Home.html'den gelen orijinal logic)
  async function prepareGateway() {
    try {
      heroStatus.textContent = "Şifreli Kanal Açılıyor...";
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      
      const r = await fetch(`${API_BASE}/interpreter/create-room`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ host_code: code, my_lang: "tr", mode: "interpreter" })
      });
      
      const j = await r.json();
      if(j.room_id) {
        activeCode = j.host_code;
        codeText.textContent = activeCode;
        heroStatus.textContent = "Bağlantı Hazır. Karşı Taraf Bekleniyor...";
        startPolling(j.room_id);
      }
    } catch(e) {
      heroStatus.textContent = "Bağlantı Hatası!";
    }
  }

  function startPolling(roomId) {
    setInterval(async () => {
      try {
        const r = await fetch(`${API_BASE}/interpreter/room/${roomId}`);
        const j = await r.json();
        if(j.status === "active" && j.guest_lang) {
          location.href = `/pages/sidetoside.html?room=${roomId}&role=host&my=tr&auto=1`;
        }
      } catch(e) {}
    }, 2000);
  }

  prepareGateway();
</script>

</body>
</html>
