<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Global Universe</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03050a;
      --cyan: #67e8f9;
      --pink: #f472b6;
      --indigo: #818cf8;
      --grad: linear-gradient(135deg, var(--cyan), var(--indigo), var(--pink));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; overflow: hidden; }

    /* --- GALAXY ENGINE --- */
    .universe {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #0d1224 0%, #03050a 100%);
      z-index: 1;
    }

    /* Merkez Dünya (Sabit ve Parlak) */
    .earth-core {
      position: absolute;
      width: 90px; height: 90px;
      background: var(--grad);
      border-radius: 50%;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 60px rgba(103, 232, 249, 0.5);
      font-family: 'Space Grotesk'; font-size: 18px; color: #000;
      animation: corePulse 3s infinite ease-in-out;
    }

    /* Yörünge Sistemi */
    .orbit-container {
      position: relative;
      width: 600px; height: 600px;
      display: flex; align-items: center; justify-content: center;
    }

    .orbit {
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    /* Bayrak Taşıyıcılar (Dönen Yapılar) */
    .rotator {
      position: absolute; width: 100%; height: 100%;
      animation: spin linear infinite;
    }

    .flag {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      object-fit: cover;
    }

    /* Yörünge 1 (Yakın) */
    .o1 { width: 180px; height: 180px; z-index: 3; }
    .rot1 { animation-duration: 15s; }

    /* Yörünge 2 (Orta) */
    .o2 { width: 320px; height: 320px; z-index: 2; }
    .rot2 { animation-duration: 25s; animation-direction: reverse; }

    /* Yörünge 3 (Uzak) */
    .o3 { width: 480px; height: 480px; z-index: 1; }
    .rot3 { animation-duration: 40s; }

    /* --- UI OVERLAY --- */
    .overlay {
      position: relative; z-index: 200;
      height: 100vh; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 40px 24px 120px; /* Alttan bar payı */
      pointer-events: none;
    }

    .access-card {
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px; padding: 25px;
      text-align: center; pointer-events: auto;
      box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
    }

    .btn-premium {
      width: 100%; padding: 20px; border: none; border-radius: 20px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #fff; font-size: 17px; font-weight: 900;
      cursor: pointer; box-shadow: 0 15px 30px rgba(249, 115, 22, 0.3);
    }

    /* Animasyonlar */
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes corePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  </style>
</head>
<body>

  <div class="universe">
    <div class="earth-core">italky</div>
    
    <div class="orbit-container">
      <div class="orbit o1">
        <div class="rotator rot1">
          <img src="https://flagcdn.com/w80/tr.png" class="flag" style="top:-14px; left:50%; margin-left:-14px;">
          <img src="https://flagcdn.com/w80/us.png" class="flag" style="bottom:-14px; left:50%; margin-left:-14px;">
          <img src="https://flagcdn.com/w80/gb.png" class="flag" style="left:-14px; top:50%; margin-top:-14px;">
          <img src="https://flagcdn.com/w80/de.png" class="flag" style="right:-14px; top:50%; margin-top:-14px;">
        </div>
      </div>

      <div class="orbit o2">
        <div class="rotator rot2">
          <img src="https://flagcdn.com/w80/fr.png" class="flag" style="top:10%; left:15%;">
          <img src="https://flagcdn.com/w80/es.png" class="flag" style="top:10%; right:15%;">
          <img src="https://flagcdn.com/w80/it.png" class="flag" style="bottom:10%; left:15%;">
          <img src="https://flagcdn.com/w80/ru.png" class="flag" style="bottom:10%; right:15%;">
          <img src="https://flagcdn.com/w80/jp.png" class="flag" style="top:50%; right:-14px;">
          <img src="https://flagcdn.com/w80/kr.png" class="flag" style="top:50%; left:-14px;">
        </div>
      </div>

      <div class="orbit o3">
        <div class="rotator rot3">
          <img src="https://flagcdn.com/w80/cn.png" class="flag" style="top:-14px; left:50%;">
          <img src="https://flagcdn.com/w80/sa.png" class="flag" style="bottom:-14px; left:50%;">
          <img src="https://flagcdn.com/w80/br.png" class="flag" style="left:-14px; top:50%;">
          <img src="https://flagcdn.com/w80/in.png" class="flag" style="right:-14px; top:50%;">
          <img src="https://flagcdn.com/w80/nl.png" class="flag" style="top:15%; left:15%;">
          <img src="https://flagcdn.com/w80/se.png" class="flag" style="top:15%; right:15%;">
          <img src="https://flagcdn.com/w80/ca.png" class="flag" style="bottom:15%; left:15%;">
          <img src="https://flagcdn.com/w80/pt.png" class="flag" style="bottom:15%; right:15%;">
        </div>
      </div>
    </div>
  </div>

  <main class="overlay">
    <div class="access-card">
      <h2 style="font-size: 26px; margin-bottom: 4px;">Premium Erişim</h2>
      <p id="uidLabel" style="color: var(--cyan); font-weight: 800; font-size: 14px; margin-bottom: 12px;">ID: BEKLEMEDE</p>
      <p style="color: var(--muted); font-size: 13px; line-height: 1.4;">
        67 Dilin yörüngesine hoş geldin. <br>Eğlenerek öğrenmeye hemen başla!
      </p>
      <button onclick="handleAccess()" class="btn-premium">UYGULAMAYI BAŞLAT</button>
    </div>
  </main>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    try { mountShell({ scroll: "no", title: "italkyAI Premium" }); } catch(e) {}

    function handleAccess() {
      const uid = new URLSearchParams(window.location.search).get("uid") || "italky-guest";
      location.href = `italky://join?uid=${uid}`;
      setTimeout(() => { if (document.visibilityState === "visible") location.href = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai"; }, 2000);
    }
  </script>
</body>
</html>
