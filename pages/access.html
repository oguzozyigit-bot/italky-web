<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Deep Universe Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020408;
      --italky-cyan: #67e8f9;
      --italky-pink: #f472b6;
      --italky-indigo: #818cf8;
      --grad: linear-gradient(135deg, var(--italky-cyan), var(--italky-indigo), var(--italky-pink));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; overflow: hidden; }

    /* --- GALAXY ENGINE --- */
    .universe {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      perspective: 1500px; z-index: 1;
      background: radial-gradient(circle at center, #0a0f1d 0%, #020408 100%);
    }

    .solar-system {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(65deg); /* Yörüngelere derinlik açısı verir */
    }

    /* Merkezdeki Dünya/Çekirdek */
    .sun-core {
      position: absolute; top: 50%; left: 50%;
      width: 100px; height: 100px;
      margin: -50px;
      background: var(--grad);
      border-radius: 50%;
      box-shadow: 0 0 100px var(--italky-cyan);
      transform: rotateX(-65deg); /* Logoyu düz tutar */
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: coreGlow 3s infinite alternate;
    }
    .sun-core b { font-family: 'Space Grotesk'; font-size: 18px; color: #000; text-transform: uppercase; }

    /* Yörünge Tasarımları */
    .orbit {
      position: absolute; top: 50%; left: 50%;
      border: 1.5px solid rgba(103, 232, 249, 0.15);
      border-radius: 50%;
      transform-style: preserve-3d;
    }

    /* Bayraklar ve Gezegenler */
    .planet {
      position: absolute;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      background-size: cover;
      transform: rotateX(-65deg); /* Bayrakları dik tutar */
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    /* 1. Yörünge */
    .orbit-1 { width: 280px; height: 280px; margin: -140px; animation: orbitSpin 12s linear infinite; }
    /* 2. Yörünge */
    .orbit-2 { width: 460px; height: 460px; margin: -230px; animation: orbitSpin 25s linear infinite reverse; }
    /* 3. Yörünge */
    .orbit-3 { width: 650px; height: 650px; margin: -325px; animation: orbitSpin 45s linear infinite; }

    /* --- UI OVERLAY --- */
    .ui-layer {
      position: relative; z-index: 10;
      height: 100%; width: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 40px 24px;
      pointer-events: none;
    }

    .access-card {
      background: rgba(10, 15, 25, 0.7);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 35px;
      padding: 30px;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
    }

    .btn-ultra {
      width: 100%; padding: 22px; margin-top: 20px;
      border: none; border-radius: 22px;
      background: var(--grad); color: #fff;
      font-size: 18px; font-weight: 900; letter-spacing: 1px;
      cursor: pointer; box-shadow: 0 15px 40px rgba(103, 232, 249, 0.3);
    }

    /* --- ANIMATIONS --- */
    @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes coreGlow { 
      0% { box-shadow: 0 0 50px var(--italky-cyan); transform: rotateX(-65deg) scale(1); }
      100% { box-shadow: 0 0 120px var(--italky-pink); transform: rotateX(-65deg) scale(1.1); }
    }

  </style>
</head>
<body>

  <div class="universe">
    <div class="solar-system">
      
      <div class="sun-core"><b>italky</b></div>

      <div class="orbit orbit-1">
        <div class="planet" style="top: 0; left: 50%; background-image: url('https://flagcdn.com/w80/tr.png');"></div>
        <div class="planet" style="bottom: 0; left: 50%; background-image: url('https://flagcdn.com/w80/us.png');"></div>
      </div>

      <div class="orbit orbit-2">
        <div class="planet" style="top: 15%; left: 15%; background-image: url('https://flagcdn.com/w80/de.png');"></div>
        <div class="planet" style="top: 15%; right: 15%; background-image: url('https://flagcdn.com/w80/fr.png');"></div>
        <div class="planet" style="bottom: 50%; right: -15px; background-image: url('https://flagcdn.com/w80/it.png');"></div>
      </div>

      <div class="orbit orbit-3">
        <div class="planet" style="top: 0; left: 50%; background-image: url('https://flagcdn.com/w80/jp.png');"></div>
        <div class="planet" style="bottom: 20%; left: 10%; background-image: url('https://flagcdn.com/w80/es.png');"></div>
        <div class="planet" style="bottom: 20%; right: 10%; background-image: url('https://flagcdn.com/w80/ru.png');"></div>
      </div>

    </div>
  </div>

  <main class="ui-layer">
    <div class="access-card">
      <h2 style="font-size: 28px; margin-bottom: 8px;">italkyAI Premium</h2>
      <p id="uidLabel" style="color: var(--italky-cyan); font-weight: 800; margin-bottom: 15px;">UID: KART OKUTULDU</p>
      <p style="color: rgba(255,255,255,0.5); font-size: 14px;">
        Dünya dilleri yörüngende dönmeye başladı. <br>Hemen giriş yap ve tüm sınırlardan kurtul.
      </p>
      
      <button onclick="handleAccess()" class="btn-ultra">UYGULAMAYI BAŞLAT</button>
      
      <div style="margin-top: 15px; font-size: 11px; color: rgba(255,255,255,0.3);">
        By Ozyigit's • Eğlenerek Öğren!
      </div>
    </div>
  </main>

  <script>
    function getUid() {
      return new URLSearchParams(window.location.search).get("uid") || "TEST-MODE";
    }

    document.getElementById("uidLabel").textContent = "ID: " + getUid();

    function handleAccess() {
      const uid = getUid();
      const deepLink = `italky://join?uid=${uid}`;
      const playStore = "https://play.google.com/store/apps/details?id=com.ozyigits.italkyai";
      
      location.href = deepLink;
      setTimeout(() => { if (document.visibilityState === "visible") location.href = playStore; }, 2000);
    }
  </script>
</body>
</html>
