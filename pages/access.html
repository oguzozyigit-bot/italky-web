<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • Global Gateway</title>
  <meta name="theme-color" content="#070b14" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f2ff;
      --violet: #7c5cff;
      --pink: #ff66c4;
      --bg: #050812;
      --glass: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.08);
      --grad: linear-gradient(135deg, #00f2ff 0%, #7c5cff 50%, #ff66c4 100%);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden; /* Scroll yönetimi shell'e bırakıldı */
    }

    /* Kuantum Arka Plan */
    #pageContent {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      background: 
        radial-gradient(circle at 50% -20%, rgba(0, 242, 255, 0.15), transparent 50%),
        radial-gradient(circle at 50% 120%, rgba(255, 102, 196, 0.1), transparent 50%);
      position: relative;
    }

    /* Dünyayı Küçülten Hologram */
    .world-container {
      position: absolute;
      top: 10%;
      width: 300px;
      height: 300px;
      opacity: 0.4;
      pointer-events: none;
      filter: blur(1px);
    }
    .world-sphere {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 1px dashed var(--cyan);
      animation: rotateWorld 20s linear infinite;
      position: relative;
    }
    @keyframes rotateWorld { 100% { transform: rotate(360deg); } }

    /* Terminal Kartı */
    .terminal {
      width: 100%;
      max-width: 400px;
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--line);
      border-radius: 40px;
      padding: 30px 24px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      z-index: 10;
      position: relative;
    }

    .hero-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px; font-weight: 700; color: var(--cyan);
      text-transform: uppercase; letter-spacing: 3px;
      text-align: center; margin-bottom: 10px;
      display: block;
    }

    .hero-title {
      font-size: 32px; font-weight: 900; text-align: center; margin: 0;
      letter-spacing: -1.5px; line-height: 1;
    }
    .hero-title span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* NFC Şov Alanı */
    .nfc-visual {
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      perspective: 1000px;
    }
    .phone-mockup {
      width: 80px; height: 140px;
      background: #000; border: 2px solid #222;
      border-radius: 15px; position: relative;
      z-index: 2;
    }
    .nfc-card-anim {
      width: 100px; height: 64px;
      background: var(--grad);
      border-radius: 8px;
      position: absolute;
      z-index: 3;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      animation: nfcPass 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes nfcPass {
      0% { transform: translate3d(120px, 40px, -100px) rotateY(-40deg); opacity: 0; }
      30% { transform: translate3d(0, 0, 50px) rotateY(0deg); opacity: 1; }
      70% { transform: translate3d(0, 0, 50px) rotateY(0deg); opacity: 1; filter: brightness(1.5); }
      100% { transform: translate3d(-120px, -40px, -100px) rotateY(40deg); opacity: 0; }
    }

    /* Input & Action */
    .field-group { margin-top: 20px; position: relative; }
    .label { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 15px; margin-bottom: 8px; display: block; }
    
    .field {
      width: 100%; height: 64px; background: rgba(0,0,0,0.5);
      border: 1px solid var(--line); border-radius: 20px;
      color: var(--cyan); font-size: 26px; font-weight: 900;
      text-align: center; font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 6px; transition: 0.3s;
    }
    .field:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 242, 255, 0.15); }

    .btn {
      width: 100%; height: 60px; border-radius: 20px; border: none;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 900; transition: 0.3s;
      display: flex; align-items: center; justify-content: center;
      margin-top: 12px;
    }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: #fff; font-size: 13px; font-weight: 600; }

    .status-line {
      height: 20px; text-align: center; margin-top: 15px;
      font-size: 13px; font-weight: 600;
    }
    .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }

    /* Arka Plan Partikülleri */
    .particle { position: absolute; background: #fff; border-radius: 50%; opacity: 0.2; pointer-events: none; }
  </style>
</head>
<body>

  <div id="pageContent">
    <div class="world-container">
      <div class="world-sphere"></div>
    </div>

    <div class="page">
      <div class="terminal">
        <span class="hero-badge">Birlikte Dünyayı Küçültüyoruz</span>
        <h1 class="hero-title">italky<span>AI</span> Gateway</h1>
        
        <div class="nfc-visual">
          <div class="phone-mockup"></div>
          <div class="nfc-card-anim"></div>
        </div>

        <div class="field-group">
          <label class="label">AKTİVASYON PROTOKOLÜ</label>
          <input id="licenseCodeInput" class="field" maxlength="8" placeholder="••••••••" autocomplete="off" />
        </div>

        <div class="actions" style="margin-top: 15px;">
          <button id="activateBtn" class="btn btn-primary">ERİŞİMİ ONAYLA</button>
          <button id="trialBtn" class="btn btn-ghost">Ücretsiz Keşfet (7 Gün)</button>
        </div>

        <div id="statusLine" class="status-line"></div>
      </div>
      
      <p style="text-align: center; font-size: 11px; color: var(--muted); margin-top: 20px;">
        NFC Kartınızı veya QR kodunuzu hazır bulundurun.
      </p>
    </div>
  </div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    import { supabase } from "/js/supabase_client.js";

    // Arka Plan Efekti
    function createParticles() {
      const container = document.getElementById('pageContent');
      for(let i=0; i<30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        container.appendChild(p);
      }
    }
    createParticles();

    try { mountShell({ scroll: "auto" }); } catch (e) { console.warn(e); }

    const API_BASE = "https://italky-api.onrender.com/api";
    const codeInput = document.getElementById("licenseCodeInput");
    const activateBtn = document.getElementById("activateBtn");
    const trialBtn = document.getElementById("trialBtn");
    const statusLine = document.getElementById("statusLine");

    function setStatus(text, type = "") {
      statusLine.className = `status-line ${type}`;
      statusLine.textContent = text;
    }

    function normalize(v) { return v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8); }

    async function api(path, payload) {
      const { data: { session } } = await supabase.auth.getSession();
      const r = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(session ? { "Authorization": `Bearer ${session.access_token}` } : {})
        },
        body: JSON.stringify(payload)
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || "Bağlantı başarısız");
      return res;
    }

    activateBtn.onclick = async () => {
      const code = normalize(codeInput.value);
      if (code.length !== 8) return setStatus("8 karakterli kod gerekli", "err");
      
      activateBtn.disabled = true;
      setStatus("Protokol doğrulanıyor...", "warn");
      
      try {
        await api("/license/activate-code", { code });
        setStatus("Bağlantı Başarılı!", "ok");
        setTimeout(() => location.href = "/pages/home.html", 800);
      } catch (e) {
        setStatus(e.message, "err");
        activateBtn.disabled = false;
      }
    };

    trialBtn.onclick = async () => {
      trialBtn.disabled = true;
      setStatus("Geçici erişim açılıyor...", "warn");
      try {
        await api("/license/start-trial", { days: 7 });
        location.href = "/pages/home.html";
      } catch (e) {
        setStatus("Sistem hatası", "err");
        trialBtn.disabled = false;
      }
    };

    codeInput.oninput = () => { codeInput.value = normalize(codeInput.value); };
  </script>
</body>
</html>
