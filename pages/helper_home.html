<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>italkyAI • Teacher AI Terminal</title>

<style>
  :root {
    --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
    --purple: #a855f7;
    --glass-border: rgba(255, 255, 255, 0.1);
    --bg-dark: #030308;
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=Plus+Jakarta+Sans:wght@700&display=swap');

  html, body { 
    background: var(--bg-dark); margin: 0; padding: 0; 
    height: 100vh; width: 100vw; overflow: hidden; 
    font-family: 'Plus Jakarta Sans', sans-serif; color: white;
  }

  #pageContent {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    background: radial-gradient(circle at 50% 20%, #1a0a30 0%, #030308 100%);
    position: relative;
  }

  .main-hub {
    flex: 1; display: flex; flex-direction: column;
    padding: 25px; z-index: 10;
  }

  /* --- Header --- */
  .header-zone { text-align: center; margin-bottom: 30px; }
  .header-zone h1 { 
    font-size: 32px; font-weight: 800; margin: 0; letter-spacing: -1px;
  }
  .header-zone h1 span { 
    background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
  }
  .header-zone p { 
    font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; 
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  }

  /* --- Scanner Hero --- */
  .scanner-hero {
    flex: 1; position: relative; border-radius: 40px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
  }
  .scanner-hero:active { transform: scale(0.96) translateY(5px); }

  /* Scan Line Effect */
  .scan-line {
    position: absolute; left: 0; width: 100%; height: 4px;
    background: var(--purple); box-shadow: 0 0 30px var(--purple);
    animation: scanMove 4s ease-in-out infinite;
    z-index: 5; opacity: 0.6;
  }

  /* Formula Layer */
  .formula-node {
    position: absolute; font-family: 'Outfit'; font-size: 14px;
    color: var(--purple); opacity: 0; pointer-events: none;
    animation: formulaFlow 5s infinite linear;
  }

  /* Orb Visual */
  .orb-scanner {
    width: 160px; height: 160px; position: relative;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 30px;
  }
  .ring-outer {
    position: absolute; inset: 0; border: 2px dashed rgba(168, 85, 247, 0.3);
    border-radius: 50%; animation: rotateOrb 15s linear infinite;
  }
  .core-cam {
    width: 100px; height: 100px; background: #000; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
    z-index: 10; animation: breathe 4s infinite ease-in-out;
  }

  /* Text CTA */
  .cta-text { text-align: center; padding: 0 30px; z-index: 10; }
  .cta-text h2 { font-size: 24px; font-weight: 800; color: #fff; margin: 0; }
  .cta-text p { 
    font-size: 14px; color: rgba(255,255,255,0.5); 
    margin-top: 12px; line-height: 1.6; font-weight: 300;
  }

  /* --- Keyframes --- */
  @keyframes scanMove { 0%, 100% { top: 10%; } 50% { top: 90%; } }
  @keyframes rotateOrb { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(168, 85, 247, 0.2); } 50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(168, 85, 247, 0.4); } }
  @keyframes formulaFlow {
    0% { transform: translateY(100px) scale(0.8); opacity: 0; }
    20% { opacity: 0.4; }
    80% { opacity: 0.2; }
    100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
  }
</style>
</head>

<body>
<main id="pageContent">
  <div class="main-hub">

    <header class="header-zone">
      <h1>Teacher <span>AI</span></h1>
      <p>Kuantum Çözüm Merkezi</p>
    </header>

    <section class="scanner-hero" id="btnStartTerminal">
      <div class="scan-line"></div>
      <div class="formula-node" style="left:15%; animation-delay:0s">√x² + y²</div>
      <div class="formula-node" style="left:75%; animation-delay:1.5s">sin(θ)</div>
      <div class="formula-node" style="left:40%; animation-delay:3s">H₂SO₄</div>

      <div class="orb-scanner">
        <div class="ring-outer"></div>
        <div class="core-cam">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#ai-grad-icon)" stroke-width="2.5">
            <defs>
              <linearGradient id="ai-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a5b4fc" />
                <stop offset="100%" style="stop-color:#ec4899" />
              </linearGradient>
            </defs>
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
      </div>

      <div class="cta-text">
        <h2>FOTOĞRAF ÇEK VE ÇÖZ</h2>
        <p>Herhangi bir soruyu saniyeler içinde analiz et ve adım adım mantığını kavra.</p>
      </div>
    </section>

  </div>
</main>

<script type="module">
  import { mountShell } from "/js/ui_shell.js";
  mountShell({ scroll:"none" });

  const btn = document.getElementById("btnStartTerminal");
  btn.onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.style.display = "none";
    document.body.appendChild(input);

    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) { input.remove(); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try { sessionStorage.setItem("exam_photo", String(reader.result || "")); } catch(e){}
        input.remove();
        location.href = "/pages/exam_crop.html";
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };
</script>
</body>
</html>
