<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • OneToAll (Fütüristik)</title>
  <meta name="theme-color" content="#02040a"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #02040a;
      --bg-alt: #0b1220;
      --panel: rgba(10, 18, 32, 0.4);
      --line: rgba(255, 255, 255, 0.06);
      --txt: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
      
      --cyan: #6ee7ff;
      --cyan-glow: rgba(110, 231, 255, 0.3);
      --blue: #5b8cff;
      --pink: #ff4fd8;
      --pink-glow: rgba(255, 79, 216, 0.3);
      --green: #22c55e;
      --grad: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 50%, var(--pink) 100%);
      
      --radius-lg: 40px;
      --radius-md: 20px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--txt);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* --- HIPNOTIK PLAZMA ARKA PLAN --- */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 200vmax;
      height: 200vmax;
      top: -50vmax;
      left: -50vmax;
      z-index: -1;
      opacity: 0.15;
    }

    body::before {
      background: radial-gradient(circle at center, var(--pink) 0%, transparent 40%),
                  radial-gradient(circle at center, var(--blue) 0%, transparent 60%);
      animation: plasma 30s linear infinite;
    }

    body::after {
      background: radial-gradient(circle at center, var(--cyan) 0%, transparent 30%);
      animation: plasma 20s linear infinite reverse;
      filter: blur(50px);
    }

    #pageContent {
      padding: 16px;
      max-width: 460px;
      margin: 0 auto;
      z-index: 10;
      position: relative;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- KAHRAMAN (HERO) - YÜKSEK ENERJİ --- */
    .hero {
      position: relative;
      background: linear-gradient(220deg, #050a14 0%, #10203d 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 30px 24px 24px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.03);
    }

    .hero::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--cyan-glow) 0%, transparent 30%, var(--pink-glow) 100%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border: 1px solid rgba(255,255,255,0.02);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .eyebrow-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      position: relative;
    }

    .eyebrow-dot::after {
      content: "";
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: inherit;
      animation: ripple 2s infinite;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 44px;
      margin: 20px 0 10px;
      line-height: 0.85;
      font-weight: 700;
    }

    .hero-title span {
      background: var(--grad);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradText 3s linear infinite;
    }

    .hero-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* --- KARTLAR & PANALLER - NEON GLOW --- */
    .card {
      background: var(--panel);
      backdrop-filter: blur(25px) saturate(200%);
      -webkit-backdrop-filter: blur(25px) saturate(200%);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    #homeCards .entry-btn {
      width: 100%;
      background: rgba(255,255,255,0.01);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #homeCards #goSpeaker:hover { border-color: var(--pink); box-shadow: 0 0 20px var(--pink-glow); }
    #homeCards #goListener:hover { border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-glow); }

    .entry-btn:active { transform: scale(0.97); }

    .entry-icon {
      font-size: 30px;
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.02);
      display: grid; place-items: center;
      border-radius: 18px;
      border: 1px solid var(--line);
      animation: breath 4s ease-in-out infinite;
    }

    .entry-title { font-size: 22px; font-weight: 800; margin: 0 0 6px; color: #fff; }
    .entry-desc { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; text-align: left; }

    /* --- FORM ELEMANLARI --- */
    .field { margin-bottom: 20px; }
    .label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #999; margin-bottom: 10px; display: block; letter-spacing: 1px; }

    .input, .select {
      width: 100%;
      height: 64px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 0 20px;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
      transition: border-color 0.3s;
    }

    .input:focus, .select:focus { border-color: var(--blue); background: rgba(0,0,0,0.3); }

    .code-input {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      letter-spacing: 12px;
      text-align: center;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 15px var(--cyan-glow);
    }

    /* --- BUTONLAR - ENERJİK --- */
    .btn {
      width: 100%;
      height: 64px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-primary {
      background: var(--grad);
      color: #000;
      box-shadow: 0 15px 30px rgba(91, 140, 255, 0.3);
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-3px); box-shadow: 0 20px 40px rgba(91, 140, 255, 0.4); }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); }

    .btn-danger {
      background: rgba(251, 113, 133, 0.05);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.15);
    }
    .btn-danger:hover { background: rgba(251, 113, 133, 0.1); }

    /* --- TOGGLE GRID --- */
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toggle {
      height: 56px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: #888;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle.active {
      background: rgba(110, 231, 255, 0.1);
      border-color: var(--cyan);
      color: #fff;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    /* --- ROOM CODE DISPLAY --- */
    .room-code-box {
      text-align: center;
      padding: 30px 20px;
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--line);
    }
    .room-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 56px;
      letter-spacing: 10px;
      margin: 10px 0;
      background: var(--grad);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradText 3s linear infinite reverse;
    }

    .status {
      padding: 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: center;
    }
    .status.ok { background: rgba(34, 197, 94, 0.08); color: #4ade80; border: 1px solid rgba(34,197,94,0.15); }
    .status.warn { background: rgba(251, 146, 60, 0.08); color: #fbbf24; border: 1px solid rgba(251,146,60,0.15); }
    .status.danger { background: rgba(251, 113, 133, 0.08); color: #f87171; border: 1px solid rgba(251,113,133,0.15); }

    .hide { display: none !important; }

    /* --- ANIMASYONLAR --- */
    @keyframes plasma {
      0% { transform: translate(0,0) rotate(0deg); }
      50% { transform: translate(10%, 10%) rotate(180deg); }
      100% { transform: translate(0,0) rotate(360deg); }
    }

    @keyframes gradText {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    @keyframes breath {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    /* Giriş Animasyonu */
    .panel-entry {
      animation: panelSlide 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes panelSlide {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .helper { font-size: 11px; color: rgba(255,255,255,0.3); text-align: center; margin-top: 15px; font-weight: 300; }
  </style>
</head>
<body>

  <main id="pageContent">
    <div class="wrap">
      
      <section class="hero panel-entry">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          Live Broadcast Translation
        </div>
        <h1 class="hero-title">One<span>To</span>All</h1>
        <p class="hero-sub">
          Bir konuşmacı, sınırsız dinleyici. Herkes kendi dilinde anlık olarak takip eder.
        </p>
        <div style="display: flex; gap: 8px;">
          <div class="eyebrow" style="text-transform: none; font-size: 10px; color:var(--cyan);">AI Powered</div>
          <div class="eyebrow" style="text-transform: none; font-size: 10px; color:var(--pink);">Real-time</div>
        </div>
      </section>

      <section id="homeCards">
        <button class="entry-btn" id="goSpeaker">
          <div class="entry-icon">🎙️</div>
          <div class="entry-copy">
            <h2 class="entry-title">Konuşmacı</h2>
            <p class="entry-desc">Yayın odası oluştur ve anlatmaya başla.</p>
          </div>
        </button>

        <button class="entry-btn" id="goListener">
          <div class="entry-icon">🎧</div>
          <div class="entry-copy">
            <h2 class="entry-title">Dinleyici</h2>
            <p class="entry-desc">Kodla giriş yap ve kendi dilinde dinle.</p>
          </div>
        </button>
      </section>

      <section id="speakerSetupPanel" class="card hide panel-entry">
        <h2 style="font-family: 'Space Grotesk'; font-size: 26px; margin-top:0;">Oda Ayarları</h2>
        
        <div class="field">
          <label class="label">Konuşma Diliniz</label>
          <select class="select" id="speakerLang">
            <option value="tr" selected>Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Yapay Zeka Sesi</label>
          <select class="select" id="speakerVoice">
            <option value="default_female" selected>Kadın Sesi (Modern)</option>
            <option value="default_male">Erkek Sesi (Modern)</option>
            <option value="my_voice">Orijinal Sesim</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Yayın Modu</label>
          <div class="toggle-grid">
            <button class="toggle active" id="modeVoiceBtn">Sesli Yayın</button>
            <button class="toggle" id="modeTextBtn">Sadece Altyazı</button>
          </div>
        </div>

        <div class="field">
          <label class="label">Gelişmiş</label>
          <div class="toggle-grid">
            <button class="toggle active" id="micAlwaysBtn">Sürekli Mik.</button>
            <button class="toggle" id="noiseReduceBtn">Gürültü Engelle</button>
          </div>
        </div>

        <button class="btn btn-primary" id="btnCreateRoom">Odayı Oluştur</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
          <button class="btn btn-secondary" id="btnBackSpeakerSetup">Geri</button>
          <button class="btn btn-secondary" id="btnResetSpeakerSetup">Sıfırla</button>
        </div>
      </section>

      <section id="speakerRoomPanel" class="card hide panel-entry">
        <div class="room-code-box">
          <span class="label" style="color:#fff;">Giriş Kodu</span>
          <h2 class="room-code" id="roomCode">------</h2>
        </div>

        <div id="speakerStatus" class="status ok">Oda hazır, katılımcıları bekliyor.</div>

        <button class="btn btn-primary" id="btnStartRoom" style="margin-bottom:10px;">YAYINI BAŞLAT</button>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          <button class="btn btn-secondary" id="btnCopy">Kodu Kopyala</button>
          <button class="btn btn-secondary" id="btnShareLink">Link Paylaş</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <button class="btn btn-secondary" id="btnBackSpeakerRoom">Ayarlar</button>
          <button class="btn btn-danger" id="btnRecreateRoom">Yeni Kod Al</button>
        </div>
      </section>

      <section id="listenerPanel" class="card hide panel-entry">
        <h2 style="font-family: 'Space Grotesk'; font-size: 26px; margin-top:0;">Yayına Katıl</h2>
        
        <div class="field">
          <label class="label">6 Haneli Oda Kodu</label>
          <input class="input code-input" id="roomInput" placeholder="000000" maxlength="6"/>
        </div>

        <div class="field">
          <label class="label">Dinlemek İstediğiniz Dil</label>
          <select class="select" id="listenerLang">
            <option value="en" selected>English</option>
            <option value="tr">Türkçe</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Tercih</label>
          <div class="toggle-grid">
            <button class="toggle active" id="listenAudioBtn">Sesli Dinle</button>
            <button class="toggle" id="listenTextBtn">Sadece Oku</button>
          </div>
        </div>

        <div id="listenerStatus" class="status warn">Katılmak için kodu giriniz.</div>

        <button class="btn btn-primary" id="btnJoin" style="margin-bottom:10px;">BAĞLAN</button>
        <button class="btn btn-secondary" id="btnBackListener">İptal</button>
      </section>

      <p class="helper">italkyAI OneToAll Engine v2.0</p>
    </div>
  </main>

  <script type="module">
    // --- JS MANTIĞI (TAMAMEN KORUNDU) ---
    import { mountShell } from "/js/ui_shell.js";
    try { mountShell({ scroll: "auto" }); } catch(e) {}

    const homeCards = document.getElementById("homeCards");
    const speakerSetupPanel = document.getElementById("speakerSetupPanel");
    const speakerRoomPanel = document.getElementById("speakerRoomPanel");
    const listenerPanel = document.getElementById("listenerPanel");

    // UI Panel Gösterim Fonksiyonu
    function show(panel) {
      [homeCards, speakerSetupPanel, speakerRoomPanel, listenerPanel].forEach(p => p.classList.add("hide"));
      panel.classList.remove("hide");
      // Animasyonu tetikle (id'sine bakmaksızın sınıfla)
      panel.classList.remove("panel-entry");
      void panel.offsetWidth; // DOM Reflow
      panel.classList.add("panel-entry");
    }

    // --- ID'lerin Seçimi (KORUNDU) ---
    const goSpeaker = document.getElementById("goSpeaker");
    const goListener = document.getElementById("goListener");
    const speakerLang = document.getElementById("speakerLang");
    const speakerVoice = document.getElementById("speakerVoice");
    const modeVoiceBtn = document.getElementById("modeVoiceBtn");
    const modeTextBtn = document.getElementById("modeTextBtn");
    const micAlwaysBtn = document.getElementById("micAlwaysBtn");
    const noiseReduceBtn = document.getElementById("noiseReduceBtn");
    const btnCreateRoom = document.getElementById("btnCreateRoom");
    const btnBackSpeakerSetup = document.getElementById("btnBackSpeakerSetup");
    const btnResetSpeakerSetup = document.getElementById("btnResetSpeakerSetup");
    const roomCode = document.getElementById("roomCode");
    const speakerStatus = document.getElementById("speakerStatus");
    const btnStartRoom = document.getElementById("btnStartRoom");
    const btnCopy = document.getElementById("btnCopy");
    const btnShareLink = document.getElementById("btnShareLink");
    const btnBackSpeakerRoom = document.getElementById("btnBackSpeakerRoom");
    const btnRecreateRoom = document.getElementById("btnRecreateRoom");
    const roomInput = document.getElementById("roomInput");
    const listenerLang = document.getElementById("listenerLang");
    const listenAudioBtn = document.getElementById("listenAudioBtn");
    const listenTextBtn = document.getElementById("listenTextBtn");
    const listenerStatus = document.getElementById("listenerStatus");
    const btnJoin = document.getElementById("btnJoin");
    const btnBackListener = document.getElementById("btnBackListener");

    function showHome() { show(homeCards); }

    function makeShortCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for(let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function setExclusive(a, b) {
      a.classList.add("active");
      b.classList.remove("active");
    }

    function setStatus(el, text, type) {
      el.textContent = text;
      el.className = "status " + (type || "");
    }

    function saveSpeakerRoom(code) {
      localStorage.setItem("italky_onetoall_room", code);
      localStorage.setItem("italky_onetoall_speaker_lang", speakerLang.value);
    }

    // Event Listeners (KORUNDU)
    goSpeaker.addEventListener("click", () => show(speakerSetupPanel));
    goListener.addEventListener("click", () => {
      show(listenerPanel);
      roomInput.focus();
    });

    modeVoiceBtn.addEventListener("click", () => setExclusive(modeVoiceBtn, modeTextBtn));
    modeTextBtn.addEventListener("click", () => setExclusive(modeTextBtn, modeVoiceBtn));

    micAlwaysBtn.addEventListener("click", () => micAlwaysBtn.classList.toggle("active"));
    noiseReduceBtn.addEventListener("click", () => noiseReduceBtn.classList.toggle("active"));

    btnCreateRoom.addEventListener("click", () => {
      const code = makeShortCode();
      roomCode.textContent = code;
      saveSpeakerRoom(code);
      setStatus(speakerStatus, "Oda başarıyla oluşturuldu.", "ok");
      show(speakerRoomPanel);
    });

    btnBackSpeakerSetup.addEventListener("click", showHome);
    btnBackSpeakerRoom.addEventListener("click", () => show(speakerSetupPanel));
    btnBackListener.addEventListener("click", showHome);

    btnCopy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(roomCode.textContent);
      setStatus(speakerStatus, "Kod kopyalandı!", "ok");
    });

    btnStartRoom.addEventListener("click", () => {
      const code = roomCode.textContent.trim();
      // Örnek link yapısı
      location.href = `/pages/onetoall_live.html?role=speaker&room=${code}&lang=${speakerLang.value}`;
    });

    roomInput.addEventListener("input", () => {
      roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
      if(roomInput.value.length === 6) setStatus(listenerStatus, "Kod hazır, bağlanabilirsin.", "ok");
    });

    btnJoin.addEventListener("click", () => {
      const code = roomInput.value;
      if(code.length !== 6) return setStatus(listenerStatus, "Geçersiz kod.", "danger");
      location.href = `/pages/onetoall_live.html?role=listener&room=${code}&lang=${listenerLang.value}`;
    });

    // URL Check (KORUNDU)
    (function boot() {
      const params = new URLSearchParams(location.search);
      if(params.get("role") === "listener") {
        show(listenerPanel);
        if(params.get("room")) roomInput.value = params.get("room").toUpperCase();
      }
    })();
  </script>
</body>
</html>
