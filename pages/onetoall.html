<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • OneToAll</title>
  <meta name="theme-color" content="#0b0f1a"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060910;
      --bg-alt: #0b1220;
      --panel: rgba(255, 255, 255, 0.05);
      --panel-hover: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.12);
      --txt: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --cyan: #6ee7ff;
      --blue: #5b8cff;
      --pink: #ff4fd8;
      --green: #22c55e;
      --grad: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 50%, var(--pink) 100%);
      --hero-grad: linear-gradient(160deg, #0b1220 0%, #121d33 100%);
      --radius-lg: 32px;
      --radius-md: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(91, 140, 255, 0.15) 0%, transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(255, 79, 216, 0.12) 0%, transparent 35%);
      color: var(--txt);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
    }

    #pageContent {
      padding: 20px 16px 40px;
      max-width: 500px;
      margin: 0 auto;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- HERO SECTION --- */
    .hero {
      position: relative;
      background: var(--hero-grad);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -50%; right: -50%;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(110, 231, 255, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .eyebrow-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 2s infinite;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 38px;
      margin: 16px 0 8px;
      line-height: 0.9;
    }

    .hero-title span {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .hero-sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* --- CARDS & PANELS --- */
    .card {
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .entry-btn {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .entry-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .entry-btn:active { transform: scale(0.98); }

    .entry-icon {
      font-size: 28px;
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.05);
      display: grid; place-items: center;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .entry-copy { text-align: left; }
    .entry-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #fff; }
    .entry-desc { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.4; }

    /* --- FORM ELEMENTS --- */
    .field { margin-bottom: 20px; }
    .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; letter-spacing: 0.5px; }

    .input, .select {
      width: 100%;
      height: 60px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: #fff;
      padding: 0 18px;
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      transition: border-color 0.3s;
    }

    .input:focus, .select:focus { border-color: var(--blue); background: rgba(255,255,255,0.08); }

    .code-input {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      letter-spacing: 10px;
      text-align: center;
      font-weight: 700;
      color: var(--cyan);
    }

    /* --- BUTTONS --- */
    .btn {
      width: 100%;
      height: 60px;
      border-radius: 18px;
      border: none;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--grad);
      color: #000;
      box-shadow: 0 10px 25px rgba(91, 140, 255, 0.3);
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid var(--line);
    }

    .btn-danger {
      background: rgba(251, 113, 133, 0.1);
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.2);
    }

    /* --- TOGGLE GRID --- */
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toggle {
      height: 54px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle.active {
      background: rgba(110, 231, 255, 0.15);
      border-color: var(--cyan);
      color: #fff;
    }

    /* --- ROOM CODE DISPLAY --- */
    .room-code-box {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }
    .room-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      letter-spacing: 8px;
      margin: 10px 0;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      padding: 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: center;
    }
    .status.ok { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
    .status.warn { background: rgba(251, 146, 60, 0.1); color: #fbbf24; border: 1px solid rgba(251,146,60,0.2); }
    .status.danger { background: rgba(251, 113, 133, 0.1); color: #f87171; border: 1px solid rgba(251,113,133,0.2); }

    .hide { display: none !important; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .helper { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <main id="pageContent">
    <div class="wrap">
      
      <section class="hero">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          Live Broadcast Translation
        </div>
        <h1 class="hero-title">One<span>To</span>All</h1>
        <p class="hero-sub">
          Bir konuşmacı, sınırsız dinleyici. Herkes kendi dilinde anlık olarak takip eder.
        </p>
        <div style="display: flex; gap: 8px;">
          <div class="eyebrow" style="text-transform: none; font-size: 10px;">AI Powered</div>
          <div class="eyebrow" style="text-transform: none; font-size: 10px;">Real-time</div>
        </div>
      </section>

      <section id="homeCards">
        <button class="entry-btn" id="goSpeaker">
          <div class="entry-icon">🎙️</div>
          <div class="entry-copy">
            <h2 class="entry-title">Konuşmacı</h2>
            <p class="entry-desc">Yayın odası oluştur ve anlatmaya başla.</p>
          </div>
        </button>

        <button class="entry-btn" id="goListener">
          <div class="entry-icon">🎧</div>
          <div class="entry-copy">
            <h2 class="entry-title">Dinleyici</h2>
            <p class="entry-desc">Kodla giriş yap ve kendi dilinde dinle.</p>
          </div>
        </button>
      </section>

      <section id="speakerSetupPanel" class="card hide">
        <h2 style="font-family: 'Space Grotesk'; font-size: 24px; margin-top:0;">Oda Ayarları</h2>
        
        <div class="field">
          <label class="label">Konuşma Diliniz</label>
          <select class="select" id="speakerLang">
            <option value="tr" selected>Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Yapay Zeka Sesi</label>
          <select class="select" id="speakerVoice">
            <option value="default_female" selected>Kadın Sesi (Modern)</option>
            <option value="default_male">Erkek Sesi (Modern)</option>
            <option value="my_voice">Orijinal Sesim</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Yayın Modu</label>
          <div class="toggle-grid">
            <button class="toggle active" id="modeVoiceBtn">Sesli Yayın</button>
            <button class="toggle" id="modeTextBtn">Sadece Altyazı</button>
          </div>
        </div>

        <div class="field">
          <label class="label">Gelişmiş</label>
          <div class="toggle-grid">
            <button class="toggle active" id="micAlwaysBtn">Sürekli Mik.</button>
            <button class="toggle" id="noiseReduceBtn">Gürültü Engelle</button>
          </div>
        </div>

        <button class="btn btn-primary" id="btnCreateRoom">Odayı Oluştur</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
          <button class="btn btn-secondary" id="btnBackSpeakerSetup">Geri</button>
          <button class="btn btn-secondary" id="btnResetSpeakerSetup">Sıfırla</button>
        </div>
      </section>

      <section id="speakerRoomPanel" class="card hide">
        <div class="room-code-box">
          <span class="label">Giriş Kodu</span>
          <h2 class="room-code" id="roomCode">------</h2>
        </div>

        <div id="speakerStatus" class="status ok">Oda hazır, katılımcıları bekliyor.</div>

        <button class="btn btn-primary" id="btnStartRoom" style="margin-bottom:10px;">YAYINI BAŞLAT</button>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          <button class="btn btn-secondary" id="btnCopy">Kodu Kopyala</button>
          <button class="btn btn-secondary" id="btnShareLink">Link Paylaş</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <button class="btn btn-secondary" id="btnBackSpeakerRoom">Ayarlar</button>
          <button class="btn btn-danger" id="btnRecreateRoom">Yeni Kod Al</button>
        </div>
      </section>

      <section id="listenerPanel" class="card hide">
        <h2 style="font-family: 'Space Grotesk'; font-size: 24px; margin-top:0;">Yayına Katıl</h2>
        
        <div class="field">
          <label class="label">6 Haneli Oda Kodu</label>
          <input class="input code-input" id="roomInput" placeholder="000000" maxlength="6"/>
        </div>

        <div class="field">
          <label class="label">Dinlemek İstediğiniz Dil</label>
          <select class="select" id="listenerLang">
            <option value="en" selected>English</option>
            <option value="tr">Türkçe</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Tercih</label>
          <div class="toggle-grid">
            <button class="toggle active" id="listenAudioBtn">Sesli Dinle</button>
            <button class="toggle" id="listenTextBtn">Sadece Oku</button>
          </div>
        </div>

        <div id="listenerStatus" class="status warn">Katılmak için kodu giriniz.</div>

        <button class="btn btn-primary" id="btnJoin" style="margin-bottom:10px;">BAĞLAN</button>
        <button class="btn btn-secondary" id="btnBackListener">İptal</button>
      </section>

      <p class="helper">italkyAI OneToAll Engine v2.0</p>
    </div>
  </main>

  <script type="module">
    // --- JS MANTIĞI (HİÇBİR İSİMLENDİRME DEĞİŞMEDİ) ---
    import { mountShell } from "/js/ui_shell.js";
    try { mountShell({ scroll: "auto" }); } catch(e) {}

    const homeCards = document.getElementById("homeCards");
    const speakerSetupPanel = document.getElementById("speakerSetupPanel");
    const speakerRoomPanel = document.getElementById("speakerRoomPanel");
    const listenerPanel = document.getElementById("listenerPanel");

    const goSpeaker = document.getElementById("goSpeaker");
    const goListener = document.getElementById("goListener");

    const speakerLang = document.getElementById("speakerLang");
    const speakerVoice = document.getElementById("speakerVoice");
    const modeVoiceBtn = document.getElementById("modeVoiceBtn");
    const modeTextBtn = document.getElementById("modeTextBtn");
    const micAlwaysBtn = document.getElementById("micAlwaysBtn");
    const noiseReduceBtn = document.getElementById("noiseReduceBtn");

    const btnCreateRoom = document.getElementById("btnCreateRoom");
    const btnBackSpeakerSetup = document.getElementById("btnBackSpeakerSetup");
    const btnResetSpeakerSetup = document.getElementById("btnResetSpeakerSetup");

    const roomCode = document.getElementById("roomCode");
    const speakerStatus = document.getElementById("speakerStatus");
    const btnStartRoom = document.getElementById("btnStartRoom");
    const btnCopy = document.getElementById("btnCopy");
    const btnShareLink = document.getElementById("btnShareLink");
    const btnBackSpeakerRoom = document.getElementById("btnBackSpeakerRoom");
    const btnRecreateRoom = document.getElementById("btnRecreateRoom");

    const roomInput = document.getElementById("roomInput");
    const listenerLang = document.getElementById("listenerLang");
    const listenAudioBtn = document.getElementById("listenAudioBtn");
    const listenTextBtn = document.getElementById("listenTextBtn");
    const listenerStatus = document.getElementById("listenerStatus");
    const btnJoin = document.getElementById("btnJoin");
    const btnBackListener = document.getElementById("btnBackListener");

    function show(panel) {
      [homeCards, speakerSetupPanel, speakerRoomPanel, listenerPanel].forEach(p => p.classList.add("hide"));
      panel.classList.remove("hide");
    }

    function showHome() { show(homeCards); }

    function makeShortCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for(let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function setExclusive(a, b) {
      a.classList.add("active");
      b.classList.remove("active");
    }

    function setStatus(el, text, type) {
      el.textContent = text;
      el.className = "status " + (type || "");
    }

    function saveSpeakerRoom(code) {
      localStorage.setItem("italky_onetoall_room", code);
      localStorage.setItem("italky_onetoall_speaker_lang", speakerLang.value);
    }

    // Event Listeners
    goSpeaker.addEventListener("click", () => show(speakerSetupPanel));
    goListener.addEventListener("click", () => {
      show(listenerPanel);
      roomInput.focus();
    });

    modeVoiceBtn.addEventListener("click", () => setExclusive(modeVoiceBtn, modeTextBtn));
    modeTextBtn.addEventListener("click", () => setExclusive(modeTextBtn, modeVoiceBtn));

    micAlwaysBtn.addEventListener("click", () => micAlwaysBtn.classList.toggle("active"));
    noiseReduceBtn.addEventListener("click", () => noiseReduceBtn.classList.toggle("active"));

    btnCreateRoom.addEventListener("click", () => {
      const code = makeShortCode();
      roomCode.textContent = code;
      saveSpeakerRoom(code);
      setStatus(speakerStatus, "Oda başarıyla oluşturuldu.", "ok");
      show(speakerRoomPanel);
    });

    btnBackSpeakerSetup.addEventListener("click", showHome);
    btnBackSpeakerRoom.addEventListener("click", () => show(speakerSetupPanel));
    btnBackListener.addEventListener("click", showHome);

    btnCopy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(roomCode.textContent);
      setStatus(speakerStatus, "Kod kopyalandı!", "ok");
    });

    btnStartRoom.addEventListener("click", () => {
      const code = roomCode.textContent.trim();
      location.href = `/pages/onetoall_live.html?role=speaker&room=${code}&lang=${speakerLang.value}`;
    });

    roomInput.addEventListener("input", () => {
      roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
      if(roomInput.value.length === 6) setStatus(listenerStatus, "Kod hazır, bağlanabilirsin.", "ok");
    });

    btnJoin.addEventListener("click", () => {
      const code = roomInput.value;
      if(code.length !== 6) return setStatus(listenerStatus, "Geçersiz kod.", "danger");
      location.href = `/pages/onetoall_live.html?role=listener&room=${code}&lang=${listenerLang.value}`;
    });

    // URL Check
    (function boot() {
      const params = new URLSearchParams(location.search);
      if(params.get("role") === "listener") {
        show(listenerPanel);
        if(params.get("room")) roomInput.value = params.get("room").toUpperCase();
      }
    })();
  </script>
</body>
</html>
