<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>italkyAI • Memory Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0613;--panel:#140a22;--pink:#ff4fd8;--cyan:#3be7ff;--green:#00e676;--red:#ff1744;--gold:#ffd700;--border:rgba(255,255,255,.10);--safeB:env(safe-area-inset-bottom,0px);--shellLift:0px;--grad:linear-gradient(135deg,#8ab4ff 0%,#58d9ff 55%,#62f0b1 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;outline:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Outfit,sans-serif;color:#fff;background:var(--bg)}body{background:radial-gradient(circle at center,#1f1034 0%,#06030b 100%)}.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px;opacity:.20;pointer-events:none}
#pageContent{height:100%;padding:8px 10px calc(12px + var(--safeB) + var(--shellLift));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#pageContent::-webkit-scrollbar{display:none}.app{width:100%;max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;position:relative;z-index:5}.header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;border:1px solid var(--border);background:rgba(20,10,34,.88);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.35)}.backBtn{min-width:92px;height:34px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:900;cursor:pointer}.title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:900;color:var(--pink);letter-spacing:.5px;text-shadow:0 0 10px rgba(255,79,216,.18);text-align:center}.momentum-chip{min-width:74px;height:34px;padding:0 10px;border-radius:12px;background:var(--grad);color:#052638;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(59,231,255,.14);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{min-height:50px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:4px}.statVal{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:900;color:#fff;line-height:1}.statLab{font-size:8px;opacity:.62;letter-spacing:.7px;font-weight:900}.recordRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.recordPill{min-height:34px;border-radius:13px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;color:#fff;font-size:10px;font-weight:1000;overflow:hidden}.recordPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resInfo{text-align:center;min-height:18px;color:var(--cyan);font-size:12px;font-weight:900;transition:.25s}.board{flex:1;border-radius:22px;border:1px solid var(--border);background:rgba(20,10,34,.82);backdrop-filter:blur(14px);box-shadow:0 22px 50px rgba(0,0,0,.45);padding:10px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}.boardTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.langBadge{font-size:11px;font-weight:900;color:var(--cyan);letter-spacing:.6px}.listenBtn{min-height:32px;padding:0 12px;border-radius:12px;border:1px solid rgba(59,231,255,.28);background:rgba(59,231,255,.09);color:#fff;font-size:11px;font-weight:900;cursor:pointer}.listenBtn:disabled{opacity:.45;cursor:default}.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1}.card{perspective:1000px;cursor:pointer;min-height:82px;position:relative}.inner{width:100%;height:100%;transition:transform .36s;transform-style:preserve-3d;border-radius:18px;position:relative}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.card.matched .inner{box-shadow:0 0 18px rgba(0,230,118,.20);animation:pulseMatch .35s ease-out}@keyframes pulseMatch{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.05)}100%{transform:rotateY(180deg) scale(1)}}.face{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);backface-visibility:hidden;overflow:hidden}.front{position:relative;font-size:34px;font-weight:900}.trFront{background:linear-gradient(180deg,#fff,#f3f4f6);border:1px solid rgba(0,0,0,.08)}.trFront::before{content:"";position:absolute;inset:6px;border:2px solid #ef4444;border-radius:12px}.fxFront{background:linear-gradient(180deg,#edf6ff,#dbeafe);border:1px solid rgba(0,0,0,.06)}.frontFlagMark{position:relative;z-index:2;font-size:30px;line-height:1;filter:drop-shadow(0 0 6px rgba(0,0,0,.08))}.back{transform:rotateY(180deg);font-weight:900;font-size:15px;text-align:center;padding:8px;word-break:break-word;line-height:1.16;display:flex;align-items:center;justify-content:center}.back.tr{background:#fff;color:#111;border:1px solid rgba(0,0,0,.08)}.back.fx{background:linear-gradient(180deg,#edf6ff,#dbeafe);color:#1e3a8a}.fxBurst{position:absolute;inset:0;pointer-events:none;opacity:0}.card.matched .fxBurst{opacity:1}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--green) 45%,transparent 72%);box-shadow:0 0 12px rgba(0,230,118,.45);animation:sparkle .9s ease-out forwards}.s1{left:16%;top:22%}.s2{right:14%;top:18%;animation-delay:.05s}.s3{left:22%;bottom:18%;animation-delay:.09s}.s4{right:20%;bottom:20%;animation-delay:.13s}.s5{left:48%;top:10%;animation-delay:.02s}.s6{left:50%;bottom:10%;animation-delay:.11s}@keyframes sparkle{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1.6);opacity:0}}.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-card{width:100%;max-width:380px;background:#10051a;border:1px solid rgba(255,255,255,.10);border-radius:28px;padding:24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.7);max-height:88vh;overflow:auto;scrollbar-width:none}.modalTitle{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:26px;margin:0 0 12px}.resultStat{margin:14px 0;line-height:1.9;text-align:left;white-space:pre-line;font-size:15px}.resultBtns{display:flex;flex-direction:column;gap:10px;margin-top:10px}.btn{width:100%;min-height:52px;border-radius:16px;border:none;font-weight:900;cursor:pointer}.btn.primary{background:var(--grad);color:#052638}.btn.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.14)}
@media(max-width:390px){.header{grid-template-columns:auto 1fr auto;padding:9px 10px}.backBtn{min-width:82px;font-size:10px}.title{font-size:15px}.momentum-chip{min-width:58px;padding:0 7px}.stats{gap:5px}.statVal{font-size:13px}.statLab{font-size:7.4px}.grid-cards{gap:7px}.card{min-height:68px}.back{font-size:12px;padding:6px}.frontFlagMark{font-size:25px}.recordPill{font-size:9px}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app" id="pageContent">
  <div class="header">
    <button class="backBtn" id="backBtn" type="button">← Oyun Menüsü</button>
    <div class="title">MEMORY PULSE</div>
    <div id="momChip" class="momentum-chip">x1.00</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="statVal" id="moveVal">0</div><div class="statLab">HAMLE</div></div>
    <div class="stat"><div class="statVal" id="scoreVal">0</div><div class="statLab">SKOR</div></div>
    <div class="stat"><div class="statVal" id="matchVal">0/10</div><div class="statLab">EŞLEŞME</div></div>
    <div class="stat"><div class="statVal" id="langVal">EN</div><div class="statLab">DİL</div></div>
  </div>
  <div class="recordRow">
    <div class="recordPill"><span id="personalBestLabel">SENİN REKORUN: —</span></div>
    <div class="recordPill"><span id="globalBestLabel">GENEL REKOR: —</span></div>
  </div>
  <div id="resInfo" class="resInfo">Hazırlanıyor</div>
  <div class="board">
    <div class="boardTop">
      <div class="langBadge" id="langLabel">🇬🇧 İngilizce</div>
      <button class="listenBtn" id="listenBtn" type="button" disabled>Dinle</button>
    </div>
    <div class="grid-cards" id="grid"></div>
  </div>
</div>
<div class="modal" id="endModal">
  <div class="modal-card">
    <div class="modalTitle" id="endTitle">SET TAMAMLANDI</div>
    <div class="resultStat" id="endStats"></div>
    <div class="resultBtns">
      <button class="btn primary" id="btnReplay">YENİ OYUN</button>
      <button class="btn secondary" id="btnFinish">OYUN MENÜSÜ</button>
    </div>
  </div>
</div>
<script type="module">
import { mountShell } from "/js/ui_shell.js";
import { ensureAuthAndCacheUser } from "/js/auth.js";
import { GAME_LANG_META, formatGlobalBest, getGameLangFromUrl, getLocalHighScore, getGlobalBest, refreshGameScoreLabels, saveGameScore, setLocalHighScore, speakGameText } from "/js/game_score_helper.js";

mountShell({ scroll:"none" });

const $ = id => document.getElementById(id);
const GAME_SLUG = "memory_pulse";
const PAIR_COUNT = 10;
const CONTENT_ERROR_TEXT = "İçerik şu anda yüklenemedi. Lütfen tekrar deneyin.";
const DATA_SOURCE_KIND = "storage:lang";
let cards = [], flipped = [], matched = 0, moves = 0, wrongMoves = 0, locked = false, totalScore = 0, momentum = 1.0, selectedCardText = "", scoreSaved = false, startedAt = Date.now();
let lang = getGameLangFromUrl("en");
let poolItems = [];
let used = new Set();
let lastKeys = [];

let audioCtx = null;
function getAudioCtx(){try{if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}return audioCtx;}catch{return null;}}
async function unlockAudio(){try{const ctx=getAudioCtx();if(ctx&&ctx.state==="suspended")await ctx.resume();}catch{}}
function beep({freq=440,duration=.08,type="sine",gain=.03,when=0}){const ctx=getAudioCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume().catch(()=>{});const now=ctx.currentTime+when;const osc=ctx.createOscillator();const g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
function playMatchFx(){beep({freq:640,duration:.08,type:"triangle",gain:.05});beep({freq:860,duration:.10,type:"triangle",gain:.05,when:.08});}
function playErrorFx(){beep({freq:180,duration:.10,type:"sawtooth",gain:.05});beep({freq:140,duration:.12,type:"sawtooth",gain:.04,when:.06});}
function playWinFx(){beep({freq:700,duration:.12,type:"triangle",gain:.05});beep({freq:900,duration:.12,type:"triangle",gain:.05,when:.12});beep({freq:1100,duration:.15,type:"triangle",gain:.05,when:.24});}
["click","touchstart","pointerdown"].forEach(evt => window.addEventListener(evt, () => unlockAudio(), { passive:true, once:true }));

function normalize(s){return String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"").trim();}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getPublicLangUrl(langCode){return `https://auth.italky.ai/storage/v1/object/public/lang/${langCode}.json`;}
function extractItems(payload){if(Array.isArray(payload))return payload;if(payload&&typeof payload==="object"){for(const key of ["items","words","data","list","entries","pool"]){if(Array.isArray(payload[key]))return payload[key];}}return [];}
function normalizePoolItems(items){return items.map(item=>{const rawWord=item?.word??item?.w??item?.text??item?.term??item?.answer??item?.source??"";const rawMeaning=item?.meaning??item?.tr??item?.translation??item?.mean??item?.hint??item?.target??"";return{w:String(rawWord||"").trim(),tr:String(rawMeaning||"").trim()};}).filter(x=>x.w&&x.tr&&normalize(x.w).length>=2&&normalize(x.tr).length>=1);}
function fetchWithTimeout(url, options={}, timeoutMs=12000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);return fetch(url,{...options,signal:controller.signal}).finally(()=>clearTimeout(timer));}
async function loadLangPool(langCode){const url=getPublicLangUrl(langCode);console.warn("[MEMORY_PULSE] content load start",{selectedLang:langCode,source:DATA_SOURCE_KIND,path:url});try{const res=await fetchWithTimeout(url,{cache:"no-store"});console.warn("[MEMORY_PULSE] content fetch status",{selectedLang:langCode,path:url,status:res.status,ok:res.ok});if(!res.ok)return[];const json=await res.json();const rawItems=extractItems(json);const items=normalizePoolItems(rawItems);console.warn("[MEMORY_PULSE] content mapped",{selectedLang:langCode,path:url,rawCount:rawItems.length,filteredCount:items.length,sample:items[0]||null});return items;}catch(error){console.warn("[MEMORY_PULSE] content load failed",{selectedLang:langCode,path:url,error:error?.message||String(error)});return[];}}
async function ensureAuthSoft(){try{const timeout=new Promise(resolve=>setTimeout(()=>resolve("timeout"),8000));const result=await Promise.race([ensureAuthAndCacheUser(),timeout]);if(result==="timeout"){console.warn("[MEMORY_PULSE] auth check timeout; continuing with game shell");return true;}return result!==false;}catch(error){console.warn("[MEMORY_PULSE] auth check failed; continuing",error);return true;}}
function setInfo(msg,color="var(--cyan)"){$("resInfo").textContent=msg;$("resInfo").style.color=color;}
function setListenReady(ready){$("listenBtn").disabled=!ready;}
function pickUniquePairs(items,count=PAIR_COUNT){if(!items.length)return [];if(used.size>=items.length)used.clear();const chosen=[];let guard=0;while(chosen.length<count&&guard<items.length*24){const pick=items[Math.floor(Math.random()*items.length)];const key=normalize(pick.w);if(!used.has(key)&&!lastKeys.includes(key)&&!chosen.some(x=>normalize(x.w)===key)){used.add(key);chosen.push(pick);}guard++;}if(chosen.length<count){for(const item of items){if(chosen.length>=count)break;const key=normalize(item.w);if(!chosen.some(x=>normalize(x.w)===key))chosen.push(item);}}lastKeys=chosen.map(x=>normalize(x.w)).slice(-5);console.warn("[MEMORY_PULSE] pairs selected",{selectedLang:lang,requested:count,pairCount:chosen.length});return chosen;}
async function refreshScores(){const localBest=getLocalHighScore(GAME_SLUG,lang);$("personalBestLabel").textContent=`SENİN REKORUN: ${localBest||"—"}`;$("globalBestLabel").textContent="GENEL REKOR: —";try{return await refreshGameScoreLabels({gameSlug:GAME_SLUG,lang,personalEl:$("personalBestLabel"),globalEl:$("globalBestLabel")});}catch(error){console.warn("[MEMORY_PULSE] score refresh failed",error);return null;}}
function updateLocalScore(){const best=getLocalHighScore(GAME_SLUG,lang);if(totalScore>best){setLocalHighScore(GAME_SLUG,lang,totalScore);$("personalBestLabel").textContent=`SENİN REKORUN: ${totalScore}`;return true;}return false;}
async function saveScoreOnce(){if(scoreSaved)return;scoreSaved=true;updateLocalScore();const durationSeconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));try{await saveGameScore({gameSlug:GAME_SLUG,lang,score:totalScore,correctCount:matched,wrongCount:wrongMoves,durationSeconds});}catch(error){console.warn("[MEMORY_PULSE] score save failed",error);}try{const best=await getGlobalBest(GAME_SLUG,lang);$("globalBestLabel").textContent=formatGlobalBest(best);}catch{}}
function updateStats(){const meta=GAME_LANG_META[lang]||GAME_LANG_META.en;$("moveVal").textContent=moves;$("matchVal").textContent=`${matched}/${PAIR_COUNT}`;$("scoreVal").textContent=totalScore;$("momChip").textContent=`x${momentum.toFixed(2)}`;$("langVal").textContent=lang.toUpperCase();$("langLabel").textContent=`${meta.flag} ${meta.name}`;}
function render(){const g=$("grid");g.innerHTML="";cards.forEach((c,i)=>{const isTr=c.lang==="tr";const frontFlag=isTr?"🇹🇷":(GAME_LANG_META[lang]?.flag||"🌐");const frontClass=isTr?"front trFront":"front fxFront";const el=document.createElement("div");el.className="card";el.innerHTML=`<div class="inner"><div class="face ${frontClass}"><div class="frontFlagMark">${frontFlag}</div></div><div class="face back ${isTr?"tr":"fx"}"><div>${c.text}</div></div></div><div class="fxBurst"><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div></div>`;el.onclick=()=>clickCard(i,el);g.appendChild(el);});}
function clickCard(i,el){if(locked||el.classList.contains("flipped")||el.classList.contains("matched"))return;el.classList.add("flipped");flipped.push({i,data:cards[i],el});if(cards[i].lang!=="tr"){selectedCardText=cards[i].text;setListenReady(true);}if(flipped.length===2){moves++;updateStats();checkMatch();}}
function checkMatch(){locked=true;const [a,b]=flipped;if(a.data.pair===b.data.pair){playMatchFx();setInfo("EŞLEŞME!", "var(--green)");setTimeout(()=>{a.el.classList.add("matched");b.el.classList.add("matched");matched++;const roundPoints=Math.round(Math.max(10,70-(wrongMoves*5))*momentum);totalScore+=roundPoints;momentum=Math.min(2.5,momentum+.08);flipped=[];locked=false;updateStats();if(matched===PAIR_COUNT)finish();},420);return;}playErrorFx();wrongMoves++;momentum=Math.max(1,momentum-.10);setInfo("UYUŞMADI", "var(--red)");updateStats();setTimeout(()=>{a.el.classList.remove("flipped");b.el.classList.remove("flipped");flipped=[];locked=false;},760);}
async function finish(){playWinFx();const isPB=updateLocalScore();await saveScoreOnce();$("endTitle").textContent=isPB?"YENİ REKOR! 👑":"SET TAMAMLANDI";$("endStats").textContent=`Toplam Skor: ${totalScore}\nHatalı Hamle: ${wrongMoves}\nMomentum: x${momentum.toFixed(2)}\nDil: ${(GAME_LANG_META[lang]||GAME_LANG_META.en).name}`;$("endModal").classList.add("show");await refreshScores();}
async function initGame(isNewRun=true){setInfo("Hazırlanıyor");$("grid").innerHTML="";setListenReady(false);const ok=await ensureAuthSoft();if(!ok){location.href="/pages/login.html";return;}if(isNewRun){totalScore=0;momentum=1;used.clear();lastKeys=[];}matched=0;moves=0;wrongMoves=0;flipped=[];locked=false;scoreSaved=false;startedAt=Date.now();selectedCardText="";updateStats();refreshScores();poolItems=await loadLangPool(lang);if(!poolItems.length){console.warn("[MEMORY_PULSE] no usable content",{selectedLang:lang,source:DATA_SOURCE_KIND});setInfo(CONTENT_ERROR_TEXT,"var(--gold)");return;}const picked=pickUniquePairs(shuffle(poolItems),PAIR_COUNT);if(picked.length<PAIR_COUNT){console.warn("[MEMORY_PULSE] insufficient pairs",{selectedLang:lang,available:poolItems.length,pairCount:picked.length});setInfo(CONTENT_ERROR_TEXT,"var(--gold)");return;}cards=[];picked.forEach((it,i)=>{cards.push({pair:i,text:it.w,lang});cards.push({pair:i,text:it.tr,lang:"tr"});});cards=shuffle(cards);console.warn("[MEMORY_PULSE] cards rendered",{selectedLang:lang,pairCount:picked.length,cardCount:cards.length});$("endModal").classList.remove("show");render();updateStats();setInfo("Kartları eşleştir");}

$("backBtn").onclick=()=>{location.href="/pages/game_menu.html";};
$("listenBtn").onclick=()=>{if(selectedCardText)speakGameText(selectedCardText,lang);};
$("btnReplay").onclick=()=>initGame(true);
$("btnFinish").onclick=()=>{location.href="/pages/game_menu.html";};
window.addEventListener("load",()=>{initGame(true).catch(error=>{console.warn("[MEMORY_PULSE] init failed",{selectedLang:lang,error:error?.message||String(error)});setInfo(CONTENT_ERROR_TEXT,"var(--gold)");});console.warn("[MEMORY_PULSE] ready",{lang,ads:false,content:"storage:lang/<lang>.json"});});
</script>
</body>
</html>
