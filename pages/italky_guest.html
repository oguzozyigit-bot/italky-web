<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iTalky Misafir</title><style>:root{--navy:#071b3a;--blue:#1687ff;--bg:#eef5fb;--text:#10233d;--muted:#64748b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--text)}button,input,select{font:inherit}.wrap{min-height:100vh;background:linear-gradient(180deg,#fff,#f4f8fc);display:flex;flex-direction:column}.head{height:62px;display:flex;align-items:center;padding:0 18px;background:linear-gradient(135deg,#071b3a,#0a2b57);color:#fff;font-weight:900;font-size:21px}.join{padding:28px 22px;max-width:520px;width:100%;margin:auto}.badge{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#42b5ff,#1687ff);color:#fff;display:grid;place-items:center;font-size:29px;font-weight:950;margin:0 auto 22px}.join h1{text-align:center;margin:0 0 8px}.lead{text-align:center;color:var(--muted);line-height:1.5;font-size:14px}.label{font-size:13px;color:var(--muted);margin:18px 0 7px}.field{width:100%;height:54px;border:1px solid #dbe6f1;border-radius:14px;padding:0 14px;background:#fff}.primary{width:100%;height:50px;border:0;border-radius:25px;margin-top:22px;background:linear-gradient(135deg,#42b5ff,#1687ff);color:#fff;font-weight:900}.status{text-align:center;color:var(--blue);font-size:13px;font-weight:800;margin-top:12px}.chat{display:none;height:calc(100vh - 62px);background:var(--bg);flex-direction:column}.chat.show{display:flex}.chatTop{height:58px;display:flex;align-items:center;padding:0 14px;background:#fff;border-bottom:1px solid #dbe6f1}.chatTop strong{font-size:17px}.chatTop span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.msgs{flex:1;overflow:auto;padding:14px 10px 88px;background-color:#eaf1f8;background-image:radial-gradient(circle at 1px 1px,rgba(57,94,132,.12) 1px,transparent 1.2px);background-size:18px 18px}.msg{max-width:82%;padding:8px 10px;border-radius:10px;margin:5px 0;background:#fff;box-shadow:0 1px 1px #0001}.msg.mine{margin-left:auto;background:#cfe7ff}.meta{font-size:10px;text-align:right;color:var(--muted);margin-top:3px}.composer{display:flex;gap:7px;padding:8px;background:#dfe8f1}.composer input{flex:1;min-width:0;height:46px;border:0;border-radius:24px;padding:0 16px;font-size:16px}.composer button{width:46px;height:46px;border:0;border-radius:50%;background:#1687ff;color:#fff;font-size:20px}</style></head><body><main class="wrap"><header class="head">iTalky · Misafir</header><section id="join" class="join"><div class="badge">iT</div><h1>Sohbete katıl</h1><p class="lead">Uygulama indirmen veya telefon numarası vermen gerekmez. Dilini seç ve hemen konuşmaya başla.</p><div class="label">Adın (isteğe bağlı)</div><input id="name" class="field" maxlength="30" placeholder="Misafir"><div class="label">Senin dilin</div><select id="lang" class="field"></select><button id="start" class="primary">Sohbete başla</button><div id="status" class="status"></div></section><section id="chat" class="chat"><div class="chatTop"><div><strong id="hostName">iTalky</strong><span id="langInfo"></span></div></div><div id="msgs" class="msgs"></div><div class="composer"><input id="input" placeholder="Mesaj"><button id="send">➤</button></div></section></main><script type="module">import { LANGUAGE_REGISTRY_129 } from '/js/language_registry_129.js';import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const p=new URLSearchParams(location.search),room=p.get('room')||'',hostLang=p.get('hostLang')||'tr',hostName=p.get('hostName')||'iTalky';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sb=createClient('https://wtzsnywujksshcwvemgz.supabase.co','sb_publishable_85JlITD5FKjDvdf4JHU0Dg_eByJrKVo',{auth:{persistSession:false}});let chan=null,myLang='tr',myName='Misafir',myId='guest-'+Math.random().toString(36).slice(2);$('hostName').textContent=hostName;const list=LANGUAGE_REGISTRY_129.filter(x=>x.online!==false);$('lang').innerHTML=list.map(x=>`<option value="${x.code}">${esc(x.flag||'🌐')} ${esc(x.name)}</option>`).join('');$('lang').value=(navigator.language||'tr').split('-')[0];if(!$('lang').value)$('lang').value='tr';async function tr(text,from,to){if(!text||from===to)return text;try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:from,target:to,from_lang:from,to_lang:to})});const j=await r.json();return String(j.text||j.translation||j.translated||j.translatedText||text)}catch{return text}}function add(mine,text,original){const d=document.createElement('div');d.className='msg'+(mine?' mine':'');d.innerHTML=`<div>${esc(text)}</div>${original&&original!==text?`<div style="font-size:11px;color:#64748b;margin-top:4px">${mine?'Karşı tarafta':'Orijinal'}: ${esc(original)}</div>`:''}<div class="meta">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;$('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight}async function start(){if(!room){$('status').textContent='QR bağlantısı geçersiz.';return}myLang=$('lang').value||'tr';myName=$('name').value.trim()||'Misafir';$('status').textContent='Bağlanıyor…';chan=sb.channel('italky-guest-room:'+room);chan.on('broadcast',{event:'host-ready'},({payload})=>{if(payload?.room!==room)return;$('join').style.display='none';$('chat').classList.add('show');$('hostName').textContent=payload.hostName||hostName;$('langInfo').textContent='Mesajların otomatik çevriliyor'});chan.on('broadcast',{event:'message'},({payload})=>{if(payload?.room!==room||payload?.sender===myId||payload?.side!=='host')return;add(false,payload.translated||payload.original||'',payload.original)});await chan.subscribe();await chan.send({type:'broadcast',event:'guest-join',payload:{room,name:myName,lang:myLang}});$('status').textContent='Ev sahibinin ekranı bekleniyor…'}async function send(){const text=$('input').value.trim();if(!text||!chan)return;$('input').value='';const translated=await tr(text,myLang,hostLang);add(true,text,translated);await chan.send({type:'broadcast',event:'message',payload:{room,sender:myId,side:'guest',original:text,translated,fromLang:myLang,toLang:hostLang}})}$('start').onclick=start;$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};</script></body></html>
