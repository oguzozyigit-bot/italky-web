<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#030014 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --topH: 70px;
      --infoH: 40px;
      --inputH: 85px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    /* ✅ Kural Seti Uygulandı */
    body {
      width: 100%; height: 100%;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
    }

    /* Kuantum Arka Plan */
    .quantum-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }
    .energy-cloud {
      position: absolute; width: 80vw; height: 80vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      filter: blur(80px); animation: drift 20s infinite alternate ease-in-out;
    }

    /* Main Frame */
    #pageContent {
      height: 100%; display: flex; flex-direction: column;
      position: relative; z-index: 10;
      max-width: 500px; margin: 0 auto;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    /* TOP BAR & INFO */
    .header {
      height: var(--topH); display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .back-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass); color: #fff; cursor: pointer; }
    
    .room-bar {
      height: var(--infoH); background: rgba(255,255,255,0.02);
      display: flex; align-items: center; justify-content: center;
      gap: 10px; font-size: 12px; font-weight: 800; border-bottom: 1px solid var(--glass-border);
    }
    .room-pill { padding: 4px 12px; background: var(--ai-grad); border-radius: 20px; color: #fff; font-family: monospace; letter-spacing: 2px; }

    /* CHAT AREA */
    .chat-scroller {
      flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 15px;
      scrollbar-width: none;
    }
    .chat-scroller::-webkit-scrollbar { display: none; }

    /* Mesaj Balonları */
    .msg-row { display: flex; flex-direction: column; max-width: 85%; }
    .msg-row.left { align-self: flex-start; }
    .msg-row.right { align-self: flex-end; align-items: flex-end; }

    .msg-bubble {
      padding: 12px 16px; border-radius: 22px; font-size: 15px; line-height: 1.5;
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
    }
    .left .msg-bubble { background: var(--glass); border-bottom-left-radius: 4px; color: #fff; }
    .right .msg-bubble { background: linear-gradient(135deg, var(--bordo) 0%, #1a0505 100%); border-bottom-right-radius: 4px; color: #fbcfe8; }

    .sender-name { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.4); margin-bottom: 4px; text-transform: uppercase; }

    /* INPUT DOCK (3D & Modern) */
    .input-dock {
      height: var(--inputH); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.6); backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
    }
    .dock-inner {
      height: 54px; background: var(--glass); border-radius: 27px;
      border: 1px solid var(--glass-border); display: flex; align-items: center; padding: 0 6px 0 20px;
    }
    #msgInput {
      flex: 1; background: transparent; border: none; color: #fff;
      font-size: 15px; font-family: inherit;
    }
    .dock-btns { display: flex; gap: 8px; }
    .circle-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .btn-mic { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); }
    .btn-mic.active { background: #ff0055; box-shadow: 0 0 15px #ff0055; border: none; }
    .btn-send { background: var(--ai-grad); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.4); }

    @keyframes drift { from { transform: translate(-10%, -10%); } to { transform: translate(10%, 10%); } }
  </style>
</head>

<body>
  <div class="quantum-bg">
    <div class="energy-cloud"></div>
  </div>

  <main id="pageContent">
    <header class="header">
      <button class="back-btn" id="backBtn">←</button>
      <div style="text-align: center;">
        <div style="font-weight: 900; font-size: 16px; letter-spacing: -0.5px;">italky<span style="color:#6366f1">AI</span></div>
        <div style="font-size: 8px; color: rgba(255,255,255,0.4); letter-spacing: 2px; font-weight: 700;">WALKIE TALKIE</div>
      </div>
      <button class="back-btn" id="exitBtn">✕</button>
    </header>

    <div class="room-bar" id="roomBar" style="display: none;">
      FREKANS KODU: <span class="room-pill" id="roomPill">---</span>
    </div>

    <div class="chat-scroller" id="chat">
      <div class="msg-row left">
        <span class="sender-name">Oğuz Özyiğit</span>
        <div class="msg-bubble">Selam Başkanım, sistem jilet gibi çalışıyor.</div>
      </div>
      <div class="msg-row right">
        <span class="sender-name">italkyAI</span>
        <div class="msg-bubble">Harika! Şimdi sınırsız frekansta sesimizi dünyaya duyurma vakti.</div>
      </div>
    </div>

    <footer class="input-dock">
      <div class="dock-inner">
        <input type="text" id="msgInput" placeholder="Mesajınızı fısıldayın..." autocomplete="off">
        <div class="dock-btns">
          <button class="circle-btn btn-mic" id="micBtn">🎙️</button>
          <button class="circle-btn btn-send" id="sendBtn">⚡</button>
        </div>
      </div>
    </footer>
  </main>

  <script type="module">
    // Oda Kodu Yakalama
    const params = new URLSearchParams(location.search);
    const room = params.get("room")?.toUpperCase();
    if(room) {
      document.getElementById("roomBar").style.display = "flex";
      document.getElementById("roomPill").textContent = room;
    }

    // Input Focus Fix for iOS
    const input = document.getElementById("msgInput");
    input.addEventListener("focus", () => {
      setTimeout(() => window.scrollTo(0,0), 100);
    });
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FINAL_002"></script>
</body>
</html>
