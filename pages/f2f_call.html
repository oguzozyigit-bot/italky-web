<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie Terminal</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --topH: 70px;
      --roomH: 42px;
      --peopleH: 58px;
      --dockH: 80px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    /* ✅ Kural Seti: Tam Ekran Sabitleme */
    html, body {
      width: 100%; height: 100dvh;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
      overflow: hidden; position: fixed;
    }

    /* Kuantum Arka Plan */
    .quantum-bg {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }

    /* ✅ Web Hizalama: margin: 0 auto ile merkeze çekildi */
    #pageContent {
      height: 100%; display: flex; flex-direction: column;
      position: relative; z-index: 10;
      width: 100%; max-width: 500px; margin: 0 auto;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      background: rgba(8, 8, 20, 0.4);
      backdrop-filter: blur(20px);
    }

    /* TOP BAR & ROOM BAR */
    .header { height: var(--topH); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
    .brand-name { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; color: #fff; }
    .brand-name span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .room-bar { height: var(--roomH); background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
    .room-pill { padding: 4px 10px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; font-family: monospace; font-weight: 900; letter-spacing: 1px; cursor: pointer; }
    .lang-select-ui { height: 28px; background: transparent; border: 1px solid var(--glass-border); border-radius: 8px; color: #a5b4fc; font-size: 10px; font-weight: 900; }

    /* ✅ ONLINE AVATAR ALANI (Sadece burada olacak) */
    .people-bar { height: var(--peopleH); display: flex; align-items: center; gap: 10px; padding: 0 14px; background: rgba(255,255,255,0.01); border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
    .people-count { font-size: 12px; font-weight: 900; color: #6366f1; min-width: 20px; }
    .people-scroll { flex: 1; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .people-scroll::-webkit-scrollbar { display: none; }
    
    .pItem { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .pAvatar { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--glass-border); overflow: hidden; background: var(--glass); }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }
    .pName { font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.4); max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* CHAT AREA */
    .chat-area { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
    .chat-area::-webkit-scrollbar { display: none; }

    /* ✅ SOHBET BALONLARI (AVATARSIZ) */
    .msg-row { display: flex; flex-direction: column; max-width: 85%; }
    .msg-row.left { align-self: flex-start; }
    .msg-row.right { align-self: flex-end; align-items: flex-end; }

    .sender-name { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.4); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    .msg-bubble {
      padding: 10px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5;
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
    }
    .left .msg-bubble { background: var(--glass); border-bottom-left-radius: 4px; color: #fff; }
    .right .msg-bubble { background: linear-gradient(135deg, var(--bordo) 0%, #1a0505 100%); border-bottom-right-radius: 4px; border-color: rgba(236, 72, 153, 0.2); color: #fbcfe8; }

    /* INPUT DOCK */
    .input-dock { height: var(--dockH); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-top: 1px solid var(--glass-border); flex-shrink: 0; }
    .dock-inner { height: 54px; background: rgba(255,255,255,0.05); border-radius: 27px; border: 1px solid var(--glass-border); display: flex; align-items: center; padding: 0 6px 0 18px; }
    #msgInput { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; font-family: inherit; }
    
    .dock-btns { display: flex; gap: 8px; }
    .circle-btn { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    #micBtn { background: transparent; color: #fff; font-size: 18px; border: 1px solid var(--glass-border); }
    #micBtn.listening { background: #ef4444; border: none; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
    #sendBtn { background: var(--ai-grad); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }

    .sig-bar { height: 30px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; color: rgba(255,255,255,0.15); letter-spacing: 1px; text-transform: uppercase; }

  </style>
</head>

<body>
  <div class="quantum-bg"></div>

  <main id="pageContent">
    <header class="header">
      <button class="nav-btn" id="backBtn">←</button>
      <div style="text-align:center;">
        <div class="brand-name">italky<span>AI</span></div>
        <div style="font-size:8px; color:rgba(255,255,255,0.3); font-weight:800; letter-spacing:2px;">WALKIE TALKIE</div>
      </div>
      <button class="nav-btn" id="exitBtn">✕</button>
    </header>

    <div class="room-bar" id="roomBar" style="display: none;">
      <div style="font-size:11px; font-weight:900; color:rgba(255,255,255,0.6);">FREKANS: <span class="room-pill" id="roomPill">---</span></div>
      <select class="lang-select-ui" id="langSelect"></select>
    </div>

    <div class="people-bar">
      <div class="people-count" id="peopleCount">1</div>
      <div class="people-scroll" id="peopleScroll"></div>
    </div>

    <div class="chat-area" id="chat"></div>

    <footer class="input-dock">
      <div class="dock-inner">
        <input type="text" id="msgInput" placeholder="Mesajınızı fısıldayın..." autocomplete="off">
        <div class="dock-btns">
          <button class="circle-btn" id="micBtn">🎙️</button>
          <button class="circle-btn" id="sendBtn">⚡</button>
        </div>
      </div>
    </footer>
    <div class="sig-bar">italkyAI @ italkyAcademy • By Ozyigit</div>
  </main>

  <script type="module">
    import { mountShell } 
    mountShell({ scroll:"none" });

    const params = new URLSearchParams(location.search);
    const room = params.get("room")?.toUpperCase();
    if(room) {
      document.getElementById("roomBar").style.display = "flex";
      document.getElementById("roomPill").textContent = room;
      document.getElementById("roomPill").onclick = () => {
        navigator.clipboard.writeText(room);
        alert("Kod kopyalandı!");
      };
    }
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FINAL_006"></script>
</body>
</html>
