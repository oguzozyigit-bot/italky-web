<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie Terminal</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --topH: 70px;
      --roomH: 42px;
      --peopleH: 58px;
      --dockH: 84px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    html, body {
      width: 100%; height: 100dvh;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
      overflow: hidden; position: fixed;
    }

    .quantum-bg{
      position:absolute; inset:0; z-index:0;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }

    #pageContent{
      height: 100%;
      display:flex;
      flex-direction:column;
      position:relative; z-index:10;
      width:100%; max-width:500px; margin:0 auto;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      background: rgba(8, 8, 20, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow:hidden;
    }

    .header{
      height: var(--topH);
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(0,0,0,.35);
      flex-shrink:0;
    }

    .nav-btn{
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--glass-border); background: var(--glass);
      color:#fff; font-weight: 1000; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .nav-btn:active{ transform: scale(.96); }

    .brand{
      text-align:center; line-height:1.05;
    }
    .brand-name{ font-family:'Space Grotesk'; font-size: 18px; font-weight: 700; }
    .brand-name span{ background: var(--ai-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .brand-sub{ font-size:8px; color:rgba(255,255,255,0.3); font-weight:800; letter-spacing:2px; margin-top:4px; }

    .room-bar{
      height: var(--roomH);
      background: rgba(0,0,0,0.2);
      display:none;
      align-items:center; justify-content:space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink:0;
      gap:10px;
    }
    .room-left{
      font-size:11px; font-weight:900; color:rgba(255,255,255,0.6);
      display:flex; align-items:center; gap:8px;
      min-width:0;
    }
    .room-pill{
      padding: 4px 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900;
      letter-spacing: 1px;
      cursor:pointer;
      max-width: 180px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      color:#fff;
    }
    .lang-select-ui{
      height: 28px;
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 900;
      padding: 0 8px;
      max-width: 150px;
    }

    .people-bar{
      height: var(--peopleH);
      display:flex; align-items:center; gap:10px;
      padding: 0 14px;
      background: rgba(255,255,255,0.01);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink:0;
    }
    .people-count{ font-size:12px; font-weight:900; color:#6366f1; min-width: 20px; text-align:center; }
    .people-scroll{ flex:1; display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
    .people-scroll::-webkit-scrollbar{ display:none; }

    .pItem{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .pAvatar{
      width:34px; height:34px; border-radius:50%;
      border: 1.5px solid var(--glass-border);
      overflow:hidden; background: var(--glass);
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:1000;
      color: rgba(255,255,255,0.9);
    }
    .pAvatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .pName{
      font-size:9px; font-weight:800; color: rgba(255,255,255,0.4);
      max-width:44px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }

    .chat-area{
      flex:1; min-height:0;
      overflow-y:auto;
      padding: 16px;
      display:flex; flex-direction:column; gap:16px;
      scrollbar-width:none;
      -webkit-overflow-scrolling: touch;
    }
    .chat-area::-webkit-scrollbar{ display:none; }

    /* ✅ balonlarda avatar YOK */
    .msg-row{ display:flex; flex-direction:column; max-width: 86%; }
    .msg-row.left{ align-self:flex-start; }
    .msg-row.right{ align-self:flex-end; align-items:flex-end; }

    .sender-name{
      font-size:10px;
      font-weight:900;
      color: rgba(255,255,255,0.45);
      margin-bottom: 4px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .msg-bubble{
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.left .msg-bubble{
      background: var(--glass);
      border-bottom-left-radius: 6px;
      border-left: 3px solid rgba(99,102,241,0.55);
    }

    .msg-row.right .msg-bubble{
      background: linear-gradient(135deg, var(--bordo) 0%, #1a0505 100%);
      border-bottom-right-radius: 6px;
      border-right: 3px solid rgba(236,72,153,0.45);
      color: #fbcfe8;
    }

    .input-dock{
      height: var(--dockH);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.5);
      border-top: 1px solid var(--glass-border);
      flex-shrink:0;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }
    .dock-inner{
      height: 56px;
      background: rgba(255,255,255,0.05);
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      display:flex; align-items:center;
      padding: 0 8px 0 16px;
      gap: 10px;
    }

    /* ✅ kritik: textarea geri geldi */
    #msgInput{
      flex:1;
      background: transparent;
      border:none;
      color:#fff;
      font-size: 15px;
      font-family: inherit;
      resize:none;
      outline:none;
      padding: 12px 0;
      line-height: 18px;
      max-height: 120px;
      overflow:auto;
    }

    .dock-btns{ display:flex; gap:8px; }

    .circle-btn{
      width: 44px; height: 44px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.18);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .circle-btn:active{ transform: scale(.96); }

    .circle-btn svg{
      width: 22px; height: 22px;
      stroke:#fff; fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.92;
    }

    #micBtn.listening{
      background: rgba(239,68,68,0.22);
      border-color: rgba(239,68,68,0.45);
      box-shadow: 0 0 18px rgba(239,68,68,0.25);
    }

    #sendBtn{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.16);
    }
  </style>
</head>

<body>
  <div class="quantum-bg"></div>

  <main id="pageContent">
    <header class="header">
      <button class="nav-btn" id="backBtn" type="button">←</button>

      <div class="brand">
        <div class="brand-name">italky<span>AI</span></div>
        <div class="brand-sub">WALKIE TALKIE</div>
      </div>

      <button class="nav-btn" id="exitBtn" type="button">✕</button>
    </header>

    <div class="room-bar" id="roomBar">
      <div class="room-left">FREKANS: <span class="room-pill" id="roomPill">---</span></div>
      <select class="lang-select-ui" id="langSelect"></select>
    </div>

    <div class="people-bar">
      <div class="people-count" id="peopleCount">1</div>
      <div class="people-scroll" id="peopleScroll"></div>
    </div>

    <div class="chat-area" id="chat"></div>

    <footer class="input-dock">
      <div class="dock-inner">
        <textarea id="msgInput" rows="1" placeholder="Yaz ya da konuş…" spellcheck="false"></textarea>

        <div class="dock-btns">
          <button class="circle-btn" id="micBtn" type="button" aria-label="Mikrofon">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button class="circle-btn" id="sendBtn" type="button" aria-label="Gönder">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <script type="module">
    const p = new URLSearchParams(location.search);
    const room = (p.get("room") || "").trim().toUpperCase();
    const bar = document.getElementById("roomBar");
    if(room){
      bar.style.display = "flex";
      document.getElementById("roomPill").textContent = room;
      document.getElementById("roomPill").onclick = async ()=>{
        try{ await navigator.clipboard.writeText(room); }catch{}
        alert("Kod kopyalandı: " + room);
      };
    }else{
      // room yoksa bar kapalı
      bar.style.display = "none";
    }
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FIXED_001"></script>
</body>
</html>
