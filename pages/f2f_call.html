<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie Terminal</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#000 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --topH: 70px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    /* ✅ Kural Seti: Tam Ekran ve Sabit Konumlandırma */
    html, body {
      width: 100%; height: 100%;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
      overflow: hidden; position: fixed;
    }

    /* Kuantum Arka Plan */
    .quantum-bg {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 20%, #0a0a25 0%, #000 100%);
    }

    /* Ana Konteyner: Flexbox ile barları ayırıyoruz */
    #pageContent {
      height: 100dvh; display: flex; flex-direction: column;
      position: relative; z-index: 10;
      max-width: 500px; margin: 0 auto;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.2);
    }

    /* ===== ÜST PANEL (BARLAR) ===== */
    .top-sections { flex-shrink: 0; z-index: 100; }

    .header {
      height: var(--topH); display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand-zone { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .brand-name { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; color: #fff; }
    .brand-name span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-slogan { font-size: 8px; color: rgba(255,255,255,0.4); letter-spacing: 3px; font-weight: 800; margin-top: 2px; }

    .nav-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .room-bar {
      height: 44px; background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; border-bottom: 1px solid var(--glass-border);
    }
    .room-pill { padding: 4px 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-family: monospace; font-weight: 900; letter-spacing: 1.5px; cursor: pointer; }
    .lang-select-ui { height: 28px; background: transparent; border: 1px solid var(--glass-border); border-radius: 8px; color: #a5b4fc; font-size: 10px; font-weight: 900; }

    .people-bar {
      height: 60px; display: flex; align-items: center; gap: 12px;
      padding: 0 14px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border);
    }
    .people-count { font-size: 12px; font-weight: 900; color: #6366f1; }
    .people-scroll { flex: 1; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .people-scroll::-webkit-scrollbar { display: none; }

    /* ===== ORTA PANEL (SOHBET) ===== */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px 14px;
      display: flex; flex-direction: column; gap: 14px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chat-area::-webkit-scrollbar { display: none; }

    /* Mesaj Balonları */
    .msg-row { display: flex; flex-direction: column; max-width: 85%; position: relative; }
    .msg-row.left { align-self: flex-start; }
    .msg-row.right { align-self: flex-end; align-items: flex-end; }
    
    .sender-name { font-size: 9px; font-weight: 900; color: rgba(255,255,255,0.3); margin: 0 4px 4px; text-transform: uppercase; }

    .msg-bubble {
      padding: 12px 16px; border-radius: 20px; font-size: 14px; line-height: 1.5;
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border); position: relative;
    }
    .left .msg-bubble { background: var(--glass); border-bottom-left-radius: 4px; }
    .right .msg-bubble { background: linear-gradient(135deg, var(--bordo) 0%, #000 100%); border-bottom-right-radius: 4px; border-color: rgba(236,72,153,0.2); color: #fbcfe8; }

    /* TTS Hoparlör Butonu */
    .speaker-btn { 
      position: absolute; top: -5px; width: 22px; height: 22px; border-radius: 50%; 
      background: #000; border: 1px solid var(--glass-border); 
      display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; z-index: 5; 
    }
    .left .speaker-btn { right: -8px; }
    .right .speaker-btn { left: -8px; }

    /* ===== ALT PANEL (DOCK) ===== */
    .bottom-sections { flex-shrink: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(30px); border-top: 1px solid var(--glass-border); }

    .input-dock { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .dock-inner {
      height: 52px; background: rgba(255,255,255,0.05); border-radius: 26px;
      border: 1px solid var(--glass-border); display: flex; align-items: center; padding: 0 6px 0 16px;
    }
    #msgInput { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; font-family: inherit; }
    
    .action-btns { display: flex; gap: 8px; }
    .circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
    }
    #micBtn { background: transparent; color: #fff; font-size: 18px; border: 1px solid var(--glass-border); }
    #micBtn.listening { background: #ef4444; border: none; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); animation: pulse 1s infinite; }
    #sendBtn { background: var(--ai-grad); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }

    .signature-bar {
      height: 30px; display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: rgba(255,255,255,0.2); letter-spacing: 1px;
      text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.03);
    }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>

<body>
  <div class="quantum-bg"></div>

  <main id="pageContent">
    
    <div class="top-sections">
      <header class="header">
        <button class="nav-btn" id="backBtn">←</button>
        <div class="brand-zone" id="logoHome">
          <div class="brand-name">italky<span>AI</span></div>
          <div class="brand-slogan">BE FREE</div>
        </div>
        <button class="nav-btn" id="exitBtn">✕</button>
      </header>

      <div class="room-bar" id="roomBar" style="display: none;">
        <div class="room-info">FREKANS: <span class="room-pill" id="roomPill">---</span></div>
        <select class="lang-select-ui" id="langSelect"></select>
      </div>

      <div class="people-bar">
        <div class="people-count" id="peopleCount">1</div>
        <div class="people-scroll" id="peopleScroll">
          </div>
      </div>
    </div>

    <div class="chat-area" id="chat">
      </div>

    <div class="bottom-sections">
      <footer class="input-dock">
        <div class="dock-inner">
          <input type="text" id="msgInput" placeholder="Mesajınızı fısıldayın..." autocomplete="off">
          <div class="action-btns">
            <button class="circle-btn" id="micBtn" title="Konuş">🎙️</button>
            <button class="circle-btn" id="sendBtn" title="Gönder">⚡</button>
          </div>
        </div>
      </footer>
      <div class="signature-bar">italkyAI @ italkyAcademy • By Ozyigit</div>
    </div>

  </main>

  <script type="module">
    // Oda Kodu & Kopyalama
    const params = new URLSearchParams(location.search);
    const room = params.get("room")?.toUpperCase();
    if(room) {
      const rb = document.getElementById("roomBar");
      const rp = document.getElementById("roomPill");
      rb.style.display = "flex";
      rp.textContent = room;
      rp.onclick = () => {
        navigator.clipboard.writeText(room);
        alert("Kod kopyalandı!");
      };
    }

    // Mobil Klavye Fix: Giriş alanına odaklanınca sohbeti en alta kaydır
    const chatArea = document.getElementById("chat");
    const msgInput = document.getElementById("msgInput");
    
    msgInput.addEventListener("focus", () => {
      setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 300);
    });
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FINAL_004"></script>
</body>
</html>
