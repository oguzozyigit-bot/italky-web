<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie Terminal</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#030014 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --frameW: min(480px, calc(100vw - 18px));
      --topH: 70px;
      --roomH: 42px;
      --peopleH: 54px;
      --dockH: 80px;
      --sigH: 34px;

      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      overflow: hidden; position: fixed;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
    }

    /* Background Effects */
    .cosmos-bg { position: absolute; inset: -50%; width: 200%; height: 200%; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .20; animation: floatOrbit 30s infinite alternate ease-in-out; }
    .orb-1 { top: 10%; left: 10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #4f46e5, transparent 70%); }
    .orb-2 { bottom: 10%; right: 10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #ec4899, transparent 70%); }
    @keyframes floatOrbit { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(10%,-10%) scale(1.1); } }

    .mobile-frame {
      width: 100%; max-width: 480px; height: 100%;
      position: relative; z-index: 10;
      background: rgba(8, 8, 20, 0.65);
      backdrop-filter: blur(25px);
      overflow: hidden; display: flex; flex-direction: column;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    /* TOPBAR */
    .topbar {
      height: var(--topH); display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 1px solid var(--glass-border);
      background: rgba(0,0,0,.35); flex-shrink: 0;
    }
    .backBtn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--glass-border); background: var(--glass);
      color: #fff; font-weight: 1000; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .backBtn:active{ transform: scale(.96); }

    .brand { display: flex; flex-direction: column; align-items: center; user-select:none; }
    .brand-name { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; }
    .brand-name span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-sub { font-size: 8px; color: rgba(255,255,255,0.4); font-weight: 800; letter-spacing: 2px; }

    /* ROOM BAR */
    .roomBar {
      height: var(--roomH); display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(0,0,0,.20); border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
    }
    .roomLeft{ display:flex; align-items:center; gap:8px; min-width:0; }
    .roomLabel{ font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.6); white-space:nowrap; }
    .roomPill {
      padding: 6px 12px; border-radius: 10px; background: var(--glass);
      border: 1px solid var(--glass-border); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 900; letter-spacing: 1px;
      cursor:pointer;
      max-width: 210px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .langSelect {
      height: 30px; border-radius: 8px; border: 1px solid var(--glass-border);
      background: transparent; color: #fff; font-size: 11px; font-weight: 900;
      padding: 0 8px;
      max-width: 140px;
    }

    /* ✅ PEOPLE BAR (AVATAR YOK — SADECE İSİM) */
    .peopleBar {
      height: var(--peopleH);
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .peopleCount { font-size: 11px; font-weight: 1000; color: #a5b4fc; min-width: 20px; text-align:center; }

    .peopleScroll {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .peopleScroll::-webkit-scrollbar { display: none; }

    .namePill{
      flex: 0 0 auto;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      display:flex;
      align-items:center;
      gap:8px;
      font-weight: 1000;
      font-size: 12px;
      color: rgba(255,255,255,0.88);
      max-width: 180px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      user-select:none;
    }
    .dot{
      width:8px;height:8px;border-radius:99px;
      background: rgba(34,197,94,0.95);
      box-shadow: 0 0 12px rgba(34,197,94,0.35);
      flex: 0 0 auto;
    }
    .dot.off{
      background: rgba(239,68,68,0.95);
      box-shadow: 0 0 12px rgba(239,68,68,0.35);
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      min-height:0;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .chat-area::-webkit-scrollbar { display: none; }

    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.left { align-self: flex-start; background: var(--glass); border-bottom-left-radius: 6px; }
    .bubble.right { align-self: flex-end; background: linear-gradient(135deg, var(--bordo) 0%, #000 100%); border-bottom-right-radius: 6px; color: #fbcfe8; border-color: rgba(236,72,153,0.2); }

    /* ✅ SYSTEM MESSAGE */
    .bubble.sys{
      align-self:center;
      max-width: 92%;
      text-align:center;
      font-size: 12px;
      font-weight: 1000;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.14);
    }

    /* INPUT DOCK */
    .input-dock {
      height: var(--dockH);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .dock-inner {
      height: 52px;
      background: rgba(255,255,255,0.05);
      border-radius: 26px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      padding: 0 6px 0 16px;
      gap: 8px;
    }
    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      resize:none;
      line-height: 18px;
      padding: 10px 6px;
      max-height: 120px;
      overflow:hidden;
    }

    .icon-btn, .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select:none;
      flex: 0 0 auto;
    }
    #micBtn {
      background: transparent;
      color: #fff;
      font-size: 18px;
      border: 1px solid var(--glass-border);
    }
    #micBtn.listening { background: #ef4444; border: none; animation: pulse 1s infinite; }
    #sendBtn {
      background: var(--ai-grad);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
      font-weight: 1000;
    }

    .signatureBar {
      height: var(--sigH);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
      background: #000;
      border-top: 1px solid rgba(255,255,255,0.03);
      user-select:none;
    }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>

<body>
  <div class="cosmos-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="mobile-frame" id="mobileFrame">
    <header class="topbar">
      <button class="backBtn" id="backBtn" type="button">←</button>

      <div class="brand" id="logoHome" title="Ana sayfa">
        <div class="brand-name">italky<span>AI</span></div>
        <div class="brand-sub">WALKIE TALKIE</div>
      </div>

      <button class="backBtn" id="exitBtn" type="button">✕</button>
    </header>

    <div class="roomBar" id="roomBar" style="display:none;">
      <div class="roomLeft">
        <div class="roomLabel">FREKANS:</div>
        <div class="roomPill" id="roomPill">---</div>
      </div>
      <select class="langSelect" id="langSelect"></select>
    </div>

    <div class="peopleBar">
      <div class="peopleCount" id="peopleCount">1</div>
      <div class="peopleScroll" id="peopleScroll"></div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-dock">
      <div class="dock-inner">
        <textarea id="msgInput" rows="1" placeholder="Konuş ya da yaz..." spellcheck="false"></textarea>
        <button id="micBtn" class="icon-btn" type="button" aria-label="Mikrofon">🎙️</button>
        <button id="sendBtn" class="send-btn" type="button" aria-label="Gönder">⚡</button>
      </div>
    </div>

    <div class="signatureBar">italkyAI @ italkyAcademy • By Ozyigit</div>
  </div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    mountShell({ scroll:"none" });

    // Room code
    const p = new URLSearchParams(location.search);
    const room = String(p.get("room")||"").trim().toUpperCase();
    if(room) {
      document.getElementById("roomBar").style.display = "flex";
      const pill = document.getElementById("roomPill");
      pill.textContent = room;
      pill.onclick = async () => {
        try{
          await navigator.clipboard.writeText(room);
          alert("Kod kopyalandı!");
        }catch{
          alert("Kod: " + room);
        }
      };
    }

    // Enter=send, Shift+Enter=new line
    const msg = document.getElementById("msgInput");
    const send = document.getElementById("sendBtn");
    msg?.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        send?.click();
      }
    });

    // ✅ f2f_call.js bununla UI'a yazacak:
    const chat = document.getElementById("chat");
    const peopleScroll = document.getElementById("peopleScroll");
    const peopleCount = document.getElementById("peopleCount");

    function addSys(text){
      const d = document.createElement("div");
      d.className = "bubble sys";
      d.textContent = String(text||"");
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    function addMsg(side, text){
      const d = document.createElement("div");
      d.className = "bubble " + (side === "right" ? "right" : "left");
      d.textContent = String(text||"");
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderPeople(list){
      // list: [{name:"Oğuz", online:true}, ...]
      const arr = Array.isArray(list) ? list : [];
      peopleCount.textContent = String(arr.length || 0);

      peopleScroll.innerHTML = arr.map(p=>{
        const nm = String(p?.name || "Kullanıcı").trim() || "Kullanıcı";
        const online = !!p?.online;
        return `
          <div class="namePill" title="${nm}">
            <span class="dot ${online ? "" : "off"}"></span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;">${nm}</span>
          </div>
        `;
      }).join("");
    }

    // Global UI API (f2f_call.js bunu kullanacak)
    window.WT_UI = {
      sys: addSys,
      msg: addMsg,
      setPeople: renderPeople
    };
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FINAL_006"></script>
</body>
</html>
