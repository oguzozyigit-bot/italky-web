<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Walkie Talkie Terminal</title>

  <meta name="theme-color" content="#030014">
  <style>html,body{background:#030014 !important; margin:0; padding:0; overflow:hidden;}</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --frameW: min(480px, calc(100vw - 18px));
      --topH: 70px;
      --roomH: 42px;
      --peopleH: 54px; /* Avatar alanı boyutu optimize edildi */
      --dockH: 80px;
      --sigH: 34px;

      --ai-grad: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bordo: #2d0a0a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      overflow: hidden; position: fixed;
      font-family: 'Outfit', sans-serif;
      background: #000; color: #fff;
    }

    /* Background Effects */
    .cosmos-bg { position: absolute; inset: -50%; width: 200%; height: 200%; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .20; animation: floatOrbit 30s infinite alternate ease-in-out; }
    .orb-1 { top: 10%; left: 10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #4f46e5, transparent 70%); }
    .orb-2 { bottom: 10%; right: 10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #ec4899, transparent 70%); }
    @keyframes floatOrbit { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(10%,-10%) scale(1.1); } }

    .mobile-frame {
      width: 100%; max-width: 480px; height: 100%;
      position: relative; z-index: 10;
      background: rgba(8, 8, 20, 0.65);
      backdrop-filter: blur(25px);
      overflow: hidden; display: flex; flex-direction: column;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    /* TOPBAR */
    .topbar {
      height: var(--topH); display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 1px solid var(--glass-border);
      background: rgba(0,0,0,.35); flex-shrink: 0;
    }
    .backBtn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--glass-border); background: var(--glass);
      color: #fff; font-weight: 1000; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .brand { display: flex; flex-direction: column; align-items: center; }
    .brand-name { font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; }
    .brand-name span { background: var(--ai-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* ROOM BAR */
    .roomBar {
      height: var(--roomH); display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(0,0,0,.20); border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
    }
    .roomPill {
      padding: 6px 12px; border-radius: 10px; background: var(--glass);
      border: 1px solid var(--glass-border); font-family: monospace; font-weight: 900; letter-spacing: 1px;
    }
    .langSelect {
      height: 30px; border-radius: 8px; border: 1px solid var(--glass-border);
      background: transparent; color: #fff; font-size: 11px; font-weight: 900;
    }

    /* ✅ KATILIMCI ALANI (PEOPLE BAR - JİLET ÖLÇÜ) */
    .peopleBar {
      height: var(--peopleH); display: flex; align-items: center; gap: 8px;
      padding: 0 12px; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
    }
    .peopleCount { font-size: 11px; font-weight: 900; color: #6366f1; min-width: 20px; }
    .peopleScroll { flex: 1; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .peopleScroll::-webkit-scrollbar { display: none; }

    /* Avatar Tasarımı */
    .pItem { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .pAvatar {
      width: 32px; height: 32px; /* Avatar boyutu küçültüldü */
      border-radius: 50%; border: 1.5px solid var(--glass-border);
      overflow: hidden; background: var(--glass);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900;
    }
    .pAvatar img { width: 100%; height: 100%; object-fit: cover; }
    .pName { font-size: 8px; font-weight: 800; color: rgba(255,255,255,0.4); max-width: 38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* CHAT AREA */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chat-area::-webkit-scrollbar { display: none; }

    .msgRow { display: flex; flex-direction: column; max-width: 85%; }
    .msgRow.left { align-self: flex-start; }
    .msgRow.right { align-self: flex-end; align-items: flex-end; }

    .bubble {
      padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45;
      backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
    }
    .left .bubble { background: var(--glass); border-bottom-left-radius: 4px; }
    .right .bubble { background: linear-gradient(135deg, var(--bordo) 0%, #000 100%); border-bottom-right-radius: 4px; color: #fbcfe8; border-color: rgba(236,72,153,0.2); }

    /* INPUT DOCK */
    .input-dock {
      height: var(--dockH); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.5); backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border); flex-shrink: 0;
    }
    .dock-inner {
      height: 52px; background: rgba(255,255,255,0.05); border-radius: 26px;
      border: 1px solid var(--glass-border); display: flex; align-items: center; padding: 0 6px 0 16px;
    }
    #msgInput { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; font-family: inherit; }
    
    .icon-btn, .send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #micBtn { background: transparent; color: #fff; font-size: 18px; border: 1px solid var(--glass-border); }
    #micBtn.listening { background: #ef4444; border: none; animation: pulse 1s infinite; }
    #sendBtn { background: var(--ai-grad); color: #fff; margin-left: 8px; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }

    .signatureBar {
      height: var(--sigH); display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: rgba(255,255,255,0.2); letter-spacing: 1px;
      background: #000; border-top: 1px solid rgba(255,255,255,0.03);
    }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>

<body>
  <div class="cosmos-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="mobile-frame" id="mobileFrame">
    <header class="topbar">
      <button class="backBtn" id="backBtn">←</button>
      <div class="brand">
        <div class="brand-name">italky<span>AI</span></div>
        <div style="font-size: 8px; color: rgba(255,255,255,0.4); font-weight: 800; letter-spacing: 2px;">WALKIE TALKIE</div>
      </div>
      <button class="backBtn" id="exitBtn">✕</button>
    </header>

    <div class="roomBar" id="roomBar" style="display: none;">
      <div style="font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.6);">FREKANS: <span class="roomPill" id="roomPill">---</span></div>
      <select class="langSelect" id="langSelect"></select>
    </div>

    <div class="peopleBar">
      <div class="peopleCount" id="peopleCount">1</div>
      <div class="peopleScroll" id="peopleScroll">
        </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-dock">
      <div class="dock-inner">
        <textarea id="msgInput" rows="1" placeholder="Konuş ya da yaz..."></textarea>
        <button id="micBtn" class="icon-btn">🎙️</button>
        <button id="sendBtn" class="send-btn">⚡</button>
      </div>
    </div>

    <div class="signatureBar">italkyAI @ italkyAcademy • By Ozyigit</div>
  </div>

  <script type="module">
    import { mountShell } from "/js/ui_shell.js";
    mountShell({ scroll:"none" });

    // Oda Kodu & Kopyalama
    const p = new URLSearchParams(location.search);
    const room = p.get("room")?.toUpperCase();
    if(room) {
      document.getElementById("roomBar").style.display = "flex";
      document.getElementById("roomPill").textContent = room;
      document.getElementById("roomPill").onclick = () => {
        navigator.clipboard.writeText(room);
        alert("Kod kopyalandı!");
      };
    }
  </script>

  <script type="module" src="/js/f2f_call.js?v=CHAT_WT_FINAL_005"></script>
</body>
</html>
