<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • iOS FaceToFace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--ai-gradient:linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);--bg:#050508;--border:rgba(255,255,255,.15);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Outfit,Arial,sans-serif}
    body{background:radial-gradient(circle at top,rgba(236,72,153,.08),transparent 25%),radial-gradient(circle at bottom,rgba(99,102,241,.08),transparent 28%),#050508}
    .container{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    .edge-handle{position:fixed;top:50%;transform:translateY(-50%);z-index:998;width:28px;height:118px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-family:Outfit,Arial,sans-serif;font-size:11px;font-weight:1000;line-height:1.15;text-align:center;white-space:pre;box-shadow:0 0 32px rgba(0,0,0,.30)}
    .edge-handle.back{right:0;border-radius:18px 0 0 18px;background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));border:1px solid rgba(255,255,255,.14);border-right:none;box-shadow:-10px 0 32px rgba(0,0,0,.30)}
    .edge-handle.back::before{content:"B\A A\A C\A K";white-space:pre;display:block;line-height:1.2;text-shadow:0 0 12px rgba(255,255,255,.28)}
    .edge-handle.clear{left:0;border-radius:0 18px 18px 0;background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(99,102,241,.18),rgba(236,72,153,.18));border:1px solid rgba(255,255,255,.14);border-left:none;box-shadow:10px 0 32px rgba(0,0,0,.30)}
    .edge-handle.clear::before{content:"C\A L\A E\A A\A R";white-space:pre;display:block;line-height:1.2;text-shadow:0 0 12px rgba(255,255,255,.28)}
    .edge-handle:active{transform:translateY(-50%) scale(.96)}
    .half-screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:hidden;padding:10px 8px}
    .half-screen.top{transform:rotate(180deg);background:linear-gradient(180deg,rgba(128,19,54,.18),var(--bg))}
    .half-screen.bottom{background:linear-gradient(180deg,rgba(30,58,138,.18),var(--bg));padding-bottom:calc(4px + var(--safe-bottom))}
    .lang-row{width:100%;display:flex;align-items:center;justify-content:center;z-index:20}
    .lang-trigger{min-height:38px;border:none;border-radius:999px;background:transparent;color:#fff;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82vw;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .popover{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,360px);height:360px;background:#0a0a0f;border:1px solid var(--border);border-radius:24px;display:none;flex-direction:column;z-index:100;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.92)}
    .popover.show{display:flex}.half-screen.top .popover{top:58px}.half-screen.bottom .popover{bottom:58px}
    .pop-head{padding:14px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;align-items:center;font-weight:900}.pop-close{cursor:pointer;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
    .pop-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:none}.pop-list::-webkit-scrollbar{display:none}.pop-item{padding:12px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;border:1px solid transparent}.pop-item.active{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.25)}.pop-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.pop-flag{font-size:18px}.pop-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop-code{font-size:12px;font-weight:900;opacity:.7}
    .chat-body{flex:1;width:100%;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:18px 0;text-align:center;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;mask-image:linear-gradient(to bottom,transparent,black 10%,black 90%,transparent)}
    .chat-body::before{content:"";flex:1 0 auto;min-height:12px}.chat-body::-webkit-scrollbar{display:none;width:0;height:0}.bubble{max-width:86%;line-height:1.18;word-break:break-word;font-size:24px;font-weight:900;opacity:.9;text-align:center}.bubble.latest{font-size:32px;font-weight:1000;opacity:1}
    .mic-line{width:100%;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:12px;padding:0 8px;flex:0 0 auto;transform:translateY(-8px)}.mic-side{min-height:60px;display:flex;align-items:center;justify-content:center}
    .mic-btn{width:70px;height:70px;border:none;border-radius:999px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);position:relative}.mic-btn svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.mic-btn.listening{background:radial-gradient(circle at 50% 35%,rgba(216,180,254,.34),rgba(99,102,241,.22) 44%,rgba(236,72,153,.12));box-shadow:0 0 0 10px rgba(99,102,241,.12),0 0 34px rgba(99,102,241,.45),0 0 70px rgba(236,72,153,.25),inset 0 1px 0 rgba(255,255,255,.10);animation:micBreath 1.05s ease-in-out infinite}.mic-btn.listening::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:2px solid rgba(165,180,252,.78);box-shadow:0 0 0 12px rgba(99,102,241,.10),0 0 38px rgba(236,72,153,.35);animation:micPulse 1s ease-out infinite}@keyframes micBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}@keyframes micPulse{0%{transform:scale(.92);opacity:.95}70%{transform:scale(1.18);opacity:.16}100%{transform:scale(1.24);opacity:0}}
    .center-hub{height:82px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);z-index:50;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);padding:0 45px}.orb-wrapper{position:relative;width:66px;height:66px;display:flex;align-items:center;justify-content:center}.orb{width:66px;height:66px;border-radius:50%;background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-size:13px;font-weight:900;z-index:5}.orb .ai{background:var(--ai-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.satellite-orbit{position:absolute;width:100px;height:100px;border-radius:50%;border:1px solid rgba(255,255,255,.03);animation:spin 6s linear infinite}.satellite{position:absolute;width:8px;height:8px;border-radius:50%;top:0;left:50%;margin-left:-4px}.sat-blue{background:#6366f1;box-shadow:0 0 12px #6366f1}.sat-pink{background:#ec4899;box-shadow:0 0 12px #ec4899;top:auto;bottom:0}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;top:calc(20px + var(--safe-top));transform:translateX(-50%) translateY(-120px);max-width:min(92vw,430px);min-height:44px;padding:11px 16px;border-radius:16px;background:rgba(12,16,28,.98);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;z-index:2147483647;box-shadow:0 18px 36px rgba(0,0,0,.45);transition:.22s ease;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-width:390px){.mic-line{grid-template-columns:1fr 66px 1fr;gap:8px;transform:translateY(-7px)}.mic-btn{width:66px;height:66px}.mic-btn svg{width:28px;height:28px}.bubble{font-size:22px}.bubble.latest{font-size:30px}}
  </style>
</head>
<body>
  <button id="sideClearBtn" class="edge-handle clear" type="button" aria-label="Ekranı temizle"></button>
  <button id="backBtn" class="edge-handle back" type="button" aria-label="iOS girişe dön"></button>
  <main class="container">
    <section class="half-screen top" id="topSection">
      <div class="lang-row"><button id="topLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button></div>
      <div class="popover" id="pop-top"><div class="pop-head"><div id="topPopTitle">KARŞI DİL</div><div class="pop-close" id="close-top">✕</div></div><div class="pop-list" id="list-top"></div></div>
      <div class="chat-body" id="topBody"></div>
      <div class="mic-line"><div class="mic-side empty"></div><button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button><div class="mic-side empty"></div></div>
    </section>
    <section class="center-hub" id="centerHub"><div class="orb-wrapper"><div class="satellite-orbit"><div class="satellite sat-blue"></div><div class="satellite sat-pink"></div></div><div class="orb"><span>italky<span class="ai">AI</span></span></div></div></section>
    <section class="half-screen bottom" id="botSection">
      <div class="lang-row"><button id="botLangBtn" class="lang-trigger" type="button">🌐 Dil seçiliyor...</button></div>
      <div class="popover" id="pop-bot"><div class="pop-head"><div id="botPopTitle">BENİM DİLİM</div><div class="pop-close" id="close-bot">✕</div></div><div class="pop-list" id="list-bot"></div></div>
      <div class="chat-body" id="botBody"></div>
      <div class="mic-line"><div class="mic-side empty"></div><button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 10a7 7 0 0 1-14 0"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg></button><div class="mic-side empty"></div></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    (function(){
      const API_BASE="https://italky-api.onrender.com";
      const $=(id)=>document.getElementById(id);
      const SITE_LANG_KEY="site_lang";
      const LANGS=[
        {code:"tr",flag:"🇹🇷",name:"Türkçe",bcp:"tr-TR"},{code:"en",flag:"🇬🇧",name:"İngilizce",bcp:"en-US"},{code:"de",flag:"🇩🇪",name:"Almanca",bcp:"de-DE"},{code:"fr",flag:"🇫🇷",name:"Fransızca",bcp:"fr-FR"},{code:"it",flag:"🇮🇹",name:"İtalyanca",bcp:"it-IT"},{code:"es",flag:"🇪🇸",name:"İspanyolca",bcp:"es-ES"},{code:"ar",flag:"🇸🇦",name:"Arapça",bcp:"ar-SA"},{code:"ru",flag:"🇷🇺",name:"Rusça",bcp:"ru-RU"},{code:"pt",flag:"🇵🇹",name:"Portekizce",bcp:"pt-PT"},{code:"nl",flag:"🇳🇱",name:"Felemenkçe",bcp:"nl-NL"},{code:"zh",flag:"🇨🇳",name:"Çince",bcp:"zh-CN"},{code:"ja",flag:"🇯🇵",name:"Japonca",bcp:"ja-JP"},{code:"ko",flag:"🇰🇷",name:"Korece",bcp:"ko-KR"},{code:"hi",flag:"🇮🇳",name:"Hintçe",bcp:"hi-IN"},{code:"fa",flag:"🇮🇷",name:"Farsça",bcp:"fa-IR"},{code:"pl",flag:"🇵🇱",name:"Lehçe",bcp:"pl-PL"},{code:"uk",flag:"🇺🇦",name:"Ukraynaca",bcp:"uk-UA"},{code:"vi",flag:"🇻🇳",name:"Vietnamca",bcp:"vi-VN"}
      ];
      const UI={tr:{topLang:"KARŞI DİL",botLang:"BENİM DİLİM",micUnsupported:"Bu cihazda konuşma algılama desteklenmiyor.",micDenied:"Mikrofon izni gerekli.",micError:"Mikrofon hatası.",translateError:"Çeviri yapılamadı"},en:{topLang:"OTHER LANGUAGE",botLang:"MY LANGUAGE",micUnsupported:"Speech recognition is not supported on this device.",micDenied:"Microphone permission is required.",micError:"Microphone error.",translateError:"Translation failed"}};
      let SITE_LANG="tr";let botLang="tr";let topLang="en";let liveText="";let recordingSide=null;let isSpeaking=false;
      const topBody=$("topBody"),botBody=$("botBody"),topMic=$("topMic"),botMic=$("botMic");
      function canonical(code){return String(code||"").toLowerCase().split("-")[0]||"en"}
      function langObj(code){const c=canonical(code);return LANGS.find(x=>x.code===c)||LANGS.find(x=>x.code==="en")}
      function tx(key){const c=UI[SITE_LANG]?SITE_LANG:"en";return UI[c][key]||UI.en[key]||key}
      function showToast(msg){const toast=$("toast");toast.textContent=String(msg||"");toast.classList.add("show");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),2600)}
      function refreshTexts(){const tO=langObj(topLang),bO=langObj(botLang);$("topLangBtn").textContent=`${tO.flag} ${tO.name} ⌵`;$("botLangBtn").textContent=`${bO.flag} ${bO.name} ⌵`;$("topPopTitle").textContent=tx("topLang");$("botPopTitle").textContent=tx("botLang")}
      function closeAllPops(){$("pop-top").classList.remove("show");$("pop-bot").classList.remove("show")}
      function renderPop(side){const list=side==="top"?$("list-top"):$("list-bot");const selected=side==="top"?topLang:botLang;list.innerHTML=LANGS.map(l=>`<div class="pop-item ${l.code===selected?"active":""}" data-select-code="${l.code}"><div class="pop-left"><div class="pop-flag">${l.flag}</div><div class="pop-name">${l.name}</div></div><div class="pop-code">${l.code.toUpperCase()}</div></div>`).join("");list.querySelectorAll(".pop-item").forEach(item=>{item.onclick=(e)=>{e.stopPropagation();const code=item.getAttribute("data-select-code");if(side==="top")topLang=code;else botLang=code;if(topLang===botLang)topLang=code==="tr"?"en":"tr";closeAllPops();refreshTexts()}})}
      $("topLangBtn").onclick=(e)=>{e.stopPropagation();renderPop("top");$("pop-top").classList.add("show");$("pop-bot").classList.remove("show")};
      $("botLangBtn").onclick=(e)=>{e.stopPropagation();renderPop("bot");$("pop-bot").classList.add("show");$("pop-top").classList.remove("show")};
      document.onclick=(e)=>{if(!$("pop-top").contains(e.target)&&!$("pop-bot").contains(e.target)&&!e.target.closest(".lang-trigger"))closeAllPops()};
      function clearBody(body){if(body)body.innerHTML=""}
      function addBubble(side,text,latest=false){const body=side==="top"?topBody:botBody;if(!body)return null;if(latest)body.querySelectorAll(".bubble.latest").forEach(x=>x.classList.remove("latest"));const div=document.createElement("div");div.className=`bubble${latest?" latest":""}`;div.textContent=String(text||"").trim();body.appendChild(div);const scroll=()=>{try{body.scrollTop=body.scrollHeight}catch(e){}};scroll();requestAnimationFrame(scroll);setTimeout(scroll,60);return div}
      function clearChat(){try{stopRecognizer()}catch(e){}try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}liveText="";recordingSide=null;topMic.classList.remove("listening");botMic.classList.remove("listening");clearBody(topBody);clearBody(botBody)}
      $("sideClearBtn").onclick=clearChat;$("backBtn").onclick=()=>{location.href="/pages/login_ios.html"};$("close-top").onclick=closeAllPops;$("close-bot").onclick=closeAllPops;
      function setMicState(side,listening){(side==="top"?topMic:botMic).classList.toggle("listening",!!listening)}
      function handleMicClick(side){if(recordingSide===side)stopRecognizer();else startRecording(side)}
      function startRecording(side){if(recordingSide)stopRecognizer();recordingSide=side;setMicState(side,true);liveText="";const bcp=langObj(side==="top"?topLang:botLang).bcp;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast(tx("micUnsupported"));setMicState(side,false);recordingSide=null;return}try{const rec=new SR();window.webRecognizer=rec;rec.lang=bcp;rec.continuous=false;rec.interimResults=true;rec.onresult=(event)=>{let finalTranscript="",interimTranscript="";for(let i=event.resultIndex;i<event.results.length;i++){if(event.results[i].isFinal)finalTranscript+=event.results[i][0].transcript;else interimTranscript+=event.results[i][0].transcript}if(finalTranscript)handleSpeechResult(side,finalTranscript,true);else if(interimTranscript)handleSpeechResult(side,interimTranscript,false)};rec.onerror=(e)=>handleSpeechError(e.error||"unknown");rec.onend=()=>{if(recordingSide===side){setMicState(side,false);recordingSide=null}};rec.start()}catch(e){handleSpeechError("start_error")}}
      function stopRecognizer(){if(!recordingSide)return;setMicState(recordingSide,false);recordingSide=null;if(window.webRecognizer){try{window.webRecognizer.stop()}catch(e){}window.webRecognizer=null}}
      function cleanupTranscript(text){return String(text||"").replace(/\s+/g," ").replace(/\b(\S+)( \1\b)+/gi,"$1").trim()}
      function handleSpeechError(errorMsg){setMicState("top",false);setMicState("bot",false);recordingSide=null;if(errorMsg==="not-allowed")showToast(tx("micDenied"));else if(errorMsg!=="no-speech")showToast(tx("micError")+" ("+errorMsg+")")}
      function handleSpeechResult(side,text,isFinal){liveText=cleanupTranscript(text);if(isFinal){setMicState(side,false);recordingSide=null;if(liveText)finalizeSpeech(side,liveText);const body=side==="top"?topBody:botBody;const activeBubble=body&&body.querySelector(".bubble.latest");if(activeBubble&&activeBubble.textContent.endsWith("..."))activeBubble.remove()}else{const body=side==="top"?topBody:botBody;if(!body)return;let activeBubble=body.querySelector(".bubble.latest");if(!activeBubble){activeBubble=document.createElement("div");activeBubble.className="bubble latest";body.appendChild(activeBubble)}activeBubble.textContent=liveText+"...";try{body.scrollTop=body.scrollHeight}catch(e){}}}
      async function translateOnline(text,from,to){const endpoints=[`${API_BASE}/api/translate_ai`,`${API_BASE}/api/translate-ai`,`${API_BASE}/api/translate`];for(const endpoint of endpoints){try{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:String(text||"").trim(),from_lang:canonical(from),to_lang:canonical(to),source:canonical(from),target:canonical(to),mode:"normal",use_ai:false,cultural:false,tone:"neutral",style:"warm"})});const j=await r.json().catch(()=>null);const value=String((j&&j.translated)||(j&&j.translation)||(j&&j.text)||"").trim();if(r.ok&&value)return value}catch(e){}}return null}
      function speak(text,langCode){const value=String(text||"").trim();if(!value)return;const code=canonical(langCode);const bcp=langObj(code).bcp;try{if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang=bcp;u.rate=.95;u.pitch=1;u.volume=1;isSpeaking=true;u.onend=()=>{isSpeaking=false};window.speechSynthesis.speak(u);setTimeout(()=>{isSpeaking=false},Math.max(3000,value.length*80))}}catch(e){isSpeaking=false}}
      async function finalizeSpeech(side,text){const clean=cleanupTranscript(text);if(!clean){liveText="";setMicState(side,false);return}const src=side==="top"?topLang:botLang;const dst=side==="top"?botLang:topLang;const other=side==="top"?"bot":"top";addBubble(side,clean,false);const targetRow=addBubble(other,"",true);const translated=await translateOnline(clean,src,dst);if(!translated){if(targetRow)targetRow.textContent=tx("translateError");liveText="";setMicState(side,false);return}targetRow.textContent=translated;speak(translated,dst);liveText="";setMicState(side,false)}
      topMic.onclick=()=>handleMicClick("top");botMic.onclick=()=>handleMicClick("bot");
      function boot(){const saved=localStorage.getItem(SITE_LANG_KEY);const browser=canonical(navigator.language||"tr");SITE_LANG=saved||((LANGS.some(l=>l.code===browser))?browser:"tr");localStorage.setItem(SITE_LANG_KEY,SITE_LANG);botLang=SITE_LANG;topLang=botLang==="tr"?"en":"tr";refreshTexts()}
      boot();
    })();
  </script>
</body>
</html>
