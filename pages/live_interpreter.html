<!-- FILE: /pages/live_interpreter.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>italkyAI • Live Interpreter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --ai-grad: linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#ec4899 100%);
      --txt: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.10);
      --glass: rgba(255,255,255,.05);
      --glass-2: rgba(255,255,255,.04);
      --host-bg: rgba(96,165,250,.14);
      --guest-bg: rgba(34,197,94,.14);
      --host-line: rgba(96,165,250,.26);
      --guest-line: rgba(34,197,94,.22);
      --bg:
        radial-gradient(circle at 50% 14%, rgba(99,102,241,.18) 0%, rgba(0,0,0,0) 30%),
        radial-gradient(circle at 50% 0%, rgba(236,72,153,.10) 0%, rgba(0,0,0,0) 22%),
        linear-gradient(180deg,#090919 0%, #020207 100%);
      --ok:#22c55e;
      --warn:#f59e0b;
      --err:#ef4444;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#000;
      color:var(--txt);
      font-family:'Outfit',sans-serif;
      overflow:hidden;
    }

    body{
      background:var(--bg);
    }

    .page{
      width:100%;
      min-height:100dvh;
      max-width:560px;
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 14px)
        14px
        calc(env(safe-area-inset-bottom) + 16px);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .topCard{
      border-radius:28px;
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:0 20px 50px rgba(0,0,0,.24);
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .brandRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      font-family:'Space Grotesk',sans-serif;
      font-size:24px;
      font-weight:700;
      letter-spacing:-.4px;
      margin:0;
    }

    .brand .ai{
      background:var(--ai-grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .roleBadge{
      min-height:34px;
      padding:0 14px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.25px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .title{
      margin:0;
      font-size:22px;
      font-weight:900;
      letter-spacing:-.45px;
    }

    .sub{
      margin:0;
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .chatCard{
      flex:1;
      min-height:0;
      border-radius:30px;
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:0 20px 50px rgba(0,0,0,.22);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .chatHead{
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:rgba(255,255,255,.03);
    }

    .chatHeadTitle{
      font-size:12px;
      font-weight:900;
      letter-spacing:.35px;
      color:#a5b4fc;
      text-transform:uppercase;
    }

    .roomMeta{
      font-size:12px;
      font-weight:800;
      color:rgba(255,255,255,.72);
      text-align:right;
      word-break:break-all;
    }

    #chat-log{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      scrollbar-width:none;
    }

    #chat-log::-webkit-scrollbar{
      display:none;
    }

    .msg{
      max-width:84%;
      padding:12px 14px;
      border-radius:20px;
      font-size:14px;
      line-height:1.45;
      word-break:break-word;
      border:1px solid transparent;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
    }

    .host-msg{
      align-self:flex-start;
      background:var(--host-bg);
      border-color:var(--host-line);
      color:#fff;
    }

    .guest-msg{
      align-self:flex-end;
      background:var(--guest-bg);
      border-color:var(--guest-line);
      color:#fff;
    }

    .sys-msg{
      align-self:center;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.76);
      font-size:12px;
      border-radius:16px;
      padding:10px 12px;
      max-width:92%;
      text-align:center;
    }

    .bottomBar{
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:var(--glass-2);
      padding:12px 14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .statusDot{
      width:11px;
      height:11px;
      border-radius:50%;
      background:var(--warn);
      box-shadow:0 0 14px rgba(245,158,11,.55);
      flex:0 0 auto;
    }

    .statusDot.ok{
      background:var(--ok);
      box-shadow:0 0 14px rgba(34,197,94,.55);
    }

    .statusDot.err{
      background:var(--err);
      box-shadow:0 0 14px rgba(239,68,68,.55);
    }

    #ws-status{
      flex:1;
      font-size:13px;
      font-weight:800;
      line-height:1.45;
      color:#fff;
    }

    .emptyState{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      padding:24px;
    }
  </style>
</head>

<body>
  <div class="page">

    <section class="topCard">
      <div class="brandRow">
        <h1 class="brand">italky<span class="ai">AI</span></h1>
        <div id="role-badge" class="roleBadge">Interpreter</div>
      </div>

      <h2 id="room-title" class="title">Canlı Tercüme</h2>
      <p class="sub">
        Bu ekran aynı room içinde iki tarafın gerçek zamanlı tercüme akışını gösterir. Bağlantı kurulduğunda mesajlar burada akacaktır.
      </p>
    </section>

    <section class="chatCard">
      <div class="chatHead">
        <div class="chatHeadTitle">Live Room</div>
        <div class="roomMeta" id="room-meta-text">Room hazırlanıyor...</div>
      </div>

      <div id="chat-log">
        <div class="emptyState" id="empty-state">
          Henüz mesaj yok. WebSocket bağlandıktan sonra canlı akış burada görünecek.
        </div>
      </div>
    </section>

    <div class="bottomBar">
      <span id="status-dot" class="statusDot"></span>
      <div id="ws-status">WebSocket bağlanıyor...</div>
    </div>

  </div>

  <script src="/js/live_interpreter_page.js"></script>
</body>
</html>
