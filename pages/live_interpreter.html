<!-- FILE: /pages/live_interpreter.html -->
<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>italkyAI • Live Interpreter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --bg:
        radial-gradient(circle at 50% 0%, rgba(82, 38, 255, .22) 0%, transparent 24%),
        radial-gradient(circle at 12% 18%, rgba(0, 214, 201, .12) 0%, transparent 22%),
        radial-gradient(circle at 88% 20%, rgba(255, 77, 166, .12) 0%, transparent 22%),
        linear-gradient(180deg, #070915 0%, #080613 45%, #04050c 100%);

      --panel: rgba(255,255,255,.055);
      --panel-2: rgba(255,255,255,.04);
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.16);

      --txt: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.58);

      --cyan: #00d6c9;
      --violet: #7c5cff;
      --pink: #ff4da6;
      --amber: #ffb648;

      --grad-main: linear-gradient(135deg, #00d6c9 0%, #7c5cff 52%, #ff4da6 100%);
      --grad-soft: linear-gradient(135deg, rgba(0,214,201,.16) 0%, rgba(124,92,255,.15) 52%, rgba(255,77,166,.16) 100%);

      --me-bg: linear-gradient(135deg, rgba(0,214,201,.16) 0%, rgba(124,92,255,.18) 100%);
      --peer-bg: linear-gradient(135deg, rgba(124,92,255,.16) 0%, rgba(255,77,166,.16) 100%);

      --shadow: 0 20px 50px rgba(0,0,0,.28);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;

      --topH: 45%;
      --midH: 74px;
      --composerH: 104px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:'Outfit',sans-serif;
      background:#000;
      color:var(--txt);
      scrollbar-width:none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar{
      display:none;
    }

    body{
      background:var(--bg);
    }

    button,input{
      font:inherit;
    }

    .page{
      width:100%;
      height:100dvh;
      max-width:580px;
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        12px
        calc(env(safe-area-inset-bottom) + 12px);
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:10px;
    }

    /* =========================
       TOP CONTROL BAR
    ========================= */
    .topControls{
      border:1px solid var(--line);
      background:var(--panel);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow);
      border-radius:26px;
      padding:10px;
      display:grid;
      grid-template-columns:1fr 1fr 1fr auto;
      gap:8px;
      align-items:center;
    }

    .pillBtn{
      min-height:44px;
      border:none;
      border-radius:16px;
      padding:0 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      cursor:pointer;
    }

    .pillBtn:active{
      transform:scale(.985);
    }

    .pillBtn.mute{
      min-width:44px;
      width:44px;
      padding:0;
      border-radius:14px;
    }

    .pillBtn svg{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.1;
      stroke-linecap:round;
      stroke-linejoin:round;
      flex:0 0 auto;
    }

    .pillBtn.mute.is-muted{
      color:#ffb648;
      border-color:rgba(255,182,72,.35);
      box-shadow:0 0 0 1px rgba(255,182,72,.12) inset;
    }

    /* =========================
       MAIN SHELL
    ========================= */
    .shell{
      min-height:0;
      border:1px solid var(--line);
      background:var(--panel);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      box-shadow:var(--shadow);
      border-radius:34px;
      overflow:hidden;
      display:grid;
      grid-template-rows:1fr var(--midH) 1fr auto;
    }

    /* =========================
       PANELS
    ========================= */
    .panel{
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    .panel.peer{
      background:
        radial-gradient(circle at 85% 10%, rgba(255,77,166,.08) 0%, transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .panel.me{
      background:
        radial-gradient(circle at 15% 82%, rgba(0,214,201,.08) 0%, transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.01), rgba(255,255,255,.02));
    }

    .panelHead{
      flex:0 0 auto;
      padding:12px 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.025);
    }

    .panelTitle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.35px;
      text-transform:uppercase;
    }

    .panelTitle .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      flex:0 0 auto;
    }

    .peer .panelTitle .dot{
      background:var(--pink);
      box-shadow:0 0 12px rgba(255,77,166,.55);
    }

    .me .panelTitle .dot{
      background:var(--cyan);
      box-shadow:0 0 12px rgba(0,214,201,.55);
    }

    .panelMeta{
      font-size:11px;
      font-weight:800;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:52%;
      text-align:right;
    }

    .msgList{
      flex:1;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      gap:10px;
      padding:14px;
      scrollbar-width:none;
    }

    .msgList::-webkit-scrollbar{
      display:none;
    }

    .emptyState{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      padding:22px;
    }

    /* =========================
       MESSAGES
    ========================= */
    .bubble{
      align-self:flex-start;
      width:auto;
      max-width:88%;
      border-radius:24px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 26px rgba(0,0,0,.16);
      transition:opacity .2s ease, transform .2s ease, filter .2s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .peer .bubble{
      background:var(--peer-bg);
    }

    .me .bubble{
      background:var(--me-bg);
      align-self:flex-end;
    }

    .bubble.is-latest{
      opacity:1;
      transform:translateY(0);
      filter:none;
      border-color:rgba(255,255,255,.14);
    }

    .bubble.is-old-1{
      opacity:.78;
      transform:scale(.986);
    }

    .bubble.is-old-2{
      opacity:.58;
      transform:scale(.972);
    }

    .bubble.is-old-3{
      opacity:.38;
      transform:scale(.958);
    }

    .bubbleRow{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .bubbleText{
      flex:1;
      min-width:0;
      line-height:1.42;
      word-break:break-word;
      white-space:pre-wrap;
    }

    .bubble.is-latest .bubbleText{
      font-size:22px;
      font-weight:800;
      letter-spacing:-.2px;
      line-height:1.32;
    }

    .bubble:not(.is-latest) .bubbleText{
      font-size:14px;
      font-weight:600;
      line-height:1.42;
    }

    .spkBtn{
      width:34px;
      height:34px;
      border-radius:50%;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      cursor:pointer;
      color:#fff;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      margin-top:2px;
    }

    .spkBtn:active{
      transform:scale(.96);
    }

    .spkBtn svg{
      width:16px;
      height:16px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.1;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .sysBubble{
      align-self:center;
      max-width:92%;
      border-radius:18px;
      padding:10px 12px;
      font-size:12px;
      font-weight:800;
      color:rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      text-align:center;
    }

    /* =========================
       MIDDLE BAR
    ========================= */
    .midBar{
      border-top:1px solid rgba(255,255,255,.06);
      border-bottom:1px solid rgba(255,255,255,.06);
      display:grid;
      grid-template-columns:82px 1fr 82px;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
    }

    .midAction{
      min-height:42px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    .midAction:active{
      transform:scale(.985);
    }

    .midBrand{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-family:'Space Grotesk',sans-serif;
      font-size:22px;
      font-weight:700;
      letter-spacing:-.4px;
    }

    .midBrand .ai{
      background:var(--grad-main);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    /* =========================
       COMPOSER
    ========================= */
    .composer{
      border-top:1px solid rgba(255,255,255,.06);
      padding:12px;
      display:grid;
      grid-template-columns:54px 1fr 54px;
      gap:10px;
      align-items:end;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.04));
    }

    .micBtn,
    .sendBtn{
      width:54px;
      height:54px;
      border:none;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#fff;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 12px 24px rgba(0,0,0,.16);
      position:relative;
    }

    .micBtn{
      background:linear-gradient(135deg, rgba(0,214,201,.22), rgba(124,92,255,.22));
    }

    .sendBtn{
      background:linear-gradient(135deg, rgba(124,92,255,.22), rgba(255,77,166,.22));
    }

    .micBtn svg,
    .sendBtn svg{
      width:22px;
      height:22px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .micBtn:active,
    .sendBtn:active{
      transform:scale(.97);
    }

    .micBtn.listening{
      box-shadow:
        0 0 0 1px rgba(255,77,166,.28) inset,
        0 0 24px rgba(255,77,166,.35);
    }

    .micBtn.listening::after,
    .micBtn.listening::before{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:22px;
      border:1px solid rgba(255,77,166,.34);
      animation:micPulse 1.5s ease-out infinite;
    }

    .micBtn.listening::before{
      animation-delay:.5s;
    }

    @keyframes micPulse{
      0%{ transform:scale(1); opacity:.9; }
      100%{ transform:scale(1.14); opacity:0; }
    }

    .textWrap{
      min-height:54px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      padding:0 14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }

    .textInput{
      width:100%;
      min-height:54px;
      max-height:116px;
      resize:none;
      border:none;
      background:transparent;
      color:#fff;
      font-size:15px;
      font-weight:600;
      line-height:1.4;
      padding:16px 0 14px;
      overflow:auto;
      scrollbar-width:none;
    }

    .textInput::-webkit-scrollbar{
      display:none;
    }

    .textInput::placeholder{
      color:rgba(255,255,255,.42);
      font-weight:600;
    }

    /* =========================
       POPUPS
    ========================= */
    .pop{
      position:fixed;
      inset:auto 12px 12px 12px;
      z-index:9999;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(8,10,20,.96);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:0 24px 60px rgba(0,0,0,.34);
      padding:12px;
      display:none;
      flex-direction:column;
      gap:10px;
      max-height:52vh;
    }

    .pop.show{
      display:flex;
    }

    .popHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:4px 4px 0;
    }

    .popTitle{
      font-size:13px;
      font-weight:900;
      letter-spacing:.4px;
      text-transform:uppercase;
      color:#fff;
    }

    .popClose{
      width:36px;
      height:36px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,.07);
      color:#fff;
      cursor:pointer;
      font-weight:900;
    }

    .popList{
      min-height:0;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      scrollbar-width:none;
    }

    .popList::-webkit-scrollbar{
      display:none;
    }

    .popItem{
      min-height:54px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 14px;
      color:#fff;
      cursor:pointer;
      font-size:14px;
      font-weight:800;
    }

    .popItem.active{
      border-color:rgba(0,214,201,.30);
      box-shadow:0 0 0 1px rgba(0,214,201,.12) inset;
      background:linear-gradient(135deg, rgba(0,214,201,.12), rgba(124,92,255,.10));
    }

    .popLeft{
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .popFlag{
      font-size:18px;
    }

    .popName{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .popCode{
      color:rgba(255,255,255,.58);
      font-size:12px;
      font-weight:900;
      letter-spacing:.45px;
    }

    @media (max-width:420px){
      .topControls{
        grid-template-columns:1fr 1fr;
      }

      .pillBtn.mute{
        width:100%;
      }

      .bubble.is-latest .bubbleText{
        font-size:20px;
      }

      .midBrand{
        font-size:20px;
      }

      .midBar{
        grid-template-columns:72px 1fr 72px;
      }

      .midAction{
        font-size:11px;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- TOP CONTROL BAR -->
    <div class="topControls">
      <button id="myLangBtn" class="pillBtn" type="button">
        <span id="myLangTxt">🌐 Dil</span>
      </button>

      <button id="peerLangBtn" class="pillBtn" type="button">
        <span id="peerLangTxt">🌐 Karşı</span>
      </button>

      <button id="voiceBtn" class="pillBtn" type="button">
        <span id="voiceTxt">Ses Seç</span>
      </button>

      <button id="muteBtn" class="pillBtn mute" type="button" aria-label="Mute">
        <svg viewBox="0 0 24 24">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
          <path d="M22 9 16 15"></path>
          <path d="M16 9 22 15"></path>
        </svg>
      </button>
    </div>

    <!-- MAIN SHELL -->
    <div class="shell">

      <!-- PEER PANEL -->
      <section class="panel peer">
        <div class="panelHead">
          <div class="panelTitle">
            <span class="dot"></span>
            <span>Karşı Taraf</span>
          </div>
          <div id="roomMetaText" class="panelMeta">Room hazırlanıyor...</div>
        </div>

        <div id="peerList" class="msgList">
          <div id="peerEmpty" class="emptyState">
            Karşı tarafın konuşmaları ve sana çevrilmiş mesajlar burada görünecek.
          </div>
        </div>
      </section>

      <!-- MIDDLE BAR -->
      <div class="midBar">
        <button id="clearBtn" class="midAction" type="button">Temizle</button>
        <div class="midBrand">italky<span class="ai">AI</span></div>
        <button id="homeBtn" class="midAction" type="button">Ana Sayfa</button>
      </div>

      <!-- ME PANEL -->
      <section class="panel me">
        <div class="panelHead">
          <div class="panelTitle">
            <span class="dot"></span>
            <span>Sen</span>
          </div>
          <div id="statusText" class="panelMeta">Bağlantı hazırlanıyor...</div>
        </div>

        <div id="meList" class="msgList">
          <div id="meEmpty" class="emptyState">
            Senin konuşmaların ve yazdığın mesajlar burada görünecek.
          </div>
        </div>
      </section>

      <!-- COMPOSER -->
      <div class="composer">
        <button id="micBtn" class="micBtn" type="button" aria-label="Mikrofon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2v10"></path>
            <rect x="8" y="2" width="8" height="12" rx="4"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v4"></path>
            <path d="M8 22h8"></path>
          </svg>
        </button>

        <div class="textWrap">
          <textarea
            id="textInput"
            class="textInput"
            rows="1"
            placeholder="Yaz veya mikrofona dokun..."
          ></textarea>
        </div>

        <button id="sendBtn" class="sendBtn" type="button" aria-label="Gönder">
          <svg viewBox="0 0 24 24">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22l-4-9-9-4 20-7Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- MY LANG POP -->
  <div id="myLangPop" class="pop">
    <div class="popHead">
      <div class="popTitle">Benim Dilim</div>
      <button id="closeMyLang" class="popClose" type="button">✕</button>
    </div>
    <div id="myLangList" class="popList"></div>
  </div>

  <!-- PEER LANG POP -->
  <div id="peerLangPop" class="pop">
    <div class="popHead">
      <div class="popTitle">Karşı Dil</div>
      <button id="closePeerLang" class="popClose" type="button">✕</button>
    </div>
    <div id="peerLangList" class="popList"></div>
  </div>

  <!-- VOICE POP -->
  <div id="voicePop" class="pop">
    <div class="popHead">
      <div class="popTitle">Ses Seçimi</div>
      <button id="closeVoice" class="popClose" type="button">✕</button>
    </div>
    <div id="voiceList" class="popList"></div>
  </div>

  <script type="module" src="/js/live_interpreter_page.js"></script>
</body>
</html>
