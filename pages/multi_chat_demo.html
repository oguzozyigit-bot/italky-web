<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<meta name="theme-color" content="#07111f" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#07111f;
  --panel:rgba(255,255,255,.07);
  --panel-strong:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.12);
  --text:#f7fbff;
  --muted:rgba(236,246,255,.68);
  --blue:#36c7f4;
  --green:#45d39d;
  --danger:#fb7185;
  --shadow:0 16px 44px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#050b14;color:var(--text);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
body{visibility:hidden} body.ready{visibility:visible}
button,input{font:inherit}
button{cursor:pointer}
#pageContent{height:100%;min-height:100%;padding:10px;overflow:hidden}
.multi-chat-page{height:100%;min-height:0;display:flex;flex-direction:column;gap:8px}
.mc-card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.045));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px}
.mc-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 0%,rgba(54,199,244,.14),transparent 34%),radial-gradient(circle at 90% 18%,rgba(69,211,157,.10),transparent 30%)}
.view{display:none;min-height:0;position:relative;z-index:1}.view.active{display:flex}
.landing{flex:1;flex-direction:column;justify-content:center;gap:12px;padding:12px 2px}.hero-card{padding:20px 16px 16px;display:flex;flex-direction:column;gap:13px}.hero-top{display:flex;align-items:center;gap:12px}.logo-orb{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.38),transparent 28%),linear-gradient(135deg,#0ea5e9,#0f766e);box-shadow:0 0 26px rgba(54,199,244,.22);font-family:"Space Grotesk",sans-serif;font-weight:900;color:#fff;letter-spacing:-.5px;flex:0 0 auto}.title-wrap{min-width:0}.kicker{font-size:10px;font-weight:1000;letter-spacing:.7px;text-transform:uppercase;color:rgba(125,211,252,.88);margin-bottom:4px}h1{margin:0;font-family:"Space Grotesk",sans-serif;font-size:27px;line-height:1;letter-spacing:-.7px}.subtitle{margin:0;color:var(--muted);font-size:14px;line-height:1.35;font-weight:700}
.lang-box{padding:11px;border-radius:17px;border:1px solid rgba(255,255,255,.09);background:rgba(3,10,20,.36);display:grid;gap:8px}.lang-label{font-size:11px;font-weight:900;color:rgba(236,246,255,.65);text-transform:uppercase;letter-spacing:.35px}.language-open{min-height:44px;border:1px solid rgba(255,255,255,.11);border-radius:15px;background:rgba(255,255,255,.07);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary-btn,.secondary-btn,.ghost-btn,.icon-btn{border:0;color:#fff;font-weight:1000}.primary-btn,.secondary-btn{min-height:52px;border-radius:17px;padding:0 14px}.primary-btn{background:linear-gradient(135deg,#0284c7,#0f766e);box-shadow:0 15px 28px rgba(14,165,233,.20)}.secondary-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.ghost-btn{background:transparent;color:rgba(236,246,255,.82);min-height:40px;border-radius:14px;padding:0 12px;border:1px solid rgba(255,255,255,.08)}.join-panel{display:none;gap:8px;align-items:center;padding:9px;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.join-panel.show{display:grid;grid-template-columns:1fr auto}.code-input{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(2,6,23,.48);color:#fff;text-align:center;font-size:22px;font-weight:1000;letter-spacing:4px;outline:0}.status-line{min-height:20px;color:rgba(236,246,255,.72);font-size:12px;font-weight:800;text-align:center}.status-line.error{color:#fecdd3}
.room{flex:1;min-height:0;flex-direction:column;gap:7px}.room-top{padding:8px 9px;display:grid;gap:7px;flex:0 0 auto}.room-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.room-code-wrap{display:flex;align-items:center;gap:7px;min-width:0}.room-code{font-size:18px;font-family:"Space Grotesk",sans-serif;font-weight:900;letter-spacing:1.1px;color:#e0f7ff;white-space:nowrap}.copy-btn,.exit-btn,.language-chip{height:33px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.065);color:#fff;font-weight:900;padding:0 10px;white-space:nowrap}.copy-btn{width:36px;padding:0;font-size:15px}.exit-btn{color:#f7fbff}.participant-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.participants{display:flex;align-items:center;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none;max-width:100%}.participants::-webkit-scrollbar{display:none}.avatar{width:29px;height:29px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent,rgba(54,199,244,.42)),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.15);font-size:10px;font-weight:1000;color:#fff;flex:0 0 auto}.count-pill,.lang-pill{min-height:28px;border-radius:999px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);font-size:10px;font-weight:1000;color:rgba(236,246,255,.86);white-space:nowrap}.room-status{font-size:11px;color:rgba(236,246,255,.66);font-weight:800;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-shell{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;overflow:hidden}.chat-list{flex:1;min-height:0;overflow-y:auto;padding:9px 9px 8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}.chat-list::-webkit-scrollbar{display:none}.empty-chat{margin:auto;text-align:center;color:rgba(236,246,255,.56);font-weight:800;font-size:12px;line-height:1.35;padding:14px}.msg{max-width:min(86%,620px);display:grid;grid-template-columns:30px minmax(0,1fr);gap:7px;align-items:end}.msg.me{align-self:flex-end;grid-template-columns:minmax(0,1fr) 30px}.msg.other{align-self:flex-start}.msg .avatar{align-self:end}.msg.me .avatar{grid-column:2}.msg-body{min-width:0}.msg.me .msg-body{grid-column:1;grid-row:1;text-align:right}.msg-head{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:950;color:rgba(236,246,255,.64);padding:0 4px 3px}.msg.me .msg-head{justify-content:flex-end}.bubble-row{display:flex;align-items:flex-end;gap:5px}.msg.me .bubble-row{justify-content:flex-end}.bubble{border:1px solid color-mix(in srgb,var(--accent,#36c7f4) 42%,rgba(255,255,255,.10));border-radius:17px;padding:9px 11px;font-size:14px;line-height:1.32;font-weight:760;word-break:break-word;white-space:pre-wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--accent,#36c7f4) 30%,rgba(255,255,255,.08)),rgba(255,255,255,.06))}.msg.me .bubble{border-bottom-right-radius:6px}.msg.other .bubble{border-bottom-left-radius:6px}.speaker-btn{width:30px;height:30px;border:1px solid rgba(255,255,255,.10);border-radius:11px;background:rgba(255,255,255,.07);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 auto}.translation-note{font-size:9px;color:rgba(236,246,255,.45);font-weight:850;padding:3px 4px 0}.system-msg{align-self:center;max-width:86%;padding:6px 10px;border-radius:999px;background:rgba(148,163,184,.13);border:1px solid rgba(148,163,184,.15);color:rgba(226,232,240,.72);font-size:11px;font-weight:850;text-align:center}.composer{flex:0 0 auto;padding:7px;display:grid;grid-template-columns:auto 1fr auto;gap:7px;border-top:1px solid rgba(255,255,255,.08);background:rgba(2,6,23,.26)}.icon-btn{width:39px;height:39px;border-radius:14px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.10);display:grid;place-items:center;font-size:16px}.icon-btn.recording{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.42)}.message-input{height:39px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;padding:0 12px;outline:0;font-size:14px;font-weight:760;min-width:0}.message-input::placeholder{color:rgba(236,246,255,.42)}.send-btn{min-width:60px;height:39px;border-radius:14px;border:0;background:linear-gradient(135deg,#0284c7,#0f766e);color:#fff;font-weight:1000}
.lang-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:flex-end;justify-content:center;background:rgba(2,6,23,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px}.lang-modal.show{display:flex}.lang-sheet{width:min(520px,100%);max-height:min(78vh,640px);display:flex;flex-direction:column;border-radius:22px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(2,6,23,.96));box-shadow:0 24px 70px rgba(0,0,0,.48);overflow:hidden}.lang-sheet-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}.lang-sheet-title{font-weight:1000}.lang-close{width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.08);color:#fff;font-weight:1000}.lang-list{overflow:auto;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.lang-option{min-height:42px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);color:#fff;border-radius:14px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900}.lang-option.active{border-color:rgba(54,199,244,.62);background:linear-gradient(135deg,rgba(54,199,244,.20),rgba(69,211,157,.10))}.mini-toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:10001;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.22s ease;background:rgba(2,6,23,.92);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;color:#fff;font-size:12px;font-weight:900;box-shadow:0 16px 36px rgba(0,0,0,.34);max-width:min(86vw,360px);text-align:center}.mini-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){#pageContent{padding:8px}.hero-card{padding:17px 13px 13px;border-radius:20px}h1{font-size:24px}.subtitle{font-size:13px}.logo-orb{width:50px;height:50px;border-radius:18px}.action-grid{grid-template-columns:1fr;gap:8px}.primary-btn,.secondary-btn{min-height:48px}.room-top{padding:7px 8px}.room-code{font-size:16px;letter-spacing:.8px}.copy-btn,.exit-btn,.language-chip{height:31px;border-radius:11px;padding:0 8px;font-size:11px}.copy-btn{width:32px}.room-status{max-width:58vw}.msg{max-width:92%;grid-template-columns:27px minmax(0,1fr);gap:6px}.msg.me{grid-template-columns:minmax(0,1fr) 27px}.msg .avatar{width:27px;height:27px;border-radius:10px;font-size:9px}.bubble{font-size:13px;padding:8px 10px}.speaker-btn{width:28px;height:28px;border-radius:10px}.composer{padding:6px;gap:6px}.icon-btn,.message-input,.send-btn{height:38px}.icon-btn{width:38px}.send-btn{min-width:54px;font-size:12px}.lang-list{grid-template-columns:1fr}.lang-modal{padding:10px}}
</style>
</head>
<body>
<main id="pageContent">
  <div class="multi-chat-page">
    <section id="landingView" class="view landing active">
      <div class="mc-card hero-card">
        <div class="hero-top">
          <div class="logo-orb" data-no-translate="1">ÇS</div>
          <div class="title-wrap">
            <div class="kicker">Deneme Modülü</div>
            <h1>Çoklu Sohbet</h1>
          </div>
        </div>
        <p class="subtitle">Kod ile oda oluşturun veya mevcut sohbete katılın.</p>
        <div class="lang-box">
          <div class="lang-label">Sohbet dilim</div>
          <button id="openLangBtn" class="language-open" type="button"><span id="selectedLangLabel">Türkçe</span><span>Değiştir</span></button>
        </div>
        <div class="action-grid">
          <button id="createRoomBtn" class="primary-btn" type="button">Sohbet Oluştur</button>
          <button id="showJoinBtn" class="secondary-btn" type="button">Sohbete Katıl</button>
        </div>
        <div id="joinPanel" class="join-panel">
          <input id="roomCodeInput" class="code-input" inputmode="numeric" maxlength="7" autocomplete="one-time-code" placeholder="482 913" />
          <button id="joinRoomBtn" class="primary-btn" type="button">Katıl</button>
        </div>
        <div id="landingStatus" class="status-line" aria-live="polite"></div>
      </div>
    </section>

    <section id="roomView" class="view room">
      <div class="mc-card room-top">
        <div class="room-line">
          <div class="room-code-wrap">
            <div class="room-code" id="roomCodeLabel">---</div>
            <button id="copyCodeBtn" class="copy-btn" type="button" aria-label="Kodu kopyala">⧉</button>
          </div>
          <div class="room-code-wrap">
            <button id="roomLangBtn" class="language-chip" type="button">TR</button>
            <button id="backBtn" class="exit-btn" type="button">← Çık</button>
          </div>
        </div>
        <div class="participant-row">
          <div id="participants" class="participants" aria-label="Katılımcılar"></div>
          <div class="count-pill" id="participantCount">1 kişi</div>
        </div>
        <div id="roomStatus" class="room-status">Bağlantı hazırlanıyor...</div>
      </div>
      <div class="mc-card chat-shell">
        <div id="chatList" class="chat-list">
          <div class="empty-chat">Mesajlar burada görünecek. Oda kodunu diğer cihazda açıp aynı koda katılabilirsiniz.</div>
        </div>
        <div class="composer">
          <button id="micBtn" class="icon-btn" type="button" aria-label="Mikrofon">🎙</button>
          <input id="messageInput" class="message-input" type="text" placeholder="Mesaj yaz..." autocomplete="off" />
          <button id="sendBtn" class="send-btn" type="button">Gönder</button>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="langModal" class="lang-modal" aria-hidden="true">
  <div class="lang-sheet" role="dialog" aria-modal="true" aria-label="Dil seçimi">
    <div class="lang-sheet-head">
      <div class="lang-sheet-title">Sohbet dilini seç</div>
      <button id="closeLangBtn" class="lang-close" type="button">×</button>
    </div>
    <div id="langList" class="lang-list"></div>
  </div>
</div>
<div id="miniToast" class="mini-toast"></div>

<script type="module">
import { mountShell } from "/js/ui_shell.js";

const API_BASE = "https://italky-api.onrender.com";
const WS_BASE = API_BASE.replace(/^http/i, "ws");
const PEER_KEY = "italky_multi_chat_demo_peer_v2";
const NAME_KEY = "italky_multi_chat_demo_name_v1";
const LANG_KEY = "italky_multi_chat_demo_lang_v1";
const FALLBACK_LANGUAGES = [
  { code:"tr", name:"Türkçe", flag:"🇹🇷" }, { code:"en", name:"İngilizce", flag:"🇬🇧" }, { code:"de", name:"Almanca", flag:"🇩🇪" },
  { code:"fr", name:"Fransızca", flag:"🇫🇷" }, { code:"es", name:"İspanyolca", flag:"🇪🇸" }, { code:"it", name:"İtalyanca", flag:"🇮🇹" },
  { code:"ar", name:"Arapça", flag:"🇸🇦" }, { code:"ru", name:"Rusça", flag:"🇷🇺" }, { code:"pt", name:"Portekizce", flag:"🇵🇹" },
  { code:"nl", name:"Felemenkçe", flag:"🇳🇱" }, { code:"el", name:"Yunanca", flag:"🇬🇷" }, { code:"zh", name:"Çince", flag:"🇨🇳" },
  { code:"ja", name:"Japonca", flag:"🇯🇵" }, { code:"ko", name:"Korece", flag:"🇰🇷" }, { code:"az", name:"Azerbaycan Türkçesi", flag:"🇦🇿" },
  { code:"ku", name:"Kürtçe", flag:"☀️" }, { code:"fa", name:"Farsça", flag:"🇮🇷" }, { code:"hi", name:"Hintçe", flag:"🇮🇳" },
  { code:"ur", name:"Urduca", flag:"🇵🇰" }, { code:"pl", name:"Lehçe", flag:"🇵🇱" }, { code:"ro", name:"Romence", flag:"🇷🇴" },
  { code:"bg", name:"Bulgarca", flag:"🇧🇬" }, { code:"sr", name:"Sırpça", flag:"🇷🇸" }, { code:"uk", name:"Ukraynaca", flag:"🇺🇦" },
  { code:"sv", name:"İsveççe", flag:"🇸🇪" }, { code:"no", name:"Norveççe", flag:"🇳🇴" }, { code:"da", name:"Danca", flag:"🇩🇰" },
  { code:"fi", name:"Fince", flag:"🇫🇮" }, { code:"he", name:"İbranice", flag:"🇮🇱" }, { code:"id", name:"Endonezce", flag:"🇮🇩" }
];
const TTS_LANG = { tr:"tr-TR", en:"en-US", de:"de-DE", fr:"fr-FR", es:"es-ES", it:"it-IT", ar:"ar-SA", ru:"ru-RU", pt:"pt-PT", nl:"nl-NL", el:"el-GR", zh:"zh-CN", ja:"ja-JP", ko:"ko-KR", az:"az-AZ", fa:"fa-IR", hi:"hi-IN", ur:"ur-PK", pl:"pl-PL", ro:"ro-RO", bg:"bg-BG", sr:"sr-RS", uk:"uk-UA", sv:"sv-SE", no:"nb-NO", da:"da-DK", fi:"fi-FI", he:"he-IL", id:"id-ID" };

let languages = collectLanguages();
let selectedLang = normalizeLang(localStorage.getItem(LANG_KEY) || "tr");
let peerId = localStorage.getItem(PEER_KEY) || "";
let displayName = localStorage.getItem(NAME_KEY) || "Kullanıcı";
let role = "participant";
let roomCode = "";
let ws = null;
let roster = [];
let recognition = null;
let recording = false;
let leaving = false;

if (!peerId) {
  peerId = `mc_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  localStorage.setItem(PEER_KEY, peerId);
}

const $ = (id) => document.getElementById(id);

function log(label, data = {}) {
  try { console.warn(`[MultiChatDemo] ${label} ${JSON.stringify(data)}`); }
  catch { console.warn(`[MultiChatDemo] ${label}`); }
}

function collectLanguages() {
  const sources = [
    window.ITK_LANGUAGES,
    window.LANGUAGES,
    window.SUPPORTED_LANGUAGES,
    window.SUPPORTED_LANGS,
    window.siteLanguageManager?.languages,
    window.SiteLanguageManager?.languages
  ];
  for (const source of sources) {
    const list = Array.isArray(source) ? source : (source && typeof source === "object" ? Object.values(source) : []);
    const normalized = list.map(normalizeLanguageItem).filter(Boolean);
    if (normalized.length >= 10) return dedupeLanguages(normalized);
  }
  return FALLBACK_LANGUAGES;
}

function normalizeLanguageItem(item) {
  if (!item) return null;
  const code = String(item.code || item.lang || item.id || item.value || "").trim().toLowerCase().split("-")[0];
  const name = String(item.name || item.label || item.nativeName || item.tr || code || "").trim();
  if (!code || !name) return null;
  return { code, name, flag: item.flag || flagFor(code) };
}

function dedupeLanguages(items) {
  const map = new Map();
  items.forEach((item) => { if (!map.has(item.code)) map.set(item.code, item); });
  return Array.from(map.values());
}

function flagFor(code) {
  return (FALLBACK_LANGUAGES.find((item) => item.code === code) || {}).flag || "🌐";
}

function normalizeLang(value) {
  const code = String(value || "").trim().toLowerCase().split("-")[0];
  return languages.some((item) => item.code === code) ? code : "tr";
}

function langInfo(code) {
  return languages.find((item) => item.code === normalizeLang(code)) || languages[0];
}

function langShort(code) {
  return normalizeLang(code).toUpperCase();
}

function stableColor(seed) {
  let hash = 0;
  const value = String(seed || "x");
  for (let i = 0; i < value.length; i++) hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue} 72% 56%)`;
}

function toast(message) {
  const el = $("miniToast");
  if (!el) return;
  el.textContent = String(message || "");
  el.classList.add("show");
  clearTimeout(window.__multiChatToastTimer);
  window.__multiChatToastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function showLandingError(message) {
  const el = $("landingStatus");
  if (!el) return;
  el.textContent = message || "";
  el.classList.toggle("error", !!message);
}

function makeCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
function normalizeCode(code) { return String(code || "").replace(/\D/g, "").slice(0, 6); }
function formatCode(code) { const clean = normalizeCode(code); return clean.length > 3 ? `${clean.slice(0, 3)} ${clean.slice(3)}` : clean; }
function initials(name) { const parts = String(name || "").trim().split(/\s+/).filter(Boolean); return parts.slice(0, 2).map((part) => part[0]?.toUpperCase() || "").join("") || "K"; }
function messageId() { return `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`; }
function escapeHtml(value) { return String(value || "").replace(/[&<>"]/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch])); }

function renderLanguageLabels() {
  const info = langInfo(selectedLang);
  const label = `${info.flag || "🌐"} ${info.name} • ${langShort(info.code)}`;
  if ($("selectedLangLabel")) $("selectedLangLabel").textContent = label;
  if ($("roomLangBtn")) $("roomLangBtn").textContent = `${info.flag || "🌐"} ${langShort(info.code)}`;
}

function renderLanguageList() {
  const list = $("langList");
  if (!list) return;
  list.innerHTML = languages.map((lang) => `
    <button class="lang-option${lang.code === selectedLang ? " active" : ""}" type="button" data-lang="${escapeHtml(lang.code)}">
      <span>${escapeHtml(lang.flag || "🌐")} ${escapeHtml(lang.name)}</span><strong>${escapeHtml(langShort(lang.code))}</strong>
    </button>
  `).join("");
  list.querySelectorAll("[data-lang]").forEach((button) => {
    button.addEventListener("click", () => {
      selectedLang = normalizeLang(button.dataset.lang);
      localStorage.setItem(LANG_KEY, selectedLang);
      renderLanguageLabels();
      renderLanguageList();
      closeLangModal();
      sendProfileSync();
      renderParticipants();
      log("selected language", { selectedLang });
    });
  });
}

function openLangModal() { renderLanguageList(); $("langModal")?.classList.add("show"); $("langModal")?.setAttribute("aria-hidden", "false"); }
function closeLangModal() { $("langModal")?.classList.remove("show"); $("langModal")?.setAttribute("aria-hidden", "true"); }

function knownPeople() {
  const map = new Map();
  map.set(peerId, { from: peerId, from_name: displayName, me_lang: selectedLang, role });
  roster.forEach((item) => {
    const id = String(item?.from || item?.id || item?.user_id || item?.senderId || "");
    if (id) map.set(id, item);
  });
  return Array.from(map.values());
}

function renderParticipants() {
  const list = $("participants");
  const count = $("participantCount");
  if (!list) return;
  const people = knownPeople();
  list.innerHTML = people.map((person) => {
    const id = String(person?.from || person?.id || peerId);
    const name = person?.from_name || person?.display_name || (id === peerId ? displayName : "Kullanıcı");
    const info = langInfo(person?.me_lang || selectedLang);
    const title = `${name} • ${info.name}`;
    return `<div class="avatar" style="--accent:${stableColor(id)}" title="${escapeHtml(title)}">${escapeHtml(initials(name))}</div>`;
  }).join("");
  if (count) count.textContent = `${people.length} kişi`;
}

function setRoomStatus(text) { if ($("roomStatus")) $("roomStatus").textContent = text || ""; }
function switchView(name) { $("landingView")?.classList.toggle("active", name === "landing"); $("roomView")?.classList.toggle("active", name === "room"); }

function enterRoom(code, nextRole) {
  roomCode = normalizeCode(code);
  role = nextRole || "participant";
  $("roomCodeLabel").textContent = formatCode(roomCode);
  switchView("room");
  renderLanguageLabels();
  renderParticipants();
  addSystemMessage(role === "host" ? `${displayName} sohbeti başlattı` : `${displayName} sohbete katıldı`);
  connectSocket(roomCode, role);
}

function createRoom() { const code = makeCode(); log("create room", { code, selectedLang }); enterRoom(code, "host"); }
function joinRoom() {
  const code = normalizeCode($("roomCodeInput")?.value || "");
  if (code.length !== 6) { showLandingError("Lütfen geçerli bir sohbet kodu girin."); log("error", { reason: "invalid_room_code", code }); return; }
  showLandingError("");
  log("join room", { code, selectedLang });
  enterRoom(code, "participant");
}

function connectSocket(code, nextRole) {
  closeSocket(false);
  setRoomStatus("Bağlanıyor...");
  const url = `${WS_BASE}/api/f2f/ws/${encodeURIComponent(code)}`;
  log("ws connect", { url, role: nextRole });
  try { ws = new WebSocket(url); } catch (error) { log("error", { stage:"ws_construct", message:error?.message || String(error) }); setRoomStatus("Bağlantı başlatılamadı."); return; }
  ws.onopen = () => {
    log("ws open", { roomCode: code, role: nextRole });
    setRoomStatus("Bağlandı. Mesaj yazabilirsiniz.");
    sendJson({ type: nextRole === "host" ? "create" : "join", from: peerId, from_name: displayName, me_lang: selectedLang, role: nextRole });
    sendJson({ type:"system", event:"joined", from:peerId, from_name:displayName, me_lang:selectedLang, text:`${displayName} sohbete katıldı` });
  };
  ws.onmessage = (event) => {
    let data = null;
    try { data = JSON.parse(event.data); } catch { data = { type:"raw", text:event.data }; }
    log("ws message", data);
    handleSocketPayload(data);
  };
  ws.onerror = () => { log("error", { stage:"ws_error", roomCode:code }); setRoomStatus("Bağlantı hatası. UI deneme olarak kullanılabilir."); };
  ws.onclose = () => { log("ws close", { roomCode:code, leaving }); if (!leaving) setRoomStatus("Bağlantı kapandı. Oda ekranı deneme olarak açık kalıyor."); };
}

function closeSocket(notify = true) {
  if (notify && ws && ws.readyState === WebSocket.OPEN) {
    if (role === "host") sendJson({ type:"host_closed", from:peerId, from_name:displayName, text:"Sohbet sahibi oturumu kapattı." });
    else sendJson({ type:"system", event:"left", from:peerId, from_name:displayName, text:`${displayName} odadan ayrıldı` });
  }
  try { ws?.close(); } catch {}
  ws = null;
}

function sendJson(payload) {
  try {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    ws.send(JSON.stringify(payload));
    log("ws send", payload);
    return true;
  } catch (error) {
    log("error", { stage:"ws_send", message:error?.message || String(error) });
    return false;
  }
}

function sendProfileSync() { sendJson({ type:"profile_sync", from:peerId, from_name:displayName, me_lang:selectedLang, role }); }

function handleSocketPayload(data) {
  const type = String(data?.type || "");
  const senderId = String(data?.from || data?.senderId || "");
  if (senderId && senderId !== peerId && (data?.from_name || data?.me_lang)) mergeRosterPerson(data);

  if (type === "room_created") { setRoomStatus("Oda hazır. Kodu paylaşabilirsiniz."); sendProfileSync(); return; }
  if (type === "room_joined") { setRoomStatus("Odaya katıldınız."); sendProfileSync(); return; }
  if (type === "room_not_found") { setRoomStatus("Oda bulunamadı. Kodu kontrol edin."); toast("Oda bulunamadı."); return; }
  if (type === "presence" || type === "peer_joined") {
    roster = Array.isArray(data?.roster) ? data.roster : (Array.isArray(data?.peers) ? data.peers : roster);
    renderParticipants();
    log("roster update", { count: roster.length, roster });
    if (type === "peer_joined") addSystemMessage(`${data?.from_name || "Bir kullanıcı"} sohbete katıldı`);
    return;
  }
  if (type === "profile_updated" || type === "language_update") { sendProfileSync(); return; }
  if (type === "host_closed") {
    addSystemMessage("Sohbet sahibi oturumu kapattı.");
    toast("Sohbet sahibi oturumu kapattı.");
    setTimeout(returnToLanding, 1300);
    return;
  }
  if (type === "system") {
    if (senderId !== peerId) addSystemMessage(data?.text || (data?.event === "left" ? "Bir kullanıcı odadan ayrıldı" : "Sistem mesajı"));
    return;
  }
  if (type === "leave" || type === "peer_left") {
    if (senderId !== peerId) addSystemMessage(`${data?.from_name || "Bir kullanıcı"} odadan ayrıldı`);
    return;
  }
  if (type === "message") {
    if (senderId === peerId) return;
    const senderName = data?.from_name || data?.senderName || "Katılımcı";
    const sourceLang = normalizeLang(data?.lang || data?.sourceLang || "tr");
    const originalText = String(data?.text || data?.message || "").trim();
    if (!originalText) return;
    renderIncomingMessage({ senderId, senderName, originalText, sourceLang });
  }
}

function mergeRosterPerson(person) {
  const id = String(person?.from || person?.id || person?.senderId || "");
  if (!id || id === peerId) return;
  const next = { from:id, from_name:person.from_name || person.senderName || person.display_name || "Katılımcı", me_lang:normalizeLang(person.me_lang || person.lang || person.sourceLang || "tr"), role:person.role || "participant" };
  const index = roster.findIndex((item) => String(item?.from || item?.id || "") === id);
  if (index >= 0) roster[index] = { ...roster[index], ...next }; else roster.push(next);
  renderParticipants();
}

async function renderIncomingMessage({ senderId, senderName, originalText, sourceLang }) {
  const translated = sourceLang === selectedLang ? originalText : await translateMessage(originalText, sourceLang, selectedLang);
  if (!translated && sourceLang !== selectedLang) log("error", { stage:"translate_fallback", sourceLang, selectedLang });
  addMessage({ mine:false, senderId, name:senderName, lang:selectedLang, sourceLang, text:translated || originalText, note:sourceLang === selectedLang ? langInfo(sourceLang).name : `${langShort(sourceLang)} → ${langShort(selectedLang)}`, speakable:true });
}

async function translateMessage(text, from, to) {
  const payload = { text, from_lang:from, to_lang:to, source:from, target:to, mode:"normal", use_ai:false, cultural:false, tone:"neutral" };
  const endpoints = [`${API_BASE}/api/translate_ai`, `${API_BASE}/api/translate-ai`, `${API_BASE}/api/translate`];
  for (const endpoint of endpoints) {
    try {
      const res = await fetch(endpoint, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
      const data = await res.json().catch(() => null);
      const value = String(data?.translated || data?.translation || data?.text || "").trim();
      if (res.ok && value) return value;
    } catch (error) { log("error", { stage:"translate", endpoint, message:error?.message || String(error) }); }
  }
  return "";
}

function addMessage({ mine, senderId, name, lang, sourceLang, text, note, speakable }) {
  const list = $("chatList");
  if (!list) return;
  list.querySelector(".empty-chat")?.remove();
  const id = senderId || peerId;
  const info = langInfo(lang || selectedLang);
  const wrap = document.createElement("div");
  wrap.className = `msg ${mine ? "me" : "other"}`;
  wrap.style.setProperty("--accent", stableColor(id));
  const speaker = !mine && speakable ? `<button class="speaker-btn" type="button" aria-label="Mesajı dinle" data-speak="1">🔊</button>` : "";
  wrap.innerHTML = `
    ${mine ? "" : `<div class="avatar" style="--accent:${stableColor(id)}">${escapeHtml(initials(name))}</div>`}
    <div class="msg-body">
      <div class="msg-head"><span>${escapeHtml(info.flag || "🌐")}</span><span>${escapeHtml(name || (mine ? "Ben" : "Katılımcı"))}</span><span>•</span><span>${escapeHtml(info.name || langShort(info.code))}</span></div>
      <div class="bubble-row"><div class="bubble">${escapeHtml(text)}</div>${speaker}</div>
      ${note ? `<div class="translation-note">${escapeHtml(note)}</div>` : ""}
    </div>
    ${mine ? `<div class="avatar" style="--accent:${stableColor(id)}">${escapeHtml(initials(name || displayName))}</div>` : ""}
  `;
  const speakBtn = wrap.querySelector("[data-speak]");
  if (speakBtn) speakBtn.addEventListener("click", () => speakText(text, lang || selectedLang));
  list.appendChild(wrap);
  requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
}

function addSystemMessage(text) {
  const list = $("chatList");
  if (!list) return;
  list.querySelector(".empty-chat")?.remove();
  const el = document.createElement("div");
  el.className = "system-msg";
  el.textContent = text;
  list.appendChild(el);
  requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
}

async function speakText(text, lang) {
  const value = String(text || "").trim();
  if (!value) return;
  const voice = TTS_LANG[normalizeLang(lang)] || `${normalizeLang(lang)}-${normalizeLang(lang).toUpperCase()}`;
  log("speak message", { text:value.slice(0, 80), lang:normalizeLang(lang), voice });
  try {
    if (window.NativeTTS?.speak) { await window.NativeTTS.speak(value, voice); return; }
    if (window.Native?.speak) { window.Native.speak(value, voice); return; }
    if (window.AndroidBridge?.speak) { window.AndroidBridge.speak(value, voice); return; }
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(value);
      utterance.lang = voice;
      utterance.rate = 0.96;
      window.speechSynthesis.speak(utterance);
      return;
    }
    throw new Error("tts_unavailable");
  } catch (error) {
    log("error", { stage:"tts", message:error?.message || String(error) });
    toast("Ses şu anda başlatılamadı. Tekrar deneyin.");
  }
}

function sendMessage() {
  const input = $("messageInput");
  const text = String(input?.value || "").trim();
  if (!text) return;
  input.value = "";
  addMessage({ mine:true, senderId:peerId, name:displayName, lang:selectedLang, sourceLang:selectedLang, text, note:langInfo(selectedLang).name, speakable:false });
  const ok = sendJson({ type:"message", from:peerId, from_name:displayName, me_lang:selectedLang, lang:selectedLang, text, messageId:messageId(), sentAt:Date.now() });
  if (!ok) toast("Bağlantı yoksa mesaj sadece bu ekranda görünür.");
}

function returnToLanding() {
  leaving = true;
  closeSocket(false);
  leaving = false;
  roster = [];
  roomCode = "";
  role = "participant";
  setRoomStatus("");
  const chat = $("chatList");
  if (chat) chat.innerHTML = `<div class="empty-chat">Mesajlar burada görünecek. Oda kodunu diğer cihazda açıp aynı koda katılabilirsiniz.</div>`;
  switchView("landing");
}

function leaveRoom() {
  addSystemMessage(role === "host" ? "Sohbet sahibi oturumu kapattı." : `${displayName} odadan ayrıldı`);
  leaving = true;
  closeSocket(true);
  leaving = false;
  setTimeout(returnToLanding, role === "host" ? 650 : 280);
}

function startMic() {
  if (recording) { stopMic(); return; }
  log("mic start", { selectedLang });
  const bcp = TTS_LANG[selectedLang] || "tr-TR";
  recording = true;
  $("micBtn")?.classList.add("recording");
  try {
    if (window.Native?.startSpeechRecognition) { window.Native.startSpeechRecognition(bcp, "multi_chat"); return; }
    if (window.AndroidBridge?.startSpeechRecognition) { window.AndroidBridge.startSpeechRecognition(bcp, "multi_chat"); return; }
  } catch (error) { log("error", { stage:"native_mic", message:error?.message || String(error) }); }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { stopMic(); toast("Bu cihazda mikrofonla yazıya çevirme hazır değil."); return; }
  try {
    recognition = new SpeechRecognition();
    recognition.lang = bcp;
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (event) => handleMicResult(Array.from(event.results || []).map((result) => result?.[0]?.transcript || "").join(" ").trim());
    recognition.onerror = (event) => { log("error", { stage:"web_mic", message:event?.error || "speech_error" }); stopMic(); toast("Mikrofon başlatılamadı."); };
    recognition.onend = () => stopMic(false);
    recognition.start();
  } catch (error) { log("error", { stage:"web_mic_start", message:error?.message || String(error) }); stopMic(); toast("Mikrofon başlatılamadı."); }
}

function stopMic(tryNative = true) {
  recording = false;
  $("micBtn")?.classList.remove("recording");
  if (tryNative) {
    try {
      if (window.Native?.stopSpeechRecognition) window.Native.stopSpeechRecognition();
      else if (window.AndroidBridge?.stopSpeechRecognition) window.AndroidBridge.stopSpeechRecognition();
      else recognition?.stop?.();
    } catch {}
  }
  recognition = null;
}

function handleMicResult(text) {
  const value = String(text || "").trim();
  log("mic result", { text:value });
  stopMic(false);
  if (!value) return;
  const input = $("messageInput");
  if (input) { input.value = input.value ? `${input.value.trim()} ${value}` : value; input.focus(); }
}

function bindNativeSpeechCallbacks() {
  const previousResult = window.onNativeSpeechResult;
  const previousError = window.onNativeSpeechError;
  window.onNativeSpeechResult = function(...args) {
    let text = "";
    const first = args[0];
    if (typeof first === "string") {
      try { const parsed = JSON.parse(first); text = parsed?.text || parsed?.transcript || args[1] || ""; }
      catch { text = args[1] || first; }
    } else if (first && typeof first === "object") text = first.text || first.transcript || "";
    handleMicResult(text);
    if (typeof previousResult === "function") { try { previousResult.apply(window, args); } catch {} }
  };
  window.onNativeSpeechError = function(...args) {
    log("error", { stage:"native_mic", message:args[0] || "speech_error" });
    stopMic(false);
    toast("Mikrofon başlatılamadı.");
    if (typeof previousError === "function") { try { previousError.apply(window, args); } catch {} }
  };
}

function bindEvents() {
  $("createRoomBtn")?.addEventListener("click", createRoom);
  $("showJoinBtn")?.addEventListener("click", () => { $("joinPanel")?.classList.toggle("show"); showLandingError(""); setTimeout(() => $("roomCodeInput")?.focus(), 80); });
  $("joinRoomBtn")?.addEventListener("click", joinRoom);
  $("roomCodeInput")?.addEventListener("input", (event) => { event.target.value = formatCode(event.target.value); });
  $("roomCodeInput")?.addEventListener("keydown", (event) => { if (event.key === "Enter") joinRoom(); });
  $("copyCodeBtn")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(roomCode); toast("Kod kopyalandı."); } catch { toast("Kod: " + formatCode(roomCode)); } });
  $("backBtn")?.addEventListener("click", leaveRoom);
  $("sendBtn")?.addEventListener("click", sendMessage);
  $("messageInput")?.addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); sendMessage(); } });
  $("micBtn")?.addEventListener("click", startMic);
  $("openLangBtn")?.addEventListener("click", openLangModal);
  $("roomLangBtn")?.addEventListener("click", openLangModal);
  $("closeLangBtn")?.addEventListener("click", closeLangModal);
  $("langModal")?.addEventListener("click", (event) => { if (event.target === $("langModal")) closeLangModal(); });
  window.addEventListener("pagehide", () => { leaving = true; closeSocket(true); });
}

async function hydrateName() {
  try {
    const { supabase } = await import("/js/supabase_client.js");
    const { data: { session } } = await supabase.auth.getSession();
    const user = session?.user;
    const meta = user?.user_metadata || {};
    const candidate = meta.name || meta.full_name || meta.display_name || user?.email || "Kullanıcı";
    displayName = String(candidate).trim().split("@")[0] || "Kullanıcı";
    localStorage.setItem(NAME_KEY, displayName);
  } catch { displayName = localStorage.getItem(NAME_KEY) || "Kullanıcı"; }
}

async function boot() {
  mountShell({ scroll:"none", publicPage:true });
  await hydrateName();
  renderLanguageLabels();
  renderLanguageList();
  renderParticipants();
  bindNativeSpeechCallbacks();
  bindEvents();
  log("ready", { href:location.href, selectedLang, peerId, displayName, languageCount:languages.length });
  document.body.classList.add("ready");
}

boot();
</script>
