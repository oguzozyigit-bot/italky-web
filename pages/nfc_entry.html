<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>italkyAI • NFC Giriş</title>
  <meta name="theme-color" content="#0b0b12" />
  <style>
    :root{
      --bg:#0b0b12;
      --card:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --txt:#fff;
      --muted:rgba(255,255,255,.68);
      --ok:#22c55e;
      --err:#ef4444;
      --grad:linear-gradient(135deg,#67e8f9 0%, #818cf8 46%, #f472b6 100%);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:
        radial-gradient(circle at top, rgba(129,140,248,.18), transparent 28%),
        radial-gradient(circle at 20% 30%, rgba(244,114,182,.12), transparent 24%),
        #0b0b12;
      color:var(--txt);
      font-family:Arial,sans-serif;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .wrap{
      width:min(100%,420px);
      padding:22px;
      border:1px solid var(--line);
      border-radius:24px;
      background:var(--card);
      backdrop-filter:blur(14px);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      text-align:center;
    }
    .logo{
      font-size:28px;
      font-weight:900;
      letter-spacing:.3px;
      margin-bottom:12px;
    }
    .logo .ai{
      background:var(--grad);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .title{
      font-size:20px;
      font-weight:900;
      margin:0 0 8px;
    }
    .desc{
      margin:0 0 16px;
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }
    .uidbox{
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      font-size:13px;
      color:#fff;
      word-break:break-all;
      margin-bottom:14px;
    }
    .status{
      min-height:22px;
      margin:10px 0 0;
      font-size:14px;
      font-weight:800;
    }
    .ok{color:var(--ok)}
    .err{color:var(--err)}
    .muted{color:var(--muted)}
    .btn{
      margin-top:16px;
      width:100%;
      min-height:48px;
      border:none;
      border-radius:16px;
      color:#fff;
      font-size:15px;
      font-weight:900;
      background:var(--grad);
      cursor:pointer;
    }
    .hint{
      margin-top:12px;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">italky<span class="ai">AI</span></div>
    <h1 class="title">NFC Kart Kontrolü</h1>
    <p class="desc">Kart bilgisi okunuyor. Hesabın açıksa kart paketin otomatik bağlanır.</p>

    <div id="uidBox" class="uidbox">Kart bilgisi hazırlanıyor...</div>
    <div id="status" class="status muted">Bekleniyor...</div>

    <button id="retryBtn" class="btn" type="button" style="display:none;">Tekrar Dene</button>
    <div class="hint">Giriş yapılmamışsa önce giriş ekranına yönlendirilirsin.</div>
  </div>

  <script>
    const API_BASE = "https://italky-api.onrender.com/api";
    const LOGIN_URL = "/pages/login.html";
    const HOME_URL = "/pages/home.html";

    const uidBox = document.getElementById("uidBox");
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retryBtn");

    function setStatus(text, cls = "muted"){
      statusEl.className = `status ${cls}`;
      statusEl.textContent = text || "";
    }

    function normalizeUid(v){
      return String(v || "")
        .trim()
        .toUpperCase()
        .replace(/:/g, "")
        .replace(/\s+/g, "");
    }

    function getUidFromUrl(){
      const q = new URLSearchParams(location.search);

      const rawUid =
        q.get("uid") ||
        q.get("card") ||
        q.get("serial") ||
        q.get("nfc") ||
        "";

      return normalizeUid(rawUid);
    }

    function getUserId(){
      return (
        localStorage.getItem("user_id") ||
        sessionStorage.getItem("user_id") ||
        ""
      ).trim();
    }

    function getDeviceId(){
      let id =
        localStorage.getItem("italky_device_id") ||
        sessionStorage.getItem("italky_device_id") ||
        "";

      id = String(id || "").trim();

      if(!id){
        id = "web_" + Math.random().toString(36).slice(2) + Date.now();
        localStorage.setItem("italky_device_id", id);
      }
      return id;
    }

    async function activateCard(){
      const uid = getUidFromUrl();
      const userId = getUserId();
      const deviceId = getDeviceId();

      uidBox.textContent = uid || "Kart bilgisi bulunamadı";

      if(!uid){
        setStatus("Kart bilgisi yok.", "err");
        retryBtn.style.display = "block";
        return;
      }

      if(!userId){
        setStatus("Önce giriş yapmalısın. Girişe yönlendiriliyorsun...", "muted");
        const next = encodeURIComponent(location.pathname + location.search);
        setTimeout(() => {
          location.href = `${LOGIN_URL}?next=${next}`;
        }, 700);
        return;
      }

      try{
        setStatus("Kart doğrulanıyor...", "muted");

        const res = await fetch(`${API_BASE}/nfc/activate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            uid: uid,
            device_id: deviceId,
            platform: "web"
          })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok || !data?.ok){
          throw new Error(data?.detail || data?.error || "Kart doğrulanamadı");
        }

        try{
          localStorage.setItem("app_access_mode", data.mode || "nfc");
          localStorage.setItem("nfc_card_uid", data.uid || uid);
          localStorage.setItem("nfc_package_code", data.package_code || "");
          localStorage.setItem("nfc_expires_at", data.expires_at || "");

          localStorage.setItem("nfc_features", JSON.stringify(data.features || {}));
          localStorage.setItem("nfc_remaining_languages", String(data.remaining_languages ?? 0));
          localStorage.setItem("nfc_remaining_jeton", String(data.remaining_jeton ?? 0));
        } catch(e){}

        setStatus("Kart başarıyla tanımlandı. Ana sayfaya geçiliyor...", "ok");

        setTimeout(() => {
          location.href = HOME_URL;
        }, 900);

      }catch(err){
        console.error("[nfc_entry]", err);
        setStatus(err?.message || "Kart geçersiz.", "err");
        retryBtn.style.display = "block";
      }
    }

    retryBtn.addEventListener("click", () => {
      retryBtn.style.display = "none";
      activateCard();
    });

    activateCard();
  </script>
</body>
</html>
