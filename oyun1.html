<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Neon Snake</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: #050505; color: white; 
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; height: 100vh; overflow: hidden; touch-action: none;
            user-select: none;
        }
        #ui { 
            width: 100%; max-width: 400px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #333;
        }
        #scores { text-align: left; }
        #curScore { font-size: 28px; font-weight: bold; color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        #hiScore { font-size: 14px; color: #7f8c8d; }
        #level { font-size: 18px; color: #f1c40f; text-shadow: 0 0 5px #f1c40f; text-align: right; }
        
        #canvas-container {
            position: relative;
            margin-top: 20px;
            display: flex; justify-content: center; align-items: center;
            width: 90vw; height: 90vw;
            max-width: 380px; max-height: 380px;
        }
        canvas { 
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.1);
        }
        
        /* Geçici mesaj */
        #message {
            position: absolute; color: white; background: rgba(0,0,0,0.8);
            padding: 10px 20px; border-radius: 5px; font-size: 18px;
            display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scores">
            <div id="curScore">0</div>
            <div id="hiScore">En Yüksek: 0</div>
        </div>
        <div id="level">Zorluk: 1</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="message">Çarpıştın! Skor Sıfırlandı.</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("curScore");
        const hiScoreEl = document.getElementById("hiScore");
        const levelEl = document.getElementById("level");
        const messageEl = document.getElementById("message");

        // Boyutları ayarla (kare)
        const size = Math.min(window.innerWidth * 0.9, 380);
        canvas.width = size;
        canvas.height = size;

        const box = 20; // Kare boyutu
        const rows = Math.floor(canvas.width / box);
        
        let snake, food, d, score, level, speed, gameLoop, highScore;
        
        highScore = localStorage.getItem("snakeHighScore") || 0;
        hiScoreEl.innerHTML = "En Yüksek: " + highScore;

        function initGame() {
            snake = [{x: Math.floor(rows/2) * box, y: Math.floor(rows/2) * box}];
            food = getRandomFood();
            d = "RIGHT"; // Başlangıç yönü
            score = 0;
            level = 1;
            speed = 160;
            scoreEl.innerHTML = score;
            levelEl.innerHTML = "Zorluk: 1";
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, speed);
        }

        // Dokunmatik Kontroller
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, false);
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // Sayfa kaymasını engelle
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && d !== "LEFT") d = "RIGHT"; else if (dx < -30 && d !== "RIGHT") d = "LEFT";
            } else {
                if (dy > 30 && d !== "UP") d = "DOWN"; else if (dy < -30 && d !== "DOWN") d = "UP";
            }
        }, false);

        function getRandomFood() {
            return {
                x: Math.floor(Math.random() * rows) * box,
                y: Math.floor(Math.random() * rows) * box
            };
        }

        function draw() {
            // Arka planı temizle
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Izgara çizgileri (görsel için)
            ctx.strokeStyle = "rgba(51, 51, 51, 0.5)";
            for(let i=0; i<rows; i++) {
                ctx.beginPath(); ctx.moveTo(i*box, 0); ctx.lineTo(i*box, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*box); ctx.lineTo(canvas.width, i*box); ctx.stroke();
            }

            // Yılanı çiz (Neon efektli)
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? "#2ecc71" : "#1abc9c";
                ctx.shadowBlur = 10;
                ctx.shadowColor = isHead ? "#2ecc71" : "#1abc9c";
                // Yumuşak köşeli kareler
                ctx.fillRect(part.x + 1, part.y + 1, box - 2, box - 2);
                ctx.shadowBlur = 0; // Diğer çizimler için sıfırla
            });

            // Yemi çiz (Pulsing Neon Red)
            ctx.fillStyle = "#e74c3c";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#e74c3c";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            let headX = snake[0].x;
            let headY = snake[0].y;

            if (d === "LEFT") headX -= box;
            else if (d === "UP") headY -= box;
            else if (d === "RIGHT") headX += box;
            else if (d === "DOWN") headY += box;

            // Duvarlardan geçme özelliği (Süreklilik)
            if (headX < 0) headX = canvas.width - box;
            else if (headX >= canvas.width) headX = 0;
            if (headY < 0) headY = canvas.height - box;
            else if (headY >= canvas.height) headY = 0;

            const newHead = {x: headX, y: headY};

            // Kendine çarpma kontrolü
            if (collision(newHead, snake)) {
                showMessage();
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    hiScoreEl.innerHTML = "En Yüksek: " + highScore;
                }
                initGame(); // Hemen yeniden başlat
                return;
            }

            // Yem yeme kontrolü
            if (headX === food.x && headY === food.y) {
                score += (10 * level);
                scoreEl.innerHTML = score;
                food = getRandomFood();
                
                // Zorluk artışı: Her 50 puanda bir (veya yem sayısında)
                if (score > 0 && score % 50 === 0) {
                    level++;
                    levelEl.innerHTML = "Zorluk: " + level;
                    increaseDifficulty();
                }
            } else {
                snake.pop(); // Yemediyse kuyruğu sil
            }

            snake.unshift(newHead); // Yeni kafayı ekle
        }

        function collision(head, array) {
            return array.some(part => head.x === part.x && head.y === part.y);
        }

        function increaseDifficulty() {
            clearInterval(gameLoop);
            speed = Math.max(60, 160 - (level * 10)); // Hızı limitliyoruz
            gameLoop = setInterval(draw, speed);
        }

        function showMessage() {
            messageEl.style.display = "block";
            setTimeout(() => { messageEl.style.display = "none"; }, 1500);
        }

        initGame(); // Oyunu başlat
    </script>
</body>
</html>
