name: One-shot Shorts offline shell
on:
  push:
    paths:
      - '.github/workflows/one-shot-shorts-offline-shell.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply offline Shorts shell patch
        run: python tools/patch_shorts_offline_shell.py
      - name: Commit patch
        run: |
          git config user.name "oguzozyigit-bot"
          git config user.email "oguzozyigit@gmail.com"
          git add pages/hosgeldiniz.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Shorts shell reopen from offline cache"
          git push origin main
