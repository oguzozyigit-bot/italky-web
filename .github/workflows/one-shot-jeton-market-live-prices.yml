name: One-shot Jeton Market live prices

on:
  push:
    paths:
      - '.github/workflows/one-shot-jeton-market-live-prices.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Jeton Market live price patch
        run: python tools/patch_jeton_market_live_prices.py
      - name: Commit patch
        run: |
          git config user.name "oguzozyigit-bot"
          git config user.email "oguzozyigit@gmail.com"
          git add pages/jetonbuy.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Show live Google Play prices in Jeton Market"
          git push origin HEAD:main
