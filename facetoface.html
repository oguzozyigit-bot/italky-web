<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Face to Face</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --composer-bg:rgba(12,14,20,.88);
      --composer-line:rgba(255,255,255,.09);
      --key-bg:rgba(255,255,255,.06);
      --key-line:rgba(255,255,255,.08);
      --key-active:rgba(99,102,241,.22);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
      -webkit-user-select:none;
      user-select:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at top, rgba(236,72,153,.06), transparent 22%),
        radial-gradient(circle at bottom, rgba(99,102,241,.06), transparent 22%),
        #050508;
    }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
      overflow:hidden;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      overflow:hidden;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
      padding:16px 14px 4px;
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
      padding:4px 14px 16px;
    }

    .lang-trigger{
      background:transparent;
      border:none;
      padding:8px 14px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      z-index:50;
      min-height:40px;
      max-width:92%;
      text-decoration:none;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:5000;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
    }

    .popover.show{ display:flex; }
    .half-screen.top .popover{ top:56px; }
    .half-screen.bottom .popover{ bottom:56px; }

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      letter-spacing:.3px;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
    }

    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .pop-item:hover{ background:rgba(255,255,255,.06); }

    .pop-item.active{
      background:rgba(99,102,241,.14);
      border-color:rgba(99,102,241,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{ font-size:18px; }

    .pop-name{
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .pop-code{
      font-weight:900;
      font-size:12px;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:6px 0 4px;
      mask-image:linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:84%;
      line-height:1.25;
      word-break:break-word;
    }

    .bubble.them{
      opacity:.55;
      font-size:18px;
      font-weight:500;
    }

    .bubble.me{
      font-size:18px;
      font-weight:650;
      opacity:.82;
    }

    .bubble.me.is-latest{
      font-size:30px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble-row .txt{
      display:inline-block;
    }

    .spk-icon{
      width:28px;
      height:28px;
      min-width:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk-icon svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .composer-stack{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      z-index:30;
    }

    .composer{
      width:calc(100% - 8px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:60px;
      padding:8px 12px;
      border-radius:22px;
      background:var(--composer-bg);
      border:1px solid var(--composer-line);
      box-shadow:0 10px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.03);
    }

    .composer-center{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .composer-input{
      width:100%;
      min-height:24px;
      max-height:120px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:16px;
      font-weight:800;
      line-height:1.35;
      font-family:inherit;
      overflow:auto;
      padding:0;
      margin:0;
      scrollbar-width:none;
      caret-color:transparent;
    }

    .composer-input::-webkit-scrollbar{ display:none; }

    .composer-input::placeholder{
      color:rgba(255,255,255,.72);
      font-weight:800;
    }

    .send-btn,.mic-btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      color:#fff;
    }

    .send-btn{
      background:#fff;
      color:#000;
      box-shadow:0 0 24px rgba(255,255,255,.10);
    }

    .send-btn svg,
    .mic-btn svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .hidden{ display:none !important; }

    .kb-wrap{
      width:100%;
      display:none;
      justify-content:center;
    }

    .kb-wrap.show{
      display:flex;
    }

    .kb{
      width:calc(100% - 8px);
      background:rgba(8,10,16,.92);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:8px;
      box-shadow:0 16px 32px rgba(0,0,0,.26);
    }

    .kb-row{
      display:flex;
      gap:6px;
      margin-bottom:6px;
    }

    .kb-row:last-child{ margin-bottom:0; }

    .kb-key{
      flex:1;
      min-width:0;
      min-height:38px;
      border:none;
      border-radius:12px;
      background:var(--key-bg);
      border:1px solid var(--key-line);
      color:#fff;
      font-family:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 6px;
    }

    .kb-key:active{
      background:var(--key-active);
      transform:scale(.98);
    }

    .kb-key.wide{ flex:1.5; }
    .kb-key.xwide{ flex:2.2; }
    .kb-key.send{
      background:#fff;
      color:#000;
    }

    .kb-key.muted{
      color:rgba(255,255,255,.82);
    }

    .center-hub{
      height:84px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:transparent;
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      z-index:650;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      box-shadow:none;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:86px;
      height:86px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:86px;
      height:86px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#6366f1;
      box-shadow:0 0 15px #6366f1;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#ec4899;
      box-shadow:0 0 15px #ec4899;
    }

    .ai-core{
      width:68px;
      height:68px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.4px;
      font-size:13px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #frameRoot.is-listening .eq-wrap,
    #frameRoot.is-translating .eq-wrap{
      opacity:1;
    }

    #frameRoot.is-listening .logo-text,
    #frameRoot.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-gradient);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    .status-pill{ display:none; }

    #frameRoot.is-idle .ball-1,
    #frameRoot.is-idle .ball-2,
    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background:#ef4444;
      box-shadow:0 0 18px rgba(239,68,68,.9);
    }

    #frameRoot.is-listening .ball-1,
    #frameRoot.is-translating .ball-1{
      background:#6366f1;
      box-shadow:0 0 18px rgba(99,102,241,.95);
    }

    #frameRoot.is-listening .ball-2,
    #frameRoot.is-translating .ball-2{
      background:#ec4899;
      box-shadow:0 0 18px rgba(236,72,153,.95);
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background:#22c55e;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    #frameRoot.to-top .orb-container{ transform:rotate(180deg); }
    #frameRoot.to-bot .orb-container{ transform:rotate(0deg); }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.52);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999999;
      padding:20px;
    }

    .modal.open{
      display:flex;
    }

    .modal-card{
      width:min(100%, 420px);
      border-radius:24px;
      padding:18px;
      background:linear-gradient(145deg, rgba(16,16,24,.96), rgba(10,10,18,.96));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 50px rgba(0,0,0,.30);
    }

    .modal-title{
      margin:0 0 8px;
      font-family:'Space Grotesk',sans-serif;
      font-size:20px;
      font-weight:900;
      color:#fff;
    }

    .modal-text{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.76);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .modal-btn{
      min-height:46px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      font-weight:900;
    }

    .modal-btn.primary{
      background:var(--ai-gradient);
      color:#05060d;
    }

    .modal-btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .mini-toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(120px);
      min-height:44px;
      padding:10px 16px;
      border-radius:16px;
      background:rgba(12,16,28,.96);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      max-width:min(92vw,420px);
      z-index:99999;
      box-shadow:0 18px 36px rgba(0,0,0,.35);
      transition:.22s ease;
      backdrop-filter:blur(14px);
      pointer-events:none;
    }

    .mini-toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @media (max-width:390px){
      .half-screen.top{ padding:14px 10px 4px; }
      .half-screen.bottom{ padding:4px 10px 14px; }
      .bubble.me.is-latest{ font-size:26px; }
      .composer{ width:calc(100% - 6px); min-height:58px; padding:8px 10px; border-radius:21px; }
      .composer-input{ font-size:15px; }
      .send-btn,.mic-btn{ width:38px; height:38px; }
      .kb{ width:calc(100% - 6px); padding:7px; }
      .kb-key{ min-height:36px; font-size:13px; }
      .center-hub{ height:80px; }
      .nav-btn{ font-size:9px; }
      .orb-container{ width:80px; height:80px; }
      .energy-orbit{ width:80px; height:80px; }
      .ai-core{ width:64px; height:64px; }
    }
  </style>
</head>
<body id="frameRoot" class="to-bot">
  <div class="container">
    <div class="half-screen top" id="topSection">
      <button class="lang-trigger" id="topLangBtn" type="button">
        <span id="topLangTxt">🇬🇧 English</span> ⌵
      </button>

      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi">
        <div class="pop-head">
          <div>ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="composer-stack">
        <div class="composer">
          <div class="composer-center">
            <textarea id="topInput" class="composer-input" rows="1" readonly placeholder="Mesajını buraya yaz"></textarea>
          </div>

          <button id="topMic" class="mic-btn" type="button" aria-label="Üst mikrofon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
              <path d="M19 10a7 7 0 0 1-14 0"></path>
              <path d="M12 17v4"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>

          <button id="topSend" class="send-btn hidden" type="button" aria-label="Üst mesaj gönder">
            <svg viewBox="0 0 24 24">
              <path d="M12 19V5"></path>
              <path d="M6 11l6-6 6 6"></path>
            </svg>
          </button>
        </div>

        <div class="kb-wrap" id="topKeyboardWrap">
          <div class="kb" id="topKeyboard"></div>
        </div>
      </div>
    </div>

    <div class="center-hub">
      <a class="nav-btn btn-home" id="homeLink" href="/pages/home.html">ANA SAYFA</a>

      <div class="orb-container" id="homeBtn" title="Ana sayfa">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
      <div id="statusPill" class="status-pill">Hazır</div>
    </div>

    <div class="half-screen bottom" id="botSection">
      <button class="lang-trigger" id="botLangBtn" type="button">
        <span id="botLangTxt">🇹🇷 Türkçe</span> ⌵
      </button>

      <div class="popover" id="pop-bot" role="dialog" aria-label="Alt dil seçimi">
        <div class="pop-head">
          <div>ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="composer-stack">
        <div class="composer">
          <div class="composer-center">
            <textarea id="botInput" class="composer-input" rows="1" readonly placeholder="Mesajını buraya yaz"></textarea>
          </div>

          <button id="botMic" class="mic-btn" type="button" aria-label="Alt mikrofon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
              <path d="M19 10a7 7 0 0 1-14 0"></path>
              <path d="M12 17v4"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>

          <button id="botSend" class="send-btn hidden" type="button" aria-label="Alt mesaj gönder">
            <svg viewBox="0 0 24 24">
              <path d="M12 19V5"></path>
              <path d="M6 11l6-6 6 6"></path>
            </svg>
          </button>
        </div>

        <div class="kb-wrap" id="botKeyboardWrap">
          <div class="kb" id="botKeyboard"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="uiModal">
    <div class="modal-card">
      <h3 class="modal-title" id="uiModalTitle">Üyelik Gerekli</h3>
      <p class="modal-text" id="uiModalText">Bu özelliği kullanabilmek için üyelik gereklidir.</p>
      <div class="modal-actions">
        <button class="modal-btn primary" id="uiModalGo">Üyelik Paketlerini Gör</button>
        <button class="modal-btn secondary" id="uiModalClose">Atla</button>
      </div>
    </div>
  </div>

  <div class="mini-toast" id="miniToast"></div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const forcedMode = String(params.get("mode") || "").trim().toLowerCase();

    const script = document.createElement("script");
    script.type = "module";

    if (forcedMode === "offline" || (!navigator.onLine && forcedMode !== "online")) {
      script.src = "/js/facetoface_offline.js?v=F2F_OFFLINE_V4";
    } else {
      script.src = "/js/facetoface_page.js?v=F2F_ONLINE_V4";
    }

    document.body.appendChild(script);
  </script>
</body>
</html>
