<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>italkyAI • Neural Nitro v3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ai-gradient: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
      --bg-dark: #050508;
      --border-alpha: rgba(255, 255, 255, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg-dark); color: #fff; font-family: 'Outfit', sans-serif; overflow: hidden; }
    body { min-height: 100dvh; }

    .container { display: flex; flex-direction: column; height: 100dvh; width: 100%; position: relative; }

    .half-screen{
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--safe-top)) 15px calc(14px + var(--safe-bottom));
      overflow: hidden;
    }
    .half-screen.top{
      transform: rotate(180deg);
      background: linear-gradient(180deg, rgba(128, 19, 54, 0.18) 0%, var(--bg-dark) 100%);
    }
    .half-screen.bottom{
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.18) 0%, var(--bg-dark) 100%);
    }

    .lang-trigger{
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-alpha);
      padding: 10px 18px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .3px;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .popover{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 360px);
      height: 360px;
      background: #0a0a0f;
      border: 1px solid var(--border-alpha);
      border-radius: 24px;
      display: none;
      flex-direction: column;
      z-index: 5000;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,0.92);
      pointer-events: auto;
    }
    .popover.show{ display: flex; }

    .half-screen.top .popover{ top: 62px; }
    .half-screen.bottom .popover{ bottom: 62px; }

    .pop-head{
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      letter-spacing: .3px;
    }
    .pop-close{
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      user-select: none;
    }
    .pop-list{
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: none;
      pointer-events: auto;
    }
    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding: 12px 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      pointer-events: auto;
    }
    .pop-item:hover{ background: rgba(255,255,255,0.06); }
    .pop-item.active{
      background: rgba(99,102,241,0.14);
      border-color: rgba(99,102,241,0.25);
    }
    .pop-left{ display:flex; align-items:center; gap:10px; min-width:0; }
    .pop-flag{ font-size: 18px; }
    .pop-name{ font-weight: 900; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .pop-code{ font-weight: 900; font-size: 12px; opacity: .7; }

    .center-hub{
      height: 116px;
      position: relative;
      z-index: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    .nav-btn{
      position: absolute;
      padding: 10px 18px;
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-alpha);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      user-select:none;
      backdrop-filter: blur(15px);
      z-index: 650;
      pointer-events: auto;
    }
    .btn-home{ left: 15px; }
    .btn-clear{ right: 15px; }

    .orb-container{
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      pointer-events: auto;
    }

    .energy-orbit{ position: absolute; inset: -4px; border-radius: 50%; animation: rotateOrbit 5s linear infinite; }

    .ball-1, .ball-2{
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      filter: blur(1.5px);
      transition: background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: #6366f1;
      box-shadow: 0 0 15px #6366f1;
    }
    .ball-2{
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: #ec4899;
      box-shadow: 0 0 15px #ec4899;
    }

    .ai-core{
      width: 80px; height: 80px; background: #000; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-alpha); z-index: 10;
      overflow: hidden; position: relative;
    }
    .logo-text{ font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .logo-ai{ background: var(--ai-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .eq-wrap{
      display: flex; align-items: center; gap: 3px;
      height: 20px; position: absolute;
      opacity: 0; transition: 0.25s;
      z-index: 20;
    }
    #frameRoot.is-listening .eq-wrap,
    #frameRoot.is-translating .eq-wrap { opacity: 1; }
    #frameRoot.is-listening .logo-text,
    #frameRoot.is-translating .logo-text { opacity: 0; }

    .eq-bar{ width: 3px; background: var(--ai-gradient); border-radius: 10px; animation: eqAnim 0.7s infinite ease-in-out; }

    .chat-body{
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 18px 0;
      mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      z-index: 20;
    }
    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-align: center;
      word-break: break-word;
    }
    .bubble .txt{ max-width: 78vw; }

    .bubble.me .txt{ font-size: 18px; font-weight: 650; opacity: .75; line-height: 1.15; }
    .bubble.me.is-latest .txt{ font-size: 30px; font-weight: 900; opacity: 1; line-height: 1.06; letter-spacing: .2px; }
    .bubble.them .txt{ font-size: 18px; font-weight: 450; opacity: .55; line-height: 1.2; }

    .spk-icon{
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.10);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid var(--border-alpha);
      flex: 0 0 auto;
    }
    .bubble.me .spk-icon{ display:flex; }
    .spk-icon svg{ width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.1; opacity: .95; }
    .spk-icon:active{ transform: scale(.97); }

    .mic-wrap{
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  gap: 8px;
  padding-bottom: 10px;
  z-index: 30;
  width: 100%;
}

    .btn-mic{
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid transparent;
      background-image: linear-gradient(#000, #000), var(--ai-gradient);
      background-origin: border-box;
      background-clip: content-box, border-box;
      cursor: pointer; user-select:none;
      transition: .18s;
      pointer-events: auto;
      position: relative;
      overflow: visible;
    }
    .btn-mic:active{ transform: scale(.98); }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation: breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color: rgba(34,197,94,.85);
      box-shadow: 0 0 0 6px rgba(34,197,94,.10), 0 0 28px rgba(34,197,94,.35);
      animation: micPulse 1.1s infinite ease-out;
    }

    .btn-mic.recorded{
      box-shadow: 0 0 0 4px rgba(250,204,21,.16), 0 0 22px rgba(250,204,21,.28);
    }

    .helper-text{
  font-size: 11px;
  font-weight: 1000;
  text-align: center;
  line-height: 1.25;
  letter-spacing: .12px;
  min-height: 16px;
  user-select: none;
  max-width: 220px;
  width: 100%;
  display: block;
}

#topSection .helper-text{
  transform: rotate(180deg);
  transform-origin: center center;
}

#botSection .helper-text{
  transform: rotate(0deg);
  transform-origin: center center;
}

    .helper-ready{
      color: #22c55e;
      text-shadow: 0 0 12px rgba(34,197,94,.28);
    }

    .helper-wait{
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239,68,68,.28);
    }

    .helper-repeat{
      background: var(--ai-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    .status-pill{ display:none; }

    #frameRoot.is-idle .ball-1,
    #frameRoot.is-idle .ball-2,
    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background: #ef4444;
      box-shadow: 0 0 18px rgba(239,68,68,.9);
    }

    #frameRoot.is-listening .ball-1,
    #frameRoot.is-translating .ball-1{
      background: #6366f1;
      box-shadow: 0 0 18px rgba(99,102,241,.95);
    }
    #frameRoot.is-listening .ball-2,
    #frameRoot.is-translating .ball-2{
      background: #ec4899;
      box-shadow: 0 0 18px rgba(236,72,153,.95);
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background: #22c55e;
      box-shadow: 0 0 18px rgba(34,197,94,.9);
    }

    @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes eqAnim { 0%, 100% { height: 5px; opacity:.6 } 50% { height: 25px; opacity:1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 0 28px rgba(99,102,241,0.35); } }
    @keyframes micPulse{
      0%   { transform: scale(.92); opacity: .95; }
      70%  { transform: scale(1.14); opacity: .15; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    #frameRoot.to-top .orb-container{ transform: rotate(180deg); }
    #frameRoot.to-bot .orb-container{ transform: rotate(0deg); }
  </style>
</head>

<body id="frameRoot" class="to-bot">
  <div class="container">

    <div class="half-screen top" id="topSection">
      <button class="lang-trigger" id="topLangBtn"><span id="topLangTxt">🇬🇧 ENGLISH</span> ⌵</button>

      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi">
        <div class="pop-head">
          <div>ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="topMic" aria-label="Üst mikrofon">
          <svg width="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </div>
        <div class="helper-text" id="topHelper"></div>
      </div>
    </div>

    <div class="center-hub">
      <div class="nav-btn btn-home" id="homeLink">ANA SAYFA</div>

      <div class="orb-container" id="homeBtn" title="Ana sayfa">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:0.2s"></div>
            <div class="eq-bar" style="animation-delay:0.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
      <div id="statusPill" class="status-pill">Hazır</div>
    </div>

    <div class="half-screen bottom" id="botSection">
      <button class="lang-trigger" id="botLangBtn"><span id="botLangTxt">🇹🇷 TÜRKÇE</span> ⌵</button>

      <div class="popover" id="pop-bot" role="dialog" aria-label="Alt dil seçimi">
        <div class="pop-head">
          <div>ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" aria-label="Alt mikrofon">
          <svg width="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </div>
        <div class="helper-text" id="botHelper"></div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/facetoface_page.js?v=FINAL_ROTATED_LOCALIZED_HELPERS"></script>
</body>
</html>
