<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>

<title>italkyAI • Face to Face</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

:root{
--ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
--bg:#050508;
--border:rgba(255,255,255,0.15);
--safe-top:env(safe-area-inset-top);
--safe-bottom:env(safe-area-inset-bottom);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
height:100%;
background:var(--bg);
font-family:Outfit;
color:#fff;
overflow:hidden;
}

/* container */

.container{
display:flex;
flex-direction:column;
height:100dvh;
width:100%;
}

/* halves */

.half-screen{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
overflow:hidden;
}

/* TOP SIDE */

.half-screen.top{
transform:rotate(180deg);
background:linear-gradient(180deg,rgba(128,19,54,0.18),var(--bg));
}

/* BOTTOM SIDE */

.half-screen.bottom{
background:linear-gradient(180deg,rgba(30,58,138,0.18),var(--bg));
}

/* mic wrap */

.mic-wrap{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
width:100%;
}

/* helper text */

.helper-text{
font-size:12px;
font-weight:900;
letter-spacing:.3px;
text-align:center;
max-width:260px;
line-height:1.3;
}

/* rotate top text */

#topHelper{
transform:rotate(180deg);
}

/* helper colors */

.helper-ready{
color:#22c55e;
}

.helper-wait{
color:#ef4444;
}

.helper-repeat{
background:var(--ai-gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* mic button */

.btn-mic{
width:78px;
height:78px;
border-radius:50%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
border:3px solid transparent;
background-image:linear-gradient(#000,#000),var(--ai-gradient);
background-origin:border-box;
background-clip:content-box,border-box;
cursor:pointer;
transition:.18s;
}

.btn-mic svg{
width:28px;
}

.btn-mic.listening{
animation:breathe 1.4s infinite ease-in-out;
}

@keyframes breathe{
0%,100%{transform:scale(1)}
50%{transform:scale(1.08)}
}

/* chat */

.chat-body{
flex:1;
width:100%;
overflow-y:auto;
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
padding:18px 0;
}

.bubble{
text-align:center;
max-width:80%;
line-height:1.25;
}

.bubble.them{
opacity:.55;
font-size:18px;
}

.bubble.me{
font-size:26px;
font-weight:900;
}

/* center hub */

.center-hub{
height:100px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:rgba(0,0,0,.55);
backdrop-filter:blur(16px);
}

.nav-btn{
position:absolute;
padding:10px 18px;
border-radius:100px;
background:rgba(255,255,255,0.06);
border:1px solid var(--border);
font-size:10px;
font-weight:900;
cursor:pointer;
}

.btn-home{left:14px}
.btn-clear{right:14px}

.orb-container{
width:100px;
height:100px;
display:flex;
align-items:center;
justify-content:center;
}

.ai-core{
width:80px;
height:80px;
border-radius:50%;
background:#000;
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-family:Space Grotesk;
font-weight:700;
}

.logo-ai{
background:var(--ai-gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

</style>
</head>

<body id="frameRoot">

<div class="container">

<!-- TOP -->

<div class="half-screen top" id="topSection">

<div class="chat-body" id="topBody"></div>

<div class="mic-wrap">

<div class="btn-mic" id="topMic">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
<path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
<path d="M12 19v3"/>
</svg>
</div>

<div class="helper-text" id="topHelper"></div>

</div>

</div>

<!-- CENTER -->

<div class="center-hub">

<div class="nav-btn btn-home" id="homeLink">ANA SAYFA</div>

<div class="orb-container">

<div class="ai-core">
italky<span class="logo-ai">AI</span>
</div>

</div>

<div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>

</div>

<!-- BOTTOM -->

<div class="half-screen bottom" id="botSection">

<div class="chat-body" id="botBody"></div>

<div class="mic-wrap">

<div class="btn-mic" id="botMic">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
<path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
<path d="M12 19v3"/>
</svg>
</div>

<div class="helper-text" id="botHelper"></div>

</div>

</div>

</div>

<script type="module" src="/js/facetoface_page.js?v=FULL_ROTATED_HELPER"></script>

</body>
</html>
