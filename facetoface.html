<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#06111d" />
  <title>italkyAI • Face to Face</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#06111d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    body{display:grid;place-items:center}
    .boot{display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(255,255,255,.78);font-weight:800}
    .dot{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#35d5d0;animation:s .7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div class="dot"></div><div>FaceToFace açılıyor…</div></div>
  <script>
    (async function(){
      var source='https://raw.githubusercontent.com/oguzozyigit-bot/italky-web/ef68b70350f8f7e04e50b0f311a68e7bc6f61b2e/facetoface.html';
      try{
        var r=await fetch(source,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        var html=await r.text();
        html=html.replace('href="/pages/home.html?hub=1"><span id="homeText" class="label-rotate">HOME</span>', 'href="https://italky.ai/hosgeldiniz"><span id="homeText" class="label-rotate">SHORT</span>');
        html=html.replace('</head>', '<style>#f2fMenuBtn,#f2fDrawer,#drawerBg{display:none!important}</style></head>');
        html=html.replace('</body>', '<script>(function(){function p(){var h=document.getElementById("homeLink"),t=document.getElementById("homeText"),m=document.getElementById("f2fMenuBtn"),d=document.getElementById("f2fDrawer"),b=document.getElementById("drawerBg");if(h){h.href="https://italky.ai/hosgeldiniz";h.title="Shorts"}if(t)t.textContent="SHORT";[m,d,b].forEach(function(x){if(x)x.style.setProperty("display","none","important")})}p();new MutationObserver(p).observe(document.documentElement,{subtree:true,childList:true})})();<\/script></body>');
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div style="padding:24px;text-align:center;color:#fff;font-family:Arial"><b>FaceToFace yüklenemedi.</b><br><small>Lütfen sayfayı yenileyin.</small></div>';
      }
    })();
  </script>
</body>
</html>
