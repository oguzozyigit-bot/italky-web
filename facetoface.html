<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>italkyAI • Face to Face</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ai-gradient: linear-gradient(135deg,#a5b4fc,#6366f1,#ec4899);
      --bg:#050508;
      --border:rgba(255,255,255,0.15);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:#fff;
      font-family:Outfit,sans-serif;
      overflow:hidden;
    }

    body{
      min-height:100dvh;
    }

    .container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100dvh;
      position:relative;
    }

    .half-screen{
      flex:1;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
      overflow:hidden;
    }

    .half-screen.top{
      transform:rotate(180deg);
      background:linear-gradient(180deg, rgba(128,19,54,0.18), var(--bg));
    }

    .half-screen.bottom{
      background:linear-gradient(180deg, rgba(30,58,138,0.18), var(--bg));
    }

    .lang-trigger{
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      padding:10px 18px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      z-index:50;
      backdrop-filter:blur(12px);
      pointer-events:auto;
      min-height:44px;
      max-width:92%;
    }

    .popover{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,360px);
      height:360px;
      background:#0a0a0f;
      border:1px solid var(--border);
      border-radius:24px;
      display:none;
      flex-direction:column;
      z-index:5000;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.92);
      pointer-events:auto;
    }

    .popover.show{ display:flex; }
    .half-screen.top .popover{ top:64px; }
    .half-screen.bottom .popover{ bottom:64px; }

    .pop-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      letter-spacing:.3px;
    }

    .pop-close{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      user-select:none;
    }

    .pop-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
      scrollbar-width:none;
      pointer-events:auto;
    }

    .pop-list::-webkit-scrollbar{ display:none; }

    .pop-item{
      padding:12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border:1px solid transparent;
      user-select:none;
      pointer-events:auto;
    }

    .pop-item:hover{ background:rgba(255,255,255,.06); }

    .pop-item.active{
      background:rgba(99,102,241,.14);
      border-color:rgba(99,102,241,.25);
    }

    .pop-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pop-flag{ font-size:18px; }

    .pop-name{
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .pop-code{
      font-weight:900;
      font-size:12px;
      opacity:.7;
    }

    .chat-body{
      flex:1;
      width:100%;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px 0;
      mask-image:linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      scrollbar-width:none;
    }

    .chat-body::-webkit-scrollbar{ display:none; }

    .bubble{
      text-align:center;
      max-width:84%;
      line-height:1.25;
      word-break:break-word;
    }

    .bubble.them{
      opacity:.55;
      font-size:18px;
      font-weight:500;
    }

    .bubble.me{
      font-size:18px;
      font-weight:650;
      opacity:.82;
    }

    .bubble.me.is-latest{
      font-size:30px;
      font-weight:900;
      opacity:1;
      line-height:1.08;
    }

    .bubble-row{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .bubble-row .txt{
      display:inline-block;
    }

    .spk-icon{
      width:28px;
      height:28px;
      min-width:28px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }

    .spk-icon svg{
      width:14px;
      height:14px;
      fill:none;
      stroke:#fff;
      stroke-width:2.1;
      opacity:.95;
    }

    .mic-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding-bottom:10px;
      z-index:30;
    }

    .btn-mic{
      width:78px;
      height:78px;
      border-radius:50%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid transparent;
      background-image:linear-gradient(#000,#000),var(--ai-gradient);
      background-origin:border-box;
      background-clip:content-box,border-box;
      cursor:pointer;
      transition:.18s;
      position:relative;
      overflow:visible;
      flex:0 0 auto;
    }

    .btn-mic svg{
      width:28px;
      height:28px;
    }

    .btn-mic::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      border:2px solid transparent;
      opacity:0;
      transform:scale(.92);
      transition:.2s ease;
      pointer-events:none;
    }

    .btn-mic.listening{
      animation:breathe 1.15s infinite ease-in-out;
    }

    .btn-mic.listening::after{
      opacity:1;
      border-color:rgba(34,197,94,.85);
      box-shadow:0 0 0 6px rgba(34,197,94,.10), 0 0 28px rgba(34,197,94,.35);
      animation:micPulse 1.1s infinite ease-out;
    }

    .btn-mic.recorded{
      box-shadow:0 0 0 4px rgba(250,204,21,.16), 0 0 22px rgba(250,204,21,.28);
    }

    .helper-text{
      font-size:11px;
      font-weight:1000;
      text-align:center;
      line-height:1.3;
      letter-spacing:.12px;
      min-height:18px;
      user-select:none;
      max-width:270px;
      width:100%;
      display:block;
    }

    .helper-ready{
      color:#22c55e;
      text-shadow:0 0 12px rgba(34,197,94,.28);
    }

    .helper-wait{
      color:#ef4444;
      text-shadow:0 0 12px rgba(239,68,68,.28);
    }

    .helper-repeat{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
    }

    .center-hub{
      height:116px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(16px);
      z-index:600;
      flex:0 0 auto;
    }

    .nav-btn{
      position:absolute;
      padding:10px 18px;
      border-radius:100px;
      background:rgba(255,255,255,0.06);
      border:1px solid var(--border);
      color:#fff;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter:blur(15px);
      z-index:650;
    }

    .btn-home{ left:14px; }
    .btn-clear{ right:14px; }

    .orb-container{
      width:100px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .8s cubic-bezier(.34,1.56,.64,1);
      position:relative;
    }

    .energy-orbit{
      position:absolute;
      width:100px;
      height:100px;
      border-radius:50%;
      animation:rotateOrbit 5s linear infinite;
    }

    .ball-1, .ball-2{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      filter:blur(1.5px);
      transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .ball-1{
      top:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#6366f1;
      box-shadow:0 0 15px #6366f1;
    }

    .ball-2{
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      background:#ec4899;
      box-shadow:0 0 15px #ec4899;
    }

    .ai-core{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#000;
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Space Grotesk",sans-serif;
      font-weight:700;
      position:relative;
      overflow:hidden;
    }

    .logo-text{
      color:#fff;
      letter-spacing:.5px;
    }

    .logo-ai{
      background:var(--ai-gradient);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .eq-wrap{
      display:flex;
      align-items:center;
      gap:3px;
      height:20px;
      position:absolute;
      opacity:0;
      transition:.25s;
      z-index:20;
    }

    #frameRoot.is-listening .eq-wrap,
    #frameRoot.is-translating .eq-wrap{
      opacity:1;
    }

    #frameRoot.is-listening .logo-text,
    #frameRoot.is-translating .logo-text{
      opacity:0;
    }

    .eq-bar{
      width:3px;
      background:var(--ai-gradient);
      border-radius:10px;
      animation:eqAnim .7s infinite ease-in-out;
    }

    .status-pill{ display:none; }

    #frameRoot.is-idle .ball-1,
    #frameRoot.is-idle .ball-2,
    #frameRoot.is-error .ball-1,
    #frameRoot.is-error .ball-2{
      background:#ef4444;
      box-shadow:0 0 18px rgba(239,68,68,.9);
    }

    #frameRoot.is-listening .ball-1,
    #frameRoot.is-translating .ball-1{
      background:#6366f1;
      box-shadow:0 0 18px rgba(99,102,241,.95);
    }

    #frameRoot.is-listening .ball-2,
    #frameRoot.is-translating .ball-2{
      background:#ec4899;
      box-shadow:0 0 18px rgba(236,72,153,.95);
    }

    #frameRoot.is-ready .ball-1,
    #frameRoot.is-ready .ball-2{
      background:#22c55e;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    #frameRoot.to-top .orb-container{ transform:rotate(180deg); }
    #frameRoot.to-bot .orb-container{ transform:rotate(0deg); }

    @keyframes rotateOrbit{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes eqAnim{
      0%,100%{ height:5px; opacity:.6; }
      50%{ height:25px; opacity:1; }
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); box-shadow:0 0 28px rgba(99,102,241,.35); }
    }

    @keyframes micPulse{
      0%{ transform:scale(.92); opacity:.95; }
      70%{ transform:scale(1.14); opacity:.15; }
      100%{ transform:scale(1.18); opacity:0; }
    }
  </style>
</head>

<body id="frameRoot" class="to-bot">
  <div class="container">

    <div class="half-screen top" id="topSection">
      <button class="lang-trigger" id="topLangBtn" type="button">
        <span id="topLangTxt">🇬🇧 English</span> ⌵
      </button>

      <div class="popover" id="pop-top" role="dialog" aria-label="Üst dil seçimi">
        <div class="pop-head">
          <div>ÜST DİL</div>
          <div class="pop-close" id="close-top">✕</div>
        </div>
        <div class="pop-list" id="list-top"></div>
      </div>

      <div class="chat-body" id="topBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="topMic" aria-label="Üst mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </div>
        <div class="helper-text" id="topHelper"></div>
      </div>
    </div>

    <div class="center-hub">
      <div class="nav-btn btn-home" id="homeLink">ANA SAYFA</div>

      <div class="orb-container" id="homeBtn" title="Ana sayfa">
        <div class="energy-orbit">
          <div class="ball-1"></div>
          <div class="ball-2"></div>
        </div>
        <div class="ai-core">
          <div class="eq-wrap" aria-hidden="true">
            <div class="eq-bar" style="animation-delay:0s"></div>
            <div class="eq-bar" style="animation-delay:.2s"></div>
            <div class="eq-bar" style="animation-delay:.4s"></div>
          </div>
          <span class="logo-text">italky<span class="logo-ai">AI</span></span>
        </div>
      </div>

      <div class="nav-btn btn-clear" id="clearBtn">TEMİZLE</div>
      <div id="statusPill" class="status-pill">Hazır</div>
    </div>

    <div class="half-screen bottom" id="botSection">
      <button class="lang-trigger" id="botLangBtn" type="button">
        <span id="botLangTxt">🇹🇷 Türkçe</span> ⌵
      </button>

      <div class="popover" id="pop-bot" role="dialog" aria-label="Alt dil seçimi">
        <div class="pop-head">
          <div>ALT DİL</div>
          <div class="pop-close" id="close-bot">✕</div>
        </div>
        <div class="pop-list" id="list-bot"></div>
      </div>

      <div class="chat-body" id="botBody"></div>

      <div class="mic-wrap">
        <div class="btn-mic" id="botMic" aria-label="Alt mikrofon" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 11v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </div>
        <div class="helper-text" id="botHelper"></div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/facetoface_page.js?v=FACE2FACE_FINAL_LOCKED_V7"></script>
</body>
</html>
