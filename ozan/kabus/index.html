<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Nightmare</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,Helvetica,sans-serif;color:#fff}*{box-sizing:border-box}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;z-index:15;pointer-events:none;text-shadow:0 2px 4px #000}.chip{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);padding:8px 10px;border-radius:12px;font-weight:700}.menu{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,rgba(70,0,0,.42),rgba(0,0,0,.96) 60%);display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(560px,94vw);max-height:92vh;overflow:auto;background:rgba(10,10,10,.92);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.6)}h1{font-size:clamp(38px,8vw,78px);line-height:.9;margin:0 0 10px;letter-spacing:2px;text-align:center}h1 span{display:block;font-size:.35em;letter-spacing:8px;margin-top:10px;color:#bbb}.sub{text-align:center;color:#aaa;margin:0 0 20px}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:7px 0;background:#fff;color:#111;font-size:16px;font-weight:900;cursor:pointer}.btn.alt{background:#171717;color:#fff;border:1px solid #333}.btn.red{background:#8c0e0e;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin-top:18px;padding-top:14px;border-top:1px solid #292929}.section h3{margin:0 0 10px}.card{border:1px solid #282828;background:#111;border-radius:14px;padding:12px;margin:8px 0}.card strong{display:block;margin-bottom:5px}.muted{color:#999;font-size:13px}.money{font-weight:900}.joystick{position:fixed;left:22px;bottom:20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);z-index:20;touch-action:none}.stick{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.7);left:34px;top:34px}.fire{position:fixed;right:26px;bottom:28px;width:105px;height:105px;border-radius:50%;border:0;background:rgba(150,0,0,.75);color:#fff;font-size:18px;font-weight:900;z-index:20;touch-action:none}.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);z-index:100;background:rgba(0,0,0,.82);padding:10px 16px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}@media(max-width:700px){.panel{padding:18px}.row{grid-template-columns:1fr}.hud{font-size:12px;padding:6px}.chip{padding:6px 8px}.joystick{width:104px;height:104px}.stick{width:46px;height:46px;left:27px;top:27px}.fire{width:92px;height:92px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud hidden" id="hud"><div class="chip">❤️ <span id="hpText">100</span></div><div class="chip">🪙 <span id="runCoins">0</span></div><div class="chip">☠️ <span id="scoreText">0</span></div><div class="chip">DALGA <span id="waveText">1</span></div></div>
<div class="joystick hidden" id="joystick"><div class="stick" id="stick"></div></div><button class="fire hidden" id="fireBtn">ATEŞ</button>
<div class="toast" id="toast"></div>
<div class="menu" id="menu"><div class="panel"><h1>THE NIGHTMARE<span>3D SURVIVAL</span></h1><p class="sub">Karanlık çökünce hayatta kalan tek şey reflekslerin.</p><button class="btn red" id="playBtn">OYNA</button><div class="row"><button class="btn alt" id="shopBtn">KOSTÜMLER</button><button class="btn alt" id="upgradeBtn">GELİŞTİRME</button></div><div class="row"><button class="btn alt" id="rewardBtn">GÜNLÜK ÖDÜL</button><button class="btn alt" id="soundBtn">SES: AÇIK</button></div><div class="section"><div class="card"><strong>CÜZDAN</strong><div class="money">🪙 <span id="wallet">0</span></div></div><div class="card"><strong>EN YÜKSEK SKOR</strong><div id="bestScore">0</div></div></div><div class="section hidden" id="shopPanel"><h3>Kostümler</h3><div id="skins"></div></div><div class="section hidden" id="upgradePanel"><h3>Geliştirmeler</h3><div id="upgrades"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const S={coins:+localStorage.nightmareCoins||500,best:+localStorage.nightmareBest||0,skin:localStorage.nightmareSkin||'survivor',owned:JSON.parse(localStorage.nightmareOwned||'["survivor"]'),up:JSON.parse(localStorage.nightmareUp||'{"armor":0,"speed":0,"gun":0,"loot":0}'),sound:localStorage.nightmareSound!=='0'};function save(){localStorage.nightmareCoins=S.coins;localStorage.nightmareBest=S.best;localStorage.nightmareSkin=S.skin;localStorage.nightmareOwned=JSON.stringify(S.owned);localStorage.nightmareUp=JSON.stringify(S.up);localStorage.nightmareSound=S.sound?'1':'0'}
const skins=[['survivor','Hayatta Kalan',0,0x3e6b4f],['soldier','Asker',650,0x465663],['shadow','Gölge',1000,0x202027],['hunter','Avcı',1450,0x75432b],['hazmat','Hazmat',1900,0xc7a60d],['nightmare','Nightmare',2800,0x501010]];const upNames={armor:'Zırh',speed:'Hız',gun:'Silah',loot:'Ganimet'};const upDesc={armor:'+15 maksimum can',speed:'+%8 hareket hızı',gun:'+%10 ateş hızı',loot:'+%12 para kazancı'};
const $=id=>document.getElementById(id);function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1100)}function refresh(){wallet.textContent=S.coins;bestScore.textContent=S.best;soundBtn.textContent='SES: '+(S.sound?'AÇIK':'KAPALI');renderSkins();renderUp();save()}
function renderSkins(){skinsEl=$('skins');skinsEl.innerHTML='';skins.forEach(([id,name,price])=>{let d=document.createElement('div');d.className='card';let own=S.owned.includes(id),sel=S.skin===id;d.innerHTML='<strong>'+name+'</strong><div class="muted">'+(price?price+' 🪙':'Başlangıç kostümü')+'</div><button class="btn alt">'+(sel?'SEÇİLİ':own?'SEÇ':'SATIN AL')+'</button>';d.querySelector('button').onclick=()=>{if(sel)return;if(own){S.skin=id;refresh();return}if(S.coins<price){toast('Yetersiz para');return}S.coins-=price;S.owned.push(id);S.skin=id;toast('Kostüm alındı');refresh()};skinsEl.appendChild(d)})}
function renderUp(){let e=$('upgrades');e.innerHTML='';Object.keys(S.up).forEach(k=>{let lv=S.up[k],cost=250+lv*350,d=document.createElement('div');d.className='card';d.innerHTML='<strong>'+upNames[k]+' · Seviye '+lv+'/5</strong><div class="muted">'+upDesc[k]+'</div><button class="btn alt">'+(lv>=5?'MAKSİMUM':cost+' 🪙')+'</button>';d.querySelector('button').onclick=()=>{if(lv>=5)return;if(S.coins<cost){toast('Yetersiz para');return}S.coins-=cost;S.up[k]++;toast('Geliştirildi');refresh()};e.appendChild(d)})}
shopBtn.onclick=()=>{shopPanel.classList.toggle('hidden');upgradePanel.classList.add('hidden')};upgradeBtn.onclick=()=>{upgradePanel.classList.toggle('hidden');shopPanel.classList.add('hidden')};soundBtn.onclick=()=>{S.sound=!S.sound;refresh()};rewardBtn.onclick=()=>{let k='nightmareReward',today=new Date().toDateString();if(localStorage[k]===today)return toast('Bugünkü ödül alındı');localStorage[k]=today;S.coins+=250;toast('+250 para');refresh()};
let scene,camera,renderer,player,clock,enemies=[],bullets=[],drops=[],running=false,hp=100,score=0,wave=1,runMoney=0,lastShot=0,spawnTimer=0,keys={},joy={x:0,y:0};function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.78})}function box(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}function cyl(r,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat(c));m.castShadow=true;return m}
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x08090b);scene.fog=new THREE.Fog(0x08090b,18,55);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;game.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x71809a,0x160d0d,1.1));let dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(8,15,6);dl.castShadow=true;scene.add(dl);let ground=box(55,.4,55,0x1a1c1c);ground.position.y=-.2;scene.add(ground);for(let i=0;i<22;i++){let b=box(2+Math.random()*3,2+Math.random()*8,2+Math.random()*3,0x171719);b.position.set((Math.random()-.5)*50,b.geometry.parameters.height/2,(Math.random()-.5)*50);if(Math.abs(b.position.x)<10&&Math.abs(b.position.z)<10)b.position.x+=15;scene.add(b)}clock=new THREE.Clock();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function makePlayer(){let g=new THREE.Group(),skin=skins.find(x=>x[0]===S.skin),c=skin?skin[3]:0x3e6b4f;let body=box(.85,1.25,.48,c);body.position.y=1.1;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xc99373));head.position.y=2;g.add(head);let leg1=cyl(.15,.9,0x25282b),leg2=leg1.clone();leg1.position.set(-.22,.35,0);leg2.position.set(.22,.35,0);g.add(leg1,leg2);let gun=box(.16,.16,1.1,0x222222);gun.position.set(.48,1.35,-.58);g.add(gun);return g}function makeZombie(type){let g=new THREE.Group();let big=type==='mutant',fast=type==='runner';let sc=big?1.45:fast?.88:1;let body=box(.9*sc,1.25*sc,.55*sc,big?0x30472e:fast?0x506a3e:0x3e5135);body.position.y=1.05*sc;g.add(body);let h=new THREE.Mesh(new THREE.SphereGeometry(.34*sc,14,10),mat(big?0x6d8061:0x7b8c68));h.position.y=1.95*sc;g.add(h);let a1=cyl(.12*sc,1.05*sc,0x6d7c60),a2=a1.clone();a1.rotation.z=1.15;a2.rotation.z=-1.15;a1.position.set(-.65*sc,1.25*sc,-.15);a2.position.set(.65*sc,1.25*sc,-.15);g.add(a1,a2);g.userData={type,hp:big?7:fast?2:3,speed:big?1.25:fast?3.2:1.8};return g}
function spawn(){let r=22,a=Math.random()*Math.PI*2,e=makeZombie(wave>=5&&Math.random()<.12?'mutant':wave>=3&&Math.random()<.25?'runner':'zombie');e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(e);enemies.push(e)}function shoot(){let now=performance.now(),gap=320/(1+S.up.gun*.1);if(now-lastShot<gap)return;lastShot=now;let target=enemies.sort((a,b)=>a.position.distanceTo(player.position)-b.position.distanceTo(player.position))[0];if(!target)return;let dir=target.position.clone().sub(player.position).setY(.35).normalize();player.rotation.y=Math.atan2(dir.x,dir.z);let b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffd26a}));b.position.copy(player.position).add(new THREE.Vector3(0,1.3,0));b.userData={dir,life:1.4};scene.add(b);bullets.push(b)}function dropCoin(pos){let c=new THREE.Mesh(new THREE.TorusGeometry(.18,.06,8,16),new THREE.MeshStandardMaterial({color:0xf2c94c,metalness:.8,roughness:.25}));c.rotation.x=Math.PI/2;c.position.copy(pos);c.position.y=.35;c.userData={t:0};scene.add(c);drops.push(c)}
function start(){menu.classList.add('hidden');hud.classList.remove('hidden');joystick.classList.remove('hidden');fireBtn.classList.remove('hidden');if(!scene)init3D();enemies.forEach(x=>scene.remove(x));bullets.forEach(x=>scene.remove(x));drops.forEach(x=>scene.remove(x));enemies=[];bullets=[];drops=[];if(player)scene.remove(player);player=makePlayer();scene.add(player);hp=100+S.up.armor*15;score=0;wave=1;runMoney=0;spawnTimer=0;player.position.set(0,0,0);running=true;updateHUD();clock.getDelta();animate()}function updateHUD(){hpText.textContent=Math.max(0,Math.round(hp));scoreText.textContent=score;waveText.textContent=wave;runCoins.textContent=runMoney}function gameOver(){running=false;S.coins+=runMoney;S.best=Math.max(S.best,score);refresh();menu.classList.remove('hidden');hud.classList.add('hidden');joystick.classList.add('hidden');fireBtn.classList.add('hidden');toast('Oyun bitti · +'+runMoney+' para')}playBtn.onclick=start;
function animate(){if(!running)return;requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);let vx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,vz=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;let v=new THREE.Vector3(vx,0,vz);if(v.length()>1)v.normalize();player.position.addScaledVector(v,(4.5*(1+S.up.speed*.08))*dt);player.position.x=Math.max(-24,Math.min(24,player.position.x));player.position.z=Math.max(-24,Math.min(24,player.position.z));camera.position.lerp(new THREE.Vector3(player.position.x,10.5,player.position.z+11.5),.08);camera.lookAt(player.position.x,1,player.position.z);spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.22,1.15-wave*.055)}enemies.forEach((e,i)=>{let d=player.position.clone().sub(e.position);d.y=0;let dist=d.length();if(dist>.9)e.position.addScaledVector(d.normalize(),e.userData.speed*dt);e.rotation.y=Math.atan2(d.x,d.z);if(dist<1.05){hp-=18*dt;if(hp<=0)gameOver()}});bullets.slice().forEach((b,bi)=>{b.position.addScaledVector(b.userData.dir,15*dt);b.userData.life-=dt;let hit=enemies.find(e=>e.position.distanceTo(b.position)<.8);if(hit){hit.userData.hp--;scene.remove(b);bullets.splice(bullets.indexOf(b),1);if(hit.userData.hp<=0){score++;let gain=Math.round((8+Math.random()*10)*(1+S.up.loot*.12));runMoney+=gain;dropCoin(hit.position);scene.remove(hit);enemies.splice(enemies.indexOf(hit),1);if(score%12===0)wave++;updateHUD()}}else if(b.userData.life<=0){scene.remove(b);bullets.splice(bullets.indexOf(b),1)}});drops.slice().forEach(c=>{c.rotation.y+=4*dt;c.userData.t+=dt;let dist=c.position.distanceTo(player.position);if(dist<3)c.position.lerp(player.position.clone().add(new THREE.Vector3(0,.8,0)),.12);if(dist<.65){scene.remove(c);drops.splice(drops.indexOf(c),1)}});renderer.render(scene,camera)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.key]=false);fireBtn.onpointerdown=e=>{e.preventDefault();shoot()};let jp=null;joystick.onpointerdown=e=>{jp=e.pointerId;joystick.setPointerCapture(jp);moveJoy(e)};joystick.onpointermove=e=>{if(e.pointerId===jp)moveJoy(e)};joystick.onpointerup=e=>{jp=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'};function moveJoy(e){let r=joystick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(1,Math.hypot(x,y)/(r.width*.35)),a=Math.atan2(y,x);joy.x=Math.cos(a)*m;joy.y=Math.sin(a)*m;stick.style.transform='translate('+(joy.x*28)+'px,'+(joy.y*28)+'px)'}
refresh();
</script>
</body>
</html>
